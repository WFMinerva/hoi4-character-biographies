l_simp_chinese:
 OMA_said_bin_taimur_desc:0 "赛义德·本·泰穆尔出身阿布赛义德王朝，1910年8月13日生。早年就读于印度阿杰梅尔的梅奥学院，通晓英语与乌尔都语，后赴巴格达研习阿拉伯文史。1932年2月，其父泰穆尔·本·费萨尔因财政困窘退位，二十一岁的他继位为马斯喀特和阿曼第十三任苏丹，接手一个负债累累的政权。他在英国支持下整顿财政、集中权力，逐步控制内陆部族地区。第二次世界大战期间与英国密切合作，在多法尔的塞拉莱与马斯喀特之间修建皇家空军机场，保障盟军补给线，1951年为苏丹国争得英国承认的独立地位。其执政以极端保守和闭关著称，压制教育、医疗与基础设施，禁绝收音机等他视为堕落的事物，长期避居南部塞拉莱。1950年代，他在英军协助下镇压了内陆伊玛目加利卜发动、并得沙特与埃及支持的绿山起义；1965年多法尔再度爆发叛乱。1970年7月23日，其子卡布斯在英国支持下发动宫廷政变将他废黜。此后他流亡英国，1972年10月19日在伦敦去世。"
 OMA_ahmad_ibn_jafar_desc:0 "虚构架空人物。教名艾哈迈德源出阿拉伯语词根哈马德，意为最受称颂、最堪赞美，与穆罕默德同根，是先知的别名之一。在阿曼历史中，这一名字直指阿布赛义德王朝的奠基者艾哈迈德·本·赛义德：约十八世纪中叶，他驱逐波斯占领者、被推举为伊玛目，开创了延续至今的执政家族。父名贾法尔在阿拉伯语中意为小溪、细流，早期著名者有先知堂弟贾法尔·本·阿比·塔利卜与什叶派第六伊玛目贾法尔·萨迪克，是一个带虔敬传统色彩的古典名字。整个名字以常见的教名加父名结构缀合，把一个泛用的阿拉伯经典人名，作为替代领袖人物。"
 OMA_halil_ibn_halil_desc:0 "虚构架空人物。哈利勒源自阿拉伯语，本义为挚友、密友，最著名的用法是安拉的挚友，即先知易卜拉欣的尊称。在阿曼，这个名字颇有来源：约公元八世纪，生于阿曼阿兹德部族的哈利勒·本·艾哈迈德·法拉希迪迁居巴士拉，编纂出第一部阿拉伯语词典艾因书，创立诗律之学与元音符号体系，被誉为阿拉伯语言学的启明星，今日鲁斯塔克仍有以他命名的学校；更晚近的年代，内陆伊玛目穆罕默德·哈利利也以同源之名主掌阿曼腹地。此名罕见地让教名与父名完全同形，哈利勒既作己名又作父名，构成一种自我回环、以阿曼先贤之姓层叠强化的取名方式。"
 OMA_iskandar_ibn_ali_desc:0 "虚构架空人物。伊斯坎达尔是希腊名亚历山大的阿拉伯语形式，本义为护卫众人者，源出马其顿的亚历山大大帝，伊斯兰传统又常把他与古兰经中的双角人相联系。阿曼与这个名字的渊源系于海路：北端的穆桑代姆半岛古希腊人称马凯塔、波斯时称马卡，约公元前四世纪，亚历山大麾下的舰队司令尼阿卡斯自印度河返航时正是在此遥望这一海岬。父名阿里在阿拉伯语中意为崇高、尊贵，最著名者为先知堂弟兼女婿、第四任哈里发阿里·本·阿比·塔利卜；阿曼所奉的伊巴迪派，其源头可追溯到当年与哈里发阿里分裂的那场纷争。此名把希腊化的征服者之名与伊斯兰早期的崇高象征并置，缀成一个跨越希腊与阿拉伯双重渊源的组合。"
 OMA_said_ibn_timur_desc:0 "赛义德·本·泰穆尔出身阿布赛义德王朝，1910年8月13日生。早年就读于印度阿杰梅尔的梅奥学院，通晓英语与乌尔都语，后赴巴格达研习阿拉伯文史。1932年2月，其父泰穆尔·本·费萨尔因财政困窘退位，二十一岁的他继位为马斯喀特和阿曼第十三任苏丹，接手一个负债累累的政权。他在英国支持下整顿财政、集中权力，逐步控制内陆部族地区。第二次世界大战期间与英国密切合作，在多法尔的塞拉莱与马斯喀特之间修建皇家空军机场，保障盟军补给线，1951年为苏丹国争得英国承认的独立地位。其执政以极端保守和闭关著称，压制教育、医疗与基础设施，禁绝收音机等他视为堕落的事物，长期避居南部塞拉莱。1950年代，他在英军协助下镇压了内陆伊玛目加利卜发动、并得沙特与埃及支持的绿山起义；1965年多法尔再度爆发叛乱。1970年7月23日，其子卡布斯在英国支持下发动宫廷政变将他废黜。此后他流亡英国，1972年10月19日在伦敦去世。"
 OMA_rashid_al_kharusi_desc:0 "拉希德·卡鲁西，全名萨利姆·本·拉希德·卡鲁西，是二十世纪初阿曼内陆伊玛目复兴运动的领袖。1913年，在学者努尔丁·萨利米推动下，他被推举为伊玛目，随即发动反抗马斯喀特苏丹的起义，先后攻取尼兹瓦、伊兹基等内陆重镇，重建了与沿海苏丹国分庭抗礼的伊巴迪派伊玛目国，定都尼兹瓦。他反对英国对苏丹国的操控，也反对世袭王权，坚持伊玛目由公议推选的传统。1915年他曾聚集数千部族武装进逼马斯喀特，在马特拉一带被英军统领的部队击退。1920年9月，经英方斡旋，伊玛目国与苏丹泰穆尔·本·费萨尔签订西卜条约，确立了内陆自治、沿海归苏丹的格局。但此后不久就遇刺身亡。"
 CBIO_VEN_eleazar_lopez_contreras_desc:0 "埃莱亚萨尔·洛佩斯·孔特雷拉斯，1883年5月5日生于塔奇拉州克尼克阿。他早年投身军旅，长期追随强人胡安·比森特·戈麦斯，1931年起任戈麦斯政府的战争与海军部长。1935年12月戈麦斯去世后，他以战争部长身份继任，成为委内瑞拉总统。执政初期他推动了一定程度的开放，1936年颁布新宪法，容许劳工组织与部分政治活动，但1937年在反对声浪加大后重新收紧，取缔左翼团体、放逐激进人士，本人立场偏于保守。他任内推动石油立法以增加国家收益；1939年接纳了载有逃离纳粹德国犹太难民的科尼希斯坦号与卡里比亚号，同年在二战爆发之际宣布中立。他把总统之位交予自己的战争部长伊萨伊亚斯·梅迪纳·安加里塔；1945年梅迪纳被政变推翻后，他一度被捕流亡，1951年才返国。1973年1月2日在加拉加斯去世。"
 CBIO_VEN_juan_bautista_fuenmayor_desc:0 "胡安·包蒂斯塔·富恩马约尔，1905年9月28日生，委内瑞拉政治家、律师、大学教授与历史学家。他是1928年一代学运的成员，早年参加反对戈麦斯独裁的抗议。1931年他参与建立委内瑞拉共产党的第一个秘密支部，曾因此入狱并流亡哥伦比亚。戈麦斯死后回国，他着手重整委共，创建了委内瑞拉最早的石油工人工会，并于1936年12月领导石油业首次大罢工。1937年在马拉凯秘密召开的全国代表会议上，他当选委内瑞拉共产党总书记，任至1946年。1945年梅迪纳政府使委共合法化，他随后代表苏利亚州参加制宪会议。1950年他反对委共同民主行动党联手发动的石油罢工，次年被党开除，又遭佩雷斯·希门内斯军政府监禁、流亡。1958年归国后专注教学与著述，写下二十卷的当代委内瑞拉政治史，并出任圣玛丽亚大学校长。1998年5月19日去世。"
 CBIO_VEN_luis_figueroa_desc:0 "虚构架空人物。教名路易斯源自日耳曼语，由表声名与表战争的两个词根缀成，意为战场上的显赫者，经法兰克人的克洛维、法语的路易一脉流传，是西语世界极常见的名字。姓氏菲格罗亚出自加利西亚语的无花果树，本是一处长满无花果的地方之名，后成为加利西亚的一支世家之姓，随西班牙人的脚步散布于包括委内瑞拉在内的整个美洲。此名把一个寓意荣耀的教名，配上一个源自伊比利亚乡野、又在新大陆落地生根的地名姓，整体是一个道地泛用的西语姓名组合，作为领袖之名也未尝不可。"
 CBIO_VEN_patricio_franco_desc:0 "虚构架空人物。教名帕特里西奥出自拉丁语帕特里奇乌斯，意为贵族、出身高贵者，天主教传统中又与爱尔兰主保圣帕特里克相连。姓氏弗兰科源自法兰克人之名，在西语与意语中引申为自由的、直率坦诚的，是伊比利亚与拉美常见的姓氏。此名一头是寓意高贵的教名，一头是寓意自由坦荡的姓，相配听来颇为理想化，作为领袖之名基本得体。"
 CBIO_VEN_isaias_medina_angarita_desc:0 "伊萨伊亚斯·梅迪纳·安加里塔，1897年7月6日生于塔奇拉州圣克里斯托瓦尔，1914年毕业于军校，1936至1941年在洛佩斯·孔特雷拉斯麾下任战争部长，1941年继任总统。他延续并加大了前任的开放步伐：全面合法化各政治派别，包括民主行动党与委内瑞拉共产党；1945年宪法首次赋予妇女市政选举权、实行众议员直选；开征所得税，1943年石油法提高了国家的税收与矿区使用费，1945年又颁布土地改革法。二战期间委内瑞拉是世界主要产油国，梅迪纳于1945年对轴心国宣战、参与联合国的创建，并同苏联建交。他为人以宽容著称，任内几无政治犯与流亡者。1943年他组建了委内瑞拉民主党。1945年10月18日，一场军人与政党联合的政变将他推翻，他被捕并流亡美国，1948年归国。1953年9月15日在加拉加斯去世。"
 CBIO_VEN_antonio_casas_gonzalez_desc:0 "安东尼奥·卡萨斯·冈萨雷斯，1933年7月24日生于梅里达，是委内瑞拉经济学家。他在美国乔治·华盛顿大学取得经济学学士与硕士学位，早年于委内瑞拉驻华盛顿使馆任石油参赞助理。1961至1969年间他在美洲开发银行任经济学家，熟悉拉美各国的发展战略。拉斐尔·卡尔德拉执政期间，他先后出任发展部副部长与总统府协调计划办公室主任，参与制订国家发展计划，力图以鼓励非石油出口、开发圭亚那地区矿产与水力资源来减少委内瑞拉对石油收入的依赖。1979年起他出任委内瑞拉石油公司董事。1994年4月，他被任命为委内瑞拉中央银行行长，在新央行法赋予该行财政自主权、并逢银行业危机之际主持货币政策，与财政部门协调应对。他还曾任二十四国集团主席。2021年3月去世。"
 CBIO_VEN_carlos_delgado_chalbaud_desc:0 "卡洛斯·德尔加多·查尔鲍德，1909年1月20日生于加拉加斯，出身军人世家，其父罗曼是反对戈麦斯独裁的将领。他大半个少年时代在巴黎度过，攻读工程学，又入圣西尔军校。1929年他随父参加乘法尔克号在库马纳登陆、意图推翻戈麦斯的远征，行动失败、其父阵亡。1939年他返回委内瑞拉，经洛佩斯·孔特雷拉斯授衔为上尉。1945年他参与推翻梅迪纳的政变，成为革命执政团成员，并在贝坦库尔与加列戈斯两任政府中任国防部长，借此扩充势力。1948年他又参与推翻加列戈斯，出任三人军事执政团的主席，同僚有马科斯·佩雷斯·希门内斯与路易斯·略韦拉·帕埃斯。他被视为军中较有教养、立场温和的一员。1950年11月13日，他在加拉加斯遭拉法埃尔·西蒙·乌尔比纳一伙绑架杀害。"
 CBIO_VEN_manuel_diaz_rodriguez_desc:0 "曼努埃尔·迪亚斯，全名曼努埃尔·迪亚斯·罗德里格斯，1871年2月28日生于米兰达州查考，父母是来自加那利群岛的移民。他在委内瑞拉中央大学攻读医学，1891年获医学学位，其后游历欧洲，旅居巴黎与维也纳，渐渐弃医从文。他被视为委内瑞拉现代主义散文的最高代表之一，1896年在巴黎出版首部作品，很快因文笔精美获委内瑞拉语言学院的奖赏；归国后跻身当时重要文学刊物周围的知识分子群体，即委内瑞拉的九八年一代。他最著名的小说破碎的偶像公开批判西普里亚诺·卡斯特罗治下的社会与政治，此外还著有多部小说与随笔，文风以唯美和心理深度著称，为当时仍偏重乡土题材的委内瑞拉文坛带来新气象。他也长期在戈麦斯政府任职，历任高等教育与美术司长、外交部长、玻利瓦尔州参议员、发展部长以及驻意大利全权公使，晚年又出任新埃斯帕塔州与苏克雷州的行政长官。1927年他因咽喉重病赴纽约求医，同年8月24日因淋巴肉瘤在当地去世。"
 CBIO_VEN_romulo_gallegos_freire_desc:0 "罗慕洛·加列戈斯·弗雷勒，1884年8月2日生于加拉加斯，是委内瑞拉二十世纪最重要的小说家，也是政治家。他出身寒微，早年当教师，门下弟子中不乏日后的政坛人物。1909年他创办进步刊物晨曦。1929年发表代表作长篇小说堂娜芭芭拉：受法学教育的青年桑托斯·卢萨多回到大草原上的祖传牧场阿尔塔米拉，与凭巫术与暴力兼并邻产的女庄园主堂娜芭芭拉针锋相对；堂娜芭芭拉之女玛丽塞拉自幼被弃、野蛮粗鄙，经桑托斯教化渐通人事，二人终结连理，牧场重归秩序，象征文明战胜野蛮。小说以此寓言委内瑞拉大草原的文明化进程，蜚声拉美文坛，其后又有坎塔克拉罗、卡奈马等作。因作品触怒戈麦斯，他拒绝其授予的参议员席位，流亡西班牙，客居期间续有创作。戈麦斯死后于1936年归国，历任教育部长、国会议员与加拉加斯市长，1941年参与创建民主行动党。1947年底他在被视为委内瑞拉首次真正自由的选举中以压倒多数当选总统，1948年2月就任，任内把石油利润的国家分成提高到对半的五五分成。仅约九个月后，他即被德尔加多·查尔鲍德等人发动的军事政变推翻，流亡古巴与墨西哥，1958年方归国。1969年在加拉加斯去世。"
 YEM_imam_yahya_desc:0 "伊玛目叶海亚，全名叶海亚·穆罕默德·哈米德丁，1869年6月18日生于萨那，出身统治也门山区逾九百年的哈米德丁家族。1904年父亲去世后，他继任宰德派伊玛目；1918年奥斯曼帝国崩解之际，他自立为王，创建也门穆塔瓦基利亚王国，成为首位国王。他签订多项条约以确立也门的主权地位，包括1926年的意也条约；1934年与沙特因边界战争落败后签订塔伊夫条约，划定两国边界。他是坚定的孤立主义者，一生从未离开也门，据说甚至没见过王国海岸的红海。对内他致力于建立以本人为核心的中央政权，1919年组建常备军，任命诸子出任各省长官，并首次派遣学生出国深造。也门在他治下于1945年成为阿拉伯国家联盟创始成员，1947年加入联合国。1948年2月17日，他在萨那城外遭伏击，与孙子一同中弹身亡，史称瓦齐里政变。"
 YEM_chandler_ibn_khalid_desc:0 "虚构架空人物。此名应该是P社随机抽取的，构成颇不协调：父名哈立德是地道的阿拉伯名字，意为永恒、不朽，历史上最著名者为被誉为真主之剑的名将哈立德·本·瓦利德；然而前一节的钱德勒却是个英语姓氏，本义为制烛匠或卖烛人，与阿拉伯人名毫不相干。把一个英文职业姓缀在阿拉伯父名之前，拼合生硬、来历不明，在也门的宰德派社会里更找不到对应，显然是顾问池中未加打磨的架空取名。"
 YEM_mustafa_ibn_umar_desc:0 "虚构架空人物。教名穆斯塔法出自阿拉伯语，意为被拣选者，本是先知穆罕默德的尊称之一，在伊斯兰世界极为常见；父名奥马尔同样是流传千载的名字，意为兴盛、长寿，最著名者为第二任正统哈里发奥马尔·本·哈塔卜。此名由两个通行于整个阿拉伯与穆斯林世界的名字缀成，像是拿常见教名随手拼合而成的。"
 YEM_fuad_ibn_yusuf_desc:0 "虚构架空人物。教名福阿德出自阿拉伯语，意为心、心灵，是阿拉伯世界常见的名字，近代如埃及国王福阿德一世即以此为名。父名优素福即先知优素福，也就是约瑟，古兰经中有以其为名的一章；这个名字在也门历史上并不陌生——十二世纪征服并统治也门的阿尤布王朝奠基者萨拉丁，本名正是优素福·本·阿尤布。此名以一个寓意心灵的教名，配上一个与也门旧朝有渊源的父名，是个尚可接受的领袖名字。"
 YEM_ahmad_bin_yaha_desc:0 "艾哈迈德·本·叶海亚·哈米德丁，1891年6月18日生，是伊玛目叶海亚的长子、也门王国倒数第二位国王，1948至1962年在位。他相貌凶悍、双目突出，自幼能诗，却以暴烈的脾气著称，反对者讥称他为魔鬼艾哈迈德。1948年父亲遇刺、瓦齐里一派另立伊玛目后，他在哈杰聚集忠于王室的部族反攻，平定政变、继位为伊玛目兼国王。1949年他准许犹太人移居，触发了被称为神鹰行动的大迁徙，约五万也门犹太人由此前往以色列。他一心要把英国人逐出南也门、收复亚丁，实现大也门的构想；1958年一度与阿拉伯联合共和国结成松散的阿拉伯联合国家，至1961年解体。他晚年屡遭行刺，1961年一次未遂袭击使他重伤。1962年9月19日，他在睡梦中去世，其子巴德尔继位。"
 YEM_ahmad_al_hamid_desc:0 "艾哈迈德·本·叶海亚·哈米德丁，1891年6月18日生，是伊玛目叶海亚的长子、也门王国倒数第二位国王，1948至1962年在位。他相貌凶悍、双目突出，自幼能诗，却以暴烈的脾气著称，反对者讥称他为魔鬼艾哈迈德。1948年父亲遇刺、瓦齐里一派另立伊玛目后，他在哈杰聚集忠于王室的部族反攻，平定政变、继位为伊玛目兼国王。1949年他准许犹太人移居，触发了被称为神鹰行动的大迁徙，约五万也门犹太人由此前往以色列。他一心要把英国人逐出南也门、收复亚丁，实现大也门的构想；1958年一度与阿拉伯联合共和国结成松散的阿拉伯联合国家，至1961年解体。他晚年屡遭行刺，1961年一次未遂袭击使他重伤。1962年9月19日，他在睡梦中去世，其子巴德尔继位。"
 YEM_mansur_al_badr_desc:0 "曼苏尔·巴德尔，全名穆罕默德·巴德尔，1926年2月15日生于哈杰，是国王艾哈迈德的长子、也门王国末代国王与宰德派伊玛目，尊号曼苏尔。他曾任荷台达副长官与外交大臣，年轻时倾慕埃及总统纳赛尔的阿拉伯民族主义。1955年他在平定一场针对其父的叛乱中出力甚多，其后被立为王储；1958年参与缔结阿拉伯联合国家之约，1959年一度在父亲赴意就医期间代理国政。1962年9月19日父亲去世，他继位为伊玛目兼国王，然而仅一周后，禁卫军司令萨拉勒发动共和政变、炮击其宫邸，宣布成立阿拉伯也门共和国。巴德尔于炮火中脱身北逃，在山区召集宰德派部族，得沙特与约旦支援，同埃及支持的共和派展开长达数年的北也门内战。1970年沙特承认共和国后，保王事业大势已去，他流亡英国，隐居肯特郡。1996年8月6日在伦敦去世。"
 YEM_cecil_barrington_hurst_desc:0 "全名塞西尔·詹姆斯·巴林顿·赫斯特爵士，1870年10月28日生于英格兰苏塞克斯的霍舍姆，出身政治世家，其父与祖父均曾任霍舍姆选区的下议院议员。他在威斯敏斯特公学就读，后入剑桥三一学院攻读法学，1892年取得法学学士。1902年他进入英国外交部任助理法律顾问，1918年升任首席法律顾问，长期为英国政府处理国际法事务，曾作为英方代表出席1907年海牙和平会议与其后的伦敦海军会议，参与海事法的拟订。二十世纪二十年代，他多次代表英国出庭于设在海牙的常设国际法院;1929年他本人出任该院法官，1934至1936年更当选院长，此后任副院长至1945年卸任。任内他参与审理了1933年丹麦诉挪威的东格陵兰法律地位案，该案确立的有效占领原则至今仍是国际法上关于领土主权争端的经典判例。他还长期主编不列颠国际法年鉴，晚年结集出版赫斯特爵士国际法文集。赫斯特一生获封多项爵位与勋衔。1963年3月27日，他在故乡霍舍姆去世。"
 CBIO_GUA_jorge_ubico_desc:0 "豪尔赫·乌维科，全名豪尔赫·乌维科·卡斯塔涅达，1878年11月10日生于危地马拉城，出身自由党的显要之家，曾任阿尔塔维拉帕斯与雷塔卢莱乌两省长官、奥雷利亚纳政府的战争部长。1931年大萧条肆虐、国库几近枯竭之际，他以唯一候选人的身份当选总统，此后借修宪一再延任，直至1944年，实行了长达十三年的独裁统治。他自比拿破仑，人称热带小拿破仑；一面以严刑峻法肃贪、修筑公路电报、整顿吏治而著称，一面又以书报检查、秘密警察与酷刑放逐镇压异己。他废除了债务奴役，却代之以流浪法，强令原住民每年为种植园无偿劳作若干日；对外则庇护美国联合果品公司，二战中于1941年对轴心国宣战、倒向美国。1944年6月，一名女教师在和平示威中身亡，激起全国总罢工，他于7月被迫辞职流亡。1946年6月14日，他因肺癌病逝于美国新奥尔良。"
 CBIO_GUA_justo_arbenz_desc:0 "虚构架空人物。教名胡斯托源自拉丁语，意为公正的、正直的人，是西语世界常见的名字；危地马拉近代史上最负盛名的同名者，当属十九世纪自由派改革的领袖胡斯托·鲁菲诺·巴里奥斯。姓氏阿本斯则源自瑞士的家族姓，在危地马拉极为罕见，唯一广为人知的携带者是1913年生、1951至1954年出任总统的雅各布·阿本斯·古斯曼，其父正是移居危地马拉的瑞士裔药剂师。此名把一个寓意公正的西语教名，安在一个本属阿本斯总统一族的孤例瑞士姓氏之上，多少用了点脑筋。"
 CBIO_GUA_diego_barahona_desc:0 "虚构架空人物。教名迭戈是圣地亚哥即使徒雅各的西语变体，也是西语世界最常见的名字之一。姓氏巴拉奥纳是个地名姓，源自西班牙布尔戈斯省的巴拉奥纳镇，随殖民者的脚步遍布拉丁美洲，在中美洲尤以洪都拉斯的巴拉奥纳家族最为知名。此名以一个极常见的教名，配上一个源自伊比利亚、又在中美洲扎根的地名姓，大概只是把常见西语姓名拼合罢了。"
 CBIO_GUA_jorge_torriello_garrido_desc:0 "豪尔赫·托里埃略·加里多，1908年4月23日生于危地马拉城，大商人，也是1944年十月革命三人执政团中唯一的文人成员。革命军官推翻蓬塞·巴伊德斯政权后，他与阿本斯、阿拉纳共组执政团，凭借其商界背景为这场以军人为主体的革命增添了平民色彩与合法性。执政团废除了乌维科时代的诸多法令、释放政治犯，并承诺举行自由选举；1944年12月的大选选出阿雷瓦洛为总统，执政团于1945年3月移交权力。他随后在阿雷瓦洛政府中出任财政部长。1998年6月16日，他在危地马拉城去世。"
 CBIO_GUA_carlos_diaz_de_leon_desc:0 "卡洛斯·恩里克·迪亚兹·德·莱昂，1915年4月15日生，危地马拉军官，与阿本斯自军校时代即为好友，1951年阿本斯就任总统后任命其为军队总司令。1954年美国中央情报局策动入侵前夕，曾以二十万美元贿赂他倒戈反对阿本斯，他予以拒绝。入侵开始后，他曾建议阿本斯武装平民抵抗，其后又因军队厌战而转与其他将领密谋逼宫。1954年6月27日，阿本斯向他宣布辞职，将政权交予他，并要求他承诺不与入侵者卡斯蒂略·阿马斯谈判、继续保卫革命成果；他随即宣布就任总统，扬言军队将继续抵抗。然而美国大使佩里福伊认定他不合美方心意，于两日后即6月29日以炸毁军火库相威胁，逼他辞职，由蒙松上校另组新执政团取而代之。此后他淡出政坛，2014年去世。"
 CBIO_GUA_jacopo_arbenz_guzman_desc:0 "雅各布·阿本斯·古斯曼，1913年9月14日生于克萨尔特南戈，父亲是移居危地马拉的瑞士裔药剂师，母亲则是本地人。他1935年以优异成绩从军校毕业，在乌维科军中目睹对农工的镇压与对原住民的歧视，渐生反意。1944年他成为推翻乌维科政权的十月革命的领袖之一，其后加入执政团，并在阿雷瓦洛政府中出任国防部长；1949年他挫败了阿拉纳发动的政变。1951年3月他就任总统，把土地改革作为施政核心，1952年颁布第900号法令，征收大庄园的闲置土地——包括美国联合果品公司的大片地产——分给无地农民，并使共产党合法化。这触怒了联合果品公司与美国政府，1954年美国中央情报局策动卡斯蒂略·阿马斯率军入侵，军队拒绝为他而战，他于6月27日被迫辞职，此后辗转流亡。1971年1月27日，在墨西哥城去世。"
 CBIO_GUA_r_buenaventure_pineda_desc:0 "布埃纳文图拉·皮内达，危地马拉陆军将领。1944年7月乌维科辞职后，他与比亚格兰·阿里萨、蓬塞·巴伊德斯共组军人执政团，接掌国政。这一执政团仅存数日，蓬塞便凭武力迫使国会推举自己为临时总统，执政团遂告解散；这场持续时间极短的过渡，被视为乌维科独裁统治的延续，最终在同年十月的革命中一并被扫除。"
 CBIO_GUA_miguel_garcia_granados_desc:0 "米格尔·加西亚·格拉纳多斯，全名米格尔·加西亚·格拉纳多斯·伊·萨瓦拉，1809年9月29日生于西班牙的圣玛丽亚港，幼时随家人移居中美洲，出身富裕的军人世家。青年时代他游历南美与欧洲，在伦敦完成学业，归国后投身军旅与自由派政治，曾两度侵略萨尔瓦多，兵败被俘、流放墨西哥，直到1840年方才回国。此后三十年间，他在卡雷拉长期执政下坚持自由派立场，倡言新闻自由、公共教育与财政改革，并结识了日后的盟友胡斯托·鲁菲诺·巴里奥斯。1871年，二人合兵入境，历经数役于6月30日攻入危地马拉城，推翻保守派政权，他就任临时总统，任至1873年交予巴里奥斯。任内他颁布新闻自由令、驱逐耶稣会士、创制沿用至今的危地马拉国旗，并延揽意大利指挥家维索尼创办中美洲第一所音乐学院。卸任后他退居幕后，为报刊撰文，写下回忆录与关于金融的论著。1878年9月8日，他在危地马拉城去世，享年六十九岁；其肖像今见于十元格查尔纸币。"
 CBIO_GUA_m_ydigaras_fuentes_desc:0 "全名何塞·米格尔·拉蒙·伊迪戈拉斯·富恩特斯，1895年10月17日生于雷塔卢莱乌省一处咖啡种植园，出身巴斯克裔家庭。他毕业于军事学院，1915年授衔步兵军官，其后历任驻华盛顿与巴黎使馆武官，1922年出任圣马科斯省长，1937年晋升将军。乌维科当政期间他长期任省长，1939年起改任公路总监;乌维科被推翻后，他被外放至华盛顿与伦敦充任大使，阿雷瓦洛执政的六年间他也牵涉多起未遂政变。1950年他是阿本斯的主要竞选对手，虽得地主支持，却因缺乏群众基础落败。阿本斯政府时期他流亡萨尔瓦多，协助策动了1954年推翻阿本斯的政变;卡斯蒂略·阿马斯执政后，他出任驻哥伦比亚大使。卡斯蒂略遇刺后经重新选举，他于1958年当选总统，任内推动中美洲共同市场、有限土地改革与所得税立法，但也纵容了猪湾入侵古巴流亡军在境内受训，左翼游击运动亦由此发端。1963年，他的国防部长佩拉尔塔·阿苏尔迪亚发动政变将其推翻，他流亡尼加拉瓜后，口述记者马里奥·罗森塔尔整理出版自传体政论我与共产主义之战，由前助理国务卿阿道夫·伯尔作序，书中披露危地马拉境内训练猪湾入侵古巴流亡军的内情，为自己被迫下台辩白，并指责美国大使佩里福伊在其中的角色;此后他又转赴哥斯达黎加与萨尔瓦多，七十年代初获特赦归国。1982年10月27日，他因脑出血在危地马拉城的一所军医院去世。"
 CBIO_GUA_federico_ponce_vaides_desc:0 "费德里科·蓬塞·巴伊德斯，全名胡安·费德里科·蓬塞·巴伊德斯，1889年生于阿尔塔维拉帕斯的科万，出身富裕人家。他早年从军，1906年参加对洪都拉斯与萨尔瓦多的边境战事，此后历任多省军事长官兼政治长官。1944年7月乌维科被迫辞职，将权力交予他与另两名将领组成的军人执政团；蓬塞随即持枪逼迫国会任命自己为临时总统，延续了乌维科式的高压统治，取消新闻自由、继续任意拘押，并出资唆使成千上万原住民游行以壮声势、挑动其与拉迪诺人之间的种族矛盾。他许诺举行大选，却被普遍认为意图舞弊连任。1944年10月19日夜，军中进步派军官发动政变，经两日战斗将其推翻，这场政变即十月革命的开端。他与乌维科同获准安全离境。1956年，他在危地马拉去世。"
 CBIO_GUA_manuel_orellana_desc:0 "曼努埃尔·奥雷利亚纳，全名曼努埃尔·玛丽亚·奥雷利亚纳·孔特雷拉斯，1870年12月17日生于埃尔希卡罗，是前总统何塞·玛丽亚·奥雷利亚纳的堂兄弟。他长期任军职，1930年12月总统查孔中风辞职、其继任者帕尔马仅上任四天后，他以马塔莫罗斯堡指挥官的身份发动政变，经宫内约一小时的交火迫使帕尔马下台，随即被国会推举为临时总统。他改组内阁、着手整顿军队，但因美国在危地马拉尤其是联合果品公司的庞大利益，美国国务卿史汀生公开谴责其政权不合宪，拒绝承认。眼见得不到美方承认，他于1930年12月29日辞职。此后乌维科政府委任他为驻西班牙使馆武官，1940年6月17日，他在巴塞罗那去世。"
 CBIO_GUA_francisco_javier_arana_desc:0 "弗朗西斯科·哈维尔·阿拉纳，全名弗朗西斯科·哈维尔·阿拉纳·卡斯特罗，1905年生于比亚卡纳莱斯，出身中下层家庭，兼有西班牙与原住民血统。他是乌维科军中的一名少校，1944年十月率荣誉卫队推翻蓬塞·巴伊德斯政权，其后与阿本斯、托里埃略共组三人执政团，主持向民主政府的过渡，本人则对交权于民选总统阿雷瓦洛心存迟疑。1945年他出任军队总司令，在阿雷瓦洛政府中掌握相当大的军内人事自主权。随着他觊觎1950年的总统之位，他与阿本斯的政治对立日益加深；1949年7月他向阿雷瓦洛发出最后通牒，要求驱逐阿本斯派系，扬言若不从命即发动政变。1949年7月18日，他在前往会晤途中于格洛里亚桥遭伏击身亡，官方说法称其拒捕被击毙，但事件从未经过正式调查，其死成为危地马拉革命的转折点。"
 CBIO_GUA_juan_arevalo_bermejo_desc:0 "全名胡安·何塞·阿雷瓦洛·贝尔梅霍，1904年9月10日生于塔希斯科，哲学教授出身的政治家。他在阿根廷拉普拉塔大学取得博士学位，乌维科当政时长期流亡任教。1944年革命推翻乌维科后，他归国参选，同年12月以约百分之八十五的得票当选，创下危地马拉自由选举史上的最大优势，并成为该国首位民选总统，1945年3月就任。他把自己的理念称为精神社会主义，主张的是心灵与道德的解放而非财产的再分配，反对马克思主义、也压制共产党的合法登记。任内他主持制定1945年宪法，颁布劳工法典、承认罢工权，设立最低工资与社会保障，推行扫盲与卫生事业；六年间他历经二十余次未遂政变而始终在位。1951年他坦然把权力交予选举产生的继任者阿本斯。阿本斯1954年遭美国中央情报局策动政变推翻后，他流亡墨西哥，1956年出版政论寓言鲨鱼与沙丁鱼：书中虚构海神使者说服鲨鱼与沙丁鱼签订友好条约，实则鲨鱼吞噬沙丁鱼而受法律庇护，借此讽喻美国假泛美体系与国际条约之名行帝国主义之实，援引尼加拉瓜等国被迫签订不平等条约的史实，痛陈拉美财富被吸往北方、军队沦为大企业的警察，此书在拉美广为流传，也在美国激起争议。1963年他一度筹划重返政坛竞选总统，旋因军事政变而再度流亡。1990年10月8日，他在危地马拉城去世。"
 CBIO_GUA_eduardo_villagran_ariza_desc:0 "爱德华多·比亚格兰·阿里萨，危地马拉陆军将领。1944年7月1日独裁者乌维科在举国抗议声中辞职，将权力交予他与蓬塞·巴伊德斯、布埃纳文图拉·皮内达三名将领组成的军人执政团。这个执政团被普遍视为乌维科旧部延续其统治的工具，仅数日后，同组的蓬塞便持枪逼迫国会将自己推举为临时总统，执政团随之解散。"
