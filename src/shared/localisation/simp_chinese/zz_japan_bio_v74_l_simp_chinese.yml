l_simp_chinese:
 CBIO_JAP_kazushige_ugaki_desc:0 "1868年生于冈山县，陆军大将。先后三度出任陆军大臣，1925年任内推行\"宇垣裁军\"，裁减四个师团，将节省经费转入机械化装备建设，同时扩大军事教育向学校体系的渗透。九一八事变前，其所主导的陆军体制改革为关东军独走提供了组织与装备基础。1937年受命组阁，因军部拒绝提供现役陆相人选而被迫放弃，成为军部以制度手段凌驾文官政府的典型案例。同年短暂出任外相，主导对华秘密交涉，无果而终。1956年卒，享年87岁。"
 CBIO_JAP_abe_isoo_desc:0 "1865年生于福冈，基督教社会主义者、教育家。毕业于同志社大学，后赴美、德留学，归国后长期任教，将基督教信仰与改良主义社会主义相结合。1901年与片山潜等人联合创立社会民主党，主张废除阶级制度、裁军与普选，遭明治政府即刻查禁。此后数十年坚持参与无产政党运动，历任日本农民党、社会大众党等职务，主张以议会路线推动社会改革，反对武装革命。亦以系统推广棒球运动入日本著称。1930年代军国主义高压下逐渐退出政治中心。1949年卒，享年83岁。"
 CBIO_JAP_koki_hirota_desc:0 "1878年生于福冈，职业外交官出身，历任驻苏、驻荷公使。1933年起出任外务大臣，提出\"广田三原则\"，强迫中国承认伪满洲国、接受日中\"共同防共\"、取缔抗日活动，以外交手段系统配合侵略扩张。1936年二二六事件后受命组阁，恢复\"军部大臣现役武官制\"，将内阁组成权实质上交由陆海军控制，并主导签订日德防共协定，将日本进一步绑入法西斯国际体系。战后远东国际军事法庭以共同谋议侵略战争等罪名将其列为甲级战犯，判处绞刑，1948年12月执行，是受审文官中唯一被处以极刑者。"
 CBIO_JAP_emperor_hirohito_desc:0 "逃脱审判的战犯，日本第124代天皇。幼号迪宫，1901年4月29日生于东京赤坂青山御所，1989年1月7日因十二指肠癌卒，在位六十三年，为日本史上在位时间最长的天皇。出生后仅七十天即被寄养于海军中将川村纯义家中，入学习院后先后受“肉弹将军”乃木希典与东乡平八郎督导，自小接受军国主义与帝王教育；乃木自裁殉明治一事给少年裕仁留下深重心理冲击，由此转而笃好生物学，终生从事海洋生物研究，著有《水母的书》等论著。1921年以皇太子身份赴欧考察，途经新加坡时以皇室特权勘测英军防御工事，在巴黎接见永田铁山、冈村宁次等青年武官并获其效忠宣誓；归国后因父皇病重出任摄政；1924年与良子女王成婚；1926年即位，定年号“昭和”。按史学界现有记录，裕仁绝非被动的立宪虚君：1928年亲自迫使田中义一内阁辞职；1931年默许九一八事变，翌年为征服东三省将领亲自授勋；1936年奉敕令在满洲建立七三一细菌化学战部队；同年二·二六叛乱爆发后拍案命令“尽快镇压，尽快”、直接主导平叛；全面侵华后多次亲自干预军事部署，南京陷落当日下诏褒扬将士，放纵朝香宫鸠彦王主导南京大屠杀，并批准大规模化学战；1940年推动三国同盟、批准南进国策；1941年自始深度参与偷袭珍珠港计划并亲批对美开战——东条英机后在东京审判中证称“整个日本军队没有人敢违抗天皇的意志”。战后因美国冷战战略需要免于战犯追诉，1946年元旦发布《人间宣言》放弃神格，1978年靖国神社合祀甲级战犯后拒绝参拜，此后以立宪象征身份延续昭和年号。"
 CBIO_JAP_ichiro_hatoyama_desc:0 "1883年生于东京，法学博士，出身政界世家。毕业于东京帝国大学法科，早年赴美留学。战前长期活跃于立宪政友会，历任书记长、幹事长等要职，是战前政党政治的重要参与者。战时因不满东条英机独断，遭特高警察监视与打压。1945年后参与组建自由党并出任党首，旋遭盟军以战时配合军国主义政府为由实施公职追放，1951年方获解禁。1954年出走自由党另立民主党，同年末出任首相，着力推动对苏关系改善，1956年签署《日苏共同宣言》，结束日苏战争状态，同年日本加入联合国。1959年卒。"
 CBIO_JAP_hideki_tojo_desc:0 "1884年生于东京，陆军大将，日本战时法西斯体制的核心人物。早年历任关东军宪兵队司令，在中国东北参与推行殖民统治和镇压抗日力量，以手段残酷著称，军内绰号\"剃刀\"。回国后历任陆军次官、陆军大臣，1941年10月出任首相并兼任陆相，后又兼参谋总长，集军政大权于一身。同年12月主导发动太平洋战争。主政期间，中国战场继续大规模推行\"三光政策\"，强征劳工、慰安妇制度及细菌战实验同步进行，对中国人民犯下严重罪行。1944年因塞班岛失守被迫辞职。战败后自杀未遂，被盟军逮捕。远东国际军事法庭以共同谋议侵略战争、战争罪等多项罪名判处绞刑，1948年12月执行。"
 CBIO_JAP_kuniaki_koiso_desc:0 "1880年生于栃木，陆军大将，曾涉入1931年三月事件政变密谋。1942至1944年出任朝鲜总督，强力推行皇民化政策，强制推广日语与神道信仰，并大规模动员朝鲜劳工和强征慰安妇，供日本战争机器驱使。1944年7月受命组阁，与米内光政联合执政，多次尝试经秘密渠道与中国国民政府议和，意图分化盟国战线，均告失败，施政始终受制于军部。1945年冲绳战役爆发后辞职。远东国际军事法庭以甲级战犯罪名判处无期徒刑，1950年在巢鸭监狱病逝。"
 CBIO_JAP_senjuro_hayashi_desc:0 "1876年生于石川，陆军大将，陆军大学毕业。1931年九一八事变爆发，时任朝鲜军司令的林铣十郎未经大本营授权，擅自率部越过鸭绿江进入中国东北，为非法侵占中国领土的关东军提供增援，史称\"越境将军\"。此举严重违反军令，却未受任何追究，是军部独走凌驾国家指挥体制的典型案例之一。历任陆军大臣。1937年1月出任首相，以超然于政党的姿态施政，试图借军国主义统制压制议会政党，同年6月遭众议院通过不信任决议，内阁总辞，历时仅约五个月。1943年卒。"
 CBIO_JAP_isoroku_yamamoto_desc:0 "1884年生于新潟，海军大将，联合舰队司令长官。早年两度赴美，曾入哈佛大学进修并出任驻美武官，深知美国工业动员能力，曾多次以此警示军内不宜轻启对美长期战端。归国后力主航空主兵论，力排传统战列舰派，推动海军确立以航空母舰为核心的机动作战体系。1941年主导策划偷袭珍珠港方案，同年12月7日发动突袭，重创美国太平洋舰队水面舰艇，但美国三艘航空母舰因不在港内幸免，战略效果未能充分实现。1942年6月中途岛海战，日本损失四艘主力航母及大批精锐飞行员，太平洋攻势能力自此急转直下。1943年4月赴南太平洋前线视察，座机遭美军依据破译电报实施伏击，击落于布干维尔岛上空，阵亡，时年59岁。"
 CBIO_JAP_mitsumasa_yonai_desc:0 "1880年生于岩手，海军大将。历任第三舰队司令、联合舰队司令长官，三度出任海军大臣。与山本五十六、井上成美共同反对缔结德意日三国同盟，认为此举将使日本直接卷入对英美的全面对抗，在军内属温和务实一派。1940年1月出任首相，任内持续阻止三国同盟推进，遭陆军强烈排斥，同年7月陆军拒绝提供陆相人选，内阁被迫总辞。1944年再度出任海军大臣，参与最高战争指导会议，在战局末期倾向尽早结束战争。战后未被列入战犯追究，1948年卒。"
 JAP_keisuke_okada_desc:0 "1868年生于福井，海军大将。历任联合舰队司令长官、海军大臣。1934年出任首相，任内军部势力急剧膨胀，九一八事变后的侵华局势持续扩大，冈田内阁在陆海军双重压力下主政维艰，数度回避与军部正面冲突。1936年二二六事件爆发，叛乱部队冲入首相官邸，将其秘书误当本人杀害，冈田本人藏于官邸仓库内幸免于难，政变平息后辞职。此后转入幕后，参与协调天皇终战意向。1952年卒，享年83岁。"
 CBIO_JAP_adachi_kenzo_desc:0 "1864年生于熊本，政党政治家。早年进入宪政会，后转入立宪民政党，多次当选众议院议员，历任递信大臣、内务大臣，是大正至昭和初期政党政治时代的资深人物。1931年犬养毅内阁时期，安达以内务大臣身份力主超越政党的\"举国一致\"联合内阁，拒绝与党内协调，最终导致若槻礼次郎内阁提前瓦解，被舆论批评为从内部拆解政党内阁的关键推手。五一五事件后政党政治急速衰落，安达亦随之淡出政治中心。1948年卒，享年83岁。"
 CBIO_JAP_tetsu_katayama_desc:0 "1887年生于和歌山，律师、基督教徒。早年参与友爱会劳工运动，后相继加入社会民众党、社会大众党等无产政党，长期从事议会社会主义运动，主张通过立法途径推动劳工权益保障与社会改良，反对武装革命路线。战时在高压政治环境下坚持活动，遭受当局监视。战后参与组建日本社会党，1947年总选举后社会党成为众议院第一大党，片山出任首相，组建以社会党为核心的联合内阁，是战后日本首位社会党籍首相。内阁因党内路线分歧及预算争议，维持约九个月后瓦解。1965年卒，享年77岁。"
 JAP_machida_chuuji_desc:0 "1863年生于鹿儿岛，实业家兼政治家，早年以棉花贸易起家，创办东洋棉花株式会社。后进入政界加入立宪民政党，历任农林大臣、商工大臣，以产业与贸易政策见长。1935年出任民政党总裁，是昭和前期坚持政党路线的少数党首之一。军部势力上升后，政党政治空间急剧收窄，1940年大政翼赞会成立，各党相继解散，民政党亦随之并入，町田的政治舞台至此终结。1946年卒，享年82岁。"
 CBIO_JAP_fumimaro_konoe_desc:0 "1891年生于东京，出身五摄家之一的近卫家，公爵，三度出任首相。第一次内阁（1937—1939年）期间，爆发七七事变，拒绝停战谈判，公开宣称\"不以国民政府为对手\"，将侵华战争推向全面化；1937年11月，淞沪会战结束后，日军分三路向南京进逼，企图占领南京，迫使中国政府投降；12月7日，日军华中方面军司令官松井石根亲自起草《攻占南京城要领》，要求部队入城扫荡；随后，日本朝香宫鸠彦王签署密令，要求“杀掉全部俘虏”；12月13日，日本侵略者占领南京，在日本华中派遣军司令松井石根和第六师团师团长谷寿夫指挥下，日军使用集体枪杀、活埋、刀劈、火烧等惨绝人寰的手段，杀害中国军民，并在之后的六周内，屠杀、奸淫、掠夺、焚烧和破坏并举，对南京造成空前劫难。南京审判战犯军事法庭经调查判定，日军集体屠杀有28案，屠杀人数19万余人，零散屠杀有858案，死亡人数15万余人，总计死亡人数达30多万，近卫内阁负有不可推卸的政治责任。第二、三次内阁期间主导\"新体制运动\"，解散全部政党，组建大政翼赞会，将日本政治体制向法西斯方向全面整合；同时推动缔结德意日三国同盟。1941年对美谈判破裂后辞职。战后被列为甲级战犯嫌疑人，1945年12月被捕前夕服毒自杀，时年54岁。"
 CBIO_JAP_tokugawa_iesato_desc:0 "1863年生于骏府（今静冈），德川将军家第16代家督，明治维新后封为公爵。自1903年起担任贵族院议长，连续任职长达三十年，是明治宪法体制下贵族院权威与保守政治传统的象征性代表。1919年作为日本全权代表出席巴黎和会，参与一战后国际秩序重建谈判。长期担任日本红十字社社长，活跃于国际人道主义外交场合。政治上立场保守稳健，在军部势力上升时期有所保持距离，未深度介入军政一体化进程。1940年卒，享年76岁。"
 CBIO_JAP_emperor_yasuhito_desc:0 "1902年生，裕仁天皇次弟，封秩父宫，陆军大将。毕业于陆军士官学校与英国牛津大学，具有欧洲留学背景。在陆军中与皇道派军人关系密切，据部分史料显示，二二六事件发动者中不乏其支持者，事件后未受追究。太平洋战争期间担任大本营陆军部参谋，因长期罹患肺结核，实际军务有限。战后皇族在盟军要求下放弃军籍及爵位，未被列入战犯调查。1953年卒，享年51岁。"
 CBIO_JAP_shigenori_togo_desc:0 "1882年生于鹿儿岛，出身在日朝鲜移民家庭，归化后改姓东乡。留学德国后进入外务省，历任驻德大使、驻苏大使。1941年10月出任东条英机内阁外务大臣，主持对美最后谈判阶段的外交布置，12月日本向美英宣战时以外相身份参与开战决策程序，依远东国际军事法庭认定，负有共同谋议侵略战争的责任。1945年铃木内阁时期再度任外相，力主接受《波茨坦宣言》尽早结束战争，是终战决策的内部推动者之一。战后以甲级战犯被判处有期徒刑二十年，1950年在羁押中病逝。"
 CBIO_JAP_seigo_nakano_desc:0 "1886年生于福冈，早年任职朝日新闻，后进入政界。1936年脱党创立东方会，主张以\"东洋政治\"理念取代西方议会制度，鼓吹打破财阀垄断与旧政党格局，推崇以领袖意志统合国家，与德意法西斯运动多有意识形态呼应。初期支持军部主导的国家改造，抗战全面爆发后力主对华强硬。战时与东条英机矛盾激化，多次公开批评东条独裁专权、压制政治批评，1943年10月遭特高警察以违反治安维持法拘押，获释后数日以刀自杀，时年56岁。"
 CBIO_JAP_nissho_inoue_desc:0 "1886年生于群马，日莲宗僧侣出身的极端国家主义活动家。1930年代初在茨城县大洗组织秘密团体\"血盟团\"，以\"一人一杀\"为行动原则，策划针对政界与财界要人的系统性政治暗杀。1932年2月，血盟团成员刺杀前大藏大臣井上准之助；同月团员再度出手，击毙三井财阀掌门人团琢磨。井上被捕后判处无期徒刑，1940年获假释出狱。战后继续从事右翼活动，1967年卒，享年81岁。"
 CBIO_JAP_fushimi_hiroyasu_desc:0 "1875年生，皇族，海军元帅。幼年赴德留学，归国后长期在海军系统任职，历任舰队司令、海军军令部长。1932年出任军令部总长，任职长达九年，是海军决策核心的实际掌控者。任内坚定支持\"舰队派\"立场，力主突破华盛顿及伦敦海军条约对日本舰队规模的限制，主导日本退出国际海军军备控制体系，为此后海军扩军奠定制度基础。太平洋战争爆发前，作为皇族高层对开战方针未作明确反对。1944年以健康为由卸任。战后盟军虽审查皇族战争责任，但伏见宫未被正式列入起诉，1946年卒，享年70岁。"
 CBIO_JAP_yoshio_kodama_desc:0 "1911年生于福岛，右翼活动家，战时日本在中国经营特务与走私网络的关键人物之一。1930年代起投身极端国家主义运动，多次因策划暗杀活动系狱。全面侵华战争期间以\"儿玉机关\"名义活跃于上海，为日本海军采购战略物资，从事黑市贸易与情报活动，在中国敛聚巨额财富。1945年以甲级战犯嫌疑被逮捕关押于巢鸭监狱，1948年未经起诉获释，随即凭借战时积累的人脉与财力深度渗透日本战后政界，成为自民党背后重要的政治掮客。1976年洛克希德事件曝光，其收受巨额贿赂的内幕被揭露，引发日本政坛地震。1984年卒，享年73岁。"
 CBIO_JAP_chuichi_nagumo_desc:0 "1887年生于山形，海军中将，第一航空舰队司令长官。本为水雷战出身，在海军航空战术尚未完全确立之际被指定统率机动部队。1941年12月亲率六艘主力航母偷袭珍珠港，重创美国太平洋舰队水面舰艇，但因决策迟疑，未对港内油库及维修设施实施第三波攻击，战略效果受后世广泛批评。1942年6月中途岛海战中，因情报失误与决策混乱，在短短数分钟内连失\"赤城\"\"加贺\"\"苍龙\"\"飞龙\"四艘航母，日本海军精锐航空力量遭受决定性打击。1944年7月美军登陆塞班岛，南云时任该岛守备司令，弹尽援绝后于7月6日自杀，时年57岁。"
 CBIO_JAP_shumei_okawa_desc:0 "1886年生于山形，思想家，日本战前影响最广的泛亚洲主义理论家之一。毕业于东京帝国大学印度哲学科，长期研究伊斯兰与亚洲文明，著有大量鼓吹\"亚洲解放\"\"东西文明对决\"的著述，为日本对外侵略扩张提供意识形态包装。曾参与1931年三月事件政变密谋，一度被捕，后获释。战后以甲级战犯被起诉，出席东京审判开庭时当众拍击坐于前排的东条英机头部，随即被宣布精神失常，移出法庭接受精神鉴定，成为远东国际军事法庭中唯一未经判决的被告。几年后完成《古兰经》日译本，1957年卒，享年70岁。"
 CBIO_JAP_toyama_mitsuru_desc:0 "1855年生于福冈，玄洋社创办者之一，日本近代规模最大的民间右翼团体领袖。玄洋社以国家主义、大亚洲主义为旗帜，广泛介入朝鲜、中国及东南亚事务，为日本对外扩张培植民间渗透网络。头山与孙中山、金玉均等亚洲各国反建制人物均有交往，但其所倡导的\"亚洲连带\"实质上服务于日本国家利益扩展，而非真正的民族平等。其门下培养出大量右翼活动家，经玄洋社系统延伸出黑龙会等组织，持续影响日本大陆政策走向。1944年卒，享年89岁。"
 CBIO_JAP_hotsumi_ozaki_desc:0 "1901年生于东京，毕业于东京帝国大学，后任朝日新闻记者，长期驻华报道，以对中国问题的深入分析在新闻界及政界建立声望。1930年代成为近卫文麿智囊圈成员，在政策层面具有一定影响力。与此同时，尾崎秘密加入苏联情报机关组织的\"佐尔格谍报网\"，向苏方传递日本政策走向及军事情报，其中包括1941年日本决定南进而非北攻苏联的关键判断，此情报据称对苏联得以从远东抽调兵力保卫莫斯科产生重要作用。1941年10月佐尔格谍报网被日本特高警察破获，尾崎随即被捕，以违反《治安维持法》及军机保护法被起诉。1944年11月以绞刑处决于东京，时年43岁。"
 CBIO_JAP_shigetaro_shimada_desc:0 "1883年生于东京，海军大将。历任舰队司令及海军省要职，1941年10月出任东条英机内阁海军大臣，在任期间与东条配合紧密，以至军内流传\"东条的海军大臣\"之讥。1944年兼任军令部总长，将海军军政、军令两权集于一身，进一步强化东条战时统制体制。其任内太平洋战场节节失守，菲律宾、马里亚纳群岛相继沦陷，海军主力在莱特湾海战中几近覆没。1944年8月随东条内阁总辞。战后远东国际军事法庭以甲级战犯罪名判处无期徒刑，1955年假释出狱，1976年卒，享年92岁。"
 CBIO_JAP_nobusuke_kishi_desc:0 "1896年生于山口，东京帝国大学法科毕业，进入农商务省任官僚。1936年赴任伪满洲国实业部总务司长，主导推行满洲工业统制政策，强制动员中国劳工与资源为日本战争机器服务，是日本在中国东北殖民经济体系的核心设计者之一。1941年出任东条英机内阁商工大臣，参与战时总动员体制建构，在内阁签署对美英开战相关文书。日本战败后以甲级战犯嫌疑被关押于巢鸭监狱，1948年美国转变对日政策后未经起诉获释。此后借助战时积累的政商人脉重返政界，1957年出任首相，任内强行通过修订后的《日美安全保障条约》，引发日本大规模安保斗争抗议浪潮，1960年被迫辞职。1987年卒，享年90岁。"
 CBIO_JAP_kijuro_shidehara_desc:0 "1872年生于大阪府，外交官出身，历任驻美大使、外务大臣。1920年代两度出任外相，主导以协调英美关系、尊重中国领土主权为基调的\"币原外交\"，主张以经济手段取代军事干涉推进对华利益。1931年九一八事变爆发时，币原喜重郎在掌握关东军阴谋的情况下，仍选择为关东军辩护并向国际社会歪曲事实，发挥个人影响掩盖真相。身为外相，其外交政策受军部和右翼势力责难，1931年12月11日被迫辞职，一度退出政界，\"不扩大\"方针形同虚设。1945年战败后受盟军委托出任首相，主持战后初期宪法改革准备工作。1946年4月任日本进步党总裁，同年5月任第一届吉田茂内阁国务大臣。1947年任民主党名誉总裁。1949年当选众议院议长。著有《外交五十年》。1951年卒，享年78岁。"
 CBIO_JAP_koichi_kido_desc:0 "1889年生于东京，木户孝允之孙，贵族院议员出身。历任文部大臣、厚生大臣及内大臣秘书官长，1940年出任内大臣，直至1945年战败，是天皇侧近最重要的政治职务之一。内大臣职权在于辅弼天皇，掌握宫中信息渠道，对首相人选的推举具有关键影响力。1941年木户在御前决策过程中支持对美开战方向，并参与推荐东条英机出任首相，被远东国际军事法庭认定为参与共同谋议侵略战争的重要宫廷人物。1945年8月终战过程中，木户积极协调天皇终战意志与军部强硬派之间的斡旋工作。战后以甲级战犯被判处无期徒刑，1955年假释，1977年卒，享年87岁。"
 CBIO_JAP_yosuke_matsuoka_desc:0 "1880年生于山形，早年赴美留学，毕业于俄勒冈大学法学院，后进入外务省任职。1933年以全权代表身份率团退出国际联盟，在日内瓦会场留下日本孤立于国际社会的历史性一幕。长期担任南满洲铁道株式会社总裁，深度介入日本对华殖民经济运营。1940年出任近卫第二次内阁外相，主导缔结德意日三国同盟，将日本正式纳入法西斯轴心国体系；1941年访欧途中顺访莫斯科，签署《日苏中立条约》。德苏战争爆发后，主张日本配合德国北攻苏联，与近卫意见相左，随内阁改组被迫去职。战后以甲级战犯被起诉，1946年在审判进行中病逝于羁押期间，时年65岁。"
 CBIO_JAP_osami_nagano_desc:0 "1880年生于高知，海军元帅。历任海军大臣、联合舰队司令长官，1941年出任军令部总长，是太平洋战争开战决策的核心参与者之一。1941年9月御前会议上，永野明确表示若无法通过外交手段解决问题，日本宁可主动开战也不愿坐以待毙，此言被视为推动开战方针确立的关键发言之一。任内主持历次重大海战的战略部署，太平洋战场节节失利期间持续担任军令核心职务至1944年。战后以甲级战犯被逮捕，远东国际军事法庭审判期间因病情恶化，1947年在羁押中病逝，未及判决，时年67岁。"
 CBIO_JAP_mitsuo_fuchida_desc:0 "1902年生于奈良，海军中佐，职业海军航空飞行员。1941年12月7日珍珠港突袭行动中担任第一波攻击队总指挥，率领183架舰载机对美国太平洋舰队实施奇袭，以\"虎、虎、虎\"电文向旗舰确认突袭成功，此举造成美军舰艇重大损失。1942年中途岛海战中随舰参战，侥幸生还于航母沉没之中。此后参与多次太平洋战役，战争结束时身处日本国内。战后在美国接触基督教传教活动后皈依，成为基督教传教士，并多次赴美巡回演讲，以亲历者身份讲述珍珠港事件经过。1976年卒，享年73岁。"
 CBIO_JAP_minoru_genda_desc:0 "1904年生于广岛，海军大佐，航空战术理论家。1940至1941年间在联合舰队航空参谋任上，系统设计并论证了以大规模舰载机编队对珍珠港实施奇袭的作战方案，是珍珠港攻击计划的核心策划者之一。中途岛海战及此后历次航空作战中继续担任参谋职务。战争末期主导\"神风特攻队\"编制构建的参谋工作，将大批年轻飞行员投入单程攻击任务。战后免于战犯追究，进入新组建的航空自卫队，最终晋升至幕僚长。1962年转入政界，当选参议院议员，任内力主扩充防卫力量。1989年卒，享年84岁。"
 CBIO_JAP_sanzo_nosaka_desc:0 "1892年生于山口县一个商人家庭，又名冈野进，日本共产党创建者之一。1917年毕业于庆应大学。学生时代就参加工人运动。1921年参加日本劳动总同盟并任该组织书记。1922年参加日本共产党，历任日共党纲起草委员会委员、中央监察委员、中央执行委员。1923年和1928年曾两次被捕入狱。1931年当选为日共中央委员。1931-1940年代表日共参加共产国际工作。1935年起任共产国际执行委员会主席团委员。1940年根据共产国际的决定化名冈野进到中国延安，组织反战同盟，从事对日本军队的反战和平宣传工作，直到第二次世界大战结束。1946年1月回国。1946、1947年两次当选为日共中央委员，政治局委员、书记处书记。1950年被迫转入地下斗争。1955年7月当选日共中央委员和书记处第一书记。1958年8月起任中央委员会主席。此外，积极从事议会活动，1946年当选为众议员，1956年以来多次当选为参议员。"
 CBIO_JAP_takahashi_korekiyo_desc:0 "1854年生于江户，幼年曾被送至美国作为外国家庭养子，早年经历坎坷。后进入大藏省，以金融与财政专才数度出任大藏大臣，并于1921至1922年短暂担任首相。1931年昭和恐慌期间再度出任大藏大臣，推行扩张性财政政策，通过发行国债增加政府支出、推动日元贬值以刺激出口，使日本从全球经济萧条中相对较早复苏。然而其经济政策的实际受益之一是军备扩张所需的工业动员。1935至1936年间高桥开始着手削减军费预算，引发陆军皇道派激烈反弹。1936年2月26日二二六事件爆发，叛乱部队闯入其私邸将其杀害，时年81岁。"
 CBIO_JAP_naruhiko_higashikuni_desc:0 "1887年生，皇族，裕仁天皇叔父，陆军大将。早年赴法国留学，归国后在陆军系统历任要职。全面侵华战争期间曾担任航空总军司令等职务，参与对华作战指挥体系。1945年8月15日日本宣布接受《波茨坦宣言》后，以皇族身份受命组建战后首届内阁，主持日本投降事务的初期处置与盟军接收准备。任内就战败责任问题提出\"一亿总忏悔\"论，将侵略战争责任分散至全体国民，回避了对军国主义领导层的直接追究。内阁因拒绝盟军解除《治安维持法》的指令，仅历54天即总辞。战后放弃皇籍，未受战犯追究。2004年卒，享年103岁。"
 CBIO_JAP_yasuji_okamura_desc:0 "1884年生于东京，陆军大将，侵华战争期间对中国人民犯下严重罪行的日本陆军高级将领之一。1938至1941年任第11军司令，在中国华中地区主导大规模\"扫荡\"作战，系统推行\"三光政策\"——烧光、杀光、抢光——造成中国平民大规模伤亡与财产毁灭。1944年出任中国派遣军总司令，统率在华日军百余万人，持续推进对解放区及国统区的军事压制。1945年9月代表日本在华全部武装力量于南京向中国战区受降。战后中华民国军事法庭以战犯罪名对其提起审判，1949年因蒋介石政府以其协助训练国民党军队为由宣告无罪释放，此判决在舆论中引发强烈谴责。1966年卒，享年82岁。"
 CBIO_JAP_kenji_doihara_desc:0 "1883年生于冈山，陆军大将，日本陆军在中国长期经营特务活动的核心人物，被称为\"满洲的劳伦斯\"。早年长期在中国从事情报工作，汉语流利，交际手腕娴熟。九一八事变前后主持奉天特务机关，深度介入推动溥仪出走并拥立其为伪满洲国皇帝的全程谋划。1935年操纵策动\"华北自治运动\"，图谋将华北五省从中国中央政府管辖下分裂出去，直接推动了冀东防共自治政府等伪政权的建立，为全面侵华战争的爆发创造了战略纵深。战后远东国际军事法庭以共同谋议侵略战争、违反战争法规等多项罪名将其列为甲级战犯，判处绞刑，1948年12月执行，时年65岁。"
 CBIO_JAP_hisaichi_terauchi_desc:0 "1879年生于山口，陆军元帅，首相寺内正毅之子。七七事变后参与华北方面军指挥体系，1941年出任南方军总司令，统率日本陆军对东南亚的全面攻势，麾下部队相继攻占马来亚、新加坡、菲律宾、缅甸与荷属东印度，将整个东南亚纳入日本占领体系。占领期间，南方军管辖区域内强制动员大批亚洲平民及盟军战俘从事强制劳役，泰缅铁路修建过程中造成数万人死亡，罪行有据可查。1945年日本战败时，寺内在西贡向英军投降。1946年在羁押中因脑溢血病逝，未及接受战犯审判，时年66岁。"
 CBIO_JAP_tomoyuki_yamashita_desc:0 "1885年生于高知，陆军大将。1941年12月率第25军发动马来亚战役，以约十万兵力在七十余天内击溃英澳联军，1942年2月攻陷新加坡，俘虏约十三万盟军官兵，西方媒体称其为\"马来亚之虎\"。占领期间，其麾下部队在新加坡对华人平民实施大规模\"肃清\"行动，大批平民遭屠杀。1944年10月调任第14方面军司令守卫菲律宾，1945年2月美军攻入马尼拉期间，日军部队在市内大规模屠杀菲律宾平民，死亡人数逾十万，史称\"马尼拉大屠杀\"。日本投降后山下在吕宋山区向美军投降，美军军事法庭以指挥官未能阻止部下暴行为由判处绞刑，1946年2月执行，时年60岁。"
 CBIO_JAP_yasuhiko_asaka_desc:0 "1887年生，皇族，裕仁天皇叔父，陆军大将。早年赴法国留学，归国后在陆军系统历任要职。1937年11月上海战役进入尾声，朝香宫奉命出任上海派遣军司令官，统率日军向南京推进。1937年12月13日南京陷落后，其部队对南京城内军民展开持续六周以上的大规模屠杀、强奸与抢劫，遇难者逾三十万人，史称南京大屠杀。据现存史料，朝香宫在进攻南京前曾下达\"杀掉全部俘虏\"的命令。战后美国占领当局以维护天皇制稳定为由，豁免全体皇族的战犯追究，朝香宫因此逃脱审判，从未公开承认任何责任。1981年卒，享年93岁。"
 CBIO_JAP_masaharu_homma_desc:0 "1887年生于佐渡岛，陆军中将，曾赴英国留学。1941年12月率第14军发动菲律宾战役，1942年4月击溃巴丹半岛美菲联军，迫使七万余名战俘投降。随即发生\"巴丹死亡行军\"：日军强迫极度疲惫、缺粮缺水的战俘在酷暑下徒步行走约一百公里转移至战俘营，途中以暴力驱赶、拒绝供水供粮，造成数千名美军战俘与更大数量的菲律宾战俘死亡。日本战败后，美军军事法庭以战争罪及违反战俘待遇相关国际公约判处其死刑，1946年4月在马尼拉以枪决执行，时年58岁。"
 CBIO_JAP_hajime_sugiyama_desc:0 "1880年生于福冈，陆军元帅。历任陆军大臣、参谋总长，长期身处日本战时军事决策核心。1937年七七事变后以陆相身份力主扩大对华战争，推动全面侵华政策确立。同年裕仁天皇询问对华战事预计持续多久，杉山答称\"约一个月\"，此后战事绵延八年，被视为军部对战争形势严重误判的典型。1940至1944年间两度出任参谋总长，参与对美开战及此后历次重大战役决策。1945年9月太平洋战争结束后，于日本正式签署降书的同日在自宅以手枪自杀，其妻随即服毒殉夫，时年64岁。"
 CBIO_JAP_iwane_matsui_desc:0 "1878年生于爱知，陆军大将，泛亚洲主义信奉者，长期与头山满等右翼人士往来密切。1937年8月出任上海派遣军司令官，指挥淞沪会战，11月上海战局基本结束后继续率部向南京进攻，出任华中方面军司令官。1937年12月13日南京陷落后，其麾下部队对城内中国军民展开长达数周的大规模屠杀、强奸与抢劫，遇难者逾三十万人。战后远东国际军事法庭以甲级战犯罪名判处绞刑，1948年12月执行，时年70岁。"
 CBIO_JAP_seishiro_itagaki_desc:0 "1885年生于岩手，陆军大将。1931年与石原莞尔共同策划九一八事变，伪造\"柳条湖爆炸\"事件作为借口，发动对中国东北的全面军事侵占，是日本发动侵华战争的直接策划者之一。事变成功后关东军迅速扩大占领范围，板垣在伪满洲国建立过程中扮演重要角色。1936年后历任关东军参谋长、第5师团长，继续参与侵华作战。1938至1939年出任陆军大臣，深度介入战时军政决策。此后历任中国派遣军参谋长、第7方面军司令等职。战后远东国际军事法庭以共同谋议侵略战争、违反战争法规等多项罪名判处绞刑，1948年12月执行，时年63岁。"
 CBIO_JAP_yoshijiro_umezu_desc:0 "1882年生于大分，陆军大将。1935年任华北驻屯军司令官期间，以武力威胁强迫中国国民政府代表何应钦签署《何梅协定》，迫使中国军队撤出河北，将华北大片土地置于日本军事控制之下，是日本蚕食华北政策的关键推手。1939至1944年任关东军总司令，统率驻满洲日军，主持对东北抗日力量的持续清剿。1944年出任参谋总长，参与战争末期军事决策。1945年9月2日，以日本政府全权代表身份在美军战舰密苏里号上签署投降文书，亲手画押日本无条件投降。战后以甲级战犯被判处无期徒刑，1949年在巢鸭监狱病逝，未及假释。"
 CBIO_JAP_akira_muto_desc:0 "1892年生于熊本，陆军中将。1939至1942年任陆军省军务局局长，主管陆军行政与政策，对战时总动员体制的建立与推行负有直接责任，亦参与制定和推动对华扩大作战相关政策。南京大屠杀发生时，武藤正以第16师团参谋身份随军进入南京，其在南京暴行中的知情与参与程度被东京审判详细调查。太平洋战争后期出任驻菲律宾第14方面军参谋长，1945年初马尼拉大屠杀发生期间身处指挥系统要职。战后远东国际军事法庭以南京与菲律宾两地战争罪行为主要依据，判处其绞刑，1948年12月执行，时年56岁。"
 CBIO_JAP_shunroku_hata_desc:0 "1879年生于福岛，陆军元帅，是侵华战争中职位最高的日本陆军将领之一。1938至1939年任陆军大臣，参与推动战时统制经济与军事扩张政策。1941至1944年出任中国派遣军总司令，统率百余万在华日军，全面主持对中国正面战场与敌后抗日根据地的军事作战，麾下部队在华中、华南各地实施大规模扫荡，对中国平民造成大量伤亡。1944年主导发动一号作战（豫湘桂战役），以打通大陆交通线为目标，对中国中南部地区造成严重破坏。战后远东国际军事法庭以战争罪判处无期徒刑，1954年假释出狱，1962年卒，享年82岁。"
 CBIO_JAP_jinzaburo_masaki_desc:0 "1876年生于佐贺，陆军大将，皇道派核心领袖。与荒木贞夫共同主导1930年代初陆军皇道派势力的扩张，强调以\"皇道精神\"统合军队，以直觉意志代替理性战略，排斥统制派的现代化整军路线。1934年出任教育总监，掌握陆军教育体系，但随即于1935年遭统制派以派系理由强制调离，此举直接激化两派矛盾，引发同年的相泽事件。1936年二二六事件中，发动政变的青年将校多为皇道派成员，真崎与事件的联系被军事法庭审查，但最终以无罪释放，未受处分。战后未被列入甲级战犯起诉，1956年卒，享年80岁。"
 CBIO_JAP_kanji_ishiwara_desc:0 "1889年生于山形县庄内，陆军中将。毕业于陆军大学，留学德国期间深入研究西方军事史，并将其与日莲宗末日思想相结合，形成\"最终战争论\"——认为东西方文明必将进行最终决战，日本须先征服东亚以积蓄实力迎接这场决战。1929年任关东军作战参谋，与板垣征四郎共同密谋策划九一八事变，炸毁柳条湖路段铁轨，诬称中国军队所为，以此为借口发动对中国东北的全面军事侵占，是九一八事变的核心策划者。事变成功后主导关东军迅速扩大占领范围，推动伪满洲国建立。此后反对持续扩大侵华战争，因此与主战派长期交恶。1937年七七事变爆发时以不扩大立场反对全面开战，随即被调离参谋本部。战后被列为证人而非战犯，1949年病逝，享年60岁。"
 CBIO_JAP_sadao_araki_desc:0 "1877年生于东京，陆军大将，皇道派领袖之一。形成以\"皇道\"统合国家与军队的政治信念，强调精神意志对现代战争的决定性作用，以武士道主义代替科学化军事建设，与统制派的理性整军路线根本对立。1931至1934年两度出任陆军大臣，大力提拔皇道派军官，将皇道派影响力渗入陆军各层级。1934年被迫辞去陆相，1935年再遭革除教育总监职务，皇道派在统制派压制下全面失势。二二六事件后受到调查但未被起诉。1938至1939年出任文部大臣，推行军国主义教育。战后远东国际军事法庭以甲级战犯罪名判处无期徒刑，1955年假释出狱，1966年卒，享年88岁。"
 CBIO_JAP_masanobu_tsuji_desc:0 "1902年生于石川，陆军大佐，以极端激进的作战风格与无视军纪著称。1939年诺门坎事件期间任关东军作战参谋，力主扩大对苏作战，所推动的错误决策导致日军惨败，事后竭力掩盖实情并转移责任。马来亚战役与新加坡攻略期间参与指挥，期间下令处决华人平民与英印战俘，造成大批平民与俘虏死亡。瓜达尔卡纳尔岛战役中坚持错误地面反攻方案，导致日军大量无谓消耗。战后化装潜逃，先后流亡泰国、中国、印度等地多年，躲避盟军追捕。1950年代回国后凭借战争宣传中积累的知名度当选众议院及参议院议员。1961年赴老挝采访途中失踪，下落至今不明，推定已死亡。"
 CBIO_JAP_isamu_cho_desc:0 "1895年生于福冈，陆军中将，极端军国主义活动的早期参与者。1931年三月事件密谋参与者之一。南京大屠杀发生时以参谋职务随军进入南京，所在部队在南京城内暴行中负有直接责任，相关史料显示长勇本人对屠杀行动持鼓励态度。太平洋战争末期任冲绳守备第32军参谋长，与司令官牛岛满共同指挥冲绳岛战役，以消耗战拖延美军为战略核心，战役期间冲绳平民死亡逾十万人。1945年6月23日组织抵抗终结，长勇与牛岛满相继自杀，时年49岁。"
 CBIO_JAP_soemu_toyoda_desc:0 "1885年生于大分，海军大将。历任舰队司令等要职，1944年5月出任联合舰队司令长官，时太平洋战场已急转直下。同年10月主导发动莱特湾海战，集中日本海军残余主力发动\"捷一号\"作战，此役规模为有史以来最大规模海战，日本海军遭受决定性打击，主力舰队几近覆没。战争末期任军令部总长，坚决反对接受《波茨坦宣言》，力主本土决战，至天皇做出终战决断方行停止抵制。战后以甲级战犯被起诉，1949年远东国际军事法庭判决无罪，1957年卒，享年71岁。"
 CBIO_JAP_shigeyoshi_inoue_desc:0 "1889年生于宫城，海军大将，具有法国留学背景。与米内光政、山本五十六共同坚决反对日本加入德意日三国同盟，认为此举将导致与英美全面对抗，是海军内部主和派的核心成员之一。太平洋战争初期任第四舰队司令长官，后调任海军次官及海军大学校长。任职期间坚持以英语教学，在军国主义文化高压下拒绝妥协。战后以其长期反对三国同盟的立场未被列入战犯追究，此后隐居横须贺，以私授英语自给，拒绝出版回忆录或接受任何约稿，在战后存世的日本高级将领中以沉默自守著称。1975年卒，享年85岁。"
 CBIO_JAP_chuuichi_nagumo_desc:0 "1887年生于山形，海军中将，第一航空舰队司令长官。本为水雷战出身，在海军航空战术尚未完全确立之际被任命统率机动部队。1941年12月亲率六艘主力航母偷袭珍珠港，重创美国太平洋舰队水面舰艇，但因决策迟疑，未对港内油库及维修设施实施追加打击，战略效果受后世广泛批评。1942年6月中途岛海战中，因情报失误与换弹决策失当，在数分钟内相继失去\"赤城\"\"加贺\"\"苍龙\"\"飞龙\"四艘主力航母，日本海军精锐航空力量遭受决定性打击。此后相继在瓜岛及马里亚纳方向任职，战局持续恶化。1944年7月美军攻入塞班岛，南云时任该岛守备司令，弹尽援绝后于7月6日自杀，时年57岁。"
 CBIO_JAP_mineichi_koga_desc:0 "1885年生于佐贺，海军大将。历任舰队指挥职务，以稳健务实风格见称。1943年4月山本五十六阵亡后继任联合舰队司令长官，主持\"Z作战\"计划，以日本海军残余主力准备迎击盟军于中太平洋的攻势。1944年3月31日，古贺率参谋人员乘飞行艇自帕劳转移至达沃途中，在恶劣气象中失踪坠海，是太平洋战争中日本海军阵亡的第二位联合舰队司令长官，时年58岁，史称\"海军乙事件\"。其参谋长福留繁等人所携带的\"Z计划\"完整作战文件在菲律宾被当地抵抗组织截获，转交美军，对盟军掌握日本战略意图产生重大影响。"
 CBIO_JAP_jisaburo_ozawa_desc:0 "1886年生于宫崎，海军大将。太平洋战争初期指挥南遣舰队参与马来亚海战，击沉英国战列舰\"威尔士亲王\"号及战列巡洋舰\"却敌\"号。1943至1944年任机动部队司令长官，主导日本海军以航空母舰为核心的最后机动作战尝试。1944年6月马里亚纳海战惨败，日本舰载航空兵力几近损耗殆尽。同年10月莱特湾海战中，率北方舰队以仅剩少量舰载机的航母编队担任诱饵，成功吸引美国第三舰队北上，然栗田最终转向撤退，战略意图未能实现，小泽部队亦损失惨重。1944年末接任最后一任联合舰队司令长官。战后未受战犯追究，1966年卒，享年79岁。"
 CBIO_JAP_tamon_yamaguchi_desc:0 "1892年生于岛根，海军少将，第二航空战队司令。早年留学美国普林斯顿大学，归国后历任舰队职务，以果断积极的指挥风格著称。1942年6月中途岛海战中，在南云忠一舰队遭受美军俯冲轰炸机突袭、三艘航母相继中弹起火之际，山口率\"飞龙\"号独力组织反击，指挥舰载机多次攻击并击伤击沉美军航母\"约克城\"号，是中途岛海战中日方唯一取得有效战果的航母编队。随即\"飞龙\"号遭美军俯冲轰炸机攻击，多弹命中，大火无法控制。山口拒绝撤离，选择随舰沉没，与舰长加来止男一同殉舰，时年49岁。"
 CBIO_JAP_kyuichi_tokuda_desc:0 "1894年生于冲绳，日本共产党创始人之一。1922年参与创立日共，此后数度遭当局逮捕。1932年以违反《治安维持法》被判处无期徒刑，在狱中度过整整十八年，以狱中顽抗著称。1945年10月盟军要求日本释放政治犯，德田获释出狱，随即主导重建日本共产党，出任书记长，是战后初期日本左翼运动的核心领导人。1950年朝鲜战争爆发后，盟军总司令部以威胁占领秩序为由下令解除德田公职，德田出走中国大陆，流亡期间仍遥控党内事务。1953年在北京病逝，时年58岁。"
 CBIO_JAP_harukichi_shimoi_desc:0 "1883年生于福冈，意大利文学研究者，日本近代将意大利法西斯思想引介国内的重要媒介人物。留学那不勒斯东方大学期间结识意大利诗人邓南遮，深受意大利未来主义与民族主义运动感染。回国后积极宣扬墨索里尼法西斯运动的政治理念与文化主张，将意大利未来主义美学及国家主义意识形态向日本知识界与军政圈传播，是日意法西斯意识形态跨国联结的民间推手之一。其活动在文化层面配合了日本军国主义对欧洲法西斯经验的借鉴与吸收。1954年卒，享年71岁。"
 CBIO_JAP_chikuhei_nakajima_desc:0 "1884年生于群马，海军工程师出身。1917年创办中岛飞机制作所，历经二十余年发展，成为日本最大的军用航空发动机与飞机制造企业，为日军提供一式战斗机\"隼\"、二式战斗机\"钟馗\"及大量舰载机机体与发动机，是日本侵华战争与太平洋战争中航空军备的核心工业支柱。1931年起进入政界，多次当选众议院议员，历任铁道大臣等职，以政商双栖身份深度参与战时产业动员决策。战后遭盟军以战时军需产业为由实施公职追放，中岛飞机被强制解体拆分为多家企业。1949年卒，享年65岁。"
 CBIO_JAP_takuo_godo_desc:0 "1877年生于广岛，海军造船中将出身，毕业于东京帝国大学造船学科，是日本近代舰船设计与造船工程领域的重要专家。退出现役后转入产业界，历任八幡制铁所、日本制铁等国策重工业要职，深度介入战时钢铁产业的国家管理体系。1934至1936年出任商工大臣，主导推进战时工业统制政策，积极扩大国家对军需相关重工业的直接管控，是战时日本以技术官僚身份主导产业政策的典型人物。1956年卒，享年79岁。"
 CBIO_JAP_nishizo_tsukahara_desc:0 "1887年生于岛根，海军中将，日本海军早期航空作战体系的推动者之一。在海军航空兵力扩建过程中历任航空队指挥要职，积累丰富基地航空作战经验。太平洋战争初期参与南方攻略，以基地航空兵部队支援地面作战推进。1942年起担任第11航空舰队司令官，在所罗门群岛方向主持持续消耗性航空作战，与美军反复争夺制空权，日本航空兵在此阶段遭受大量不可弥补的飞行员损耗。长期受疾病困扰，战争中期因健康原因离开前线职务。战后未受战犯追究，1966年卒，享年79岁。"
 CBIO_JAP_tateo_kato_desc:0 "1903年生于北海道，陆军中佐，陆军航空队王牌飞行员。以第64战队队长身份参与中国战场及马来亚战役，驾驶一式战斗机\"隼\"屡建战绩，被日本军方媒体塑造为英勇善战的爱国飞行员形象，大力宣传。1942年5月在缅甸海岸上空执行任务时阵亡，时年38岁，政府随即追授陆军少将衔，并以其事迹制作战时宣传电影《加藤隼战斗队》广泛公映，将其打造为鼓舞战时民心的宣传符号。"
 CBIO_JAP_shinji_sogo_desc:0 "1884年生于爱媛，铁道技术官僚与产业推动者。早年在南满洲铁道株式会社从事铁路建设与运营，积累丰富工程与管理经验，满铁体系亦是日本殖民东北经济网络的核心组成部分。战后出任日本国有铁道总裁，力排财政压力与官僚阻力，坚持推动时速200公里以上的东海道新干线规划与建设。1964年东京奥运会开幕前，新干线正式通车，成为日本战后经济重建与技术实力的标志性成就。然因建设经费严重超支，十河在通车典礼前被迫辞职，未能亲历竣工之日。1981年卒，享年96岁。"
 CBIO_JAP_toyoaki_horiuchi_desc:0 "1901年生，陆军军官，专精于特种渗透与突击作战。太平洋战争期间参与日本陆军伞降及特种作战部队的训练与指挥工作，曾投入南方作战中的要地突击行动。战争末期参与组织对盟军机场实施突击的\"義烈空挺队\"特攻作战，1945年5月以伞降突击冲绳嘉手纳机场，意图破坏盟军航空设施，行动中全员覆没。堀内本人于同年战死，是日本陆军特种作战体系中为数不多留存有具体作战记录的指挥人员之一。"
 CBIO_JAP_hiroshi_oshima_desc:0 "1886年生于岐阜，陆军中将，日本驻德国大使，日德法西斯同盟关系的核心推手。1934年赴任柏林武官，与纳粹德国高层建立密切私人关系，积极促成1936年《日德防共协定》及1940年《三国同盟条约》的缔结，是将日本外交与军事战略深度绑入轴心国体系的关键人物。大岛与希特勒、里宾特洛甫均有直接往来，并持续向东京发送详尽的德国军政情报电报。美国密码机构成功破译其外交通讯密码，从中获取德军东线部署、大西洋壁垒防御构造等大量战略情报，美国情报界称其电报为\"同盟国最有价值的情报来源之一\"。战后以甲级战犯被判处无期徒刑，1955年假释，1975年卒，享年88岁。"
 CBIO_JAP_masatoshi_okochi_desc:0 "1878年生于东京，物理化学研究所（理化学研究所，简称\"理研\"）第三代所长，任职逾二十年。任内主导理研从基础科学机构向产业应用方向转型，旗下孵化涵盖制药、光学、电机等领域的大量企业，形成\"理研产业团\"体系，是战时日本将科研能力向军需工业转化的重要组织者。仁科芳雄领导的核物理研究、堀越二郎参与的航空技术开发，均在其主导下的理研体系内得以推进。1946年盟军对战时产业机构实施清整，理研产业团被强制解体拆分。1952年卒，享年73岁。"
 CBIO_JAP_matome_ugaki_desc:0 "1890年生于冈山，海军中将。长期担任联合舰队参谋长，是山本五十六最倚重的高级参谋，深度参与珍珠港突袭、中途岛海战等历次重大作战方案的拟定工作。1943年4月山本五十六座机遭美军击落当日，宇垣同乘僚机中弹坠海，重伤后获救生还，是少数亲历山本之死的日本海军高层之一。战争末期出任第五航空舰队司令，主导冲绳方向的航空特攻作战。1945年8月15日天皇宣布终战当日，宇垣不顾停战命令，擅自率领十一架\"彗星\"俯冲轰炸机强行出击冲绳方向，机队失联，宇垣与随行飞行员推定在冲绳近海殉难，时年55岁。其战时日记《战藻录》战后整理出版，是研究日本海军决策过程的重要原始史料。"
 CBIO_JAP_genki_abe_desc:0 "1894年生，内务省警察官僚，战时日本政治镇压体系的核心执行者之一。1939至1940年出任警保局长，主管特别高等警察（特高）的全国运作。特高以系统性监视、逮捕与刑讯手段针对共产党员、社会主义者、自由主义知识分子及一切被认定持有\"危险思想\"者，大批人士在特高羁押期间遭受酷刑乃至死亡，是昭和时代政治高压体制的直接工具。1944至1945年出任内务大臣，参与战争末期内政决策。战后因主导特高镇压活动的经历遭盟军实施公职追放，1954年方获恢复资格。1989年卒。"
 CBIO_JAP_gotaro_ogawa_desc:0 "1871年生于冈山，立宪政友会政治家，多次当选众议院议员。以法律专业背景进入政界，历任司法大臣等职，是大正至昭和初期以制度框架维系文官政府运作的议会政治参与者之一。在政党内阁时期积极介入行政立法事务，推动政友会主导的内政议程。1930年代政党政治在军部压迫下急速衰退，小川亦随之淡出政治中心。资料所存有限，生涯细节留存不多。1942年卒。"
 CBIO_JAP_yamauchi_sachiko_desc:0 "战时日本宣传美术工作者，以绘制战争题材宣传海报、版画与插图著称。作品服务于日本军国主义动员体系的视觉宣传需求，广泛流通于战时官方媒体与宣传渠道。将传统日本美术技法与战时爱国主义题材相结合，在军部与国家动员机构的扶植下活跃于战时宣传领域。"
 CBIO_JAP_hitoshi_yamakawa_desc:0 "1880年生于冈山，马克思主义理论家与社会运动活动家，山川菊荣之夫。1920年代初参与日本共产党早期创建活动，后转向\"劳农派\"路线，主张放弃脱离大众的先锋党组织方式，转而在既有劳工与农民运动中推动社会变革，此路线被称为\"山川主义\"，与共产国际指导路线及日共主流形成长期分歧。1930年代政治高压下继续从事理论写作，1932年遭当局逮捕系狱。战后参与日本社会党左派理论建构，对战后左翼政治产生一定思想影响。1958年卒，享年78岁。"
 CBIO_JAP_yamakawa_kikue_desc:0 "1890年生于东京，社会主义女权主义者，山川均之妻。早年将女性解放与阶级解放相结合，参与大正时期新妇人运动，是日本早期女权思潮的重要论述者，以笔锋犀利的评论活跃于左翼与女权刊物。战时在政治高压与国家动员体制下被迫沉默，撤出公共活动。战后随民主化进程重返公共领域，1947年出任劳动省妇女少年局初代局长，从制度层面推动女性劳动权益保障立法，是战后日本女性权利制度化进程的重要参与者。1980年卒，享年89岁。"
 CBIO_JAP_koyata_iwasaki_desc:0 "1879年生于东京，三菱财阀第四代总帅，创始人岩崎弥太郎之曾孙。1916年接掌三菱合资会社，此后将三菱建设为涵盖重工业、造船、航空、金融与海外贸易的超大型财阀集团。三菱重工在战时为日本陆海军提供军舰、零式战斗机发动机、战车等大量军需物资，是日本战争机器的核心工业支柱之一。岩崎深度参与战时产业动员体系构建，与军部及政府关系极为密切。1945年4月在日本战败前数月病逝，享年65岁，未及亲历战后财阀解体。"
 CBIO_JAP_ichikawa_fusae_desc:0 "1893年生于爱知，女性参政权运动的核心领袖。1920年与平塚雷鸟共同创立新妇人协会，推动女性相关保护立法进入议会视野。1921年赴美考察女权运动，归国后于1924年组建妇选获得同盟，长期在议会外围推动女性普选权立法。战时各妇女团体被国家动员体制强制整合，市川所推动的自主女权运动空间急剧萎缩。1945年战后妇女选举权正式实现，市川随即重建女权团体，继续推动政治与社会领域的性别平等。此后多次当选参议院议员，以无党籍身份活跃于政界至晚年。1981年卒，享年87岁。"
 CBIO_JAP_kiichiro_hiranuma_desc:0 "1867年生于冈山，法学者与官僚出身。历任大审院院长、检察总长，以严苛推行《治安维持法》著称，对共产主义者及自由主义者实施系统性司法镇压。1924年创立极端国家主义团体\"国本社\"，鼓吹天皇绝对主义与彻底反共主义，会员渗透政界、军界与财界各层。历任枢密院副议长、议长，1939年1月出任首相，主导推进日德意三国军事同盟谈判，然同年8月德苏签订《互不侵犯条约》，令其战略构想彻底崩溃，辞职时称欧洲局势\"奇怪透顶\"，成为战时日本外交误判的著名注脚。战后远东国际军事法庭以甲级战犯罪名判处无期徒刑，1952年在羁押中病逝，享年85岁。"
 CBIO_JAP_hino_kumazo_desc:0 "1878年生于熊本，陆军工兵将领，日本近代军用航空的奠基人之一。1910年12月与德川好敏共同完成日本首次有人动力飞行，正式将西方航空技术引入日本。此后长期致力于推动陆军建立航空作战力量，积极倡导军用飞机战术应用理论，是日本陆军航空兵早期建设的重要推手。然而其主张在陆军传统兵种主导的决策体系中推进迟缓，本人亦屡遭军内排斥，在航空军事建设尚处起步阶段便已淡出核心决策圈。1946年卒，享年68岁。"
 CBIO_JAP_naoki_hoshino_desc:0 "1892年生于神奈川，大藏省出身的财政官僚。1932年伪满洲国成立后转赴长春，历任满洲国国务院总务厅次长、总务长官等核心职务，与岸信介等人共同主导伪满洲国的统制经济体系建构，推行重化工业五年计划，以行政手段强制集中资源服务日本战争需求，是日本在中国东北殖民经济运作的关键技术官僚之一。1941年回国后出任东条英机内阁书记官长，居内阁核心行政职位，参与战时国内总动员体制的统筹协调工作。战后远东国际军事法庭以甲级战犯罪名判处无期徒刑，1955年假释出狱，1978年卒，享年85岁。"
 CBIO_JAP_chiune_sugihara_desc:0 "1900年生于岐阜，外交官。长期服务于外务省，具备俄语等多种语言能力，曾参与满洲国相关外交事务。1939年赴任立陶宛考纳斯领事馆副领事，时值纳粹德国占领波兰，大批犹太难民涌入立陶宛寻求出路。1940年7至8月间，杉原在外务省三度明确拒绝其申请的情况下，违抗上级指令，自行以手书方式向约六千名犹太难民签发经日本过境的签证，使其得以辗转逃往第三国，史称\"生命签证\"。战后以未遵照指令行事为由遭外务省解职。1985年以色列国家纪念馆授予其\"国际义人\"称号，以表彰其在大屠杀期间救助犹太人的行为。1986年卒，享年86岁。"
 CBIO_JAP_kenjiro_matsumoto_desc:0 "北九州产业财阀安川系企业的核心经营者，安川财阀旗下企业的实际主持人。安川系企业以矿业、机械及电气设备制造为主轴，根植于北九州工业基地，战时承接大量军需生产订单，为日本战争工业体系提供机械与电气设备支撑。"
 CBIO_JAP_heisuke_yanagawa_desc:0 "1879年生于长崎，陆军中将。1937年10月出任第10军司令官，率部于杭州湾登陆，对上海中国守军实施迂回包抄，加速淞沪战役结束。随后挥师溯江西进，与上海派遣军共同推进至南京。1937年12月南京陷落后，其部下参与了长达数周的大规模屠杀、强奸与劫掠，死难者逾三十万人。此后出任近卫文麿第二次内阁司法大臣，并长期担任拓务大臣，积极倡导以国家神道推进殖民地思想同化政策。1945年1月在任内病逝，享年65岁，未及战后审判。"
 CBIO_JAP_torashiro_kawabe_desc:0 "1890年生于富山，陆军大将，日本陆军航空作战体系的高级指挥官。太平洋战争期间历任第3航空军司令等要职，主持中国及东南亚战场的陆军航空作战。战争末期出任航空总军司令官，统率日本陆军全部航空力量，主持本土防空及特攻作战的最后部署。1945年8月日本接受投降后，以大本营代表身份赴马尼拉与麦克阿瑟总部就受降程序进行先期谈判，是实际参与传达日本投降意志的高级军事代表之一。战后未被列入战犯起诉，1960年卒，享年70岁。"
 CBIO_JAP_jotaro_watanabe_desc:0 "1874年生于爱知，陆军大将，炮兵科出身。历任陆军省及参谋本部要职，以军事行政与教育事务见长。出任教育总监，执掌陆军教育总监部，是与陆军大臣、参谋总长并列的陆军三长官之一，职权涵盖全军训练与军事教育体系统筹。政治立场温和，与皇道派激进军人多有抵牾。1936年2月26日，皇道派青年将校发动政变，叛乱部队冲入渡边位于杉并区的私邸，将其当场枪杀，成为二二六事件中被杀害的最高级别军事长官，时年61岁。"
 CBIO_JAP_shun_akikusa_desc:0 "1894年生，陆军中将，日本陆军对苏情报系统的核心主持者。长期主掌哈尔滨特务机关，以满洲北部为基地系统构建针对苏联军政动向的情报搜集网络，培养俄语人才并渗透苏联远东地区，是关东军情报体系的关键支柱。掌握苏军兵力部署、战略意图及工业动员等核心情报，为关东军作战参谋提供对苏决策依据。1945年8月苏联对日宣战、苏军大规模进驻东北，关东军迅速崩溃，秋草被苏军俘虏，押送苏联关押数年。战后获释回国，1979年卒，享年85岁。"
 CBIO_JAP_wakatsuki_reijiro_desc:0 "1866年生于岛根县松江，大藏省官僚出身，宪政会、立宪民政党政治家。历任大藏大臣，以财政专业见长。1926年第一次组阁，任内处置金融危机，台湾银行挤兑风潮引发政治地震，翌年内阁总辞。1930年以首席全权代表身份出席伦敦海军会议，推动签署限制海军军备的《伦敦海军条约》，遭到海军舰队派及右翼的猛烈攻击，触发\"统帅权干犯\"政争。1931年再度组阁，同年9月九一八事变爆发，若槻内阁奉行不扩大方针，却无力管束关东军独走，国际批评与国内军部压力交困，同年12月内阁总辞。此后政党政治急速衰落，若槻亦随之退出政治核心。1949年卒，享年82岁。"
 CBIO_JAP_kanson_arahata_desc:0 "1887年生于神奈川，社会主义活动家与工人运动先驱。青年时代参与足尾铜山矿工暴动的报道与声援活动，由此走上社会运动道路。1922年参与日本共产党创立，是日共最早期成员之一。此后因路线分歧与政治判断不同而脱离日共，转向劳农派立场，主张在现实劳动运动中推动变革，而非奉行共产国际指令。多次遭当局逮捕系狱，在昭和军国主义高压下仍坚持写作与理论阐发，未曾转向。战后持续参与左翼论政，晚年撰写大量社会主义运动史回忆文章，为研究日本早期左翼运动留存了重要的亲历记录。1981年卒，享年93岁。"
 CBIO_JAP_uzo_nishiyama_desc:0 "1911年生于大阪，建筑学者与城市规划家，京都大学教授。以劳动者住宅与公共住宅问题为核心研究方向，早年即针对工人阶层居住条件展开系统调查，将建筑学与社会科学相结合，主张以住宅政策作为社会改良手段。战后参与日本公营住宅政策的学术论证工作，其关于居住空间标准化的研究对战后日本大规模公共住宅建设具有直接影响。政治立场偏于左翼进步，与战后民主化思潮相契合，是日本建筑与城市规划学界进步派的代表人物。1994年卒，享年82岁。"
 CBIO_JAP_okinori_kaya_desc:0 "1889年生于冈山，大藏省官僚出身。历任大藏省主计局长等要职，以财政统制专业见长。1937至1938年及1941至1944年两度出任大藏大臣，第二次任期贯穿太平洋战争爆发至战局急转直下的全程，主持战时财政动员，通过大规模发行国债为侵略战争提供持续财政支撑，造成严重通货膨胀与战时经济扭曲。战后远东国际军事法庭以共同谋议侵略战争罪名判处无期徒刑，1955年假释出狱。此后重返政界，1958年当选众议院议员，并出任池田内阁法务大臣，战后政治复归引发中国政府强烈批评与抗议。1977年卒，享年87岁。"
 CBIO_JAP_korechika_anami_desc:0 "1887年生于大分，陆军大将。历任第11军司令等作战指挥职务，参与对华作战。1944年12月出任小矶内阁陆军大臣，延续至铃木贯太郎内阁，是战争末期日本陆军最高政务代表。1945年8月日本最高战争指导会议围绕接受《波茨坦宣言》反复争议，阿南始终坚决主张本土决战，反对无条件投降，认为以战场胜利为前提方可谈判，是军部主战派在内阁中的核心代表。天皇8月14日最终做出终战决断后，阿南未再公开阻挠，并压制了部分下级军官发动政变的企图。8月15日天皇玉音放送播出数小时后，阿南在陆军省官舍内以军刀切腹自杀，留遗书\"一死以谢大罪\"，时年58岁。"
 CBIO_JAP_yoshisuke_aikawa_desc:0 "1880年生于山口，实业家，日产财阀创始人。1934年将旗下日本产业株式会社整体迁往伪满洲国，更名\"满洲重工业开发株式会社\"，以国策企业形式主导满洲重化工业建设，是日本将私营财阀资本嵌入殖民地经济体系的重要案例。旗下企业在伪满洲国大规模动员中国劳工，为日本战时资源开发与工业生产提供核心支撑。战后以甲级战犯嫌疑被关押于巢鸭监狱，1947年未经起诉获释。此后积极参与战后日本经济重建，推动中小企业政策，晚年致力于日美经济合作倡议。1967年卒，享年86岁。"
 CBIO_JAP_hitoshi_imamura_desc:0 "1886年生于宫城，陆军大将。1942年初率第16军发动荷属东印度攻略，短期内迫使荷兰殖民当局投降，占领爪哇全岛。占领期间相较同期其他日占区，今村对荷兰平民及战俘的处置有所节制，在日本战时将领中留下相对特殊的历史形象。然而强制劳工征用、粮食掠夺及对当地民众的镇压仍大规模发生，殖民统治本质并无不同。1942年底改任第8方面军司令，驻守拉包尔，坐困孤岛至战争结束。战后荷兰军事法庭判处有期徒刑十年，今村自请赴荷兰人战俘营与部下一同服刑，此举在日本战后舆论中广为流传。1968年卒，享年81岁。"
 CBIO_JAP_hayao_tada_desc:0 "1882年生于宫城，陆军大将。长期在中国任职，具备对华事务经验。1937至1938年出任驻华北日军最高指挥官，主持华北方面军作战。任内曾表达对扩大侵华战争持保留态度，认为战线过度延伸将拖垮日本，在军内属相对持重一派，然其具体主张未能左右战争走向，华北大规模军事扩张及对平民的镇压作战仍在其任内持续推进。1938年任参谋次长，后相继出任第12军司令等职。1948年卒，享年66岁，未及战后审判程序。"
 CBIO_JAP_rikichi_ando_desc:0 "1884年生于宫城，陆军大将。历任陆军省及驻外作战职务，1944年出任台湾军司令官，统率台湾全部陆军防卫力量，备战盟军可能对台登陆作战。1945年4月在台湾军司令官任上兼任第35任台湾总督，成为台湾历史上末代也是唯一在战时兼任军事与行政双重最高权力的总督。同年8月15日日本宣布投降，安藤代表日方将台湾军政权力移交中华民国政府。战后以战犯罪嫌被羁押于上海，1946年在羁押期间服毒自杀，时年61岁，未及正式起诉与审判。"
 CBIO_JAP_hatazo_adachi_desc:0 "1884年生于石川，陆军中将。1942年出任第18军司令，率部进驻新几内亚东北部。随盟军在太平洋战场逐步反攻，第18军被切断海上补给线，十余万官兵陷入孤立，被迫在新几内亚丛林中依靠就地取食维持生存，大批士兵死于饥饿与疾病，死亡人数远超战斗伤亡。安达拒绝突围或提前投降，坚持抵抗至1945年9月日本正式投降后方率残部缴械，此时第18军已不足原编制三成。战后澳大利亚军事法庭以战俘虐待罪判处有期徒刑，1947年在拉包尔战犯监狱以军刀自杀，时年62岁。"
 CBIO_JAP_michitaro_komatsubara_desc:0 "1886年生于富山，陆军中将，骑兵科出身。长期参与对苏情报与边境对峙事务。1939年5至9月诺门坎事件期间，以第23师团长身份在参谋辻政信主导的激进作战方案驱使下，率部对苏蒙联军发起反复冲击，遭苏军以坦克集群与大规模炮兵实施歼灭性反击，第23师团损失惨重，伤亡率一度超过六成，是日本陆军在苏联装甲与机械化兵力面前遭受的最惨烈失败之一。事件暴露出日本陆军严重低估苏军现代战争能力的战略盲点。小松原因战败压力健康急剧恶化，1940年病逝，享年54岁。"
 CBIO_JAP_otozo_yamada_desc:0 "1881年生于长野，陆军大将。历任第1军司令、北支那方面军司令官等要职，参与华北侵华作战体系。1944年出任关东军总司令兼任驻满洲日本大使，统率关东军七十余万兵力，是日本在中国东北殖民统治与军事占领的最终负责者。1945年8月8日苏联对日宣战，苏军以百余万兵力三路突入满洲，关东军在苏军钢铁洪流面前迅速崩溃，山田于8月19日率关东军向苏军投降。战后被押送苏联，1949年出席伯力审判，以对华发动侵略战争及准备细菌战等罪名被苏联军事法庭判处二十五年有期徒刑，1956年提前释放回国，1965年卒，享年83岁。"
 CBIO_JAP_shigeru_honjo_desc:0 "1876年生于兵库，陆军大将。1931年出任关东军司令官，九一八事变爆发后全力支持并扩大石原莞尔、板垣征四郎的侵占行动，将关东军军事作战与政治谋略整合为一体，是伪满洲国建立过程中日本军事最高负责人。1933年卸任后出任天皇侍从武官长，长期居于天皇近侧，在宫廷与军部之间具有特殊信息渠道。二二六事件期间，其女婿本间雅晴时任要职，本庄本人亦在事件处置过程中居中牵连，承受双重压力。战后盟军着手列定甲级战犯名单，本庄深知难逃追究，1945年11月20日于东京自宅以军刀自杀，时年69岁，是日本投降后以此方式回避战犯审判的高级将领之一。"
 CBIO_JAP_kingoro_hashimoto_desc:0 "1890年生于兵库，陆军大佐，极端国家主义军人运动的核心组织者。1930年在军内秘密创立\"樱会\"，以中下层陆军军官为主体，策划以军事政变推翻政党政治、建立军事独裁政权。1931年先后参与组织三月事件与十月事件两次政变密谋，均因事机泄露或内部动摇而流产，但策划者均未受严厉追究，形成恶劣示范。1937年12月南京战役期间，桥本所部重炮兵在扬子江江面炮击并击沉美国炮舰\"班乃\"号，击伤英国炮舰，史称\"班乃号事件\"，引发严重国际外交危机，日本事后以道歉与赔偿勉强平息。战后以乙级战犯被判处无期徒刑，1954年假释出狱，1957年卒，享年67岁。"
 CBIO_JAP_nashimoto_morimasa_desc:0 "1874年生，皇族，陆军元帅，日本最高军衔中获授元帅称号的皇族成员之一。毕业于陆军士官学校与陆军大学，历任师团长、朝鲜军司令官等要职，参与日俄战争及第一次世界大战中的对德作战。长期担任日本红十字社总裁，以皇族身份出席国际人道主义外交场合。战争期间未承担作战指挥职务，主要居于象征性高级职位。1945年日本战败后，梨本宫作为最高军衔在世成员遭盟军逮捕，成为战后被羁押的级别最高的日本人，然而盟军在皇族战争责任问题上整体持回避立场，梨本宫于1946年未经起诉获释。1951年卒，享年76岁。"
 CBIO_JAP_kenkichi_ueda_desc:0 "1875年生于大阪，陆军大将，骑兵科出身。1932年第一次上海事变期间出任上海派遣军司令，指挥日军与中国第19路军激战，战后签订《淞沪停战协定》，迫使中国军队撤出上海周边地区。1936至1939年出任关东军总司令，任内关东军持续强化在中国东北的军事存在，并主导沿苏蒙边境的一系列挑衅行动。1939年诺门坎事件期间，植田授权关东军持续扩大对苏蒙联军的攻势，日军在苏军坦克集群与大规模炮兵面前遭到决定性打击，伤亡惨重。事件结束后，植田因指挥失当被强制退役，是日本陆军因边境冒进而被追责的少数高级将领之一。1962年卒，享年87岁。"
 CBIO_JAP_kiichiro_higuchi_desc:0 "1888年生于兵库，陆军中将。早年长期服务于对苏情报体系，历任哈尔滨特务机关长等职，深度介入关东军情报工作。1938年纳粹德国向日本施压，要求日方禁止波兰犹太难民经由满洲转道出境，樋口以人道主义立场拒绝德方要求，协助数千名犹太难民取得过境许可，经日本辗转逃往第三国，在国际上留下特殊历史记录。太平洋战争期间历任北方军相关职务，参与阿留申群岛及北海道防卫体系构建。1945年8月苏联对日宣战后，负责北海道及千岛群岛方向的防御部署，并主持战后日本侨民与士兵的撤回遣返组织工作。战后未受战犯追究，1970年卒，享年82岁。"
 CBIO_JAP_masakazu_kawabe_desc:0 "1886年生于东京，陆军大将。历任参谋本部职务及驻华部队指挥，参与侵华战争中国战场历次作战部署。1943年出任缅甸方面军司令官，主持日本在缅甸的军事占领与作战指挥。1944年3月发动\"英帕尔作战\"，企图攻入印度东北部英帕尔与科希马，切断盟军援华补给线。然而作战计划严重低估后勤补给困难，日军在丛林中弹尽粮绝，士兵大批死于饥饿与疾病，战役持续约四个月，投入约八万五千人，死亡逾五万人，是日本陆军史上伤亡比最惨烈的单次战役之一。英帕尔惨败后河边被解除指挥职务。战后未被列入战犯起诉，1965年卒，享年79岁。"
 CBIO_JAP_shizuichi_tanaka_desc:0 "1887年生于新潟，陆军大将。历任步兵指挥职务，以作风干练著称。战争末期出任东部军司令官，统率驻守东京及关东地区的日本陆军，是首都圈军事力量的最高指挥官。1945年8月14日深夜至15日凌晨，部分陆军青年将校发动\"宫城事件\"，企图占领皇居、扣押宫内省高层并阻止天皇终战诏书录音播出。田中以东部军司令官身份迅速介入，亲赴陆军省压制叛乱，宣布政变命令无效，令叛乱部队解散，使8月15日正午天皇玉音放送得以如期播出。事件平息后约九日，田中于8月24日在东部军司令官室内以手枪自杀，时年57岁。"
 CBIO_JAP_harukichi_hyakutake_desc:0 "1888年生于佐贺，陆军中将。1942年7月出任第17军司令官，负责所罗门群岛方向的作战，是瓜达尔卡纳尔岛争夺战中日方最高地面指挥官。1942年8月美国海军陆战队登陆瓜岛，双方随即展开历时约六个月的激烈争夺。日军持续低估美军实力，多次以不足兵力强攻美军阵地，步兵攻势一再遭到美军炮火与防御工事的毁灭性打击。日军在瓜岛约三万人伤亡中，战死约五千人，饿死与病死者超过一万五千人，后勤断绝导致的非战斗减员远超战斗损失。1943年2月日本被迫撤出瓜岛，太平洋战场战略主动权由此彻底转入美方之手。1947年卒，享年59岁。"
 CBIO_JAP_masatane_kanda_desc:0 "1896年生于爱知，陆军中将，步兵科出身。太平洋战争中期出任第17军参谋长，参与所罗门群岛方向作战。后接任布干维尔岛日军最高指挥官，统率被盟军切断补给的孤立守军。1944年起盟军对布干维尔岛实施包围封锁，神田组织部队在极端物资匮乏条件下就地开垦耕种，以农业生产维持基本给养，坚持防守至日本正式投降。1945年9月率布干维尔岛全部日本守军向澳大利亚军队投降，是太平洋战争中日本正式投降后最后几支放下武器的孤立守备部队指挥官之一。战后经审查未被列入战犯起诉，1962年卒，享年66岁。"
 CBIO_JAP_tsuneyoshi_takeda_desc:0 "1909年生，皇族，陆军中将。毕业于陆军士官学校，1932年洛杉矶奥运会以马术选手身份代表日本参赛。此后在陆军历任要职，与关东军体系有所关联，据部分史料显示其曾在满洲视察并接触与七三一部队相关的研究项目，具体参与程度史学界尚存争议。1945年日本战败后，依盟军要求放弃皇籍，以平民身份重新生活。战后致力于体育外交，长期担任日本奥林匹克委员会主席，是推动1964年东京奥运会申办成功的核心人物。1992年卒，享年82岁。"
 CBIO_JAP_tadaichi_wakamatsu_desc:0 "1893年生于山形，陆军中将，步兵科出身。历任步兵指挥职务，参与侵华战争中国战场作战。太平洋战争期间随陆军主力转战菲律宾，参与1941至1942年菲律宾战役及此后的占领守备。任职期间所属部队在菲律宾对当地平民及战俘实施虐杀，相关暴行有据可查。日本战败后，菲律宾军事法庭以战争罪及虐待战俘罪对其提起审判，认定其对部下暴行负有指挥责任，判处死刑，1947年在马尼拉执行，时年54岁。"
 CBIO_JAP_keisuke_fujie_desc:0 "，1885年出生于兵库县。1905年于日本陆军士官学校毕业。后任炮兵中尉。1914年陆军大学毕业后，历任参谋本部勤务官、参谋本部部员、驻法使馆副武官、野战重炮第四旅团长。九一八事变后，任关东宪兵队总务部长、司令官等职。1938年7月，任侵华日军第十六师团长，旋参加武汉会战，率部西犯花园、安陆、应城地区。次年1月下旬，参加鄂北会战，其部所到之处，大肆烧杀淫掠。同年10月任日本陆军大学校长。1943年2月晋升大将。1945年6月任第十一方面军兼东北军管区司令官。抗战胜利后，被中华民国国民政府列为甲级战犯。1969年2月27日死亡。"
 CBIO_JAP_toshizo_nishio_desc:0 "1881年生于石川，陆军大将。步兵科职业军官出身，历任第2师团长等要职。全面侵华战争爆发后参与华中方向作战指挥。1939年9月出任支那派遣军总司令官，统率在华日本陆军最高指挥职务，总兵力逾百万人，全面主持华中、华南战场历次大规模扫荡及对中国正面战场的军事压制，任内对中国军民造成大量伤亡。1941年3月卸任，由畑俊六接任。此后出任第2总军司令官等职。战后未被列入战犯追究，1960年卒，享年79岁。"
 CBIO_JAP_takashi_sakai_desc:0 "陆军中将，步兵科出身，以作风蛮横残酷著称。1941年12月出任第23军司令官，率部发动对英属香港的全面攻势，历时约十八天，英军于同年12月25日圣诞节当日宣布投降。占领期间，日军在酒井指挥下对香港战俘与平民实施大规模暴行，包括冲入医院屠杀伤患与医护人员、对英印及加拿大战俘施以虐杀，以及对香港平民的系统性抢劫与强奸，死难者人数众多，史称香港沦陷期间的系列暴行。战后中华民国军事法庭以战争罪名对其起诉，认定其对麾下部队所犯暴行负有直接指挥责任，1946年于上海以枪决执行，时年约59岁。"
 CBIO_JAP_kanin_kotohito_desc:0 "1865年生，皇族，陆军元帅。早年赴法国圣西尔军校留学，归国后历任师团长等要职，参与日俄战争。1931年12月出任参谋总长，任期长达九年至1940年10月，跨越九一八事变、七七事变及全面侵华战争爆发的整个关键阶段，是这一时期日本陆军战略决策的最高军事职位持有者。历次侵华扩张战略方针的制定、对华北及华中的大规模军事侵占均在其任内以大本营名义部署推进，其作为参谋总长对侵略决策的责任不可回避。由于皇族身份，战后盟军整体回避对皇族成员的战犯追究，载仁亦未受审判。1945年5月病逝，享年79岁。"
 CBIO_JAP_jo_iimura_desc:0 "1888年生于茨城，陆军大学校第21期，与石原莞尔、横山勇并称陆士21期\"三羽乌\"，早年毕业于外国语学校，具备欧美情报视野，历任参谋本部欧美情报课长、关东军参谋长等要职。1941年1月出任总力战研究所所长，主持\"总力战图上演习\"，以模拟推演方式对日美开战进行兵棋推算，结论为：日本船舶损耗将超出建造产能，持续作战极为困难，且悲观预测苏美将实施军事合作、美军航空兵将利用苏联远东基地轰炸日本。报告上呈近卫内阁，陆军大臣东条英机将其斥为\"桌上的空论\"，全盘无视。因对开战持消极立场，饭村随即被调往满洲东部出任第5军司令官。其后历任陆军大学校长、南方军总参谋长，1944年底接任新几内亚方向第2方面军司令，与澳军对峙。1945年6月回国出任东京防卫军司令，日本投降后出任宪兵司令，主持镇压拒绝接受投降命令的残余武装。战后参与秘密的\"辰巳机关\"，协助政府遴选旧军将领，为自卫队创建筹备人才。1976年卒，享年87岁。"
 CBIO_JAP_teijiro_toyoda_desc:0 "1885年生，海军大将。以海军职业军官身份历任舰队及海军省要职，积累丰富行政经验后进入政府系统。1940年出任商工大臣，参与战时产业动员体制建构。1941年7月出任第三次近卫内阁外务大臣，接手松冈洋右去职后的对美外交谈判，然美日双方立场已无弥合空间，谈判至同年10月仍无成果，近卫内阁随即总辞。此后日美谈判破裂，12月太平洋战争爆发。丰田任外相期间主持对美交涉的最后阶段，为开战决策的程序性参与者之一。1961年卒，享年76岁。"
 CBIO_JAP_zengo_yoshida_desc:0 "1885年生，海军大将。历任联合舰队下属舰队指挥职务，以稳健务实风格见称。1939年9月出任海军大臣，与米内光政、山本五十六、井上成美等人共同构成海军内部反对缔结德意日三国同盟的核心阵营，坚持认为缔约将不可避免地将日本拖入与英美全面对抗。任内持续承受来自陆军与亲轴心政界人士的强大压力，1940年以身体欠佳为由请辞。其去职削弱了海军反对同盟的抵抗力量，米内内阁随后在陆军压力下于同月总辞，三国同盟谈判此后加速推进。1966年卒，享年81岁。"
 CBIO_JAP_masafumi_arima_desc:0 "1895年生，海军少将，太平洋战争中期的航空作战指挥官。历任海军航空相关职务，战争中期担任第26航空战队司令。1944年10月美军大规模两栖攻势逼近菲律宾，日本海军已无力以常规空战对抗美军庞大的舰载航空力量。10月15日，有马正文亲自驾驶舰载轰炸机脱离编队，径直向美军特混舰队实施自杀式俯冲攻击，当场阵亡，时年49岁。此举在日本海军内部引发强烈震动，被广泛视为神风特攻精神的先驱示范，正式神风特攻队组建于此后数日，大批年轻飞行员随之被投入有去无回的自杀式攻击任务直至战争结束。"
 CBIO_JAP_gengo_hyakutake_desc:0 "1882年生于佐贺，海军大将，海军兵学校30期首席毕业，30期同届中唯一晋升大将者。三哥百武三郎亦为海军大将兼天皇侍从长，六弟百武晴吉为陆军中将，兄弟三人皆为将官；其中源吾与三郎是日本海军史上唯一一对兄弟双双晋升大将的案例。日俄战争期间登上\"三笠\"号担任主炮着弹观测员，亲历黄海海战与对马海战。留美两年后确信以美国为假想敌是鲁莽之举，回国后于海军大学鼓吹对美协调路线，被青年学生批评为\"恐美主义者\"。1927年出任军令部第一班长，任内酒后当众痛骂昔日好友加藤宽治薄情寡义，此举断送其军令部次长前途。此后以军令部次长身份先后与荒木贞夫就济南撤兵问题激烈交锋、赴满洲视察遭关东军司令本庄繁拒绝接见，均因力主协调外交而处处碰壁。1932年作为条约派与军令部总长谷口尚真一同遭舰队派驱逐出核心，此后历任练习舰队司令、第3舰队司令长官、佐世保镇守府司令等闲职，以大将身份退出一线。战后出任第七代九州帝国大学总长。1976年卒，享年93岁。"
 CBIO_JAP_nobutake_kondo_desc:0 "1886年生于栃木，海军大将，以大型水面舰艇指挥见长。1941年出任第二舰队司令长官，参与太平洋战争多次重大海战。中途岛海战期间率支援编队参战，未能扭转战局。1942年所罗门群岛争夺战期间，近藤率第二舰队主力多次出击，以战列舰艇掩护对瓜岛增援补给与炮击任务。同年11月第三次所罗门海战中，近藤亲率战列舰\"雾岛\"号等主力舰夜间炮击瓜岛机场，遭美国战列舰\"华盛顿\"号以雷达引导炮火突然打击，\"雾岛\"号中弹累累被迫自沉，是日本战列舰在太平洋战争水面决战中的罕见大型舰艇损失。1944年卸任，战后未受战犯追究，1953年卒，享年67岁。"
 CBIO_JAP_tadashige_daigo_desc:0 "醍醐忠重，1891年10月15日生于东京，出身华族醍醐侯爵家，1900年继承侯爵爵位，1916年成为贵族院议员。毕业于海军兵学校，长期在潜艇部队任职，历任潜艇长、潜水队司令及潜水学校职务；1938年任侍从武官，1940年晋海军少将，1943年晋海军中将。同年11月出任第二十二特别根据地队司令官，负责婆罗洲地区防务。其任内，日军以所谓抗日阴谋为名，在西加里曼丹制造坤甸事件，大规模逮捕、刑讯并杀害马来人、华侨及其他当地居民。战后荷兰军事法庭认定他应对相关暴行承担指挥责任。1945年5月任第六舰队司令长官，继续组织潜艇及“回天”自杀兵器作战，直至日本投降。战后他被引渡至荷属东印度，1947年10月3日因坤甸事件相关战争罪被判处死刑；12月6日在坤甸被枪决，临刑前拒绝蒙眼，高唱《君之代》并三呼“天皇陛下万岁”。"
 CBIO_JAP_kiyoshi_hasegawa_desc:0 "1883年生于福井，海军大将。1932年第一次上海事变期间参与海军舰队作战。全面侵华战争爆发后历任第三舰队司令长官，主持长江流域及华中方向的海军火力支援与封锁作战，配合陆军对中国军队实施持续打击。1940年出任台湾总督，任内强力推行皇民化政策，强制推广日语教育，压制台湾中华文化认同，并大规模征调台湾劳工与兵员投入战争。1945年10月25日，长谷川以台湾总督身份在台北公会堂向中华民国政府代表陈仪签署受降文书，是台湾光复典礼的日方签署人。战后未被列入战犯追究，1970年卒，享年87岁。"
 CBIO_JAP_hiroaki_abe_desc:0 "1892年生，海军中将，战列舰战术的坚定支持者。历任驱逐舰、巡洋舰编队指挥职务。1942年11月瓜达尔卡纳尔岛争夺战的关键阶段，阿部奉命率以战列舰\"比叡\"号、\"雾岛\"号为核心的水面打击部队夜间突入铁底湾，企图炮击亨德森机场。舰队行进途中与美军巡洋舰及驱逐舰编队遭遇，在混乱夜战中\"比叡\"号遭近距离密集炮击，舵机受损失控，翌日在美军持续空袭中沉没，成为太平洋战争中日本损失的第一艘战列舰。阿部因此次作战决策失当被解除指挥职务并强制退役，此后再未出任作战指挥。1949年卒。"
 CBIO_JAP_takeo_takagi_desc:0 "1892年生，海军中将。1942年5月珊瑚海海战期间，以机动部队最高指挥官身份统率以\"翔鹤\"号、\"瑞鹤\"号为核心的日本航母编队，与美军特混舰队展开对峙，是日美双方首次以航空母舰互为攻击目标、水面舰艇从未直接交火的新型海战。日军击沉美国航母\"列克星敦\"号，但\"翔鹤\"号亦受重创，日本攻取莫尔兹比港的计划被迫推迟，成为阻止日本向澳大利亚方向继续推进的重要节点。1944年调任第14航空舰队司令官，驻守马里亚纳群岛方向。同年7月美军攻入塞班岛，高木弹尽援绝后自杀殉职，时年52岁。"
 CBIO_JAP_yoshio_nishina_desc:0 "1890年生于冈山，物理学家，日本近代核物理研究的奠基人。东京帝国大学毕业后赴欧留学，在丹麦哥本哈根与量子力学创立者尼尔斯·玻尔共同工作多年，在理论物理领域积累深厚造诣。回国后主持理化学研究所核物理部门，引进回旋加速器，建立日本核物理研究的基础设施与人才体系。太平洋战争期间，受日本陆军委托主持\"二号研究\"——即铀原子弹技术可行性探索，对核裂变链式反应及铀浓缩方案进行研究，但受制于资源匮乏与工业基础薄弱，始终未能推进至实用阶段。1945年8月广岛原子弹爆炸后，仁科亲赴现场主持调查，向当局确认为核武器爆炸。1951年病逝，享年61岁。"
 CBIO_JAP_yoji_ito_desc:0 "1901年生于千叶，东京帝国大学电气工学科毕业，后赴德留学，于德累斯顿工科大学师从巴克豪森教授研究无线真空管，1929年取得博士学位。归国后任海军技术研究所电气研究部技师，长期从事磁控管（マグネトロン）研究，1937年末成功研制出八段阳极磁控管试制品，并于1940年以此为基础完成厘米波雷达原型机，在横滨鹤见冲以空母\"赤城\"为目标进行实验，成功捕捉目标。然而海军判断微波技术\"短期内无法实用\"，叫停了进一步研发。几乎同期，英国独立研制出相同原理的磁控管并提供给美国，美军由此建立起完整的微波雷达体系，在历次海战中大量压制日本舰队。1941年赴德视察后向海军汇报盟军脉冲雷达进展，推动日本电探开发提速，然日美雷达技术差距始终无法弥合。1942年联合舰队图上演习后，伊藤提出警告称德英美均在推进原子弹研究，促成以仁科芳雄为委员长的\"物理恳谈会\"设立，最终结论为\"技术可行但铀矿不足，赶不上这场战争\"。最终军衔海军技术大佐。1955年卒，享年54岁。"
 CBIO_JAP_kijiro_nambu_desc:0 "1869年生于高知，陆军大佐出身的武器工程师，日本近代轻武器自主研发体系的重要奠基人。早年服务于东京炮兵工厂，专攻自动武器设计，主持研制一系列日本陆军标准步兵装备。代表作品包括十四年式手枪，成为日本陆军军官标准佩枪；此外还主持研发大正十一年式轻机枪等多型自动武器，在侵华战争与太平洋战争中被日本陆军大量使用，直接服务于对中国及亚太各国的军事侵略。1927年创办南部铳制造所，继续主持轻武器研发生产，是战时日本军事工业体系的重要组成部分。1949年卒，享年80岁。"
 CBIO_JAP_jiro_horikoshi_desc:0 "1903年生于群马，三菱重工业飞机设计工程师，零式舰载战斗机（A6M）首席设计师，是日本航空工业史上贡献最为突出的工程师之一。1937年接受海军委托开发新型高性能舰载战斗机，在极为苛刻的航程、机动与火力指标要求下，以大幅削减结构重量为核心设计路径，牺牲飞行员防护装甲与机体结构强度，于1939年完成原型机，1940年正式命名零式定型服役。零式以超长航程、出色机动性及强劲火力，在战争初期对英美战斗机形成明显性能优势，主导了太平洋战场早期的制空权争夺，并大量参与对中国战场的轰炸护航与制空作战。随盟军新型战斗机陆续投入，零式性能优势逐步消失。1982年卒，享年78岁。"
 CBIO_JAP_hideo_iwakuro_desc:0 "1897年生，陆军少将，曾任陆军省军务局第一课课长，主管陆军政策核心事务。1941年初，以非正式渠道参与日美避战试探性谈判，与美国传教士德劳特神父、沃尔什主教等人共同拟定\"日美谅解方案\"草稿，寻求通过民间渠道打开两国外交僵局。然而方案送达外务省及国务院审阅后，因双方在中国问题及三国同盟上的根本分歧而无法推进，日美之间最后的非正式沟通渠道随之关闭，太平洋战争于同年12月爆发。此外，岩畔参与陆军情报及对外技术合作事务，兼具政策协调与技术情报背景，是陆军省军政交叉领域中的重要人物。战后未受战犯追究，1970年卒，享年73岁。"
 CBIO_JAP_yuzuru_hiraga_desc:0 "1878年生于东京，海军造船中将，日本近代最重要的军舰设计师。毕业于东京帝国大学工学部造船学科，进入海军造船体系，以理论严密、设计精细著称。主导设计长门级战列舰，其41厘米主炮配置在建成时列于世界前列；此后主持妙高级及高雄级重型巡洋舰系列设计，以有限排水量内实现高密度武装与航速的精巧均衡，对日本海军重巡洋舰体系建构影响深远。平贺坚持技术设计的专业独立性，屡与强求指标的海军军令当局发生冲突，一度被迫出走伦敦，史称\"平贺让追放\"事件。晚年出任东京帝国大学总长，1943年于任内病逝，享年64岁。"
 CBIO_JAP_yoshitoshi_tokugawa_desc:0 "1884年生于东京，陆军中将，工兵科出身，毕业于东京帝国大学工学部。1910年12月19日，德川在东京代代木练兵场驾驶法国法尔曼双翼机升空，与同日试飞的日野熊蔵共同完成日本有史以来首次有人动力飞行，正式开创日本航空史的起点。此后长期致力于推动陆军航空兵力建设，主持飞机技术引进与飞行员训练体系建立，在日本军用航空从无到有的过程中发挥核心作用。其引进与培育的航空技术体系，最终服务于日本对华及亚太地区的军事侵略战争。战后未受战犯追究，1963年卒，享年78岁。"
 CBIO_JAP_hideki_yukawa_desc:0 "1907年生于东京，理论物理学家，京都帝国大学毕业。1935年发表介子理论，预言原子核内部传递核力的媒介粒子存在，以理论推导领先实验验证整整十余年，是亚洲科学家独立贡献于基础物理学前沿的划时代成果。战时以教授身份任职大阪帝国大学及京都帝国大学，参与部分战时科学动员讨论，主要仍从事理论物理研究。1949年获诺贝尔物理学奖，是首位获此殊荣的日本人。此后积极参与国际反核和平运动，1955年签署《罗素-爱因斯坦宣言》，倡导科学家以自身责任推动裁军与人类和平。1981年卒，享年74岁。"
 CBIO_JAP_keiji_fukuda_desc:0 "1890年生于东京中野，海军技术中将，造船官世家出身，其父福田马之助亦为海军造船中将。1914年毕业于东京帝国大学工学部造船科，1920至1923年驻英期间就读格林尼治王立海军大学校，并以造船中佐身份随员出席伦敦海军裁军会议。1935年，艦政本部基本计划主任藤本喜久雄因友鹤事件遭谴责处分，翌年1月脑溢血猝死，福田随即接任艦政本部第四部基本計画主任，正式主持大和型战列舰的基本设计工作。此时平贺让以顾问身份重返艦政体系，对设计方向施加主导性影响，福田的方案在平贺思路框架下最终确定：46厘米三联装主炮三座共九门、基准排水量约六万九千吨，由此诞生世界史上吨位最大的战列舰\"大和\"与\"武藏\"。然而设计亦留下隐患——防水隔壁仅23个，与二十年前的长门型同数，战损控制能力严重不足。1940年晋升海军造船中将，翌年出任艦政本部第四部长，同时兼任东京帝国大学工学部教授，1943年升任艦政本部技术监。1964年卒，享年74岁。"
 CBIO_JAP_hideo_itokawa_desc:0 "1912年生于东京，航空与火箭工程师，东京帝国大学航空学科毕业后入职中岛飞机株式会社。战时参与一式战斗机\"隼\"及四式战斗机\"疾风\"的气动外形设计，以工程师身份深度服务于日本军用航空工业，所研发的机型大量投入对华作战及太平洋战场。战后军需产业解体，转入东京大学从事学术研究，将工程能力全面转向火箭推进与航天技术开发。1955年领导开发长仅23厘米的\"铅笔火箭\"，开创日本独立火箭研究系列计划。1970年日本首颗人造卫星\"大隅\"号成功入轨，糸川的技术积累是这一成就的重要基础。被誉为\"日本火箭之父\"，1999年卒，享年86岁。"
 CBIO_JAP_osamu_shimomura_desc:0 "1910年生于大分，经济学家，东京帝国大学经济学部毕业后进入大藏省任职。早年深受凯恩斯经济理论影响，主张政府应以积极财政政策引导国民经济扩张，反对以收支平衡为优先的传统财政保守路线，在战时大藏省体制内属少数派自由派声音。战后以其对日本经济潜在增长力的系统性定量分析，为1960年池田勇人内阁\"国民收入倍增计划\"提供核心理论依据，是推动日本战后进入高速经济增长轨道的重要政策思想奠基者。其扩张性财政主张对战后日本经济学界产生持续影响。1989年卒，享年79岁。"
 CBIO_JAP_kozo_sasaki_desc:0 "1900年生于宫城，工人运动活动家，战前参与无产政党运动，多次遭当局打压。战后参与重建日本社会党，以强硬作风与激进立场在党内迅速崛起，因性格刚烈获绰号\"鬼の更三\"。历任社会党书记长、委员长等核心职务，长期代表党内左翼路线，坚决反对日本重新武装及《日美安全保障条约》的修订，在议会内外以直接对抗方式推动反战与工人权益保护运动。1960年安保斗争期间是社会党左翼动员的核心组织者之一。1985年卒，享年85岁。"
 CBIO_JAP_onisaburo_deguchi_desc:0 "1871年生于京都龟冈，大本教的核心创立者与实际领袖。以神秘宗教体验与预言著述为核心，将神道、佛教与民间信仰熔为一炉，倡导世界统一与人类精神改造，大本教在其主导下迅速扩张，信徒遍及各阶层。当局视大本教末日神学与其独立组织为潜在的政治威胁，1921年以不敬罪发动\"第一次大本事件\"将其逮捕，1935年再度以颠覆国体嫌疑发动\"第二次大本事件\"，动用炸药摧毁大本总部建筑群，将出口再度系狱，大本组织几近瓦解。1942年以病重为由获释出狱，战后重建大本教。1948年卒，享年76岁。"
 CBIO_JAP_giro_senoo_desc:0 "1889年生，净土真宗僧侣出身的社会活动家。1931年创立新兴佛教青年同盟，主张将佛教社会主义理念付诸实践，以佛法批判资本主义剥削与军国主义扩张，倡导废除战争、解放劳工与社会平等，是战前日本极少数以宗教立场公开批判侵略战争的声音之一。因反战活动多次遭特高警察逮捕系狱，受审期间坚持立场，拒绝放弃反战主张。其所坚持的宗教反战路线，在全面军国主义高压的昭和战时语境中属极为罕见的异议声音。战后持续参与佛教和平运动。1961年卒，享年约72岁。"
 CBIO_JAP_yoshihige_abe_desc:0 "1883年生于爱媛县松山，哲学家与教育家。东京帝国大学哲学科毕业，留学德国研习康德哲学，归国后长期任教庆应义塾大学，以自由主义人文教育理念著称，是大正至昭和初期自由主义知识圈的代表人物之一。战时在政治高压下坚持学术研究，与军国主义动员保持距离。1945年战后出任东久迩宫及幸田内阁文部大臣，参与制定初期教育改革方针，致力于以民主自由理念重构战后教育体系。此后出任学习院大学校长，以哲学家与教育家身份持续影响战后日本人文学术与教育思想。1966年卒，享年83岁。"
 CBIO_JAP_emperor_nobuhito_desc:0 "1905年生，裕仁天皇之弟，封高松宫，海军中将。毕业于海军兵学校，此后历任海军参谋及联络职务。太平洋战争期间在大本营及海军省参与战略协调工作，据史料显示，宣仁对战局发展持悲观判断，曾在皇室内部多次表达对战争前景的担忧，并与部分倾向尽早终战的人士有所往来，然其政治影响力因皇族身份的特殊约束而十分有限。1945年战败后以皇族身份保留皇籍，未受战犯追究。战后热心文化事业，长期担任能乐等传统表演艺术的推广者与保护人。1987年卒，享年82岁。"
 CBIO_JAP_yukio_ozaki_desc:0 "1858年生于神奈川，政治家，日本议会政治史上在任时间最长的国会议员。1890年日本首届众议院选举即告当选，此后连续当选二十五届，议员生涯长达六十三年，直至1953年方告卸任。曾任东京市长（1903—1912年），任内向美国华盛顿捐赠樱花树，成为日美民间交流的历史典故。长期以议会演说批评军部扩张与政党腐败，是昭和前期政党政治衰落过程中坚持自由主义立场的极少数议员之一。1942年因一篇批评战时政府的演说遭当局以\"不敬罪\"起诉，后无罪获释。战后积极推动世界联邦运动与永久和平倡议。1954年卒，享年96岁。"
 CBIO_JAP_noboru_yamaguchi_desc:0 "神户港区码头劳工组织者，山口组的初代创立者。明治末年在神户新开地一带以统领码头装卸劳工为核心业务，组建以本人姓氏命名的\"山口组\"，逐步将港区苦力承包、演艺场所管理及码头秩序维持整合为一体，形成日本近代都市黑社会组织的早期雏形。山口组在其奠基下确立了以港口劳动管理为基础的组织模式，随日本战时工业动员与港口物流需求扩大而获得进一步扩张空间，战后经后继领袖的大规模扩张，最终发展为日本规模最大的暴力团组织，成员一度逾数万人。"
 CBIO_JAP_gempo_yamamoto_desc:0 "1866年生于鸟取，临济宗禅僧。据传幼年家贫，长至中年方识字，入寺后潜心参禅，历经数十年苦修，最终出任静冈三岛龙泽寺住持，成为昭和时代禅宗界最具影响力的高僧之一。门下弟子与私淑者遍及政界与军界，铃木贯太郎等人与其均有深厚法缘。1945年8月日本最高战争指导层围绕接受《波茨坦宣言》争论不休之际，铃木首相据称曾就时局征询玄峰意见，玄峰以简短直截之语表达劝和立场，在终战决断的精神层面具有一定影响。1961年卒，享年95岁。"
 CBIO_JAP_hideo_shima_desc:0 "1901年生于大阪，铁道工程师，东海道新干线的核心技术主导者。毕业于东京帝国大学工学部，进入国铁系统后在机车与铁道工程领域积累深厚经验，其父岛安次郎亦为著名铁道工程师。1955年起在国铁总裁十河信二主导的新干线计划中担任技术总负责人，率领工程团队突破时速210公里高速运行的一系列技术难关，包括轨道稳定性、车辆气动设计与信号控制体系的全面革新。1964年东京奥运会开幕前十日，东海道新干线正式通车。然而因建设费用大幅超出预算，岛与十河均在通车前被迫辞职，未能出席开通典礼。此后转赴宇宙开发事业团，参与日本航天技术早期开发。1998年卒，享年96岁。"
 CBIO_JAP_hiratsuka_raicho_desc:0 "1886年生于东京，女权主义者与作家。1911年创立青鞜社，主编女性文学杂志《青鞜》，以\"元始，女性乃太阳\"的宣言开篇，向明治以来压制女性公共身份的社会规范发出正面挑战，是日本近代第一波女权运动的核心发起者。1920年与市川房枝共同创立新妇人协会，推动修订《治安警察法》第五条，争取女性出席政治集会的权利。昭和军国主义高压时期公共活动空间急剧收窄，几近沉默。战后以女权与反核和平为双重旗帜重返社会运动，持续发声至晚年。1971年卒，享年85岁。"
 CBIO_JAP_yoshio_shiga_desc:0 "1901年生于福冈，日本共产党早期成员。1923年初遭当局逮捕，1928年\"三一五事件\"大规模镇压中再度被捕，此后在狱中度过长达十七年，至1945年日本战败后方获释放。羁押期间，绝大多数被捕共产党员在特高警察压力下签署\"转向\"声明放弃主义，志贺系极少数始终拒绝转向者之一，在党内被视为不屈节操的象征。1945年出狱后参与重建日本共产党，担任中央委员等核心职务，是战后初期日共的重要领导人之一。1964年因支持苏联核试验与党内主流意见分裂，被开除党籍。1989年卒，享年87岁。"
 CBIO_JAP_komakichi_matsuoka_desc:0 "1888年生，工人运动领袖。长期在日本劳动总同盟（友爱会→总同盟）体系内从事劳工组织工作，历任总同盟核心职务，是大正至昭和初期日本规模最大劳工联合组织的主要领导人之一。多次当选众议院议员，以议会路线推动劳工权益保护立法，是战前议会劳工派的代表性人物。战时各劳工组织被强制改编为官方统制的\"产业报国会\"体系，独立劳工运动的组织空间彻底消失。战后积极参与劳工运动重建，在社会党与民主社会主义路线框架内持续从事工会政治工作。1958年卒。"
 CBIO_JAP_morihei_ueshiba_desc:0 "1883年生于和歌山，武术家，合气道创始人。早年系统习练柔术、剑术与枪术，寻访多位当代武术名家，广泛积累各流派技艺。1915年结识大本教主出口王仁三郎，深受其神道与宗教宇宙观影响，此后在宗教体验与武术实践的双重驱动下，逐步将多门技艺整合为以\"和\"为核心理念的新武道体系，强调顺应对方之力、以圆融动作化解攻击，而非以力对力，最终定名\"合气道\"。战时所在道场弟子中不乏军政要人。战后专注于向国内外传播合气道，将其定位为追求和平与精神修炼的武道。1969年卒，享年85岁。"
 CBIO_JAP_hajime_kawakami_desc:0 "1879年生于山口，经济学者，京都帝国大学教授，日本马克思主义经济学的最重要奠基人与传播者。1916至1917年连载《贫乏物语》，以通俗文笔剖析资本主义制度与贫困问题，引发广泛社会讨论，是将马克思主义经济学思想带入日本大众视野的关键著作。此后系统翻译与阐发马克思、恩格斯著述，在学术与社会运动两个层面深刻影响日本左翼思想的形成。1928年辞去教职，转向直接的共产主义政治活动，1933年遭当局逮捕，系狱四年。出狱后仍坚持写作，留下大量学术与回忆文字。1946年1月病逝，享年66岁。"
 CBIO_JAP_kojiro_fukushi_desc:0 "1889年生于青森，诗人。早年深受美国诗人惠特曼影响，以热烈的自由诗歌颂自然、生命与个体精神，是日本近代将惠特曼主义引入本土诗歌的代表人物之一。1930年代随日本民族主义情绪高涨，文学立场逐渐向法西斯主义靠拢，将诗歌创作转向颂扬日本帝国精神与扩张使命，为军国主义意识形态的摇旗呐喊。1946年卒，享年56岁。"
 CBIO_JAP_fukumoto_kazuo_desc:0 "1894年生于鸟取，马克思主义理论家。留学德国期间系统研习欧洲马克思主义理论，归国后在日本共产党内提出\"福本主义\"路线，强调马克思主义理论的高度纯粹性与组织上的严格区分——先以意识形态划线\"分离\"非纯粹成员，再在纯粹基础上\"结合\"，以建立精英先锋党组织。此路线1926至1927年间一度主导日共理论方向，随即遭共产国际批判为脱离劳动群众的宗派主义与抽象理论主义，被强制纠正。1929年被捕，在狱中度过多年。战后仍坚持理论写作，晚年转向城市规划与文明论研究。1983年卒，享年88岁。"
 CBIO_JAP_taketora_ogata_desc:0 "1888年生于长野，新闻人与政治家。早年加入朝日新闻，历任编辑要职，最终出任主笔与副社长，在全面侵华战争及太平洋战争期间主持朝日新闻编务，该报在此期间积极配合军部宣传路线，为战争动员提供舆论支撑，绪方负有相应的媒体领导责任。战时曾短暂出任情报局总裁，参与国家宣传体制协调工作。战后进入政界，出任吉田内阁官房长官，后成为自由党及自由民主党创建过程的核心推手之一，是战后保守政治重建的重要人物。1956年于自民党总裁竞选期间病逝，享年68岁。"
 CBIO_JAP_empress_nagako_desc:0 "1903年生于东京麻布，久迩宫邦彦王长女，母出身萨摩岛津家。1918年于学习院女学部就读中途，被内定为皇太子裕仁妃，随即引发\"宫中某重大事件\"——元老山县有朋以其母系岛津家有色弱遗传为由，力主取消婚约，此事在宫中与政界掀起轩然大波，久迩宫家一度深陷压力。然裕仁本人态度坚定，婚约维系，1924年1月26日与裕仁成婚，1926年12月随裕仁即位而成为皇后，其生日3月6日被定为\"地久节\"列入国家祭日，直至1945年战败方废止。在位期间先后育有二男五女。昭和天皇驾崩后成为皇太后。在位62年14日，为历代皇后在位时间最长者；2000年6月16日崩御，享年97岁，亦为历代皇后中最长寿者，追号香淳皇后。"
 CBIO_JAP_masamichi_royama_desc:0 "1895年生于冈山，政治学者，东京帝国大学教授，昭和研究会的核心参与者。昭和研究会是近卫文麿组阁期间围绕其建立的政策智囊网络，蜡山在其中主导\"东亚协同体\"理论的建构，主张以区别于西方殖民主义的\"协同\"模式确立日本对中国及东亚的主导秩序，在意识形态上为日本的区域扩张提供了较为精致的学术包装。这一理论框架实质上将中国主权的丧失以\"合作\"语言加以粉饰，在当时中国知识界引发强烈批评。大政翼赞会成立后参与翼赞体制的思想整合工作。战后转向民主社会主义立场，继续从事学术研究。1980年卒，享年85岁。"
 CBIO_JAP_hakamada_satomi_desc:0 "1904年生于静冈，日本共产党长期核心领导人之一。早年参与共产主义运动，数度遭当局逮捕系狱，在昭和军国主义高压下坚持未公开转向，是党内以坚持信念著称的人物之一。1945年战后出狱，参与重建日共，长期任政治局委员，是战后二三十年间日共领导集体的重要成员，以教条严整的马克思列宁主义立场著称于党内。1977年在党内权力冲突中遭开除，此后公开发表对日共内部运作文化及与苏中共产党关系的批评性回忆文字，引发广泛关注。1990年卒，享年86岁。"
 CBIO_JAP_saionji_kinmochi_desc:0 "1849年生于京都，出身公家世家，明治维新后留法十年，深受西方自由主义政治思想影响。历任枢密院议长、文部大臣，两度出任首相（1906—1908年、1911—1912年），是立宪政友会的创建推动者，主张以政党政治制约军部权力，是明治大正时代自由主义议会路线的最高代表。1919年作为全权代表出席巴黎和会，参与一战后国际秩序重建谈判。1924年后成为仅存的元老，以\"最后元老\"身份持续向天皇推荐历届首相人选，其政治影响延续至二二六事件前后。目睹军部势力逐步凌驾内阁，深表忧虑但无力阻止。1940年卒，享年91岁。"
 CBIO_JAP_bin_akao_desc:0 "1899年生于福冈，职业右翼活动家，日本极右翼街头政治的长期代表人物。战前以极端国家主义活动家身份活跃，主张彻底反共与天皇绝对主义，以街头演说与煽动著称，因言论激进多次遭当局短暂拘押，却借此积累政治知名度。1951年创立大日本爱国党，在东京日比谷、上野等地长期以宣传车与街头演讲从事反共与国家主义鼓动，是战后日本政治光谱中最具辨识度的极右翼街头人物之一。其活动路线清晰地呈现出战前民间极端右翼与战后在野右翼运动之间的连续性。1990年卒，享年91岁。"
 CBIO_JAP_tsuji_jun_desc:0 "1884年生于神奈川，作家、翻译家，日本达达主义与无政府主义思潮的重要人物。以最早将德国无政府主义哲学家施蒂纳的《唯一者及其所有物》译入日文著称，将极端个人主义与自我解放哲学引入日本思想界。与无政府主义女权活动家伊藤野枝曾有婚姻关系，伊藤于1923年关东大地震后遭军宪在甘粕事件中杀害。辻本人以放浪不羁、彻底拒斥社会规范的生活方式著称，拒绝一切固定职业与体制归属，以虚无主义与达达精神持续写作至生命末年。1944年在东京贫病交加中去世，享年59岁。"
 CBIO_JAP_suzuki_bunji_desc:0 "1885年生于宫城，日本近代劳工运动的奠基性人物。毕业于东京帝国大学，深受基督教社会改良主义影响。1912年创立友爱会，以工人互助与劳动条件改善为宗旨，是日本历史上第一个具有全国规模的劳工组织，成员迅速从十五人扩张至数万人。友爱会后经历次改组，发展为大日本总同盟友爱会，并最终成为战前日本最大劳工联合体总同盟（Sodomei）的直接前身。铃木以温和改良主义路线主导友爱会初期方向，在与激进阶级斗争派的路线分歧中坚持议会劳工路线，对战前日本劳工运动的制度化发展产生深远影响。1946年卒，享年60岁。"
 CBIO_JAP_minoru_takano_desc:0 "1901年生，工会运动领袖，战后日本劳工运动激进派的代表人物。1951至1955年担任日本劳动组合总评议会（总评）事务局长，主导总评走向对抗性的阶级斗争路线，积极推动反对重新武装、反对《日美安全保障条约》及反对朝鲜战争特需依赖的政治性罢工运动，将总评定位为超越单纯劳资谈判的政治社会运动平台。1955年因路线争议被迫离开总评领导职务，此后总评方向有所调整。其任内所奠定的总评左翼激进路线，深刻影响了1950至60年代日本社会运动的整体政治氛围。1974年卒，享年73岁。"
 CBIO_JAP_hisachi_aso_desc:0 "1891年生于栃木，社会民主主义政治家，日本战前议会左翼运动中尝试在共产主义与保守势力之间另辟路线的重要人物。早年参与劳工运动，后组建劳农党、日本大众党等无产政党，并在历次政党合并中持续推动议会劳工与社会民主力量的整合。1932年参与创立社会大众党，担任书记长，坚持以议会路线推动社会改革，同时明确区别于日本共产党的革命路线。1930年代军国主义高压下，社会大众党在生存压力与路线分歧中逐渐向支持扩军的方向漂移，麻生本人亦未能完全抗拒这一压力。1940年病逝，时年49岁，未及见到战时社会运动的最终瓦解。"
 CBIO_JAP_akira_kurosawa_desc:0 "1910年生于东京，电影导演。战时在日本电影审查与军国主义动员体制下从事创作，1943年以处女作《姿三四郎》登场，1944年执导《最美》，以女性军需工厂工人为题材，纳入战时生产动员的宣传框架。日本战败后创作自由度大幅拓展，1950年《罗生门》在威尼斯国际电影节获金狮奖，使日本电影首次赢得欧洲最高荣誉，将日本电影带入世界视野。此后《七武士》《乱》《梦》等作品确立其在世界影史的顶尖地位，被黑泽明影响的导演遍及好莱坞与全球各地。1998年卒，享年88岁。"
 CBIO_JAP_teruzo_ando_desc:0 "1905年生，陆军步兵大尉，皇道派青年将校群体中资历较深的核心人物之一。长期浸润于皇道派\"昭和维新\"的政治理念，与村中孝次、矶部浅一等人私交深厚，对统制派把持军政权力深怀不满。1936年2月26日二二六事件爆发，安藤率第3步兵联队部队占领首相官邸，意图击毙首相冈田启介，冈田因躲入仓库幸免于难，安藤部下误将其秘书认作本人杀害。政变持续四日后遭镇压，安藤被捕，秘密军事审判以叛乱罪判处死刑，随后经减刑改为无期徒刑，1953年获假释出狱。1987年卒，享年81岁。"
 CBIO_JAP_yoshiyuki_kawashima_desc:0 "1878年生，陆军大将，二二六事件爆发时出任陆军大臣。在皇道派与统制派长期分裂的陆军内部，川岛被视为对皇道派怀有同情的高级将领，叛乱青年将校在策划政变时对其抱有一定期待。事件爆发后，川岛在处置上态度含混，向天皇上奏叛军诉求时措辞遭批评为变相为叛乱背书，既未旗帜鲜明宣布叛军为乱，也未立即部署镇压，令局势在初期悬而未决。此举遭政府与宫中强烈批评，政变平息后川岛被迫辞去陆相职务，此后再未出任要职。1945年病逝，享年67岁。"
 CBIO_JAP_takaji_muranaka_desc:0 "1903年生，陆军步兵中尉，二二六事件的核心组织者之一。与矶部浅一共同起草政变理论纲领，系统阐发\"昭和维新\"的政治主张，将军内腐败与统制派把持权力列为打倒对象，将皇道精神的回归作为国家改造的核心。1934年因参与批评军部上层的\"村中矶部文书\"遭陆军开除军籍，此后以在野姿态继续推动青年将校运动。1936年2月26日率部参与政变行动，政变失败后被捕，接受秘密军事审判，1936年7月以叛乱罪被处以枪决，时年33岁。"
 CBIO_JAP_yasuhide_kurihara_desc:0 "1908年生，陆军步兵中尉，二二六事件的重要参与者。深受北一辉《日本改造法案大纲》影响，视财阀、政党政治与元老体制为阻碍\"昭和维新\"的腐朽势力，将以武力清除这一障碍视为军人的历史使命。1936年2月26日参与政变，率部攻击内大臣斋藤实官邸，斋藤遭叛军击毙。政变失败后被捕，秘密军事审判以叛乱罪判处死刑，1936年7月执行枪决，时年27岁，是二二六事件处决者中年龄最小的军官之一。"
 CBIO_JAP_saburo_aizawa_desc:0 "1889年生，陆军步兵中佐，皇道派激进行动的重要前驱者。1935年8月12日，相泽以个人行动持军刀闯入陆军省军务局，当场砍杀统制派核心人物、军务局长永田铁山中将，史称\"相泽事件\"，是昭和陆军内部两大派系矛盾以暴力形式爆发的最直接体现。永田之死引发统制派强烈反弹，相泽随即被逮捕，军事法庭审判于1936年初在东京开庭。部分二二六事件参与者担忧审判揭露皇道派网络，亦将尽快发动政变视为迫切之举。1936年7月相泽以杀人罪被处以枪决，时年47岁。"
 CBIO_JAP_asaichi_isobe_desc:0 "1905年生，原陆军步兵中尉，与村中孝次共同起草二二六事件理论纲领的核心人物。1934年以散布批评军部上层文书遭陆军强制除籍，此后以平民身份继续主导青年将校运动的思想整合。1936年2月26日参与政变行动。政变失败被捕后，在狱中写下大量日记与文稿，言辞激烈批判军部上层对叛军的处置，甚至对天皇未支持政变一事公开表达愤懑，措辞之激烈在当时极为罕见，后世研究者将其狱中文字视为理解二二六事件参与者心理的重要原始史料。1937年8月以叛乱罪被处以枪决，时年32岁。"
 CBIO_JAP_shiro_nonaka_desc:0 "1899年生，陆军步兵大尉，二二六事件中统率兵力最多的叛乱部队指挥官。率第3步兵联队约千名士兵占领首相官邸及周边要地，是四日占领期间叛军实际控制区域的核心支柱。事件进行中，野中多次向部下及外界发表声明，阐述\"昭和维新\"主张，以军人对天皇的绝对忠诚为政变行动正当化。2月29日，天皇以叛乱罪明确下令镇压，叛军士兵陆续奉命撤离，野中在部下归顺后拒绝投降，于当日以手枪自杀，时年37岁，是二二六事件中少数死于现场的青年将校之一。"
 CBIO_JAP_kiyosada_koda_desc:0 "1898年生，陆军步兵大尉，二二六事件组织策划层的核心人物，在参与政变的青年将校中资历与年龄均居较高位置。长期参与皇道派青年将校的秘密联络与计划推进工作，是政变方案由讨论走向实施的关键推动者之一。1936年2月26日参与政变行动，率部占领陆军省等要地，担任叛军指挥协调职能。政变失败后被捕，接受秘密军事审判，1936年7月以叛乱罪被处以枪决，时年38岁。二二六事件共处决十九名军官，香田为其中之一，是昭和陆军内部皇道派与统制派长期冲突以最激烈方式收场的历史见证者与牺牲者。"
