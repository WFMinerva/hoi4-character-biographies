 TIB_jamphel_yeshe_gyaltsen_desc:0 "1912年生，西藏热振寺活佛，通常称热振仁波切。第十三世达赖喇嘛圆寂后，热振活佛正式当选为全藏最高统治者——摄政。1935年5月，国民政府册封热振为“辅国普化禅师”称号。1936年后，热振依靠广大藏族同胞的支持，精心治理西藏政教，积极亲近中央政府，改善西藏地方与祖国内地的关系。派人到内地各大城市募捐修葺热振寺，沟通了藏汉之间的往来。热振等拉萨中的僧俗爱国人士反对英帝国主义在拉萨办校、进行文化渗透，引起了英帝国主义分子和西藏少数反动分子的极端不满和仇恨。"
 JAP_emperor_hirohito_desc:0 "逃脱审判的战犯，日本第124代天皇。幼号迪宫，1901年4月29日生于东京赤坂青山御所，1989年1月7日因十二指肠癌卒，在位六十三年，为日本史上在位时间最长的天皇。出生后仅七十天即被寄养于海军中将川村纯义家中，入学习院后先后受“肉弹将军”乃木希典与东乡平八郎督导，自小接受军国主义与帝王教育；乃木自裁殉明治一事给少年裕仁留下深重心理冲击，由此转而笃好生物学，终生从事海洋生物研究，著有《水母的书》等论著。1921年以皇太子身份赴欧考察，途经新加坡时以皇室特权勘测英军防御工事，在巴黎接见永田铁山、冈村宁次等青年武官并获其效忠宣誓；归国后因父皇病重出任摄政；1924年与良子女王成婚；1926年即位，定年号“昭和”。按史学界现有记录，裕仁绝非被动的立宪虚君：1928年亲自迫使田中义一内阁辞职；1931年默许九一八事变，翌年为征服东三省将领亲自授勋；1936年奉敕令在满洲建立七三一细菌化学战部队；同年二·二六叛乱爆发后拍案命令“尽快镇压，尽快”、直接主导平叛；全面侵华后多次亲自干预军事部署，南京陷落当日下诏褒扬将士，放纵朝香宫鸠彦王主导南京大屠杀，并批准大规模化学战；1940年推动三国同盟、批准南进国策；1941年自始深度参与偷袭珍珠港计划并亲批对美开战——东条英机后在东京审判中证称“整个日本军队没有人敢违抗天皇的意志”。战后因美国冷战战略需要免于战犯追诉，1946年元旦发布《人间宣言》放弃神格，1978年靖国神社合祀甲级战犯后拒绝参拜，此后以立宪象征身份延续昭和年号。"
 ENG_stanley_baldwin_desc:0 "1867年生，英国保守党政治家，三度出任首相。1936年前后，鲍德温面对的是一个仍拥有庞大殖民帝国、却在财政、军备和国内舆论上深受一战阴影约束的英国。他主张维持帝国稳定和议会政治秩序，重视逐步重整军备，却不愿过早卷入欧洲和远东冲突。"
 GER_adolf_hitler_desc:0 "1889年生于奥地利布劳瑙，海关官员之子，纳粹党党魁、第三帝国领导人。青年时在维也纳两度报考美术学院落榜，潦倒度日，逐渐形成反犹与泛德意志民族主义思想。一战中他在西线任传令兵，获一、二级铁十字勋章。战后投身慕尼黑右翼政治，1920年起领导纳粹党，1923年发动啤酒馆暴动失败入狱，狱中写就《我的奋斗》，阐述其种族主义与“生存空间”扩张纲领。借助大萧条，纳粹党迅速壮大，1932年成为国会第一大党。1933年1月他被任命为总理，旋即借国会纵火案与《授权法》终结魏玛宪政，取缔他党与工会，建立一党专政；1934年“长刀之夜”清洗政敌，兴登堡死后合并总统与总理职权，自称元首。政权以盖世太保、党卫军、集中营与宣传机器为支柱，1935年《纽伦堡法》剥夺犹太人权利，1938年制造“水晶之夜”。对外他撕毁凡尔赛和约、重整军备、进军莱茵兰，与意、日结盟；1938年承认伪满洲国，召回在华军事顾问团，结束对华军事合作。同年兼并奥地利、取得苏台德，1939年占领捷克全境，8月签订《苏德互不侵犯条约》后于9月1日入侵波兰，引发二战。1941年发动“巴巴罗萨”入侵苏联，年底对美宣战。战争期间他亲自主导对犹太人的“最终解决”，系统屠杀约六百万犹太人，另有大量罗姆人、残障者、苏联战俘与平民遇难。战局恶化后他屡拒撤退、强令死守，1944年七月密谋刺杀失败后展开血腥清洗。1945年4月苏军攻入柏林，30日他在总理府地下掩体与前一日完婚的爱娃·布劳恩一同自杀，遗体被焚，数日后德国无条件投降。"
 SOV_iosif_stalin_desc:0 "1878年生于格鲁吉亚哥里，本名约瑟夫·维萨里奥诺维奇·朱加什维利，早年参加布尔什维克革命活动，多次遭沙俄当局流放。十月革命后历任党政要职，1922年出任联共（布）中央总书记。列宁逝世后，他先后击败托洛茨基、布哈林等党内对手，至1929年前后确立个人领导地位。在其主政期间，苏联推行社会主义工业化与农业全盘集体化，建立重工业体系；但强制集体化、征粮政策与1932—1933年的严重灾荒交织，造成乌克兰、哈萨克等地大饥荒。1936至1938年，大清洗由肃反扩大化演变为大规模政治清洗，大批党政军干部遭处决或流放，严重削弱了红军战斗力。1941年德国入侵后，他出任国防委员会主席兼最高统帅，领导苏联历经莫斯科、斯大林格勒、库尔斯克等关键战役，最终击败纳粹德国。1945年8月又组织对日作战，苏军迅速击溃日本关东军，并在战后扶植东欧各国建立人民民主政权。1953年3月5日因脑溢血病逝于莫斯科。"
 USA_franklin_delano_roosevelt_desc:0 "1882年生，美国民主党政治家，1933年出任总统。罗斯福以新政应对经济大萧条，通过联邦政府干预、公共工程和金融改革重塑美国国内政治。1936年前后，美国社会仍有强烈孤立主义倾向，对欧洲和亚洲危机保持距离，但美国的工业、金融和太平洋利益使其不可能真正置身事外。"
