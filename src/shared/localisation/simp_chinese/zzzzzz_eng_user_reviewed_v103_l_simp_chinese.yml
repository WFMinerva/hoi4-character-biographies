 CBIO_ENG_winston_churchill_desc:0 "二战五大战时领袖之一，绰号“英国斗牛犬”。1874年生于牛津郡布伦海姆宫，出身马尔博罗公爵家族，父为保守党政治家伦道夫·丘吉尔勋爵，母珍妮·杰罗姆是美国人，全名温斯顿·伦纳德·斯宾塞-丘吉尔。早年从军并任战地记者，参加过印度西北边境、苏丹恩图曼之战和布尔战争，在南非被俘后越狱脱险、一举成名。1900年进入下议院，此后数十年间两度往返于保守党与自由党之间，历任海军大臣、军需大臣、殖民地大臣、财政大臣等要职。第一次世界大战期间，他主推达达尼尔／加里波利登陆，惨败后一度去职、亲赴西线带兵。1930年代他长期被排除在政府核心之外，史称其“旷野岁月”，却持续警告德国重整军备的威胁，激烈反对张伯伦的绥靖政策。1940年5月德军西线进攻之际，他出任首相兼国防大臣，就职后首次在下议院宣告“我能奉献的唯有热血、辛劳、眼泪与汗水”，誓言“不惜一切代价争取胜利”。他领导英国度过法国沦陷、不列颠空战和大西洋海战：敦刻尔克撤退后他誓言“我们将在海滩作战……我们绝不投降”（1940年6月4日）；法国崩溃之际，他号召国人挺身担责，“使千年之后人们仍会说：这是他们最光辉的时刻”（6月18日）；不列颠空战中他向皇家空军飞行员致敬——“从未有这么多人，对这么少人，亏欠这么多”（8月20日）。他与罗斯福密电往来时自署“前海军人士”，最终与美国、苏联结成同盟，其演说与斗牛犬般的强硬姿态成为英国坚持作战的重要象征。丘吉尔同样是坚定的帝国主义者，长期反对印度自治，对印度独立运动持敌视态度；1943年孟加拉饥荒造成数百万人死亡，其战时内阁在粮食调配上的决策至今争议极大，他也是战略轰炸德国城市政策的支持者。1942年阿拉曼大捷后，他以“这不是结束，甚至不是结束的开始，但或许是开始的结束”为这场转折定调。1945年大选保守党意外败北、他黯然下野，次年于美国富尔顿发表“铁幕”演说，揭开冷战序幕；1951年再度组阁，1953年受封嘉德骑士、成为“温斯顿爵士”，同年以所著二战史与历史著作荣获诺贝尔文学奖，1955年因健康原因辞职。私下里他嗜雪茄、惯以两指比出“V”字胜利手势，闲暇时在故居查特韦尔庄园作画、亲手砌砖筑墙；1963年获美国国会授予荣誉公民身份，为史上第一人，1965年逝世，获国葬殊荣。"
 CBIO_ENG_stanley_baldwin_desc:0 "1867年生于伍斯特郡，出身钢铁实业家庭，两次世界大战之间英国保守党的核心人物，曾三度出任首相（1923–1924、1924–1929、1935–1937）。1926年5月全国大罢工期间，工会总委员会为声援矿工发动全面停工，鲍德温公开定性此次罢工为对议会民主制度的宪政挑战，拒绝在罢工持续期间进行任何谈判，坚持要求总委员会无条件中止行动方可复谈；九天后总委员会宣告中止。1935年大选以支持国际联盟集体安全为核心主张获胜。1936年，国王爱德华八世坚持迎娶两度离异的美国公民沃利斯·辛普森，鲍德温明确告知国王：政府不会为此婚事提供任何支持，12月10日爱德华八世宣告退位，乔治六世继位。军备方面，于1934年批准皇家空军首批扩编方案，1935年签发“飓风”战斗机设计合同，任内陆续推进多轮扩编计划；然而扩军节奏始终受到内阁财政压力与党内反对意见的制约，鲍德温本人在多个关键节点选择了较为保守的扩军幅度。1936年11月他在议会承认，1933至1934年间他判断选民的反战情绪使得大力推进扩军在政治上不可行，因而主动压低了当时的扩军力度，这一表态此后成为批评者攻击其战前备战不力的核心证据。1937年他让位于内维尔·张伯伦，晋封伯爵，1947年去世。"
 CBIO_ENG_neville_chamberlain_desc:0 "1869年生于伯明翰，出身著名政治世家，1937至1940年的英国首相，绥靖政策最具代表性的执行者。他早年从事市政与实业，曾任卫生大臣和财政大臣，在社会改革与公共卫生立法上颇有建树。1937年继鲍德温出任首相后，他将主要精力投向对德、对意外交，力图通过让步避免新的欧洲大战。1938年9月，他与希特勒、墨索里尼、达拉第签署慕尼黑协定，同意将捷克斯洛伐克的苏台德地区割让给德国，返回伦敦后宣称带来了和平；然而仅数月后德国即吞并捷克斯洛伐克全境，绥靖政策破产。1939年9月德国入侵波兰，张伯伦政府被迫对德宣战；在加紧重整军备的同时，他的战争领导很快遭到质疑。1940年5月挪威战役失利后，他在下议院失去支持，辞去首相职务，由丘吉尔接任，同年因病去世。"
 CBIO_ENG_edward_viii_desc:0 "1894年生于里士满白厅府邸，英国国王，1936年1月即位，同年12月退位，在位不足一年。他以威尔士亲王身份出访自治领与殖民地多年，以亲民、时髦的公众形象积累了极高的民望。即位后他执意迎娶两度离异的美国公民沃利斯·辛普森，内阁、英格兰教会与自治领政府均明确表示无法接受，首相鲍德温告知国王政府不会为此婚事提供任何支持。经过数周协商，爱德华八世拒绝放弃婚事，于1936年12月10日宣告退位，成为英国历史上极少数主动逊位的君主，退位后受封温莎公爵。其后争议主要集中于他对纳粹德国的同情态度：1937年他偕公爵夫人访问德国，与希特勒会面，留下与纳粹高层公开往来的影像记录，令英国政府持续保持警惕。二战爆发后，为使其远离欧洲政局，政府将他派任巴哈马总督，任内政绩平平，对当地劳工纠纷与种族问题的处置也受到批评。战后他长期定居法国，基本退出公共生活，1972年去世。"
 CBIO_ENG_lord_edward_halifax_desc:0 "1881年生于德文郡，出身约克郡贵族世家，英国保守党政治家、外交家，绥靖政策时期的重要人物。他曾任印度副王（总督，1926–1931），任内处理与甘地领导的印度独立运动之间的复杂关系，既有镇压也有谈判，签署过著名的《甘地—艾尔文协定》。1938年起出任外交大臣，是张伯伦对德外交的主要执行者之一，曾亲赴德国与希特勒、戈林等人会谈。1940年5月张伯伦下台时，被普遍视为继任首相的有力人选，论资历甚至比丘吉尔更被看好，但他最终选择退让，由丘吉尔组阁；战时内阁初期，他曾主张探讨与德国谈判的可能，与丘吉尔的强硬立场存在分歧。此后他出任驻美国大使（1941–1946），在争取美国援助和协调英美关系方面发挥了重要作用，1959年去世。"
 CBIO_ENG_oswald_mosley_desc:0 "1896年生，出身贵族，英国法西斯主义运动的核心人物。早年是政坛新星，曾先后以保守党、独立人士和工党身份进入议会，一度被工党视为前途无量的部长级人才。1930年代初，他因激进的经济主张与工党决裂，另组新党，随后彻底转向法西斯主义；1932年，他创立英国法西斯联盟（BUF），组织身着黑衫的准军事队伍，在伦敦东区开展针对犹太社区的活动，于1936年引发了著名的“电缆街之战”，遭到当地居民和左翼力量的强力抵抗。第二次世界大战爆发后，依据防卫条例，莫斯利于1940年被拘押，直至1943年因健康原因获释；战后他仍未放弃极右翼政治，继续从事带有反移民和反犹色彩的活动，但再未取得影响力，1980年在法国去世。"
 CBIO_ENG_harry_pollitt_desc:0 "1890年生于兰开夏郡，出身工人家庭，做过锅炉工，英国共产党的主要领导人，长期担任总书记。他早年即投身工会和工人运动，是英国共产党1920年成立时的重要人物之一，凭借出色的组织能力和群众鼓动才能，成为该党最具代表性的工人领袖，与理论家拉贾尼·帕姆·杜特形成“实干家与理论家”的搭档。波立特对苏联和共产国际总体忠诚，但英国共产党内部路线存在分歧：1939年，他主张支持英国对德作战，与共产国际当时按《苏德互不侵犯条约》定下的“帝国主义战争”路线相冲突，在党内压力下被迫暂时辞去总书记职务；直到1941年德国入侵苏联、共产国际立场逆转后，他才复任。此后他长期领导英国共产党，1956年苏联介入匈牙利引发党内剧烈动荡，他辞去总书记，改任主席，1960年在自澳大利亚返航途中于海上去世。"
 CBIO_ENG_rajani_palme_dutt_desc:0 "1896年生于剑桥，父亲是孟加拉裔医生，母亲是瑞典人，英国共产党最重要的理论家之一，长期被视为该党的首席思想家。这一印度与北欧混合的背景深刻影响了他的政治视野；他在牛津求学期间因反对第一次世界大战、拒服兵役而入狱并被开除。1920年英国共产党成立时他即是发起者之一，1921年创办《劳工月刊》，担任主编长达半个世纪。杜特是英国共产党与共产国际之间的关键纽带，对苏联和斯大林路线高度忠诚，因而被称为“斯大林在英国的喉舌”；他长期负责共产国际对印度共产党的指导工作，其著作以反帝国主义视角剖析资本主义与殖民体系，《今日印度》《法西斯主义与社会革命》等书影响了一代马克思主义者，也影响了印度的民族解放与左翼运动。1939年，正是他依照莫斯科的“帝国主义战争”路线，迫使主张支持对德作战的波立特暂时去职，自己一度出任总书记直至1941年，1974年去世。"
 CBIO_ENG_clement_attlee_desc:0 "1883年生于伦敦，律师家庭出身，英国工党领袖、战后首相。他早年在伦敦东区从事社会工作，目睹贫困而转向社会主义，第一次世界大战中曾在加里波利等战场服役。此后他循市政与议会道路上升，1935年起出任工党领袖。第二次世界大战期间，他加入丘吉尔的联合政府，长期担任副首相，是战时内阁的核心成员之一。1945年工党在大选中大胜，他出任首相，任内推动了英国历史上影响深远的社会变革：建立国民保健服务体系，扩大社会福利，将煤炭、铁路、钢铁等重要产业收归国有。在帝国问题上，他的政府主持了1947年印度和巴基斯坦的独立，标志着大英帝国去殖民化进程的重大转折，此后缅甸、锡兰也相继独立。1951年工党败选后他下野，1955年退出党魁职位，1967年去世。"
 CBIO_ENG_david_lloyd_george_desc:0 "1863年生，在威尔士长大，律师出身，自由党政治家，第一次世界大战后期的英国首相。他早年以激进改革者著称，担任财政大臣期间推动养老金和国民保险等社会立法，奠定了英国福利制度的早期基础。1916年他出任首相，领导英国度过一战最艰难的阶段，直至1918年协约国获胜；战后他作为主要领导人之一出席巴黎和会，参与塑造《凡尔赛和约》。1922年他领导的联合政府垮台，此后再未回到权力核心。1930年代，他对国内经济政策仍有主张，对德国问题的态度则引起争议——他曾于1936年访问德国并会见希特勒，留下过对纳粹德国某些方面的正面评论。他的主要历史功绩属于第一次世界大战时期，1945年去世。"
 CBIO_ENG_john_beckett_desc:0 "1894年生，英国政治人物，法西斯分子。一战时曾在军中服役，战后投身工党，1924年当选下议院议员，是当时工党最年轻的议员之一，早年与后来的首相艾德礼关系密切，以言辞犀利、行事叛逆著称。1930年代初他对议会政治彻底失望，1934年加入莫斯利的英国法西斯联盟，出任宣传主管，主编其机关报。1937年他与莫斯利决裂，转而与威廉·乔伊斯共同创立“国家社会主义者同盟”，立场更趋极端、反犹色彩更浓；值得一提的是，他本人有犹太血统的母亲，却终生隐瞒并公开宣扬反犹主张。第二次世界大战期间，他依据防卫条例被拘押，是被关押时间最长的英国法西斯分子之一，1943年因健康原因获释。战后他的政治影响力已基本消失，1964年去世。"
 CBIO_ENG_philip_kerr_desc:0 "1882年生于伦敦，出身贵族世家，即第十一代洛锡安侯爵，英国政治家、外交家与帝国思想的代表人物。他早年在南非参与殖民行政，是“米尔纳幼儿园”成员之一，回国后与他人共同创办圆桌集团及其刊物《圆桌》，鼓吹将大英帝国改造为联邦式结构的“帝国联邦”理念。第一次世界大战期间，他任首相劳合·乔治的私人秘书，参与巴黎和会，参与起草《凡尔赛和约》战争罪责条款。1930年代他是绥靖政策的重要支持者，强调凡尔赛体系对德国的苛刻和苏联共产主义的威胁。1939年起他出任驻美国大使，在争取美国舆论与援助、为后来的《租借法案》铺路方面成效显著，1940年在华盛顿任上去世。"
 CBIO_ENG_nevile_henderson_desc:0 "1882年生，英国职业外交官，以绥靖时期出任驻德国大使而为人所知。他长期在外交界任职，先后在多国使馆服务，1937年出任驻柏林大使，正值英德关系日趋紧张之际。在任期间，他是张伯伦对德外交的前线执行者，频繁与希特勒及纳粹高层接触，力图通过谈判和让步维持和平，包括在苏台德危机和慕尼黑会议期间充当沟通渠道；他对纳粹德国的判断后来被广泛批评为过于乐观。1939年9月德国入侵波兰后，他向德方递交了英国的最后通牒，随后英国对德宣战，他也奉调回国。他著有回忆录为自己的对德外交辩护，1942年因病去世。"
 CBIO_ENG_maxwell_aitken_desc:0 "1879年生于加拿大，即第一代比弗布鲁克男爵，报业巨头与战时政府要员。他早年在加拿大经商致富，迁居英国后进入政界并买下《每日快报》，将其打造为英国发行量最大的报纸之一，建立起庞大的报业帝国，长期以媒体影响公众舆论和政治。他是丘吉尔的密友与政治盟友。第二次世界大战期间，他在丘吉尔政府中出任飞机生产大臣，在不列颠空战前后主持战斗机的紧急增产，对维持英国空军的飞机供应发挥了重要作用；此后他还担任过供应大臣等职，参与战时军工动员和对苏援助事务。他在政府内以雷厉风行和不拘程序著称，也因此屡与官僚体系发生摩擦，1964年去世。"
 CBIO_ENG_leslie_hore_belisha_desc:0 "1893年生，英国自由党—国民派政治家，出身西班牙裔犹太移民家庭，幼年丧父，由母亲抚养成人，后就读于克利夫顿学院，并在牛津大学埃克塞特学院完成学业，曾参加第一次世界大战。他从政后加入自由党并随国民联合政府阵营转为自由国民党，历任多个内阁职务，以交通大臣任内推动道路安全立法知名，伦敦街头供行人过街的“贝利沙灯”即以他命名。1937年出任陆军大臣，着手推动陆军现代化与机械化改革，扩充兵员、改善士兵待遇、提拔较年轻的军官，但其改革风格和对传统军方高层的冲击引发了与将领们的激烈矛盾。1940年初他在与军方的持续紧张关系中被免去陆军大臣职务。1957年去世。"
 CBIO_ENG_ernest_bevin_desc:0 "1881年生，出身贫寒，幼年丧母、少年即做工，英国工会领袖与工党政治家。他没有受过多少正规教育，凭借组织才能在工会运动中崛起，一手缔造了规模庞大的运输与普通工人工会（TGWU），成为两次大战之间英国工会运动最有权势的人物之一。第二次世界大战期间，丘吉尔联合政府任命他为劳工与国民兵役大臣，他全面负责战时劳动力的动员与调配，对支撑英国的战争生产发挥了关键作用。1945年工党执政后，他出任外交大臣，在战后初期的国际格局中主张对苏强硬，推动英国参与北约的创建，是冷战初期西方阵营的重要塑造者之一，也深度参与了战后欧洲重建与巴勒斯坦等帝国善后问题。1951年去世。"
 CBIO_ENG_mary_sophia_allen_desc:0 "1878年生于加的夫，铁路高级职员家庭出身，英国女警先驱，后转向法西斯主义。她早年投身妇女参政运动，是潘克赫斯特领导的妇女社会政治同盟（WSPU）的活跃成员，曾因砸窗等抗争行动多次入狱、进行绝食并遭强制灌食。第一次世界大战爆发后，她参与创建英国最早的女警组织之一，长期担任领导职务，致力于推动妇女进入警务工作，并多次赴国外讲学、传授女警训练经验。1930年代，她的政治立场急剧右转：1934年她会见希特勒，对纳粹德国“恢复秩序”的做法公开表示赞赏，随后加入莫斯利的英国法西斯联盟，为其刊物撰稿，并组织带有反共色彩的“妇女后备队”。第二次世界大战期间，她因与德国的可疑联系受到怀疑，住所遭搜查，当局一度考虑将其拘押但未执行，1964年去世。"
 CBIO_ENG_george_orwell_desc:0 "1903年生于英属印度，本名埃里克·阿瑟·布莱尔，英国作家、记者与社会批评家，“奥威尔”为其笔名。他在英国受教育，毕业于伊顿公学，1922至1927年间在缅甸服务于英印帝国警察，亲历殖民统治的运作，这段经历使他对帝国主义产生深刻的反感，后写成小说《缅甸岁月》和《射象》《绞刑》等散文。辞去警职返英后，他长期体验贫困生活并转向社会主义。1936年底，他奔赴西班牙参加内战，加入马克思主义统一工人党（POUM）民兵作战，喉部中弹负伤；西班牙内战中亲见共产党派系的内斗与清洗，使他在坚持社会主义的同时坚定反对极权与斯大林主义。第二次世界大战期间他在英国从事写作和广播工作，战后以《动物农场》和《一九八四》两部作品确立其反极权文学的世界声誉，1950年因肺结核去世。"
 CBIO_ENG_sylvia_pankhurst_desc:0 "1882年生于曼彻斯特，出身著名的潘克赫斯特政治家庭，英国妇女参政运动活动家、社会主义者与反殖民主义者。她是妇女社会政治同盟领袖埃米琳·潘克赫斯特之女，早年投身争取妇女选举权的斗争，多次入狱、绝食并遭强制灌食；但她逐渐与母亲和姐姐的路线分歧，将妇女参政与工人阶级、反战和社会主义事业结合，在伦敦东区从事基层组织工作。第一次世界大战期间她持反战立场，战后一度同情共产主义运动，后又与之疏远。1930年代，她成为坚定的反法西斯主义者，强烈反对意大利对埃塞俄比亚的侵略，长期声援埃塞俄比亚独立事业，并投身反殖民与人道活动。晚年她移居埃塞俄比亚，1960年在亚的斯亚贝巴去世。"
 CBIO_ENG_stewart_menzies_desc:0 "1890年生，英国情报官员，第二次世界大战期间长期担任秘密情报局（军情六处，MI6）局长。他出身上层家庭，一战中曾在军中服役并转入情报工作，战间期在情报系统内逐级上升，1939年出任军情六处负责人，任职至1952年。在他主持下，军情六处统辖英国对外秘密情报工作，并与设在布莱切利园的政府密码学校保持密切关系——后者破译德国“恩尼格玛”密码的成果（即“超级机密”情报）经由他的渠道呈送丘吉尔等最高决策层。他在协调情报分发、保护破译来源等方面发挥了枢纽作用。1968年去世。"
 CBIO_ENG_alan_turing_desc:0 "1912年生于伦敦，英国数学家、逻辑学家，计算机科学与人工智能的先驱之一。1936年他提出后来被称为“图灵机”的抽象计算模型，为现代计算理论奠定了基础。第二次世界大战期间，他在布莱切利园从事密码破译工作，是攻克德国“恩尼格玛”密码的核心人物之一：他改进并设计了用于破译的机电装置“炸弹机”（Bombe），大幅提升了破译效率，对大西洋海战等战场的情报支援意义重大；但破译工作是布莱切利园数千名人员协作的成果，并非一人之功。战后他在计算机设计和数学生物学等领域继续开展开创性研究。1952年，他因同性恋行为被定罪——当时英国法律仍将其视为犯罪——被迫接受激素处理，事业和生活遭受沉重打击。1954年他去世，普遍认为是自杀；多年后英国政府就对他的迫害正式道歉并予以赦免。"
 CBIO_ENG_alan_brooke_desc:0 "1883年生，出身阿尔斯特裔的布鲁克家族，英国陆军元帅，第二次世界大战期间长期出任帝国总参谋长（CIGS），是英国战时最高军事战略的核心人物。他炮兵出身，一战中在西线以炮兵战术见长。二战初期，他在法国指挥过军级部队并参与敦刻尔克撤退前的殿后，随后负责英国本土防务。1941年底起出任帝国总参谋长，直至战争结束，是丘吉尔最重要的军事顾问，也是少数能持续对丘吉尔的战略冲动加以约束和制衡的人之一。他主持英国陆军的全局战略，深度参与盟军联合参谋体系的运作，在与美方协调“先欧后亚”战略、筹划地中海和西欧作战等重大问题上发挥了关键作用。他常年记录的战时日记，战后成为研究英国战争决策的重要史料，1963年去世。"
 CBIO_ENG_bernard_montgomery_desc:0 "1887年生于伦敦肯宁顿，父亲为圣公会主教，童年随家迁居塔斯马尼亚，后返回英国就读桑赫斯特皇家军事学院，绰号“蒙蒂”，是第二次世界大战中英国最广为人知的将领。第一次世界大战中他在西线身负重伤，此后数十年间钻研步兵战术与训练体系，以对部队战备状态的极度重视和对下属的严苛要求见称，1940年敦刻尔克撤退期间指挥第三步兵师保全建制。1942年8月他临危受命出任第八集团军司令，抵达北非后即整顿士气，明令禁止制定任何撤退预案，宣称“我们将在此地作战，若被击退则在此地战死”；同年10至11月阿拉曼战役中，他以步炮协同攻势击溃隆美尔的德意装甲部队，扭转北非战局，隆美尔此后在回忆录中承认他是整场北非战役中遭遇的最难对付的英国指挥官。此后他指挥第八集团军参与西西里和意大利登陆，1944年诺曼底登陆中出任盟军地面部队总指挥，随后率第二十一集团军群转战西北欧北翼；同年9月他主导“市场花园”行动，意图夺取荷兰多座桥梁强渡莱茵河，地面装甲纵队推进迟滞，空降阿纳姆的英国第一空降师陷入合围，行动宣告失败，是其指挥生涯中争议最大的一役。他作风自信强硬，惯于在媒体前塑造个人形象，与美国将领巴顿、布莱德利摩擦不断，艾森豪威尔曾私下称他是整场战争中最难共事的下属；丘吉尔公开评价其人：“败而不馁，胜而难耐。”史学界对他的评价长期分歧：批评者指其进攻节奏迟缓、“市场花园”决策过于冒进，支持者则强调他极度重视保存士兵生命、战役筹划严密。战后出任帝国总参谋长，1976年去世。"
 CBIO_ENG_claude_auchinleck_desc:0 "1884年生，长期服务于英印军队，英国陆军元帅，二战中两度出任中东英军总司令。1941年出任中东总司令，统辖北非及周边广阔战区；同年下半年发动“十字军”行动一度解托布鲁克之围，但1942年战局逆转，托布鲁克失守，第八集团军退至阿拉曼。在第一次阿拉曼战役中，他亲自接掌第八集团军指挥，稳住了通往埃及的防线，但因未能迅速转入反攻，于1942年8月被丘吉尔解除中东总司令职务。1943年起他再度出任印度英军总司令，负责对缅甸等战区的后方支援、训练和补给体系。印巴分治期间，他出任印度与巴基斯坦两国武装力量的最高统帅，主持英印军队按教派分割的善后工作，1981年去世。"
 CBIO_ENG_neil_ritchie_desc:0 "1897年生于英属圭亚那，苏格兰裔，英国陆军将领。一战中他在法国和美索不达米亚战场作战并获勋。第二次世界大战初期，他在法国任阿兰·布鲁克麾下的参谋长，亲历敦刻尔克撤退。1941年11月，因前任坎宁安在“十字军”行动中被解职，他被中东总司令奥金莱克临危任命为第八集团军代理司令，但其资历低于麾下两位军长，实际指挥受到掣肘。1942年5至6月的加查拉战役中，他未能有效统御部队，第八集团军被隆美尔击败，托布鲁克失守，约三万余名英军被俘；同年6月25日他被奥金莱克解除指挥。此后他返回英国、降级使用，重新获得信任后于1944年指挥第十二军参加诺曼底登陆及西北欧战局，1983年去世。"
 CBIO_ENG_alan_cunningham_desc:0 "1887年生，英国陆军将领，海军元帅安德鲁·坎宁安之弟。他炮兵出身，第二次世界大战初期在东非战场指挥作战，1941年率英军及殖民地部队在东非战役中击败意大利军队，攻入意属索马里和埃塞俄比亚，一度声望甚高。同年8月，他被擢升出任新组建的第八集团军司令，11月在北非发动“十字军”行动；但面对隆美尔的机动反击，他在装甲战的指挥中陷入被动，对战局趋于悲观，主张收缩，遂于行动期间被中东总司令奥金莱克解职，由里奇接替。此后他未再获得一线野战指挥，转任本土与训练职务，战后曾出任巴勒斯坦最后一任高级专员，1983年去世。"
 CBIO_ENG_william_slim_desc:0 "1891年生于布里斯托，出身铁制品批发商家庭，一战中在加里波利和美索不达米亚两度负伤，此后长期在英印军队服役，积累了指挥多民族部队的丰富经验。1942年日军席卷缅甸，他临危受命出任缅甸军军长，在极端不利的条件下将撤退组织得井然有序，最终保全建制撤回印度。撤退途中，他与史迪威统率的中国远征军第五军、第六军在同一战区并肩转战；1942年4月仁安羌一役，被日军合围于油田的英印官兵陷入绝境，中国远征军第三十八师一一三团奉命驰援，击破包围解救英印官兵及平民逾万人，斯利姆在回忆录《转败为胜》中高度称赞孙立人部队的战斗力。回到印度后他出任第十四集团军司令，重建部队战力；1944年英帕尔和科希马战役中，他以防守反击的预设计划挫败日军倾全力发动的入侵，此役是日本陆军历史上最惨重的单次地面战败。随后他转入反攻，以大胆的机动欺敌——以曼德勒为佯攻目标、以突袭敏铁拉补给中心为实际攻击点——将日军主力引入两面夹击的死地，1945年5月攻占仰光。反攻阶段，他的第十四集团军与史迪威从印度方向统率的中国驻印军、从云南渡过怒江西进的中国远征军Y部队形成三路钳击之势，共同打通了自印度经缅甸通往中国的陆上补给线。虽然战功赫赫，但他所率领的第十四集团军长期被称为“被遗忘的军团”，斯利姆本人在战争大部分时间也不受丘吉尔器重。战后出任帝国总参谋长，打破了历任总参谋长须出身英国陆军的惯例，后任澳大利亚总督，1956年出版回忆录，1970年去世。"
 CBIO_ENG_richard_oconnor_desc:0 "1889年生，英国陆军将领，北非战场早期英军最成功的指挥官之一。一战中他在西线作战并获勋。第二次世界大战初期，他在北非指挥西部沙漠部队，1940年底至1941年初发动“罗盘行动”，以少胜多大破入侵埃及的意大利军队，迅速攻入昔兰尼加，俘获大批意军，是英国在战争初期少有的重大胜利。然而1941年4月，在隆美尔的德意非洲军团反扑期间，他在前线侦察时连同另一名将领一同被德军俘虏，此后在意大利战俘营关押数年，1943年意大利停战后越狱脱险。归队后，他于1944年指挥第八军参加诺曼底战役及西北欧作战，战后曾任驻印度部队的高级职务，1981年去世。"
 CBIO_ENG_william_platt_desc:0 "1885年生，英国陆军将领，第二次世界大战中东非战场的主要指挥官之一。他长期在英印及殖民地军队体系中服役，战争爆发时任苏丹防卫军司令。1940至1941年的东非战役中，他指挥英军及殖民地、印度部队从苏丹方向南下，向意属厄立特里亚推进，在克伦（Keren）一带与意大利军队进行了激烈而艰苦的山地攻坚战，最终突破意军防线，为盟军肃清意属东非、收复埃塞俄比亚奠定基础。此后他长期出任东非地区英军总司令，负责该地区的防务与殖民地军队事务，1975年去世。"
 CBIO_ENG_george_giffard_desc:0 "1886年生，英国陆军将领，职业生涯长期与非洲殖民地军队和远东战场相关。他早年在西非殖民地部队服役，第二次世界大战期间先后担任西非和东非方向的军事指挥与组织职务，负责殖民地部队的动员与训练。1943年起，他出任驻缅甸—印度方向的集团军群级指挥官，统辖在缅甸对日作战的英联邦地面部队，是斯利姆第十四集团军的上级指挥层之一，参与了缅甸反攻的筹划与后方组织工作。1944年缅甸战役期间他去职，未再担任一线要职，1964年去世。"
 CBIO_ENG_harold_alexander_desc:0 "1891年生，出身爱尔兰贵族家庭，英国陆军元帅，第二次世界大战中盟军最重要的战区指挥官之一。一战中他在西线作战。1940年法国战役中，他负责指挥英国远征军在敦刻尔克的最后撤退阶段，是最后撤离的英军高级军官之一。1942年他出任缅甸方向的指挥，主持了日军进攻下英印军队撤出缅甸的行动；同年调任中东总司令，与蒙哥马利搭档主管北非战区，统筹阿拉曼战役后的全局。此后他出任地中海战区盟军地面部队总司令，指挥西西里登陆和漫长的意大利战役，1944年晋升元帅并出任地中海战区盟军最高司令。战后他出任加拿大总督，并曾任国防大臣，1969年去世。"
 CBIO_ENG_jackie_smyth_desc:0 "1893年生，英国陆军将领，一战中因在西线的英勇表现而获维多利亚十字勋章。第二次世界大战期间，他在缅甸战场任师级指挥官：1942年日军进攻缅甸时，他指挥印度第十七师在锡当河（Sittang）一带防御，面对日军的快速突进，部队在锡当河大桥被迫提前炸桥，大量官兵被隔在对岸，损失惨重，他本人随后因健康和指挥争议被解除职务。退役后他转入新闻与写作，并长期从事议会与公共事务，著述颇丰，1983年去世。"
 CBIO_ENG_thomas_jacomb_hutton_desc:0 "1890年生于诺丁汉郡诺丁汉，就读于罗塞尔学校，后入伍尔维奇皇家军事学院，1909年以少尉军衔加入皇家野战炮兵团。一战期间他随部队登陆法国，在西线全程服役，1915年晋升上尉，多次在战报中被提及嘉奖，并获军事十字勋章。1936年赴巴勒斯坦参与镇压阿拉伯起义，1938年晋升少将出任印度独立军区指挥官。二战爆发后他先后出任印度总司令部副总参谋长和总参谋长，1942年初出任缅甸英军司令。1941年底至1942年初日军进攻缅甸，他负责组织仰光方向的防御；在日军迅猛攻势和力量悬殊的形势下，缅甸防线迅速恶化，他随即被亚历山大接替指挥。此后他主要从事后方和组织性工作，未再担任一线野战指挥，1981年去世。"
 CBIO_ENG_arthur_percival_desc:0 "1887年生于赫特福德郡，英国陆军将领，以1942年新加坡陷落时的投降而载入史册。一战中他在西线多次负伤并获勋，战间期循参谋与军职稳步上升。1941年他出任驻马来亚英军总司令。同年12月日军在山下奉文指挥下进攻马来亚，凭借快速机动和制空、制海优势节节推进；珀西瓦尔指挥的英联邦部队虽人数占优，却装备不足、训练欠缺、协同混乱，被迫一路南撤。1942年1月底，他将部队撤至新加坡岛；2月日军登陆后，在水源、弹药告急的局面下，他于2月15日向日军投降，约十三万英联邦军人成为战俘，这是英国军事史上规模最大的一次投降，沉重打击了英国在远东的威望。此后他被日军关押于台湾、东北等地，直至战争结束，1966年去世。"
 CBIO_ENG_merton_beckwithsmith_desc:0 "1890年生，英国陆军将领，第二次世界大战中率部增援新加坡。他出任英国第十八师师长，该师为驰援马来亚战局而仓促调来，1942年初抵达新加坡时，战局已濒临崩溃。2月8日日军登陆新加坡岛后，由于守军整体的防御部署，第十八师未及充分投入作战，珀西瓦尔即于2月15日宣布投降，他与全师一同成为日军战俘。同年8月，他与珀西瓦尔等高级军官一道被转送至台湾，1942年11月在台湾的战俘营中因白喉病去世，战后遗骸迁葬于香港的盟军公墓。"
 CBIO_ENG_henry_pownall_desc:0 "1887年生，英国陆军将领，二战期间主要担任高级参谋与指挥协调职务。他长期在参谋系统任职，1940年法国战役期间出任英国远征军参谋长，协助戈特指挥撤退事务。1941年底，他被派往远东，接替布鲁克-波帕姆出任远东英军总司令，正值日军全面进攻马来亚、香港之际；随着盟军成立美英荷澳联合司令部（ABDA），他转任韦维尔麾下的参谋长。此后他在地中海、东南亚等战区继续担任高级参谋职务，包括出任蒙巴顿东南亚司令部的参谋长，1961年去世。"
 CBIO_ENG_john_vereker_desc:0 "1886年生，即第六代戈特子爵，英国陆军元帅，一战中因多次英勇表现而获维多利亚十字勋章等多枚勋章。第二次世界大战爆发时，他出任英国远征军总司令，率部赴法国与德军作战。1940年5月德军突破西线，英法防线崩溃，他在危急中当机立断，放弃既定的反攻计划，下令英国远征军向敦刻尔克方向撤退，使三十余万英法部队得以从海上撤回英国，保存了英国陆军的基干力量。此后他未再获得一线野战指挥，先后出任直布罗陀总督和马耳他总督，在马耳他遭受轴心国长期围攻和空袭的艰难时期主持该岛防务，1946年去世。"
 CBIO_ENG_henry_wilson_desc:0 "1881年生，英国陆军元帅，第二次世界大战中在中东和地中海战区多次出任高级指挥职务。他1939至1940年任巴勒斯坦和约旦河地区指挥官，其后历任埃及英军司令、希腊英军指挥、中东总司令，1944年起出任地中海盟军最高司令，协调跨越多个战区的盟国地面、海、空作战行动；战后曾出任英国驻华盛顿军事代表，参与英美战略协调，1964年去世。"
 CBIO_ENG_william_gott_desc:0 "1897年生，英国陆军将领，绰号“斯特拉弗”（Strafer），长期在北非沙漠战中担任旅、师及军长职务，以擅长机动沙漠作战而受到赏识。1942年8月，他被丘吉尔任命接掌第八集团军司令，然而赴任途中所乘运输机在西部沙漠上空遭德军战机击落，他在坠机中阵亡，由蒙哥马利接替其职务，1942年去世于任命发布数日之内。"
 CBIO_ENG_jock_campbell_desc:0 "1894年生，英国陆军将领，以北非沙漠战中的英勇行动而著称。1941年11月“十字军”行动期间，他在西迪雷泽赫战役中亲率步炮混合纵队反击德军装甲部队，以个人身先士卒的方式激励部队在极端不利的情况下坚持作战，因此获授维多利亚十字勋章；此后晋升为第七装甲师师长，1942年2月在埃及因车辆事故意外身亡。"
 CBIO_ENG_oliver_leese_desc:0 "1894年生，英国陆军将领，历任北非、意大利及东南亚战场要职。他在蒙哥马利麾下出任第三十军军长，参与阿拉曼战役和西西里、意大利登陆；1944年蒙哥马利调往西北欧后，他接任第八集团军司令指挥意大利战局。1945年他升任东南亚战区盟军陆军总司令，随后尝试解除斯利姆第十四集团军司令职务，此举遭蒙巴顿否决并被迫去职，1978年去世。"
 CBIO_ENG_miles_dempsey_desc:0 "1896年生，英国陆军将领，第二次世界大战中任第二集团军司令，是蒙哥马利麾下西北欧战场的主要作战执行者。1944年诺曼底登陆期间，他率第二集团军负责英军战区的登陆和突破，与美国第一集团军并肩推进；此后经比利时、荷兰一路向东，直至进入德国。他以低调务实、协调能力强著称，与盟军美方将领的关系相对顺畅，1969年去世。"
 CBIO_ENG_brian_horrocks_desc:0 "1895年生，英国陆军将领，北非及西北欧战场的重要军长级指挥官。他在北非历任军长职务，1943年于突尼斯遭德军战机空袭，身负重伤后长期休养。1944年复出后接掌第三十军，参与诺曼底战役及低地国家的推进；同年9月“市场花园”行动中，他负责率地面装甲部队自南向北推进以接应空降部队，但推进受阻未能及时抵达阿纳姆，行动宣告失败。战后他以通俗讲解战史的系列电视节目在英国广为人知，1985年去世。"
 CBIO_ENG_archibald_wavell_desc:0 "1883年生，英国陆军元帅，第二次世界大战中先后担任多个关键战区指挥职务。1939至1941年他任中东英军总司令，发动并指挥了“罗盘行动”，以少胜多击败入侵埃及的意大利军队；然而德军非洲军团出现后战局逆转，加之他同时被要求向希腊派兵，兵力分散导致北非战局恶化，希腊和克里特岛相继失守，随即被丘吉尔解除中东职务。1942年初他出任美英荷澳联合司令部最高司令，面对日军全面进攻东南亚的压境形势，联合司令部在数周内即告解散，他随后复任印度总司令，承担缅甸撤退后印度防御与重建工作。1943年起他出任印度总督，任内爆发了1943年孟加拉大饥荒，造成数百万人死亡。1950年去世。"
 CBIO_ENG_thomas_moore_desc:0 "1920年生于约克郡基思利，战争爆发前正在接受土木工程训练，随即应征入伍，加入威灵顿公爵团第八营，后转入皇家装甲军担任坦克指挥官。他以第十四集团军成员身份赴缅甸若开地区作战，在丛林中驾驶摩托车为前线坦克部队引路侦察，期间罹患登革热，1945年初返回英国，此后以上尉军衔退役。战后他转入建筑行业，出任混凝土公司董事总经理，业余时间长期从事摩托车竞赛。"
 CBIO_ENG_edmund_ironside_desc:0 "1880年生于爱丁堡，即第一代艾恩赛德男爵，英国陆军元帅，第二次世界大战初期任帝国总参谋长。他早年参加布尔战争和第一次世界大战，1918至1919年率英国干涉军赴俄国阿尔汉格尔斯克作战，与布尔什维克军队正面交锋。二战爆发后他出任帝国总参谋长，但1940年5月德军突破西线、法国战役危机期间，他在战略协调上未能发挥足够的主导作用，随即被狄尔接替。此后他转任本土军总司令，主持英格兰海岸和内陆的反入侵防御工事规划，所建反坦克障碍线后来被称为“艾恩赛德防线”；同年7月去职并晋封男爵，1959年去世。"
 CBIO_ENG_kenneth_anderson_desc:0 "1891年生，英国陆军将领，以北非突尼斯战局中的指挥而为人所知。“火炬行动”盟军登陆法属北非后，他于1942年11月出任英国第一集团军司令，率部从阿尔及利亚方向向东推进，与从利比亚西进的第八集团军形成对德意军队的两面夹击。突尼斯战局历时半年余，在山地地形、恶劣天气和德意军顽抗下推进艰难，其作战风格以稳健保守为主，与美方盟军指挥官之间也曾存在摩擦；1943年5月盟军最终迫使约二十五万德意军队投降。战局结束后他未再获主要战区指挥，转任本土军务职务，1959年去世。"
 CBIO_ENG_james_fownes_somerville_desc:0 "1882年生于韦茅斯,英国皇家海军元帅,第二次世界大战中最重要的舰队指挥官之一。1897年以海军学员身份入伍，一战期间专精无线电通讯，以舰队无线电官身份参与达达尼尔海峡战役并推动主力舰队的无线电火控改造，因功获授杰出服务勋章。战后他历任舰队指挥与信号部门要职，1939年因健康原因列入退役名单，二战爆发后被召回从事海军雷达研发工作，并在1940年5月敦刻尔克撤退期间主动请缨赴多佛协助拉姆齐上将组织撤运，被认为是加速皇家海军实用化雷达部署的重要推手。1940年7月，奉丘吉尔内阁之命,他向停泊于米尔斯克比尔(奥兰)的法国舰队发出最后通牒,要求对方加入英军或自行凿沉,法方拒绝后他下令炮击,法国水兵伤亡逾千人;此举出于防止舰队落入德国手中的战略考量,但对英法关系造成深重的裂痕,萨默维尔本人对这一命令深感不安。此后他参与了1941年5月追击俾斯麦号等行动。1942年起他调任印度洋东方舰队司令,面对日本南云舰队的印度洋突袭,他审慎避免以劣势兵力正面交锋,保存了舰队实力。1944年起出任英国驻美海军代表团团长,协调英美海军合作,1949年去世。"
 CBIO_ENG_henry_harwood_desc:0 "1888年生，英国皇家海军上将，以1939年12月的拉普拉塔河海战而为人所知，这是第二次世界大战开始后英国海军的首场重大胜利。他指挥“阿贾克斯”号、“阿喀琉斯”号和“埃克塞特”号三艘巡洋舰，在南大西洋拦截德国袖珍战列舰“施佩伯爵”号；经过交战，三舰均受损但迫使德舰驶入中立港口蒙得维的亚，此后德国舰长在外交期限届满前命令舰船自沉，避免投降。哈伍德因此役封爵晋升，声名大振。1942年他短暂出任地中海舰队总司令，正值马耳他补给线压力极大、海军损失严峻之际；他在任内健康持续恶化，被迫返国休养，未再出任主要一线指挥职务，1950年去世。"
 CBIO_ENG_andrew_cunningham_desc:0 "1883年生于都柏林，英国皇家海军元帅，第二次世界大战中最杰出的英国海军将领之一，人称“ABC”。他1939年起出任地中海舰队总司令，在战争最艰难阶段长期主持地中海方向的作战。1940年11月，他策划并执行塔兰托海战，指挥舰载机夜袭意大利海军基地，击沉击伤多艘意大利战列舰，以极小代价重创意大利海军主力，成为以舰载航空兵攻击港内主力舰的早期经典，后来日本海军在筹划偷袭珍珠港时将此役作为参考案例之一。1941年3月，他在马塔潘角海战中歼灭意大利重巡洋舰编队。1942年起他出任盟军“火炬行动”的海军总指挥，此后回国担任第一海务大臣（海军参谋长），主持英国最高海军决策直至战争结束，1963年去世。"
 CBIO_ENG_bruce_fraser_desc:0 "1888年生，英国皇家海军元帅，第二次世界大战中的重要舰队指挥官。1943年他出任本土舰队总司令，同年12月26日在北角海战中指挥英国舰队以优势兵力伏击并击沉德国战列巡洋舰“沙恩霍斯特”号，此役是二战中战列舰对决的最后阶段之一，对保障北极航线的盟军补给船队安全具有重要意义。1944年底他出任英国太平洋舰队（BPF）总司令，率英国舰队参与对日本本土及周边岛屿的联合作战，包括冲绳战役期间的任务群行动；英国航母的装甲飞行甲板在抵御日本神风特攻队的攻击中颇具优势。战后他出任第一海务大臣，1981年去世。"
 CBIO_ENG_john_tovey_desc:0 "1885年生，英国皇家海军上将，第二次世界大战中任本土舰队总司令（1940–1943）。1941年5月，德国战列舰“俾斯麦”号突入大西洋并击沉“胡德”号战列巡洋舰，举国震动，他随即统筹调度本土舰队大规模追猎，历经数日搜索，最终由水面舰炮击于1941年5月27日将“俾斯麦”号击沉。此外，他在任期间主持了向苏联输送军需物资的北极船队护航任务，船队在严酷天气和德国海空军双重威胁下持续出航；1942年7月PQ-17护送队在海军部命令下被迫分散，大批商船遭击沉，损失惨重。1943年他被弗雷泽接替，1971年去世。"
 CBIO_ENG_bernard_rawlings_desc:0 "1889年生，英国皇家海军将领，第二次世界大战期间在地中海及太平洋两个战区担任要职。他在地中海战役阶段先后在安德鲁·坎宁安麾下历任舰队指挥职务，参与了爱琴海及地中海的作战和护航行动。1944至1945年，他作为英国太平洋舰队副司令，实际统辖英国主力战斗舰队（第一舰队），在对日本本土周边和冲绳的盟军攻势中承担海上指挥，与美军第五舰队协同行动，是英国海军参与太平洋战争最终阶段的核心指挥人物之一，1962年去世。"
 CBIO_ENG_john_cunningham_desc:0 "1885年生，英国皇家海军元帅。1942至1943年间，他出任盟军地中海东部（黎凡特）海军指挥官，统辖地中海东部和爱琴海方向的皇家海军力量，参与马耳他补给线和北非东段的海上支援。1943年起他接替安德鲁·坎宁安出任地中海舰队总司令，统率盟国地中海海军参与西西里、意大利登陆及地中海后续清场行动，战后历任海军参谋长等要职，1962年去世。"
 CBIO_ENG_charles_forbes_desc:0 "1880年生，英国皇家海军上将，第二次世界大战初期任本土舰队总司令（1938–1940）。战争爆发时他统辖英国在北大西洋和北海的主要水面战斗力量，负责对德国的海上封锁和北海防务。1940年4至6月挪威战役期间，他指挥本土舰队支援盟军的挪威作战，但在德国空军制空权压制和德国海军布雷阻截下，皇家海军遭受相当损失，英军最终撤出挪威。1940年底他被托维接替，转任普利茅斯港务指挥职务，1943年退役，1960年去世。"
 CBIO_ENG_algernon_willis_desc:0 "1889年生，英国皇家海军将领，第二次世界大战期间主要服务于地中海舰队体系，长期在安德鲁·坎宁安统率下任职。他先后指挥第18巡洋舰队等舰队单位，参与了地中海多项重要作战和船队护航任务，包括在德意空军和潜艇双重威胁下艰难进行的马耳他补给护航行动。1942年底“火炬行动”后他参与地中海西段作战协调，意大利投降后参与接受意大利舰队投降的相关事务；战后历任海军要职，1976年去世。"
 CBIO_ENG_arthur_power_desc:0 "1889年生，英国皇家海军将领，第二次世界大战后期及战后在印度洋和东南亚战区担任要职。他在战争中期先服务于地中海舰队，后转任东印度站司令（1944–1946），统辖印度洋及东南亚方向的英国海军力量，负责支援缅甸战役期间的海上补给线，参与英军收复仰光的两栖作战行动，并协调与蒙巴顿东南亚盟军最高司令部的海上行动配合。战后他出任地中海舰队总司令，1960年去世。"
 CBIO_ENG_raymond_briggs_desc:0 "1905年生，英国陆军将领，装甲战术专业军官。第二次世界大战中他在北非战场出任英国第一装甲师师长，参与1942年阿拉曼战役的关键阶段；该师在蒙哥马利统筹的联合兵种框架下承担突破德意防线的装甲突击任务，是第八集团军主攻方向上的核心力量之一。1985年去世。"
 CBIO_ENG_james_somerville_desc:0 "1882年生，英国皇家海军元帅，第二次世界大战中最重要的舰队指挥官之一。1940至1942年，他指挥驻直布罗陀的H舰队，执行地中海西段作战任务。1940年7月奉命炮击停泊于米尔斯克比尔（奥兰）的法国舰队，造成法国水兵大量伤亡，虽出于防止舰队落入德国之手的战略考量，但对英法关系造成深重裂痕，他本人对这一命令深感不安。1942年起他调任印度洋东方舰队司令，日本南云舰队突袭印度洋时，他审慎保存舰队实力，避免以劣势兵力正面交锋。1944年起出任英国驻美海军代表团团长，协调英美海军合作，1949年去世。"
 CBIO_ENG_tom_phillips_desc:0 "1888年生，英国皇家海军中将，Z舰队指挥官。战争初期他在海军参谋体系中出任副参谋长。1941年底，为威慑日本在东南亚的扩张，他率战列舰“威尔士亲王”号与战列巡洋舰“反击”号驶抵新加坡；12月8日日军进攻马来亚后，他率队北上拦截日本登陆舰队，在缺乏岸基战斗机掩护的情况下，遭日本陆基轰炸机和鱼雷机的密集攻击，两舰于1941年12月10日相继沉没，菲利普斯随旗舰罹难，这是英国海军史上损失最重的单日战斗之一，也是大型主力舰在无制空权保护下极度脆弱这一教训的最早惨痛例证之一。"
 CBIO_ENG_ernle_chatfield_desc:0 "1873年生，英国皇家海军元帅，战间期英国海军政策的主导者之一。他参加过1916年日德兰海战，1933至1938年出任第一海务大臣，任内在华盛顿海军条约的约束框架下推动英国主力舰队的更新与扩建，主张维持强大海上力量以保障帝国利益。1939年第二次世界大战爆发后，他出任张伯伦政府的国防协调大臣，承担协调三军备战的职责；1940年4月丘吉尔主导战时领导体制后，该职的实质权力大为萎缩，他随即辞职，此后未再担任要职，1967年去世。"
 CBIO_ENG_dudley_pound_desc:0 "1877年生，英国皇家海军元帅，第二次世界大战全程担任第一海务大臣（1939–1943），是英国最高海军决策的核心人物，与丘吉尔保持极为密切的工作关系。他任内最具争议的决定，是1942年7月下令北极护航船队PQ-17就地分散，判断德国大型水面舰队即将出击；船队分散后遭德国潜艇和航空兵大批击沉，损失惨重，历史学家普遍认为这是一次严重的判断失误。他长期超负荷工作，健康持续恶化，1943年9月确诊脑肿瘤后辞职，同年10月21日于特拉法尔加海战纪念日去世。"
 CBIO_ENG_max_horton_desc:0 "1883年生，英国皇家海军上将，以第一次世界大战中的潜艇作战和第二次世界大战中扭转大西洋海战局势而著称。一战期间他驾驶潜艇在波罗的海执行高风险破交任务，声名大振。二战初期他出任潜艇舰队司令，1942年11月起出任西方路线总司令，主持北大西洋护航船队和反潜作战的全面统筹，推动引入可机动增援受攻击船队的护航支援大队，并更有效地协调陆基反潜航空巡逻；1943年5月前后盟国在大西洋海战中明显扭转颓势，德国潜艇损失急剧上升，1951年去世。"
 CBIO_ENG_louis_mountbatten_desc:0 "1900年生于温莎，英国王室贵族出身（即后来的第一代缅甸伯爵蒙巴顿），海务大臣。战争初期他以海军军官服役，所指挥的“凯利”号驱逐舰于1941年在克里特岛附近遭德机击沉，他本人生还。1941至1943年他出任联合作战司令，主管跨海突袭行动，其中1942年8月代号“朱比利”的迪耶普突袭惨遭失败，进攻部队以加拿大士兵为主，伤亡惨重，该行动的决策与准备至今仍受严厉批评。1943年他出任东南亚盟军最高司令，与斯利姆密切协作，主持了缅甸战场的全面反攻并受降日军。1947年他以印度末任总督的身份主持英属印度独立，在极短的时间框架内推动印巴分治；分治过程中引发了大规模的人口迁徙与教派间暴力冲突。战后他历任第一海务大臣和英国国防参谋长等最高军事要职，1979年遭爱尔兰共和军炸弹袭击身亡。"
 CBIO_ENG_hugh_dowding_desc:0 "1882年生于苏格兰，英国皇家空军元帅，不列颠空战的核心指挥者。1936年他出任战斗机司令部总司令，此后数年着力构建了后来被称为“道丁系统”的综合防空体系：以沿海岸线布设的“本土链”雷达网络提供早期预警，结合皇家观察员队的目视跟踪、地下作战室的情报汇集调度，以及与飞行员之间的甚高频无线电通讯，形成近乎实时的防御响应能力。1940年5至6月法国战役期间，他持续抵制将战斗机大量派往法国的压力，坚持为本土防御保留足够兵力，此举具有决定性意义。1940年7至10月不列颠空战期间，战斗机司令部在数量占优的德国空军连续攻势下守住了空中防御。同年11月，他在内部战术路线争议（大编队与小组拦截之争）和人事角力中被解除司令部职务，其获得公开表彰的时间远迟于其他战时将领，1970年去世。"
 CBIO_ENG_arthur_harris_desc:0 "1892年生于切尔滕纳姆，即第一代哈里斯准男爵，绰号“轰炸机哈里斯”，1942至1945年出任皇家空军轰炸机司令部总司令。他早年参加一战时已是飞行员，战间期在皇家空军稳步升迁，对战略轰炸作为独立作战手段抱有坚定信念。出任轰炸机司令部总司令后，他全力推行“地区轰炸”战略，将德国城市及工业区作为轰炸目标，意在摧毁工业产能并打击平民士气。他发动了1942年5月的科隆“千机轰炸”行动，以及1943年7至8月的汉堡大轰炸（代号“蛾摩拉行动”）——汉堡火焰风暴造成约四万平民死亡，是二战欧洲战场单次轰炸中平民伤亡最惨重的事件之一。1944年3月纽伦堡突袭遭到德国夜战机队的严重打击，一夜损失九十余架轰炸机，是轰炸机司令部单次任务伤亡最重的一役。1945年2月发动的德累斯顿大轰炸引起了广泛争议。当时德军战局已濒临崩溃，城内聚集大批难民，两昼夜密集轰炸造成大规模平民死亡。战后他是主要战时指挥官中唯一未获晋封贵族的人。1984年去世。"
 CBIO_ENG_jfc_fuller_desc:0 "1878年生于奇切斯特，全名约翰·弗雷德里克·查尔斯·富勒，英国陆军准将，二十世纪最重要的军事理论家之一，同时也是与英国法西斯主义有直接交往的争议人物。他在第一次世界大战中历任坦克部队参谋职务，参与筹划1917年康布雷战役——历史上首次大规模集中运用坦克的会战；同年他提出“1919年计划”，设想以大批机械化装甲部队配合飞机深入突破敌军后方、瘫痪其指挥体系，在当时极为超前。战后他大量著述，系统阐发装甲机械化战争理论，著有《战争的改革》等书，成为两次大战间军事变革思想的核心输出者之一；他的理论在英国军事保守体制中推进迟缓，却被德国军事学者（包括古德里安等装甲理论家）认真研读，被认为是“闪击战”概念形成的思想资源之一。1930年代，他转向政治极右翼，成为奥斯瓦尔德·莫斯利和英国法西斯联盟的重要外围支持者，曾撰文为法西斯运动张目；1939年4月他以外国宾客身份亲赴柏林出席希特勒五十岁生日庆典，留下与纳粹政权的公开交往记录。第二次世界大战期间他未遭拘押，但已基本退出公共视野；战后他继续著述军事历史与战略研究，1966年去世。"
 CBIO_ENG_cyril_newall_desc:0 "1886年生于英属印度穆苏里，英国皇家空军元帅，1937至1940年任皇家空军参谋长。他在战争前夕和开战初期主持皇家空军的大规模扩建，督导“影子工厂”计划推进和喷火、飓风战斗机的量产规划，并参与各军种争夺有限飞机生产产能的部门博弈。他任内始终面临轰炸机优先还是战斗机优先的资源抉择，以及如何在绥靖外交框架下界定皇家空军战略角色的难题。1940年11月不列颠空战结束后，他被波特尔接替，随即出任新西兰总督（1941–1946），在英联邦战时框架下承担行政统筹职责，1963年去世。"
 CBIO_ENG_charles_portal_desc:0 "1893年生于伯克郡亨格福德，英国皇家空军元帅，1940至1945年任皇家空军参谋长，是英国战时最高空军决策的核心人物，任期贯穿战争全程。他接掌参谋长职务时正在进行不列颠空战，此后五年间他统辖皇家空军在欧洲、北非、中东、远东各战区的兵力分配与战略方向，并与美国陆军航空队协调欧洲战略轰炸的联合计划，是盟军联合参谋体系中英方空军代表的最高决策者。他坚定支持战略轰炸政策，同时要在轰炸机司令部、战斗机司令部、海岸司令部与海外战区之间裁量优先次序，其战略判断力在英国三军参谋长中享有较高声誉，1971年去世。"
 CBIO_ENG_edward_ellington_desc:0 "1877年生，英国皇家空军元帅，1933至1937年任皇家空军参谋长，主持战间期英国空军重整的关键阶段。他任内推动皇家空军扩编计划，督导喷火和飓风战斗机项目的早期立项与研发，并参与奠定了后来在不列颠空战中发挥关键作用的防空雷达网络的基础规划工作。他任内面临有限预算下的战略取舍，在英国空军应着重发展轰炸机还是战斗机、独立作战还是辅助陆海军的路线争议中，其立场多次受到质疑。1937年卸任参谋长后他出任皇家空军总监察长，此后淡出核心决策，1967年去世。"
 CBIO_ENG_sholto_douglas_desc:0 "1893年生于牛津郡，英国皇家空军元帅，不列颠空战中以“大编队”战术争议知名，战后以军事总督身份管辖英国驻德占领区。1940年空战期间他任副参谋长，与利-马洛里联手倡导集中数个中队后再行拦截的“大编队”战术，与道丁和帕克的即时小组拦截方式持续冲突；这场争议直接促成道丁和帕克年底被解职，由道格拉斯接任战斗机司令部总司令。此后他历任中东空军和海岸司令部总司令。1945至1946年他出任英国驻德国占领区军事总督，主持盟国对德管制委员会英方事务，1969年去世。"
 CBIO_ENG_trafford_leigh_mallory_desc:0 "1892年生于柴郡，英国皇家空军上将，以不列颠空战和诺曼底登陆的空中指挥而为人所知。1940年空战期间他指挥第12大队，与道格拉斯·贝德尔合作推行“大编队”战术，主张集中兵力再行拦截以求歼灭，与第11大队基思·帕克的即时小组拦截方式正面对立；这场争议被认为是道丁和帕克去职的重要因素，他本人随即晋升接掌战斗机司令部。1944年诺曼底登陆中他担任盟军远征空军最高司令，协调登陆期间的全部空中支援行动。同年11月他在赴任东南亚盟军空军司令途中，所乘飞机在法国阿尔卑斯山坠毁，机上人员全部罹难，1944年去世。"
 CBIO_ENG_frederick_bowhill_desc:0 "1880年生，英国皇家空军上将，1937至1941年任皇家空军海岸司令部总司令，大西洋海战初期英国海上巡逻与反潜体系建设的主要负责人。他长期致力于为海岸司令部争取长航程海上巡逻机，以填补盟军航空力量无法覆盖的大西洋中部“空白区”，并推动海岸司令部与皇家海军之间的情报共享与协作，但资源分配的优先权争夺贯穿其整个任期。1941年5月德国战列舰俾斯麦号突入大西洋，他麾下的巡逻机在搜索定位德舰的过程中承担了重要侦察任务。此后他转任渡洋飞行司令部总司令，组织跨大西洋的飞机转运工作，1960年去世。"
 CBIO_ENG_david_stirling_desc:0 "1915年生于苏格兰斯特灵郡，英国陆军中校，特种空勤团（SAS）的创始人。1941年他在北非服役期间提出以小编组人员深入敌后、突袭轴心国机场和补给设施的作战理念，获中东总司令部批准后成立特别空勤团，随即发起多次奇袭，摧毁大批停驻地面的轴心国飞机，兵力消耗极小。1943年1月他在突尼斯被德军俘虏，被关押于科尔迪茨堡战俘营直至战争结束。战后他创办私人安保公司，并在1970至1980年代卷入带有极右翼色彩的英国国内政治活动，曾被指参与针对工潮或社会动乱的准军事准备计划，1990年去世。"
 CBIO_ENG_james_chadwick_desc:0 "1891年生于柴郡博林顿，英国物理学家，1932年发现中子，由此获授1935年诺贝尔物理学奖。他早年师从卢瑟福，在卡文迪许实验室工作，第一次世界大战期间曾在德国遭到拘押。中子的发现是核物理的关键节点，为理解核反应、实现人工核裂变提供了不可缺少的粒子工具，对此后核能与核武器的理论和实验发展具有基础性意义。第二次世界大战期间，他领导英国“合金管”原子弹研究计划的科学工作，是英国核武器研究的首席科学负责人；1943年起他率英国代表团加入美国曼哈顿计划，将英方在核裂变和爆炸物理方面的研究成果带入联合项目，与费米、奥本海默等数千名科学家和工程师共同推进这一集体工程。战后他回到英国继续从事核物理和科学政策工作，1974年去世。"
 CBIO_ENG_frank_whittle_desc:0 "1907年生于考文垂，英国皇家空军军官与航空工程师，涡轮喷气发动机的独立研发者之一。他1930年即为喷气推进方案申请专利，但当时英国航空工业和军方当局兴趣有限，专利一度因无力缴纳续费而险些失效。1936年他创办“动力喷气公司”，在极为有限的资金和官僚阻碍下坚持研发；1941年5月，他设计的发动机成功驱动格洛斯特E.28/39实验飞机完成首飞。值得注意的是，德国工程师汉斯·冯·奥海因同期独立研发了涡喷发动机，德国海因克尔He 178已于1939年8月完成喷气飞行，早于惠特尔的试飞。战时英国政府将他的技术以极低代价转让给其他公司生产，本人所获补偿很低，引发长期纷争。1946年辞去董事职务。1948年从皇家空军退役并获封爵士。晚年他移居美国，在马里兰州继续从事航空研究，1996年去世。"
 CBIO_ENG_john_cockcroft_desc:0 "1897年生于约克郡托德莫登，英国物理学家，核物理实验的重要奠基者之一。1932年他与爱尔兰物理学家欧内斯特·沃尔顿合作，利用自行研制的粒子加速装置将质子加速轰击锂核，首次实现以人工加速粒子引发的原子核裂变，为核物理实验研究和此后的核能利用提供了重要的实证基础；两人因此共同获授1951年诺贝尔物理学奖。第二次世界大战期间，他在雷达技术研发中发挥了一定作用，随后主持英国-加拿大联合核研究项目（蒙特利尔实验室），领导与曼哈顿计划相关的重水堆研究工作。战后他出任英国原子能研究机构（哈维尔原子能研究院）首任院长，长期领导英国和平利用原子能研究，并积极推动国际核合作，1967年去世。"
 CBIO_ENG_charles_goodeve_desc:0 "1904年生于加拿大马尼托巴省尼帕瓦，英国皇家海军科学官员，第二次世界大战期间在海军防御与武器技术研发中贡献卓著。他早年在曼尼托巴大学和伦敦大学学院接受教育，随后进入英国海军研究体系。战争爆发后，他主导推动了舰船消磁技术的实用化部署——通过在舰体外侧绕设通电缆圈以中和钢铁磁场，大幅降低触发德国磁性水雷的风险；这一技术在战争初期德国磁雷大量布设的背景下，对保护盟军商船与军舰具有切实意义。他还参与领导海军部秘密武器研发小组，涵盖反潜火箭及多种非常规舰用武器，并在加拿大海军科研机构与英国之间承担重要的技术协调工作，战后继续从事工业科研与咨询，1980年去世。"
 CBIO_ENG_nevil_shute_desc:0 "1899年生于伦敦米德尔塞克斯，本名内维尔·挪威，笔名内尔·舒特，英国航空工程师与小说家。他参与了英国私营R100硬式飞艇的工程设计，担任副首席计算师，R100于1930年成功完成跨大西洋往返飞行；同年政府主导的R101飞艇在法国坠毁，英国大型飞艇计划全面终止。此后他共同创办气流飞机公司，参与多款轻型飞机的设计与制造。第二次世界大战期间他以志愿后备役军官身份服役，并参与秘密武器装置的研发工作，这段经历成为其后期创作的重要素材。战后他移居澳大利亚，以《像爱丽丝一样的小镇》《海滩上》等小说赢得国际声誉，其创作常将工程与战争背景和普通人的道德抉择融为一体，1960年去世。"
 CBIO_ENG_robert_watson_watt_desc:0 "1892年生于苏格兰安格斯郡布里钦，英国物理学家，英国实用防空雷达体系的核心建设者。他早年研究以无线电波探测雷暴，1935年向空军部提交报告证实飞机可被无线电波探测定位，随后主持建立了“本土链”雷达预警网络，沿英格兰东南海岸线布设固定发射塔与接收站，形成对来袭飞机的早期预警能力。该系统与地下作战室调度共同构成“道丁系统”的技术核心，在1940年不列颠空战中使战斗机司令部得以在雷达引导下提前部署拦截，影响深远。雷达原理的探索属于多国科学家的平行成果，德、美等国研究人员亦独立发展了类似技术；沃森-瓦特的贡献在于将这一原理整合为具有实战价值的防空预警网络，而非单独发明雷达，1973年去世。"
 CBIO_ENG_corgis_1_desc:0 "王室柯基犬，乔治六世一家的宠物犬之一。英国王室与彭布罗克威尔士柯基犬的渊源始于1930年代初，约克公爵（即后来的乔治六世）为女儿们引入了这一品种，自此柯基成为英国王室最具标志性的犬种之一，陪伴王室一家度过了战时宫廷生活。"
 CBIO_ENG_corgis_2_desc:0 "英国王室最早引入的彭布罗克威尔士柯基犬之一，1933年由约克公爵（后为乔治六世）和约克公爵夫人为公主们购入，由此开创了王室与柯基犬长达数十年的渊源。杜基以顽皮著称，曾在宫廷场合多次行为失范，以咬人记录见诸报端，约在1940年代去世。"
 CBIO_ENG_corgis_3_desc:0 "王室柯基犬，1930至1940年代乔治六世一家早期饲养的几只彭布罗克威尔士柯基犬之一，是英国王室柯基犬传统的早期成员，常随王室出入宫廷与行宫，伴随一家人度过第二次世界大战期间的宫廷生活，具体生卒年代已难以查考。"
