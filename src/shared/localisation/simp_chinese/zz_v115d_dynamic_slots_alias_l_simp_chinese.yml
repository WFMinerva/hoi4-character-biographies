 AUS_arthur_seyss-inquart_desc:0 "阿图尔·赛斯-英夸特（1892年7月22日—1946年10月16日）出生于摩拉维亚施塔讷恩，原姓斯拉夫语“扎伊蒂希”，1907年随家迁居维也纳后改为德语化姓氏。他在维也纳大学攻读法律，一战期间在奥匈军队服役，先后于俄、罗、意战线作战并多次因战功受勋，1917年伤愈期间完成学业。战后他从事律师工作，1921年自立门户，业务颇为成功，长期主张德奥合并，起初并未加入纳粹党，但至1938年已成为奥地利纳粹党内地位最高者。1937年5月起任国务顾问，1938年2月遭希特勒胁迫的舒施尼格任命为内政部长。3月11日舒施尼格辞职后，总统米克拉斯被迫任命他为总理，仅在职两日；3月13日他签署法律将奥地利并入德国，随后出任“东方边区”总督。此后他历任驻波兰总督府副总督、荷兰占领区国家专员，在荷兰任内推行驱逐犹太人、没收财产及强迫劳动政策，约十万荷兰犹太人因此遇害，并下令枪决人质镇压抵抗运动。1945年5月5日他在汉堡被英军俘获。纽伦堡审判中，他因战争罪与危害人类罪等罪名被判处绞刑，1946年10月16日在纽伦堡监狱被处决，年五十四岁。"
