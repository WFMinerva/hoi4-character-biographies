 # aliases for CBIO_CZE_jan_syrovy_desc
 POLITICS_JAN_SYROVY_DESC:0 "扬·西罗维，1888年生于摩拉维亚的特热比奇，捷克斯洛伐克四星上将、民族英雄，慕尼黑危机时期的总理。第一次世界大战中，他在俄国境内的捷克斯洛伐克军团作战，1917年兹博罗夫战役中失去右眼，得\"独眼将军\"之称，又因相貌酷似胡斯派名将杨·杰式卡而广受爱戴；战争末期，他统率军团及反布尔什维克部队，沿西伯利亚大铁路且战且行。两战之间，他历任总参谋长（1926—1933）与陆军总监（1933—1938）。1938年9月，苏台德危机骤起、霍查政府在抗议声中倒台，贝奈斯总统不顾他\"只是军人、非政客\"的推辞，任命他为救国政府总理兼国防部长；他下令全国总动员，却终因英法弃捷而被迫接受《慕尼黑协定》，在广播中沉痛宣告\"我们被抛弃了，只剩孤军\"。贝奈斯辞职后他一度代行总统职权，至同年12月卸任总理，留任国防部长至1939年4月；1939年3月德军占领时，他作为国防部长下令不予抵抗。战后他于1945年被捕，1947年以\"通敌\"罪被判二十年徒刑，自认问心无愧，于1970年去世。"
