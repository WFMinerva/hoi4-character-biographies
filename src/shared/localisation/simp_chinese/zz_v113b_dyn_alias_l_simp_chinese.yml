 # aliases for CBIO_SOV_grigory_zinovyev_desc
 SOV_zinovyev_desc:0 "1919至1926年间的共产国际主席。1883年生，老布尔什维克，流亡时期即与列宁关系密切。革命后他长期主持彼得格勒（列宁格勒）的党组织，并于1919年至1926年间担任共产国际主席。列宁逝世后，他先与斯大林、加米涅夫结成”三人集团“打击托洛茨基，随后转而与托洛茨基联合，组成反对斯大林的”联合反对派“。他几经开除与悔过。基洛夫遇刺后他被捕，1936年8月作为第一次莫斯科审判的主要被告，与加米涅夫同案受审，被处决，后于1988年获平反。"
