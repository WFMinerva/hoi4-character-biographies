 # aliases for CBIO_MEX_jesus_degollado_guizar_desc
 POLITICS_JESUS_DEGOLLADO_GUIZAR_DESC:0 "赫苏斯·迪哥拉多·吉萨尔，1892年生于米却肯州的科蒂哈，墨西哥基督军（克里斯特罗）将领，药剂师出身，虔诚的天主教徒。1920年代他迁居哈利斯科，加入墨西哥天主教青年协会等天主教组织。1926年，普鲁塔科·埃利亚斯·卡列斯总统颁行限制天主教会的\"卡列斯法\"，激起中西部天主教徒大规模武装反抗，是为\"基督军战争\"（克里斯特罗起义，1926—1929），起义者以\"基督君王万岁\"为口号。他随即投身基督军解放军，1927年被全国宗教自由保卫同盟任命为师级将军、西部战区作战指挥，是起义中最能征善战的领袖之一。继职业军人戈罗斯蒂耶塔阵亡后，他成为基督军的最后一任总司令。1929年6月，经美国大使斡旋，教会与波尔特斯·希尔政府达成和解、战争结束，遣散基督军的善后正落在他肩上；然而协议中停止迫害的条款未获遵守，许多基督军官兵在战后仍遭暗杀。1951年他曾召集纪念活动、重组老兵团体，并著有回忆录，1957年在瓜达拉哈拉去世。"
 POLITICS_MEX_JESUS_DEGOLLADO_GUIZAR_DESC:0 "赫苏斯·迪哥拉多·吉萨尔，1892年生于米却肯州的科蒂哈，墨西哥基督军（克里斯特罗）将领，药剂师出身，虔诚的天主教徒。1920年代他迁居哈利斯科，加入墨西哥天主教青年协会等天主教组织。1926年，普鲁塔科·埃利亚斯·卡列斯总统颁行限制天主教会的\"卡列斯法\"，激起中西部天主教徒大规模武装反抗，是为\"基督军战争\"（克里斯特罗起义，1926—1929），起义者以\"基督君王万岁\"为口号。他随即投身基督军解放军，1927年被全国宗教自由保卫同盟任命为师级将军、西部战区作战指挥，是起义中最能征善战的领袖之一。继职业军人戈罗斯蒂耶塔阵亡后，他成为基督军的最后一任总司令。1929年6月，经美国大使斡旋，教会与波尔特斯·希尔政府达成和解、战争结束，遣散基督军的善后正落在他肩上；然而协议中停止迫害的条款未获遵守，许多基督军官兵在战后仍遭暗杀。1951年他曾召集纪念活动、重组老兵团体，并著有回忆录，1957年在瓜达拉哈拉去世。"

 # aliases for CBIO_MEX_vicente_lombardo_desc
 POLITICS_VICENTE_LOMBARDO_DESC:0 "比森特·隆巴尔多·托莱达诺，1894年生于普埃布拉州的特西乌特兰，20世纪墨西哥最重要的工人运动领袖之一，有\"墨西哥马克思主义泰斗\"之称。他是律师与大学教授、马克思主义知识分子。1921年起，他在墨西哥最大的工会\"墨西哥地区工人联合会\"（CROM）任职，1932年因不满其领袖莫罗内斯的腐败而决裂，另组\"纯洁派CROM\"。1936年，他创建\"墨西哥工人联合会\"（CTM）并任首任总书记；在卡德纳斯总统支持下，CTM迅速壮大为全国最大的劳工组织，推动劳工与福利改革，并成为执政党的重要支柱。1938年他又发起\"拉丁美洲工人联合会\"（CTAL），将影响力扩及全洲，同年还创办《大众报》。他自称\"激进的马克思主义者，但非共产党人\"。二战后他被逐出CTM的领导层；1948年他另立\"人民党\"（后改称人民社会党），主张引领墨西哥走向社会主义，并于1952年参选总统未果。他于1968年在墨西哥城去世。"
