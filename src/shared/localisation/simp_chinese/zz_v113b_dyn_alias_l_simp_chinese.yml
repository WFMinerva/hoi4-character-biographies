 # aliases for CBIO_AFG_mohammed_zahir_shah_desc
 POLITICS_MOHAMMED_ZAHIR_SHAH_DESC:0 "穆罕默德·查希尔·沙阿，1914年生于喀布尔王室，阿富汗末代国王。他出身穆罕默德扎伊家族，曾在法国求学，回国后任过国防副大臣与教育大臣。1933年其父纳迪尔·沙阿遇刺身亡，年仅十九岁的他继位为王，在位近四十年，是自杜兰尼王朝以来在位最久的阿富汗君主。即位之初，朝政长期由其叔伯与堂兄达乌德等人把持；他借1964年新宪法确立君主立宪、限制王权、赋予国民参政之权，并扩大妇女权利。其治下，阿富汗在二战与冷战中均保持中立，向美苏两方争取援助，兴办学校、道路与喀布尔大学，被许多阿富汗人追忆为难得的和平年代。1973年，他在意大利就医期间，堂兄、前首相达乌德发动政变废黜君主制、建立共和国；他不愿引发内战，遂正式逊位，自此在罗马近郊流亡近三十年。历经苏军入侵、内战与塔利班之乱，许多人愈发怀念其在位的安定。塔利班政权倒台后，他于2002年返国、主持大国民会议，虽未复辟，却被授予\"国父\"尊号，2007年在喀布尔去世。"
