 # aliases for CBIO_ALB_tefik_mborja_desc
 POLITICS_TEFIK_MBORJA_DESC:0 "特菲克·姆博里亚，1891年生于今阿尔巴尼亚科尔察附近的姆博列，律师与政治家，意大利保护国时期阿尔巴尼亚法西斯党的总书记。他曾在罗马攻读法律，两战之间任议员，原是国王索古的坚定反对者、支持范·诺利，并自1924年起任诺利在罗马的代表，还一度受命与苏联接触；其间他结交了墨索里尼的女婿齐亚诺伯爵一家，这层关系日后成为他飞黄腾达的台阶。1939年4月意大利入侵、废黜索古、把阿尔巴尼亚变为保护国后，他先获任科尔察省长；同年6月阿尔巴尼亚法西斯党作为唯一合法政党成立，他被任命为总书记，并因此成为政府的当然部长、跻身意大利的法西斯与社团组织。该党是意大利国家法西斯党的分支，党员须向墨索里尼宣誓效忠，还颁行排犹法令；姆博里亚虽对政策有一定影响，实权却始终握在意大利监督官手中。1944年12月，他被阿尔巴尼亚共产党人逮捕，次年被特别法庭判处二十年徒刑，后在狱中遭毒杀，1954年身亡。"
 POLITICS_ALB_TEFIK_MBORJA_DESC:0 "特菲克·姆博里亚，1891年生于今阿尔巴尼亚科尔察附近的姆博列，律师与政治家，意大利保护国时期阿尔巴尼亚法西斯党的总书记。他曾在罗马攻读法律，两战之间任议员，原是国王索古的坚定反对者、支持范·诺利，并自1924年起任诺利在罗马的代表，还一度受命与苏联接触；其间他结交了墨索里尼的女婿齐亚诺伯爵一家，这层关系日后成为他飞黄腾达的台阶。1939年4月意大利入侵、废黜索古、把阿尔巴尼亚变为保护国后，他先获任科尔察省长；同年6月阿尔巴尼亚法西斯党作为唯一合法政党成立，他被任命为总书记，并因此成为政府的当然部长、跻身意大利的法西斯与社团组织。该党是意大利国家法西斯党的分支，党员须向墨索里尼宣誓效忠，还颁行排犹法令；姆博里亚虽对政策有一定影响，实权却始终握在意大利监督官手中。1944年12月，他被阿尔巴尼亚共产党人逮捕，次年被特别法庭判处二十年徒刑，后在狱中遭毒杀，1954年身亡。"

 # aliases for POLITICS_DOM_DUARTE_NUNO_DESC
 POR_dom_duarte_nuno_desc:0 "杜阿尔特·努诺，布拉干萨公爵，1907年生于奥地利的塞本施泰因城堡，被废黜的葡萄牙王位的觊觎者。他是米格尔派的继承人——其家族源出主张君主专制的米格尔一世一支，因1828—1834年\"两兄弟战争\"中败于自由派的佩德罗四世而被流放、剥夺继承权，长期侨居海外。1920年，年仅十二岁的他在父亲让位后被米格尔派奉为王位继承人（尊为\"杜阿尔特二世\"），由姑母摄理。1932年，末代国王曼努埃尔二世（1910年革命后被废、流亡海外）无嗣而终，作为布拉干萨家族最年长的男系后裔，他获绝大多数保王派（无论米格尔派还是立宪派）拥戴，成为统一的王位觊觎者，弥合了两系数十年的分裂。1942年他迎娶奥尔良-布拉干萨的玛丽亚·弗朗西斯卡郡主，使葡、巴两支血脉重归于好。1950年葡萄牙废除针对前王室的流放法，他遂于1952年举家迁回葡萄牙，成为1910年共和革命以来首位定居本土的前王朝成员，在萨拉查政权的容忍下安居。他于1976年在里斯本去世，其子杜阿尔特·皮奥继为葡萄牙王位觊觎者。"
