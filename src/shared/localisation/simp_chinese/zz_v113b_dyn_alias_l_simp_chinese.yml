 # aliases for CBIO_ETH_alemework_beyene_desc
 POLITICS_ALEMEWORK_BEYENE_DESC:0 "阿莱梅沃勒克·贝耶内，埃塞俄比亚抵抗运动领袖，\"黑狮\"组织的主席，一位在英国受过教育的兽医。1936年意大利侵占埃塞俄比亚后，由霍莱塔军校学员与一批留学归国的知识分子（包括伊尔马·德雷萨等）在埃塞俄比亚西部发起\"黑狮\"运动——这是早期抵抗运动（\"爱国者\"游击队，Arbegnoch）中影响最大的组织之一，矢志抗击法西斯意大利的占领。该组织订有十条章程，强调政治高于军事、严禁虐待农民与战俘、禁止成员流亡、宁死不降。\"黑狮\"曾说服皇帝海尔·塞拉西的堂兄、受命摄政的伊姆鲁亲王加入武装斗争。1936年12月伊姆鲁亲王在戈杰布河一带兵败投降后，\"黑狮\"随之瓦解；1937年2月格拉齐亚尼遇刺未遂后，其成员多遭意军屠杀，贝耶内是少数幸存者之一。"
