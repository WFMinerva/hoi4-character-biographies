 POLITICS_SOV_GRIGORY_ZINOVYEV_DESC:0 "1919至1926年间的共产国际主席。1883年生，老布尔什维克，流亡时期即与列宁关系密切。革命后他长期主持彼得格勒（列宁格勒）的党组织，并于1919年至1926年间担任共产国际主席。列宁逝世后，他先与斯大林、加米涅夫结成”三人集团“打击托洛茨基，随后转而与托洛茨基联合，组成反对斯大林的”联合反对派“。他几经开除与悔过。基洛夫遇刺后他被捕，1936年8月作为第一次莫斯科审判的主要被告，与加米涅夫同案受审，被处决，后于1988年获平反。"

 # aliases for CBIO_AST_adela_walsh_desc
 AST_adela_pankhurst_walsh_desc:0 "阿德拉·潘克赫斯特·沃尔什，1885年生于曼彻斯特，英裔澳大利亚政治活动家，著名妇女参政运动世家潘克赫斯特家族最小的女儿（母亲埃米琳与姐姐克里斯塔贝尔、西尔维娅皆为英国妇女参政运动领袖）。她本人也是激进的妇女参政论者，为妇女社会政治同盟（WSPU）奔走、多次入狱并绝食抗争；后因不满运动日趋暴力、与母姊失和，于1914年被家族\"流放\"至澳大利亚。在澳大利亚，她投身妇女、反战与反征兵运动，一战中再度入狱，并与工会领袖汤姆·沃尔什结婚。1920年，她与丈夫同为澳大利亚共产党的创始成员，却很快因不满共产国际指令而退党。此后她的立场急剧右转：1928年组建拥护工业和平、帝国与传统家庭的妇女团体；1941年又与人共同创立极右翼的\"澳大利亚优先运动\"——该组织反共、孤立主义、亲轴心国，她与丈夫亦曾倾慕墨索里尼。二战期间，\"澳大利亚优先运动\"遭取缔，她本人一度被拘押。丈夫1943年去世后她淡出政坛，晚年皈依天主教，1961年于悉尼去世。"
