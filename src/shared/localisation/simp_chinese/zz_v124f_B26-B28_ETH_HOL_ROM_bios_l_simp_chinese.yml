l_simp_chinese:
 CBIO_ETH_abebe_aregai_desc:0 "阿贝贝·阿拉盖出生于绍阿北部阿布德拉村，父亲阿拉盖·贝凯雷，外祖父为知名将领拉斯·戈贝纳·达谢。他早年在皇家卫队服役，后转入警界，1935年获封巴兰巴拉斯衔。意大利入侵后，他率领游击队在门兹与绍阿地区坚持抵抗，被称为爱国者军的领袖之一，曾与意军将领纳西将军虚与委蛇进行谈判以争取喘息之机。1941年皇帝复位后，他出任亚的斯亚贝巴市长兼战争大臣，随后转任西达莫省长。此后他历任内政大臣、国防大臣等要职，逐渐成为宫廷中举足轻重的实力派人物之一。1957年11月27日，他出任埃塞俄比亚首相。1960年12月，帝国卫队部分将领发动政变，阿拉盖与其他几位大臣一同被扣为人质；政变被镇压前，他在杰内特留勒宫遭机枪扫射身亡，时年57岁。"
 CBIO_ETH_abuna_qerellos_iv_desc:0 "阿布纳·切雷罗斯四世原名西达鲁斯·安图尼，出生于埃及，为科普特教会教士。1926年他来到埃塞俄比亚，出任该国正教会大主教。意埃战争爆发前夕，海尔·塞拉西皇帝在流亡前曾嘱托他留在国内照看教会事务；占领初期，他一度对意占当局采取顺从合作的姿态，意方也曾试图借机怂恿他宣布埃塞俄比亚教会脱离埃及科普特教会独立，但未能得逞。1936年，他被意占当局解除职务并流亡埃及，其大主教之位先后由阿布纳·亚伯拉罕、阿布纳·约翰内斯十五世等意方扶植的人选接替。1941年埃塞俄比亚光复后，他于1945年获准重返亚的斯亚贝巴复任大主教之职，直至1950年10月22日在开罗病逝，是历史上最后一位统领埃塞俄比亚教会的科普特籍大主教。"
 CBIO_ETH_abuna_abraham_desc:0 "阿布纳·亚伯拉罕原为埃塞俄比亚正教会戈贾姆教区主教。1937年11月27日，占领当局意大利元帅罗多尔福·格拉齐亚尼召集埃塞俄比亚教士召开会议，选举他出任埃塞俄比亚正教会大主教，以取代仍效忠亚历山大科普特教会体系的合法大主教阿布纳切雷罗斯四世。同年12月28日，亚历山大科普特教会最高会议在教宗约翰十九世主持下宣布这一选举非法，并将阿布纳·亚伯拉罕逐出教会。此后他在意占当局支持下自行为多名新主教举行祝圣礼，未经科普特教会认可。阿布纳·亚伯拉罕去世后，意占当局又以阿布纳约翰内斯接替其位。无论是流亡的皇帝还是科普特教会，均未承认这一系列由占领当局扶植的教会人事安排。"
 CBIO_HOL_adriaan_dijxhoorn_desc:0 "阿德里安·迪希霍恩，1889年9月10日生于鹿特丹一个殷实之家，是一名职业军官，就读于皇家军事学院与高级军事学校，并曾在军事学院任教。1939年8月，他在第二届德·海尔内阁中出任国防大臣，当时军衔仅为中校。他与陆海军最高统帅雷因德斯在防线布置上意见相左，主张把防御重心放在格雷伯山，此争执得到内阁与女王支持，最终促成雷因德斯去职、由温克尔曼接任。1940年5月荷兰投降后，他随女王与内阁前往伦敦，继续在流亡政府中任国防大臣，直至1941年6月因与威廉明娜的冲突而辞职。此后他出任荷兰驻华盛顿联合参谋部的军事代表，1945年一度代理总参谋长，其后任最高军事法院成员。1953年1月22日在德斯泰赫去世。"
 CBIO_HOL_adrianus_rudolphus_van_den_bent_desc:0 "阿德里亚努斯·鲁道夫斯·冯·恩·本特，1883年2月28日生于布雷达，是荷兰皇家陆军的步兵少将。1940年5月德军入侵时，他指挥第四军，据守格雷伯防线的北段。1941年他被德军俘虏，押往德国。战后1946年初，首相贝尔任命他为荷兰勋级总监，主掌包括威廉军事勋章在内的各类荷兰勋位；此项任命曾引发争议，因为被越过的一位资深少将本人才是威廉军事勋章的骑士。但不久之后，他因意见分歧与外界批评而辞去该职。1957年7月6日在阿默斯福特去世。"
 CBIO_ETH_amha_selassie_desc:0 "阿姆哈·塞拉西原名阿斯法沃森·塔法里，生于哈拉尔，是海尔·塞拉西与梅嫩皇后之子。1930年父亲加冕后受封王储，兼领沃洛省。意埃战争期间他协助父亲为埃塞俄比亚争取国际援助，二十岁即率部参战，其后随父流亡耶路撒冷及英国巴斯，并在利物浦大学求学。1941年光复后返国，参与收复贡德尔战役，此后一度代理贝格姆德尔及提格雷省长，始终兼领沃洛。1960年政变期间他曾被叛军挟持宣布继位，政变平息后仍以王储自居。1974年德尔格推翻其父后宣布由他继任为王，他本人始终未予承认。1989年，流亡伦敦的他接受拥立称帝。1997年1月17日，阿姆哈·塞拉西在美国去世，享年80岁。"
 CBIO_ETH_ayalew_birru_desc:0 "阿亚莱乌·比鲁出身贝格姆德尔，父亲为拉斯·比鲁·沃尔德·加布里埃尔，是海尔·塞拉西皇帝的表亲。他早年历任瓦加拉、塞米恩等地首长，1917年至1918年间出任帝国军队总司令，后迎娶拉斯·卡萨·海尔·达格之女为妻。1930年安契姆战役中，他协同菲塔乌拉里沃恩多森·卡萨击败拉斯·古格萨·韦勒叛军，因功晋升德贾兹马奇。1931年他受封菲塔乌拉里衔并出任战争大臣，1933年至1934年间因故失宠，被放逐至阿尔西省。1935年意埃战争爆发后重获起用，率军参战，但在提格雷希雷一带作战时中途撤军，其忠诚一度受到质疑，甚至传出与意军有所接触的说法，这一指控至今仍存争议。1945年5月去世。"
 CBIO_ROM_emanoil_ionescu_desc:0 "埃马诺伊尔·约内斯库，1893年3月17日生于奥尔特县的滕佩尼（今莫维莱尼），是二战期间罗马尼亚的空军将领。他出身乡村教师家庭，早年当过教师，一战期间投身航空，1918年取得飞行执照，并在1919年罗匈战争中执行侦察与轰炸任务。两战之间他历任中队长、飞行团长，就读高等军事学校，两度赴法进修，1937年起指挥第三驱逐机战队，还担任高等军事学校教官与布加勒斯特奥雷尔·弗拉伊库军事航空学校校长。1941年罗马尼亚加入轴心国参战后，他任第四集团军航空指挥部司令，支援罗军强渡普鲁特河与德涅斯特河的作战。1944年5月晋升将级，同月获德国骑士铁十字勋章。同年8月米哈伊国王政变、罗马尼亚倒戈后，他继续在特兰西瓦尼亚、匈牙利与斯洛伐克前线指挥航空军，为罗军与苏军提供空中支援，因常亲临一线而受苏方赞誉。1945年3月他出任首届格罗萨政府的空军国务次卿，战后一度升任空军总监。因不认同战后军队政策，他于1947年请假转入预备役。他患有心脏病，1949年7月13日在布加勒斯特去世，葬于贝卢公墓。"
 CBIO_HOL_anton_de_kom_desc:0 "安东·德·科姆，1898年2月22日生于苏里南首府帕拉马里博，父亲是获得自由的前奴隶。他在苏里南取得簿记文凭，1920年赴海地工作，1921年迁居荷兰，1926年与荷兰女子佩特罗内拉·博斯博姆结婚。1932年底他返回苏里南，为受剥削的劳工奔走，被殖民当局视为威胁。1933年2月他被捕，其支持者在帕拉马里博的广场聚集声援，警察开枪打死两人。随后他被驱逐回荷兰。1934年他出版《我们，苏里南的奴隶》，这是首部由苏里南人撰写的苏里南史，成为反殖民主义的经典之作。德国占领期间，他投身抵抗运动，为海牙的地下刊物《火花报》撰稿，1944年8月被捕，先后辗转数座集中营。1945年4月24日，他因肺结核病逝于诺因加默的桑德博斯特尔分营，距该营获得解放仅数日。他身后被追授抵抗纪念十字勋章，2020年入选荷兰历史正典。"
 CBIO_HOL_antonie_pannekoek_desc:0 "安东·潘涅库克，1873年1月2日生于法森，自幼对天文学抱有浓厚兴趣，1891年起在莱顿大学攻读数学与物理，后在莱顿天文台工作并完成博士论文。他因阅读社会主义著作转向马克思主义，先后活跃于荷兰社会民主工党、德国社会民主党，以及荷兰共产党和荷德两国的共产主义工人党。他是议会共产主义的主要理论家之一，主张工人应通过民主组织的工人委员会自行完成革命，对列宁与列宁主义持尖锐批评。在天文学领域，他研究银河系结构与恒星物理，成就享有国际声誉，1925年当选荷兰皇家艺术与科学院院士，1936年获哈佛大学荣誉学位，1951年获英国皇家天文学会金质奖章。月球上的一座环形山与一颗小行星均以他的名字命名。1960年4月28日去世。"
 CBIO_HOL_anthony_fokker_desc:0 "安东尼·福克，1890年4月6日生于荷属东印度爪哇，父亲是咖啡种植园主，幼年随家迁回荷兰。他自学成才，约1910年造出名为斯平的飞机，这是第一架在荷兰境内飞行的荷兰造飞机。1912年他在德国创办飞机制造厂。第一次世界大战期间，他的工厂为德国空军生产战斗机，其中单翼的艾恩德克装有可透过螺旋桨射击的同步装置，此外还有Dr.1三翼机与D.VII双翼机。凡尔赛条约禁止德国制造飞机后，他将企业迁回荷兰。此后其F.VII三发客机大获成功，使福克在1920年代末一度成为全球最大的飞机制造商，其飞机曾用于多次著名的远程与极地飞行。他后来移居美国经营飞机公司，1931年出版自传《飞行的荷兰人》。1939年12月23日，他因脑膜炎在纽约去世，年仅四十九岁。"
 CBIO_ETH_anarchist_council_desc:0 "安那其共产主义者大会并非历史上真实存在的机构，而是虚构的集体领导机制之名。其概念原型源自十九世纪末至二十世纪初欧洲的无政府共产主义思潮，该思潮主张废除国家与私有财产，代之以自愿结社、生产资料公有的社群自治，理论渊源可追溯至彼得·克鲁泡特金、米哈伊尔·巴枯宁等思想家。二十世纪三十年代的埃塞俄比亚本身并无成规模的无政府共产主义运动，这一名称更接近对极端左翼、排斥中央集权这一路线的抽象命名，用以区别于苏维埃式或军事集权式的左翼政权模式。"
 CBIO_ETH_balcho_safo_desc:0 "巴尔科·萨福出身平民，族裔存在古拉格与奥罗莫两种说法，少年时作为战俘被阉割，后被梅内利克二世带回亚的斯亚贝巴抚养教育。他在阿杜瓦战役中担任炮兵指挥，战后获封德贾兹马奇衔，此后历任西达莫、哈拉尔等地首长。作为忠于旧朝的保守派贵族，他在1920年代多次与摄政拉斯·塔法里的中央集权改革相抵触；1928年他率军进京对峙，塔法里派拉斯·卡萨·海尔·达格收买其部众，使其陷入孤立，被迫体面隐退于古拉格地区。1935年意大利入侵后，年迈的巴尔科重新披甲上阵，率部在古拉格地区抵抗。1936年11月6日，他的部队遭意军包围，部下悉数阵亡，他本人拒绝缴械，被当场击毙。"
 CBIO_ROM_paul_teodorescu_desc:0 "保罗·特奥多雷斯库，1888年6月28日生于巴克乌一个军人家庭，是罗马尼亚的步兵将领，也是罗马尼亚科学院通讯院士。他早年就读步兵军官学校，参加过第二次巴尔干战争与第一次世界大战，后在巴黎高等军事学校深造，与日后的法国总统戴高乐同窗。他曾任布加勒斯特军事学院院长，并推动创建新的高等军事学校校舍。1937年11月至1940年6月，他出任空军与海军部长，大力推进航空扩军，改组加拉茨造船厂，主持建造穆尔杰斯库海军上将号布雷舰与鲨鱼号、海豚号潜艇。他虽是卡罗尔二世的亲信，却因拒绝与国王情妇卢佩斯库来往而辞职。安东内斯库掌权后请他出任国防部长，他以不愿与铁卫团同处一届政府、不认同罗马尼亚倒向纳粹德国为由拒绝，随即退隐。战后他被共产政权列入黑名单，1949年后两度获刑，囚于日拉瓦与多瑙河至黑海运河工地。1968年，其巴黎同窗、时任法国总统的戴高乐访罗前提出探望，当局遂为他恢复了住房与养老金。晚年他退居沃尔恰县的独木修道院，将其修复为纪念航空与海军将士之地。1981年1月17日在该修道院去世。"
 CBIO_ETH_beyene_merid_desc:0 "贝耶内·梅里德，父亲为德贾兹马奇梅里德，迎娶海尔·塞拉西皇帝长女罗曼内沃尔克公主为妻，育有四子。他长期出任巴莱首长，1935年前后又兼任加穆戈法首长，意埃战争爆发后统率巴莱军团，在南线沿谢贝利河一带推进，筹划进攻意属索马里兰。1935年11月，其部队与亲意武装奥洛尔丁勒部交战，他本人身负重伤，所部被迫撤离战场。意大利占领期间，他继续以爱国者身份坚持游击抵抗，与拉斯·德斯塔·达姆特沃部会合。1937年2月24日，两人一同被意军俘获，随即被就地处决。四子中仅次子梅里德与三子萨姆森在占领结束后存活。"
 CBIO_ROM_petre_dumitrescu_desc:0 "彼得·杜米特雷斯库，1882年2月18日生于多尔日县的多布里多尔，是第二次世界大战期间罗马尼亚的陆军上将，以指挥第三集团军在东线作战而知名。他出身炮兵，第一次世界大战时任少校，1937年升少将并出任驻巴黎、布鲁塞尔武官。1941年3月，他出任第三集团军司令，此后一直任此职。在巴巴罗萨行动中，他率军收复北布科维纳与北比萨拉比亚，参加亚速海之战，因功获德国骑士铁十字勋章，是继安东内斯库之后第二位获此勋章的罗马尼亚人。1942年7月他晋升上将，成为安东内斯库的副手；同年其部在斯大林格勒方向作战，在苏军的乌兰诺斯反攻中遭重创而被迫后撤。1944年他指挥“杜米特雷斯库集团军群”，8月雅西-基什尼奥夫攻势后第三集团军几近覆灭；罗马尼亚倒戈后，他转而对德作战。战后他曾被共产政权以战犯罪起诉，因证据不足获判无罪。1950年1月15日在布加勒斯特病逝。"
 CBIO_HOL_petrus_wilhelmus_best_desc:0 "彼得鲁斯·威廉默斯·贝斯特，1881年1月19日生于阿姆斯特丹，是荷兰的炮兵中将，也是荷兰军事航空的奠基人之一。他1902年从皇家军事学院毕业任炮兵少尉，后入总参谋部。1930年代他出任皇家陆军航空处处长，1937年任第四师师长，1938年11月出任新设的防空司令部的首任司令，1939年10月晋升中将。他早在1937年的一次演讲中就预言，未来敌人会不宣而战，以摩托化部队配合对机场的空袭发动突袭，并主张建立集中统一的防空体系、以地面部队守卫机场。1940年5月德军入侵时，他所部署的防空火力在海牙之战中给德军造成损失。荷兰投降后，他是少数拒绝签署不再抵抗声明的军官之一，因而被俘，先后关押于德国与波希米亚的战俘营。战后他曾在特别法庭中参与对通敌者的审判。1951年退役。1960年3月13日在海牙去世。"
 CBIO_HOL_prince_bernhard_desc:0 "伯恩哈德亲王，1911年6月29日生于德国耶拿，出身德意志利珀-比斯特费尔德家族，早年在洛桑、慕尼黑与柏林学习法律。1930年代他曾加入与纳粹相关的组织，包括骑兵党卫队，并一度成为纳粹党成员，此事他后半生始终否认。他曾在法本公司巴黎办事处任职。1936年他结识荷兰王储朱莉安娜，次年1月成婚，随即入荷兰籍并获封荷兰亲王。第二次世界大战期间，他反对德国入侵，留在伦敦协助流亡政府，充当荷兰政府与英军之间的联络人，1944至1945年出任荷兰国内武装部队司令，并参与荷兰境内德军投降的谈判，因战时表现获授威廉军事勋章。1948年朱莉安娜即位后，他成为王夫。战后他参与创建世界自然基金会与彼尔德伯格集团。1976年，他因洛克希德受贿丑闻被查实收受美国飞机制造商的巨额贿赂，被解除军职并禁止再穿军装。2004年12月1日在乌得勒支去世。"
 CBIO_HOL_charles_douw_van_der_krap_desc:0 "查理·道·范德科拉普，1908年10月8日生于荷属东印度的泗水，是一名印欧混血的海军军官，1929年从登海尔德的皇家海军学院毕业，后在海军航空兵任观测员与领航员。1940年5月德国入侵时，他的舰只正在鹿特丹检修，他遂率一队海军士兵参加鹿特丹的四天防御战。荷兰投降后，他拒绝签署不再抵抗的声明，于同年7月被俘，先后关押于多座战俘营，其中包括号称固若金汤的科尔迪茨堡。1943年12月，他终于从乌克兰斯坦尼斯拉夫附近的一座营地逃脱，藏身华沙，加入波兰抵抗组织，参加了1944年的华沙起义。同年8月他辗转回到荷兰，随即投入市场花园行动中的阿纳姆之战，后随英军第一空降师余部渡过莱茵河抵达南方解放区，再飞往英国。他在英国海军任领航军官直至欧战结束，之后又在太平洋对日作战。他因作战英勇获颁荷兰最高军功荣誉威廉军事勋章。1995年12月9日在瓦瑟纳尔去世。"
 CBIO_ETH_desta_damtew_desc:0 "德斯塔·达姆特沃出生于古拉格地区马斯坎村，父亲菲塔乌拉里达姆特沃·凯特纳在1896年阿杜瓦战役中阵亡。他少年时曾在皇宫为梅内利克二世及皇太后泰图充任侍童，1924年迎娶海尔·塞拉西之女特纳尼沃尔克公主。1928年受封德贾兹马奇并任凯法首长，1931年晋升拉斯，兼任西达莫与博雷纳首长；1933年访问美国，是他一生唯一一次出国。1935年意埃战争爆发后，他统率南部战线部队，次年1月在加纳莱多里亚战役中被意军击败，退守伊尔加勒姆重整旗鼓。皇帝流亡后，他仍与德贾兹马奇加布雷玛丽亚姆等人继续抵抗，后在沙拉湖附近被意军合围，负伤突围。1937年2月24日，他被意军俘获并处决。"
 CBIO_ETH_domenico_mondelli_desc:0 "多米尼哥·门德利原名沃尔德·塞拉西，1886年生于厄立特里亚阿斯马拉，属提格利尼亚人。1891年意军自阿杜瓦撤退途中，帕尔马籍上尉阿蒂利奥·门德利收养了年仅五岁的他，带回意大利帕尔马抚养，并为他取名多米尼哥。他先后就读罗马军事学院与摩德纳皇家步骑兵学院，1905年以少尉军衔毕业编入猎兵部队，1907年依法获得意大利国籍。1914年他考取飞行员执照，成为世界上首位取得军用飞行资格的黑人。一战期间他先后在侦察轰炸航空部队及陆军突击队服役，屡建战功，获两枚银质及两枚铜质军功勋章。法西斯当政后，因肤色及共济会身份，他的晋升长期受阻，未能获得指挥白人部队的军职，为此他三次向陆军部申诉均获胜诉。对于1935至1936年的意埃战争，他始终未见公开表态。二战后随共和国成立，他以荣誉序列重返现役，历经准将、少将，1968年晋升为军长衔中将，成为首位晋至该衔的非洲裔意大利军人，1970年获授意大利共和国功勋勋章大军官衔。1974年12月13日，多米尼哥·门德利在罗马去世，享年88岁。"
 CBIO_ROM_ermil_gheorghiu_desc:0 "厄米尔·乔治乌，1896年2月13日生于博托沙尼，是二战期间罗马尼亚的空军将领，曾任皇家空军司令。1942年11月，他被任命为罗马尼亚空军司令，并在战争部担任国务次卿。此前在巴巴罗萨行动初期，罗马尼亚的主力航空兵——航空战斗群曾参加比萨拉比亚与敖德萨上空的作战，因伤亡较大于1941年战局后一度解散，随后在他的指挥下重建。他在东线协同德军作战，1943年2月获德国金质十字勋章，1944年4月获骑士铁十字勋章，并两次在德军战报中被提及。1944年8月罗马尼亚倒戈后，空军转而配合苏军作战。他于1977年1月14日在布加勒斯特去世。"
 CBIO_HOL_fanny_schoonheyt_desc:0 "范妮·舒恩海特，1912年6月15日生于鹿特丹，是一名记者、摄影师，也是参加西班牙内战的荷兰志愿者。她出身富裕之家，却因信奉社会主义与共产主义而与家庭疏远。1930年代初，她怀着当驻外记者的愿望前往巴塞罗那，曾协助筹备一场为抵制在纳粹德国举办的奥运会而设的巴塞罗那人民奥林匹克运动会，但因战争爆发未能举行。1936年7月内战爆发时她正在巴塞罗那，随即拿起武器参加抵抗军事政变，成为唯一一位真正投入战斗的荷兰女性志愿者。她加入加泰罗尼亚统一社会党的民兵，在阿拉贡前线作战直至负伤，因作战勇猛而得了机枪女王的绰号。1937年荷兰一纸皇家法令剥夺了赴西班牙志愿者的国籍。此后她辗转多地，1940年在多米尼加生下一女，曾在库拉索以摄影为生，约1955年返回荷兰。1961年12月23日去世，享年四十九岁。"
 CBIO_ETH_fitawrari_yeebio_woldai_desc:0 "菲雷利·依比奥·沃尔盖，人称韦迪·韦尔盖，出身提格雷恩德尔塔省萨姆雷。1943年，海尔·塞拉西政府在提格雷推行行政集权化改革，撤并省份、削弱地方世袭权贵，引发当地农民和地方首领不满。民众以格雷布的形式组成地方议事会，推举代表参加中央议事会申戈，沃尔盖与德贾兹马奇内古伊斯·贝扎比同时当选起义军首领，史称沃扬内起义。起义军以沃克罗为大本营，先后在塞尔金、阿拉等地击败装备精良的皇家政府军，缴获大批现代武器，一度攻占克伊哈、恩达耶稣斯，进而拿下行省首府梅克莱。皇帝随即调集军队反攻，并请英国皇家空军协助，于同年十月对梅克莱等地实施轰炸，起义终被镇压。"
 CBIO_ETH_feodor_konovalov_desc:0 "费奥多尔·科诺瓦洛夫出身克里米亚，曾在沙俄军中服役，一战期间在皇家近卫航空队任职并一度指挥一个航空分队。俄国十月革命后，他随白俄军队辗转经君士坦丁堡、埃及，于1919年抵达埃塞俄比亚，此后加入埃塞俄比亚国籍，供职于公共工程局，是当时留居该国的白俄军官之一。1935年7月，海尔·塞拉西皇帝派他前往提格雷，协助拉斯塞尤姆·门格沙评估防务，此后他以军事顾问身份亲历意埃战争多场战役，并留下详尽的战地见闻录。意大利占领亚的斯亚贝巴后，他在当地滞留数月，见证占领初期局势，其战时回忆录后来经意大利当局审查后出版，内容较原始版本更倾向于为意方立场辩护。"
 CBIO_ROM_gheorghe_argeseanu_desc:0 "格奥尔基·阿尔杰沙努，1883年2月28日生于卡拉卡尔，是罗马尼亚的骑兵将领与政治人物。他在第一次世界大战中升至军中要职，1921至1922年任罗马尼亚首位驻日本武官，1938年在第二届米隆·克里斯泰亚内阁中任国防部长。1939年9月首相克利内斯库遇刺后，卡罗尔二世国王任命他为首相，任期仅约一周，并晋升为中将。任内他下令公开陈列刺客的尸体，并在各县不经审判地逮捕、处决铁卫团成员，是当时针对军团的血腥镇压的一环。不久他被阿尔杰托亚努接替。1940年铁卫团建立国民军团国家后，他被关入日拉瓦监狱；同年11月26日至27日夜间，他与其他数十名政治犯一同在日拉瓦惨案中被军团分子杀害。"
 CBIO_ROM_gheorghe_avramescu_desc:0 "格奥尔基·阿夫拉梅斯库，1884年1月26日生于博托沙尼一个农家，是第二次世界大战期间罗马尼亚的陆军中将。他早年就读于步兵与骑兵军官学校，参加过第二次巴尔干战争与第一次世界大战，在马拉谢什蒂等战役中表现出色。二战期间，他先后指挥第十师、山地军以及第三军、第六军。作为山地军军长，他参加了慕尼黑行动、亚速海之战、克里米亚战役与塞瓦斯托波尔围攻战，1942年7月因功晋升中将。1944年8月罗马尼亚倒戈后，他出任第四集团军司令，率部转而进攻德军与匈军，一路推进到匈牙利与斯洛伐克境内。1945年3月2日，他在斯洛伐克前线被苏联方面以涉嫌亲德为由逮捕，其妻女次日亦被捕并流放西伯利亚，女儿自尽。苏方称他于3月3日在一次德军空袭中丧生，但外界普遍怀疑他实为苏联内务人民委员部所害，死因至今存疑。2000年，他的遗骸被迎回罗马尼亚，以军礼重葬于克卢日。"
 CBIO_ROM_gheorghe_potopeanu_desc:0 "格奥尔基·波托佩亚努，1889年4月15日生，二战期间罗马尼亚炮兵将领，也曾任经济与财政部长。他早年在总参谋部任作战处处长，历任炮兵团长、炮兵旅长，1936至1938年间出任驻法国与比利时武官，1940年任第二集团军参谋长。1941年1月至5月，他在安东内斯库政府中任国民经济部长，随后回到军中指挥第一边防警卫师、第二军区。1944年2月，他接替阿列克夏努出任德涅斯特河东岸的军事总督，直至同年3月中旬该地区在苏军推进下相继失守。此后他指挥第七军。1944年8月23日政变后，他在首届瑟讷泰斯库政府中任国民经济兼财政部长，至10月卸任。此后他数度被共产政权逮捕，1949年被判五年，1953年获释，1957年又以叛国罪被判十五年，1963年获释。1966年去世。"
 CBIO_ROM_gheorghe_mihail_desc:0 "格奥尔基·米哈伊尔，1887年3月13日生于布勒伊拉，罗马尼亚的职业军官。他早年就读于步兵军官学校，1911年曾赴奥匈军队受训，参加过第二次巴尔干战争与第一次世界大战，在马拉谢什蒂等战役中两度负伤，获米哈伊勇士勋章。1933年他出任总参谋部情报处处长，1939年升师级将领并指挥第二军，还在国防部担任副国务秘书。1940年7月至8月，他在吉古尔图政府中任副首相，是卡罗尔二世国王的亲信。1940年8月至9月，他出任总参谋长；同年9月安东内斯库掌握全权后，将他转入预备役并软禁于锡纳亚。战时他与米哈伊国王建立了信任关系。1944年8月23日政变当天，他被重新起用，再度出任总参谋长，直至10月12日因与政府意见不合而去职。此后他晋升为大将。1948年他被共产政权逮捕，历经多处监狱，1957年获释。1982年1月31日在锡纳亚去世，享年九十四岁。"
 CBIO_ROM_gheorghe_gheorghiu_dej_desc:0 "格奥尔基·乔治乌·德治，1901年11月8日生于伯尔拉德一个贫苦工人家庭，是罗马尼亚首位共产党领导人。他早年当铁路电工并投身工会运动，1930年加入当时非法的罗马尼亚共产党。1931年他因共产主义鼓动被惩罚性调往特兰西瓦尼亚的德治镇，德治这一附名即由秘密警察所加，以与其他同姓活动分子相区别。1933年他参与领导格里维察铁路大罢工，同年被捕判刑，关押于多夫塔纳等监狱，1936年当选党中央委员并成为狱中派领袖。二战期间他被安东内斯库政权关入特尔古日乌集中营，1944年8月越狱。政变后他任共产党总书记，并出任交通部长，1945年3月在苏联支持下逼退拉德斯库、扶持共产党主导的政府上台。1947年底他与格罗萨一同逼迫米哈伊国王退位。此后他长期主政罗马尼亚，1952年至1955年任首相，1961年起任国务委员会主席，推行斯大林式的集体化、工业化与镇压，多瑙河至黑海运河的强制劳工工程即在其任内，晚年则逐步走上相对独立于莫斯科的路线。1965年3月19日因肺癌去世。"
 CBIO_ROM_gheorghe_jienescu_desc:0 "格奥尔基·日耶内斯库，1894年9月16日生于多尔日县的拉斯特，是二战期间罗马尼亚的空军将领。他出身乡村教师家庭，一战时以步兵少尉参加马拉什蒂与马拉谢什蒂等战役，战后被派往英国牛津与法国深造，改学飞行并取得飞行执照。两战之间他长期从事航空教育，1923年至1926年任泰库奇飞行学校校长，培养出罗马尼亚最早几批战斗机飞行员，并编写了早期飞行条令；1935年，他率三架国产伊卡尔通用教练机完成布加勒斯特至开普敦的远程飞行，在国际上引起反响。凭借出众能力，他虽仅为上校便被擢升主掌罗马尼亚航空。1940年安东内斯库掌权后，他于9月出任空军与海军国务次卿，1941年1月起专任空军国务次卿，直至1944年8月23日，是安东内斯库政府的重要成员。1948年2月，他在对安东内斯库政府的审判中被判处二十年苦役，1964年获释。1971年4月3日去世。"
 CBIO_ROM_gheorghe_vasiliu_desc:0 "格奥尔基·瓦西柳，1892年生，是二战期间罗马尼亚的空军将领。他于1924年由卡罗尔王储引入航空界，1940年获罗马尼亚之星勋章军官级。1944年8月，他任罗马尼亚第三航空军司令，兼第一航空区司令，正值美英对罗马尼亚发动大规模空袭、罗方战斗机部队苦战之际，是当时航空兵的高层指挥官之一。1944至1945年间，他出任航空国务次卿。此后他境遇凄凉，1951年起被拘押，1954年9月20日在锡盖特监狱中去世。"
 CBIO_ETH_getachew_abate_desc:0 "格塔丘·阿巴特出身贵族世家，父亲为里凯梅夸斯阿巴特·巴耶勒乌。他自幼在梅内利克二世宫中长大，与被废黜的皇孙利吉·伊亚苏一同接受教育。1919年他代表埃塞俄比亚赴意大利祝贺盟国胜利，1921年参与缉拿逃亡中的利吉·伊亚苏。1925年他出席日内瓦裁军会议，1926年受封比特沃德衔并出任卡法、戈尔迪亚、马吉及格拉等地首长，1928年出任埃塞俄比亚驻国联代表，1929年转任驻法公使。意埃战争爆发后，他以卡法首长身份统率卡法军团，1936年3月抵达科雷姆增援皇帝本部，随后在迈车战役中指挥帝国卫队，战役接近尾声时被皇帝任命为殿后司令阿斯马奇，率残部护送皇帝撤往亚的斯亚贝巴。意大利兵临首都之际，他随皇帝一同流亡，途经巴勒斯坦时脱离皇室队伍，旅居耶路撒冷一段时日，其后返回被占领的埃塞俄比亚并向意大利当局投诚。"
 CBIO_ETH_haile_abba_mersa_desc:0 "海尔·阿巴·梅尔萨来自巴莱省的菲塔乌拉里。1935年10月2日埃塞俄比亚举行全国动员时，他率领麾下扈从奔赴首都亚的斯亚贝巴听候调遣，随行者除传统圆盾外，还配备了勒贝尔或富西尔格拉斯一类的老式步枪。1936年，随着埃塞俄比亚军队在战争末期全线溃散，他被意大利军队杀害。"
 CBIO_ETH_haile_mariam_desc:0 "海尔·玛丽亚姆·雷达，出身提格雷恩德尔塔省丹德拉，后受封布拉塔衔。意埃战争初期他投身抵抗意大利占领的游击活动，此后却接受意占当局授予的布拉塔头衔及丹德拉村长一职，转而依附占领当局。1941年海尔·塞拉西复位后，他期望在新省级体系中获得承认未果，遂重操绿林生涯，成为提格雷东部最具声望的武装首领之一。1943年，他被各地农民议事会推举为沃扬内起义最高领袖，统率数万农民武装攻克克伊哈、恩达耶稣斯与行省首府梅克莱，一度迫使政府军溃退，起义后被皇家空军轰炸镇压，他被捕入狱二十二年。1974年革命后，他被视为反抗帝制的象征，一度出任德尔格在提格雷的民兵负责人，此后又被提格雷人民解放阵线俘获释放，长期受德尔格软禁，直至1991年该政权垮台方获完全自由。1995年3月1日去世，享年85岁。"
 CBIO_HOL_hein_ter_poorten_desc:0 "海因·特尔·波尔滕，1887年11月21日生于荷属东印度爪哇的茂物，父亲是政府海军的大副。他于1911年任炮兵军官，并参与创建陆军航空兵。此后他在东印度逐级晋升，1939年7月出任荷属东印度殖民军的总参谋长。1941年10月，前任司令贝伦斯霍特因飞机失事身亡，他遂升任该军总司令。他被同僚视为通晓东印度军务的干练指挥官，与部属相处融洽，但同文官当局关系欠佳。1942年1月对日战争爆发后，他出任美英荷澳联合司令部的陆军司令，到3月已成为爪哇岛盟军的实际统帅。随着日军迅速推进，他被迫于1942年3月8日就爪哇向日军无条件投降，并被迫在电台宣读投降声明。此后他辗转多座战俘营，1945年获释后返回荷兰，同年11月辞去军职。1968年1月15日在海牙去世。"
 CBIO_HOL_karel_doorman_desc:0 "荷兰海军英雄卡雷尔·多尔曼，1889年4月23日生于乌得勒支，出身军人家庭，1906年进入荷兰皇家海军服役，早年长期往返荷属东印度，并参与新几内亚沿岸测绘。一战前后他转入海军航空兵，是荷兰海军航空力量的早期建设者之一，后来又指挥巡洋舰和东印度舰队。1942年初，日本南下荷属东印度，美英荷澳临时联合舰队仓促成军，参战舰艇来自四个国家，通信、训练和战术习惯并不统一，多尔曼临危受命赴前线参战。2月27日爪哇海战中，面对火力、侦察和夜战经验均占优势的日本舰队，他奉命拦截前往爪哇的日军登陆部队。战斗中英舰埃克塞特号受创、荷舰科尔特纳尔号被鱼雷炸成两截，联军队形陷入混乱。他果断发出战术信号“全体舰只跟我前进。”这句话也成为载入二战史册的名言。爪哇海战的战斗持续至夜间，联合舰队几乎被彻底摧毁。多尔曼的旗舰德·鲁伊特号被日军鱼雷击中后沉没，他严守海军传统放弃逃生，随舰阵亡。1942年6月，他被追授威廉军事勋章。战后荷兰海军多艘舰艇以其命名。"
 CBIO_HOL_henri_winkelman_desc:0 "荷兰总司令亨利·温克尔曼，1876年8月17日生于马斯特里赫特，荷兰职业军人，出身陆军步兵，曾任第四师师长，1934年以中将军衔退役。1939年总动员后，最高统帅雷因德斯与国防大臣迪希霍恩因防线部署争执不断，1940年2月雷因德斯去职，已退役的温克尔曼被紧急召回，接掌荷兰陆海军最高指挥权。此时荷军装备落后、缺乏坦克和现代航空兵，他只能选择以荷兰堡垒、格雷伯防线和水线体系拖延德军，等待英法援助。5月10日德军突袭后，空降兵企图直取海牙、俘获王室和政府，却遭荷军顽强阻击；东部防线虽迅速承压，阿夫鲁戴克大堤和格雷伯山等地仍给德军造成阻滞。5月14日德军轰炸鹿特丹后，又威胁继续轰炸乌得勒支。面对无险可守的首都圈和密集城市群，他判断继续抵抗只会让城市毁灭，遂于15日在赖索德一所学校签署投降书。投降后他拒绝向德国承诺不再抵抗，因而于7月被拘押为战俘，直到战争结束。战后荷兰没有对他进行清算，反而授予威廉军事勋章，在赖索德签降学校前树立了他的雕像。1952年12月27日，温克尔曼在苏斯特贝赫去世。"
 CBIO_ETH_heruy_wolde_selassie_desc:0 "赫鲁伊出身绍阿平民家庭，年少时在恩托托圣拉古埃尔教堂求学，据传是教师沃尔德·吉尔吉斯为他取名赫鲁伊，意为珍贵。他自学英语与法语，1916年被摄政拉斯塔法里任命为亚的斯亚贝巴市长兼政府印刷所所长，此后长期主管官方出版事务，并以阿姆哈拉语写作历史、宗教、游记与小说，一生著述约二十余部，是二十世纪初埃塞俄比亚新文学的奠基人物之一。他是1922年埃塞俄比亚首次出席国联代表团成员，并随拉斯塔法里出访欧洲。1930年海尔·塞拉西加冕后，他出任外交大臣，任内主张埃塞俄比亚效仿日本明治维新的现代化道路，1931年曾率团访日。意埃战争爆发后，他随皇帝流亡英国，尽管此前曾投票反对皇帝离境赴日内瓦申诉。1938年9月19日，赫鲁伊在英国巴斯的费尔菲尔德庄园去世。"
 CBIO_HOL_hendrik_van_oyen_desc:0 "亨德里克·范厄延，1889年4月25日生于海牙，1911年前就读于布雷达皇家军事学院，后长期在荷属东印度殖民军服役，出任其航空兵的指挥官，1940年晋升少将。1942年2月，他在美英荷澳联合司令部中任空军副司令。日军登陆爪哇后，他与范莫克一同撤往澳大利亚，几天后荷属东印度投降。在澳大利亚与美国，他负责完成飞行员训练，为此在美国密西西比州的杰克逊设立荷兰军事飞行学校，并统辖在澳的荷兰部队。1943年10月，他晋升中将，接替被日军俘虏的特尔·波尔滕出任殖民军副司令，着手为日本投降后重建荷兰武装力量。1946年1月，他将指挥权移交给斯波尔。1953年7月28日在海牙去世。"
 CBIO_HOL_hendrik_seyffardt_desc:0 "亨德里克·赛弗法特，1872年11月1日生于布雷达，父亲曾任荷兰陆军大臣。他自幼从军，十五岁入布雷达皇家军事学院，此后长期在荷兰陆军服役，1900年起在军事学院任教，1928年晋升少将，1934年退役。退役后他为保守的民族复兴联盟发表演讲，1937年一度加入荷兰国家社会主义运动并为其刊物撰稿，但因不满米塞特与罗斯特·范托宁根之间的内斗，约一年半后退出。作为坚定的反共者，他于1941年7月经国家专员赛斯-英夸特任命，出任荷兰志愿军团的挂名指挥，该军团隶属武装党卫队、在东线对苏作战，他的职责主要是征募与宣传，因而被称作荷兰将领中唯一的叛徒。1943年2月起，他又在米塞特的影子机构中任军团事务代表。荷兰共产主义抵抗组织CS-6认定其职务可能导向强制征兵，遂以他为目标。1943年2月5日晚，他在海牙住所门口遭该组织成员枪击，次日不治身亡。德方为他举行了纳粹式葬礼，并以其名命名一支东线部队。"
 CBIO_HOL_hendrikus_colijn_desc:0 "亨德里克斯·科莱恩，1869年6月22日生于哈勒默梅尔。早年入殖民地军队，在苏门答腊的亚齐战争中随范霍伊茨作战，并参与荷属东印度的镇压行动，其家信中留有对平民施暴的记述。1909年返回荷兰后当选反革命党众议员，先后出任巴塔维亚石油公司与皇家壳牌的负责人。1922年他从库伊珀手中接掌反革命党，次年任财政大臣。1925至1926年首度组阁任首相，1933至1939年间又四度出任首相。面对大萧条，他推行保守的紧缩与保护主义政策，坚持金本位直至1936年，并颁令禁止公务员加入荷兰国家社会主义运动。1939年他的末届内阁仅存三天便因政治危机瓦解，遂于8月辞职。1940年荷兰战败后，他发表小册子《在两个世界的边界上》，主张接受德国在欧洲的领导地位，不久又转而试图组织政治抵抗，1941年6月被捕并押往柏林审讯。1943年3月起，他被软禁于图林根伊尔梅瑙的一处山间旅馆，1944年9月18日在当地去世。"
 CBIO_HOL_godfried_van_voorst_tot_voorst_desc:0 "霍德弗里德·范福尔斯特·托特·福尔斯特，1880年12月29日生于坎彭，出身天主教贵族世家，父亲是中将并曾任参议院议长。他1901年以全班第一的成绩从布雷达皇家军事学院毕业，投身步兵，1907年起任威廉明娜女王的侍从武官。他是一位知名的军事战略家，著述颇丰，早年研究施里芬计划并撰文强调林堡省在德国战略中的关键地位，该文被译成多种文字。他后进入总参谋部，代表荷兰出席日内瓦裁军会议。二战前夕，他警告要防范闪电战与机械化战争，与雷因德斯意见相左，其构想得到温克尔曼支持。1940年他出任野战军司令，德军入侵后曾在格雷伯山一带组织抵抗，终被迫西撤。战后他拒绝向纳粹宣誓效忠，与其兄一同被送往德国战俘营，度过战争余下的五年。1960年他八十寿辰时获授名誉上将衔。1963年11月11日在菲拉克尔去世。"
 CBIO_ROM_horia_macellariu_desc:0 "霍里亚·默切拉留，1894年5月10日生于克拉约瓦，是二战期间罗马尼亚皇家海军的少将、黑海舰队司令。他1915年成为海军军官，一战时任指挥舰舰长，1927至1928年在巴黎海军战争学校进修。1941年罗马尼亚对苏参战后，他任海军参谋长，1942年1月出任驱逐舰分队司令，这是黑海轴心国最强的水面舰艇编队；1943年初升任黑海舰队司令，同年3月晋升少将。任内他主持了舰队的扩充，包括国产潜艇海豚号与鲨鱼号的服役，以及意大利投降后接收其在黑海的微型潜艇。1944年4月至5月，他指挥了罗马尼亚海军规模最大、最复杂的克里米亚撤退行动，掩护德罗两军渡海撤离，因功获德国骑士铁十字勋章，是唯一获此勋章的罗马尼亚海军将领。1944年8月政变后，他拒绝了苏方交出舰队的最后通牒，并促成德军不战撤离多布罗加、保全康斯坦察港。1948年4月他被共产政权逮捕，以叛国罪判处终身苦役，后减为二十五年，先后关押于日拉瓦、艾乌德等监狱，其间曾被单独监禁，1964年大赦获释。1989年7月11日在布加勒斯特去世，享年九十五岁。"
 CBIO_ETH_prov_mil_admin_desc:0 "军管委员会并非历史上真实存在的机构，而是虚构的军人集体执政机制之名。二十世纪埃塞俄比亚历史上，1974年确曾出现由军官委员会德尔格推翻帝制、集体掌权的先例，这一真实事件为此类军人集体领导设定提供了现实参照。"
 CBIO_ETH_carl_gustav_von_rosen_desc:0 "卡尔·古斯塔夫·冯·罗森出身瑞典贵族世家，父亲是探险家埃里克·冯·罗森伯爵。1935年意大利入侵埃塞俄比亚后，他加入瑞典红十字会救护队，多次冒险驾机将伤员从前线撤离，本人也因意军使用芥子毒气而受灼伤。战争结束后他转赴荷兰加入荷兰皇家航空公司，成为该公司资深飞行员；1939年苏芬冬季战争爆发后，他辞职驾机赴芬兰助战，购入一架荷航道格拉斯DC-2改装为轰炸机参战。1940年德国入侵荷兰时，他协助荷兰政府官员携文件飞往英国，此后为瑞典航空公司效力至战争结束。1945年至1956年间，他受海尔·塞拉西皇帝之邀出任埃塞俄比亚帝国空军总教官，协助建立该国现代空军，官至上校。此后他曾在联合国刚果危机期间担任航空顾问，并为联合国秘书长达格·哈马舍尔德担任专机飞行员。1977年7月13日，他在埃塞俄比亚戈德镇协调饥荒救援期间，于索马里武装袭击安全屋的行动中身亡。"
 CBIO_ETH_ras_kassa_desc:0 "卡萨·海尔·达格（惯称拉斯·卡萨）出身拉斯塔贵族世家，父亲为德贾兹马奇海尔·沃尔德·基罗斯，母亲提塞梅·达尔盖是梅内利克二世叔父拉斯·达尔盖·萨赫勒·塞拉西之女，他因此成为塞拉莱宗支最年长的皇族亲王。他长期是海尔·塞拉西最信赖的重臣之一，1928年曾协助收买德贾兹马奇巴尔科·萨福麾下军队，助其化解一场危机。意埃战争期间，他出任右翼军团司令，率部参加第一、第二次滕比恩战役。战争期间，他的四子中有三人沃恩多森、阿贝拉与阿斯法沃森相继被意军俘获处决。他本人随皇帝流亡英国巴斯，寓居费尔菲尔德庄园，直至1941年随盟军反攻返回埃塞俄比亚。此后他出任皇室枢密院主席，并参与1955年宪法的起草工作。1956年11月16日，卡萨·海尔·达格在亚的斯亚贝巴去世。"
 CBIO_HOL_conrad_helfrich_desc:0 "康拉德·赫尔弗里赫，1886年10月11日生于荷属东印度爪哇的三宝垄，父亲是荷属东印度殖民军的军医。1907年他成为荷兰皇家海军军官，次年参加巴厘远征。早年他在海军军事学院任教时，就预言美日之间必有一战，攻击将落在珍珠港、巴拿马运河与旧金山。1939年10月，他出任荷属东印度全部海军的总司令。太平洋战争爆发后，他下令主动出击，麾下潜艇在开战头几周击沉的日舰多于英美两国海军的总和，因而在美国报界得了一日一舰赫尔弗里赫的绰号。1942年2月，他接替美国的哈特上将出任美英荷澳联合舰队司令，随即转入攻势，但在爪哇海战惨败后，联合舰队几乎全军覆没，他乘飞艇撤往锡兰。1945年他晋升海军上将，出任荷兰海军司令，并于同年9月2日代表荷兰王国在密苏里号战列舰上签署日本投降书。1962年9月20日在海牙去世。"
 CBIO_HOL_cornelis_van_geelkerken_desc:0 "科内利斯·范赫尔克肯，1901年3月19日生于比利时的圣扬-莫伦贝克，出身荷兰人家庭，1904年随家迁居乌得勒支。他曾在蔡斯特与乌得勒支担任市政及省水利部门职员，1920年代倾向法西斯主义。1931年，他与安东·米塞特共同创立荷兰国家社会主义运动，先后任党的秘书与副领袖，并主管其青年组织民族青年风暴团。因政府禁止公务员加入该党，他辞去乌得勒支省水利部门的职务。德国占领期间，他出任荷兰国土警卫队总监，该组织专事对付抵抗运动。1944年末至1945年初，他与米塞特发生激烈冲突，被逐出党内职务。战后他被判处无期徒刑，1959年获释，此后避居乡间，远离公众视野。1976年3月29日在埃德去世。"
 CBIO_ETH_ras_kebbede_desc:0 "克贝德在第二次意埃战争爆发之初统率伊弗拉塔军团参战。战争结束、意大利建立东非帝国后，他与拉斯塞尤姆·门格沙、拉斯格塔丘·阿巴特等地方王公一样，一度选择接受既成事实，与占领当局维持某种合作关系；1937年2月，三人曾一同在照片中向意大利表示效忠。这种妥协态度使得游击抵抗力量在部分地区的活动一度陷入低潮，直至1939年前后局势才有所改观。"
 CBIO_ETH_lij_abiye_abebe_desc:0 "利杰阿比耶·阿贝贝生于亚的斯亚贝巴，父亲为里卡梅夸斯阿贝贝·阿特纳夫塞加德。他就读霍莱塔军事学院，1934年前后即投身反抗意大利占领的游击活动。1936年迈车战役中，二十岁的他随军参战。占领期间他随皇室流亡，一度侍从皇帝左右，居于英国巴斯。1941年光复后回国，此后历任国防大臣、司法大臣及内政大臣等要职。1942年他迎娶海尔·塞拉西之女采海公主，翌年公主难产去世，此后他仍保有皇帝女婿的礼遇地位。1974年埃塞俄比亚革命期间，他出任国家安全最高委员会主席，7月16日被德尔格逮捕，时任总参谋长。同年11月23日夜，阿比耶·阿贝贝与另外五十九名前朝官员一同在阿卡基中央监狱被处决。"
 CBIO_ETH_lij_johannes_desc:0 "利杰约翰内斯，全名利吉·约翰内斯·伊亚苏，生于1915年，是1916年被废黜的皇帝候选人利吉·伊亚苏之子。意大利占领期间，他投身爱国者游击运动，一度自立为帝以凝聚人心；1938年7月25日，他致信国联，强调埃塞俄比亚民众团结一致抵抗侵略者，称意占当局虽据守设防据点，却始终无法真正征服这个国家。1941年光复后，他因与他人密谋而受到猜忌，被流放至吉马半软禁。1977年，利杰约翰内斯去世。"
 CBIO_HOL_maarten_belzer_desc:0 "马尔滕·贝尔泽，1870年9月22日生于霍林赫姆，是荷兰的步兵中将，也是最高军事法院的成员。他1892年任步兵少尉，1896年被派往荷属东印度殖民军，参加了1897至1898年镇压亚齐的战事。回国后，他历任皇家军事学院、新荷兰水线与总参谋部的职务。1926年他晋升上校并出任第二步兵旅旅长，1928年升少将，1930年升中将。他自1927年起任最高军事法院成员，直至1940年11月退役。1948年5月30日在海牙去世。"
 CBIO_ETH_makonnen_endelkatchew_desc:0 "马克南·恩德勒卡杰沃出身绍阿贵族世家，早年随拉斯塔法里出访欧洲，后出任驻英公使，因与皇帝外甥女的婚外情牵连一度被召回免职。此后他历任内政大臣，并出任伊路巴博省长；意埃战争爆发后，他率领该省军队在奥加登方向抵抗意军入侵，随后流亡耶路撒冷直至1941年。皇帝复位后，他与此前那位皇室女子完婚，1943年1月29日出任埃塞俄比亚历史上首任首相，直至1957年退休，其后转任参议院议长至1961年。1945年，他曾率团出席旧金山会议参与创建联合国，但因不通法语与英语，未能实际参与辩论。1963年2月27日，马克南·恩德勒卡杰沃去世。"
 CBIO_HOL_marius_raaijmakers_desc:0 "马里厄斯·赖马克尔斯，1874年生，是荷兰的将领。1934年5月，国防大臣德克斯任命他为一个咨询委员会的主席，负责解决当时隶属于皇家陆军的军事航空内部长期存在的权责之争——飞行部门与技术部门互不统属、矛盾重重，而他此前并无航空方面的经历。委员会在1934年8月的报告中建议，应在两部门之上设立统一的领导机构。据此，1935年4月15日，以苏斯特贝赫为驻地的军事航空监察部宣告成立，他以预备役中将的身份出任首任军事航空监察长。任内三年半，他致力于军事航空事业，推动其在1939年成为独立兵种；他还主张更新与扩充陈旧的机队，并因空军过于集中于苏斯特贝赫、易遭空袭，力主分散部署、新建军用机场。1965年去世。"
 CBIO_HOL_meinout_rost_van_tonningen_desc:0 "迈因奥特·罗斯特·范托宁根，1894年2月19日生于荷属东印度的泗水，父亲是曾在龙目、亚齐、巴厘镇压反抗的荷属东印度殖民军将领。他在莱顿大学修习法律，1923至1928年及1931至1936年任国际联盟驻维也纳代表，负责监督奥地利财政，任内形成激进的反犹与反共立场。1936年他加入荷兰国家社会主义运动，任党报《民族日报》主编，将其作为个人喉舌，立场比米塞特更为激进亲德，推动该党走向公开的反犹主义并向德国纳粹党靠拢，与米塞特长期不和。1939年他组建准军事组织米塞特卫队。1941年3月起，他出任财政部秘书长兼荷兰银行行长，其政策使荷兰承担占领费用、便利德国的战争财政，并涉及对犹太人财产的没收；他还受命清算社会民主工党、共产党等左翼组织。1945年5月他被加拿大军队俘获，先后关押于埃尔斯特、乌得勒支，5月24日转入斯赫弗宁根监狱。1945年6月6日，他在狱中身亡，官方记载为跳楼自杀，其遗孀始终否认此说。"
 CBIO_ETH_menen_asfaw_desc:0 "梅嫩·阿斯富出生于沃洛省安巴塞尔，父亲阿斯富为安巴塞尔詹提拉尔，母亲塞欣是沃洛国王米卡埃尔之女。她早年曾两度出嫁沃洛显贵，后又依外祖父之命嫁予拉斯柳勒塞盖德，直至1911年在哈拉尔与德贾兹马奇塔法里·马康宁结为夫妇。1930年丈夫加冕称帝，她随之受封皇后，此后积极投身妇女事业，创办亚的斯亚贝巴首所女子学校，并出任埃塞俄比亚红十字会及妇女慈善会赞助人。意埃战争期间随夫流亡，曾在伯利恒圣诞教堂许愿，若埃塞俄比亚光复即将王冠献予教堂，战后她果然履行诺言，此后终生未再佩戴完整王冠。1960年宫廷卫队政变期间，她一度被软禁。1962年2月15日，梅嫩皇后在亚的斯亚贝巴去世。"
 CBIO_ETH_mesfin_sileshi_desc:0 "梅斯芬·西莱希出生于绍阿阿迪斯格，父亲为德贾兹马奇西莱希·沃尔德塞马亚特。他接受教会教育后于1934年加入新组建的第一支帝国卫队营，意埃战争爆发时已是少校，参加了迈车战役。1936年5月意军占领亚的斯亚贝巴后，他转赴绍阿北部组织游击武装，与堂弟阿贝拉·卡萨参与了1936年7月那场功败垂成的收复首都行动。此后他流亡海外，与身在英国的海尔·塞拉西皇帝建立联系，往返开罗与喀土穆之间，充当皇帝与国内游击队的联络人，曾携电台与武器潜回埃塞俄比亚，会同外国反法西斯人士鼓舞士气。1940年他曾护送骡队赴苏丹接洽军火，助北方游击首领与英方结盟。1941年他随皇帝返回埃塞俄比亚参与解放战役，率部攻克戈雷，协助光复西南部。战后他历任多地省长。1974年革命期间，他于8月被德尔格逮捕，同年11月23日六十人大屠杀中被处决。---"
 CBIO_ROM_mihail_sturdza_desc:0 "米哈伊尔·斯图尔扎，1886年8月28日生，出身罗马尼亚显赫的斯图尔扎波雅尔世家，是一名外交官，后成为铁卫团成员，持法西斯与反犹立场。他早年在维也纳、布达佩斯、华盛顿等地任外交职务，1929年出任驻拉脱维亚、爱沙尼亚与芬兰的全权公使，1932年曾代表罗马尼亚与苏俄谈判互不侵犯协定，因苏方坚持讨论比萨拉比亚归属而破裂；1938年起任驻丹麦公使。作为霍里亚·西马的支持者，他在1940至1941年的国民军团国家中出任外交部长，1940年11月23日随同里宾特洛甫见证罗马尼亚加入三国同盟。1941年军团叛乱被安东内斯库镇压后，他被迫辞职，随西马流亡保加利亚、德国等地。1944年12月起，他在维也纳的一个亲纳粹流亡政府中再度出任外交部长，直至二战结束。战后他辗转丹麦、西班牙与美国，并被缺席判为战犯。1968年他出版了回忆录。1980年2月5日去世。"
 CBIO_ETH_mulugeta_yeggazu_of_illubabor_desc:0 "穆卢盖塔·耶加祖出身绍阿门兹地区阿姆哈拉贵族，与梅内利克二世沾亲带故。他青年时参加阿杜瓦战役，1905年任宫廷司库，1907年出任梅内利克内阁财政大臣；利吉伊亚苏摄政期间一度被贬，改任基米拉省长。此后他两度出任财政大臣及外交大臣，1918年因腐败指控被免职，但仍是宫廷中颇具影响的人物。1924年他随拉斯塔法里出访欧洲，1927年出任战争大臣，1931年受封拉斯，出任埃塞俄比亚南部及西部大片区域首长，势力根基设于伊路巴博。意埃战争爆发后，他统率约八万人的中央军团，1936年2月在安巴阿拉丹战役中遭意军密集炮火、空袭及芥子毒气轮番轰击，部队溃败。他在部队溃退途中身亡，一说死于拉亚部族袭击，一说与其子塔德塞一同阵亡于乱军之中，具体情形众说不一。"
 CBIO_ETH_nasibu_zeamanuel_desc:0 "纳西布·扎马努埃勒与其兄瓦萨内同在亚的斯亚贝巴梅内利克二世学校接受西式教育，早年历任阿斯马拉领事，后长期出任亚的斯亚贝巴市长，任期长达十年。1928年他参与青年埃塞俄比亚人发起的宫廷政变，协助巩固拉斯塔法里的地位。1932年他出任巴莱省长。意埃战争爆发后，他在南线接替阵亡的格拉兹马奇阿法沃尔克瓦尔达萨马亚特，出任南线埃塞俄比亚军总司令，先后以德盖哈布尔、吉吉加为指挥部，在奥加登战役中依托由韦希布帕夏设计的兴登堡防线与意军格拉齐亚尼部对抗。面对意军大规模使用芥子毒气，他曾言国联坐视我方将士浴血而毫无作为。1936年5月，他随皇帝一同流亡，一度出任埃塞俄比亚出席国联代表团团长。1936年10月16日，他因先前芥子毒气中毒引发的后遗症，在瑞士达沃斯去世。"
 CBIO_ROM_nicolae_malaxa_desc:0 "尼古拉·马拉夏，1884年12月22日生于胡希一个希腊裔家庭，是罗马尼亚的工程师与实业家。他在雅西与德国卡尔斯鲁厄学习工程，1918年后创办机车车辆维修业务并迅速壮大。到1930年代末，他的马拉夏工厂已能大批量制造蒸汽与柴油机车、车辆与钢管，是东南欧最大的工业集团之一，也是罗马尼亚铁路的主要供应商，并在雷希察钢铁业占据要位，还兼任福特公司罗马尼亚分部主席，一度被视为罗马尼亚最富有的人。他与卡罗尔二世国王过从甚密，是王室近臣圈的一员，凭借政治关系获得优渥的国家合同；与此同时，他也是铁卫团的重要金主，并向其他派别两面下注。1940年国民军团国家成立后，他一度因与军团的旧交而得利，但1941年军团叛乱被镇压后，他以协助叛乱之名被逐出企业管理层，其产业后被共产政权收归国有。1948年他出走维也纳，此后移居美国，被共产政权褫夺国籍并以战犯罪缺席判处死刑。1965年在美国新泽西去世。"
 CBIO_ROM_nicolae_sova_desc:0 "尼古拉·索瓦，1885年11月9日生于巴克乌县波杜里的鲁瑟塞什蒂，是二战期间罗马尼亚的陆军中将。他早年曾入布加勒斯特大学法律系，因家境贫寒转投军校，1909年成为步兵少尉，参加过第二次巴尔干战争与第一次世界大战，因作战英勇多次破格晋升，1917年任机枪学校校长。两战之间他历任团长、旅长，1938年任驻维也纳武官并晋升将级，1939至1940年指挥驻阿尔巴尤利亚的第二十步兵旅，1941年初任国防部人事局局长。1941年6月起，他率近卫第一师在普鲁特河、比萨拉比亚与敖德萨方向作战。1943年2月起，他出任海军国务次卿。1944年8月政变后，他请缨上前线，9月出任第七军军长，隶属第一集团军，转战匈牙利，先后在蒂萨河多次建立登陆场，1945年1月一度推进到布达佩斯市中心。此举招致苏方忌惮，其部被调往斯洛伐克，他本人随后被解职，1945年3月转入预备役。1946年他被逮捕，1948年被判十年苦役，1956年从艾乌德监狱获释。1966年3月12日去世。"
 CBIO_HOL_nico_van_straten_desc:0 "尼科·范斯特拉登，1897年9月3日生于兹沃勒，是荷属东印度殖民军的步兵少将，威廉军事勋章骑士。他毕业于皇家军事学院，1918年任步兵少尉并被派往东印度，此后在苏拉威西、万隆等地历任军职。太平洋战争爆发后，1941年12月他以中校身份率领一支约六百名殖民军与三百名澳大利亚士兵组成的部队，从库邦出发抢先进占葡属帝汶的首府帝力。1942年2月日军在帝力登陆后，他指挥有方，把两度被击散的部队重新组织为游击队，在帝汶山区坚持作战，使日军的征服举步维艰，直到5月24日他乘美军飞艇撤往澳大利亚与麦克阿瑟等人会商。因在帝汶的出色表现，他获授威廉军事勋章。1944年12月他晋升少将，并曾赴华盛顿商讨组建协助解放东印度的军队。他晚年任退伍军人之家布龙贝克的院长。1968年9月18日在阿纳姆去世。"
 CBIO_ROM_petru_groza_desc:0 "佩特鲁·格罗萨，1884年12月7日生于特兰西瓦尼亚的巴恰，是罗马尼亚的政治家。他早年在布达佩斯、柏林与莱比锡求学，取得法学博士学位，一战时在奥匈军队服役。战后他是罗马尼亚民族党的知名成员、罗马尼亚东正教会有影响的平信徒，并任特兰西瓦尼亚执政委员会成员，1925至1927年间曾在阿韦雷斯库内阁中任国务部长与公共工程部长。作为富有的地主与实业家，他也以古典学造诣著称。1933年，他创立了以农民为基础的左翼组织犁农阵线，因其左倾主张而被称为红色资产者。到1944年，该组织已基本受共产党掌控，并加入民族民主阵线。1945年3月，在苏联副外长维辛斯基施压、拉德斯库政府被迫下台后，他出任首相，随即推行土地改革。他虽始终不是共产党员，却为共产政权在罗马尼亚的逐步确立铺平道路，1947年底参与逼迫米哈伊国王退位。1952年他卸任首相，转任大国民议会主席团主席，成为名义上的国家元首，直至去世。1958年1月7日因一次胃部手术后并发症去世。"
 CBIO_ROM_constantin_sanatescu_desc:0 "起义首相康斯坦丁·瑟讷泰斯库，1885年1月14日生于克拉约瓦一个军人家庭，罗马尼亚政治家、陆军将领，1944年8月起义后出任首相。他毕业于布加勒斯特步兵与骑兵军官学校，骑兵出身，参加过第二次巴尔干战争与第一次世界大战。两战之间他曾任驻伦敦、巴黎武官，1935年晋升将级，后任副总参谋长，1940年率团赴莫斯科谈判。1941年罗马尼亚参战后，他指挥第四军，在敖德萨与斯大林格勒战役中表现突出，获罗马尼亚之星勋章军官级并加剑饰。1943年他被调回国内，先后任王室军事府主管与宫廷元帅，成为国王米哈伊身边的核心人物，也是八·二三武装起义的主要军事组织者之一，起义当晚他是唯一在场亲眼见证安东内斯库被捕的人。此后受国王之命组建临时政府，先后两度组阁，稳固政权、抵御境内德军，并派团赴莫斯科签署停战协定。期间积极寻求向美国靠拢、抵制共产党影响力扩张，曾在日记中写下对苏方背后操纵国内意识形态的忧虑，但终因被自由党与农民党视为对共产党过于温和而于12月2日辞职。此后他升任大将，出任总参谋长，主持罗军对德作战直至德国投降，战后曾任军队总监。1947年11月8日因癌症去世，以军礼安葬。"
 CBIO_ETH_senedu_gebru_desc:0 "塞内度·格布鲁出生于亚的斯亚贝巴以西的门纳格沙，父亲格布鲁·德斯塔是曾赴欧留学的作家、前市长兼参议院议长。她先后在瑞士与法国求学，掌握法语与英语。意埃战争爆发后，她返回戈雷加入黑狮组织，建立红十字分队，为该组织提供意军动向情报；其兄于1937年2月19日遇害。她染病后被意军俘获审讯，因行为不驯被流放至意属阿西纳拉岛，与父亲、姐妹同囚，1939年获释返回埃塞俄比亚。1941年光复后投身教育，出任梅嫩皇后女校助理主任，两年后升任校长，成为埃塞俄比亚首位女性校长。1950年她出版剧作与诗歌合集我心之书。1957年当选国会议员，成为埃塞俄比亚首位女议员，同年出任众议院副议长；1960年出任参议院副议长。2009年4月20日，塞内度·格布鲁去世，享年93岁。"
 CBIO_ETH_ras_seyum_desc:0 "塞尤姆·曼加沙出身提格雷王族，父亲拉斯门格沙·约翰内斯是约翰内斯四世皇帝之子。1910年至1935年间，他出任提格雷西部首长；1924年曾随拉斯塔法里出访欧洲。意埃战争爆发后，他统率提格雷军团，率部参加圣诞攻势及第一、第二次滕比恩战役，与拉斯卡萨、拉斯穆卢盖塔协同作战达七月之久，最终不敌意军，本人被俘并被押往意大利。占领期间他获释后与意占当局有所合作，1941年皇帝复位后一度被软禁；1943年提格雷爆发沃扬内起义，他因涉嫌暗中支持叛乱而被召回亚的斯亚贝巴，其提格雷军队指挥权亦被解除。此后他复获信任，长期出任提格雷全境首长直至去世。1960年12月15日，帝国卫队发动政变期间，塞尤姆在亚的斯亚贝巴的绿厅事件中遇害。"
 CBIO_HOL_saul_de_groot_desc:0 "索尔·德·格罗特，1899年7月19日生于阿姆斯特丹一个犹太钻石工人家庭，在党内以化名保罗·德·格罗特为人所知。少年时全家迁往安特卫普，他做钻石切工并加入钻石工人工会。受1917年十月革命影响，他投身共产主义运动，1920年代中期定居阿姆斯特丹，活跃于荷兰共产党。1930年2月他进入党的领导层，凭借活动经历、学识与策略眼光脱颖而出，1938年出任党的政治书记，成为事实上的领袖，并任党报主编。德国入侵初期，他一度因苏德互不侵犯条约主张对占领当局持审慎态度，1941年苏德开战后转向抵抗。1942年10月德国人突袭其藏身处，他从后门逃脱，妻女却被送往奥斯威辛杀害，这令他抱憾终生。战后他于1945年重建荷兰共产党，长期以强硬手腕主导该党，是坚定的斯大林主义者，曾清洗党内异己。1970年代他反对欧洲共产主义，1977年党在大选惨败后失势。1986年8月3日在比松去世。"
 CBIO_ETH_tadesse_birru_desc:0 "塔德塞·比鲁出生于绍阿塞拉莱，祖籍图拉马奥罗莫。第二次意埃战争期间，其父死于意军毒气袭击，母亲随后因悲伤过度病故，少年塔德塞由舅父收养，加入爱国者游击队伍抵抗意大利占领，后被俘并押往意属索马里兰摩加迪沙服苦役。1941年英军攻占摩加迪沙后获释，随后赴肯尼亚接受英方军事训练。战后他历任埃塞俄比亚军警要职，1953年晋升准将，出任快速反应部队司令、国家警察副总监及国土军司令，1960年宫廷卫队政变期间以对皇帝的忠诚协助平定叛乱，并受命为来访的南非反种族隔离运动领袖曼德拉提供游击训练。1963年前后他加入奥罗莫人互助会梅查图拉马协会，此后逐渐转向为奥罗莫民族权益奔走，因涉嫌密谋政变于1966年遭软禁。1974年革命爆发后，他一度出逃并组织奥罗莫地区武装，后被捕。1975年3月19日，塔德塞·比鲁被德尔格政权处决。"
 CBIO_ETH_bedjironde_tekle_hawariate_desc:0 "特克勒·哈瓦里亚特出生于绍阿塞亚教区，幼年丧父，九岁移居哈拉尔投靠拉斯马康宁门下。十一岁时他随拉斯马康宁奔赴阿杜瓦战场，其兄阵亡，他本人则被托付给俄国红十字代表团带往俄国求学，在圣彼得堡炮兵学校研习十七年，官至上校。返国后他历任吉吉加、恰尔恰尔等地省长，并参与1916年利吉伊亚苏被废黜之事。1930年前后他创作并执导埃塞俄比亚首部话剧寓言动物喜剧，以动物讽喻宫廷腐败，一度令话剧遭禁演。1931年宪法颁布后，他出任财政大臣，是埃塞俄比亚首位登上部长之位的留洋知识分子，但因整顿财政触怒守旧势力及皇帝本人，任职不足一年即遭调任，此后出任驻伦敦、巴黎及日内瓦公使，代表埃塞俄比亚出席国联沃尔沃事件相关会议。1977年4月，特克勒·哈瓦里亚特在希尔纳去世，享年92岁。"
 CBIO_ETH_tekle_hawariat_tekle_mariyam_desc:0 "特克勒·哈瓦里亚特出生于绍阿塞亚教区，幼年丧父，九岁移居哈拉尔投靠拉斯马康宁门下。十一岁时他随拉斯马康宁奔赴阿杜瓦战场，其兄阵亡，他本人则被托付给俄国红十字代表团带往俄国求学，在圣彼得堡炮兵学校研习十七年，官至上校。返国后他历任吉吉加、恰尔恰尔等地省长，并参与1916年利吉伊亚苏被废黜之事。1930年前后他创作并执导埃塞俄比亚首部话剧寓言动物喜剧，以动物讽喻宫廷腐败，一度令话剧遭禁演。1931年宪法颁布后，他出任财政大臣，是埃塞俄比亚首位登上部长之位的留洋知识分子，但因整顿财政触怒守旧势力及皇帝本人，任职不足一年即遭调任，此后出任驻伦敦、巴黎及日内瓦公使，代表埃塞俄比亚出席国联沃尔沃事件相关会议。1977年4月，特克勒·哈瓦里亚特在希尔纳去世，享年92岁。"
 CBIO_ETH_wehib_pasha_desc:0 "韦希布帕夏原名穆罕默德·韦希布，出生于奥斯曼帝国雅尼纳，是当地一位显赫家族的后裔，其兄埃萨德帕夏曾在1915年加里波利战役中担任指挥官。他在奥斯曼军中服役多年，参加过巴尔干战争及第一次世界大战多个战场。意埃战争爆发后，他以退役将领身份自愿赴埃塞俄比亚效力，出任拉斯纳西布麾下南线参谋长，仿照第一次世界大战德军兴登堡防线的构筑理念，在德盖哈布尔一线设计了被称为兴登堡防线的堑壕防御体系，抵御意军格拉齐亚尼部队自索马里兰方向的进攻。他曾对来访记者夸口，称自己的威名足以令意军中的当地部队望风而逃。历史学家对这道防线的实际质量评价不一，有人称赞其巧妙利用地形，也有人认为其构筑仓促、防御薄弱。1936年奥加登战役中，这道防线最终被意军突破。"
 CBIO_ETH_viking_tamm_desc:0 "维京·塔姆出生于斯德哥尔摩，父亲亨里克·塔姆曾任瑞典财政大臣。他1916年起在瑞典近卫军服役，1930年任瑞典总参谋部上尉。1934年，他与时任皇帝军事顾问的埃里克·维尔京少将及另外四名瑞典军官一同应邀赴埃塞俄比亚，协助筹建该国唯一一所军官训练学校，校址设于霍莱塔。意埃战争爆发后，尽管瑞典政府施压要求撤离，塔姆仍与部属一同留任。1936年他返回瑞典军队复职，1940年苏芬冬季战争期间志愿指挥瑞典志愿军第二战斗群参战。1945年至1946年间，他再度赴埃塞俄比亚协助重建军官训练体系。此后他在瑞典军中步步晋升，历任战争学院院长、团长、陆军总参谋长及第一军区司令，1961年以中将军衔退役。1975年11月25日，维京·塔姆去世，享年79岁。"
 CBIO_ETH_wondossen_kassa_desc:0 "翁多森·卡萨是拉斯卡萨·海尔·达格的长子。1930年安契姆战役中，他协助击败拉斯古格萨·韦勒叛军，因功出任贝格姆德尔首长。意埃战争期间，他随父在北线作战，参加迈车战役。意大利占领初期，他与两位胞弟阿贝拉、阿斯法沃森一同参加1936年7月进攻亚的斯亚贝巴的行动，行动失败后潜逃避捕，转赴阿布纳约瑟夫山一带坚持游击。1936年12月19日，他在特凯泽河源头附近被沃洛奥罗莫人捕获，随即被意大利占领当局处决。"
 CBIO_HOL_walraven_van_hall_desc:0 "沃尔拉文·范霍尔，1906年2月10日生于一个有影响力的荷兰家庭，其兄希斯·范霍尔后来出任阿姆斯特丹市长。他早年想当商船船员，因视力不合格未能如愿，1929年赴纽约在华尔街一家公司任职，学得银行业务后回国，成为银行家与证券经纪人。1940年德国占领荷兰后，他与兄长为滞留海外的商船海员家属设立救济基金，此后不断扩大募款范围，接济各类抵抗团体，因而被称为抵抗运动的银行家。1943年，他推动成立全国支援基金，通过秘密贷款以及在荷兰银行进行的巨额票据造假筹措资金，据估算总额相当于今日的数亿欧元，先后向约十五万人发放援助，并资助了铁路大罢工与多份地下报刊。他善于在各团体间调和，得了油人的绰号。1945年1月他因叛徒出卖被捕。1945年2月12日，他在哈勒姆被德国占领当局枪决。他身后获颁荷兰抵抗十字勋章，并被以色列列为国际义人。"
 CBIO_ETH_workneh_eshete_desc:0 "沃克内·埃希特出生于贡德尔，又名查尔斯·马丁。1868年马格达拉之围中他与父母失散，被英军收留带往印度，后辗转由几位英国资助人抚养，因此采用查尔斯·马丁之名。他先后在拉合尔医学院与爱丁堡大学求学，1901年取得医学学位，成为首位接受西式医学教育的埃塞俄比亚人。此后他一度出任梅内利克二世私人医生，1902年携五名埃塞俄比亚少年赴海外求学。1919年结束在英属机构二十八年任职后返回埃塞俄比亚效力，1928年获封阿扎兹衔并出任特别法庭庭长，1930年出任恰尔恰尔省长，任内致力于禁绝奴隶买卖。1934年起，他出任埃塞俄比亚驻英公使，意埃战争前夕在伦敦为祖国奔走呼号。他两个女儿分别嫁入王室旁支及日后的财政大臣伊尔马·德雷萨家中。1952年10月8日，沃克内·埃希特去世，享年87岁。"
 CBIO_ETH_amare_makonnen_desc:0 "虚构架空人物。其教名阿玛雷在阿姆哈拉语与提格利尼亚语中意为他很英俊，是埃塞俄比亚民间常见的祝愿式男名，寄托父母对孩子容貌与福气的期许。姓氏玛康宁则源自吉兹语古代贵族头衔，本意为总督或执政官，历史上曾由哈拉尔总督拉斯·玛康宁·沃尔德米卡埃尔承袭，其子便是后来的皇帝海尔·塞拉西；这一姓氏此后也常见于埃塞俄比亚显贵世家，如曾任首相的玛康宁·恩德勒卡杰沃。此名将寓意俊美的寻常教名与象征贵族门第的姓氏相嫁接，勾勒出一位出身平凡却又攀附显赫姓氏的虚构人物形象。"
 CBIO_HOL_jacob_adriaan_de_wilde_desc:0 "雅各布·阿德里安·德·王尔德，1879年1月7日生于泽兰的高斯，是反革命党的政治家与法学家。他攻读法律后当律师，并曾任报刊编辑，包括反革命党机关报的主编。他自1916年起任海牙市议员，1919年任财政参事，1918年当选众议员。1933年他在科莱恩内阁中出任内政大臣，兼管邮政、电话与广播事务。面对纳粹主义抬头，他曾在1936年以辱及友邦元首为由，查禁了一家自由思想者电台。1937年他改任财政大臣，1939年因不满一项耗资巨大的工赈计划而辞职。荷兰被占后，他因立场坚定被视为危险人物遭拘押，先后关押于富赫特与圣米希尔斯赫斯特尔人质营。获释后他参与地下反革命党的影子机构，因科莱恩已于1944年去世，他一度出任该党代理主席。战后他曾任参议员。1956年1月10日在海牙去世。"
 CBIO_ROM_ion_antonescu_desc:0 "扬·安东内斯库，1882年6月14日生于皮特什蒂，是罗马尼亚的军官与元帅，二战期间大部分时间以首相兼“领导者”的身份实行独裁。他早年在1907年农民起义与第一次世界大战中崭露头角，曾任驻法武官、总参谋长与国防部长。1930年代末他因亲近铁卫团、与卡罗尔二世冲突而被拘押。1940年罗马尼亚接连失地、政局动荡之际，他于9月出任握有绝对权力的首相，逼卡罗尔二世退位、拥立米哈伊为傀儡国王，自称“领导者”。他先与铁卫团合组国民军团国家，1941年初以军队镇压军团叛乱，同时使罗马尼亚倒向纳粹德国、加入轴心国。1941年他随巴巴罗萨行动进攻苏联，收回比萨拉比亚与北布科维纳，并晋升元帅。他的政权直接造成多达数十万人死亡，多为比萨拉比亚、乌克兰与罗马尼亚的犹太人及罗姆人，敖德萨大屠杀与向德涅斯特河东岸的大规模驱逐即在其列；他是罗马尼亚大屠杀的主要责任人。东线惨败使其威信崩塌。1944年8月23日，他在米哈伊国王的政变中被捕。战后经人民法庭判处死刑，1946年6月1日在日拉瓦被枪决。"
 CBIO_HOL_jan_goudriaan_desc:0 "扬·豪德里安，1893年12月5日生于阿姆斯特丹，是一位工程师与企业经济学者，被视为荷兰现代企业管理学的奠基人。他1915年从代尔夫特理工学院机械工程专业毕业，先后任劳动督察、标准化局局长，并在费嫩奥德公司任总工程师。1926年起他在鹿特丹商学院、其后又在代尔夫特理工学院任企业管理学教授。1928年他进入飞利浦公司，1933年升任副经理。他自1912年加入社会民主工党，1933年因不满该党在七省号兵变问题上的立场而退党。作为经济学者，他主张改革国际货币制度，以一篮子代表性商品取代黄金作为币值基准，批评当时的通货紧缩政策。1938年，他受政府举荐出任荷兰铁路公司总经理，着手削减亏损、革新经营。战后他重返学界。1974年3月22日在阿姆斯特丹去世。"
 CBIO_ETH_yilma_deressa_desc:0 "伊尔马·德雷萨出身沃莱加奥罗莫贵族，父亲布拉塔德雷萨·阿曼特是当地知名的报刊撰稿人与口述史学者。意埃战争爆发后，他加入黑狮组织，1936年12月随拉斯伊姆鲁·海尔·塞拉西在戈耶布河畔投降，后被囚禁于意大利庞扎岛，因此躲过了次年格拉齐亚尼遇袭后的大规模报复行动。1941年光复后，他出任财政副大臣，此后长期无人被任命于其上，实际主持财政部的重建工作，协助建立新的会计体系与财政制度。1943年他促成埃塞俄比亚从美国获得白银贷款以铸造新币，减少对英镑体系的依赖。1953年至1957年他出任埃塞俄比亚首任驻美大使，其后回国出任财政大臣直至1970年，其间一度兼任外交大臣。1974年革命后，他与多名前朝官员一同被关押。1979年1月，伊尔马·德雷萨因癌症病逝于亚的斯亚贝巴狱中，享年71岁。"
 CBIO_HOL_izaak_reijnders_desc:0 "伊萨克·雷因德斯，1879年3月27日生于斯塔茨卡纳尔，出身于一位市长之家。他毕业于布雷达皇家军事学院，逐级晋升，1934年5月出任荷兰陆军总参谋长。1939年8月荷兰军队总动员后，他升任陆海军最高统帅。他主张加快军备现代化，对德国的闪电战与空降突袭屡有警告，却常被政界视为危言耸听。围绕防线布置与战时职权，他与国防大臣迪希霍恩龃龉不断，1940年2月5日被迫荣誉去职，由退役将领温克尔曼接任。1944年有人请他出任国内武装部队司令，他因未获威廉明娜女王亲自征询而婉拒。战后他多次撰文申辩却未获结果。1966年12月31日在海牙去世。"
 CBIO_ROM_ioan_mihail_racovita_desc:0 "伊万·米哈伊尔·拉科维塔，1889年3月7日生于布加勒斯特，是第二次世界大战期间罗马尼亚的将领，也是1944年八月政变后的国防部长。他早年就读于步兵与骑兵军官学校，并赴德国汉诺威军校深造，是骑兵出身，参加过第二次巴尔干战争与第一次世界大战。1941年巴巴罗萨行动初期，他指挥罗马尼亚骑兵军，一路推进至高加索，参加了慕尼黑行动、亚速海之战与高加索之战，1942年5月晋升中将。1944年1月，他被召回并接掌斯大林格勒之役后重建的第四集团军，在罗马尼亚北部指挥防御作战，一度与德军协同击退苏军的进攻，同年7月获德国骑士铁十字勋章。1944年8月23日，他在推翻安东内斯库的政变中发挥了重要作用，当日即在瑟讷泰斯库的新政府中出任国防部长，直至11月。此后他曾任骑兵总监与第一集团军司令，1947年退役。1950年他被捕，关入锡盖特监狱，1954年6月28日死于狱中。"
 CBIO_ROM_iuliu_maniu_desc:0 "尤柳·马尼，1873年1月8日生于当时属奥匈帝国的巴达钦，是罗马尼亚的律师与政治家。他早年在克卢日、布达佩斯与维也纳攻读法律，1906年当选匈牙利议会议员，为境内罗马尼亚人争取平权。一战末期，他领导特兰西瓦尼亚脱离匈牙利、并入罗马尼亚的运动，出任特兰西瓦尼亚执政委员会主席。1926年他与扬·米哈拉克共同创立民族农民党，长期担任党主席，并于1928至1933年间三度出任首相。1930年他因不满卡罗尔二世归国及其与情妇卢佩斯库的关系而请辞。1937年，他曾与铁卫团结成选举同盟，以对抗国王。二战期间，他起初支持对苏作战以收复比萨拉比亚与布科维纳，但反对安东内斯库，曾致函抗议对犹太人的屠杀与向德涅斯特河东岸的驱逐，并参与了1944年8月倒向盟国的政变。战后他是西方阵营的主要支持者、苏联影响的主要反对者。1947年，他因塔默道事件被共产政权逮捕，在一场作秀审判中以叛国罪被判终身苦役，关入锡盖特监狱。1953年2月5日在狱中去世，遗体被抛入监狱院内的公共墓穴。"
 CBIO_ETH_john_robinson_desc:0 "约翰·罗宾逊出生于美国佛罗里达州卡拉贝尔，成长于密西西比州格尔夫波特。他自幼痴迷机械，就读塔斯基吉学院学习汽车机械，后赴芝加哥追寻飞行梦想，屡遭柯蒂斯莱特航空学校拒绝后以门卫身份旁听课程，终成该校首位黑人学生。他与好友科尼利厄斯·科菲共同创办挑战者飞行员协会，并促成母校塔斯基吉学院开设航空课程，为日后塔斯基吉飞行员部队奠定基础。1935年他自愿奔赴埃塞俄比亚参战，被誉为棕色秃鹰，出任埃塞俄比亚空军司令，统率约二十架无武装的波泰兹25型双翼机执行侦察与运输任务，亲历了意军轰炸阿杜瓦的现场。1936年埃塞俄比亚战败后返回美国，此后长期在美推动黑人航空事业。1944年埃塞俄比亚光复后他重返该国，创办飞行学校培训飞行员，并参与埃塞俄比亚航空公司的筹建。1954年3月27日，约翰·罗宾逊因飞机失事在亚的斯亚贝巴受伤身亡。"
 CBIO_HOL_johannes_theodorus_furstner_desc:0 "约翰内斯·特奥多鲁斯·菲尔斯特纳，1887年1月16日生，1906年成为海军军官候补生，长期在荷兰皇家海军服役，早年曾在荷属东印度任职。他是一位海军理论家，主张荷兰这样的小国海军可通过灵活机动重创强敌，并与其门生赫尔弗里赫合作，为可能对日开战筹划东印度海域的防御。1936年他出任海军参谋长。1940年5月德国入侵后，他转赴伦敦，继续在流亡政府中任职，出任在盟军控制区内的荷兰海军司令，实际作战指挥则交由英国皇家海军，他主要负责人事与组织。1941年7月，他在海布兰迪内阁中出任海军大臣，1942年2月晋升海军上将。战后他于1945年荣誉退役。1970年9月15日去世。"
