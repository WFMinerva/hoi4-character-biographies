l_simp_chinese:
  CBIO_SAF_george_edwin_brink_desc:0 "乔治·埃德温·布林克1889–1971，南非联邦陆军将领。二战期间指挥南非第1步兵师，1940—1941年在东非战场参与击败意属东非的战役，随后转战北非。他是史末资麾下具代表性的南非野战指挥官之一，其军旅生涯与联邦国防军的扩编、以及英联邦框架下的海外作战紧密相连。"
  CBIO_SAF_guy_hallifax_desc:0 "盖伊·沃特豪斯·哈利法克斯1884–1941，英国皇家海军少将，退役后留在南非，曾任总督克拉伦登及邓肯的秘书。二战爆发后，他受南非政府之邀从无到有组建海上力量，1940年1月出任新设立的\"海防部队\"SeawardDefenceForce首任司令，编组扫雷舰与反潜舰艇负责沿海与港口防务。1941年3月，他在从西南非返回途中因飞机在埃兰兹湾附近失事罹难，是二战中殉职的最高级别南非海军军官。"
  CBIO_SAF_j_f_van_rensburg_desc:0 "约翰内斯·弗雷德里克·扬瑟·范伦斯堡人称“汉斯”，1898–1966，法学博士，曾任司法部秘书长，1936年出任奥兰治自由邦行政长官。1941年起担任“牛车哨兵会”Ossewabrandwag，OB总司令，这是二战期间规模最大、亲纳粹的阿非利卡民族主义群众组织。他公开崇拜希特勒，其准军事分支“突击队”从事破坏活动，反对南非参战、鼓吹脱英建立阿非利卡共和国。战后当局曾以叛国罪追查，但案件在1948年国民党上台后不了了之。"
  CBIO_SAF_s_p_le_roux_desc:0 "斯特凡努斯·彼得鲁斯·莱·鲁1891–1974，国民党政治人物。1930年代作为阿非利卡民族主义阵营的国会议员活动，属于以农业选区为基础的地方实力派；1948年国民党执政后出任农业部长，任职至1958年。"
  CBIO_SAF_adolf_malan_desc:0 "阿道夫·吉斯伯特·“水手”·马伦1910–1963，出身开普的胡格诺后裔，1935—1936年加入英国皇家空军。二战中他率领第74“猛虎”中队参加不列颠空战，一度成为皇家空军头号王牌击落27架，并总结出著名的“空战十诫”；战后回国领导反对种族隔离的退伍军人组织“火炬突击队”TorchCommando。他既是南非出身的英联邦空战名将，也是战后白人反种族隔离运动中的代表人物。"
  CBIO_SAF_pierre_van_ryneveld_desc:0 "赫尔佩鲁斯·安德烈亚斯·\"皮埃尔\"·范赖尼维尔德1891–1972，南非空军之父。一战中在英国皇家飞行队成为王牌飞行员，1920年与布兰德完成从英国到开普敦的开创性飞行并因此受封爵士，同年创建南非空军并任航空处处长。1933年升任总参谋长，统领南非联邦国防军直至二战结束，1949年退役。他是联邦军事体系、以及英联邦框架下空中力量建设的核心人物。"
  CBIO_SAF_sir_patrick_duncan_desc:0 "帕特里克·邓肯爵士1870–1943，生于苏格兰，随米尔纳\"幼儿园\"来到南非，律师兼政治家，曾任南非党／联合党内阁部长。1937年出任南非总督，是首位担任此职的南非公民。1939年9月，正是他行使总督权力、拒绝赫尔佐格解散议会的请求，才使主张参战的史末资得以组阁——这一宪政决定直接促成南非加入二战。1943年在任内去世。"
  CBIO_SAF_abram_fischer_desc:0 "阿布拉姆·\"布莱姆\"·费希尔1908–1975，出身自由邦显赫的阿非利卡家族其祖父曾任奥兰治河殖民地总理，却成为南非共产党的核心成员与人权律师。他后来在1963—1964年的\"里沃尼亚审判\"中为曼德拉等人辩护，1966年本人依《镇压共产主义法》被判刑，1975年病逝于狱中。作为背弃本族特权、投身黑人解放的白人共产主义者，他在1930年代已是崭露头角的左翼青年律师。"
  CBIO_SAF_nicolaas_havenga_desc:0 "尼科拉斯·克里斯蒂安·哈凡嘉1882–1957，赫尔佐格的亲密盟友，1924—1939年长期担任财政部长先后在国民党政府与联合政府中任职。1939年他随赫尔佐格因中立主张去职，其后创建阿非利卡人党；1948年该党与马兰的国民党结盟，正是这一联盟把种族隔离政府送上台，哈凡嘉也再度出任财政部长1948—1954。他是阿非利卡民族主义务实—财经一翼的代表人物。"
  CBIO_SAF_e_g_jansen_desc:0 "恩斯特·乔治·詹森1881–1959，国民党政治人物与阿非利卡文化民族主义者。曾任国民议会议长、原住民事务部长1929—1933，是推动阿非利卡语地位的活跃人物；1951年出任南非总督，任职至1959年其间见证国民党推行种族隔离的初期。在1930年代，他是赫尔佐格—国民党阵营中兼具议会与文化影响力的人物。"
  CBIO_CUB_fidel_castro_desc:0 "古巴国父，全名菲德尔·亚历杭德罗·卡斯特罗·鲁斯，又称老卡斯特罗，1926年8月13日出生于古巴东方省比兰镇，毕业于哈瓦那大学法律系，古巴政治家、军事家、革命家，古巴共产党、社会主义古巴和古巴革命武装力量的主要创建者和领导人，被誉为“古巴国父”。卡斯特罗于1949年加入古巴人民党，1952年6月当选哈瓦那选区全国议会议员候选人，但资格被巴蒂斯塔政权取消。1953年7月26日，领导反对巴蒂斯塔政权的武装起义，攻打蒙卡达兵营，失败后被捕。1956年11月，从墨西哥回到古巴，在马埃斯特腊山区创建起义军和根据地。1959年1月，推翻巴蒂斯塔政权，成立革命政府并出任总理（后改称部长会议主席）和武装部队总司令。1962年起，担任古巴社会主义革命统一党第一书记，该党于1965年改名为古巴共产党，继续担任中央委员会第一书记。1976年起，担任古巴国务委员会主席兼部长会议主席，并在1981年、1986年、1993年、1998年和2003年选举中连任。2006年7月27日，因健康原因将权力暂时移交劳尔·卡斯特罗。2011年4月正式隐退。2016年11月25日，卡斯特罗逝世。卡斯特罗于20世纪50年代领导古巴革命，推翻了富尔亨西奥·巴蒂斯塔政权，将古巴转变为社会主义国家，是国际共产主义运动中的领导人之一。卡斯特罗领导古巴实现了土地改革、国有化等革命纲领和目标，在确保政治和社会稳定的同时，大力恢复和发展经济，不断出台改革举措，使经济保持了较快增长。"
  CBIO_CUB_eduardo_chibas_desc:0 "爱德华多·奇瓦斯1907–1951，古巴著名的广播演说家与反腐斗士。他早年参加反马查多的学生运动，后成为真正党Auténtico的活跃分子，1947年创建正统党古巴人民党，以\"廉耻对金钱\"为口号猛烈抨击贪腐。1951年8月，他在电台直播中开枪自戕，数日后不治；其激进的道德政治深刻影响了青年菲德尔·卡斯特罗一代。"
  CBIO_CUB_juan_blas_hernandez_desc:0 "胡安·布拉斯·埃尔南德斯1879–1933，绰号\"古巴的桑地诺\"，奥连特省出身的乡村游击队首领。他曾与马查多政权武装周旋两年，1933年9月一度与巴蒂斯塔的\"军士起义\"结盟，其后又反戈对抗巴蒂斯塔，率部据守哈瓦那的阿塔雷斯城堡，最终于同年11月兵败被俘、投降后遭处决。"
  CBIO_CUB_sergio_carbo_desc:0 "塞尔希奥·卡沃1892–1971，古巴记者与报人，《一周》LaSemana杂志主编。在1933年\"军士起义\"中，他是巴蒂斯塔在民间的关键联络人，并成为推翻马查多后短命的\"五人执政团\"Pentarquía成员之一。此后他长期以报业闻名，是古巴共和时期颇具影响力的舆论人物。"
  CBIO_CUB_fulgencio_batista_desc:0 "富尔亨西奥·巴蒂斯塔1901–1973，军士出身，1933年9月领导\"军士起义\"，随后出任陆军参谋长，通过一系列傀儡总统在幕后主宰古巴政局1933—1940；1940年当选总统任至1944，1952年又发动政变重掌大权，直至1959年被卡斯特罗的革命推翻。他与美国关系密切，1930年代末一度与共产党策略性合作，是本时期古巴军政体系的核心人物。"
  CBIO_CUB_sandalio_junco_desc:0 "塞达利奥·容科，非洲裔古巴面包工人与工运领袖，是古巴共产党早期少有的黑人领导人之一。他在访苏期间受西班牙托派安德烈斯·宁影响转向托洛茨基主义，1932年被共产党开除后，成为托派\"布尔什维克—列宁主义党\"与哈瓦那工人联合会的骨干，是1933年革命中重要的左翼力量。1942年，他被斯大林派特工暗杀。他代表着古巴工运中反斯大林的托派—独立左翼路线。"
  CBIO_CUB_salvador_castaneda_castro_desc:0 "萨尔瓦多·卡斯塔涅达·卡斯特罗，萨尔瓦多军官、政治人物，1888年8月6日生于查尔楚阿帕，1906年加入军队，后晋升将军，并曾任军事学校院长。1931年萨尔瓦多政变后，他被马克西米利亚诺·埃尔南德斯·马丁内斯任命为政府、推广、农业、劳工、卫生与慈善部长，后因被指参与政变阴谋遭逮捕、流放。1945年，他作为社会民主统一党候选人，在反对派遭镇压并抵制选举的背景下当选总统，任内维持军人威权统治，镇压工会罢工，并被批评延续马丁内斯时代的政治结构。1948年，他试图绕过宪法限制谋求连任，随即被青年军官政变推翻，后因涉嫌任内非法敛财受审。"
  CBIO_CUB_julio_sanguily_desc:0 "胡利奥·桑吉利·埃查特，1930年代古巴陆军军官，是反对马查多独裁的军方核心人物之一。1933年“军士起义”爆发时，他作为资深高级军官被卷入旧军官集团与巴蒂斯塔新兴军士集团的冲突，因病住院期间遭起义者拘押。此后，随着巴蒂斯塔掌握军队并重塑古巴军政秩序，桑吉利所代表的旧职业军官阶层逐渐被边缘化。"
  CBIO_CUB_carlos_prio_desc:0 "卡洛斯·普里奥·索卡拉斯1903–1977，1930年反马查多\"大学生指导委员会\"的学生领袖出身，后为真正党Auténtico政治人物。1948年当选古巴总统，1952年被巴蒂斯塔政变推翻，流亡美国，1977年在迈阿密去世。"
  CBIO_CUB_gerardo_machado_desc:0 "赫拉尔多·马查多1871–1939，独立战争老兵，1925年就任总统时颇得人望，却在1928年谋求连任后转向独裁。经济大萧条与其残酷镇压\"马查多统治期\"激起1933年革命，他于当年8月出逃，1939年病死于迈阿密流亡途中。他是引爆1933年革命的旧独裁者。"
  CBIO_CUB_eugenio_molinet_castro_desc:0 "尤金尼奥·莫利内特·阿莫罗斯约1865–1959，医生出身的古巴独立战争曼比将领，后成为马查多总统的坚定支持者与亲信。1933年马查多政权崩溃之际，他曾试图阻止政变，失败后随马查多同机流亡；局势平息后返回古巴。1959年，他以曼比将军的荣誉去世，是古巴独立战争旧军人进入共和政治并卷入马查多时代权力结构的代表人物。"
  CBIO_DOM_julio_ortega_frier_desc:0 "朱利奥·奥尔特加·弗里尔1888–1953，特鲁希略政权的法学家与知识分子精英。他曾任外交部长等要职，1937年海地人屠杀后，正是他与巴拉格尔等人起草了为屠杀辩护、对外交涉的官方文件；他也曾庇护一度落难的知识分子佩尼亚·巴特列，并出任大学校长。他代表着为独裁提供法理与外交包装的技术官僚。"
  CBIO_DOM_manuel_pena_battle_desc:0 "曼努埃尔·阿图罗·佩尼亚·巴特列1902–1954，多米尼加著名知识分子。早年是反对1916年美国占领的民族主义者，才华出众；后成为特鲁希略反海地主义与民族主义意识形态的主要理论家，并任“特鲁希略研究院”院长。他以历史、边界、族群与国家认同问题为特鲁希略政权提供理论包装，是独裁体制中文人知识精英转向国家主义宣传的重要代表。"
  CBIO_DOM_elias_brache_desc:0 "伊莱亚斯·布拉切“小布拉切”，多米尼加政治人物，出身老“希门尼斯派”jimenista。1930年推翻巴斯克斯政府之际，他属于支持特鲁希略—埃斯特雷拉·乌雷尼亚的“公民爱国联盟”一方，助其上台，后为联盟党PartidodeCoalición的领导人。他是旧派政客转而依附新兴独裁的典型代表。"
  CBIO_DOM_manuel_de_jesus_troncoso_desc:0 "曼努埃尔·德·赫苏斯·特隆科索·德·拉·孔查逝于1955年，多米尼加法学家、大学校长与政治人物。1938年他作为佩纳多的副总统进入政府，1940年佩纳多在任内去世后继任总统1940–1942，同样是特鲁希略操控下的傀儡元首。他与奥尔特加·弗里尔等人同属为政权提供法理与行政门面的法界精英。"
  CBIO_DOM_jacinto_bienvenido_peynado_desc:0 "哈辛托·比恩韦尼多·佩纳多1878–1940，律师出身，特鲁希略体制下的政治人物。1930年代任副总统并一度代行总统职权；1938年，特鲁希略因1937年屠杀引发的国际压力而不亲自竞选，改推佩纳多出任总统1938–1940，他遂成为典型的傀儡总统，1940年死于任内。据传其宅邸曾挂“上帝与特鲁希略”的霓虹标语，是特鲁希略“幕后统治”格局的门面人物。"
  CBIO_HAI_emilie_lescot_desc:0 "埃利·莱斯科ÉlieLescot，1883–1974，海地政治人物，出身混血精英，早年从政，曾在博尔诺、樊尚政府任部长；1930年代出任驻多米尼加大使并与特鲁希略结盟，后任驻美使节。1941年他在美国默许下继任总统1941–1946，任内宣布对轴心国宣战、借战时之名中止宪法、扩权自任军队统帅，并推行美资橡胶计划SHADA。其政权偏袒混血精英、压制黑人多数，最终在1946年1月的学生与民众起义中被推翻。"
  CBIO_HAI_paul_magloire_desc:0 "保罗·马格卢瓦尔1907–2001，绰号\"铁裤\"KansonFè，海地军官与政治家，出身海地角Cap-Haïtien的军人世家。1930年入伍，1935—1938年间任海地角军区副指挥官等职，是美国占领后由美方训练的\"海地卫队\"体系中崛起的军官。1946年他作为总统卫队指挥官参与推翻莱斯科的军事执政团与拉沃、勒维尔特并列三人军事委员会，1950年又联合同僚废黜埃斯蒂梅，随后当选总统1950–1956。执政期间他奉行强硬反共、亲美路线，兴办公共工程、推动旅游业与妇女选举权，后因恋栈权位于1956年在罢工与抗议中垮台流亡，2001年去世。"
  CBIO_HAI_georges_leger_desc:0 "乔治·莱热GeorgesLéger，海地律师与外交家，出身以法律和外交见长的莱热世家，该家族的雅克·尼古拉·莱热曾任驻美公使与外交部长。他活跃于美国占领结束前后的海地政坛，以法律顾问、部长与外交代表的身份参与国家的宪政重建与对外交涉，是樊尚—莱斯科时代职业法律—外交精英的代表人物之一。在海地收回主权及对美、对国际组织交往的过程中，这类通晓法理与外交的技术型精英扮演了重要角色。"
  CBIO_HAI_franck_lavaud_desc:0 "弗兰克·拉沃FranckLavaud，1903–1988，海地将领，“海地卫队”后改称海地陆军的高级军官，1944年起任卫队司令。1946年1月，在反对莱斯科的学生与民众运动中，他领导由三名军官组成的“军事执政委员会”与勒维尔特少校、马格卢瓦尔少校并列接管政权、迫使莱斯科下台，这是海地历史上军队首次作为“机构”而非某个强人的工具夺权。执政团承诺并组织选举，最终把杜马瑟·埃斯蒂梅送上总统之位，拉沃随即交权、回任卫队首脑并晋升准将；1950年他又与马格卢瓦尔等废黜埃斯蒂梅、再度短暂主政。"
  CBIO_HAI_antoine_levelt_desc:0 "安东尼·勒维尔特AntoineLevelt，海地军官，“海地卫队”体系中的骨干。1946年1月，他作为少校与拉沃、马格卢瓦尔并列组成“军事执政委员会”，参与推翻莱斯科并主持向文人政府埃斯蒂梅过渡；1950年他又与同僚参与废黜埃斯蒂梅、组建新的军事执政团。作为反复充当政治“仲裁者”的卫队军官，他是理解海地军队凌驾于文官政治之上的关键人物之一。"
  CBIO_HAI_luis_dabtes_bellegarde_desc:0 "路易·丹泰斯·贝勒加德LouisDantèsBellegarde，1877–1966，海地重要外交家、历史学家与教育家。出身太子港的混血小资家庭，他历任驻法、驻美公使及国际联盟代表，是海地在国际舞台上的代言人，杜波依斯称他为“黑人的国际发言人”，并参与泛非大会。面对1915—1934年的美国占领，他主张抵抗不仅靠武力，更靠维护民族的文化、历史与教育，著有《海地人民史》《海地的抵抗》等。他自视为混血而非黑人、推崇法国文化与天主教，其立场在黑人民族主义高涨的年代亦引发争议。"
  CBIO_HAI_demosthenes_calixte_desc:0 "迪摩西尼斯·佩特鲁斯·卡利克斯特DémosthènesPétrusCalixte，海地军官，美国占领时期由美方训练，出任新建“海地卫队”的首任黑人司令。卫队以黑人士兵为主体、军官多为混血，本应超脱党争、维持秩序，但樊尚总统利用其稳定攫取绝对权力。卡利克斯特因与樊尚交恶，被指涉嫌阴谋而遭免职、流亡海外；1946年，他作为“工农运动”MOP等进步联盟推举的候选人角逐总统，最终不敌埃斯蒂梅。他是美国占领后海地黑人军官与混血精英政权冲突中的重要人物。"
  CBIO_HAI_luis_dejoie_desc:0 "路易·德茹瓦LouisDéjoie，1896–1969，海地农学家、实业家与政治家，经营剑麻、香根草等出口产业，出身混血精英并任参议员。1956年因反对马格卢瓦尔恋栈而被捕；1957年他作为混血精英与商界支持的候选人竞逐总统，最终败于弗朗索瓦·杜瓦利埃，此后流亡并坚持反杜瓦利埃。他代表着海地混血资产阶级精英的政治一翼，与黑人民族主义noirisme阵营长期对立。"
  CBIO_PAN_enrique_jimenez_brin_desc:0 "恩里克·阿道夫·希门尼斯·卜林1888–1970，巴拿马政治家与外交家，1945—1948年任临时总统。他早年任波拉斯总统的私人秘书，历任国会议员、多次出任国民议会议长，并长期担任驻美大使——在美国因运河而对巴拿马拥有巨大影响的年代，这是极为关键的职位；1920与1932年两度出任副总统，还曾任国家银行行长。1945年制宪会议推举他为临时总统，任内颁布进步的1946年宪法确立普选与妇女选举权、推动民航发展，1947年围绕美军基地的《菲洛斯—海因斯条约》则在民众抗议中被议会否决。"
  CBIO_PAN_marcos_a_gelabert_desc:0 "马科斯·安东尼奥·格拉贝尔特，被誉为\"巴拿马航空之父\"。他早年赴古巴学习军事飞行，1930年在古巴军队获飞行员资格，1931年成为巴拿马国民警察的上尉飞行员，并成为首位驾驶政府购置的柯蒂斯飞机从纽约飞抵巴拿马城的巴拿马人。此后他开辟国内航空邮路，1933年与恩里克·马莱克合创\"国家航空公司\"AerovíasNacionales，1941年创办巴拿马航空学校，1949年推动设立民航局。1952年，他驾驶雷蒙上校JoséA.Remón的座机在贝拉瓜斯省卡洛夫雷附近失事身亡。作为军警体系内的航空先驱，他把飞行引入巴拿马的国防、通信与商业。"
  CBIO_PAN_omar_torrijos_desc:0 "奥马尔·托里霍斯1929–1981，巴拿马军事强人与民族主义领袖。他出身国民警卫队，1968年政变后成为巴拿马的实际统治者，直至1981年因空难去世。他以民粹主义改革与强硬的运河主权诉求著称，1977年与美国总统卡特签订《托里霍斯—卡特条约》，为巴拿马最终收回运河奠定基础。其统治兼具民族主义、社会改革和军人威权色彩，是20世纪巴拿马政治的关键人物。"
  CBIO_PAN_juan_remon_desc:0 "何塞·安东尼奥·雷蒙·坎特拉1908–1955，巴拿马国民警察／国民警卫队军官。1930年代已卷入警界政争，后把警察打造为凌驾于文官政治之上的力量，成为1940—1950年代巴拿马政局的操盘者。1952年他当选总统，推动经济与行政改革，并强化国民警卫队地位；1955年在巴拿马城赛马场遇刺身亡。他开启了雷蒙—托里霍斯—诺列加一线的军警干政传统。"
  CBIO_PAN_nicolas_ardito_barletta_desc:0 "尼古拉斯·阿尔迪托·巴莱塔，生于1938年，巴拿马经济学家与政治家，曾任世界银行副行长。1984年，他在军方强人曼努埃尔·诺列加影响下当选总统，任内试图推行经济调整与有限改革，但因调查政治谋杀案等问题触怒军方，于1985年被迫辞职。其短暂总统任期反映了诺列加时代文人政府与军方实权之间的紧张关系。"
  CBIO_COS_jose_figueres_ferrer_desc:0 "何塞·玛丽亚·伊波利托·菲格雷斯·费雷尔出生于阿拉胡埃拉省圣拉蒙，父母是加泰罗尼亚移民。青年时赴美国麻省理工学院攻读水利工程，回国后经营咖啡种植园与制绳工场。一九四二年因在电台公开抨击卡尔德龙·瓜迪亚政府遭逮捕并被驱逐出境，先后流亡萨尔瓦多、危地马拉、墨西哥。一九四四年皮卡多执政期间返回哥斯达黎加，组建反对派社会民主党，训练加勒比军团。一九四八年借选举纠纷之机在其庄园\"永无止境的斗争\"起义，率民族解放军经四十四天内战击败效忠皮卡多与卡尔德龙的政府军，与人民先锋党领袖莫拉·瓦尔韦德在奥乔莫戈达成停战协议。同年五月出任第二共和国缔造委员会主席，废除国家常备军、实现银行国有化并赋予妇女选举权。后于一九五三至一九五八年、一九七零至一九七四年两度当选总统。一九九零年六月八日在圣何塞去世。"
  CBIO_COS_manuel_mora_valverde_desc:0 "曼努埃尔·路易斯·莫拉·瓦尔韦德出生于圣何塞一个没落的中产家庭，兄弟姐妹十二人中排行最长。中学就读哥斯达黎加公学，毕业后放弃赴巴黎攻读数学的奖学金，转而入读法律学校，一九四零年毕业。一九三一年参与创建哥斯达黎加共产党，后更名为人民先锋党，长期担任总书记，并自青年时代起多次当选国会议员。他是一九四三年《劳动法典》及社会保障制度的主要推动者之一，曾与卡尔德龙·瓜迪亚政府及天主教桑纳布里亚总主教联合推进社会改革。一九四八年内战期间，人民先锋党武装站在皮卡多与卡尔德龙一方，战事不利后，莫拉与菲格雷斯在奥乔莫戈会晤，达成保留既有社会保障成果的停战协议。此后流亡墨西哥，一九五零年返回哥斯达黎加，一九七零年再度当选国会议员。一九九八年被追授\"祖国功勋\"称号。一九九四年十二月二十九日去世。"
  CBIO_COS_lisandro_barillas_desc:0 "全名曼努埃尔·利桑德罗·巴里利亚斯·贝西安，生于危地马拉克萨尔特南戈，早年习木匠，父亲为军官。一八七一年随父加入推翻保守派塞尔纳政府的自由派运动，获上尉军衔。历任克萨尔特南戈西部军区行政长官、政治长官及军事长官。一八八五年总统巴里奥斯战死后，作为第二候补继承人于四月六日出任临时总统，翌年三月经选举正式就任危地马拉总统，任至一八九二年三月。任内修改一八七九年宪法、驱逐大主教卡萨诺瓦、镇压韦韦特南戈叛乱并与萨尔瓦多爆发\"托托波斯特战争\"。一八九二年将政权移交继任者雷伊纳·巴里奥斯后退居经营庄园，一度出任克萨尔特南戈市长。埃斯特拉达·卡夫雷拉执政后遭猜忌，流亡墨西哥并策划武装反抗未果。一九零七年四月七日在墨西哥城遭刺客暗杀身亡。"
  CBIO_COS_jorge_peralta_desc:0 "全名何塞·拉斐尔·佩拉尔塔·卡尼亚斯，出生于阿特纳斯，父亲曾任卡塔戈省省长。中学就读圣路易斯贡萨加公学，一九一六年赴美国留学，一九二一年于纽约大学法学院取得律师资格，后赴巴黎深造法律，曾在叔父、驻法公使曼努埃尔·玛丽亚·德·佩拉尔塔第二代佩拉尔塔侯爵麾下任荣誉随员。一九二四年归国，一九二八年参与里卡多·莫雷诺·卡尼亚斯领导的民族主义团体，一九三一年加入主张妇女选举权的爱国革新联盟。历经数党辗转后于一九三九年投靠卡尔德龙·瓜迪亚阵营，一九四零年五月获总统任命为圣何塞省省长兼中央区市政首长，任内修缮乌马尼亚神父洗衣场、开辟萨米恩托林荫道及墨西哥区体育场等。因与市议员冲突，一九四一年九月被解职，转任外交部领事司司长。一九六零年九月二十九日在圣何塞去世。"
  CBIO_COS_tobias_picado_cortes_desc:0 "特奥多罗·皮卡多·米哈尔斯基出生于圣何塞，父亲是哥斯达黎加医生，母亲是波兰移民、哥国首位女医生。1917年毕业于哥斯达黎加公学，随后攻读法律，1922年获律师资格，曾任阿拉胡埃拉学院院长并在法学院任教。1932至1936年出任里卡多·希门尼斯政府教育部长，1938年当选国会议员，1941至1944年任制宪国会主席，任内推动卡尔德龙·瓜迪亚政府的社会保障改革立法。1944年在卡尔德龙支持下当选总统，5月8日就职，为第三十任总统，任内哥斯达黎加成为联合国创始会员国，颁布首部《选举法典》并设立最高选举法院。1948年因国会拒绝承认奥蒂利奥·乌拉特当选，引发内战，何塞·菲格雷斯率军获胜后，皮卡多于4月移交政权，流亡尼加拉瓜。1960年6月1日在马那瓜去世。"
  CBIO_COS_jorge_volio_jimenez_desc:0 "乔治·沃略·希门尼斯出生于卡塔戈，青年时代赴比利时鲁汶大学神学院求学，兼修巴黎圣叙尔比斯神学院与弗莱堡大学课程，一九零九年晋铎为天主教神父。回国后目睹美国出兵尼加拉瓜，愤而投身桑地诺领导的自由派游击队作战并负伤，获国会授予陆军少将军衔。一九一七年蒂诺科兄弟政变后流亡，以武装行动参与推翻其政权。一九二三年创立改革党，以天主教社会训导为纲领，主张工人事故赔偿、公平工资、普及教育等革新主张，一九二四年代表该党竞选总统获第三名。选后转而支持里卡多·希门尼斯，出任第二指定继承人。一九三四年赴罗马正式脱离神职。此后历任国家档案馆馆长、哥斯达黎加大学哲学文学系教授兼院长。一九五五年十月二十日在圣何塞去世。"
  CBIO_COS_roberto_brenes_mesen_desc:0 "罗伯托·布雷内斯·梅森出生于圣何塞，在埃雷迪亚师范学校获师范学位并留校任教，一八九七年获奖学金赴智利研习法律、法语与拉丁文，后于智利教育学院攻读语文学。一九零零年回国，在哥斯达黎加公学教授西班牙语、心理学与逻辑学，一九零五至一九零八年出任埃雷迪亚公学首任校长，因在校内推行男女同校并讲授达尔文进化论，与天主教会发生激烈论战。一九一七年蒂诺科独裁政府时期出任公共教育部长，翌年辞职后自愿流亡美国二十一年，先后任教于西北大学、哥伦比亚大学、雪城大学等校，并出任哥斯达黎加驻华盛顿公使。一九三九年退休返国，继续撰文倡导教育改革，晚年积极参与反对特奥多罗·皮卡多政府的政治活动。他曾说\"这个国家教育人谋生，却不教人幸福，而人的幸福理应是一切教育的目标\"。一九四七年五月十九日在圣何塞去世。"
  CBIO_COS_julio_acosta_garcia_desc:0 "拉斐尔·胡利奥·德尔·罗萨里奥·阿科斯塔·加西亚出生于阿拉胡埃拉省圣拉蒙，一九零二至一九零六年当选阿拉胡埃拉省国会议员，一九零六年获任省长，后出任驻萨尔瓦多总领事及公使。一九一五年调回国内任外交部长，任内处理与巴拿马的科托地区边界争端。一九一七年蒂诺科兄弟发动政变后，他流亡萨尔瓦多，通过报刊持续抨击独裁政权，并领导萨波阿运动组织武装反抗。一九一九年蒂诺科下台后凯旋回国，同年当选总统，一九二零年五月八日就职，为第二十四任总统。执政期间废止蒂诺科政府法令，并于一九二一年与巴拿马爆发短暂的科托战争，后经美国仲裁及国际调停平息。任内设立监察总署前身\"控制局\"。卸任后历任第二指定继承人、国家电力局局长、哥斯达黎加社会保险基金经理等职。一九五四年五月获追授\"祖国功勋\"称号，同年七月六日在圣何塞去世。"
  CBIO_COS_chico_orlich_bolmarich_desc:0 "弗朗西斯科·何塞·奥尔利奇·博尔马里奇出生于阿拉胡埃拉省圣拉蒙，祖父为克罗地亚移民。一九二八年与兄弟共同创办奥尔利奇兄弟商行，后发展为哥国大型咖啡企业。一九三八至一九四零年任圣拉蒙市议会主席，此后三度当选阿拉胡埃拉省国会议员。一九四八年内战期间，他作为何塞·菲格雷斯的密友出任民族解放军北线指挥官；战后在第二共和国缔造委员会任促进部长，后两度出任菲格雷斯政府公共工程部长。一九五五年任公共部队最高指挥官，平息旨在推翻菲格雷斯政府的入侵。一九五八年首次竞选总统败于马里奥·埃昌迪，一九六二年再度参选获胜，成为民族解放党第二位总统。任内推动哥斯达黎加加入中美洲共同市场，兴建国立儿童医院，并应对伊拉苏火山长期喷发造成的灾害。民众亲切称他\"奇科先生\"。一九六九年十月二十九日在圣何塞去世。"
  CBIO_COS_otto_cortes_fernandez_desc:0 "奥托·科尔特斯·费尔南德斯是总统莱昂·科尔特斯·卡斯特罗与胡莉娅·费尔南德斯·罗德里格斯之子，出生于阿拉胡埃拉。一九三二年任内政部秘书，一九三四年转任太平洋铁路公司第二秘书。一九四四年其父竞选总统败于特奥多罗·皮卡多后，他代表民主党当选一九四四至一九四八年制宪国会议员，见证了父亲政治遗产在一九四八年内战前夜的延续。战后哥斯达黎加政局重组，他转投民族解放党，一九五三至一九五八年再度当选国会议员，并于一九五六至一九五八年出任国会议长，是该党早期在国会站稳脚跟的重要人物之一。一九七三年十月十五日去世。"
  CBIO_COS_guillermo_macho_nunez_desc:0 "吉列尔莫·努涅斯·乌马尼亚，绰号\"马乔\"，哥斯达黎加飞行员，是一九四八年内战中民族解放军的王牌飞行员之一。内战爆发首日，他与飞行员奥托·埃斯卡兰特一同劫持圣伊西德罗机场的两架DC-3飞机飞往危地马拉塞普雷萨莱斯，次日满载超载近半的军火飞回接济起义军，成为反抗军最早的武器补给行动之一。战争期间他多次驾机轰炸圣何塞总统府及政府军阵地，炸弹投掷全凭肉眼目测，由机舱门手动推出。一九五五年一月，效忠卡尔德龙·瓜迪亚的流亡武装自尼加拉瓜发动入侵，他在一次空中行动中座机遭一架被劫持的LACSA客机拦截，与副驾驶赫苏斯·科内霍·索利斯一同被俘，押往尼加拉瓜圣卡洛斯，后经美洲国家组织调查后获释放回国。"
  CBIO_COS_francisco_rosendo_arguello_desc:0 "弗朗西斯科·罗森多·阿尔盖洛出身尼加拉瓜自由派家庭，为流亡律师，长期在墨西哥、危地马拉等地组织反索摩查独裁的加勒比军团，与何塞·菲格雷斯、洛洛·莫拉莱斯等人结盟。一九四五年赴墨西哥筹款购置军火，携款一万二千美元并联络其他尼加拉瓜流亡者加倍募资。一九四八年内战爆发后随军参战，随菲格雷斯部队向卡塔戈行军，战后出任第二共和国缔造委员会秘书长。他曾组建以尼加拉瓜志愿者为主的\"拉斐拉·埃雷拉连\"，期望借此挥师尼加拉瓜推翻索摩查政权，但菲格雷斯战后未兑现相关承诺，双方渐生嫌隙。一九五四至一九五五年间，他撰写《谁与如何背叛了我们》一书，详述加勒比军团盟友遭菲格雷斯背弃的经过。"
