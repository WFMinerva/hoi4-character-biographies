l_simp_chinese:
 CBIO_COG_joseph_kasa_vubu_desc:0 "约瑟夫·卡萨-武布，约1915年生于比属刚果下刚果马永贝地区的库马-迪齐村，属刚果族分支约姆贝人。早年受天主教会教育，做过教师，1942年进入殖民地行政系统并升任书记长，那是当时刚果人可及的最高职位之一。1950年代他成为巴刚果同盟即ABAKO的领导人，1954年当选主席，把这一巴刚果文化团体改造为政党，率先公开主张刚果脱离比利时独立。1957年ABAKO在利奥波德维尔市政选举获胜，他出任当迪莱区区长。1960年6月刚果独立，他与卢蒙巴结成联盟出任首任总统，卢蒙巴任总理。独立后国家旋即陷入军队哗变与加丹加、南开赛分离的刚果危机。1960年9月5日他宣布解除卢蒙巴职务，触发宪政僵局；随后蒙博托发动政变，将卢蒙巴排挤出权力中心。卢蒙巴出逃未果后被捕，最终被移交加丹加遇害。此后五年他主持数届脆弱政府，1964年起用前加丹加分离领袖冲伯为总理以平定西姆巴叛乱。1965年11月蒙博托再度政变将其推翻，他退隐马永贝农庄。1969年3月24日在博马去世。"
 CBIO_COG_cyrille_adoula_desc:0 "西里尔·阿杜拉，1921年9月13日生于比属刚果利奥波德维尔一个班加拉人中产家庭。1941年从圣约瑟夫学院毕业后做过商行职员，1952年进入比属刚果中央银行任高级职位，是首位在该行担任要职的非洲人。1954年他加入比利时社会党，成为刚果知名工会领袖，任刚果工人总同盟西部分会总书记。1958年他与卢蒙巴、伊莱奥等共同创立刚果民族运动即MNC，立场趋于温和。刚果独立后他当选参议员。加丹加分离与刚果危机爆发后，他逐渐与卢蒙巴疏远，主张联合国动用武力平定分离。作为反共的自由派人选，他受到美国中央情报局青睐，美方推动其上台。1961年8月2日他经议会一致信任票出任总理，任内借联合国军力于1963年结束加丹加分离，奉行倾向西方的不结盟政策。诸多史书将他描述为低效且依附美国的软弱领袖。1964年6月30日辞去总理职务后，他先后出任驻比利时、驻美国大使。1978年5月24日因长期患病在瑞士洛桑去世。"
 CBIO_COG_patrice_lumumba_desc:0 "帕特里斯·卢蒙巴，本名伊萨伊·塔松布·塔沃萨，1925年7月2日生于比属刚果开赛省卡塔科孔贝地区的奥纳卢阿村，属特特拉族。他在邮政培训学校以优异成绩结业，做过职员、记者与啤酒厂销售，能言善辩。1958年他与人共同创立刚果民族运动即MNC并任领袖，主张建立强有力的中央集权国家、消除部族与地域主义，是刚果最具全国号召力的独立运动领袖。1960年5月大选后，他被推为独立刚果首任总理兼国防部长；同年6月30日，刚果脱离比利时独立。独立后旋即爆发军队哗变，加丹加与南开赛相继宣布分离，他派军镇压并向苏联寻求援助，引起西方警觉。1960年9月5日总统卡萨-武布解除其职务，双方互指罢免，酿成宪政危机，其后蒙博托政变将其边缘化。他出逃未果被捕，被移交政敌冲伯控制的加丹加。1961年1月17日在加丹加被处决，遗体遭肢解并以硫酸销毁；比利时政府在2002年就其遇害正式道歉并承认负有道德责任。"
 CBIO_COG_joseph_ileo_desc:0 "约瑟夫·伊莱奥，1921年9月15日生于比属刚果利奥波德维尔。1956年他是《非洲良知宣言》的共同起草人之一，该文吁求非洲人享有自治权利。1958年他与卢蒙巴等共同创立刚果民族运动即MNC；卢蒙巴代表更激进的一翼，伊莱奥则立场温和，在运动次年分裂时加入阿尔贝·卡隆吉一派。1960年6月他当选参议员并任参议院议长。同年9月5日总统卡萨-武布罢免卢蒙巴后，宣布由他出任总理，但因议会始终未予确认，其政府未获批准，至9月20日卸任。此后他在博博科政府中任新闻部长，1961年2月9日再度出任总理，至8月2日交棒阿杜拉。1979年他一度出任国民议会议长。蒙博托推行本真化运动期间，他将名字扎伊尔化为松博·安巴·伊莱奥。1990年他创立社会基督教民主党并任主席。1994年9月19日在布鲁塞尔去世。"
 CBIO_COG_jean_bolikango_desc:0 "让·博利康戈，1909年2月4日生于比属刚果利奥波德维尔，出身赤道省的班加拉人家庭。1926年取得小学教师资格，长期在斯赫特会学校及圣约瑟夫学院任教至1958年，门下学生达一千三百人，包括后来的总理伊莱奥、阿杜拉和红衣主教马鲁拉。1946年起他任斯赫特会校友会主席，直至去世。他创办并领导班加拉人第一个族群团体利博卡·利亚·班加拉，用林加拉语写成小说《大胆者》，1948年在根特获创作奖。1958年他成为比属刚果与卢安达-乌隆迪的首任新闻专员，是资深的埃武吕埃精英与推动独立的领袖之一，赢得班加拉同胞的广泛拥戴，被视为刚果的元老政治家。1960年独立后他创立民族团结党即PUNA，主张统一刚果并与比利时保持紧密关系，竞选总统未果，转为议会反对派要角。他两度出任副总理，分别在1961年2月至8月、1962年2月至7月。蒙博托掌权后他一度入阁。社会学家卢多·德·维特称他是短视而热衷权力的新殖民主义政客，刚果人则将他铭记为独立之父之一。1982年2月17日因病在比利时列日去世。"
 CBIO_COG_isaac_kalonji_desc:0 "伊萨克·卡隆吉，全名伊萨克·卡隆吉·穆坦巴伊，1915年生于比属刚果卢桑博，父亲是卢巴人、母亲是卢卢阿人。幼年被两位美国浸信会传教士收养并接受教育，1930年起在卢埃博一带任教，后任卢埃博中级学校秘书与开赛新教师范学校督学，是新教牧师出身的政治家。1958年他联合卢巴人创立开赛在加丹加同乡联合会即FEDEKA，以对抗加丹加本地人的排外组织。1960年他作为加丹加卡特尔代表出席比刚圆桌会议，同年当选参议员，反对加丹加分离，认同卢蒙巴的主张。1961年7月他当选参议院第一副议长，并致力于调解卢巴人与卢卢阿人的部族纷争。1962年11月他出任参议院议长，任期在1963年两度续任，至1965年10月连任失利卸任。他曾协助伊莱奥创建社会基督教民主党，1991年出任主权国民大会首任主席，后因被视为亲近蒙博托而遭反对派代表撤换。他是极少数从1960年独立到1990年代持续活跃的政治家之一。1992年他迁居约翰内斯堡。2009年8月3日去世。"
 CBIO_COG_cristophe_gbenye_desc:0 "克里斯托弗·格本耶，约1927年生于比属刚果东方省下韦莱地区的巴格贝，属姆布阿族。他在布塔的马利斯特会学校受中等教育，在斯坦利维尔市政府财政部门当职员，并成为工会活动家。1950年代末他加入卢蒙巴的刚果民族运动即MNC-L，到1959年已是该党要人。1960年独立后卢蒙巴任命他为首届政府内政部长，卡萨-武布罢免卢蒙巴时他一同被免职。卢蒙巴遇害令他极为愤怒，1961年3月他被推举接替卢蒙巴出任MNC-L党主席，其后又在阿杜拉联合政府中任内政部长。1963年他流亡对岸的布拉柴维尔，同年10月与苏米亚洛特等在当地创立民族解放委员会即CNL。1964年他领导CNL发动起义，麾下青年武装被称为西姆巴即狮子，一度席卷刚果东部，攻占斯坦利维尔并建立人民共和国，他自任总统。叛乱后期发生大量处决人质与平民的暴行。1964年11月红龙行动收复斯坦利维尔后其政权瓦解，他流亡海外，蒙博托政权垮台后返回刚果。2015年2月3日在金沙萨去世。"
 CBIO_COG_louis_bobozo_desc:0 "路易·德·冈扎格·博博佐，1915年生于比属刚果赤道省蒙加拉地区。1933年他自愿加入公共军，1940年晋升中士。1941年他被派往埃塞俄比亚参加二战东非战役，在塞奥围攻战中指挥一个机枪排。1953至1954年他在卢卢阿堡担任年轻的蒙博托的操练教官，是其早年的引路人，也是独立前极少数升至准尉的刚果士兵之一。1960年刚果独立后公共军因待遇不满哗变，军官本土化后蒙博托出任改称刚果国民军即ANC的参谋长，博博佐因资历与同蒙博托的关系迅速升为上校，执掌蒂斯维尔哈迪营驻军，并一度代理陆军总司令。1963年他受命统领南加丹加的第四团。1964年5月30日他率一支小股政府军从西姆巴叛军手中夺回阿尔贝维尔，同年7月晋升少将。1965年11月蒙博托政变后，他被任命为刚果国民军总司令。1970年11月13日他因严重中风交出职务，1972年正式退役。1982年7月去世。"
 CBIO_COG_justin_kokolo_desc:0 "贾斯汀·科科洛-隆戈，1913年生于比属刚果马永贝一个巴刚果约姆贝人家庭。1936年他自愿加入公共军，很快升至下士、中士，是独立前全军仅有的四名升至准尉的刚果士兵之一，二战期间曾于1940至1945年出征。他与同为刚果族的总统卡萨-武布关系密切，出任其贴身警卫长。1960年7月8日，作为资历最深的准尉，他被政府任命为利奥波德二世营驻军司令，旋即升为上校，任改称刚果国民军的副参谋长。7月11日他奉派前往加丹加伊丽莎白维尔推动军官本土化，当晚该省宣布分离，他一抵达即被逐出，随后飞往卢卢阿堡向总统与总理汇报。1960年11月21日，他奉参谋长蒙博托之命率部前往利奥波德维尔的加纳大使馆，欲驱逐被指亲卢蒙巴的加纳代办韦尔贝克，强行进入使馆时殉职，时年四十七岁。为纪念他，利奥波德二世营被更名为科科洛营，沿用至今。"
 CBIO_COG_simon_kimbangu_desc:0 "西蒙·金班古，1887年9月12日生于比属刚果下刚果恩坎巴村，属刚果族。他的父亲是传统宗教领袖，他本人由英国浸信会差会培养，做过多年的教理讲授员。1921年初他开始自己的传道，据称能医治病人，短期内追随者众多，在下刚果的巴刚果人中声名大噪，被以基孔戈语称为恩贡扎即先知。他的运动引起比利时当局猜忌。1921年9月他被捕，以煽动叛乱罪受审并被判死刑，经英国浸信会传教士向比利时国王阿尔贝一世求情，刑罚获减为终身监禁并处一百二十鞭。此后他被押往伊丽莎白维尔监狱，在与信徒隔绝的囚禁中度过约三十年，却始终被视为精神领袖与刚果民族主义的象征。他所开创的运动发展为金班古教，1959年获比利时殖民当局合法承认，如今信众数以百万计。1951年10月12日在伊丽莎白维尔狱中去世。"
 CBIO_COG_pedro_vii_alfonso_desc:0 "唐·佩德罗七世，本名佩德罗·布阿富，出自比属刚果帕拉巴拉地区，年轻时随美国与英国浸信会传教士读书，是出色的猎象人。1923年前任阿尔瓦罗十五世去世后，他被酋长会议推举为刚果王国的曼尼刚果即国王，在接受皈依天主教、放弃与八位妻子的多妻习俗后就任。此时刚果王国早已沦为葡萄牙的附庸，1914年后领土并入葡属西非，国王仅余象征与文化意义。他定居圣萨尔瓦多，领取葡萄牙殖民当局的年金，每年在城中主持宗教节庆，并于弥撒上为城市祝祷。1931年1月10日他与安娜·图桑巴成婚，此后长期以象征性君主的身份在圣萨尔瓦多度过余生。1955年4月17日去世，身后随即引发继位之争。"
 CBIO_COG_mbop_mabiinc_mambeky_desc:0 "姆博普·马比因克·马姆贝基，又作博佩·马宾谢，是中部非洲库巴王国的国王，称尼姆。库巴王国位于今刚果民主共和国境内桑库鲁河、卢卢阿河与开赛河之间，由布雄语诸邦及克特、科法等族群组成，历代国王皆出自布雄氏族，被奉为神圣的立法者、战士与灵媒。1939年他继库巴王位，王都设在穆申盖。按库巴的母系传统，国王的全名由本人、母亲及外祖母三代之名以表所属的连词缀合而成，他的名字即循此例。他在位约三十年，历经殖民末期与刚果独立的变局，其宫廷与盛装礼服的华美一直为外界所记录，1947年美国《生活》杂志摄影师曾专程为他拍摄。1969年去世。"
 CBIO_COG_moe_poaty_iii_desc:0 "莫伊·波亚蒂三世，王号恩冈盖·姆武姆贝·乌桑盖梅，约1886年生于法属刚果马丁戈-卡耶斯地区的奇宗迪，父亲是当地大绅士普瓦蒂，母亲莫埃·姆潘祖是孔迪王族的公主。他出自洛安戈王国的孔迪王系，1931年3月18日经选举在姆巴特-邦迪即位，称马·洛安戈即洛安戈之王。他有六位妻子，居于王宫的附属院落。他在位近四十四年，是这个传统王国最后一位实际在位的君主。1952年法国殖民当局在迪奥索为他修建了砖石王宫，他自1954年起居于其中，那里如今已辟为马·洛安戈博物馆。1975年5月3日他在迪奥索去世，葬于迪奥索以南奇邦邦的王家墓地，此后王位长期空悬。"
 CBIO_RWA_yuhi_musinga_desc:0 "尤希五世·穆辛加，1883年生，是刚果河以东卢旺达王国的国王即姆瓦米，卢旺达强主基盖里四世·鲁瓦布吉里之子。1896年他在一场推翻米班布韦四世·鲁塔林德瓦的宫廷政变即鲁昆舒政变中即位，年少登基，初期由母亲坎乔盖拉及其贝加氏族摄政。因政变得位，他的正统性一度受质疑，政权早期并不得人心。他借助德国势力与传教士重振王权，把宫廷代表派作殖民行政的中介，却也在宫中激起派系倾轧。他的统治跨越第一次世界大战与德国治权向比利时的移交、王权向自治地区的扩张、1912年恩敦古采叛乱以及1928至1929年的大饥荒。1931年11月，因不肯受洗为天主教徒、又难以驾驭属下酋长，他被比利时当局废黜，由其子穆塔拉三世·鲁达希格瓦继位。此后他先被流放至卡门贝，1940年再被放逐到刚果的莫巴。1944年1月13日在莫巴去世。"
 CBIO_COG_pierre_ryckmans_desc:0 "皮埃尔·里克曼斯，1891年11月23日生于比利时安特卫普，是比利时殖民官员。他在鲁汶大学攻读法律与托马斯主义哲学，一战中在伊瑟河战役中作战，1915年加入比属刚果的公共军赴非洲，参加过喀麦隆与东非战事，此后长期任乌隆迪驻扎专员。1928年他返回比利时任律师并著书立说，出版《为服务而统治》与《殖民政策》等阐述其殖民理念。1934年10月他被任命为比属刚果总督，兼理卢安达-乌隆迪，任内正值大萧条冲击，他借1935年比郎贬值调整关税、平衡殖民地预算，到1936年经济迅速回升，还不常留在首府利奥波德维尔而频繁下乡巡视。1940年5月比利时被纳粹德国占领后，他坚定地把比属刚果带入盟军一方参战，使殖民地的铜、橡胶、铀等资源支撑盟国的战争努力，是这一决策的关键人物。他也是多产的殖民问题作家。1946年7月他卸任总督返回比利时。1959年2月18日去世，身后于1962年被追封为伯爵。"
 CBIO_COG_eugene_jungers_desc:0 "欧仁·容格斯，1888年7月19日生于比利时梅桑西一个有卢森堡血统的家庭，是比利时殖民官员与律师。他在列日大学取得法学博士，进入比属刚果殖民系统任司法官，在司法界迅速升迁。1924年他出任卢旺达驻扎官，1932年升为副总督，接替沃赞主管国际联盟委任统治地卢安达-乌隆迪，任期跨越第二次世界大战与1943至1944年的鲁扎加尤拉大饥荒。1946年他接替里克曼斯升任比属刚果总督，是殖民地最高行政职位，一直任职到1952年，此后转任殖民运输局董事。其继任者哈罗伊曾称他在卢安达-乌隆迪的治理近乎独裁。1958年9月17日去世。"
 CBIO_COG_auguste_tilkens_desc:0 "奥古斯特·蒂尔肯斯，1869年生于比利时海滨城市奥斯坦德，是比利时职业军人与殖民官员，官至中将。1887年他进入皇家军事学院，成为炮兵军官。一战中他在伊瑟河战役中作战获勋，1916年志愿赴比属刚果，在东非战事中于查尔斯·汤布尔麾下作战，1917年回欧洲任国王阿尔贝一世的副官。1927年12月他出任比属刚果总督，是殖民地最高文官，任内接待过阿尔贝一世与后来的利奥波德三世的国事访问。大萧条于1930年代初冲击刚果，他于1933年推行殖民行政改革，把省份由四个增至六个、大幅精简territoire层级，此举颇不得人心，尤其招致欧洲侨民不满。1934年任满返回比利时。1935年他出任比属刚果国立农学研究所所长，1936年5月起又任卡丹加特别委员会主席，直至1946年5月。二战德国占领期间他留在比利时。1949年12月1日去世。"
 CBIO_BEL_albert_de_vleeschauwer_desc:0 "阿尔贝特·德弗莱斯豪韦尔，1897年1月1日生于比利时下布拉克尔，是比利时天主教党政治家，后受封德弗莱斯豪韦尔·范·布拉克尔男爵。1932年起他长期任鲁汶选区众议员。1938年他出任殖民地部长，主管比属刚果与卢安达-乌隆迪。1940年5月德国入侵比利时后政府流亡，6月18日一道法令授予他刚果行政总管的全权，使他能在政府一旦垮台时仍代管殖民地。他经西班牙、葡萄牙于7月抵达伦敦，会见哈利法克斯与丘吉尔，表示把比属刚果的全部资源投入英国的战争努力，殖民地的铜、橡胶、铀等由此支撑盟国。他一直任殖民地部长至1945年2月，其间还兼任流亡政府的司法部长与公共教育部长。战后他重返议会，先后出任内政部长与农业部长，1954年获封男爵，政治生涯因索科加事件辞职而结束。1971年2月24日去世。"
 CBIO_COG_gerard_greindl_desc:0 "热拉尔·安托万·保罗·格赖因德尔，1916年11月10日生于比利时伊克塞尔，是比利时飞行员，出身格赖因德尔男爵家族，祖父是接近国王利奥波德二世的国务大臣朱尔·格赖因德尔，外祖父是比利时首相朱尔·德·布尔莱。1937年4月他考入比利时军事航空，1938年取得飞行与军事资格，1939年3月晋升少尉。1940年5月比利时遭入侵时他在戈松库尔飞行学校，曾驾驶陈旧战机迎战占优势的德国空军，颇显勇敢。十八日战役后他经比利牛斯山、西班牙、葡萄牙逃出，辗转抵达比属刚果，再赴南非加入编入英国皇家空军的南非空军中队，在中东战场作战。战后他回到比属刚果经营洛马米卡马米的一处农场，并为一家私营航空公司担任空运，后受聘于比利时航空公司萨贝纳，飞比利时至刚果航线。1948年5月13日，他驾驶的DC-4客机在接近刚果利本盖经停站时遭遇龙卷风坠毁，酿成利本盖空难，机上三十二人中三十一人罹难，他亦在其中，葬于利本盖。"
 CBIO_COG_joris_six_desc:0 "约里斯·西斯，本名乔治·西斯，1887年10月20日生于比利时弗拉默廷厄一个亚麻与粮食商人家庭，是斯赫特会即圣心会的比利时传教士。他先后在博马与利奥波德维尔传教，1928至1930年一度回比利时任斯赫特修院的司库，1930年再赴刚果。1932年10月他在利奥波德维尔筹办了一场由宗座代表德莱皮亚内总主教主持的天主教大会。1934年2月26日，教宗庇护十一世任命他为利奥波德维尔宗座代牧兼巴利亚纳名义主教。同年5月14日他在伊普尔的圣马丁主教座堂被祝圣为主教。此后他长期主持比属刚果首府的天主教教务。1952年11月22日在布鲁塞尔去世。"
 CBIO_COG_marcel_maquet_desc:0 "马塞尔·马凯，全名马塞尔·阿方斯·约瑟夫·马凯，1891年11月1日生于比利时列日省于伊，是比利时殖民行政官员。他在列日大学取得商业与领事科学学位，一战中被俘并押往德国，战后入殖民学校，1919年起在比属刚果任职，从赤道省约科洛领土的领土行政官做起，历任助理区专员、土著事务与劳工局局长等职，任内整顿酋长制、修筑道路、推广棉花种植，并做过当地的民族志调查。1933年他出任利奥波德维尔的首席区专员。1940年11月他被任命为斯坦利维尔省专员，翌年该职改称省长，任内该省驻有为可能介入阿比西尼亚而集结的殖民军，他与将军吉利亚特一同安抚了欧洲侨民的不满。1943年3月他调任利奥波德维尔省省长，至1945年卸任并退休。此后他任殖民地委员会委员、非洲城市局副主席与比利时联合国教科文组织委员会常任委员，1948至1958年多次赴刚果执行专家任务。1964年9月10日在比利时罗什福尔附近的埃普拉夫去世。"
 CBIO_COG_alexandre_safiannikoff_desc:0 "亚历山大·萨菲安尼科夫，1903年生于俄罗斯帝国的大连，是俄裔地质学家，后入比利时籍。他出身与俄国军队渊源深厚的家庭，俄国内战期间加入高尔察克的军队对抗革命军，1920年入符拉迪沃斯托克海军学校，1922年成为军官后辗转至法国，1926年在巴黎大学取得理学学位，1927年又在南锡大学取得地质工程学位。1929至1931年他受一家法国公司之托，在乍得、乌班吉沙里与法属赤道非洲勘探。此后他转赴比属刚果，为昂潘男爵的昂潘集团工作，最终出任大湖矿业公司的行政总监，主要活动于基伍与马涅马地区。1950年他归化为比利时公民。作为地质学家，他发现了包括吕埃希矿在内的四种矿物，另有一种矿物以他的名字命名为萨菲安尼科夫石。他在刚果生活了四十多年，观察莱加人的艺术并收藏大量器物。1988年去世。"
 CBIO_COG_robert_de_muelenaere_desc:0 "罗伯特·德·穆埃莱内尔，全名费利克斯-阿芒·罗伯特·德·穆埃莱内尔，1882年1月10日生于比利时阿尔杜瓦，是比利时高级官员与法学家。他在根特大学取得法学博士，又赴巴黎、伦敦、波恩深造，获政治与社会科学博士学位，1909年出版首部著作《罢工与劳动合同》。1919至1927年他在布鲁塞尔殖民学校讲授国际私法、民法与刚果刑法，后任根特大学正教授，主讲比属刚果立法与殖民制度。1940年5月德国入侵后，在波尔多的内阁会议上，他是唯一支持德弗莱斯豪韦尔所提措施之正当性与合法性的人，当场起草了那道把刚果全部立法与行政权力授予德弗莱斯豪韦尔为行政总管的法令，当天即获皮尔洛内阁通过，对刚果投入盟军战争努力至关重要。他随后经西班牙、葡萄牙追随殖民地部长，1940年底陪同其赴比属刚果厘定战时立法，再转赴伦敦兼任部长办公室主任与法律事务主管。战后他返回布鲁塞尔续任至1945年，并在根特大学任教至1952年荣休，还主持了将刚果法典译为荷兰语的工作。1956年10月14日在埃特尔贝克去世。"
 CBIO_COG_emile_janssens_desc:0 "埃米尔·罗伯特·阿尔方斯·伊波利特·詹森斯，1902年6月15日生，是比利时军官与殖民官员，官至中将，以刚果危机爆发时统领公共军而知名。他自称小狂人，治军严苛。二战期间他先后在阿比西尼亚、尼日利亚、中东、法国、荷兰与比利时服役，战后在布鲁塞尔皇家军事学院任教，1954年2月出任公共军司令。1959年他曾镇压利奥波德维尔由巴刚果同盟发动的骚乱。他在殖民末期坚决反对让黑人进入公共军的白人军官团。1960年6月刚果独立后他仍执掌公共军。7月5日即独立六天后，他召集利奥波德维尔驻军的军士，在黑板上写下独立前等于独立后，并声称独立不会改变军队的任何东西，此言激怒部属，数小时内即爆发兵变、攻击在刚欧洲人，成为刚果危机的开端。他随即辞职，由伦杜拉接任，公共军旋即解散、改组为刚果国民军。他经法属刚果返回比利时，曾在利奥波德二世雕像前俯首说陛下，他们把您的事业搞砸了。晚年他多有著述，1979年写成一部公共军史，还投身比利时民族主义组织。1989年12月4日去世。"
 CBIO_COG_auguste_gilliaert_desc:0 "奥古斯特·爱德华·吉利亚特，1894年3月7日生于比利时布鲁日附近，出身泥瓦匠之家，是比利时殖民地中将、公共军司令。1910年他十六岁即以志愿兵入比利时军队，1914年获军官衔，一战中在伊瑟河沿线作战。1916年他志愿赴比属刚果，以上尉身份参加一战东非战役，在塔博拉与马亨盖作战。1939年11月他接替埃纳坎出任公共军司令。1941年1月晋升少将后，他把公共军司令一职交给保罗·埃尔门斯，转任刚果东北部军队最高指挥，奉命进攻与轴心国结盟的意属阿比西尼亚。在二战东非战役中，他指挥比利时远征军，于1941年7月的塞奥战役中切断意军加泽拉将军的退路，接受其约七千人投降，被俘的意军将领达九名，其中包括东非意军统帅、总督加泽拉。此后他率两千人的旅从拉各斯步行七千公里赴开罗而无一人损失。1944年7月他再度出任公共军司令，1951年10月晋升中将，1954年3月返回比利时，翌年退役。1973年5月10日在布鲁塞尔去世。"
 CBIO_COG_frederic_vandewalle_desc:0 "弗雷德里克·旺达瓦勒，1912年7月5日生，是比利时军官、雇佣兵与政治人物，在刚果独立前后颇具影响力。1937年他加入公共军，服役约二十年，官至上校。1957年至1960年初他任比属刚果治安部门主管。刚果独立后，1961年1月他被派往加丹加首府伊丽莎白维尔，协助组织加丹加脱离刚果的分离，成为加丹加总统冲伯核心圈中有影响的比利时人。他在卢蒙巴遇害中究竟扮演何种角色，史界至今争论。1964年西姆巴叛军攻占斯坦利维尔后，冲伯请他回国任私人军事顾问，同年8月他奉命收复叛乱地区，可动用包括中情局资助的古巴流亡者与迈克·霍尔的白人雇佣兵在内的外国部队。他组建的第五机械化旅在卡米纳成立，与美比红龙行动协同直抵斯坦利维尔并将其收复，此役即步行者行动。1966年他在一场车祸中重伤，妻子罹难。此后他大量著述记述其刚果经历。1994年11月5日去世。"
 CBIO_COG_paul_ermens_desc:0 "保罗-查理斯·埃尔门斯，1884年6月8日生，是公共军高级军官、比属刚果副总督兼公共军司令。1903年他从比利时皇家军事学院毕业，加入掷弹兵团。1914年他已是公共军军官，同年8月4日晋升上尉指挥官，在一战东非战役中指挥公共军第三营，因功受勋。1932年他被任命为比属刚果副总督兼开赛省长，成为总督里克曼斯的助手。二战期间他晋升中将并出任公共军司令，1940年12月至1944年8月在任。战后他再度出任副总督直至任满。1957年11月1日去世。"
 CBIO_COG_charles_tombeur_desc:0 "查尔斯·汤布尔·德·塔博拉，全名查尔斯·亨利·马里·埃内斯特·汤布尔，1867年5月4日生于比利时列日，是比利时中将与殖民官员，以一战初期统领公共军而知名，尤以1916年攻克塔博拉的战功著称。他十六岁入伍，后毕业于布鲁塞尔皇家军事学院，曾在陆军大学任地理与地质教官。1902年他以上尉指挥官身份赴刚果自由邦，在公共军中服役至1909年，其后一度任国王阿尔贝一世的副官，1912至1914年任加丹加省督察兼行政官。一战爆发后，他于1915年2月出任公共军总司令，重整军备，1916年4月率两个旅共八千五百人发动进攻，先取基加利、占领卢旺达与布隆迪，被任为比利时占领的东非领地军事总督。随后他挥师直取德属东非的行政与后勤重镇塔博拉，于1916年9月19日攻克该城，切断了达累斯萨拉姆通往乌吉吉的铁路补给线。他随即把指挥权交给阿尔芒·于热。1917年初他升任副总督。1926年他获封男爵，1936年获准在姓氏后加上德·塔博拉以纪念此役。1947年12月2日在布鲁塞尔圣吉勒去世。"
 CBIO_COG_joseph_beernaert_desc:0 "约瑟夫-爱德华-路易·贝尔纳特，1883年4月21日生，是比利时军人，官至中将，曾任比属刚果开赛省省长。1909年他被派入殖民地部，任内多次往返比属刚果。1925至1929年他任开赛省总务专员、省长的助手，1928年起兼任殖民地总督的秘书长助手。1929年6月19日他接替恩格尔斯出任开赛省省长兼副总督，驻节利奥波德维尔。1931年比利时市场问题与货币高估引发经济危机，波及刚果，同年开赛省的宽果地区爆发骚乱，殖民当局派出惩罚性纵队镇压，八月在穆库库一次冲突中即打死五十六人。当地登盖塞人受千禧年教派影响，主张驱逐欧洲人；贝尔纳特对登盖塞人态度强硬，1932年10月20日依1906年与1920年的法令宣布进入紧急状态，对五个酋长辖区实施军事管制并派兵弹压。1950年去世。"
 CBIO_COG_armand_huyghe_desc:0 "阿尔芒·于热·德·马亨盖，本名阿尔芒·克里斯托夫·于热，1871年7月11日生于比利时卢汶，是比利时职业军人，官至少将，曾任公共军总司令。他毕业于皇家军事学院，1891年入比利时军队，1893年调入刚果自由邦的公共军，参加沙里河流域的阿诺莱远征，后因病返比。1915年他晋升少校，翌年升上校。1917年2月，他接替查尔斯·汤布尔出任负责比属刚果东部与卢安达-乌隆迪的公共军总司令，同年4月在塔博拉与英军将领霍斯金斯、副总督马尔费签订协定，划定共同作战计划与战后英比在所占领土上的权限。在1917年东非战役中，他于10月9日经四天苦战赢得马亨盖之捷，因功晋升。战后他统领莱茵兰占领区的比利时占领军。因病退役后，他自1929年起在下刚果至加丹加铁路、卢安达-乌隆迪锡矿公司等比属刚果企业任董事。1933年他获国王阿尔贝一世封为骑士，1939年又获利奥波德三世准许在姓氏后加上德·马亨盖以纪念此役。二战期间他在勃艮第领导一支抵抗组织，1943年被捕，与前首相保罗-埃米尔·扬松一同被押往布痕瓦尔德集中营，1944年3月2日在营中病逝。"
 CBIO_COG_leopold_de_koninck_desc:0 "利奥波德·德科宁克，全名利奥波德·让·马里·德科宁克，1874年1月11日生于比利时莱尼克-圣马丁一个农户之家，是比利时将军，曾任公共军总司令与比属刚果行政官员。1887年他十三岁即入比利时军队，1896年通过步兵少尉考试，1904年经陆军大学取得参谋资格。他是资深殖民官，先后在刚果任职五个任期，1906年以区段长身份赴刚果自由邦，派驻赤道省。1930年7月至1932年7月他出任公共军总司令。其时1929年股灾与随之而来的大萧条重创以原料出口为主的比属刚果经济，德科宁克把军费削减近半，重整部队、重新部署，建立可动员的受训预备役，采用改良武器，推行半地区化征兵，并以耐用材料修建营房。1932年8月他以名誉中将军衔退役。1957年2月26日在圣吉勒去世。"
 CBIO_COG_fredrik_olsen_desc:0 "弗雷德里克-瓦尔德马·奥尔森，1877年5月24日生于丹麦卡伦堡一个贫寒之家，是丹麦裔军人，后成为比属刚果公共军的将军与总司令。他早年在丹麦军队服役，得卡伦堡市长资助入哥本哈根军事学院，1897年任少尉。1898年他志愿加入刚果自由邦的公共军赴非洲，参与镇压刚果东北部的叛乱。1909至1910年，他在与德、英两国争夺东部边界的对峙中发挥了重要作用；东部边界问题解决后，他奉命在加丹加组建一支军队，以防南非布尔人拓殖这一富矿区，并率先在公共军中推广自行车。一战爆发后他动员加丹加，先抵御德军对北罗得西亚的进攻，又从基伍湖以南推进，参与向塔博拉的进军。1920年起他升任公共军总司令，至1924年卸任，1925年晋升将军后退役。此后他转任国营刚果河航运公司乌纳特拉的总经理，1936年出任由航运与铁路合并而成的殖民运输局奥特拉科的总经理。二战德国占领期间他留在比利时主持奥特拉科，1947年5月退休。1962年11月19日在埃特尔贝克去世。"
 CBIO_PAR_rafael_franco_desc:0 "拉斐尔·弗朗科出生于亚松森圣三一区，早年入读军事学院，先后在陆军中任职。一九二八年，他率部炸毁玻利维亚在争议查科地区修筑的一处堡垒，因擅自行动被解除军职，其部下因此称他为跛狮，缘于他在军校时坠马伤腿。查科战争爆发后，他重获任用，历任师、军指挥官，参与皮库伊瓦、伊伦达古埃等战役，一九三三年晋升上校。战后他公开批评总统尤塞比奥·阿亚拉的对外政策，阿亚拉将其流放阿根廷，其支持者随即于一九三六年二月发动政变，弗朗科返国就任临时总统。执政期间推行巴拉圭首次土地改革，将逾二十万公顷土地分予万户农家，并确立八小时工作制、周日休息、工资现金支付、劳工结社权等一系列劳工法令，创设中央银行，恢复弗朗西斯科·索拉诺·洛佩斯的国家英雄地位。因下令查科前线部队后撤，一九三七年八月遭右翼军人政变推翻，流亡乌拉圭二十余年。一九四六年短暂回国后再度出走，此后长期领导他所创立的二月革命党，对斯特罗斯纳当局采取有限反对，一九七三年九月十六日在亚松森病逝。"
 CBIO_PAR_higinio_morinigo_desc:0 "伊希尼奥·莫里尼戈出身巴拉瓜里一个混血商人家庭，通晓西班牙语与瓜拉尼语，一九二二年毕业于军事学院并投身陆军。他参加查科战争，一九三六年出任陆军参谋长，同年二月革命期间因率队前往塞罗科拉战场寻回弗朗西斯科·索拉诺·洛佩斯遗骸而声名大振。一九四零年五月，总统何塞·费利斯·埃斯蒂加里维亚将其擢升为将军并任命为战争部长。埃斯蒂加里维亚同年九月因飞机失事去世后，莫里尼戈以其留下的赋予总统极大权力的一九四零年宪法为依托，接任总统并建立军人独裁，一九四三年在无对手的选举中连任。二战期间他表面维持中立，暗中容忍德国侨民组织活动，直至一九四五年二月才对轴心国宣战，但并未实际派兵参战。一九四七年爆发的内战中，他依靠红党民团及阿根廷总统佩隆的支持击败自由党、二月革命党与共产党联合发动的叛乱。一九四八年，红党内部以费利佩·莫拉斯·洛佩斯为首的势力发动政变，将其逐下总统之位，此后流亡阿根廷布宜诺斯艾利斯郊区，一九八三年一月二十七日去世。"
 CBIO_PAR_juan_natalicio_gonzalez_desc:0 "胡安·纳塔利西奥·冈萨雷斯出生于瓜伊拉省比亚里卡，幼年失去双亲后赴亚松森完成中学学业，因大学医学院停办转而投身文学与新闻业。青年时期辗转布宜诺斯艾利斯与巴黎从事出版工作，回国后活跃于红党知识分子圈，曾任红党多家党报主笔，出版诗集、政论与历史随笔，创办文化刊物瓜拉尼亚。一九二零年代末起深入红党组织工作，一九四六至一九四八年任财政部长期间，他创建了红党准军事组织红色旗队。一九四七年内战中，红色旗队成为总统伊希尼奥·莫里尼戈镇压自由党、二月革命党与共产党联合叛乱的重要力量。一九四八年，他作为红党唯一候选人当选总统，八月十五日就职，但因党内分歧仅五个月后即一九四九年一月遭本党人士推翻，流亡布宜诺斯艾利斯，后转往墨西哥。他在墨西哥受邀回国的当天，于一九六六年十二月六日因心脏病去世。"
 CBIO_PAR_Eusebio_Ayala_desc:0 "尤塞比奥·阿亚拉出生于科迪勒拉省巴雷罗格兰德，早年赴亚松森谋生并完成法律学业，曾任教于国立大学法学院，兼任驻英使馆秘书数年，通晓英语与法语，并参与创立巴拉圭国际法学会。一九零九年起投身自由党政治，历任外交、财政、教育等部长。一九二一年国会因政局动荡推举他为临时总统，任至一九二三年，期间经历一九二二年内战。一九三二年八月再度出任总统，恰逢与玻利维亚的查科战争爆发，他与统帅何塞·费利斯·埃斯蒂加里维亚将军共同领导巴拉圭军队作战，多次亲赴前线，最终于一九三五年迫使玻利维亚停战，巴拉圭赢得查科大部分争议领土，他因此获胜利总统之称。一九三六年二月十七日，他被拉斐尔·弗朗科上校发动的政变推翻并遭监禁，随后流亡阿根廷布宜诺斯艾利斯，一九四二年六月四日在当地去世。"
 CBIO_PAR_Jose_Felix_Estigarribia_desc:0 "何塞·费利斯·埃斯蒂加里维亚出生于科迪勒拉省卡拉瓜塔伊，父母是巴斯克血统的农民，早年就读农业学校，后转投军旅，一九一零年以少尉军衔入伍，先后赴智利和法国圣西尔军校深造，师从福煦元帅麾下将领，一九二八年归国后任陆军参谋长。查科战争爆发后，他统率兵力，历经上校、准将、师长直至陆军总司令，指挥坎波格兰德、波索法沃里托等战役连获胜利，一九三五年率军凯旋亚松森，获终身年金以表彰其查科战争功勋。一九三六年二月革命中，总统尤塞比奥·阿亚拉被推翻，他随之被解除军职，此后出任驻美大使并推动美国对巴拉圭的经济援助。一九三九年，他作为自由党候选人无对手当选总统，翌年二月遭遇未遂政变后，解散国会、接管紧急权力并颁布赋予总统极大权力的新宪法。一九四零年九月七日，他与夫人胡莉娅·米兰达·库埃托在国内视察途中因飞机失事去世，后被追授元帅军衔，成为巴拉圭历史上仅次于弗朗西斯科·索拉诺·洛佩斯获此军衔的第二人。"
 CBIO_PAR_ivan_belyaev_desc:0 "伊万·别利亚耶夫出生于圣彼得堡一个军人世家，一八九三年毕业于米哈伊洛夫斯克炮兵学校，投身俄国陆军。第一次世界大战期间他升至上校，后晋少将，曾在战斗中胸部中弹，幸未伤及要害，康复期间获沙皇皇后接见并获晋升。俄国内战爆发后，他加入弗兰格尔指挥的白军，一九二零年经加里波利、保加利亚辗转流亡，一九二三年抵达布宜诺斯艾利斯，次年移居巴拉圭并加入该国陆军，在总参谋部创建工程处，同时任军事学院教官，此后又陆续带领十余名俄国军官同僚一同效力巴拉圭军队。自一九二四年起，他先后十三次深入格兰查科地区勘测绘图，为日后战事奠定地理情报基础。查科战争期间，他运用对当地地形的丰富知识，协助识破玻利维亚军队战术部署，在纳纳瓦等战役中发挥关键作用，一九三二年获授荣誉师长军衔，一九三三年起任总统顾问兼总参谋部成员。战后他脱离军职，投身当地马卡人事务，主持印第安人事务国家保护机构，编纂当地语言词典，被马卡人尊为白色圣父。一九五七年一月十九日，他在亚松森去世，遵其遗愿，遗体被运往查科河西岸马卡人保留地安葬。"
 CBIO_PAR_juan_stefanich_desc:0 "胡安·斯特法尼奇出生于亚松森，一九二零年获亚松森国立大学法学博士学位，早年任教于国立中学讲授本国史，兼事新闻业，一九一九年与人合办杂志门厅，一九二五年创办报纸国家报。一九二八年，他领导创立独立国家联盟，倡导以团结主义民主重振巴拉圭政治。他是一九三六年二月革命的主要组织者之一，革命成功后在拉斐尔·弗朗科政府中任外交部长，兼理战争部务，出席在布宜诺斯艾利斯举行的查科和平会议，捍卫巴拉圭利益，并促成为弗朗西斯科·索拉诺·洛佩斯正式恢复国家英雄名誉、将未竟的圣母领报堂改建为国家英雄先贤祠等举措。一九三七年八月弗朗科政府被拉蒙·帕雷德斯上校发动的政变推翻后，他流亡布宜诺斯艾利斯。一九四六年联合政府时期出任巴拉圭驻阿根廷大使，次年二月革命党退出联合政府后离任，此后长期在国外从事写作与政治活动，一九五一年参与创建二月革命党。一九七九年在布宜诺斯艾利斯去世。"
 CBIO_PAR_ramon_paredes_desc:0 "拉蒙·帕雷德斯上校在查科战争后出任巴拉圭查科军事区司令，是拉斐尔·弗朗科政府倚重的军方将领之一。因不满弗朗科在与玻利维亚的查科和平谈判中同意让步部分领土诉求，他联合其他军官于一九三七年八月十三日发动政变，推翻弗朗科政府，迎回自由党人费利克斯·派瓦执掌总统职位，实权转归军方掌控。此后他继续活跃于军政两界，出任伊希尼奥·莫里尼戈政府内政部长，一九四一年二月四日，莫里尼戈为巩固个人权力将其解职，此后逐渐淡出巴拉圭政治核心。"
 CBIO_PAR_anselmo_jover_peralta_desc:0 "安塞尔莫·霍韦尔·佩拉尔塔出生于巴拉瓜里省卡拉佩瓜，先后在亚松森和蒙得维的亚师范学校就读并获教师资格，又在亚松森国立大学攻读法律，早年在国立中学任教，并投身新闻业，一九一九年与人合办杂志门厅。青年时期曾属自由党并当选众议员，二十年代转向社会主义。一九三六年二月革命后，他在拉斐尔·弗朗科政府中任司法宗教及公共教育部长，任内创设牙科学院与经济学院。他是革命中左翼工人及反帝路线的代表人物，一九三七年八月政府垮台后流亡布宜诺斯艾利斯，翌年在当地组建存续短暂的巴拉圭革命党，此后又代表巴拉圭出使墨西哥、古巴、哥伦比亚等国。他晚年致力瓜拉尼语研究，编有瓜拉尼语西班牙语词典，一九五一年参与创建二月革命党。一九七零年六月二十一日在亚松森临床医院去世。"
 CBIO_PAR_justo_pastor_benitez_desc:0 "胡斯托·帕斯托尔·贝尼特斯出生于亚松森，一九一九年获亚松森国立大学法学博士学位，早年投身新闻与教育，曾任国立中学教师并参与制定一九三一年学制方案。自由党人，二十五岁即当选国会议员，此后历任司法宗教及公共教育部长、内政部长、外交部长与财政部长等职，查科战争期间任外交部长，一九三三年率团出席在蒙得维的亚举行的第七届美洲国家会议。他是一九四零年宪法的主要起草人之一，并在何塞·费利斯·埃斯蒂加里维亚第二届内阁中任财政部长。埃斯蒂加里维亚意外坠机去世、伊希尼奥·莫里尼戈继任总统后，自由党被排挤出政府，他被迫流亡国外近二十年，辗转巴西、阿根廷等地，以写作与新闻工作维生，著有多部巴拉圭历史与传记作品。一九六三年二月在亚松森去世。"
 CBIO_PAR_emilio_gardel_desc:0 "埃米利奥·加德尔是拉斐尔·弗朗科二月革命政府内阁成员，一九三六年五月接替阿尔弗雷多·哈克特出任财政部长，同月安塞尔莫·霍韦尔·佩拉尔塔离任后，他又一度兼理司法宗教及公共教育部务。他与胡安·斯特法尼奇、赫尔曼·索莱尔、贝尔纳迪诺·卡瓦列罗、佩德罗·杜阿尔特·奥特拉多等同僚共同联署了一九三六年创设巴拉圭卫生部的法令。他在财政部长任上一直留任至一九三七年八月弗朗科政府被推翻为止，是该届内阁中任职时间最长的成员之一。"
 CBIO_PAR_aristides_rivas_ortellado_desc:0 "阿里斯蒂德斯·里瓦斯·奥特拉多出生于科隆巴（今属巴西马托格罗索州，紧邻巴拉圭边境），一九一九年二月毕业于军事学院，投身巴拉圭陆军。查科战争期间，他在联合参谋部第四处担任军需主任，负责查科前线部队的补给与后送保障，因在卡涅尔卡门等战役中的表现获多次战地嘉奖及查科十字勋章、卫国者十字勋章与博凯龙奖章。一九三四年晋升中校并任第二步兵师师长。一九三六年六月八日，二月革命政府任命他为武装力量总司令，同年十二月十八日出任战争海军部长。一九三七年八月十三日，拉蒙·帕雷德斯上校发动政变推翻拉斐尔·弗朗科政府当日，他随即辞去部长职务。"
 CBIO_PAR_freire_gomez_esteves_desc:0 "戈麦斯·弗雷雷·埃斯特维斯是律师、诗人与记者，曾主编自由党报纸国家报，早年即以犀利文笔投身反对党政治，一九零四年热忱支持推翻科罗拉多党统治的自由党革命。一九一五年一月一日，他与其弟路易斯发动政变，一度俘获总统爱德华多·舍雷尔，虽因缺乏后续支持而失败。一九三一年三月，他又是密谋推翻总统何塞·帕特里西奥·古吉亚里的军事阴谋主要策划者之一，其间结识了当时尚为少校的拉斐尔·弗朗科，此后一直助力弗朗科登上权力顶峰。一九三六年二月革命成功后，他出任内政部长，被视为革命政府中最具影响力的思想推手，主持起草了主张巴拉圭效仿欧洲总体主义国家、宣布革命与国家合一的第一百五十二号法令，因该法令引发革命阵营内部强烈反弹，他被迫辞去部长职务，此后再未涉足政坛核心。著有巴拉圭近代史（1869-1920）。"
 CBIO_PAR_eduardo_schaerer_desc:0 "爱德华多·舍雷尔·维拉伊阿拉贡出生于卡萨帕，父为瑞士移民，母为巴拉圭人，早年经商与从事新闻业，一九零四年自由党革命中即为主要民间领袖之一。一九零八至一九一一年任亚松森市长，一九一二年任内政部长，同年八月就任总统，成为二十世纪首位完整任满的巴拉圭总统，任内创设兑换局并派遣逾两百名青年赴欧美留学，一九一五年遭戈麦斯·弗雷雷·埃斯特维斯兄弟发动的政变短暂扣押但平息。一九二五年，他创办拉特里布纳报，成为巴拉圭最具影响力的日报之一。卸任总统后长期任国会参议员，一九二一年至一九四零年间数度连任，一九一九至一九二零年任参议院议长。一九四一年十一月十二日在布宜诺斯艾利斯去世。"
 CBIO_PAR_juan_manuel_frutos_desc:0 "胡安·曼努埃尔·弗鲁托斯出生于亚松森，一九零一年获文理学士学位，随后就读亚松森国立大学法学院，一九一二年获博士学位，早年历任贫民辩护人、刑事检察官、初审法官等职，一九一七年与一九二九年两度当选参议员，曾率先提出修订一八七零年宪法的议案。他长期在司法系统任职，出任最高法院院长。一九四八年六月三日凌晨，总统伊希尼奥·莫里尼戈在军方压力下辞职后，立法议会推举他继任临时总统，执政两月又十二天，任内将八月十六日定为巴拉圭儿童节，并推动知识产权法律制度化。同年八月十五日，他将权力移交给胡安·纳塔利西奥·冈萨雷斯。他一生三次结婚，育有子女十六人。一九六零年四月十五日在亚松森去世。"
 CBIO_PAR_bernardino_caballero_desc:0 "贝尔纳迪诺·卡瓦列罗是十九世纪巴拉圭总统、科罗拉多党创始人贝尔纳迪诺·卡瓦列罗将军之孙，与祖父同名。一九三六年二月革命后，他在拉斐尔·弗朗科政府中出任农业部长，与吉列尔莫·特尔·贝尔托尼共同主持农业改革事务。据同期学者记述，他被视为革命政府内阁中倾向国家社会主义思想的成员之一；同一届内阁中还包括主张团结主义民主的胡安·斯特法尼奇、信奉法西斯主义的弗雷雷·埃斯特维斯兄弟、由自由派转向社会主义的安塞尔莫·霍韦尔·佩拉尔塔。一九三七年八月弗朗科政府被推翻后，他随之离任。"
 CBIO_PAR_pedro_duarte_ortellado_desc:0 "佩德罗·杜阿尔特·奥特拉多出生于卡萨帕，是外科医生，曾赴德国进修深造，在家乡卡萨帕行医。查科战争爆发后，他加入军医系统，任第三军团军医处主任，其兄胞路易·凯撒·奥特拉多神父则在前线任随军牧师，主持修建伊维库伊医院。他曾向拉斐尔·弗朗科上校提出，战后巴拉圭将面临大量伤兵及疟疾、痢疾、伤寒等疫病问题，需设立专门机构应对。一九三六年二月革命后，弗朗科据此于六月十五日签署法令，创设巴拉圭历史上首个卫生部，并任命他为首任卫生部长，主持起草其组织法。他在任内延揽卡洛斯·加蒂、马克斯·博特纳等专家协助立法工作，任职至一九三七年八月弗朗科政府被推翻为止。此后他历经政治波折，最终流亡阿根廷波萨达斯，一九八一年十一月十七日在当地去世。"
 CBIO_PAR_felipe_molas_lopez_desc:0 "费利佩·莫拉斯·洛佩斯出生于卡萨帕省尤蒂，赴巴黎攻读牙科，又在波尔多专攻种植牙技术，一九二六年在当地一项医学院竞赛中获金奖。查科战争期间，他以卫生部队上尉军衔服役前线，战后参与筹建亚松森国立大学牙科学院。一九三六年二月二十一日至十月，他出任亚松森市政厅长，主持完成圣母领报堂的修复工程，使其转为国家英雄先贤祠。此后他长期任红党党员，一九四八年起在胡安·曼努埃尔·弗鲁托斯、胡安·纳塔利西奥·冈萨雷斯与拉伊蒙多·罗隆三任政府中连续担任教育部长。一九四八年六月三日，他与马里奥·马约金一同促成总统伊希尼奥·莫里尼戈辞职。一九四九年二月，红党推举他为总统候选人，二月二十七日就任临时总统，五月十四日选举后正式就职，但因党内压力，同年九月十日被迫辞职，在任六个月又十二天。一九五四年十一月十七日在亚松森去世。"
 CBIO_PAR_isaias_baez_allende_desc:0 "伊萨亚斯·贝斯·阿连德出生于亚松森，是自由党人、曾任巴拉圭临时总统的塞西利奥·贝斯与马塞利娜·阿连德之子。贝斯家六个儿子均参加了查科战争，伊萨亚斯当时以少校军衔出任第二十步兵团阿卡瓜苏团首任团长。他后来晋升上校，兼通音乐，在军中素有文武兼修之名。他的兄弟中，阿马德奥·贝斯·阿连德为医生，基里诺·贝斯·阿连德则是吉他演奏家。"
 CBIO_PAR_vicente_almonacid_desc:0 "维森特·阿尔莫纳西德出生于阿根廷拉里奥哈省安吉南，父亲曾任拉里奥哈省长。第一次世界大战期间，他加入法国外籍军团航空队，参与巴黎防空及对德轰炸任务，因功获法国军功勋章、荣誉军团勋章及战争十字勋章等多项殊荣。战后回到阿根廷，一九二零年完成人类首次夜间飞越安第斯山脉的飞行，此后创办阿根廷邮航公司，聘请圣埃克苏佩里、梅尔莫兹等法国飞行员开辟南美航线。查科战争爆发后，他自愿前往巴拉圭效力，受命指挥巴拉圭空军部队，晋升少校，创设航空总局及查科战场首个航空作战大队，编写飞行员空战手册，因功获巴拉圭国家功勋勋章指挥官级。战后他历任阿根廷驻法国布洛涅苏梅尔领事、驻智利领事，一九四五年回到阿根廷，一九五三年十二月十六日在布宜诺斯艾利斯去世。"
 CBIO_PAR_mutshuito_villasboa_barboza_desc:0 "睦仁·比利亚斯博亚·巴博萨一九零五年七月十二日出生于亚松森，投身红党及军界。一九四零年，他出版军事著作走向总体战与武装力量诸问题。一九四二年，他以中校军衔任亚松森警察局长。此后历任公共工程及通讯部长、国防（战争海军）部长等要职，一九四八年三月起在莫里尼戈政府中执掌国防部，同年八月十五日国庆阅兵后获武装力量总司令部集体嘉奖，其时已升至将军。他是亲轴心的战争派成员，并曾把儿子命名为阿道夫·裕仁，以向两名轴心国人物致意。"
 CBIO_PAR_higenio_morinigo_martinez_desc:0 "伊希尼奥·莫里尼戈·马丁内斯即巴拉圭总统伊希尼奥·莫里尼戈本人全名，此处记录其登上总统之位前的军旅历程。他出身巴拉瓜里一个混血商人家庭，一九二二年毕业于军事学院投身陆军，参加查科战争，一九三六年二月革命期间因率队寻回弗朗西斯科·索拉诺·洛佩斯遗骸而扬名，同年晋升陆军参谋长。一九四零年五月十七日，总统何塞·费利斯·埃斯蒂加里维亚将其召至战争海军部，任命为部长并晋升准将。同年九月七日，埃斯蒂加里维亚因飞机失事去世，军方高层在国务会议与众议院尚未能正常运作的情况下紧急磋商，最终由他继任临时总统一职，就此开启长达八年的执政生涯（详见本批已交付的总统条目）。"
 CBIO_PAR_alfred_stroessner_matiauda_desc:0 "阿尔弗雷德·斯特罗斯纳·马蒂奥达出生于恩卡纳西翁，父为德国巴伐利亚移民、任会计，母为具西班牙克里奥尔血统的巴拉圭人。一九二九年三月一日，他以军校学员身份入伍，选择炮兵为专业。查科战争期间，他在博凯龙、法尔孔等战线担任排长、连长等职，一九三二年晋升炮兵少尉，一九三六年一月获查科十字勋章。一九三四年晋升炮兵中尉，一九三六年七月晋升上尉，编入驻巴拉瓜里的第一炮兵团。一九四零年十二月晋升少校。一九四四年，他入读陆军参谋大学，次年获总参谋文凭，随后调回第一炮兵团并一度代理团长，同年十二月三十一日晋升中校。一九四七年内战期间，他率部效忠莫里尼戈政府，参与镇压反叛势力。一九四八年三月一日晋升上校，出任巴拉瓜里炮兵司令。"
 CBIO_PAR_riccardo_odriosola_desc:0 "里卡尔多·奥德里奥索拉出身巴拉圭卡萨帕地区奥特拉多家族，与佩德罗·杜阿尔特·奥特拉多、阿里斯蒂德斯·里瓦斯·奥特拉多同属该家族体系，是医生。一九四零年二月，总统何塞·费利斯·埃斯蒂加里维亚改组内阁时，任命他为卫生部长，同年他与总统联署颁布了赋予总统极大权力的一九四零年宪法。埃斯蒂加里维亚意外去世、伊希尼奥·莫里尼戈继任后，他一度留任卫生部长，其后由赫拉尔多·邦格米尼接替。巴拉圭至今仍有一所卫生中心以他的名字命名，以纪念其任内贡献。"
 CBIO_PAR_tomas_salomoni_desc:0 "托马斯·R·萨洛莫尼，全名托马斯·安德烈斯·萨洛莫尼，一八八四年四月十一日出生于亚松森，先后在家乡与蒙得维的亚求学。一九二零年，他作为红党少数派议员进入国会，以雄辩著称，在关于查科门诺派移民殖民地的国会辩论及一九二八年创设亚松森总教区法案的讨论中崭露头角。此后历任巴拉圭驻古巴、墨西哥、哥伦比亚公使，兼任国际联盟观察员，一九四零年率团出席在哈瓦那举行的美洲国家会议。何塞·费利斯·埃斯蒂加里维亚就任总统后的第二届内阁中，他出任外交部长。此后又出任驻玻利维亚拉巴斯公使。一九五二年十二月十八日在巴拉圭去世。"
 CBIO_PAR_amancio_pampliega_desc:0 "阿曼西奥·潘普列加一九零六年七月一日出生于亚松森，是莱斯梅斯·潘普列加与卡门·佩尼亚之子。他早年在军校任教官，一九二七年曾率军校学员分队赴布宜诺斯艾利斯，一九三二年入陆军参谋大学。查科战争爆发后，他以炮兵上尉军衔率炮兵第一群首个炮组参加博凯龙战役，此后在埃雷拉、法兰西亚、法尔孔等战线作战，获查科十字勋章、卫国者十字勋章及博凯龙奖章。战后升至炮兵司令，在伊希尼奥·莫里尼戈政府中先后出任内政部长与国防部长。一九四七年一月十一日，莫里尼戈召集高级将领磋商红党去留问题，他投票反对红党继续单独执政、主张纯军人政府，随即在莫里尼戈发动的一月十三日自我政变中被逮捕。晚年撰写回忆录扛枪肩上，一九八二年出版，并当选巴拉圭军事历史地理学院院士。"
 CBIO_PAR_damian_bruyn_desc:0 "达米安·布鲁因·帕尔梅罗拉一九零零年二月十二日出生于皮拉尤地区塞罗莱昂庄园，早年在阿雷瓜的家族别庄度过童年，后入圣何塞学院，一九一八年以金奖毕业，转入亚松森国立大学医学院深造，同样以金奖毕业。他最初在国家公共救济局任职，查科战争爆发后以中尉军衔从军。一九三六年二月革命后，他在拉斐尔·弗朗科政府中一度出任司法宗教及公共教育部长，同年十月接替费利佩·莫拉斯·洛佩斯出任亚松森市政厅长，任职至一九三七年六月弗朗科政府被推翻前后。"
 CBIO_PAR_francisco_esculies_desc:0 "弗朗西斯科·埃斯屈利斯是会计出身的官员，曾任巴拉圭会计师公会主席。一九四零年二月，总统何塞·费利斯·埃斯蒂加里维亚改组内阁，取消经济部，创设农业商业工业部，任命他为首任部长。同年十月一日至十日，在总统伊希尼奥·莫里尼戈继任之初，他短暂出任财政部长，是该职历史上任期最短的部长之一。此后他继续在莫里尼戈政府中任农业工业商业部长（后改称经济部）要职。"
