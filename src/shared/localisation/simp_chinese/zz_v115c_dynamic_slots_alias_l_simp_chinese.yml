 BUL_asen_dobrev_nikolov_desc:0 "阿森·尼科洛夫·尼科洛夫（1891年9月12日，生于扬博尔—1946年），1912年毕业于索非亚军校。1923年起在瓦尔纳海岸要塞服役，1934年出任索非亚炮兵学校校长，1936年任第2军事督察区炮兵处处长兼炮兵督察部防空处处长，1938年出任第2色雷斯步兵师师长。1941年起出任保加利亚第1占领军军长，率部协同德军参与占领塞尔维亚的治安作战。1944年9月保加利亚倒戈对德后，他于同年9月4日被德军俘虏。1944年10月，他拒绝参与组建效忠德国一方作战的保加利亚部队。1946年逝世。"
 BUL_atanas_pavlov_zhilkov_desc:0 "阿塔纳斯·帕夫洛夫·日尔科夫生于1888年10月14日，保加利亚陆军中将。日尔科夫长期在骑兵和军队指挥系统任职，1936年至1941年担任骑兵监察官。第二次世界大战前后，他进入最高统帅部系统，1941年至1944年任最高统帅部通信主任，负责战时通信和指挥保障事务。1940年南多布罗加回归保加利亚的过程中，他也参与过相关军事委员会工作。日尔科夫的履历主要集中在骑兵监察、通信和参谋保障岗位，1955年去世。"
