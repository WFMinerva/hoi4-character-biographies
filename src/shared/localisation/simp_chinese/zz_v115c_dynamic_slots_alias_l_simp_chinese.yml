 HOL_hendrik_van_oyen_desc:0 "$CBIO_HOL_hendrik_van_oyen_desc$"
 IRQ_abd_al_ilah_regent_desc:0 "阿卜杜勒·伊拉·本·阿里（1913年11月14日—1958年7月14日），伊拉克摄政王（1939—1953年）兼王储。为汉志末代国王阿里之子、费萨尔一世之侄、加齐一世的堂兄弟。1939年加齐车祸身亡后被任命为幼主费萨尔二世的摄政。1941年拉希德·阿里联合“黄金方阵”四校发动亲轴心政变时遭罢黜，他逃往外约旦投奔叔父阿卜杜拉国王，英军反击成功后被恢复摄政地位。此后他与努里·赛义德一道成为伊拉克亲英亲西方政策的核心支柱，积极参与镇压国内左翼及民族主义反对运动。1953年费萨尔二世亲政后，他转任王储，但实际上仍在幕后深度介入政治决策。1958年7月14日政变中与费萨尔二世一同在里哈卜宫被杀，遗体遭拖过巴格达街头、焚烧侮辱。"
 IRQ_bakr_sidqi_pm_desc:0 "巴克尔·西德基·阿斯卡里（1890年，生于基尔库克附近—1937年8月11日，卒于摩苏尔），库尔德裔伊拉克陆军将领，1936年政变主谋（现代阿拉伯世界首次军事政变）。奥斯曼帝国军校出身，一战中加入费萨尔的阿拉伯起义军。1921年进入英国委任统治下的伊拉克陆军，因才干出众迅速晋升。1933年8月他奉命率军“平定”北部亚述人，在西米勒地区实施了对亚述平民的无差别屠杀（西米勒惨案），包括妇女儿童在内约三千人遇害，西德基却因此被国内民族主义者奉为英雄并晋升准将——这一事件后来启发了拉斐尔·莱姆金提出“种族灭绝”概念。1935年他以同样的铁腕手段镇压南部什叶派部族叛乱。1936年10月29日他以代理参谋长身份调动忠于自己的部队向巴格达进军，空军在首都上空散发传单要求更换内阁，成功推翻亚辛·哈希米政府并扶植希克马特·苏莱曼出任首相，自己则以参谋长身份实际掌权。1937年8月11日他在摩苏尔机场准备赴土耳其访问时被反对派军人枪杀，在权力巅峰仅十个月。"
 IRQ_bakr_sidqi_th_desc:0 "巴克尔·西德基·阿斯卡里（1890年，生于基尔库克附近—1937年8月11日，卒于摩苏尔），库尔德裔伊拉克陆军将领，1936年政变主谋（现代阿拉伯世界首次军事政变）。奥斯曼帝国军校出身，一战中加入费萨尔的阿拉伯起义军。1921年进入英国委任统治下的伊拉克陆军，因才干出众迅速晋升。1933年8月他奉命率军“平定”北部亚述人，在西米勒地区实施了对亚述平民的无差别屠杀（西米勒惨案），包括妇女儿童在内约三千人遇害，西德基却因此被国内民族主义者奉为英雄并晋升准将——这一事件后来启发了拉斐尔·莱姆金提出“种族灭绝”概念。1935年他以同样的铁腕手段镇压南部什叶派部族叛乱。1936年10月29日他以代理参谋长身份调动忠于自己的部队向巴格达进军，空军在首都上空散发传单要求更换内阁，成功推翻亚辛·哈希米政府并扶植希克马特·苏莱曼出任首相，自己则以参谋长身份实际掌权。1937年8月11日他在摩苏尔机场准备赴土耳其访问时被反对派军人枪杀，在权力巅峰仅十个月。"
 IRQ_mahmud_salman_ac_desc:0 "马哈茂德·萨勒曼（1889—1942），伊拉克皇家空军上校，“黄金方阵”四校之一，也是四人中唯一的空军军官。1889年1月7日生于巴格达；早年先后在奥斯曼、叙利亚和伊拉克三国军队中服役，1925年加入伊拉克军队，后转入伊拉克空军并升任空军司令。1937年巴克尔·西德基政变之后，他是策划处决西德基的一小群军官之一。1941年政变期间，他主管空军方面的协调与指挥，与萨拉赫丁·萨巴格等三校一道罢黜摄政、拥立盖拉尼执政。政变被英方镇压后，他被军事法庭审判并处决，于1942年5月5日行刑。"
 IRQ_mahmud_salman_th_desc:0 "马哈茂德·萨勒曼（1889—1942），伊拉克皇家空军上校，“黄金方阵”四校之一，也是四人中唯一的空军军官。1889年1月7日生于巴格达；早年先后在奥斯曼、叙利亚和伊拉克三国军队中服役，1925年加入伊拉克军队，后转入伊拉克空军并升任空军司令。1937年巴克尔·西德基政变之后，他是策划处决西德基的一小群军官之一。1941年政变期间，他主管空军方面的协调与指挥，与萨拉赫丁·萨巴格等三校一道罢黜摄政、拥立盖拉尼执政。政变被英方镇压后，他被军事法庭审判并处决，于1942年5月5日行刑。"
 IRQ_salah_al_din_al_sabbagh_ahc_desc:0 "萨拉赫丁·萨巴格（1889—1945），伊拉克陆军上校，“黄金方阵”之首，1939至1941年间伊拉克军中泛阿拉伯民族主义势力的灵魂人物。1889年生于摩苏尔，早年在当地受教育，后入伊斯坦布尔的奥斯曼军事学院，1915年毕业任军官；一战期间在巴勒斯坦和马其顿服役并一度被俘，后投奔埃米尔费萨尔，1921年回到伊拉克加入伊拉克军队，其军事教育还包括在比利时和英国进修的课程。1924年起他在巴格达军事学院任教官，后转参谋学院，1937年升任伊拉克陆军副参谋长。作为民族主义者，他还督导“福图瓦”青年准军事运动的训练；他推崇耶路撒冷大穆夫提阿明·侯赛尼，与之及拉希德·阿里·盖拉尼一道向轴心国寻求对泛阿拉伯目标的支持，并成为1941年英伊战争的主要鼓吹者。1941年4月，他与法赫米·萨伊德、卡米尔·沙比卜、马哈茂德·萨勒曼三位上校联手发动政变，拥立盖拉尼执政、驱逐摄政阿卜杜勒·伊拉。战败后逃往伊朗，再转土耳其，1945年被英方擒获引渡回国，经军事法庭以叛国罪判处死刑，于1945年10月16日公开绞死。他著有回忆录《伊拉克的阿拉伯骑士》，1956年在巴格达出版，详述其泛阿拉伯理念与政变经过。"
 IRQ_taha_al_hashemi_ahc_desc:0 "塔哈·哈希米（1888年—1961年），伊拉克陆军将领兼政治家，首相亚辛·哈希米之弟。奥斯曼帝国军校及参谋学院出身，一战中参加阿拉伯起义。伊拉克独立后历任高级军职，1936年巴克尔·西德基政变时他正在安卡拉出访，被西德基电令阻止回国。1941年拉希德·阿里政变前后他是关键人物之一，一度出任首相（1941年2—4月），与“黄金方阵”四校及拉希德·阿里在反英民族主义立场上合流。政变失败后流亡，战后一度遭审判。著有关于阿拉伯军事史的学术著作。1961年逝世。"
 POL_edward_rydz_smigly_desc:0 "雷兹-希米格维生于1886年3月11日，加利西亚瓦普申村，幼年丧父，由外祖父母抚养成人，曾在雅盖隆大学攻读哲学与艺术史。第一次世界大战期间加入毕苏斯基麾下波兰军团，1920年波苏战争中指挥中央方面军，在华沙战役的决定性阶段发挥关键作用。1926年毕苏斯基发动“五月政变”时，他率维尔诺驻军驰援华沙，自此深受毕苏斯基信赖，1929年起负责东部事务的军事协调。1935年毕苏斯基逝世后，他被任命为武装力量总监，成为萨纳齐政权内与总统莫希奇茨基、总理斯瓦韦克三方分权格局中的实力人物，并最终通过与莫希奇茨基的协议压制斯瓦韦克，成为事实上的军政强人。1936年11月晋升波兰元帅，并被官方称为“仅次于总统的国家第二人”。1939年9月出任波兰武装力量总司令，指挥波兰保卫战；战败后于9月18日经罗马尼亚边境撤离并遭软禁，后转赴匈牙利。1941年10月，他秘密离开匈牙利，经斯洛伐克返抵被占领的华沙，自愿放弃元帅军衔，以普通地下抵抗战士身份参与秘密活动，同年12月2日在华沙病逝。其墓碑直至1991年仍未使用真实姓名，1994年华沙市民为其重立刻有全名的墓碑。"
 POL_josef_unrug_desc:0 "乌鲁克生于1884年10月7日，德国勃兰登堡，出身普鲁士与波兰混合血统的贵族家庭，父亲为普鲁士陆军少将。1907年毕业于基尔海军学院后加入德意志帝国海军，一战期间指挥潜艇并晋升潜艇支队指挥官。1919年波兰独立后，他毅然放弃德国国籍投身尚不存在的波兰海军，自费购置蒸汽船作为波兰海军首艘测量船，历任水文处处长、潜艇支队指挥官，1925年出任波兰舰队司令，1932年晋升海军少将。他与海军总监希维尔斯基长期力主建设“绿水海军”乃至“蓝水海军”，但受限于经费，主要成果是1932年“维赫尔”号驱逐舰强行进入但泽引发的“但泽危机”。1939年8月起出任沿海防御区司令，波兰战败后率残部死守海尔半岛，10月2日在弹尽粮绝下率部投降。此后被俘，辗转多个德军战俘营包括科尔迪茨城堡，面对德方屡次利诱其“叛降”均予拒绝，声称“自1939年9月1日起我已忘记德语”，坚持只用波兰语或法语与德方沟通，以精神感召鼓舞狱中波兰军人。战后定居英国，继而摩洛哥、法国，1973年2月28日在法国莱伊昂瓦尔逝世。2018年，波兰总统追授其海军上将军衔，其遗骸与夫人一同迁葬格丁尼亚。"
 SWE_gosta_ehrensvard_desc:0 "卡尔·埃伦斯韦德，瑞典陆军将领。埃伦斯韦德家族是瑞典著名军事贵族世家（以十八世纪建造卡尔斯克鲁纳海军基地的奥古斯丁·埃伦斯韦德最为知名）。"
 SWI_hans_oehler_high_command_desc:0 "汉斯·厄勒（1888年12月18日—1967年1月7日），阿尔高州维尔德埃格人，哲学博士，记者与出版人，瑞士两战间亲德右翼舆论的重要塑造者。他在慕尼黑、格勒诺布尔、莱比锡、柏林及苏黎世攻读哲学、历史及艺术文学史，1913年获博士学位。1918—1920年在周刊《自由之言》上反对《凡尔赛条约》体系及国际联盟。1921年他参与创立并主编《瑞士政治文化月刊》，该刊自创刊起即走亲德路线，是反对国联的瑞士独立人民同盟的机关刊物。1923年他在苏黎世与来访的希特勒有过一面之缘。1929—1930年，他在厄勒俱乐部聚集了一批对现状不满的学院青年，这批人后来发展为新阵线运动的雏形，他本人虽是苏黎世民主党成员，仍于1931年加入新阵线。1932年成为国民阵线创始成员之一。因其刊物日益沦为阵线运动的理论喉舌，1934年被刊物董事会解职，同年另办《瑞士民族小册》与原刊竞争，内容延续亲纳粹立场并试图规避明文禁令，该刊直至1946年停刊。1940年他参与慕尼黑召集瑞士各亲纳粹派系领袖的会议。1947年联邦法院以叛国罪判处其两年徒刑。战后他仍活跃于极右翼刊物，1967年在迪尔斯多夫逝世。"
 SWI_jakob_huber_army_chief_desc:0 "雅各布·胡贝尔（1883年11月1日—1953年3月11日），阿尔高州约嫩人，农民之子，曾在温特图尔学习化学工程，并先后在阿劳、苏黎世及法国从事化学工作，又自学测量学在突尼斯、埃及从事测量员工作。1911年转入军旅任教官军官，1913年被派往德国斯德丁的第38炮兵团见习。此后历任师参谋长、旅长、军参谋长、圣莫里斯要塞司令等职，1937年任总参谋部后方及要塞事务处处长，年底出任副总参谋长。1939年11月他因不满时任总参谋长雅各布·拉布哈特否决其改革方案，向吉桑将军请求调职；吉桑遂将拉布哈特调任新组建的第4军军长，任命胡贝尔为代理总参谋长，1940年3月23日转为正式任命，一直任职至1945年。他与性情外向、善于交际的吉桑形成互补，以沉默寡言、深谋远虑著称，被公认为二战期间仅次于吉桑本人的最重要瑞士军事人物。1940年底晋升为军长（联邦级最高军衔之一）。1953年在布里恩茨逝世。"
 SWI_jakob_huber_theorist_desc:0 "雅各布·胡贝尔（1883年11月1日—1953年3月11日），阿尔高州约嫩人，农民之子，曾在温特图尔学习化学工程，并先后在阿劳、苏黎世及法国从事化学工作，又自学测量学在突尼斯、埃及从事测量员工作。1911年转入军旅任教官军官，1913年被派往德国斯德丁的第38炮兵团见习。此后历任师参谋长、旅长、军参谋长、圣莫里斯要塞司令等职，1937年任总参谋部后方及要塞事务处处长，年底出任副总参谋长。1939年11月他因不满时任总参谋长雅各布·拉布哈特否决其改革方案，向吉桑将军请求调职；吉桑遂将拉布哈特调任新组建的第4军军长，任命胡贝尔为代理总参谋长，1940年3月23日转为正式任命，一直任职至1945年。他与性情外向、善于交际的吉桑形成互补，以沉默寡言、深谋远虑著称，被公认为二战期间仅次于吉桑本人的最重要瑞士军事人物。1940年底晋升为军长（联邦级最高军衔之一）。1953年在布里恩茨逝世。"
 SWI_jakob_labhart_high_command_desc:0 "雅各布·拉布哈特（1881年1月28日—1949年8月6日），图尔高州施特克博恩人，曾在柏林夏洛滕堡及慕尼黑高等工业学院深造，1905—1916年任炮兵教官，期间于1907—1908年赴普鲁士兰炮兵团受训，深受德式军事传统影响。此后历任军团参谋部运输科科长、团长、旅长、军参谋长等职，1936年出任总参谋长，晋升为军长。任内他一手主导瑞士秘密化学武器计划的筹建工作——该计划由联邦委员鲁道夫·明格尔于1937年2月私下下令、未告知其余联邦委员，以规避瑞士1932年已批准的《日内瓦议定书》。他因欣赏德国国防军的方法和体制而与吉桑将军产生摩擦，尤其是未被告知吉桑与法方进行的秘密总参谋部会谈。1940年初吉桑将其调离总参谋长职务，改任新组建的第4军军长（该职务他一直担任至1947年），原总参谋长一职名义上仍挂在其名下，实际总参谋工作则由胡贝尔代行。1949年在西格里斯维尔逝世。"
