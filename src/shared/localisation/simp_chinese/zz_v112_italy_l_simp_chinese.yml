 ITA_abba_jofir_doppleganger_desc:0 "1900年生，本名莫蒂·阿巴·乔比尔·阿巴·杜拉，吉贝奥罗莫人吉马王国末代国王，阿巴·吉法尔二世之孙。吉马王国地处埃塞俄比亚西南部，以咖啡贸易致富、长期以缴贡换取名义自治，至其祖父晚年已遭中央政府蚕食架空。约1930年起他着手从祖父手中争夺实权、抵制中央集权，同时秘密与意大利人接触——彼时意大利已在为入侵埃塞俄比亚积极培植内部分裂力量。1932年其与意方往来的书信被埃塞俄比亚帝国情报机构获取，他随即被召往亚的斯亚贝巴以叛国罪软禁，同年祖父去世、吉马王国正式被兼并收归直辖。1936年意军占领亚的斯亚贝巴后，意方将其从囚禁中释放，扶植为意属东非加拉-西达摩省苏丹——头衔虽响、实权有限，一切决策仍由意大利官员主导。占领期间他配合意大利向阿拉伯语世界进行的广播宣传，并协助意军搜剿地区抵抗运动，意大利人给予他十名武装卫兵随行保护，这一特权在整个占领期间的埃塞俄比亚贵族中极为罕见。1941年意大利战败后，他再次身陷囹圄；获特赦后回到吉伦旧宫颓垣之间度日，据1960年代访客记述\"行动受监控、出入受限制\"，政治生命已然终结。1988年辞世，吉马王国早已并入卡法省，今属奥罗米亚地区。"
 ITA_achille_starace_desc:0 "1889年8月1日生于加利波利（莱切省），国家法西斯党历史上在任时间最长的书记（1931—1939年），是法西斯运动中\"忠诚执行者\"类型的最典型人格：缺乏独立政治思想，却以近乎宗教的虔诚将领袖崇拜转化为日常制度。在党务核心的八年间，他将法西斯化的仪式推向荒诞的极致。他强制推行\"罗马步\"（passo romano），即意大利版正步，规定公共场合以罗马礼取代握手，推行以\"您\"（voi）取代\"阁下\"（lei）的称谓改革以彰显去资产阶级化，并以渗透日常生活一切细节的方式将对墨索里尼的个人崇拜制度化。他因此在意大利各阶层获得了讽刺性名声，\"领袖命令，斯塔拉切执行\"之类的嘲弄语流传甚广，而他本人对此似乎浑然不觉。他个人痴迷体能训练，多次在媒体前以中老年军官之姿跳越火圈，这类场景既是宣传素材，亦成为坊间笑柄。1939年他遭墨索里尼撤换，此后政治存在感日益消退。1943年7月墨索里尼倒台后，他曾试图向巴多格里奥政府靠拢，在政治剧变中再度失去方向。1945年4月28日，墨索里尼遗体被押送至米兰洛雷托广场示众；翌日（29日），游击队在广场附近捕获了仍在进行晨间体能训练的斯塔拉切，当场处决，其遗体亦被倒悬于广场，与昔日领袖并排。"
 ITA_ada_gobetti_desc:0 "1902年生于都灵，作家、知识分子与抵抗运动联络员，以亡夫皮耶罗·戈贝蒂的精神遗产与自身的游击实践双重著称。她的丈夫皮耶罗·戈贝蒂是意大利二十世纪最重要的反法西斯自由主义思想家之一，创办《理性改革》等刊物，多次遭法西斯暴力迫害，1926年流亡巴黎后不久即告不治，年仅二十四岁。丧夫时阿达年方二十余岁，独力抚养幼子；此后漫长的法西斯统治岁月中，她以克制而不妥协的姿态，透过翻译、教学与私下往来，维系着北意大利反法西斯知识圈的地下纽带。1943年9月停战后，她以逾四十岁之龄投身武装抵抗，加入皮埃蒙特\"正义与自由\"游击组织（Giustizia e Libertà），在都灵与山地游击区之间穿行，承担情报传递与后勤协调工作，危险程度毫不亚于持枪的游击战士。其子保罗亦参与了抵抗运动。战后，她将这段亲历写就《游击日记》（Diario partigiano），成为意大利抵抗运动女性视角的重要文学见证，至今仍是研究北意游击运动的第一手资料。她此后持续活跃于意大利文化与教育界，推动进步教育改革，并在都灵主持多项文化活动。1968年3月14日卒于都灵。"
 ITA_adelchi_serena_desc:0 "1895年12月27日生于拉奎拉、1970年1月29日卒于罗马，意大利法西斯政治人物，法学出身、执业律师。1915年志愿入伍一战、获勇武勋章；1921年加入法西斯党，1922至1923年任拉奎拉地方支部书记，1923年起统率民兵第130军团，1926年出任拉奎拉市长至1934年。1924年当选众议员，1933年升任法西斯党全国副书记，是书记阿基莱·斯塔拉切的主要副手，由此从内陆山城一路晋升至首都政治核心；任内主管社会政策，并于1936至1939年主持对外宣传、负责埃塞俄比亚战争的舆论动员。1939年任公共工程部长，次年10月30日接替穆蒂出任法西斯党全国书记，在意大利参战头十四个月内以军事化手段整顿党务、力图重振战时党机器，尝试吸纳女性组织与大学生团体以扩大党的动员基础，却成效有限，1941年12月26日被维杜索尼取代。1943年7月政权倒台后全面退出政治，其后二十余年悄然辞世，史学界称他为\"被遗忘的党魁\"。"
 ITA_alberto_beneduce_desc:0 "1877年生于卡塞塔，意大利最重要的国家资本主义制度建筑师，以大萧条时期创立意大利工业重建研究院（IRI）而深刻影响了意大利战后数十年的经济结构。早年投身社会主义运动，后以金融与产业技术官僚身份跨越政治阵营，以实用主义立场服务于法西斯政权。1933年他主持创建IRI，初衷是接管深陷危机的主要银行所持有的大量不良工业股权，防止金融体系崩溃；此举无意间将意大利钢铁、造船、通讯等核心工业领域纳入国家控制，IRI由此成为西欧规模最大的国有控股机构，其结构性影响延续至战后五十年。1944年辞世。"
 ITA_alberto_da_zara_desc:0 "1889年生，意大利皇家海军将领，以1942年6月的潘泰莱里亚海战（\"维果行动\"）中的积极进攻著称：他率意大利第7巡洋舰分队拦截护送英国\"哈普恩行动\"运输船队的护航力量，对英方护卫舰艇造成损伤，是意大利皇家海军为数不多的主动出击成功案例之一。1943年9月停战后，他按停战条款行事。战后著有回忆录《提督之皮》（Pelle d'ammiraglio），是地中海海战的重要第一手记录。1951年辞世。"
 ITA_alberto_de_stefani_desc:0 "1879年10月6日生于维罗纳、1969年1月15日卒于罗马，意大利经济学家与法西斯政治人物。帕多瓦大学出身，后任威尼斯卡福斯卡里大学政治经济学教授；一战老兵，战后加入法西斯运动。1922年12月墨索里尼任命其为财政部长，次年兼并财政与经济部，成为法西斯政权初期经济政策的实际操盘手。他推行古典自由主义路线：大幅削减政府开支与税赋、私有化电话及人寿保险等国营业务、重组税制、吸引外资，于1924至1925财年实现意大利近百年来罕见的财政盈余——此前仅有1876年和1893年两例。然而至1925年中，货币投机盛行、里拉加速贬值，政策陷入危机，墨索里尼以企业家出身的科尔波拉蒂斯特沃尔皮取而代之，将其解职；他是少数因政策失败而去职、而非因政治失宠而倒台的法西斯高官。离任后他仍留在法西斯大议会，日后成为反对纳粹种族法输入意大利的内部批评者之一。1937年蒋介石亲点其赴华改革中国财政行政体制，他在南京工作数月后以\"中国人民终身顾问\"荣衔返国，因立场倾向中方、试图调停中日争端，一度被意大利法西斯媒体指责为\"亲华者\"。"
 ITA_alberto_pariani_desc:0 "1876年生于米兰，职业军人，1936至1939年出任陆军参谋总长兼战争部次长。任内以推行\"二元师\"改革著称：将意大利步兵师从三团制缩减为两团制，意图在有限资源内增加师级单位数量；实际效果是以牺牲每个师的战斗持续力和独立作战能力为代价换取编制数字的虚增。历史学界普遍将这一改革列为意大利二战初期野战部队战斗力系统性低下的结构性原因之一。他同时倡导\"快速战\"（guerra di rapido corso）理论，在实践中与意大利工业和后勤能力的现实差距形成明显落差。1939年随意大利军事领导层改组去职。"
 ITA_alberto_tarchiani_desc:0 "1885年11月11日生于罗马、1964年11月30日卒，意大利记者、政治人物与外交官。青年时从事新闻业，1907年赴纽约编辑意大利语周刊《公民报》，期间融入美国社会、习得对美关系的深厚积累；1915年返国志愿从军参战。1919年入职《晚邮报》任编辑，至1925年因公开反对法西斯被迫流亡法国。在巴黎他与卡洛·罗塞利等人共同创立\"正义与自由\"运动，参与流亡反法西斯文宣工作。1940年德军入侵法国后转赴纽约，出任马志尼学会秘书长，一方面在美国意大利裔社区展开反法西斯宣传、一方面与美国政府要员建立关系网络，为日后大使任命奠定基础；其间因被指接受英国情报机构资助而在流亡圈内饱受争议。1943年借助英国特别行动处安排秘密回国，1944年参加盟军安齐奥登陆，随后加入行动党（自由民主翼）。法西斯政权倒台后先后出任巴多格里奥第二届政府公共工程部长、博诺米政府国家重建办公室主任；1945年2月起接掌意大利驻美大使，任职至1955年，是战后意大利融入西方阵营的关键枢纽人物，1949年代表意大利与外长斯福尔扎共同在华盛顿签署北大西洋公约。"
 ITA_alcide_de_gasperi_desc:0 "1881年4月3日生于特伦蒂诺皮耶韦泰西诺（时属奥匈帝国），意大利基督教民主党创始人，战后意大利最重要的政治领袖。他生于奥匈帝国治下意大利语区，早年以帝国议会议员身份起步，一战后特伦蒂诺并入意大利才转换政治舞台，加入斯图尔佐神父创立的意大利人民党。法西斯上台后拒绝妥协，1927年遭墨索里尼政权逮捕入狱，出狱后以梵蒂冈图书馆馆员身份蛰伏，同期秘密筹建基督教民主党。战后以坚定的亲西方、反共立场主导共和国重建，1945至1953年任总理，是战后在任时间最久的意大利总理。他主导1948年大选击败共产-社会党联盟，推动意大利加入北约（1949年），并与阿登纳、舒曼共同奠定欧洲一体化的早期基础，被视为\"欧洲建国之父\"之一。1954年8月19日卒于瓦尔苏加纳。"
 ITA_aldo_pellegrini_desc:0 "1888年8月28日生于博洛尼亚、1940年12月7日殉职，意大利皇家空军空军大将，原为海军军官。1908年入皇家海军，1910年以少尉毕业，参加意土战争；一战中转习飞行、考取水上飞机证，先后指挥多个水上飞机中队，获两枚银质、一枚铜质勇武勋章。1924年转入新成立的皇家空军；1933年在巴尔博领衔的\"十周年大洋巡航\"（意大利编队横越大西洋飞抵芝加哥世博会）中任副指挥，荣获航空金质勇武勋章，是意大利民用与军用航空的标志性壮举。1940年5月出任驻罗马第3空中舰队司令；法意停战签订后，当月即出任意法停战委员会副主席，总部都灵，与委员会主席皮埃特罗·平托尔大将共事。同年7月晋空军大将；12月7日，他与平托尔同乘S.79运输机从罗马飞往都灵开会，途中飞机坠毁于皮埃蒙特萨沃纳-阿列桑德里亚省界处的卡托西奥村。"
 ITA_alessandro_pirzio_biroli_desc:0 "1877年生，意大利将领，殖民战争与占领镇压的代表人物。早年参与意大利对利比亚及东非的殖民军事行动。二战中，1941至1943年出任意占黑山（蒙特内哥罗）总督，面对持续的游击抵抗，他推行严酷报复政策，以集体处决与焚毁村庄清剿抵抗力量，是意大利占领区暴行主要责任人之一。1943年9月停战后被德军解除指挥权。1962年辞世。"
 ITA_alfredo_guzzoni_desc:0 "1877年生于曼托瓦，意大利将领。二战初期任陆军副国务卿，参与早期作战规划，1940年6月率部参与南法登陆行动。1942至1943年出任西西里第6集团军司令，1943年7月盟军\"哈士奇行动\"登陆期间，他以严重劣势兵力协调轴心军防御，在众多高级将领中表现相对称职。西西里失陷后去职。1965年辞世。"
 ITA_amadeo_bordiga_desc:0 "1889年6月13日生于那不勒斯省雷西纳，马克思主义理论家，意大利共产党的创始人之一与首任领导者，同时是共产国际历史上最早与斯大林主义路线正面决裂的共产党领袖。他早年在那不勒斯投身社会主义运动，迅速成为意大利社会党内最强硬的纯粹主义旗手，拒绝任何形式的议会参与和跨派别合作，视其为对革命原则的稀释。1921年1月21日，他在里窝那代表大会上主导了意大利共产党自社会党的历史性分裂，成为PCI第一任中央书记。此后，他与共产国际的路线冲突迅速公开化。他坚决反对\"统一战线\"策略，拒绝接受共产国际对各国党的指令权威，主张以纯粹无产阶级先锋党路线应对法西斯主义。1924年前后他被架空领导权，1926年在共产国际内遭强制搁置，1929年被正式开除出共产国际。托格利亚蒂此后主导意共数十年，两人路线分歧再未弥合，博尔迪加在意共官方叙述中长期被定性为\"宗派主义错误\"的代名词。意大利当局于1926年将其逮捕，判处内部流放（confino）。漫长的法西斯岁月中，他保持近乎彻底的政治沉默，拒绝与任何外部势力合作。战后他在南意大利重组极左共产主义小团体，坚持其\"左翼共产主义\"（Bordighismo）路线，批判苏联、批判意共主流，影响力主要限于超左圈子。1960至1970年代，其理论著作因西方新左思潮兴起而被重新发掘，成为欧美超左派的重要参照系。1970年7月23日卒于福米亚。"
 ITA_amedeo_guillet_desc:0 "1909年生，职业骑兵军官，以东非战役中的传奇经历著称。1941年1月在厄立特里亚，他率领殖民骑兵（含土著Dubat部队）向英军发动冲锋，被认为是近代战争史上有据可查的最后大规模骑兵冲锋之一。意大利东非战败后，他拒绝投降，改装成阿拉伯人潜伏英占区，以化名\"魔鬼指挥官\"（Comandante Diavolo）坚持游击抵抗近两年，被英军通缉却始终未被捕获。最终经也门辗转撤回欧洲。战后转入外交系统，在多国任职，以百岁高寿于2010年辞世。"
 ITA_amedeo_mecozzi_desc:0 "1892年生，意大利皇家空军将领与空权理论家，以倡导\"攻击航空\"（aviazione d'assalto）著称，是二十世纪初期意大利空军思想界最重要的异见声音。彼时意大利空权学说由杜黑（Giulio Douhet）的战略轰炸理论主导——以轰炸工业、城市与平民士气来瓦解敌国战争意志。梅科齐是其主要理论对手：他认为\"间接打击\"效率低下、代价高昂，主张发展以低空精确打击战场地面目标为核心的战术支援航空，强调对敌方后勤节点、装甲集群与兵力集结的直接摧毁——这一理论预见了日后近距离空中支援（CAS）的作战逻辑。战间期他积极推动攻击机的战术研发与条令写作，二战中以高级军职参与空军指挥，但在资源有限、轰炸机优先的现实格局中，其主张未能充分落实。约1971年辞世。"
 ITA_angelo_iachino_desc:0 "1889年生，意大利皇家海军上将，以马塔潘角海战（1941年3月27至29日）的惨败永载海战史册。他指挥意大利舰队在地中海东部执行截击任务，却因英方已借助\"超级机密\"（Ultra）情报破译其编码通讯、完全掌握其行踪，被坎宁安将军以夜战重创：意方损失重型巡洋舰扎拉号、波拉号、菲乌梅号及驱逐舰两艘，是意大利皇家海军二战中最惨重的单次败仗，意大利海军此后在大规模作战上明显趋于保守。战后从事海战史写作，1976年辞世。"
 ITA_annibale_bergonzoli_desc:0 "1884年生，以浓密卷须得\"电胡子\"（Barba Elettrica）之称，西班牙内战中参战并以顽强勇猛见称。1940至1941年英军\"罗盘行动\"期间，他在利比亚昔兰尼加指挥防御，先后经历巴尔迪亚之役与随后的全线溃退；最终于1941年2月贝达丰姆战役中落入英军之手，成为此役被俘的最高级意大利将领之一，英国报界对此大加渲染。此后在英方羁押至战争结束，战后辞世。"
 ITA_antonio_pesenti_desc:0 "1910年10月生于维罗纳、1973年卒于罗马，马克思主义经济学家与反法西斯活动家（注:并非军人）。帕维亚法学毕业后投身地下反法西斯运动，辗转伦敦、维也纳、伯尔尼、巴黎进修经济学，以化名发表反法西斯小册子。1935年10月，他化装易名在布鲁塞尔\"流亡意大利人大会\"上发言、谴责法西斯侵略埃塞俄比亚；返国即被捕，1936年被特别法庭判处24年监禁（引发国际声援，巴黎成立\"佩森蒂委员会\"），狱中加入共产党，先后系狱近八年。1943年9月获释后越过战线，在巴里加入共产党，1944年先后任巴多格里奥政府、博诺米政府的财政部次长，旋任第二届博诺米政府财政部长。战后历任制宪议会议员、参议员及帕尔马、比萨、罗马大学教授。"
 ITA_arturo_riccardi_desc:0 "约1878年生，意大利皇家海军上将，1941年12月至1943年9月出任海军总参谋长（Supermarina），接替因塔兰托空袭失败与希腊战役连带责任而去职的卡瓦纳里。在任期间主持了意大利海军在地中海战争最艰难阶段的战略统筹：维护北非补给线、应对英国潜艇与航空兵的持续消耗、在燃油极度匮乏的条件下维持主力舰队有限的出击能力。北非战线全面崩溃（1943年5月）与盟军登陆西西里（7月）后，意大利海军作战能力已接近枯竭；1943年9月停战后他执行舰队驶往盟方的命令。战后未受主要追究。"
 ITA_carlo_bergamini_desc:0 "1888年生，意大利皇家海军上将，意大利主力舰队末任司令，以悲壮方式完成了对停战条款的服从。1943年9月8日停战令公布后，他奉命率主力战列舰队向北非驶去，依约向盟军移交舰只。翌日（9月9日），舰队航行中途遭德国空军以\"弗里茨X\"无线电制导炸弹攻击，旗舰\"罗马号\"战列舰被连续两枚命中，弹药库殉爆，数分钟内沉没，贝尔加米尼随舰殉职。这是意大利皇家海军二战中最惨重的单次损失，亦是制导武器在实战中击沉大型军舰的首个著名战例。"
 ITA_carlo_favagrossa_desc:0 "1888年11月22日生于克雷莫纳、1970年卒，意大利将领与政治人物，工兵出身，参加过利比亚战争、一战（获银质勇武勋章）及西班牙内战。1939年起主管意大利战时生产，1940年5月起任战争生产次长、统领\"战争生产署\"（Fabbriguerra），1943年2月该机构升格为部后任战争生产部长。他曾受墨索里尼之命评估备战状况，1940年4月7日提交报告，断言意大利要到1942年10月才能做好参战准备；墨索里尼被希特勒闪击战的初期胜利所惑、认定战争短暂，对此不以为然（\"我知道，我知道，我们尽力而为\"），仍于1940年6月仓促参战，比建议时间提早逾两年。1946年他著《我们为何输掉战争》一书剖析败因。"
 ITA_carlo_geloso_desc:0 "1879年生，意大利将领。二战中出任希腊与爱琴海占领区高级指挥官，历任第11集团军司令及爱琴海驻屯军司令，主导意属希腊的军事管制。1943年9月停战后，麾下部队大规模被德军缴械，大批士兵遭押送德国充当劳工，病死与过劳致死者众多。战后未受法律追究。"
 ITA_carlo_scorza_desc:0 "1897年生，法西斯党官员，1943年4月19日出任国家法西斯党（PNF）最后一任书记，在任仅约三个月即遭遇法西斯体制最戏剧性的内部崩溃。1943年7月24至25日夜，法西斯大委员会召开紧急会议，就格兰迪动议（剥夺墨索里尼最高军事指挥权）进行表决，斯科尔扎投票反对该动议，但以7票对19票落败。墨索里尼随即被捕，法西斯党宣告解散，他亦随之落网。战后以通敌罪受审，后经特赦获释，此后淡出公众视野。"
 ITA_carlo_vecchiarelli_desc:0 "1884年生，意大利将领。二战末期在希腊境内历任要职，1943年任第11集团军司令。停战令于9月8日发布时，他统辖希腊境内意军主力，局势混乱中未能有效组织抵抗或撤离，部队随即被德军大规模缴械；被俘士兵以\"军事被拘留者\"（IMI）身份关押，而非战俘，无法享受日内瓦公约保护，死亡者甚众。战后未受正式审判。"
 ITA_curzio_malaparte_desc:0 "1898年6月9日生于普拉托，原名库尔特·埃里希·祖克尔特，父亲为德国纺织技师，母亲为意大利人。他自创笔名\"马拉帕尔特\"（Malaparte，\"坏的一半\"），刻意颠覆拿破仑姓氏\"博纳帕尔特\"（\"好的一半\"），以反讽姿态昭示其文学立场——身份的混血性与名字的改换，贯穿了他整个充满矛盾的一生。他的政治轨迹是二十世纪意大利知识分子投机主义与道德困境的极端样本。一战后期志愿参战，战后投身法西斯运动，以热情支持者面目写下大量鼓吹文字；然其《政变技术》（Tecnica del Colpo di Stato，1931年）以冷峻解析现代权力夺取机制而冒犯墨索里尼本人，遭流放至利帕里岛，在孤岛度过数年。重返后他转型为战地记者，赴东线采访苏德战场，亲历了1941至1942年间纳粹德国占领下东欧的系统性野蛮与欧洲上流社会的荒诞变态。这段经历结出两枚最重要的文学果实：《灭亡》（Kaputt，1944年）记录了东线的血腥、芬兰的严冬与欧洲精英阶层在战争中的道德崩解；《皮肤》（La Pelle，1949年）描写盟军进入那不勒斯后城市秩序的全面瓦解，以晦暗笔调挑战了战后意大利主流叙事的道德自清。两书在欧美引发巨大争议，至今仍是二战文学的核心经典。战后在卡普里岛，他亲自设计了一座后以其名字命名的别墅（Villa Malaparte）。1957年7月19日卒于罗马。"
 ITA_domenico_cavagnari_desc:0 "1876年生，意大利皇家海军上将，1933至1940年出任海军部次长兼海军总参谋长，全权主导意大利海军战前建设与备战规划，主持了战列舰、重型巡洋舰与潜艇舰队的大规模扩充。然而意大利海军在其任内对雷达与声纳技术的引进严重滞后，技术差距在实战中付出了沉重代价。1940年11月11至12日，英国航空母舰\"光辉号\"舰载双翼鱼雷机夜袭塔兰托港，以约20架飞机重创3艘意大利战列舰，暴露出其主导的港口防御体系的根本漏洞；他随即于当年底辞职，此后退出公众视野。"
 ITA_emilio_de_bono_desc:0 "1866年生于伦巴第卡萨诺达达，职业军人出身，意大利法西斯运动的创始元老之一。一战期间历任要职，战后投身法西斯运动，1922年10月跻身主导\"进军罗马\"的四巨头之列，与巴尔博、德·韦基、比安基并肩。法西斯执政后，他历任国家民兵志愿军（MVSN）总司令、殖民地部长等要职。1935年10月奉命指挥意军入侵埃塞俄比亚，因推进迟缓被墨索里尼数月后撤换，由巴多格里奥接手完成征服；事后仍获授意大利元帅衔。1943年7月25日，在法西斯大委员会召开的紧急会议上，他投票支持格兰迪动议，赞成剥夺墨索里尼最高军事指挥权，从而成为促成其倒台的关键票数之一。德军救出墨索里尼、建立萨罗共和国后，他以\"叛徒\"身份在维罗纳接受审判。1944年1月11日，这位法西斯运动创始元老被萨罗政权处以枪决，终年七十七岁。"
 ITA_ettore_baldassarre_desc:0 "1883年4月27日生于普利亚省特拉尼，职业军人，参加1911至1912年意土战争时获铜质勇武勋章，一战期间以探索气球引导重炮射击技术著称。战后主持陆军炮兵规范教材编纂，以\"特殊功绩\"破格晋衔上校，此后出任安萨尔多军工集团炮兵委员会委员。1936年晋准将，1938年晋少将，接掌莱尼亚诺步兵师。1939年11月，他接管新组建的第132装甲师\"阿里埃特\"。1941年春，意军第10集团军在英军\"指南针行动\"中被全歼后，阿里埃特师增援北非，与隆美尔非洲军团并肩完成昔兰尼加反攻。他是为数不多获得德方正面评价的意大利将领——历史学家塞缪尔·米查姆记录，\"巴尔达萨雷是极少数让隆美尔真心敬重的意大利将领之一\"。1942年3月，他返回北非接掌第20摩托化军，统辖阿里埃特、半人马与的里雅斯特三师，率部参与加扎拉会战、比尔哈肯围攻及托布鲁克攻克等关键战役。1942年6月26日，他在梅尔萨马特鲁前沿视察途中，座车遭英国皇家空军\"飓风\"式战机俯冲扫射，随行的炮兵指挥官皮亚琴扎将军、工程指挥官拉法埃利上校及参谋当场阵亡，他本人身负重伤。弥留之际，他命人召来德·斯特凡尼斯将军，将第20军指挥权当面移交，随后于当日14时在\"阿里埃特\"师野战医院不治身亡，终年五十九岁。历史学家伊恩·沃克写道，\"失去这几名重要军官对意大利军队是一次重大打击，其中尤以巴尔达萨雷为甚，他在五月和六月的战斗中一直以成功领导部队著称。\"他追授金质勇武勋章，家乡特拉尼以其名命名一所学校与一条街道，波代诺内马尼亚戈兵营亦以其名为号。"
 ITA_ettore_bastico_desc:0 "1876年生于博洛尼亚，意大利元帅，军旅生涯横跨殖民战争、西班牙内战与第二次世界大战三个阶段。一战期间历任参谋要职，战间期参与意大利在利比亚及东非的殖民军事行动。1937年，他接替罗阿塔出任西班牙意大利志愿军团（CTV）总司令，率部支援佛朗哥阵营，直至当年底卸任。二战中，1941年7月接替加里博尔迪出任利比亚总督兼北非轴心军名义最高司令，理论上对德国非洲军握有节制权，实际上则与隆美尔长期处于权力摩擦状态。隆美尔惯于绕开他直接与柏林及意大利最高统帅部沟通，巴斯蒂科几乎无力约束其进攻节奏；双方在补给优先级、攻击时机与战线延伸风险上屡生矛盾，记录显示巴斯蒂科曾多次以补给告急为由劝阻隆美尔的激进突进，均遭无视。1943年2月北非战局急剧恶化，他被解职，由梅塞接手残局。此后平静度过余生。以极长寿著称：约1972年以九十六岁高龄辞世，是意大利元帅级将领中在世最久者之一。"
 ITA_ettore_muti_desc:0 "1902年生于拉韦纳，法西斯运动暴力原生代，黑衫党行动队出身，兼具骑兵军官与战斗机飞行员经历，先后参加埃塞俄比亚战争与西班牙内战，积累多枚金质勇武勋章，由此赢得墨索里尼的特别赏识。1939年接替斯塔拉切出任国家法西斯党书记，约一年后即被塞雷纳替换——他长于勇武行动而短于官僚机器，党务行政实非其长。1943年7月墨索里尼倒台后被捕，同年8月在押送途中遭宪兵枪击毙命，官方称系\"拒捕逃跑\"。"
 ITA_ezio_rosi_desc:0 "1881年3月19日生于维琴察，意大利将领。1941年2月接任第6集团军司令，负责意大利南部、西西里岛与撒丁岛海岸防御，维持着无显著战事的静态防线，直至1943年盟军登陆。1943年2月2日接替晋任参谋总长的安布罗西奥，出任陆军参谋总长，任期仅三个多月，时值意大利第8集团军在东线溃败之际。1943年6月1日，转任\"东方集团军群\"司令，驻巴尔干地区，统辖驻阿尔巴尼亚第9集团军与驻希腊第11集团军，7月1日晋升大将。9月8日停战令广播后，他无法与最高司令部取得有效联系，仅收到一则模糊电报，禁止对德采取任何敌对行动。从9月9日起，他与德军第2装甲集团军司令伦杜利奇展开谈判，试图为麾下部队争取携带轻武器和平撤返的权利。协议于9月11日凌晨达成，然而当日上午11时，德军装甲部队突然包围其司令部，将他与全部幕僚一并俘获。他被押送波兰军官战俘营（64Z号营），因拒绝与萨罗共和国合作被移至托伦惩罚营。引渡后经法西斯特别法庭审判，获无罪释放。1963年在博洛尼亚辞世。"
 ITA_fausto_gullo_desc:0 "1887年生于卡坦扎罗，意大利共产党人，法学背景，法西斯年代长期活跃于卡拉布里亚底层法律实践与地下党务。1944年出任博诺米政府农业部长，任内颁布一系列农业法令（\"古洛法令\"，Decreti Gullo）：强制规定佃农获取更高比例的农业收益，并允许农民合作社开垦荒置土地——这是战后意大利南方最重要的土地改革尝试，直接触动延续数百年的大庄园佃耕制度。这些法令在南方引发激烈的阶级冲突，地主阶层借助司法与政治渠道大力阻挠，多数条款未能在实践中充分落实，成为战后意大利南方问题积重难返的最早注脚。1974年辞世。"
 ITA_ferruccio_parri_desc:0 "1890年1月19日生于皮埃蒙特皮内罗洛，一战老兵出身，其后转型为记者与自由主义知识分子，是行动党（Partito d'Azione）核心人物。墨索里尼掌权后坚决抵制法西斯政权，多次遭逮捕系狱。二战期间以化名\"毛里齐奥\"深入地下抵抗网络，出任北意大利游击运动统帅之一。1945年1月被纳粹盖世太保逮捕，险遭处决，后经美国战略情报局（OSS）特工艾伦·杜勒斯居中斡旋获释，此事与德军在意大利投降的秘密谈判相关联。意大利解放后，以抵抗运动代表身份出任战后首任总理（1945年6月至12月），六个月后去职。此后以终身参议员身份坚守反法西斯历史记忆，被视为意大利共和国精神源头的守护者之一。1981年12月8日卒于罗马。"
 ITA_francesco_pricolo_desc:0 "1891年1月30日生于格鲁门托诺瓦、1980年卒于罗马，意大利空军将领，飞艇军官出身，一战中执行过六十余次飞艇任务。1939年11月至1941年11月任空军次长兼参谋长，领导空军度过参战头十八个月。他颇具远见，力排海空军高层\"昂贵玩具\"的成见，推动将SM.79改装为鱼雷机，并说服菲乌梅鱼雷厂取消一笔德国订单、转产八十枚鱼雷，使SM.79鱼雷机于1940年8月投用，又促成马基C.202战机研制。1941年11月，他因与卡瓦莱罗严重冲突、且为德方所不喜而去职——隆美尔曾在报告中提醒最高统帅部\"提防反复无常的意大利将军普里科洛\"；他于1954年退役。"
 ITA_francesco_zingales_desc:0 "意大利将领，1941年7月被任命为意大利俄国远征军（CSIR）首任司令，率三个摩托化师踏上加入\"巴巴罗萨\"行动的征途。然而在从罗马尼亚向前线推进的途中，他于7月13日在维也纳突发肺部并发症住院，于17日将指挥权移交梅塞将军，就此缺席了CSIR整个首年的实战。1942年11月，他重返东线，接掌由CSIR扩编而成的第35军——此时该部已编入意大利第8集团军（ARMIR），部署在顿河防线。同年12月，苏军\"小土星行动\"发动，他所统辖的防线正处于攻势核心地段，战线于18日被彻底击穿，意大利第8集团军遭受二战中最惨重的溃败。传闻他病倒前曾于7月8日向部队发布第一号日令，措辞慷慨，对意大利必胜抱有充分信心。1943年4月，残余部队撤返意大利，第35军在博尔扎诺附近宣告解散。"
 ITA_giacomo_acerbo_desc:0 "1888年7月25日生于阿布鲁佐洛雷托阿普鲁蒂诺，法西斯政治人物，以\"阿切尔博选举法\"（Legge Acerbo，1923年）在意大利政治制度史上留下深刻印记。该法规定：得票超过25%的第一大党自动获得议会三分之二席位——1924年大选据此执行，意大利法西斯党借由选举威胁与系统性舞弊完成了对议会的制度性控制，阿切尔博法是这一进程的关键制度工具，被历史学家列为意大利从宪政走向独裁的最重要立法节点之一。此后长期在法西斯政府任职。1943年7月24至25日大委员会表决中，他投票支持格兰迪动议。维罗纳审判以缺席方式判处死刑，战后经重审获释，晚年专注农业经济研究，1969年1月9日辞世。"
 ITA_gian_galeazzo_ciano_desc:0 "1903年3月18日生于里窝那，父亲科斯坦佐·齐亚诺是法西斯运动的航海英雄与创始要人；他本人于1930年迎娶墨索里尼之女埃达，由此成为法西斯王朝的皇室姻亲，也埋下了日后权力失足的致命伏笔。外交出身的他升迁极速，1936年以三十三岁之龄出任外交部长，主导意大利对外政策长达七年。其任内最重大的外交行动是1939年5月与德国签订《钢铁条约》，将意德两国正式绑入军事同盟；他的日记却同时记录了他对希特勒与纳粹德国的深切不信任——他认为德方习惯于欺骗意大利，将意大利绑入自己的战争时间表而不事前知会。1939年4月他主持了对阿尔巴尼亚的吞并行动。随意大利在战场上接连受挫，他与轴心同盟的热情逐渐消退；1943年2月遭墨索里尼撤换，转任梵蒂冈大使，政治边缘化已成定局。1943年7月24至25日深夜的法西斯大委员会紧急会议上，他投票支持格兰迪动议，成为导致墨索里尼倒台的19票之一。此后家人随德国方面劝说前往德国，随即遭拘押并被押送回意大利，交萨罗共和国处置。妻子埃达试图以齐亚诺日记为筹码向德国当局换取丈夫性命，未能成功。1944年1月11日，他在维罗纳与德·博诺等同案四名被告并排坐于椅上被处决——这种方式被设计为对\"叛徒\"的特别羞辱；行刑时他设法转身直视枪口，此举被多位目击者记录。"
 ITA_giovanni_duca_desc:0 "1896年11月5日生于都灵，步兵上校，抵抗运动烈士，战后追授金质勇武勋章。职业生涯横跨一战、国外武官任期（1934至1940年先后驻比利时、荷兰、葡萄牙），及军事情报局\"攻势\"科负责人（1939至1940年）；1941年率第7步兵团参加希腊-阿尔巴尼亚战役。1942年出任摩德纳步兵骑兵军事学院院长，私下以\"那个疯子\"暗称墨索里尼。1943年9月8日停战令颁布后，他当机立断，率两个学员营和一个骑兵中队在帕武洛—拉马莫科尼奥山区组织初期武装抵抗，将军旗拆成四份分散藏存，随后接受最高司令部命令北上，在意大利北部秘密组织更大规模的抵抗网络。其在亚平宁山地聚集的首批游击核心，直接催生了日后蒙泰菲奥里诺游击共和国的前身，被部分历史学家视为意大利有组织抵抗运动的奠基者之一。北上执行秘密任务途中，他与儿子维托里奥同时被党卫军逮捕。经历五个月酷刑，始终拒绝透露任何组织信息，妻女亦遭株连逮捕。1944年8月28日遇难于维罗纳。儿子维托里奥被押至毛特豪森集中营，于1945年3月在古森二号分营遇害，年仅二十三岁。维罗纳一座大型兵营至今以其名字命名。"
 ITA_giovanni_marinelli_desc:0 "1879年10月18日生于阿德里亚、1944年1月11日被处决，意大利法西斯政治人物。富商出身，曾出资支持向罗马进军。任法西斯党（PNF）行政书记期间，他仿苏联契卡建立了党的秘密警察\"切卡\"——一支恐怖打手队伍，1924年策划暗杀了反对派领袖贾科莫·马泰奥蒂。1925年他作为谋杀主使受审，由法里纳奇辩护，终因与墨索里尼私交深厚而被轻判脱身、重返党务，此后二十年低调行事，参与镇压党内异见。1943年7月25日，身为法西斯大议会成员的他投票赞成解除墨索里尼权力；萨罗政权成立后，他被捕，并在1944年1月的维罗纳审判中以叛国罪与齐亚诺、德博诺等同被判死刑，11日清晨遭枪决。"
 ITA_giovanni_messe_desc:0 "1883年12月10日生于普利亚梅萨涅，意大利元帅，二战中意军最受推崇的野战指挥官之一。一战老兵出身，战间期历练多个军职。1941至1942年率意大利远征军（CSIR）参加东线，在顿河一线以相对体面的表现与苏军周旋，后因与德方协调问题矛盾激化而遭调离。1943年初接手突尼斯第1意大利集团军，在轴心军全线崩溃的背景下数度发起局部反击，尽力拖延盟军合围，被对方视为具备真正战术素养的对手。1943年5月13日，在弹尽粮绝、退路全断的情况下率部投降，据传正是在投降当日收到元帅晋衔通知。同年9月意大利停战后，他选择投向盟国，出任共战意大利军队参谋总长，主持重建意大利军事力量，是少数在政治剧变中全身而退并继续发挥作用的高级将领。战后以严谨职业军人形象著称。1968年12月19日卒于罗马。"
 ITA_giulio_paggio_desc:0 "1925年9月20日生于伦巴第萨罗诺、2008年11月15日卒于布拉格，意大利共产党员、游击队员。1943年投身抵抗运动，以\"阿尔瓦罗中尉\"为战斗名，年仅十八岁即指挥第118加里波第旅，活跃于奥索拉谷地与米兰兰布拉泰一带，枪托上刻有\"不给第二次机会\"字样。解放后在兰布拉泰英诺森蒂工厂任工人，1945年在工人社区人民之家创立共产主义准军事组织\"红色飞队·抵抗运动烈士\"，以追缉战后凭托利亚蒂大赦逃脱法律制裁、仍逍遥法外的前法西斯官员为己任，行动遍及意大利北部和中部，高峰时人员数十名。1947至1949年间，飞队成员被指控实施三起蓄意杀人、两起未遂杀人及多起袭击与占厂行动；1949年2月米兰警方大规模清查后，飞队瓦解，帕焦逃往捷克斯洛伐克，1951年被缺席判处无期徒刑、1953年二审维持原判。此后在布拉格电台主持意大利语节目至1976年；1978年获总统佩尔蒂尼特赦，1979年短暂返意、现身共产党中央后重回布拉格，直至2008年在当地辞世。"
 ITA_giuseppe_borea_desc:0 "1910年7月4日生于皮亚琴察、1945年2月9日殉难，意大利天主教司铎、抵抗运动烈士。出身虔诚天主教家庭，由担任神父的舅父栽培入神学院，1937年起任皮亚琴察省格罗帕雷洛镇奥博洛堂区主任神父。1943年9月停战后，他与兄弟一道加入抵抗运动，以\"庇护\"为战斗名担任国家解放志愿团瓦尔达尔达师军事随营神父。此后七个月，他辗转于游击队野战医院探视伤员与囚犯，以堂区神职为掩护为游击队传递通讯、藏匿人员与地下刊物，甚至在德军占用神父公寓期间秘密坚持活动；据老兵证词，无论对方政治立场，他一律施以牧灵关怀，包括为交战双方的垂死者主持圣事。1945年1月28日，因叛徒告密，他被萨罗政权国家共和卫队拘捕，押至皮亚琴察狱中——审前有人通风报信，他仍选择留守。法庭以\"参与游击战\"为由，并捏造了一系列不实刑事指控，于2月6日草草定罪。2月9日，他被押往皮亚琴察公墓枪决，行刑前拒绝蒙眼与椅子，留下遗言\"我由衷宽恕所有伤害过我的人，也宽恕你们这些即将开枪的人\"，随后被八枪击中、补枪了结，年仅三十四岁。战后追授银质勇武勋章、身后金质奖章，现正推进列福程序。"
 ITA_giuseppe_bottai_desc:0 "1895年9月3日生于罗马，法西斯运动中罕见的内部批判型知识分子，以文化建设者与政权良心的矛盾身份贯穿了整个法西斯时代。早年投身法西斯运动，参与进军罗马。1923年他创办《法西斯批评》（Critica Fascista）杂志，以\"从内部改革\"的立场对政权施政、文化政策与官僚腐败提出持续批评——这在法西斯媒体生态中属于异类存在，却也是墨索里尼为维系知识合法性所容忍的有限窗口。先后出任法人体制部长（Ministero delle Corporazioni，1929—1932年）与教育部长（1936—1943年），任内以《学校宪章》（Carta della Scuola，1939年）推动意大利中等教育系统性改革，是法西斯体制内少数留下实质性行政遗产的部长之一。1938年种族法颁布时，他以法西斯忠诚者身份投票支持，但私下流露的道德不适已有同时代文献记录，成为其矛盾人格的缩影。1943年7月24至25日深夜的法西斯大委员会表决中，他投票支持格兰迪动议，成为推翻墨索里尼的关键19票之一。停战后，他以其他法西斯大员纷纷投靠萨罗共和国或出逃德国之际，走了一条截然不同的路：以假名在法国外籍军团登记入伍，随盟军序列在北非与意大利境内参战，用实际行动偿还知识分子对法西斯的历史欠账。战后获大赦，回归罗马文化圈，笔耕不辍至生命终点，身后留下了对法西斯时代最具自我省察价值的内部证词。1959年1月9日辞世。"
 ITA_giuseppe_de_stefanis_desc:0 "意大利将领，北非战场的核心指挥人物之一。1940年6月至1941年8月以\"皮内罗洛\"步兵师长身份参加希腊-阿尔巴尼亚战役，继而转赴北非，出任第102摩托化师\"特伦托\"师长，参与托布鲁克围攻与\"十字军\"行动。1942年1月20日接掌第132装甲师\"阿里埃特\"，率部参与加扎拉会战、比尔哈肯围攻及托布鲁克攻克，并于5月26日获颁萨伏依军事勋章军官级。1942年6月26日，第20摩托化军司令巴尔达萨雷将军遭英军战机击伤垂危，在野战医院临终前将指挥权当面移交给他，他随即率第20军参加第一次和第二次阿拉曼战役及此后的全线撤退，11月晋升中将。阿拉曼惨败后，第20军兵力折损殆尽，1943年2月移交奥兰多将军，他调返国内。1943年5月至9月，出任陆军参谋本部作战副参谋总长，5月19日至6月1日间短暂代行参谋总长职务。9月8日停战令广播当晚，他出席罗马王宫御前会议，参与确认停战决定；随后随巴多格里奥与王室撤往布林迪西。停战后被任命为第51军长，后出任盟军麾下意大利战斗群组建负责人，主持协调战后意大利军队重建。"
 ITA_giuseppe_di_bartolo_desc:0 "1900年9月5日生于巴勒莫，十七岁即考取船长资格。一战中在意大利商船任职，1918年7月所乘\"阿德里亚\"号汽船被德国潜艇击沉，他因临危表现获海军部嘉奖；战后长年为多家航运公司任民用船长。1940年4月以海军后备军官（中尉）身份入役，先后指挥第7、第25扫雷艇编队，后者驻利比亚的黎波里。1943年1月19日的黎波里陷落前夕，他奉命率十一艘扫雷艇及辅助船撤往西西里，途中在祖瓦拉以东遭英国驱逐舰\"开尔文\"号与\"标枪\"号拦截；他驾吨位仅及对方约十分之一的旗舰RD36迎敌开火，为他船争取撤退时间，终被击沉，与全舰官兵一同殉难，获追授金质勇武勋章。"
 ITA_giuseppe_fioravanzo_desc:0 "1891年8月14日生于威尼托蒙塞利切、1975年卒，意大利皇家海军将领，与伯诺提同列两次大战间意大利海军学说的主要建构者，是海军中著名的\"理论家\"。早年参加意土战争与一战，1938至1939年任舰队参谋长。二战中晋少将，在最高海军司令部（Supermarina）作战室任值班将官，经历开战头二十个月的海军行动，包括引致马塔潘角海战的\"高多行动\"；其主管的\"特殊研究处\"早在战前便草拟了入侵马耳他的最初方案（C3行动）。1943年3月接掌第8巡洋舰分队，8月奉命炮击已被盟军占领的巴勒莫，却因未达成任务提前撤回而被调离、留置岸上，晋升之路就此中断。战后长年主持海军历史处，著述逾四百种，为意大利海战史权威。"
 ITA_giuseppe_pieche_desc:0 "1886年3月7日生于佛罗伦萨，宪兵军官出身，先后任职于法西斯两大核心情报系统：1932至1935年间主持军事情报局（SIM）第三反间谍科，期间与OVRA（法西斯秘密政治警察）紧密协作。由此赢得\"侦探中的侦探\"之称——他奉墨索里尼之命，同时监控各情报部门内部动态，成为法西斯安全网络自我监视机制的执行者。1936年，应罗阿塔将军之邀，他以宪兵监察长身份赴西班牙，统辖驻民族派意大利志愿军团（CTV）的整个宪兵分遣队，负责协调输送佛朗哥阵营的一切军事援助。二战期间，他以意大利军事使团名义被派往南斯拉夫，协助克罗地亚乌斯塔莎政权领袖安特·帕韦利奇建立秘密警察体系。1943年7月墨索里尼倒台后，他以罕见速度完成政治转身：出任福贾省长，随即于同年11月19日被巴多格里奥政府任命为解放区宪兵总司令，任职至1944年7月。净化委员会提请审查，最终不予起诉。战后，他挂名民政防护与消防总局长，实际负责重建反共情报网络，将前法西斯特工重新植入警察体系，排挤抵抗运动出身的官员，并协助组建武装反共民间组织。1970年被列入博尔盖塞政变阴谋调查中，是意大利战后\"策略紧张年代\"地下网络的源流人物之一。1977年8月25日卒于韦莱特里，享年九十一岁。"
 ITA_giuseppe_tellera_desc:0 "1882年3月14日生于博洛尼亚，1902年毕业于摩德纳军事学院，一战老兵、资深参谋军官。1938年起在意属北非任职，曾在巴尔博、格拉齐亚尼麾下任意属北非最高司令部参谋长。1940年12月英军发动\"罗盘行动\"，意大利第10集团军在西迪巴拉尼、巴尔迪亚、托布鲁克接连溃败、濒临瓦解之际，他于12月23日临危接掌该集团军。面对机动与协调全面占优的英军装甲部队，他下令沿巴尔比亚公路向班加西总退却，然英军\"科姆部队\"已抄近路穿越沙漠、抢先封锁贝达丰姆退路。1941年2月6至7日的贝达丰姆之战遂成第10集团军最后一搏：意军装甲反复发起却毫无章法的正面冲击，尽遭击退。年近花甲的他亲乘M13/40坦克随第六坦克营投入最后突围，座车被击毁、本人重伤，被英军在瘫痪坦克中寻获，于2月7日伤重不治。是役第10集团军全军覆没、约两万五千人被俘；英军感佩其死战之勇，以军礼将其葬于班加西，意大利追授最高荣誉金质勇武勋章。"
 ITA_guido_de_ruggiero_desc:0 "1888年生于那不勒斯，意大利哲学家与思想史家，自由主义传统的重要诠释者。代表作《欧洲自由主义史》（Storia del liberalismo europeo，1925年）以比较视野梳理英、法、德、意各国自由主义传统的分异与演进，至今仍是该领域的经典参照文献。法西斯统治期间他保持了对自由主义原则的坚守，在政治高压下以历史与哲学写作延续批判性立场，所受具体迫害的形式与程度在可核实范围内无法独立确认。战后积极参与共和国思想与政治重建，重返学术岗位，并参与教育改革讨论。1948年12月29日卒于罗马。"
 ITA_guido_jung_desc:0 "1876年生于西西里帕莱莫，西西里犹太裔实业家与政治人物。早年深度涉足金融与商业，法西斯运动兴起时以早期支持者身份进入权力核心，约1932至1935年出任墨索里尼政府财政部长，主持这一时期的国家货币与预算政策。他的任职本身即是早期法西斯政权\"实用主义先于意识形态\"阶段的缩影——彼时反犹政策尚未成为国家路线，犹太裔专业精英仍可在体制内任职；1938年种族法颁布后，其身份境遇急转直下，与多位同类出身的早期法西斯合作者共同陷入制度性排斥的处境。1949年辞世。"
 ITA_haile_selassie_gugsa_doppleganger_desc:0 "1907年生，埃塞俄比亚帝国提格雷贵族、底雅兹马赤称号军事指挥官，约翰尼斯四世皇帝之曾孙、东提格雷省督古格萨·阿拉亚·塞拉西之子。1932年继父出任东提格雷省督；同年6月与海尔·塞拉西皇帝次女泽内贝沃尔克联姻，时公主年仅十三岁。1934年公主死亡、皇帝猜忌古格萨对其女不善，二人关系随即破裂。1935年5月意大利入侵前，古格萨已与意方秘密接触、在领土利益与个人野心的驱动下倾向叛变；意军于10月3日越境后，他奉命后撤却未服从，10月10日携约一千二百名部属向意军投降，德博诺将军立即向国际媒体公布其与意军军事会议合影，埃塞俄比亚爱国者随即焚毁其梅克莱故居。他的提前倒戈使意军得以几乎兵不血刃占领梅克莱，并为意大利宣传机器提供了埃塞俄比亚内部瓦解的重要素材。意大利人授予他皇帝从未肯给的\"拉斯\"头衔和养老金；战后被英军辗转押送至塞舌尔，1946年被引渡回国，1947年受审、以法西斯合作者与叛国罪被判死刑，伏请皇帝开恩后改为终身软禁。软禁地先后为戈雷与安博，共计二十八年；1974年德格推翻皇权后获释，但德格政权同样将其定性为叛徒，直至1985年辞世。"
 ITA_hailu_tekle_haymanot_doppleganger_desc:0 "约1868年生，埃塞俄比亚贵族、戈贾姆省军事领袖，阿杜瓦之战英雄特克勒·海马诺特·特塞马国王之子，戈贾姆的独立倾向历来与中央王权存在摩擦。他曾支持被废黜的伊雅苏王子复辟，获罪被海尔·塞拉西皇帝以叛国罪判处死刑，后减刑为终身监禁并没收巨额财产；1935年意大利入侵前夕，皇帝为避免后院起火将其提前释放。出狱后，他与同獄的巴尔恰·萨福一同获释——巴尔恰·萨福随即上山抗击意军，他却乘火车径返亚的斯亚贝巴、主动向意大利占领军纳降，成为占领期间地位最高、受到最优厚礼遇的埃塞俄比亚本地贵族合作者：意大利政府保留其拉斯及勒乌尔头衔、授予意大利之星勋章和圣毛里齐奥与圣拉扎罗勋章，归还1935年没收的土地，且格拉齐亚尼亲自豁免其家族免于1937年叶卡提特12大屠杀的牵连。意大利人以\"尼格斯\"头衔引诱他却始终未兑现；1939年宰教节，他与古格萨·海尔·塞拉西、塞尤姆·曼加沙同席出席奥斯塔公爵（意属东非总督）主持的典礼。1941年意大利败退后，他适时转向、在德布雷马科斯迎接流亡归来的皇帝；此后获赦，但政治生涯至此结束，1950年辞世。"
 ITA_hamid_idris_awate_desc:0 "约1910年生于厄立特里亚，早年在意属东非担任殖民地辅助武装（Ascari）。意大利战败、英国托管结束后，1952年厄立特里亚被并入埃塞俄比亚，自治地位遭剥夺，他由此走向武装抵抗。1961年9月1日在西部发动首次武装袭击，点燃三十年独立战争的战火，被奉为厄立特里亚独立运动奠基者，形象至今印于该国货币之上。1962年在作战中身亡。"
 ITA_ibrahim_farag_mohammed_desc:0 "约1908年生于厄立特里亚马萨瓦附近，意大利皇家海军厄立特里亚土著舰兵（Ascaro di Marina），意大利殖民军事史上极罕见的土著兵金质勇武勋章得主之一。1925年自愿入伍，初驻皇家军舰\"坎帕尼亚\"号，参加索马里北部平定作战。同年10月，在巴尔加勒附近遭遇伏击，三名意大利水兵与两名ascari同伴阵亡，他奋力抵抗，凭此战绩于1928年获十字战功勋章，晋升Muntaz（下士），其后续升至Bulucbasci（班长）。1941年3月，意大利东非战局急剧崩溃，他与其他四名ascari以舰载火夫身份登上驱逐舰\"马尼诺\"号，参与对英国苏丹港的最后一次绝命出击。舰船遭英军飞机猛烈轰炸击沉，仅能放下一艘救生艇。他将自己的座位让给一名负伤水兵，留在救生艇外紧抓艇沿，在红海浪涛中坚持一昼夜，终因体力耗尽，在向身负重伤的舰长行最后敬礼后没入水中，1941年4月4日殉职，再未浮现。他是意大利整个殖民史上仅有的两名获颁金质勇武勋章的土著士兵之一。"
 ITA_ignazio_silone_desc:0 "1900年生于阿布鲁佐佩斯奇纳，原名塞孔迪诺·特兰奎利，意大利共产党创始成员之一，兼为二十世纪意大利最重要的反法西斯文学家。参与了1921年里窝那代表大会的历史性分裂，1930年流亡瑞士后彻底与共产主义决裂；流亡期间写就《枫塔马拉》（Fontamara，1933年）与《酒与面包》（Vino e pane，1936年），以法西斯统治下意大利底层社会为题材，在西方引发广泛共鸣，两书在意大利本土遭列禁。战后转向反斯大林的社会民主立场。1978年卒于日内瓦。"
 ITA_inigo_campioni_desc:0 "1878年生，意大利皇家海军上将，1940至1941年担任海军总司令，直接指挥了卡拉布里亚角海战（1940年7月9日）——意大利二战首次大规模海上对决。1943年9月停战时他出任爱琴海及罗德岛总督，面对德军强制缴械要求拒绝配合、试图组织抵抗，但力量悬殊终遭俘获。德国将其移交萨罗共和国军事法庭，以叛国罪起诉，1944年5月24日被枪决。"
 ITA_italo_balbo_desc:0 "1896年生于费拉拉省，法西斯党创始要人之一。一战在山地部队服役后转入法西斯运动，成为费拉拉一带凶悍的黑衫党头领，并跻身1922年\"进军罗马\"的四巨头之列。任空军部长期间（1926—1933），他大力扩建意大利皇家空军，并亲自领衔多次震动世界的远程编队飞行——尤以1933年罗马至芝加哥的跨大西洋远征最为著名，\"balbo\"一词由此在英语航空界成为大机群编队的俗称。1934年起任利比亚总督，推动殖民地基础建设与移民工程。与法西斯高层不同，巴尔博公开反感意大利向纳粹德国靠拢，并明确反对1938年种族法，一度被视为有实力挑战墨索里尼地位的潜在人物。1940年6月28日，他的座机在托布鲁克上空被意军高射炮误认为英机击落，当场身亡，终年四十四岁。"
 ITA_italo_gariboldi_desc:0 "1879年生，意大利将领。1941年初北非战局崩溃后短暂出任利比亚战区最高司令，随即被巴斯蒂科接替。1942至1943年出任东线意大利第8集团军（ARMIR）司令，1942年12月苏军发动\"小土星行动\"，意大利第8集团军在顿河防线惨遭击溃，损失逾十万兵力，是意大利二战最惨重的败绩之一。战后未受实质追究。1970年2月3日辞世。"
 ITA_ivanoe_bonomi_desc:0 "1873年生于曼托瓦，博洛尼亚大学自然科学与法学出身，毕业后进入新闻业，加入社会党。曾任党报《前进报》主编，后墨索里尼继任此职。主张改良路线。因支持利比亚战争，于1912年雷焦艾米利亚代表大会上开除党籍，当时鼓动清洗改良派者，恰是青年墨索里尼。此后他另组意大利改良社会党，一战志愿从军，历任公共工程部长、陆军部长，1921至1922年首度出任首相，因无力遏止法西斯与社会党的街头暴力而垮台。法西斯当政期间他退隐著史，靠代写律师状糊口。1942年底重返地下政坛，在梵蒂冈庇护下的罗马神学院与各党密商；1943年9月停战翌日，六个反法西斯政党组建民族解放委员会，公推他为主席。1944年6月罗马光复后他接替巴多格里奥再任首相，内阁延揽斯福尔扎、克罗齐、陶里亚蒂等\"绝无法西斯瓜葛之人\"，承认北方游击队并批准战后制宪与共和公投。1945年让位于帕里，后当选共和国首任参议院议长，1951年卒于罗马。"
 ITA_junio_valerio_borghese_desc:0 "1906年生于罗马，出身古老贵族家族，\"黑王子\"（Il Principe Nero）之称贯穿其后半生，是意大利皇家海军历史上最具传奇色彩、也最富争议性的特种作战指挥官，战后更蜕变为意大利新法西斯运动的标志性人物。二战中，他以\"第十突击旅\"（Decima Flottiglia MAS）指挥官身份统领海军精英蛙人特战单位，专门执行由潜艇秘密运载的水下突袭。他亲自驾驭潜艇\"锡尔切号\"，将突击分队运抵敌港外海。1941年12月18至19日夜，六名蛙人乘坐人操鱼雷（maiale，\"慢速鱼雷\"）潜入埃及亚历山大港，将磁性炸弹附于英国战列舰\"伊丽莎白女王号\"与\"英勇号\"船底，两舰殉爆搁底、数月内无法作战。这是二战最成功的水下特种行动之一，使英国一度丧失东地中海主力战列舰；博尔盖塞因此获授金质勇武勋章。1943年9月停战后，他选择效忠萨罗共和国，率第十突击旅转型为陆上部队，积极参与北意大利的反游击清剿行动，被指控与多起针对抵抗运动成员及平民的暴行有关。战后军事法庭定罪，因大赦实际服刑极短。出狱后成为意大利新法西斯运动的组织核心。1970年12月7至8日夜，他策动\"博尔盖塞政变\"：武装人员渗入内政部、兵工库等要害设施，行动却在执行途中突然中止。他随即出逃西班牙，1974年8月26日于卡迪斯死亡。"
 ITA_luigi_einaudi_desc:0 "1874年3月24日生于皮埃蒙特卡鲁（库内奥省），意大利最重要的自由主义经济学家，意大利共和国第二任总统，自由经济思想与共和国建制的双重奠基人之一。都灵大学教授，长年深耕财政学与经济史，同时以通俗笔力在《纠正邮报》（Corriere della Sera）等主流报章持续撰文，向公众传递古典自由主义经济观念。法西斯年代，他以学术阵地维持着批判性思考的空间，对党国干预主义与贸易保护主义的保留从未完全消失，但也未遭最严酷的政治清洗，以谨慎与学术身份护全自身。1945年解放后出任意大利银行行长，接手了一个因战时通货膨胀严重受损的货币体系。1947年他推行\"信贷紧缩\"（la stretta creditizia）政策，以收缩货币供给与收紧银行信贷控制恶性通胀，短期代价是经济收缩与失业率上升，但成效显著地稳定了里拉汇率与物价水平，为战后重建奠定了货币基础。这一政策遭到劳工界与意大利共产党的强烈批评。1948年5月11日，由新成立的共和国议会选举为第二任总统（第一任为恩里科·德·尼科拉），任期至1955年。1961年10月30日卒于罗马，享年八十七岁。"
 ITA_luigi_longo_desc:0 "1900年3月15日生于皮埃蒙特富比内，意大利共产党创始成员之一，化名\"加洛\"（Gallo）。他与葛兰西、托格利亚蒂共同参与早期建党，法西斯上台后转入地下并流亡国外。西班牙内战（1936—1939年）是他在国际共产主义舞台上最重要的历练：他出任国际纵队总政治委员（Commissario Generale delle Brigate Internazionali），统辖来自五十余国、总计约三万名反法西斯志愿者的政治组织工作，是纵队核心指挥层的实权人物，与苏联军事顾问及共产国际代表紧密协调，在西班牙共和国最终失败后辗转撤离。1943年9月停战后他回国，迅速将地下党组织转为武装领导。他直接领导意共系统下规模最大的加里波第游击旅（Brigate Garibaldi），高峰期下辖游击队员逾十万人，是整个北意大利抵抗运动中武装力量最强的单一系统。他同时担任北意大利民族解放委员会（CLNAI）核心成员，参与统筹协调了1945年4月25日的北意总起义，并亲历米兰解放。战后，他以意共副书记身份长期作为托格利亚蒂的\"二号人物\"，在幕后维持着党的组织骨架。1964年托格利亚蒂于雅尔塔病逝后，他出任党书记，领导意共平稳度过后托格利亚蒂时代，直至1972年将职务移交贝林格，退居二线。1980年10月16日卒于罗马，享年八十岁。"
 ITA_luigi_mascherpa_desc:0 "1893年4月15日生于热那亚、1944年5月24日被处决，意大利海军少将。一战中任水上飞机飞行员。1942年4月出任多德卡尼斯群岛主基地莱罗斯岛司令。1943年9月停战、罗德岛陷落后，他接掌当地全部意大利海军，拒绝德方\"体面投降\"条件，会同登岛英军坚守莱罗斯近两月（为不低于英方将领军衔而获晋少将），即便德方称单独投降可保全部下，仍予拒绝。岛破被俘后，他被移交萨罗政权，与坎皮奥尼同在帕尔马\"将领审判\"中受审——墨索里尼亲自施压判死——于1944年5月24日被枪决，身后追授金质勇武勋章，临刑留下遗言\"我最后的思念献给我们的意大利\"。"
 ITA_mario_berti_desc:0 "1881年2月3日生于利古里亚拉斯佩齐亚，意大利将领，年轻时即晋升上校（王室之外极为罕见）。一战在阿夏戈等地作战，因功获丘吉尔亲授英国杰出服务勋章——日后却以敌将身份与英军交手。西班牙内战中，1937至1938年阿拉贡攻势期间任驻佛朗哥意大利志愿军团（CTV）司令。意大利参战前任陆军参谋长，曾力陈在西班牙耗尽资源、无力再战英法，因而失宠，被格拉齐亚尼取代。1940年夏接掌驻利比亚第10集团军，9月入侵埃及，却在西迪巴拉尼修筑彼此无法呼应的据点群，埋下大败祸根。12月英军\"罗盘行动\"突袭时他正抱病休养，第10集团军覆没，他与格拉齐亚尼关系势同水火，23日被泰莱拉接替。停战后退役，约1964年辞世。"
 ITA_mario_ricci_desc:0 "1908年5月20日生于摩德纳省萨索圭达诺，以化名\"阿尔曼多\"（Armando）为后人所知。出身社会主义家庭，幼年辍学务农。1931年，家中多位亲属已先行移居法国南部，他随后离开意大利，在土伦附近以餐馆杂工为生，同期加入法国共产党。1936年11月至1938年底，他以志愿者身份参加西班牙内战，加入国际纵队加里波第营，两度负伤，因战场表现出众升任突击排政治委员，由此积累了日后领导游击作战的军事基础。战后辗转被法国当局拘押，法国战败后遣返意大利，1941年11月以反法西斯活动罪被判五年流放，押至文托泰内孤岛，与帕尔蒂尼、斯皮内利等反法西斯人士同处一地。1943年9月8日停战令颁布当夜，他在马拉内洛驻军营地险遭德军与当地法西斯分子合谋捕杀，仓皇逃脱，随即在帕武洛一带开始秘密组建武装。他召集亚平宁山地青年，逐步建立\"摩德纳—阿尔曼多师\"，直接参与创建了意大利抵抗运动史上最具象征意义的政治实验——蒙泰菲奥里诺游击共和国，以自治解放区的雏形对抗纳粹法西斯合围。他的师是二战中极少数由盟国正式认可为共同作战力量的意大利抵抗单位之一，与第28加里波第旅及马埃拉旅并列。1953年，他以战时功绩获颁最高军事荣誉——金质勇武勋章。战后出任帕武洛镇长（任至1960年），当选意大利共产党众议员两届，在国防委员会持续捍卫抵抗运动遗产及反法西斯老兵权益。1989年8月18日在家乡辞世。"
 ITA_mario_roatta_desc:0 "1887年1月2日生于摩德纳，意大利将领，以情报机关首脑与占领区暴行双重著称。1930年代主导军事情报局（SIM），将其改造为针对国内外政敌的政治清洗工具。1937年，旅法反法西斯知识分子卡洛与内洛·罗塞利兄弟在诺曼底遭雇佣杀手刺杀，历史研究普遍将此案归因于SIM策动，罗阿塔否认却始终无法自证。西班牙内战期间任意大利驻佛朗哥军事代表，协调\"志愿军\"与军事援助。二战中先后短暂担任陆军总参谋长，继而出任第2集团军司令，负责占领南斯拉夫西部地区。任内签发多项酷烈命令，包括明确授权枪决人质、拆毁村庄与大规模关押平民的\"循环3C号令\"，被克罗地亚与斯洛文尼亚史学界列为战争罪责任人之一。1943年停战后被捕，1945年以病重为由转往医院后随即失踪，逃亡西班牙；意大利法庭以缺席方式判决，1966年方回国，届时大多数诉讼已因年限失效。1968年1月7日卒于罗马。"
 ITA_mario_robotti_desc:0 "1887年生，意大利将领，以南斯拉夫占领区系统性暴行著称。1942至1943年出任驻斯洛文尼亚卢布尔雅那省第11军军长，主导极为严酷的反游击政策：大规模焚毁村庄、枪决人质、将平民强制驱逐至意大利本土集中营。其多份存档命令措辞残酷，被南斯拉夫与斯洛文尼亚史学界列为意大利占领区战争罪的主要责任人之一。战后从未受到实质性法律追究。1975年辞世。"
 ITA_mario_scelba_desc:0 "1901年9月5日生于西西里卡尔塔吉罗内——斯图尔佐神父创建意大利人民党的城市，这一地缘背景深刻塑造了他的基督教民主党认同。1947至1953年出任德加斯佩里政府内政部长，任内以强硬手段对抗共产党和社会党领导的罢工与示威，其武装警察机动队\"捷列雷\"（Celere）多次在工人集会中动用武力，造成人员死亡，在左翼阵营中赢得了接近法西斯的恶名。1954至1955年短暂出任总理。他所代表的冷战初期意大利基督教民主党右翼立场——以强力手段阻止共产党权力扩张——是战后政治秩序的重要支柱，也是该时代最受争议的政策遗产之一。1991年辞世。"
 ITA_mario_vercellino_desc:0 "1879年2月10日生于皮埃蒙特阿斯蒂、1961年卒于圣雷莫，意大利大将，炮兵出身，1929至1931年执掌军事情报局（SIM）。1940年参战时任\"波河集团军\"（第6集团军）司令，对法攻势中该军留作预备队，他一度草拟入侵瑞士提契诺的\"T1计划\"，未获实施。其后转任驻阿尔巴尼亚第9集团军，1942年起出任占领法国东南部的第4集团军司令。任内他拒绝配合纳粹搜捕犹太人，使意占区成为数万犹太人逃离德占区的避难所，里宾特洛甫为此向墨索里尼抱怨\"意大利军方不懂犹太问题\"。1943年9月停战后，第4集团军在德军\"轴心行动\"中迅速瓦解，他于9月12日解散全军，旋即被俘押往德国，因拒绝投效萨罗共和国而遭关押至1945年获释退役。"
 ITA_marziale_cerutti_desc:0 "1895年3月10日生于布雷西亚、1946年卒，意大利皇家空军准将。原为炮兵，一战中转飞行，成为意大利头号王牌之一，驾纽波尔战机取得十七次确认击落。战间晋上校，先后统率第15、第11联队。二战初在北非最高司令部任职，1940年6月28日目睹巴尔博元帅在托卜鲁克被己方高射炮误击身亡；1941年8月任空运司令部（特种航空勤务队）参谋长。1943年停战后他选择追随墨索里尼、加入萨罗政权的\"国家共和空军\"，战后因此被停职；在等待军籍裁定期间，于1946年5月骑自制摩托车遭遇车祸丧生。他是极少数两次大战分属敌对阵营作战的飞行员之一。"
 ITA_norma_barbolini_desc:0 "1922年3月3日生于摩德纳省萨索洛、1993年卒于摩德纳，意大利共产党人、女游击队员。少女时因家贫入陶瓷厂做工，1941年因抗议食物配给参加罢工而被解雇。1943年11月，兄长朱塞佩·巴尔博利尼上山参加抵抗运动，她随之投身游击战，先任交通员、后成为持枪战斗员。1944年兄长在切雷索洛尼奥（雷焦艾米利亚）一役负伤，她接过其\"奇罗·梅诺蒂\"游击师（即巴尔博利尼旅）的指挥权，是抵抗运动中罕见的女性旅级指挥官。战后获银质勇武勋章、被授予陆军上尉衔；重返工厂之余，历任萨索洛镇议员、摩德纳ANPI省委委员，长期投身意大利妇女联盟，著有抵抗运动回忆录《山区妇女》。"
 ITA_palmiro_togliatti_desc:0 "1893年生于热那亚，意大利共产党的核心缔造者与长期领袖。他与葛兰西共同参与建立早期意共，法西斯上台后流亡国外，在共产国际中历任要职，深度介入国际共产主义运动。西班牙内战期间，他以化名\"埃尔科利\"常驻西班牙，作为共产国际代表深度参与人民阵线内部事务。1944年3月底，他自苏联返回意大利南部，在萨莱诺宣布意共暂搁制度争议、承认王室现状、优先联合一切反法西斯力量抗德的\"萨莱诺转向\"震惊左翼盟友，却使意共顺利进入民族统一政府。战后他长期领导意共，通过议会参与、工会渗透与文化影响，将意共发展为西欧规模最大的共产党；在维系与苏联纽带的同时，亦摸索有别于苏联模式的\"意大利道路\"，为后来欧洲共产主义思潮留下重要遗产。1964年8月21日在雅尔塔病逝。"
 ITA_paolo_thaon_di_revel_desc:0 "1859年6月10日生于都灵，意大利皇家海军上将，一战时期意大利海军最重要的战略指挥官，以\"海洋公爵\"（Duca del Mare）封号载入海战史。他在一战中的核心贡献在于确立了意大利的亚得里亚海制海战略：利用海岸地形与岛屿链将奥匈帝国主力舰队封堵于波拉、卡塔罗等港口之内，以MAS快艇、鱼雷艇和潜艇执行进攻任务，从而避免意大利主力战列舰在不利条件下的正面消耗。这一策略在当时颇具争议，但实践中有效维持了制海优势，且较常规舰队决战付出的代价低得多。一战结束后，他获颁\"海洋公爵\"封号及多项最高荣衔，成为意大利海军的历史象征。法西斯政权建立后，他选择与新政权合作；约1935年至1943年出任墨索里尼政府财政部长，在这一职位上见证并参与了意大利扩军备战的财政运作，直至法西斯政权崩溃方去职。1948年辞世。"
 ITA_papa_pio_xi_desc:0 "1857年5月31日生于伦巴第德西奥，俗名阿基莱·拉蒂，图书馆员与登山家出身，1922年2月就任教宗，任期与意大利法西斯主义的全程高度重叠。与墨索里尼政权的关系经历了从务实合作到逐步对峙的清晰弧线。1929年2月11日签署《拉特兰条约》（Patti Lateranensi），一揽子解决自1870年以来悬而未决的\"罗马问题\"：梵蒂冈城国正式确立，天主教恢复意大利国教地位，国家向教会支付历史补偿。对双方而言这是一场务实的相互背书——墨索里尼获得教廷合法性认可，庇护十一世获得制度保障。对峙的第一个公开节点是1931年。当法西斯青年组织强行侵蚀天主教青年行动网络，他颁布通谕《我们不需要》（Non abbiamo bisogno），直接批评法西斯国家对公民意识形态的垄断企图。1937年3月颁布《极度焦虑》（Mit brennender Sorge），以德文写就，秘密运入德国各地教区，在棕枝主日由神职人员从讲坛公开宣读，正面批判纳粹种族意识形态与其对基督教神学的曲解，是梵蒂冈对纳粹德国最直接的制度性批判文件。晚年立场进一步激化。1938年意大利颁布反犹种族法时他明确表示不能接受，据报着手准备一份全面谴责种族主义与反犹主义的通谕（《人类的统一》，Humani Generis Unitas），由耶稣会士协助起草，然文稿尚未颁布，他已于1939年2月10日辞世。"
 ITA_pietro_badoglio_desc:0 "1871年生于皮埃蒙特格拉扎诺，意大利元帅，两次世界大战中最具争议的军事领袖之一。一战中历经卡波雷托溃败（1917年）仍得以晋升，战后出任陆军参谋长，并任利比亚总督（1928—1933年）。1935年底接替进展迟缓的德·博诺，接掌埃塞俄比亚战场指挥，大规模使用芥子气等化学武器，于1936年5月完成征服，获授元帅头衔。二战初期任最高统帅部参谋长，因希腊战役惨败于1940年12月辞职。1943年7月25日，墨索里尼被捕后，国王即任命他出任总理；9月8日宣布与盟国停战，次日却与国王仓皇弃守罗马南逃布林迪西，将军队与首都一并抛下。同年10月13日对德宣战。1944年6月罗马解放后辞任，由博诺米接手。1956年在家乡辞世，获国家荣典。"
 ITA_pietro_d_acquarone_desc:0 "1890年4月9日生于热那亚、1948年卒于圣雷莫，意大利贵族、陆军准将与政治人物，1934年获任王国参议员，1942年晋公爵。1939年起出任宫廷大臣（王室事务大臣），成为维托里奥·埃马努埃莱三世最受信任的幕后顾问。1943年7月推翻墨索里尼的宫廷政变中他居于核心：通过与持异见的法西斯分子、失望的军方将领、工业家及反法西斯人士联络，使国王充分掌握政情；大议会通过格兰迪动议后，他于凌晨从格兰迪手中接过动议文本并即报国王，并任命了随后逮捕法西斯党魁们的新警察总监。他与巴多格里奥私交甚笃（曾任其副官），二人同为共济会员。1943年9月他随国王自罗马出逃布林迪西，此后追随国王直至其退位。"
 ITA_pietro_pintor_desc:0 "1880年5月20日生于卡利亚里，一战期间以炮兵军官身份在维托里奥·韦内托会战立功，获银质勇武勋章；战间期历任战争学院院长、利比亚军团长官。1940年6月意大利参战后，接掌沿阿尔卑斯南段至利古里亚海岸线部署的第1集团军。在1940年6月意大利对法国的短暂进攻中，最初十天部队保持静默，他将此段时期称为\"没有敌对行动的战争\"。6月20日，他明确告知参谋次长罗阿塔，部队\"绝对没有准备好\"发动墨索里尼要求的全面进攻，此言迫使墨索里尼缩减攻势规模。停战后，他出任意法停战委员会（CIAF）主席，主持监督停战协议执行。同年11月巴多格里奥被解除参谋总长职务后，平托尔一度被考虑为继任人选，但墨索里尼以其\"过于迟缓教条\"为由否决；法里纳奇则更直接宣称\"平托尔就是巴多格里奥，只是更糟\"。1940年12月7日，他搭乘飞机从罗马飞往停战委员会驻地都灵，在卡托西奥附近坠机，与同行空军将领阿尔多·佩莱格里尼一同罹难，享年六十岁。他是反法西斯知识分子贾伊梅·平托尔与路易吉·平托尔之叔父，二人日后均以抵抗运动与左翼新闻人身份留名史册。"
 ITA_pompeo_colajanni_desc:0 "1906年生于西西里卡尔塔尼塞塔，意大利共产党党员，二战期间最具代表性的游击队指挥官之一，以化名\"巴尔巴托\"（Barbato）活跃于皮埃蒙特北部朗盖与蒙费拉托一带。1943年停战后立即组织武装抵抗，领导共产党系游击旅，成为该地区抵抗网络的核心节点，其部队参与了1945年4月北意大利起义。战后以抵抗运动元老身份出任意共众议员，长期在国防委员会中捍卫游击运动历史记忆。具体辞世年份存疑。"
 ITA_prince_adalberto_desc:0 "1898年3月19日生于都灵、1982年12月卒于都灵，萨伏依-热那亚旁支成员，热那亚公爵托马索（海军上将）与巴伐利亚的伊莎贝拉之第四子，1904年六岁时获维托里奥·埃马努埃莱三世授予\"贝尔加莫公爵\"封号，与同为将领的皮斯托亚公爵菲利贝托亲王是兄弟。身为王室成员，他自1919年起为参议院当然议员，并在皇家陆军中循王室惯例晋升至大将。一战中曾在蒙泰洛、瓦拉加里纳前线作战；1936年率第24\"大萨索\"步兵师参加侵略埃塞俄比亚战争，后又统领第58\"莱尼亚诺\"步兵师。意大利参战后，他先后出任第8集团军司令（1940—1942年）与第7集团军司令（1943年），然多属本土防御性指挥，二战中并无显赫战绩。据记载，墨索里尼曾以其隐秘的同性恋身份相要挟，以确保他及萨伏依王室其他同类成员效忠法西斯党。他终身未婚、无嗣，战后归于沉寂，1982年在故乡都灵辞世，归葬萨伏依王室陵寝苏佩尔加圣殿。"
 ITA_prince_aimone_desc:0 "1900年3月9日生于都灵，第四代阿奥斯塔公爵，萨伏依-阿奥斯塔旁支，职业海军军官，以意大利法西斯时期最荒诞的王室政治任命之一而载入史册。军旅生涯中，他以鱼雷艇指挥官身份在意大利皇家海军积累实战经验，与其兄长、第三代阿奥斯塔公爵阿梅代奥（率意大利东非军队抵抗英军至1941年5月、随后死于英国羁押）在军事轨迹上形成鲜明对照。1941年5月，轴心国在占领南斯拉夫后扶植建立克罗地亚独立国（NDH），为赋予这一傀儡政权以王室合法性外衣，艾莫内被指定为克罗地亚国王\"托米斯拉夫二世\"（Tomislav II）。然而这一称号从头至尾几乎是纯粹的符号：他从未踏足克罗地亚领土，从未参与任何实质统治，全权实际上由乌斯塔莎领袖帕韦利奇把持。1943年9月8日停战后，他立即放弃了这一有名无实的称号。此后离开意大利，1948年1月29日于阿根廷布宜诺斯艾利斯辞世，年仅四十七岁。"
 ITA_prince_filiberto_desc:0 "1895年3月10日生于都灵、1990年卒，萨伏依-热那亚王室成员，皮斯托亚公爵（1963年起为第四代热那亚公爵），是热那亚公爵托马索的次子，与贝尔加莫公爵阿达尔贝托是亲兄弟。他在意大利皇家陆军服役至大将。作为墨索里尼的拥护者，他自愿参加侵略埃塞俄比亚的战争，统率\"3月23日\"黑衫军师——正是该师在阿姆巴阿拉达姆山头升起意大利国旗；意大利在那场战争中大量违法施放芥子气、手段残暴。二战中他曾任第7集团军司令，意大利转向盟军一方后未再担任要职；1928年与阿伦贝格的莉迪娅郡主成婚，无子嗣。"
 ITA_prince_umberto_desc:0 "1904年9月15日生于皮埃蒙特拉科尼吉，维托里奥·埃马努埃莱三世之子，意大利皇太子，萨伏依王朝在意大利的最后一任国王。二战开战时已晋升集团军群司令级别。1940年6月意大利对法宣战，他出任西部集团军群总司令，统辖意军对法国南部的短暂进攻。然法国彼时已在德军铁蹄下全面崩溃，意大利的军事参与不过是为争取停战谈判筹码；意军在阿尔卑斯防线前攻势极为有限，未取得实质性战果，此举至今仍被视为政治机会主义多于真正的军事贡献。1944年6月5日罗马解放后，维托里奥·埃马努埃莱三世迫于盟国施压及自身与法西斯政权的历史关联，将王权实质转移，任命翁贝托为\"王国副王\"（Luogotenente Generale del Regno），使其充当无冕摄政，而未正式令其即位——此一拖延策略未能挽回萨伏依王室的颓势。1946年5月9日，维托里奥·埃马努埃莱三世退位，翁贝托正式即位，史称\"五月国王\"（Re di Maggio）。6月2日共和制公投以约54%多数通过，翁贝托于6月13日离开意大利，流亡葡萄牙，在位仅三十余日，是意大利历史上在位最短的国王。于1983年3月18日在日内瓦辞世。"
 ITA_raffaele_de_courten_desc:0 "1888年生，意大利皇家海军上将，1943年7月出任海军总参谋长，执掌海军最高指挥于意大利历史最动荡的数月之间。1943年9月8日停战令公布当晚，他向残余舰队下达了驶往北非盟军港口的指令，执行停战条款。这一命令的执行过程中发生了\"罗马号\"战列舰被德军制导炸弹击沉、贝尔加米尼上将殉职的悲剧；其余主力舰只最终抵达北非，意大利皇家海军核心兵力得以完整移交盟军，避免了落入德军之手。战后出任巴多格里奥及继任政府海军部长，参与意大利海军战后重建的最初阶段。约1978年辞世。"
 ITA_randolfo_pacciardi_desc:0 "1899年生于托斯卡纳，意大利共和主义政治家与军人，一战老兵，法西斯上台后流亡国外。西班牙内战期间出任国际纵队加里波第旅旅长，参与马德里保卫战与瓜达拉哈拉战役；后者中国际纵队击败墨索里尼所派正规军，具有重要宣传意义。战后参与创建意大利共和党，1948至1953年出任国防部长，主持战后军队重建。晚年主张总统制共和国、脱离共和党，在政治上日益孤立。1991年辞世。"
 ITA_renato_ricci_desc:0 "1896年8月1日生于卡拉拉，法西斯运动成员，以主导意大利法西斯青少年组织建设著称。1926年起出任\"国家芭拉日拉行动团\"（Opera Nazionale Balilla，ONB）主席，主持建立了覆盖8至18岁全体青少年的法西斯组织体系，将体育训练、军事预备役培养与意识形态灌输整合为一，是墨索里尼政权对青少年实施系统性政治社会化的核心工具。1937年ONB并入新组建的\"利克托意大利青年团\"（GIL），他同时接掌新机构。法西斯倒台后他加入萨罗共和国，出任高级军事职务，具体指挥序列请以原始资料核查。1945年战争结束时被捕处决。"
 ITA_renato_sandalli_desc:0 "1897年2月25日生于热那亚、1968年卒于罗马，意大利空军将领。1916年入陆军，整个一战以陆军军官身份作战；1920年代初转习飞行，皇家空军成立后转入空军，两战间在本土及殖民地统率多支部队。1939年1月起主持试验飞行中心，继而出任占领下阿尔巴尼亚的空军司令。1943年7月墨索里尼倒台时，他在罗马空军参谋部任职，经国王任命为空军部长兼参谋长。停战后随国王逃往布林迪西，代表空军参与在马耳他签署的\"长期停战协定\"，着手组建与盟军并肩作战的共战空军。1944年6月巴多格里奥辞去首相后，他卸任，战后继续在空军供职。"
 ITA_rino_corso_fougier_desc:0 "1894年11月14日生、1963年卒，意大利皇家空军将领。一战时为骑自行车的贝尔萨利埃里军官，1915年6月侦察中被地雷炸伤仍坚持作战，获银质勇武勋章。1923年转入空军；1930年在坎波福尔米多创办意大利第一所特技飞行学校，即日后\"三色箭\"飞行表演队的前身。1935至1937年应巴尔博之邀统率利比亚空军，埃塞俄比亚战争中指挥东非空军。1940年9月至1941年1月率\"意大利空军军团\"（CAI）驻比利时、参加不列颠之战。1941年11月接普里科洛之任，出任空军次长兼参谋长至1943年7月，其间获德国金质十字勋章。墨索里尼政权垮台后即遭免职、退隐。"
 ITA_roberto_farinacci_desc:0 "1892年生，幼年随家迁居克雷莫纳，是意大利法西斯运动中最粗暴、最极端的\"老卫队\"代表，黑衫党暴力文化的人格化身。克雷莫纳的\"拉斯\"——地方法西斯头目——他在1920至1921年间以私人行动队大规模袭击社会主义者、工会组织与天主教合作社，以系统性暴力摧毁该省所有左翼基层架构，为进军罗马铺路。1925年2月至1926年3月出任国家法西斯党书记，任内以最强硬手段推行对反对派的全面清肃，加速了议会制度残余的终结，被同时代人称为这一阶段最具破坏性的法西斯内部推手。他对纳粹德国的崇拜在意大利法西斯高层中属于极端例子，长期担任希特勒与纳粹意识形态在意大利法西斯体制内的首席鼓吹者。1938年反犹种族法颁布前后，他是最积极的推动者之一，早在官方政策形成前便在其克雷莫纳报纸《法西斯政权报》（Il Regime Fascista）中反复散布反犹内容。某次以手榴弹炸鱼时发生意外，他因此失去右手，此后终身佩戴义肢。1943年7月25日墨索里尼倒台后，他立即出逃德国，成为纳粹德国扶植萨罗共和国最积极的意大利参与者之一。1945年4月下旬北意大利全面解放时，他被游击队捕获并处决，与墨索里尼几乎同日殒命。"
 ITA_rodolfo_graziani_desc:0 "1882年8月11日生于弗罗西诺内省菲莱蒂诺，意大利元帅，职业生涯以连串殖民镇压与战争罪行著称。一战后主导意大利对利比亚塞努西抵抗的系统镇压：大规模动用集中营与化学武器，强制迁移昔兰尼加贝都因人口，抵抗领袖奥马尔·穆赫塔尔被捕后于1931年公开处绞。1935年参与入侵埃塞俄比亚，翌年出任意属东非副王兼总督，占领期间在战场与居民区大量施用化学武器；1937年2月亚的斯亚贝巴遭刺杀未遂后，他下令对平民展开大规模报复屠杀，估计死亡人数从数百至逾万不等，争议至今悬而未决。二战初期任北非总司令，1940至1941年间被英军\"罗盘行动\"重创，惨败后被撤职。意大利停战后，他自愿出任萨罗共和国国防部长，是少数公开效忠纳粹傀儡政权的元帅。战后军事法庭判处十九年徒刑，然因1946年大赦令仅服刑数月即获释，此后担任意大利社会运动名誉主席。1955年1月11日卒于罗马。"
 ITA_romeo_bernotti_desc:0 "1877年2月24日生于厄尔巴岛马尔恰纳马里纳、1974年3月19日卒于罗马，意大利皇家海军上将，与菲奥拉万佐、迪·詹贝拉尔迪诺同列两战间皇家海军三大理论家。1889年入海军，参加意土战争（以鱼雷艇指挥官身份）和一战（指挥驱逐舰与轻巡洋舰，获铜质勇武勋章）；战后创立海战研究所并主持至1922年，奠定其理论建构者地位。1927至1929年任海军副参谋长，1932至1934年任利佛诺海军学院院长，1936至1938年统领第2舰队；1938年起兼任海军高级委员会主席与海军上将委员会主席，1939年退役入选王国参议院。他在两战间力排\"潜艇至上\"论，是舰队航空与航母的坚定倡导者，理念长期与多数海军高层相左。战后著有三卷本《二战海上战争》，并多次在美国海军学会《学报》发表英文分析，为意大利海战史权威，直至近百岁高龄仍笔耕不辍。"
 ITA_sandro_pertini_desc:0 "1896年9月25日生于利古里亚萨沃纳省斯泰拉，意大利社会党人，以坚定的反法西斯立场著称。年轻时研习法律，一战退伍后投身社会主义运动。墨索里尼上台后拒绝宣誓效忠法西斯政权，遭秘密警察（OVRA）多次逮捕拷打，长年系狱或被流放孤岛。二战期间越狱出逃，深入北意大利抵抗运动，成为北意民族解放委员会（CLNAI）核心领导人之一，直接参与组织1945年4月北意城市起义。战后以抵抗运动元老身份在社会党内居于核心，历任众议员、众议院议长（1968—1976），1978年当选意大利第七任总统，任期至1985年。他以平易近人、坦率直言的风格，被意大利民众视为历史上最受爱戴的国家元首之一。1990年2月24日卒于罗马。"
 ITA_sebastiano_visconti_prasca_desc:0 "1883年生于罗马，职业军人，是1940年入侵希腊计划的主要鼓吹者。他以高度乐观的军事评估向墨索里尼和齐亚诺保证，意军可在数周内占领全境，无需德国协助，实际兵力与准备均属严重不足。1940年10月28日亲自指挥意军越过阿尔巴尼亚边境，希腊人的顽强反攻在数日内将战线逆转，意军被逐出希腊领土退回阿尔巴尼亚腹地。出战不足三周即遭解职，由索杜接替，成为这场惨败的直接替罪羊。希腊泥潭此后拖垮意大利整个冬季，并迫使纳粹德国于翌年春季出兵干预巴尔干，间接推迟了\"巴巴罗萨行动\"的启动。战后面对军事调查，未获重大惩处。1961年辞世。"
 ITA_serafino_mazzolini_desc:0 "约1890年生，意大利职业外交官，法西斯政权倒台后选择投效萨罗共和国，出任外交次长，成为这一纳粹扶植傀儡政权外交系统的核心官员。在萨罗共和国存续期间，他尝试维持意大利在形式上的外交能力，实则一切重大决策均由柏林主导，外交空间极为有限。1944至1945年随萨罗政权残余机关向北退缩，战争结束前后被捕，1945年处决。具体执行地点与日期请以原始资料核查。"
 ITA_seyoum_mengesha_doppleganger_desc:0 "1887年6月21日生，埃塞俄比亚索罗门王朝提格雷支系贵族，约翰尼斯四世皇帝之孙、拉斯·曼加沙·约翰尼斯之子，西提格雷省督（1910—1935年）。1935年10月意大利入侵至1936年2月，他以拉斯衔统率埃塞俄比亚提格雷军团，七个月间几乎以一军之力独抗意军北路，参与圣诞节反攻、第一及第二次滕比恩战役，尽管意军使用化学武器，仍坚持抵抗至1936年马伊乔战败后方告崩溃；随后与部分埃塞俄比亚贵族被俘押往意大利。被俘期间，他与意属东非总督奥斯塔公爵建立了个人情谊，借助这一关系协助争取到三千名关押在意属索马里的埃塞俄比亚战俘获释。1939年宰教节，他与古格萨和海卢出席奥斯塔公爵主持的典礼，成为占领政权可资展示的合作姿态；但与古格萨和海卢不同，他的合作程度相对克制，史学界对其倾向分歧较大，一种解读是以曲折之道保全实力。1941年意大利撤退前，他统率七万提格雷军队参与北部解放战役，以此换得战后皇帝的认可——东、西提格雷均划归他管辖，古格萨家族的势力则被彻底清出。1960年帝国卫队发动未遂政变，在乱局中遇难，时年七十三岁。"
 ITA_silvio_scaroni_desc:0 "1893年5月12日生于布雷西亚、1977年卒于米兰，一战意大利第二号王牌飞行员，26次确认击落仅次于巴拉卡（34次），获金质勇武勋章。原为炮兵，1915年转入航空兵，先做侦察飞行，后主要驾昂里奥HD.1战斗机屡建战功；1917年圣诞次日，他在己方机场遭敌机群空袭中一举击落三架，传为佳话。1918年7月在蒙泰托马蒂科上空负伤，昏迷中险些坠机、迫降于格拉帕山附近，住院五月、再未参战。两战间任驻伦敦、华盛顿武官，并于1933至1937年率航空使团赴华、在洛阳为中国空军创办飞行学校。二战中任西西里意大利空军司令（1941.12–1943.1），主持对马耳他作战，期间与戈林交恶——后者指责他对德军攻势支援不力。"
 ITA_ubaldo_soddu_desc:0 "1883年生，意大利将领。二战爆发时任陆军副国务卿兼副参谋总长，是战前军事行政的核心官员。1940年11月接掌希腊战役指挥权，然局势持续恶化，他悲观地向上级表达意大利需要\"寻找一个体面的出路\"，此言传至墨索里尼处后，旋即以\"健康原因\"为名被解职，由卡瓦莱罗接替。此后淡出战时核心决策，1949年辞世。"
 ITA_ugo_cavallero_desc:0 "1880年9月30日生于皮埃蒙特卡萨莱蒙费拉托，意大利元帅。一战期间历任参谋要职，战间期主持安萨尔多军工集团，使其发展为重要军火生产商。1940年12月，在希腊战役惨败责任浪潮中接替巴多格里奥出任最高统帅部总长，此后数年承担协调轴心军北非、苏联战线与巴尔干各战场的艰难任务。他的主要精力耗于在隆美尔强烈的自主作战意志与意大利战略需求之间寻求平衡，效果有限。1943年1月利比亚接连失陷后，墨索里尼将其解职并一度拘押。7月25日墨索里尼被捕后，巴多格里奥政府再度逮捕他。同年9月13日，他被发现陈尸于弗拉斯卡蒂附近的德军控制区域，官方认定为自杀，但也有说法认为他遭德军处决——德方疑其参与了意大利秘密停战谈判，真相至今争议未决。"
 ITA_ugo_luca_desc:0 "1892年5月24日生于费尔特雷，宪兵军官出身，精通阿拉伯语、土耳其语与希腊语，是意大利军事情报体系中罕见的中东事务专家。参加利比亚战争立功后，历任驻土耳其、罗得岛及利比亚情报要职，是意大利军事情报局在地中海东岸的核心运作人物。西班牙内战期间（1937年），以少校军衔出任意大利志愿军团（CTV）情报长官，先于皮埃凯抵达西班牙，负责组建前线情报网络。二战期间，以\"商务参赞\"身份挂职土耳其大使馆，实为空军情报局（SIM Aeronautica）驻土负责人，1943年1月齐亚诺外长曾引荐他在罗马觐见墨索里尼汇报中东局势。战后美国记者指控他策划了其妻（反法西斯异见者莉亚·施亚维）在伊拉克遭谋杀一事，但审判中指控被撤销。1943年9月停战后，他留守被占罗马，在地下抵抗网络中承担情报联络工作。战后出任\"西西里土匪镇压司令部\"长官，麾下时任上尉卡洛·阿尔贝托·达拉·基耶萨参与其中。1950年7月3日，借助告密者皮肖塔的线报，萨尔瓦托雷·朱利亚诺在卡斯泰尔韦特拉诺附近被击毙，他随即晋升准将。官方宣称是战斗中击毙，事后皮肖塔在维泰博审判中披露实为夜间暗杀。1954年以少将衔退役，1962至1967年出任费尔特雷镇长，任内因肺癌辞世。"
 ITA_vittorio_ambrosio_desc:0 "1879年7月28日生于都灵，意大利将领。1943年2月接替卡瓦莱罗出任最高统帅部总长，上任后即介入推翻墨索里尼的密谋，是协调国王、法西斯大委员会与军方行动的核心人物之一，在7月25日解除并逮捕墨索里尼一事中发挥关键作用。此后参与停战谈判准备工作，但9月南逃布林迪西之事仍是其生涯污点。1958年11月19日卒于都灵。"
 ITA_vittorio_emanuele_orlando_desc:0 "1860年5月19日生于巴勒莫，法学教授出身，意大利二十世纪初最重要的宪法理论家与政治家，以一战宰相与\"残缺的胜利\"（vittoria mutilata）双重身份载入史册。1917年10月卡波雷托溃败后，他临危受命出任首相，以坚韧意志重整士气与战线，领导意大利撑过战争最黑暗的阶段直至1918年胜利。1919年巴黎和会，他以意大利首席代表身份与威尔逊、克列孟梭、劳合·乔治并列\"四巨头\"。然而谈判进程令他始终无法兑现对本国民众的承诺：《伦敦条约》（1915年）许诺的达尔马提亚海岸领土及当时争议激烈的阜姆（Fiume）均未落实。同年4月，他愤而率团退出会议，试图以此逼迫列强让步，结果适得其反——其他大国在意大利缺席下推进谈判，奥兰多空手而归，6月在议会不信任投票后黯然下台。这场外交受挫深刻伤害了意大利民族情绪，为民族主义右翼的兴起提供了重要的情绪资本。法西斯掌权后，他态度暧昧：1924年马泰奥蒂被谋杀引发政治危机，他参与了反对派议员的\"阿文廷山撤离\"，其后却在政治压力下返回议会，为批评者所诟病。此后他基本退出公开政治，以宪法学者身份在学术圈延续影响力。战后参与制宪议会，以保皇立场见证共和国建立。1952年12月1日卒于罗马，享年九十二岁。"
 alberto_da_zara_desc:0 "1889年生，意大利皇家海军将领，以1942年6月的潘泰莱里亚海战（\"维果行动\"）中的积极进攻著称：他率意大利第7巡洋舰分队拦截护送英国\"哈普恩行动\"运输船队的护航力量，对英方护卫舰艇造成损伤，是意大利皇家海军为数不多的主动出击成功案例之一。1943年9月停战后，他按停战条款行事。战后著有回忆录《提督之皮》（Pelle d'ammiraglio），是地中海海战的重要第一手记录。1951年辞世。"
 alfredo_guzzoni_desc:0 "1877年生于曼托瓦，意大利将领。二战初期任陆军副国务卿，参与早期作战规划，1940年6月率部参与南法登陆行动。1942至1943年出任西西里第6集团军司令，1943年7月盟军\"哈士奇行动\"登陆期间，他以严重劣势兵力协调轴心军防御，在众多高级将领中表现相对称职。西西里失陷后去职。1965年辞世。"
 amadeo_bordiga_desc:0 "1889年6月13日生于那不勒斯省雷西纳，马克思主义理论家，意大利共产党的创始人之一与首任领导者，同时是共产国际历史上最早与斯大林主义路线正面决裂的共产党领袖。他早年在那不勒斯投身社会主义运动，迅速成为意大利社会党内最强硬的纯粹主义旗手，拒绝任何形式的议会参与和跨派别合作，视其为对革命原则的稀释。1921年1月21日，他在里窝那代表大会上主导了意大利共产党自社会党的历史性分裂，成为PCI第一任中央书记。此后，他与共产国际的路线冲突迅速公开化。他坚决反对\"统一战线\"策略，拒绝接受共产国际对各国党的指令权威，主张以纯粹无产阶级先锋党路线应对法西斯主义。1924年前后他被架空领导权，1926年在共产国际内遭强制搁置，1929年被正式开除出共产国际。托格利亚蒂此后主导意共数十年，两人路线分歧再未弥合，博尔迪加在意共官方叙述中长期被定性为\"宗派主义错误\"的代名词。意大利当局于1926年将其逮捕，判处内部流放（confino）。漫长的法西斯岁月中，他保持近乎彻底的政治沉默，拒绝与任何外部势力合作。战后他在南意大利重组极左共产主义小团体，坚持其\"左翼共产主义\"（Bordighismo）路线，批判苏联、批判意共主流，影响力主要限于超左圈子。1960至1970年代，其理论著作因西方新左思潮兴起而被重新发掘，成为欧美超左派的重要参照系。1970年7月23日卒于福米亚。"
 amedeo_mecozzi_desc:0 "1892年生，意大利皇家空军将领与空权理论家，以倡导\"攻击航空\"（aviazione d'assalto）著称，是二十世纪初期意大利空军思想界最重要的异见声音。彼时意大利空权学说由杜黑（Giulio Douhet）的战略轰炸理论主导——以轰炸工业、城市与平民士气来瓦解敌国战争意志。梅科齐是其主要理论对手：他认为\"间接打击\"效率低下、代价高昂，主张发展以低空精确打击战场地面目标为核心的战术支援航空，强调对敌方后勤节点、装甲集群与兵力集结的直接摧毁——这一理论预见了日后近距离空中支援（CAS）的作战逻辑。战间期他积极推动攻击机的战术研发与条令写作，二战中以高级军职参与空军指挥，但在资源有限、轰炸机优先的现实格局中，其主张未能充分落实。约1971年辞世。"
 angelo_iachino_desc:0 "1889年生，意大利皇家海军上将，以马塔潘角海战（1941年3月27至29日）的惨败永载海战史册。他指挥意大利舰队在地中海东部执行截击任务，却因英方已借助\"超级机密\"（Ultra）情报破译其编码通讯、完全掌握其行踪，被坎宁安将军以夜战重创：意方损失重型巡洋舰扎拉号、波拉号、菲乌梅号及驱逐舰两艘，是意大利皇家海军二战中最惨重的单次败仗，意大利海军此后在大规模作战上明显趋于保守。战后从事海战史写作，1976年辞世。"
 arturo_riccardi_desc:0 "约1878年生，意大利皇家海军上将，1941年12月至1943年9月出任海军总参谋长（Supermarina），接替因塔兰托空袭失败与希腊战役连带责任而去职的卡瓦纳里。在任期间主持了意大利海军在地中海战争最艰难阶段的战略统筹：维护北非补给线、应对英国潜艇与航空兵的持续消耗、在燃油极度匮乏的条件下维持主力舰队有限的出击能力。北非战线全面崩溃（1943年5月）与盟军登陆西西里（7月）后，意大利海军作战能力已接近枯竭；1943年9月停战后他执行舰队驶往盟方的命令。战后未受主要追究。"
 carlo_bergamini_desc:0 "1888年生，意大利皇家海军上将，意大利主力舰队末任司令，以悲壮方式完成了对停战条款的服从。1943年9月8日停战令公布后，他奉命率主力战列舰队向北非驶去，依约向盟军移交舰只。翌日（9月9日），舰队航行中途遭德国空军以\"弗里茨X\"无线电制导炸弹攻击，旗舰\"罗马号\"战列舰被连续两枚命中，弹药库殉爆，数分钟内沉没，贝尔加米尼随舰殉职。这是意大利皇家海军二战中最惨重的单次损失，亦是制导武器在实战中击沉大型军舰的首个著名战例。"
 carlo_scorza_desc:0 "1897年生，法西斯党官员，1943年4月19日出任国家法西斯党（PNF）最后一任书记，在任仅约三个月即遭遇法西斯体制最戏剧性的内部崩溃。1943年7月24至25日夜，法西斯大委员会召开紧急会议，就格兰迪动议（剥夺墨索里尼最高军事指挥权）进行表决，斯科尔扎投票反对该动议，但以7票对19票落败。墨索里尼随即被捕，法西斯党宣告解散，他亦随之落网。战后以通敌罪受审，后经特赦获释，此后淡出公众视野。"
 domenico_cavagnari_desc:0 "1876年生，意大利皇家海军上将，1933至1940年出任海军部次长兼海军总参谋长，全权主导意大利海军战前建设与备战规划，主持了战列舰、重型巡洋舰与潜艇舰队的大规模扩充。然而意大利海军在其任内对雷达与声纳技术的引进严重滞后，技术差距在实战中付出了沉重代价。1940年11月11至12日，英国航空母舰\"光辉号\"舰载双翼鱼雷机夜袭塔兰托港，以约20架飞机重创3艘意大利战列舰，暴露出其主导的港口防御体系的根本漏洞；他随即于当年底辞职，此后退出公众视野。"
 emilio_de_bono_desc:0 "1866年生于伦巴第卡萨诺达达，职业军人出身，意大利法西斯运动的创始元老之一。一战期间历任要职，战后投身法西斯运动，1922年10月跻身主导\"进军罗马\"的四巨头之列，与巴尔博、德·韦基、比安基并肩。法西斯执政后，他历任国家民兵志愿军（MVSN）总司令、殖民地部长等要职。1935年10月奉命指挥意军入侵埃塞俄比亚，因推进迟缓被墨索里尼数月后撤换，由巴多格里奥接手完成征服；事后仍获授意大利元帅衔。1943年7月25日，在法西斯大委员会召开的紧急会议上，他投票支持格兰迪动议，赞成剥夺墨索里尼最高军事指挥权，从而成为促成其倒台的关键票数之一。德军救出墨索里尼、建立萨罗共和国后，他以\"叛徒\"身份在维罗纳接受审判。1944年1月11日，这位法西斯运动创始元老被萨罗政权处以枪决，终年七十七岁。"
 ettore_muti_desc:0 "1902年生于拉韦纳，法西斯运动暴力原生代，黑衫党行动队出身，兼具骑兵军官与战斗机飞行员经历，先后参加埃塞俄比亚战争与西班牙内战，积累多枚金质勇武勋章，由此赢得墨索里尼的特别赏识。1939年接替斯塔拉切出任国家法西斯党书记，约一年后即被塞雷纳替换——他长于勇武行动而短于官僚机器，党务行政实非其长。1943年7月墨索里尼倒台后被捕，同年8月在押送途中遭宪兵枪击毙命，官方称系\"拒捕逃跑\"。"
 francesco_pricolo_desc:0 "1891年1月30日生于格鲁门托诺瓦、1980年卒于罗马，意大利空军将领，飞艇军官出身，一战中执行过六十余次飞艇任务。1939年11月至1941年11月任空军次长兼参谋长，领导空军度过参战头十八个月。他颇具远见，力排海空军高层\"昂贵玩具\"的成见，推动将SM.79改装为鱼雷机，并说服菲乌梅鱼雷厂取消一笔德国订单、转产八十枚鱼雷，使SM.79鱼雷机于1940年8月投用，又促成马基C.202战机研制。1941年11月，他因与卡瓦莱罗严重冲突、且为德方所不喜而去职——隆美尔曾在报告中提醒最高统帅部\"提防反复无常的意大利将军普里科洛\"；他于1954年退役。"
 giovanni_messe_desc:0 "1883年12月10日生于普利亚梅萨涅，意大利元帅，二战中意军最受推崇的野战指挥官之一。一战老兵出身，战间期历练多个军职。1941至1942年率意大利远征军（CSIR）参加东线，在顿河一线以相对体面的表现与苏军周旋，后因与德方协调问题矛盾激化而遭调离。1943年初接手突尼斯第1意大利集团军，在轴心军全线崩溃的背景下数度发起局部反击，尽力拖延盟军合围，被对方视为具备真正战术素养的对手。1943年5月13日，在弹尽粮绝、退路全断的情况下率部投降，据传正是在投降当日收到元帅晋衔通知。同年9月意大利停战后，他选择投向盟国，出任共战意大利军队参谋总长，主持重建意大利军事力量，是少数在政治剧变中全身而退并继续发挥作用的高级将领。战后以严谨职业军人形象著称。1968年12月19日卒于罗马。"
 guiseppe_fioravanzo_desc:0 "1891年8月14日生于威尼托蒙塞利切、1975年卒，意大利皇家海军将领，与伯诺提同列两次大战间意大利海军学说的主要建构者，是海军中著名的\"理论家\"。早年参加意土战争与一战，1938至1939年任舰队参谋长。二战中晋少将，在最高海军司令部（Supermarina）作战室任值班将官，经历开战头二十个月的海军行动，包括引致马塔潘角海战的\"高多行动\"；其主管的\"特殊研究处\"早在战前便草拟了入侵马耳他的最初方案（C3行动）。1943年3月接掌第8巡洋舰分队，8月奉命炮击已被盟军占领的巴勒莫，却因未达成任务提前撤回而被调离、留置岸上，晋升之路就此中断。战后长年主持海军历史处，著述逾四百种，为意大利海战史权威。"
 inigo_campioni_desc:0 "1878年生，意大利皇家海军上将，1940至1941年担任海军总司令，直接指挥了卡拉布里亚角海战（1940年7月9日）——意大利二战首次大规模海上对决。1943年9月停战时他出任爱琴海及罗德岛总督，面对德军强制缴械要求拒绝配合、试图组织抵抗，但力量悬殊终遭俘获。德国将其移交萨罗共和国军事法庭，以叛国罪起诉，1944年5月24日被枪决。"
 italo_balbo_desc:0 "1896年生于费拉拉省，法西斯党创始要人之一。一战在山地部队服役后转入法西斯运动，成为费拉拉一带凶悍的黑衫党头领，并跻身1922年\"进军罗马\"的四巨头之列。任空军部长期间（1926—1933），他大力扩建意大利皇家空军，并亲自领衔多次震动世界的远程编队飞行——尤以1933年罗马至芝加哥的跨大西洋远征最为著名，\"balbo\"一词由此在英语航空界成为大机群编队的俗称。1934年起任利比亚总督，推动殖民地基础建设与移民工程。与法西斯高层不同，巴尔博公开反感意大利向纳粹德国靠拢，并明确反对1938年种族法，一度被视为有实力挑战墨索里尼地位的潜在人物。1940年6月28日，他的座机在托布鲁克上空被意军高射炮误认为英机击落，当场身亡，终年四十四岁。"
 ivanoe_bonomi_desc:0 "1873年生于曼托瓦，博洛尼亚大学自然科学与法学出身，毕业后进入新闻业，加入社会党。曾任党报《前进报》主编，后墨索里尼继任此职。主张改良路线。因支持利比亚战争，于1912年雷焦艾米利亚代表大会上开除党籍，当时鼓动清洗改良派者，恰是青年墨索里尼。此后他另组意大利改良社会党，一战志愿从军，历任公共工程部长、陆军部长，1921至1922年首度出任首相，因无力遏止法西斯与社会党的街头暴力而垮台。法西斯当政期间他退隐著史，靠代写律师状糊口。1942年底重返地下政坛，在梵蒂冈庇护下的罗马神学院与各党密商；1943年9月停战翌日，六个反法西斯政党组建民族解放委员会，公推他为主席。1944年6月罗马光复后他接替巴多格里奥再任首相，内阁延揽斯福尔扎、克罗齐、陶里亚蒂等\"绝无法西斯瓜葛之人\"，承认北方游击队并批准战后制宪与共和公投。1945年让位于帕里，后当选共和国首任参议院议长，1951年卒于罗马。"
 luigi_mascherpa_desc:0 "1893年4月15日生于热那亚、1944年5月24日被处决，意大利海军少将。一战中任水上飞机飞行员。1942年4月出任多德卡尼斯群岛主基地莱罗斯岛司令。1943年9月停战、罗德岛陷落后，他接掌当地全部意大利海军，拒绝德方\"体面投降\"条件，会同登岛英军坚守莱罗斯近两月（为不低于英方将领军衔而获晋少将），即便德方称单独投降可保全部下，仍予拒绝。岛破被俘后，他被移交萨罗政权，与坎皮奥尼同在帕尔马\"将领审判\"中受审——墨索里尼亲自施压判死——于1944年5月24日被枪决，身后追授金质勇武勋章，临刑留下遗言\"我最后的思念献给我们的意大利\"。"
 mario_roatta_desc:0 "1887年1月2日生于摩德纳，意大利将领，以情报机关首脑与占领区暴行双重著称。1930年代主导军事情报局（SIM），将其改造为针对国内外政敌的政治清洗工具。1937年，旅法反法西斯知识分子卡洛与内洛·罗塞利兄弟在诺曼底遭雇佣杀手刺杀，历史研究普遍将此案归因于SIM策动，罗阿塔否认却始终无法自证。西班牙内战期间任意大利驻佛朗哥军事代表，协调\"志愿军\"与军事援助。二战中先后短暂担任陆军总参谋长，继而出任第2集团军司令，负责占领南斯拉夫西部地区。任内签发多项酷烈命令，包括明确授权枪决人质、拆毁村庄与大规模关押平民的\"循环3C号令\"，被克罗地亚与斯洛文尼亚史学界列为战争罪责任人之一。1943年停战后被捕，1945年以病重为由转往医院后随即失踪，逃亡西班牙；意大利法庭以缺席方式判决，1966年方回国，届时大多数诉讼已因年限失效。1968年1月7日卒于罗马。"
 mario_roatta_political_advisor_desc:0 "1887年1月2日生于摩德纳，意大利将领，以情报机关首脑与占领区暴行双重著称。1930年代主导军事情报局（SIM），将其改造为针对国内外政敌的政治清洗工具。1937年，旅法反法西斯知识分子卡洛与内洛·罗塞利兄弟在诺曼底遭雇佣杀手刺杀，历史研究普遍将此案归因于SIM策动，罗阿塔否认却始终无法自证。西班牙内战期间任意大利驻佛朗哥军事代表，协调\"志愿军\"与军事援助。二战中先后短暂担任陆军总参谋长，继而出任第2集团军司令，负责占领南斯拉夫西部地区。任内签发多项酷烈命令，包括明确授权枪决人质、拆毁村庄与大规模关押平民的\"循环3C号令\"，被克罗地亚与斯洛文尼亚史学界列为战争罪责任人之一。1943年停战后被捕，1945年以病重为由转往医院后随即失踪，逃亡西班牙；意大利法庭以缺席方式判决，1966年方回国，届时大多数诉讼已因年限失效。1968年1月7日卒于罗马。"
 marziale_cerutti_desc:0 "1895年3月10日生于布雷西亚、1946年卒，意大利皇家空军准将。原为炮兵，一战中转飞行，成为意大利头号王牌之一，驾纽波尔战机取得十七次确认击落。战间晋上校，先后统率第15、第11联队。二战初在北非最高司令部任职，1940年6月28日目睹巴尔博元帅在托卜鲁克被己方高射炮误击身亡；1941年8月任空运司令部（特种航空勤务队）参谋长。1943年停战后他选择追随墨索里尼、加入萨罗政权的\"国家共和空军\"，战后因此被停职；在等待军籍裁定期间，于1946年5月骑自制摩托车遭遇车祸丧生。他是极少数两次大战分属敌对阵营作战的飞行员之一。"
 pietro_badoglio_desc:0 "1871年生于皮埃蒙特格拉扎诺，意大利元帅，两次世界大战中最具争议的军事领袖之一。一战中历经卡波雷托溃败（1917年）仍得以晋升，战后出任陆军参谋长，并任利比亚总督（1928—1933年）。1935年底接替进展迟缓的德·博诺，接掌埃塞俄比亚战场指挥，大规模使用芥子气等化学武器，于1936年5月完成征服，获授元帅头衔。二战初期任最高统帅部参谋长，因希腊战役惨败于1940年12月辞职。1943年7月25日，墨索里尼被捕后，国王即任命他出任总理；9月8日宣布与盟国停战，次日却与国王仓皇弃守罗马南逃布林迪西，将军队与首都一并抛下。同年10月13日对德宣战。1944年6月罗马解放后辞任，由博诺米接手。1956年在家乡辞世，获国家荣典。"
 renato_sandalli_desc:0 "1897年2月25日生于热那亚、1968年卒于罗马，意大利空军将领。1916年入陆军，整个一战以陆军军官身份作战；1920年代初转习飞行，皇家空军成立后转入空军，两战间在本土及殖民地统率多支部队。1939年1月起主持试验飞行中心，继而出任占领下阿尔巴尼亚的空军司令。1943年7月墨索里尼倒台时，他在罗马空军参谋部任职，经国王任命为空军部长兼参谋长。停战后随国王逃往布林迪西，代表空军参与在马耳他签署的\"长期停战协定\"，着手组建与盟军并肩作战的共战空军。1944年6月巴多格里奥辞去首相后，他卸任，战后继续在空军供职。"
 rino_corso_fougier_desc:0 "1894年11月14日生、1963年卒，意大利皇家空军将领。一战时为骑自行车的贝尔萨利埃里军官，1915年6月侦察中被地雷炸伤仍坚持作战，获银质勇武勋章。1923年转入空军；1930年在坎波福尔米多创办意大利第一所特技飞行学校，即日后\"三色箭\"飞行表演队的前身。1935至1937年应巴尔博之邀统率利比亚空军，埃塞俄比亚战争中指挥东非空军。1940年9月至1941年1月率\"意大利空军军团\"（CAI）驻比利时、参加不列颠之战。1941年11月接普里科洛之任，出任空军次长兼参谋长至1943年7月，其间获德国金质十字勋章。墨索里尼政权垮台后即遭免职、退隐。"
 rodolfo_graziani_desc:0 "1882年8月11日生于弗罗西诺内省菲莱蒂诺，意大利元帅，职业生涯以连串殖民镇压与战争罪行著称。一战后主导意大利对利比亚塞努西抵抗的系统镇压：大规模动用集中营与化学武器，强制迁移昔兰尼加贝都因人口，抵抗领袖奥马尔·穆赫塔尔被捕后于1931年公开处绞。1935年参与入侵埃塞俄比亚，翌年出任意属东非副王兼总督，占领期间在战场与居民区大量施用化学武器；1937年2月亚的斯亚贝巴遭刺杀未遂后，他下令对平民展开大规模报复屠杀，估计死亡人数从数百至逾万不等，争议至今悬而未决。二战初期任北非总司令，1940至1941年间被英军\"罗盘行动\"重创，惨败后被撤职。意大利停战后，他自愿出任萨罗共和国国防部长，是少数公开效忠纳粹傀儡政权的元帅。战后军事法庭判处十九年徒刑，然因1946年大赦令仅服刑数月即获释，此后担任意大利社会运动名誉主席。1955年1月11日卒于罗马。"
 silvio_scaroni_desc:0 "1893年5月12日生于布雷西亚、1977年卒于米兰，一战意大利第二号王牌飞行员，26次确认击落仅次于巴拉卡（34次），获金质勇武勋章。原为炮兵，1915年转入航空兵，先做侦察飞行，后主要驾昂里奥HD.1战斗机屡建战功；1917年圣诞次日，他在己方机场遭敌机群空袭中一举击落三架，传为佳话。1918年7月在蒙泰托马蒂科上空负伤，昏迷中险些坠机、迫降于格拉帕山附近，住院五月、再未参战。两战间任驻伦敦、华盛顿武官，并于1933至1937年率航空使团赴华、在洛阳为中国空军创办飞行学校。二战中任西西里意大利空军司令（1941.12–1943.1），主持对马耳他作战，期间与戈林交恶——后者指责他对德军攻势支援不力。"
 ugo_cavallero_desc:0 "1880年9月30日生于皮埃蒙特卡萨莱蒙费拉托，意大利元帅。一战期间历任参谋要职，战间期主持安萨尔多军工集团，使其发展为重要军火生产商。1940年12月，在希腊战役惨败责任浪潮中接替巴多格里奥出任最高统帅部总长，此后数年承担协调轴心军北非、苏联战线与巴尔干各战场的艰难任务。他的主要精力耗于在隆美尔强烈的自主作战意志与意大利战略需求之间寻求平衡，效果有限。1943年1月利比亚接连失陷后，墨索里尼将其解职并一度拘押。7月25日墨索里尼被捕后，巴多格里奥政府再度逮捕他。同年9月13日，他被发现陈尸于弗拉斯卡蒂附近的德军控制区域，官方认定为自杀，但也有说法认为他遭德军处决——德方疑其参与了意大利秘密停战谈判，真相至今争议未决。"
 vittorio_ambrosio_desc:0 "1879年7月28日生于都灵，意大利将领。1943年2月接替卡瓦莱罗出任最高统帅部总长，上任后即介入推翻墨索里尼的密谋，是协调国王、法西斯大委员会与军方行动的核心人物之一，在7月25日解除并逮捕墨索里尼一事中发挥关键作用。此后参与停战谈判准备工作，但9月南逃布林迪西之事仍是其生涯污点。1958年11月19日卒于都灵。"
