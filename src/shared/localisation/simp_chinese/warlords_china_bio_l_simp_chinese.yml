l_simp_chinese:
 GXC_chen_jitang_desc:0 "1890年2月12日生于广东防城（今属广西），1954年11月3日卒。粤系军政领袖，1929—1936年实际控制广东长达七年，人称\"南天王\"。任内推行系统性省域建设：整理省财政、修筑公路铁路、扩建中山大学与省立医院，工业与市政改善颇有成效，被视为南方区域现代化的代表案例之一。1936年联合广西桂系发起两广事变，以请缨北上抗日为名向南京施压，然中央以分化策略瓦解其部属，运动迅速崩溃，陈济棠出走海外，权力之路就此终结。"
 GXC_li_zongren_desc:0 "1891年8月13日生于广西桂林，1969年1月30日卒于北京。新桂系首脑，与白崇禧长期搭档，将广西经营为国民党体制内最具规模的地方军事政治集团。北伐中功勋卓著，此后长期在拥蒋与抗蒋之间审时度势，先后参与1929年蒋桂战争和1936年两广事变，始终维持广西的半独立地位。抗战期间主导台儿庄战役，以运动防御在鲁南歼灭日军两个精锐师团，成为正面战场中国军队最重要的胜利之一，声望如日中天。1948年当选副总统，1949年蒋介石下野后出任代总统，后流亡美国，1965年返回北京，两年后辞世。"
 KUM_yulbars_khan_desc:0 "1889年生，维吾尔族，新疆巴楚县人，原名马木提·乌守尔，清末至民国时期官员。早年父母双亡，辗转投靠哈密王府，习得商贸与交际能力，后任哈密王府翻译、商务帮办及伊夏克伯克等职。\n\n哈密地处新疆东部，是连接甘肃、蒙古和天山南北的重要门户。辛亥革命后，尧乐博斯周旋于哈密王、杨增新、金树仁等多方势力间，曾资助农民起义又借机告密以谋权。1931年哈密起义期间暗助义军，后引马仲英入疆对抗盛世才。1937年阻挠红军入疆被驱逐，投奔蒋介石后获国民党中将参议职衔。"
 QHM_ma_lin_desc:0 "1873年生，甘肃河州人，青海马家军老一代领袖之一。其出身回族军人家族，长期参与西北军政事务，曾任青海省主席。马麟的统治依托家族威望、宗教网络和地方武装，在马步芳全面崛起之前，是青海马家军体系中的关键人物。相比马步芳的强硬扩张，马麟更像旧式边疆军政长者，重在维持家族统治和地方秩序。1930年代，随着马步芳权力上升，马麟逐步退居次要位置。"
 SIC_liu_xiang_desc:0 "1890年生，四川大邑人，川军首领之一。四川长期军阀混战，刘湘在与刘文辉等川军派系的斗争中逐步取得优势，成为四川最具实力的地方统治者。他依靠川军、地方财政和复杂派系平衡维持统治，既要面对南京中央的整合，也要压制省内其他军阀。1936年前后，四川尚未完全被中央控制，刘湘名义服从蒋介石，实际上仍掌握川省相当军政资源。抗战爆发后，四川成为大后方核心，川军大量出川作战，刘湘的地位也从地方军阀转为全国抗战体系中的西南支柱之一。"
 SIC_yang_sen_desc:0 "1884年生，四川广安人，川军重要将领之一。杨森以善于保存实力、经营军队和适应局势著称，早年在四川军阀混战中纵横捭阖，打下不小的基业，是川军派系政治中极具代表性的人物。1936年前后，四川内部虽逐渐向统一靠拢，但杨森这类地方将领仍保有很强独立性。抗战时期，他率川军出川作战，参加淞沪、武汉等战事。"
 SND_han_fuju_desc:0 "1890年生，河北霸县人，西北军出身。韩复榘原为冯玉祥部将，中原大战后投向蒋介石，得以主政山东，为政着重于维护地方治安、增加财政收入与军队建设，始终保持强烈地方军阀色彩。1936年前后，山东处于华北和沿海要冲，既受南京中央牵制，也面临日本势力逼近。韩复榘对中央命令多有保留，首先考虑保存自己实力。抗战初期，他因擅自撤退、放弃黄河防线而被蒋介石处决，成为中央借战时纪律清算地方军阀的典型案例。"
 SIK_chiang_yufen_desc:0 "蒋有芬（Chiang Yu-fen），辽宁人，东北抗日义勇军将领，1933年随义勇军假道苏联退入新疆，成为盛世才旗下军官。1937年南疆叛乱期间，任喀什警备司令部参谋长、代理司令，马虎山率新编第三十六师主力第一旅自喀什撤向叶城方向时，蒋有芬奉命率部追击该旅；与此同时其他省军部队在苏联红军航空兵支援下，将阿不都·尼牙孜与克其克阿洪的叛乱武装逐向莎车，南疆叛乱遂告平定。后任喀什区行政长，曾据实反驳英国对大尔瓦沙地区的侵占企图。1941年任阿山军区指挥部总指挥，镇压柯克托海牧民暴动。1942年在盛世才制造的\"阴谋暴动案\"中被捕。"
 XSM_han_yimu_desc:0 "韩乙奴（Han Yimu），青海循化撒拉族人，马步芳部下。马步芳主政青海期间，从循化县招募了韩乙奴、韩有文（后任骑兵第五军师长）等一批撒拉族人员充实马家军。1949年青海解放后，韩乙奴与韩有福残部于12月13日在循化查加沟裹胁民众暴乱，杀害中国人民解放军干部战士98人；解放军一军一师一团与地方武装随即清剿，三日后叛众大部溃散。"
