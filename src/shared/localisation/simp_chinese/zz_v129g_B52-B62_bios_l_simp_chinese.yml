l_simp_chinese:
 CBIO_LAT_karlis_ulmanis_desc:0 "卡尔利斯·乌尔马尼斯1877年9月4日生于库尔兰的农户家庭,早年在瑞士、德国研修农学,1905年革命失败后流亡美国,曾在内布拉斯加大学任教并短暂经营乳品业,1913年获大赦返回拉脱维亚。他创建拉脱维亚农民联盟,是1918年11月18日宣告独立的人民委员会主要发起人,出任首届临时政府总理,此后四度组阁。1934年5月15日,他在战争部长巴罗迪斯支持下发动不流血政变,解散议会与各政党,实行威权统治,自称人民领袖,1936年将总统与总理两职合于一身。他推行拉脱维亚人优先政策,取缔了极右的雷十字并监禁其头目采尔明什。1939年被迫签订苏拉互助条约,1940年6月苏军占领后,他通过广播要求国民不作抵抗,留下我留在原地、你们也留在原地一语。他终身未婚,曾以我已同拉脱维亚成婚作答。1940年7月被苏联当局逮捕流放,辗转关押。1942年9月20日,他在今土库曼斯坦的克拉斯诺沃茨克狱中因痢疾去世。"
 CBIO_LAT_gustavs_celminsh_desc:0 "古斯塔夫斯·采尔明什1899年4月1日生于里加,早年就读里加交易所商业学校,1917年入里加理工学院,十月革命后回国。1918年他加入新建的拉脱维亚军队,次年晋升中尉,被派往波兰任武官,1921年获拉奇普莱西斯军功勋章,1924年退役后进入外交部与财政部任职。1932年他领导民族主义组织火十字,被取缔后另建极端民族主义组织雷十字,鼓吹民族革命,主张反犹、反波罗的海德意志人、反斯拉夫,提出只有拉脱维亚人的拉脱维亚这一口号。1934年乌尔马尼斯政变后,他被捕入狱三年,1937年遭驱逐出境,辗转意大利、瑞士、罗马尼亚与芬兰。苏芬战争期间他以志愿者身份参战。1941年巴巴罗萨行动后随德方返回拉脱维亚,短暂重掌雷十字,并主持征募拉脱维亚志愿者,但因不满这些人被用于屠杀等目的而暗中抵制,转而从事反德地下活动。1944年他被盖世太保逮捕,关入弗洛森比格集中营。战后他移居意大利,1949年移民美国。1968年4月10日在美国圣安东尼奥去世。"
 CBIO_LAT_alberts_kvesis_desc:0 "阿尔贝茨·克维埃西斯1881年12月22日生于库尔兰的泰尔维泰教区,1907年毕业于塔尔图大学法律系,此后在耶尔加瓦执律师业,积极参与拉脱维亚民族社团。1918年他是宣告独立的人民委员会成员,主管法务,独立后参与建立拉脱维亚司法与法院体系,1921至1923年任内政部长,后长期任法院庭长与议会副议长,属农民联盟骨干。1927年竞选总统未果,1930年当选拉脱维亚第三任总统,1933年连任。1934年乌尔马尼斯发动政变后,总统职权已被架空,他仍留任至1936年任期结束,其间对乌尔马尼斯的法令一概签署,未作抵抗。卸任后他重操律师旧业。1940年苏占后被禁止执业并遭软禁,1941年逃过大流放。德占时期他重返律界并出任亲德的拉脱维亚自治政府法务总监,成为附敌者。1944年8月,他登上随德军撤离的轮船,尚在里加港内即因心脏病发作。1944年8月9日去世。"
 CBIO_LAT_fricis_menders_desc:0 "弗里西斯·门德尔斯1885年8月20日生于里加,参加1905年革命,1906年被捕流放至叶尼塞省,1907年逃脱后流亡西欧,先后在维也纳、伯尔尼大学与布鲁塞尔社会学院研修经济与法律。他是拉脱维亚社会民主派中的孟什维克代表人物,回国后参与人民委员会,1920年当选制宪会议议员,1922至1934年连任第一至第四届萨埃马议员,多次出任外交委员会主席,并长期在里加执律师业。1918至1934年间他是社会民主工人党中央委员,1931年起任党主席。1934年乌尔马尼斯政变后,他被关入利耶帕亚集中营,1935年获释。苏占与德占时期,他先后在苏方司法机关与拉脱维亚中央委员会任职。战后1948年他被苏联逮捕并流放至莫尔多瓦劳改营,1955年获准返回。晚年他撰写回忆录,成为反苏异见者,1969年因反苏宣传与鼓动被判处流放。1971年4月1日去世。"
 CBIO_LAT_augusts_kirhensteins_desc:0 "奥古斯特·基尔兴施泰因斯1872年9月18日生于利沃尼亚的马扎萨拉察,早年就读塔尔图兽医学院,1901年毕业后任兽医,参与反沙皇革命活动,1905年革命失败后流亡瑞士,曾在达沃斯的结核病研究所协助细菌学研究。第一次世界大战期间他在塞尔维亚军队任军医,1917年回国,独立战争时期在拉脱维亚军队兽医部队任上尉。他是拉脱维亚大学与拉脱维亚农业学院的创办者之一,1923年起任该校微生物学教授,著有微生物学与维生素学著作,同时倾向社会民主。1940年苏占后,他应苏联使馆之邀出任新组建的傀儡政府首脑,该政府的首要任务即正式请求将拉脱维亚并入苏联,此事于1940年8月完成。此后他长期担任拉脱维亚苏维埃社会主义共和国最高苏维埃主席团主席至1952年,并任拉脱维亚科学院副院长。1941年他加入共产党。1963年11月3日在里加去世,葬于拉伊尼斯公墓。"
 CBIO_LAT_janis_balodis_desc:0 "亚尼斯·巴罗迪斯1881年2月20日生于特里卡塔教区,父亲是历史学家兼教师。他早年入俄罗斯帝国军队,1902年毕业于维尔纽斯军校,参加日俄战争负伤,第一次世界大战中在东普鲁士作战被德军俘虏。1918年11月他返回拉脱维亚,加入临时政府武装。1919年3月卡尔帕克斯阵亡后,他接掌库尔兰的拉脱维亚部队,屡败红军,同年10月出任总司令,率军击退西俄志愿军,1920年晋升上将,是独立战争的核心人物。1921年退役后他获议会赠予庄园,加入乌尔马尼斯领导的农民联盟,1925年当选议员,1931年12月起任战争部长。作为战争部长,他在1934年5月15日政变中起关键作用,与乌尔马尼斯共同签署宣布戒严、解散议会的公告,此后被视为政权二号人物,1936年任副总统,1938年任副总理,实权则限于军务。1940年4月,他在无明确解释下被解除一切职务,同年7月31日被苏联当局逮捕流放,1952年被判二十五年监禁,1956年获释返回拉脱维亚。1965年8月8日去世。"
 CBIO_LAT_vilis_lacis_desc:0 "维利斯·拉西斯1904年5月12日生于里加附近的韦茨米尔格拉维斯一个工人家庭,本名亚尼斯·维尔赫尔姆斯·拉采。第一次世界大战期间随家人逃往西伯利亚阿尔泰,曾在巴尔瑙尔师范学校就读,1921年返回里加,做过渔民、码头工、船上司炉与图书馆员,业余写作。1933年他出版长篇小说《渔夫的儿子》,一举成为1930年代最畅销的拉脱维亚作家之一,作品被视为通俗文学,广受普通读者欢迎。他长期与被取缔的拉脱维亚共产党保持地下联系,虽受政治警察监视,却因总统乌尔马尼斯赏识而获庇护,乌尔马尼斯甚至下令销毁对他的监视档案并资助其写作,他则撰文称颂乌尔马尼斯政权,同时仍是共产主义者。1940年拉脱维亚被并入苏联后,他出任拉脱维亚苏维埃社会主义共和国部长会议主席,即名义上的总理,任职至1959年。他多被视为受党中央支配的门面人物,但作为内务部长与最高苏维埃主席,他对斯大林式大规模流放负有责任,曾签署逮捕流放逾四万人的命令。德占时期他撤往莫斯科。他是被翻译最多的拉脱维亚作家。1966年2月6日去世。"
 CBIO_LAT_martinsh_penikis_desc:0 "马尔蒂·佩尼凯斯1874年11月6日生于库尔兰图尔拉瓦教区一个库洛尼亚\"国王\"后裔的自由农家庭。他1896年入俄罗斯帝国军队,1902年毕业于军校,参加日俄战争,经历过奉天会战,1913年考入尼古拉军事学院。第一次世界大战中他在加利西亚与克拉科夫一带作战负伤,1916年调入拉脱维亚步兵部队,任第二里加拉脱维亚步兵团团长,率部参加圣诞战役与尤格拉河战役。十月革命后他离开军队,在德占维德泽梅被拘。1918年12月他加入新建的拉脱维亚军队,独立战争中先后任库尔兰军区司令、利耶帕亚地区部队指挥官,贝尔蒙特进攻时出任第二维德泽梅步兵师师长兼南方战线指挥官。1928至1934年他任拉脱维亚军队总司令,获拉奇普莱西斯与三星勋章。二战德占期间,他拒绝出任新建拉脱维亚军团总监一职。1944年他曾避往德国,1945年选择返回苏占拉脱维亚,未遭镇压,此后从事军事史研究。1964年2月18日在里加去世,葬于森林公墓。"
 CBIO_LAT_hermanis_buks_desc:0 "赫尔曼·巴克1896年1月15日生于利沃尼亚的莱杜尔加教区。第一次世界大战期间他于1915年入俄罗斯帝国军队,先在近卫普列奥布拉任斯基团服役,随后入弗拉基米尔军校,1916年任第十九西伯利亚步兵团军官,1917年转入第一道加瓦格里瓦拉脱维亚步兵团。布尔什维克政变后他返回拉脱维亚,1918年12月志愿加入临时政府武装,在卡尔帕克斯指挥的部队中服役。独立战争后他长期留在拉脱维亚军队,历任骑兵团、军队参谋部与库尔兰师职务,并赴波兰进修骑兵与军事学,尤好马术。1939年夏他晋升将军,先后任军队参谋长助理与库尔兰师师长。他被记录为亲德倾向者,曾批评红军。1940年10月苏占当局解散拉脱维亚军队时,他被解除军职,退居里加与莱杜尔加的住所。1941年6月他被逮捕并押往莫斯科布蒂尔卡监狱。1942年8月18日在莫斯科去世。"
 CBIO_LAT_fricis_virsaitis_desc:0 "弗里奇斯·维尔萨特斯1882年11月14日生于布凯希教区一个雇工家庭,原姓埃尔特曼斯,1916年改姓维尔萨特斯。他1903年入俄罗斯帝国军队,参加日俄战争,1909年毕业于梯弗利斯军校,第一次世界大战中在俄军步兵团服役。独立战争中他任步兵团营长与教官营营长,1919年11月在伊曼塔一带对贝尔蒙特军作战中表现英勇,获拉奇普莱西斯军功勋章。此后他任第五采西斯步兵团团长,1923年晋升上校。他直接参与了乌尔马尼斯1934年5月的政变,同年晋升将军,任维德泽梅师师长兼里加卫戍司令,并主持军队教会理事会,为人虔诚。1940年7月苏占后他以年龄为由被令退役,迁居斯马尔德。1941年6月他被逮捕押往苏联,1942年11月被判八年监禁。1943年5月24日在维亚特拉格劳改营去世。"
 CBIO_LAT_andrejs_krustinsh_desc:0 "安德烈斯·库斯提斯1884年7月2日生于翁古尔穆伊扎教区一个农民家庭。他早年入俄罗斯帝国军队,1908年毕业于楚古耶夫军校,第一次世界大战中转入拉脱维亚步兵部队,1917年任第六图库姆斯步兵团团长。1918年12月他被编入红军的苏维埃拉脱维亚步兵旅任参谋长,1919年5月因被疑政治不可靠遭布尔什维克逮捕,9月越过战线逃回拉脱维亚,随即加入拉脱维亚军队,任第八道加瓦皮尔斯步兵团团长,参加对贝尔蒙特军及解放拉特加莱的战斗,获拉奇普莱西斯军功勋章。1925年他晋升将军,任库尔兰师师长,1933年起任拉特加莱师师长,并参与乌尔马尼斯1934年政变。1940年拉脱维亚军队被并入苏军第二十四领土军后,他改任第一八三师师长。1941年春他拒绝赴莫斯科受训,6月9日被捕,7月29日被判死刑,10月16日在莫斯科近郊被枪决。"
 CBIO_LAT_zhanis_bahs_desc:0 "贾尼斯·巴赫1885年10月6日生于库尔兰盖吉教区一个客栈主家庭。他1906年毕业于里加一所商业学校,后入圣彼得堡理工学院学冶金。第一次世界大战中他于1914年被动员入伍,一度短暂调入第二里加拉脱维亚步兵团,后入俄国总参谋部军事学院深造。1918年12月他加入拉脱维亚临时政府武装,任上尉,独立战争中因1919年10月解放里加的战斗表现获拉奇普莱西斯军功勋章。1920年他参与对苏俄和谈并任驻莫斯科军事代表,1921年因被指从事敌对活动被迫离开。1922年回国后他任维德泽梅师参谋长,1924年晋升上校,1936年晋升将军,任泽姆加莱师师长兼道加瓦皮尔斯卫戍司令。1940年苏占后他以红军中无合适职位为由被退役,转任里加一家工厂的计划员,同年12月被逮捕押往莫斯科布蒂尔卡监狱。1941年7月他因参与所谓反革命活动被判死刑,10月16日在莫斯科近郊被枪决。"
 CBIO_LAT_krisjanis_berkis_desc:0 "克里斯贾尼斯·贝基斯1884年4月26日生于库尔兰伊斯利采教区一个铁匠家庭。他1906年毕业于维尔纽斯军校,在赫尔辛基的第二芬兰步兵团服役,其间娶芬兰女子希尔玛·莱赫托宁为妻。第一次世界大战中他在东普鲁士与喀尔巴阡作战,参加过布鲁西洛夫攻势,1917年调入拉脱维亚步兵部队,任第六图库姆斯团团长,参加尤格拉河战役,十月革命后拒绝加入红军。1919年3月他辗转回国加入拉脱维亚军队,任第二采西斯步兵团团长,参加采西斯战役,后任拉特加莱师师长,1925年晋升将军。他是乌尔马尼斯1934年5月15日政变的主要参与者之一,1934至1940年任军队总司令,1940年春短暂出任战争部长。苏占后他被解职,携家人前往芬兰,却在返程途中于塔林被苏联当局逮捕并流放。1942年7月29日在彼尔姆的狱中医院去世。"
 CBIO_LAT_ludvigs_bolsteins_desc:0 "路德维希·博尔斯坦1888年2月5日生于塞萨瓦教区。他早年在圣彼得堡大学攻读物理数学,1907年毕业,1912年入俄罗斯帝国军队。第一次世界大战中他被动员,先在道加瓦格里瓦要塞服役,后参与组建拉脱维亚步兵营,在第一道加瓦格里瓦营中由准尉升至上尉。他拒绝加入红军,一度在莫斯科参加反布尔什维克组织,1918年12月返回拉脱维亚加入军队,任第九雷泽克内步兵团团长,在拉特加莱前线作战,获拉奇普莱西斯军功勋章。1920年退伍后他在利夫贝尔泽务农。1925至1928年他任民防组织护卫团首领,1928年起任拉脱维亚边防军司令,1935年晋升将军并领导边防旅。1940年苏军占领后,边防机构被解散,他不愿附敌,于6月21日在办公室开枪自尽。他在遗书中写道,拉脱维亚人为自己建起了国家这座新房子,如今异族强权却要逼他们亲手拆毁,对此他无法参与。他被安葬于兄弟公墓。"
 CBIO_LAT_kornelijs_veidnieks_desc:0 "科尼利厄斯·维德涅克斯1899年3月31日生于拉穆利教区,原姓维特曼斯,1940年拉脱维亚化改姓运动中改姓维德涅克斯。第一次世界大战期间他作为志愿者被派往加利西亚前线,布列斯特和约后回国,1919年1月参与组建采西斯连,一度被苏维埃拉脱维亚军俘虏,获释后参加解放拉特加莱的战斗,1922年复员。他在拉脱维亚大学攻读法律,1933年毕业。他自1924年起在司法部门任职,历任采西斯监狱与里加监狱管理职务,1934年起任司法部刑事政策司司长。1939年1月他出任拉脱维亚内政部长,任内整顿监狱制度、起草相关法律并推动地方自治改革,获三星勋章。1940年6月苏占后他被免职,7月被流放至苏联基洛夫,遭审讯,德国入侵苏联后又被押往维亚特拉格劳改营,并被判监禁。1942年1月12日在维亚特拉格因肺炎去世。"
 CBIO_LAT_fricis_celmins_desc:0 "弗里齐斯·采尔明什1896年8月17日生于利耶帕亚,也作采尔姆斯·采尔明什。第一次世界大战期间他于1915年加入第一道加瓦格里瓦拉脱维亚步兵营,1916年入莫斯科军校,1917年以准尉衔毕业。拉脱维亚宣布独立后,他于1918年12月加入军队,参加库尔兰的对布尔什维克作战与解放里加,因1919年的侦察行动获拉奇普莱西斯军功勋章。此后他长期在军中任职,1935年任第十一多贝莱步兵团参谋长,后调入军队参谋部情报部门,1939年晋升上校并出任军队参谋部情报部长,主管军事侦察与反侦察。他曾获取莫洛托夫里宾特洛甫条约秘密附件的情报并呈报乌尔马尼斯,冬季战争期间还与芬兰情报机关秘密合作。1940年6月苏占当日,他下令销毁情报部门全部档案,使苏方无从获取拉脱维亚的特工名单与机密。此后他屡遭苏联武官逼问,为不出卖部属,于1940年7月24日开枪自尽,是最后一位以军礼安葬于兄弟公墓的拉脱维亚军官,妻儿后逃往瑞典。"
 CBIO_LAT_rudolfs_kocins_desc:0 "鲁多尔夫斯·科钦斯1907年生于蒂尔扎。他1931年毕业于拉脱维亚军校,在通信营服役,1939年从高等军事学校毕业后留校任教官。1940年苏占后他离开军队。1941年6月德军进攻期间,他参加克里穆尔达的游击小组,同年11月自愿加入德方,被任命为东线第十六泽姆加莱营营长,1943年该营调往列宁格勒前线。此后他在里加参与组建拉脱维亚军团第十九师下辖的第四十四团,在奥斯特罗夫前线及退往维德泽梅的战斗中指挥,1944年3月晋升中校,参加了多贝莱一带的防御战与库尔兰历次大战。1945年1月他获授金质德意志十字勋章。他曾参与拉脱维亚民族委员会的组建,并于1945年4月成为利耶帕亚库尔兰人民议会的创办人之一,同年5月9日乘快艇撤离库尔兰。战后1948年他曾任一支配属英军的警卫队指挥官。1990年去世。"
 CBIO_LAT_arturs_sprogis_desc:0 "阿尔图斯·斯普劳吉斯1904年3月6日生于里加一个工人家庭。1919年他年仅十五岁便自愿加入拉脱维亚红色步兵,投身短命的苏维埃拉脱维亚政权,同时加入共青团。1920年他赴莫斯科受训,随后在红军中对弗兰格尔白军作战,1922年从军校毕业。此后他在边防部队服役,1928年入莫斯科的国家政治保卫总局边防学校深造,结业后被派往白俄罗斯苏维埃共和国内务人民委员部的反间谍特别科,任职至1936年。他随后作为特工被派赴西班牙内战,1937年回国后入伏龙芝军事学院。巴巴罗萨行动开始后,他在白俄罗斯与拉脱维亚组织反德游击活动,1943年起任拉脱维亚游击运动参谋长。著名的苏联女游击队员卓娅·科斯莫杰米扬斯卡娅曾在其领导的9903特别支队服役。战后他任拉脱维亚共产党中央委员会军事部部长,居于里加,四次获红旗勋章并获列宁勋章。1980年10月2日在莫斯科去世。"
 CBIO_LAT_tomas_spade_desc:0 "托马斯·斯帕德全名为特奥多尔斯·斯帕德,1891年3月7日生于文茨皮尔斯一个渔民家庭。他在里加理工学院攻读机械工程,1914年毕业,第一次世界大战爆发后被征入俄罗斯帝国波罗的海舰队,由候补军官升至鱼雷艇艇长,后在巴统的黑海舰队旅司令部任职,1917年在当地娶一名格鲁吉亚女子为妻。俄罗斯帝国瓦解后,他一度加入乌克兰人民共和国海军。1926年他加入拉脱维亚军队,1928年在法国海军学院受训,1931年起任拉脱维亚海岸防卫舰队司令,1933年晋升一级上校,1938年晋升海军上将并出任拉脱维亚海军司令,成为拉脱维亚历史上首位本族裔海军上将,亦擅诗歌与音乐。1940年苏占后他被解除军职,不到一年即被流放西伯利亚,在劳改营辗转多年,1954年获释却被禁止返回拉脱维亚,此后在哈萨克斯坦捷米尔套一家医院任会计。1970年7月25日在捷米尔套去世,1990年遗骸被迁回拉脱维亚重新安葬。"
 CBIO_LAT_teodors_zvejnieks_desc:0 "泰奥多尔·斯芙吉尼爱克是拉脱维亚独立时期的法律界人士与法官。他长期在司法法院任职,该院是对地区法院一审裁决的上诉审级法院;他曾任司法法院民事庭庭长,后出任司法法院院长代理。德国占领下的1944年3月17日,他在致拉脱维亚军团总监鲁道夫斯·邦格尔斯基斯的备忘录上署名,这份由一百八十八位拉脱维亚知名公众人物联署的文件反对布尔什维克与纳粹两种占领,呼吁在1922年宪法的基础上恢复独立的拉脱维亚。同年,在德占拉脱维亚地方自治机构中,他继阿尔弗雷德斯·瓦尔德马尼斯与前总统阿尔伯茨·克维耶西斯之后出任司法总监,主管占领体制下的司法行政事务。"
 CBIO_LAT_konstantins_cakste_desc:0 "君士坦丁·扎克全名为康斯坦丁斯·耶卡布斯·马尔格尔斯·恰克斯特,1901年7月26日生于布尔杜里,是拉脱维亚首任总统亚尼斯·恰克斯特的第六个孩子。他毕业于拉脱维亚大学法律专业,后在巴黎、布鲁塞尔与柏林深造,1931年通过特许任教资格后成为拉脱维亚大学民法学副教授,1938年前晋升为特级教授,主讲民法与商法,并曾任《法学家》杂志主编。德国占领开始后,他与多个民族抵抗团体建立联系,主张在1922年宪法基础上恢复独立、民主的拉脱维亚。1943年8月13日拉脱维亚中央委员会成立,他当选为主席,参与起草纲领、编辑地下刊物,并与流亡海外的拉脱维亚外交代表及爱沙尼亚、立陶宛的抵抗运动建立联络,是1944年3月17日中央委员会备忘录的签署人之一。1944年4月29日他被盖世太保逮捕,先后关押于里加、萨拉斯皮尔斯,后被押往施图特霍夫集中营。1945年2月,在集中营向劳恩堡撤离的死亡行军途中,他因病饿交加于波兰境内去世。"
 CBIO_LAT_rudolfs_kandis_desc:0 "鲁道夫·坎迪斯1901年6月3日生于里加,是末任拉脱维亚航空团团长。他1919年5月未满十八岁便自愿加入拉脱维亚临时政府武装,参加独立战争并负伤。此后他先后毕业于军校与航空学校成为飞行员,1926年指挥远程侦察中队,1928年赴法国进修,曾获最佳拉脱维亚飞行员巡回奖。1937年2月他出任航空团团长,获三星勋章。1940年6月苏军进驻时,作为团长他被迫下令飞机停飞、不作抵抗,同年12月被解职。德苏开战后,他力主组建拉脱维亚航空队对苏作战,未获德方批准,并曾于1941年7月在马多纳一带短暂指挥一支自卫队;他有一句常挂在嘴边的话:和平时期的军人在战时不能做和平之人。当德国情报机关欲招募会俄语的飞行员空投特工时,他识破其自杀性质,暗中传话给旧部一律不应征,果然无人报名。1942年2月他志愿赴东线任拉脱维亚联络军官。1942年5月28日夜,他在列宁格勒前线克拉斯诺耶谢洛附近一处德军司令部中中枪身亡,死因至今存疑,后以军礼安葬于里加兄弟公墓。"
 CBIO_LAT_arturs_silgailis_desc:0 "阿尔图斯·西尔盖利斯全名阿尔图斯·米哈伊尔斯·西尔盖利斯,1895年11月13日生于叶尔加瓦县彭库莱教区。第一次世界大战中他被征入俄罗斯帝国军队,后转赴芬兰并加入反布尔什维克的芬兰地下组织。1919年12月他加入拉脱维亚军队,成为职业军官,1939年晋升上校并任第四泽姆加莱步兵师参谋长。1940年苏占后他被解职,作为波罗的海德意志人移居德国,后随德军返回拉脱维亚,一度在列宁格勒前线作战。1942至1943年任德占拉脱维亚自治机构内政总局人事部主任。1943年他以旗队长衔出任拉脱维亚军团第十五党卫师参谋长兼步兵指挥官,晋升为上级旗队长,1944年夏出任拉脱维亚军团总监部参谋长,并参与了对库雷利斯集团的清算与审判。1945年2月他成为拉脱维亚民族委员会委员,任主席副职兼军事委员会主任。战后他曾为驻德英军工作,1953年移居加拿大,撰有《拉脱维亚军团》一书。1997年8月15日,他在加拿大奥沙瓦去世,享年一百零一岁。"
 CBIO_LAT_janis_berzins_desc:0 "亚尼斯·贝尔津什本名彼得里斯·库济斯,1889年11月13日生于劳济亚教区一个雇农家庭,是苏联军事情报机构的首脑。他早年投身1905年革命,被捕并一度被判死刑,因年幼改判、流放,几度越狱。俄国革命后他加入布尔什维克,在红军中升至将领,曾任拉脱维亚红军领导人,并参与国内战争时期的红色恐怖。1920年代起他长期执掌工农红军情报部门即后来的格鲁乌,建立起庞大的军事情报网络。1936年他化名格里申被派往西班牙内战,任共和国一方的首席军事顾问,1937年6月被召回莫斯科并短暂复任情报部门首脑。在大清洗针对拉脱维亚人的行动中,他于1938年5月13日被捕,同年7月29日在莫斯科被枪决,1956年获平反。"
 CBIO_LAT_janis_kaminskis_desc:0 "亚尼斯·卡明斯基斯1878年10月22日生于埃尔克什尼教区,是拉脱维亚的建筑工程师与公众人物。他曾参加第一次世界大战,是拉脱维亚学生联谊会塔拉维亚的创办人之一,通晓法语与德语。1921至1934年他任拉脱维亚国家监察部门负责人,1934年出任国家监察长。1939年10月至苏占前的1940年6月,他在卡尔利斯·乌尔马尼斯政府中担任财政部长,并获嘉奖十字勋章。1941年6月他被流放,1942年6月9日在苏联乌索利拉格劳改营、索利卡姆斯克附近被枪决。"
 CBIO_LAT_vilhelms_munters_desc:0 "威廉·芒特斯全名为戈塔尔兹·威廉·尼古拉·芒特斯,1898年7月25日生于里加,父亲是爱沙尼亚商人,母亲是来自爱沙尼亚的波罗的海德意志人。他早年就读于里加理工学院化学系,后长期在拉脱维亚外交部任职,1934年乌尔马尼斯政变后成为外交部的实际主持人,1936年7月正式出任外交部长直至1940年6月;他也是拉脱维亚在国际联盟的主要代表。1939年6月他在柏林签署德拉互不侵犯条约,同年10月又在莫斯科签署苏拉互助条约即基地条约,后者被苏联用作1940年占领拉脱维亚的依据。苏占后他被流放至沃罗涅日,1941年被捕,1952年被判二十五年徒刑并囚于弗拉基米尔,1954年提前获释,1959年获准返回拉脱维亚。此后他发表回忆录并撰写契合苏联口径、批评拉脱维亚流亡组织的文章,还被吸收进受克格勃控制的对外文化联络委员会。1967年1月11日他在里加去世。"
 CBIO_LAT_janis_sudrabkalns_desc:0 "亚尼斯·苏德拉布卡尔恩斯本名阿尔维兹·佩内,1894年5月17日生于因丘卡尔恩斯一个客栈租户兼教师家庭。他十岁开始写诗,1909年首次发表,自幼丧母,父亲去世后中断中学学业,靠自学成才。第一次世界大战中他于1915年被征入伍任卫生员,后进入拉脱维亚步兵报刊工作。战间期他成为拉脱维亚最重要的现代派诗人与文艺评论家之一,出版《生翼的舰队》《变形》等诗集,并以化名奥利维雷托发表诙谐诗作。1940年拉脱维亚并入苏联后,他积极转向支持苏维埃政权,成为最显要的拉脱维亚苏联诗人之一。1941年他撤往俄国,战时居于莫斯科,1944年秋返回拉脱维亚。战后他获拉脱维亚苏维埃社会主义共和国人民诗人称号、苏联国家奖,历任拉脱维亚保卫和平委员会领导、拉脱维亚共产党中央委员,1973年当选拉脱维亚科学院院士;其后期创作被认为因迎合意识形态而受损。1975年9月4日他在里加去世,葬于拉伊尼斯公墓。"
 CBIO_LAT_emilija_veinberga_desc:0 "埃米利娅·韦因贝加1896年12月14日生于里加,是拉脱维亚的共产党政治人物。她早年受训为护士,第一次世界大战期间在莫斯科工作。俄国革命后她成为共产党干部。1925至1931年她在土库曼从事党务,1928年被任命为阿什哈巴德的法官,成为土库曼首位女法官。1941年她出任拉脱维亚苏维埃社会主义共和国最高法院副院长,此后历任司法副人民委员、司法部副部长。1951至1959年她出任拉脱维亚苏维埃社会主义共和国司法部长,成为拉脱维亚历史上首位女性司法部长,也是首位正职而非副职的女性内阁部长。1989年9月5日她去世。"
 CBIO_LAT_janis_rudzutaks_desc:0 "亚尼斯·鲁祖塔克斯1887年8月15日生于库尔兰省一个雇农家庭,是拉脱维亚裔的布尔什维克革命者与苏联政治家。他十六岁到里加做工,1905年加入拉脱维亚社会民主工党,领导文茨皮尔斯党组织,1907年被捕并判处苦役,二月革命后获释。此后他在党与工会系统步步高升,1920至1921年任全俄工会中央理事会总书记,1924至1934年任交通人民委员,1926年起任苏联人民委员会副主席即副总理直至1937年,并于1926至1932年间为联共(布)中央政治局委员,后主管中央监察委员会。据米高扬回忆,列宁临终前曾提议由他接替斯大林出任总书记。1937年5月他被逐出政治局并遭逮捕,历经酷刑,1938年7月29日经二十分钟审判后在莫斯科被枪决,1956年获平反。"
 CBIO_LAT_karlis_baumanis_desc:0 "卡尔利斯·鲍曼尼斯1835年5月11日生于维尔克内一个农民家庭,通称鲍曼纽·卡尔利斯,笔名阿科,是俄罗斯帝国治下的拉脱维亚作曲家、教师与政论家。他是首位拉脱维亚族裔的专业原创音乐作曲家,也是拉脱维亚国歌《上帝保佑拉脱维亚》词曲的作者——这首歌起初是民众传唱的颂歌,后成为拉脱维亚国歌,而他也是19世纪首位在歌词中使用拉脱维亚一词的作曲家。他是新拉脱维亚人社会运动的活动家、民族觉醒运动的先驱之一,长期在林巴济担任教师与记者,创作了两百七十余首歌曲,并为首届全拉脱维亚歌咏节的筹备出力甚多。1935年,林巴济的旧集市广场以他的名字命名。1905年1月10日他在林巴济去世,享年六十九岁。"
 CBIO_EST_konstantin_pats_desc:0 "佩茨1874年2月23日生于派尔努县塔库兰纳，毕业于塔尔图大学法学系。1901年创办爱沙尼亚语报纸《特亚塔亚报》，逐渐成为民族政治运动的重要人物，并与亚安·托尼森形成延续数十年的政治竞争。1905年革命后，他被沙俄军事法庭缺席判处死刑，先后流亡瑞士和芬兰，回国后又遭监禁。1918年2月24日，他作为救国委员会三名成员之一参与发布爱沙尼亚独立宣言，随即出任临时政府总理。此后在议会制时期五度担任国家长老。1934年3月12日，佩茨在总司令约翰·莱多纳支持下发动政变，以紧急状态取缔自由战士运动并拘捕反对派，开始所谓“沉默时代”的威权统治。1938年，他依据新宪法当选爱沙尼亚首任总统。1940年苏联占领爱沙尼亚后，他被迫签署亲苏政府提交的命令，7月与家人被押往乌法，此后长期遭苏联拘禁，1956年1月18日在加里宁州布拉舍沃精神病院去世。"
 CBIO_EST_artur_sirk_desc:0 "西尔克1900年9月25日生于耶尔瓦县一个农民家庭。爱沙尼亚独立战争爆发时，他还是学生，随即志愿入伍；战后进入塔尔图大学学习法律，1926年离开军队后从事律师工作。1929年，他参与建立集中化的爱沙尼亚自由战士中央联盟，首任主席为恩斯特·珀德尔将军；安德烈斯·拉卡后来成为运动的名义领袖和总统候选人，西尔克则长期负责组织与宣传，是实际核心人物。他擅长演说和群众动员，使自由战士运动迅速发展为具有准军事色彩的激进民族主义力量。1933年，该运动推动的宪法修正案在全民公投中通过，一度接近取得政权。1934年佩茨发动政变后，西尔克被捕，后来越狱逃往芬兰，并与芬兰极右翼人士策划推翻佩茨政府。计划败露后，他辗转至卢森堡。1937年8月2日，西尔克因从埃希特纳赫一家旅馆窗口坠落造成的伤势去世。当地警方认定其自杀，部分爱沙尼亚人士则长期指称佩茨政府特工参与其中。"
 CBIO_EST_jaan_anvelt_desc:0 "安维尔特1884年4月18日生于维尔扬迪县沃伊西库堂区一个农民家庭，求学期间加入俄国社会民主工党布尔什维克派。1917年十月革命期间，他参与领导布尔什维克在塔林夺取政权，随后出任爱沙尼亚苏维埃执行委员会主席。德军进占爱沙尼亚后，他退往苏俄；1918年末又在纳尔瓦主持建立爱沙尼亚劳动人民公社，成为该政权的主要领导人。公社失败后，安维尔特转入地下并从事革命宣传，以“埃萨雷·阿杜”等笔名写作。他是1924年12月1日爱沙尼亚共产党武装政变的主要组织者之一，政变失败后于次年返回苏联，先后在茹科夫斯基空军工程学院、民用航空总局和共产国际任职。1937年斯大林大清洗期间，他遭内务人民委员部逮捕，并于12月11日在审讯中被殴打致死，随后被宣布为“人民公敌”。1956年，安维尔特获苏联当局平反。"
 CBIO_EST_johannes_kabin_desc:0 "卡宾1905年9月24日生于爱沙尼亚维鲁县卡尔维，幼年随家人迁往俄罗斯，在俄语环境中成长。1920年代加入共青团和共产党，后在列宁格勒、鄂木斯克等地从事党务工作，并曾在莫斯科任教。二战后，他被派回爱沙尼亚，先后担任爱沙尼亚共产党中央宣传鼓动部门副负责人、党中央书记等职。1950年3月，在清洗所谓“资产阶级民族主义分子”的第八次全会上，他接替尼古拉·卡罗塔姆出任爱沙尼亚共产党第一书记，此后掌权二十八年。卡宾早期执行强硬的斯大林主义路线，斯大林死后逐渐转向较为务实的治理方式，但始终致力于巩固苏维埃体制。1978年，他被更亲近莫斯科的卡尔·瓦伊诺取代，随后转任爱沙尼亚最高苏维埃主席团主席，1983年退休。爱沙尼亚恢复独立后，他加入社会民主劳动党，1999年10月25日在塔林去世。"
 CBIO_EST_jaan_tonisson_desc:0 "托尼森1868年12月22日生于维尔扬迪县，毕业于塔尔图大学法律系。1890年代起，他主持《邮差报》，将其发展为爱沙尼亚民族运动的重要舆论阵地，并长期反对沙俄的俄化政策。1906年，他当选俄国第一届国家杜马议员。爱沙尼亚独立后，托尼森两度出任总理，又于1927至1928年和1933年担任国家长老，1931至1932年任外交部长。他强调民族文化、议会政治和法治，与更重视经济组织和行政权力的佩茨形成延续数十年的政治竞争。1934年佩茨发动政变后，托尼森成为少数公开反对威权统治的资深政治家之一。1940年苏联占领爱沙尼亚后，他于当年秋季被内务人民委员部逮捕，在审讯中拒绝认罪，也没有供出其他反苏政治人物。现有证据表明，他很可能于1941年7月初在塔林被处决。"
 CBIO_UBD_sophie_buxhoeveden_desc:0 "布克斯赫韦登女男爵1883年9月6日生于圣彼得堡，出身波罗的海德意志贵族家庭。父亲卡尔·马蒂亚斯·布克斯赫韦登男爵一战期间任俄国驻哥本哈根公使。索菲1904年成为荣誉侍女，1913年成为正式宫廷侍女，是末代皇后亚历山德拉及其女儿们身边的亲近随员，皇室成员称她为“伊萨”。1917年革命后，她随皇室被流放至托博尔斯克，后来获布尔什维克释放，并经西伯利亚辗转离开俄国。流亡期间，她先后居住于丹麦、德国和英国。1922年安娜·安德森在柏林自称罗曼诺夫大公女时，索菲亲自会见并否认其身份。她后来撰写三部关于俄国皇室及自身逃亡经历的回忆录，成为研究罗曼诺夫皇室末期生活的重要见证材料。晚年她居住在英国王室提供的肯辛顿宫寓所，1956年11月26日在英国去世。"
 CBIO_EST_andres_larka_desc:0 "拉卡1879年3月5日生于维尔扬迪县皮利斯特韦雷，1902年毕业于维尔纽斯军校，参加了日俄战争，1912年毕业于圣彼得堡尼古拉军事学院后投入第一次世界大战东线战场。1918年出任爱沙尼亚共和国首任国防部长并晋升少将。独立战争期间转任参谋长，负责动员与后备部队组织工作。1925年因健康原因退役。1930年拉卡出任自由战士中央联盟主席，成为运动的名义领袖和总统候选人，但运动的实际推动力量是其副手阿蒂尔·西尔克。1934年3月佩茨判断拉卡极可能赢得即将举行的总统选举，遂发动政变宣布紧急状态，拉卡与约四百名支持者一同被捕。此后他两度入狱，1937年获佩茨赦免后隐居农庄。1940年苏联占领爱沙尼亚，拉卡再遭逮捕并被流放，1943年1月8日死于基洛夫州马尔梅日监狱。"
 CBIO_EST_herbert_brede_desc:0 "布雷德1888年4月25日生于哈留县普西，在圣彼得堡实科学校完成普通教育后进入米哈伊尔炮兵学校深造。一战中他在俄国帝国军第5猎兵炮兵师和第100炮兵团服役。1918年1月以上尉军衔回到爱沙尼亚。独立战争中布雷德参与组织国防联盟和炮兵部队，获授自由十字勋章一等二级。战后他长期任职于爱沙尼亚军事教育系统，1923年起担任参谋课程（后更名为国防军联合军事学院）校长。1932年晋升少将，1933年出任第1师师长，后转任第3师师长。1940年苏联占领爱沙尼亚后，布雷德被编入苏军第22领土步兵军。1941年6月苏德战争爆发，布雷德遭内务人民委员部逮捕，先被关押在拉马特别营，1942年1月被空运转往诺里尔斯克监狱，1942年10月6日在诺里尔斯克被处决。"
 CBIO_EST_otto_heinze_desc:0 "海因茨1877年3月11日生于圣彼得堡省科特雷，德裔。1905年毕业于奥拉宁鲍姆军校后加入俄国帝国军，一战中先后在东普鲁士、喀尔巴阡山脉、立陶宛及西南方面军服役。1918年12月从白俄罗斯北方军转入爱沙尼亚军队，独立战争中先任第1步兵团团长，后升任第1师师长助理，继而接任师长，1920年晋升少将。战后在国防部任职，并两度出任第1师师长，1936年退役。1941年海因茨因妻子有德裔血统而移居德国，得以躲过苏联占领期间对爱沙尼亚军官的大规模逮捕和处决，1968年6月8日在巴伐利亚巴特温茨海姆去世，享年九十一岁。"
 CBIO_EST_aleksander_jaakson_desc:0 "雅克松1892年1月29日生于瓦尔加县霍尔德雷堂区一个庄园工人家庭，先后在乡村学校和塔尔图教师学院学习，毕业后在图里担任小学教师。一战爆发后应征入伍，在彼得格勒军校受训后赴东线作战，1916年3月负伤，晋升至参谋上尉。1917年回到爱沙尼亚加入民族后备营。独立战争中他参与组建第6步兵团和耶尔瓦县国防联盟。战后留在军中，先后在参谋部任职并赴法国高等军事学院深造，1933年出任爱沙尼亚国防学院院长。1936年雅克松在塔尔图大学法学院以优等成绩毕业后被任命为教育部长，任内推动制定大学法、将塔尔图大学工学院迁至塔林成立塔林理工大学，并于1938年创建爱沙尼亚科学院。1939年10月转任参谋长，1940年2月晋升少将。苏联占领后被免职，同年10月在农场被内务人民委员部逮捕，1942年10月2日死于基洛夫州劳改营。"
 CBIO_EST_johan_laidoner_desc:0 "莱多纳1884年2月12日生于维尔扬迪县维拉齐，出身贫寒，少年时即志愿加入俄国帝国军队，先后就读维尔纽斯军校和圣彼得堡尼古拉军事学院，参加了第一次世界大战。1917年俄国革命后指挥爱沙尼亚民族军事单位。1918年12月被临时政府任命为武装部队总司令，在独立战争中以不足两万之众对抗苏俄红军，仅用十一天便将敌军逐出国境，善用装甲列车和小规模机动部队的战术令他声名大振。战后晋升中将，代表爱沙尼亚出席国际联盟，并于1924年再度出任总司令平息共产主义政变企图。1934年莱多纳支持佩茨发动自我政变，第三次担任总司令直至1940年。苏联占领爱沙尼亚后，莱多纳被剥夺职务并流放至俄罗斯奔萨。苏德战争爆发后遭逮捕入狱，1953年3月13日死于弗拉基米尔中央监狱。"
 CBIO_EST_juhan_tuuling_desc:0 "图林1897年4月12日生于萨雷马岛库雷萨雷，原名约翰内斯·图林。1915年应征入伍，1916年毕业于奥拉宁鲍姆军校，一战中在里加前线服役。独立战争期间他在阿尔汉格尔斯克的爱沙尼亚军团中作战，后在爱沙尼亚国防军中长期任职，历任军事学校连长、第7步兵团营长。1938年改任卫戍营营长。1940年晋升上校。二战中德国占领爱沙尼亚后，图林加入武装党卫军，获旗队长军衔，出任武装党卫军第20（爱沙尼亚第1）掷弹兵师第43志愿掷弹兵团团长，后该团改编为第46武装掷弹兵团。图林率部参加了纳尔瓦前线的战斗。据部下回忆，图林性格沉稳温和，更像学者而非职业军人，每天清晨会到前线与士兵交谈，因其平和的个性而受到部下的爱戴。战后图林流亡丹麦，1946年10月23日在哥本哈根去世。"
 CBIO_EST_alfons_rebane_desc:0 "列巴涅1908年6月24日生于瓦尔加，父亲是铁路职员。1926至1929年就读爱沙尼亚军事学院，毕业后在国防军担任步兵军官。1940年苏联占领爱沙尼亚、国防军被改编后，他离开军队；1941年苏德战争爆发后组织反苏武装，随后加入德军中的爱沙尼亚部队。1944年，他转入武装党卫军第20爱沙尼亚师，先后指挥第45和第47武装掷弹兵团，参加纳尔瓦、埃马约吉河及德国境内战斗，获骑士铁十字勋章及橡叶饰。因姓氏“Rebane”在爱沙尼亚语中意为狐狸，其部下常被称为“狐狸崽”。战后他进入英国军情六处，负责“丛林行动”中的爱沙尼亚部分，协助向波罗的海地区派遣反苏特工。1961年退出情报工作后定居西德，1976年3月8日在奥格斯堡去世。1999年，其遗骸被迁葬爱沙尼亚并获得国家礼遇，由于他曾在武装党卫军服役，此事引发持续争议。"
 CBIO_EST_alfred_vendt_desc:0 "芬特，又作Alfred Wendt，是二战德国占领爱沙尼亚期间（1941至1944年）爱沙尼亚自治政府的经济与交通局长。爱沙尼亚自治政府由德国军事当局设立，隶属于东方总督辖区下设的爱沙尼亚总管区，在名义上依据爱沙尼亚共和国法律行使职权，实际受制于德国占领当局。芬特主管经济和交通事务，据当时爱沙尼亚政治警察的报告，他的工作在民众中获得了相当的正面评价。爱沙尼亚国际人道主义犯罪调查委员会认定，包括芬特在内的自治政府全体高级官员凭借其职务身份，对德国占领期间在爱沙尼亚境内及爱沙尼亚军事单位在境外实施的一切犯罪行为负有连带责任。"
 CBIO_EST_richard_tomberg_desc:0 "通贝格1897年9月6日生于维鲁县萨拉堂区莫伊萨马。1915年志愿加入沙俄军队，翌年毕业于维尔纽斯军校，一战期间在俄军服役；1917年转入爱沙尼亚民族部队，后来参加独立战争。战后他继续在爱沙尼亚军中深造，并赴法国高等军事学院学习。1928年任空军参谋长，1930年升任空军司令，主持爱沙尼亚空军建设十年。1940年苏联占领爱沙尼亚后，他被编入苏军。1944年，通贝格遭内务人民委员部逮捕，以反苏活动等罪名被判处二十五年监禁和五年流放。1956年，他获释并得到平反，是少数熬过苏联镇压的爱沙尼亚高级军官之一。此后他在塔林从事民用工作，1982年5月25日在塔林去世。"
 CBIO_EST_leo_sepp_desc:0 "泽普1892年11月7日生于维鲁县锡穆纳，兼具政治家、银行家和作家的多重身份。1921至1924年任爱沙尼亚银行行长兼董事，1924至1927年出任财政部长。离开政界后转入实业，1933至1938年任波罗的海棉纺厂厂长。1937年他以笔名雷因·萨尔韦萨雷创作了戏剧《卡乌波》，由爱沙尼亚学术艺术家协会出版。1938至1940年他再度入阁担任经济事务部长。1940年苏联占领爱沙尼亚后泽普遭逮捕，被押送至俄罗斯，1941年12月13日死于彼尔姆州索利卡姆斯克。"
 CBIO_EST_nikolay_g_karotamm_desc:0 "卡罗塔姆1901年10月23日生于派尔努一个木匠家庭，1921年曾在爱沙尼亚国防军服役。1925年移居荷兰并加入荷兰共产党，次年赴苏联，在西方少数民族共产主义大学学习。1928年，他被派回爱沙尼亚重建地下共产党组织，翌年返回苏联，毕业后留校任教并从事出版工作。苏德战争爆发后，爱沙尼亚共产党原负责人卡尔·萨雷被德军俘获，卡罗塔姆接任党组织领导。1944年苏军重新进占爱沙尼亚后，他正式出任爱沙尼亚共产党第一书记，主持战后初期的苏维埃化、集体化和政治清洗。1949年大规模驱逐之后，他被批评对所谓“资产阶级民族主义”打击不力，1950年被撤销职务。此后卡罗塔姆迁居莫斯科，在苏联科学院经济研究所从事研究并取得经济学博士学位，1969年9月21日在莫斯科去世。"
 CBIO_EST_boris_kumm_desc:0 "库姆1897年9月1日生于派尔努，1919至1920年参加了爱沙尼亚独立战争。1923年他加入非法的爱沙尼亚共产党并当选为国会议员，1924年共产党被取缔后被捕并被判处十五年苦役。1938年获大赦后在派尔努组织共产党地方活动。1940年苏联占领爱沙尼亚后，库姆出任爱沙尼亚苏维埃内务人民委员。1941年改任国家安全人民委员，德军占领期间逃往莫斯科继续在国家安全系统工作。1944年苏军收复爱沙尼亚后，库姆再度出任国家安全人民委员（1946年后改称国家安全部长），直至1950年。他在任期间主持实施了斯大林主义镇压政策，包括1949年三月大驱逐等行动。1945年库姆获授苏军少将军衔，并先后获得红星勋章、红旗勋章和一级卫国战争勋章。库姆同时担任爱沙尼亚共产党中央委员会委员和苏联最高苏维埃代表，1958年11月21日在塔林去世。"
 CBIO_EST_august_rei_desc:0 "雷伊1886年3月22日生于维尔扬迪县皮利斯特韦雷堂区库尔拉村，在圣彼得堡大学攻读法律期间翻译了拉萨尔、考茨基等社会主义理论家的著作。1905年革命中他参与组织巡洋舰水兵起义，后以地下身份为社会民主党工作。一战期间在圣彼得堡要塞任炮兵军官。1918年独立后历任劳工与社会福利部长、副总理。1919至1920年任制宪议会主席，主持起草了爱沙尼亚第一部宪法。此后长期代表社会民主工人党活跃于议会，1928至1929年出任国家长老，1932至1933年任外交部长，1938年被任命为驻苏联大使。1940年6月苏联占领波罗的海三国后，雷伊从莫斯科经里加辗转逃往斯德哥尔摩。1945年乌卢奥茨病逝后，雷伊以总理身份代行总统职权，主持爱沙尼亚流亡政府直至1963年3月29日在斯德哥尔摩去世。"
 CBIO_EST_august_jakobson_desc:0 "雅各布孙1904年9月2日生于派尔努近郊一个工人家庭，先后在塔尔图大学学习经济学和医学，但均未毕业，后来成为职业作家。1927年，他的处女作长篇小说《穷罪人村》在出版社小说竞赛中获奖，使其在爱沙尼亚文坛成名。1930年代，他持续发表小说和戏剧，1939至1940年担任爱沙尼亚作家联盟主席。苏联占领后，雅各布孙转向苏维埃阵营，1942年加入共产党。其1946年剧作《城堡中的生活》以鲜明的斯大林主义立场获得官方推广，在苏联各加盟共和国和东欧多次上演并被改编为电影。他由此成为苏联爱沙尼亚官方文坛的代表人物之一。1950至1958年，雅各布孙任爱沙尼亚苏维埃最高苏维埃主席团主席，并兼任苏联最高苏维埃主席团副主席。1963年5月23日，他在塔林去世。"
 CBIO_EST_juri_uluots_desc:0 "乌卢奥茨1890年1月13日生于莱内县基尔布拉堂区，在圣彼得堡大学攻读法学后任塔尔图大学罗马法与爱沙尼亚法教授兼法学院院长，同时活跃于新闻界，先后主编《卡亚报》与《邮差报》。他曾多次当选国会议员，1938年起任下院议长，1939年10月接替埃恩帕卢出任总理。1940年6月苏联入侵后，佩茨遭逮捕流放，乌卢奥茨依宪法以总理身份代行总统职权。德军占领期间，他拒绝出任德国傀儡机构负责人，转入地下抵抗运动。1944年1月苏军逼近爱沙尼亚边境，乌卢奥茨发表广播讲话号召爱沙尼亚适龄男性应征入伍。同年9月德军撤退之际，他任命奥托·蒂夫组建合法政府，在苏军抵达前短暂恢复爱沙尼亚国旗于托姆比亚城堡上空。蒂夫政府旋即被迫撤离，残余成员流亡斯德哥尔摩延续流亡政府至1992年。乌卢奥茨本人流亡瑞典后不久，于1945年1月9日病逝。"
 CBIO_EST_viktor_puskar_desc:0 "普斯卡尔1889年5月7日生于维尔扬迪，1911年毕业于维尔纽斯军校，一战中在俄军服役，1917年转入爱沙尼亚民族军事单位。独立战争爆发时他是耶尔瓦县国防联盟指挥官，1918年12月起出任南线第2师师长。在他果敢坚定的指挥下，爱沙尼亚军队成功保卫了东南部国土，将红军逐出北拉脱维亚并一度攻占普斯科夫，这一战功为他赢得了自由十字勋章一等一级。1920年战争结束后普斯卡尔以上校军衔退役务农。1930年代他加入自由战士运动成为领导人之一，1936至1937年因地下活动罪名入狱。1941年前往德国，待红军被驱出后返回爱沙尼亚，1943年4月12日在塔尔图去世。"
 CBIO_EST_voldemar_voolman_desc:0 "沃尔曼1887年生于爱沙尼亚，是布尔什维克革命时期塔林的重要政治人物。1917年他作为布尔什维克派系成员当选塔林市政委员会委员，与亚安·安维尔特同在该委员会中活动。十月革命后，沃尔曼当选为塔林市政府主席，在爱沙尼亚共和国宣告成立和俄罗斯帝国解体的动荡时期主持塔林市政。1918年3月德国军队占领塔林后，沃尔曼辞去职务，由德方指定的市长取而代之。1937年6月14日沃尔曼去世，正值斯大林大清洗高峰期。"
 CBIO_EST_henrik_allik_desc:0 "阿利克1901年3月15日生于爱沙尼亚，少年时期在波罗的海棉纺厂工作，同时为工人报刊撰稿。1920年代，他加入爱沙尼亚共产党并当选议会议员。1924年针对共产党人的大审判中，阿利克被判处终身苦役，在狱中仍参与地下报刊编辑。1940年苏联占领爱沙尼亚后，他获释并出任工商人民委员。1941年德军进攻时，他随苏方撤往俄罗斯，后来担任苏军第八爱沙尼亚步兵军政治委员，参加大卢基、涅韦尔等地战斗。战后阿利克任爱沙尼亚部长会议副主席。1950年党内清洗期间，他因与卡罗塔姆关系密切而被撤职，随后被判处二十五年监禁并流放西伯利亚。1955年获释回到爱沙尼亚，1965年重新担任部长会议副主席，直至1973年退休。1989年5月8日去世。"
 CBIO_EST_johan_pitka_desc:0 "皮特卡1872年2月19日生于耶尔瓦县亚尔格塞马，先后就读凯斯穆、库雷萨雷和帕尔迪斯基海事学校，取得远洋船长资格后长期从事航海和航运业务，1904至1911年间曾在英国经营航运经纪公司。1917年俄国革命后，他回到爱沙尼亚，组织塔林自卫武装，后来发展为国防联盟。独立战争爆发后，皮特卡主持改装和组建装甲列车部队，这些部队在早期作战中发挥了重要作用。1918年12月，他被任命为海军司令，指挥海军支援沿海和陆上作战，1919年晋升海军少将。退役后，他曾于1924至1930年移居加拿大不列颠哥伦比亚省，尝试建立爱沙尼亚移民定居点。1940年苏联占领爱沙尼亚后，他流亡芬兰。1944年，年逾七旬的皮特卡秘密返回爱沙尼亚，组织不受德军直接指挥的武装部队，并在德军撤退期间与苏军作战。1944年9月，他在莱内县一带失踪。"
 CBIO_EST_hjalmar_mae_desc:0 "梅1901年10月24日生于哈留县科塞堂区图哈拉，曾在柏林、维也纳和因斯布鲁克求学，先后获因斯布鲁克大学地球物理学博士和格拉茨大学宪法学博士学位。1930年代初投身爱沙尼亚政治，加入自由战士运动并任宣传主管。1934年佩茨发动政变后梅与其他自由战士领导人一同被捕，1935年因密谋以武力推翻政府罪被判处二十年苦役，1938年获大赦后移居纳粹德国，在柏林与第三帝国高层建立联系。1941年9月15日德国军事当局任命梅为爱沙尼亚自治政府首席局长，该机构隶属于东方总督辖区下设的爱沙尼亚总管区，是德国占领期间的傀儡行政机构。梅在任期间自视甚高，但在普通爱沙尼亚民众中极不受欢迎，被普遍视为投机分子。1944年9月自治政府随德军撤出爱沙尼亚，1945年1月正式解散。梅战后流亡奥地利，1978年4月10日在格拉茨去世。"
 CBIO_PRU_manuel_prado_ugarteche_desc:0 "曼努埃尔·普拉多·乌加特切1889年4月21日生于利马，父亲马里亚诺·伊格纳西奥·普拉多曾任秘鲁总统。他受过工程和军事教育，1914年参与奥斯卡·贝纳维德斯推翻比林格斯特政府的政变，后来因政治活动遭监禁和流放。1930年代回国后，普拉多进入金融界，先后担任秘鲁中央储备银行总经理和行长。1939年，他当选总统。其首届任期内，秘鲁在1941年对厄瓜多尔战争中取得军事优势，并于次年签署《里约议定书》；第二次世界大战期间，普拉多政府与轴心国断交，并配合美国将大量日裔秘鲁居民遣送至美国拘禁。1945年卸任后，他一度居住海外。1956年，普拉多再次当选总统，执政期间恢复阿普拉党的合法政治活动，但经济困难和1962年选举争议加剧了军政冲突。1962年7月，军方发动政变将其推翻。此后他流亡巴黎，1967年8月15日去世。"
 CBIO_PRU_rafael_escardo_desc:0 "埃斯卡多1883年生于皮斯科，毕业于利马农业学校，取得农业工程师学位。他长期活跃于秘鲁实业界，曾任多家农业、水泥和电影企业董事，并担任秘鲁工程师协会及农牧业协会主席。埃斯卡多还曾主持利马公共福利会，参与社会救济事务管理。1937年，在奥斯卡·贝纳维德斯总统任内，他出任公共卫生、劳工与社会救助部长，负责秘鲁公共卫生行政事务。因公共服务贡献，他获授秘鲁太阳勋章。"
 CBIO_PRU_alberto_lopez_flores_desc:0 "洛佩斯·弗洛雷斯是秘鲁陆军上校。1948年10月，曼努埃尔·奥德利亚发动军事政变，推翻布斯塔曼特政府并组建军政府；洛佩斯随后出任公共卫生与社会救助部长，成为军政府内阁成员之一。"
 CBIO_PRU_felipe_tudela_desc:0 "图德拉1915年9月3日生于利马米拉弗洛雷斯区，出身秘鲁政治世家，父亲弗朗西斯科·图德拉曾任秘鲁总理。他在圣马科斯国立大学攻读法律并成为宪法学教授，1937至1939年赴哈佛大学攻读硕士学位。归国后进入外交界，出任秘鲁驻西班牙大使馆三等秘书。1951至1953年他出任秘鲁驻巴西大使。1959年图德拉当选圣伊西德罗区区长，此后四度连任至1962年，任内创建瓦亚马尔卡遗址博物馆，并长期担任秘鲁族谱研究所成员。图德拉晚年因家产纠纷卷入长期法律诉讼，2017年11月4日在利马去世，享年一百零二岁。"
 CBIO_PRU_luis_ramirez_ortiz_desc:0 "拉米雷斯·奥尔蒂斯是秘鲁陆军上校。1948年10月27日，曼努埃尔·奥德利亚发动政变推翻布斯塔曼特政府并组建军政府，拉米雷斯·奥尔蒂斯随后出任财政与商务部长，与其他军人内阁成员共同主持国家行政。"
 CBIO_PRU_oscar_benavides_larrea_desc:0 "贝纳维德斯1876年3月15日生于利马，毕业于由法国军事使团执教的军事学院。1914年他发动秘鲁史上首次建制性军事政变推翻比林格斯特，任临时总统至1915年。此后历任驻西班牙、意大利公使，1921年遭莱吉亚总统逮捕流放，途中夺船改道逃亡。1933年桑切斯·塞罗遇刺后，他继任总统完成余期，签署新宪法并取缔阿普拉党与共产党，1934年与哥伦比亚缔结和平协议。1936年大选因阿普拉党候选人可能获胜而被宣布作废，其任期延长三年，推行公路与港口建设。1939年移交权力后获授大元帅军衔，1945年7月2日在利马去世。"
 CBIO_PRU_manuel_odria_amoretti_desc:0 "奥德利亚1897年11月26日生于塔尔马，1915年考入乔里约斯军事学院。1941年厄瓜多尔—秘鲁战争中，他作为军官参与萨鲁米亚一带作战，由此声名上升。1947年，奥德利亚出任布斯塔曼特政府的政府与警察部长，后因如何处置阿普拉党问题与总统发生分歧并辞职。1948年10月，他发动军事政变，自任临时总统，解散议会并建立军人政权。1950年，他在缺乏有效竞争的选举中当选总统，执政期间推行公共工程和社会福利政策，同时严厉压制阿普拉党及其他反对力量。1956年，奥德利亚结束任期并恢复部分政治活动空间。1962年他再次参加总统选举，随后支持军方阻止选举结果生效。1974年2月18日，他在利马去世。"
 CBIO_PRU_paul_de_beaudiez_desc:0 "布尔迪兹是秘鲁早期军事航空人员。1920年1月5日，为庆祝新宪法颁布，秘鲁军方组织飞机编队飞越利马。布尔迪兹与沙布里耶中尉驾驶一架考德隆G.3双翼机从贝拉维斯塔机场起飞，飞机在低空转弯爬升时失速坠毁，两人均在事故中死亡。这次事故成为秘鲁军事航空草创时期的重要伤亡事件之一。利马圣伊西德罗区后来有街道以布尔迪兹命名。"
 CBIO_PRU_alberto_roque_saldias_desc:0 "萨尔迪亚斯1892年5月5日生于委内瑞拉巴伦西亚，幼年随家人返回秘鲁。1908年进入秘鲁海军学校，1912年毕业。1915年，他随秘鲁海军人员赴法国接收军舰。此后长期在海军服役，并先后在贝纳维德斯、布斯塔曼特和奥德利亚政府中担任要职，两度出任部长会议主席，还多次担任海军部长、卫生部长及财政与商务部长。任海军部长期间，他推动创建海军战争学院、国营造船体系、海军医疗设施、潜艇基地和卡亚俄干船坞，对秘鲁海军现代化和本国造船工业建设产生重要影响。1974年5月17日，他在贝拉维斯塔海军医疗中心去世。"
 CBIO_PRU_eloy_g_ureta_desc:0 "乌雷塔1892年12月12日生于奇克拉约，1913年毕业于乔里约斯军事学院，后赴意大利、法国深造军事。1941年厄瓜多尔-秘鲁战争爆发，他晋升准将出任北方军团总司令，7月30日指挥步兵在装甲车支援下攻入厄瓜多尔阿雷尼利亚斯城，为秘鲁陆军首次实战使用装甲兵器。1944年退役后历任省长与陆军总监察长。1945年他代表爱国独立军团参选总统，败于布斯塔曼特。1946年国会授予其大元帅荣誉军衔，表彰其战功，他也是秘鲁军事史上最后一位获此殊荣者。1949至1955年出任驻西班牙大使，1965年10月10日在马德里去世，遗体运回利马安葬。"
 CBIO_PRU_oscar_miro_quesada_desc:0 "米罗·克萨达1884年7月30日生于利马，笔名“拉斯科”，出身拥有《商报》的秘鲁报业家族。他毕业于圣马科斯国立大学，取得人文学科和法学博士学位，青年时期即开始在《商报》撰写科普与评论文章，内容涉及心理学、哲学和现代物理学。此后他在圣马科斯大学任教，并参与犯罪学和人类学研究。1940年，他出版介绍相对论与量子理论的著作，长期致力于向西班牙语读者普及现代科学思想。米罗·克萨达还曾加入多个学术机构，是秘鲁二十世纪重要的新闻工作者、教育者和科普作者。1981年在利马去世。"
 CBIO_PRU_jose_bustamante_y_rivero_desc:0 "布斯塔曼特1894年1月15日生于阿雷基帕，法学家、外交官和政治家。早年任大学教授，并于1930年参与起草反对莱吉亚政权的政治宣言，后来历任秘鲁驻玻利维亚和乌拉圭外交代表。1945年，他代表全国民主阵线当选总统，执政初期恢复新闻自由并释放政治犯，但政府很快因经济困难、阿普拉党与军方冲突而陷入危机。1947年，秘鲁宣布对沿海二百海里海域主张主权。1948年10月，战争部长曼努埃尔·奥德利亚发动政变将其推翻，布斯塔曼特流亡海外。1960年，他当选海牙国际法院法官，1967至1970年任院长，后来还参与调停萨尔瓦多与洪都拉斯之间的争端。1980年，他获任终身参议员，1989年1月11日在利马去世。"
 CBIO_PRU_armando_reveredo_iglesias_desc:0 "雷沃雷多1896年6月17日生于卡哈马卡省孔图马萨，外祖父为前总统米格尔·伊格莱西亚斯。他于圣马科斯大学攻读医学，1920年转赴马德里大学完成学业并取得外科医生资格。1925年回国后加入军事航空医疗系统，1929年正式编入秘鲁航空兵团，兼具军医与飞行员双重身份。1935年12月13日他完成利马至波哥大的首次不着陆飞行，开创以飞机作外交纽带的先例，获哥伦比亚政府颁授博亚卡十字勋章。1937年他又完成利马至布宜诺斯艾利斯的直飞壮举。在布斯塔曼特政府中，他历任航空部长（1947–1948）、外交部长兼部长会议主席（1948）。此后长期担任秘鲁福塞特航空公司运营总监，1978年6月25日在利马去世，卡亚俄空军基地以其命名。"
 CBIO_ECU_aurelio_mosquera_desc:0 "奥雷利奥·莫斯克拉·纳尔瓦埃斯1883年8月2日生于基多，医学出身，曾任厄瓜多尔中央大学校长，并长期活跃于自由激进党。1938年12月，他经制宪议会选举出任总统。上台后，莫斯克拉依靠军方支持解散制宪议会，恢复1906年宪法，并组建以自由派为主的政府，由此同此前支持他的社会主义者决裂。其任内关闭中央大学和胡安·蒙塔尔沃师范学校，并压制左翼学生与教师团体。莫斯克拉长期患病，1939年11月17日在基多去世，政府公布死因为尿毒症。"
 CBIO_ECU_cosme_renella_barbatto_desc:0 "科姆·雷内拉·巴尔巴托1890年生于意大利那不勒斯，幼年随家人移居瓜亚基尔。1912年，他在瓜亚斯射击与航空俱乐部资助下赴意大利都灵接受飞行训练并取得飞行员资格，随后又赴法国深造。1913年，他将飞机运回厄瓜多尔并开展公开飞行活动，成为厄瓜多尔早期航空事业的代表人物。第一次世界大战期间，雷内拉返回意大利，在意大利航空部队服役。战后他曾赴委内瑞拉从事飞行教学，1924年回国后继续参与厄瓜多尔军民航空建设，后来晋升航空中校。1937年，他在基多因腹膜炎去世。"
 CBIO_ECU_benigno_andrade_flores_desc:0 "贝尼尼奥·安德拉德·弗洛雷斯1892年生，是厄瓜多尔职业军人，曾在安东尼奥·蓬斯代理政府中担任战争与海军部长。1935年9月，何塞·马里亚·韦拉斯科·伊瓦拉被军方推翻后，安德拉德参与短暂掌权的军事执政机构，并主持权力过渡，随后将国家领导权移交公共工程部长费德里科·派斯。此后他逐渐退出中枢政治，1972年6月22日去世。"
 CBIO_ECU_julio_salem_gallegos_desc:0 "朱利奥·特奥多罗·萨莱姆·加莱戈斯1900年生于里奥班巴，是黎巴嫩裔厄瓜多尔地主和自由激进党政治家。1934年当选国会议员，后来担任公共工程部长。1944年5月，反对卡洛斯·阿罗约·德尔里奥政府的“五月革命”爆发后，萨莱姆于5月29日至31日短暂主持国家政务，随后将权力移交何塞·马里亚·韦拉斯科·伊瓦拉。晚年他撰写回忆录，1968年9月3日在基多去世。"
 CBIO_ECU_luis_cabrera_sevilla_desc:0 "路易斯·卡夫雷拉·塞维利亚1915年生于安巴托，是厄瓜多尔职业军人。1963年7月，他与海军上校拉蒙·卡斯特罗·吉洪、陆军上校马科斯·甘达拉·恩里克斯和空军中校吉列尔莫·弗雷莱·波索共同发动政变，推翻卡洛斯·胡利奥·阿罗塞梅纳·蒙罗伊政府，组成军事执政团。执政期间，卡夫雷拉晋升陆军将领。军政府推行土地改革并废除部分传统劳役关系，同时实施新闻管制和政治镇压。1966年，军事执政团在国内压力下交出政权，卡夫雷拉随后逐渐淡出公共生活。"
 CBIO_ECU_federico_paez_chiriboaga_desc:0 "费德里科·派斯·奇里沃加1877年6月4日生于基多，早年赴法国和比利时学习工程，回国后曾任参议员和公共工程部长。1935年韦拉斯科·伊瓦拉下台后，他被军方推举为最高执政者。派斯执政初期推行带有社会改良色彩的政策，1936年11月平定兵变后则明显转向高压统治，关闭中央大学，并将部分政治反对者流放至加拉帕戈斯群岛。1937年，他试图借制宪会议巩固统治，同年10月被国防部长阿尔贝托·恩里克斯·加洛发动政变推翻。此后派斯流亡哥斯达黎加，晚年返回厄瓜多尔，1974年2月9日在基多去世。"
 CBIO_ECU_juan_bayardo_tobar_desc:0 "胡安·巴亚尔多·托巴尔全名维克多·曼努埃尔·巴亚尔多·托巴尔·阿尔布哈，1911年生于伊瓦拉附近的圣安东尼奥。1929年投身军旅，1936年取得军事飞行员资格。1942年，他出任陆军航空监察局负责人，并借助美国军事合作扩充教练机和飞行训练力量。1943年12月31日，陆军航空机构改组为独立的航空总司令部，巴亚尔多成为首任总司令。1952年，他再次出任该职，翌年转任驻美国使馆空军武官，并协助安排厄瓜多尔飞行学员赴美受训。"
 CBIO_ECU_ramon_moran_valverde_desc:0 "拉蒙·莫兰·瓦尔韦德全名拉斐尔·莫兰·瓦尔韦德，1904年生于瓜亚基尔，父亲是阿尔法罗派军官。1924年考入海军学校，后来在多艘舰艇上服役。1941年7月厄秘战争期间，他指挥“阿卜东·卡尔德隆”号炮艇参加洪贝利海战，与秘鲁海军舰艇交火后安全脱离，成为厄瓜多尔海军纪念的重要战例。战后他因作战表现获得晋升，后来被厄瓜多尔方面追授民族英雄称号。1958年5月2日，他在瓜亚基尔去世。"
 CBIO_ECU_ramon_castro_jijon_desc:0 "拉蒙·卡斯特罗·吉洪1915年生于埃斯梅拉尔达斯，是厄瓜多尔海军军官，曾在智利和美国接受军事教育，并历任海军武官、海军随员及海军总司令。1963年7月，他与陆军、空军将领发动政变，推翻总统卡洛斯·胡利奥·阿罗塞梅纳·蒙罗伊，出任军事执政团主席和事实上的国家元首。军政府推行土地改革、调整对外关系，同时以政治镇压和新闻管制引发争议。1966年3月，执政团因内部矛盾和国内压力交出政权。卡斯特罗此后逐渐退出政治，1984年11月1日去世。"
 CBIO_ECU_hugo_endara_penaherrera_desc:0 "塞萨尔·恩达拉·佩纳赫雷拉，1916年生于马查奇，是厄瓜多尔海军军官。1936年进入海军学校，1938年晋升军官。1941年厄秘战争期间，他在“阿卜东·卡尔德隆”号炮艇担任二副，并在洪贝利海战中负责舰艉火炮。1944年“五月革命”期间，他一度代理瓜亚基尔海军指挥事务。此后历任多艘军舰舰长，1949年至1952年担任海军总司令，任内推动海军条令、医疗与组织建设。2000年12月23日去世。"
 CBIO_ECU_juan_ramon_castro_desc:0 "拉蒙·卡斯特罗·吉洪1915年生于埃斯梅拉尔达斯，是厄瓜多尔海军军官，曾在智利和美国接受军事教育，并历任海军武官、海军随员及海军总司令。1963年7月，他与陆军、空军将领发动政变，推翻总统卡洛斯·胡利奥·阿罗塞梅纳·蒙罗伊，出任军事执政团主席和事实上的国家元首。军政府推行土地改革、调整对外关系，同时以政治镇压和新闻管制引发争议。1966年3月，执政团因内部矛盾和国内压力交出政权。卡斯特罗此后逐渐退出政治，1984年11月1日去世。"
 CBIO_ECU_gilberto_enriquez_gallo_desc:0 "吉尔贝托·恩里克斯·加洛全名吉尔·阿尔贝托·恩里克斯·加洛，1894年7月24日生于科托帕希省。早年从军，1935年出任费德里科·派斯政府的国防部长。1937年10月，他发动政变推翻派斯，出任最高执政者。其短暂任期内颁布1938年劳动法典，并推动警察、货币和社会政策改革，同时与外国矿业公司就利润和国家权益发生争议。执政约九个月后，他于1938年8月将权力移交制宪议会。1948年，恩里克斯曾代表左翼联盟参加总统选举但未获胜，1962年7月13日在基多去世。"
 CBIO_ECU_carlos_arosemena_tola_desc:0 "卡洛斯·阿罗塞梅纳·托拉1888年4月12日生于瓜亚基尔，曾赴美国学习，回国后长期从事银行业和慈善事业。1947年韦拉斯科·伊瓦拉被推翻、卡洛斯·曼切诺短暂掌权后，国会选举阿罗塞梅纳为副总统，他随即依宪继任总统。任内厄瓜多尔与苏联断交，参与签署《美洲国家组织宪章》，并召开大哥伦比亚经济会议。1948年，他推动货币制度改革，将中央银行置于新设货币委员会管理之下。同年8月任期结束，1952年2月20日在瓜亚基尔去世。"
 CBIO_ECU_carlos_arroyo_del_rio_desc:0 "卡洛斯·阿罗约·德尔里奥1893年11月27日生于瓜亚基尔，是律师和自由激进党政治家。1939年总统莫斯克拉去世后，他曾短暂代理总统，1940年正式当选。其任内厄瓜多尔与秘鲁边境冲突升级，1941年爆发战争。厄瓜多尔战败后，于1942年签署《里约议定书》，接受对争议边界的重新划定。阿罗约政府因战争失利、政治压制和经济困难逐渐失去支持。1944年5月，反政府起义爆发，他被迫辞职并流亡哥伦比亚。此后返回厄瓜多尔，1969年10月31日在瓜亚基尔去世。"
 CBIO_SLO_jozef_tiso_desc:0 "约瑟夫·蒂索1887年10月13日生于比奇查，天主教神父出身，1918年加入斯洛伐克人民党，1927至1929年任捷克斯洛伐克卫生部长。1938年安德烈·赫林卡去世后，他成为该党主要领导人，并出任斯洛伐克自治政府总理。1939年3月，在德国压力和支持下，斯洛伐克议会宣布独立；同年10月蒂索当选总统，领导一个依附纳粹德国的威权国家。其政权颁布严厉的反犹法规，并在1942年参与将约五万八千名犹太人驱逐至德国占领区；1944年斯洛伐克民族起义遭德军镇压后，驱逐重新开始，又有约一万三千余人被押走。蒂索公开为驱逐政策辩护，对迫害和死亡负有重大政治责任。1945年战败后，他逃往德国，随后被美军俘获并引渡回捷克斯洛伐克。经国家法院以叛国、通敌和参与镇压起义等罪名判处死刑，1947年4月18日在布拉迪斯拉发被绞死。"
 CBIO_SLO_vojtech_tuka_desc:0 "沃伊捷赫·图卡1880年7月4日生于什佳夫尼茨凯巴涅，法学教授出身，曾在佩奇大学和布拉迪斯拉发任教。捷克斯洛伐克成立后，他加入斯洛伐克人民党，成为党内激进分离主义派代表，并与匈牙利修正主义势力保持联系。1923年，他创建准军事组织祖国防卫队；1929年因叛国和间谍活动被判处十五年徒刑，1938年获释。1939年10月，图卡出任斯洛伐克共和国总理兼外交部长，是推动该国进一步依附纳粹德国的核心人物。其政府于1941年颁布由二百七十条规定组成的犹太人法典，全面剥夺犹太人的公民与财产权利。1942年，图卡积极推动将约五万七千名斯洛伐克犹太人驱逐至德国占领区。1944年因健康恶化和政治地位下降辞去总理职务。战后他被盟军俘获并引渡回国，因叛国和参与迫害犹太人等罪被判处死刑，1946年8月20日在布拉迪斯拉发被绞死。"
 CBIO_SLO_karol_smidke_desc:0 "卡罗尔·什米德克1897年1月21日生于维特科维采，早年从事工人运动，1921年参与创建捷克斯洛伐克共产党，1935年当选国民议会议员。1939年后，他流亡苏联，并参与面向斯洛伐克的政治宣传。1943年，什米德克秘密返回国内，参与重建斯洛伐克共产党地下领导机构，并同古斯塔夫·胡萨克等人与民主派抵抗力量合作。1944年斯洛伐克民族起义期间，他成为斯洛伐克民族委员会共同主席之一，也是共产党和游击队系统的主要政治领导人。战后，他历任斯洛伐克民族委员会副主席、主席和专员委员会主席。1950年，什米德克在党内清洗中被指控为“资产阶级民族主义者”，被排挤出核心权力，并遭国家安全机关立案调查。1952年12月15日，他在案件正式审判前于布拉迪斯拉发去世，死亡情形长期存在争议。1960年代获得平反。"
 CBIO_SLO_jan_ursiny_desc:0 "扬·乌尔西尼1896年10月11日生于拉克沙，曾在农业学校学习，后来经营家产并参与农业合作运动。两次世界大战之间，他加入捷克斯洛伐克农民党，担任国民议会议员，是斯洛伐克农民政治的重要代表。1939年斯洛伐克国成立后，他因反对蒂索政权一度被捕，获释后参加地下抵抗，并在1943年参与达成共产党与民主派合作的《圣诞协定》。1944年斯洛伐克民族起义期间，他担任斯洛伐克民族委员会经济事务专员，也是民主抵抗力量的主要领导人之一。战后乌尔西尼参与创建民主党，1945年出任捷克斯洛伐克副总理。1947年，他因政治压力和秘书涉案辞职。1948年共产党夺权后遭逮捕并被判刑，1953年获释。1972年1月8日，他在拉克沙去世。"
 CBIO_SLO_jaroslav_kratochvil_desc:0 "雅罗斯拉夫·克拉托赫维尔，1901年生于加利西亚普热梅希尔，捷克政治家，法学博士，历任煤矿业主协会秘书、副总干事。1940年2月出任波希米亚与摩拉维亚保护国工业、商业与手工业部长，任内并非任何政党成员。1942年离职后转任日沃诺银行煤炭业务顾问，1943年起与抵抗运动建立联系，1944年因拒绝加入捷克反布尔什维克联盟被盖世太保逮捕并以叛国罪起诉，因染白喉住院而躲过遣送，健康问题使他持续治疗至1945年8月。战后又受共产党当局迫害监视，1959年后曾被判处八年监禁，1984年4月5日在铁尔尼布罗德去世。"
 CBIO_SLO_frano_kral_desc:0 "弗拉诺·克拉尔，1903年生于美国俄亥俄州斯洛伐克移民家庭，两岁随母回国定居斯梅列卡尼，早年因营养不良染上伤寒与肺结核，在疗养院期间开始写诗。1921年加入捷克斯洛伐克共产党，两战之间以无产阶级诗歌及社会现实主义小说见长，代表作有诗集《调色盘上的黑色》及小说《被砍伐的道路》，反映两战间斯洛伐克社会底层的苦难。战后他历任教育专员、共产党中央委员会委员、斯洛伐克民族委员会委员及捷克斯洛伐克作家联盟主席团成员，1953年获授人民艺术家称号。1955年1月3日去世。"
 CBIO_SLO_stefan_tiso_desc:0 "斯特凡·蒂索，1897年生于比奇查，法学家，总统约瑟夫·蒂索的堂弟。1939至1944年任斯洛伐克共和国最高法院院长。1944年9月图卡因病辞职后，他接任总理，兼任外交部长及司法部长直至1945年4月。任内他力主对被俘的斯洛伐克民族起义领导人判处死刑，并在与德方沟通中多次表态支持彻底解决犹太人问题。战败后被俘，战后审判中被判处无期徒刑，1959年3月28日在米罗夫监狱去世。"
 CBIO_SLO_karol_sidor_desc:0 "卡罗尔·西多尔，1901年生于鲁若姆贝罗克，虔诚天主教徒，早年追随赫林卡投身斯洛伐克人民党，历任党报斯洛伐克人主编及赫林卡卫队总指挥，1935年当选议员。1938年出任斯洛伐克事务部长。1939年3月他一度出任斯洛伐克总理仅三天，因拒绝在纳粹压力下宣布独立而被边缘化，随后被派任驻梵蒂冈公使。他持强烈反犹立场，但对纳粹保持警惕，1939至1945年间留驻罗马。战争结束后流亡加拿大蒙特利尔，1947年被捷克斯洛伐克法庭缺席判处二十年徒刑，1953年10月20日在蒙特利尔去世，未曾服刑。"
 CBIO_SLO_janko_jesensky_desc:0 "扬科·耶森斯基，1874年生于图尔奇扬斯基圣马丁，斯洛伐克没落贵族世家出身，诗人、小说家、翻译家及政治家。一战期间作为奥匈军人被俄军俘虏，后加入捷克斯洛伐克军团，其回忆录《在押解途中》记录了这段经历。捷克斯洛伐克成立后历任里马夫斯卡索博塔、尼特拉等地县长，后升任斯洛伐克地区政府副主席。1939年斯洛伐克独立、蒂索政权建立后，他退出公职，但持续以讽刺诗抨击当局，部分作品经伦敦流亡电台播出。1945年12月27日在布拉迪斯拉发去世。"
 CBIO_SLO_jozef_turanec_desc:0 "约瑟夫·图拉内茨，1892年生于苏恰尼，铁匠之子。一战期间随奥匈军队在加利西亚对俄作战，青年时曾目睹匈牙利宪兵镇压斯洛伐克民众的切尔诺瓦事件，由此坚定反匈立场。1941年苏德战争爆发后他接替马拉尔指挥快速师，在基辅会战中因表现出色获德方颁发黑鹰勋章及二级铁十字勋章，以对游击队采取就地枪决平民的强硬手段著称。1942年调任斯洛伐克军事管理机构负责人，1944年1月出任地面部队总司令。1944年9月13日被苏军带走审查，战后被判刑入狱，1957年在狱中去世。"
 CBIO_SLO_stefan_jurech_desc:0 "斯特凡·尤雷赫，斯洛伐克军将领，1943年1月至9月间接替图拉内茨指挥东线快速师。1944年斯洛伐克民族起义期间，德方从被俘起义领导人的审讯中查出他暗中同情并参与起义筹备，遂将其秘密逮捕解往柏林帝国保安总局，与马拉尔将军同遭羁押，据信约1945年与戈利安、维斯特一同转押至弗洛森堡集中营并死于此地，确切情形因记录缺失无法完全查证。"
 CBIO_SLO_augustin_malar_desc:0 "奥古斯丁·马拉尔，1894年生，两战间捷克斯洛伐克军中少数晋升较高职位的斯洛伐克族军官之一。1939年斯洛伐克独立后成为斯洛伐克军骨干将领，1941年苏德战争爆发后指挥快速师参与东线作战。1944年初他与国防部长察特洛斯共同拟定倒戈苏联的秘密计划。审讯中德方查出他暗中知悉并参与民族起义筹备，遂将其秘密解往柏林帝国保安总局，与斯特凡·尤雷赫将军一同被扣押，约1945年2月转往弗洛森堡集中营，同年2月28日去世。"
 CBIO_SLO_rudolf_viest_desc:0 "鲁道夫·维斯特，1890年生于雷武察，两战间捷克斯洛伐克军队唯一的斯洛伐克族将军。一战中曾在奥匈军队服役被俄军俘虏，后转投塞尔维亚军队并参与组建捷克斯洛伐克军团。1938年反对慕尼黑协定及捷克斯洛伐克解体，1939年流亡法国、后转赴英国，1942至1944年任捷克斯洛伐克流亡政府国防部长。1944年10月他空降回国接掌斯洛伐克民族起义军总指挥，起义失利后于11月3日被德军俘获，据信1945年死于弗洛森堡集中营，确切情形因记录缺失无法查证，战后追授上将军衔。"
 CBIO_SLO_vojtech_daubner_desc:0 "沃伊特赫·道布纳，1912年生于克雷姆尼察，斯洛伐克共产党人，捷克斯洛伐克联邦议会议员，长期活跃于工会系统，也是斯洛伐克民族委员会成员。1981年在布拉迪斯拉发去世。"
 CBIO_SLO_jozef_hora_desc:0 "约瑟夫·霍拉，1891年生于多布日尼，捷克诗人、记者、翻译家，两战间捷克现代诗坛代表人物之一。早年投身社会民主党，长期主编红色权利报文化版，1929年因抗议党内斯大林化转向而被开除党籍。他曾任捷克斯洛伐克作家协会主席，组织文艺界反法西斯统一战线，也是普希金等俄语文学的重要译者。1941年因纳粹审查压力及健康恶化退出公共生活，1945年6月21日在布拉格去世，翌日追授国家艺术家称号，为首位获此殊荣者。"
 CBIO_SLO_emil_lendvay_desc:0 "埃米尔·伦德沃伊，斯洛伐克军官，1943年9月接替斯特凡·尤雷赫，出任东线斯洛伐克远征军司令，指挥由快速师改编而成的第一步兵师及保安师等部队，负责东线后方治安维护与反游击作战，1944年6月卸任。"
 CBIO_SLO_gustav_malar_desc:0 "奥古斯丁·马拉尔，1894年生，两战间捷克斯洛伐克军中少数晋升较高职位的斯洛伐克族军官之一。1939年斯洛伐克独立后成为斯洛伐克军骨干将领，1941年苏德战争爆发后指挥快速师参与东线作战。1944年初他与国防部长察特洛斯共同拟定倒戈苏联的秘密计划。审讯中德方查出他暗中知悉并参与民族起义筹备，遂将其秘密解往柏林帝国保安总局，与斯特凡·尤雷赫将军一同被扣押，约1945年2月转往弗洛森堡集中营，同年2月28日去世。"
 CBIO_SLO_ferdinand_catlos_desc:0 "费迪南德·察特洛斯，1895年生于利普托夫斯基彼得，奥匈军人出身，一战中曾被俄军俘虏。1939年斯洛伐克独立后转入斯洛伐克军队并晋升上将，出任国防部长，指挥1939年入侵波兰的贝尔诺拉克野战集团军。1941年他率快速师参与对苏作战。1944年初他与马拉尔将军秘密拟定倒戈计划试图联络苏方，但民族起义爆发时德军抢先控制局面，他本人于8月29日被礼遇软禁。9月13日苏军将其和图拉内茨将军一并带走审查，因其效忠旧政权的经历被视为不可靠分子扣押至1947年方获释，此后在马丁做普通职员，1972年8月31日去世。"
 CBIO_SLO_jindrich_honzl_desc:0 "因德日赫·洪兹尔，1894年生，捷克戏剧导演、理论家，布拉格先锋剧团解放剧院的核心创建者之一，长期致力于探索现代戏剧的舞台语言与符号学理论，对捷克斯洛伐克现代戏剧发展影响深远。1953年在布拉格去世。"
 CBIO_SLO_julius_thorzo_desc:0 "尤利乌斯·图尔佐，1882年生于杰特瓦，1900年毕业于阜姆匈牙利皇家海军学院，1903年取得远洋航运大副资格，此后常年在欧洲各航运公司的船只上服役，辗转多个海域，历经沉船等险境。1919年10月出任捷克斯洛伐克驻贝尔格莱德使馆航运顾问，1923年返回布拉迪斯拉发，供职于多瑙河水道管理局，历任港务长及局长，是捷克斯洛伐克内河航运事业的开创者之一，被誉为斯洛伐克第一位远洋船长。晚年撰写回忆录《行遍世界大洋》，于其身后1973年出版。1950年2月16日在班斯卡·比斯特里察去世。"
 CBIO_SLO_anton_pulanick_desc:0 "安东·普拉尼奇，1898年6月9日生，斯洛伐克军将领，两战间履历与其他斯洛伐克族军官相似，参与东线对苏作战部署。战争后期他因涉入或被怀疑同情民族起义遭德方追究，1945年2月4日在柏林被德军处决，是战争结束前遇害的斯洛伐克将领之一。"
 CBIO_SLO_jozef_snejdarek_desc:0 "约瑟夫·什奈达雷克，1875年生于纳帕伊德拉，磨坊主之子，1899年加入法国外籍军团服役近三十年并入籍法国，一战期间在马恩河、埃纳河等战役中负伤立功。1917年转任捷克斯洛伐克军团联络官，1919年随军回国，率部在切欣西里西亚对波兰作战，随后指挥第二师在斯洛伐克中部击退匈牙利苏维埃军队并收复兹沃伦，1932年在佩特尔扎尔卡督建被称为什奈达雷克防线的边境碉堡群。1935年退役，1938年任国民步枪卫队司令。慕尼黑协定后流亡法国，法国战败后转赴摩洛哥卡萨布兰卡，1945年5月13日在当地去世。"
 CBIO_SLO_fritz_gejza_desc:0 "盖扎·弗里茨，1880年生于索利瓦尔，法学家，长期任法官。1938年12月起当选斯洛伐克邦议会议员，1939年斯洛伐克独立后出任司法部长，1940年起兼任国务委员会委员。任内他既签署了将犹太人排除出司法界等一系列反犹立法，也被认为在一定程度上抵制了更极端的量刑要求，减轻了对部分政治犯的判决。1944年9月斯洛伐克民族起义爆发、图卡内阁总辞后，他被斯特凡·蒂索取代司法部长一职，因此未卷入随后镇压起义的决策。这一时间点上的离任，使他在战后审判中仅被判处两年徒刑。1957年2月20日在索利瓦尔去世。"
 CBIO_SLO_frantisek_sadek_desc:0 "弗朗齐歇克·萨德克，1921年12月24日生于日利纳，1944年斯洛伐克民族起义期间担任扬·斯韦尔马第2团指挥官参战。1945年在波普拉德完成预备役军官培训，随后在下库比因任连长，1946至1947年在斯洛伐克东部参与镇压乌克兰民族主义游击队的军事行动。战后长期在捷克斯洛伐克人民军服役，历任团、师级指挥职务及第4集团军司令，1956年赴莫斯科伏罗希洛夫苏军总参军事学院深造，晚年官至边境卫队司令，并于1980年代出任捷克斯洛伐克联邦议会代表。2015年10月4日在布拉格去世。"
 CBIO_ALB_king_zog_desc:0 "索古一世本名艾哈迈德·穆赫塔尔·佐格里，1895年10月8日生于马蒂地区一个贝伊家族。第一次世界大战后，他进入阿尔巴尼亚政坛，先后担任内政部长和总理。1924年被范·诺利政府推翻后，索古在南斯拉夫支持下率武装返回国内，1925年出任总统并建立强人统治。1928年9月，他改立君主制，自称索古一世。其统治推动法律世俗化、行政集权和国家机构建设，但也依赖部族关系和政治镇压。由于财政和军事力量有限，阿尔巴尼亚日益受墨索里尼政府控制。索古曾试图削弱意大利影响，但未能摆脱经济和安全依赖。1939年4月意大利入侵后，他携家人出逃，随后长期流亡。1946年阿尔巴尼亚人民共和国成立后，王位被正式废除。索古1961年4月9日在法国叙雷讷去世，2012年遗骸迁葬地拉那。"
 CBIO_ALB_wilhelm_of_wied_desc:0 "威廉·维德亲王1876年3月26日生于德国诺伊维德，出身维德家族，曾任普鲁士军官。阿尔巴尼亚独立后，列强为这个新国家选择一位不属于当地主要宗教和政治派系的君主，威廉因此于1914年接受阿尔巴尼亚王位。3月7日，他抵达都拉斯，以阿尔巴尼亚主权亲王身份执政。其政府从一开始便受财政匮乏、地方派系冲突、宗教矛盾和邻国干涉困扰，埃萨德·帕夏·托普塔尼及中部武装反对势力不断挑战中央权威。第一次世界大战爆发后，国际监督和财政支持迅速瓦解。1914年9月3日，威廉离开阿尔巴尼亚，虽未正式宣布退位，但此后再未恢复统治。回到德国后，他重新在军队服役，1945年4月18日在罗马尼亚去世。"
 CBIO_ALB_enver_hoxha_desc:0 "恩维尔·霍查1908年10月16日生于吉罗卡斯特，青年时期曾赴法国和比利时学习。1939年意大利占领阿尔巴尼亚后，他参与地下共产主义活动，1941年成为阿尔巴尼亚共产党创建者和主要领导人之一。第二次世界大战期间，霍查领导民族解放运动，同意大利和德国占领军作战，同时排挤并打击民族主义竞争力量。1944年共产党取得全国政权后，他出任总理，1946年建立阿尔巴尼亚人民共和国。此后霍查以劳动党第一书记身份统治国家四十年，推行斯大林主义计划经济、农业集体化和严厉政治清洗。1967年政府宣布阿尔巴尼亚为无神论国家，大规模关闭宗教场所。霍查先后与南斯拉夫、苏联和中国决裂，使阿尔巴尼亚在冷战后期陷入高度孤立。其统治建立了完整的国家工业和教育体系，也造成长期镇压、经济僵化和社会封闭。1985年4月11日，他在地拉那去世。"
 CBIO_ALB_tefik_mborja_desc:0 "特菲克·塞利姆·姆博里亚1891年11月6日生于科尔察附近的姆博列，曾在罗马学习法律。两次世界大战之间，他当选议员，早年反对艾哈迈德·佐古并追随范·诺利，1924年后曾作为诺利派代表留驻罗马。1939年4月意大利入侵阿尔巴尼亚后，姆博里亚转而与占领当局合作，先任科尔察州长，随后被任命为阿尔巴尼亚法西斯党总书记，并以当然部长身份进入政府。该党名义上是阿尔巴尼亚的执政党，实际受意大利法西斯机构控制。姆博里亚任职期间参与推动国家政治和社会组织的法西斯化。1944年共产党掌权后，他被捕，翌年由特别法庭判处二十年监禁。1954年7月1日，他在狱中死亡。"
 CBIO_ALB_xhemal_aranitasi_desc:0 "杰马尔·阿拉尼塔西，1886年1月25日生于马拉卡斯特尔的阿拉尼塔斯，父亲是奥斯曼军队的上校。他先后就读于莫纳斯提尔军事中学和伊斯坦布尔军事学院，巴尔干战争期间在奥斯曼军中指挥一支机枪分队。1920年他加入阿尔巴尼亚王国军队，1925年以中校衔升任王国军队总指挥，是当时参谋层中唯一的本土阿尔巴尼亚人，重大军务多由米尔达茨、吉拉尔迪等外籍军官把持。1929年他晋升将军，并一度出任索古国王的副官。1939年作为陆军部长，面对迫在眉睫的对意战争，他下令禁止报纸刊登动员消息，也不准向平民发放武器。4月6日，即意大利入侵前夕，他离开阿尔巴尼亚，此后定居土耳其，曾获斯坎德培勋章大绶带。1961年3月13日在土耳其去世。"
 CBIO_ALB_halil_nergutti_desc:0 "哈利勒·内古蒂是阿尔巴尼亚保王派人士，长期效忠索古一世及其子莱卡。第二次世界大战后，他参与1949至1953年间英美情报机构支持的对阿尔巴尼亚秘密渗透行动。由于苏联间谍金·菲尔比向阿尔巴尼亚当局泄露行动情报，多批潜入人员遭到伏击、逮捕或处决。内古蒂后来在回忆录中记录了相关经历，成为研究冷战初期西方对阿秘密行动的一项见证材料。"
 CBIO_ALB_xhelal_mitrovica_desc:0 "杰拉尔·米特罗维察，全名杰拉尔·德尔维什·米特罗维察，1916年生于科索沃，父亲德尔维什曾是奥斯曼军官、后投身科索沃民族运动，舅父为哈费尔·德瓦。他幼年随家迁往斯库台，三十年代赴意大利博洛尼亚大学攻读法律并获法学博士学位，但终生未执律师业，而以新闻为业，是当时最有才华的政论家之一，主编科姆比报，为科索瓦、民族团结、我们的时代等报刊撰稿。1941年他返回米特罗维察，任阿尔巴尼亚人民同盟秘书，并主持普里什蒂纳电台，战时在普里什蒂纳的萨米·弗拉舍里学校任教。1943年9月他参加普里兹伦第二联盟并任其委员会秘书，1944年在迪内政府中任米特罗维察选区议员，力主科索沃与阿尔巴尼亚合并。他因深爱米特罗维察城而取该城之名为姓，晚年流亡海外，1974年11月10日在加拿大多伦多去世。"
 CBIO_ALB_kol_bibe_mirakaj_desc:0 "科尔·比贝·米拉卡伊，1899年12月5日生于普卡地区的伊巴莱，出身当地塔奇部落望族，早年在斯库台方济各会学校与埃尔巴桑师范学校求学，1917年至1924年任教师。1926年末他以叛军中尉身份参加杜卡吉尼起义，起义遭王国军队镇压，翌年被政治法庭缺席判处死刑。意大利入侵后，他转而与占领当局合作，参与组建法西斯民兵，历任阿尔巴尼亚法西斯党部长与书记，1943年在布沙蒂政府中出任内政部长。任内，1943年8月31日他签发法令，指示为所有提出申请的阿尔巴尼亚犹太人发放护照，助其逃往意大利，据信因此帮助救下多达约两千名犹太人，事后他谢绝了犹太人送来的酬谢。临近解放他离开阿尔巴尼亚，此后长期在意大利流亡，1946年成为罗马独立民族集团的主要成员之一，协助阿尔巴尼亚侨民在西欧与美国安置。1968年3月17日在纽约去世。"
 CBIO_ALB_prenk_pervizi_desc:0 "普伦克·佩尔维齐，1897年5月4日生于库尔宾地区斯库拉伊的一个天主教家庭，先后就读于维也纳军校与都灵战争学院。他是艾哈迈德·佐古的挚友与得力助手，1922年曾率宪兵部队平定叛乱、护卫佐古政府，1935年还作为国际观察员赴埃塞俄比亚观战意阿之役。意希战争期间，他代表阿尔巴尼亚军队常驻意军统帅部，却因与意方龃龉而将阿军撤离前线，事后仍获晋升为将军。1943年9月意大利投降后，他从达尔马佐将军手中接过指挥权，10月23日出任国防部长并晋升师级将军，着手整编军队、加强北部边防，同时抵制德国在阿尔巴尼亚征募党卫军。因与德军统帅部冲突，他辞职上山，投入阿巴兹·库皮领导的忠君派游击力量，并与英国使团联络，始终坚决反共。战后他流亡希腊，继而定居比利时。1977年9月6日在比利时去世，享年八十。"
 CBIO_ALB_eqrem_libohova_desc:0 "埃奇雷姆·利博霍瓦，1882年2月24日生于吉诺卡斯特，出身阿尔巴尼亚南部穆斯林地主贵族家庭，早年曾在伊斯坦布尔和布鲁塞尔求学。阿尔巴尼亚独立后，他进入外交与宫廷系统，先后担任驻外使节和宫廷大臣。1931年佐古一世在维也纳遇刺时，他随侍在侧并受伤。1936年1月至1939年4月任外交部长。意大利占领阿尔巴尼亚后，他继续在占领政权中任职并加入阿尔巴尼亚法西斯党。1943年他两度出任首相，任期分别为1月19日至2月13日、5月12日至9月9日，其政府依附意大利占领当局。意大利投降后他离开阿尔巴尼亚，1948年6月7日在罗马去世。"
 CBIO_ALB_rexhep_mitrovica_desc:0 "雷杰普·米特罗维卡，1888年1月15日生于科索沃米特罗维察一个富裕的地主家庭，先后在斯科普里、塞萨洛尼基和伊斯坦布尔求学，1909年任斯科普里师范学校教师兼校长。1912年他与伊萨·博莱蒂尼、哈桑·普里什蒂纳等人同为科索沃起义的领导者，并作为佩亚代表签署了阿尔巴尼亚独立宣言，1921年至1923年任教育部长。意大利投降后，他出任主张大阿尔巴尼亚的普里兹伦第二联盟中央委员会主席。1943年11月6日，在德国占领下他出任阿尔巴尼亚首相，直至次年7月18日因病辞职；其政府控制科索沃期间，对当地塞尔维亚移民实施报复，屠杀并驱逐了数千人。战后他患肺结核，辗转克罗地亚、奥地利与意大利，最终定居土耳其。1967年5月21日在伊斯坦布尔去世，墓碑上刻着阿尔巴尼亚首相雷杰普·米特罗维卡。"
 CBIO_ALB_fiqri_dine_desc:0 "菲契里·迪内，1897年5月5日生于迪布拉，是迪内家族的首领，父亲迪内·马切拉拉是1910年起义中的爱国志士。他于1914年至1919年就读于奥匈的韦尔斯军校，毕业后以中尉身份返回斯库台。1944年德占末期，他出任阿尔巴尼亚首相，任内深受摄政迈赫迪·弗拉舍里与忠君派首领阿巴兹·库皮的影响，并借助自己与忠君派的关系拉库皮入阁。当时德军与佐古派力量曾一度将游击队逐出马蒂，但这场民族主义者与佐古派联手的赌博终告失败，他任相仅四十余日。战后他与穆哈雷姆·巴伊拉克塔里一同为设在巴黎的阿尔巴尼亚委员会效力，后由南斯拉夫逃往希腊。1960年11月26日去世。"
 CBIO_ALB_midhat_frasheri_desc:0 "迈扎特·弗拉舍里，笔名卢莫·斯肯多，1880年3月25日生于亚尼纳，是民族复兴运动领袖阿卜杜尔·弗拉舍里之子、诗人纳伊姆与萨米·弗拉舍里的侄子。1908年他主持莫纳斯提尔大会，为统一阿尔巴尼亚字母出力，1912年作为独立宣言签署者之一出任临时政府公共工程部长，此后曾任驻巴黎和会代表团团长及驻希腊、美国公使。他嗜书成癖，在地拉那开设卢莫·斯肯多书店，私人藏书约两万册，为当时全国之最，后成为国家图书馆的基础。1942年他创建并领导民族主义组织巴利联盟，出任主席，力主建立民族的阿尔巴尼亚、坚决反共，该组织的口号是阿尔巴尼亚属于阿尔巴尼亚人，叛徒该死。1943年巴利联盟与共产党人签订的穆克耶协议迅速破裂，此后其部分武装在反共名义下与德军有过颇具争议的合作。1945年共产党人得势，他流亡意大利，1949年8月出任自由阿尔巴尼亚全国委员会首任主席，同年10月3日在纽约因心脏病去世。"
 CBIO_ALB_jocelyn_percy_desc:0 "乔斯林·珀西爵士全名约翰·塞缪尔·乔斯林·珀西，1871年3月9日生于直布罗陀，是英国陆军军官。早年就读桑赫斯特军校，先后参加印度西北边境作战、布尔战争和第一次世界大战，官至少将。1926年，他受聘出任阿尔巴尼亚王国宪兵总监，率领一批英国军官整训宪兵。索古政府借助英国教官制衡意大利对阿尔巴尼亚军队的影响，珀西也因此成为阿尔巴尼亚国家警备体系职业化的重要推动者之一。他任职十二年，1938年9月卸任回国，1952年8月25日去世。"
 CBIO_BOL_jose_luis_tejada_sorzano_desc:0 "何塞·路易斯·特哈达·索尔萨诺1882年1月12日生于拉巴斯，律师、经济学家和自由党政治家。1904年毕业于圣安德烈斯高等大学法学专业，1914年当选国会议员，1919年出任财政部长。1931年，他与丹尼尔·萨拉曼卡搭档当选副总统。查科战争期间，萨拉曼卡因与军方在战争指挥上的冲突于1934年11月被迫辞职，特哈达随后继任总统。其任内与巴拉圭达成停战，结束查科战争的主要战事，并着手处理战争债务、军队复员和标准石油公司争议。长期战争使国家财政和社会秩序陷入危机，军中青年军官则要求推行更激进的政治改革。1936年5月，赫尔曼·布施等军官发动政变，推翻特哈达并拥立戴维·托罗。他被迫流亡智利，1938年10月4日在阿里卡去世。"
 CBIO_BOL_oscar_unzaga_de_la_vega_desc:0 "奥斯卡·温萨加·德·拉·维加1916年4月19日生于科恰班巴，教师、记者和政治活动家。查科战争的失败对其民族主义思想产生深刻影响。1937年，他在智利圣地亚哥与一批玻利维亚学生共同创建玻利维亚社会主义长枪党，后来长期担任该党领袖。该党早期受到西班牙长枪主义影响，主张天主教民族主义、社会改革和反马克思主义，并以建立“新玻利维亚国家”为政治目标。1952年民族主义革命运动执政后，长枪党成为主要反对力量之一，温萨加多次参与反政府行动，并于1956年竞选总统。1959年4月19日，长枪党发动推翻政府的武装行动失败，温萨加当天在拉巴斯死亡。政府宣布其自杀，党内支持者和部分后来的调查则主张他遭到杀害，其死亡经过长期存在争议。"
 CBIO_BOL_Gustavo_Adolfo_Navarro_desc:0 "古斯塔沃·阿道弗·纳瓦罗1898年生于苏克雷，是玻利维亚作家、记者、外交官和社会主义政治活动家，以笔名特里斯坦·马罗夫闻名。早年任玻利维亚驻欧洲领事，在旅欧期间接触工人运动和马克思主义思想，并逐渐成为国内寡头政治和矿业资本的尖锐批评者。他提出“土地归人民，矿山归国家”的口号，主张土地改革和矿产国有化。1920年代末，纳瓦罗因反政府活动长期流亡，并在国外组织左翼政治团体。查科战争期间，他公开反对战争，将其视为围绕石油和寡头利益进行的冲突。1930年代，他参与玻利维亚革命工人党的早期组建，回国后又成立工人社会主义党。其著作兼具政治论战、历史评论和文学色彩，对玻利维亚左翼民族主义和社会主义思想产生了持续影响。晚年其政治立场趋于保守，1979年在圣克鲁斯去世。"
 CBIO_BOL_jorge_blanco_desc:0 "豪尔赫·布兰科全名何塞·萨尔瓦多·奥马尔·豪尔赫·布兰科，1926年7月5日生于多米尼加共和国圣地亚哥-德洛斯卡瓦列罗斯，是律师和政治家。1950年毕业于圣多明各自治大学法学院，次年赴西班牙学习国际法。特鲁希略独裁政权倒台后，他参加全国公民联盟，1964年转入多米尼加革命党，1965年内战期间曾任总检察长，1978年当选参议员。1982年，豪尔赫·布兰科当选多米尼加共和国总统。其任内面临外债、财政赤字和物价上涨等严重经济问题，1984年政府推行与国际货币基金组织相关的紧缩措施，引发全国性骚乱和军警镇压，造成大量伤亡。1986年卸任后，他因政府采购和贪腐案件遭起诉并一度被判刑，案件随后经历长期上诉和政治争议。2010年12月26日，他在圣多明各去世。"
 CBIO_BOL_eusebio_ayala_desc:0 "尤塞比奥·阿亚拉，全名尤塞比奥·阿亚拉·博尔德纳韦，1875年8月14日生于巴拉圭科迪列拉省的巴雷罗格兰德，巴拉圭自由党政治家、律师。他出身贫寒，靠自身努力完成学业，1904年获法学博士学位，任亚松森大学法学教授并一度出任校长，通晓英语与法语，历任司法、财政、外交等部部长。1921年至1923年因政局危机被国会推为临时总统。1932年8月他再度就任巴拉圭总统，恰逢查科战争爆发。战争期间他放手让埃斯蒂加里维亚将军统军，多次亲赴前线，最终率巴拉圭战胜玻利维亚，赢得胜利总统之誉。1936年2月，他在任期将满前被拉法埃尔·佛朗哥上校发动的二月革命推翻，遭监禁后流亡布宜诺斯艾利斯。1942年6月4日，他在布宜诺斯艾利斯去世。"
 CBIO_BOL_tomas_monje_gutierrez_desc:0 "托马斯·蒙赫·古铁雷斯，1884年12月21日生于拉巴斯省的科罗伊科，律师、法官，玻利维亚第四十一任总统。他毕业于圣安德烈斯大学法律系，青年时倾向社会主义，曾任西莱斯政府的公共教育部长，历任检察长与拉巴斯高等法院院长。1946年7月，比利亚罗埃尔被暴动群众绞死后，反对派推举时任拉巴斯高等法院院长的他出任临时政府主席。因他患病，先由庭长内斯托尔·吉连代理二十余日，同年8月他正式就任。他的任务是尽快召集大选，作为过渡总统建树不多，且被史家批评对穆里略广场处决政治犯的暴行袖手旁观。任内召开的普拉卡约代表大会催生了矿工的普拉卡约提纲。1947年1月的大选由保守派的赫尔佐格胜出，他随即于3月交权。1954年7月1日，他在拉巴斯去世。"
 CBIO_BOL_gualberto_villarroel_lopez_desc:0 "瓜尔韦托·比利亚罗埃尔·洛佩斯，1908年12月15日生于科恰班巴的比利亚里韦罗，军人，玻利维亚第三十九任总统。他是查科战争老兵、秘密民族主义军人组织祖国理性的核心人物。1943年12月，他与民族主义革命运动联手发动政变推翻佩尼亚兰达，出任军政府主席，1944年经国民大会选为立宪总统。他推行改革，通过矿工劳动立法，1945年召开第一届全国土著大会、废除无偿劳役庞盖阿赫，因此被拿来与阿根廷的庇隆相比；但其政府也被指有法西斯倾向，并处决政治对手，招致工人、学生与教师的强烈反对。他留下一句名言：我不是富人的敌人，但我更是穷人的朋友。1946年7月21日，暴动人群冲入政府宫将他杀害，把遗体从阳台抛下并悬挂在拉巴斯穆里略广场的路灯上，他因此被称为被绞死的总统。"
 CBIO_BOL_jose_santos_quinteros_desc:0 "何塞·桑托斯·金特罗斯，1865年11月1日生于波托西，律师、教授与政治家。取得学位后不久，他即受聘为圣弗朗西斯科·哈维尔大学公法教授。他曾在伊斯梅尔·蒙特斯政府任战争与殖民部长，1910年当选参议员，1913年任司法部长。1917年至1920年，他在何塞·古铁雷斯·格拉政府任第二副总统，与第一副总统伊斯梅尔·巴斯克斯共事，其间还先后出任政府部长与战争部长。他是二十世纪初玻利维亚政坛资深的法政人物。1951年2月22日去世。"
 CBIO_BOL_fabian_vaca_chavez_desc:0 "法维安·巴卡·查韦斯，1883年6月22日生于贝尼的特立尼达，玻利维亚作家、记者与外交官。青年时期他属于名为自由言辞的文学团体，与阿尔西德斯·阿尔格达斯等作家一同为报刊撰稿。他后来投身新闻与外交事业，并当选玻利维亚语言学院院士，也是西班牙皇家学院的外籍通讯院士。1949年2月22日，他在拉巴斯去世。"
 CBIO_BOL_david_toro_ruilova_desc:0 "戴维·托罗·鲁伊洛瓦1898年6月24日生于苏克雷，毕业于玻利维亚军事学院，是炮兵军官和政治家。1930年曾任发展与交通部长，查科战争期间进入总参谋部并参与作战指挥，其战场表现和政治活动均存在争议。1936年5月，赫尔曼·布施等青年军官推翻特哈达·索尔萨诺，托罗被推举为军政府总统，开始推行被称为“军人社会主义”的改革。他设立劳动部，推动劳动法规和社会政策，创建国营玻利维亚油田公司。1937年3月，托罗政府宣布没收标准石油公司在玻利维亚的资产，这是拉丁美洲较早的大规模石油国有化行动之一。由于军政府内部矛盾、改革进展和政治支持下降，他于1937年7月被布施迫使辞职。此后托罗长期流亡，曾试图重返政坛但未成功，1977年7月25日在智利圣地亚哥去世。"
 CBIO_BOL_enrique_baldivieso_aparicio_desc:0 "恩里克·巴尔迪维索·阿帕里西奥，1902年4月15日生于波托西的图皮萨，律师、诗人与剧作家，1925年取得律师资格，曾任圣安德烈斯大学教师。1934年至1944年间，他在多届政府中任国务部长。1938年，他由国民大会选为副总统，辅佐赫尔曼·布施总统。1939年布施宣布独裁并随后身亡后，围绕继承发生争议：巴尔迪维索以副总统身份主张按继承权继任总统，但军方认为宪政秩序已被打破，改推金塔尼利亚上台，他的主张未获接受。此后他因政治活动流亡阿根廷。在文学上，他以易卜生式的社会问题剧著称。1957年10月16日，他在阿根廷布宜诺斯艾利斯去世。"
 CBIO_BOL_roberto_hinojosa_desc:0 "罗伯托·伊诺霍萨，生于科恰班巴，玻利维亚左翼革命者与记者，以雄辩著称。1930年6月，面对西莱斯·雷耶斯可能连任，他率五十余人攻占阿根廷边境的比利亚松镇，史称比利亚松革命。他因激进立场屡遭当局放逐，曾在乌拉圭入狱，后转赴墨西哥，与卡德纳斯总统往来，并结识同样流亡的托洛茨基。1944年他回国支持比利亚罗埃尔，创立玻利维亚革命党，参与筹办1945年第一届全国土著大会，并主编一份为比利亚罗埃尔政府辩护的报纸，笔调时而激烈。1946年7月21日，在推翻比利亚罗埃尔的政变中，他被杀害，遗体与比利亚罗埃尔一同被悬挂在拉巴斯穆里略广场。"
 CBIO_BOL_hector_bilbao_roja_desc:0 "贝尔纳迪诺·毕尔巴鄂·里奥哈，1895年5月20日生于波托西的阿兰潘帕，军官，玻利维亚航空先驱。他曾赴智利深造，1919年取得军事飞行执照，1926年创办军事航空学校并任教官，是玻利维亚空军的奠基人之一。1930年他因拒绝参加推翻西莱斯·雷耶斯的政变而结怨于同僚，长期在军中被压制升迁。查科战争中他指挥了七公里之战、斯特朗盖斯特谷之役与重夺阿利瓦塔等战斗，尤以1935年成功的比利亚蒙特斯保卫战闻名，保住了油田区，被誉为这场战争玻方最杰出的将领之一。战后他声望日隆，反被视为潜在政敌，1939年被金塔尼利亚政府殴打并放逐智利。此后他加入社会主义长枪党，于1951年、1966年两度参选总统。1983年5月13日，他在拉巴斯去世；1986年经立法追授元帅军衔，成为20世纪唯一获此衔的玻利维亚人。"
 CBIO_BOL_bernardino_bilbao_rioja_desc:0 "贝尔纳迪诺·毕尔巴鄂·里奥哈，1895年5月20日生于波托西的阿兰潘帕，军官，玻利维亚航空先驱。他曾赴智利深造，1919年取得军事飞行执照，1926年创办军事航空学校并任教官，是玻利维亚空军的奠基人之一。1930年他因拒绝参加推翻西莱斯·雷耶斯的政变而结怨于同僚，长期在军中被压制升迁。查科战争中他指挥了七公里之战、斯特朗盖斯特谷之役与重夺阿利瓦塔等战斗，尤以1935年成功的比利亚蒙特斯保卫战闻名，保住了油田区，被誉为这场战争玻方最杰出的将领之一。战后他声望日隆，反被视为潜在政敌，1939年被金塔尼利亚政府殴打并放逐智利。此后他加入社会主义长枪党，于1951年、1966年两度参选总统。1983年5月13日，他在拉巴斯去世；1986年经立法追授元帅军衔，成为20世纪唯一获此衔的玻利维亚人。"
 CBIO_BOL_alberto_ostria_gutierrez_desc:0 "阿尔韦托·奥斯蒂里亚·古铁雷斯，1897年2月6日生于苏克雷，玻利维亚作家、政治家与外交官。他毕业于圣弗朗西斯科·哈维尔大学，1926年至1927年曾任报纸埃尔·迪亚里奥主编。他外交生涯漫长，历任驻秘鲁、厄瓜多尔、巴西公使，1939年至1941年任外交部长，1942年至1943年任驻智利大使。1944年因比利亚罗埃尔上台，他一度流亡。比利亚罗埃尔政权垮台后，他于1946年至1952年再任驻智利大使，主持了1950年与智利政府就玻利维亚取得太平洋出海口、以非领土补偿相交换的著名会谈。1952年革命后他再度流亡。在文学上，他著有故事与传说集，被誉为玻利维亚的掌故作家。1967年8月24日，他在智利圣地亚哥去世。"
 CBIO_BOL_enrique_finot_desc:0 "恩里克·菲诺特，1891年生于圣克鲁斯，玻利维亚历史学家、教育家、作家与外交官，父亲是曾与埃菲尔共事的法国工程师。他早年当过教师，1917年进入外交界，先后在秘鲁、阿根廷、美国、墨西哥任职，并于1927年至1931年任圣克鲁斯省议员。1936年至1937年，他在托罗政府任外交部长，正值收回标准石油之际。查科战争结束后，他作为玻利维亚代表参与对巴拉圭的边界谈判，代表本国签署了查科和平协议与最终界约。他也是多产的史学家，著述涵盖玻利维亚东部征服史、玻利维亚新史与文学史等主题，另写有两部小说。1952年12月23日去世。"
 CBIO_BOL_german_busch_beccera_desc:0 "赫尔曼·布施·贝塞拉，1903年3月23日生，父亲是德国移民医生，母亲为玻利维亚人。他毕业于军事学院，在查科战争中以勇猛著称，赢得丛林海盗的绰号，成为家喻户晓的战争英雄。1936年他参与推翻特哈达、拥立托罗的政变，任总参谋长。1937年7月他发动软政变迫使托罗辞职，自任军政府总统。1938年他召集国民大会并当选立宪总统，颁布被誉为社会宪法的1938年宪法，确立国家对自然财富的权利、承认土著公有土地。他还创设潘多省，签署对巴拉圭的查科和平条约。1939年4月他解散立法机构、宣布独裁。同年因保守势力反扑、腐败丑闻与个人抑郁，他于8月23日在拉巴斯以左轮手枪击中头部身亡，究竟是自杀还是遭暗杀至今存疑，其死结束了军人社会主义时代。"
 CBIO_BOL_Carlos_Quintanilla_desc:0 "卡洛斯·金塔尼利亚·基罗加，1888年1月22日生于科恰班巴，军人。他1911年毕业于军事学院，多次赴德国进修，查科战争中任第一、第二军军长。布施执政时他任军队总司令。1939年8月布施死后，他在军方拥戴下夺取政权，出任临时总统。任内他废止布施要求矿业寡头上缴全部出口外汇的法令，取消副总统职位，向大矿主让步，并放逐左翼将领贝尔纳迪诺·比尔巴鄂·里奥哈与激进左派党领袖何塞·安东尼奥·阿尔塞。在压力下他召集大选，1940年由恩里克·佩尼亚兰达胜出，他随即交权。离任后他出任驻教廷大使。1964年6月8日，他在故乡科恰班巴去世。"
 CBIO_BOL_Carlos_Blanco_Galindo_desc:0 "卡洛斯·布兰科·加林多，1882年3月12日生于科恰班巴，出身名门，兼具军人与学者身份，曾在阿根廷、法国进修军事，任军事学院与战争学院教官，著有军事史著作。1930年，他是推翻试图延任的埃尔南多·西莱斯·雷耶斯的政变领导人之一。西莱斯下台后，他出任军政府主席、代理总统。他自始无意恋栈，把主要精力放在为民选文人政府铺路：主持修宪限制总统连任，经公投授予大学自治，推行教育改革。1931年3月，他将政权交给民选总统丹尼尔·萨拉曼卡，随后出任驻教廷大使、驻瑞士全权公使，后又任科恰班巴省长及佩尼亚兰达政府国防部长。1943年10月2日，他在故乡科恰班巴去世。"
 CBIO_BOL_Enrique_Penaranda_desc:0 "恩里克·佩尼亚兰达·德尔·卡斯蒂略，1892年11月生于拉巴斯省拉雷卡哈的索拉塔，将军，具艾马拉土著血统。他1910年毕业于军事学院，查科战争后半程任玻利维亚陆军总司令，被视为这场战争少有的英雄，战后升为师级将军并获军事勇敢勋章。1940年他由自由党等传统政党结成的协和联盟推举，在选举中当选立宪总统，任内使玻利维亚重回战前保守路线。二战期间他倒向美国，1943年对轴心国宣战，将本国锡矿资源许诺给同盟国战争努力，并获罗斯福接见。1942年12月的卡塔维矿工屠杀造成多名矿工死亡，令其政府声誉受损。1943年12月20日，他在比利亚罗埃尔与民族主义革命运动发动的军民政变中被推翻，此后流亡。1969年12月22日，他在西班牙马德里去世。"
 CBIO_LUX_joseph_bech_desc:0 "约瑟夫·伯克1887年2月17日生于迪基希，毕业于弗里堡大学和巴黎大学法学院，1914年当选众议员。1921年起进入政府，1926年至1937年担任首相，并长期兼任外交大臣。1937年，旨在禁止共产党等组织的“秩序法”在公投中被否决，伯克辞去首相职务，但继续主持外交事务。1940年德国入侵后，他随政府流亡伦敦，担任流亡政府外交大臣。1944年，他代表卢森堡签署建立比荷卢关税同盟的伦敦协定。战后伯克积极参与欧洲一体化，签署建立欧洲煤钢共同体的《巴黎条约》，并在1955年梅西纳会议中发挥重要作用。1953年至1958年，他再次出任首相。1975年3月8日，伯克在卢森堡去世。"
 CBIO_LUX_charles_marx_desc:0 "夏尔·马克思全名路易·夏尔·马克思，1903年7月26日生于卢森堡，是外科医生和卢森堡共产党政治家。完成医学训练后，他在埃特尔布吕克行医并经营医院。1940年德国占领卢森堡后，马克思逃往法国，参加抵抗运动，组织医疗救护并为游击队提供支持，后来在法国国内军医疗系统中任职。卢森堡解放后，他回国恢复医疗工作。1945年11月，马克思代表共产党加入皮埃尔·迪蓬领导的全国团结政府，出任卫生与社会救济大臣，参与战后医疗和社会救助体系重建。1946年6月13日，他与妻子在法国发生交通事故，两人均因伤去世。"
 CBIO_LUX_damian_kratzenberg_desc:0 "达米安·克拉岑贝格1878年11月5日生于克莱尔沃，是教师和亲德政治活动家。长期在卢森堡中学任教，1930年代逐渐转向纳粹主义，并主持宣传德国文化和民族认同的组织。1940年德国占领卢森堡后，他出任德意志人民运动全国领袖，公开鼓吹卢森堡并入德意志帝国，并协助占领当局推动政治和社会德国化。该组织在压力和利益诱导下吸收大量成员，克拉岑贝格也加入纳粹党。1944年盟军逼近卢森堡时，他逃往德国，后被美军逮捕并引渡回国。卢森堡法院以叛国和与占领者合作等罪判处其死刑，1946年10月11日，克拉岑贝格在卢森堡市被枪决。"
 CBIO_LUX_charlotte_desc:0 "夏洛特女大公1896年1月23日生于贝尔格城堡，是大公威廉四世的次女。1919年1月，姐姐玛丽·阿德莱德因第一次世界大战期间的政治争议退位，夏洛特继承大公之位；同年公投确认继续保留君主制。她与波旁-帕尔马的费利克斯亲王结婚，育有六名子女。1940年德国入侵卢森堡后，夏洛特与政府流亡国外，先后辗转法国、葡萄牙、英国和北美。流亡期间，她通过广播向国内民众发表讲话，并争取盟国支持，成为卢森堡抵抗和国家延续的象征。1945年4月，她返回卢森堡。战后夏洛特继续履行国家元首职责，1964年11月逊位于长子让。1985年7月9日，她在费施巴赫城堡去世。"
 CBIO_LUX_pierre_dupong_desc:0 "皮埃尔·迪蓬1885年11月1日生于海斯多夫，是律师和基督教社会派政治家。1914年参与创建右翼党，1915年当选众议员，1926年进入政府负责财政事务。1937年11月，他接替约瑟夫·伯克出任首相。1940年德国入侵后，迪蓬随大公室和政府离境，领导卢森堡流亡政府，并在伦敦和加拿大之间组织外交、宣传和战后规划工作。1944年卢森堡解放后，他继续担任首相，先后主持解放政府和全国团结政府，推动国家重建、社会保障改革及右翼党改组为基督教社会人民党。卢森堡在其任内加入比荷卢合作体系、北约和欧洲煤钢共同体。1953年12月23日，迪蓬在首相任内去世。"
 CBIO_LUX_guillaume_soisson_desc:0 "纪尧姆·索森，1866年11月18日生于洛伦茨魏莱，卢森堡工程师、政治家，隶属右翼党。他先后在卢森堡与鲁汶接受高等工程教育，专攻物理与数学，1892年至1895年在工商学校任助教，1895年起任正式教授，长期讲授理科课程。1915年他进入胡贝尔·卢奇政府，出任公共工程与农业总干事，1916年2月24日随首相一同辞职，重返教职。1923年他在埃米尔·罗伊特政府中接替辞职的纪尧姆·莱登巴赫，再度出任公共工程总干事，1925年3月19日辞去该职，重返工商学校任教直至退休。他还整理出版了卢森堡气象观测资料，获授橡树冠勋章司令勋位。1938年8月27日，他在卢森堡市去世，享年71岁。"
 CBIO_LUX_emile_speller_desc:0 "埃米尔·斯佩莱，1875年10月7日生于尼德安文，卢森堡军官。1902年起在大公宫廷任职，历任阿道夫大公、威廉大公、摄政玛丽亚·安娜与玛丽·阿德莱德大公及夏洛特女大公的侍从武官。1927年晋升上尉，1937年2月出任宪兵志愿军团少校指挥官，同年任林业教育监督委员会主席，1938年任卢森堡最高军事法院法官。1939年他重组卢森堡军队，1940年5月10日德国入侵时仍任该军团指挥官，名义上由费利克斯亲王统率，实际指挥权在他手中。入侵后他一度被盖世太保拘押，获释后仍受严密监视直至占领结束。1945年3月他获任军队抚恤委员会委员，同年10月政府追溯承认其自1940年起卸任，1946年8月获授荣誉上校衔，此后继续担任大公宫廷总管。1952年1月17日，他在卢森堡市寓所因久病去世。"
 CBIO_LUX_guillaume_konsbruck_desc:0 "纪尧姆·康斯布鲁克，1909年9月3日生于奥斯特，卢森堡军官、政治家，后任钢铁企业阿贝德经理。1931年至1933年在法国圣西尔军校骑兵科就读，随后加入卢森堡军队，1940年已任上尉，为费利克斯亲王侍从。1940年5月10日德国入侵后，他护送世袭大公让、玛丽·加布里埃勒公主与阿利克斯公主出逃法国，其后在夏洛特女大公流亡期间任其侍从武官，随行经葡萄牙辗转流亡。1944年9月12日，他以少校身份代表首相迪蓬返回卢森堡，视察大公宫及多处政府建筑并参加盟军会议，1945年4月17日在边境迎接归国的夏洛特女大公。战后他参与制定卢森堡语官方正字法，1946年8月获任供应与经济事务大臣，1951年获授橡树冠勋章司令勋位。1983年10月3日，他在卢森堡去世。"
 CBIO_LUX_felix_of_luxembourg_desc:0 "费利克斯亲王，1893年9月28日生于奥地利施瓦措，波旁帕尔马公爵罗伯特一世之子，奥地利皇后齐塔之弟。他在维也纳附近耶稣会学校毕业，1913年赴英国斯托尼赫斯特学院深造英语，一战爆发后加入奥匈军队，任第十五龙骑兵团军官，在东线作战，1917年曾在戈里齐亚救起险些溺水的姐夫、奥皇卡尔一世。1918年11月退役，婚前入籍卢森堡，1919年11月与表姐夏洛特女大公成婚，获封卢森堡亲王，育有六名子女，长子让为王储。战间期他任志愿军团上校、卢森堡红十字会主席。1940年德国入侵后随家人流亡法国、葡萄牙、美国与加拿大，1942年定居伦敦并加入英军任联络官，隶属第21集团军，参与解放巴黎，1944年9月随子让参与解放卢森堡。战后他协助重建卢森堡军队，1945年至1967年任监察总监。1970年4月8日，他在费施巴赫城堡去世，享年76岁。"
 CBIO_LUX_pierre_krier_desc:0 "皮埃尔·克里尔，1885年3月5日生于博纳沃，卢森堡政治家，早年曾任锁匠。1916年他加入社会党周刊《铁匠炉》编辑部，同年9月协助创立卢森堡首个社会主义工会卢森堡金属工人联合会。1918年5月30日，他代表社会民主党当选埃施选区众议院议员，1924年至1937年任卢森堡市市议员。1919年7月起，他出任自由工会总书记，兼任其机关刊物《无产者》主编。1937年11月5日，他在迪蓬克里尔政府中出任劳工大臣，此后终身留任此职，包括1940年德国入侵后的流亡政府时期。他的妻子莉莉·贝克尔同为工会活动家与妇女权益倡导者，其弟安托万·克里尔亦从政。1947年1月20日，他在任内于卢森堡去世，享年61岁。"
 CBIO_NEP_bhakti_thapa_desc:0 "巴克提·塔帕（Bhakti Thapa，约1741年—1815年4月）出生于拉姆琼，早年效力拉姆琼王国，后加入尼泊尔廓尔喀军队，历任指挥与行政职务。在英尼战争（1814—1816年）西部战线，他担任马拉乌要塞的重要守将。1815年4月，他在德奥塔尔阵地率领约两千名士兵向英军发动多次反击，最终在战斗中阵亡。英军指挥官对其作战表现表示敬意，并将遗体交还尼泊尔方面。后世尼泊尔史书与民间将其视为英尼战争中的重要军事人物之一。"
 CBIO_NEP_amar_thapa_desc:0 "阿马尔·辛格·塔帕（Amar Singh Thapa，约1751年—1816年）是尼泊尔扩张时期的重要军事将领，获封“巴达·卡吉”称号，曾任库马翁、加尔瓦尔等西部地区的军政负责人，参加尼泊尔统一战争及第二次尼泊尔—西藏战争。在英尼战争（1814—1816年）中，他担任西部战线最高指挥官，率军坚守马拉乌要塞及周边山地阵地。英军奥赫特洛尼部切断比拉斯布尔补给线并以重炮持续进攻后，他最终接受英军提出的投降条件。战败后不久，塔帕于1816年去世。"
 CBIO_NEP_mohan_shamsher_desc:0 "莫汉·沙姆谢尔·姜格·巴哈杜尔·拉纳（Mohan Shumsher Jang Bahadur Rana，1885年12月23日—1967年1月6日）出生于加德满都，是首相钱德拉·沙姆谢尔与钱德拉·洛卡·巴克塔·拉克什米·德维之子。他于1948年4月出任尼泊尔首相兼外交大臣，是拉纳王朝最后一位世袭首相，主政至1951年11月。面对国王特里布万加强君权并引入民主的努力，他持反对立场。1950年，在特里布万国王进入印度使馆并寻求政治支持后，拉纳政府宣布其孙贾南德拉继位。1951年民主运动后，他与国王及尼泊尔大会党达成德里协议，短暂组建联合政府，随后因国内反对压力辞职，同年12月流亡印度，1967年在班加罗尔去世。"
 CBIO_NEP_rudra_shamsher_desc:0 "鲁德拉·沙姆谢尔·姜格·巴哈杜尔·拉纳（Rudra Shumsher Jang Bahadur Rana，1879年—1964年）是比尔·沙姆谢尔之子和拉纳家族成员，早年进入军队，历任西部总司令及陆军元帅。1934年，他因继承资格问题受到质疑及宫廷斗争，被居达·沙姆谢尔剥夺继承资格，外放帕尔帕担任行政长官。1950年，他支持特里布万国王及民主运动，反对拉纳政权。1951年政权更迭后，他重新获得元帅衔，但在拉纳家族内部政治冲突中长期处于边缘位置，1964年去世。"
 CBIO_NEP_william_stevenson_meyer_desc:0 "威廉·史蒂文森·迈耶（William Stevenson Meyer，1860年2月13日—1922年10月19日）是英国印度文职官员，长期在英属印度行政体系中担任高级职务，主要从事财政、商业和殖民行政事务。他曾参与《印度帝国地名词典》的编纂及相关地区资料整理，工作涉及英属印度财政管理、统计和区域研究，1922年去世。"
 CBIO_NEP_william_meyer_desc:0 "威廉·史蒂文森·迈耶（William Stevenson Meyer，1860年2月13日—1922年10月19日）是英国印度文职官员，长期在英属印度行政体系中担任高级职务，主要从事财政、商业和殖民行政事务。他曾参与《印度帝国地名词典》的编纂及相关地区资料整理，工作涉及英属印度财政管理、统计和区域研究，1922年去世。"
 CBIO_BHU_jigme_wangchuck_desc:0 "吉格梅·旺楚克，不丹旺楚克王朝第二任国王，生于1905年，1926年继承父亲乌金·旺楚克的王位。他在位期间继续巩固中央王权，整顿税收、土地和司法制度，改善交通与行政管理，同时保持不丹对外相对封闭，仅同英属印度保持稳定联系。印度独立后，不丹于1949年同印度签订《永久和平与友好条约》，重新确定两国关系。1952年他去世，由长子吉格梅·多吉·旺楚克继位。"
 CBIO_BHU_jigme_dorji_wangchuck_desc:0 "吉格梅·多吉·旺楚克，不丹旺楚克王朝第三任国王，1928年出生，1952年继位。他着手改变不丹长期封闭的状态，1953年设立国民议会，推行土地改革，废除农奴制和强迫劳役，并逐步建立现代司法、教育、医疗和行政体系。1959年颁布《最高法典》，首次系统编纂不丹民事与刑事法律。在其统治下，不丹修建公路，推行发展计划，逐步扩大对外交往，并于1971年加入联合国。1972年，他在肯尼亚内罗毕去世。"
 CBIO_BHU_andruk_tashi_desc:0 "恩珠仓·贡布扎西，1905年出生于西藏康区理塘，早年经商，后来成为藏区叛乱的重要组织者。1958年，他联合康区和安多各地武装力量成立“四水六岗”，并担任主要领导人。1959年事败，参与掩护第十四世达赖喇嘛离开西藏前往印度。此后流亡印度，1964年卒于大吉岭。"
 CBIO_BHU_namgyal_bahadur_desc:0 "南嘉·巴哈杜尔，不丹陆军高级军官，长期在王室军队中任职，一度居于军队指挥层。1964年4月，不丹首相吉格梅·帕尔登·多吉在彭措林遇刺身亡，南嘉·巴哈杜尔随后被捕，被控参与策划刺杀。经审判定罪后，他于同年5月17日被行刑队处决。"
 CBIO_BHU_tsepon_shatra_desc:0 "夏扎·班觉多吉（Paljor Dorje Shatra，约1860年—约1923年或1926年）西藏贵族和政治人物，1890年代进入噶厦政府，先后担任噶伦和伦钦等高级职务。1907年后，他成为第十三世达赖喇嘛的重要大臣，1910年随达赖喇嘛前往英属印度。1913年至1914年，他作为西藏方面全权代表参加西姆拉会议，同英国和中华民国代表进行谈判。此后他继续主持噶厦政务，是20世纪初西藏政府的重要外交和行政人物。"
 CBIO_BHU_jigme_palden_dorji_desc:0 "吉格梅·帕尔登·多吉（Jigme Palden Dorji，1919年12月14日—1964年4月6日）不丹政治人物，索南·托布加伊·多杰之子，也是国王吉格梅·多吉·旺楚克的姻亲和亲信。20世纪50年代，他出任不丹政府首脑，1958年正式使用首相称号，协助国王推行行政、经济和社会改革，推动修建道路、建立现代政府机构并扩大同印度的合作。其改革触动部分军队和宗教势力的利益。1964年4月6日，他在彭措林遇刺身亡。"
 CBIO_BHU_sonam_tobgay_dorji_desc:0 "索南·托布加伊·多杰（Sonam Topgay Dorji，1896年—1953年）不丹多吉家族的重要政治人物。1917年，他继承父亲乌金·多杰的贡钦和对外贸易代表职务，成为第一任国王乌金·旺楚克及第二任国王吉格梅·旺楚克的重要顾问，长期负责不丹同英属印度及独立后的印度之间的外交与贸易事务。1949年，他参与促成《印度—不丹永久和平与友好条约》的签订。其女格桑却登后来嫁给吉格梅·多吉·旺楚克，使多吉家族与旺楚克王室建立紧密的姻亲关系。1953年，他在噶伦堡去世。"
 CBIO_BHU_gendun_rinpoche_desc:0 "更登仁波切（Gendun Rinpoche，1918年—1997年10月31日）出生于西藏康区囊谦，是噶玛噶举派僧人和禅修导师。他七岁进入寺院，十七岁受具足戒，二十一岁开始传统的三年三个月闭关，此后又长期独居修行。1959年离开西藏后，他曾在不丹主持寺院，随后前往印度追随第十六世噶玛巴。1975年，他奉噶玛巴之命前往法国弘法，参与建立达波噶举林及多座闭关中心，长期培养欧洲佛教僧侣和禅修者，1997年在法国去世。"
 CBIO_IRE_eoin_oduffy_desc:0 "埃翁·奥达菲1890年1月28日生于莫纳亨郡卡里克达夫，原名欧文·达菲。爱尔兰独立战争期间，他在爱尔兰共和军中迅速升迁，曾领导莫纳亨旅和北部师，并于1922年短暂担任爱尔兰共和军参谋长。英爱条约签署后，他支持临时政府，进入国民军并参与内战。1922年，奥达菲出任新成立的爱尔兰自由邦警察总监，负责建立非武装警察体系，1933年被德瓦莱拉政府解除职务。同年，他接掌军人同志会，将其改组为穿蓝衫制服的国民卫队，并成为统一爱尔兰党的首任领袖。由于政治言论激进和组织内部矛盾，他于1934年辞去党魁职务，此后公开转向法西斯主义。1936年西班牙内战爆发后，他组织爱尔兰旅赴西班牙支持佛朗哥，但该部作战表现不佳，次年即返回爱尔兰。奥达菲晚年政治影响迅速衰落，1944年11月30日在都柏林去世。"
 CBIO_IRE_james_larkin_desc:0 "詹姆斯·拉金1874年1月28日生于利物浦一个爱尔兰移民家庭，幼年贫困，早早辍学做过水手和码头工人。1905年利物浦码头罢工后，他成为全国码头工人联合会组织者，1907年被派往贝尔法斯特，曾推动新教与天主教工人共同参加罢工。1909年，他在都柏林创建爱尔兰运输与普通工人工会，随后创办《爱尔兰工人报》，并参与建立爱尔兰工党。1913年都柏林大罢工中，拉金领导工人与以威廉·马丁·墨菲为首的雇主集团对抗，并参与创建爱尔兰公民军。1914年他赴美国从事工运和反战活动，1920年因“刑事无政府主义”罪被判刑，1923年获赦后被驱逐回爱尔兰。回国后，他另组爱尔兰工人联合会，并多次当选国会议员。拉金以强烈的群众演说、跨教派组织能力和激进工团主义著称，是二十世纪爱尔兰工人运动最具影响力的人物之一。1947年1月30日，他在都柏林去世。"
 CBIO_IRE_william_norton_desc:0 "威廉·约瑟夫·诺顿1900年11月2日生于都柏林，1916年进入邮政系统工作，后来长期担任邮政工人工会总书记。1926年，他首次当选国会议员；1932年重返国会后被推举为工党党魁，此后领导该党长达二十八年。诺顿在1930年代支持德瓦莱拉政府部分经济与主权政策，同时保持工党独立地位。1948年大选后，他参与促成由多个政党组成的首届跨党派政府，出任副总理兼社会福利部长，任内推动社会保障制度和公务员劳资协商机制建设。1954至1957年第二届跨党派政府时期，他再次担任副总理，并兼任工商部长。诺顿善于在两大政党之间维持工党的议会影响力，使该党首次成为联合政府中的关键力量。1960年，他辞去工党党魁职务；1961年离开国会。1963年12月4日，他在都柏林去世。"
 CBIO_IRE_michael_joe_costello_desc:0 "迈克尔·科斯特洛（迈克尔·乔·科斯特洛），全名迈克尔·约瑟夫·科斯特洛，1904年7月4日生于蒂珀雷里郡克拉夫乔丹，教父是1916年起义领袖托马斯·麦克多纳。目睹父亲被黑棕部队逮捕后，他投身独立战争，任蒂珀雷里旅情报官。1922年他加入国民军参加内战，柯林斯在他18岁时便将其擢升为上校指挥官。1924至1926年任情报总监，1926年赴美国利文沃思堡陆军参谋学院深造，归国后筹建军事学院并于1933年任院长。1939年二战爆发后，他出任南部军区司令兼第一师师长，创办国防军刊物卫士报，将防御重心置于香农河口一带，此举一度招致他策划政变的流言。1941年晋少将，1944年其部队创下负重四十磅徒步四十四英里耗时十一小时的和平时期纪录。1945年晋中将，1946年退役后出任爱尔兰糖业公司总经理，消弭长期劳资纠纷，此后二十年公司未再罢工，并推动甜菜育种科学化管理。1957年他为公司购入爱尔兰第一台电子计算机，1958年受总理勒马斯委派创办埃林食品公司。1964年获都柏林大学荣誉法学博士。1986年10月20日，他去世，享年82岁。"
 CBIO_IRE_michael_costello_desc:0 "迈克尔·科斯特洛（迈克尔·乔·科斯特洛），全名迈克尔·约瑟夫·科斯特洛，1904年7月4日生于蒂珀雷里郡克拉夫乔丹，教父是1916年起义领袖托马斯·麦克多纳。目睹父亲被黑棕部队逮捕后，他投身独立战争，任蒂珀雷里旅情报官。1922年他加入国民军参加内战，柯林斯在他18岁时便将其擢升为上校指挥官。1924至1926年任情报总监，1926年赴美国利文沃思堡陆军参谋学院深造，归国后筹建军事学院并于1933年任院长。1939年二战爆发后，他出任南部军区司令兼第一师师长，创办国防军刊物卫士报，将防御重心置于香农河口一带，此举一度招致他策划政变的流言。1941年晋少将，1944年其部队创下负重四十磅徒步四十四英里耗时十一小时的和平时期纪录。1945年晋中将，1946年退役后出任爱尔兰糖业公司总经理，消弭长期劳资纠纷，此后二十年公司未再罢工，并推动甜菜育种科学化管理。1957年他为公司购入爱尔兰第一台电子计算机，1958年受总理勒马斯委派创办埃林食品公司。1964年获都柏林大学荣誉法学博士。1986年10月20日，他去世，享年82岁。"
 CBIO_IRE_p_a_mulcahy_desc:0 "P.A.穆尔卡希，全名帕特里克·安东尼·穆尔卡希，1897年11月4日生于沃特福德市，是理查德·詹姆斯·马尔卡希的胞弟。1913年他入职邮政部门任电报员，1915年加入英国陆军皇家工兵团参加一战，1917至1918年在法国服役。1919年3月他退伍返回都柏林邮局工作，随即加入爱尔兰共和军，因此被邮局解职，历任米德克莱尔旅助理情报官、蒂珀雷里北旅通信官。1921年12月他支持英爱条约，1922年3月加入国民军，参与内战。1924年2月他获任炮兵团指挥官，同年4月因战后裁军降为少校，1931年11月起任炮兵总监。1935年6月起代理、1936年9月正式出任空军司令，1939年4月晋升上校。二战紧急状态期间他大部分时间投身空防事务，1942年12月回任炮兵总监直至1948年12月。此后他历任西部军区司令（1949年）、军需总监（至1952年）、东部军区司令（至1955年），1955年1月晋升少将并接任其兄长早年曾任的参谋总长一职。1923年他初婚约瑟芬·巴雷特（1935年去世），1939年再娶其妹保利娜·巴雷特。1987年5月16日，他去世，享年89岁。"
 CBIO_IRE_liam_archer_desc:0 "利亚姆·阿彻，全名威廉·阿洛伊修斯·阿彻，1892年6月18日生于都柏林，父亲爱德华为邮政电报督察。他中学毕业后在都柏林邮政总局任职员，1915年加入爱尔兰志愿军，1916年复活节起义中负伤，此后在独立战争中任F连工程分队队长，并凭邮政职员身份协助柯林斯搜集情报。1922年3月他加入国民军参加内战，1924年因战后裁军降为少校，此后历任志愿预备役与军官训练团主任、都柏林军区司令。1932年3月他出任情报总监，主持对情报部门的三十年代改革，并与英方情报机构建立联系；二战爆发后，1940年5月他赴伦敦自治领事务部秘密会晤英方军官，商讨应对德国入侵的联合防御方案。1941年他升任助理参谋总长，1948年至1952年任参谋总长。1941年他获总理德瓦莱拉颁发1916年奖章，为首位在役获此殊荣的国防军成员。1952年1月他晋升中将后以三十年军龄退役，此后长期投身老兵福利事务。1969年7月22日，他去世，葬于迪恩斯格兰奇公墓。"
 CBIO_IRE_oscar_traynor_desc:0 "奥斯卡·特雷纳，1886年3月21日生于都柏林，父亲帕特里克是芬尼亚会成员、书商。1899年父亲去世后他辍学，先后学做木雕匠、排字工，并曾为都柏林及贝尔法斯特凯尔特队担任守门员，1910至1912年随队巡回奥匈帝国与德国。他加入爱尔兰志愿军与共和兄弟会，1916年复活节起义中率部驻守都柏林大都会酒店，起义后被囚于威尔士，同年12月获释。独立战争期间他任都柏林旅副指挥，1920年11月升任旅指挥官，1921年5月指挥攻打海关大楼，同年6月率十二人小队伏击英军，首次在实战中使用汤普森冲锋枪。内战中他站在反条约一方，任都柏林战事最高指挥官，兵败后转入游击，1922年7月被俘，囚至1924年。1932年费安纳·佛尔执政后他当选议员并长期连任。1936年6月起任国防部政务次官，同年9月转任邮电部长，1939年9月起任国防部长直至1948年2月，执掌该部贯穿二战紧急状态全程，1951至1954年再任国防部长，1957至1961年任司法部长。他终身热爱足球，1948年起任爱尔兰足协主席直至去世。1963年12月14日，他在都柏林去世，享年77岁，葬于格拉斯尼文公墓共和墓区。"
 CBIO_IRE_frank_fahy_desc:0 "弗兰克·费伊，全名弗朗西斯·帕特里克·费伊，1879年5月23日生于戈尔韦郡基尔克里斯特，父亲约翰在当地国民学校任教。他毕业于蒙格雷特学院与戈尔韦大学学院，1906至1921年在都柏林卡斯尔诺克学院教授拉丁语、爱尔兰语与科学。1918年他当选新芬党国会议员，因该党弃权政策未就任英国下议院席位，转而加入第一届国会。1921年再度当选，因反对英爱条约未出席自由邦第三、四届国会。1922年内战期间他持反条约立场，仍保住戈尔韦七席之一。1926年他随德瓦莱拉加入新成立的费安纳·佛尔党，1927年8月随该党议员重返国会。1932年该党执政后，他在本选区得票居首，随即当选国会议长，此后连任该职直至1951年，任期十九年为历届最长，即便1948年该党败选后仍获留任。他还兼任地方任命委员会与文官事务委员会主席，1949年率团出席斯德哥尔摩各国议会联盟大会，1950年在都柏林主持同一会议。1951年因健康原因辞去议长职务。1953年7月12日，他去世，葬于迪恩斯格兰奇公墓。"
 CBIO_IRE_michael_brennan_desc:0 "迈克尔·布伦南，1896年2月2日生于克莱郡米利克，1911年加入爱尔兰共和兄弟会，两年后协助在利默里克组建爱尔兰志愿军，参与筹备1916年复活节起义，出任东克莱旅首任指挥官，后统辖克莱郡全部三个旅，独立战争期间该部改编为第一西部师。他是西部或南部各师指挥官中唯一接受英爱条约者，1922年7月奉命夺取利默里克，其装备匮乏的部队以谈判拖延时间，终在7月20日经激战攻克该市，随后又击败克莱郡反条约武装。他历任利默里克军区司令、南部军区司令、副参谋长、监察长，1931年10月出任参谋总长。费安纳·佛尔上台后，面对警察总监埃翁·奥达菲要求军方抵制新政府的暗示，他坚持军队应服从民选政府，因而获政府信任，连任三届共近九年，为多数前任所不及。任内他多次向政府力陈国防经费不足之弊，未获重视；1939年12月凤凰公园军火库遭爱尔兰共和军突袭、弹药被劫，他于1940年1月被撤换，拒绝降级指挥，以中将军衔退役，转任公共工程部总监察官至1961年。1986年10月24日，他在都柏林去世，葬于迪恩斯格兰奇公墓。"
 CBIO_IRE_richard_james_mulcahy_desc:0 "理查德·詹姆斯·马尔卡希，1886年5月10日生于沃特福德郡，父亲帕特里克为邮局职员。1913年他加入爱尔兰志愿军并入盖尔联盟与爱尔兰共和兄弟会，1916年复活节起义期间在阿什伯恩战斗中任副指挥，此役是当周起义军少数胜绩之一。起义后被关押至同年12月获释，1918年当选国会议员并任国防部长，1919年3月出任爱尔兰共和军参谋长直至1922年1月，与柯林斯共同主导对英游击战。他支持英爱条约，柯林斯遇刺后接任临时政府部队总司令，主导对反条约武装的内战，因下令处决被俘持械反条约人员而备受争议，共计七十七名反条约囚犯遭处决。1922至1924年任国防部长，1924年因军队理事会遭解散辞职抗议，1927年重返内阁任地方政府与公共卫生部长至1932年。1933年费恩盖尔党成立时他予以支持，1944年科斯格雷夫辞职后接任党魁直至1959年，同期兼任反对党领袖。1948年他促成五党联合，但因内战旧怨不为共和党领袖麦克布莱德接受，遂让位于约翰·科斯特洛出任总理，自己两度出任教育部长（1948至1951年、1954至1957年）。1971年12月16日，他在都柏林辞世，享年85岁。"
 CBIO_IRE_dan_mckenna_desc:0 "丹尼尔·麦肯纳，1892年12月1日生于伦敦德里郡德雷珀斯敦，1913年加入爱尔兰共和兄弟会，独立战争期间任第二北部师第四旅指挥官，后升任该师副指挥。1922年9月他获委任为国民军上校指挥官。1940年1月，他在越级情况下意外接替布伦南出任参谋总长，据信是其干劲早年已给德瓦莱拉留下印象。他就任后大力整顿军队积弊，指出许多军官年迈缺乏冲劲，部队为兼顾治安与海防而分散全国，防御几乎处处薄弱，自动武器、反坦克炮与火炮的短缺更使军队难以抵御入侵。他设法从英国零星进口军火，并推动国内军火与装甲车制造。1940年5月德国入侵法国与低地国家后，他说服德瓦莱拉与国防部长奥斯卡·特雷纳全面动员，正规军于1941年3月由一万三千人扩充至四万一千人，1941年1月又建立起近九万人的地方防卫军。1941年5月他晋升中将，将军队编为两个师，一防边境，一守南部港口。战后政府大幅削减国防预算，至1946年5月正规军仅余九千人。1948年12月他晋升上将，1949年1月退役，由利亚姆·阿彻接任。1975年4月11日，他去世，葬于格拉斯尼文公墓。"
 CBIO_IRE_john_byrne_desc:0 "约翰·奥伯恩，1884年4月24日生于威克洛郡塞斯金，就读塔洛帕特里克修道院学校，后入皇家大学修读心智与道德科学，1907年以第一名一等荣誉毕业。他曾短暂供职伦敦文官系统及爱尔兰土地委员会，积累不动产法经验，后入国王旅馆学习法律，1911年获爱尔兰大律师资格，主要在伦斯特巡回法庭执业。他参与英爱条约谈判担任爱尔兰代表团法律顾问，1922年入选自由邦宪法起草委员会，1923年入选司法委员会，其建议促成1924年法院法通过。1924年他获封御用大律师，为自由邦末任此衔获得者，同年6月7日出任第二任总检察长，任内代表国家出席边界委员会。1926年1月他获任高等法院法官，1934年在奥达菲案中下令释放时任蓝衫党领袖埃翁·奥达菲，此判决令政府尴尬却令反对派称快。尽管出身库曼纳盖尔阵营，1940年1月他仍获费安纳·佛尔政府擢升最高法院法官，就任之际正值总统道格拉斯·海德将危害国家治安修正法案提交最高法院裁定合宪性一案。1947年他就新芬党基金案作出的判决被公认为爱尔兰宪法法奠基性判例之一。1954年1月14日，他在任内去世，享年69岁。"
 CBIO_IRE_sean_lemass_desc:0 "肖恩·勒马斯，原名约翰·弗朗西斯·勒马斯，1899年7月15日生于都柏林，家中经营帽饰用品店。1915年他加入爱尔兰志愿军，1916年复活节起义中在都柏林邮政总局及摩尔街参战，起义失败后因年幼获释。内战中他站在反条约一方，任占领四法院的爱尔兰共和军二号指挥官，1922年6月兵败被俘；其兄诺埃尔同为反条约军人，1923年遭亲条约方绑架杀害。1924年获释后他当选新芬党国会议员，1926年协助德瓦莱拉筹组费安纳·佛尔党，1932年该党执政后他出任工商部长（1932至1939年）。二战爱尔兰紧急状态期间，他改任新设的物资供应部长（1939至1945年），负责统筹燃油、煤炭等战略物资配给，确保中立的爱尔兰渡过战时短缺。他此后历任副总理兼工商部长（1945至1948年、1951至1954年、1957至1959年），1959年接替德瓦莱拉出任总理直至1966年，任内主导第一期经济扩张计划，推动爱尔兰转向对外开放，并于1965年与北爱尔兰总理奥尼尔实现历史性会晤。1971年5月11日，他在都柏林梅特医院因肺部并发症去世，享年71岁，葬于迪恩斯格兰奇公墓。"
 CBIO_IRE_douglas_hyde_desc:0 "道格拉斯·海德，笔名欢乐小枝，1860年1月17日生于罗斯康芒郡卡斯尔雷亚，父亲亚瑟为圣公会牧师。他早年在弗伦奇帕克乡间习得爱尔兰语，1884年毕业于都柏林三一学院。1893年他与埃翁·麦克尼尔共同创立盖尔联盟，出任首任主席，致力于爱尔兰语复兴与文化保护，主张运动应超越党派与教派；1909年起任都柏林大学学院首任现代爱尔兰语教授直至1932年退休。1915年，因联盟日益政治化并明确支持爱尔兰独立，他辞去主席一职。他终身未参与武装独立运动，1925年当选自由邦参议员。1937年新宪法设立总统一职，1938年6月25日各党一致推举他出任首任总统，任期至1945年6月24日，其间1943年爱尔兰邮政发行纪念邮票庆祝盖尔联盟成立五十周年，1940年他将危害国家治安修正法案提请最高法院审议合宪性。1949年7月12日，他在都柏林去世，享年89岁，葬于弗伦奇帕克波塔哈德教堂墓地；因其新教徒身份，天主教内阁成员依教会规定未入教堂参加葬礼，仅在庭外等候。"
 CBIO_IRE_sean_ceallaigh_desc:0 "肖恩·T·奥恰莱伊，原名约翰·托马斯·凯利，1882年8月25日生于都柏林卡佩尔街，父亲塞缪尔为鞋匠。1898年他入职爱尔兰国家图书馆任信差，同年加入盖尔联盟，1915年任总书记；1905年加入新芬党，1908至1925年任该党名誉书记。1906年他当选都柏林市议会议员，1916年复活节起义中任帕德里克·皮尔斯的参谋官。1918年他当选国会议员，任第一届国会首任议长直至1921年，1919年代表爱尔兰赴巴黎和会争取承认未果，此后出任驻意大利、美国的共和国特使。他反对英爱条约，内战期间被囚至1923年12月，后赴美任新芬党特使两年。1926年他随德瓦莱拉转投费安纳·佛尔党，1932年该党执政后任行政委员会副主席兼地方政府与公共卫生部长。1937年新宪法确立副总理一职，他成为首任副总理直至1945年，同期兼任1939年教育部长及财政部长（1939至1945年），任内推动1942年中央银行法通过。1945年他当选第二任总统，连任至1959年，任内主持1949年爱尔兰共和国正式成立。1966年11月23日，他在都柏林去世，享年84岁，葬于格拉斯尼文公墓。"
