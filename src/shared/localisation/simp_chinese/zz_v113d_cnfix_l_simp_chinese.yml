 KHM_ma_hushan_desc:0 "马虎山（？—1953），回族，甘肃临夏人，西北马家军军官，军阀马仲英之姐夫。1933年春随马仲英入新疆，任旅长兼前敌总指挥。1934年夏，马仲英赴苏联后，马虎山代理新编三十六师师长，移师和田，击灭夏满素尔所建伪\"和田伊斯兰国\"，割据叶城以东各县。据和田期间，以廉价桑皮纸印制军用纸币（即\"马虎山票\"），强迫辖区流通，百姓深恶痛绝。1936年与新疆省督盛世才签订和平条款。1937年春，麻木提举兵反盛后败退莎车，马虎山以\"平叛\"为名出兵兼并其残部，先后占领疏附（今喀什市）、疏勒、巴楚、阿克苏，进而围攻库车。盛世才借苏联之力反击，同年10月大败马部，三十六师覆灭。马虎山携带大量黄金，率少数随从经叶城出走克什米尔，亡命印度。其后回国，1953年参与马良反革命武装叛乱，被人民解放军击毙。"
 SIK_sheng_shicai_desc:0 "盛世才（1892年—1970年7月13日），字晋庸，原名振甲，辽宁开原人，汉族。毕业于云南陆军讲武堂韶关分校，后入日本陆军大学第十六期深造。早年历任奉军排长、连长，回国后辗转任职。1930年入新疆，以参谋身份蛰伏经营，暗中培植亲信势力。1933年4月趁\"四一二\"政变夺取新疆军政大权，被推举为临时边防督办，开始长达十一年的个人独裁统治。主政初期，盛世才提出\"反帝、亲苏、民平、清廉、和平、建设\"六大政策，借苏联军事援助先后击败入疆的马仲英部及割据伊犁的张培元，统一全疆；同时推行经济文教建设，引进苏联专家，并广纳中共干部协助治理。其间盛世才秘密加入苏联共产党，毛泽民、陈潭秋、林基路等中共人员先后来疆任职。统治后期，随苏德战争爆发、苏联援助断绝，盛世才急剧转向，投靠重庆国民政府。1942年起炮制系列\"阴谋暴动案\"，将陈潭秋、毛泽民、林基路等中共党员秘密处决，同时驱逐苏联势力出疆，大肆罗织冤狱，株连数千人，整个新疆沦为恐怖统治之地。1944年被蒋介石强令调离，出任农林部长，结束其十一年的新疆统治。1949年赴台，历任\"总统府国策顾问\"等职。1970年7月13日在台北病逝。"
