l_simp_chinese:
 CBIO_COL_alfonso_lopez_pumarejo_desc:0 "阿方索·洛佩斯·普马雷霍1886年1月31日生于托利马省翁达，父亲佩德罗·A·洛佩斯是咖啡出口商，母亲罗萨里奥·普马雷霍出身加勒比海岸家庭。他先后就读波哥大圣路易斯·贡萨加公学与商业中学，后赴伦敦与纽约深造经济与金融，未取得正式学位便回国协助父亲打理家族企业洛佩斯公司。他早年投身自由党，1915年当选托利马省议会议员，1918年创办美洲商业银行，1925年任众议员，1930年任参议员，1929年主持本党全国代表大会。1934年他当选总统，推行名为\"前进中的革命\"的改革纲领，包括1936年宪法改革，确立劳工组织权、财产的社会职能原则，并推动教育、税制与土地方面的现代化立法，是二十世纪哥伦比亚立法变革最集中的一届政府。1938年他卸任交由桑托斯接任，1942年再度当选总统，任内两度离职：一次因1944年7月帕斯托发生的军事政变一度遭扣押，很快获释复职；另一次因政策引发的危机几乎迫使他辞职，后在支持他的工会运动压力下重新执掌政权，但1945年他最终辞职，由阿尔韦托·耶拉斯·卡马戈继任。他一生两度当选总统，累计执政时间为二十世纪哥伦比亚之最。1949年他成为英国大使，长年往返伦敦、纽约与哥伦比亚之间。1959年11月20日在伦敦去世。"
 CBIO_COL_eduardo_santos_desc:0 "爱德华多·桑托斯·蒙特霍1888年8月28日生于波哥大，是独立战争女英雄安东尼娅·桑托斯的后人，安东尼娅是他祖父的姐妹。父亲弗朗西斯科·桑托斯是桑坦德省颇具声望的律师，1900年去世时留下足够的财富供子女在国内外接受教育。他就读罗萨里奥圣母学院，1908年在国立大学取得法学与政治学学位，随后赴巴黎大学专攻文学与社会学。1913年他买下波哥大《时代报》，此后长期执掌这份报纸，自称\"生平别无所愿，只愿做记者\"。他早年属共和党，该党解散后转入自由党。1930年出任外交部长，任内推动解决与秘鲁的莱蒂西亚边境冲突，1933年双方签署条约结束敌对状态；此后他历任桑坦德省省长、哥伦比亚出席国际联盟大会代表团负责人、众议员和国会议长。1937年自由党总统恩里克·奥拉亚·埃雷拉去世后，他作为自由党候选人于1938年大选中在无人挑战的情况下当选总统，8月7日就职。任内哥伦比亚在第二次世界大战中保持中立姿态，他创设劳工部与国土信贷院，推动师范教育发展。1942年卸任后由洛佩斯·普马雷霍再度接任。晚年他往返于欧洲、美国与哥伦比亚之间，1974年3月27日在波哥大去世。"
 CBIO_COL_mariano_ospina_perez_desc:0 "马里亚诺·奥斯皮纳·佩雷斯1891年11月24日生于麦德林一个显赫的安蒂奥基亚家庭，祖父马里亚诺·奥斯皮纳·罗德里格斯曾任保守党创始总统之一，父亲图利奥·奥斯皮纳是矿业工程师与历史学家，与叔叔佩德罗·内尔一同将中美洲的咖啡种植技术引入本地，并创办了安蒂奥基亚矿业学校。他本人取得矿业工程学位后赴美国路易斯安那州立大学深造，获硕士学位。归国后他长期活跃于保守党政坛，1926年出任公共工程部长，此后又主持全国咖啡种植者联合会，任内推动咖啡出口的增长，并促成了全国电信公司特尔康的创建。1946年，趁自由党分裂，他当选总统，组建名为\"全国团结\"的联合政府，纳入自由党人参与，试图弥合党争。然而随着被称为\"暴力主义\"的党派仇杀在全国蔓延，这一联合逐渐瓦解。1948年4月9日自由党领袖豪尔赫·埃列塞尔·盖坦遇刺，引发波哥大暴动，即\"波哥大风暴\"，暴徒冲击总统府要求他辞职，他以一句\"对哥伦比亚民主而言，宁要死去的总统，不要逃亡的总统\"作答，勉力渡过危机。1949年9月议会内的枪击事件造成一名议员身亡、前部长豪尔赫·索托·德尔科拉尔重伤并最终于数年后不治。他任内还创办师范学校培养师资、发起反饮用奇恰酒的卫生运动，并于1948年主办第九届泛美会议，外交部长劳雷亚诺·戈麦斯出任大会主席。1976年4月14日在波哥大去世。"
 CBIO_COS_leon_cortes_castro_desc:0 "莱昂·科尔特斯·卡斯特罗，哥斯达黎加阿拉胡埃拉人，早年任教师、律师，历任阿拉胡埃拉省省长、国家档案馆馆长、太平洋铁路管理局局长及国会主席，后任公共工程与农业部长。一九三二年当选第三指定继承人，一九三六年代表民族共和党当选总统，任期至一九四零年。执政期间大力推进公共工程建设，新建众多学校并主持圣何塞拉萨瓦纳国际机场落成，故其政府被时人称作\"水泥与钢筋政府\"。他将哥斯达黎加国际银行改组为哥斯达黎加国家银行，统一货币发行，并签署科尔特斯－奇滕登香蕉合同，推动太平洋南部基诺斯港与戈尔菲托港的建设。卸任后成为反对卡尔德龙政府的主要领袖，一九四四年再度竞选总统，败于特奥多罗·皮卡多·米哈尔斯基。一九四六年三月三日在圣安娜猝逝。"
 CBIO_COS_ricardo_jimenez_oreamuno_desc:0 "罗穆阿尔多·里卡多·希门尼斯·奥雷亚穆诺，1859年2月6日生于卡塔戈，父亲赫苏斯·希门尼斯·萨莫拉曾两度出任哥斯达黎加总统。他毕业于圣托马斯大学法学专业，是哥斯达黎加自由派时代最重要的律师和政治家之一。其仕途横跨外交、行政、司法和立法多个领域，曾任圣何塞市政首长、驻墨西哥外交代表、内政警察与公共工程秘书、外交秘书、最高法院院长、国会议员及国会主席。1910年首次当选总统，上任前卡塔戈遭地震重创，重建灾区成为其第一任期的重要任务。此后他又于1924至1928年、1932至1936年两度出任总统，是哥斯达黎加少数三次执政的国家元首。希门尼斯以自由派法治传统、议会政治经验和稳健行政风格著称，任内重视基础设施、教育、道路、桥梁和公共工程建设，并在政治上维持文官政府与制度连续性。他的长期政治生涯连接了19世纪末自由派国家建设与20世纪初社会改革前夜，是哥斯达黎加宪政政治中最具代表性的文人总统之一。1945年1月4日在圣何塞去世。"
 CBIO_CUB_federico_laredo_bru_desc:0 "费德里科·拉雷多·布鲁1875–1946，独立战争老兵、律师，先任副总统。1936年古巴参议院罢免了与巴蒂斯塔交恶的总统米格尔·马里亚诺·戈麦斯，他遂于当年12月继任总统，任至1940年。其任内实权大多掌握在军队强人巴蒂斯塔手中，但也主持了1940年新宪法的制定与向宪政的过渡；1939年\"圣路易斯号\"载犹太难民遭古巴拒绝入境的事件亦发生于其任内。他是1936—1940年古巴\"幕后军政\"格局中的过渡型文人总统。"
 CBIO_CUB_jose_agripino_barnet_desc:0 "何塞·阿格里皮诺·巴内特·伊·维纳赫拉斯，1864年6月23日生于西班牙巴塞罗那，父母均为古巴人，后在哈瓦那大学取得法学学位。早年进入古巴外交系统，长期在欧洲、美洲和亚洲任职，曾任驻巴黎、利物浦、鹿特丹、汉堡领事，并先后担任驻日本、巴西、德国、瑞士等国外交代表。1930年代古巴政局因马查多倒台后持续动荡，临时政府频繁更迭，巴内特作为资深外交官与相对温和的政治人物进入国家权力核心。1935年12月卡洛斯·门迭塔辞职后，他出任古巴临时总统，成为马查多倒台后第七位临时国家元首，主要任务是维持过渡秩序并组织选举。1936年5月新总统米格尔·马里亚诺·戈麦斯就职后卸任。1945年9月18日在哈瓦那去世。"
 CBIO_DOM_jacinto_peynado_desc:0 "哈辛托·比恩韦尼多·佩纳多1878–1940，律师出身，特鲁希略体制下的政治人物。1930年代任副总统并一度代行总统职权；1938年，特鲁希略因1937年屠杀引发的国际压力而不亲自竞选，改推佩纳多出任总统1938–1940，他遂成为典型的傀儡总统，1940年死于任内。据传其宅邸曾挂“上帝与特鲁希略”的霓虹标语，是特鲁希略“幕后统治”格局的门面人物。"
 CBIO_DOM_rafael_trujillo_desc:0 "拉斐尔·莱昂尼达斯·特鲁希略·莫利纳1891–1961，多米尼加独裁者。他在美国占领时期1916–1924由美方创建的国民警卫队中发迹，1924年后掌控军队；1930年与埃斯特雷拉·乌雷尼亚密谋、借一场充满恐怖与舞弊的选举上台，开启统治全国长达31年的\"特鲁希略时代\"1930–1961，其间时而亲自任总统、时而通过傀儡总统统治。他以多米尼加党为工具建立起军警、密探与个人崇拜合一的体制1936年将首都改名\"特鲁希略城\"，1937年下令屠杀边境数以千计的海地人\"欧芹屠杀\"。1961年遇刺身亡。"
 CBIO_ECU_federico_paez_desc:0 "生年不确（约1876年前后）、1942年卒，厄瓜多尔土木工程师，1935年8月借助军方支持推翻民选总统贝拉斯科·伊瓦拉，出任独裁总统至1937年10月。他以技术官僚姿态执政，着力推进公路修建等基础设施工程，同时镇压共产党与左翼运动。执政后期逐渐失去军方信任，1937年10月被战争部长阿尔韦托·恩里克斯·加略将军发动政变推翻。其统治是1930年代厄瓜多尔政局动荡、强人迭出时期的缩影——在他前后十余年间，厄瓜多尔历经逾十位总统，少有人得以善终任期。"
 CBIO_ELS_maximiliano_hernandez_martinez_desc:0 "萨尔瓦多军人、独裁者，1882年10月21日生于拉利韦塔省圣马蒂亚斯。早年入危地马拉理工学校学习，后在萨尔瓦多军队任职，历任军事学校校长、战争部部长等职。1931年他作为阿图罗·阿劳霍政府的副总统兼战争部长进入政府；同年12月，军人政变推翻阿劳霍后，他掌握政权，先任临时总统，1935年和1939年又通过受控制的选举继续执政。1932年1月，西部农民和原住民起义爆发，他下令军队严厉镇压，造成约一万至三万人死亡，史称“大屠杀”，共产党人法拉邦多·马蒂也在随后被处决。其统治被称为马丁内斯时代，依靠军队、咖啡寡头和亲政府政党维持威权体制，同时推行若干财政、基础设施和公共机构建设。二战中，他先同轴心国保持往来，后在美国压力下与轴心国断交并站到盟国一边。1944年，军中起事和“垂臂罢工”削弱其统治，他于5月9日辞职流亡。1966年5月15日，他在洪都拉斯丹利被司机刺杀。"
 CBIO_ETH_ras_imru_haile_selassie_desc:0 "伊姆鲁·海尔·塞拉西1892年11月23日生于哈拉尔省，与海尔·塞拉西同为堂兄弟兼总角之交，两人曾同拜阿巴·塞缪尔·沃尔德卡欣门下受教。他历任哈拉尔、沃洛首长，1932年受封拉斯并出任戈贾姆总督。意埃战争爆发后，他统率约四万人的左翼军团，1935年12月在希雷一带重创意军，后因迈车战役失利退往伊路巴博的戈雷重整旗鼓。1936年5月皇帝流亡前任命他为摄政留守国内，他依托阿索萨金矿维持军需，但因韦莱加奥罗莫人反叛及矿区失守，处境恶化，转战东南，最终于同年12月18日在戈耶布河畔向意军投降，随即被押往意大利，囚于本扎岛，直至1943年意大利投降后获释。战后他出任枢密顾问，先后出使印度、美国及苏联，并代表埃塞俄比亚出席联合国巴勒斯坦问题特别会议。1960年政变期间他曾短暂出任三天代理首相。他思想开明、同情土地改革，甚至将自家庄园分与佃农，因而得绰号红色拉斯，但终生仍是皇帝的亲信与坚定的保皇派。1974年德尔格废黜皇帝时，他受命陪同在场见证，事后仍多次探视被软禁的皇帝。1980年8月15日，伊姆鲁·海尔·塞拉西去世，是德尔格政权唯一以国葬礼遇安葬的皇族成员。"
 CBIO_ETH_haile_selassie_desc:0 "埃塞俄比亚皇帝，“犹大之狮”海尔·塞拉西。原名塔法里·马康宁，1892年生于哈拉尔省，父亲是哈拉尔总督、前任皇帝梅内利克堂弟。1916年摄政兼皇位继承人利吉·伊亚苏因宗教立场引发贵族疑虑被废黜，塔法里受封拉斯，出任摄政兼王储，此后近十四年间他以此身份逐步集中中央权力、削弱地方世袭贵族，同时推动教育行政改革，促成埃塞俄比亚1923年加入国联，1924年出访欧洲，成为首位出访海外的埃塞俄比亚君主。1930年祖迪图皇后逝世后他加冕称帝，称海尔·塞拉西一世，次年颁布首部成文宪法，将集权制度化。这一集权过程也在部分被削权的地方贵族中埋下嫌隙，其中一些人后来在意大利占领期间转而与占领当局合作。1935年意大利入侵后，他亲赴北线督战，次年迈车战役战败，携家流亡，任堂弟拉斯伊姆鲁·海尔·塞拉西摄政留守，自己转赴日内瓦向国联发表演说，谴责意军使用化学武器，虽未获得有效制裁，却使他成为国际反法西斯象征；此后他侨居英国巴斯五年。1941年他随盟军反攻返国复位，随即着手重建集权体系与国家行政，1942年宣布废除奴隶制。1943年，提格雷因不满他战后再度推行的中央集权政策爆发沃扬内起义，被他调兵平定。1950年代他推动厄立特里亚先并入联邦、1962年终结联邦制直接吞并，此举日后引发厄立特里亚独立战争。1955年他颁布新宪法设可选下议院，但实权仍集中于皇帝一人。1960年他出访期间帝国卫队发动未遂政变，被迅速平定。1963年他促成非洲统一组织成立，总部设于亚的斯亚贝巴。1972至1974年沃洛饥荒致数万人死亡，他应对迟缓引发国内强烈不满，加之军队哗变、通货膨胀，1974年9月德尔格军人委员会将其废黜软禁，1975年宣布君主制终结。官方最初称他病逝，1994年德尔格政权倒台后的审判揭示他实际死于软禁期间遭勒毙；2000年11月其遗骸迁葬亚的斯亚贝巴圣三一大教堂。"
 CBIO_GER_wilhelm_pieck_desc:0 "1876年生，木工出身，德国共产党创始人之一。他早年加入社会民主党左派，一战中持反战立场，与罗莎·卢森堡、卡尔·李卜克内西同属斯巴达克派，参与1918至1919年革命运动；卢森堡和李卜克内西被杀时，他侥幸脱险。此后他长期出任德国共产党领导人，多次当选国会议员。1933年纳粹上台、德共遭取缔后，他流亡苏联，在共产国际中活动，是流亡海外德国共产主义运动的主要代表人物。1945年回到苏占区，参与创建德国统一社会党，1949年德意志民主共和国成立后出任首任国家元首（总统），任职至1960年去世。"
 CBIO_GER_konrad_adenauer_desc:0 "1876年生于科隆，天主教中央党政治家，魏玛共和国时期长期出任科隆市长（1917—1933年），主持修建城市基础设施，是莱茵地区天主教保守势力的重要代表。1933年纳粹上台后，他拒绝与政权合作，随即被免职，一度遭盖世太保拘押，此后隐居于莱茵河畔直至战争结束。二战后他参与创建基督教民主联盟，1949年出任联邦德国首任总理，任职至1963年。在任期间，他确立了西德的西方阵营定位，推动与法国和解，主导西德加入北约，并在国际社会为战后德国重建合法性。他被视为现代联邦德国的主要奠基人之一，1967年去世，终年九十一岁。"
 CBIO_HAI_jacques_roumain_desc:0 "雅克·鲁曼1907–1944，海地作家、诗人、民族学家与政治活动家，出身显赫的混血精英家庭，其祖父为前总统坦克雷德·奥古斯特。他是反对美国占领的“本土主义”indigénisme文学运动旗手，主张从海地民间、非洲根源与农民生活中重建民族文化，代表作长篇小说《露水的主人》成为海地文学经典。1934年他创建海地共产党，把黑人民族主义与马克思主义结合，因而屡遭斯泰尼奥·樊尚政权监禁与流放；他还创办海地民族学局，推动对伏都教与民俗的严肃研究。莱斯科执政时期他一度出任驻墨西哥外交职务，1944年英年早逝。"
 CBIO_HAI_stenio_vincent_desc:0 "斯泰尼奥·约瑟夫·樊尚，1874年2月22日生于太子港，海地律师、政治家，出身受法语教育的城市精英阶层。早年攻读法律并进入公共事务领域，曾任内政与公共工程部长、海地众议院议长等职，是美国占领时期海地政坛中重要的文官政治人物。1930年，在美国占领统治引发强烈民族主义反弹、海地要求恢复主权的背景下，他由国民议会选为总统。樊尚执政初期以收回国家自主权为号召，1934年美国海军陆战队撤离海地，使他获得“结束占领”的政治声望；但美国仍保留对海地财政和若干制度安排的影响，海地的完全主权恢复仍是一个渐进过程。其后樊尚逐步强化总统权力，压制反对派和新闻自由，并推动延长任期，政权日益带有威权色彩。他的总统任期延续至1941年，由埃利·莱斯科继任。1959年9月3日去世。"
 CBIO_HOL_willem_schermerhorn_desc:0 "威廉·舍默霍恩，1894年12月17日生于北荷兰省的阿克斯洛特，出身新教农家。他就读于代尔夫特理工学院，1926年起在该校任大地测量学教授，是航空摄影测量领域的先驱。第二次世界大战期间他投身抵抗运动，1942年5月至1943年12月被德国占领当局作为人质关押于圣米希尔斯赫斯特尔，1944年被撤去教授职务后转入地下。他是荷兰人民运动的发起人之一，原属自由思想民主同盟，后参与创建工党。1945年6月，他受威廉明娜之命与德雷斯组阁，出任战后第一任首相，至1946年7月。卸任首相后，他出任对荷属东印度谈判的总务委员会主席，与印度尼西亚共和国方面达成林加渣蒂协定，也因此饱受非议。此后他任议员，并创办国际航空测量培训中心，1951至1969年任该中心主任，1956年当选皇家艺术与科学院院士。1977年3月10日在哈勒姆去世。"
 CBIO_HOL_wilhelmina_desc:0 "荷兰女王威廉明娜，1880年8月31日生于海牙，是国王威廉三世与埃玛王后的独女。1890年父亲去世后，她以十岁之龄继承王位，由母亲摄政至1898年亲政。她性格强硬，长期把王权理解为国家意志的象征；第一次世界大战中力守中立，二战爆发初期仍试图维持中立。1940年5月德国入侵后，她随政府流亡英国，在伦敦重建王室与流亡政府的指挥链，并支持撤换主张媾和的德·海尔，由海布兰迪继续抗战。此后她通过奥兰治电台向被占领的祖国广播，斥责德国突袭，鼓励抵抗者、罢工者和地下报刊，她的照片也成为占领区荷兰人的抵抗象征。政治上，她并不甘当立宪摆设，常以女王身份直接干预人事，连流亡内阁也常被她的强硬脾气压得难堪。她还坚持加强荷兰王国对于海外殖民地的统治。1945年荷兰解放后，她一度希望以战时精神重塑荷兰政治，却很快失望于旧党派政治复归。1948年9月4日因年老体衰让位于女儿朱莉安娜，晚年在罗宫写下回忆录《孤独，但不孤单》，试图解释自己一生的政治理念。1962年11月28日在罗宫去世。"
 CBIO_HOL_anton_mussert_desc:0 "安东·米塞特，1894年5月11日生于北布拉班特省的韦尔肯丹，早年在代尔夫特攻读土木工程，曾任乌得勒支省水利部门的总工程师。1931年12月，他与科内利斯·范赫尔克肯等人共同创立荷兰国家社会主义运动，出任政治领袖。该党初期仿效墨索里尼的意大利法西斯主义，1935年大选中得票约八万、接近全国选票的百分之八，此后逐渐衰落。1940年德国占领荷兰后，他获准取缔其他政党，却始终未被授予实权，占领区最高权力归于国家专员赛斯-英夸特。1942年12月，希特勒授予他荷兰人民领袖的称号，但这多为虚衔；他配合德方压制抵抗，认可荷兰党卫队与东线志愿部队的组建。1943年5月他最后一次会见希特勒，被明告永无政治实权。战争末期面对饥荒等困局，他大多缄默。1945年5月7日德国投降之际他被捕，同年11月被判犯有叛国罪，12月被判处死刑，向威廉明娜求赦遭拒。1946年5月7日，他在海牙附近的瓦尔斯多普草地被枪决。"
 CBIO_HOL_pieter_sjoerds_gerbrandy_desc:0 "皮埃特·斯若尔德斯·海布兰迪，1885年4月13日生于弗里斯兰斯内克附近的胡恩加村，是弗里斯兰人，其名字按弗里斯兰传统以父名斯若尔德斯作中缀。他在阿姆斯特丹自由大学攻读法律，1920至1930年任弗里斯兰省议会议员，隶属反革命党，1930年起在自由大学任法学教授。1939年他不顾党内劝阻出任司法大臣。1940年德国入侵后，他随王室与内阁流亡伦敦，因反对德·海尔的失败主义，经威廉明娜任命于1940年9月接任流亡政府首相，直至1945年6月，任内兼理司法与殖民地事务。他倡建奥兰治电台，向沦陷区传递外界消息，立场坚定，赢得丘吉尔的信任，成为战时荷兰民众的精神支柱。1945年南部解放后他组建新内阁，全国解放后辞职。战后他任议员，强烈反对政府的印度尼西亚政策，主张维护王国统一，并出任相关全国委员会主席。1961年9月7日在海牙去世。"
 CBIO_HOL_lou_de_visser_desc:0 "路易·德·菲瑟，1878年5月21日生于一个清贫的新教家庭，年少即做工并投身政治。他是《论坛报》的创办人之一，该报是社会民主党这一正统马克思主义派别的机关刊物。1909年他离开社会民主工党，加入亨丽埃特·罗兰·霍尔斯特的革命社会主义联盟，后参加共产国际第三次代表大会。1925年，他在共产国际的推动下接掌荷兰共产党，任党主席，并当选众议员，兼任海牙市议员与南荷兰省议员。1934年亲王日，他因在女王入场时高呼荷属东印度脱离荷兰的口号，与两名同僚一起被警察强行逐出参众两院联席会议。1935年党主席一职由较年轻的贝措马克接任，1939年他被解除领导职务，同年出版回忆录。1941年6月他被德国占领当局逮捕，关入诺因加默集中营。1945年5月3日，在盟军逼近之际，他与其他囚犯被转移到卡普·阿科纳号轮船上，当天在船只遇袭中丧生。"
 CBIO_HOL_dirk_jan_de_geer_desc:0 "迪尔克·扬·德·海尔，1870年12月14日生于格罗宁根，出身贵族世家，法学博士，早年做过记者与鹿特丹市议员。1907年起任基督教历史联盟众议员，1920至1921年任阿纳姆市长，1921至1923年任财政大臣，因反对海军法案而辞职。1926至1929年他首度出任首相。1939年8月，在科莱恩内阁垮台后他再度组阁，并兼理财政。1940年5月德国入侵，政府流亡伦敦，他在伦敦公开主张与德国单独媾和，断言战争无法取胜，动摇了政府与民心。威廉明娜遂将其免职，改由海布兰迪继任。此后他受命携外交文件前往荷属东印度，却在葡萄牙中途折返，经德方许可返回被占领的荷兰，威廉明娜斥其为叛徒与逃兵。他又撰写小册子劝导民众配合德国当局。战后他以战时叛国罪受审定罪，被剥夺全部荣誉头衔，判处一年徒刑并附缓刑。1960年11月28日在索斯特去世。"
 CBIO_HON_tiburcio_carias_andino_desc:0 "蒂布尔西奥·卡里亚斯·安迪诺，1876年3月15日生于特古西加尔巴，1969年12月23日去世，洪都拉斯国民党政治家、军人，具有少将军衔。早年从事教育与法律工作，后进入国民党政治与军队体系，多次参加内战和总统竞选，1924年曾短暂出任宪制总统。1932年大选后，他于1933年就任总统，在大萧条、香蕉出口经济和长期内战后的局面下建立强人统治，依靠军队、国民党控制的国会、保守社会力量以及美国“睦邻政策”下的承认维持政权。其任内结束此前频繁内战，稳定财政和公共秩序，也严厉压制自由党、劳工组织和新闻反对派，并通过宪法修改将任期延至1949年。卡里亚斯时代通常被称为“卡里亚托”，是洪都拉斯20世纪威权政治的重要阶段。卸任后他仍长期影响国民党政治，并在1954年一度试图重返总统职位。"
 CBIO_ICE_olafur_thors_desc:0 "1892年生，冰岛独立党领袖，中间偏右建制力量的代表，主张完全独立、亲西方。他后来多次出任冰岛总理，是20世纪中叶冰岛政坛的核心人物，1964年去世。"
 CBIO_ICE_brynjolfur_bjarnason_desc:0 "1898年生，冰岛共产党的创始人与主要领袖，留欧期间接受马克思主义。他长期是冰岛社会主义运动的旗手，二战后曾入联合内阁任教育部长，1989年去世。"
 CBIO_ICE_sveinn_bjornsson_desc:0 "1881年生，冰岛政治家与外交家。1944年冰岛脱离丹麦、宣告独立建立共和国，他出任首任总统，是冰岛走向完全独立的象征，1952年在任内去世。"
 CBIO_ICE_hermann_jonasson_desc:0 "1896年生，冰岛进步党政治家，1934—1942年长期任总理，是1930年代冰岛的政府首脑。其后他仍活跃政坛、再度组阁，1976年去世。"
 CBIO_IRE_Eamon_de_valera_desc:0 "埃蒙·德瓦莱拉，1882年10月14日出生，是爱尔兰共和国第2任总理和第3任总统，爱尔兰独立运动领袖，亦是担任爱尔兰总理时间最长的人。他在美国纽约出生，父亲是西班牙裔的古巴人，母亲是爱尔兰裔的美国人。1904年毕业于英国皇家学院。后曾在几个天主教大学任教。1907年加入秘密民族主义组织——爱尔兰共和兄弟会。1913年参加民族志愿军。1914年加入新芬党。1916年参加都柏林起义，被捕，并被英国判处死刑，因系美国公民，改无期徒刑。1917年大赦获释，当选为议员和新芬党主席。后再次被捕入狱。1919年4月缺席被爱尔兰革命议会推举为爱尔兰共和国总统。5月逃赴美国征集独立基金。1920年返回爱尔兰，领导反英游击战争。1921年参加同英国的谈判。后因反对南北爱尔兰分治，拒绝承认爱尔兰自由邦与英国缔结的条约。1922年率领爱尔兰共和军与爱尔兰自由邦政府军作战，战败被囚。1923年获释。1926年与新芬党决裂，另建替天行道士兵党（共和党），开始主张通过议会斗争争取独立。1932年大选中共和党获胜，他先后担任总理十六年。在任时废除忠于英国国王的誓言，试行关税保护，发展民族工业。1937年宣布爱尔兰完全独立。在二战中保持中立。1948年爱尔兰脱离英联邦。1959年当选爱尔兰总统，1966年连任，1973年退休，1975年在都柏林去世。"
 CBIO_MAN_zhao_shangzhi_desc:0 "1908年10月26日生于辽宁朝阳县、1942年2月12日卒于黑龙江鹤岗附近（遭日伪特工枪伤后被俘，拒绝招供，数小时后伤重不治），中国共产党军事将领，东北抗日联军最具传奇色彩的指挥官之一。1925年入党，后就读黄埔军校。1931年九一八事变日本占领东北后，他留守坚持武装斗争，先后组建东北人民革命军、东北抗日联军第三军，长期在黑龙江极寒的山地丛林中开展游击作战，令日伪军闻风丧胆——日方曾以重金悬赏其人头。1942年2月，他遭打入其内部的日伪特工刘德山近距离枪击，身负重伤后被俘。日军对其施以严酷审讯，他始终分文未吐，当日即告不治，年仅三十三岁。其头骨后被日军带走，数十年后方经多方努力归还中国。与赵一曼并称\"南有赵一曼，北有赵尚志\"，是中国东北抗日英烈的代表性人物。"
 CBIO_NIC_anastasio_somoza_garcia_desc:0 "阿纳斯塔西奥·索摩查·加西亚，1896年2月1日生于尼加拉瓜卡拉索省圣马科斯，出身咖啡种植主家庭，青年时曾在美国费城求学，因此能熟练使用英语。1919年他与萨尔瓦多拉·德瓦伊莱·萨卡萨结婚，借此进入尼加拉瓜显赫的萨卡萨家族政治网络。1926年自由党起事中，他支持妻叔胡安·包蒂斯塔·萨卡萨，虽无突出军事才能，却因英语能力在美国斡旋谈判中担任翻译，逐渐受到美国方面注意。此后他历任莱昂省长、驻哥斯达黎加领事、外交部长，并在美国海军陆战队建立的国民警卫队中迅速上升。1933年美国撤军前后，他在美国驻尼加拉瓜大使支持下出任国民警卫队总监，掌握全国唯一成体系的武装力量。1934年2月，桑地诺在和平谈判后遭国民警卫队杀害，索摩查由此清除了最大武装对手。1936年他迫使总统萨卡萨辞职，并通过临时总统布雷内斯·哈尔金过渡，于1937年正式出任总统。此后他以国民警卫队、民族自由党和家族网络控制尼加拉瓜，1947年短暂让亲信上台，仍居幕后掌权，1950年再次正式出任总统。他的统治以亲美、反共、镇压反对派和家族敛财著称，奠定了索摩查家族长达四十余年的独裁王朝。1956年9月21日，他在莱昂被诗人里戈韦托·洛佩斯·佩雷斯枪击，送往巴拿马运河区治疗，9月29日死亡。其长子路易斯·索摩查·德瓦伊莱随后接掌政权。"
 CBIO_NIC_juan_bautista_sacasa_desc:0 "尼加拉瓜自由党政治家、医生，1874年12月21日生于莱昂。父亲罗伯托·萨卡萨·萨里亚也是医生兼自由党领袖，曾两度出任尼加拉瓜总统。1889年至1901年他在美国求学，取得哥伦比亚大学医学博士学位，归国后在莱昂的国立大学任教授与院长，是何塞·桑托斯·塞拉亚自由派政权的支持者。1924年他当选副总统，次年保守派将领埃米利亚诺·查莫罗发动政变，他流亡墨西哥。1926年自由党人在卡贝萨斯港起事，他返国宣称自己才是合宪总统，并在该地另立政府；墨西哥供给军火，蒙卡达指挥的自由党军几乎攻下马那瓜。美国出面迫使双方谈判，达成黑刺塔条约，他勉强接受并放弃总统主张，却拒绝签字，径自出国，由蒙卡达代签。1932年他终于当选总统，次年1月1日就职，第二天美国海军陆战队撤离尼加拉瓜。在美国大使的坚持下，他任命侄女婿阿纳斯塔西奥·索摩查·加西亚出任国民警卫队总监。同年2月他与桑地诺会晤，桑地诺以土地与特赦换取效忠；1934年2月，桑地诺在索摩查授意下被害。此后他再无力遏制索摩查与国民警卫队坐大，咖啡价格崩溃与1934年国会选举的舞弊指控又蚀去他的声望。1936年5月31日索摩查的部队进攻马那瓜，6月6日他与副总统辞职，当天乘船流亡萨尔瓦多，三天后国会正式接受辞呈。他最终定居美国，1946年4月17日在洛杉矶去世，终年七十一岁。"
 CBIO_NZL_peter_fraser_desc:0 "彼得·弗雷泽，新西兰工党政治家，1884年8月28日生于苏格兰罗斯郡菲恩。早年做学徒木匠，1908年在伦敦加入独立工党，1910年因失业移居新西兰，在奥克兰与惠灵顿码头做工并投身工会运动。1916年参与创建工党，1918年当选国会议员，代表惠灵顿中央选区直至去世。一战期间他因反对征兵被判煽动罪入狱一年。1935年工党执政后，他历任教育、卫生、海事与警察部长，推动1938年社会保障法立法，建立全民医疗保障体系。1939年萨维奇病重期间，他实际主持政府运作并赴伦敦商谈参战事宜，1940年萨维奇去世后接任总理兼党魁。二战期间他领导新西兰远征军动员，与丘吉尔及远征军司令伯纳德·弗赖伯格保持密切联系，签署弗赖伯格宪章确保新西兰对本国部队使用的知情权。1944年促成澳新协定，1945年代表新西兰出席旧金山会议，参与起草联合国宪章，主张小国权益与集体安全。1949年因推行义务兵役制引发党内分裂，工党大选落败，他转任反对党领袖，1950年12月12日在惠灵顿去世。"
 CBIO_NZL_sidney_holland_desc:0 "西德尼·霍兰德，新西兰国家党政治家，1893年10月18日生于坎特伯雷格林代尔，父亲亨利·霍兰德后任克赖斯特彻奇市长及众议员。一战期间他任炮兵少尉赴欧洲服役，战后经营家族运输与工程生意。1935年他接替父亲当选克赖斯特彻奇北区议员，1940年当选国家党党魁及反对党领袖。1942年一度加入战时内阁负责战争支出事务，同年因政府对煤矿罢工者的宽容处理而退出。此后他持续抨击工党政府的经济管制政策，1949年带领国家党赢得大选，结束工党十四年执政，出任总理兼财政部长，推动解除多项战时经济管制，并于1950年废除立法院，使新西兰国会成为一院制。1951年码头工人大罢工期间，他动用紧急权力压制工潮并借机提前大选，国家党获得更大多数。1954年再度连任，任内新西兰与美国、澳大利亚签署澳新美安全条约。1956年苏伊士运河危机期间他一度中风仍坚持工作。1957年因健康恶化辞去总理及党魁职务，由基思·霍利约克接任，1961年8月5日在惠灵顿去世。"
 CBIO_NZL_michael_joseph_savage_desc:0 "迈克尔·约瑟夫·萨维奇，新西兰工党政治家，1872年3月23日生于澳大利亚维多利亚州塔通，爱尔兰移民后裔。年轻时在澳大利亚做金矿工与劳工组织者，1907年移居新西兰奥克兰，在酿酒厂做工并投身工会运动。1916年工党成立，他是创始成员，1919年当选国会议员，1923年任副党魁。1933年党魁哈里·霍兰德逝世后，他继任党魁。1935年大选中，他带领工党首次赢得执政权，出任总理兼外交、土著事务与广播部长，推行大萧条经济复苏政策。1938年通过社会保障法，建立免费医疗、养老金与失业救济体系，被视为新西兰福利国家的奠基人。1937年他赴伦敦出席乔治六世加冕礼与帝国会议，批评英国在国际事务中未充分咨询自治领。1939年二战爆发前后，他因结肠癌病情恶化，逐步将职权移交副手彼得·弗雷泽。1940年3月27日在惠灵顿去世，终年六十八岁。"
 CBIO_PAN_harmodio_arias_madrid_desc:0 "阿莫迪奥·阿里亚斯·马德里1886–1962，巴拿马总统1932–1936，出身贫寒却成为知名律师，是推动1931年政变、主张巴拿马民族主义的\"共同行动\"AcciónComunal团体的核心人物之一，也是阿里亚斯政治家族的兄长其弟阿努尔福·阿里亚斯后来数度出任总统。他创办《巴拿马美洲报》ElPanamáAmérica，以舆论批评运河区特权与旧寡头。任内最重要的成就是与美国谈判、于1936年签订《赫尔—阿尔法罗条约》，修订1903年运河条约，废除美国对巴拿马事务的\"保护\"与干预权、提高运河年金，被视为巴拿马争取主权的重要一步。1936年他把总统职位交给继任者阿罗塞梅纳。"
 CBIO_PAN_juan_demostenes_arosemena_desc:0 "胡安·德莫斯特内斯·阿罗塞梅纳1879–1939，巴拿马总统1936–1939，出身产生过多位总统的阿罗塞梅纳政治世家。他继承前任阿莫迪奥·阿里亚斯的路线，推动1936年《赫尔—阿尔法罗条约》的落实、兴办公共工程与教育圣地亚哥师范学校即以其命名，在二战前夕维持亲美外交、协调运河区相关事务。1939年他在任内去世，未及完成任期。作为1930年代\"民族主义—亲美平衡\"路线的执行者，他是理解巴拿马运河区政治与阿里亚斯时代政局的重要人物。"
 CBIO_PRU_Oscar_benavides_desc:0 "1876年3月24日生、1945年7月2日卒，秘鲁将军，1933—1939年任总统，推行威权统治，镇压美洲人民革命联盟（APRA），与秘鲁寡头阶层关系密切。"
 CBIO_ROM_octavian_goga_desc:0 "奥克塔维安·戈加，1881年4月1日生于当时属奥匈帝国的勒希纳里，罗马尼亚的诗人、剧作家兼极右政治家。他早年是特兰西瓦尼亚罗马尼亚民族运动的活跃分子，1915年2月15日，在布加勒斯特由“全罗马尼亚政治联盟”组织的会议上，他宣称：“为了明天的牺牲，我们已经越过边境，让我们来到瓦拉几亚。我们失去了国家，失去了祖国，但我们还有头颅。我们把它们交给你，随你怎么处理。他们可以倒下，特兰西瓦尼亚也不能倒下。”曾被匈牙利当局逮捕并缺席判处死刑；第一次世界大战期间加入罗马尼亚军队。战后他历任艺术部长与内政部长，观点发生了根本变化，转而同情意大利法西斯主义和德国纳粹主义，成为罗马尼亚民族主义运动的领导人之一。1935年将其农民党与库扎的全国基督教防卫同盟合并，组成带有法西斯与反犹色彩的国家基督教党。1937年12月，国王卡罗尔二世任命他为首相。上任伊始，其政府便颁布首批反犹法令，于1938年1月剥夺大批罗马尼亚犹太人的公民权，同时以反犹争夺铁卫团的民众基础。当他与科德雷亚努商谈选举结盟后，国王于1938年2月10日迫其辞职。他遂隐退至特兰西瓦尼亚的丘恰庄园。1938年5月7日因中风在当地去世。"
 CBIO_ROM_constantin_ion_parhon_desc:0 "康斯坦丁·扬·巴洪，1874年10月15日生于登波隆穆谢尔，是罗马尼亚的神经精神病学家、内分泌学家与政治人物，被视为罗马尼亚内分泌学的奠基者。他1900年在布加勒斯特大学取得医学博士学位，曾赴慕尼黑进修，先后在雅希大学教授神经病学与精神病学，在布加勒斯特大学教授内分泌学，1909年与莫伊塞·戈尔德斯坦合著了最早的内分泌学著作之一，著述逾四百种，1939年成为罗马尼亚科学院院士。他自青年时代起即倾向社会主义，后靠拢罗马尼亚共产党。1944年8月23日政变后，他出任罗马尼亚与苏联友好协会主席。1947年12月国王米哈伊被迫退位、罗马尼亚成为人民共和国后，他被推举为临时主席团主席，随后任大国民议会主席团主席，成为共产罗马尼亚首任国家元首，但实权掌握在共产党及其总书记乔治乌-德治手中。1952年6月他辞去政治职务，余生专注科研。1969年8月9日去世，享年九十四岁。"
 CBIO_ROM_gheorghe_tatarescu_desc:0 "格奥尔基·塔塔内斯库，1886年11月2日生于特尔古日乌，是罗马尼亚国家自由党“少壮自由派”的政治家。他在巴黎大学获法学博士学位，后在布加勒斯特当律师，1919年起当选众议员。1933年铁卫团刺杀首相杜卡后，他于1934年1月首度出任首相，任内向卡罗尔二世国王靠拢，对铁卫团态度暧昧，推动建立王室独裁，是国家复兴阵线的重要推手。他发起了为期十年的重整军备计划，其政府亦颁布带有排犹色彩的法令，限制犹太人的就业与经济活动。1937年他卸任，1939至1940年再度组阁；1940年，罗马尼亚在苏联压力下割让比萨拉比亚与北布科维纳，他随即辞职，转任驻法大使。二战期间，他试图联合各方反对安东内斯库并寻求与共产党合作，战后在格罗萨政府中任外交部长。1947年因牵涉塔默道事件而去职被捕，被囚于锡盖特。1957年3月28日获释后不久去世。"
 CBIO_ROM_corneliu_codreanu_desc:0 "铁卫团领袖科尔内留·科德雷亚努，1899年9月13日生于胡希，罗马尼亚法西斯政治人物，铁卫团（又称大天使米迦勒军团、军团运动）的创立者与领袖，追随者尊称他为“队长”。该组织奉行极端民族主义与激烈的反犹主义，并带有浓厚的东正教神秘色彩。他在雅西求学时便投身反犹与反共活动，1924年10月，因不满雅西警察局长曼丘对学生的殴打拘押，他在法庭上枪杀了曼丘。1925年异地受审，但当日陪审团成员甚至佩戴着十字标志的徽章出庭，最终被判无罪，宣判后他被簇拥着凯旋，被同道奉为英雄。1927年他脱离库扎的全国基督教防卫同盟，另创大天使米迦勒军团，1930年又组建作为准军事组织的铁卫团。他常在乡村集会上骑白马、身穿绣饰的白色农民装现身，借此塑造救世主般的形象，深得笃信东正教的农民拥戴。军团屡屡诉诸暴力与暗杀，遇害者包括首相杜卡；科德雷亚努也主张罗马尼亚与纳粹德国结盟，1937年底更公开呼吁立即与德意结盟。1937年大选中其政党名列第三，但卡罗尔二世国王坚持将其挡在核心之外。1938年国王建立王室独裁后，他被内政部长克利内斯库下令逮捕，关入日拉瓦监狱。1938年11月30日夜，他与另外十三名被囚军团成员在押解途中被宪兵杀害，官方谎称其“越狱被击毙”。"
 CBIO_ROM_king_michael_desc:0 "末代国王米哈伊一世，1921年10月25日生于锡纳亚的佩雷什城堡，是罗马尼亚末代国王。因其父卡罗尔放弃了继承权，1927年祖父斐迪南一世去世后，年仅五岁的他登基为王，由摄政会议辅政，是当时欧洲最年幼的君主。1930年其父归国称卡罗尔二世，他被降为王储。1940年，罗马尼亚在第二次维也纳裁决中失去北特兰西瓦尼亚，卡罗尔二世被迫退位，安东内斯库重新拥立十八岁的米哈伊为王，但在安东内斯库的军事独裁下，他基本只是名义上的元首，很少能真正过问军政大事。1944年8月23日，苏军已深入国境，他在王宫召见安东内斯库，要求其退出战争、与盟国及苏联签署停战协定；安东内斯库以德国不会承认停战为由拒绝，米哈伊答以“既然如此，我们已无能为力”，随即下令卫兵将其逮捕。当晚他通过广播宣布安东内斯库已被废黜、罗马尼亚接受停战，全国军队随即奉命对境内德军作战。为表彰这一举动，1945年斯大林授予他苏联最高的胜利勋章，翌年杜鲁门总统又授予他美国功绩勋章最高等级，他也是获此殊荣最年轻的国家元首之一。1945年3月，他在压力下任命了亲苏的格罗萨政府，并一度以拒绝签署政令的方式与之对抗。1947年12月30日，他在格罗萨与乔治乌-德治的胁迫下被迫签署退位书，君主制随即被废除。此后他长期流亡欧美，1989年后曾数次试图回国，直至1997年恢复公民身份后才得以较稳定往返罗马尼亚。2017年12月5日，他在瑞士去世。"
 CBIO_ROM_armand_calinescu_desc:0 "阿尔曼德·克利内斯库，1893年6月4日生于皮特什蒂，是罗马尼亚的经济学家与政治家。他在布加勒斯特攻读法律与哲学，又在巴黎大学取得经济学与政治学博士学位，后加入民族农民党，属其左翼。1928至1930年间他曾任农业与内政方面的副国务秘书；1933年格里维察铁路大罢工时，他下令军队向罢工者开火。1937年他在戈加内阁中任内政部长，此后在卡罗尔二世的王室独裁下继续留任，成为政府的实际主导者，并是国家复兴阵线的创建成员之一。他是铁卫团的坚决对手，1938年下令大批逮捕军团分子，被囚的科德雷亚努等人随后遇害。1939年3月，他出任首相，兼掌内政与国防，绰号“钢铁之人”，力图使罗马尼亚保持中立、不倒向德国。1939年9月21日，他在布加勒斯特被铁卫团成员刺杀，行动得到德国的默许与协助；六名凶手当日即在案发地被处决。"
 CBIO_SAF_d_f_malan_desc:0 "丹尼尔·弗朗索瓦·马兰1874–1959，荷兰归正会牧师出身，曾任《城堡报》主编，阿非利卡民族主义的旗手。1934年他拒绝赫尔佐格与史末资的\"联合\"，另组\"精粹派\"国民党并任党魁，主张建立共和、脱离英联邦、反对南非参加二战，也是种族分隔立法的重要推手。1948年出任总理后，他成为种族隔离制度的主要设计者与执行者。在1936至1939年的政局中，他是站在赫尔佐格—史末资联合政府对立面的反对派领袖。"
 CBIO_SAF_j_b_m_hertzog_desc:0 "詹姆斯·巴里·穆尼克·赫尔佐格1866–1942，布尔战争中的将领出身，阿非利卡民族主义的核心人物。1914年创建国民党，1924年起出任南非联邦总理，推行\"两条道路\"双语双文化政策与白人主导的种族分隔立法，1936年主导剥夺开普非洲人选举权的《赫尔佐格法案》。1933年他与史末资的南非党联合，次年组成联合党，而以马兰为首的\"精粹派\"国民党则分裂另立。1939年9月，他主张南非在二战中保持中立，但在议会表决中败于主张参战的史末资，随即辞去总理职务。"
 CBIO_SAF_jan_smuts_desc:0 "扬·克里斯蒂安·史末资1870–1950，布尔战争名将、政治家与哲学家\"整体论\"的提出者。曾于1919—1924年任总理，1939—1948年再度执政。他是英联邦的坚定拥护者，参与创建国际联盟并起草联合国宪章序言。1939年他力主南非加入盟国对德作战，取代主张中立的赫尔佐格出任总理，晋升陆军元帅并进入丘吉尔的帝国战时内阁。对内他维护白人主导的种族分隔秩序，但相较国民党被视为较温和的一派。"
 CBIO_SAF_moses_kotane_desc:0 "摩西·考塔尼1905–1978，出身德兰士瓦农村，自学成才。1929年加入南非共产党，1939年起长期担任党总书记，同时是非洲人国民大会非国大的重要领导人，后任非国大司库长。1934年他写下著名的\"克拉多克来信\"，主张共产党\"非洲化\"、把阶级斗争与非洲民族解放结合起来，成为连接南非共产主义与非洲民族主义的关键人物。在以白人政治为主导的1930年代联邦框架下，他代表着被压迫黑人群众的左翼抵抗路线。"
 CBIO_SAF_pixley_ka_isaka_seme_desc:0 "皮克斯利·卡·伊萨卡·塞姆约1881–1951，祖鲁人，先后在美国哥伦比亚大学1906年以演说《非洲的复兴》获奖与英国牛津大学受教育，成为律师。1912年他发起成立南非原住民民族大会即后来的非洲人国民大会／非国大，倡导跨部族的非洲人团结，并创办《阿班图—巴索》报，1930至1937年间担任非国大主席。作为非国大的奠基人，他代表着南非非洲人早期以宪政请愿争取权利的温和民族主义传统。"
 CBIO_SOV_aleksandr_kerensky_desc:0 "1881年生，俄国社会革命党人、律师。1917年二月革命后，他是临时政府的核心人物，历任司法、陆海军部长，并出任总理，力图在继续对德作战的同时维持新生的共和秩序。同年十月，他被布尔什维克推翻，出逃后长期流亡欧美，是反布尔什维克的温和社会主义流亡势力的代表人物，著述、讲学不辍，1970年客死纽约。"
 CBIO_SOV_konstantin_rodzayevsky_desc:0 "1907年生，流亡中国哈尔滨的俄国法西斯运动头目，俄国法西斯党的主要领导人。他在远东的白俄侨民中鼓吹反苏、反犹的法西斯主义，出版报刊、组织党徒，依附日本势力，企图借外力推翻苏维埃。二战末苏军进入东北后，他被诱捕押回苏联，1946年被处决。"
 CBIO_TIB_thubten_kunpela_desc:0 "1905年生于尼木（西藏中部），出身农奴家庭，原名德钦曲珍，12岁被送往拉萨进宫为仆，因聪慧过人获第十三世达赖喇嘛赏识，逐步升为最亲密的贴身侍从（jensey）。1920年代主持布达拉宫修缮与罗布林卡扩建工程，1931年出任扎基机器局局长，掌管西藏最现代化的铸币厂与军火工厂（均由水电驱动）；1932年说服达赖喇嘛批准建立由他本人统辖的\"绒达\"团——西藏有史以来装备与训练最精良的近代化军队。1933年12月达赖喇嘛驾崩后，政敌隆雪以其未及时报告病情为由发难，争取到大批寺院高僧支持；绒达团倒戈，土登贡培被捕，流放至工布地区。1937年他辗转逃往印度，抵噶伦堡后与康巴民族主义知识分子班达仓·热嘎共同创立\"西藏进步党\"（1939年），致力于推动西藏世俗化改革。此后曾赴南京活动，具体卒年不详。"
 CBIO_TIB_langdun_desc:0 "约1906年生，全衔\"隆钦·亚布齐·朗顿公\"（Lonchen Yapshi Langdun Kung），个人法名贡觉旺曲，西藏噶厦（内阁）首席大臣（隆钦/锡朗），第十三世达赖喇嘛兄长之子，即达赖喇嘛的亲侄。朗顿家族属藏族\"亚布齐\"五大门第之一——凡达赖喇嘛降生之家即晋升为亚布齐，朗顿家因此跻身拉萨最高贵族行列。1926年，年仅二十岁的他被任命为首相，地位仅次于达赖喇嘛与摄政，执掌西藏行政实权。据1936年随英国使团入藏的查普曼记录，当时英国驻拉萨代表对其评价颇为保留：认为他从未离开过拉萨（直至1942年），见识有限，处事尚嫌稚嫩，但在拉萨民间颇孚人望。1938年他同意退为名义首相，翌年（1939年4月）被剥夺实际职务，仅保留品衔。第十三世达赖喇嘛1933年圆寂后西藏政局动荡，他的权力随之逐步萎缩。"
 CBIO_TIB_phuntsok_wangyal_desc:0 "1922年生于西康巴塘（今四川甘孜）、2014年3月28日卒，藏族，西藏共产主义运动的奠基者，史称\"巴塘人平措汪杰\"（Bapa Phüntsok Wangye）。他出身康巴富裕家庭，幼年就读于巴塘基督教传教士学校，因此早年便接触到西方思想与汉语。1930年代末经由延安路线的共产主义文献与人员接触，确立了马克思主义信仰，立志以革命手段改变西藏的封建神权体制。1940年代他在巴塘一带秘密组织藏族青年，建立具有共产主义色彩的政治团体，并与中国共产党建立联系。1949年中华人民共和国成立前后，他积极充任解放军入藏的政治与情报联络人。1950年解放军进藏时，他担任军队翻译与向导，并协助争取当地官员配合。此后历任西藏地方官职，力主在共产党领导下保护藏语文化。2004年出版回忆录《平措汪杰回忆录》，是记录西藏共产主义历史的第一手珍贵文献。"
 CBIO_URG_gabriel_terra_desc:0 "全名何塞·路易斯·加布里埃尔·特拉·莱瓦斯，1873年8月1日生于蒙得维的亚，1895年取得律师资格并专攻财政问题，长期在多届政府中担任财政专家与部长，也当过议员、制宪会议成员和外交代表。他早年属科罗拉多党巴特列派，1929年巴特列去世后作为巴特列派候选人赢得1930年大选，1931年3月1日就任总统，随即与主张集体领导的国家行政委员会及巴特列继承者疏远。1933年3月31日，他在民族党赫雷拉派支持下从消防队总部发动自我政变，解散议会、管制新闻，以独裁方式执政，史称三月独裁。独裁期间的受害者包括青年政治家胡里奥·塞萨尔·格劳埃特，其在1933年10月中弹后被拖延救治，因坏疽死亡。特拉随后召集制宪会议，通过1934年宪法，并于同年6月19日以宪定总统身份复任至1938年。其执政推行进口替代工业化，兴办公共工程，如1937年动工的里孔德尔博内特水电站。对外初期与美英结盟，1935年偿付对英债务，同年与苏联及西班牙共和国断交，1936年承认佛朗哥政权，美国总统罗斯福亦于当年到访。1938年6月19日卸任后由巴尔多米尔继任。1942年9月15日在蒙得维的亚去世。"
 CBIO_URG_eugenio_gomez_desc:0 "欧亨尼奥·戈麦斯1892年生于米纳斯。他在蒙得维的亚港口附近以理发为业，由此接触工人阶层与劳工斗争，曾任港口工人联合会书记，1913年加入社会党。1917年俄国十月革命后，他与塞莱斯蒂诺·米韦利带领党内多数派主张接受第三国际及其二十一条件，1921年4月的党代表会议上社会党改名为乌拉圭共产党，弗鲁戈尼一派则于1923年重建社会党。戈麦斯自建党起长期担任乌拉圭共产党总书记，直至1955年，是党在斯大林主义路线下的核心人物，紧随共产国际方针，并曾进入共产国际南美书记处及其执行委员会。他以清洗党内对手著称，例如将西班牙内战老兵何塞·拉萨拉加扣上托派帽子并开除出党。1942年、1946年和1950年，他都是本党总统候选人，1954年参选国务委员会。1955年，罗德尼·阿里斯门迪一派趁他外出归来将其排除出党，戈麦斯时代就此结束，阿里斯门迪继任总书记。他著有乌拉圭共产党党史等作品。1973年在蒙得维的亚去世。"
 CBIO_URG_luis_alberto_herrera_desc:0 "路易斯·阿尔贝托·德·埃雷拉1873年7月22日生于蒙得维的亚，父亲胡安·何塞·德·埃雷拉是民族党创始人之一。他在共和国大学取得法学博士学位，1893年起投身报界，1931年创办并主持埃尔德瓦特报。他自20世纪20年代起领导民族党数十年，是埃雷里斯莫派的开创者，也被视为拉普拉塔地区历史修正主义的奠基人。他曾参加1896年、1897年和1904年的民族党起义，1897年在萨拉维亚麾下作战，后在美国和英国从事外交，1905年当选众议员，多次出任参议员，1925年出任国家行政委员会主席，并六次角逐总统未果。其政治立场以反巴特列主义、反对美国干涉、主张主权与民众路线著称。1932年查科战争期间，他前往巴拉圭表示愿为其参战，获巴方授予将军衔。1933年他支持特拉政变，导致独立民族主义派与埃雷里斯莫就此分裂。1955年至1959年他任国务委员会委员，1958年大选促成与纳尔多内农业行动联盟的联合，使民族党在时隔九十三年后重新执政。他也是历史学家和评论家，著述颇丰。其外孙路易斯·阿尔贝托·拉卡列后于1990年至1995年出任乌拉圭总统。1959年4月8日在蒙得维的亚去世。"
 CBIO_URG_alfredo_baldomir_ferrari_desc:0 "全名阿尔弗雷多·巴尔多米尔·法拉利，1884年8月27日生于派桑杜，父母为弗朗西斯科·巴尔多米尔和欧亨尼娅·法拉利，出身寒微。他1905年以少尉起步从军，1935年晋升将军，同时兼具建筑师身份，属科罗拉多党。1931年至1933年任蒙得维的亚警察局长期间，他是特拉1933年3月31日政变的关键推手。他娶特拉之妹萨拉·特拉为妻，1935年经身为总统的特拉任命出任国防部长。1938年他当选总统，成为乌拉圭首位由女性选票参与选出的总统，6月19日就职。任内正值第二次世界大战爆发，乌拉圭倒向同盟国一方，1942年6月21日与美国签订商务条约，对轴心国关系趋于强硬。1942年2月21日，他发动史称好政变的行动，解散议会，另设由巴特列派和独立民族主义者组成的国务委员会，排除特拉派、里韦拉派和赫雷拉派，以推动废除特拉时期1934年宪法所限制的宪政权利。新宪法草案于当年5月29日提出，11月29日经全民公投通过。1943年3月1日，他将总统职权移交胡安·何塞·德·阿梅萨加。卸任后，他于1943年至1946年任乌拉圭共和国银行行长。1948年2月24日在蒙得维的亚去世。"