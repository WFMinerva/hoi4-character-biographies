 ENG_winston_churchill_desc:0 "二战五大战时领袖之一，绰号“英国斗牛犬”。1874年生于牛津郡布伦海姆宫，出身马尔博罗公爵家族，父为保守党政治家伦道夫·丘吉尔勋爵，母珍妮·杰罗姆是美国人，全名温斯顿·伦纳德·斯宾塞-丘吉尔。早年从军并任战地记者，参加过印度西北边境、苏丹恩图曼之战和布尔战争，在南非被俘后越狱脱险、一举成名。1900年进入下议院，此后数十年间两度往返于保守党与自由党之间，历任海军大臣、军需大臣、殖民地大臣、财政大臣等要职。第一次世界大战期间，他主推达达尼尔／加里波利登陆，惨败后一度去职、亲赴西线带兵。1930年代他长期被排除在政府核心之外，史称其“旷野岁月”，却持续警告德国重整军备的威胁，激烈反对张伯伦的绥靖政策。1940年5月德军西线进攻之际，他出任首相兼国防大臣，就职后首次在下议院宣告“我能奉献的唯有热血、辛劳、眼泪与汗水”，誓言“不惜一切代价争取胜利”。他领导英国度过法国沦陷、不列颠空战和大西洋海战：敦刻尔克撤退后他誓言“我们将在海滩作战……我们绝不投降”（1940年6月4日）；法国崩溃之际，他号召国人挺身担责，“使千年之后人们仍会说：这是他们最光辉的时刻”（6月18日）；不列颠空战中他向皇家空军飞行员致敬——“从未有这么多人，对这么少人，亏欠这么多”（8月20日）。他与罗斯福密电往来时自署“前海军人士”，最终与美国、苏联结成同盟，其演说与斗牛犬般的强硬姿态成为英国坚持作战的重要象征。丘吉尔同样是坚定的帝国主义者，长期反对印度自治，对印度独立运动持敌视态度；1943年孟加拉饥荒造成数百万人死亡，其战时内阁在粮食调配上的决策至今争议极大，他也是战略轰炸德国城市政策的支持者。1942年阿拉曼大捷后，他以“这不是结束，甚至不是结束的开始，但或许是开始的结束”为这场转折定调。1945年大选保守党意外败北、他黯然下野，次年于美国富尔顿发表“铁幕”演说，揭开冷战序幕；1951年再度组阁，1953年受封嘉德骑士、成为“温斯顿爵士”，同年以所著二战史与历史著作荣获诺贝尔文学奖，1955年因健康原因辞职。私下里他嗜雪茄、惯以两指比出“V”字胜利手势，闲暇时在故居查特韦尔庄园作画、亲手砌砖筑墙；1963年获美国国会授予荣誉公民身份，为史上第一人，1965年逝世，获国葬殊荣。"
 ENG_oswald_mosley_desc:0 "1896年生，出身贵族，英国法西斯主义运动的核心人物。早年是政坛新星，曾先后以保守党、独立人士和工党身份进入议会，一度被工党视为前途无量的部长级人才。1930年代初，他因激进的经济主张与工党决裂，另组新党，随后彻底转向法西斯主义；1932年，他创立英国法西斯联盟（BUF），组织身着黑衫的准军事队伍，在伦敦东区开展针对犹太社区的活动，于1936年引发了著名的“电缆街之战”，遭到当地居民和左翼力量的强力抵抗。第二次世界大战爆发后，依据防卫条例，莫斯利于1940年被拘押，直至1943年因健康原因获释；战后他仍未放弃极右翼政治，继续从事带有反移民和反犹色彩的活动，但再未取得影响力，1980年在法国去世。"
 harry_pollitt_desc:0 "1890年生于兰开夏郡，出身工人家庭，做过锅炉工，英国共产党的主要领导人，长期担任总书记。他早年即投身工会和工人运动，是英国共产党1920年成立时的重要人物之一，凭借出色的组织能力和群众鼓动才能，成为该党最具代表性的工人领袖，与理论家拉贾尼·帕姆·杜特形成“实干家与理论家”的搭档。波立特对苏联和共产国际总体忠诚，但英国共产党内部路线存在分歧：1939年，他主张支持英国对德作战，与共产国际当时按《苏德互不侵犯条约》定下的“帝国主义战争”路线相冲突，在党内压力下被迫暂时辞去总书记职务；直到1941年德国入侵苏联、共产国际立场逆转后，他才复任。此后他长期领导英国共产党，1956年苏联介入匈牙利引发党内剧烈动荡，他辞去总书记，改任主席，1960年在自澳大利亚返航途中于海上去世。"
 alan_brooke_desc:0 "1883年生，出身阿尔斯特裔的布鲁克家族，英国陆军元帅，第二次世界大战期间长期出任帝国总参谋长（CIGS），是英国战时最高军事战略的核心人物。他炮兵出身，一战中在西线以炮兵战术见长。二战初期，他在法国指挥过军级部队并参与敦刻尔克撤退前的殿后，随后负责英国本土防务。1941年底起出任帝国总参谋长，直至战争结束，是丘吉尔最重要的军事顾问，也是少数能持续对丘吉尔的战略冲动加以约束和制衡的人之一。他主持英国陆军的全局战略，深度参与盟军联合参谋体系的运作，在与美方协调“先欧后亚”战略、筹划地中海和西欧作战等重大问题上发挥了关键作用。他常年记录的战时日记，战后成为研究英国战争决策的重要史料，1963年去世。"
 claude_auchinleck_desc:0 "1884年生，长期服务于英印军队，英国陆军元帅，二战中两度出任中东英军总司令。1941年出任中东总司令，统辖北非及周边广阔战区；同年下半年发动“十字军”行动一度解托布鲁克之围，但1942年战局逆转，托布鲁克失守，第八集团军退至阿拉曼。在第一次阿拉曼战役中，他亲自接掌第八集团军指挥，稳住了通往埃及的防线，但因未能迅速转入反攻，于1942年8月被丘吉尔解除中东总司令职务。1943年起他再度出任印度英军总司令，负责对缅甸等战区的后方支援、训练和补给体系。印巴分治期间，他出任印度与巴基斯坦两国武装力量的最高统帅，主持英印军队按教派分割的善后工作，1981年去世。"
 harold_alexander_desc:0 "1891年生，出身爱尔兰贵族家庭，英国陆军元帅，第二次世界大战中盟军最重要的战区指挥官之一。一战中他在西线作战。1940年法国战役中，他负责指挥英国远征军在敦刻尔克的最后撤退阶段，是最后撤离的英军高级军官之一。1942年他出任缅甸方向的指挥，主持了日军进攻下英印军队撤出缅甸的行动；同年调任中东总司令，与蒙哥马利搭档主管北非战区，统筹阿拉曼战役后的全局。此后他出任地中海战区盟军地面部队总司令，指挥西西里登陆和漫长的意大利战役，1944年晋升元帅并出任地中海战区盟军最高司令。战后他出任加拿大总督，并曾任国防大臣，1969年去世。"
 john_vereker_desc:0 "1886年生，即第六代戈特子爵，英国陆军元帅，一战中因多次英勇表现而获维多利亚十字勋章等多枚勋章。第二次世界大战爆发时，他出任英国远征军总司令，率部赴法国与德军作战。1940年5月德军突破西线，英法防线崩溃，他在危急中当机立断，放弃既定的反攻计划，下令英国远征军向敦刻尔克方向撤退，使三十余万英法部队得以从海上撤回英国，保存了英国陆军的基干力量。此后他未再获得一线野战指挥，先后出任直布罗陀总督和马耳他总督，在马耳他遭受轴心国长期围攻和空袭的艰难时期主持该岛防务，1946年去世。"
 archibald_wavell_desc:0 "1883年生，英国陆军元帅，第二次世界大战中先后担任多个关键战区指挥职务。1939至1941年他任中东英军总司令，发动并指挥了“罗盘行动”，以少胜多击败入侵埃及的意大利军队；然而德军非洲军团出现后战局逆转，加之他同时被要求向希腊派兵，兵力分散导致北非战局恶化，希腊和克里特岛相继失守，随即被丘吉尔解除中东职务。1942年初他出任美英荷澳联合司令部最高司令，面对日军全面进攻东南亚的压境形势，联合司令部在数周内即告解散，他随后复任印度总司令，承担缅甸撤退后印度防御与重建工作。1943年起他出任印度总督，任内爆发了1943年孟加拉大饥荒，造成数百万人死亡。1950年去世。"
 henry_harwood_desc:0 "1888年生，英国皇家海军上将，以1939年12月的拉普拉塔河海战而为人所知，这是第二次世界大战开始后英国海军的首场重大胜利。他指挥“阿贾克斯”号、“阿喀琉斯”号和“埃克塞特”号三艘巡洋舰，在南大西洋拦截德国袖珍战列舰“施佩伯爵”号；经过交战，三舰均受损但迫使德舰驶入中立港口蒙得维的亚，此后德国舰长在外交期限届满前命令舰船自沉，避免投降。哈伍德因此役封爵晋升，声名大振。1942年他短暂出任地中海舰队总司令，正值马耳他补给线压力极大、海军损失严峻之际；他在任内健康持续恶化，被迫返国休养，未再出任主要一线指挥职务，1950年去世。"
 andrew_cunningham_desc:0 "1883年生于都柏林，英国皇家海军元帅，第二次世界大战中最杰出的英国海军将领之一，人称“ABC”。他1939年起出任地中海舰队总司令，在战争最艰难阶段长期主持地中海方向的作战。1940年11月，他策划并执行塔兰托海战，指挥舰载机夜袭意大利海军基地，击沉击伤多艘意大利战列舰，以极小代价重创意大利海军主力，成为以舰载航空兵攻击港内主力舰的早期经典，后来日本海军在筹划偷袭珍珠港时将此役作为参考案例之一。1941年3月，他在马塔潘角海战中歼灭意大利重巡洋舰编队。1942年起他出任盟军“火炬行动”的海军总指挥，此后回国担任第一海务大臣（海军参谋长），主持英国最高海军决策直至战争结束，1963年去世。"
 ENG_raymond_briggs_desc:0 "1905年生，英国陆军将领，装甲战术专业军官。第二次世界大战中他在北非战场出任英国第一装甲师师长，参与1942年阿拉曼战役的关键阶段；该师在蒙哥马利统筹的联合兵种框架下承担突破德意防线的装甲突击任务，是第八集团军主攻方向上的核心力量之一。1985年去世。"
 james_somerville_desc:0 "1882年生，英国皇家海军元帅，第二次世界大战中最重要的舰队指挥官之一。1940至1942年，他指挥驻直布罗陀的H舰队，执行地中海西段作战任务。1940年7月奉命炮击停泊于米尔斯克比尔（奥兰）的法国舰队，造成法国水兵大量伤亡，虽出于防止舰队落入德国之手的战略考量，但对英法关系造成深重裂痕，他本人对这一命令深感不安。1942年起他调任印度洋东方舰队司令，日本南云舰队突袭印度洋时，他审慎保存舰队实力，避免以劣势兵力正面交锋。1944年起出任英国驻美海军代表团团长，协调英美海军合作，1949年去世。"
 tom_phillips_desc:0 "1888年生，英国皇家海军中将，Z舰队指挥官。战争初期他在海军参谋体系中出任副参谋长。1941年底，为威慑日本在东南亚的扩张，他率战列舰“威尔士亲王”号与战列巡洋舰“反击”号驶抵新加坡；12月8日日军进攻马来亚后，他率队北上拦截日本登陆舰队，在缺乏岸基战斗机掩护的情况下，遭日本陆基轰炸机和鱼雷机的密集攻击，两舰于1941年12月10日相继沉没，菲利普斯随旗舰罹难，这是英国海军史上损失最重的单日战斗之一，也是大型主力舰在无制空权保护下极度脆弱这一教训的最早惨痛例证之一。"
 hugh_dowding_desc:0 "1882年生于苏格兰，英国皇家空军元帅，不列颠空战的核心指挥者。1936年他出任战斗机司令部总司令，此后数年着力构建了后来被称为“道丁系统”的综合防空体系：以沿海岸线布设的“本土链”雷达网络提供早期预警，结合皇家观察员队的目视跟踪、地下作战室的情报汇集调度，以及与飞行员之间的甚高频无线电通讯，形成近乎实时的防御响应能力。1940年5至6月法国战役期间，他持续抵制将战斗机大量派往法国的压力，坚持为本土防御保留足够兵力，此举具有决定性意义。1940年7至10月不列颠空战期间，战斗机司令部在数量占优的德国空军连续攻势下守住了空中防御。同年11月，他在内部战术路线争议（大编队与小组拦截之争）和人事角力中被解除司令部职务，其获得公开表彰的时间远迟于其他战时将领，1970年去世。"
 arthur_harris_desc:0 "1892年生于切尔滕纳姆，即第一代哈里斯准男爵，绰号“轰炸机哈里斯”，1942至1945年出任皇家空军轰炸机司令部总司令。他早年参加一战时已是飞行员，战间期在皇家空军稳步升迁，对战略轰炸作为独立作战手段抱有坚定信念。出任轰炸机司令部总司令后，他全力推行“地区轰炸”战略，将德国城市及工业区作为轰炸目标，意在摧毁工业产能并打击平民士气。他发动了1942年5月的科隆“千机轰炸”行动，以及1943年7至8月的汉堡大轰炸（代号“蛾摩拉行动”）——汉堡火焰风暴造成约四万平民死亡，是二战欧洲战场单次轰炸中平民伤亡最惨重的事件之一。1944年3月纽伦堡突袭遭到德国夜战机队的严重打击，一夜损失九十余架轰炸机，是轰炸机司令部单次任务伤亡最重的一役。1945年2月发动的德累斯顿大轰炸引起了广泛争议。当时德军战局已濒临崩溃，城内聚集大批难民，两昼夜密集轰炸造成大规模平民死亡。战后他是主要战时指挥官中唯一未获晋封贵族的人。1984年去世。"
 ENG_jfc_fuller_desc:0 "1878年生于奇切斯特，全名约翰·弗雷德里克·查尔斯·富勒，英国陆军准将，二十世纪最重要的军事理论家之一，同时也是与英国法西斯主义有直接交往的争议人物。他在第一次世界大战中历任坦克部队参谋职务，参与筹划1917年康布雷战役——历史上首次大规模集中运用坦克的会战；同年他提出“1919年计划”，设想以大批机械化装甲部队配合飞机深入突破敌军后方、瘫痪其指挥体系，在当时极为超前。战后他大量著述，系统阐发装甲机械化战争理论，著有《战争的改革》等书，成为两次大战间军事变革思想的核心输出者之一；他的理论在英国军事保守体制中推进迟缓，却被德国军事学者（包括古德里安等装甲理论家）认真研读，被认为是“闪击战”概念形成的思想资源之一。1930年代，他转向政治极右翼，成为奥斯瓦尔德·莫斯利和英国法西斯联盟的重要外围支持者，曾撰文为法西斯运动张目；1939年4月他以外国宾客身份亲赴柏林出席希特勒五十岁生日庆典，留下与纳粹政权的公开交往记录。第二次世界大战期间他未遭拘押，但已基本退出公共视野；战后他继续著述军事历史与战略研究，1966年去世。"
 edmund_ironside_desc:0 "1880年生于爱丁堡，即第一代艾恩赛德男爵，英国陆军元帅，第二次世界大战初期任帝国总参谋长。他早年参加布尔战争和第一次世界大战，1918至1919年率英国干涉军赴俄国阿尔汉格尔斯克作战，与布尔什维克军队正面交锋。二战爆发后他出任帝国总参谋长，但1940年5月德军突破西线、法国战役危机期间，他在战略协调上未能发挥足够的主导作用，随即被狄尔接替。此后他转任本土军总司令，主持英格兰海岸和内陆的反入侵防御工事规划，所建反坦克障碍线后来被称为“艾恩赛德防线”；同年7月去职并晋封男爵，1959年去世。"
 ernle_chatfield_desc:0 "1873年生，英国皇家海军元帅，战间期英国海军政策的主导者之一。他参加过1916年日德兰海战，1933至1938年出任第一海务大臣，任内在华盛顿海军条约的约束框架下推动英国主力舰队的更新与扩建，主张维持强大海上力量以保障帝国利益。1939年第二次世界大战爆发后，他出任张伯伦政府的国防协调大臣，承担协调三军备战的职责；1940年4月丘吉尔主导战时领导体制后，该职的实质权力大为萎缩，他随即辞职，此后未再担任要职，1967年去世。"
 dudley_pound_desc:0 "1877年生，英国皇家海军元帅，第二次世界大战全程担任第一海务大臣（1939–1943），是英国最高海军决策的核心人物，与丘吉尔保持极为密切的工作关系。他任内最具争议的决定，是1942年7月下令北极护航船队PQ-17就地分散，判断德国大型水面舰队即将出击；船队分散后遭德国潜艇和航空兵大批击沉，损失惨重，历史学家普遍认为这是一次严重的判断失误。他长期超负荷工作，健康持续恶化，1943年9月确诊脑肿瘤后辞职，同年10月21日于特拉法尔加海战纪念日去世。"
 cyril_newall_desc:0 "1886年生于英属印度穆苏里，英国皇家空军元帅，1937至1940年任皇家空军参谋长。他在战争前夕和开战初期主持皇家空军的大规模扩建，督导“影子工厂”计划推进和喷火、飓风战斗机的量产规划，并参与各军种争夺有限飞机生产产能的部门博弈。他任内始终面临轰炸机优先还是战斗机优先的资源抉择，以及如何在绥靖外交框架下界定皇家空军战略角色的难题。1940年11月不列颠空战结束后，他被波特尔接替，随即出任新西兰总督（1941–1946），在英联邦战时框架下承担行政统筹职责，1963年去世。"
 charles_portal_desc:0 "1893年生于伯克郡亨格福德，英国皇家空军元帅，1940至1945年任皇家空军参谋长，是英国战时最高空军决策的核心人物，任期贯穿战争全程。他接掌参谋长职务时正在进行不列颠空战，此后五年间他统辖皇家空军在欧洲、北非、中东、远东各战区的兵力分配与战略方向，并与美国陆军航空队协调欧洲战略轰炸的联合计划，是盟军联合参谋体系中英方空军代表的最高决策者。他坚定支持战略轰炸政策，同时要在轰炸机司令部、战斗机司令部、海岸司令部与海外战区之间裁量优先次序，其战略判断力在英国三军参谋长中享有较高声誉，1971年去世。"
 edward_ellington_desc:0 "1877年生，英国皇家空军元帅，1933至1937年任皇家空军参谋长，主持战间期英国空军重整的关键阶段。他任内推动皇家空军扩编计划，督导喷火和飓风战斗机项目的早期立项与研发，并参与奠定了后来在不列颠空战中发挥关键作用的防空雷达网络的基础规划工作。他任内面临有限预算下的战略取舍，在英国空军应着重发展轰炸机还是战斗机、独立作战还是辅助陆海军的路线争议中，其立场多次受到质疑。1937年卸任参谋长后他出任皇家空军总监察长，此后淡出核心决策，1967年去世。"
 kenneth_anderson_desc:0 "1891年生，英国陆军将领，以北非突尼斯战局中的指挥而为人所知。“火炬行动”盟军登陆法属北非后，他于1942年11月出任英国第一集团军司令，率部从阿尔及利亚方向向东推进，与从利比亚西进的第八集团军形成对德意军队的两面夹击。突尼斯战局历时半年余，在山地地形、恶劣天气和德意军顽抗下推进艰难，其作战风格以稳健保守为主，与美方盟军指挥官之间也曾存在摩擦；1943年5月盟军最终迫使约二十五万德意军队投降。战局结束后他未再获主要战区指挥，转任本土军务职务，1959年去世。"
 sholto_douglas_desc:0 "1893年生于牛津郡，英国皇家空军元帅，不列颠空战中以“大编队”战术争议知名，战后以军事总督身份管辖英国驻德占领区。1940年空战期间他任副参谋长，与利-马洛里联手倡导集中数个中队后再行拦截的“大编队”战术，与道丁和帕克的即时小组拦截方式持续冲突；这场争议直接促成道丁和帕克年底被解职，由道格拉斯接任战斗机司令部总司令。此后他历任中东空军和海岸司令部总司令。1945至1946年他出任英国驻德国占领区军事总督，主持盟国对德管制委员会英方事务，1969年去世。"
 trafford_leigh_mallory_desc:0 "1892年生于柴郡，英国皇家空军上将，以不列颠空战和诺曼底登陆的空中指挥而为人所知。1940年空战期间他指挥第12大队，与道格拉斯·贝德尔合作推行“大编队”战术，主张集中兵力再行拦截以求歼灭，与第11大队基思·帕克的即时小组拦截方式正面对立；这场争议被认为是道丁和帕克去职的重要因素，他本人随即晋升接掌战斗机司令部。1944年诺曼底登陆中他担任盟军远征空军最高司令，协调登陆期间的全部空中支援行动。同年11月他在赴任东南亚盟军空军司令途中，所乘飞机在法国阿尔卑斯山坠毁，机上人员全部罹难，1944年去世。"
 frederick_bowhill_desc:0 "1880年生，英国皇家空军上将，1937至1941年任皇家空军海岸司令部总司令，大西洋海战初期英国海上巡逻与反潜体系建设的主要负责人。他长期致力于为海岸司令部争取长航程海上巡逻机，以填补盟军航空力量无法覆盖的大西洋中部“空白区”，并推动海岸司令部与皇家海军之间的情报共享与协作，但资源分配的优先权争夺贯穿其整个任期。1941年5月德国战列舰俾斯麦号突入大西洋，他麾下的巡逻机在搜索定位德舰的过程中承担了重要侦察任务。此后他转任渡洋飞行司令部总司令，组织跨大西洋的飞机转运工作，1960年去世。"
 louis_mountbatten_desc:0 "1900年生于温莎，英国王室贵族出身（即后来的第一代缅甸伯爵蒙巴顿），海务大臣。战争初期他以海军军官服役，所指挥的“凯利”号驱逐舰于1941年在克里特岛附近遭德机击沉，他本人生还。1941至1943年他出任联合作战司令，主管跨海突袭行动，其中1942年8月代号“朱比利”的迪耶普突袭惨遭失败，进攻部队以加拿大士兵为主，伤亡惨重，该行动的决策与准备至今仍受严厉批评。1943年他出任东南亚盟军最高司令，与斯利姆密切协作，主持了缅甸战场的全面反攻并受降日军。1947年他以印度末任总督的身份主持英属印度独立，在极短的时间框架内推动印巴分治；分治过程中引发了大规模的人口迁徙与教派间暴力冲突。战后他历任第一海务大臣和英国国防参谋长等最高军事要职，1979年遭爱尔兰共和军炸弹袭击身亡。"
 max_horton_desc:0 "1883年生，英国皇家海军上将，以第一次世界大战中的潜艇作战和第二次世界大战中扭转大西洋海战局势而著称。一战期间他驾驶潜艇在波罗的海执行高风险破交任务，声名大振。二战初期他出任潜艇舰队司令，1942年11月起出任西方路线总司令，主持北大西洋护航船队和反潜作战的全面统筹，推动引入可机动增援受攻击船队的护航支援大队，并更有效地协调陆基反潜航空巡逻；1943年5月前后盟国在大西洋海战中明显扭转颓势，德国潜艇损失急剧上升，1951年去世。"
 ENG_david_stirling_desc:0 "1915年生于苏格兰斯特灵郡，英国陆军中校，特种空勤团（SAS）的创始人。1941年他在北非服役期间提出以小编组人员深入敌后、突袭轴心国机场和补给设施的作战理念，获中东总司令部批准后成立特别空勤团，随即发起多次奇袭，摧毁大批停驻地面的轴心国飞机，兵力消耗极小。1943年1月他在突尼斯被德军俘虏，被关押于科尔迪茨堡战俘营直至战争结束。战后他创办私人安保公司，并在1970至1980年代卷入带有极右翼色彩的英国国内政治活动，曾被指参与针对工潮或社会动乱的准军事准备计划，1990年去世。"
 john_beckett_desc:0 "1894年生，英国政治人物，法西斯分子。一战时曾在军中服役，战后投身工党，1924年当选下议院议员，是当时工党最年轻的议员之一，早年与后来的首相艾德礼关系密切，以言辞犀利、行事叛逆著称。1930年代初他对议会政治彻底失望，1934年加入莫斯利的英国法西斯联盟，出任宣传主管，主编其机关报。1937年他与莫斯利决裂，转而与威廉·乔伊斯共同创立“国家社会主义者同盟”，立场更趋极端、反犹色彩更浓；值得一提的是，他本人有犹太血统的母亲，却终生隐瞒并公开宣扬反犹主张。第二次世界大战期间，他依据防卫条例被拘押，是被关押时间最长的英国法西斯分子之一，1943年因健康原因获释。战后他的政治影响力已基本消失，1964年去世。"
 ENG_philip_kerr_desc:0 "1882年生于伦敦，出身贵族世家，即第十一代洛锡安侯爵，英国政治家、外交家与帝国思想的代表人物。他早年在南非参与殖民行政，是“米尔纳幼儿园”成员之一，回国后与他人共同创办圆桌集团及其刊物《圆桌》，鼓吹将大英帝国改造为联邦式结构的“帝国联邦”理念。第一次世界大战期间，他任首相劳合·乔治的私人秘书，参与巴黎和会，参与起草《凡尔赛和约》战争罪责条款。1930年代他是绥靖政策的重要支持者，强调凡尔赛体系对德国的苛刻和苏联共产主义的威胁。1939年起他出任驻美国大使，在争取美国舆论与援助、为后来的《租借法案》铺路方面成效显著，1940年在华盛顿任上去世。"
 ENG_nevile_henderson_desc:0 "1882年生，英国职业外交官，以绥靖时期出任驻德国大使而为人所知。他长期在外交界任职，先后在多国使馆服务，1937年出任驻柏林大使，正值英德关系日趋紧张之际。在任期间，他是张伯伦对德外交的前线执行者，频繁与希特勒及纳粹高层接触，力图通过谈判和让步维持和平，包括在苏台德危机和慕尼黑会议期间充当沟通渠道；他对纳粹德国的判断后来被广泛批评为过于乐观。1939年9月德国入侵波兰后，他向德方递交了英国的最后通牒，随后英国对德宣战，他也奉调回国。他著有回忆录为自己的对德外交辩护，1942年因病去世。"
 ENG_maxwell_aitken_desc:0 "1879年生于加拿大，即第一代比弗布鲁克男爵，报业巨头与战时政府要员。他早年在加拿大经商致富，迁居英国后进入政界并买下《每日快报》，将其打造为英国发行量最大的报纸之一，建立起庞大的报业帝国，长期以媒体影响公众舆论和政治。他是丘吉尔的密友与政治盟友。第二次世界大战期间，他在丘吉尔政府中出任飞机生产大臣，在不列颠空战前后主持战斗机的紧急增产，对维持英国空军的飞机供应发挥了重要作用；此后他还担任过供应大臣等职，参与战时军工动员和对苏援助事务。他在政府内以雷厉风行和不拘程序著称，也因此屡与官僚体系发生摩擦，1964年去世。"
 ENG_leslie_hore_belisha_desc:0 "1893年生，英国自由党—国民派政治家，出身西班牙裔犹太移民家庭，幼年丧父，由母亲抚养成人，后就读于克利夫顿学院，并在牛津大学埃克塞特学院完成学业，曾参加第一次世界大战。他从政后加入自由党并随国民联合政府阵营转为自由国民党，历任多个内阁职务，以交通大臣任内推动道路安全立法知名，伦敦街头供行人过街的“贝利沙灯”即以他命名。1937年出任陆军大臣，着手推动陆军现代化与机械化改革，扩充兵员、改善士兵待遇、提拔较年轻的军官，但其改革风格和对传统军方高层的冲击引发了与将领们的激烈矛盾。1940年初他在与军方的持续紧张关系中被免去陆军大臣职务。1957年去世。"
 ENG_ernest_bevin_desc:0 "1881年生，出身贫寒，幼年丧母、少年即做工，英国工会领袖与工党政治家。他没有受过多少正规教育，凭借组织才能在工会运动中崛起，一手缔造了规模庞大的运输与普通工人工会（TGWU），成为两次大战之间英国工会运动最有权势的人物之一。第二次世界大战期间，丘吉尔联合政府任命他为劳工与国民兵役大臣，他全面负责战时劳动力的动员与调配，对支撑英国的战争生产发挥了关键作用。1945年工党执政后，他出任外交大臣，在战后初期的国际格局中主张对苏强硬，推动英国参与北约的创建，是冷战初期西方阵营的重要塑造者之一，也深度参与了战后欧洲重建与巴勒斯坦等帝国善后问题。1951年去世。"
 ENG_mary_sophia_allen_desc:0 "1878年生于加的夫，铁路高级职员家庭出身，英国女警先驱，后转向法西斯主义。她早年投身妇女参政运动，是潘克赫斯特领导的妇女社会政治同盟（WSPU）的活跃成员，曾因砸窗等抗争行动多次入狱、进行绝食并遭强制灌食。第一次世界大战爆发后，她参与创建英国最早的女警组织之一，长期担任领导职务，致力于推动妇女进入警务工作，并多次赴国外讲学、传授女警训练经验。1930年代，她的政治立场急剧右转：1934年她会见希特勒，对纳粹德国“恢复秩序”的做法公开表示赞赏，随后加入莫斯利的英国法西斯联盟，为其刊物撰稿，并组织带有反共色彩的“妇女后备队”。第二次世界大战期间，她因与德国的可疑联系受到怀疑，住所遭搜查，当局一度考虑将其拘押但未执行，1964年去世。"
 ENG_george_orwell_desc:0 "1903年生于英属印度，本名埃里克·阿瑟·布莱尔，英国作家、记者与社会批评家，“奥威尔”为其笔名。他在英国受教育，毕业于伊顿公学，1922至1927年间在缅甸服务于英印帝国警察，亲历殖民统治的运作，这段经历使他对帝国主义产生深刻的反感，后写成小说《缅甸岁月》和《射象》《绞刑》等散文。辞去警职返英后，他长期体验贫困生活并转向社会主义。1936年底，他奔赴西班牙参加内战，加入马克思主义统一工人党（POUM）民兵作战，喉部中弹负伤；西班牙内战中亲见共产党派系的内斗与清洗，使他在坚持社会主义的同时坚定反对极权与斯大林主义。第二次世界大战期间他在英国从事写作和广播工作，战后以《动物农场》和《一九八四》两部作品确立其反极权文学的世界声誉，1950年因肺结核去世。"
 ENG_sylvia_pankhurst_desc:0 "1882年生于曼彻斯特，出身著名的潘克赫斯特政治家庭，英国妇女参政运动活动家、社会主义者与反殖民主义者。她是妇女社会政治同盟领袖埃米琳·潘克赫斯特之女，早年投身争取妇女选举权的斗争，多次入狱、绝食并遭强制灌食；但她逐渐与母亲和姐姐的路线分歧，将妇女参政与工人阶级、反战和社会主义事业结合，在伦敦东区从事基层组织工作。第一次世界大战期间她持反战立场，战后一度同情共产主义运动，后又与之疏远。1930年代，她成为坚定的反法西斯主义者，强烈反对意大利对埃塞俄比亚的侵略，长期声援埃塞俄比亚独立事业，并投身反殖民与人道活动。晚年她移居埃塞俄比亚，1960年在亚的斯亚贝巴去世。"
 ENG_david_lloyd_george_desc:0 "1863年生，在威尔士长大，律师出身，自由党政治家，第一次世界大战后期的英国首相。他早年以激进改革者著称，担任财政大臣期间推动养老金和国民保险等社会立法，奠定了英国福利制度的早期基础。1916年他出任首相，领导英国度过一战最艰难的阶段，直至1918年协约国获胜；战后他作为主要领导人之一出席巴黎和会，参与塑造《凡尔赛和约》。1922年他领导的联合政府垮台，此后再未回到权力核心。1930年代，他对国内经济政策仍有主张，对德国问题的态度则引起争议——他曾于1936年访问德国并会见希特勒，留下过对纳粹德国某些方面的正面评论。他的主要历史功绩属于第一次世界大战时期，1945年去世。"
 ENG_corgis_1_desc:0 "王室柯基犬，乔治六世一家的宠物犬之一。英国王室与彭布罗克威尔士柯基犬的渊源始于1930年代初，约克公爵（即后来的乔治六世）为女儿们引入了这一品种，自此柯基成为英国王室最具标志性的犬种之一，陪伴王室一家度过了战时宫廷生活。"
 ENG_corgis_2_desc:0 "英国王室最早引入的彭布罗克威尔士柯基犬之一，1933年由约克公爵（后为乔治六世）和约克公爵夫人为公主们购入，由此开创了王室与柯基犬长达数十年的渊源。杜基以顽皮著称，曾在宫廷场合多次行为失范，以咬人记录见诸报端，约在1940年代去世。"
 ENG_corgis_3_desc:0 "王室柯基犬，1930至1940年代乔治六世一家早期饲养的几只彭布罗克威尔士柯基犬之一，是英国王室柯基犬传统的早期成员，常随王室出入宫廷与行宫，伴随一家人度过第二次世界大战期间的宫廷生活，具体生卒年代已难以查考。"
 eng_stewart_menzies_desc:0 "1890年生，英国情报官员，第二次世界大战期间长期担任秘密情报局（军情六处，MI6）局长。他出身上层家庭，一战中曾在军中服役并转入情报工作，战间期在情报系统内逐级上升，1939年出任军情六处负责人，任职至1952年。在他主持下，军情六处统辖英国对外秘密情报工作，并与设在布莱切利园的政府密码学校保持密切关系——后者破译德国“恩尼格玛”密码的成果（即“超级机密”情报）经由他的渠道呈送丘吉尔等最高决策层。他在协调情报分发、保护破译来源等方面发挥了枢纽作用。1968年去世。"
 eng_alan_turing_desc:0 "1912年生于伦敦，英国数学家、逻辑学家，计算机科学与人工智能的先驱之一。1936年他提出后来被称为“图灵机”的抽象计算模型，为现代计算理论奠定了基础。第二次世界大战期间，他在布莱切利园从事密码破译工作，是攻克德国“恩尼格玛”密码的核心人物之一：他改进并设计了用于破译的机电装置“炸弹机”（Bombe），大幅提升了破译效率，对大西洋海战等战场的情报支援意义重大；但破译工作是布莱切利园数千名人员协作的成果，并非一人之功。战后他在计算机设计和数学生物学等领域继续开展开创性研究。1952年，他因同性恋行为被定罪——当时英国法律仍将其视为犯罪——被迫接受激素处理，事业和生活遭受沉重打击。1954年他去世，普遍认为是自杀；多年后英国政府就对他的迫害正式道歉并予以赦免。"
 CBIO_ENG_jack_churchill_desc:0 "1906年生，英国陆军军官，原名约翰·马尔科姆·索普·弗莱明·丘吉尔，常被称为“疯杰克”。他以在第二次世界大战中携带长弓、苏格兰阔剑和风笛作战闻名，是英军突击队中极具传奇色彩的人物。1940年法国战役中，他据称以长弓射杀德军士兵；此后参加挪威沃格岛突袭、西西里与意大利作战，并在南斯拉夫战场与游击队协同作战时被德军俘虏。后被转押多处战俘营，战争末期成功脱身。其事迹常被作为英军特种作战早期冒险精神的象征，但更多属于个人传奇，实际军事影响不能与高级指挥官相提并论。1996年去世。"
