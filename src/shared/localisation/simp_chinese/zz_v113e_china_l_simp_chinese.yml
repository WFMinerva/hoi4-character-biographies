 MAN_ding_jianxiu_desc:0 "丁鉴修（1886年—1944年），字斡元，奉天府盖平县人。光绪年间赴日留学，毕业于早稻田大学经济学科，归国后获法政科举人，授邮传部七品京官。其后返回奉天，在师范、法律、陆军、警察诸学校任教习。中华民国成立后，丁鉴修历任奉天交涉司日语科科员、奉天巡按使署外交科长、东三省陆军司令部外交处处长等职，并参与中日合办矿业公司事务。1928年张作霖皇姑屯遇难后，他与袁金铠等人组织临时委员会维持奉天治安。“九·一八”事变后，丁鉴修投靠日本侵略者，出任奉天地方自治维持会委员、“满铁”东北交通委员会委员长。1932年3月9日，伪满洲国成立，他参加溥仪登基典礼，任伪交通部总长。1935年，改任伪实业部大臣。1937年，任伪实业协会会长，满洲电业会社董事长等职。1939年，任伪中央本部副本部长兼企划局长。翌年离职，1944年病死于长春。"
 MAN_sun_qichang_desc:0 "孙其昌（1885年—1954年），字锺舞，奉天府辽阳州人。清末为附生，后赴日留学，毕业于东京师范学校。归国后历任辽宁师范学校校长、奉天商业学校校长、黑龙江省督军公署秘书等职。1920年署理黑龙江省教育厅厅长，翌年转任北京政府外交部特派吉林交涉员；1925年任吉林省财政厅厅长兼永衡官银号会办；1927年任吉长道尹。张学良东北易帜后，孙其昌出任吉林省政府委员兼建设厅厅长，1931年辞职。九一八事变爆发后，他加入熙洽组织的吉林省政府，任财政厅厅长兼永衡官银号会办及烟酒事务局局长。满洲国成立后任财政部次长；1933年出任黑龙江省省长，翌年行政改制后改任龙江省省长；1935年升任满洲国财政部大臣，1937年改任民政部大臣，同年随部门改组转任民生部大臣。1940年因对满洲国经济政策不满，被降职为参议府参议，任至1942年。1945年满洲国覆灭后，孙其昌隐居北平；1951年被北京市公安局逮捕，1954年病逝。"
 MEN_chin_yung_chang_desc:0 "金永昌（1885年—？），蒙古族，内蒙古卓索图盟喀喇沁右旗人，别号勉卿。蒙古语名汉译初为阿勒唐瓦齐尔，意近“金刚”，后定译阿拉坦鄂齐尔。早年就读于喀喇沁右旗军官学堂，1909年赴日本，入东京帝国大学农学部习畜产学。归国后，历任北京临时参议院蒙古选出议员、蒙藏学院教授，于护法运动中支持孙中山，出任广东非常国会议员，后返归北洋政府，任黎元洪大总统府顾问，并先后任蒙藏专门学校校长、西北督办公署顾问。1925年任内蒙古国民党中央执行委员，其后任南京国民政府农矿部设计委员。1932年应关东军邀请，于满洲国成立后任驻蒙办事处处长，后转入内蒙古任职，历任蒙古地方自治政务委员会委员、蒙古军政府内务处长及蒙古军政府驻满代表。1937年11月蒙古联盟自治政府成立后，任总务兼交通委员；1938年8月政府改组，改任产业部长。"
 MEN_altanochir_desc:0 "阿拉坦鄂齐尔（1885年—？），蒙古族，内蒙古卓索图盟喀喇沁右旗人，汉名金永昌，别号勉卿。蒙古语名汉译初为阿勒唐瓦齐尔，意近“金刚”，后定译阿拉坦鄂齐尔。早年就读于喀喇沁右旗军官学堂，1909年赴日本，入东京帝国大学农学部习畜产学。归国后，历任北京临时参议院蒙古选出议员、蒙藏学院教授，于护法运动中支持孙中山，出任广东非常国会议员，后返归北洋政府，任黎元洪大总统府顾问，并先后任蒙藏专门学校校长、西北督办公署顾问。1925年任内蒙古国民党中央执行委员，其后任南京国民政府农矿部设计委员。1932年应关东军邀请，于满洲国成立后任驻蒙办事处处长，后转入内蒙古任职，历任蒙古地方自治政务委员会委员、蒙古军政府内务处长及蒙古军政府驻满代表。1937年11月蒙古联盟自治政府成立后，任总务兼交通委员；1938年8月政府改组，改任产业部长。"
