l_simp_chinese:
 CHI_zhou_zhirou_desc:0 "周至柔，原名百福，字至柔，1899年11月30日生于浙江临海。早年入保定陆军军官学校第八期步兵科，毕业后任职浙军，1924年南下广州任黄埔军校教官，参加东征、北伐及国民革命军早期作战。1930年代先后任第十四师师长、第十八军副军长等职，1933年奉派赴欧美考察航空，回国后主持中央航空学校和国民政府航空委员会工作，1936年出任航空委员会主任，成为国民政府空军制度建设、训练体系和作战指挥的重要负责人。全面抗战期间，他统筹中国空军训练、装备、基地和对日作战，参与淞沪、武汉、长沙、鄂西、常德、桂柳等阶段的空军作战与后勤建设，并与中美航空合作体系关系密切。1946年任空军总司令，1949年后赴台，历任参谋总长、台湾省政府主席、总统府参军长等职，1951年晋一级上将。1986年8月29日在台北去世。"
 CHI_wan_fulin_desc:0 "万福麟（1880年一1951年），字寿山，吉林农安（今吉林长岭 ）人，祖籍直隶宁河（今天津宁河），辽宁省原主席、陆军二级上将。1900年入靖威军当兵，历任排长、连长、营长、团长、旅长、师长。1926年任东北陆军第八军军长，授陆军中将。1928年任黑龙江军务督办、东北边防军副总司令。1929年任黑龙江省政府主席、第五编遣区主任、防俄军总司令。1930年随张学良入关进驻华北。九一八事变后，任北平绥靖公署常务委员、总参议。同年9月任第四军团军团长。1933年2月18日与张学良等27名将领向全国通电，决心抗击日军，率部参加长城抗战。后任第五十三军军长，驻防保定地区。1935年4月晋授陆军二级上将。抗日战争爆发后，任第一集团军副总司令兼第五十三军军长，驻守保定，参加平汉线北段对日作战，负责防守大清河、永定河一线。后率部在太行山区进行抗日游击战。1938年2月，率部在豫北、豫东抗日。同年6月，任第二十六军团军团长兼第五十三军军长，率部参加武汉保卫战，在德安、星子一线阻击日军。1939年4月，任第二十集团军副总司令。1940年5月，任辽宁省政府委员兼省政府主席。1942年6月，任军事委员会委员。1945年5月当选为国民党第六届中央执行委员。抗日战争胜利后，任军事委员会委员长东北行辕副主任、东北“剿总”副总司令。1949年去台湾，任“总统府”国策顾问。"
 CHI_he_yingqin_desc:0 "何应钦（1890年4月2日—1987年10月21日），字敬之，贵州兴义人，祖籍江西金溪，中华民国陆军一级上将。日本陆军士官学校毕业，1924年协助筹建黄埔军校并任总教官，自此长期居于蒋介石军政体系核心，在黄埔系中有\"蒋何并称\"之地位，历任军政部长、军事委员会北平军分会委员长、参谋总长等要职。1935年代表中方与日方交涉，形成《何梅协定》框架（中方将中央军及国民党党部撤出河北），在日本压力下大幅退让，舆论批评甚烈，日本媒体更以\"日本通巨头\"称之。抗战期间任中国战区中国陆军总司令，1945年9月9日代表中国战区在南京主持接受日本投降仪式，达至声望顶点。战后历任国防部长、行政院长。1949年赴台，任总统府战略顾问委员会主任委员等虚职。著有《八年抗战》。1987年以九十七岁高龄辞世，为国民政府最长寿的高层之一。"
 CHI_wei_lihuang_desc:0 "卫立煌（1897年2月16日—1960年1月17日），字俊如，又字辉珊，安徽合肥（今肥东）人，中华民国国民革命军高级将领。早年以粤军士兵出身随孙中山转战，北伐中积功升将，跻身蒋介石麾下能征善战的一线战将之列（民间有\"五虎上将\"之说），以用兵务实、肯打硬仗著称，亦因非黄埔嫡系而与蒋关系微妙。抗战爆发后任第二战区前敌总指挥，指挥1937年忻口会战重创日军；后任远征军司令长官，主导1944—1945年滇西反攻，强攻松山、克复腾冲、龙陵，打通中印公路，是缅北滇西战局的关键人物。抗战中曾与八路军有协作往来，一度被疑\"通共\"。国共内战末期任东北行辕主任（东北剿总），1948年辽沈战役后被蒋解职软禁。1949年经香港，后返大陆，1955年任国防委员会副主席等职，1960年病逝北京。"
 CHI_sun_tongxuan_desc:0 "孙桐萱（1895年~1978年9月9日），字荫亭，河北省交河县(今泊头市) 人。原是西北军冯玉祥部下，任连长、营长、团长、旅长、师长。1929年随韩复榘脱离冯玉祥投靠蒋介石。1930年随韩在山东任第十二军军长。1938年1月韩复榘被蒋介石处决后，孙升任第三集团军副总司令兼第十二军军长，1940年再升任第三集团军总司令兼第十二军军长。在郑州把守河防期间，孙桐萱率第三集团军曾两次奇袭开封，每次都攻入城内，打击了日本侵略者。1941年9月，日军进行第二次长沙会战，10月31日至11月1日夜间，第三集团军全线发动反击，日军溃退，第20师60团当夜收复郑州。在国共两党的斗争中属于中间派。他出身贫苦家庭，在中国共产党抗日救国政策感召下，同情共产党。在其部队内有不少地下党员进行工作，孙不仅默许，有时还加以保护，并对蒋介石派去的特务进行斗争。因此于1943年1月18日晚，遭蒋介石设计扣押，监禁于重庆。其部队则被汤恩伯接管。1946年孙回北平寓居，但其父被留在南京为人质。解放后，在党的关怀下，全国政协委员会对孙桐萱予以生活上的照顾，使他得以安度晚年。1978年9月9日在北京病故。"
 CHI_song_zheyuan_desc:0 "宋哲元（1885年10月30日—1940年4月5日），字明轩，山东乐陵人，西北军出身，冯玉祥麾下\"五虎将\"之一，中华民国陆军上将。中原大战后冯系瓦解，宋哲元收拢旧部组成第二十九军。1933年长城抗战中，二十九军在喜峰口以大刀队夜袭日军，声名远播，成为抗战初期的精神符号。此后宋哲元主持冀察政务委员会，主政平津，在南京中央、日本华北驻屯军与地方各方势力之间维持脆弱平衡——既不愿完全屈从日本\"华北自治\"诱压，也难以全面贯彻南京政令，处境两难。1937年七七事变在其防区爆发，二十九军仓促应战失利，平津沦陷，宋哲元被指应对失当，渐失兵柄。此后职务渐虚，1940年病逝绵阳。"
 CHI_zhang_fakui_desc:0 "张发奎（1896年9月2日—1980年3月10日），字向华，原名发葵，广东始兴客家人，中华民国陆军二级上将。粤军出身，北伐期间率第四军（\"铁军\"）在汀泗桥、贺胜桥、武昌等地屡挫北洋精锐，名声大振。宁汉分裂后拥汪反蒋，其部成为南昌起义部队的主体来源，本人于事变后期参与镇压，1927年广州起义亦在其防区爆发，立场几度转折。抗战中历任第八集团军、第四战区等司令长官，指挥淞沪会战一部、武汉保卫战及粤北、桂南诸役，是八年抗战中持续担任高级指挥官的粤系代表将领。战后任陆军总司令。1949年后定居香港，参与组织反蒋反共的\"第三势力\"。1980年去世于香港。"
 CHI_hsu_huang_sheng_desc:0 "徐焕昇（1910年9月—1984年3月4日），江苏崇明人，中华民国空军二级上将。原为医科生，因感于时局而转读航校，成为飞行员。以1938年5月的\"人道远征\"（纸片轰炸日本本土）载入史册：他率两架马丁B-10机型从汉口起飞，往返飞越日本九州上空，向长崎、佐世保、福冈、北九州等地投撒大量传单，宣示中国抗战立场、揭露日本军国主义侵略，并以实际飞行证明日本本土并非不可达。此役是中国空军对日本本土的首次直接行动，国际反响广泛，象征意义远大于军事杀伤。徐焕昇因此声名鹊起，抗战中续立战功。战后历任要职，赴台后曾任空军总司令部副总司令并主导华航成立、任华航董事长，官至空军总司令。1984年去世。"
 CHI_zhu_shaoliang_desc:0 "朱绍良（1891年10月28日—1963年12月25日），原名宝瑛（因敬慕张良而改名绍良），字一民（亦作逸民）。祖籍江苏武进，生于福建福州。中国国民党军高级将领。朱绍良早年就读于福建陆军小学堂、南京陆军第四中学堂。后被选送日本振武学校。1910年加入同盟会，次年回国，参加武昌起义。后到沪军都督府任参谋。1913年参加讨袁战争，失败后再赴日本留学。1916年于日本陆军士官学校毕业后回国，投黔军王文华部。1923年随孙中山赴广州大元帅府任高级参谋。1926年任国民革命军第四军第十师参谋长，随军北伐，参加汀泗桥、贺胜桥之役。1929年任第二军军长、第六路总指挥，次年随蒋介石参加中原大战。之后参加对中央苏区的第一至第三次“围剿”。1931年兼驻赣绥靖主任。1933年任甘肃省政府主席兼驻甘绥靖主任。1935年被授予陆军二级上将军衔，兼西北“剿共”军第一路总指挥。全面抗战爆发后，曾参加淞沪会战，任第三战区中央军总司令兼第九集团军总司令。不久后升任第八战区副司令长官。1939年再任为第八战区司令长官。1946年后任军事委员会副参谋总长、重庆行辕主任等职。1949年1月任福州绥靖公署主任，8月赴台湾，任战略顾问委员会顾问等职。1963年病逝于台北。1964年被追晋为陆军一级上将"
 CHI_li_huang_desc:0 "李璜（1895年—1991年11月15日），别名幼椿，号学钝，四川成都人，中国青年党创始人、国家主义思想家。早年留学法国，深受欧洲国家主义思潮影响，1923年与曾琦等在巴黎创建中国青年党（少年中国学会国家主义派系发展而来），主张\"国家至上、民族至上\"，反对共产党，也反对国民党一党专政，是中国近代\"第三势力\"的重要代表与理论旗手。长期在知识界、教育界维系影响，著述讲学不辍。抗战期间以青年党领袖身分参与国民参政会等政治协商平台，主张多党竞争与宪政民主。1946年制宪、1948年行宪国民大会中，青年党作为参政小党与国民党展开有限的政治博弈。1949年后辗转赴台，1991年去世。"
 PRC_he_cheng_desc:0 "贺诚（1901年11月—1992年11月8日），原名贺宗霖，字润之，四川三台（今属射洪）人。早年学医，1925年加入中国共产党，是中共军队卫生工作的主要奠基人之一。大革命时期参与组织武装与医疗工作，土地革命战争时期进入红军系统，长期主管卫生勤务。当时红军作战条件极差，伤病、缺药、行军减员和传染病造成的损失常重于战场伤亡，贺诚主持筹建红军卫生机关、后方医院和救护、防疫制度，奠定了人民军队卫生体系的雏形。中央苏区时期任军委总卫生部部长，长征途中继续组织伤员转运、药品筹措与卫生管理。抗战及解放战争时期主要从事卫生行政与教育，曾赴苏联工作。中华人民共和国成立后历任军委卫生部部长、中央人民政府卫生部副部长、解放军总后勤部副部长等职。1958年补授予中将军衔，1962年荣获一级八一勋章、二级独立自由勋章、一级解放勋章。1988年荣获一级红星功勋荣誉章。1992年去世。"
 PRC_deng_fa_desc:0 "邓发（1906年3月7日—1946年4月8日），原名邓元钊，广东云浮人。出身工人，早年投身香港海员工人运动和省港大罢工，1925年前后加入中国共产党，是中共早期工人运动与政治保卫工作的代表人物之一。大革命失败后转入地下斗争与保卫系统。中央苏区时期长期主持国家政治保卫局工作，负责侦察、反特、警卫及肃反，是苏区保卫机关的主要负责人。长征途中随中央红军行动，继续从事保卫工作。其后曾赴苏联参加共产国际相关活动，回国后从事工人运动与统战工作，任中央党校校长等职。1946年4月8日，由重庆返延安途中因飞机失事在山西兴县黑茶山遇难，史称\"四八空难\"，与博古、叶挺等同机罹难。"
 PRC_deng_xiaoping_desc:0 "邓小平（1904年8月22日—1997年2月19日），原名邓先圣，学名希贤，1927年改名小平，四川广安人。少年时赴法国勤工俭学，在旅欧期间接触马克思主义并加入中共旅欧组织，后赴苏联学习。回国后从事党的组织与宣传工作。1929年受中央派遣赴广西，参与领导百色起义、龙州起义，创建红七军、红八军和左右江革命根据地，这是其早期最重要的军事政治经历。中央苏区时期在江西任职，一度因支持毛泽东的主张而受党内\"左\"倾领导排挤（\"邓毛谢古\"事件）。长征中任中央秘书长等职。抗日战争时期任八路军第129师政治委员，与师长刘伯承共同开辟晋冀鲁豫抗日根据地，\"刘邓\"并称。其后在解放战争、新中国建设中作用重大，1978年后成为改革开放的主要决策者，被誉为\"改革开放的总设计师\"。1997年去世。"
 PRC_deng_yingchao_desc:0 "邓颖超（1904年2月4日—1992年7月11日），原名邓文淑，籍贯河南光山，出生于广西南宁，少年在天津成长。五四运动中参加天津爱国学生运动，与周恩来等组织进步团体觉悟社，由此走上革命道路；1925年加入中国共产党，同年与周恩来结婚。此后长期从事妇女运动、群众工作和统一战线工作，是中共妇女工作的主要领导人之一。大革命失败后在白色恐怖下坚持地下斗争，1934年参加长征。抗战前后多在国统区（武汉、重庆）协助周恩来开展统战、社会联络与妇女工作，是中共在公开场合的重要代表性人物。中华人民共和国成立后历任全国妇联副主席、全国人大常委会副委员长、全国政协主席等职，是中共党内德高望重的女性领导人。1992年去世。"
 PRC_shao_shiping_desc:0 "邵式平（1900年1月—1965年3月24日），字守一，江西弋阳人。早年就读于北京师范大学，参加学生运动，1925年前后加入中国共产党。土地革命战争时期与方志敏、黄道等同为赣东北（闽浙赣）革命根据地的主要创建者，长期从事地方党政、群众动员和武装建设，参与组建红十军，在赣东北苏区的政权与军事建设中作用突出。其后曾在中央苏区任职，参加长征。抗日战争和解放战争时期从事干部教育、后方建设与地方政权工作。中华人民共和国成立后任江西省首任省长，主政江西多年，重视教育与农业建设。1965年去世。"
 PRC_bo_gu_commander_desc:0 "博古（1907年6月24日—1946年4月8日），本名秦邦宪，字则民，江苏无锡人，生于浙江杭州。早年参加学生运动，后留学苏联莫斯科中山大学，精通俄语与理论，为\"二十八个半布尔什维克\"之一。回国后在共产国际支持下进入中共中央领导核心，1931年起临时负总责（任临时中央政治局书记），是留苏教条主义路线的主要代表。中央苏区后期与共产国际军事顾问李德共同主导第五次反\"围剿\"的战略指挥，推行阵地战、\"御敌于国门之外\"等方针，导致反\"围剿\"失败、中央苏区丧失、红军被迫长征。1935年遵义会议上其领导地位被结束，但仍留在中央工作。此后转向统战与新闻事业，代表中共参与和平解决西安事变，创建《新华日报》《解放日报》和新华社，是中共新闻事业奠基人之一。1946年4月8日黑茶山空难遇难。"
 PRC_ye_ting_commander_desc:0 "叶挺（1896年9月10日—1946年4月8日），原名叶为询，字希夷，广东惠阳（归善）客家人。保定陆军军官学校毕业，早年入粤军，参加孙中山领导的护法、平叛诸役。1924年加入中国共产党。北伐中任国民革命军第四军独立团团长，率部在汀泗桥、贺胜桥等战斗中勇猛善战，所部被誉为\"铁军\"，本人是北伐名将。1927年参与领导南昌起义（任前敌总指挥）和广州起义，起义失败后因在党内受到不公正对待而脱党，长期流亡海外。抗日战争爆发后，以非中共党员身份出任新四军军长，统合南方红军游击队组建新四军，是抗日民族统一战线的重要象征。1941年皖南事变中被俘，长期囚禁，留有《囚歌》明志。1946年获释后重新加入中共，同年4月8日因飞机失事在黑茶山遇难。"
 PRC_zhang_guotao_commander_desc:0 "张国焘（1897年11月26日—1979年12月3日），字恺荫，又名特立，江西萍乡人，中共一大代表，党内资历极深，是中共与红军创建时期的重要领导人之一，南昌起义主要发起人之一。早年参加北京学生运动和中共建党活动，历任中央重要职务。土地革命战争时期主持鄂豫皖根据地，依托红四方面军建立起一套相对独立的党政军体系；红四方面军兵力一度强于中央红军，在川陕根据地影响很大。1935年两军会师后，张国焘在红军行动方向、中央组织权威等问题上与中共中央发生尖锐冲突，并一度另立中央，是中共党史上著名的\"张国焘路线\"与分裂事件，给红军造成严重损失。其后率部南下受挫，被迫北上。1938年借祭黄帝陵之机脱离中共，转投国民党，从事反共活动，被中共开除党籍。晚年流亡海外，1979年病逝于加拿大。"
 PRC_zhang_zongxun_commander_desc:0 "张宗逊（1908年2月7日—1998年9月14日），陕西渭南人。黄埔军校第五期出身，1926年加入中国共产党。参加秋收起义后随毛泽东上井冈山，是较早追随毛泽东的军事干部之一。张宗逊主要在一线作战部队中成长，历经井冈山斗争、中央苏区历次反\"围剿\"和长征，逐步成长为红军中坚指挥员。到达陕北后参与保卫陕甘宁根据地和部队整编，在红一方面军系统积累了丰富的指挥经验。抗日战争时期任八路军第120师358旅旅长等职，解放战争时期参与西北战场作战，任第一野战军副司令员等职。中华人民共和国成立后历任解放军副总参谋长、总后勤部部长等要职，1955年被授予上将军衔。1998年去世。"
 PRC_zhang_qinqiu_commander_desc:0 "张琴秋（1904年11月15日—1968年4月22日），学名张梧，浙江崇德（今桐乡）人。早年赴苏联莫斯科中山大学学习，回国后进入中共组织和红军系统，是红军中少有的女性高级干部。土地革命战争时期长期在鄂豫皖、川陕根据地工作，曾任红四方面军总政治部主任及地方党政、妇女工作领导职务，是中共军队中职务最高的女性之一。川陕根据地时期，红四方面军组建妇女独立团、妇女独立师，张琴秋曾任师长，组织大批女战士承担运输、救护、宣传乃至作战任务。长征中随红四方面军行动，三过草地、备历艰险。中华人民共和国成立后转入经济战线，任纺织工业部副部长。1968年去世。"
 PRC_li_zhen_commander_desc:0 "李贞（1908年—1990年），湖南浏阳人，中国人民解放军第一位女将军。出身贫苦农家，幼年曾为童养媳，备受压迫，后冲破封建束缚投身革命。1926年前后参加妇女运动和地方农民运动，1927年加入中国共产党，并在秋收起义前后投入武装斗争。土地革命战争时期长期在湘赣、湘鄂川黔等根据地从事妇女工作、组织工作和红军政治工作，在红六军团西征及红二、红六军团会合后于部队政治机关任职，主管组织、干部与妇女动员。长征中随红二方面军转战西南。抗日战争时期在八路军系统从事政治工作，解放战争时期续任军队政治职务。1955年被授予少将军衔，成为新中国第一位女将军，是人民军队妇女解放与女性参军的标志性人物。1990年去世。"
 PRC_lin_biao_commander_desc:0 "林彪（1907年12月5日—1971年9月13日），原名祚大，字阳春，湖北黄冈（团风）人。黄埔军校第四期出身，参加北伐，后随部队参加南昌起义并进入红军。井冈山时期迅速崭露头角，用兵谨慎而善于捕捉战机，长于运动战。中央苏区时期任红一军团军团长，在历次反\"围剿\"中积累大兵团作战经验。长征中率部参加突破封锁线、强渡乌江、四渡赤水、抢占泸定桥等关键作战，是中央红军最重要的前线指挥员之一。抗日战争时期任八路军第115师师长，指挥平型关战斗，取得华北抗战初期的重要胜利。解放战争中主持东北、华北战场，指挥辽沈、平津战役，战功卓著，1955年被授予元帅军衔，是中共最负盛名的军事将领之一。1971年九一三事件中乘机外逃、坠机身亡。"
 PRC_su_yu_commander_desc:0 "粟裕（1907年8月10日—1984年2月5日），字裕，以字行，湖南会同人，侗族。早年参加叶挺领导的国民革命军第二十四师，后参加南昌起义和湘南起义，随朱德、陈毅上井冈山。土地革命战争时期长期在红军一线作战，从基层连排逐步成长为能独立指挥的中高级将领。中央红军主力长征后留在南方，随方志敏率领的红军北上抗日先遣队（红十军团）行动；部队在皖南怀玉山失败后，粟裕率突围余部转战浙南，坚持极端艰苦的三年游击战。抗日战争时期任新四军要职，开辟苏中、苏浙根据地。解放战争中指挥苏中、孟良崮、豫东、淮海等战役，以善打大仗、恶仗、巧仗著称，毛泽东评其为\"淮海战役第一功\"。1955年被授予大将军衔，居十大将之首。"
 PRC_luo_ruiqing_commander_desc:0 "罗瑞卿（1906年5月31日—1978年8月3日），原名其荣，因身材高大有\"罗长子\"之称，四川南充人。早年考入黄埔军校武汉分校，1928年前后加入中国共产党并参加红军。土地革命战争时期长期从事政治保卫、干部管理和部队政治工作，中央苏区时期参与红军保卫机关和政治机关工作，长征中随中央红军转战，经历突围、行军和到陕北后的整编。抗日战争时期任抗大教育长、副校长等职，主管干部教育。解放战争中任兵团政委等职。中华人民共和国成立后任公安部首任部长、解放军总参谋长、中共中央书记处书记、国务院副总理等要职，1955年被授予大将军衔，是党和军队政法、保卫系统的主要领导人。1978年病逝。"
 PRC_luo_ronghuan_commander_desc:0 "罗荣桓（1902年11月26日—1963年12月16日），原名慎镇，字雅怀，湖南衡山（今衡东）人。早年参加学生运动和农民运动，1927年参加秋收起义，随部队上井冈山，是较早追随毛泽东的干部之一。红军时期长期从事政治工作，在部队党组织建设、纪律教育和群众关系方面经验丰富。中央苏区时期任红军政治委员等职，参加反\"围剿\"和长征。与以战术指挥见长的将领不同，罗荣桓的特长在于把部队组织、政治动员与群众工作结合起来，是中共\"政治建军\"的代表人物。抗日战争时期赴山东，主持山东抗日根据地党政军全面工作，使山东成为中共重要战略区。解放战争中任东北野战军政委，与林彪搭档主持东北战场。1955年被授予元帅军衔。1963年病逝，毛泽东主席以“君今不幸离人世，国有疑难可问谁？”为其作悼诗。"
 PRC_nie_rongzhen_commander_desc:0 "聂荣臻（1899年12月29日—1992年5月14日），字福骈，四川江津（今属重庆）人。早年赴法国、比利时勤工俭学，后入苏联学习军事，回国后参加黄埔军校政治工作和北伐。南昌起义、广州起义后进入红军系统，长期兼理政治工作与军事指挥。中央苏区时期任红一军团政治委员，与军团长林彪搭档多年，参与历次反\"围剿\"和长征，在维持部队政治纪律与配合前线作战上发挥重要作用。抗日战争时期任八路军第115师副师长，后创建并主持晋察冀抗日根据地，被誉为\"模范根据地\"。解放战争中主持华北军区。中华人民共和国成立后长期主管科学技术和国防工业，是\"两弹一星\"事业的主要组织领导者，1955年被授予元帅军衔。1992年去世，是十大元帅中最后辞世者。"
 PRC_xiao_ke_commander_desc:0 "萧克（1907年7月14日—2008年10月24日），原名武毅，字子敬，又作肖克，湖南嘉禾人。早年参加国民革命军，后参加南昌起义和湘南起义，进入井冈山红军。土地革命战争时期长期在湘赣、湘鄂川黔等地作战，逐步成为红六军团和红二方面军系统的重要指挥员。1934年红六军团西征，与贺龙领导的部队会合，为日后红二、红六军团协同作战奠定基础；萧克曾任红六军团军团长、红二方面军副总指挥，熟悉山地游击、长途机动与根据地建设。抗日战争时期任八路军第120师副师长、晋察冀军区相关要职。解放战争中任华北、第四野战军参谋长等职。1955年被授予上将军衔，居开国上将之首。晚年长期主持军事教育，并以历史小说《浴血罗霄》获茅盾文学奖荣誉奖。2008年以百岁高龄辞世。"
 PRC_chen_yi_commander_desc:0 "陈毅（1901年8月26日—1972年1月6日），原名世俊，字仲弘，四川乐至人。早年赴法国勤工俭学，因参加学生运动被遣送回国，后投身革命。南昌起义后随朱德部队转战赣南、湘南，参与井冈山会师，在艰难处境中协助朱德保存了起义部队余部。中央苏区时期长期从事红军政治工作和地方根据地建设，在军事、党务、群众工作间多面兼顾。中央红军长征后因伤病留在南方，与项英等领导南方红军三年游击战，在极端艰苦环境下坚持斗争，写下《梅岭三章》明志。抗日战争时期任新四军要职，皖南事变后任新四军代军长，重建新四军。解放战争中任华东野战军（第三野战军）司令员兼政委，与粟裕配合指挥华东战场。1955年被授予元帅军衔，后长期任上海市长、外交部长。陈毅性情豪爽、能诗善文，是兼具军政与文采的元帅。1972年病逝。"
 PRC_gao_gang_commander_desc:0 "高岗（1905年10月25日—1954年8月17日），原名崇德，字硕卿，陕西横山（今属榆林）人。早年在陕北参加革命活动，长期从事地方党务、武装斗争和根据地建设。土地革命战争时期，陕北和陕甘边根据地在多次\"围剿\"中艰难保存革命火种，高岗与刘志丹、谢子长等同为西北红军和陕北根据地的重要领导人。中央红军长征到达陕北后，陕北根据地为中共中央提供了落脚点，高岗也由此进入更高层级的党政军工作，在中央与西北地方根据地的整合中起重要作用。抗日战争和解放战争时期长期主政西北党政军。中华人民共和国成立后任中央人民政府副主席、东北人民政府主席、国家计划委员会主席，一度权位极高。1954年因\"高饶事件\"受到批判，同年自杀身亡。"
 PRC_chen_yun_desc:0 "陈云（1905年6月13日—1995年4月10日），曾用名廖陈云，江苏青浦（今属上海）人。出身贫寒，早年在商务印书馆当学徒，参加工人运动，1925年加入中国共产党。大革命失败后长期从事党的组织工作和工人运动。中央苏区时期进入中共中央组织系统，参与干部管理、组织恢复和党内事务，1934年参加长征，遵义会议后曾被派往上海、莫斯科等地，向共产国际汇报红军长征和遵义会议情况，承担对外联络任务。抗日战争时期任中央组织部部长，主管全党干部工作。解放战争时期主持东北经济与财政。中华人民共和国成立后长期主管全国财政经济，是新中国计划经济体制和经济恢复的主要奠基者之一，改革开放后续任中共中央副主席、中央纪律检查委员会第一书记等要职，以稳健务实的经济思想著称。1995年去世，是中共第一、二代领导集体的重要成员。"
 PRC_chen_shaomin_desc:0 "陈少敏（1902年—1977年12月14日），原名孙肇修，山东寿光人。出身贫苦，早年做过纱厂女工，参加工人运动和妇女运动，1927年投身革命，1928年加入中国共产党。大革命失败后长期在白区、工厂和地方党组织中活动，多次被捕，坚持地下斗争，是中共早期工人运动和妇女工作的代表性女干部之一。抗战前后转入华中地区，参与地方党组织、工人组织和根据地建设，曾任中共豫鄂边区党委要职，在新四军第五师及鄂豫边抗日根据地的创建中发挥作用，有\"白区女杰\"之称。中华人民共和国成立后长期从事工会工作，历任中华全国总工会副主席、中国纺织工会第一任主席等职，是中共第八届中央委员。其性格刚直，在\"文化大革命\"中曾表示异议。1977年去世。"
 PRC_chen_changhao_desc:0 "陈昌浩（1906年9月18日—1967年7月30日），湖北汉阳人，曾用名苍木。早年赴苏联莫斯科中山大学学习，为\"二十八个半布尔什维克\"之一，回国后进入鄂豫皖根据地和红四方面军系统。土地革命战争时期长期担任红四方面军主要政治领导（总政治委员），与张国焘关系密切，在这支兵力强盛、体系相对独立的红军中地位很高，是红四方面军党政军核心人物之一。川陕根据地时期参与部队建设与作战指挥。长征中随红四方面军行动，经历两军会合、分歧及南下受挫。1936年红四方面军主力一部组成西路军西渡黄河，陈昌浩任西路军军政委员会主席，西路军在河西走廊苦战失败、几乎全军覆没，此后长期未再担任重要军事职务。后赴苏联多年，1952年回国从事编译工作。"
 PRC_chen_yi_desc:0 "陈毅（1901年8月26日—1972年1月6日），原名世俊，字仲弘，四川乐至人。早年赴法国勤工俭学，因参加学生运动被遣送回国，后投身革命。南昌起义后随朱德部队转战赣南、湘南，参与井冈山会师，在艰难处境中协助朱德保存了起义部队余部。中央苏区时期长期从事红军政治工作和地方根据地建设，在军事、党务、群众工作间多面兼顾。中央红军长征后因伤病留在南方，与项英等领导南方红军三年游击战，在极端艰苦环境下坚持斗争，写下《梅岭三章》明志。抗日战争时期任新四军要职，皖南事变后任新四军代军长，重建新四军。解放战争中任华东野战军（第三野战军）司令员兼政委，与粟裕配合指挥华东战场。1955年被授予元帅军衔，后长期任上海市长、外交部长。陈毅性情豪爽、能诗善文，是兼具军政与文采的元帅。1972年病逝。"
 PRC_chen_tanqiu_desc:0 "陈潭秋（1896年1月4日—1943年9月27日），名澄，字云先，湖北黄冈人，中国共产党创始人之一、中共一大代表。早年在武汉参加五四运动和马克思主义传播活动，是湖北党组织的主要创建者。建党后长期在湖北、江西、满洲、福建等地从事组织、宣传和地下工作，多次在白色恐怖下恢复重建党组织。土地革命战争时期参与中央苏区工作，后赴苏联参加共产国际相关活动。于1939年受党派遣赴新疆工作，任中共驻新疆代表、八路军驻新疆办事处负责人，从事统战与党务。1942年新疆军阀盛世才公开反共后，陈潭秋等被捕。1943年9月27日在迪化（今乌鲁木齐）被盛世才秘密杀害。"
 PRC_rao_shoukun_desc:0 "饶守坤（1915年9月30日—2006年9月14日），江西德兴人。少年参加革命，进入红军后在赣东北和闽浙赣地区活动，是方志敏系统培养的青年战士。中央红军主力长征后，留在南方的红军和游击队陷入极端艰苦的环境，饶守坤随部在闽浙赣山区坚持三年游击战，备历艰险，从普通战士成长为基层指挥员。抗日战争时期，任新四军第三支队五团团长，军部教导大队大队长，江北指挥部特务营营长兼政治委员，第五支队八团副团长，十五团团长，新四军第二师五旅十三团团长，淮南军区第四军分区副司令员。解放战争时期任苏中军区独立旅副旅长、旅长，华东野战军第六纵队十八师师长，先遣纵队副司令员兼第七支队司令员，第三野战军三十军副军长。参加了苏中、莱芜、孟良崮、豫东、渡江、上海等战役。新中国成立后，历任华东军区海军第七舰队司令员、吴淞要塞区司令员、海军淞沪基地司令员、海军东海舰队副司令员、国防部第七研究院院长、北海舰队司令员、济南军区司令员，1955年被授予中将军衔。2006年去世。"
 PRC_gao_gang_desc:0 "高岗（1905年10月25日—1954年8月17日），原名崇德，字硕卿，陕西横山（今属榆林）人。早年在陕北参加革命活动，长期从事地方党务、武装斗争和根据地建设。土地革命战争时期，陕北和陕甘边根据地在多次\"围剿\"中艰难保存革命火种，高岗与刘志丹、谢子长等同为西北红军和陕北根据地的重要领导人。中央红军长征到达陕北后，陕北根据地为中共中央提供了落脚点，高岗也由此进入更高层级的党政军工作，在中央与西北地方根据地的整合中起重要作用。抗日战争和解放战争时期长期主政西北党政军。中华人民共和国成立后任中央人民政府副主席、东北人民政府主席、国家计划委员会主席，一度权位极高。1954年因\"高饶事件\"受到批判，同年自杀身亡。"
 GXC_li_jishen_desc:0 "李济深（1885年—1959年），原名济琛，字任潮，广西梧州苍梧人。保定军校系统出身，早年为粤军重要将领，曾在黄埔军校任教，北伐期间一度支持蒋介石（\"四一二\"事变中态度倾蒋），后多次因权位与路线与蒋冲突，逐渐转向反蒋。一度主政广东、广西，是国民党内资深军政人物。1933年与十九路军将领等发动福建事变，成立\"中华共和国人民革命政府\"并任主席，事败后长期处于在野与反蒋地位。抗日战争时期响应一致抗日号召，反对国民政府的反共政策，是两广及国民党内反蒋势力的旗帜性人物，主张抗日、反对内战。抗战胜利后公开脱离蒋介石的国民党，1948年发起成立中国国民党革命委员会（民革）并任主席。中华人民共和国成立后历任中央人民政府副主席、全国人大常委会副委员长等职。1959年去世。"
 GXC_huang_shaohong_desc:0 "黄绍竑（1895年—1966年），又名绍雄，字季宽，广西容县人，新桂系三大巨头之一，与李宗仁、白崇禧并称，共同奠定桂系基业。早年参与统一广西、参加北伐，是新桂系的创始核心成员，长于政务与谋略。与始终立足广西、掌握军权的李、白不同，黄绍竑后来逐渐脱离桂系军事核心，转入南京中央任职，历任广西省、浙江省、湖北省主席及内政部长等要职，政治态度较为灵活务实，常在中央与地方之间斡旋。抗日战争时期任省主席、军事委员会要职。解放战争后期作为国民政府和谈代表参与国共北平谈判，谈判破裂后留在大陆，宣布脱离国民党。中华人民共和国成立后任全国人大、政协相关职务。1966年去世。"
 YUN_ding_zhipan_desc:0 "丁治磐（1894年1月19日—1988年3月8日），字似庵，江苏东海人，兼以诗人、书法家著称。早年投身行伍，由旧军队体系逐步进入国民革命军，历任师、军级指挥，属中央军序列中资历较深的职业军官。抗日战争时期参加多次会战，长于稳健用兵与部队整训。解放战争时期任兵团司令、第一绥靖区司令官等职，战后曾短暂主政江苏（任江苏省政府主席）。1949年后赴台，脱离军职，转事文墨，以书法、诗词知名，享高寿。1988年去世于台北。"
 YUN_lu_han_desc:0 "卢汉（1895年—1974年），原名邦汉，云南昭通人，彝族，云南实力派首领龙云的表弟。滇军主要将领之一，长期在云南军政体系中居于核心地位，是龙云之下滇系军事力量的支柱。抗日战争爆发后率滇军出省作战，所部第六十军参加台儿庄、武汉等会战，滇军以装备较佳、作风顽强著称，伤亡惨重而声誉卓著。1945年蒋介石借机解除龙云职务，卢汉接任云南省政府主席，成为云南最高军政长官，但与中央矛盾渐深。1949年12月9日，卢汉在昆明率部通电起义，脱离国民政府，云南和平易帜，是国民政府西南统治崩解的关键一环。中华人民共和国成立后任西南军政委员会、国防委员会等职。1974年去世于北京。"
 YUN_hu_ruoyu_desc:0 "胡若愚（1895年—1960年代），云南罗平人。滇军将领，是唐继尧统治瓦解、云南军界群雄并起时期的主要人物之一。1911年10月参加云南重九起义。1914年入云南陆军讲武学堂将校班，毕业后，历任营长、团长、旅长、滇中镇守使、云南省政府主席、国民革命军第三十九军军长。1933年赴德国学习军事，七七事变后回国，历任第五战区代理参谋长、军委会总参谋部参议、兰州军官预备学校校长等职。抗战胜利后，胡若愚退役。1948年4月，他作为罗平县的国民大会代表，极力在云南代表中奔走活动，为李宗仁竞选副总统争取选票。辽沈、淮海、平津三大战役后，国民党的精锐部队被消灭殆尽，仍不断拼凑新兵团。1949年2月，第五十八军军长鲁道源升为第十一兵团司令，归华中“剿总”白崇禧指挥，鲁荐胡若愚为该兵团副司令。5月，人民解放军解放武汉，鲁兵团南逃衡阳。9月，白崇禧的桂系主力在衡宝战役中被歼，鲁兵团奉令改为左右两个纵队向广西撤退，鲁道源为右纵队司令，领兵三个师，继任第五十八军军长；鲁元为左纵队司令，领兵六个师。后鲁道源患病住院，胡若愚接任其职。10月中，广州解放，人民解放军疾速西进，围歼国民党军残部，桂系余部纷纷夺路南窜。11月下旬，胡若愚率部逃至桂东南的岑溪、容县一带，26日被人民解放军歼灭，胡若愚中弹身亡。"
 YUN_long_yun_desc:0 "龙云（1884年11月19日—1962年6月27日），谱名登云，字志舟，彝族，云南恩安（今昭通市昭阳区）炎山乡人，滇系军政首领，号称\"云南王\"。出身黑彝地主家庭，自幼习武，1911年投身滇军，1914年毕业于云南陆军讲武堂第四期骑兵科，入唐继尧部，逐步升至第五军军长兼滇中镇守使。1927年2月参与\"二六政变\"逼唐下野；同年6月在与胡若愚的权力争夺中被突袭囚禁，左眼中弹永久失明；8月脱困回昆明出任代理主席，历经近两年战斗肃清各方反对势力，1928年起正式出任云南省政府主席，主政云南近十八年。任内推行军政改革、兴建滇缅公路、扶持西南联大，抗战期间先后动员滇军二十余万赴前线，与南京中央维持合作与戒备并存的关系。1944年秘密加入中国民主同盟，暗中与中共及反蒋势力往来。1945年10月蒋介石令杜聿明部包围昆明，强行解除其武装，龙云被迫离滇，调任军事参议院院长虚职，从此与蒋彻底决裂。1948年末辗转出走香港，1949年8月发表声明宣布脱离国民政府。中华人民共和国成立后历任中央人民政府委员、国防委员会副主席、全国政协常委等职。1957年反右运动中被错划为\"右派\"，1962年6月27日在北京病逝，1980年获平反。"
 SHX_wang_zuanxu_desc:0 "王缵绪（1886年10月23日—1960年11月），字治易（一字紫泥），别号庢园居士，四川西充人，川军高级将领。行伍出身，长期隶属刘湘的川军系统，在四川军阀混战格局中据有一席之地，历任师长、军长。1938年刘湘病逝后，川军群龙无首，王缵绪一度出任四川省政府主席，但因施政与各方矛盾去职，旋率部出川，任集团军总司令，参加对日作战，转战多次会战。解放战争后期在四川参与起义。中华人民共和国成立后留居大陆，后因故被捕，1960年在狱中去世。"
 SHX_wang_jingguo_desc:0 "王靖国（1893年7月18日—1950年），字治安，山西五台人，晋绥军将领，阎锡山的同乡与亲信，是晋系军事集团的核心军官之一。长期在山西军政体系中带兵，参与中原大战等军阀混战，逐级升至军长、兵团司令。是阎锡山赖以控制山西的主要将领之一，部队驻守晋中要地。抗日战争期间随晋绥军在山西对日作战，亦经历晋系在日军、中央军、八路军之间的复杂周旋。抗战胜利后继续追随阎锡山据守山西。1949年太原战役中，王靖国是守城的主要指挥官之一，据守至太原城破被俘。被俘后关押，1950年病死于狱中。"
 SHX_yan_xishan_desc:0 "阎锡山（1883年10月8日—1960年5月23日），字百川（伯川），山西五台人，清末举人出身，留学日本陆军士官学校，同盟会员，晋系军阀首领。辛亥革命时在山西起义，此后长期经营山西，形成以太原为中心、独树一帜的地方军政体系，统治山西达三十余年。阎锡山以善于权变著称，重视地方工业（西北实业公司、兵工厂）、教育和军队建设，提出\"村本政治\"\"物产证券\"等独特主张，力图在中央政府、各地方实力派和日本压力之间保持山西的相对独立，时人讥其善\"在三个鸡蛋上跳舞\"。他一度与中共合作组织牺盟会、决死队抗日，后又与之冲突。抗战胜利后继续主政山西。1949年太原失守后赴南京，曾任行政院长兼国防部长，旋赴台湾，脱离实权，潜心著述。1960年去世于台北。"
 XSM_li_shiqun_desc:0 "李士群（1905年4月24日—1943年9月9日），浙江遂昌人。早年加入中国共产党并赴苏联学习，回国从事地下工作，后被捕叛变，转入国民党中统特务系统。抗战期间投靠日本，成为汪精卫政权的特务首脑，主持设在上海极司菲尔路76号的特工总部（\"76号\"），以绑架、暗杀、刑讯和策反对付军统、中统及各方抗日力量，四年间制造三千余次暗杀行动，是汪伪政权中最凶悍、最令人闻之色变的特务头目之一，手上沾满抗日志士鲜血。同时他又脚踏多方，暗通中共、包庇部分人员，官至汪伪江苏省政府主席，主持残酷的\"清乡\"。1943年，在日方猜忌与汪伪内部倾轧中，经周佛海等策划，被日本宪兵毒死。"
 XSM_wang_jingzhai_desc:0 "王静斋（1880年3月12日—1949年5月25日），原名文清，经名赛尔德·伊利亚斯，回族，天津人，中国近代著名伊斯兰教经学家、大阿訇、经学教育家，与马松亭、哈德成、达浦生并称中国现代\"四大阿訇\"。早年遍游各地清真寺求学讲学，后赴埃及爱资哈尔大学等地深造，精通阿拉伯文、波斯文，是近代中国伊斯兰学界学识最深的学者之一。毕生致力于《古兰经》的汉文翻译，先后完成文言、白话等多种译本（《古兰经译解》），并创办《伊光》等刊物，推动经堂教育与新式回民教育的结合，对中国伊斯兰教文化现代化贡献卓著。抗日战争期间，他积极宣传抗日，组织回民支持抗战，以宗教界领袖身份维护民族团结。1949年去世。"
 XSM_han_youwen_desc:0 "韩有文（1912年10月—1998年2月22日），原名热买赞，又名韩云卿，撒拉族，青海化隆甘都镇人，生于今甘肃甘南合作（父撒拉族、母藏族）。1929年被马步芳部抓充壮丁，取名韩有文，自此入青海马家军，由副官、卫士队长起家。1930年代中期升至上校，先后任西宁学生军训总队长、青海省会警察局局长、省保安处少将副处长等职。1945年升暂编骑兵第一师师长，随骑五军入新疆参与镇压三区革命；1947年北塔山事件中，所部击退越界的外蒙古（苏联支持）军队，受国民政府嘉奖。1949年9月，骑五军主官马呈祥弃军出走，他继任整编骑兵第一师师长，旋随新疆警备总司令陶峙岳通电和平起义，所部改编为解放军骑兵第七师，任师长。此后长期留居新疆，历任新疆军区副参谋长、农六师副师长、自治区政协副主席、民革新疆区委主委等职；1993年曾赴港会晤马步芳之子马继援。1998年卒。"
 XSM_ma_bufang_desc:0 "马步芳（1903年—1975年7月31日），字子香，经名胡赛尼，回族，甘肃河州（今临夏）人，西北马家军核心人物，马步青之弟。其家族（\"青海马\"）长期控制青海并染指甘、宁部分地区，依托宗教、部族、地方军队和南京政府的任命维持统治，是西北最具实力的地方军阀之一。马步芳统治青海期间横征暴敛、压迫民众，是典型的封建军阀。军事方面，一方面参与围堵红军——1936至1937年青马骑兵在河西走廊残酷围歼红军西路军，使西路军几乎全军覆没，手段极为凶狠；另一方面在中央与地方利益间保持自身实力。抗战期间派部出省作战。1949年任西北军政长官，兵败后逃往境外，先后流亡沙特等地，1975年去世于沙特。"
 XSM_ma_buqing_desc:0 "马步青（1901年—1977年2月9日），字子云，回族，甘肃临夏（河州）漠泥沟人，马步芳之兄，马家军重要将领，国民革命军陆军中将。相比政治野心更大、最终主政青海的弟弟马步芳，马步青长期以军事将领身份活跃于甘、青地区，依托家族武装和回族骑兵维持影响，曾长期统领骑兵第五师，驻防河西走廊一带。他参与过西北军阀混战，并在1936至1937年与马步芳部协同，参加对红军西路军的围攻作战，是青马军事体系中的重要人物。1949年马家军崩溃后赴台湾，1977年去世于台北。"
 XSM_ma_hongbin_desc:0 "马鸿宾（1884年9月14日—1960年10月21日），字子寅，回族，甘肃河州（今临夏）人，国民革命军陆军上将，西北马家军\"宁马\"一支的主要人物，与马步芳、马鸿逵合称\"西北三马\"。早年随父辈（其父马福禄、伯父马福祥）在甘、宁一带带兵，长期经营宁夏、甘肃地方军政，历任宁夏省、甘肃省主席及军职。与作风强横的堂弟马鸿逵相比，马鸿宾较为温和持重，在三马中以较开明、较少苛政著称。抗日战争期间，他率部（第八十一军）在绥西、宁夏一线参加对日伪作战，参与绥西抗战，态度相对积极，是宁夏地方军政中相对务实温和的一支。解放战争后期，西北马家军大势已去，1949年马鸿宾审时度势，率部接受中共和平改编，是三马中唯一主动转向、得以善终者。中华人民共和国成立后任甘肃省副省长、国防委员会委员等职。1960年去世。"
 XSM_ma_hongkui_desc:0 "马鸿逵（1892年3月9日—1970年1月14日），字少云，回族，甘肃河州（今临夏，一说生于兰州）人，宁夏马家军首领。其父马福祥为西北回族军政要人，马鸿逵继承家族政治资本，先依附冯玉祥，后投靠蒋介石，长期主政宁夏达十七年，集军政大权与党务于一身，被称为宁夏的\"土皇帝\"\"宁夏王\"。他依靠家族军队、地方财政、宗教关系和严密的社会控制维系统治，名义上接受南京国民政府节制，实际在宁夏拥有极高自主权。为政横征暴敛、兵役苛重，民众负担沉重。抗战期间所部参加绥西等地作战。解放战争中其部参加对解放军的顽抗，1949年兵败后逃往台湾、复转美国，1970年客死洛杉矶。"
 SIK_ishaq_musonov_desc:0 "伊斯哈克伯克·穆努诺夫（又译伊斯哈克江，1902年—1949年），柯尔克孜族，新疆乌恰人。新疆伊犁、阿勒泰一带亲苏少数民族武装的代表人物和军事领袖。1944年伊宁事变、三区革命（中共与中华民国史料分别称\"三区革命\"或\"伊宁事变\"，建立割据政权，是主要指挥者之一，长期统领亲苏的少数民族武装，背后有苏联支持。在新疆\"三区\"与盛世才/国民政府势力的对抗中扮演重要军事角色。1949年新疆和平解放前夕，他作为三区代表之一应邀赴北平参加中国人民政治协商会议，途中乘苏联飞机失事，在苏联境内遇难（与阿合买提江·哈斯木等三区主要领导人同机罹难）。"
 SIK_garegin_apresov_desc:0 "加列金·阿布拉莫维奇·阿普列索夫（Garegin Apresov，1893年—1939年前后），亚美尼亚人，苏联外交官、情报人员、共产国际代表。早年参与革命活动，后进入苏联外交系统，1930年代任苏联驻迪化（今乌鲁木齐）总领事，是苏联介入新疆事务的核心人物之一。在盛世才掌权、镇压马仲英势力以及确立新疆亲苏路线的过程中，阿普列索夫发挥了重要的幕后作用，代表莫斯科对新疆日益加深的政治、军事和经济控制。1937年前后他被召回苏联，在斯大林的\"大清洗\"中以莫须有罪名被处决；盛世才后来在转向反苏时，反诬其为英国间谍。"
 SIK_yol_bars_desc:0 "尧乐博斯（又译尧乐博斯·汗，绰号\"虎王\"，汉名黄景福，经名马木提·乌守尔，1889年—1971年），维吾尔族，新疆人，哈密回王王府的重要人物，人称\"尧乐大人\"。他长期辅佐哈密回王，1931年新疆省当局废除哈密王制、引发哈密暴动（这是新疆1930年代大动乱的导火索之一）后，成为新疆东部维吾尔上层势力的代表人物之一。在其后的新疆动乱中，他往来于地方势力、省政府与南京中央之间，立场倾向反苏、反共，是连接哈密地方、维吾尔上层与国民政府的关键人物。其后长期效忠国民政府，抗战及战后历任新疆相关军政职务，1949年前后曾任新疆省政府主席（短期）。新疆和平解放后，他率部抵抗，事败后辗转流亡台湾，1971年去世。"
 SIK_isa_yusuf_alptekin_desc:0 "艾沙·玉素甫·阿布甫泰肯（Isa Yusuf Alptekin，1901年—1995年），维吾尔族，新疆人，政治活动家。1930年代活动于南京，曾供职于国民政府机构（如立法院、边疆相关部门），同时是维吾尔民族主义的重要鼓吹者，主张新疆穆斯林的自治乃至独立。他善于在国民政府体制内借维吾尔民族议题获取支持，又与新疆境内外的民族主义势力保持联系。1949年新疆解放前后，他离开大陆，此后长期流亡海外（土耳其等地），成为鼓吹流亡运动的主要领袖人物之一。1995年去世于土耳其。"
 SIK_sa_zhenbing_desc:0 "萨镇冰（1859年3月30日—1952年4月10日），字鼎铭，福建福州（闽县）人，先世为元代色目人后裔（雁门萨氏），中国近代海军元老。毕业于福州船政学堂，1870年代赴英国格林尼治海军学院学习海军，是中国第一代留学西洋的海军军官。历经晚清、北洋、民国数代，清末统领海军，任海军提督、海军大臣（曾在甲午战后重建海军），民国后历任海军总长、福建省省长、代理国务总理等职，是横跨晚清与民国两代、资历最深的海军宿将之一。他以清廉自持、关心民生、热心公益著称，晚年长期居于福建，从事慈善与社会事业，声望极高，享年九十三岁。中华人民共和国成立后，他以九旬高龄出任中央人民政府委员、福建省人民政府委员等职，并写诗庆贺，是少数横跨清、民国、新中国三个时代的元勋。1952年去世。"
 MAN_ding_chao_desc:0 "丁超，字洁忱，奉天兴京（今辽宁新宾）人。清末优附生，毕业于日本陆军士官学校，归国后长期在奉系军中任军械、兵站、护路及镇守诸职，历任奉天军械厂厂长、滨江镇守使、护路军长绥司令等，1928年获陆军中将衔；1929年中东路事件中任东北边防军东路前敌总指挥，参与对苏作战。九一八事变后初期投身抗日：1932年1月与李杜等在哈尔滨组建吉林自卫军，任护路军总司令，参加哈尔滨保卫战，败后退守依兰；同年7月经南京国民政府任命为吉林省政府主席，9月参加吉黑联军反攻哈尔滨，失利后退入苏联境内。1933年归国即遭关东军逮捕，由满洲国军事法庭审判，临判前经溥仪特赦，遂转而附敌、加入满洲国，先后任伪通化省省长（1938）、安东省省长（1939）、参议府参议（1942）。"
 MAN_urzhin_garmaev_desc:0 "乌尔任·加尔马耶夫（Urzhin Garmaev，1888年—1947年），布里亚特蒙古人，原为俄国外贝加尔地区的白俄—蒙古武装军官。俄国内战中属白军一方，红军获胜后流亡至中国东北。伪满洲国成立后被日本任用，逐步升至伪满洲国军中将，长期统领以蒙古族、白俄为主的边境部队（兴安军系统），驻防伪满与外蒙古、苏联交界地带，并曾任兴安军官学校校长，是日本利用流亡民族武装在北满防范苏联、对抗外蒙的工具性人物。1939年诺门罕事件前后，处于日苏对抗的前沿。第二次世界大战末期，1945年8月苏军出兵中国东北，加尔马耶夫被苏军俘获，押往苏联，1947年以战争罪/反苏罪名被处决。"
 MAN_yu_zishan_desc:0 "于芷山（1882年—1951年5月），原名世文，字澜波，以号\"芷山\"行，奉天台安（今辽宁台安）人。奉系军人出身，早年在东北军中任职，长期统兵于辽东一带。九一八事变后，面对日本侵占东北，于芷山未予抵抗，率先投附日本，是最早附逆的东北军将领之一，成为伪满洲国的高级军事将领，历任伪满军政部大臣、军事顾问及\"讨伐\"司令等要职，长期统领伪军，多次参与对东北抗日联军等抗日武装的\"讨伐\"，镇压抗日力量，双手沾有抗日军民的鲜血。抗日战争胜利后，于芷山作为汉奸被国民政府逮捕审判，1951年（一说在押期间）病死。"
 MAN_kawashima_naniwa_desc:0 "川岛浪速（1865年—1949年），号风外，日本长野人，20世纪初活跃于中国的\"大陆浪人\"代表人物。早年来华，长期活动于中国东北与蒙古，通晓中文，是日本对华扩张的急先锋之一。他是\"满蒙独立运动\"的主要发起人，与清室宗社党人及和硕肃亲王善耆、喀喇沁王贡桑诺尔布等结交勾连，策划借旧满洲贵族复辟之名搞\"满蒙独立\"，企图将中国东北、内蒙古从中国分裂出去、纳入日本势力范围，两次\"满蒙独立运动\"皆有其身影。他收清肃亲王善耆之女为养女，施以军国主义教育，即后来著名的日本女间谍川岛芳子。其一生致力于策动分裂中国、服务日本侵略，是日本大陆浪人中危害深远的代表。1949年去世于日本。"
 MAN_yoshiko_kawashima_desc:0 "川岛芳子（1907年—1948年），爱新觉罗氏，原名显玗（亦作显㺭），字东珍，汉名金璧辉，满洲镶白旗人，清第十代和硕肃亲王善耆第十四女。辛亥革命后，其父善耆为图复辟，将她送给日本浪人川岛浪速收为养女，取名川岛芳子，自幼在日本接受军国主义教育。成年后以\"男装丽人\"形象从事情报活动，长期为日本侵华服务，活跃于满洲与上海，参与策动九一八事变、一二八事变及伪满洲国的建立，曾参与将清废帝溥仪之妻婉容秘密转移出天津等事件，并一度组织、指挥伪军（\"安国军\"）配合关东军行动，因其特殊身份与活动被称为\"东方的玛塔·哈丽\"。日本战败后，1947年10月经河北高等法院以汉奸罪判处死刑，1948年3月在北平执行枪决。"
 MAN_chu_kudo_desc:0 "工藤忠（工藤鉄三郎，1882年—1965年），日本青森人，伪满洲国皇帝溥仪身边的日籍侍卫长（近侍处长）。他早年即作为大陆浪人在中国东北活动，因机缘接近并效忠溥仪而被任用，长期负责溥仪的护卫与起居，是少数获得溥仪个人信任的日本人之一，溥仪在回忆中对其有特殊记述。在伪满洲国的权力结构中，溥仪虽为名义元首，实权却完全操于日本关东军之手；工藤忠这类贴身人物，处在傀儡皇帝与日方实际控制之间的微妙位置——他既受日方背景影响，又在一定程度上对溥仪个人表现出近乎\"愚忠\"的效忠，立场较为特殊，与一般为关东军监视溥仪的日籍官员有所不同。日本战败、伪满覆灭后回到日本，1965年去世。"
 MAN_zhang_jinghui_desc:0 "张景惠（1871年6月21日—1959年1月11日），字叙五，奉天台安（今辽宁台安）人，奉系旧人。出身草莽（早年以贩豆腐为生，有\"豆腐匠\"之称），追随张作霖起家，在奉系东北军政体系中长期任职，官至要位。九一八事变后，张景惠未能保全气节，转而参与伪满洲国政权的筹建，是伪满的元老级人物。1935年起出任伪满洲国国务总理大臣（第二任），名义上主持伪政府行政，实际上重大军政、外交、经济事务均受日本关东军操控，他不过是日本殖民统治下的高级行政代理人，负责维持伪政权日常运转、调和旧东北官僚与日本殖民机构之间的关系。日本战败后，张景惠被苏军俘虏并引渡，关押于抚顺战犯管理所，1959年病死狱中。"
 MAN_zhang_haipeng_desc:0 "张海鹏（1867年—1951年），字仙涛，奉天盖平（今辽宁盖州）人，奉系元老、伪满洲国将领、汉奸。早年为马贼，后投奉系，1910年与张作霖结为金兰，渐升至旅长、护路军总司令；1927年任洮辽（洮南）镇守使兼东北骑兵第32师师长，1931年曾奉张学良之命镇压内蒙古嘎达梅林起义。九一八事变后，他因向张学良谋求黑龙江省主席未遂，转而在日军唆使下于洮南宣布独立、自任伪\"边境保安司令\"，是最早公开附逆的东北军将领之一。1931年10月，受关东军军械接济，派部下徐景隆率三个团沿洮昂铁路进攻嫩江桥；黑龙江守军愤而自炸江桥，徐景隆被当场炸死，所部溃散反正——此役直接挑起马占山领导的江桥抗战，张海鹏沦为日军侵占北满的马前卒。伪满成立后，其部编为洮辽警备军，他历任参议府参议、执政府侍从武官长（1932年授陆军上将），1933年热河沦陷后又任热河警备司令。1951年被中华人民共和国以叛国罪处决。"
 MAN_zhang_yanqing_desc:0 "张燕卿（1898—1969），字耐甫，直隶省南皮县人，晚清重臣张之洞之子，中华民国及满洲国政治人物。早年毕业于青岛特别高等学校，后赴日入学习院文科，1920年毕业。回国后历任奉天省复县知事、直隶省正定县知事、天津县知事、天津市特别区市政管理局局长及直隶省石门警察厅厅长等职。1927年转任交通部参事及东北边防军驻吉林副司令官公署秘书。九一八事变前后，历任长春市政筹备处处长、吉林省实业厅厅长，随即投身满洲国建国活动。1932年2月以熙洽代理人身份出席建国最高会议，强力主张帝制，与臧式毅发生对立。满洲国成立后任执政府内务官兼实业部总长，继任大臣，7月兼任协和会理事长。1935年出任外交大臣，1937年辞职，转而筹建新民会，任副会长。张作为名臣之后却甘附日伪，是清末官宦子弟在民族危亡中堕落为汉奸的典型。战后流亡日本，受黑龙会要人庇护，1965年任亚东工商协会干事，1969年在东京逝世，享年七十一岁。"
 MAN_li_zhaolin_desc:0 "李兆麟（1910年11月2日—1946年3月9日），原名李超兰，曾用名张寿篯等，汉族，辽宁辽阳人，中国共产党东北抗日武装的杰出领导人、著名抗日民族英雄。九一八事变后，他毅然投身抗日救亡，加入中国共产党，参与组织和领导东北抗日义勇军、东北人民革命军，是东北抗日联军的创建人和主要领导人之一，曾任东北抗日联军第三路军总指挥。在日伪残酷\"讨伐\"和极端严寒、缺粮的绝境中，他率部长期在北满林海雪原坚持艰苦卓绝的游击战争，历尽常人难以想象的牺牲，并参与创作了在抗联中广为传唱、激励士气的《露营之歌》（\"火烤胸前暖，风吹背后寒\"）。在1936/1939设定时点，他正是北满抗联浴血抗战的中坚领袖，与其余附逆人物形成鲜明对照。抗日战争胜利后，他在哈尔滨从事接收、统战和中苏友好工作，任滨江省政府副主席等职。1946年3月9日，在国共斗争的复杂局势中，李兆麟被国民党特务诱杀于哈尔滨，年仅三十五岁，壮烈牺牲。哈尔滨建有兆麟公园、以其名纪念。是东北抗战史上彪炳千秋的英雄。"
 MAN_li_shaogeng_desc:0 "李绍庚（1896年—1949年），奉天辽阳（今辽宁辽阳）人，民国时期东北政客、外交官。早年活动于东北政界、外交界，具有一定的对外交涉经历。九一八事变后，李绍庚附逆，伪满洲国成立后跻身伪政权上层，历任伪满交通部大臣、驻日\"大使\"等要职，是伪满官僚与对日\"外交\"中的角色之一，参与维持伪满与日本之间的\"邦交\"门面。日本战败、伪满覆灭后，他作为汉奸被处置。"
 MAN_jonjurjab_desc:0 "正珠尔扎布（1906年—1967年11月），汉名韩信宝、韩绍德，日本名川岛成信、田中正，蒙古族，卓索图盟土默特左旗人，生于苏鲁克（今辽宁省彰武县）。其父巴布扎布为满蒙独立运动领袖，1916年举兵战死。父亲死后，正珠尔扎布被送往旅顺入日本小学，接受蒙古独立教育；1922年赴日就读东京府立第六中学，后入陆军士官学校炮兵科，1928年毕业。此后在南满铁路郑家屯公所任职，深研蒙古事务。九一八事变后协助其兄甘珠尔扎布筹组蒙古独立军，任联络处长，满洲国建立后历任兴安军管区参谋处长、骑兵上校、第10军管区少将参谋长等职，驻扎海拉尔。1939年诺门罕战役中立功获勋。1945年8月苏联对日宣战后，正珠尔扎布与司令官郭文林策划发动锡尼河事件，击杀日本军官29人，率约两千名官兵向苏联红军投降。此后被苏联羁押于哈巴罗夫斯克，1950年移交中华人民共和国，入抚顺战犯管理所改造，1960年获特赦，安置于海拉尔国营林场。1967年11月在林场菜园内自缢身亡。"
 MAN_pujie_desc:0 "溥杰（1907年—1994年），爱新觉罗氏，字俊之，号秉藩，清逊帝溥仪的胞弟。出身清皇室，自幼受传统教育，后赴日本学习军事，毕业于日本陆军士官学校。在日本的精心安排下，他与日本华族嵯峨家之女嵯峨浩（浩）联姻，这桩\"日满联姻\"是日本笼络满洲皇族、企图以血缘渗透稳固伪满统治、甚至为皇位继承预作布置的重要一环。伪满洲国时期，溥杰任伪满军职（宫内府、禁卫部队等），地位特殊却同样无实权，处于日本操控之下。日本战败后，溥杰随溥仪一同被苏军俘虏，后引渡回国，在抚顺战犯管理所长期接受关押改造。获特赦后，他在中华人民共和国从事文史、书法工作，曾任全国人大常委会委员等职，晚年致力于中日友好，1994年去世。"
 MAN_aisin_gioro_puyi_desc:0 "爱新觉罗·溥仪（1906年—1967年），清朝末代皇帝（宣统帝），中国历史上最后一位皇帝。1908年即位，辛亥革命后于1912年退位，1917年曾在张勋拥戴下短暂复辟。九一八事变后，日本关东军为掩护对中国东北的殖民统治，将其从天津诱至东北，1932年扶植其为伪满洲国\"执政\"，1934年又导演其\"称帝\"，年号康德。溥仪虽保留满洲皇帝的象征名号，却毫无真正独立的政治与军事权力，伪满的军政、经济、外交、安全体系均牢牢掌握在日本关东军手中，他不过是日本殖民统治的政治傀儡，并因复辟旧业的执念而甘附日本、出卖民族利益。日本战败后，溥仪被苏军俘虏，曾出席远东国际军事法庭作证，后引渡回国，在抚顺战犯管理所接受改造。1959年获特赦，成为中华人民共和国公民，从事文史工作，著有自传《我的前半生》。1967年去世于北京。"
 MAN_aisin_gioro_xiqia_desc:0 "熙洽（1884年10月18日—1950年），爱新觉罗氏，满洲正蓝旗人，清宗室。早年留学日本陆军士官学校，怀有强烈的满洲复辟意识。九一八事变时任吉林军政要职（吉林军署参谋长等），事变爆发后，他公开背叛中国，率先归附日本，主动献出吉林，引日军入城，是伪满洲国最早的策划者与缔造者之一，对东北沦陷负有直接责任。伪满成立后历任财政部大臣、宫内府大臣等要职，始终主张借日本之力复辟满洲\"旧业\"。熙洽将清室复辟的迷梦寄托于日本侵略者，最终沦为殖民统治的附庸与帮凶，是满洲宗室中投日附逆最早、最典型者之一。日本战败后，他被苏军俘获，关押期间于1950年卒。"
 MAN_kanjurjab_desc:0 "甘珠尔扎布（1903年7月17日—1970年），蒙古族， 又名韩绍约、川岛隆良， 辽宁彰武人。1903年生于锦州市东吐默特旗玛拉嘎塔村中农家庭。同年搬到辽西省彰武县大冷营子居住，1911年入彰武县大庙私塾读汉书一年。1933年3月，充任兴安南分省达尔罕警察局长（共三年，驻郑家屯、王爷庙）。1936年3月，充任兴安南省警务厅长（驻王爷庙）。1937年3月任伪满兴安南省民政厅长。1938年5月出任伪满兴安军管区少将司令部附。同年6月，改任兴安南地区少将司令，组织甘支队，兼队长，赴华北热河冀东作战。1939年3月调任伪满兴安南警备军少将司令官。1940年至1943年3月任伪满兴安陆军学院校长。1943年3月任伪满第九军管区少将司令官。同年10月晋升中将。1945年8月26日在内蒙古里黑吐车站被出兵东北的苏军捕获。"
 MAN_zhang_shiyi_desc:0 "臧式毅（1884年10月—1956年11月13日），字奉久，奉天沈阳（今辽宁沈阳）人，奉系文官出身。早年留学日本，长于行政，是奉系少有的文职大员，九一八事变前任辽宁省政府主席。事变中被日军扣押，几经胁迫、软硬兼施后投附日本，成为伪满洲国最重要的文职附逆人物之一，历任伪满民政部大臣、奉天省长、参议府议长等要职，名列伪满\"四巨头\"之一，但实权仍受制于关东军，不过是殖民统治下的高级文官。日本战败后，臧式毅被苏军俘虏，后引渡回国关押，1956年病死于抚顺战犯管理所。"
 MAN_yuan_jinkai_desc:0 "袁金铠（1870年—1947年3月），字洁珊，又字兆傭，晚号傭庐，奉天辽阳（今辽宁辽阳）人，清末民初东北的资深政客、地方士绅型官僚的代表。清末以举贡出身参与地方政事，长期在奉系军政体系中参与省议会与行政事务，是张作霖时代东北政界的元老级人物，在地方士绅与官僚中人脉深厚。九一八事变后，年事已高的袁金铠参与伪满洲国的筹建，跻身伪政权上层（任参议府参议、副议长等），以其资历、声望与地方人脉为日本的殖民统治装点门面、笼络旧东北士绅。1947年卒。"
 MAN_xie_jieshi_desc:0 "谢介石（1878年—1954年），名恺，字又安（幼安），台湾新竹人，是台湾人在伪满洲国期间获得最高官衔者。早年在台湾、大陆两岸游历，曾追随张勋（任其幕僚，参与1917年复辟），后辗转进入东北政界，与溥仪一系渊源颇深。伪满洲国成立后，他出任首任外交部总长（外交部大臣），又任伪满驻日本\"大使\"，是伪满政权中少见的台湾出身的高级官员，长期主持伪满的对外事务与对日\"邦交\"。1937年以后，谢介石出任伪满洲国国营事业董事长。日本投降后，伪满洲国瓦解，谢介石也被逮捕关押在北平，但在1949年后被释放，并居住在沈阳，1954年病逝于北京。"
 CBIO_MAN_ma_zhanshan_desc:0 "马占山（1885年11月30日—1950年11月29日），字秀芳，祖籍河北丰润，生于吉林怀德，国民革命军陆军上将，著名东北抗日名将。出身绿林，后受招抚发迹于奉军，成长为东北军骑兵将领。1931年九一八事变后，他临危受命代理黑龙江省政府主席兼军事总指挥，面对日军进逼，毅然率部在嫩江江桥一线奋起抵抗，血战江桥，打响了中国军队有组织武装抗日的第一枪，震动全国，成为举国敬仰的抗日英雄，极大鼓舞了民族抗战的信心。在敌强我弱、孤立无援的形势下，他一度被迫\"诈降\"、参与伪满（任伪职），获得喘息、保存实力后于1932年再度反正，重举抗日旗帜，率部继续抗战，几经依违于抗日与周旋之间，但民族大节终归抗日阵营。抗战期间任东北挺进军总司令等职，坚持敌后抗战。解放战争末期，他参与北平和平解放。1950年病逝于北京。"
 MAN_nakajima_kesago_desc:0 "中岛今朝吾（1881年—1945年），日本大分县人，日本陆军中将，侵华战争中的重要军事指挥官、南京大屠杀的主要罪责者之一。陆军士官学校、陆军大学出身，长期在日本陆军及宪兵系统任职。1937年全面侵华战争爆发后，他任日本陆军第十六师团师团长，率部参加华北、淞沪及进攻南京的作战。1937年12月南京沦陷后，其麾下第十六师团是制造南京大屠杀的主力部队之一，对南京军民进行了大规模屠杀、抢掠和暴行，中岛本人作为师团长负有不可推卸的直接指挥责任，其日记亦记载了部队的暴行，是研究南京大屠杀的重要罪证。其后曾任第四军司令官等职。1945年日本战败前后病死，未及受到战争罪审判。"
 MAN_kyoiji_tomonaga_desc:0 "富永恭次（1892年—1960年），日本长崎人，日本陆军中将，日本军国主义少壮派军官的代表之一。陆军士官学校、陆军大学出身，1930年代曾在关东军任参谋（任作战、情报相关职务），深度参与策划侵华与对满蒙的军事扩张行动，是关东军中推动对华侵略的强硬派人物。其性格强硬、行事专断跋扈，在日本陆军内部颇具争议。在东北期间，他是关东军侵华扩张政策的重要执行者之一。其后历任陆军省人事局长等要职，权倾一时。太平洋战争期间任第四航空军司令官，驻菲律宾。1945年初，美军反攻菲律宾，富永恭次竟擅自丢下部队、逃离战场（飞往台湾），导致前线崩溃，因此严重失职行为而备受日本军内外批评，被解职。战后未受重大追究，1960年卒。"
 MEN_yondonwangchug_desc:0 "云端旺楚克（1871年—1938年3月24日），字吉农，人称云王，蒙古族，内蒙古乌兰察布盟喀尔喀右翼旗（达尔罕旗，今达尔罕茂明安联合旗）人，札萨克达尔罕亲王。1890年袭札萨克达尔罕贝勒，民国初晋郡王、亲王，长期任乌兰察布盟盟长，是内蒙古旧王公中辈分甚高的元老。1933年7月，他与锡林郭勒盟的德王（德穆楚克栋鲁普）在其辖境百灵庙主持内蒙古自治会议，发起\"高度自治\"运动；1934年4月经南京批准成立蒙古地方自治政务委员会（蒙政会），云王任委员长，为运动名义上的最高领袖，惟实权操于秘书长德王之手。1935年又被任为国民政府委员。其后德王渐次倒向日本，1936年日方扶植成立伪\"蒙古军政府\"、1937年10月改组为伪\"蒙古联盟自治政府\"，云王均被奉为名义主席，德王任副而实际主导。1938年3月病逝，终年六十八岁，德王旋即继任主席。"
 MEN_jodbajab_desc:0 "卓特巴扎普（1877年－1947年），内蒙古明安旗人，蒙古族，民国陆军中将。曾任察哈尔盟盟长、伪蒙疆联合自治政府政务院院长等职。1877年生于察哈尔正白羊群总管桑日布家，9岁习满、蒙文，16岁任苏鲁克长，20岁任正白牛群副总管。1900年因进贡受清政府赏识，升任苏鲁克及达里岗嘎五旗总管。1912年奉命率保安团赴库伦被俘，1916年补授陆军中将。1917年任蒙藏院副院长，1922年回任明安旗总管。1933年参与德王发动的蒙古“自治运动”，1936年任伪察哈尔盟盟长兼蒙军副司令。1939年任伪蒙疆联合自治政府政务院院长，1942年改任伪参议府议长。1945年被苏联红军逮捕，1947年去世。"
 MEN_prince_demchugdongrub_desc:0 "德穆楚克栋鲁普（1902年—1966年），简称德王，字希贤，内蒙古锡林郭勒盟苏尼特右旗札萨克郡王，蒙古族，曾任锡林郭勒盟盟长。出身蒙古贵族，受过较好教育，早年即怀抱\"泛蒙古主义\"理想，长期领导内蒙古自治和独立运动，试图在南京政府、日本势力和蒙古民族政治之间为蒙古（及自身权位）寻找空间。1930年代日本加紧经营华北和内蒙古，德王逐渐转向与日本驻蒙军合作，成为日本扶植下蒙古自治运动的核心人物，先后组建蒙古军政府，并在日本占领的察哈尔、绥远等地建立\"蒙疆联合自治政府\"并任要职，实际充当日本分裂中国、利用边疆民族瓦解华北秩序的重要棋子。日本投降后转投国民党，第二次国共内战中又组织蒙古自治政府，失败后逃往蒙古人民共和国，被遣返中国。中华人民共和国将其作为蒙疆首要战犯审判，1963年特赦，1966年去世。"
 MEN_wang_ying_desc:0 "王英（1898年—1950年），绥远（一说陕西/内蒙古）人，著名伪军头目，所部号称\"大汉义军\"。早年为西北土匪、民团武装出身，长期在绥远、内蒙古一带从事土匪、杂牌武装活动，后投靠日本。1936年绥远抗战中，他在日本特务机关与德王的支持、资助下，纠集这支由土匪、散兵拼凑而成的武装（\"大汉义军\"），配合伪蒙军进犯绥远，结果在红格尔图、百灵庙一线被傅作义指挥的晋绥军坚决反击、一举击溃，成为绥远抗战中被歼的主要伪军头目之一，其惨败极大鼓舞了全国抗战士气。王英的部队战力低下、纪律败坏，纯为日本侵略的工具。其后他继续从事附敌活动。抗日战争胜利后，王英作为汉奸被国民政府逮捕，1950年代初被处决。"
 CBIO_MEN_serendongrub_desc:0 "色楞栋鲁布（1894年2月17日—1980年8月2日），汉名白云梯，字巨川，蒙古族，内蒙古卓索图盟喀喇沁中旗（今赤峰宁城）人，中华民国蒙古族政治人物。早年就读于北京蒙藏学校，1919年加入中国国民党，任内蒙古党务特派员，1924年出席国民党一大、当选候补中央执行委员，是较早投身国民革命的内蒙古知识分子。1925年10月内蒙古人民革命党（内人党）在张家口成立，他出任首任中央执行委员会委员长——该党由共产国际、外蒙古人民党与国共合力促成，主张废除王公札萨克制、推行民族民主革命。其后他与共产国际及党内激进派矛盾激化：1927年乌兰巴托特别会议上被撤去委员长；同年9月返宁夏后发表《内蒙古国民党反共宣言》，公开反苏反共、通缉中共党员，并杀害中共党员李裕智，将所部右翼改组为国民党内蒙古党部，转投南京。此后长期在国民政府任职，历任国民政府委员、蒙古地方自治政务委员会委员，1947—1948年任蒙藏委员会副委员长、委员长，是国民党倚重的\"亲南京蒙古\"代表。1949年赴台，任\"总统府国策顾问\"等职，1980年卒于台北。"
 MEN_li_shouxin_desc:0 "李守信（1892年—1970年），蒙古族，内蒙古卓索图盟土默特旗人。早年为东北军骑兵军官，行伍出身，作战经验丰富。九一八事变后投靠日本，成为日本在内蒙古扶植蒙古武装的主要军事代理人和最重要的蒙古族军事首领。他与德王长期合作，是蒙疆亲日政权的军事支柱：1936年前后参与组建察哈尔盟公署、蒙古军政府等亲日政权，统领蒙古伪军（蒙古军），其部队配合日军进行军事扩张与\"治安\"作战，与中央军、晋绥军对抗，参与了进犯绥远等行动。日本投降后他随德王转投国民党，国共内战中继续参与蒙古自治活动，失败后一度逃往蒙古人民共和国，被遣返中国，作为战犯受审。1964年特赦，1970年去世。"
 TIB_reting_rimpoche_desc:0 "五世热振活佛（热振·土登降白益西丹巴坚赞，1912—1947年），藏族，出生于西藏加查县若美村，第五世热振呼图克图。被认定为四世热振活佛转世灵童，入色拉寺学习五部大论，1931年考取格鲁派最高学位“拉让巴格西”。1934年经国民政府批准出任西藏摄政，获授“辅国宏化禅师”封号，1940年被授予“摄政经师热振阿齐图慧云呼图克图”金印。任内强化与中央政府联系，反对英国在拉萨建立办事处、医院及学校，回绝英方领土要求。抗战期间组织三大寺僧人诵经祈福中国胜利，支持蒙藏委员会驻拉萨办事处设立，推动寻访十三世达赖转世灵童并报中央批准。1940年因亲英势力施压暂辞摄政，由达扎代理。1947年4月遭藏军逮捕，同年5月7日被秘密毒死于布达拉宫监狱"
 TIB_khemey_sonam_wangdi_desc:0 "凯墨·索南旺堆（1900年—1976年，藏族，西藏拉萨人，噶厦官员兼藏军将领。出身拉萨贵族，历经十三世达赖与热振摄政两朝，职阶持续上升：十三世达赖时期任噶厦色朗巴、噶谆，藏军二代本、当巴；热振摄政时期升任噶厦扎萨（四品俗官）、仔康（财政局）总管。1946年以藏方代表身分出席南京制宪国民大会，参与中华民国宪政程序。1947年升任藏军马基（司令），为西藏军政核心人物。1951年昌都失守后，受噶厦委派，以藏军司令身分取道亚东、印度、香港赴北京，作为西藏五名全权代表之一参与和平谈判，签署《十七条协议》。中华人民共和国成立后，1956年任西藏自治区筹备委员会委员，同年3月12日被授予解放军少将军衔。1959年藏局骤变，随达赖喇嘛离藏出走印度，此后流亡海外至终。"
 TIB_lhalu_tsewang_dorje_desc:0 "拉鲁·才旺多吉（次旺多吉，1914年—2011年），藏族，西藏大贵族拉鲁家族继承人，西藏改革派官员龙厦·多吉次杰之子。其父龙厦曾推动西藏政治改革，1934年改革失败、遭受酷刑（被挖目）失势后，才旺多吉承袭拉鲁家业（因家族继承的特殊安排，他兼祧拉鲁、龙厦两家），逐步进入西藏权力上层，官至噶厦的噶伦（大臣），并一度出任昌都总管（朵麦基巧），主持康区（昌都）防务。1950年昌都战役中，他任昌都总管负责康区防务。西藏和平解放后，拉鲁·才旺多吉留在西藏，1959年西藏上层部分人发动叛乱期间曾有牵涉、一度被关押改造，后获释，转而拥护中央，长期担任西藏自治区政协副主席等职，2011年去世。"
 TIB_tsarong_dzasa_desc:0 "擦绒·达桑占堆（1888年—1959年），藏族，西藏彭波人，出身平民，是近代西藏最具传奇色彩的人物之一。因机敏勇武得十三世达赖喇嘛赏识，在1910年达赖出走印度等事件中护驾有功，由平民骤然显贵，入赘西藏望族擦绒家族，承袭其名号。1910至1920年代，他长期统领西藏军队，官至藏军总司令（马基），力主仿效英印军队整军经武、推行军事与社会近代化（练新军、办兵工、修电厂等），是近代西藏改革派的代表人物。然而其军权过盛、改革触动僧俗上层利益，遭到保守势力猜忌，于1920年代中期被十三世达赖解除兵权，转而执掌造币厂、财政等事务（任孜本等职）。其家族与英印关系密切。西藏和平解放后，擦绒留在拉萨。1959年西藏叛乱期间，他被卷入并被关押，同年死于狱中。"
 TIB_sampo_tsewang_rigzin_desc:0 "桑颇·才旺仁增（1904年—1973年6月），藏族，西藏拉萨人，噶厦俗官、藏军将领，出身西藏最显赫的贵族家族之一。桑颇家族为第七世达赖喇嘛的尧西家族，世袭台吉爵位，由雍正帝封为辅国公一脉延续至清末民国。他自1919年步入仕途，经十三世达赖与热振摄政两朝，历任色朗巴、台吉、雪巴、甲查列空多当巴（盐茶局总管）、扎萨、扎期列空多当巴（造币厂总管）等职，是噶厦体制内逐级升迁的典型贵族俗官。1947年曾作为西藏代表赴印度德里出席泛亚洲会议。中华人民共和国成立后持续任职：1956年任西藏自治区筹备委员会常务委员，1957年出任噶厦最高职衔噶伦，1958年兼任西藏军区副司令员及藏军马基（总司令），随即被授予解放军少将军衔。1959年3月10日拉萨局势骤变，他乘车前往罗布林卡途中遭聚集人群以石块袭击，头破血流，幸得司机及时驾车离开；他事后以\"宝贝石头\"称此块石头，视之为自己政治立场的见证。3月28日，他在西藏军区反对武装叛乱宣言上签字。此后任西藏自治区政协副主席、国防委员会委员。文化大革命中以\"参与叛乱\"嫌疑被撤职批斗，1973年在拉萨去世。1979年中共中央、中央军委批准为其平反。"
 TIB_taktra_rinpoche_desc:0 "达扎·仁波切（达扎·阿旺松绕图布丹，1874年—1952年），藏传佛教格鲁派活佛，第三世达扎仁波切，驻锡拉萨东北的达扎寺（Taktra monastery）。作为清朝和民国历代有资格出任西藏摄政的活佛之一，他是前任摄政五世热振活佛的经师（上师）。1941年，五世热振以\"年迈多病\"为由让位，达扎仁波切继任西藏摄政（第五任摄政），主持西藏政教大权，至1950年前后。其执政风格以保守、维护旧有政教制度著称，对外倾向英国方向，对内强化传统格鲁派权威。他与前任摄政热振之间存在深刻矛盾：1947年\"热振事件\"中，达扎一派以叛乱之名逮捕热振活佛，热振随后死于拉萨布达拉宫狱中，达扎派被认为是此事的主导方。中华人民共和国成立、西藏和平解放（1951年）后，达扎逐渐淡出政治，1952年卒。"
 TIB_jigme_taring_desc:0 "达林晋美（1908年—1985年前后），藏名仁增旺堆，英文名 Jigme Taring，藏族，西藏达林（塔林）家族成员，与擦绒家族有联姻关系。他早年在印度大吉岭接受英式教育，通晓英文，是旧西藏贵族中极少数受过正式教育者之一，在西藏与英印当局的往来中多次充任通译与联络人。达林晋美活跃于拉萨上层社会，娶拉萨有名的才旺多吉（Mary Taring，其妻后著有回忆录《我的西藏》）为妻。与英印高层（如政务官黎吉生等）私交甚笃。西藏和平解放后，他与妻子流亡海外（印度大吉岭）。"
 MON_dansrabilegyin_dogsam_desc:0 "丹斯兰比勒格·道格松，1884年—1941年7月27日；又译\"道格萨姆\"），蒙古族，外蒙古车臣汗部中右后旗（今蒙古国肯特省巴彦敖包县）人，蒙古人民革命党创党元老、政治家。早年在所在部旗任书记官，1915年以书记官身分参与《中俄蒙协约》谈判，由此踏入近代蒙古政治。1918年加入争取蒙古独立的秘密革命组织，1919年参与博克多汗政府以对抗北洋政府对外蒙古的占领。1920年，他作为蒙古人民党赴苏代表团\"最初七人\"之一，与苏赫-巴托尔、乔巴山、鲍道等人一同赴苏维埃俄国寻求支援，是外蒙古独立革命的奠基人群体成员。1921年革命成功后历任内务部官员、国防部登记司行政官员、科布多省政府驻代等职；1926至1927年出任蒙古首任驻苏联大使；1932年8月至1933年6月任乌兰巴托市长；随后担任蒙古驻图瓦大使；1936至1939年出任国家小呼拉尔（议会）主席团主席，为蒙古人民共和国名义最高国家领导人。1939年7月9日在大镇压（1937—1939年斯大林指导下的政治清洗）中被捕，次年由苏联当局宣判，1941年7月27日被处决。1967年1月25日，平反委员会宣布为其平反，恢复蒙古人民革命党党籍。"
 MON_yundunwangcug_desc:0 "云端旺楚克（1871年—1938年3月24日），字吉农，人称云王，蒙古族，内蒙古乌兰察布盟喀尔喀右翼旗（达尔罕旗，今达尔罕茂明安联合旗）人，札萨克达尔罕亲王。1890年袭札萨克达尔罕贝勒，民国初晋郡王、亲王，长期任乌兰察布盟盟长，是内蒙古旧王公中辈分甚高的元老。1933年7月，他与锡林郭勒盟的德王（德穆楚克栋鲁普）在其辖境百灵庙主持内蒙古自治会议，发起\"高度自治\"运动；1934年4月经南京批准成立蒙古地方自治政务委员会（蒙政会），云王任委员长，为运动名义上的最高领袖，惟实权操于秘书长德王之手。1935年又被任为国民政府委员。其后德王渐次倒向日本，1936年日方扶植成立伪\"蒙古军政府\"、1937年10月改组为伪\"蒙古联盟自治政府\"，云王均被奉为名义主席，德王任副而实际主导。1938年3月病逝，终年六十八岁，德王旋即继任主席。"
 MON_gomgchigryn_bumtsend_desc:0 "冈奇金·布曼增迪（蒙古语：Гончигийн Бумцэнд，1881—1953），蒙古人民共和国政治家，蒙古人民军创始人之一。生于外蒙古土谢图汗部一个贫苦牧民家庭，十三岁自学读写，替旗内不识字的人们代写书信；十六岁已是一名熟练木工，后改在恰克图至库伦的驿站以车夫为业，并赴库伦打工数年。1920年结识蒙古人民党革命者，为其筹办冬衣、开展宣传活动。1921年与苏赫-巴托尔相识后出任部队指挥，参与攻取买卖城、驱逐中华民国驻军及恩琴白军的战役，并率部深入东蒙平叛，擒获叛军多名首领。1923年正式入党，此后长期主持农村革命行政，清算封建旧贵族、驱逐外国商人势力。1940年出任国家小呼拉尔主席团主席，1951年升任大人民呼拉尔主席团主席，实际担任蒙古国家元首职务逾十三年，1953年9月在任内逝世，终年七十二岁。"
 MON_buyannmeh_desc:0 "布彦梅赫（Buyannemekh，1902年9月15日—1937年），本名索德诺姆巴勒吉尔·布彦梅赫（Сономбалжирын Буяннэмэх），蒙古族，生于图谢特汗省戈壁图谢古公旗（今蒙古国中戈壁省德勒格尔汗嘎苏姆），蒙古人民共和国诗人、剧作家、小说家、文学理论家与新闻记者，蒙古现代文学奠基人之一。早年参与革命活动，1921年在伊尔库茨克协助创办蒙古第一份革命报纸《蒙古真理报》，同年出席第一次大呼拉尔并当选文联中央委员会主席，并赴莫斯科出席东方劳动者大会、与列宁会面。此后长期投身文学与戏剧创作：写下蒙古语现代剧本先驱《桑多大臣》（1922年）、历史剧《英雄少年铁木真》（1923年）等逾二十部剧作，另有百余首诗歌、数十篇小说与散文，以及《文学之门》（1935年）等文学理论著作；并创办作家协会、组织文学圈活动，向年轻作者传授写作方法，是1930年代蒙古国立剧院的核心创作力量之一。1935年经国家小呼拉尔主席团与人民委员会联席会议决议，获授\"国家功勋文学家\"称号，为蒙古国家最高文学荣誉。1937年以\"参与根登（前总理）反革命集团\"为罪名被捕，内务部特别委员会同年10月25日裁定死刑；据载或死于羁押中而非枪决。1962年被宣布与政治案件无关，予以平反昭雪。"
 MON_pai_yun_ti_desc:0 "色楞栋鲁布（1894年2月17日—1980年8月2日），汉名白云梯，字巨川，蒙古族，内蒙古卓索图盟喀喇沁中旗（今赤峰宁城）人，中华民国蒙古族政治人物。早年就读于北京蒙藏学校，1919年加入中国国民党，任内蒙古党务特派员，1924年出席国民党一大、当选候补中央执行委员，是较早投身国民革命的内蒙古知识分子。1925年10月内蒙古人民革命党（内人党）在张家口成立，他出任首任中央执行委员会委员长——该党由共产国际、外蒙古人民党与国共合力促成，主张废除王公札萨克制、推行民族民主革命。其后他与共产国际及党内激进派矛盾激化：1927年乌兰巴托特别会议上被撤去委员长；同年9月返宁夏后发表《内蒙古国民党反共宣言》，公开反苏反共、通缉中共党员，并杀害中共党员李裕智，将所部右翼改组为国民党内蒙古党部，转投南京。此后长期在国民政府任职，历任国民政府委员、蒙古地方自治政务委员会委员，1947—1948年任蒙藏委员会副委员长、委员长，是国民党倚重的\"亲南京蒙古\"代表。1949年赴台，任\"总统府国策顾问\"等职，1980年卒于台北。"
 MON_sukhbaataryn_yanjmaa_desc:0 "苏赫巴托尔·彦吉玛（Sükhbaataryn Yanjmaa，1893年—1962年），蒙古族，蒙古人民革命英雄、国父苏赫巴托尔的妻子，是蒙古人民共和国少有的女性高级政治领导人。早年与丈夫一同投身1921年蒙古革命，苏赫巴托尔1923年英年早逝后，她以革命英雄遗孀与坚定的党员身份继续在蒙古人民革命党与政府中活跃，长期从事妇女工作、宣传工作与党务，进入党的中央领导层。在大清洗的严酷年代，她凭借其特殊的政治身份与谨慎的处世，得以幸存于政治变局。她在蒙古亲苏政权中具有突出的象征意义。1953年乔巴山去世后，政治格局重组，彦吉玛于1953—1954年担任国家大呼拉尔主席团主席（国家元首），成为蒙古人民共和国历史上迄今唯一一位女性国家元首，也是当时国际社会公认国家中极少数女性元首之一，具有历史里程碑意义。1962年去世。"
 MON_anandyn_amar_desc:0 "阿南德·阿玛尔（Anandyn Amar，1886年—1941年），蒙古族，出身传统贵族家庭，蒙古人民共和国早期最重要的政治家之一。他在革命后的新政权中以行政经验丰富和民族威望著称，曾两度出任总理（1928—1930年、1936—1939年），并担任国家小呼拉尔主席团主席（国家元首，1932—1936年）。在蒙古逐步被苏联渗透、控制的过程中，阿玛尔是少有的敢于在一定程度上维护蒙古国家利益、对苏联过度干预保持抵制的领导人，以雄辩捍卫蒙古独立而广受国内尊重。1939年他被苏联内务人民委员部（NKVD）人员逮捕，押送莫斯科审判，以\"反革命\"等罪名定罪。1941年在苏联被处决，遗体多年后方才归还蒙古。"
 MON_horloogiyn_choybalsan_desc:0 "霍尔洛·乔巴山（英文:Khorloogiin Choibalsan；1895年2月8日—1952年1月26日），出生于蒙古东方省，蒙古人民革命党、蒙古人民军创始人之一，元帅，蒙古人民共和国前部长会议主席。幼年时当过牧童，13岁时被送进喇嘛庙。1919年，他在库伦组织了秘密革命小组，不久与苏赫·巴托尔领导的小组合并，筹建蒙古人民党。1920年6月秘密赴苏，在伊尔库茨克红军军官学校学习。1921年3月，蒙古人民党成立，乔巴山当选为中央委员会委员和中央主席团委员，担任人民革命军副总司令兼政治委员。1923年在莫斯科军事学院学习。1924年任人民军总司令员。1928年任小呼拉尔主席团主席。1930年任外交部长。1931年任畜牧业和农业部长。1935年任部长会议第一副主席。1936年被授予元帅军衔；同年出任内务人民委员部部长，掌控了蒙古的国内安全机构。1939年起任部长会议主席。1940年6月，第八届大人民呼拉尔通过了乔巴山主持制定的新宪法。1945年8月指挥人民军配合苏军对日作战。1952年1月病逝于莫斯科。乔巴山为代表的一派主张外蒙古建立苏维埃体制，加强与苏俄的密切关系。乔巴山指示党并引导党去完成外蒙古沿着非资本主义发展道路继续前进的任务。他效仿斯大林对国内实施了政治清洗。他对斯大林及苏联的绝对忠诚，深刻塑造了蒙古数十年的政治轨迹，给该国历史留下了不可磨灭的影响。著有《蒙古人民革命简史》《青年的立志》《马克斯托布传》《蒙古人民的大事》等。"
 MON_olziytrygyn_badrak_desc:0 "额尔齐特里格·巴德拉克（蒙古语：Өлзийтийн Бадрах，1895—1941年7月30日），出生于今乌布苏省达乌斯特县，蒙古人民革命党早期激进派领导人。1924至1925年出任财政部长，此后以\"农村派\"代表身份崛起，被苏联扶植以挑战党内旧派。1925至1932年任中央政治局委员；1928年第七次党代会后当选中央委员会秘书之一，并短暂出任总书记（1928年12月至1929年1月）。其推行的强制集体化与没收财产政策严重脱离游牧现实，被定性为\"左倾偏差\"，于1932年遭开除中委，改任卫生部长至1934年。1937年以\"反革命\"罪名被捕，被指控图谋在乌布苏省建立德尔伯特分裂自治区。后被解押莫斯科，1941年7月7日由苏联最高法院军事法庭判处死刑，同月30日执行。1963年获平反。"
