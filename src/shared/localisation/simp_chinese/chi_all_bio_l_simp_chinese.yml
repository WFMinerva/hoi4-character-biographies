l_simp_chinese:
 CHI_alexander_von_falkenhausen_desc:0 "1878年11月29日生于西里西亚，1966年7月31日卒。德国陆军中将，早年曾任驻日武官，熟谙东亚军务。1934年起担任蒋介石总顾问，主持建立德械精锐师（原计划整编六十个师），推动步兵操典、炮兵配置和要塞工事标准的全面现代化，并于1936年提出《关于应付时局对策之建议》，力主以空间换时间、守长江中游为战略核心。1938年因德日轴心关系深化被迫离华，其建军体系对国军现代化的影响已然留存。二战中出任比利时占领区军政长官，因未能阻止当地大屠杀而战后在比利时受审。"
 CHI_bai_chongxi_desc:0 "1893年3月18日生于广西桂林，1966年12月2日卒于台北。新桂系核心人物，绰号\"小诸葛\"，以构思缜密、善出奇策著称。北伐期间以第七军将领崭露头角，此后与李宗仁共同经营广西，将其建设为国民党体制内最具规模的地方军政集团。1936年参与两广事变后与中央谈判妥协，抗战期间出任国民政府副参谋总长、国防部长，台儿庄大捷中亦有其参赞方略之功。其军事才能为各方公认，然桂系地方色彩始终使他与蒋系中枢保持若干距离。"
 CHI_bo_yibo_desc:0 "1908年2月12日生于山西定襄，2007年1月15日卒于北京。中共早期在华北最重要的地下干部之一，1925年入党，长期以秘密党员身份在阎锡山统治区域活动，以组织严密、善于在白色恐怖下维系党的活动著称。1936年前后推动山西牺牲救国同盟会（牺盟会）成立，为中共渗透晋系军政体系开辟了关键渠道，后发展为新军力量，成为华北抗日根据地的重要组成部分。新中国成立后长期主持财经工作，历任政务院财经委副主任、国家建委主任，是党内务实经济路线的代表性人物。"
 CHI_cai_tingkai_desc:0 "1892年12月18日生于广东罗定，1968年4月25日卒于广州。粤军宿将，以率第十九路军参加1932年一二八淞沪抗战而名震全国——在日本陆海军的强大压力下苦守上海近月余，是九一八事变后中国军队对日最具抵抗意志的一次展示，举国振奋。1933年11月，他与蒋光鼐、陈铭枢在福建发动事变，宣布成立中华共和国人民革命政府，主张停止内战、联共抗日，旋遭南京军事镇压，历时不足两月即告覆灭。此后流亡海外，抗战爆发后归国，以抗日立场继续活跃于军政两界，1949年后留在大陆。"
 CHI_carsun_chang_desc:0 "1887年1月18日生于江苏宝山，1969年2月23日卒于旧金山。哲学家、政治思想家，早年留学德国，深受康德与拉斯基宪政自由主义影响，回国后致力于将宪政制度与儒家传统相融合。1934年创立国家社会党（后改组为中国民主社会党），主张以民主宪政国家应对民族危机，同时反对国民党一党专政与共产主义极权，是第三势力最重要的理论代表。抗战期间积极参与政治协商，1946年主持起草《中华民国宪法》文本，被称为该宪法的主要起草人，然宪政理想终未得以实现。"
 CHI_chan_chak_desc:0 "1893年9月27日生于广东文昌（今属海南），1949年卒于广州。海军将领，早年毕业于广东海军学校，1922年护法战争中被炮火炸伤，右腿截肢，此后以\"独脚将军\"闻名，但始终坚持军政两界活动，意志之顽强为时人称道。1936年前后出任国民政府海军中将，协助主持粤系海军逐步并入中央体制的过渡工作，在地方海军利益与中央统合之间寻求平衡。香港沦陷后出走广东坚持抗战。"
 CHI_chang_kia_ngau_desc:0 "1889年10月8日生于江苏宝山（今属上海），1979年10月15日卒于旧金山。中国近代最重要的银行家之一，1913年进入中国银行，1917年出任总裁，历时逾二十年，将中国银行发展为当时中国最具国际信誉的现代金融机构。1928年国民政府试图接管中国银行时，他坚持谈判争取保留商业银行独立运作空间。1935年法币改革后出任铁道部长，积极推进交通网络建设；抗战期间转赴苏联，主持中苏合营中国长春铁路管理事宜，是兼跨金融与交通两大领域的复合型专业官僚。"
 CHI_chen_bijun_desc:0 "1891年11月5日生于槟城（英属马来亚），1959年6月17日卒于上海提篮桥监狱。华侨富商之女，早年赴广州参加同盟会，由此结识汪精卫并相恋，1912年成婚，此后半生追随汪的政治道路而行。她不仅是汪精卫的精神支柱，在汪系派系的人事运作与政治决策中亦拥有相当影响力，有时被认为比汪本人更为强硬果决。汪精卫政权期间积极参与政权运作，1945年以汉奸罪被判无期徒刑，死于上海狱中，坚不认罪至最后，态度之决绝为当时法庭所侧目。"
 CHI_chen_cheng_desc:0 "1898年1月4日生于浙江青田，1965年3月5日卒于台北。保定军校出身后进入黄埔体系，北伐后逐渐深受蒋介石信任，以第十一师和第十八军为核心逐步建立\"土木系\"（取十一与十八汉字偏旁），成为中央军中最重要的派系之一。历次围剿与抗战中均出任要职，以整军建制、政治工作和后方动员见长，是蒋推行军队党化的忠实执行者。抗战后期主持远征军训练与编组，1949年后任台湾省主席，推行土地改革、稳定经济，是台湾战后政治稳定的重要奠基人。"
 CHI_chen_gongbo_desc:0 "1892年10月19日生于广东南海，1946年6月3日在苏州被处决。早年参与1921年中共第一次全国代表大会，此后转入国民党，长期担任汪精卫派系核心要职，历任国民政府立法院长，兼掌宣传与组织工作，是汪系政权中最具政务能量的文官代表。1938年随汪精卫出走，1940年南京汪伪政权成立后居要职；1944年汪精卫病逝后短暂代掌政权。日本投降后被捕，翌年以汉奸罪处决，是汪伪政权覆灭后被追究责任的最高级官员之一。"
 CHI_chen_guofu_desc:0 "1892年10月26日生于浙江吴兴，1951年8月25日卒于台湾。辛亥革命先驱陈其美之侄，与弟陈立夫共同主持国民党组织党务，是CC系（两陈主导的党务系统）的创立者与主脑。其主要职能在于把持党的人事考核与组织网络，通过掌控基层党部、党校和调查统计，实施高度渗透与管控。长期任农村合作金库主任，晚年体弱多病，1949年随政府迁台，1951年在台北病逝，临终留有《我怎样生活》等著述。"
 CHI_chen_jitang_desc:0 "1890年2月12日生于广东防城（今属广西），1954年11月3日卒。粤系军政领袖，1929—1936年实际控制广东长达七年，人称\"南天王\"。任内推行系统性省域建设：整理省财政、修筑公路铁路、扩建中山大学与省立医院，工业与市政改善颇有成效，被视为南方区域现代化的代表案例之一。1936年联合广西桂系发起两广事变，以请缨北上抗日为名向南京施压，然中央以分化策略瓦解其部属，运动迅速崩溃，陈济棠出走海外，权力之路就此终结。"
 CHI_chen_lifu_desc:0 "1900年8月21日生于浙江吴兴，2001年2月8日卒于台北，享年一百零一岁。陈果夫之弟，CC系另一核心人物，长期执掌国民党调查统计局（中统前身）情报系统与党务组织。历任中央宣传部长和教育部长，是国民党意识形态管控与文化政策的主要决策者，以坚定反共和强调三民主义正统著称。其与陈果夫合力，在1930—1940年代牢牢把持国民党的组织人事命脉，通过遍布全国的党部网络渗透政府和军队，直至1948年后政治影响力随内战失利而衰退。"
 CHI_chen_mingshu_desc:0 "1889年9月17日生于广东合浦（今属广西），1965年5月16日卒于北京。粤军出身，北伐期间以第十一军崭露头角，后参与组建十九路军，与蒋光鼐、蔡廷锴并列为该军三位主要领导人。1932年一二八淞沪抗战后，他以战功和反蒋立场同时聚焦舆论；1933年主导福建事变，试图建立独立政治中心，联共反蒋，旋败走海外。其政治取向长期游走于反蒋、抗日与政治改组之间，既有将领胆魄，也具政客手腕，1949年后留大陆，历任全国政协委员。"
 CHI_chen_qingyun_desc:0 "1902年生于广东台山，国民政府空军早期军官，毕业于中国飞行学校，长期参与航空教育与空军建制的系统化工作。抗战期间投身作战指挥与战术研究，是国民政府航空系统从草创走向制度化过程中的积极参与者。"
 CHI_chen_shaokuan_desc:0 "1889年7月8日生于福建闽县（今福州），1969年7月2日卒于福州。国民政府海军部长（1928—1945年），中华民国海军总司令，是中国近代在任时间最长的海军主官，闽系海军的代表人物。他以极为有限的经费和严重老旧的舰艇勉力维持国家海上力量，同时持续提出建设现代舰队和航空母舰的长远规划，眼界超越时代局限。抗战中以水雷封锁长江、部署江防炮艇，在兵力绝对劣势的条件下为延缓日军沿江推进付出艰辛努力。"
 CHI_chen_yi_desc:0 "1883年5月29日生于浙江绍兴，1950年6月18日以通共罪被处决。早年留学日本振武学校与陆军士官学校，长期在军政两界积累资历，历任福建省主席（1933—1941年），以推行地方行政改革著称于一时。1945年日本投降后奉命接收台湾，出任行政长官，因政策强硬、歧视台人，且贪腐横行，激化族群矛盾，1947年二二八事件期间调兵镇压，造成台湾人大量伤亡。后任浙江省主席，因涉嫌联络共产党被蒋介石下令逮捕，1950年处决。"
 CHI_chiang_ching_kuo_desc:0 "1910年4月27日生于浙江奉化，1988年1月13日卒于台北。蒋介石长子，1925年赴苏联求学，先后在莫斯科中山大学和红军学校接受训练，是中苏关系紧张时期事实上的政治质子。1936年前后仍在苏联，曾公开声明与父亲划清界限以保全自身。1937年随中苏关系改善后返国，逐步在政界历练，主持赣南地区行政、整顿上海金融。1949年后赴台，主导党政军情体系，晚年推动政治改革，1987年宣布解除戒严。"
 CHI_chiang_kaishek_desc:0 "1887年10月31日生于浙江奉化，1975年4月5日卒于台北。日本振武学校与陆军士官学校出身，追随孙中山参加辛亥革命，北伐期间跃升国民革命军总司令，1927年四一二清党确立反共路线。此后以黄埔系中央军、江浙财团的财政支持和外援为三大支柱，逐步建立名义上的全国统一，主持南京十年建设。1936年西安事变迫使其接受国共合作，领导八年抗战至1945年胜利，任中国战区盟军最高统帅；国共内战失利，1949年退守台湾，统治台湾直至1975年辞世，始终坚持\"反攻大陆\"主张。"
 CHI_chu_minying_desc:0 "1884年3月13日生于浙江吴兴，1946年8月23日在苏州被处决。早年留学欧洲，以外交与文化事务见长，曾任广州政府行政院副院长，与汪精卫系统往来密切。1938年随汪出走，1940年汪精卫政权成立后出任行政院副院长兼外交部长，主持与日本及伪满的外交交涉，并参与汪伪政权宣传与行政机构的建设。日本投降后以汉奸罪被捕，1946年处决，是汪精卫政权覆灭后受审处决的高级官员之一。"
 CHI_claire_lee_chennault_desc:0 "1893年9月6日生于美国得克萨斯州商业市，1958年7月27日卒于新奥尔良。美国陆军航空兵出身，以战斗机截击战术理论著称，1937年因与上司意见相左及听力受损，以残疾军官退役，随即接受宋美龄委托来华担任中国空军顾问，参与飞行员训练与战术整编。1941年组建美国志愿航空队（\"飞虎队\"），在滇缅战场予日本航空兵以重创，声名大振。太平洋战争爆发后飞虎队并入美国陆军第十四航空队，陈纳德升任少将，主张以中国为基地以空中力量迂回打击日本，与史迪威长期争论战略路线，1945年战争结束前夕被迫离职。"
 CHI_claire_lee_chennault_ground_support_desc:0 "1893年9月6日生于美国得克萨斯州商业市，1958年7月27日卒于新奥尔良。美国陆军航空兵出身，以战斗机截击战术理论著称，1937年因与上司意见相左及听力受损，以残疾军官退役，随即接受宋美龄委托来华担任中国空军顾问，参与飞行员训练与战术整编。1941年组建美国志愿航空队（\"飞虎队\"），在滇缅战场予日本航空兵以重创，声名大振。太平洋战争爆发后飞虎队并入美国陆军第十四航空队，陈纳德升任少将，主张以中国为基地以空中力量迂回打击日本，与史迪威长期争论战略路线，1945年战争结束前夕被迫离职。"
 CHI_claire_lee_chennault_theorist_desc:0 "1893年9月6日生于美国得克萨斯州商业市，1958年7月27日卒于新奥尔良。美国陆军航空兵出身，以战斗机截击战术理论著称，1937年因与上司意见相左及听力受损，以残疾军官退役，随即接受宋美龄委托来华担任中国空军顾问，参与飞行员训练与战术整编。1941年组建美国志愿航空队（\"飞虎队\"），在滇缅战场予日本航空兵以重创，声名大振。太平洋战争爆发后飞虎队并入美国陆军第十四航空队，陈纳德升任少将，主张以中国为基地以空中力量迂回打击日本，与史迪威长期争论战略路线，1945年战争结束前夕被迫离职。"
 CHI_dai_jitao_desc:0 "1891年1月6日生于四川广汉（祖籍浙江湖州），1949年2月11日以大量安眠药自尽于广州。国民党早期最重要的理论家，与孙中山关系极为密切，曾长期担任其秘书与代笔人，并在孙在世时拥有诠释三民主义的权威地位。所著《孙文主义之哲学基础》和《国民革命与中国国民党》是将民族主义与反共主义系统结合的代表作，深刻影响了国民党思想建设。历任黄埔军校政治部主任、国民政府考试院长（1928—1948年），是党内意识形态管控与文官考选制度的主要守门人，晚年伴随国民政府的溃败而深陷抑郁，于广州自尽。"
 CHI_dai_li_desc:0 "1897年5月28日生于浙江江山，1946年3月17日座机在南京戴山坠毁身亡。黄埔六期出身，以个人效忠和高效的情报才能深得蒋介石信任，1932年主持创建复兴社特务处，后扩展为军事委员会调查统计局（军统），成为国民政府最主要的秘密警察与情报体系首脑。军统在其主导下对付中共地下组织、监控政界要人、从事暗杀行动，在上海、重庆、香港维持广泛线人网络，并与美国战略情报局开展对日情报合作。戴笠死后军统改制为保密局，由毛人凤继任，至死未有正式官衔。"
 CHI_du_yuesheng_desc:0 "1888年8月22日生于江苏川沙（今上海浦东），1951年8月16日卒于香港。幼年贫苦，从卖水果入行，在上海青帮中逐级晋升，依附法租界警察网络，最终成为上海最有实力的青帮头目，与黄金荣、张啸林并称\"上海三大亨\"。其势力遍及赌场、劳工市场与地下金融，同时借助工商业投资和慈善活动在上流社会取得合法地位。1927年为蒋介石提供帮会力量镇压工人运动；抗战期间承担国民政府军需物资采购和租界情报工作。1949年拒绝留在大陆，移居香港，临终分烧欠条，次年病逝。"
 CHI_fang_zeyi_desc:0 "1912年生于安徽无为。早年参加革命队伍，后进入军事航空领域接受训练，是国民政府空军中较年轻一代技术型军官的代表。"
 CHI_feng_yuxiang_desc:0 "1882年9月26日生于安徽巢县（今巢湖），1948年9月1日在黑海轮船上因火灾罹难。以\"倒戈将军\"著称，一生多次关键性倒戈：1924年驱逐溥仪出宫、联苏容共，其后又转向；1930年领衔中原大战联军反蒋，惨败于蒋阎结盟。1933年在张家口组建察哈尔民众抗日同盟军，一度收复多伦，却遭南京政府施压解散。1936年前后虽仍占据军事委员会副委员长高位，实已无兵可用。抗战期间多赴前线慰劳，晚年赴美，乘苏联轮船回国途中遇难。"
 CHI_fu_zuoyi_desc:0 "1895年6月27日生于山西荣河，1974年4月19日卒于北京。出身晋绥军阎锡山体系，以1927年涞水之战等战役崭露头角，尤善防御守坚。1935年后主政绥远，1936年11月主动出击百灵庙，击败由日本扶植的察哈尔伪蒙军，赢得全国关注，声望大振。抗战期间率部参与绥远、晋北及平绥沿线战役，以守城之能名重一时，绥远抗战成为北方抗日的精神符号之一。1949年1月接受中共条件和平开放北平，使古都建筑完整保全，留在大陆任水利部部长至1974年病逝。"
 CHI_gao_zhihang_desc:0 "1907年5月14日生于辽宁通化，1937年11月21日在河南周口机场遭日机偷袭牺牲，年仅三十岁。中国空军第一批精英飞行员，以技艺娴熟、作战勇猛著称。1937年8月14日，淞沪会战开战次日，他率第四大队拦截日本海军航空兵对笕桥基地的轰炸，以击落日机六架、己方无一损伤的战绩开创了中国空战史上最振奋人心的开局，被誉为中国第一\"空战英雄\"，事迹经报纸广泛传播，极大鼓舞了民心士气。牺牲时正准备接收新型战机，因机场疏散不及而罹难，举国同悼。"
 CHI_gao_zongwu_desc:0 "1905年生于广东茂名，1994年卒于美国。国民政府外交部亚洲司长，是1930年代中日秘密外交交涉的关键操盘手，深度介入1937—1938年多轮对日非正式接触，并协助安排汪精卫与日方的秘密谈判。然而1939年底他突然倒戈，将谈判秘件交由《大公报》公开发表，揭露汪精卫和平路线的完整内幕，令汪系陷入舆论困境。此后流亡海外，长居美国。"
 CHI_gu_zhutong_desc:0 "1893年1月9日生于江苏涟水，1987年1月17日卒于台北。保定军校出身，1924年进黄埔军校任职，此后成为蒋介石最受信任的嫡系将领之一，历次围剿和对日作战中均出任方面要职。1941年1月，在其指挥下发生皖南事变，国军包围并消灭新四军军部，此为国共合作关系最严重的军事冲突。抗战期间历任第三战区司令长官、参谋总长等职，以稳健服从和处置周全见重，长期是蒋系军事体系的核心柱石。"
 CHI_gui_yongqing_desc:0 "1901年生于江西贵溪，1954年8月12日卒于台北。黄埔一期出身，参与组建和训练德械精锐师，抗战初期率部参加长城抗战与淞沪会战，战绩起伏，然始终维持蒋介石的信任。国共内战后期转向海军，1953年出任国民政府海军总司令，致力于在台湾海峡巩固制海力量，于就任后不久因病辞世。"
 CHI_h_h_kung_desc:0 "1880年9月11日生于山西太谷，1967年8月16日卒于纽约。出身山西富商，因娶宋蔼龄进入孔宋家族网络，与蒋介石构成连襟关系。长期主掌国府财经：1933—1944年任财政部长，期间主导1935年法币改革，以统一货币取代各省银两流通，同时争取英国提供外汇准备金，稳定了国民政府的财政基础。兼任中央银行总裁与行政院长期间，其家族在金融领域大量渔利，与宋子文、宋美龄共同构成外界所称\"四大家族\"的孔宋核心，贪腐之名难以洗脱。"
 CHI_hsueh_yueh_desc:0 "1896年12月27日生于广东乐昌，1998年5月3日卒于台北，享年一百零一岁。保定军校出身，早年属粤军系统，北伐后加入国民革命军。抗战期间以四次长沙会战名垂青史，尤以第三次（1941—1942年）运用\"天炉战法\"，诱敌深入后四面围歼，歼灭日军逾五万，被美国《时代》杂志誉为中国抗战\"最大的胜利\"。他是国民政府中少数能在运动战与阵地战之间灵活转换的高级指挥官，粤系背景使其与蒋系中枢始终保持若干距离，以战功自立。"
 CHI_hu_hanmin_desc:0 "1879年12月9日生于广东番禺，1936年5月12日卒于广州（脑溢血）。国民党元老，追随孙中山逾二十年，早年参与多次武装起义，是国民党建党的核心人物之一。思想上属党内右翼，坚决反共，强调党治优先于宪政民主。1931年因反对蒋介石擅自推行约法，在南京遭蒋软禁近一年，由此引发宁粤之争。出走广州后以反蒋旗帜聚合南方势力，然1936年5月突发脑溢血去世，南方反蒋联盟随之一散，其影响力随死亡戛然而止，为同年两广事变埋下遗憾。"
 CHI_hu_zongnan_desc:0 "1896年5月12日生于浙江镇海，1962年2月14日卒于台北。黄埔军校第一期出身，以蒋介石\"天子门生\"之首著称，深得蒋最高度的个人信任，军旅生涯几乎全部系于这一特殊关系之上。1936年前后，他率中央军精锐驻扎陕甘，对中共陕北根据地实施多重封锁，是南京政府在西北最主要的军事执行者。同年十二月西安事变爆发后，胡部一度是蒋介石考虑动用武力解救时最重要的军事筹码；事变和平解决后，他继续主持西北防务，成为国共之间最直接的军事屏障。抗战八年间，其部始终以\"防共\"为第一优先，驻扎西北动辄四五十万之众，却少直接参与对日战场，国共双方均有批评——中共指其坐失抗日之机，蒋系内部亦有人认为资源调配失当。内战期间，胡宗南一度风光无限：1947年3月率军攻入延安，蒋介石在台上大肆庆功。然而延安城是毛泽东主动撤出的空城，中共中央已转入山地指挥游击，胡宗南实际拿下的不过是一座弃置的窑洞群。此后局势急转直下：彭德怀领导的西北野战军以运动战反复调动胡部，1948年4月延安再度易手，陕北根据地全面恢复。胡部在西北、关中节节溃退，1949年底经四川撤退台湾。其失败原因，除战略判断失误、用兵保守之外，战后披露了一个震动海峡两岸的历史细节：其最亲近的秘书兼核心幕僚熊向晖，自1937年起即为中共潜伏特工，在胡身边工作整整十二年，将胡宗南的军事部署、人员动向和攻打延安的完整计划悉数上报延安。这一渗透被认为是国共内战中最具决定性的情报行动之一，毛泽东事后称熊向晖\"一个人顶三个师\"。胡宗南晚年在台北仍担任要职，对这段历史始终讳莫如深。"
 CHI_huang_jinrong_desc:0 "1868年3月11日生于江苏苏州，1953年6月20日卒于上海。早年进入法租界巡捕房充任华人探长，借助权力之便结交青帮、扩张地盘，逐步成为上海最有实力的黑道人物，与杜月笙、张啸林并称\"上海三大亨\"。鼎盛时期控制法租界赌馆、鸦片贩卖和劳工中介，在政商两界广泛编织关系网络。1927年参与支持四一二清党，此后逐渐退居幕后，1949年后留居上海，因年事已高未遭严酷处置，1953年在家中平静去世，晚景较之过去的呼风唤雨，颇为落寞。"
 CHI_huang_qixiang_desc:0 "1898年1月9日生于广东梅县，1970年12月10日卒于北京。粤军将领，北伐期间参与创立第三党（中国国民党临时行动委员会），主张革命民主主义，是1930年代中国第三势力最重要的领袖之一。与蔡廷锴等福建事变领导人关系密切，立场带有强烈反蒋与抗日色彩。抗战期间回归军旅，历任第十一集团军司令等职，参加武汉会战等重要战役。1949年后留在大陆，任政协委员，历经多次政治运动。"
 CHI_huang_shen_desc:0 "1874年10月25日生于湖南长沙，1916年10月31日卒于上海。辛亥革命最重要的军事领袖，同盟会联合创始人，与孙中山并称\"孙黄\"。曾主持黄花岗起义（1911年）、领导武昌起义后的汉阳保卫战，出任南京临时政府陆军总长，是推翻清廷武装斗争的主要组织者和指挥官。民国建立后因路线分歧一度出走，袁世凯复辟期间再度参与护国，1916年病逝。其革命资望被国民党奉为建党精神源泉。"
 CHI_jiang_baili_desc:0 "1882年11月7日生于浙江海宁，1938年11月4日卒于广西宜山（抗战途中病逝）。日本陆军士官学校中国留学生毕业考第一名，后赴德国深造，是民国时代最具理论深度的军事思想家。1912年任保定军校第一任校长，著有《国防论》，系统论述以空间换时间、战略退守西南等抗日战略，与抗战实际走向若合符节，被誉为\"中国现代兵学之父\"。其深厚的日德军事理论背景亦使他成为中德军事合作的智识基础之一，与法肯豪森在战略构想上多有共鸣；惜乎在最关键的战争岁月中因病猝然离世。"
 CHI_jiang_dingwen_admiral_desc:0 "1895年11月25日生于浙江诸暨，1974年1月2日卒于台北。黄埔系将领，北伐后长期追随蒋介石，历次围剿与抗战中均出任方面军要职，以忠诚稳重和善于统辖大区见重于蒋。抗战期间长期主持第一战区（豫陕地区），1944年日军豫湘桂战役发动时，其负责的中原战场遭受严重溃败，所部被日军快速击穿，河南大片失地，引发政府与民间广泛批评，成为其仕途最大的历史包袱。"
 CHI_jiang_dingwen_desc:0 "1895年11月25日生于浙江诸暨，1974年1月2日卒于台北。黄埔系将领，北伐后长期追随蒋介石，历次围剿与抗战中均出任方面军要职，以忠诚稳重和善于统辖大区见重于蒋。抗战期间长期主持第一战区（豫陕地区），1944年日军豫湘桂战役发动时，其负责的中原战场遭受严重溃败，所部被日军快速击穿，河南大片失地，引发政府与民间广泛批评，成为其仕途最大的历史包袱。"
 CHI_jiang_guangnai_desc:0 "1888年12月10日生于广东东莞，1967年5月19日卒于广州。粤军出身，国民革命军老将，十九路军总指挥，1932年一月二十八日淞沪抗战的最高军事指挥官。面对日本海陆空联合进攻，他率部苦守上海逾月，是九一八后国军对日抵抗最有力的一次行动，以寡敌众赢得举国敬仰。1933年与蔡廷锴、陈铭枢联手发动福建事变，宣布脱离南京独立，旋遭军事镇压而流亡海外。抗战正式爆发后归国，参与两广地区抗战，1949年后留在大陆，历任全国政协委员，晚年定居广州。"
 CHI_ju_zheng_desc:0 "1876年12月21日生于湖北广济（今武穴），1951年4月23日卒于台北。辛亥革命元老，同盟会早期成员，参加多次武装起义，以法政背景和党内元老资历著称于时。民国建立后长期在司法与监察系统任职，历任国民政府司法院长（1932—1948年）和总统府资政，是南京政权中坚持以法统和党统维护党国体制的代表性人物。其政治主张偏于守成，重视司法程序与党纪，在派系纷争中倾向维护中央权威，是国民党内部较重视制度框架的元老一派。"
 CHI_kwong_jiang_desc:0 "1906年生于广东开平。政学界出身，长期活跃于国民政府立法与宪政讨论领域，参与法律起草和议政事务。代表一类重视程序法制、倡导渐进宪政改革的国民党党内人物，主张在党国框架内建立更完善的立法与监察机制，以制度化手段规范政府行为。"
 CHI_li_zongren_desc:0 "1891年8月13日生于广西桂林，1969年1月30日卒于北京。新桂系首脑，与白崇禧长期搭档，将广西经营为国民党体制内最具规模的地方军事政治集团。北伐中功勋卓著，此后长期在拥蒋与抗蒋之间审时度势，先后参与1929年蒋桂战争和1936年两广事变，始终维持广西的半独立地位。抗战期间主导台儿庄战役，以运动防御在鲁南歼灭日军两个精锐师团，成为正面战场中国军队最重要的胜利之一，声望如日中天。1948年当选副总统，1949年蒋介石下野后出任代总统，后流亡美国，1965年返回北京，两年后辞世。"
 CHI_liang_shuming_desc:0 "1893年10月18日生于北京（祖籍广西桂林），1988年6月23日卒于北京。中国近代最著名的文化保守主义思想家，1921年出版《东西文化及其哲学》，系统论述中国文化的独特价值，成名于学界。1931年在山东邹平创办乡村建设研究院，推行以儒家伦理重建基层农村秩序的社会实验，拒绝城市工业化和阶级斗争的路径，是\"乡村建设运动\"的代表人物。抗战期间奔走国共之间，试图以独立知识人身份促成政治合作。1988年以九十四岁高龄辞世，被誉为\"中国最后一位大儒\"。"
 CHI_lin_sen_desc:0 "1868年1月16日生于福建闽侯，1943年8月1日在重庆病逝，任内辞世。同盟会早期成员，辛亥革命参与者，长期在国民党内担任元老性质职务，1931年起出任国民政府主席。此职在南京时代实权有限，然林森因不入派系、超然政治斗争，反而在国际外交场合发挥凝聚人心的象征作用。日本侵略期间随政府迁渝，坚持不降不逃，以清廉作风和超然姿态维持国家尊严；1943年病逝重庆，中共亦公开发文悼念，毛泽东称其为\"为民族解放事业努力的人\"，可见其跨越党派的历史认可。"
 CHI_mao_renfeng_desc:0 "1898年2月15日生于浙江江山，1956年6月18日卒于台北。与戴笠同乡，早年在军统系统中担任戴笠最重要的幕后协调人，负责组织运转、文件管理与人事调动，是军统内部实际行政核心。1946年戴笠在山东戴山飞机失事身亡后，毛人凤逐步接管军统改制后的保密局，1948年正式出任局长，继续主持情报与反共工作。国共内战末期仍坚持在大陆布置潜伏网络，1949年随政府撤台，主导对岸情报渗透与安全事务，1956年病逝于任内，是戴笠体系最忠实的传承者。"
 CHI_mei_siping_desc:0 "1901年生于浙江永嘉，1946年9月14日被处决。早年从事政学工作，1938年前后倒向汪精卫路线，深度参与秘密对日谈判，是汪出走前最重要的联络中间人之一。汪伪政权成立后历任行政、财政与实业要职，是汪伪体制中典型的技术官僚型骨干，以制度框架为合作政权提供运转基础。1944年起随局势变化暗中与重庆接触，1945年被捕，翌年以汉奸罪处决，是汪精卫政权覆灭后受审清算中最重要的官员之一。"
 CHI_shen_honglie_desc:0 "1882年5月12日生于湖北天门，1969年3月7日卒于台北。早年就读于日本海军学校，是近代中国少数具备系统海军知识的官员之一。历任东北海军总司令（1928—1932年），九一八后随张学良体系易帜入关。1932年出任青岛市长，以维护主权、抵制日货著称；后任山东省主席，抗战期间在日军占领下组织游击，灵活周旋。其仕途跨越海军与地方行政两大领域，是国民政府中少见兼具海军资历与行政实绩的复合型人物。"
 CHI_shen_junru_desc:0 "1875年1月2日生于浙江嘉兴，1963年6月11日卒于北京。法学家，清末进士出身，民国初年转向宪政与人权事业。1936年率领宋庆龄、邹韬奋等发起全国各界救国联合会，因主张停止内战、一致抗日，同年11月遭国民政府逮捕，与章乃器、邹韬奋等共七人被关押，史称\"七君子事件\"，引发国内外舆论强烈声援。抗战爆发后七人获释，沈钧儒成为中国民主运动的重要象征。1949年后出任最高人民法院院长，是中国民主同盟的核心领导人，1963年病逝北京。"
 CHI_shi_liang_desc:0 "1900年3月27日生于江苏常州，1985年9月6日卒于北京。律师与社会活动家，以从事劳动法、婚姻法和人权案件辩护著称。1936年参与救国联合会活动，同年被捕，是\"七君子事件\"中唯一的女性，被捕消息在社会上引发广泛关注，她由此成为中国近代法制史上最具知名度的政治犯辩护律师之一。出狱后继续投身抗日救亡与民主运动。1949年后留在大陆，出任司法部长（1959—1979年），历任全国政协和全国人大常委。"
 CHI_soong_mei_ling_desc:0 "1898年3月5日生于上海（祖籍广东文昌），2003年10月23日卒于纽约，享年一百零五岁。出身宋氏华侨家族，幼年赴美，毕业于韦尔斯利学院，以英语和西方文化背景成为蒋介石对外宣传的关键利器。1927年嫁蒋，此后长期作为国民政府的国际形象代言人，向美国社会和媒体阐述中国立场。1936年西安事变中亲赴西安参与谈判，促成张学良释蒋，被视为关键斡旋人物。1943年访问美国，在国会两院发表演讲，为中国争取物资援助，万人倾倒；晚年往返台北与纽约，2003年辞世，是二十世纪中国最具国际知名度的女性人物之一。"
 CHI_sun_fo_desc:0 "1891年10月20日生于广东香山（今中山），1973年9月20日卒于台北。孙中山之独子，毕业于美国加州大学伯克利分校，后获哥伦比亚大学经济学硕士，是国民党领导层中受西式教育最系统的人物之一。\"国父之子\"的光环既赋予他无可替代的象征地位，又始终将他置于孙中山遗产诠释权的政治博弈之中。早年数度出任广州市长（1920年代），主持市政建设，颇有建树。此后进入中央体制，历任立法院长（多届，1932—1948年为主要任期），是国民政府中最持续倡导宪政程序的高层人物：他推动立法院进行实质审议，反对行政权对立法的随意绕越，在党内属于坚持以制度约束党国权力的温和自由派代表。其政治立场亦带有明显的亲苏倾向——多次赴苏访问，1945年参与对苏谈判，签署《中苏友好同盟条约》，被视为国民党内最认真对待与苏联长期合作可能性的人物。1948年底国共内战全面崩溃之际，他临危受命出任行政院长，然接手的是一个已然四面溃散的烂摊子：通货恶性膨胀、军事节节失利、民心丧失殆尽。仅百余日即辞职，此后流亡海外，辗转法国、美国，与台北保持若即若离的关系。1965年应蒋介石之邀返台，以国民党元老身份度过晚年，1973年辞世。"
 CHI_sun_li_jen_desc:0 "1900年12月8日生于安徽庐江，1990年11月19日卒于台中。毕业于美国普渡大学土木工程系，后转入弗吉尼亚军事学院，是国民政府将领中接受美式正规军事教育最系统的人物。1936年前后主持财政部税警总团，以严格的西式训练标准打造出一支异于中央军的精锐步兵部队。抗战中率部远征缅甸，以仁安羌一役救出被围英军，后主导反攻缅北战役，战绩为中外军事史所公认。因非黄埔嫡系出身，1955年遭蒋介石以叛变嫌疑软禁长达三十三年，直至1988年获释。"
 CHI_symeon_du_desc:0 "1886年2月11日生于北京，1965年卒于上海。俗名杜润臣，受洗教名斐奥多尔（Fyodor），修道后取名西麦翁（Simeon），出身于阿尔巴津人社群——此一群体乃1685年雅克萨之战（清军攻俄罗斯哥萨克边堡）后被康熙帝安置于北京的俄国战俘后裔，世代奉东正教，以杜比宁（Dubinin）等汉化姓氏延续至今。其父为东正教会诵经士，1900年义和团庚子教难中殉道，杜润臣本人与数位近亲幸免于难。幼年即在俄罗斯北京东正教传教团神学校受教育，1904年毕业后受诵经士职，担任教理讲授师。1908年由英诺肯提主教按立为辅祭，分派至哈尔滨圣母领报教堂，担任传教师、出纳与教堂事务主任，并于1919年主持出版俄文教科书。此后二十余年间（1920—1932年），他以传教士身份走遍中国各地，足迹遍及上海、汉口、开封、保定、齐齐哈尔，乃至察哈尔、内蒙古与整个满洲，是将东正教在华推广最力的本土传教士。1932年在长期周游传教后定居天津。"
 CHI_t_v_soong_desc:0 "1894年12月4日生于上海（祖籍广东文昌），1971年4月25日卒于旧金山。哈佛与哥伦比亚大学经济学出身，宋氏家族成员，以精通国际金融和强硬的对外谈判风格著称。1928—1933年任财政部长，推进金融整合与关税自主；1935年法币改革中争取英国提供外汇储备担保，是该改革得以推行的关键外交操作者。1941—1945年任外交部长，奔走美英谋取外援，是二战中国对外借款与租借法案谈判的首席执行者，与蒋介石之间既有连襟之谊，又屡因政见相左而产生摩擦。"
 CHI_tai_anlan_desc:0 "1904年11月25日生于安徽无为，1942年5月26日牺牲于缅甸茅邦村，年仅三十七岁。黄埔三期出身，历经剿共与华北对日作战，以治军严整和身先士卒著称。1942年随中国远征军入缅，率第二百师在同古（东吁）以孤军苦战日军精锐长达十二天，此后参与仁安羌救援英军行动；撤退途中伤重感染，在缅甸腹地丛林中牺牲，遗体历经艰辛运返国内。毛泽东、罗斯福均公开致哀，是二战中国对日战场最广受国际认可的殉国将领，身后追授国民政府最高荣誉。"
 CHI_tao_xingzhi_desc:0 "1891年10月18日生于安徽歙县，1946年7月25日卒于上海（脑溢血），享年五十四岁。早年留学美国哥伦比亚大学，师从约翰·杜威，回国后将实用主义教育理念本土化，提出\"生活即教育、社会即学校、教学做合一\"的生活教育体系。1927年创办晓庄师范，推行农村平民教育实验，后建立育才学校，专门发掘培育贫寒家庭中的天才儿童。1936年积极参与救国运动，支援七君子事件中的被捕人士。1946年猝然离世，举国同悼。"
 CHI_teng_chie_desc:0 "1906年生于广东番禺。国民党青年与党务骨干，1932年参与创建\"蓝衣社\"（复兴社特务处的前身），是该组织的核心发起人之一，力主以法西斯式纪律组织对国民党进行精英改造，以对抗共产主义并强化党国动员能力。长期在国民党宣传、组织与青年运动领域担任要职，属于1930年代国民党内最具法西斯意识形态色彩的派系人物，主张以强制力量整肃社会、消弭派系，为党国威权统治提供思想与组织支撑。"
 CHI_tu_yuming_desc:0 "1904年11月28日生于陕西米脂，1981年5月7日卒于北京。黄埔一期出身，属中央军嫡系，1936年参与创建国民政府机械化部队，是国军中少数真正熟悉现代装甲战的指挥官之一。抗战期间率第五军参与桂南会战，昆仑关大捷（1939—1940年）是抗战中最精彩的机械化作战案例之一；后随远征军入缅作战。国共内战中先后主持东北和淮海战场，1949年在淮海战役末期兵败被俘，1959年获特赦，以全国政协委员身份在北京度过晚年。"
 CHI_wang_chonghui_desc:0 "1881年10月10日生于广东东莞，1958年3月15日卒于台北。早年分别在香港大学、耶鲁大学和柏林大学攻读法学，获博士学位。1921年当选常设国际法院（海牙）法官，是近代中国第一位在国际司法机构任职的法学家，国际声誉卓著。历任国民政府司法部长、外交部长、行政院长，是党内最具国际法律权威的文官人物。1936年前后主持对外条约修订与国际交涉，以法律框架应对九一八后东亚局势，在高压局势下仍坚持援引国际法原则。"
 CHI_wang_jingwei_desc:0 "1883年5月4日生于广东三水，1944年11月10日卒于日本名古屋（骨髓炎并发症）。早年以谋刺清廷摄政王载沣被捕，在狱中赋诗\"引刀成一快，不负少年头\"而声名大噪。1920—1930年代长期与蒋介石争夺党政领导权，曾短暂出任行政院长（1932—1935年），以国民党副总裁名义维持政治地位，并以对日主和立场逐渐与蒋生隙。1938年底秘密出走，1940年在南京建立\"国民政府\"（汪伪政权），以\"和平建国\"为旗帜配合日本占领体制，成为中国近代史上\"汉奸\"的最典型象征。"
 CHI_wang_shuming_desc:0 "1901年生于安徽合肥，1984年卒。中国空军高级将领，长期参与国民政府航空部队的训练、整编与对美协调工作，经历了中国空军从德制到美援时期的全面转型。战后逐步升至高位，1952年出任中华民国空军总司令，在台湾海峡紧张局势下主持制空事务与对岸侦察，是1950年代国民政府航空力量的核心领导人物，为战后台湾空军建制奠定了重要基础。"
 CHI_wang_yaowu_desc:0 "1904年3月14日生于山东泰安，1968年7月3日卒于北京。黄埔三期出身，长期在中央军精锐部队任职，1939年升任第七十四军军长，将该军打造为国民政府最精锐的战略机动部队之一（后被列入\"五大主力\"）。历经淞沪、南京、武汉、长沙、雪峰山等多次重大战役，以坚韧硬打和善于培养基层骨干著称，抗战末期升任第四方面军司令，战功卓著。国共内战后期任山东省主席，1948年济南战役兵败被俘，1959年获特赦，以全国政协委员身份在北京度过余生。"
 CHI_weng_wenhao_desc:0 "1889年7月26日生于浙江宁波（鄞县），1971年1月27日卒于北京。中国第一代地质学家，1912年在比利时获地质学博士，归国后参与建立中国近代地质科学基础，是国内地质学界的开山人物之一。1930年代由学界转型为技术官僚，主持资源委员会，推动战略矿产勘探与战时内迁工业布局，是国民政府战时工业动员的主要组织者。1948年短暂出任行政院长，旋于国共内战溃败中辞职；1951年自欧洲返回大陆，成为少数从国民党高层体制回归新中国的官员之一，晚年在北京以政协委员身份度过余生。"
 CHI_xiao_yisu_desc:0 "1891年生于湖南长沙，1986年卒于台北。长期在国民政府军事参谋与陆军教育系统任职，历经北伐、围剿和抗日各阶段，以统筹参谋和部队训练见长，而非以前线战术著称。1944年出任中国驻印军参谋长，在缅北反攻期间协助史迪威协调后勤与作战计划，成为中美联合参谋体系中的重要接口人物。"
 CHI_y_c_james_yen_desc:0 "1893年10月26日生于四川巴中，1990年1月17日卒于纽约。早年赴美留学于耶鲁大学，一战期间赴法担任华工翻译，切身体认文盲之苦，由此立志推广平民教育。1923年创建中华平民教育促进会，1929年起在河北定县开展综合性乡村建设实验，涵盖识字教育、卫生改善、农业示范和地方自治，被国际联盟誉为\"世界平民教育运动之父\"。其超越政治动员、以教育改造基层社会的路线，代表近代中国温和社会改革思潮的重要实践，影响遍及亚非拉多国的农村发展运动。"
 CHI_yu_hanmou_desc:0 "1896年3月3日生于广东高明，1981年11月22日卒于台北。粤系将领，保定军校出身，北伐后逐步升任广东省军事领导职务。1936年两广事变后，受蒋介石委任逐步接替陈济棠主政广东，由此确立其在华南的核心军事地位。抗战期间率部参加淞沪会战后方策应与多次粤北会战，是主持广东对日防守的主要将领，坚持至1938年10月广州陷落后才率残部退入山区，维系游击抗战体系。1949年率部撤台，晚年历任要职，1981年辞世。"
 CHI_zhang_guotao_desc:0 "1897年5月26日生于江西萍乡，1979年12月3日卒于加拿大多伦多（养老院中摔倒后病逝）。北京大学学生出身，亲历五四运动，1921年作为中共第一次全国代表大会的十三名出席代表之一，参与创建中国共产党，是名副其实的\"建党元老\"。此后长期在党内居高位，主持劳动组合书记部、领导工人运动，历届中央委员会均属核心层。其历史地位在红四方面军时期达到顶峰。1931年起，他以中央局书记兼军事委员会主席身份主持鄂豫皖根据地建设，将其发展为当时规模最大、制度最完整的苏区之一，并亲手锤炼出纪律严明、战斗力卓著的红四方面军。1932年第四次\"围剿\"失利后，他率部西进四川，在川陕边境再建根据地，部队扩展至八万余人，是长征期间兵力最雄厚的共产党武装，与毛泽东的中央红军形成事实上的双雄并立格局。1935年6月至9月，两支主力会师川西北，由此爆发中共党史上最严重的内部决裂。分歧表面是路线之争——张国焘主张留守川康藏区另立根据地，毛泽东坚持北上陕甘——实质是对全党最高领导权的争夺。双方相持数月，张国焘最终于同年11月在甘肃另立\"第二中央\"，公然与中共中央对峙，是为中共建党以来绝无仅有的党内公开分裂。然而此后局势急转直下：西路军（红四方面军精锐约两万余人）西渡黄河，欲打通经甘肃通往苏联的国际补给线，却遭马步芳、马步青骑兵军残酷围歼，万余人战死或被俘，全军几近覆没，是共产党历史上最惨烈的军事失败之一。张国焘被迫就范，1937年回归延安，1938年4月被正式开除党籍。随即转向国民政府，为蒋介石体系提供中共组织架构与内部机密情报，短期在国统特务系统任职。然其在国民党阵营终究是被利用而非被重用的边缘存在，1948年离开中国大陆，经香港赴加拿大，在海外华人社区度过晚年。流亡期间撰成《我的回忆》三卷，以亲历者视角详述中共早期历史，尽管充满强烈的主观立场与个人辩白色彩，仍是研究1920—1930年代中国共产主义运动最重要的第一手文献之一。1979年在多伦多养老院中摔倒后病逝。"
 CHI_zhang_guotao_kmt_desc:0 "1897年5月26日生于江西萍乡，1979年12月3日卒于加拿大多伦多。中共创始人之一，长期掌握红四方面军，在长征中与毛泽东路线分歧演变为公开分裂；后被迫就范，1938年秘密出走，正式脱离共产党，转向国民政府。他为蒋介石体系提供中共高层组织架构与内部决策的详尽情报，是国民政府对中共内部瓦解工作最具价值的投诚者之一。然其在蒋系终究是被利用而非被重用的边缘存在，政治影响力迅速消耗殆尽，晚年流亡海外，郁郁而终。"
 CHI_zhang_qun_desc:0 "1889年5月9日生于四川华阳（今成都），1990年12月14日卒于台北，享年一百零一岁。蒋介石在日本振武学校时期的同学，是少数在私谊与公务两层面均长期维持与蒋密切关系的政治人物。历任四川省主席、外交部长、行政院长等要职，以在派系之间斡旋协调和处理复杂政务著称，外交折冲尤为其长。1930—1940年代先后主持对日、对苏及战后外交交涉，是蒋信任的外交与政务总管；抗战期间主政四川，协助将大后方人力物力纳入国家战时动员体系，是西南重心战略的重要地方执行者。"
 CHI_zhang_xueliang_desc:0 "1901年生于辽宁海城，奉系首领张作霖之子，世称“少帅”。1928年皇姑屯事件后接掌东北军，同年宣布东北易帜，使国民政府实现形式上的全国统一。1931年九一八事变中，他遵照南京方面不抵抗方针，东北迅速沦陷，遂背负“不抵抗将军”之名。此后受命在西北围剿中共，但东北军官兵要求抗日复土的情绪日益高涨。1936年12月，他与杨虎城发动西安事变，扣留蒋介石，要求停止内战、一致抗日；事变和平解决后，他亲送蒋返南京，旋即被长期软禁。1949年后迁台，1990年后恢复自由，晚年移居夏威夷。2001年逝世，终年一百岁。"
 CHI_zhang_zhizhong_desc:0 "1890年10月27日生于安徽巢县（今巢湖），1969年4月6日卒于北京。黄埔系高级将领，1932年和1937年两度亲率部队参加淞沪抗战，以坚决主战著称；同时长期主张以政治手段解决国共矛盾，数度出任谈判代表，故有\"和平将军\"美誉。其兼具前线指挥与政治斡旋能力，既能参加大规模会战，也常在复杂政治关头承担沟通与协调使命。1949年初赴北平代表国民政府谈判，最终留在大陆，加入中央人民政府，历任国防委员会副主席等职，1969年辞世。"
 CHI_zhou_fohai_desc:0 "1897年5月29日生于湖南沅陵，1948年2月28日卒于上海狱中（心脏病）。中共创始人之一，出席1921年中共一大，翌年即脱党；此后转入国民党，加入蒋介石核心圈，任宣传部长。1938年随汪精卫出走，成为汪伪政权财政部长，负责伪政权货币、税收和经济运作，是汪精卫体制中最重要的经济决策者，同时主持特工事务。1944年后随战局逆转暗中与重庆联络，提供情报，1945年被捕，判处死刑后改判无期，1948年病死狱中。"
 CHI_zhu_de_desc:0 "1886年12月1日生于四川仪陇一个贫苦佃农家庭，1976年7月6日卒于北京。早年以科举路径求学，后辗转入云南陆军讲武堂，1911年辛亥革命中参与昆明起义，在蔡锷麾下崭露头角。此后十年，他历任滇军旅长、团长，官至旅长。1920年，他在上海寻访陈独秀，希望加入中国共产党，竟遭婉拒——陈独秀认为一个有鸦片瘾的旧式军官无法成为革命者。他随即出走欧洲，1922年在柏林经周恩来介绍加入中国共产党，同年入哥廷根大学进修，戒除鸦片，彻底转型。此后赴苏联接受军事训练，归国后参与北伐。1927年8月1日，他以第三军军官教育团团长身份参与南昌起义，此日后被定为中国人民解放军建军节。起义军南下失败后，他率残部辗转转战，1928年4月将约两千人的部队带上井冈山与毛泽东会师，合编为工农红军第四军——毛泽东任党代表、朱德任军长，\"朱毛\"由此并称，成为中国共产主义革命史上最具传奇色彩的军政搭档。在井冈山时期，他与毛泽东共同总结出\"敌进我退、敌驻我扰、敌疲我打、敌退我追\"的游击十六字诀，奠定了红军以弱胜强的战术基础，此后历次\"围剿\"均以此为骨干应对国民党优势兵力。长征期间，他随中央红军出发，后因张国焘分裂事件被迫随红四方面军行动逾一年，始终坚持中央路线，拒绝认同张国焘另立中央的行为。抗日战争期间，他出任国民革命军第八路军（后改称第十八集团军）总指挥，在华北协调三个师的游击与正规作战。1940年主持指挥百团大战，逾百个团同时向日军华北交通线发动大规模攻击，打击铁路、公路和煤矿设施，声势浩大。国共内战中以人民解放军总司令身份统辌全局，与毛泽东共同运筹三大战役（辽沈、淮海、平津），指挥全面战略胜利。1955年被授予中华人民共和国元帅军衔，1959年起任全国人民代表大会常务委员会委员长。"
 CHI_zhu_jiahua_desc:0 "1893年11月7日生于浙江湖州（吴兴），1963年11月6日卒于台北。早年留学德国柏林大学，获地质学博士，是中国近代学术界与政界双重身份的典型代表。历任中山大学校长、中央研究院总干事、教育部长（1938—1944年），力主建立独立学术体制与提升高等教育水平，是国民政府最具学术声望的文官之一。同时长期主持国民党中央组织部，兼具知识界背景与组织经验，擅长在官僚体系内推进政策协调，是技术官僚与党务运作双重复合型人才，在台湾中央研究院工作至去世。"
 CHI_zou_lu_desc:0 "1885年7月21日生于广东大埔，1954年2月14日卒于台北。辛亥革命参与者，国民党元老，孙中山追随者之一。长期主持广东高等教育，担任中山大学校长逾二十年，是近代中国大学建制化的重要推动者。政治上属党内右派，强调三民主义正统与反共立场，曾多次批评蒋介石集权倾向，但在大是大非上仍与中央保持配合。1936年前后以国民党中执委老资格委员身份活跃于党内保守阵营，是国民党右派知识官僚的代表人物，兼具教育家声望与党国政客身份。"
 CHI_zou_taofen_desc:0 "1895年11月5日生于江西余江，1944年7月24日卒于上海（耳癌），年仅四十八岁。早年毕业于上海圣约翰大学，后以主编《生活》周刊闻名全国，其文笔犀利、关怀民间，刊物发行量最高时逾十五万份，是1930年代中国最具影响力的进步媒体之一。1936年参与全国救国联合会活动，同年被捕成为\"七君子\"之一，出狱后继续办刊，辗转武汉、重庆、香港，坚持以独立批评精神抗衡权力压制。1944年在上海秘密就医，临终前要求加入中国共产党，中共中央特予追认。"
