 YUN_zhou_zhirou_desc:0 "周至柔，原名百福，字至柔，1899年11月30日生于浙江临海。早年入保定陆军军官学校第八期步兵科，毕业后任职浙军，1924年南下广州任黄埔军校教官，参加东征、北伐及国民革命军早期作战。1930年代先后任第十四师师长、第十八军副军长等职，1933年奉派赴欧美考察航空，回国后主持中央航空学校和国民政府航空委员会工作，1936年出任航空委员会主任，成为国民政府空军制度建设、训练体系和作战指挥的重要负责人。全面抗战期间，他统筹中国空军训练、装备、基地和对日作战，参与淞沪、武汉、长沙、鄂西、常德、桂柳等阶段的空军作战与后勤建设，并与中美航空合作体系关系密切。1946年任空军总司令，1949年后赴台，历任参谋总长、台湾省政府主席、总统府参军长等职，1951年晋一级上将。1986年8月29日在台北去世。"
 GXC_lei_zhong_desc:0 "雷忠，字霆均，1901年生于湖南嘉禾普满乡茶坞岭村，抗日战争中阵亡的国民政府军将领。早年曾就读湖南省立第一中学，后入北京大学学习，因国势危急投笔从军，1926年考入黄埔军校第六期步兵科。毕业后在国民革命军中历任排长、连长、营长、团长等职。1937年淞沪会战爆发后，他出任国民政府军事委员会游击第一支队少将司令官，率部在上海浦东及敌后地区开展游击作战，策应正面战场，并组织民众搜集情报、配合抗日。淞沪战局恶化后，他率部突围转入皖北。1938年4月调任皖北军事联络委员兼游击副总指挥，继续在安徽霍邱一带与日军作战。同年秋，日军集中兵力进攻霍邱，雷忠亲临前线督战，中弹阵亡。其事迹收入《抗战军人忠烈录》，后列入抗战殉国将领名录。"
 CBIO_GXC_lei_zhong_desc:0 "雷忠，字霆均，1901年生于湖南嘉禾普满乡茶坞岭村，抗日战争中阵亡的国民政府军将领。早年曾就读湖南省立第一中学，后入北京大学学习，因国势危急投笔从军，1926年考入黄埔军校第六期步兵科。毕业后在国民革命军中历任排长、连长、营长、团长等职。1937年淞沪会战爆发后，他出任国民政府军事委员会游击第一支队少将司令官，率部在上海浦东及敌后地区开展游击作战，策应正面战场，并组织民众搜集情报、配合抗日。淞沪战局恶化后，他率部突围转入皖北。1938年4月调任皖北军事联络委员兼游击副总指挥，继续在安徽霍邱一带与日军作战。同年秋，日军集中兵力进攻霍邱，雷忠亲临前线督战，中弹阵亡。其事迹收入《抗战军人忠烈录》，后列入抗战殉国将领名录。"
 CBIO_HON_oswaldo_lopez_arellano_desc:0 "奥斯瓦尔多·恩里克·洛佩斯·阿雷利亚诺出生于洪都拉斯埃尔帕拉伊索省丹利市，出身望族，就读特古西加尔巴美国人学校，能说流利英语。一九三九年十八岁参军，后毕业于空军军事航空学校，一九四二至一九四五年赴美国亚利桑那州深造航空机械，军衔逐级晋升至将军。一九五六年他是推翻独裁者洛萨诺·迪亚斯军事政变的领导人之一，出任国防部长，比列达·莫拉莱斯就任总统后继续留任。一九六三年十月三日发动政变推翻比列达政府，就任总统至一九七一年；一九七二年再度政变复任总统至一九七五年，任内推行土地改革，并于一九六九年领导“百小时战争”（足球战争）对抗萨尔瓦多。一九七五年因联合果品公司行贿丑闻（“香蕉门”）遭部下政变推翻，此后经商，拥有TAN与SAHSA两家航空公司。二零一零年五月十六日在特古西加尔巴因癌症去世。"
 HON_oswaldo_lopez_arellano_desc:0 "$CBIO_HON_oswaldo_lopez_arellano_desc$"
 CBIO_HON_jose_zuniga_huete_desc:0 "何塞·安赫尔·苏涅加·韦特出生于洪都拉斯耶瓜雷谷圣安东尼奥德奥连特，绰号“昌赫尔”。一九零二年加入自由党青年团，此后因政治迫害多次流亡危地马拉、哥斯达黎加。一九二零年出任特古西加尔巴省长及国民自由党大会主席，一九二四年内战中抵御叛军。一九二九年梅希亚·科林德雷斯就任总统后，派其出任驻尼加拉瓜商务顾问，其间与克莱门蒂娜·特列里亚成婚。他重掌自由党领导权，一九三二年作为总统候选人对阵蒂布尔西奥·卡里亚斯·安迪诺，因选票争议落败，此后流亡墨西哥十六年，即卡里亚斯独裁统治全程，人称“自由主义之狮”，留下名言“自由主义是一支永远年轻的民兵”。一九四八年再度被提名为总统候选人，因担忧选举不公而退选，避入古巴使馆后转赴墨西哥。一九五三年四月一日在墨西哥去世。"
 HON_jose_zuniga_huete_desc:0 "$CBIO_HON_jose_zuniga_huete_desc$"
 CBIO_HON_didier_masson_desc:0 "迪迪尔·马森出生于法国阿涅尔，早年在美国加利福尼亚做特技飞行表演，一九一一年曾创下多项早期飞行纪录。一九一三年墨西哥革命期间受索诺拉州州长佩斯克拉聘请，驾驶“索诺拉”号双翼机为宪政军作战，同年五月三十日与华金·鲍切一同向瓜伊马斯港内军舰投掷自制炸弹，被认为是世界航空史上第一次舰载防空交战。第一次世界大战爆发后，他加入法国拉法耶特志愿航空队，与埃德温·帕森斯、夏尔·农热塞等人并肩作战，曾在座机发动机熄火的情况下仍击落一架敌机。战后返回墨西哥定居并成婚，此后出任泛美航空公司在中美洲机场的经理，兼任法国驻当地领事，直至一九四零年德国入侵法国后离任。一九五零年六月二日在墨西哥尤卡坦州梅里达去世，葬于当地。"
 HON_didier_masson_desc:0 "$CBIO_HON_didier_masson_desc$"
 CBIO_HON_abraham_williams_calderon_desc:0 "亚伯拉罕·威廉姆斯·卡尔德隆出生于洪都拉斯乔卢特卡，一九一九年赴美国麻省理工学院求学，一九二一年在纽约联合学院取得工程学位。回国后加入国民党，一九二四年出任乔卢特卡省省长。一九二九年当选国会议员，一九三二年十二月出任国会议长。同年总统选举中，他与蒂布尔西奥·卡里亚斯·安迪诺搭档当选副总统，一九三三年二月就职，兼任内政与司法部长。“卡里亚斯－威廉姆斯”组合在美国支持下长期主政，他连任副总统直至一九四九年，其间未曾举行新的选举。此后他与国民党决裂，加入全国革新运动，作为该党总统候选人参加一九五四年大选，败于拉蒙·比列达·莫拉莱斯。一九五六年又作为洛萨诺·迪亚斯的副总统候选人搭档参选，但同年十月政变推翻洛萨诺，使其再度与副总统之位失之交臂。一九八六年三月二十四日在乔卢特卡去世。"
 HON_abraham_williams_calderon_desc:0 "$CBIO_HON_abraham_williams_calderon_desc$"
 CBIO_HON_roberto_michelleti_bain_desc:0 "罗伯托·米歇莱蒂·拜恩出生于洪都拉斯约罗省埃尔普罗格雷索，父亲翁贝托·米歇莱蒂是意大利伦巴第移民。一九六三年他是总统比列达·莫拉莱斯私人卫队成员，政变推翻比列达后被捕入狱二十七天。一九七三年移居美国，在坦帕、新奥尔良生活两年并经商，一九七六年返回洪都拉斯。一九八二年当选国会议员，此后连任至二零零九年，其间一度执掌国家电信公司。他两度争取自由党总统候选人提名未成功，二零零六至二零零九年出任国会议长。二零零九年六月二十八日，总统塞拉亚遭军方强制送出国境，国会以一份塞拉亚本人否认签署的“辞职信”为由将其免职，因副总统已于此前辞职参选，按宪法由国会议长米歇莱蒂继任总统，任期至二零一零年一月二十七日。此事件被国际社会普遍视为政变，绝大多数国家拒绝承认其政府合法性。"
 HON_roberto_michelleti_bain_desc:0 "$CBIO_HON_roberto_michelleti_bain_desc$"
 CBIO_HON_juan_b_valladares_desc:0 "胡安·B.·瓦拉达雷斯出生于特古西加尔巴，是研究洪都拉斯历史与家谱的重要学者。他撰写了《苏亚帕圣母》，探讨天主教信仰与国族认同之间的关系；另著有《洪都拉斯历任统治者》（写至比森特·托斯塔为止）、《一九零四年政变》、《洪都拉斯纪事》、《历史碎片》等历史著作，并与拉斐尔·埃利奥多罗·巴列合著《洪都拉斯的黄金》。他长期在国民党内任职，曾当选国会议员，任内反对向特拉铁路公司发放最后一批香蕉、非洲棕榈种植特许权，此立场使其在加尔维斯政府时期被派往西班牙出任大使，任内借机购藏大量书籍充实私人藏书。晚年出任军政府时期文化部长，任内以对不同思想流派保持开放著称。一九九六年去世。"
 HON_juan_b_valladares_desc:0 "$CBIO_HON_juan_b_valladares_desc$"
 CBIO_HON_carlos_alberto_ucles_desc:0 "卡洛斯·阿尔韦托·乌克莱斯出生于特古西加尔巴，与前总统马尔科·奥雷利奥·索托及拉蒙·罗萨沾亲带故。毕业于危地马拉大学法学院，是洪都拉斯浪漫主义文学的重要诗人，一八八零年与友人在特古西加尔巴创办《新闻报》，被视为洪都拉斯自由报业先驱之一。一八八零年任制宪会议议员，参与起草刑事立法。一九零零至一九零二年出任国会议长，一九一五至一九一七年、一九二零年两度出任国立大学校长，一九二二年任外交部长，后任最高法院院长，并曾任驻哥斯达黎加卡塔戈中美洲司法法院法官。晚年将毕生诗文整理成两卷本文集出版。一九四二年一月十五日在特古西加尔巴去世。"
 HON_carlos_alberto_ucles_desc:0 "$CBIO_HON_carlos_alberto_ucles_desc$"
