 RAJ_louis_mountbatten_desc:0 "1900年6月25日生于英国温莎弗罗格莫尔庄园（维多利亚女王曾外孙，爱丁堡亲王菲利普之舅父），1979年8月27日在爱尔兰梅奥郡马拉赫莫尔近海遭爱尔兰共和军炸船身亡，英国海军上将（五星），末任印度总督（1947年3月—1948年6月）兼独立后首任总督（1947年8月—1948年6月），二战东南亚盟军最高司令（1943-1945年）。1943年受丘吉尔任命为东南亚战区最高司令，主持缅甸反攻并监督日本在该战区的最终投降。1947年2月艾德礼政府任命其为末任总督，赋予全权加速独立进程。蒙巴顿主导确定以宗教人口划界的分治方案，将原计划1948年6月的移交日期大幅提前至1947年8月14-15日；亲自主持了英属印度最终分治为印度、巴基斯坦两国的权力移交仪式，并接受独立印度邀请留任首任总督至1948年6月。此后重返英国海军，先后任地中海舰队总司令、帝国参谋总长（1955-1959年）及国防参谋长（1959-1965年）。1979年8月27日，IRA在其私人游艇\"影子五号\"上引爆炸弹，本人及另外三人遇难。"
 CBIO_RAJ_louis_mountbatten_desc:0 "1900年6月25日生于英国温莎弗罗格莫尔庄园（维多利亚女王曾外孙，爱丁堡亲王菲利普之舅父），1979年8月27日在爱尔兰梅奥郡马拉赫莫尔近海遭爱尔兰共和军炸船身亡，英国海军上将（五星），末任印度总督（1947年3月—1948年6月）兼独立后首任总督（1947年8月—1948年6月），二战东南亚盟军最高司令（1943-1945年）。1943年受丘吉尔任命为东南亚战区最高司令，主持缅甸反攻并监督日本在该战区的最终投降。1947年2月艾德礼政府任命其为末任总督，赋予全权加速独立进程。蒙巴顿主导确定以宗教人口划界的分治方案，将原计划1948年6月的移交日期大幅提前至1947年8月14-15日；亲自主持了英属印度最终分治为印度、巴基斯坦两国的权力移交仪式，并接受独立印度邀请留任首任总督至1948年6月。此后重返英国海军，先后任地中海舰队总司令、帝国参谋总长（1955-1959年）及国防参谋长（1959-1965年）。1979年8月27日，IRA在其私人游艇\"影子五号\"上引爆炸弹，本人及另外三人遇难。"
 RAJ_agha_khan_iii_desc:0 "1877年11月2日生于卡拉奇（8岁即位），1957年7月11日卒于瑞士韦尔苏瓦、后葬于埃及阿斯旺尼罗河畔，伊斯玛仪派（尼扎里）第48任伊玛目，72年的伊玛目任期为该教派历史上最长记录，英衔苏丹·穆罕默德·沙赫爵士。1906年率穆斯林代表团谒见印度总督明托勋爵，力主穆斯林单独选区原则，同年在达卡被推选为全印穆斯林联盟首任主席，奠定穆斯林政治独立代议制的制度基础。1930-1932年间率穆斯林代表团出席伦敦三轮圆桌会议，讨论印度宪政前途；1934年起任国际联盟印度代表团成员，1937至1938年担任国际联盟大会主席，成为首位出任该职的非欧洲裔人士。在其领导下于全球伊斯玛仪社区创建逾200所学校（始于1905年东非），并推行现代化教育、自治体制与公共卫生改革。生前经历三次黄金（1936年）、钻石（1946年）和白金（1954年）纪念称重，所得款项全数捐回社区发展基金。其孙卡里姆·阿尔-侯赛尼继任为第49任伊玛目（1957年）。"
 CBIO_RAJ_agha_khan_iii_desc:0 "1877年11月2日生于卡拉奇（8岁即位），1957年7月11日卒于瑞士韦尔苏瓦、后葬于埃及阿斯旺尼罗河畔，伊斯玛仪派（尼扎里）第48任伊玛目，72年的伊玛目任期为该教派历史上最长记录，英衔苏丹·穆罕默德·沙赫爵士。1906年率穆斯林代表团谒见印度总督明托勋爵，力主穆斯林单独选区原则，同年在达卡被推选为全印穆斯林联盟首任主席，奠定穆斯林政治独立代议制的制度基础。1930-1932年间率穆斯林代表团出席伦敦三轮圆桌会议，讨论印度宪政前途；1934年起任国际联盟印度代表团成员，1937至1938年担任国际联盟大会主席，成为首位出任该职的非欧洲裔人士。在其领导下于全球伊斯玛仪社区创建逾200所学校（始于1905年东非），并推行现代化教育、自治体制与公共卫生改革。生前经历三次黄金（1936年）、钻石（1946年）和白金（1954年）纪念称重，所得款项全数捐回社区发展基金。其孙卡里姆·阿尔-侯赛尼继任为第49任伊玛目（1957年）。"
 RAJ_archibald_wavell_desc:0 "1883年5月5日生于英国埃塞克斯郡科尔切斯特，1950年5月24日卒于伦敦（胃穿孔），英国陆军元帅，印度总督（1943年10月—1947年2月），战时后期至独立前夕主持英印政务的关键人物。桑德赫斯特皇家军事学院毕业，布尔战争和一战中积累丰富实战经历，1915年第二次伊普尔战役中右眼被弹片击伤失明，仅余独眼。两战期间深耕战略理论，著有《将帅》等著作，并总结一战巴勒斯坦战役经验。1939年出任中东战区总司令，1940至1941年间在北非指挥对意、德军发动一系列进攻（包括\"罗盘行动\"），占领班加西、俘获意军约十三万人；但随后屡在隆美尔的反击中受挫，1941年7月被丘吉尔以奥钦莱克替换。随即转任印度陆军总司令（1941-1943年），主持缅甸撤退。1943年6月接替林利思戈出任印度总督，任内面临孟加拉大饥荒（1943年约200-300万人饿死）、INA审判政治风波，并在战后寻求与甘地、尼赫鲁等人建立接触渠道；1944年提出\"行政人员计划\"以准备权力过渡，但在政治谈判上屡遭挫折。1947年2月以蒙巴顿替换，随即出任伦敦塔中校等礼仪职务，1950年5月因胃穿孔在伦敦辞世。"
