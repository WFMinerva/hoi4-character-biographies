 RAJ_arjan_singh_vibhusan_desc:0 "1919年4月15日生于旁遮普省莱拉普尔（今巴基斯坦法萨拉巴德），2017年9月16日卒于新德里，印度空军元帅（五星），迄今印度空军唯一获此军衔者，第3任总参谋长（1964年8月—1969年7月），1965年印巴战争期间空军指挥官。1939年19岁以帝国飞行员训练课程学员入克兰威尔受训，受委任后赴西北边境省加入第1飞行中队，二战中率第1中队在缅甸阿拉干前线参战，1944年6月荣获杰出飞行十字勋章，当颁发时由蒙巴顿勋爵亲自主礼。1947年8月15日独立日，亲自带队驾机在德里红堡上空主持历史性百机飞越阅兵式。独立后历任多项要职，以\"保持飞行执照至总参谋长军衔\"著称，驾驶过从二战双翼机到喷气战斗机共逾60个机型。1964年8月1日出任第3任总参谋长，1965年9月战争期间指挥印度空军遂行重要空中作战任务；1966年晋升为空军上将（四星），系IAF首位。退役后出任印度驻瑞士及梵蒂冈大使（1971年）、德里副省长（1989-1990年）。2002年1月26日由纳拉亚南总统正式授予\"印度空军元帅\"五星荣衔，享终身待遇直至2017年9月16日辞世。"
