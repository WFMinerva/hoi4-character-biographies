 RAJ_GOE_j_r_d_tata_desc:0 "1904年7月29日生于法国巴黎，1993年11月29日卒于瑞士日内瓦（肾脏感染），葬于巴黎拉雪兹神父公墓，印度工业家与航空先驱，塔塔集团奠基性领袖，帕西族，父亲Ratanji Dadabhoy Tata为实业家，母亲为法国人苏珊妮·布里耶，故以法语为母语。1929年2月10日取得印度历史上颁发的第一张飞行执照，同年放弃法国国籍入籍印度；1932年10月15日亲自驾驶德哈维兰\"普斯蛾\"型飞机完成印度首次商业航空邮政飞行（卡拉奇-孟买），创立塔塔航空公司。1938年以34岁之龄出任塔塔兄弟公司董事会主席，执掌集团长达五十三年（1938-1991年），期间旗下企业从14家扩展至95家，集团资产从1亿美元增至逾50亿美元，先后创建或参与建立TCS、塔塔汽车、泰坦等。1944年与比拉等人联合起草\"孟买计划\"；1945年与霍米·巴巴共同推动创立塔塔基础研究所。获印度空军多级荣誉军衔（最终为荣誉空军少将，1974年）；1955年获帕德玛·维布尚勋章，1992年获印度最高平民荣誉巴拉特·拉特纳勋章，为极少数获此殊荣的工业家之一。"
 CBIO_RAJ_GOE_j_r_d_tata_desc:0 "1904年7月29日生于法国巴黎，1993年11月29日卒于瑞士日内瓦（肾脏感染），葬于巴黎拉雪兹神父公墓，印度工业家与航空先驱，塔塔集团奠基性领袖，帕西族，父亲Ratanji Dadabhoy Tata为实业家，母亲为法国人苏珊妮·布里耶，故以法语为母语。1929年2月10日取得印度历史上颁发的第一张飞行执照，同年放弃法国国籍入籍印度；1932年10月15日亲自驾驶德哈维兰\"普斯蛾\"型飞机完成印度首次商业航空邮政飞行（卡拉奇-孟买），创立塔塔航空公司。1938年以34岁之龄出任塔塔兄弟公司董事会主席，执掌集团长达五十三年（1938-1991年），期间旗下企业从14家扩展至95家，集团资产从1亿美元增至逾50亿美元，先后创建或参与建立TCS、塔塔汽车、泰坦等。1944年与比拉等人联合起草\"孟买计划\"；1945年与霍米·巴巴共同推动创立塔塔基础研究所。获印度空军多级荣誉军衔（最终为荣誉空军少将，1974年）；1955年获帕德玛·维布尚勋章，1992年获印度最高平民荣誉巴拉特·拉特纳勋章，为极少数获此殊荣的工业家之一。"
 RAJ_GOE_ukkirapandi_muthuramalinga_thevar_desc:0 "1908年10月30日生于泰米尔纳德邦拉曼纳塔普兰县帕松邦村一户地主家庭，1963年10月30日（五十五岁生日当日）在帕松邦病逝，泰米尔政治家、独立运动活动家，以\"帕松邦\"为别称，泰瓦尔/马拉瓦尔社区的精神领袖。幼年丧母，由外祖母抚养，入美国传教士学校受教，后就读马杜赖联合基督教中学，未能完成学业。1927年赴马德拉斯出席国大党年会，结识苏巴斯·钱德拉·鲍斯，深受其激进民族主义思想影响。早年积极抵制英属印度对特定社区实施歧视限制的\"刑事部落法\"，1939年7月8日协助活动家带领不可接触者进入马杜赖米纳克希神庙，力排强硬势力阻挠。1939年追随鲍斯加入全印前进集团，任泰米尔纳德领袖，并创办泰米尔语周刊《内塔吉》宣传鲍斯思想，积极为印度国民军募集青年。1942年参与退出印度运动，屡遭英属当局逮捕。独立后历届人民院选举中三度当选，1952年起任全印前进集团全国副主席，成为泰米尔南部社区的政治核心。其去世之日恰为生日，后人视之为神迹，每年举行\"特瓦尔古鲁祭\"纪念活动。1984年其家乡所在专区以其姓名重命名为帕松邦·穆图拉马林加·特瓦尔专区。"
 CBIO_RAJ_GOE_ukkirapandi_muthuramalinga_thevar_desc:0 "1908年10月30日生于泰米尔纳德邦拉曼纳塔普兰县帕松邦村一户地主家庭，1963年10月30日（五十五岁生日当日）在帕松邦病逝，泰米尔政治家、独立运动活动家，以\"帕松邦\"为别称，泰瓦尔/马拉瓦尔社区的精神领袖。幼年丧母，由外祖母抚养，入美国传教士学校受教，后就读马杜赖联合基督教中学，未能完成学业。1927年赴马德拉斯出席国大党年会，结识苏巴斯·钱德拉·鲍斯，深受其激进民族主义思想影响。早年积极抵制英属印度对特定社区实施歧视限制的\"刑事部落法\"，1939年7月8日协助活动家带领不可接触者进入马杜赖米纳克希神庙，力排强硬势力阻挠。1939年追随鲍斯加入全印前进集团，任泰米尔纳德领袖，并创办泰米尔语周刊《内塔吉》宣传鲍斯思想，积极为印度国民军募集青年。1942年参与退出印度运动，屡遭英属当局逮捕。独立后历届人民院选举中三度当选，1952年起任全印前进集团全国副主席，成为泰米尔南部社区的政治核心。其去世之日恰为生日，后人视之为神迹，每年举行\"特瓦尔古鲁祭\"纪念活动。1984年其家乡所在专区以其姓名重命名为帕松邦·穆图拉马林加·特瓦尔专区。"
 RAJ_shripad_amrit_dange_desc:0 "1899年10月10日生于马哈拉施特拉邦纳西克县卡兰贾翁村一户马拉提婆罗门家庭，1991年5月22日卒于孟买，印度共产党创始人之一，工人运动重要领袖。早年在孟买参与甘地非合作运动后转向马克思主义，1921年出版小册子《甘地与列宁》（立场倾向列宁），引起共产国际注意，在商人洛特瓦拉资助下系统研读马克思主义并创办印度首本社会主义周刊《社会主义者》（1922年）。1924年因\"坎普尔布尔什维克阴谋案\"被捕，1925年参加在坎普尔创立CPI的首届会议。1928年组建棉纺工人革命工会，领导孟买大罢工（1928-1929年），任该工会总书记，随即身陷米鲁特阴谋案审判（1929-1933年），入狱四年。独立后长期掌持全印工会大会，任主席（1943-1945年；1947-1949年）和总书记等职；1957-1962年及1967年当选人民院议员；1962年阿约德·高希辞世后出任CPI主席，力图以亲苏、亲国大党路线整合党内分歧，但随后因在中印战争和国大党关系问题上立场保守，1964年CPI被左翼派别分裂另立CPI（马）。此后继续靠拢国大党并为印迪拉·甘地紧急状态辩护，1978年被撤主席职，1981年被正式开除党籍，随即另立全印共产党。1974年获苏联列宁勋章。"
 CBIO_RAJ_shripad_amrit_dange_desc:0 "1899年10月10日生于马哈拉施特拉邦纳西克县卡兰贾翁村一户马拉提婆罗门家庭，1991年5月22日卒于孟买，印度共产党创始人之一，工人运动重要领袖。早年在孟买参与甘地非合作运动后转向马克思主义，1921年出版小册子《甘地与列宁》（立场倾向列宁），引起共产国际注意，在商人洛特瓦拉资助下系统研读马克思主义并创办印度首本社会主义周刊《社会主义者》（1922年）。1924年因\"坎普尔布尔什维克阴谋案\"被捕，1925年参加在坎普尔创立CPI的首届会议。1928年组建棉纺工人革命工会，领导孟买大罢工（1928-1929年），任该工会总书记，随即身陷米鲁特阴谋案审判（1929-1933年），入狱四年。独立后长期掌持全印工会大会，任主席（1943-1945年；1947-1949年）和总书记等职；1957-1962年及1967年当选人民院议员；1962年阿约德·高希辞世后出任CPI主席，力图以亲苏、亲国大党路线整合党内分歧，但随后因在中印战争和国大党关系问题上立场保守，1964年CPI被左翼派别分裂另立CPI（马）。此后继续靠拢国大党并为印迪拉·甘地紧急状态辩护，1978年被撤主席职，1981年被正式开除党籍，随即另立全印共产党。1974年获苏联列宁勋章。"
 RAJ_karam_singh_mann_desc:0 "生卒年不详，英属印度旁遮普左翼活动家、律师。曾赴伦敦受训为大律师，其间转向共产主义。约1930年代初，他在旁遮普组织会议、安排向农村地区散播左翼宣传，是瑙贾万·巴拉特·萨巴的活动家；当时该组织与遭取缔的印度共产党、基尔提·基桑党并列为旁遮普三大左翼力量。"
 CBIO_RAJ_karam_singh_mann_desc:0 "生卒年不详，英属印度旁遮普左翼活动家、律师。曾赴伦敦受训为大律师，其间转向共产主义。约1930年代初，他在旁遮普组织会议、安排向农村地区散播左翼宣传，是瑙贾万·巴拉特·萨巴的活动家；当时该组织与遭取缔的印度共产党、基尔提·基桑党并列为旁遮普三大左翼力量。"
 RAJ_jim_corbett_desc:0 "1875年7月25日生于英属印度北方省那尼塔尔（父母为爱尔兰裔英国侨民），1955年4月19日卒于肯尼亚奈罗比，全名爱德华·詹姆斯·科比特，英裔印度猎人、博物学家、作家及保育先驱，印度首个国家公园的推动创建者。幼年在库马翁丘陵的森林中自学追踪与识别野生动物，精通当地方言与民俗，当地人尊称他\"地毯萨希布\"。青年时期入孟加拉与西北铁路公司，历任燃料检查员和恒河码头货运承包商（比哈尔邦莫卡梅加特），共约二十年。1907年应北方省政府之请猎杀首头食人虎（查姆帕瓦特母虎，造成印度和尼泊尔逾430人遇难），此后三十余年间奉官方命令猎杀约19头食人虎和14头食人豹，据估共防止约1200人遭害。一战期间以少校军衔率第70库马翁劳工连赴法国前线作战。晚年转型为保育倡导者，弃枪改用相机拍摄野生动物；1936年协助在那尼塔尔附近创建海利国家公园（印度首个国家公园，1957年以其命名为吉姆·科比特国家公园）。1944年出版《库马翁的食人者》，成为国际畅销书，共发行逾25万册、被译为27种语言。1947年印度独立后迁居肯尼亚，1955年4月19日在此卒，享年七十九岁。1968年中南虎（印度支那虎）亚种被命名为\"科比特虎\"。"
 CBIO_RAJ_jim_corbett_desc:0 "1875年7月25日生于英属印度北方省那尼塔尔（父母为爱尔兰裔英国侨民），1955年4月19日卒于肯尼亚奈罗比，全名爱德华·詹姆斯·科比特，英裔印度猎人、博物学家、作家及保育先驱，印度首个国家公园的推动创建者。幼年在库马翁丘陵的森林中自学追踪与识别野生动物，精通当地方言与民俗，当地人尊称他\"地毯萨希布\"。青年时期入孟加拉与西北铁路公司，历任燃料检查员和恒河码头货运承包商（比哈尔邦莫卡梅加特），共约二十年。1907年应北方省政府之请猎杀首头食人虎（查姆帕瓦特母虎，造成印度和尼泊尔逾430人遇难），此后三十余年间奉官方命令猎杀约19头食人虎和14头食人豹，据估共防止约1200人遭害。一战期间以少校军衔率第70库马翁劳工连赴法国前线作战。晚年转型为保育倡导者，弃枪改用相机拍摄野生动物；1936年协助在那尼塔尔附近创建海利国家公园（印度首个国家公园，1957年以其命名为吉姆·科比特国家公园）。1944年出版《库马翁的食人者》，成为国际畅销书，共发行逾25万册、被译为27种语言。1947年印度独立后迁居肯尼亚，1955年4月19日在此卒，享年七十九岁。1968年中南虎（印度支那虎）亚种被命名为\"科比特虎\"。"
 RAJ_elamkulam_manakkal_sakaran_namboodiripad_desc:0 "1909年6月13日生于喀拉拉邦马拉普兰县佩林塔尔纳恩区埃拉姆库拉姆村一户纳布迪里婆罗门家庭，1998年3月19日卒于蒂鲁瓦南塔普兰，印度共产主义政治家、理论家与作家，通称\"EMS\"，喀拉拉邦首任首席部长，印度历史上首位由民主选举产生的共产党政府领袖。就读帕拉卡德维多利亚高中和圣托马斯学院，1932年因参加甘地不合作运动入狱一年。1934年参与创立国大社会党，任联合书记（至1940年），同期加入印度共产党，1937年当选马德拉斯省立法议员。1941年进入CPI中央委员会，1951年进入政治局，并以大量理论著述分析喀拉拉邦的土地与社会问题。1957年4月5日就任喀拉拉邦首任首席部长，领导印度历史上首个经民主选举产生的共产党政府（亦为世界最早的民选共产党政府之一）；任内推行土地改革和教育政策改革，后者激起教会及高种姓阶层大规模抗议，1959年7月31日尼赫鲁中央政府以总统令强制解散其政府（\"解放运动\"）。CPI分裂后（1964年），他率左翼派别另立印度共产党（马克思主义），1967年再次出任首席部长、领导七党联合政府，1969年联合政府因内部分歧瓦解。1977-1992年任CPI总书记，持续发挥理论权威；1991年正式退出活动政治，但笔耕不辍，直至去世前数小时仍在撰写报刊文章。1998年3月19日在蒂鲁瓦南塔普兰医院病逝，享年88岁。"
 CBIO_RAJ_elamkulam_manakkal_sakaran_namboodiripad_desc:0 "1909年6月13日生于喀拉拉邦马拉普兰县佩林塔尔纳恩区埃拉姆库拉姆村一户纳布迪里婆罗门家庭，1998年3月19日卒于蒂鲁瓦南塔普兰，印度共产主义政治家、理论家与作家，通称\"EMS\"，喀拉拉邦首任首席部长，印度历史上首位由民主选举产生的共产党政府领袖。就读帕拉卡德维多利亚高中和圣托马斯学院，1932年因参加甘地不合作运动入狱一年。1934年参与创立国大社会党，任联合书记（至1940年），同期加入印度共产党，1937年当选马德拉斯省立法议员。1941年进入CPI中央委员会，1951年进入政治局，并以大量理论著述分析喀拉拉邦的土地与社会问题。1957年4月5日就任喀拉拉邦首任首席部长，领导印度历史上首个经民主选举产生的共产党政府（亦为世界最早的民选共产党政府之一）；任内推行土地改革和教育政策改革，后者激起教会及高种姓阶层大规模抗议，1959年7月31日尼赫鲁中央政府以总统令强制解散其政府（\"解放运动\"）。CPI分裂后（1964年），他率左翼派别另立印度共产党（马克思主义），1967年再次出任首席部长、领导七党联合政府，1969年联合政府因内部分歧瓦解。1977-1992年任CPI总书记，持续发挥理论权威；1991年正式退出活动政治，但笔耕不辍，直至去世前数小时仍在撰写报刊文章。1998年3月19日在蒂鲁瓦南塔普兰医院病逝，享年88岁。"
 RAJ_GOE_tara_singh_desc:0 "1885年6月24日生于英属印度旁遮普罗尔品第区哈里亚尔村一户印度教家庭（幼名纳纳克·昌德，十六岁皈依锡克教，赐名塔拉·辛格），1967年11月22日卒于昌迪加尔，锡克教最重要的20世纪政治与宗教领袖，通称\"大师\"。1907年毕业于阿姆利则卡尔萨学院，入锡克学校执教，\"大师\"称号由此沿用终生。1920年参与共同创建锡克教总庙委员会和锡克阿卡利党——二者成为锡克宗教与政治事务的双核机构，此后长达四十年间（1930-1962年间大部分时段）他同时掌控SGPC主席与阿卡利达领袖两职，推动通过《1925年神庙管理法》，将锡克神庙从马汉特（守庙世袭僧侣）手中收归社区自治。1930年积极响应甘地不合作运动，首度系狱。1940年5月，面对穆斯林联盟《拉合尔决议》，他率先公开反对（比国大党早两年），并誓言\"以牙还牙\"抵制巴基斯坦方案；1947年印巴分治期间，他引导锡克人抵制，力争在东旁遮普形成锡克多数区域。独立后长期领导\"旁遮普语邦\"运动，主张按语言重划省界以保全锡克文化认同。1961年8月在金庙开始绝食，要求尼赫鲁成立旁遮普语邦，历时48天后因接受尼赫鲁书面保证而终止，遭锡克教最高宗教法庭判定违誓，声望大损，被圣徒法塔赫·辛格取代领袖地位。其推动的旁遮普语邦于1966年最终实现，但他于1967年卒前未能亲见。一生因公民不服从被捕14次（1930-1966年）。"
 CBIO_RAJ_GOE_tara_singh_desc:0 "1885年6月24日生于英属印度旁遮普罗尔品第区哈里亚尔村一户印度教家庭（幼名纳纳克·昌德，十六岁皈依锡克教，赐名塔拉·辛格），1967年11月22日卒于昌迪加尔，锡克教最重要的20世纪政治与宗教领袖，通称\"大师\"。1907年毕业于阿姆利则卡尔萨学院，入锡克学校执教，\"大师\"称号由此沿用终生。1920年参与共同创建锡克教总庙委员会和锡克阿卡利党——二者成为锡克宗教与政治事务的双核机构，此后长达四十年间（1930-1962年间大部分时段）他同时掌控SGPC主席与阿卡利达领袖两职，推动通过《1925年神庙管理法》，将锡克神庙从马汉特（守庙世袭僧侣）手中收归社区自治。1930年积极响应甘地不合作运动，首度系狱。1940年5月，面对穆斯林联盟《拉合尔决议》，他率先公开反对（比国大党早两年），并誓言\"以牙还牙\"抵制巴基斯坦方案；1947年印巴分治期间，他引导锡克人抵制，力争在东旁遮普形成锡克多数区域。独立后长期领导\"旁遮普语邦\"运动，主张按语言重划省界以保全锡克文化认同。1961年8月在金庙开始绝食，要求尼赫鲁成立旁遮普语邦，历时48天后因接受尼赫鲁书面保证而终止，遭锡克教最高宗教法庭判定违誓，声望大损，被圣徒法塔赫·辛格取代领袖地位。其推动的旁遮普语邦于1966年最终实现，但他于1967年卒前未能亲见。一生因公民不服从被捕14次（1930-1966年）。"
 RAJ_orde_wingate_desc:0 "1903年2月26日生于英属印度北方省那尼塔尔（军人世家，虔诚普利茅斯弟兄会背景），1944年3月24日在印度比什努布尔附近因运输机坠毁身亡，英国陆军少将，钦迪特特种部队创建者，二战最具争议的非正统战术理论家之一。查特豪斯学校和伍尔维奇皇家军事学院毕业，1923年以皇家炮兵少尉受委任，先后在苏丹和利比亚沙漠（1928-1933年）服役。1936-1939年在巴勒斯坦任情报军官，组建英犹联合\"特别夜间突击队\"，以长程渗透战术打击阿拉伯武装，为其游击战理论奠基；同期强烈认同犹太复国主义。1941年在埃塞俄比亚策划并指挥吉迪恩部队（英军、埃塞俄比亚军和苏丹军混编），以约1700人迫使约2万意大利守军投降，还原海尔·塞拉西帝位，获DSO勋扣，随后因患疟疾及抑郁症在开罗试图割喉自尽未死。1942年赴印度，1943年2月率第77印度步兵旅（即\"钦迪特\"，名称来自缅甸神话守护狮\"钦特\"）深入缅甸敌后，实施\"手电筒行动\"，切断铁路补给线，约3000人入缅、2182人返回；1944年3月主持大规模空降行动\"周四行动\"，再次深入缅甸腹地。1944年3月24日因B-25飞机在操作期间失事，连同机上9名乘员全部罹难。丘吉尔称他为\"天才之人\"；军事史学界则对其实际战略效益存持续争议。"
