 RAJ_aspy_merwan_engineer_desc:0 "1912年12月15日生于英属印度旁遮普省拉合尔，2002年5月1日卒于加利福尼亚，印度空军空军元帅，第四任印度籍总参谋长（1960年12月1日—1964年7月31日）。17岁时（1930年）以副驾驶随友驾机由卡拉奇飞抵伦敦克罗伊登机场，成为首批由印度飞赴英国的印度人之一；同年独自驾驶吉普赛飞蛾由伦敦飞回卡拉奇，以约六周时间完成全程，夺得阿加汗奖（设立用于奖励首位独自完成英印飞越的印度飞行员），中途受困埃及阿布基尔时恰遇同样参赛的J.R.D.塔塔赠给其备用火花塞、方得以续航，留下印度民航与军航两大先驱相遇的佳话。随后入克兰威尔皇家空军学院受训，在校期间荣获格罗夫斯纪念奖（特技飞行最佳奖），并成为首位在紧急情况下使用降落伞跳伞逃生的印度飞行员。1942年12月荣获杰出飞行十字勋章，系IAF第二位DFC获得者。独立后在克什米尔战役中以大队长军衔参与作战；此后历任要职，1958-1960年出任印度斯坦航空公司总经理，主导了HAL首款国产喷气教练机\"马鲁特\"的早期开发工作。1960年11月穆克吉在东京猝亡后，工程师于12月1日接任总参谋长，任内主持1961年果阿解放中的IAF行动，并在1962年中印战争中力主投入战斗编队应战，但遭政府否决，仅以运输机支援前线。退役后任印度驻伊朗大使，晚年移居加州并创建加利福尼亚祆教中心。"
