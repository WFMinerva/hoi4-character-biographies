 CBIO_RAJ_umed_singh_desc:0 "1903年7月8日生于焦特布尔，1947年6月9日卒于拉贾斯坦阿布山湖畔别墅，印度焦特布尔土邦大君（在位1918—1947）。拉托雷拉其普特王族出身，1918年年仅十五岁即位，1923年亲政。在位期间大力推进焦特布尔现代化：兴建乌梅德·巴旺宫（1929年动工、1943年竣工，聘请英国建筑师兰切斯特设计，装饰艺术风格，动用三千余名工人以赈济饥荒之名修建，建成后成为世界最大私人宅邸之一）、改善铁路和公路系统、设立学校和医院。二战期间焦特布尔军队参加英军在中东和北非的作战。1947年6月9日因病在阿布山去世，距印度独立仅两月有余，享年四十三岁。其子韩旺特·辛格继位后，在萨达尔·帕特尔斡旋下于同年8月签署加入印度联邦的合并文书；韩旺特·辛格后于1952年在一次飞行事故中罹难。"
 RAJ_umed_singh_desc:0 "1903年7月8日生于焦特布尔，1947年6月9日卒于拉贾斯坦阿布山湖畔别墅，印度焦特布尔土邦大君（在位1918—1947）。拉托雷拉其普特王族出身，1918年年仅十五岁即位，1923年亲政。在位期间大力推进焦特布尔现代化：兴建乌梅德·巴旺宫（1929年动工、1943年竣工，聘请英国建筑师兰切斯特设计，装饰艺术风格，动用三千余名工人以赈济饥荒之名修建，建成后成为世界最大私人宅邸之一）、改善铁路和公路系统、设立学校和医院。二战期间焦特布尔军队参加英军在中东和北非的作战。1947年6月9日因病在阿布山去世，距印度独立仅两月有余，享年四十三岁。其子韩旺特·辛格继位后，在萨达尔·帕特尔斡旋下于同年8月签署加入印度联邦的合并文书；韩旺特·辛格后于1952年在一次飞行事故中罹难。"
 CBIO_RAJ_huseyn_shaheed_suhrawardy_desc:0 "1892年9月8日生于孟加拉米德纳普尔（今西孟加拉邦）一户孟加拉穆斯林上层家庭（父为法官），1963年12月5日卒于贝鲁特，孟加拉裔政治家，巴基斯坦第五任总理。毕业于加尔各答圣泽维尔学院与牛津大学，返回印度后加入穆斯林联盟并进入孟加拉省政坛。1937至1941年任孟加拉省劳工部长；1946年4月至1947年8月任孟加拉省省长（首席部长），任内发生1946年8月16日加尔各答大屠杀（\"直接行动日\"），穆斯林联盟发起的示威演变为教派仇杀，三天内约四千人死亡，他因未能及时制止暴力而广受指责，史学界对其责任仍有争论。印巴分治后移居巴基斯坦，1956年9月12日至1957年10月17日出任巴基斯坦总理，在位仅十三个月即被总统伊斯坎德尔·米尔扎解职。此后遭阿尤布·汗军政府软禁，1963年在贝鲁特流亡期间去世，死因官方记录为心脏病，但其支持者一直质疑存在谋杀嫌疑。"
 RAJ_huseyn_shaheed_suhrawardy_desc:0 "1892年9月8日生于孟加拉米德纳普尔（今西孟加拉邦）一户孟加拉穆斯林上层家庭（父为法官），1963年12月5日卒于贝鲁特，孟加拉裔政治家，巴基斯坦第五任总理。毕业于加尔各答圣泽维尔学院与牛津大学，返回印度后加入穆斯林联盟并进入孟加拉省政坛。1937至1941年任孟加拉省劳工部长；1946年4月至1947年8月任孟加拉省省长（首席部长），任内发生1946年8月16日加尔各答大屠杀（\"直接行动日\"），穆斯林联盟发起的示威演变为教派仇杀，三天内约四千人死亡，他因未能及时制止暴力而广受指责，史学界对其责任仍有争论。印巴分治后移居巴基斯坦，1956年9月12日至1957年10月17日出任巴基斯坦总理，在位仅十三个月即被总统伊斯坎德尔·米尔扎解职。此后遭阿尤布·汗军政府软禁，1963年在贝鲁特流亡期间去世，死因官方记录为心脏病，但其支持者一直质疑存在谋杀嫌疑。"
 CBIO_RAJ_bodh_chandra_singh_desc:0 "1908年（一说1909年）生于因帕尔，1955年12月9日卒于因帕尔，曼尼普尔王国第七十六代暨末代大君（在位1941—1949）。其父为丘拉昌德大君，少年就读于阿杰梅尔的梅奥公学。1941年9月23日因兄长退位而继位，1944年在坎格拉宫正式加冕，时值二战缅甸战役高峰。1944年3月日军发动英帕尔战役，曼尼普尔沦为盟军与日军主战场，博德·钱德拉配合英印军提供后勤与行政支援。1947年8月11日签署加入印度的合并文书，同年8月15日在坎格拉升起曼尼普尔邦旗。此后推行政治改革，1947年颁布《曼尼普尔邦宪法法案》，1948年7至8月举行南亚最早的民主选举之一，10月18日开设邦议会。1949年9月21日他在西隆签署合并协议，曼尼普尔作为独立王国正式终结（此后以虚衔大君身份留居因帕尔），1955年去世。"
 RAJ_bodh_chandra_singh_desc:0 "1908年（一说1909年）生于因帕尔，1955年12月9日卒于因帕尔，曼尼普尔王国第七十六代暨末代大君（在位1941—1949）。其父为丘拉昌德大君，少年就读于阿杰梅尔的梅奥公学。1941年9月23日因兄长退位而继位，1944年在坎格拉宫正式加冕，时值二战缅甸战役高峰。1944年3月日军发动英帕尔战役，曼尼普尔沦为盟军与日军主战场，博德·钱德拉配合英印军提供后勤与行政支援。1947年8月11日签署加入印度的合并文书，同年8月15日在坎格拉升起曼尼普尔邦旗。此后推行政治改革，1947年颁布《曼尼普尔邦宪法法案》，1948年7至8月举行南亚最早的民主选举之一，10月18日开设邦议会。1949年9月21日他在西隆签署合并协议，曼尼普尔作为独立王国正式终结（此后以虚衔大君身份留居因帕尔），1955年去世。"
 CBIO_RAJ_maharaja_hari_singh_desc:0 "1895年9月23日生于查谟，1961年4月26日卒于孟买，查谟与克什米尔土邦末代大君（在位1925—1949），多格拉拉其普特王族。1915年毕业于梅奥公学和阿杰梅尔帝国骑兵军官学校，一战期间随军赴法国前线任侍从参谋。1925年继叔父普拉塔普·辛格之后即位，在位期间推行基础设施建设与教育改革，但拒绝向印穆居民开放充分政治参与。1947年8月英国撤离时他试图维持独立地位，既不加入印度也不加入巴基斯坦。1947年10月22日巴基斯坦支持的部落武装入侵克什米尔，兵临斯利那加，他在紧急情况下于10月26日签署加入印度的合并文书，印度空降部队次日抵达，第一次印巴战争随即爆发。1949年他离开克什米尔前往孟买，任命儿子卡兰·辛格为摄政，此后实权旁落，1961年在孟买病逝。克什米尔问题的根源与他延宕决断密切相关。"
 RAJ_maharaja_hari_singh_desc:0 "1895年9月23日生于查谟，1961年4月26日卒于孟买，查谟与克什米尔土邦末代大君（在位1925—1949），多格拉拉其普特王族。1915年毕业于梅奥公学和阿杰梅尔帝国骑兵军官学校，一战期间随军赴法国前线任侍从参谋。1925年继叔父普拉塔普·辛格之后即位，在位期间推行基础设施建设与教育改革，但拒绝向印穆居民开放充分政治参与。1947年8月英国撤离时他试图维持独立地位，既不加入印度也不加入巴基斯坦。1947年10月22日巴基斯坦支持的部落武装入侵克什米尔，兵临斯利那加，他在紧急情况下于10月26日签署加入印度的合并文书，印度空降部队次日抵达，第一次印巴战争随即爆发。1949年他离开克什米尔前往孟买，任命儿子卡兰·辛格为摄政，此后实权旁落，1961年在孟买病逝。克什米尔问题的根源与他延宕决断密切相关。"
 CBIO_RAJ_chithira_thirunal_balarma_varma_desc:0 "1912年11月7日生于特拉凡科尔王室（排灯节当日），1991年7月20日卒于特里凡得琅，印度南部特拉凡科尔土邦末代在位大君（在位1924—1949），按母系继承制于十二岁即位，1931年11月6日亲政。其统治以社会改革著称：1936年11月12日颁布\"寺庙开放公告\"，废除不可接触者禁入印度教寺庙的禁令，被甘地赞誉为\"历史性奇迹\"，成为喀拉拉乃至全印种姓平权的里程碑。在位期间创办特拉凡科尔大学（今喀拉拉大学，1937年）、特里凡得琅国际机场、帕利瓦萨尔水电站及多家化工国企，推动了特拉凡科尔的工业化。其首席大臣C·P·拉马斯瓦米·艾耶尔长期把持实权，1946年彭纳普拉-瓦亚拉尔工人起义遭军事镇压，数百人死亡，是其执政的负面一页。1947年独立时一度宣布特拉凡科尔独立，后在印度政府压力下签署合并文书。1949年至1956年出任特拉凡科尔-科钦联合邦首任拉杰普拉穆克。1971年被英迪拉·甘地政府废除王室特权。1991年中风后去世。"
 RAJ_chithira_thirunal_balarma_varma_desc:0 "1912年11月7日生于特拉凡科尔王室（排灯节当日），1991年7月20日卒于特里凡得琅，印度南部特拉凡科尔土邦末代在位大君（在位1924—1949），按母系继承制于十二岁即位，1931年11月6日亲政。其统治以社会改革著称：1936年11月12日颁布\"寺庙开放公告\"，废除不可接触者禁入印度教寺庙的禁令，被甘地赞誉为\"历史性奇迹\"，成为喀拉拉乃至全印种姓平权的里程碑。在位期间创办特拉凡科尔大学（今喀拉拉大学，1937年）、特里凡得琅国际机场、帕利瓦萨尔水电站及多家化工国企，推动了特拉凡科尔的工业化。其首席大臣C·P·拉马斯瓦米·艾耶尔长期把持实权，1946年彭纳普拉-瓦亚拉尔工人起义遭军事镇压，数百人死亡，是其执政的负面一页。1947年独立时一度宣布特拉凡科尔独立，后在印度政府压力下签署合并文书。1949年至1956年出任特拉凡科尔-科钦联合邦首任拉杰普拉穆克。1971年被英迪拉·甘地政府废除王室特权。1991年中风后去世。"
 RAJ_freeman_freeman_thomas_desc:0 "1866年9月12日生于英格兰苏塞克斯，1941年8月12日卒于伦敦，英国自由党政治家，第一代威灵登侯爵。剑桥大学毕业后入仕，历任自由党国会议员、孟买省督（1913—1918）、马德拉斯省督（1919—1924）、加拿大总督（1926—1931）。1931年4月18日至1936年4月18日出任印度总督，任期正值国大党大规模不合作运动。他下令逮捕甘地及数万名国大党人，镇压食盐进军运动，同时与国大党温和派展开圆桌会议谈判。任内通过《1935年印度政府法案》，扩大省级自治与选举权，奠定了印度走向自治领的法律框架。1936年卸任回国后受封侯爵，1941年在伦敦去世。"
 CBIO_RAJ_freeman_freeman_thomas_desc:0 "1866年9月12日生于英格兰苏塞克斯，1941年8月12日卒于伦敦，英国自由党政治家，第一代威灵登侯爵。剑桥大学毕业后入仕，历任自由党国会议员、孟买省督（1913—1918）、马德拉斯省督（1919—1924）、加拿大总督（1926—1931）。1931年4月18日至1936年4月18日出任印度总督，任期正值国大党大规模不合作运动。他下令逮捕甘地及数万名国大党人，镇压食盐进军运动，同时与国大党温和派展开圆桌会议谈判。任内通过《1935年印度政府法案》，扩大省级自治与选举权，奠定了印度走向自治领的法律框架。1936年卸任回国后受封侯爵，1941年在伦敦去世。"
 CBIO_RAJ_pratap_singh_rao_gaekwad_desc:0 "1908年6月29日生于巴罗达，盖克瓦德王朝马拉塔家族出身，巴罗达土邦大君（在位1939—1951）。1939年继其祖父萨亚吉拉奥三世之后即位。在位期间推动教育和社会福利事业，延续了巴罗达作为印度进步土邦的传统。1947年独立后签署加入印度联邦的合并文书，1949年巴罗达并入孟买邦。1951年印度政府以行政不当为由宣布废黜他的统治权，他此后离开印度，长居欧洲（主要在摩纳哥）。"
 RAJ_pratap_singh_rao_gaekwad_desc:0 "1908年6月29日生于巴罗达，盖克瓦德王朝马拉塔家族出身，巴罗达土邦大君（在位1939—1951）。1939年继其祖父萨亚吉拉奥三世之后即位。在位期间推动教育和社会福利事业，延续了巴罗达作为印度进步土邦的传统。1947年独立后签署加入印度联邦的合并文书，1949年巴罗达并入孟买邦。1951年印度政府以行政不当为由宣布废黜他的统治权，他此后离开印度，长居欧洲（主要在摩纳哥）。"
 RAJ_lord_linlithgow_desc:0 "1887年9月24日生于苏格兰南昆斯费里霍普敦庄园，1952年1月5日卒于同地，英国统一党政治家，第二代林利思戈侯爵，原名维克托·亚历山大·约翰·霍普。1936年4月至1943年10月出任印度总督，任期长达七年半，是任职时间最长的印度总督。1939年9月未经咨询印度各方便宣布英属印度对德宣战，引发国大党全部省级内阁辞职。1942年8月国大党通过\"退出印度\"决议后，他下令在全国范围内逮捕甘地、尼赫鲁及全体国大党领导层，镇压随之爆发的大规模暴动。1943年孟加拉大饥荒期间，他的应对措施因迟缓与不力备受批评，据估计死亡人数达二百万至三百万。1943年10月由韦维尔接任后返英。"
 CBIO_RAJ_lord_linlithgow_desc:0 "1887年9月24日生于苏格兰南昆斯费里霍普敦庄园，1952年1月5日卒于同地，英国统一党政治家，第二代林利思戈侯爵，原名维克托·亚历山大·约翰·霍普。1936年4月至1943年10月出任印度总督，任期长达七年半，是任职时间最长的印度总督。1939年9月未经咨询印度各方便宣布英属印度对德宣战，引发国大党全部省级内阁辞职。1942年8月国大党通过\"退出印度\"决议后，他下令在全国范围内逮捕甘地、尼赫鲁及全体国大党领导层，镇压随之爆发的大规模暴动。1943年孟加拉大饥荒期间，他的应对措施因迟缓与不力备受批评，据估计死亡人数达二百万至三百万。1943年10月由韦维尔接任后返英。"
 CBIO_RAJ_mir_osman_ali_khan_desc:0 "1886年4月6日生于海得拉巴，1967年2月24日卒于海得拉巴，海得拉巴土邦末代尼扎姆（在位1911—1948），阿萨夫·贾赫王朝第七代君主，一度被《时代》杂志称为\"世界首富\"。1911年即位后大力发展海得拉巴的铁路、灌溉和教育系统，创办奥斯曼尼亚大学（1918年），使海得拉巴成为英属印度面积最大、人口最多的土邦。然而他以穆斯林少数族裔统治印度教多数人口，社会矛盾深重。1947年独立时他拒绝加入印度或巴基斯坦，宣布海得拉巴独立。1948年9月印度发动代号\"波罗行动\"的军事干预，印军在五天内攻入海得拉巴并迫使尼扎姆投降。此后他出任海得拉巴邦拉杰普拉穆克至1956年。晚年生活俭朴近于吝啬，1967年去世时留下大量珍宝（包括镇库的雅各布钻石）。"
 RAJ_mir_osman_ali_khan_desc:0 "1886年4月6日生于海得拉巴，1967年2月24日卒于海得拉巴，海得拉巴土邦末代尼扎姆（在位1911—1948），阿萨夫·贾赫王朝第七代君主，一度被《时代》杂志称为\"世界首富\"。1911年即位后大力发展海得拉巴的铁路、灌溉和教育系统，创办奥斯曼尼亚大学（1918年），使海得拉巴成为英属印度面积最大、人口最多的土邦。然而他以穆斯林少数族裔统治印度教多数人口，社会矛盾深重。1947年独立时他拒绝加入印度或巴基斯坦，宣布海得拉巴独立。1948年9月印度发动代号\"波罗行动\"的军事干预，印军在五天内攻入海得拉巴并迫使尼扎姆投降。此后他出任海得拉巴邦拉杰普拉穆克至1956年。晚年生活俭朴近于吝啬，1967年去世时留下大量珍宝（包括镇库的雅各布钻石）。"
 CBIO_RAJ_v_d_savarkar_desc:0 "1883年5月28日生于马哈拉施特拉邦巴古尔一户齐特帕万婆罗门家庭，1966年2月26日在孟买以绝食方式自行了断一生，印度教民族主义理论家、独立运动者与争议政治人物。1906年赴伦敦学法律，在印度之家组织革命活动，1909年著《1857年印度独立战争》（遭英国查禁），1910年以煽动罪被捕，1911年被流放安达曼群岛蜂窝监狱，十年间多次向英方递交请愿书求释。1924年附条件释放，此后定居拉特纳吉里，1937年恢复自由。他于1923年在狱中撰写《印度教特性》，提出\"印度教性\"概念，主张印度应建为印度教国家，为后来印度教民族主义运动奠定理论基础。1937至1943年任印度教大会主席，反对国大党的世俗主义和穆斯林联盟的分治主张。1948年甘地遇刺后，刺客戈德塞为其追随者，萨瓦尔卡被控为幕后共谋但因证据不足获判无罪，此案至今争议不断。"
 RAJ_v_d_savarkar_desc:0 "1883年5月28日生于马哈拉施特拉邦巴古尔一户齐特帕万婆罗门家庭，1966年2月26日在孟买以绝食方式自行了断一生，印度教民族主义理论家、独立运动者与争议政治人物。1906年赴伦敦学法律，在印度之家组织革命活动，1909年著《1857年印度独立战争》（遭英国查禁），1910年以煽动罪被捕，1911年被流放安达曼群岛蜂窝监狱，十年间多次向英方递交请愿书求释。1924年附条件释放，此后定居拉特纳吉里，1937年恢复自由。他于1923年在狱中撰写《印度教特性》，提出\"印度教性\"概念，主张印度应建为印度教国家，为后来印度教民族主义运动奠定理论基础。1937至1943年任印度教大会主席，反对国大党的世俗主义和穆斯林联盟的分治主张。1948年甘地遇刺后，刺客戈德塞为其追随者，萨瓦尔卡被控为幕后共谋但因证据不足获判无罪，此案至今争议不断。"
