 CBIO_RAJ_mahatma_mohandas_gandhi_desc:0 "1869年10月2日生于古吉拉特波尔班达尔一户印度教巴尼亚种姓家庭，1948年1月30日在新德里比尔拉公馆祈祷会上被印度教极端分子纳图拉姆·戈德塞枪杀，印度独立运动的最高领袖、非暴力不合作理论的集大成者。1888年赴伦敦学法律，1893至1914年在南非领导印度侨民反种族歧视斗争，形成\"坚持真理\"抗争方法。1915年回国，1920年起主导国大党路线，先后发起非合作运动（1920—1922）、食盐进军（1930）、退出印度运动（1942），屡遭英殖民当局逮捕入狱，累计被监禁约六年半。他倡导手纺土布运动以实现经济自主，推动废除\"不可接触者\"制度，主张印度教与穆斯林团结。1947年印巴分治期间他赴加尔各答与德里以绝食平息教派仇杀，但未能阻止分治本身。1948年1月30日遇刺身亡，举国哀悼。其非暴力思想深刻影响了马丁·路德·金、曼德拉等后世民权领袖，印度尊其为\"国父\"。"
