 RAJ_herbert_fitzherbert_desc:0 "1885年8月10日生于英格兰德文郡金斯威尔，1958年10月30日卒，英国皇家海军上将，皇家印度海军第三任司令（1937-1943年）。1900年入皇家海军HMS不列颠尼亚舰受训，1905年受委任。一战中任杰利科元帅旗舰旗舰副官，参加1916年5月日德兰海战，获法国荣誉军团勋章、俄国圣安娜勋章和CMG勋章；1917年晋海军准将，1924年晋上校。战间期先后指挥HMS考文垂号轻巡洋舰（地中海舰队）和HMS德文郡号重巡洋舰，并任第一海务大臣海军助理及帝国国防学院学员。1936年晋少将，1937年11月获任皇家印度海军司令，时该海军仅有8艘舰艇、规模有限；在任期间主导战时扩编，使其参与大西洋护航、印度洋反潜及中东物资运输等任务，舰艇数量大幅增加；1939年晋中将，1941年获KCIE爵位，1943年6月21日退役并晋升上将。"
 CBIO_RAJ_herbert_fitzherbert_desc:0 "1885年8月10日生于英格兰德文郡金斯威尔，1958年10月30日卒，英国皇家海军上将，皇家印度海军第三任司令（1937-1943年）。1900年入皇家海军HMS不列颠尼亚舰受训，1905年受委任。一战中任杰利科元帅旗舰旗舰副官，参加1916年5月日德兰海战，获法国荣誉军团勋章、俄国圣安娜勋章和CMG勋章；1917年晋海军准将，1924年晋上校。战间期先后指挥HMS考文垂号轻巡洋舰（地中海舰队）和HMS德文郡号重巡洋舰，并任第一海务大臣海军助理及帝国国防学院学员。1936年晋少将，1937年11月获任皇家印度海军司令，时该海军仅有8艘舰艇、规模有限；在任期间主导战时扩编，使其参与大西洋护航、印度洋反潜及中东物资运输等任务，舰艇数量大幅增加；1939年晋中将，1941年获KCIE爵位，1943年6月21日退役并晋升上将。"
 RAJ_GOE_g_d_birla_desc:0 "1894年4月10日生于拉贾斯坦邦皮拉尼镇一户马尔瓦里商人家庭，1983年6月11日卒于加尔各答，印度独立前后最具影响力的工业家，比拉商业帝国奠基人。第一次世界大战期间趁英方物资短缺之机，1918年在加尔各答创建比拉黄麻纺织厂，打破欧洲商人垄断；1919年以500万卢比成立比拉兄弟公司，并在瓜廖尔设厂。此后向棉纺、造纸、制糖、水泥、化工、汽车（印度斯坦汽车，1940年代）等多领域扩张。1926年当选英属印度中央立法会议议员；1927年与人共同创立印度工商联合会。1916年初识甘地并与之建立深厚私谊，长期资助国大党和独立运动，充任甘地与英国政府之间的沟通渠道；1948年1月30日，甘地即是在其新德里宅邸（比拉公馆）遇刺，此前已在此居住逾四个月。1942年主导创建联合商业银行；1943年创办比拉工程学院；1944年与塔塔等人联合起草\"孟买计划\"，规划战后印度经济自立路线图。1957年获帕德玛·维布尚勋章（印度第二高平民荣誉），享年89岁。"
 CBIO_RAJ_GOE_g_d_birla_desc:0 "1894年4月10日生于拉贾斯坦邦皮拉尼镇一户马尔瓦里商人家庭，1983年6月11日卒于加尔各答，印度独立前后最具影响力的工业家，比拉商业帝国奠基人。第一次世界大战期间趁英方物资短缺之机，1918年在加尔各答创建比拉黄麻纺织厂，打破欧洲商人垄断；1919年以500万卢比成立比拉兄弟公司，并在瓜廖尔设厂。此后向棉纺、造纸、制糖、水泥、化工、汽车（印度斯坦汽车，1940年代）等多领域扩张。1926年当选英属印度中央立法会议议员；1927年与人共同创立印度工商联合会。1916年初识甘地并与之建立深厚私谊，长期资助国大党和独立运动，充任甘地与英国政府之间的沟通渠道；1948年1月30日，甘地即是在其新德里宅邸（比拉公馆）遇刺，此前已在此居住逾四个月。1942年主导创建联合商业银行；1943年创办比拉工程学院；1944年与塔塔等人联合起草\"孟买计划\"，规划战后印度经济自立路线图。1957年获帕德玛·维布尚勋章（印度第二高平民荣誉），享年89岁。"
 RAJ_GOE_ivar_kreuge_desc:0 "1880年3月2日生于瑞典卡尔马，1932年3月12日卒于巴黎（枪伤，官方认定自杀），瑞典土木工程师与实业家，绰号\"火柴大王\"。工程学毕业后赴美，曾参与纽约熨斗大厦等工程建设，1908年返回瑞典与保罗·托尔联合创建建筑公司。1913年进军火柴业，1917年整合瑞典各火柴厂成立瑞典火柴公司，此后以向各国政府提供美元贷款换取火柴生产垄断权的模式，将商业帝国扩展至欧洲、美洲及亚洲（含英属印度在内的各殖民地市场），鼎盛时期掌控全球约三分之二至四分之三的火柴产量。旗下另控制多家银行、矿山、纸浆工厂及爱立信电话公司主要股权。1929年大萧条后资金链断裂，1932年3月审计发现其账目充斥虚假资产，帝国破产规模为历史之最。克鲁格于同年3月12日在巴黎公寓以手枪自尽，身后调查揭示其财务帝国本质上为以新债还旧债的庞氏骗局。（本条目人物卒于1932年，早于游戏时代背景，系历史人物追记。）"
