 RAJ_GOE_prescott_bush_desc:0 "1895年5月15日生于美国俄亥俄州哥伦布市，1972年10月8日卒于纽约市（肺癌），美国投资银行家、共和党政治家，美国参议员（康涅狄格州，1952-1963年），布什政治世家奠基人，小布什总统（第41任）之父、乔治·沃克·布什总统（第43任）之祖父。耶鲁大学毕业，一战以炮兵上尉赴法参战，后加入华尔街投资业。1931年成为布朗兄弟哈里曼公司合伙人，该公司与西德国业主弗里茨·蒂森家族有密切资金往来，1942年联合银行公司相关资产依《与敌国贸易法》被美国政府没收。1947年任康涅狄格共和党财务主席，支持计划生育联合会的第一次全国性筹款活动。1952年在特别选举中击败民主党人里比科夫当选联邦参议员（1956年连任），在参议院坚定支持艾森豪威尔路线，推动州际高速公路系统立法，积极推进北极星潜艇项目，1957年和1960年投票赞成民权法案，1954年参与多数表决谴责参议员麦卡锡。1963年1月3日卸任，同年病逝，葬于康涅狄格州格林尼治普特南公墓。（备注：其在印度殖民地博弈中的具体角色在现有文献中记录有限，其投行业务与大英帝国全球资本流动存在历史交集。）"
