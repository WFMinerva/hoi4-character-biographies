 RAJ_lakshmi_sahgal_desc:0 "1914年10月24日生于马德拉斯（今金奈），娘家姓斯瓦米纳坦，母亲安姆·斯瓦米纳坦是国大党独立运动女活动家和立法议员，2012年7月23日在坎普尔卒（享年97岁），印度独立运动战士、医学博士、INA\"珍西女皇团\"指挥官，爱称\"上尉拉克希米\"。1938年毕业于马德拉斯医学院，取得妇产科文凭后赴新加坡行医；1942年日军占领新加坡后，开始参与当地印度独立运动。1943年7月苏巴斯·钱德拉·鲍斯抵达新加坡后，在与鲍斯彻夜长谈五小时后获得授权，负责在六天内召募女兵团队，最终以约6000名女性响应为基础，于1943年7月8日组建了INA历史上第一支全女性作战单位——珍西女皇团，拉克希米任上尉级团长。该团约千名成员接受步兵训练和急救训练，后随INA主力进入缅甸，在1944年英帕尔战役和1945年缅甸撤退中承担战场医疗和后勤支援职责；1945年5月在缅甸被英军逮捕，1946年3月被遣返印度。战后返归医疗职业，定居坎普尔并继续行医（至九十余岁仍坐诊）；1972年加入印度共产党（马克思主义），1981年参与创建全印民主女性协会；1998年获帕德玛·维布山勋章，2002年以左翼联合候选人身份参选总统未果；2012年7月因心脏病在坎普尔辞世，终年97岁。"
 CBIO_RAJ_lakshmi_sahgal_desc:0 "1914年10月24日生于马德拉斯（今金奈），娘家姓斯瓦米纳坦，母亲安姆·斯瓦米纳坦是国大党独立运动女活动家和立法议员，2012年7月23日在坎普尔卒（享年97岁），印度独立运动战士、医学博士、INA\"珍西女皇团\"指挥官，爱称\"上尉拉克希米\"。1938年毕业于马德拉斯医学院，取得妇产科文凭后赴新加坡行医；1942年日军占领新加坡后，开始参与当地印度独立运动。1943年7月苏巴斯·钱德拉·鲍斯抵达新加坡后，在与鲍斯彻夜长谈五小时后获得授权，负责在六天内召募女兵团队，最终以约6000名女性响应为基础，于1943年7月8日组建了INA历史上第一支全女性作战单位——珍西女皇团，拉克希米任上尉级团长。该团约千名成员接受步兵训练和急救训练，后随INA主力进入缅甸，在1944年英帕尔战役和1945年缅甸撤退中承担战场医疗和后勤支援职责；1945年5月在缅甸被英军逮捕，1946年3月被遣返印度。战后返归医疗职业，定居坎普尔并继续行医（至九十余岁仍坐诊）；1972年加入印度共产党（马克思主义），1981年参与创建全印民主女性协会；1998年获帕德玛·维布山勋章，2002年以左翼联合候选人身份参选总统未果；2012年7月因心脏病在坎普尔辞世，终年97岁。"
 RAJ_GOE_subcontinent_chaos_desc:0 "1947年8月印巴分治是英属印度历史上规模最大的政治与人道主义事件。随着蒙巴顿方案于1947年6月3日公布、英印于1947年8月14至15日正式分割为巴基斯坦与印度两个独立国家，拉德克利夫线在短短五周内划定了跨越旁遮普和孟加拉两省的边界，将原本混居的穆斯林、印度教徒和锡克教徒社区在行政上切割于两国之间，触发了历史上最大规模的有组织宗教社群屠杀与人口迁移。据历史学家估计，约1200万至1800万人在分治前后六个月内被迫离开家园，穆斯林向西迁入巴基斯坦、印度教徒和锡克教徒向东留在印度；迁徙途中爆发了大规模的宗教仇杀、强奸、绑架和财产掠夺，造成约50万至100万人死亡，另有大量妇女遭受暴力。旁遮普两侧尤为惨烈，卡利亚那大屠杀等事件造成整个村庄被夷平；孟加拉的情况相对平息，但同样经历了大规模移民和局部骚乱。骚乱产生的难民危机、领土争端（克什米尔问题、海得拉巴并入）及族群仇恨情绪塑造了印巴关系的基本底色，其影响延续至今。"
 CBIO_RAJ_GOE_subcontinent_chaos_desc:0 "1947年8月印巴分治是英属印度历史上规模最大的政治与人道主义事件。随着蒙巴顿方案于1947年6月3日公布、英印于1947年8月14至15日正式分割为巴基斯坦与印度两个独立国家，拉德克利夫线在短短五周内划定了跨越旁遮普和孟加拉两省的边界，将原本混居的穆斯林、印度教徒和锡克教徒社区在行政上切割于两国之间，触发了历史上最大规模的有组织宗教社群屠杀与人口迁移。据历史学家估计，约1200万至1800万人在分治前后六个月内被迫离开家园，穆斯林向西迁入巴基斯坦、印度教徒和锡克教徒向东留在印度；迁徙途中爆发了大规模的宗教仇杀、强奸、绑架和财产掠夺，造成约50万至100万人死亡，另有大量妇女遭受暴力。旁遮普两侧尤为惨烈，卡利亚那大屠杀等事件造成整个村庄被夷平；孟加拉的情况相对平息，但同样经历了大规模移民和局部骚乱。骚乱产生的难民危机、领土争端（克什米尔问题、海得拉巴并入）及族群仇恨情绪塑造了印巴关系的基本底色，其影响延续至今。"
 RAJ_mirza_khurshid_jah_bahadur_desc:0 "1914年10月15日生于德里兰格·马哈尔宫，1975年8月3日卒，穆罕默德·海尔乌丁米尔扎，贾赫·巴哈杜尔称号持有者，帖木儿王朝（莫卧儿王朝）名义首领，其父米尔扎·穆罕默德·法亚祖丁系沙阿拉姆二世（末代莫卧儿皇帝沙·贾汉之后裔）的曾孙。1931年由英属印度政府正式认定为帖木儿王朝现任首领，在德里的兰格·马哈尔宫以名义领袖身份生活，既是莫卧儿皇室的法理传承人，也是印度穆斯林精英阶层的象征图腾之一。1947年印巴分治后携家迁往巴基斯坦拉合尔，以移民身份度过余生；其长子贾维德·贾赫·巴哈杜尔继任为帖木儿王朝的现任名义首领。"
 CBIO_RAJ_mirza_khurshid_jah_bahadur_desc:0 "1914年10月15日生于德里兰格·马哈尔宫，1975年8月3日卒，穆罕默德·海尔乌丁米尔扎，贾赫·巴哈杜尔称号持有者，帖木儿王朝（莫卧儿王朝）名义首领，其父米尔扎·穆罕默德·法亚祖丁系沙阿拉姆二世（末代莫卧儿皇帝沙·贾汉之后裔）的曾孙。1931年由英属印度政府正式认定为帖木儿王朝现任首领，在德里的兰格·马哈尔宫以名义领袖身份生活，既是莫卧儿皇室的法理传承人，也是印度穆斯林精英阶层的象征图腾之一。1947年印巴分治后携家迁往巴基斯坦拉合尔，以移民身份度过余生；其长子贾维德·贾赫·巴哈杜尔继任为帖木儿王朝的现任名义首领。"
 RAJ_jayanto_nath_chaudhuri_desc:0 "1908年6月10日生于孟加拉省哈里普尔（扎明达尔家族，祖父是孟加拉著名地主，祖母是泰戈尔的胞妹，因而乔杜里系印度诗人泰戈尔的甥孙；母亲是首任国大党主席沃梅什·钱德拉·班纳吉之女），1983年4月6日卒于新德里（心脏病），印度陆军上将，第5任印度陆军参谋长（1962年11月20日—1966年6月7日）。桑德赫斯特毕业后（1928年受委任），同届同训的有巴基斯坦未来总统阿尤布·汗，两人在同一排同席训练，日后各自成为对立国的军事最高统帅。二战中随第5印度师先后在苏丹、厄立特里亚、埃塞俄比亚和北非作战，获OBE勋章，后率第16轻骑兵联队在缅甸作战，成为第一位率装甲联队投入战斗的印度指挥官。独立后参与主持克什米尔战事协调（1947-1948年），随后指挥第1装甲师参加\"波罗行动\"，事后获任海得拉巴军政长官（1948-1949年）。1961年12月身为南方军总司令，指挥印度\"胜利行动\"从葡萄牙手中解放果阿，是印度独立后首次成功的三军联合作战。1962年中印战争失败后接替辞职的塔帕尔出任陆军参谋长，任内主持战后重整，并提议设立边境安全部队；1965年印巴战争期间指挥印度陆军将巴基斯坦的装甲突破遏制于旁遮普。著有军事著作及首部印度陆军参谋长自传（1979年）；酷爱西方音乐，创立德里交响乐协会。"
 CBIO_RAJ_jayanto_nath_chaudhuri_desc:0 "1908年6月10日生于孟加拉省哈里普尔（扎明达尔家族，祖父是孟加拉著名地主，祖母是泰戈尔的胞妹，因而乔杜里系印度诗人泰戈尔的甥孙；母亲是首任国大党主席沃梅什·钱德拉·班纳吉之女），1983年4月6日卒于新德里（心脏病），印度陆军上将，第5任印度陆军参谋长（1962年11月20日—1966年6月7日）。桑德赫斯特毕业后（1928年受委任），同届同训的有巴基斯坦未来总统阿尤布·汗，两人在同一排同席训练，日后各自成为对立国的军事最高统帅。二战中随第5印度师先后在苏丹、厄立特里亚、埃塞俄比亚和北非作战，获OBE勋章，后率第16轻骑兵联队在缅甸作战，成为第一位率装甲联队投入战斗的印度指挥官。独立后参与主持克什米尔战事协调（1947-1948年），随后指挥第1装甲师参加\"波罗行动\"，事后获任海得拉巴军政长官（1948-1949年）。1961年12月身为南方军总司令，指挥印度\"胜利行动\"从葡萄牙手中解放果阿，是印度独立后首次成功的三军联合作战。1962年中印战争失败后接替辞职的塔帕尔出任陆军参谋长，任内主持战后重整，并提议设立边境安全部队；1965年印巴战争期间指挥印度陆军将巴基斯坦的装甲突破遏制于旁遮普。著有军事著作及首部印度陆军参谋长自传（1979年）；酷爱西方音乐，创立德里交响乐协会。"
 RAJ_abdul_ghaffar_khan_desc:0 "1890年2月6日生于英属印度西北边境省查萨达县乌特曼扎伊村一富裕普什图穆罕默德扎伊家族（今属巴基斯坦），1988年1月20日卒于白沙瓦，葬于阿富汗贾拉拉巴德（依其遗愿葬于祖先之地），普什图独立运动领袖与非暴力先行者，通称\"巴查汗\"、\"巴德沙汗\"及\"边境甘地\"。1919年接触甘地并受其理念感召进入独立运动，此后经历多次英国当局镇压与入狱（合计超过20年系狱）。1929年创立哈达伊·赫德马特加尔运动（\"主的仆人\"，又称\"红衫运动\"），以10万名宣誓放弃暴力、穿红色制服的普什图志愿者组成非暴力抵抗纵队，成为甘地式非暴力哲学在伊斯兰普什图传统中罕见而深刻的实践。强烈反对1947年印巴分治方案，在班努朱尔格提出普什图尼斯坦独立构想，未被英印当局接受；对国大党领导层同意分治深感\"背叛\"，发出\"你们把我们扔给了野狼\"的著名控诉。分治后留居巴基斯坦，因坚持普什图人权利和文化自治遭到历届巴基斯坦政府打压，数十年间被反复拘押、流亡于阿富汗。1987年荣获印度最高平民荣誉巴拉特·拉特纳勋章，系迄今获此殊荣的首位非印度公民。数十万普什图人跨越开伯尔山口从白沙瓦徒步赴贾拉拉巴德送葬，联合国宣布临时停火以让路送葬队伍。"
