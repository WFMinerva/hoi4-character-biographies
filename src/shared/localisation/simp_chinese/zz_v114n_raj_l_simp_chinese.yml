 RAJ_ram_dass_katari_desc:0 "1911年10月8日生于马德拉斯管辖区金格尔珀特（今泰米尔纳德邦），1983年1月21日卒，印度海军上将，第三任海军参谋长（1958-1962年），首位出任该职的印度人。早年入印度商船培训舰\"达芬\"号受训，荣获总督金质奖章；毕业后在加尔各答港湾局胡格利河测量队工作。1939年9月加入皇家印度海军预备役，历任舰艇炮术学校、扫雷勤务及反潜训练等职，任HMIS考弗里号舰长时主导了独立后印度整合朱纳加德邦的海上行动。此后有多项\"首次\"载入史册：1953年成为首位就读英国帝国国防学院的印度海军军官；1956年晋准将，成为首位晋升少将级的印度海军军官；1956年10月2日成为首位指挥印度舰队的印度人；1958年4月22日接替英国籍前任出任海军参谋长，成为首位担任印度海军最高职位的印度人。任内主导INS维克兰特号印度首艘航空母舰的服役准备，并亲自指挥了1961年12月解放果阿的海上作战。1962年6月4日退役。退役后担任安德拉邦公路运输公司主席（1962-1964年）及印度驻缅甸大使（1964-1969年）。他还是《印度教徒报》纵横字谜版块的首创者，终生坚持编写每日谜题直至去世。"
 CBIO_RAJ_ram_dass_katari_desc:0 "1911年10月8日生于马德拉斯管辖区金格尔珀特（今泰米尔纳德邦），1983年1月21日卒，印度海军上将，第三任海军参谋长（1958-1962年），首位出任该职的印度人。早年入印度商船培训舰\"达芬\"号受训，荣获总督金质奖章；毕业后在加尔各答港湾局胡格利河测量队工作。1939年9月加入皇家印度海军预备役，历任舰艇炮术学校、扫雷勤务及反潜训练等职，任HMIS考弗里号舰长时主导了独立后印度整合朱纳加德邦的海上行动。此后有多项\"首次\"载入史册：1953年成为首位就读英国帝国国防学院的印度海军军官；1956年晋准将，成为首位晋升少将级的印度海军军官；1956年10月2日成为首位指挥印度舰队的印度人；1958年4月22日接替英国籍前任出任海军参谋长，成为首位担任印度海军最高职位的印度人。任内主导INS维克兰特号印度首艘航空母舰的服役准备，并亲自指挥了1961年12月解放果阿的海上作战。1962年6月4日退役。退役后担任安德拉邦公路运输公司主席（1962-1964年）及印度驻缅甸大使（1964-1969年）。他还是《印度教徒报》纵横字谜版块的首创者，终生坚持编写每日谜题直至去世。"
 RAJ_ravindra_darshan_singh_desc:0 "印度空军早期高级军官，空军准将。1949年7月22日，印度空军以原皇家印度空军第2（训练）大队改组成立训练司令部，司令部设于班加罗尔高地，他出任首任司令，首任高级参谋长为R·阿特马拉姆空军上校。1954年9月15日起，全军各飞行训练机构亦一并划归训练司令部，使该司令部统管印度空军的全部训练事务，奠定了独立后印度空军训练体系的组织基础。史料多以缩写R.H.D. Singh称之。"
 CBIO_RAJ_ravindra_darshan_singh_desc:0 "印度空军早期高级军官，空军准将。1949年7月22日，印度空军以原皇家印度空军第2（训练）大队改组成立训练司令部，司令部设于班加罗尔高地，他出任首任司令，首任高级参谋长为R·阿特马拉姆空军上校。1954年9月15日起，全军各飞行训练机构亦一并划归训练司令部，使该司令部统管印度空军的全部训练事务，奠定了独立后印度空军训练体系的组织基础。史料多以缩写R.H.D. Singh称之。"
 RAJ_rajendra_prasad_desc:0 "1884年12月3日生于孟加拉省锡万县兹拉代伊村一户卡亚斯塔家庭，1963年2月28日卒于巴特纳萨达卡特修道院，印度独立运动领袖、法学家与政治家，印度共和国首任总统（1950-1962年，连任两届，任期最长约12年），同时是迄今印度唯一任期超过十年的总统。幼年聪慧，以第一名成绩考入加尔各答大学并获月度奖学金，1907年以优异成绩获经济学文学硕士学位，后取得法律学位，在加尔各答高等法院执业，1916年转至巴特纳高等法院并创办《比哈尔法律周刊》。1917年在尚帕兰被甘地召募参与蓝靛农民运动，此后放弃律师业，全身投入独立运动；历经盐行运动（1930年被捕）、退出印度运动（1942年8月—1945年6月系狱近三年）。1934年当选国大党主席，组织比哈尔地震救灾；1939年再度出任国大党主席。1946年9月出任临时政府食品与农业部长；1946年12月11日当选制宪会议主席，与尼赫鲁、安贝德卡尔等人合力制定印度宪法。1950年1月26日印度成为共和国，当选首任总统，在任期间坚持超然于党派纷争的元首立场，1962年以健康欠佳为由退休，同年获印度最高平民荣誉巴拉特·拉特纳勋章。著有回忆录《萨提亚格拉哈在尚帕兰》（1922年）、自传《阿特马卡沙》（1946年）等。"
 CBIO_RAJ_rajendra_prasad_desc:0 "1884年12月3日生于孟加拉省锡万县兹拉代伊村一户卡亚斯塔家庭，1963年2月28日卒于巴特纳萨达卡特修道院，印度独立运动领袖、法学家与政治家，印度共和国首任总统（1950-1962年，连任两届，任期最长约12年），同时是迄今印度唯一任期超过十年的总统。幼年聪慧，以第一名成绩考入加尔各答大学并获月度奖学金，1907年以优异成绩获经济学文学硕士学位，后取得法律学位，在加尔各答高等法院执业，1916年转至巴特纳高等法院并创办《比哈尔法律周刊》。1917年在尚帕兰被甘地召募参与蓝靛农民运动，此后放弃律师业，全身投入独立运动；历经盐行运动（1930年被捕）、退出印度运动（1942年8月—1945年6月系狱近三年）。1934年当选国大党主席，组织比哈尔地震救灾；1939年再度出任国大党主席。1946年9月出任临时政府食品与农业部长；1946年12月11日当选制宪会议主席，与尼赫鲁、安贝德卡尔等人合力制定印度宪法。1950年1月26日印度成为共和国，当选首任总统，在任期间坚持超然于党派纷争的元首立场，1962年以健康欠佳为由退休，同年获印度最高平民荣誉巴拉特·拉特纳勋章。著有回忆录《萨提亚格拉哈在尚帕兰》（1922年）、自传《阿特马卡沙》（1946年）等。"
 RAJ_puran_chand_joshi_desc:0 "1907年4月14日生于北方省阿尔莫拉城（今北阿坎德邦）一户库马翁婆罗门家庭，1980年11月9日卒于新德里，印度共产党首任总书记（1935-1947年）。1928年以优等成绩获安拉哈巴德大学文学硕士学位，随即投身工人和农民党活动并任北方省总书记。1929年以\"米鲁特阴谋案\"主犯被捕，判处六年安达曼群岛流放，后减至三年（在狱中还通过了法学学位考试，1933年出狱）。1935年后秘密接替被捕的CPI前总书记出任党的总书记。任内建立\"民族统一战线\"，允许党员以国大党成员身份公开活动，领导CPI在1936-1941年间的合法化发展时期；同时力倡文化统一战线，主导创立进步作家协会、印度人民剧团和全印学生联合会，为左翼文化运动的核心推手；在1943-1944年孟加拉大饥荒期间组织CPI大规模赈灾活动。1948年因主张与国大党合作路线遭CPI第二次全国代表大会批判并被撤职，1949年被开除党籍，1951年恢复党籍，此后被边缘化。晚年专注于在尼赫鲁大学建立印度共产主义运动档案。1943年与革命女性卡尔帕娜·达塔（1913-1995年，吉大港军械库袭击参与者）成婚。"
