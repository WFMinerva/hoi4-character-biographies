 RAJ_GOE_sam_manekshaw_desc:0 "1914年4月3日生于旁遮普阿姆利则一户帕西族家庭，2008年6月27日卒于泰米尔纳德邦韦灵顿，印度陆军元帅，印度历史上仅有的两位陆军元帅之一，另一位为卡里亚帕。毕业于德拉敦印度军事学院（1932年首届学员之一）。二战参加缅甸战役，因中弹重伤仍坚守阵地获颁军事十字勋章。独立后历任多个重要军职，历经1947年克什米尔战争、1962年中印战争、1965年印巴战争，以直言风格和独立专业判断著称。1969年6月出任第七任陆军参谋长。1971年第三次印巴战争（孟加拉解放战争）前，他以军事准备不足为由说服英迪拉·甘地总理推迟开战，争取到约八个月充分备战；1971年12月3日至16日以仅十三天的闪电战役歼灭巴基斯坦东部驻军，俘获约九万三千名战俘，主导完成印度建国以来最辉煌的军事胜利，孟加拉国随之诞生。1973年1月1日晋升陆军元帅。2008年6月27日在韦灵顿陆军医院去世，享年九十四岁。"
 CBIO_RAJ_GOE_sam_manekshaw_desc:0 "1914年4月3日生于旁遮普阿姆利则一户帕西族家庭，2008年6月27日卒于泰米尔纳德邦韦灵顿，印度陆军元帅，印度历史上仅有的两位陆军元帅之一，另一位为卡里亚帕。毕业于德拉敦印度军事学院（1932年首届学员之一）。二战参加缅甸战役，因中弹重伤仍坚守阵地获颁军事十字勋章。独立后历任多个重要军职，历经1947年克什米尔战争、1962年中印战争、1965年印巴战争，以直言风格和独立专业判断著称。1969年6月出任第七任陆军参谋长。1971年第三次印巴战争（孟加拉解放战争）前，他以军事准备不足为由说服英迪拉·甘地总理推迟开战，争取到约八个月充分备战；1971年12月3日至16日以仅十三天的闪电战役歼灭巴基斯坦东部驻军，俘获约九万三千名战俘，主导完成印度建国以来最辉煌的军事胜利，孟加拉国随之诞生。1973年1月1日晋升陆军元帅。2008年6月27日在韦灵顿陆军医院去世，享年九十四岁。"
 RAJ_GOE_montagu_stopford_desc:0 "1892年11月16日生于英格兰伦敦汉诺威广场，1971年3月10日卒，英国陆军上将，步枪旅出身，威灵顿公学和桑赫斯特皇家军事学院毕业，1911年9月20日受委任。一战在法国前线服役，获军事十字勋章。二战初期任第17步兵旅旅长（1939-1940年，参加阿拉斯防御战），后历任第56伦敦步兵师师长、卡姆伯利参谋学院院长及第12军军长。1943年11月接任第33印度军军长，隶属斯利姆将军第14集团军，驻英帕尔-科希马方向。1944年3—6月科希马-英帕尔战役中，他迅速整合增援兵力，率第2英国步兵师南下解科希马之围（1944年4月18日），随后持续追击日军直至将其赶过钦敦江，此役后被英国国家军事博物馆评为\"英国历史上最伟大的战役\"。1945年伊洛瓦底江战役期间，他协调部队向仰光推进，并于1945年10月24日在仰光接受日军投降，日军缅甸方面军司令木村兵太郎亲手交出军刀。战后历任缅甸司令（1945-1946年）、荷属东印度盟军陆军司令（1946年）及东南亚最高指挥（1946-1947年），1949年退役，晚年定居牛津郡奇平诺顿。"
 CBIO_RAJ_GOE_montagu_stopford_desc:0 "1892年11月16日生于英格兰伦敦汉诺威广场，1971年3月10日卒，英国陆军上将，步枪旅出身，威灵顿公学和桑赫斯特皇家军事学院毕业，1911年9月20日受委任。一战在法国前线服役，获军事十字勋章。二战初期任第17步兵旅旅长（1939-1940年，参加阿拉斯防御战），后历任第56伦敦步兵师师长、卡姆伯利参谋学院院长及第12军军长。1943年11月接任第33印度军军长，隶属斯利姆将军第14集团军，驻英帕尔-科希马方向。1944年3—6月科希马-英帕尔战役中，他迅速整合增援兵力，率第2英国步兵师南下解科希马之围（1944年4月18日），随后持续追击日军直至将其赶过钦敦江，此役后被英国国家军事博物馆评为\"英国历史上最伟大的战役\"。1945年伊洛瓦底江战役期间，他协调部队向仰光推进，并于1945年10月24日在仰光接受日军投降，日军缅甸方面军司令木村兵太郎亲手交出军刀。战后历任缅甸司令（1945-1946年）、荷属东印度盟军陆军司令（1946年）及东南亚最高指挥（1946-1947年），1949年退役，晚年定居牛津郡奇平诺顿。"
 RAJ_noel_beresfordpeirse_desc:0 "1887年12月22日生于爱尔兰，1953年1月14日卒，全名诺埃尔·蒙森·德拉波尔·贝雷斯福德-皮尔斯，英国皇家炮兵中将。威灵顿公学和伍尔维奇皇家军事学院毕业，1907年受委任。一战转战埃及、美索不达米亚（今伊拉克）、法国和比利时，1918年以勇敢行为获杰出服务勋章。战间期历任多职并在印度勒克瑙高级军官学校执教，1939-1940年任国王乔治六世副官。二战初以第4印度步兵师炮兵指挥官身份驻扎埃及，1940年8月接手全师指挥，参加\"指南针行动\"（北非，1940年12月），与澳新联军协作重创意大利军并攻占西迪·巴拉尼，俘虏3.8万余人。1941年3月获KBE爵位，4月14日接任西部沙漠部队（后改第13军）司令；此后历任苏丹英军司令（1941-1942年）、第15印度军司令（1942年）和印度南方集团军司令（1942年6月-1945年3月）；1945-1946年任印度军总福利官，1947年6月13日退役，1953年1月14日卒。"
 CBIO_RAJ_noel_beresfordpeirse_desc:0 "1887年12月22日生于爱尔兰，1953年1月14日卒，全名诺埃尔·蒙森·德拉波尔·贝雷斯福德-皮尔斯，英国皇家炮兵中将。威灵顿公学和伍尔维奇皇家军事学院毕业，1907年受委任。一战转战埃及、美索不达米亚（今伊拉克）、法国和比利时，1918年以勇敢行为获杰出服务勋章。战间期历任多职并在印度勒克瑙高级军官学校执教，1939-1940年任国王乔治六世副官。二战初以第4印度步兵师炮兵指挥官身份驻扎埃及，1940年8月接手全师指挥，参加\"指南针行动\"（北非，1940年12月），与澳新联军协作重创意大利军并攻占西迪·巴拉尼，俘虏3.8万余人。1941年3月获KBE爵位，4月14日接任西部沙漠部队（后改第13军）司令；此后历任苏丹英军司令（1941-1942年）、第15印度军司令（1942年）和印度南方集团军司令（1942年6月-1945年3月）；1945-1946年任印度军总福利官，1947年6月13日退役，1953年1月14日卒。"
 RAJ_douglas_gracey_desc:0 "1894年9月3日生于英属印度北方省穆扎法尔纳加尔（英国籍父母），1964年6月5日卒于英格兰萨里郡，英国军人，巴基斯坦陆军第二任总司令。布伦德尔公学和桑赫斯特皇家军事学院毕业，1914年8月受委任，入第1廓尔喀步枪团，一战赴法获军事十字勋章及勋扣。战间期在伊拉克、巴勒斯坦和西北边境服役，1940年任桑赫斯特军事学院助理院长。二战期间指挥第17印度步兵旅（伊拉克-叙利亚）和第20印度步兵师（参加1944年英帕尔战役及1945年缅甸反攻，渡伊洛瓦底江切断日军曼德勒-密铁拉交通线，5月攻克卑谬）。1945年9月13日以盟军驻法属印度支那陆军司令身份进驻西贡，接受日军投降；他随即释放并武装被关押的法国士兵、允许日降军临时维持秩序，助法国恢复对越南南部的控制，此举为越南独立运动人士视为恢复殖民统治，至今引发史学争议。1947年印巴分治后任巴基斯坦陆军参谋总长，1948年2月接替梅瑟维出任第二任总司令；1947年10月22日部落武装入侵克什米尔时，他以代理身份拒绝执行真纳命令出兵克什米尔，并主持建立巴基斯坦军事学院（1948年11月，卡库尔）。1951年1月退役，1964年卒。"
 CBIO_RAJ_douglas_gracey_desc:0 "1894年9月3日生于英属印度北方省穆扎法尔纳加尔（英国籍父母），1964年6月5日卒于英格兰萨里郡，英国军人，巴基斯坦陆军第二任总司令。布伦德尔公学和桑赫斯特皇家军事学院毕业，1914年8月受委任，入第1廓尔喀步枪团，一战赴法获军事十字勋章及勋扣。战间期在伊拉克、巴勒斯坦和西北边境服役，1940年任桑赫斯特军事学院助理院长。二战期间指挥第17印度步兵旅（伊拉克-叙利亚）和第20印度步兵师（参加1944年英帕尔战役及1945年缅甸反攻，渡伊洛瓦底江切断日军曼德勒-密铁拉交通线，5月攻克卑谬）。1945年9月13日以盟军驻法属印度支那陆军司令身份进驻西贡，接受日军投降；他随即释放并武装被关押的法国士兵、允许日降军临时维持秩序，助法国恢复对越南南部的控制，此举为越南独立运动人士视为恢复殖民统治，至今引发史学争议。1947年印巴分治后任巴基斯坦陆军参谋总长，1948年2月接替梅瑟维出任第二任总司令；1947年10月22日部落武装入侵克什米尔时，他以代理身份拒绝执行真纳命令出兵克什米尔，并主持建立巴基斯坦军事学院（1948年11月，卡库尔）。1951年1月退役，1964年卒。"
 RAJ_GOE_arcot_doraiswamy_loganadan_desc:0 "1888年4月12日生，1949年3月9日卒于班加罗尔，医生出身的印度国民军少将，自由印度临时政府（阿齐德·欣德）部长级官员。就读班加罗尔中心学院和马德拉斯医学院，后赴伦敦研修热带病，1917年8月27日获临时军官委任，1922年3月1日转正式委任，1929年2月27日晋升少校，后为中校。一战期间服役于印度医疗队。二战中1942年2月新加坡沦陷后被日军俘虏，随即加入鲍斯领导的INA和自由印度临时政府任代表兼部长。1943年12月被鲍斯任命为安达曼-尼科巴群岛总督，但他与日本占领军在施政上产生严重分歧，被迫退出该职转任INA缅甸司令部总司令；1945年4月24日至5月4日，他率约6000名INA士兵在英军战俘陆续获释期间维持仰光城市秩序。盟军收复缅甸后被遣返印度，在德里红堡接受叛国罪审判，最终无罪释放，1946年返回班加罗尔，同年9月20日被依伦敦公报从印度军官名单中除名；谢绝尼赫鲁政府驻新西兰外交职务（原因为健康欠佳），1949年3月9日卒，享年六十岁。班加罗尔爱德华路现改以其姓名命名。"
