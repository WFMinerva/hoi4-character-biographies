 RAJ_GOE_sarat_bose_desc:0 "1889年9月5日生于加尔各答，1950年2月20日卒于加尔各答（心脏病），孟加拉知名大律师、政治家，苏巴斯·钱德拉·鲍斯之长兄，印度国大党重要领袖。毕业于加尔各答大学后赴英在林肯律师学院取得大律师资格，回国后在加尔各答高等法院执业，以辩护民族主义被告的政治与刑事案件著称，跻身孟加拉最具声望的大律师之列。深度投身国大党政治活动，多次当选孟加拉省国大党主席，并长期主持孟加拉省立法议会工作。1942年\"退出印度\"运动期间遭英当局逮捕系狱逾两年。对弟弟苏巴斯出走欧洲并联结轴心国的路线保持距离，但同样坚决反对英国统治。1947年印巴分治方案公布前夕，他与孟加拉省穆斯林联盟领袖苏拉瓦尔迪共同提出\"统一的独立社会主义孟加拉\"方案，主张孟加拉不分裂、以独立实体参与英联邦，未获国大党与穆盟两方高层接受，方案最终流产。独立后极度失望于印度政治走向，于1950年2月在加尔各答因心脏病辞世。"
