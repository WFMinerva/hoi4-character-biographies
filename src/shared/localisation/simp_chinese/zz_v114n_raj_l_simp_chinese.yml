 RAJ_ram_singh_thakur_desc:0 "1914年8月15日（恰与日后的印度独立日同日）生于喜马偕尔邦达兰萨拉附近卡尼亚拉村一户尼泊尔裔廓尔喀（塔库里）家庭，2002年4月15日卒，印度国民军上尉、音乐家与作曲家，有“歌唱的士兵”之誉。父为廓尔喀士兵，自幼受熏陶，1927年入达兰萨拉营区第二廓尔喀步枪团军乐队，曾在西北边境服役并获乔治六世奖章。1942年新加坡沦陷后被俘、转送日本，与鲍斯相遇后加入INA，获鲍斯任命为乐队总监。他谱写了INA进行曲《Kadam Kadam Badhaye Ja》（“步步向前”，今为印度陆军快步行进曲）的曲调，并参与自由印度临时政府国歌《Subh Sukh Chain Ki Barkha Barse》的音乐整理；该曲以《Jana Gana Mana》为基础，改写成印度斯坦语军乐版本，于1943年在新加坡首演。他还为《Saare Jahan se Achha》配乐，并创作“珍西女皇团”团歌。1944年获鲍斯授勋并获赠小提琴。战后一度系狱，获释后于1947年8月15日在红堡用鲍斯所赠小提琴演奏国歌旋律。1946年应尼赫鲁、帕特尔之议组建“全印INA乐团”巡演各地。1948年加入勒克瑙北方邦省武装警察，创建其军乐队，1974年以名誉副警监衔退休。其音乐贡献长期未获国家正式承认，晚景一度坎坷。"
