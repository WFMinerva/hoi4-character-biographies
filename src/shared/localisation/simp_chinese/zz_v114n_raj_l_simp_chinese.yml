 RAJ_mehar_singh_desc:0 "1915年3月20日生于旁遮普省莱拉普尔（今巴基斯坦法萨拉巴德），1952年3月11日驾机穿越暴风雨时坠毁于安巴拉与德里之间遇难，享年36岁，印度空军准将，空军传奇\"梅哈尔巴巴\"（绰号由战友阿斯比·工程师所赐）。1934年入皇家空军学院克兰威尔，1936年受委任，为印度第1飞行中队首批六名印度籍飞行员之一；在西北边境执行对边疆部落作战时曾因Wapiti双翼机油箱中弹迫降，与炮手整夜穿越敌方山区徒步脱险，翌日即重回驾驶舱。二战中率第6中队（飓风战机）在缅甸阿拉干前线执行侦察与近距支援任务，斯利姆将军在回忆录中高度赞誉其部队；1944年荣获杰出服务勋章，系迄今唯一赢得该勋章的印度空军军官。1947年克什米尔战事爆发后亲自驾机第一个降落斯利那加、普希和列城机场，五天内完成历史性大规模空运行动，蒙巴顿勋爵称赞此事史无前例。1948年9月因与上级意见不合辞职，退役后任帕提亚拉邦大君顾问，1952年3月11日坠机殉职。1950年追授玛哈维尔查卡勋章（独立后第二高军事荣誉）。印度空军于2018年设立\"梅哈尔巴巴奖\"以纪念其贡献。"
 CBIO_RAJ_mehar_singh_desc:0 "1915年3月20日生于旁遮普省莱拉普尔（今巴基斯坦法萨拉巴德），1952年3月11日驾机穿越暴风雨时坠毁于安巴拉与德里之间遇难，享年36岁，印度空军准将，空军传奇\"梅哈尔巴巴\"（绰号由战友阿斯比·工程师所赐）。1934年入皇家空军学院克兰威尔，1936年受委任，为印度第1飞行中队首批六名印度籍飞行员之一；在西北边境执行对边疆部落作战时曾因Wapiti双翼机油箱中弹迫降，与炮手整夜穿越敌方山区徒步脱险，翌日即重回驾驶舱。二战中率第6中队（飓风战机）在缅甸阿拉干前线执行侦察与近距支援任务，斯利姆将军在回忆录中高度赞誉其部队；1944年荣获杰出服务勋章，系迄今唯一赢得该勋章的印度空军军官。1947年克什米尔战事爆发后亲自驾机第一个降落斯利那加、普希和列城机场，五天内完成历史性大规模空运行动，蒙巴顿勋爵称赞此事史无前例。1948年9月因与上级意见不合辞职，退役后任帕提亚拉邦大君顾问，1952年3月11日坠机殉职。1950年追授玛哈维尔查卡勋章（独立后第二高军事荣誉）。印度空军于2018年设立\"梅哈尔巴巴奖\"以纪念其贡献。"
 RAJ_bhimrao_ramji_ambedkar_desc:0 "1891年4月14日生于英属印度中央省谋（今马哈拉施特拉邦安贝德卡尔纳加尔）一个玛哈尔种姓（达利特）军人家庭，1956年12月6日卒于新德里，法学家、经济学家、社会改革家，印度宪法主要起草人，通称\"巴巴萨黑布\"，独立后首任法律与司法部长。凭借巴罗达邦大君奖学金先后在哥伦比亚大学（1927年经济学博士）和伦敦经济学院（1923年经济学博士）深造，幼年遭受的种姓歧视创伤使其毕生致力于废除不可接触者制度：1924年创立受压迫阶层福利协会，1927年在马哈德领导达利特饮水公开抗争并公开焚烧《摩奴法典》。积极参与1930-1932年伦敦圆桌会议，争取达利特独立选区；1932年甘地以绝食相逼，双方签订普纳协议，以立法保障席位换取放弃独立选区诉求。1946年起担任制宪议会起草委员会主席，主导确立政教分离、废除种姓歧视的印度宪法文本。1951年因对印度教法典改革迟滞及克什米尔政策的异议愤而辞去法律部长职务；1956年10月14日在那格浦尔迪克萨布胡米与约60万名追随者集体皈依佛教，仅六周后即在新德里辞世。1990年追授印度最高平民荣誉巴拉特·拉特纳勋章。"
 CBIO_RAJ_bhimrao_ramji_ambedkar_desc:0 "1891年4月14日生于英属印度中央省谋（今马哈拉施特拉邦安贝德卡尔纳加尔）一个玛哈尔种姓（达利特）军人家庭，1956年12月6日卒于新德里，法学家、经济学家、社会改革家，印度宪法主要起草人，通称\"巴巴萨黑布\"，独立后首任法律与司法部长。凭借巴罗达邦大君奖学金先后在哥伦比亚大学（1927年经济学博士）和伦敦经济学院（1923年经济学博士）深造，幼年遭受的种姓歧视创伤使其毕生致力于废除不可接触者制度：1924年创立受压迫阶层福利协会，1927年在马哈德领导达利特饮水公开抗争并公开焚烧《摩奴法典》。积极参与1930-1932年伦敦圆桌会议，争取达利特独立选区；1932年甘地以绝食相逼，双方签订普纳协议，以立法保障席位换取放弃独立选区诉求。1946年起担任制宪议会起草委员会主席，主导确立政教分离、废除种姓歧视的印度宪法文本。1951年因对印度教法典改革迟滞及克什米尔政策的异议愤而辞去法律部长职务；1956年10月14日在那格浦尔迪克萨布胡米与约60万名追随者集体皈依佛教，仅六周后即在新德里辞世。1990年追授印度最高平民荣誉巴拉特·拉特纳勋章。"
 RAJ_bahadur_jayla_of_khoch_bahur_desc:0 "贾加迪彭德拉·纳拉扬·布普·巴哈杜尔：1922年七岁丧父继位、1936年亲政，二战中以英属印度陆军军官身份转战北非、阿萨姆、缅甸与东南亚，1945年亲历日军在新加坡投降，军衔由少尉累升至上校（另获名誉将军衔），并任库奇比哈尔军总司令（1943—1949）；他亦是著名板球手（曾任孟加拉队队长），1943年孟加拉大饥荒中捐出大量稻米。1947年签署加入印度文书，1949年9月12日将治权移交印度，1950年1月该邦并入西孟加拉。"
 CBIO_RAJ_bahadur_jayla_of_khoch_bahur_desc:0 "贾加迪彭德拉·纳拉扬·布普·巴哈杜尔：1922年七岁丧父继位、1936年亲政，二战中以英属印度陆军军官身份转战北非、阿萨姆、缅甸与东南亚，1945年亲历日军在新加坡投降，军衔由少尉累升至上校（另获名誉将军衔），并任库奇比哈尔军总司令（1943—1949）；他亦是著名板球手（曾任孟加拉队队长），1943年孟加拉大饥荒中捐出大量稻米。1947年签署加入印度文书，1949年9月12日将治权移交印度，1950年1月该邦并入西孟加拉。"
 CBIO_RAJ_GOE_muhammad_ali_jinnah_desc:0 "1876年12月25日生于英属印度信德省卡拉奇，1948年9月11日卒于卡拉奇（肺结核），巴基斯坦国父与首任总督，被尊称为\"奎德-伊-阿扎姆\"（最伟大的领袖）。早年赴英在林肯律师学院研习法律，1896年成为律师，以擅于宪法辩护著称。初入政界时是国大党与穆盟双方均认可的温和民族主义者，一度被誉为\"印印统一大使\"；1920年代中期因反对甘地群众运动路线而逐渐转向穆斯林单独代议制诉求，经过漫长理论建构，最终确立了\"两个民族\"论——主张印度斯坦教徒与穆斯林系两个独立民族，不得在同一国家框架下共存。1940年拉合尔决议公开宣布建立独立穆斯林国家的目标；1947年8月14日巴基斯坦建国，真纳成为首任总督，但肺结核已侵蚀多年，仅在任约13个月后即于1948年9月11日病逝于卡拉奇。"
