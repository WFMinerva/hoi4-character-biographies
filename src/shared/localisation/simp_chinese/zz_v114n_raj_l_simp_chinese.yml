 CBIO_RAJ_b_p_sitaramayya_desc:0 "1880年11月24日生于马德拉斯管辖区戈达瓦里三角洲贡杜戈拉努村一户泰卢固尼约吉婆罗门家庭，1959年12月17日卒，印度独立运动活动家、政治家与历史学家。毕业于马德拉斯基督学院后取得医学学位，在沿海城镇马苏利帕特南开业行医。1916年放弃诊所投身独立运动，加入国大党，先后参加自治运动、食盐进军及退出印度运动。1919年创办民族主义英文周刊《祖国》。1918年推动成立安得拉省国大党委员会，此后长期任该委员会主席及国大党工作委员会成员。1923年11月28日在马苏利帕特南创办安得拉银行，后又创办印度斯坦保险公司（1935年），旨在抵制英国金融外流。1939年特里普里大会上他作为甘地属意的候选人竞选国大党主席，负于鲍斯；1948年在贾伊普尔大会上在尼赫鲁支持下当选主席。退出印度运动期间与全体工作委员会成员一同被关押于艾哈迈德讷格尔堡三年。战后任制宪会议成员，参与土邦合并谈判。1956年11月1日至1957年6月13日出任中央邦首任邦长。著有《国大党史》两卷等。"
