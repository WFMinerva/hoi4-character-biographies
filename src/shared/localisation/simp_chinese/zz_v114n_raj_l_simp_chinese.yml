 RAJ_chakravarti_rajagopalachari_desc:0 "1878年12月10日生于马德拉斯管辖区克里希纳吉里县托拉帕利村一户依延伽婆罗门家庭，1972年12月25日卒于金奈（享年94岁），印度独立运动活动家、政治家、律师、作家与宗教学者，通称\"拉贾吉\"或C.R.，印度历史上唯一一位印度籍总督。就读班加罗尔中央学院和金奈总统学院，取得法律学位后在塞勒姆开设事务所，同时在塞勒姆市政委员会活动，1919年后与甘地结缘，放弃律师业全身投入独立运动，编辑甘地的《少年印度》周刊。1920年甘地称他为\"我的良知守护人\"；此后两家通过婚姻关系（其女莱克希米嫁给甘地之子德瓦达斯）结为亲家。1937年当选马德拉斯省首席部长，推行寺庙开放和废除不可接触者政策，并将印地语列为小学必修语言，引发大规模反印地语示威后辞职。1942年反对甘地\"退出印度\"运动，主张直接与英方谈判；1944年提出\"拉贾吉方案\"，寻求国大党与穆斯林联盟分治妥协，遭双方否定。1947年独立后任西孟加拉首任邦长，1948年6月21日接替蒙巴顿出任印度最后一任总督（1948年6月-1950年1月），成为首位也是唯一一位印度籍总督（兼首位印度国家元首）。共和国成立后历任内政部长（1950-1951年）和马德拉斯首席部长（1952-1954年）。1959年脱离国大党，创立以自由市场经济为主张的斯瓦坦特拉党。1955年获印度最高平民荣誉巴拉特·拉特纳勋章；另著有马哈巴拉塔、罗摩衍那白话译本及大量政论文章。"
