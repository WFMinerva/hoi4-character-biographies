 RAJ_GOE_mohammad_usman_desc:0 "1912年7月15日生于北方邦比比普尔村（马乌县，阿扎姆加尔地区），1948年7月3日在查谟克什米尔让加尔阵亡，印度陆军准将，印度独立后第一场战争中阵亡的最高级别将领。接受军事教育后入英属印度陆军，1935年受委任，服役于巴鲁赫团，后参加缅甸战场。1947年印巴分治时他婉拒真纳担任巴基斯坦陆军总司令的邀请，选择留在印度。第一次印巴战争中，他指挥第50伞兵旅在克什米尔西部的诺谢拉和让加尔一带顽强御敌：1948年1至2月击退巴方对诺谢拉的攻击，获称\"诺谢拉雄狮\"；随后夺回让加尔，1948年7月3日在阵地上被一颗炮弹击中壮烈牺牲，年三十五岁。尼赫鲁总理偕内阁成员亲往送殡，印度政府追授马哈维尔·查克拉勋章（印度次高军事荣誉）。"
 CBIO_RAJ_GOE_mohammad_usman_desc:0 "1912年7月15日生于北方邦比比普尔村（马乌县，阿扎姆加尔地区），1948年7月3日在查谟克什米尔让加尔阵亡，印度陆军准将，印度独立后第一场战争中阵亡的最高级别将领。接受军事教育后入英属印度陆军，1935年受委任，服役于巴鲁赫团，后参加缅甸战场。1947年印巴分治时他婉拒真纳担任巴基斯坦陆军总司令的邀请，选择留在印度。第一次印巴战争中，他指挥第50伞兵旅在克什米尔西部的诺谢拉和让加尔一带顽强御敌：1948年1至2月击退巴方对诺谢拉的攻击，获称\"诺谢拉雄狮\"；随后夺回让加尔，1948年7月3日在阵地上被一颗炮弹击中壮烈牺牲，年三十五岁。尼赫鲁总理偕内阁成员亲往送殡，印度政府追授马哈维尔·查克拉勋章（印度次高军事荣誉）。"
 RAJ_GOE_mohammed_zaman_kiani_desc:0 "约1910年10月1日生于拉瓦尔品第县巴拉卡胡附近阿提亚尔村（今属伊斯兰堡），1981年6月4日卒于伊斯兰堡，巴基斯坦裔印度国民军少将，后为巴基斯坦军官与政治家。少年时为出色曲棍球手，1931年入德拉敦印度军事学院首期，1935年以最优学员荣获荣誉佩剑与金质奖章，受委任于第14旁遮普团第1营。1941年3月随部调往马来亚，新加坡沦陷后被日军俘虏。1942年加入莫汉·辛格创建的第一届INA并出任参谋长；第一届INA因与日方决裂而解散后，由印度独立联盟任命为残部司令。1943年鲍斯抵达、INA重建后，他出任第1师师长，率部参加1944年英帕尔方向对印进攻。仰光失守时率INA与自由印度临时政府人员随鲍斯撤往曼谷；1945年8月鲍斯飞赴东京后，他于8月25日作为INA司令在新加坡向英军第5师投降，被遣返印度拘押至1946年后遭革职。印巴分治后选择巴基斯坦，1947年9月受总理利雅卡特·阿里·汗委派主持夺取查谟-克什米尔行动的南翼，在古杰拉特设立“阿扎德”总部，组织普恩奇方向的袭扰，催生阿扎德克什米尔。此后任巴基斯坦驻吉尔吉特政治专员，齐亚·哈克执政时期出任信息部长。著有回忆录《印度自由斗争与伟大的INA》（身后出版），印度政府追授其内塔吉勋章。"
 CBIO_RAJ_GOE_mohammed_zaman_kiani_desc:0 "约1910年10月1日生于拉瓦尔品第县巴拉卡胡附近阿提亚尔村（今属伊斯兰堡），1981年6月4日卒于伊斯兰堡，巴基斯坦裔印度国民军少将，后为巴基斯坦军官与政治家。少年时为出色曲棍球手，1931年入德拉敦印度军事学院首期，1935年以最优学员荣获荣誉佩剑与金质奖章，受委任于第14旁遮普团第1营。1941年3月随部调往马来亚，新加坡沦陷后被日军俘虏。1942年加入莫汉·辛格创建的第一届INA并出任参谋长；第一届INA因与日方决裂而解散后，由印度独立联盟任命为残部司令。1943年鲍斯抵达、INA重建后，他出任第1师师长，率部参加1944年英帕尔方向对印进攻。仰光失守时率INA与自由印度临时政府人员随鲍斯撤往曼谷；1945年8月鲍斯飞赴东京后，他于8月25日作为INA司令在新加坡向英军第5师投降，被遣返印度拘押至1946年后遭革职。印巴分治后选择巴基斯坦，1947年9月受总理利雅卡特·阿里·汗委派主持夺取查谟-克什米尔行动的南翼，在古杰拉特设立“阿扎德”总部，组织普恩奇方向的袭扰，催生阿扎德克什米尔。此后任巴基斯坦驻吉尔吉特政治专员，齐亚·哈克执政时期出任信息部长。著有回忆录《印度自由斗争与伟大的INA》（身后出版），印度政府追授其内塔吉勋章。"
 RAJ_GOE_muhammad_musa_desc:0 "1908年生于俾路支斯坦奎达，1991年卒于拉合尔，巴基斯坦陆军上将，第六任巴基斯坦陆军总司令（1958—1966）。毕业于桑赫斯特皇家军事学院，1935年入英属印度陆军，二战中服役于中东及意大利战场。1947年独立后加入巴基斯坦陆军，历任要职。1958年阿尤布·汗政变后出任陆军总司令，任期长达八年。1965年第二次印巴战争期间担任总司令，参与指挥大规模军事行动。1966年卸任后历任伊朗巴基斯坦大使（1966—1972）及俾路支斯坦省督（1985—1990），1991年去世。"
 CBIO_RAJ_GOE_muhammad_musa_desc:0 "1908年生于俾路支斯坦奎达，1991年卒于拉合尔，巴基斯坦陆军上将，第六任巴基斯坦陆军总司令（1958—1966）。毕业于桑赫斯特皇家军事学院，1935年入英属印度陆军，二战中服役于中东及意大利战场。1947年独立后加入巴基斯坦陆军，历任要职。1958年阿尤布·汗政变后出任陆军总司令，任期长达八年。1965年第二次印巴战争期间担任总司令，参与指挥大规模军事行动。1966年卸任后历任伊朗巴基斯坦大使（1966—1972）及俾路支斯坦省督（1985—1990），1991年去世。"
 RAJ_GOE_muhammad_ayub_khan_desc:0 "1907年5月14日生于英属印度西北边境省哈里普尔，1974年4月19日卒于伊斯兰堡，巴基斯坦陆军元帅，巴基斯坦第二任总统（1958—1969）。毕业于阿里格尔穆斯林大学与桑赫斯特皇家军事学院，1928年入英属印度陆军，二战参加缅甸战役并晋升至营长。1947年加入巴基斯坦陆军，1951年出任陆军总司令，1954至1956年兼任国防部长。1958年10月7日发动军事政变推翻伊斯坎德尔·米尔扎，出任首席戒严行政官，10月27日自封总统。任内推行\"基本民主制\"（1962年宪法），推动工业化并与中国发展友好关系（1963年签署边界条约，1965年签署友好条约）。1965年第二次印巴战争后签署塔什干协议（1966年1月），遭国内强硬派抨击。1968至1969年社会抗议潮持续扩大，1969年3月25日将政权移交叶海亚·汗后辞职。著有回忆录《与自由为友》（1967年）。"
 CBIO_RAJ_GOE_muhammad_ayub_khan_desc:0 "1907年5月14日生于英属印度西北边境省哈里普尔，1974年4月19日卒于伊斯兰堡，巴基斯坦陆军元帅，巴基斯坦第二任总统（1958—1969）。毕业于阿里格尔穆斯林大学与桑赫斯特皇家军事学院，1928年入英属印度陆军，二战参加缅甸战役并晋升至营长。1947年加入巴基斯坦陆军，1951年出任陆军总司令，1954至1956年兼任国防部长。1958年10月7日发动军事政变推翻伊斯坎德尔·米尔扎，出任首席戒严行政官，10月27日自封总统。任内推行\"基本民主制\"（1962年宪法），推动工业化并与中国发展友好关系（1963年签署边界条约，1965年签署友好条约）。1965年第二次印巴战争后签署塔什干协议（1966年1月），遭国内强硬派抨击。1968至1969年社会抗议潮持续扩大，1969年3月25日将政权移交叶海亚·汗后辞职。著有回忆录《与自由为友》（1967年）。"
 RAJ_subhas_chanda_bose_desc:0 "1897年1月23日生于孟加拉奥里萨卡塔克一户卡雅斯塔家庭，1945年8月18日据称卒于台湾台北（飞机失事，死亡真相至今争议不断），印度民族独立运动中最富传奇色彩的领袖之一，尊称\"内塔吉\"（领袖）。毕业于加尔各答苏格兰教会学院，1919年入剑桥菲茨威廉学院，1920年以优异成绩通过印度文官考试后愤而辞职，投身独立运动，1920至1930年代多次遭英殖民当局逮捕入狱，曾当选加尔各答市长（1930年）。与甘地非暴力路线存在根本分歧，主张以武装斗争争取独立。1939年当选国大党主席，旋因与甘地派矛盾激化辞职，另建前进集团。1941年秘密出逃至德国，1943年乘潜艇辗转抵达东南亚，在日本支持下重组印度国民军，建立\"自由印度临时政府（阿齐德·欣德）\"，率INA于1944年英帕尔-科希马战役中推进至印度领土。1945年日本败降后，他在乘机飞往东北亚途中于台湾失踪，官方认定死于飞机失事烧伤，但其死亡真相持续引发争议。"
