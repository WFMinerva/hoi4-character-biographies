 RAJ_william_e_parry_desc:0 "1893年4月8日生于英格兰伦敦马里勒本，1972年8月21日卒，英国皇家海军上将，皇家印度海军末任总司令（1948-1951年）。1905年入皇家海军，一战服役。1936年任波特兰反潜学校负责官；1939年1月受命指挥新西兰轻巡洋舰阿基利斯号，并在1939年12月13日里维拉普拉塔河口海战中以该舰重创德国\"斯佩伯爵\"号袖珍战列舰，战斗中飞溅弹片击中舰桥、他的双腿受伤；此役1956年被改编为英国影片《里维拉河口战役》，帕里由杰克·格威利姆饰演。1940年起先后任新西兰海军参谋长、英国HMS雷诺恩号巡洋舰舰长，参加1944年诺曼底登陆并在盟军海军最高司令部任职。战后历任德国盟国控制委员会海军事务副主任（1946年）和英国皇家海军情报局局长（1946年7月）。1948年8月接替前任出任皇家印度海军总司令，任期至1951年1月，是英国人出任该职的最后一位；任内协助从英国过渡至印度本土军官指挥体系。1950年元旦荣升KCB爵位，1951年退役，晋升上将。"
 CBIO_RAJ_william_e_parry_desc:0 "1893年4月8日生于英格兰伦敦马里勒本，1972年8月21日卒，英国皇家海军上将，皇家印度海军末任总司令（1948-1951年）。1905年入皇家海军，一战服役。1936年任波特兰反潜学校负责官；1939年1月受命指挥新西兰轻巡洋舰阿基利斯号，并在1939年12月13日里维拉普拉塔河口海战中以该舰重创德国\"斯佩伯爵\"号袖珍战列舰，战斗中飞溅弹片击中舰桥、他的双腿受伤；此役1956年被改编为英国影片《里维拉河口战役》，帕里由杰克·格威利姆饰演。1940年起先后任新西兰海军参谋长、英国HMS雷诺恩号巡洋舰舰长，参加1944年诺曼底登陆并在盟军海军最高司令部任职。战后历任德国盟国控制委员会海军事务副主任（1946年）和英国皇家海军情报局局长（1946年7月）。1948年8月接替前任出任皇家印度海军总司令，任期至1951年1月，是英国人出任该职的最后一位；任内协助从英国过渡至印度本土军官指挥体系。1950年元旦荣升KCB爵位，1951年退役，晋升上将。"
 RAJ_GOE_william_rhodes_davis_desc:0 "1889年2月10日生于美国阿拉巴马州蒙哥马利，1941年8月1日卒于休斯顿（心脏病），美国石油商人，因在二战前后为纳粹德国获取石油资源而广受争议，绰号\"希特勒的石油商\"。出身贫寒，从铁路工人做起，1913年在俄克拉荷马州马斯科吉自立石油公司，一战以步兵中尉身份服役法国。1920年代后期进入油气勘探领域，1933年在汉堡建设炼油厂发展对德业务。1937-1939年他成功谈妥以墨西哥国有化石油换取德意两国合同的交换协议，在英国海上封锁前为德意储备大量战略石油；英国法院曾以诈骗指控缺席判决其有罪。1939年9月二战爆发前，他曾尝试充当德美非官方和平斡旋人，游说富兰克林·罗斯福总统接受希特勒谈判条件，未果。美国联邦调查局已将其列为德国特工调查对象。1941年8月1日在休斯顿猝死，死亡真相至今存疑（部分史学家认为遭英国情报机构暗杀）；其子小约瑟夫·戴维斯后来成为加利福尼亚州长（1999-2003年）。（备注：此人与英属印度的直接关联需进一步查实，其石油网络曾延伸至大英帝国各地。）"
 CBIO_RAJ_GOE_william_rhodes_davis_desc:0 "1889年2月10日生于美国阿拉巴马州蒙哥马利，1941年8月1日卒于休斯顿（心脏病），美国石油商人，因在二战前后为纳粹德国获取石油资源而广受争议，绰号\"希特勒的石油商\"。出身贫寒，从铁路工人做起，1913年在俄克拉荷马州马斯科吉自立石油公司，一战以步兵中尉身份服役法国。1920年代后期进入油气勘探领域，1933年在汉堡建设炼油厂发展对德业务。1937-1939年他成功谈妥以墨西哥国有化石油换取德意两国合同的交换协议，在英国海上封锁前为德意储备大量战略石油；英国法院曾以诈骗指控缺席判决其有罪。1939年9月二战爆发前，他曾尝试充当德美非官方和平斡旋人，游说富兰克林·罗斯福总统接受希特勒谈判条件，未果。美国联邦调查局已将其列为德国特工调查对象。1941年8月1日在休斯顿猝死，死亡真相至今存疑（部分史学家认为遭英国情报机构暗杀）；其子小约瑟夫·戴维斯后来成为加利福尼亚州长（1999-2003年）。（备注：此人与英属印度的直接关联需进一步查实，其石油网络曾延伸至大英帝国各地。）"
 RAJ_bhalchandra_trimbak_ranadive_desc:0 "1904年12月19日生于孟买达达尔一户钱德拉塞尼亚卡亚斯塔普拉布家庭，1990年4月6日卒，通称\"BTR\"，印度共产党领袖与工人运动活动家。1927年以优等成绩获孟买文学硕士学位，1928年秘密加入CPI，同年成为全印工会大会孟买领袖，在吉尔尼纺织工人工会和大印度半岛铁路工人工会中担任主要组织者，并任后者总书记。1929年被捕参加米鲁特阴谋案审判，入狱数年。1943年进入CPI中央委员会。1946年2月主导组织了声援皇家印度海军起义的孟买同情大罢工，扩大了运动的政治影响。1948年2月CPI第二次全国代表大会上被推选为总书记，任内倡导城市武装起义路线，支持泰伦加纳农村武装斗争，被称为\"拉纳迪夫路线\"；1950年因该路线被党内批判为\"左冒险主义\"而被撤销职务。1964年CPI分裂时加入印度共产党（马克思主义），并成为其核心领导人之一。1970年5月在加尔各答出席全印工会中心创建会议，当选首任主席，此后长期领导CITU直至去世。新德里CITU总部大楼以其名命名。"
 CBIO_RAJ_bhalchandra_trimbak_ranadive_desc:0 "1904年12月19日生于孟买达达尔一户钱德拉塞尼亚卡亚斯塔普拉布家庭，1990年4月6日卒，通称\"BTR\"，印度共产党领袖与工人运动活动家。1927年以优等成绩获孟买文学硕士学位，1928年秘密加入CPI，同年成为全印工会大会孟买领袖，在吉尔尼纺织工人工会和大印度半岛铁路工人工会中担任主要组织者，并任后者总书记。1929年被捕参加米鲁特阴谋案审判，入狱数年。1943年进入CPI中央委员会。1946年2月主导组织了声援皇家印度海军起义的孟买同情大罢工，扩大了运动的政治影响。1948年2月CPI第二次全国代表大会上被推选为总书记，任内倡导城市武装起义路线，支持泰伦加纳农村武装斗争，被称为\"拉纳迪夫路线\"；1950年因该路线被党内批判为\"左冒险主义\"而被撤销职务。1964年CPI分裂时加入印度共产党（马克思主义），并成为其核心领导人之一。1970年5月在加尔各答出席全印工会中心创建会议，当选首任主席，此后长期领导CITU直至去世。新德里CITU总部大楼以其名命名。"
 RAJ_bhaskar_soman_desc:0 "1913年3月30日生于中央印度瓜廖尔土邦，1995年2月8日卒，印度海军上将，第四任海军参谋长（1962-1966年）。早年就读于印度国大党创办的提拉克学校，后入皇家印度海军，经训练舰达芬号初训后于1932年赴英国受军官训练，1934年9月以见习少尉军衔回国。二战期间曾作为HMIS科瓦利斯号舰长在红海和波斯湾服役（1939-1940年），并参与击沉意大利潜艇\"伽利略\"号，后指挥扫雷舰。1946年晋升中校并出任皇家印度海军起草司令，成为首位担任该职的印度籍军官；1947年7月21日晋升代理上校，为首批达到该军衔的印度海军军官之一。独立后历任多职，1961年印度解放果阿军事行动期间任印度舰队司令，指挥海军作战。1962年6月5日接替卡塔里出任第四任海军参谋长，任期至1966年11月，期间历经1965年第二次印巴战争（受政治指示舰队留港未出）。1980年10月21日由桑贾伊总统追授上将荣誉军衔（退役后晋级）。"
 CBIO_RAJ_bhaskar_soman_desc:0 "1913年3月30日生于中央印度瓜廖尔土邦，1995年2月8日卒，印度海军上将，第四任海军参谋长（1962-1966年）。早年就读于印度国大党创办的提拉克学校，后入皇家印度海军，经训练舰达芬号初训后于1932年赴英国受军官训练，1934年9月以见习少尉军衔回国。二战期间曾作为HMIS科瓦利斯号舰长在红海和波斯湾服役（1939-1940年），并参与击沉意大利潜艇\"伽利略\"号，后指挥扫雷舰。1946年晋升中校并出任皇家印度海军起草司令，成为首位担任该职的印度籍军官；1947年7月21日晋升代理上校，为首批达到该军衔的印度海军军官之一。独立后历任多职，1961年印度解放果阿军事行动期间任印度舰队司令，指挥海军作战。1962年6月5日接替卡塔里出任第四任海军参谋长，任期至1966年11月，期间历经1965年第二次印巴战争（受政治指示舰队留港未出）。1980年10月21日由桑贾伊总统追授上将荣誉军衔（退役后晋级）。"
 RAJ_GOE_rash_behari_bose_desc:0 "1886年5月25日生于英属印度孟加拉旁纳巴尔丹县苏巴尔达哈村，1945年1月21日卒于东京（肺结核），印度革命家，印度独立联盟创始人，印度国民军的奠基组织者。早年就读于尚德纳高尔杜普利克斯学院，后在德拉敦林业研究所任书记时秘密投身革命活动。1912年12月23日策划并执行刺杀印度总督哈丁勋爵事件（于新德里皇家大道阅兵队伍中掷炸弹，哈丁受伤但未死），成功脱逃英国警探搜捕。1915年参与组织贾达尔党在印度军队中发动兵变的计划，失败后乘船偷渡抵达日本，化名\"普里亚纳思·塔库尔\"藏身日本民族主义团体之间。1923年娶日本茶馆主之女户塚俊子为妻（八年后俊子病逝），取得日本国籍，长居东京。1942年3月28-30日在东京召集印度国民代表大会，决议成立印度独立联盟；同年6月22日在曼谷召集第二次大会，通过决议邀请苏巴斯·钱德拉·鲍斯来任领袖；1943年7月在新加坡正式将领导权移交给苏巴斯·鲍斯，但其所建立的组织框架成为鲍斯重建INA的基础。1943年获日本旭日章。1945年1月21日因结核病在东京病逝，骨灰于2013年由日本送返钱德纳高尔并投入胡格利河。"
