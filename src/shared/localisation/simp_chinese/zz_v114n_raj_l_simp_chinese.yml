 CBIO_RAJ_p_krishna_pillai_desc:0 "1906年8月19日生于特拉凡科尔邦韦科姆一户中下层奈尔家庭，1948年8月19日在阿勒佩穆哈马因毒蛇咬伤去世，喀拉拉共产主义运动的奠基人。幼年丧双亲，五年级辍学，1920年离家北上游历印度次大陆。归来后投身社会运动，1924年参加韦科姆反种姓歧视苦行运动，1930年参加科泽科德至帕扬努尔的食盐进军。早年为甘地主义者与国大党党员，1931年成为第一个在古鲁瓦尤尔神庙敲钟的非婆罗门。1934年国大社会党在孟买成立后他出任喀拉拉书记。1937至1939年间他将马拉巴尔的国大社会党支部转化为印共喀拉拉省委，1939年12月下旬皮纳莱会议召开，正式建立喀拉拉省共产党，他当选首任邦书记。任内组织椰壳纤维、纺织、制砖工人工会逾八十个，1938年领导阿勒佩大罢工。1946年彭纳普拉-瓦亚拉尔武装斗争的组织基础即出自他之手。1948年印共接受加尔各答论纲、遭全国取缔后他转入地下，同年8月19日——恰逢四十二岁生日——躲藏于穆哈马一间工人茅屋时被蛇咬死。他去世九年后，1957年喀拉拉在他奠定的基础上选出印度第一个共产党邦政府。"
