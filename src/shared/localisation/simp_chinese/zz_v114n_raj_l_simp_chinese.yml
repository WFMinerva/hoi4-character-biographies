 RAJ_GOE_jawaharlal_nehru_desc:0 "1889年11月14日生于安拉哈巴德（今普拉亚格拉吉）一个克什米尔潘迪特婆罗门精英家庭，1964年5月27日卒于新德里（脑卒中继发心脏病），印度首任总理（1947年8月15日—1964年5月27日），任期16年286天，迄今最长，不结盟运动主要倡导者，被称为\"现代印度的建筑师\"。父亲莫提拉尔·尼赫鲁系知名律师兼独立运动领袖，本人就读哈罗公学、剑桥三一学院（自然科学）和伦敦内殿律师学院，1912年回国后放弃律师业、全身投入甘地的独立运动，此后曾九度系狱（合计约九年）。1929年主持拉合尔国大党年会通过\"完全独立\"决议，成为全国政治偶像。1947年8月15日印度独立后即任总理兼外务部长，任内力推五年计划工业化、建立印度理工学院等高等教育体系、确立政教分离与普选民主制度；对外坚持不结盟立场，1955年万隆会议与纳赛尔、铁托共同倡导第三世界原则，1961年以军事行动收复果阿；但1962年中印边境战争惨败重创其政治威望，此后健康每况愈下，1964年5月27日在新德里辞世。其女英迪拉·甘地后成为印度第三任总理。"
