 RAJ_john_edward_golightly_desc:0 "此名出自鲁德亚德·吉卜林的短篇小说《戈利特利中尉被捕记》，1886年11月23日首刊于拉合尔《军民公报》，后收入吉卜林首部短篇小说集《山中故事集》。故事主人公戈利特利是驻印英军的一名年轻中尉，极爱以“军官加绅士”的体面自居、衣着考究。某次休假结束他骑马从达豪西匆匆下山，途中遭遇季风暴雨：几度落马、浑身泥泞，廉价卡其制服的劣质染料被雨水冲得满身斑驳，遮阳头盔泡成一团烂泥，领带与衣领也褪色脱落，活像个邋遢逃兵。抵达火车站后，他被站长误认作两周前开小差的“宾克尔二等兵”，在破口大骂中被四名警察拘捕、押交英军分队（士兵们对其流利的脏话啧啧称奇，却不信他是军官），险些被解往阿姆利则，最后靠本团一名少校认出方获释；而这桩糗事很快传遍全省，令其颜面扫地。这是吉卜林不满21岁时写就的一篇讽刺虚荣、令人捧腹的喜剧小品。非真实的英属印度政治人物。"
 CBIO_RAJ_john_edward_golightly_desc:0 "此名出自鲁德亚德·吉卜林的短篇小说《戈利特利中尉被捕记》，1886年11月23日首刊于拉合尔《军民公报》，后收入吉卜林首部短篇小说集《山中故事集》。故事主人公戈利特利是驻印英军的一名年轻中尉，极爱以“军官加绅士”的体面自居、衣着考究。某次休假结束他骑马从达豪西匆匆下山，途中遭遇季风暴雨：几度落马、浑身泥泞，廉价卡其制服的劣质染料被雨水冲得满身斑驳，遮阳头盔泡成一团烂泥，领带与衣领也褪色脱落，活像个邋遢逃兵。抵达火车站后，他被站长误认作两周前开小差的“宾克尔二等兵”，在破口大骂中被四名警察拘捕、押交英军分队（士兵们对其流利的脏话啧啧称奇，却不信他是军官），险些被解往阿姆利则，最后靠本团一名少校认出方获释；而这桩糗事很快传遍全省，令其颜面扫地。这是吉卜林不满21岁时写就的一篇讽刺虚荣、令人捧腹的喜剧小品。非真实的英属印度政治人物。"
 RAJ_john_mathai_desc:0 "1886年1月10日生于英属印度马德拉斯管辖区科泽科德（卡利卡特，今喀拉拉邦），1959年卒，印度经济学家、工业管理专家，印度独立后第二任财政部长（1948年4月—1950年6月）。出身叙利亚基督徒家庭，剑桥大学深造，回国后活跃于孟买商业与学术界，历任孟买大学教授及多家大型企业要职。独立后被尼赫鲁政府委以财政重任，在任内致力于整合并稳定独立初期的货币与财政体系；然而对1950年3月建立规划委员会一事强烈反对，认为该机构绕过内阁负责制、另立平行决策中心，使各部权责体系形同虚设，遂于1950年6月以此为由愤而辞职，成为独立印度内阁因政策原则分歧而主动辞职的著名案例之一。辞职后在商界继续活跃并撰写经济政策评论，1959年在喀拉拉去世。"
 CBIO_RAJ_john_mathai_desc:0 "1886年1月10日生于英属印度马德拉斯管辖区科泽科德（卡利卡特，今喀拉拉邦），1959年卒，印度经济学家、工业管理专家，印度独立后第二任财政部长（1948年4月—1950年6月）。出身叙利亚基督徒家庭，剑桥大学深造，回国后活跃于孟买商业与学术界，历任孟买大学教授及多家大型企业要职。独立后被尼赫鲁政府委以财政重任，在任内致力于整合并稳定独立初期的货币与财政体系；然而对1950年3月建立规划委员会一事强烈反对，认为该机构绕过内阁负责制、另立平行决策中心，使各部权责体系形同虚设，遂于1950年6月以此为由愤而辞职，成为独立印度内阁因政策原则分歧而主动辞职的著名案例之一。辞职后在商界继续活跃并撰写经济政策评论，1959年在喀拉拉去世。"
 RAJ_subroto_mukherjee_desc:0 "1911年3月5日生于加尔各答（父为印度文职体系官员，姐姐列努卡·雷后成为知名议员），1960年11月8日随印度代表团赴东京、于一家餐厅进食时因食物哽喉窒息猝死，印度空军第一任印度籍总司令（1954年）暨首任总参谋长（1955年），被尊称为\"印度空军之父\"。1932年8月以首批六名印度学员之一从皇家空军学院克兰威尔受委任，1933年4月1日加入第1飞行中队；凭借一系列\"首次\"奠定历史地位：首位指挥飞行编队（1938年）、首位指挥飞行中队（1939年）、首位指挥军事航空站科哈特的印度人（1943年）。二战中在空军总部从事参谋工作，获大英帝国勋章。独立后以副总司令身份在三位英籍总司令手下历练，1954年4月1日正式接任、成为首位印度籍空军司令。任内将印度空军完成全喷气化升级，引进达索神秘式、霍克猎人、BAe堪培拉和福兰蚊式战机；同时担任参谋长联席会议主席长达五年余（史上最长）。其妻薛达·穆克吉后出任多个邦的邦长；为纪念其构想而创设的苏布罗托杯全国中学足球锦标赛至今仍为印度最大规模青少年足球赛事。"
 CBIO_RAJ_subroto_mukherjee_desc:0 "1911年3月5日生于加尔各答（父为印度文职体系官员，姐姐列努卡·雷后成为知名议员），1960年11月8日随印度代表团赴东京、于一家餐厅进食时因食物哽喉窒息猝死，印度空军第一任印度籍总司令（1954年）暨首任总参谋长（1955年），被尊称为\"印度空军之父\"。1932年8月以首批六名印度学员之一从皇家空军学院克兰威尔受委任，1933年4月1日加入第1飞行中队；凭借一系列\"首次\"奠定历史地位：首位指挥飞行编队（1938年）、首位指挥飞行中队（1939年）、首位指挥军事航空站科哈特的印度人（1943年）。二战中在空军总部从事参谋工作，获大英帝国勋章。独立后以副总司令身份在三位英籍总司令手下历练，1954年4月1日正式接任、成为首位印度籍空军司令。任内将印度空军完成全喷气化升级，引进达索神秘式、霍克猎人、BAe堪培拉和福兰蚊式战机；同时担任参谋长联席会议主席长达五年余（史上最长）。其妻薛达·穆克吉后出任多个邦的邦长；为纪念其构想而创设的苏布罗托杯全国中学足球锦标赛至今仍为印度最大规模青少年足球赛事。"
 RAJ_mohan_singh_desc:0 "1909年1月3日生于西旁遮普省锡亚尔科特专区巴迪亚纳村（今巴基斯坦旁遮普），父亲在其出生前两月辞世，1989年12月26日卒，印度独立运动军事领袖，第一届印度国民军创建者与首任司令。1927年入英属印度陆军第14旁遮普联队，1935年受委任为军官，随部赴马来亚服役。1941年12月日本入侵后其营在吉达战役中被优势日军击溃，本人在丛林中潜行数日后被俘，后与日本情报官藤原岩市会面、接受将战俘转化为独立军队的构想。1942年9月1日正式宣布INA成立，志愿兵力达约四万人；但随后因多次怀疑日军意图以INA为附庸工具而非真正盟友，与日方爆发激烈冲突，1942年12月29日遭日军宪兵逮捕、被撤销指挥权，第一届INA随即解散。1943年苏巴斯·钱德拉·鲍斯到来后重建的INA未再重用莫汉·辛格；日本战败后被英方遣返印度受审，因红堡审判引发的全国同情潮而仅被革职处理。独立后定居旁遮普卢迪亚纳附近的朱吉亚纳村，先后当选Rajya Sabha议员。"
 CBIO_RAJ_mohan_singh_desc:0 "1909年1月3日生于西旁遮普省锡亚尔科特专区巴迪亚纳村（今巴基斯坦旁遮普），父亲在其出生前两月辞世，1989年12月26日卒，印度独立运动军事领袖，第一届印度国民军创建者与首任司令。1927年入英属印度陆军第14旁遮普联队，1935年受委任为军官，随部赴马来亚服役。1941年12月日本入侵后其营在吉达战役中被优势日军击溃，本人在丛林中潜行数日后被俘，后与日本情报官藤原岩市会面、接受将战俘转化为独立军队的构想。1942年9月1日正式宣布INA成立，志愿兵力达约四万人；但随后因多次怀疑日军意图以INA为附庸工具而非真正盟友，与日方爆发激烈冲突，1942年12月29日遭日军宪兵逮捕、被撤销指挥权，第一届INA随即解散。1943年苏巴斯·钱德拉·鲍斯到来后重建的INA未再重用莫汉·辛格；日本战败后被英方遣返印度受审，因红堡审判引发的全国同情潮而仅被革职处理。独立后定居旁遮普卢迪亚纳附近的朱吉亚纳村，先后当选Rajya Sabha议员。"
 RAJ_sahajanand_saraswati_desc:0 "1889年2月22日生于北方省加济普尔专区德瓦村一户布米哈尔婆罗门家庭，1950年6月26日卒于比哈尔邦西塔格尔希，印度农民运动奠基人、印度教苦行僧与社会活动家。早年在阿约提亚出家皈依十名僧侣次序成为斯瓦米，以宗教学养和社会宣传并举，致力于改变比哈尔农民受地主剥削的处境。1929年在巴特纳创立比哈尔省农民大会，1936年于勒克瑙成立全印农民大会，出任首任主席，在数年内将其发展成涵盖比哈尔、孟加拉、联合省等地数百万农民的最大左翼农民组织；任内积极与印度共产党建立合作关系，主张废除柴明达尔制度，实现\"土地归耕者\"，为独立后印度土改运动奠定理论与组织基础。二战期间持续推进农民权益斗争，但1940年代末期与共产党分歧日深，逐渐退出一线政治。著有大量比哈尔方言及印地语农民权益著述，其自传《我的生命斗争》是印度左翼史料的重要文献。"
