 RAJ_GOE_kodandera_subayya_thimayya_desc:0 "1906年1月30日生于卡纳塔克科达古（库尔格）姆纳尔卡特，1965年12月18日在塞浦路斯任上猝逝，印度陆军上将，第四任陆军参谋长（1957—1961）。毕业于普纳维多利亚军事学院与桑赫斯特皇家军事学院，1926年受委任。二战参加缅甸战役。1947年印巴战争期间参与克什米尔作战。1957年出任陆军参谋长，因与国防部长克里希纳·梅农在国防政策（包括对华边境部署）上意见尖锐分歧，1959年递交辞呈，被尼赫鲁总理挽留，此事引发广泛讨论。1961年退役。1964年出任联合国驻塞浦路斯维和部队指挥官，1965年12月18日在尼科西亚心脏病发猝逝于任上。卡里亚帕和蒂迈雅均出身卡纳塔克科达古这一仅约十万人的小地方，先后出任印度陆军最高将领，传为佳话。"
