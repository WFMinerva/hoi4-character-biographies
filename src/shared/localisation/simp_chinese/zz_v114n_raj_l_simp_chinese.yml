 CBIO_RAJ_GOE_m_n_roy_desc:0 "1887年3月21日生于英属印度孟加拉省阿尔贝利亚村（原名纳连德拉·纳特·巴塔恰里亚），1954年1月25日卒于德拉敦，印度革命家、国际共产主义运动活动家与哲学家，后转型为\"激进人文主义\"的独创思想家。早年参与孟加拉革命运动（尤加纳尔组织），1915年在组织德国武装资助革命的秘密任务中出走印度，先后流亡美国（1916年）和墨西哥（1917年），在墨西哥加入社会主义党并创建墨西哥共产党（1919年，为西半球最早的共产党之一），后前往莫斯科，成为共产国际（第三国际）执行委员会委员，在巴库会议上以亚洲革命代言人出现。1920年在塔什干协助创建印度共产党，1927年以共产国际代表身份赴中国主持国共合作政策，后因蒋介石发动\"四一二\"政变导致共产国际中国路线失败而遭受批判；1929年与斯大林决裂被开除党籍，此后流亡欧洲期间逐渐发展出脱离苏联路线的批判马克思主义思想。1930年秘密潜回印度，1931年被英国当局以阴谋罪逮捕，判处六年有期徒刑，1936年出狱。此后与国大党左翼协作，二战期间因坚持支持盟军而在政治上日益孤立；1940年代创建\"激进民主党\"，战后进一步发展\"激进人文主义\"理论框架（以科学理性、个人自由、反威权主义为核心），晚年在德拉敦从事研究写作，1954年1月25日辞世。"
