 CBIO_RAJ_ahmad_yar_khan_desc:0 "约1902年生于卡拉特，1979年卒于卡拉特，卡拉特汗国末代汗王（在位1933—1948），阿赫梅德扎伊王朝出身，1933年继位。1947年英国撤离时他拒绝加入巴基斯坦，宣布卡拉特独立，并获英方短暂承认。然而围绕这一独立主张，巴基斯坦与卡拉特方面存在根本分歧：1948年3月27日巴基斯坦军队进入卡拉特，他随后签署合并文件，卡拉特汗国正式并入巴基斯坦，但合并过程是否出于自愿，各方表述至今仍有争议。其弟阿卜杜勒·卡里姆王子随后发动武装抵抗，掀起第一次俾路支叛乱。艾哈迈德·亚尔·汗此后参与巴基斯坦政治活动，并长期为俾路支自治权发声，1979年去世于卡拉特。"
 RAJ_ahmad_yar_khan_desc:0 "约1902年生于卡拉特，1979年卒于卡拉特，卡拉特汗国末代汗王（在位1933—1948），阿赫梅德扎伊王朝出身，1933年继位。1947年英国撤离时他拒绝加入巴基斯坦，宣布卡拉特独立，并获英方短暂承认。然而围绕这一独立主张，巴基斯坦与卡拉特方面存在根本分歧：1948年3月27日巴基斯坦军队进入卡拉特，他随后签署合并文件，卡拉特汗国正式并入巴基斯坦，但合并过程是否出于自愿，各方表述至今仍有争议。其弟阿卜杜勒·卡里姆王子随后发动武装抵抗，掀起第一次俾路支叛乱。艾哈迈德·亚尔·汗此后参与巴基斯坦政治活动，并长期为俾路支自治权发声，1979年去世于卡拉特。"
 CBIO_RAJ_maharaja_jayachamarajendra_wadiyar_desc:0 "1919年7月18日生于迈索尔，1974年9月23日卒于班加罗尔王宫，迈索尔土邦末代大君（在位1940—1950），瓦迪亚尔王朝第二十五代君主。1940年继其父纳尔瓦迪·克里希纳拉贾之后即位，年仅二十一岁。在位期间继续推动迈索尔的工业化与教育发展，重视音乐与文化，本人精通维纳琴和钢琴，是卡纳塔克古典音乐的知名赞助者与哲学著作家。1947年独立后他签署加入印度联邦的合并文书，1950年至1956年出任迈索尔邦拉杰普拉穆克。此后任迈索尔邦（后改名卡纳塔克邦）邦长（1956—1964）。1974年9月23日卒于班加罗尔王宫，迈索尔王室至今在当地保持文化影响力。"
 RAJ_maharaja_jayachamarajendra_wadiyar_desc:0 "1919年7月18日生于迈索尔，1974年9月23日卒于班加罗尔王宫，迈索尔土邦末代大君（在位1940—1950），瓦迪亚尔王朝第二十五代君主。1940年继其父纳尔瓦迪·克里希纳拉贾之后即位，年仅二十一岁。在位期间继续推动迈索尔的工业化与教育发展，重视音乐与文化，本人精通维纳琴和钢琴，是卡纳塔克古典音乐的知名赞助者与哲学著作家。1947年独立后他签署加入印度联邦的合并文书，1950年至1956年出任迈索尔邦拉杰普拉穆克。此后任迈索尔邦（后改名卡纳塔克邦）邦长（1956—1964）。1974年9月23日卒于班加罗尔王宫，迈索尔王室至今在当地保持文化影响力。"
 RAJ_GOE_ishar_singh_desc:0 "1895年（一说1896年）12月30日生，出生地各源有异（一说旁遮普纳瓦村，一说卢迪亚纳县乔兰村），1963年12月2日卒，锡克族英属印度陆军士兵，维多利亚十字勋章得主，第一位获此殊荣的锡克人。1921年瓦齐里斯坦战役期间，他以第28旁遮普步兵团列兵身份服役，1921年4月10日在海达里卡奇附近，在敌火下只身掩护战友撤退、反复冲入阵地救出伤员，表现出非凡英勇，同年11月25日伦敦公报刊登授予维多利亚十字勋章的通告，为第一位获此勋章的锡克人。此后晋升至上尉，并获英属印度一级勋章（附\"萨达尔·巴哈杜尔\"荣衔）。二战期间他再度服役。其维多利亚十字勋章现藏于阿什克罗夫特勋爵收藏。"
 CBIO_RAJ_GOE_ishar_singh_desc:0 "1895年（一说1896年）12月30日生，出生地各源有异（一说旁遮普纳瓦村，一说卢迪亚纳县乔兰村），1963年12月2日卒，锡克族英属印度陆军士兵，维多利亚十字勋章得主，第一位获此殊荣的锡克人。1921年瓦齐里斯坦战役期间，他以第28旁遮普步兵团列兵身份服役，1921年4月10日在海达里卡奇附近，在敌火下只身掩护战友撤退、反复冲入阵地救出伤员，表现出非凡英勇，同年11月25日伦敦公报刊登授予维多利亚十字勋章的通告，为第一位获此勋章的锡克人。此后晋升至上尉，并获英属印度一级勋章（附\"萨达尔·巴哈杜尔\"荣衔）。二战期间他再度服役。其维多利亚十字勋章现藏于阿什克罗夫特勋爵收藏。"
 RAJ_GOE_yahya_khan_desc:0 "1917年2月4日生于旁遮普恰克瓦尔一户军人家庭，1980年8月10日卒于拉瓦尔品第，巴基斯坦陆军上将，巴基斯坦第三任总统兼首席戒严行政官（1969—1971）。就读于德拉敦威尔士王子皇家印度军事学院后入德拉敦印度军事学院，1939年受委任入英属印度陆军，二战参加北非及意大利战役。独立后留在巴基斯坦军中，1966年接替阿尤布·汗出任陆军总司令。1969年3月阿尤布·汗下台后接管政权，宣布戒严并解散议会。1970年主持独立以来首次全国大选，谢赫·穆吉布尔·拉赫曼领导的阿瓦米联盟获多数席位，他拒绝移交权力，导致东巴基斯坦危机及解放战争。1971年12月第三次印巴战争爆发，印度介入后巴基斯坦东部驻军于12月16日投降，东巴基斯坦独立为孟加拉国。叶海亚·汗随即将权力移交佐勒菲卡尔·阿里·布托，此后遭软禁，1979年获释，1980年去世，葬于白沙瓦。"
 CBIO_RAJ_GOE_yahya_khan_desc:0 "1917年2月4日生于旁遮普恰克瓦尔一户军人家庭，1980年8月10日卒于拉瓦尔品第，巴基斯坦陆军上将，巴基斯坦第三任总统兼首席戒严行政官（1969—1971）。就读于德拉敦威尔士王子皇家印度军事学院后入德拉敦印度军事学院，1939年受委任入英属印度陆军，二战参加北非及意大利战役。独立后留在巴基斯坦军中，1966年接替阿尤布·汗出任陆军总司令。1969年3月阿尤布·汗下台后接管政权，宣布戒严并解散议会。1970年主持独立以来首次全国大选，谢赫·穆吉布尔·拉赫曼领导的阿瓦米联盟获多数席位，他拒绝移交权力，导致东巴基斯坦危机及解放战争。1971年12月第三次印巴战争爆发，印度介入后巴基斯坦东部驻军于12月16日投降，东巴基斯坦独立为孟加拉国。叶海亚·汗随即将权力移交佐勒菲卡尔·阿里·布托，此后遭软禁，1979年获释，1980年去世，葬于白沙瓦。"
 RAJ_GOE_parkash_singh_desc:0 "1913年3月31日生于英属印度旁遮普莱亚尔普尔区沙里卡尔村一户贾特锡克家庭，1991年3月23日卒，英属印度陆军士兵，维多利亚十字勋章得主，最终军衔少校。1936年11月21日应征入伍于第8旁遮普步兵团，先在西北边境服役。二战中以准下士（哈维尔达）身份任第5营第8旁遮普团布伦枪装甲车排成员。1943年1月6日在缅甸阿拉干多奈克马尤半岛，两辆装甲车被日军击毁、乘员无力自救，他主动驾车出击救出两车乘员及武器；1月19日同地再度出击救出另两辆被击毁车辆及车内伤员，全程处于猛烈敌火之下，完全出于个人主动。凭借两次行动获颁维多利亚十字勋章。1943年8月15日被委任为总督任命军官。印度独立后转入锡克团继续服役，最终晋升少校，1968年退役。"
 CBIO_RAJ_GOE_parkash_singh_desc:0 "1913年3月31日生于英属印度旁遮普莱亚尔普尔区沙里卡尔村一户贾特锡克家庭，1991年3月23日卒，英属印度陆军士兵，维多利亚十字勋章得主，最终军衔少校。1936年11月21日应征入伍于第8旁遮普步兵团，先在西北边境服役。二战中以准下士（哈维尔达）身份任第5营第8旁遮普团布伦枪装甲车排成员。1943年1月6日在缅甸阿拉干多奈克马尤半岛，两辆装甲车被日军击毁、乘员无力自救，他主动驾车出击救出两车乘员及武器；1月19日同地再度出击救出另两辆被击毁车辆及车内伤员，全程处于猛烈敌火之下，完全出于个人主动。凭借两次行动获颁维多利亚十字勋章。1943年8月15日被委任为总督任命军官。印度独立后转入锡克团继续服役，最终晋升少校，1968年退役。"
 RAJ_frank_messervy_desc:0 "1893年12月9日生于特立尼达，1974年2月2日卒于英格兰西萨塞克斯米德赫斯特，英国陆军上将，首任巴基斯坦陆军总司令（1947年8月—1948年2月）。毕业于伊顿公学与桑赫斯特皇家军事学院，1913年入英属印度陆军第9霍德森骠骑兵团，一战转战法国、巴勒斯坦、叙利亚。二战先后指挥加泽尔快速部队（东非）、第4印度步兵师（北非，参加\"战斧行动\"）、第7装甲师\"沙漠之鼠\"（北非，加扎拉战役中被俘后机智脱险）、第7印度步兵师（缅甸阿拉干）及第4军（缅甸1945年反攻，攻克仰光）。他是整个二战中唯一指挥英国（非印度）陆军师的英属印度军官。战后任英属印度北方司令，1947年8月巴基斯坦独立后出任首任总司令，在第一次印巴战争克什米尔危机的敏感时期处于要职。1948年2月退役，1974年去世。"
 CBIO_RAJ_frank_messervy_desc:0 "1893年12月9日生于特立尼达，1974年2月2日卒于英格兰西萨塞克斯米德赫斯特，英国陆军上将，首任巴基斯坦陆军总司令（1947年8月—1948年2月）。毕业于伊顿公学与桑赫斯特皇家军事学院，1913年入英属印度陆军第9霍德森骠骑兵团，一战转战法国、巴勒斯坦、叙利亚。二战先后指挥加泽尔快速部队（东非）、第4印度步兵师（北非，参加\"战斧行动\"）、第7装甲师\"沙漠之鼠\"（北非，加扎拉战役中被俘后机智脱险）、第7印度步兵师（缅甸阿拉干）及第4军（缅甸1945年反攻，攻克仰光）。他是整个二战中唯一指挥英国（非印度）陆军师的英属印度军官。战后任英属印度北方司令，1947年8月巴基斯坦独立后出任首任总司令，在第一次印巴战争克什米尔危机的敏感时期处于要职。1948年2月退役，1974年去世。"
 RAJ_GOE_francis_tuker_desc:0 "1894年7月4日生于英格兰埃塞克斯，1967年10月7日卒，英属印度陆军中将，绰号\"格蒂\"，廓尔喀军史专家。毕业于布赖顿学院与桑赫斯特，1914年入皇家萨塞克斯团，同年转入第2廓尔喀步枪团（廓尔喀人成为他终生事业的中心）。两战之间参加瓦齐里斯坦作战，1937年晋中校兼团长。1941年12月起接任第4印度步兵师师长，率部参加北非（西部沙漠战役）及意大利（卡西诺战役）战场作战。1944年卡西诺山战役期间，他依据在那不勒斯旧书摊翻到的一本1879年出版的修道院建筑史，以专业军事判断主张用重型炸弹轰炸卡西诺修道院、防止德军借其固守，盟军接受建议后将其炸毁；然而随后德军占据废墟、借废墟防守，证明其战术判断具有两面性。同年2月因重病离职，1946年任印度东方司令部总司令。1948年退役，1967年去世。著有《廓尔喀》（1957）等军事史著作。"
 CBIO_RAJ_GOE_francis_tuker_desc:0 "1894年7月4日生于英格兰埃塞克斯，1967年10月7日卒，英属印度陆军中将，绰号\"格蒂\"，廓尔喀军史专家。毕业于布赖顿学院与桑赫斯特，1914年入皇家萨塞克斯团，同年转入第2廓尔喀步枪团（廓尔喀人成为他终生事业的中心）。两战之间参加瓦齐里斯坦作战，1937年晋中校兼团长。1941年12月起接任第4印度步兵师师长，率部参加北非（西部沙漠战役）及意大利（卡西诺战役）战场作战。1944年卡西诺山战役期间，他依据在那不勒斯旧书摊翻到的一本1879年出版的修道院建筑史，以专业军事判断主张用重型炸弹轰炸卡西诺修道院、防止德军借其固守，盟军接受建议后将其炸毁；然而随后德军占据废墟、借废墟防守，证明其战术判断具有两面性。同年2月因重病离职，1946年任印度东方司令部总司令。1948年退役，1967年去世。著有《廓尔喀》（1957）等军事史著作。"
 RAJ_GOE_rajendrasinhji_jadeja_desc:0 "1899年6月15日生于古吉拉特卡西亚瓦尔地区萨罗达尔，1964年1月1日卒，印度陆军上将，印度独立后首任陆军参谋长（1953—1955）。出身纳瓦纳格尔土邦贾德贾拉其普特王族（名板球手拉吉辛吉之侄），就读拉杰科特拉杰库马尔学院及马尔文学院，后入桑赫斯特皇家军事学院，1921年委任于第2皇家枪骑兵团。二战期间在北非战役中被包围于梅基里后率部突围，获杰出服务勋章。1945至1946年出任首位赴华盛顿的印度军事武官。独立后历任德里-东旁遮普司令、东方司令、南方司令，其间监督海得拉巴并入印度的\"波罗行动\"。1953年1月14日接卡里亚帕之后出任陆军总司令，1955年4月1日起改称\"陆军参谋长\"（总统已成为武装力量总司令）。1955年5月14日退役，1964年元旦去世，享年六十四岁。"
 CBIO_RAJ_GOE_rajendrasinhji_jadeja_desc:0 "1899年6月15日生于古吉拉特卡西亚瓦尔地区萨罗达尔，1964年1月1日卒，印度陆军上将，印度独立后首任陆军参谋长（1953—1955）。出身纳瓦纳格尔土邦贾德贾拉其普特王族（名板球手拉吉辛吉之侄），就读拉杰科特拉杰库马尔学院及马尔文学院，后入桑赫斯特皇家军事学院，1921年委任于第2皇家枪骑兵团。二战期间在北非战役中被包围于梅基里后率部突围，获杰出服务勋章。1945至1946年出任首位赴华盛顿的印度军事武官。独立后历任德里-东旁遮普司令、东方司令、南方司令，其间监督海得拉巴并入印度的\"波罗行动\"。1953年1月14日接卡里亚帕之后出任陆军总司令，1955年4月1日起改称\"陆军参谋长\"（总统已成为武装力量总司令）。1955年5月14日退役，1964年元旦去世，享年六十四岁。"
 RAJ_GOE_shah_nawaz_khan_desc:0 "1914年1月24日生于旁遮普拉瓦尔品第区卡胡塔马托雷村一户军人家庭，1983年12月9日卒于勒克瑙，印度自由运动活动家、印度国民军少将，后为国大党政治家。就读于德拉敦威尔士王子皇家印度军事学院，1936年入英属印度陆军。新加坡沦陷（1942年2月）后被日军俘虏，1943年在东南亚受鲍斯感召加入印度国民军，出任临时政府内阁成员，指挥\"苏巴斯旅\"参加英帕尔-科希马战役，1944年12月任曼德勒第1师师长。1945年被英军俘获，同年11月与萨加尔、狄永三人在德里红堡接受\"印度国民军审判\"，以叛国罪被判死刑，因印度各地抗议浪潮改判开除军籍，审判反而使他们成为民族英雄。独立后加入国大党，先后于1952、1957、1962、1971年当选人民院议员，任多届联邦部长，1956年主持调查鲍斯死亡真相委员会。1983年以国葬规格安葬于红堡附近。"
 CBIO_RAJ_GOE_shah_nawaz_khan_desc:0 "1914年1月24日生于旁遮普拉瓦尔品第区卡胡塔马托雷村一户军人家庭，1983年12月9日卒于勒克瑙，印度自由运动活动家、印度国民军少将，后为国大党政治家。就读于德拉敦威尔士王子皇家印度军事学院，1936年入英属印度陆军。新加坡沦陷（1942年2月）后被日军俘虏，1943年在东南亚受鲍斯感召加入印度国民军，出任临时政府内阁成员，指挥\"苏巴斯旅\"参加英帕尔-科希马战役，1944年12月任曼德勒第1师师长。1945年被英军俘获，同年11月与萨加尔、狄永三人在德里红堡接受\"印度国民军审判\"，以叛国罪被判死刑，因印度各地抗议浪潮改判开除军籍，审判反而使他们成为民族英雄。独立后加入国大党，先后于1952、1957、1962、1971年当选人民院议员，任多届联邦部长，1956年主持调查鲍斯死亡真相委员会。1983年以国葬规格安葬于红堡附近。"
 RAJ_kodandera_cariappa_desc:0 "1899年1月28日生于卡纳塔克科达古（库尔格），1993年5月15日卒于班加罗尔，印度陆军元帅，印度独立后首任陆军总司令（1947—1953），通称\"基马亚\"。毕业于普纳维多利亚军事学院，1919年入英属印度陆军，是早期\"印度化\"运动的代表人物。两战之间历任军职，二战中参加中东及缅甸战役，1942年起晋升旅长。1947年10月第一次印巴战争爆发，参与指挥克什米尔作战。1949年1月15日升任陆军总司令，成为首位掌握印度陆军最高指挥权的印度人（此日现为印度\"陆军日\"）。任内推进军队专业化建设。1953年退役。1986年晋陆军元帅，是印度历史上仅有的两位陆军元帅之一，另一位为马内克肖。"
 RAJ_GOE_kodandera_cariappa_desc:0 "1899年1月28日生于卡纳塔克科达古（库尔格），1993年5月15日卒于班加罗尔，印度陆军元帅，印度独立后首任陆军总司令（1947—1953），通称\"基马亚\"。毕业于普纳维多利亚军事学院，1919年入英属印度陆军，是早期\"印度化\"运动的代表人物。两战之间历任军职，二战中参加中东及缅甸战役，1942年起晋升旅长。1947年10月第一次印巴战争爆发，参与指挥克什米尔作战。1949年1月15日升任陆军总司令，成为首位掌握印度陆军最高指挥权的印度人（此日现为印度\"陆军日\"）。任内推进军队专业化建设。1953年退役。1986年晋陆军元帅，是印度历史上仅有的两位陆军元帅之一，另一位为马内克肖。"
