 RAJ_arthur_a_barrett_desc:0 "1857年6月3日生于英格兰，1926年10月20日卒，英属印度陆军元帅，横跨维多利亚至乔治五世时代、经历四场战争的英印军队重要指挥官。1875年以少尉受委任进第44步兵团，随即转入印度参谋军团，先后参加第二次英阿战争（1879—1880年谢尔普尔战役和坎大哈战役）和洪扎-纳加尔战役（1891年）；此后历任西北边境省各部队参谋与指挥要职，1906年晋升少将、担任诺谢拉旅旅长。一战爆发后，1914年11月率普纳师远征美索不达米亚，相继攻占奥斯曼帝国控制的巴士拉（1914年11月）和库尔纳（1914年12月），开创了英印军队美索不达米亚战役的首胜；因健康原因随后将指挥权移交查尔斯·汤森德，回国任北方军司令，主导了1917年春对马赫苏德部族的军事行动。1919年第三次英阿战争期间以北印度战区最高级英国将领身份全程统率，仗毕于1920年5月退役，晋升陆军元帅。"
 CBIO_RAJ_arthur_a_barrett_desc:0 "1857年6月3日生于英格兰，1926年10月20日卒，英属印度陆军元帅，横跨维多利亚至乔治五世时代、经历四场战争的英印军队重要指挥官。1875年以少尉受委任进第44步兵团，随即转入印度参谋军团，先后参加第二次英阿战争（1879—1880年谢尔普尔战役和坎大哈战役）和洪扎-纳加尔战役（1891年）；此后历任西北边境省各部队参谋与指挥要职，1906年晋升少将、担任诺谢拉旅旅长。一战爆发后，1914年11月率普纳师远征美索不达米亚，相继攻占奥斯曼帝国控制的巴士拉（1914年11月）和库尔纳（1914年12月），开创了英印军队美索不达米亚战役的首胜；因健康原因随后将指挥权移交查尔斯·汤森德，回国任北方军司令，主导了1917年春对马赫苏德部族的军事行动。1919年第三次英阿战争期间以北印度战区最高级英国将领身份全程统率，仗毕于1920年5月退役，晋升陆军元帅。"
 RAJ_reginald_savory_desc:0 "1894年7月26日生于伦敦，1980年6月14日卒，英属印度陆军中将，上帕廷顿学校和桑德赫斯特皇家军事学院毕业，服役近三十五年。1914年入第14锡克人联队受委任，一战中赴埃及、加里波利（1915年第三次克里斯亚战役中被误报阵亡，本人写信给父亲自证\"尚在人世\"传为佳话）和美索不达米亚作战，1916年6月获军事十字勋章。1927-1928年就读卡姆伯利参谋学院，1932年任印度军官学院教官，1937年受命指挥第1/11锡克团。二战初期任第5印度师助理副官长，随后率第11印度步兵旅参加1940-1941年西部沙漠作战（\"罗盘行动\"）和1941年东非战役（厄立特里亚克伦战役）；1941年9月起任厄立特里亚少将级司令，1942年1月接任驻缅甸第23印度师师长，1943年出任印度步兵总监。战后担任印度副官长（1946年晋升代理中将），1947年获KCB勋位，1948年5月退役。退役后长期主持英国加里波利协会，并撰写了七年战争中英国陆军的历史著作（克拉伦登出版社，1966年）。"
 CBIO_RAJ_reginald_savory_desc:0 "1894年7月26日生于伦敦，1980年6月14日卒，英属印度陆军中将，上帕廷顿学校和桑德赫斯特皇家军事学院毕业，服役近三十五年。1914年入第14锡克人联队受委任，一战中赴埃及、加里波利（1915年第三次克里斯亚战役中被误报阵亡，本人写信给父亲自证\"尚在人世\"传为佳话）和美索不达米亚作战，1916年6月获军事十字勋章。1927-1928年就读卡姆伯利参谋学院，1932年任印度军官学院教官，1937年受命指挥第1/11锡克团。二战初期任第5印度师助理副官长，随后率第11印度步兵旅参加1940-1941年西部沙漠作战（\"罗盘行动\"）和1941年东非战役（厄立特里亚克伦战役）；1941年9月起任厄立特里亚少将级司令，1942年1月接任驻缅甸第23印度师师长，1943年出任印度步兵总监。战后担任印度副官长（1946年晋升代理中将），1947年获KCB勋位，1948年5月退役。退役后长期主持英国加里波利协会，并撰写了七年战争中英国陆军的历史著作（克拉伦登出版社，1966年）。"
 RAJ_sir_mohammed_iqbal_desc:0 "1877年11月9日生于英属印度旁遮普省锡亚尔科特一户克什米尔裔穆斯林工匠家庭，1938年4月21日卒于拉合尔（喉部疾患），诗人、哲学家、政治思想家，乌尔都语和波斯语双语文学巨匠，通称\"阿拉玛·伊克巴勒\"（伊克巴勒博士），被后人尊为\"东方的诗人\"和\"巴基斯坦的精神之父\"。早年在拉合尔政府学院深造，1905年赴英入剑桥三一学院攻读哲学，同时入林肯律师学院取得法律资格，其后赴德慕尼黑大学获哲学博士学位（1907年）。回国后在拉合尔执业律师，同时勤于写作，早年以写作\"萨雷·贾汗·赛·阿恰\"名动全印，后逐渐从泛印民族主义转向伊斯兰哲学思辨：其核心概念\"胡迪\"强调个体精神的觉醒与提升，是其乌尔都诗集《秘密》的理论核心。1930年在安拉哈巴德担任全印穆斯林联盟主席时发表\"安拉哈巴德演说\"，首次提出在印度西北地区建立穆斯林多数省独立邦的构想，成为日后巴基斯坦建国理念的先声。与真纳保持长期通信，在思想上为分治提供了重要合法性论证；1938年4月21日在拉合尔因咽喉疾患辞世，葬于拉合尔巴德夏希清真寺门廊。"
