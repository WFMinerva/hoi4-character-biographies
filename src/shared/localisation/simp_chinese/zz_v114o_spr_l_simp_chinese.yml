 CBIO_SPR_jose_diaz_desc:0 "1895年5月3日生于塞维利亚，1942年3月19日卒于格鲁吉亚第比利斯。面包工出身，11岁即入行，18岁加入塞维利亚面包师工会\"黎明\"，该工会随后并入无政府主义全国劳工联盟。1917年领导罢工崭露头角，1925年因地下工运活动在马德里被捕，1927年出狱后脱离无政府主义阵营加入西班牙共产党。1932年3月PCE第四次代表大会在塞维利亚召开，迪亚斯当选中央委员，同年9月进入政治局并出任总书记，取代因反对党内\"布尔什维克化\"而遭开除的前任布列霍斯。1935年与多洛雷斯·伊巴露丽率团参加共产国际第七次代表大会，接受季米特洛夫的\"反法西斯统一战线\"路线。内战期间专注党务而未担任政府公职，致力于推动共和军军事胜利。其妹卡门·迪亚斯和女儿之母特雷萨·桑托斯在战争初期于塞维利亚遭凯波·德·利亚诺部队杀害。1938年11月因胃癌赴苏联治疗，在列宁格勒接受手术。共和失败后滞留莫斯科，任共产国际干部，负责西班牙、南美和英属印度方面事务。1941年德国入侵苏联后辗转至第比利斯，1942年春因病痛自杀身亡，但其死因至今争议不断，不少人认为是遭斯大林下令谋杀。2005年4月遗骸迁回塞维利亚重葬，市议会一致通过授予\"杰出之子\"荣衔。"
