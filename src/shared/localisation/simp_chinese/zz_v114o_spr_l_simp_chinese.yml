 SPR_jose_rovira_desc:0 "1902年生于加泰罗尼亚曼雷萨，1969年3月23日卒于法国巴黎。机械师出身，1920年代加入加泰罗尼亚工人运动，后成为马克思主义统一工人党的军事骨干。内战爆发后组建并指挥POUM民兵第29师（原列宁师），活跃于阿拉贡前线。POUM是一个反斯大林主义的马克思主义政党，与托洛茨基主义有思想关联但并非托洛茨基第四国际成员。1937年5月巴塞罗那事件后，共和政府在共产党压力下取缔POUM，罗维拉随同安德烈乌·宁等人遭迫害。罗维拉设法逃脱逮捕，经比利牛斯山秘密越境流亡法国。二战期间参加法国抵抗运动，战后留居巴黎，继续从事西班牙流亡左翼政治活动。1969年在巴黎去世，终年约67岁。乔治·奥威尔在《向加泰罗尼亚致敬》中描述的POUM民兵经历与罗维拉所率部队有直接关联。"
 CBIO_SPR_jose_rovira_desc:0 "1902年生于加泰罗尼亚曼雷萨，1969年3月23日卒于法国巴黎。机械师出身，1920年代加入加泰罗尼亚工人运动，后成为马克思主义统一工人党的军事骨干。内战爆发后组建并指挥POUM民兵第29师（原列宁师），活跃于阿拉贡前线。POUM是一个反斯大林主义的马克思主义政党，与托洛茨基主义有思想关联但并非托洛茨基第四国际成员。1937年5月巴塞罗那事件后，共和政府在共产党压力下取缔POUM，罗维拉随同安德烈乌·宁等人遭迫害。罗维拉设法逃脱逮捕，经比利牛斯山秘密越境流亡法国。二战期间参加法国抵抗运动，战后留居巴黎，继续从事西班牙流亡左翼政治活动。1969年在巴黎去世，终年约67岁。乔治·奥威尔在《向加泰罗尼亚致敬》中描述的POUM民兵经历与罗维拉所率部队有直接关联。"
 SPA_joaquin_garcia_morato_desc:0 "全名华金·加西亚-莫拉托·伊·卡斯塔尼奥，1904年5月20日生于梅利利亚（西属摩洛哥），1939年4月4日在格里尼翁（马德里附近）因飞机坠毁身亡，终年34岁。国民阵营王牌飞行员，内战中战果最高的西班牙飞行员。陆军军官出身，1929年转入航空兵，在摩洛哥积累飞行经验。内战爆发后效忠国民军，先后驾驶纽波特-德拉日Ni-D 52、菲亚特CR.32和梅塞施密特Bf 109战斗机作战。官方记录击落40架敌机（一说51架），是内战中双方公认的第一王牌。1937年2月12日在哈拉马战役中一天击落三架——被称为内战中最出色的单日战绩之一。1938年获圣费尔南多桂冠勋章。1939年4月1日内战结束仅三天后，在格里尼翁进行飞行训练时坠机身亡，成为内战最后的阵亡者之一。佛朗哥追赠\"圣恩格拉西亚的莫拉托伯爵\"封号。"
 CBIO_SPA_joaquin_garcia_morato_desc:0 "全名华金·加西亚-莫拉托·伊·卡斯塔尼奥，1904年5月20日生于梅利利亚（西属摩洛哥），1939年4月4日在格里尼翁（马德里附近）因飞机坠毁身亡，终年34岁。国民阵营王牌飞行员，内战中战果最高的西班牙飞行员。陆军军官出身，1929年转入航空兵，在摩洛哥积累飞行经验。内战爆发后效忠国民军，先后驾驶纽波特-德拉日Ni-D 52、菲亚特CR.32和梅塞施密特Bf 109战斗机作战。官方记录击落40架敌机（一说51架），是内战中双方公认的第一王牌。1937年2月12日在哈拉马战役中一天击落三架——被称为内战中最出色的单日战绩之一。1938年获圣费尔南多桂冠勋章。1939年4月1日内战结束仅三天后，在格里尼翁进行飞行训练时坠机身亡，成为内战最后的阵亡者之一。佛朗哥追赠\"圣恩格拉西亚的莫拉托伯爵\"封号。"
 SPR_carmel_rosa_baserba_desc:0 "1912年生于巴塞罗那，2006年11月16日卒于法国巴纽尔斯-苏尔梅尔。化名\"罗克\"，加泰罗尼亚政治活动家和记者。出身海关代理人家庭，12岁丧父后辍学入海关工作，在此过程中接触马克思主义。1930年加入工农联盟，此后成为BOC及后继马克思主义统一工人党青年组织执行委员会成员。内战爆发后在阿拉贡前线作为罗维拉师军官参战，升至上尉。1937年5月巴塞罗那事件后离开前线，加入POUM地下执行委员会继续秘密活动。1939年2月流亡法国，被关入阿尔热莱集中营，多次逃脱。1941年因\"共产主义活动\"被法国军事法庭定罪，再入集中营。二战结束后在巴黎定居，与POUM同志安东妮娅·阿德罗埃尔（即名单中#44条目）结为终身伴侣。任法新社西班牙语版经济栏目负责人，长期担任POUM流亡执行委员会成员，参与巴黎\"加泰罗尼亚之家\"活动。1976年参与创建加泰罗尼亚社会党，1977年返回加泰罗尼亚。2006年夫妇同获加泰罗尼亚自治政府\"圣乔治十字勋章\"，同年去世。"
 CBIO_SPR_carmel_rosa_baserba_desc:0 "1912年生于巴塞罗那，2006年11月16日卒于法国巴纽尔斯-苏尔梅尔。化名\"罗克\"，加泰罗尼亚政治活动家和记者。出身海关代理人家庭，12岁丧父后辍学入海关工作，在此过程中接触马克思主义。1930年加入工农联盟，此后成为BOC及后继马克思主义统一工人党青年组织执行委员会成员。内战爆发后在阿拉贡前线作为罗维拉师军官参战，升至上尉。1937年5月巴塞罗那事件后离开前线，加入POUM地下执行委员会继续秘密活动。1939年2月流亡法国，被关入阿尔热莱集中营，多次逃脱。1941年因\"共产主义活动\"被法国军事法庭定罪，再入集中营。二战结束后在巴黎定居，与POUM同志安东妮娅·阿德罗埃尔（即名单中#44条目）结为终身伴侣。任法新社西班牙语版经济栏目负责人，长期担任POUM流亡执行委员会成员，参与巴黎\"加泰罗尼亚之家\"活动。1976年参与创建加泰罗尼亚社会党，1977年返回加泰罗尼亚。2006年夫妇同获加泰罗尼亚自治政府\"圣乔治十字勋章\"，同年去世。"
 SPR_carlos_masquelet_lacaci_desc:0 "1871年7月14日生于加利西亚费罗尔，1948年9月14日卒于法国拉洪克拉。工兵军官出身，1886年入托莱多军事总学院，后在瓜达拉哈拉工兵学院完成学业。曾参加摩洛哥战役，1920年代主持设计费罗尔新海军基地的混凝土工程——当时西班牙最先进的军事建筑项目之一。被公认为西班牙头号军事筑城专家。政治上属共和自由派，系共济会成员，与阿萨尼亚私交深厚。1930年升准将，1931年共和国成立后被阿萨尼亚任命为陆军总参谋长。1935年4月至5月短暂出任勒鲁斯政府陆军大臣，1936年2月至5月再度出任阿萨尼亚和巴尔西亚政府陆军大臣。内战爆发时忠于共和国，1936年9月被委以马德里防御工事设计重任，规划了以四道同心环形碉堡带为核心的城防体系，这些混凝土工事在马德里保卫战中发挥关键作用，部分遗存至今仍可见于马德里郊区。1937年7月以少将军衔退入预备役，转任筑城委员会主席。内战结束后流亡法国，1948年在法西边境拉洪克拉去世。"
