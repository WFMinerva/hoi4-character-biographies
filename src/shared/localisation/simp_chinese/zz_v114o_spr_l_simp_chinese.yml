 CBIO_SPR_manuel_fal_conde_desc:0 "1894年8月10日生于韦尔瓦省伊格拉·德·拉·谢拉，1975年5月20日卒于塞维利亚。律师出身，虔诚天主教徒，1930年加入融合派，后并入卡洛斯传统共融派。组织能力出色，1933年11月被卡洛斯派王位觊觎者阿方索·卡洛斯任命为安达卢西亚全区领袖，1934年4月在塞维利亚郊外金蒂略庄园组织大规模集会，650名着制服受训的\"雷克特\"民兵阅兵，震动全国。1934年5月就任传统共融派总书记，时年不足四十。积极策划反共和国武装起义，与军方密谋联络。1936年内战爆发后率卡洛斯派约三万\"雷克特\"志愿兵投入国民阵营，但试图建立独立的卡洛斯军事学院和劳工组织触怒佛朗哥。1936年12月被佛朗哥召至布尔戈斯，面临\"流亡或枪毙\"二选一，被迫前往里斯本。1937年4月佛朗哥颁布统一令后丧失正式领导权，但仍通过通信维系反佛朗哥的卡洛斯正统派。战后被软禁于塞维利亚，1942年因禁止卡洛斯派加入蓝色师团一度被拘押至梅诺卡岛。1955年8月辞去卡洛斯派领袖职务，退出活跃政治。1967年获卡洛斯派王储哈维尔授予\"金蒂略公爵\"封号。1975年5月去世，先于佛朗哥数月离世。"
