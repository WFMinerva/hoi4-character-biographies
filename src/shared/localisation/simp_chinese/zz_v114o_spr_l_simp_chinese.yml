 CBIO_SPA_jose_antonio_primo_de_rivera_desc:0 "1903年4月24日生于马德里，1936年11月20日在阿利坎特被共和政府处决，终年33岁。西班牙独裁者米格尔·普里莫·德·里维拉之长子，埃斯特利亚侯爵。1925年取得律师资格，1930年父亲流亡巴黎病逝后投身政治，誓为父亲正名。1932年曾因参与桑胡尔霍政变未遂被短暂拘押。1933年10月29日在马德里创立长枪党，主张民族工团主义，以反自由主义、反马克思主义、反资本主义为纲领，受意大利法西斯运动影响。1934年2月11日长枪党与拉莫·莱德斯马的攻击性民族工团主义委员会合并，由何塞·安东尼奥出任领袖。1933年当选科尔特斯议员，创办刊物《信仰》和《前进》宣传党纲。1936年2月大选中长枪党仅获0.7%选票，但人民阵线上台后局势动荡使党员迅速膨胀至四万余人。1936年3月14日在马德里被捕，后转押阿利坎特监狱。内战爆发后，共和当局以军事叛乱和阴谋罪于11月18日判处死刑，20日执行枪决。佛朗哥政权追封其为\"殉道者\"，长枪党人称之为\"缺席者\"，其著述和演说成为国民运动的官方教义基础。"
