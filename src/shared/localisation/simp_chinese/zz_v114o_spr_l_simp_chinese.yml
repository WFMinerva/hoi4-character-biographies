 CBIO_SPR_manuel_azana_desc:0 "全名曼努埃尔·阿萨尼亚·迪亚斯，1880年1月10日生于阿尔卡拉·德·埃纳雷斯，1940年11月3日卒于法国蒙托邦，终年60岁。律师、作家和左翼共和派政治家，第二共和国的核心塑造者。马德里大学法学博士，从事律师职业并从事文学翻译（曾译本瑟姆著作），以随笔散文和小说著称。1925年共同创办\"共和行动\"政治团体，1931年共和国成立后出任阿萨尼亚政府总理（1931—1933年），推行反教权、军事改革（削减军官名额、削减军备支出）和农地改革等一系列共和国奠基政策，力主政教分离，关闭耶稣会学校。1933年大选失败后进入反对阵营，1935年曾被短暂逮捕。1936年人民阵线选举胜利后，4月10日萨莫拉被弹劾去职，阿萨尼亚于5月10日出任共和国总统——但此后总统职权实已受到严重制约。内战爆发后坚持在共和区，试图寻求和平解决但始终无法实现。1939年1月随共和区溃败越境入法国，2月27日辞去总统职务。先栖身法国，11月3日在法国蒙托邦去世，遗体暂厝当地，多年后方经外交斡旋迁葬西班牙。"
