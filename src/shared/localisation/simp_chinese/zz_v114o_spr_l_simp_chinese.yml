 SPA_emilio_mola_desc:0 "1887年7月9日生于西属古巴普拉塞塔斯（一说6月9日），1937年6月3日在维多利亚附近因飞机撞山坠毁身亡。军官之子，家族因古巴独立战争而分裂——其父效忠西班牙军队，舅父则是古巴革命军将领。1907年入托莱多步兵学院，后赴西属摩洛哥服役，战功卓著获军事奖章，1912年5月克尔特战役中大腿负伤晋升上尉，1927年升准将。1930年出任安全总局长——阿方索十三世时代最后一任。1936年2月人民阵线执政后被调任潘普洛纳军区司令，政府本意将其放逐边缘，殊不知纳瓦拉正是卡洛斯派大本营。莫拉秘密联络右翼军人联盟和卡洛斯民兵，成为叛乱核心策划者，代号\"导演\"。桑胡尔霍留驻葡萄牙担任名义领袖，莫拉负责制定起义计划和战后政府蓝图。1936年7月19日在本土宣告起义，桑胡尔霍7月20日坠机后接管北方国民军。进攻马德里时在广播中称城内支持者为\"第五纵队\"——此语由此载入军事术语史。9月21日将领会议上让位于佛朗哥为总司令。此后继续指挥北方军团，1937年6月3日返回维多利亚途中飞机在恶劣天气中撞山坠毁，年仅49岁，其死因是否涉及蓄意破坏至今未有定论。"
