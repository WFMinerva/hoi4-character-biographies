 SPA_jose_antonio_giron_desc:0 "1911年8月28日生于埃雷迪亚·德·瓦尔德卡尼亚斯（帕伦西亚省），1995年5月18日卒于福恩特拉维亚。法律系学生出身，大学期间即加入长枪党，成为何塞·安东尼奥·普里莫·德·里维拉的忠实追随者。内战爆发后参加国民军作战，在北方前线指挥长枪党民兵。1941年年仅29岁即被佛朗哥任命为劳工部长，任职长达16年（1941—1957年），系佛朗哥政权中任期最长的部长之一。在任期间推行一套以国家工团主义为基础的社会福利政策，包括建立社会保障体系、工人住房计划和度假制度，被长枪党左翼视为\"社会正义\"理想的体现，被自由派和左翼批评为对工人运动的收买与控制。1957年因经济自由化改革浪潮而被撤换。此后仍为佛朗哥政权中长枪党强硬派代表，反对1960至1970年代的技术官僚改革路线。佛朗哥去世后坚持极右立场，1995年在法西边境小城福恩特拉维亚去世，终年83岁。"
