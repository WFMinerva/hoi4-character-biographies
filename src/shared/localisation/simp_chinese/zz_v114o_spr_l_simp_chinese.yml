 CBIO_SPR_niceto_alcala_zamora_desc:0 "1877年7月6日生于科尔多瓦省普列戈，1949年2月18日卒于布宜诺斯艾利斯。律师出身，早年活跃于自由党，1905年当选科尔特斯议员，1917年任公共工程大臣，1922年任陆军大臣，同时担任西班牙驻国际联盟代表。1923年国王阿方索十三世默许普里莫·德·里维拉将军发动政变后，拒绝与独裁政权合作。1930年8月参与圣塞瓦斯蒂安协定，转向共和主义。1931年4月市政选举后国王出走，阿尔卡拉-萨莫拉从狱中出任革命临时政府总理，4月14日宣告第二共和国成立。同年10月15日因反对宪法中限制宗教团体的第24和第26条款而辞去总理，但12月10日以362票（共410票）当选共和国首任总统。任内在左右两翼间试图维持中间路线：1933年解散议会致使左翼不满，右翼CEDA赢得选举后又拒绝任命其领袖希尔-罗夫莱斯为总理。1936年1月再次解散议会以阻止右翼组阁，人民阵线在2月选举中获胜后，4月7日遭议会弹劾去职，由阿萨尼亚继任。内战爆发时正在斯堪的纳维亚旅行，后流亡法国，1940年德国入侵后辗转至阿根廷，终老异乡，享年71岁。"
