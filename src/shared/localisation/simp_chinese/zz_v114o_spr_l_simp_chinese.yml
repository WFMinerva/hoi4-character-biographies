 SPR_gonzalo_queipo_de_llano_desc:0 "1875年2月5日生于巴利亚多利德省托尔德西利亚斯，1951年3月9日卒于塞维利亚省卡马斯。早年参加古巴独立战争（效忠西班牙方）和摩洛哥里夫战争，升迁迅速但性格暴躁、反复无常，曾参与1930年反阿方索十三世的哈卡起义阴谋，共和国成立初期一度倾向左翼。1936年7月18日以宪兵司令身份在塞维利亚发动叛乱，以不足200人的初始兵力通过大胆突袭和心理恐吓控制全城，成为内战中最出人意料的政变成功案例之一。当晚占领\"联合广播塞维利亚\"电台，发表第一次广播讲话，此后每晚10点半准时在电台发表\"闲谈\"，内容充斥威胁、粗俗笑话和恐吓性宣传，获称\"广播将军\"。其广播中公然以强奸威胁共和派妇女的言辞成为内战中最臭名昭著的宣传之一。12月出任南方军团司令，辖区内（安达卢西亚西部）估计有逾四万五千人在白色恐怖中遇害。战后因自视甚高且对佛朗哥出言不逊而被逐步边缘化，先被派驻意大利后被限制居住在马拉加。1951年病逝，葬于其出资修建的塞维利亚马卡雷纳圣殿（2022年遗骸被依据《民主记忆法》掘出迁走）。"
