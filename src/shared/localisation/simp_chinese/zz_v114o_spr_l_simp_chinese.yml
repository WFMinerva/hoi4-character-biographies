 CBIO_SPA_francisco_franco_desc:0 "1892年12月4日生于加利西亚费罗尔，1975年11月20日卒于马德里。出身海军军官家庭，1907年入托莱多步兵学院，1912年赴西属摩洛哥服役，凭战功迅速晋升，1926年年仅33岁即成为欧洲最年轻的将军。1934年指挥镇压阿斯图里亚斯矿工起义。1936年2月人民阵线上台后被外调至加那利群岛驻防。7月17日军事叛乱在摩洛哥爆发后，佛朗哥于18日飞抵摩洛哥接管非洲军团，率部渡海北进。桑胡尔霍7月20日坠机身亡后，9月21日将领会议推举佛朗哥为武装力量总司令，10月1日就任\"大元帅\"兼国家元首。1937年4月颁布统一令，将长枪党、卡洛斯派和其他右翼团体合并为国民运动，确立个人独裁体制。1939年4月1日宣布内战胜利。二战期间维持名义中立，1940年10月与希特勒在昂代举行会晤但拒绝参战，同时允许\"蓝色师团\"志愿兵赴苏联东线作战。战后遭国际孤立，1955年西班牙加入联合国后处境改善。统治西班牙近四十年，1975年11月20日病逝，终年82岁，此后西班牙启动民主转型。"
 SPA_francisco_franco_desc:0 "1892年12月4日生于加利西亚费罗尔，1975年11月20日卒于马德里。出身海军军官家庭，1907年入托莱多步兵学院，1912年赴西属摩洛哥服役，凭战功迅速晋升，1926年年仅33岁即成为欧洲最年轻的将军。1934年指挥镇压阿斯图里亚斯矿工起义。1936年2月人民阵线上台后被外调至加那利群岛驻防。7月17日军事叛乱在摩洛哥爆发后，佛朗哥于18日飞抵摩洛哥接管非洲军团，率部渡海北进。桑胡尔霍7月20日坠机身亡后，9月21日将领会议推举佛朗哥为武装力量总司令，10月1日就任\"大元帅\"兼国家元首。1937年4月颁布统一令，将长枪党、卡洛斯派和其他右翼团体合并为国民运动，确立个人独裁体制。1939年4月1日宣布内战胜利。二战期间维持名义中立，1940年10月与希特勒在昂代举行会晤但拒绝参战，同时允许\"蓝色师团\"志愿兵赴苏联东线作战。战后遭国际孤立，1955年西班牙加入联合国后处境改善。统治西班牙近四十年，1975年11月20日病逝，终年82岁，此后西班牙启动民主转型。"
