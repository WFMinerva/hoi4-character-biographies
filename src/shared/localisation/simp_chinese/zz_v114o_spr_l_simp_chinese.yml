 SPR_janos_galicz_desc:0 "1890年生于奥匈帝国托特科姆洛什（今匈牙利贝凯什州），1939年卒于苏联（遭清洗处决）。一战中服役于奥匈帝国军队，在东线被俄军俘虏。十月革命后加入红军参加俄国内战，后入莫斯科伏龙芝军事学院深造，晋升上校。1936年被派往西班牙，化名\"何塞·伊万诺维奇·加尔\"加入国际纵队，先后指挥第15国际旅和第35师（后改编为第15师）。在哈拉马河战役中策划并下令对河上方高地发动进攻，导致第12国际旅遭受惨重伤亡，海明威在《丧钟为谁而鸣》中提及此人并暗示其指挥能力受到质疑。此后指挥瓜达拉哈拉和布鲁内特等战役。内战结束后返回苏联，在大清洗中被处决，年约49岁。"
 CBIO_SPR_janos_galicz_desc:0 "1890年生于奥匈帝国托特科姆洛什（今匈牙利贝凯什州），1939年卒于苏联（遭清洗处决）。一战中服役于奥匈帝国军队，在东线被俄军俘虏。十月革命后加入红军参加俄国内战，后入莫斯科伏龙芝军事学院深造，晋升上校。1936年被派往西班牙，化名\"何塞·伊万诺维奇·加尔\"加入国际纵队，先后指挥第15国际旅和第35师（后改编为第15师）。在哈拉马河战役中策划并下令对河上方高地发动进攻，导致第12国际旅遭受惨重伤亡，海明威在《丧钟为谁而鸣》中提及此人并暗示其指挥能力受到质疑。此后指挥瓜达拉哈拉和布鲁内特等战役。内战结束后返回苏联，在大清洗中被处决，年约49岁。"
 SPR_antonio_cordon_garcia_desc:0 "1895年7月25日生于塞维利亚，1969年1月23日卒于罗马。职业军人，1911年入塞戈维亚炮兵学院，毕业后长期服役于陆军，1920年晋升上尉，1921年参加摩洛哥战争。曾参与反对普里莫·德·里维拉独裁的\"圣胡安事件\"未遂政变，遭处分退出现役后加入西班牙共产党。内战爆发后自愿返回共和军效力，成为将民兵改造为正规军的关键人物之一。1937年任安达卢西亚前线参谋长，此后参加圣玛丽亚·德·拉卡韦萨围攻战、特鲁埃尔战役和贝尔奇特战役等重大战事。党内地位与军事晋升同步攀升，最终出任国防部副部长，与内格林总理建立密切关系。1939年3月晋升将军——共和国末期的最后一批晋升之一。同月随内格林和伊巴露丽从莫诺瓦尔机场飞离西班牙，流亡苏联。在苏联加入共产党中央委员会，与伊巴露丽和卡里略密切合作。晚年移居罗马，撰写回忆录《轨迹》，去世后遗骸于佛朗哥去世后运回西班牙。"
 CBIO_SPR_antonio_cordon_garcia_desc:0 "1895年7月25日生于塞维利亚，1969年1月23日卒于罗马。职业军人，1911年入塞戈维亚炮兵学院，毕业后长期服役于陆军，1920年晋升上尉，1921年参加摩洛哥战争。曾参与反对普里莫·德·里维拉独裁的\"圣胡安事件\"未遂政变，遭处分退出现役后加入西班牙共产党。内战爆发后自愿返回共和军效力，成为将民兵改造为正规军的关键人物之一。1937年任安达卢西亚前线参谋长，此后参加圣玛丽亚·德·拉卡韦萨围攻战、特鲁埃尔战役和贝尔奇特战役等重大战事。党内地位与军事晋升同步攀升，最终出任国防部副部长，与内格林总理建立密切关系。1939年3月晋升将军——共和国末期的最后一批晋升之一。同月随内格林和伊巴露丽从莫诺瓦尔机场飞离西班牙，流亡苏联。在苏联加入共产党中央委员会，与伊巴露丽和卡里略密切合作。晚年移居罗马，撰写回忆录《轨迹》，去世后遗骸于佛朗哥去世后运回西班牙。"
 SPR_valentin_gonzalez_desc:0 "1904年生于埃斯特雷马杜拉，1983年10月卒于马德里。绰号\"农夫\"，出身农民家庭，早年在采石场和矿井劳作，加入西班牙共产党后成为工运活动分子。内战爆发时组织游击民兵在瓜达拉马山区作战，凭大胆的突击战术声名鹊起，迅速晋升至师长。其部队以凶猛进攻著称但纪律松散，指挥风格粗犷而争议不断。参加马德里保卫战、哈拉马、布鲁内特和特鲁埃尔等战役，在特鲁埃尔战役和埃布罗河战役中遭受严重损失。内战失败后流亡苏联，但与苏联当局产生激烈矛盾，曾被送往劳改营。约1944至1945年间逃离苏联，辗转经伊朗抵达法国，后公开发表反苏言论，撰写回忆录《听吧，人民的声音》揭露苏联内幕。晚年返回西班牙定居，1983年去世。"
 CBIO_SPR_valentin_gonzalez_desc:0 "1904年生于埃斯特雷马杜拉，1983年10月卒于马德里。绰号\"农夫\"，出身农民家庭，早年在采石场和矿井劳作，加入西班牙共产党后成为工运活动分子。内战爆发时组织游击民兵在瓜达拉马山区作战，凭大胆的突击战术声名鹊起，迅速晋升至师长。其部队以凶猛进攻著称但纪律松散，指挥风格粗犷而争议不断。参加马德里保卫战、哈拉马、布鲁内特和特鲁埃尔等战役，在特鲁埃尔战役和埃布罗河战役中遭受严重损失。内战失败后流亡苏联，但与苏联当局产生激烈矛盾，曾被送往劳改营。约1944至1945年间逃离苏联，辗转经伊朗抵达法国，后公开发表反苏言论，撰写回忆录《听吧，人民的声音》揭露苏联内幕。晚年返回西班牙定居，1983年去世。"
 CBIO_SPR_enrique_lister_desc:0 "1907年2月21日生于加利西亚蓬特韦德拉省阿门德拉尔，1994年12月8日卒于马德里。石匠出身，1925年加入西班牙共产党，因工运活动遭通缉流亡苏联，在伏龙芝军事学院接受军事训练。1936年内战爆发后迅速崛起为共和军最出色的军事指挥官之一，历任纵队长、旅长、师长、军长，先后参加马德里保卫战、哈拉马、布鲁内特、贝尔奇特、特鲁埃尔和埃布罗河等几乎所有重大战役。特别在1938年7月至11月的埃布罗河战役中指挥第5军团，此战为内战中规模最大、最惨烈的战役。内战失败后流亡苏联，二战期间参加苏联红军作战。战后长期任西共流亡领导层成员，1970年代因反对卡里略的\"欧洲共产主义\"路线而另组西班牙工人革命党。佛朗哥去世后返回西班牙，1994年在马德里去世，终年87岁。"
 SPR_vincente_rojo_lluch_desc:0 "1894年10月8日生于瓦伦西亚省富恩特德拉伊格拉，1966年6月15日卒于马德里。职业军官，毕业于托莱多步兵学院和参谋学院，政治上温和保守，属虔诚天主教徒。内战爆发后选择忠于共和国而非同阶层军官大多投靠的国民阵营。1936年11月出任马德里防御委员会参谋长，辅佐米亚哈将军，在曼萨纳雷斯河一线组织防御，成功阻止国民军夺取首都。此后擢升为共和军总参谋长，系内战中共和方最高级别的战略策划者，主持拟定哈拉马、瓜达拉哈拉、布鲁内特、特鲁埃尔和埃布罗河等战役计划。其军事才能得到双方公认，被视为共和军中最具专业素养的将领。1939年流亡法国后转赴南美，在玻利维亚和阿根廷从事军事教育。1957年获佛朗哥政权特赦返回西班牙，但被监视居住且被禁止从事公共活动。1966年在马德里病逝，终年71岁。其回忆录《西班牙的告诫》为研究共和军战略的重要文献。"
