 SPA_raimundo_fernandez_cuesta_desc:0 "全名雷蒙多·费尔南德斯-库斯塔·伊·梅雷洛，1896年10月5日生于马德里，1992年7月9日卒于马德里，享年95岁。律师、公证员，长枪党核心创始人和佛朗哥体制政治人物。马德里大学法学毕业，幼时即与何塞·安东尼奥·普里莫·德·里维拉结为挚友——正是费尔南德斯-库斯塔影响了何塞·安东尼奥走上法律道路。1933年参与创建长枪党，出任首任秘书长，以出色的演说才能在党内享有盛誉。1936年大选落选后，内战爆发初期在马德里被共和政府逮捕入狱，两度越狱均遭重新逮捕。1937年10月以与共和军战俘胡斯蒂诺·德·阿斯卡拉特交换的方式获释，随即被佛朗哥任命为统一后的国民运动秘书长——这一任命主要是为了安抚担心军方和君主制影响的长枪党人，但实权已握于连襟塞拉诺·苏涅尔（名单#58）之手。同期兼任农业大臣，均收效甚微。1940年起先后出任驻巴西（1940—1942年）和驻意大利（1942—1945年）大使，实为塞拉诺·苏涅尔将其驱逐出国内政治中枢的\"名誉放逐\"。1945年回国出任国务委员会主席和司法大臣（1945—1951年），1948年12月宣布释放13000名政治犯（实际约3000人获释）。1951年升任运动总书记，推行更为严厉的镇压政策，1956年马德里大学生骚乱后因长枪党青年团强硬应对被撤职。佛朗哥去世后重建长枪党，1977年大选仅获0.21%选票，1983年退出政界。"
 CBIO_SPA_raimundo_fernandez_cuesta_desc:0 "全名雷蒙多·费尔南德斯-库斯塔·伊·梅雷洛，1896年10月5日生于马德里，1992年7月9日卒于马德里，享年95岁。律师、公证员，长枪党核心创始人和佛朗哥体制政治人物。马德里大学法学毕业，幼时即与何塞·安东尼奥·普里莫·德·里维拉结为挚友——正是费尔南德斯-库斯塔影响了何塞·安东尼奥走上法律道路。1933年参与创建长枪党，出任首任秘书长，以出色的演说才能在党内享有盛誉。1936年大选落选后，内战爆发初期在马德里被共和政府逮捕入狱，两度越狱均遭重新逮捕。1937年10月以与共和军战俘胡斯蒂诺·德·阿斯卡拉特交换的方式获释，随即被佛朗哥任命为统一后的国民运动秘书长——这一任命主要是为了安抚担心军方和君主制影响的长枪党人，但实权已握于连襟塞拉诺·苏涅尔（名单#58）之手。同期兼任农业大臣，均收效甚微。1940年起先后出任驻巴西（1940—1942年）和驻意大利（1942—1945年）大使，实为塞拉诺·苏涅尔将其驱逐出国内政治中枢的\"名誉放逐\"。1945年回国出任国务委员会主席和司法大臣（1945—1951年），1948年12月宣布释放13000名政治犯（实际约3000人获释）。1951年升任运动总书记，推行更为严厉的镇压政策，1956年马德里大学生骚乱后因长枪党青年团强硬应对被撤职。佛朗哥去世后重建长枪党，1977年大选仅获0.21%选票，1983年退出政界。"
 SPA_martin_de_riquer_desc:0 "加泰罗尼亚语名马蒂·德·里克尔，第八代卡萨·达瓦洛斯伯爵，1914年5月3日生于巴塞罗那，2013年9月17日卒于巴塞罗那，享年99岁。西班牙最重要的罗曼语文学史学家和中世纪学者，祖父为著名画家亚历山大·德·里克尔。内战期间以国民阵营立场参战，在加泰罗尼亚卡洛斯雷克特义勇团\"蒙特塞拉特圣母团\"中服役，后转至迪奥尼西奥·里德鲁霍主持的国民军宣传部门任职。战后在巴塞罗那大学从事学术研究，1942年起任教，1944年获马德里大学博士学位，1950至1984年担任巴塞罗那大学罗曼语文学讲席教授。1965年当选西班牙皇家语言学院院士，1963至1996年任巴塞罗那皇家文学院院长，1977年由胡安·卡洛斯一世任命为制宪科尔特斯参议员。以中世纪文学、吟游诗人研究、《罗兰之歌》、骑士文化和《堂吉诃德》研究著称于世。荣获1997年西班牙社会科学领域阿斯图里亚斯亲王奖、2000年西班牙国家文学奖等众多殊荣，晚年仍笔耕不辍直至百岁前后。"
 CBIO_SPA_martin_de_riquer_desc:0 "加泰罗尼亚语名马蒂·德·里克尔，第八代卡萨·达瓦洛斯伯爵，1914年5月3日生于巴塞罗那，2013年9月17日卒于巴塞罗那，享年99岁。西班牙最重要的罗曼语文学史学家和中世纪学者，祖父为著名画家亚历山大·德·里克尔。内战期间以国民阵营立场参战，在加泰罗尼亚卡洛斯雷克特义勇团\"蒙特塞拉特圣母团\"中服役，后转至迪奥尼西奥·里德鲁霍主持的国民军宣传部门任职。战后在巴塞罗那大学从事学术研究，1942年起任教，1944年获马德里大学博士学位，1950至1984年担任巴塞罗那大学罗曼语文学讲席教授。1965年当选西班牙皇家语言学院院士，1963至1996年任巴塞罗那皇家文学院院长，1977年由胡安·卡洛斯一世任命为制宪科尔特斯参议员。以中世纪文学、吟游诗人研究、《罗兰之歌》、骑士文化和《堂吉诃德》研究著称于世。荣获1997年西班牙社会科学领域阿斯图里亚斯亲王奖、2000年西班牙国家文学奖等众多殊荣，晚年仍笔耕不辍直至百岁前后。"
 SPA_karl_pius_von_habsburg_desc:0 "西班牙语名卡洛斯·皮奥·德·哈布斯堡-洛雷纳，1909年12月4日生于维也纳，1953年12月24日卒。奥地利哈布斯堡-托斯卡纳支系成员，卡洛斯传统主义运动\"八世派\"推立的王位觊觎者，自称\"卡洛斯八世\"。其母为西班牙波旁王室成员、卡洛斯派王位觊觎者卡洛斯七世的长女布兰卡·德·波旁。1919年奥地利没收哈布斯堡家族财产后随家人迁往意大利，继而定居巴塞罗那，1926年取得西班牙国籍。1930年代初返回奥地利加入护国团。1932年起，卡洛斯派内部\"十字军派\"开始推动以布兰卡之子继承王位。1936年卡洛斯派合法王位觊觎者阿方索·卡洛斯去世后，卡尔·皮乌斯起初支持摄政王哈维尔·德·波旁-帕尔马。内战期间未立即表明继承权主张。1943年6月29日发布宣言正式宣称继承西班牙卡洛斯派王位，自号\"卡洛斯八世\"，获少数\"八世派\"支持，另有部分佛朗哥政府官员给予默许（被主流卡洛斯派认为是分裂卡洛斯运动的手段）。1944至1951年间陆续颁授14个贵族爵位。1952年将其设立的功绩勋章授予佛朗哥和教廷特使泰德斯基尼枢机主教。1953年12月24日去世，继承人问题转给其兄弟。"
