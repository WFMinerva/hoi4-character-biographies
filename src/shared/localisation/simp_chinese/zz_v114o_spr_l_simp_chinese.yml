 SPR_jose_asensio_torrado_desc:0 "1892年5月18日生于拉科鲁尼亚，1961年2月21日（一说24日）卒于纽约。原拟入海军，因海军学院关闭转入陆军，于塞戈维亚炮兵学院和参谋学院受训，后在摩洛哥服役表现出色。1932年转入预备役，但属于共和派反法西斯军人联盟成员，是少数忠于共和国的\"非洲派\"军官之一。1936年内战爆发后率民兵纵队在索莫谢拉前线作战，后在塔霍河前线指挥共和军但未能阻止国民军推进。1936年10月24日被拉戈·卡巴雷罗总理任命为陆军部副部长，11月出任中央集团军司令，主导将人民阵线民兵改编为混编旅——共和军中首批具备正规野战能力的部队。因坚持在共和军中推行纪律化而遭共产党和无政府主义者排斥，苏联大使罗森伯格亦要求将其免职。1937年2月马拉加失陷后成为替罪羊被撤职并遭逮捕审判，但最终撤销指控。此后被派往华盛顿任共和国驻美武官。1939年战败后留居美国，以教授西班牙语为生，曾任共和流亡政府无任所部长。客死纽约，终年68岁。"
