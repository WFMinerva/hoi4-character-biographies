 SPR_jose_millan_astray_desc:0 "1879年7月5日生于加利西亚拉科鲁尼亚，1954年1月1日卒于马德里。父为律师兼萨尔苏埃拉歌剧词作者，母为插画家和喜剧作家。少年时不顾家庭压力放弃法律，1894年入托莱多步兵学院，16岁即以少尉军衔毕业。1896年主动请缨赴菲律宾平叛，在布拉坎省圣拉斐尔以30人抵御两千叛军，一战成名。此后赴西属摩洛哥参加里夫战争。1920年仿照法国外籍军团模式，在佛朗哥（时为少校）协助下创建西班牙外籍军团，任首任指挥官，以中校军衔统领。他为军团注入极端尚武精神，推广口号\"死亡万岁\"和\"向我集合，军团！\"。1924年10月在摩洛哥遭伏击失去左臂，一个月后右眼又被子弹击中失明，此后以独臂独眼的残躯形象成为军中传奇。1927年升准将，1932年被共和政府列入退役名单。内战中加入国民阵营，1936年9月任新闻与宣传办公室主任。1936年10月12日民族日庆典上在萨拉曼卡大学与哲学家乌纳穆诺发生激烈冲突，此事成为内战中知识分子与军方对立的标志性场面。1937年转任伤残军人团团长，战后任佛朗哥科尔特斯检察官直至去世，终年74岁。"
