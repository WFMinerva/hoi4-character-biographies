 SPR_alberto_bayo_desc:0 "全名阿尔韦托·巴约·吉鲁德，1892年3月27日生于古巴卡马圭，1967年8月4日卒于古巴哈瓦那。西班牙共和军将领、游击战专家和诗人，古巴裔西班牙人。父为西班牙人，幼年赴欧美求学，1912至1915年在马德里军事航空学校受训成为飞行员，后在摩洛哥参加里夫战争（1917—1927年），曾在西班牙外籍军团服役，1925年腹股沟中弹重伤休养一年。内战爆发后效忠共和国，1936年8月率共和军执行马略卡岛两栖登陆作战，初期有所进展但遭意大利航空军团和国民军反击而撤退；此战役后升至中校。后担任马德里陆军部军事参谋。1939年流亡墨西哥，开设家具工厂，在瓜达拉哈拉航空机械学校任教，并培训多支拉丁美洲游击队。1955年古巴流亡者菲德尔·卡斯特罗登门拜访，二人一拍即合。巴约卖掉工厂和教职，在墨西哥查尔科圣罗莎牧场连续六个月为卡斯特罗的82名\"格兰马\"游击队员进行密集训练，学员包括卡斯特罗和切·格瓦拉。格瓦拉被巴约评为\"最优秀的游击队员\"，在全部考核中得分最高。1956年12月游击队登陆古巴后，巴约以顾问身份参与古巴革命。古巴革命胜利后定居哈瓦那，与卡斯特罗和格瓦拉保持密切友谊。著有游击战理论手册《给游击战员的150个问题》和回忆录《我的马略卡登陆》。1967年在哈瓦那去世，终年75岁。"
