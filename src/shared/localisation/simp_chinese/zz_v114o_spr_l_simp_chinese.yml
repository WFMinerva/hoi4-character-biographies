 SPR_antonia_adroher_i_pascual_desc:0 "1915年6月22日生于加泰罗尼亚（具体出生地未详），2007年9月7日卒。教师、政治活动家，POUM创始成员之一。在赫罗纳师范学校学习期间加入总工会教育工人联合会，后参与创建POUM。内战爆发后成为赫罗纳市议会文化与宣传委员——据记载为该市首位担任此职的女性。1936年10月21日就任后推行以\"理性主义原则\"和男女平等为基础的公立免费教育制度。1939年流亡法国，先在图卢兹后在巴黎定居，与同为POUM战友的卡梅尔·萝莎·巴瑟尔巴（即本名单#31）结为终身伴侣，共同创立巴黎\"加泰罗尼亚之家\"。1977年佛朗哥去世后返回加泰罗尼亚。曾获加泰罗尼亚教育界\"68届教师奖\"，2006年与丈夫同获圣乔治十字勋章。2007年去世，终年92岁。"
 CBIO_SPR_antonia_adroher_i_pascual_desc:0 "1915年6月22日生于加泰罗尼亚（具体出生地未详），2007年9月7日卒。教师、政治活动家，POUM创始成员之一。在赫罗纳师范学校学习期间加入总工会教育工人联合会，后参与创建POUM。内战爆发后成为赫罗纳市议会文化与宣传委员——据记载为该市首位担任此职的女性。1936年10月21日就任后推行以\"理性主义原则\"和男女平等为基础的公立免费教育制度。1939年流亡法国，先在图卢兹后在巴黎定居，与同为POUM战友的卡梅尔·萝莎·巴瑟尔巴（即本名单#31）结为终身伴侣，共同创立巴黎\"加泰罗尼亚之家\"。1977年佛朗哥去世后返回加泰罗尼亚。曾获加泰罗尼亚教育界\"68届教师奖\"，2006年与丈夫同获圣乔治十字勋章。2007年去世，终年92岁。"
 SPA_angel_salas_larrazabal_desc:0 "1906年6月4日生于布尔戈斯，1994年1月2日卒于马德里。国民阵营王牌战斗机飞行员，内战期间击落敌机数位居国民方第二（仅次于加西亚-莫拉托）。陆军军官转航空兵，1931年获飞行员资格。内战爆发后效忠国民军，先后驾驶亨克尔He 51和菲亚特CR.32战斗机，参加马德里、哈拉马、瓜达拉哈拉、布鲁内特和埃布罗河等几乎所有重大空战。官方记录击落16架敌机。战后继续在佛朗哥空军中服役，历任多个高级指挥职务。其兄拉蒙·萨拉斯·拉萨巴利为著名内战史学家，著有多部关于内战空战和共和军的权威著作。1994年在马德里去世，终年87岁。"
 CBIO_SPA_angel_salas_larrazabal_desc:0 "1906年6月4日生于布尔戈斯，1994年1月2日卒于马德里。国民阵营王牌战斗机飞行员，内战期间击落敌机数位居国民方第二（仅次于加西亚-莫拉托）。陆军军官转航空兵，1931年获飞行员资格。内战爆发后效忠国民军，先后驾驶亨克尔He 51和菲亚特CR.32战斗机，参加马德里、哈拉马、瓜达拉哈拉、布鲁内特和埃布罗河等几乎所有重大空战。官方记录击落16架敌机。战后继续在佛朗哥空军中服役，历任多个高级指挥职务。其兄拉蒙·萨拉斯·拉萨巴利为著名内战史学家，著有多部关于内战空战和共和军的权威著作。1994年在马德里去世，终年87岁。"
 SPR_andres_nin_desc:0 "加泰罗尼亚语名安德烈乌·宁·伊·佩雷斯，1892年2月4日生于塔拉戈纳省艾尔·班德雷利，1937年6月20日前后被秘密杀害（确切日期不详）。教师出身，精通多门语言，1921年赴莫斯科任共产国际书记处成员和红色工会国际副主席，与托洛茨基建立密切关系。1930年返回西班牙后因反对斯大林路线被西班牙共产党开除，1935年参与创建马克思主义统一工人党，将左翼反对派共产主义者联盟与工农联盟合并。POUM主张工人革命而非与资产阶级共和派合作的\"人民阵线\"路线，与斯大林主义形成尖锐对立。1936年内战爆发后在加泰罗尼亚自治政府中短暂出任司法委员。1937年5月巴塞罗那事件后POUM遭取缔，6月16日宁在巴塞罗那被NKVD特工绑架，关押于阿尔卡拉·德·埃纳雷斯的秘密监狱中遭酷刑审讯，NKVD企图迫其\"承认\"与佛朗哥勾结但未能得逞。据考证约6月20日被秘密处决，遗体至今未找到。乔治·奥威尔《向加泰罗尼亚致敬》和肯·洛奇电影《土地与自由》均涉及宁的遇害事件，此案成为共和阵营内部斯大林主义清洗的最典型案例。"
