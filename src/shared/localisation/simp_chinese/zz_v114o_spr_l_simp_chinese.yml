 SPR_etelvino_vega_desc:0 "全名埃特尔维诺·维加·马丁内斯，1906年生，1939年11月被佛朗哥政权处决。1931年即为西班牙共产党中央委员会成员，1932年桑胡尔霍政变未遂后因支持\"保卫共和国\"路线与共产国际指令产生分歧而被开除党籍。此后赴苏联一段时期后返回西班牙。内战爆发后加入精锐的第五团在索莫谢拉前线作战，此后参加瓜达拉哈拉、特鲁埃尔和埃布罗河等重大战役，在埃布罗河战役中指挥第12军团。1939年3月被内格林政府任命为阿利坎特军事长官，但五天后即遭卡萨多政变分子逮捕。内战结束后被关入阿尔巴特拉集中营，1939年11月被国民政权处决。临刑前将手帕交予同牢难友，嘱其转交妻子，说\"这是我仅有的全部了\"。"
 CBIO_SPR_etelvino_vega_desc:0 "全名埃特尔维诺·维加·马丁内斯，1906年生，1939年11月被佛朗哥政权处决。1931年即为西班牙共产党中央委员会成员，1932年桑胡尔霍政变未遂后因支持\"保卫共和国\"路线与共产国际指令产生分歧而被开除党籍。此后赴苏联一段时期后返回西班牙。内战爆发后加入精锐的第五团在索莫谢拉前线作战，此后参加瓜达拉哈拉、特鲁埃尔和埃布罗河等重大战役，在埃布罗河战役中指挥第12军团。1939年3月被内格林政府任命为阿利坎特军事长官，但五天后即遭卡萨多政变分子逮捕。内战结束后被关入阿尔巴特拉集中营，1939年11月被国民政权处决。临刑前将手帕交予同牢难友，嘱其转交妻子，说\"这是我仅有的全部了\"。"
 SPA_emilio_esteban_infantes_desc:0 "1892年生于马德里，1962年卒于马德里。职业军人，毕业于参谋学院，曾参加摩洛哥里夫战争。内战中效忠国民阵营，在多场战役中任参谋长。1943年接替穆尼奥斯·格兰德斯出任西班牙\"蓝色师团\"（第250步兵师）第二任指挥官，率部在列宁格勒前线东部沃尔霍夫河一带继续对苏作战。1943年底蓝色师团正式撤回后，仍有小规模志愿兵以\"蓝色军团\"名义留在前线，英凡特斯直到1944年初才率最后一批人员返回西班牙。战后历任西班牙陆军高级职务。1962年在马德里去世。"
 CBIO_SPA_emilio_esteban_infantes_desc:0 "1892年生于马德里，1962年卒于马德里。职业军人，毕业于参谋学院，曾参加摩洛哥里夫战争。内战中效忠国民阵营，在多场战役中任参谋长。1943年接替穆尼奥斯·格兰德斯出任西班牙\"蓝色师团\"（第250步兵师）第二任指挥官，率部在列宁格勒前线东部沃尔霍夫河一带继续对苏作战。1943年底蓝色师团正式撤回后，仍有小规模志愿兵以\"蓝色军团\"名义留在前线，英凡特斯直到1944年初才率最后一批人员返回西班牙。战后历任西班牙陆军高级职务。1962年在马德里去世。"
 SPA_emilio_herrera_desc:0 "全名埃米利奥·埃雷拉·利尼耶斯，1879年2月13日生于格拉纳达，1967年9月13日卒于巴黎。航空工程师、军事飞行先驱和发明家。1903年毕业于瓜达拉哈拉工兵学院，1910年代投身航空事业，成为西班牙最早的军事飞行员之一。1920年代从事高空飞行研究，1935年设计出一套全密封加压航天服原型——比美苏太空计划早了近三十年，被后世视为现代宇航服的先驱之一。内战爆发后效忠共和国，担任航空技术和军备生产方面的顾问工作，负责共和空军的技术维护。1939年流亡法国，二战中参与法国抵抗运动。战后定居巴黎，继续从事科学研究和流亡政治活动。1960年出任西班牙共和流亡政府总理（1960—1962年），虽为象征性职务但体现其在共和流亡社群中的崇高声望。1967年在巴黎去世，终年88岁。"
 CBIO_SPA_emilio_herrera_desc:0 "全名埃米利奥·埃雷拉·利尼耶斯，1879年2月13日生于格拉纳达，1967年9月13日卒于巴黎。航空工程师、军事飞行先驱和发明家。1903年毕业于瓜达拉哈拉工兵学院，1910年代投身航空事业，成为西班牙最早的军事飞行员之一。1920年代从事高空飞行研究，1935年设计出一套全密封加压航天服原型——比美苏太空计划早了近三十年，被后世视为现代宇航服的先驱之一。内战爆发后效忠共和国，担任航空技术和军备生产方面的顾问工作，负责共和空军的技术维护。1939年流亡法国，二战中参与法国抵抗运动。战后定居巴黎，继续从事科学研究和流亡政治活动。1960年出任西班牙共和流亡政府总理（1960—1962年），虽为象征性职务但体现其在共和流亡社群中的崇高声望。1967年在巴黎去世，终年88岁。"
 SPR_dolores_ibarruri_desc:0 "1895年12月9日生于比斯开省加利亚尔塔，1989年11月12日卒于马德里。绰号\"热情之花\"，西班牙共产党标志性人物。矿工之女，1917年与矿工胡利安·鲁伊斯结婚，以笔名\"热情之花\"在工人报刊上发表文章。1920年代加入西班牙共产党，迅速成为党内最具感召力的演说家。1936年当选众议员。内战爆发后以\"他们不会通过！\"的口号鼓舞马德里保卫战士气，成为共和抵抗的象征性人物。长期担任PCE副主席，在党内地位仅次于总书记迪亚斯。1939年流亡苏联，1942年迪亚斯死后出任PCE总书记。在莫斯科流亡长达38年。1977年佛朗哥去世后返回西班牙，在首次民主选举中再度当选众议员，年已81岁。晚年将总书记职务交给圣地亚哥·卡里略。1989年在马德里去世，终年93岁，国葬仪式上数万人送别。"
 CBIO_SPR_dolores_ibarruri_desc:0 "1895年12月9日生于比斯开省加利亚尔塔，1989年11月12日卒于马德里。绰号\"热情之花\"，西班牙共产党标志性人物。矿工之女，1917年与矿工胡利安·鲁伊斯结婚，以笔名\"热情之花\"在工人报刊上发表文章。1920年代加入西班牙共产党，迅速成为党内最具感召力的演说家。1936年当选众议员。内战爆发后以\"他们不会通过！\"的口号鼓舞马德里保卫战士气，成为共和抵抗的象征性人物。长期担任PCE副主席，在党内地位仅次于总书记迪亚斯。1939年流亡苏联，1942年迪亚斯死后出任PCE总书记。在莫斯科流亡长达38年。1977年佛朗哥去世后返回西班牙，在首次民主选举中再度当选众议员，年已81岁。晚年将总书记职务交给圣地亚哥·卡里略。1989年在马德里去世，终年93岁，国葬仪式上数万人送别。"
 SPR_domenec_batet_desc:0 "全名多梅内克·巴特·伊·梅斯特雷斯，1872年8月24日生于巴塞罗那，1937年2月18日在布尔戈斯被国民政权枪决。加泰罗尼亚裔职业军人，参加过摩洛哥和古巴殖民战争，以温和审慎著称。1934年10月加泰罗尼亚自治政府主席孔帕尼斯宣布加泰罗尼亚共和国时，巴特以加泰罗尼亚军区司令身份平息事态，既果断制止了分裂叛乱又尽力避免流血——此举赢得各方尊重但也使其在右翼军人中被视为过于软弱。1936年7月叛乱爆发时任布尔戈斯第六军区司令，拒绝参加叛乱并试图维持对共和政府的效忠，但被叛军迅速逮捕拘押。尽管马德里共和政府曾试图通过谈判或人质交换营救，1937年2月18日仍被国民军以军事叛乱罪枪决于布尔戈斯，终年64岁——作为一名忠于宪法誓言的将军，他是被佛朗哥阵营处决的最高级别共和派军人之一。"
 CBIO_SPR_domenec_batet_desc:0 "全名多梅内克·巴特·伊·梅斯特雷斯，1872年8月24日生于巴塞罗那，1937年2月18日在布尔戈斯被国民政权枪决。加泰罗尼亚裔职业军人，参加过摩洛哥和古巴殖民战争，以温和审慎著称。1934年10月加泰罗尼亚自治政府主席孔帕尼斯宣布加泰罗尼亚共和国时，巴特以加泰罗尼亚军区司令身份平息事态，既果断制止了分裂叛乱又尽力避免流血——此举赢得各方尊重但也使其在右翼军人中被视为过于软弱。1936年7月叛乱爆发时任布尔戈斯第六军区司令，拒绝参加叛乱并试图维持对共和政府的效忠，但被叛军迅速逮捕拘押。尽管马德里共和政府曾试图通过谈判或人质交换营救，1937年2月18日仍被国民军以军事叛乱罪枪决于布尔戈斯，终年64岁——作为一名忠于宪法誓言的将军，他是被佛朗哥阵营处决的最高级别共和派军人之一。"
 SPR_augusto_barcia_trelles_desc:0 "1881年8月4日生于贝加德奥（阿斯图里亚斯），1961年5月19日卒于布宜诺斯艾利斯。律师、法学教授和共和派政治家。早年在奥维耶多和马德里大学攻读法律，后成为国际法学者。第二共和国时期活跃于左翼共和党——先后加入曼努埃尔·阿萨尼亚创建的共和行动党和左翼共和党。1936年2月人民阵线选举获胜后，阿萨尼亚先任命马斯切雷特为陆军大臣，5月阿萨尼亚升任总统后，巴尔西亚于1936年5月13日至9月4日出任代总理兼外交大臣——在阿萨尼亚从总理转任总统的过渡期间短暂领导政府。内战爆发时仍在任，此后在共和政府中继续担任外交相关职务。1939年流亡至阿根廷，在布宜诺斯艾利斯从事法学教学和流亡政治活动。1961年在布宜诺斯艾利斯去世，终年79岁。"
 CBIO_SPR_augusto_barcia_trelles_desc:0 "1881年8月4日生于贝加德奥（阿斯图里亚斯），1961年5月19日卒于布宜诺斯艾利斯。律师、法学教授和共和派政治家。早年在奥维耶多和马德里大学攻读法律，后成为国际法学者。第二共和国时期活跃于左翼共和党——先后加入曼努埃尔·阿萨尼亚创建的共和行动党和左翼共和党。1936年2月人民阵线选举获胜后，阿萨尼亚先任命马斯切雷特为陆军大臣，5月阿萨尼亚升任总统后，巴尔西亚于1936年5月13日至9月4日出任代总理兼外交大臣——在阿萨尼亚从总理转任总统的过渡期间短暂领导政府。内战爆发时仍在任，此后在共和政府中继续担任外交相关职务。1939年流亡至阿根廷，在布宜诺斯艾利斯从事法学教学和流亡政治活动。1961年在布宜诺斯艾利斯去世，终年79岁。"
 SPR_antonio_escobar_huerta_desc:0 "1879年11月14日生于休达，1940年2月8日在巴塞罗那蒙特惠奇城堡被国民政权枪决。虔诚天主教徒和保守派，出身军人家庭，17岁入伍从军，长期在宪兵队服役，屡获战功嘉奖。1936年7月叛乱爆发时任巴塞罗那宪兵队上校，尽管政治信仰偏右，仍坚守对宪法政府的效忠誓言，拒绝参加叛乱。7月19日率800名宪兵兵在巴塞罗那街头与叛军激战，对击败戈德德将领的叛乱起到关键作用，保住了共和国对加泰罗尼亚的控制。此后晋升将军，转战多个战区。1939年1月指挥共和军在巴尔塞基略的最后一次攻势未果。2月16日当面向总理内格林报告继续军事抵抗已无可能。3月支持卡萨多政变并在雷阿尔城镇压共产党抵抗，出任埃斯特雷马杜拉军团司令。内战结束后未能逃离西班牙，遭逮捕受军事审判，以\"叛乱罪\"判处死刑。1940年2月8日黎明，在蒙特惠奇城堡行刑时手持十字架跪地，据称自己向行刑队下达了开枪命令。"
 CBIO_SPR_antonio_escobar_huerta_desc:0 "1879年11月14日生于休达，1940年2月8日在巴塞罗那蒙特惠奇城堡被国民政权枪决。虔诚天主教徒和保守派，出身军人家庭，17岁入伍从军，长期在宪兵队服役，屡获战功嘉奖。1936年7月叛乱爆发时任巴塞罗那宪兵队上校，尽管政治信仰偏右，仍坚守对宪法政府的效忠誓言，拒绝参加叛乱。7月19日率800名宪兵兵在巴塞罗那街头与叛军激战，对击败戈德德将领的叛乱起到关键作用，保住了共和国对加泰罗尼亚的控制。此后晋升将军，转战多个战区。1939年1月指挥共和军在巴尔塞基略的最后一次攻势未果。2月16日当面向总理内格林报告继续军事抵抗已无可能。3月支持卡萨多政变并在雷阿尔城镇压共产党抵抗，出任埃斯特雷马杜拉军团司令。内战结束后未能逃离西班牙，遭逮捕受军事审判，以\"叛乱罪\"判处死刑。1940年2月8日黎明，在蒙特惠奇城堡行刑时手持十字架跪地，据称自己向行刑队下达了开枪命令。"
 SPR_antonio_ortega_gutierrez_desc:0 "1888年1月17日生于布尔戈斯省拉贝·德拉斯·卡尔萨达斯，1939年7月15日在阿利坎特被国民政权处决。共和军上校，共产党员。内战爆发时以卡宾枪兵军官身份驻守伊伦边境，7月底率民兵在吉普斯夸省前线作战，8月6日出任吉普斯夸省省长兼军事指挥官，参与圣塞瓦斯蒂安防御战。此后调马德里前线指挥多支部队。1937年5月内格林政府任命其为全国安全总局局长，历史学家休·托马斯认为其与POUM领袖安德烈乌·宁的被捕事件有直接关联；宁随后被NKVD秘密杀害。不久奥特加被解除安全职务调回前线，先后指挥第六军团和第三军团，内战末期该军团部署于马德里中央战线。1939年3月卡萨多政变期间支持内格林，在马德里混战中遭卡萨多派击败。内战结束后被俘，7月15日在阿利坎特遭枪决。战时另以共和国时期“马德里足球俱乐部”临时主席身份而为人所知。"
 CBIO_SPR_antonio_ortega_gutierrez_desc:0 "1888年1月17日生于布尔戈斯省拉贝·德拉斯·卡尔萨达斯，1939年7月15日在阿利坎特被国民政权处决。共和军上校，共产党员。内战爆发时以卡宾枪兵军官身份驻守伊伦边境，7月底率民兵在吉普斯夸省前线作战，8月6日出任吉普斯夸省省长兼军事指挥官，参与圣塞瓦斯蒂安防御战。此后调马德里前线指挥多支部队。1937年5月内格林政府任命其为全国安全总局局长，历史学家休·托马斯认为其与POUM领袖安德烈乌·宁的被捕事件有直接关联；宁随后被NKVD秘密杀害。不久奥特加被解除安全职务调回前线，先后指挥第六军团和第三军团，内战末期该军团部署于马德里中央战线。1939年3月卡萨多政变期间支持内格林，在马德里混战中遭卡萨多派击败。内战结束后被俘，7月15日在阿利坎特遭枪决。战时另以共和国时期“马德里足球俱乐部”临时主席身份而为人所知。"
 SPR_antonio_azarola_y_gresillon_desc:0 "1874年生于纳瓦拉塔法利亚，1936年8月4日在费罗尔海军基地被国民军枪决。共和海军少将，出身军事世家，部分家族移居乌拉圭。早年在海军中稳步晋升，曾两度担任副海军上将费尔南德斯·古铁雷斯·德·塞利斯的副官，并娶其女卡门为妻。历任海军部副部长，1935年12月30日至1936年2月19日在波特拉·巴利亚达雷斯政府中出任海军大臣——1936年大选前最后一届内阁的海军首长。1936年7月叛乱爆发时驻守费罗尔——西班牙最重要的海军基地。拒绝参加叛乱，声明其基督教原则不允许他背弃誓言。被其昔日密友、低军衔的弗朗西斯科·莫雷诺和萨尔瓦多·莫雷诺兄弟（即名单#52和#69的莫雷诺·费尔南德斯兄弟）逮捕，阿扎罗拉对弗朗西斯科说出名言\"您也如此，堂弗朗西斯科\"——犹如凯撒之\"吾儿，亦汝乎\"。8月4日清晨被枪决于多洛雷斯军营内墙下。遗体葬于比拉加尔西亚·德·阿罗萨。后被纳入加尔松法官编制的佛朗哥政权受害者名单。"
