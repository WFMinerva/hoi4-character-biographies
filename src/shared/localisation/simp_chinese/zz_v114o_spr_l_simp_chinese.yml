 SPA_jose_enrique_varela_desc:0 "1891年4月17日生于加的斯省圣费尔南多，1951年3月24日因白血病卒于丹吉尔。军人之子，1909年以列兵入伍投身里夫战争，从二等兵升至士官后进入步兵学校取得少尉军衔，返回摩洛哥后屡立战功，国王阿方索十三世两度授予圣费尔南多桂冠十字勋章——西班牙最高军事荣誉，史上获此殊荣两次者绝无仅有。1925年参加法西联合阿尔胡塞马斯两栖登陆作战，因功晋升上校。1932年参与桑胡尔霍政变未遂入狱，出狱后加入卡洛斯派\"雷克特\"民兵。内战爆发后协助夺取加的斯，此后转战塞维利亚、科尔多瓦、马拉加、埃斯特雷马杜拉、塔霍河谷和托莱多，参与解围阿尔卡萨尔和马德里、哈拉马、布鲁内特、特鲁埃尔、埃布罗河等关键战役，战终时官至少将。1939年8月出任佛朗哥政府陆军大臣，系内阁中卡洛斯派代表。力主西班牙不加入轴心国参战，但支持蓝色师团志愿赴苏。1942年8月16日毕尔巴鄂贝戈尼亚教堂事件中长枪党人以手榴弹袭击卡洛斯派集会，巴雷拉愤而辞职。1945年出任西属摩洛哥高级专员，后任马德里大区司令。佛朗哥追赠\"圣费尔南多·德·巴雷拉侯爵\"封号。"
 CBIO_SPA_jose_enrique_varela_desc:0 "1891年4月17日生于加的斯省圣费尔南多，1951年3月24日因白血病卒于丹吉尔。军人之子，1909年以列兵入伍投身里夫战争，从二等兵升至士官后进入步兵学校取得少尉军衔，返回摩洛哥后屡立战功，国王阿方索十三世两度授予圣费尔南多桂冠十字勋章——西班牙最高军事荣誉，史上获此殊荣两次者绝无仅有。1925年参加法西联合阿尔胡塞马斯两栖登陆作战，因功晋升上校。1932年参与桑胡尔霍政变未遂入狱，出狱后加入卡洛斯派\"雷克特\"民兵。内战爆发后协助夺取加的斯，此后转战塞维利亚、科尔多瓦、马拉加、埃斯特雷马杜拉、塔霍河谷和托莱多，参与解围阿尔卡萨尔和马德里、哈拉马、布鲁内特、特鲁埃尔、埃布罗河等关键战役，战终时官至少将。1939年8月出任佛朗哥政府陆军大臣，系内阁中卡洛斯派代表。力主西班牙不加入轴心国参战，但支持蓝色师团志愿赴苏。1942年8月16日毕尔巴鄂贝戈尼亚教堂事件中长枪党人以手榴弹袭击卡洛斯派集会，巴雷拉愤而辞职。1945年出任西属摩洛哥高级专员，后任马德里大区司令。佛朗哥追赠\"圣费尔南多·德·巴雷拉侯爵\"封号。"
 SPR_jose_miaja_desc:0 "1878年4月20日生于阿斯图里亚斯奥维耶多，1958年1月14日卒于墨西哥。1896年入托莱多步兵学院，毕业后先赴阿斯图里亚斯服役，后调梅利利亚参加1900年摩洛哥战争，1911年升少校，1932年晋升将军。尽管曾加入右翼军人联盟，1935年仍被陆军大臣希尔-罗夫莱斯调至莱里达——一个远离中枢的冷门岗位。1936年内战爆发时驻守马德里，选择效忠共和国，一度出任陆军大臣。1936年11月6日，拉戈·卡巴雷罗政府撤往瓦伦西亚，临行委任米亚哈为马德里共和军司令，命其组建防御委员会\"不惜一切代价\"保卫首都。米亚哈以比森特·罗霍·列乌契为参谋长，在曼萨纳雷斯河一线阻止国民军推进，国际纵队首批部队11月8日抵达增援，大学城之战成为内战标志性战役。此后指挥哈拉马、瓜达拉哈拉（1937年3月击退意大利干涉军）和布鲁内特等战役。1938年4月升任中南部全部共和军总司令。1939年3月支持卡萨多上校反对内格林总理的政变，出任国防委员会主席，试图与佛朗哥谈判但遭拒绝无条件投降。3月30日从甘迪亚乘机飞往奥兰流亡，先后辗转阿尔及利亚、法国，最终定居墨西哥，客死异乡，终年79岁。"
