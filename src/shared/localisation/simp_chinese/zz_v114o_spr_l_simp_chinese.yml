 SPA_luis_valdes_cavanillas_desc:0 "约1874年生，1950年4月13日卒于马德里。国民阵营将领，阿斯图里亚斯维利亚比西奥萨贵族后裔，植物学家卡瓦尼列斯外孙。参谋学院毕业，1924至1925年在摩洛哥拉腊切参谋部任职，1925年参加阿尔胡塞马斯登陆，1927年升准将。1931年依阿萨尼亚改革法主动申请预备役。1936年7月叛乱爆发后即复出，因拉科鲁尼亚军区司令和省军政长官均拒绝叛乱，巴尔德斯以高级将领身份接管指挥，主持加利西亚起义成功，两名拒绝叛乱的将领随后遭处决。8月出任萨拉曼卡省军事长官。1936年10月起在取代临时国防委员会的国家技术委员会中担任总督，负责占领区行政管理和社会秩序，是佛朗哥早期政权的行政核心人物之一。此后继续在国民军中担任北部马德里战线相关指挥职务。1950年4月在马德里去世。"
 CBIO_SPA_luis_valdes_cavanillas_desc:0 "约1874年生，1950年4月13日卒于马德里。国民阵营将领，阿斯图里亚斯维利亚比西奥萨贵族后裔，植物学家卡瓦尼列斯外孙。参谋学院毕业，1924至1925年在摩洛哥拉腊切参谋部任职，1925年参加阿尔胡塞马斯登陆，1927年升准将。1931年依阿萨尼亚改革法主动申请预备役。1936年7月叛乱爆发后即复出，因拉科鲁尼亚军区司令和省军政长官均拒绝叛乱，巴尔德斯以高级将领身份接管指挥，主持加利西亚起义成功，两名拒绝叛乱的将领随后遭处决。8月出任萨拉曼卡省军事长官。1936年10月起在取代临时国防委员会的国家技术委员会中担任总督，负责占领区行政管理和社会秩序，是佛朗哥早期政权的行政核心人物之一。此后继续在国民军中担任北部马德里战线相关指挥职务。1950年4月在马德里去世。"
 SPA_diego_hidalgo_y_duran_desc:0 "迭戈·伊达尔戈·伊·杜兰，1886年生于巴达霍斯省萨尔瓦莱翁，1961年卒。律师出身，1931年至1933年任省长，1933年至1935年出任第二共和国陆军大臣。1934年10月阿斯图里亚斯矿工起义期间，尽管共和国总参谋长马斯切雷特本人忠于共和国，伊达尔戈仍绕开他另行授权佛朗哥全权指挥镇压行动。1936年内战爆发后流亡，1945年后定居阿根廷，1961年去世。"
 CBIO_SPA_diego_hidalgo_y_duran_desc:0 "迭戈·伊达尔戈·伊·杜兰，1886年生于巴达霍斯省萨尔瓦莱翁，1961年卒。律师出身，1931年至1933年任省长，1933年至1935年出任第二共和国陆军大臣。1934年10月阿斯图里亚斯矿工起义期间，尽管共和国总参谋长马斯切雷特本人忠于共和国，伊达尔戈仍绕开他另行授权佛朗哥全权指挥镇压行动。1936年内战爆发后流亡，1945年后定居阿根廷，1961年去世。"
 SPR_diego_hidalgo_duran_desc:0 "迭戈·伊达尔戈·伊·杜兰，1886年生于巴达霍斯省萨尔瓦莱翁，1961年卒。律师出身，1931年至1933年任省长，1933年至1935年出任第二共和国陆军大臣。1934年10月阿斯图里亚斯矿工起义期间，尽管共和国总参谋长马斯切雷特本人忠于共和国，伊达尔戈仍绕开他另行授权佛朗哥全权指挥镇压行动。1936年内战爆发后流亡，1945年后定居阿根廷，1961年去世。"
 CBIO_SPR_diego_hidalgo_duran_desc:0 "迭戈·伊达尔戈·伊·杜兰，1886年生于巴达霍斯省萨尔瓦莱翁，1961年卒。律师出身，1931年至1933年任省长，1933年至1935年出任第二共和国陆军大臣。1934年10月阿斯图里亚斯矿工起义期间，尽管共和国总参谋长马斯切雷特本人忠于共和国，伊达尔戈仍绕开他另行授权佛朗哥全权指挥镇压行动。1936年内战爆发后流亡，1945年后定居阿根廷，1961年去世。"
 SPR_diego_martinez_barrio_desc:0 "1883年11月25日生于塞维利亚，1962年1月1日卒于巴黎。印刷工和记者出身，早年加入共济会，后升任西班牙大东方联盟总长（1929—1934年）。共和联盟党创始人和领袖，参与创建人民阵线。1931年共和国成立后在激进共和党中任职，后因不满勒鲁斯的路线而脱党，1933年10月至12月短暂出任总理。1936年人民阵线大选后出任科尔特斯（议会）议长（1936年3月至1939年3月）。1936年4月至5月间萨莫拉遭弹劾后短暂代行共和国总统职务。内战爆发当天7月19日被阿萨尼亚再度委任总理，试图与莫拉谈判阻止内战，甚至提出将莫拉纳入政府内阁，遭拒后辞职由希拉尔接任。1939年流亡，先赴法国后至墨西哥。1945年11月20日在墨西哥被共和国流亡代表大会选为共和国临时总统，此后以流亡总统身份领导共和国合法性维系工作直至1962年。在巴黎去世，2000年遗骸迁回塞维利亚。"
 CBIO_SPR_diego_martinez_barrio_desc:0 "1883年11月25日生于塞维利亚，1962年1月1日卒于巴黎。印刷工和记者出身，早年加入共济会，后升任西班牙大东方联盟总长（1929—1934年）。共和联盟党创始人和领袖，参与创建人民阵线。1931年共和国成立后在激进共和党中任职，后因不满勒鲁斯的路线而脱党，1933年10月至12月短暂出任总理。1936年人民阵线大选后出任科尔特斯（议会）议长（1936年3月至1939年3月）。1936年4月至5月间萨莫拉遭弹劾后短暂代行共和国总统职务。内战爆发当天7月19日被阿萨尼亚再度委任总理，试图与莫拉谈判阻止内战，甚至提出将莫拉纳入政府内阁，遭拒后辞职由希拉尔接任。1939年流亡，先赴法国后至墨西哥。1945年11月20日在墨西哥被共和国流亡代表大会选为共和国临时总统，此后以流亡总统身份领导共和国合法性维系工作直至1962年。在巴黎去世，2000年遗骸迁回塞维利亚。"
 SPA_ricardo_rada_desc:0 "全名里卡多·德·拉达·伊·佩拉尔，1885年2月5日生于马拉加，1956年6月8日卒于马德里。国民阵营重要将领，终获陆军中将军衔。1906年入托莱多步兵学院，1909年毕业，1913年起在摩洛哥服役共约十二年，多次立功晋升，1925年9月在阿尔胡塞马斯两栖登陆中率先登岸，升至中校。1931年依阿萨尼亚法退出现役。1934年短暂加入长枪党并负责组建其“第一线”民兵，1935年5月1日转入卡洛斯传统共融派并出任雷克特民兵总监察长，将约三万名卡洛斯派志愿兵完成系统军事训练。1936年7月18日夜将一万名雷克特集结于潘普洛纳交由莫拉将军指挥，对国民军起义的成功至关重要。内战中先后指挥纳瓦拉纵队、马德里前线哈拉马战役、第一五二师等部队，参与埃布罗河战役及向瓦伦西亚的推进。1937年4月统一令后接受佛朗哥体制，被任命为国民运动民兵副指挥官之一。战后出任西班牙首任装甲师师长，后历任第十军团司令、安达卢西亚第二军区司令，1952年起任陆军博物馆馆长直至1956年去世。1946年晋升中将，终年71岁。"
 CBIO_SPA_ricardo_rada_desc:0 "全名里卡多·德·拉达·伊·佩拉尔，1885年2月5日生于马拉加，1956年6月8日卒于马德里。国民阵营重要将领，终获陆军中将军衔。1906年入托莱多步兵学院，1909年毕业，1913年起在摩洛哥服役共约十二年，多次立功晋升，1925年9月在阿尔胡塞马斯两栖登陆中率先登岸，升至中校。1931年依阿萨尼亚法退出现役。1934年短暂加入长枪党并负责组建其“第一线”民兵，1935年5月1日转入卡洛斯传统共融派并出任雷克特民兵总监察长，将约三万名卡洛斯派志愿兵完成系统军事训练。1936年7月18日夜将一万名雷克特集结于潘普洛纳交由莫拉将军指挥，对国民军起义的成功至关重要。内战中先后指挥纳瓦拉纵队、马德里前线哈拉马战役、第一五二师等部队，参与埃布罗河战役及向瓦伦西亚的推进。1937年4月统一令后接受佛朗哥体制，被任命为国民运动民兵副指挥官之一。战后出任西班牙首任装甲师师长，后历任第十军团司令、安达卢西亚第二军区司令，1952年起任陆军博物馆馆长直至1956年去世。1946年晋升中将，终年71岁。"
 SPA_alfredo_kindelan_duany_desc:0 "全名阿尔弗雷多·肯德拉·伊·杜安伊，第一代肯德拉侯爵，1879年3月13日生于古巴圣地亚哥，1962年12月14日卒于马德里。西班牙航空先驱和国民阵营将领，爱尔兰裔西班牙贵族家庭出身。1893年入瓜达拉哈拉工兵学院，1905年参与建造西班牙首艘军用飞艇，1909年随彼维斯上校赴欧洲考察航空技术，成为西班牙最早的军事飞行员之一。1913年12月17日在摩洛哥指挥西班牙第一次系统性军事轰炸行动。里夫战争中担任航空军总司令。1931年共和国成立时主动退役拒绝在共和政体下服役。1936年叛乱爆发后，从流亡地直布罗陀飞回西班牙加入叛军，担任国民航空军总司令，在早期战役中统筹协调德国秃鹰军团和意大利航空军团的作战。正是肯德拉最早在将领会议上提出以佛朗哥为总司令的建议，认为此举能带来最高权力。内战结束后肯德拉与佛朗哥关系逐渐恶化：他公开主张应尽快恢复阿方索系君主制，甚至在1942年11月私下警告佛朗哥若西班牙参战他将亲自推翻佛朗哥政府。此后被佛朗哥边缘化，历次复出均遭压制，1946年因签署拥护恢复君主制的\"洛桑宣言\"被流放至加那利群岛。1961年获封侯爵爵位，被外界解读为佛朗哥对其终身追求君主制却最终落空的讽刺性安慰。1962年在马德里去世。"
