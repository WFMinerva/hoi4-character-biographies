 SPA_heli_rolando_de_tella_desc:0 "全名埃利·罗兰多·德·特利亚·伊·坎托斯，1888年9月14日生于卢戈省戈门，1967年10月9日（一说10日）卒。职业军人，并非工业家或部长。农民家庭出身，1907年入托莱多步兵学院，毕业后长期在西属摩洛哥的雷古拉雷斯服役，五度负伤，1924年9月在达尔-赖德山口的阿尔胡塞马斯撤退行动中以英勇指挥获圣费尔南多桂冠十字勋章，1923年获军事荣誉奖章。1925年参加阿尔胡塞马斯两栖登陆。1932年因参与桑胡尔霍政变被流放至撒哈拉维拉西斯内罗斯，1934年大赦获释。1936年内战爆发后率“非洲军”北上纵队之一，在梅里达战役中守住城区，使雅古埃主力得以腾手攻取巴达霍斯。此后参加圣塔德尔战役和阿斯图里亚斯战役。1938年升准将。战后历任卢戈军事长官，1943年因被指滥用军用车辆为家族磨坊服务遭军事荣誉法庭除名；史家普雷斯顿指出真实原因是其倾向波旁王室复辟而令佛朗哥不满。此后遭软禁，先后经历来自佛朗哥随员的人身攻击。1967年去世，终年79岁。"
 CBIO_SPA_heli_rolando_de_tella_desc:0 "全名埃利·罗兰多·德·特利亚·伊·坎托斯，1888年9月14日生于卢戈省戈门，1967年10月9日（一说10日）卒。职业军人，并非工业家或部长。农民家庭出身，1907年入托莱多步兵学院，毕业后长期在西属摩洛哥的雷古拉雷斯服役，五度负伤，1924年9月在达尔-赖德山口的阿尔胡塞马斯撤退行动中以英勇指挥获圣费尔南多桂冠十字勋章，1923年获军事荣誉奖章。1925年参加阿尔胡塞马斯两栖登陆。1932年因参与桑胡尔霍政变被流放至撒哈拉维拉西斯内罗斯，1934年大赦获释。1936年内战爆发后率“非洲军”北上纵队之一，在梅里达战役中守住城区，使雅古埃主力得以腾手攻取巴达霍斯。此后参加圣塔德尔战役和阿斯图里亚斯战役。1938年升准将。战后历任卢戈军事长官，1943年因被指滥用军用车辆为家族磨坊服务遭军事荣誉法庭除名；史家普雷斯顿指出真实原因是其倾向波旁王室复辟而令佛朗哥不满。此后遭软禁，先后经历来自佛朗哥随员的人身攻击。1967年去世，终年79岁。"
 SPR_jesus_hernandez_tomas_desc:0 "1907年生于穆尔西亚，1971年1月11日卒于墨西哥。西班牙共产党核心领袖，内战时期两届内阁的教育部长。童年随家迁居毕尔巴鄂，6岁即为生计劳动，1916年9岁时入社会主义青年团，1921年14岁时参与创建西班牙共产党毕尔巴鄂分支。1929年入狱后获释，1930年代成为PCE中央政治局委员会成员，任《工人世界报》编辑。1936年大选当选科尔多瓦众议员。内战爆发后，9月4日拉戈·卡巴雷罗任命其为教育与美术大臣，是两位共产党部长之一（另一位为农业大臣维森特·乌利韦）。1937年5月15日埃尔南德斯与乌利韦在巴塞罗那五月事件问题上与拉戈·卡巴雷罗决裂退出内阁，直接导致拉戈·卡巴雷罗政府垮台。内格林继任总理后，埃尔南德斯在新内阁中继任教育与卫生大臣。持续对国防大臣普列托施压，普列托1938年4月辞职。1939年流亡苏联，当选共产国际执行委员会委员。1942年迪亚斯死后权力争斗中落败于伊巴露丽阵营，1943年被派往墨西哥，1944年以背叛党的路线为由被开除党籍。1953年在墨西哥出版回忆录《我曾是斯大林的部长》，书中揭露安德烈乌·宁遭酷刑和NKVD暗杀内幕，PCE官方史从此将其抹去。后支持铁托路线，1971年在墨西哥去世。"
 CBIO_SPR_jesus_hernandez_tomas_desc:0 "1907年生于穆尔西亚，1971年1月11日卒于墨西哥。西班牙共产党核心领袖，内战时期两届内阁的教育部长。童年随家迁居毕尔巴鄂，6岁即为生计劳动，1916年9岁时入社会主义青年团，1921年14岁时参与创建西班牙共产党毕尔巴鄂分支。1929年入狱后获释，1930年代成为PCE中央政治局委员会成员，任《工人世界报》编辑。1936年大选当选科尔多瓦众议员。内战爆发后，9月4日拉戈·卡巴雷罗任命其为教育与美术大臣，是两位共产党部长之一（另一位为农业大臣维森特·乌利韦）。1937年5月15日埃尔南德斯与乌利韦在巴塞罗那五月事件问题上与拉戈·卡巴雷罗决裂退出内阁，直接导致拉戈·卡巴雷罗政府垮台。内格林继任总理后，埃尔南德斯在新内阁中继任教育与卫生大臣。持续对国防大臣普列托施压，普列托1938年4月辞职。1939年流亡苏联，当选共产国际执行委员会委员。1942年迪亚斯死后权力争斗中落败于伊巴露丽阵营，1943年被派往墨西哥，1944年以背叛党的路线为由被开除党籍。1953年在墨西哥出版回忆录《我曾是斯大林的部长》，书中揭露安德烈乌·宁遭酷刑和NKVD暗杀内幕，PCE官方史从此将其抹去。后支持铁托路线，1971年在墨西哥去世。"
 SPR_luis_gonzalez_de_ubieta_desc:0 "全名路易斯·冈萨雷斯·德·乌别塔·伊·冈萨雷斯·德尔·坎皮略，1899年11月18日生于莱昂，1950年12月30日随舰沉没于哥伦比亚马格达莱纳河口博卡斯·德·塞尼萨，以身殉职。比斯开省贵族家庭出身，父为林业工程师。1917年入海军学院。内战爆发时以海军少校军衔任“阿尔塔布罗”号海洋考察船舰长，7月19日转任“何塞·路易斯·迪亚斯”驱逐舰，参与平定阿利坎特叛乱，9月随舰队参加坎塔布里亚湾行动。1936年12月29日出任共和海军参谋长。1937年10月27日升任共和舰队司令。1938年3月6日在帕洛斯角海战中共和舰队击沉国民派重型巡洋舰“巴利阿里斯”号，致765名国民派海军官兵阵亡——此为共和海军内战期间最重要的一次胜利。1939年1月8日转任梅诺卡岛海军基地司令，2月8日在英国皇家海军“德文郡”号居中斡旋下，以避免流血为由向国民派投降，疏散452名共和难民后随英舰赴马赛。此后流亡法国、墨西哥、委内瑞拉。晚年担任巴拿马籍货轮“奇里基”号船长，1950年12月30日船只在哥伦比亚水域沉没，拒绝接受救援，随舰长眠，终年51岁。"
 CBIO_SPR_luis_gonzalez_de_ubieta_desc:0 "全名路易斯·冈萨雷斯·德·乌别塔·伊·冈萨雷斯·德尔·坎皮略，1899年11月18日生于莱昂，1950年12月30日随舰沉没于哥伦比亚马格达莱纳河口博卡斯·德·塞尼萨，以身殉职。比斯开省贵族家庭出身，父为林业工程师。1917年入海军学院。内战爆发时以海军少校军衔任“阿尔塔布罗”号海洋考察船舰长，7月19日转任“何塞·路易斯·迪亚斯”驱逐舰，参与平定阿利坎特叛乱，9月随舰队参加坎塔布里亚湾行动。1936年12月29日出任共和海军参谋长。1937年10月27日升任共和舰队司令。1938年3月6日在帕洛斯角海战中共和舰队击沉国民派重型巡洋舰“巴利阿里斯”号，致765名国民派海军官兵阵亡——此为共和海军内战期间最重要的一次胜利。1939年1月8日转任梅诺卡岛海军基地司令，2月8日在英国皇家海军“德文郡”号居中斡旋下，以避免流血为由向国民派投降，疏散452名共和难民后随英舰赴马赛。此后流亡法国、墨西哥、委内瑞拉。晚年担任巴拿马籍货轮“奇里基”号船长，1950年12月30日船只在哥伦比亚水域沉没，拒绝接受救援，随舰长眠，终年51岁。"
 SPA_luis_hernando_de_larramendi_desc:0 "全名路易斯·埃尔南多·伊·德·拉腊门迪，1882年9月27日生于马德里，1957年12月27日卒。律师、作家和卡洛斯主义政治理论家。父为医生，母系出自巴斯克拉腊门迪氏族，幼年随父赴巴黎，父亲曾在1889年万国博览会承建斗牛场。入马德里圣伊西德罗中学，后习法律并开设律师事务所，以1906年为无政府主义者纳肯斯辩护闻名一时。此后长期担任卡洛斯派觊觎者哈伊梅的秘书长，1919至1921年间短暂出任卡洛斯派领袖。1931年以卡洛斯派候选人身份参选马德里选区，并创办《标准》周刊。内战期间支持卡洛斯派但反对全面融入佛朗哥体制。战后坚决拒绝承认佛朗哥政权的合法性，以著述为主要战场，1952年出版代表作《传统体制》，系统阐述卡洛斯传统主义的天主教整合主义国家理论。其子伊格纳西奥·埃尔南多·德·拉腊门迪后来成为西班牙MAPFRE保险集团的现代奠基人。1957年卒于马德里，终年75岁。"
