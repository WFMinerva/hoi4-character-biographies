 SPR_mate_zalka_desc:0 "本名贝拉·弗兰克尔，1896年4月23日生于匈牙利图尼奥格马托尔奇，1937年6月11日阵亡于西班牙韦斯卡附近。匈牙利犹太裔作家、军人和革命家。18岁虚报年龄应征入奥匈帝国军队，在意大利前线和俄国前线作战，1917年被俄军俘虏，在战俘营中接受布尔什维克思想。1918年2月在哈巴罗夫斯克组建以匈牙利前战俘为主的国际红卫队，参加俄国内战西伯利亚战场对白军作战。一战结束后留在苏俄，1920年参加苏波战争基辅战役，1921至1923年任苏联契卡/格别乌骑兵团长，在克里米亚和乌克兰参与清剿马赫诺游击队的行动。1925至1928年任莫斯科\"革命剧院\"（今马雅可夫斯基剧院）导演，同时从事文学创作，代表作为一战题材长篇小说《多贝尔多》。1936年赴西班牙，11月以化名\"帕尔·卢卡奇将军\"加入国际纵队，先后指挥第12国际旅和第45师。1937年6月11日在韦斯卡附近公路上座车遭炮火击中阵亡。海明威多部作品中提及其形象。遗骸后移回匈牙利，葬于布达佩斯凯雷佩什公墓。"
