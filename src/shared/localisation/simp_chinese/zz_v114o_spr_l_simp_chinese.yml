 SPA_agustin_munoz_grandes_desc:0 "1896年1月27日生于马德里卡拉班切尔，1970年7月11日卒于马德里。1910年入托莱多步兵学院，一战后赴摩洛哥参加里夫战争，1925年参加阿尔胡塞马斯两栖登陆获军事奖章。共和国时期曾支持改革，但1936年叛乱爆发后加入国民阵营。内战中指挥多场战役，包括瓜达拉哈拉和埃布罗河。1941年德国入侵苏联后，出任西班牙\"蓝色师团\"（第250步兵师）首任指挥官，率约18000名志愿兵赴苏联东线列宁格勒前线作战。在沃尔霍夫河畔指挥冬季防御战，获德国铁十字骑士勋章。1942年底因与佛朗哥在对德关系上产生分歧被召回。战后历任陆军参谋长、第一军团司令，1962年出任副总统兼国务委员会主席——佛朗哥政权中地位最高的军事人物。曾被视为佛朗哥继承人候选之一，但最终未能如愿。1970年在马德里去世，终年74岁。"
