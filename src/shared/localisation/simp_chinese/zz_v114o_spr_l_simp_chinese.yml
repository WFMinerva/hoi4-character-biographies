l_simp_chinese:
 CBIO_SPR_alejandro_lerroux_desc:0 "1864年3月4日生于科尔多瓦省拉兰布拉，1949年6月25日卒于马德里（一说6月27日）。军士长之子，早年在马德里从事法律和新闻工作，1880年代末加入共和派，追随鲁伊斯·索里利亚的激进共和主义路线。1901年首次当选众议员，此后以巴塞罗那为根据地，以激烈的反教权和工人主义言辞闻名，与新兴的加泰罗尼亚民族主义形成尖锐对立。1907年因政治迫害流亡阿根廷，1908年创建激进共和党。1909年其追随者被指参与巴塞罗那焚烧修道院事件后，立场逐渐趋向温和，激进党转型为代表中产阶级自由主义的政党。1931年第二共和国成立后任首任外交部长（国务大臣），1933年11月至1935年9月间三度出任总理，依靠右翼西班牙自治右翼联盟支持执政。1934年10月严厉镇压阿斯图里亚斯矿工起义和加泰罗尼亚分离运动。1935年底\"斯特拉佩洛\"赌博腐败丑闻曝光，多名亲属和党内要员牵涉其中，政治声誉崩塌。1936年大选中落选，激进党遭灾难性惨败。内战爆发后流亡葡萄牙，1947年方获准返回西班牙，晚年远离政坛，终年85岁。"
