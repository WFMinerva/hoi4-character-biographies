 SPR_andres_garcia_la_calle_desc:0 "共和空军飞行员，内战中驾驶苏制波利卡尔波夫I-15和I-16战斗机参加空战。在共和空军飞行员普遍缺乏训练和经验的背景下，加西亚·拉·卡莱是少数能与德国秃鹰军团和意大利航空军团飞行员抗衡的本土飞行员之一。参加了马德里、哈拉马、瓜达拉哈拉和埃布罗河等战役的空中掩护和对地支援行动。"
 SPR_andres_garcia_calle_desc:0 "共和空军飞行员，内战中驾驶苏制波利卡尔波夫I-15和I-16战斗机参加空战。在共和空军飞行员普遍缺乏训练和经验的背景下，加西亚·拉·卡莱是少数能与德国秃鹰军团和意大利航空军团飞行员抗衡的本土飞行员之一。参加了马德里、哈拉马、瓜达拉哈拉和埃布罗河等战役的空中掩护和对地支援行动。"
 CBIO_SPR_andres_garcia_la_calle_desc:0 "共和空军飞行员，内战中驾驶苏制波利卡尔波夫I-15和I-16战斗机参加空战。在共和空军飞行员普遍缺乏训练和经验的背景下，加西亚·拉·卡莱是少数能与德国秃鹰军团和意大利航空军团飞行员抗衡的本土飞行员之一。参加了马德里、哈拉马、瓜达拉哈拉和埃布罗河等战役的空中掩护和对地支援行动。"
 SPR_andres_saborit_colomer_desc:0 "1889年1月1日生于马德里，1980年卒于瑞士日内瓦（一说法国）。西班牙工人社会党和总工会资深活动家。印刷工出身，年轻时加入PSOE和UGT，成为巴勃罗·伊格莱西亚斯的追随者，属PSOE温和改良派。1909年参与\"悲剧周\"后的工运活动。共和国时期多次当选众议员，在马德里市政和PSOE组织中长期任职。政治立场坚定反共，与社会党左翼拉戈·卡巴雷罗派系对立。内战中随共和政府辗转，1939年流亡法国后辗转至瑞士日内瓦，参与PSOE流亡组织活动，与普列托同属党内温和派阵营。在流亡期间从事写作，著有关于巴勃罗·伊格莱西亚斯和西班牙工人运动的历史著作。1980年去世，终年91岁。"
 CBIO_SPR_andres_saborit_colomer_desc:0 "1889年1月1日生于马德里，1980年卒于瑞士日内瓦（一说法国）。西班牙工人社会党和总工会资深活动家。印刷工出身，年轻时加入PSOE和UGT，成为巴勃罗·伊格莱西亚斯的追随者，属PSOE温和改良派。1909年参与\"悲剧周\"后的工运活动。共和国时期多次当选众议员，在马德里市政和PSOE组织中长期任职。政治立场坚定反共，与社会党左翼拉戈·卡巴雷罗派系对立。内战中随共和政府辗转，1939年流亡法国后辗转至瑞士日内瓦，参与PSOE流亡组织活动，与普列托同属党内温和派阵营。在流亡期间从事写作，著有关于巴勃罗·伊格莱西亚斯和西班牙工人运动的历史著作。1980年去世，终年91岁。"
 SPR_nicolas_molero_desc:0 "全名尼古拉斯·莫莱罗·洛沃，1870年12月6日生于马德里省阿尔卡拉·德·埃纳雷斯，1947年11月11日卒于巴塞罗那。共济会成员，职业军人，参加过古巴独立战争和摩洛哥战争，升至师级将军。1935年12月14日至1936年2月19日出任波特拉·巴利亚达雷斯保守派政府陆军大臣——此为人民阵线选举前的末届右翼内阁，而非人民阵线时期。任内曾维持国防秩序，拒绝宣布戒严。2月选举后人民阵线执政，改由马斯切雷特接任。此后莫莱罗出任巴利亚多利德第七师管区司令。1936年7月18日叛乱爆发时正在病床恢复，坚决拒绝参加起义；叛乱将领萨利凯特和庞特率人闯入其办公室强迫其宣告戒严，争执中枪战爆发，莫莱罗中弹受伤，随即被捕解职，由萨利凯特接管。战后被国民政权拘押至1940年，获释后居于巴塞罗那，1947年在当地去世，终年76岁。"
 CBIO_SPR_nicolas_molero_desc:0 "全名尼古拉斯·莫莱罗·洛沃，1870年12月6日生于马德里省阿尔卡拉·德·埃纳雷斯，1947年11月11日卒于巴塞罗那。共济会成员，职业军人，参加过古巴独立战争和摩洛哥战争，升至师级将军。1935年12月14日至1936年2月19日出任波特拉·巴利亚达雷斯保守派政府陆军大臣——此为人民阵线选举前的末届右翼内阁，而非人民阵线时期。任内曾维持国防秩序，拒绝宣布戒严。2月选举后人民阵线执政，改由马斯切雷特接任。此后莫莱罗出任巴利亚多利德第七师管区司令。1936年7月18日叛乱爆发时正在病床恢复，坚决拒绝参加起义；叛乱将领萨利凯特和庞特率人闯入其办公室强迫其宣告戒严，争执中枪战爆发，莫莱罗中弹受伤，随即被捕解职，由萨利凯特接管。战后被国民政权拘押至1940年，获释后居于巴塞罗那，1947年在当地去世，终年76岁。"
 SPR_francisco_ciutat_de_miguel_desc:0 "全名弗朗西斯科·休塔特·德·米格尔，1909年生于巴塞罗那，约1986年卒于古巴哈瓦那。职业军官，参谋学院毕业。内战爆发后效忠共和国，加入共产党，在共和军中历任参谋和指挥职务。参加马德里保卫战、特鲁埃尔和埃布罗河等战役，战争后期升至师长和军长级别。1939年流亡苏联，后移居古巴，在卡斯特罗革命后定居哈瓦那，从事军事历史研究和教学工作。著有多部关于西班牙内战军事史的著作，是共和军战争经验的重要记录者之一。在古巴去世。"
 CBIO_SPR_francisco_ciutat_de_miguel_desc:0 "全名弗朗西斯科·休塔特·德·米格尔，1909年生于巴塞罗那，约1986年卒于古巴哈瓦那。职业军官，参谋学院毕业。内战爆发后效忠共和国，加入共产党，在共和军中历任参谋和指挥职务。参加马德里保卫战、特鲁埃尔和埃布罗河等战役，战争后期升至师长和军长级别。1939年流亡苏联，后移居古巴，在卡斯特罗革命后定居哈瓦那，从事军事历史研究和教学工作。著有多部关于西班牙内战军事史的著作，是共和军战争经验的重要记录者之一。在古巴去世。"
 SPR_francisco_largo_caballero_desc:0 "1869年10月15日生于马德里，1946年3月23日卒于巴黎。绰号\"西班牙列宁\"，西班牙工人社会党和总工会历史性领袖。泥水匠出身，7岁辍学当学徒，1890年参加建筑工人罢工，1894年加入PSOE。因领导1917年大罢工被判终身监禁，1918年在狱中当选众议员后获释。1925年创党元老伊格莱西亚斯去世后继任PSOE和UGT双料领袖。普里莫·德·里维拉独裁期间采取合作策略以保存工会力量，此举令其与主张抵制的普列托产生分歧——这一对立贯穿两人此后全部政治生涯。1931至1933年在第二共和国首届政府中任劳工大臣，推行八小时工作日和混合仲裁法庭制度。1933年右翼执政后急剧左转，开始鼓吹\"社会主义革命\"，被追随者冠以\"西班牙列宁\"之名。1934年参与领导十月工人起义失败后入狱。1936年9月4日在内战中出任总理兼陆军大臣，致力于将民兵改编为正规军并维护政府权威，曾愤怒驱逐试图干预内政的苏联大使罗森伯格。1937年5月巴塞罗那事件后遭共产党逼宫于17日辞职。1939年流亡法国，维希政府时期被捕，1943年遭盖世太保逮捕投入萨克森豪森集中营，1945年获波兰军队解放。战后返回巴黎，1946年去世。1978年遗骸迁回马德里。"
 CBIO_SPR_francisco_largo_caballero_desc:0 "1869年10月15日生于马德里，1946年3月23日卒于巴黎。绰号\"西班牙列宁\"，西班牙工人社会党和总工会历史性领袖。泥水匠出身，7岁辍学当学徒，1890年参加建筑工人罢工，1894年加入PSOE。因领导1917年大罢工被判终身监禁，1918年在狱中当选众议员后获释。1925年创党元老伊格莱西亚斯去世后继任PSOE和UGT双料领袖。普里莫·德·里维拉独裁期间采取合作策略以保存工会力量，此举令其与主张抵制的普列托产生分歧——这一对立贯穿两人此后全部政治生涯。1931至1933年在第二共和国首届政府中任劳工大臣，推行八小时工作日和混合仲裁法庭制度。1933年右翼执政后急剧左转，开始鼓吹\"社会主义革命\"，被追随者冠以\"西班牙列宁\"之名。1934年参与领导十月工人起义失败后入狱。1936年9月4日在内战中出任总理兼陆军大臣，致力于将民兵改编为正规军并维护政府权威，曾愤怒驱逐试图干预内政的苏联大使罗森伯格。1937年5月巴塞罗那事件后遭共产党逼宫于17日辞职。1939年流亡法国，维希政府时期被捕，1943年遭盖世太保逮捕投入萨克森豪森集中营，1945年获波兰军队解放。战后返回巴黎，1946年去世。1978年遗骸迁回马德里。"
 SPA_fransisco_moreno_fernandez_desc:0 "1883年生于费罗尔，1945年卒于马德里。国民阵营海军军官。内战爆发时在费罗尔海军基地参加叛乱，与其弟萨尔瓦多·莫雷诺·费尔南德斯（即名单#69）共同逮捕了忠于共和国的上级——海军少将阿扎罗拉·格雷西隆（即名单#43），尽管阿扎罗拉此前系其密友。内战中在国民派海军中历任要职，参加多场海上作战和封锁行动。战后在佛朗哥海军体制中继续服役。1945年在马德里去世。注意：名单#52与#69为兄弟关系，弗朗西斯科为兄，萨尔瓦多为弟，两人在费罗尔叛乱中扮演关键角色。"
 CBIO_SPA_fransisco_moreno_fernandez_desc:0 "1883年生于费罗尔，1945年卒于马德里。国民阵营海军军官。内战爆发时在费罗尔海军基地参加叛乱，与其弟萨尔瓦多·莫雷诺·费尔南德斯（即名单#69）共同逮捕了忠于共和国的上级——海军少将阿扎罗拉·格雷西隆（即名单#43），尽管阿扎罗拉此前系其密友。内战中在国民派海军中历任要职，参加多场海上作战和封锁行动。战后在佛朗哥海军体制中继续服役。1945年在马德里去世。注意：名单#52与#69为兄弟关系，弗朗西斯科为兄，萨尔瓦多为弟，两人在费罗尔叛乱中扮演关键角色。"
 SPA_enrique_canovas_lacruz_desc:0 "1877年6月29日生于拉科鲁尼亚，1965年10月13日卒于马德里。职业军人，非长枪党政治人物。1892年入托莱多军事学院，毕业后历经古巴战争和摩洛哥里夫战争。1936年7月叛乱爆发时，加利西亚第八军区司令萨尔塞多和拉科鲁尼亚省军事长官卡里达德·皮塔均拒绝参加起义，卡诺瓦斯以上校军衔挺身而出，主持了加利西亚的叛乱成功，逮捕两名忠于共和国的将领；二人随后遭处决。由此，卡诺瓦斯成为国民军在西班牙西北部的早期功勋人物。内战中参与多场战役，向马德里方向推进。1940年10月出任瓦伦西亚军区司令，1942年4月至1943年7月出任佛朗哥政权宪兵队长官，任内编制统一制服和内部规章，后转入预备役。1965年在马德里去世，终年88岁。"
 CBIO_SPA_enrique_canovas_lacruz_desc:0 "1877年6月29日生于拉科鲁尼亚，1965年10月13日卒于马德里。职业军人，非长枪党政治人物。1892年入托莱多军事学院，毕业后历经古巴战争和摩洛哥里夫战争。1936年7月叛乱爆发时，加利西亚第八军区司令萨尔塞多和拉科鲁尼亚省军事长官卡里达德·皮塔均拒绝参加起义，卡诺瓦斯以上校军衔挺身而出，主持了加利西亚的叛乱成功，逮捕两名忠于共和国的将领；二人随后遭处决。由此，卡诺瓦斯成为国民军在西班牙西北部的早期功勋人物。内战中参与多场战役，向马德里方向推进。1940年10月出任瓦伦西亚军区司令，1942年4月至1943年7月出任佛朗哥政权宪兵队长官，任内编制统一制服和内部规章，后转入预备役。1965年在马德里去世，终年88岁。"
 SPR_toribio_martinez_cabrera_desc:0 "共和军将领，内战期间曾任共和军总参谋部高级参谋和部门负责人。在比森特·罗霍·列乌契领导的参谋体系中工作，参与多次重大战役的参谋规划。1937年担任加泰罗尼亚方面的军事参谋职务，参与阿拉贡前线的作战计划制定。内战后期随共和军高级将领流亡。"
 CBIO_SPR_toribio_martinez_cabrera_desc:0 "共和军将领，内战期间曾任共和军总参谋部高级参谋和部门负责人。在比森特·罗霍·列乌契领导的参谋体系中工作，参与多次重大战役的参谋规划。1937年担任加泰罗尼亚方面的军事参谋职务，参与阿拉贡前线的作战计划制定。内战后期随共和军高级将领流亡。"
 SPA_tomas_garciano_goni_desc:0 "托马斯·加里卡诺·戈尼，1910年2月9日生于纳瓦拉潘普洛纳，1988年1月16日卒于马德里，西班牙军法官、佛朗哥政权官员。出身传统主义家庭，1929年毕业于马德里中央大学法律系，1930年考入军法系统，先后任职于拉科鲁尼亚、马德里、加那利、巴利亚多利德和布尔戈斯等地。1936年7月政变爆发时在第八师区审计部门任职，积极参与叛乱，充当埃米利奥·莫拉与巴勃罗·马丁·阿隆索之间的联络人；内战期间任军事审计官和纳瓦拉军团法律顾问，是国民阵营法律镇压体系中的一员。1940年任空军军法系统将官，1941年任司法与法律事务秘书长。战后长期在佛朗哥体制内任职，1951年至1956年任吉普斯夸民政长官，1966年至1969年任巴塞罗那民政长官，期间压制学生运动和反体制活动。1969年10月出任内政部长，任内试图以较温和的治安技术手段控制社会抗议，却仍处在独裁政权镇压体系之内；1973年因警察在五一事件中死亡后辞职。佛朗哥死后支持苏亚雷斯政治改革，1978年退出政界和军界，1988年在马德里去世。"
 CBIO_SPA_tomas_garciano_goni_desc:0 "托马斯·加里卡诺·戈尼，1910年2月9日生于纳瓦拉潘普洛纳，1988年1月16日卒于马德里，西班牙军法官、佛朗哥政权官员。出身传统主义家庭，1929年毕业于马德里中央大学法律系，1930年考入军法系统，先后任职于拉科鲁尼亚、马德里、加那利、巴利亚多利德和布尔戈斯等地。1936年7月政变爆发时在第八师区审计部门任职，积极参与叛乱，充当埃米利奥·莫拉与巴勃罗·马丁·阿隆索之间的联络人；内战期间任军事审计官和纳瓦拉军团法律顾问，是国民阵营法律镇压体系中的一员。1940年任空军军法系统将官，1941年任司法与法律事务秘书长。战后长期在佛朗哥体制内任职，1951年至1956年任吉普斯夸民政长官，1966年至1969年任巴塞罗那民政长官，期间压制学生运动和反体制活动。1969年10月出任内政部长，任内试图以较温和的治安技术手段控制社会抗议，却仍处在独裁政权镇压体系之内；1973年因警察在五一事件中死亡后辞职。佛朗哥死后支持苏亚雷斯政治改革，1978年退出政界和军界，1988年在马德里去世。"
 SPA_tomas_dominguez_arevalo_desc:0 "全名托马斯·多明格斯·阿雷瓦洛，罗德斯诺伯爵，1882年9月21日生于潘普洛纳，1952年11月2日卒于马德里。卡洛斯派（传统主义）领袖中的温和务实派代表。出身纳瓦拉贵族家庭，法学博士，长期担任纳瓦拉地区传统共融派领导人。与主张强硬路线的法尔·孔戴（名单#6）形成党内对立。1936年叛乱前夕，在法尔·孔戴与莫拉的谈判几近破裂时，罗德斯诺从中斡旋，促成卡洛斯派最终加入叛乱，对纳瓦拉\"雷克特\"民兵参战起关键作用。1937年4月佛朗哥颁布统一令时，罗德斯诺代表的纳瓦拉卡洛斯派主流倾向接受合并，与坚持独立的法尔·孔戴分道扬镳。1938至1941年在佛朗哥政府中出任司法大臣，成为卡洛斯派进入佛朗哥体制的代表人物。1952年在马德里去世。"
 CBIO_SPA_tomas_dominguez_arevalo_desc:0 "全名托马斯·多明格斯·阿雷瓦洛，罗德斯诺伯爵，1882年9月21日生于潘普洛纳，1952年11月2日卒于马德里。卡洛斯派（传统主义）领袖中的温和务实派代表。出身纳瓦拉贵族家庭，法学博士，长期担任纳瓦拉地区传统共融派领导人。与主张强硬路线的法尔·孔戴（名单#6）形成党内对立。1936年叛乱前夕，在法尔·孔戴与莫拉的谈判几近破裂时，罗德斯诺从中斡旋，促成卡洛斯派最终加入叛乱，对纳瓦拉\"雷克特\"民兵参战起关键作用。1937年4月佛朗哥颁布统一令时，罗德斯诺代表的纳瓦拉卡洛斯派主流倾向接受合并，与坚持独立的法尔·孔戴分道扬镳。1938至1941年在佛朗哥政府中出任司法大臣，成为卡洛斯派进入佛朗哥体制的代表人物。1952年在马德里去世。"
 SPA_rafael_garcia_valino_desc:0 "全名拉斐尔·加西亚·巴利尼奥·伊·马斯坎，1898年3月24日生于萨拉戈萨，1972年8月23日卒于马德里。国民阵营将领，内战中和战后佛朗哥军队的重要军事人物。参谋学院毕业，曾参加摩洛哥里夫战争。内战中先后在北方和阿拉贡前线指挥国民军部队，参加特鲁埃尔战役和埃布罗河战役中的国民军反攻，指挥\"马埃斯特拉斯戈军团\"，在加泰罗尼亚攻势中发挥重要作用。战后继续在佛朗哥军队中晋升，1951年出任西属摩洛哥高级专员——继梅齐亚纳（名单#18）之前的前任。1956年摩洛哥独立前夕负责移交事务。1957年升上将。1972年在马德里去世。"
 CBIO_SPA_rafael_garcia_valino_desc:0 "全名拉斐尔·加西亚·巴利尼奥·伊·马斯坎，1898年3月24日生于萨拉戈萨，1972年8月23日卒于马德里。国民阵营将领，内战中和战后佛朗哥军队的重要军事人物。参谋学院毕业，曾参加摩洛哥里夫战争。内战中先后在北方和阿拉贡前线指挥国民军部队，参加特鲁埃尔战役和埃布罗河战役中的国民军反攻，指挥\"马埃斯特拉斯戈军团\"，在加泰罗尼亚攻势中发挥重要作用。战后继续在佛朗哥军队中晋升，1951年出任西属摩洛哥高级专员——继梅齐亚纳（名单#18）之前的前任。1956年摩洛哥独立前夕负责移交事务。1957年升上将。1972年在马德里去世。"
 SPA_ramon_serrano_suner_desc:0 "1901年9月12日生于卡塔赫纳，2003年9月1日卒于马德里，享年101岁——内战主要人物中最后一位辞世者。律师出身，马德里中央大学法学博士，在意大利和德国进修期间接触法西斯思想。与佛朗哥之妻卡门·波洛的妹妹西塔结婚，成为佛朗哥的连襟，获戏称\"超级连襟\"。共和国时期当选CEDA众议员。内战爆发时在马德里被捕入狱，1937年越狱逃至国民区。凭借与佛朗哥的姻亲关系和出色的政治才能迅速崛起，1938至1942年间先后出任内政大臣和外交大臣，实际权力仅次于佛朗哥本人，主导了1937年统一令的意识形态构建和国民运动的法西斯化方向。力主西班牙亲德国和意大利路线，1940年10月安排佛朗哥与希特勒在昂代会晤。1942年8月贝戈尼亚教堂事件后，佛朗哥借机将倾向过度亲轴心国的塞拉诺·苏涅尔免职，以卡洛斯派巴雷拉（名单#9）的辞职为对称安排。此后被彻底边缘化，余生远离政治，以律师身份执业直至高龄。"
 CBIO_SPA_ramon_serrano_suner_desc:0 "1901年9月12日生于卡塔赫纳，2003年9月1日卒于马德里，享年101岁——内战主要人物中最后一位辞世者。律师出身，马德里中央大学法学博士，在意大利和德国进修期间接触法西斯思想。与佛朗哥之妻卡门·波洛的妹妹西塔结婚，成为佛朗哥的连襟，获戏称\"超级连襟\"。共和国时期当选CEDA众议员。内战爆发时在马德里被捕入狱，1937年越狱逃至国民区。凭借与佛朗哥的姻亲关系和出色的政治才能迅速崛起，1938至1942年间先后出任内政大臣和外交大臣，实际权力仅次于佛朗哥本人，主导了1937年统一令的意识形态构建和国民运动的法西斯化方向。力主西班牙亲德国和意大利路线，1940年10月安排佛朗哥与希特勒在昂代会晤。1942年8月贝戈尼亚教堂事件后，佛朗哥借机将倾向过度亲轴心国的塞拉诺·苏涅尔免职，以卡洛斯派巴雷拉（名单#9）的辞职为对称安排。此后被彻底边缘化，余生远离政治，以律师身份执业直至高龄。"
 SPA_manuel_hedilla_desc:0 "1902年8月4日生于坎塔布里亚凯维达，1970年卒于马德里。长枪党临时领袖。木匠和汽车修理工出身，1930年代加入长枪党，在桑坦德和坎塔布里亚地区组织活动。长枪党创始人何塞·安东尼奥1936年3月被捕后，埃迪拉在长枪党内部权力斗争中逐步崛起。11月20日何塞·安东尼奥遇害后（消息被长期封锁），埃迪拉被推举为长枪党临时领导人，主张保持长枪党独立于军方的路线。1937年4月佛朗哥颁布统一令强行合并长枪党与卡洛斯派为国民运动时，埃迪拉试图抵制但失败，在萨拉曼卡被逮捕。最初被判处死刑，后改为长期监禁和流放。获释后在佛朗哥体制下过着被监控的生活，政治上完全被边缘化。1970年在马德里去世。"
 CBIO_SPA_manuel_hedilla_desc:0 "1902年8月4日生于坎塔布里亚凯维达，1970年卒于马德里。长枪党临时领袖。木匠和汽车修理工出身，1930年代加入长枪党，在桑坦德和坎塔布里亚地区组织活动。长枪党创始人何塞·安东尼奥1936年3月被捕后，埃迪拉在长枪党内部权力斗争中逐步崛起。11月20日何塞·安东尼奥遇害后（消息被长期封锁），埃迪拉被推举为长枪党临时领导人，主张保持长枪党独立于军方的路线。1937年4月佛朗哥颁布统一令强行合并长枪党与卡洛斯派为国民运动时，埃迪拉试图抵制但失败，在萨拉曼卡被逮捕。最初被判处死刑，后改为长期监禁和流放。获释后在佛朗哥体制下过着被监控的生活，政治上完全被边缘化。1970年在马德里去世。"
 SPA_mauricio_de_sivatte_desc:0 "全名毛里西奥·德·西瓦特·伊·德·博比亚，1901年生于巴塞罗那，1980年卒。加泰罗尼亚卡洛斯派（传统主义）强硬派领袖。出身贵族家庭，法学专业出身，1920年代起投身卡洛斯主义运动，成为加泰罗尼亚地区传统共融派的核心人物。内战期间支持国民阵营，但坚持卡洛斯派的独立路线。战后成为卡洛斯派中最坚定的反佛朗哥分子之一，反对任何与佛朗哥政权的合作或妥协。1950年代与法尔·孔戴（名单#6）同属非合作路线，但在具体策略上也有分歧。1960年代卡洛斯派王储卡洛斯·乌戈转向社会主义路线后，西瓦特代表正统传统主义立场坚决反对，导致卡洛斯派进一步碎片化。终身坚持天主教整合主义和传统君主制理想，拒绝民主转型，至死不渝。1980年去世。"
 CBIO_SPA_mauricio_de_sivatte_desc:0 "全名毛里西奥·德·西瓦特·伊·德·博比亚，1901年生于巴塞罗那，1980年卒。加泰罗尼亚卡洛斯派（传统主义）强硬派领袖。出身贵族家庭，法学专业出身，1920年代起投身卡洛斯主义运动，成为加泰罗尼亚地区传统共融派的核心人物。内战期间支持国民阵营，但坚持卡洛斯派的独立路线。战后成为卡洛斯派中最坚定的反佛朗哥分子之一，反对任何与佛朗哥政权的合作或妥协。1950年代与法尔·孔戴（名单#6）同属非合作路线，但在具体策略上也有分歧。1960年代卡洛斯派王储卡洛斯·乌戈转向社会主义路线后，西瓦特代表正统传统主义立场坚决反对，导致卡洛斯派进一步碎片化。终身坚持天主教整合主义和传统君主制理想，拒绝民主转型，至死不渝。1980年去世。"
 SPA_miguel_ponte_desc:0 "全名路易斯·米格尔·利米亚·庞特·伊·曼索·德·苏尼加，第八代博韦达·德·利米亚侯爵，1882年生于维多利亚-加斯特伊斯，1952年1月5日卒于梅诺卡马翁。贵族地主兼骑兵军官，1924年任骑兵上校。1931年共和国成立时以准将军衔主动申请退役。1932年参与桑胡尔霍政变未遂后逃往葡萄牙。1936年叛乱爆发后协助萨利凯特将军控制巴利亚多利德第七军区。作为在任最高军衔将领之一出任国防委员会成员，在该委员会存续期间（1936年7月24日至10月3日）担任国家元首职能的集体领导机构成员之一。9月21日佛朗哥被推举为总司令后，庞特继续在国民军中服役。战后任最高军事法院院长，1943年和1949年任佛朗哥科尔特斯议员。1950年退役。"
 CBIO_SPA_miguel_ponte_desc:0 "全名路易斯·米格尔·利米亚·庞特·伊·曼索·德·苏尼加，第八代博韦达·德·利米亚侯爵，1882年生于维多利亚-加斯特伊斯，1952年1月5日卒于梅诺卡马翁。贵族地主兼骑兵军官，1924年任骑兵上校。1931年共和国成立时以准将军衔主动申请退役。1932年参与桑胡尔霍政变未遂后逃往葡萄牙。1936年叛乱爆发后协助萨利凯特将军控制巴利亚多利德第七军区。作为在任最高军衔将领之一出任国防委员会成员，在该委员会存续期间（1936年7月24日至10月3日）担任国家元首职能的集体领导机构成员之一。9月21日佛朗哥被推举为总司令后，庞特继续在国民军中服役。战后任最高军事法院院长，1943年和1949年任佛朗哥科尔特斯议员。1950年退役。"
 SPR_joakin_egia_unzueta_desc:0 "全名华金·德·埃吉亚·伊·温苏埃塔，1903年生于毕尔巴鄂，1956年卒于利物浦。巴斯克商船船长，内战中巴斯克辅助海军缔造者。在波图加莱特航海学校学习，此后在巴斯克航运公司索塔·伊·阿斯纳尔服务11年。1933年成为毕尔巴鄂港口代理和海事副代表。1936年叛乱爆发后主动请缨投入比斯开防御委员会，10月巴斯克自治政府主席阿吉雷委任其创建巴斯克辅助海军。在毕尔巴鄂被陆上封锁、几乎没有空军支援的困境下，埃吉艾组织扫雷船队清除叛军海军在阿布拉湾布设的水雷，努力打破对毕尔巴鄂的海上封锁。英国战地记者乔治·斯蒂尔称其为\"埃吉艾上将\"。1937年8月桑坦德战役失败后撤往法国，协助接纳巴斯克难民。流亡期间先后服役于自由法国海军和英国皇家空军，以战斗飞行员身份参加二战。战后定居利物浦，1956年去世，终年约53岁。"
 CBIO_SPR_joakin_egia_unzueta_desc:0 "全名华金·德·埃吉亚·伊·温苏埃塔，1903年生于毕尔巴鄂，1956年卒于利物浦。巴斯克商船船长，内战中巴斯克辅助海军缔造者。在波图加莱特航海学校学习，此后在巴斯克航运公司索塔·伊·阿斯纳尔服务11年。1933年成为毕尔巴鄂港口代理和海事副代表。1936年叛乱爆发后主动请缨投入比斯开防御委员会，10月巴斯克自治政府主席阿吉雷委任其创建巴斯克辅助海军。在毕尔巴鄂被陆上封锁、几乎没有空军支援的困境下，埃吉艾组织扫雷船队清除叛军海军在阿布拉湾布设的水雷，努力打破对毕尔巴鄂的海上封锁。英国战地记者乔治·斯蒂尔称其为\"埃吉艾上将\"。1937年8月桑坦德战役失败后撤往法国，协助接纳巴斯克难民。流亡期间先后服役于自由法国海军和英国皇家空军，以战斗飞行员身份参加二战。战后定居利物浦，1956年去世，终年约53岁。"
 SPR_juan_negrin_desc:0 "全名胡安·内格林·洛佩斯，1892年2月3日生于拉斯帕尔马斯（加那利群岛），1956年11月12日卒于巴黎。生理学家和社会党政治家，西班牙共和国末任总理。在德国莱比锡大学取得医学博士学位，返回马德里大学任生理学教授，以出色的科研能力著称。1929年加入PSOE，属普列托温和派阵营。1936年内战爆发后在拉戈·卡巴雷罗政府中任财政大臣，负责将西班牙黄金储备运往莫斯科以换取苏联军事援助——此举至今争议巨大。1937年5月拉戈·卡巴雷罗辞职后，出任总理兼国防大臣。内格林主张\"抵抗就是胜利\"，寄望于将西班牙内战与即将到来的欧洲大战衔接，以获得民主国家介入。1938年4月共和区被切断为两半后仍坚持抵抗。1939年3月5日卡萨多政变推翻其政府，被迫飞往法国。流亡巴黎后继续以共和国总理名义从事流亡政治活动，直至1945年辞去流亡政府职务。1956年在巴黎去世，终年64岁。2009年遗骸迁回拉斯帕尔马斯。"
 CBIO_SPR_juan_negrin_desc:0 "全名胡安·内格林·洛佩斯，1892年2月3日生于拉斯帕尔马斯（加那利群岛），1956年11月12日卒于巴黎。生理学家和社会党政治家，西班牙共和国末任总理。在德国莱比锡大学取得医学博士学位，返回马德里大学任生理学教授，以出色的科研能力著称。1929年加入PSOE，属普列托温和派阵营。1936年内战爆发后在拉戈·卡巴雷罗政府中任财政大臣，负责将西班牙黄金储备运往莫斯科以换取苏联军事援助——此举至今争议巨大。1937年5月拉戈·卡巴雷罗辞职后，出任总理兼国防大臣。内格林主张\"抵抗就是胜利\"，寄望于将西班牙内战与即将到来的欧洲大战衔接，以获得民主国家介入。1938年4月共和区被切断为两半后仍坚持抵抗。1939年3月5日卡萨多政变推翻其政府，被迫飞往法国。流亡巴黎后继续以共和国总理名义从事流亡政治活动，直至1945年辞去流亡政府职务。1956年在巴黎去世，终年64岁。2009年遗骸迁回拉斯帕尔马斯。"
 SPR_juan_garcia_oliver_desc:0 "1901年1月20日生于加泰罗尼亚雷乌斯，1980年8月14日卒于墨西哥瓜达拉哈拉。无政府主义者，全国劳工联盟和伊比利亚无政府主义联盟核心领袖之一。服务员和工人出身，年轻时因参加无政府主义行动多次入狱。1930年代成为CNT-FAI中主张\"无政府主义体操\"（以暴力行动推动革命）的强硬派代表。1936年内战爆发后在巴塞罗那组织无政府主义民兵。1936年11月加入拉戈·卡巴雷罗政府出任司法大臣——一名无政府主义者进入政府担任部长级职务，在无政府主义运动史上堪称史无前例的矛盾，招致大量无政府主义者的批评。在任期间尝试改革刑事司法制度，设立人民法庭取代无序的革命审判。1937年5月巴塞罗那事件中试图调停CNT与共产党之间的冲突但未能成功。内战失败后流亡瑞典、法国、巴拿马，最终定居墨西哥，以经营洗衣店为生。1980年在瓜达拉哈拉去世，终年79岁。"
 CBIO_SPR_juan_garcia_oliver_desc:0 "1901年1月20日生于加泰罗尼亚雷乌斯，1980年8月14日卒于墨西哥瓜达拉哈拉。无政府主义者，全国劳工联盟和伊比利亚无政府主义联盟核心领袖之一。服务员和工人出身，年轻时因参加无政府主义行动多次入狱。1930年代成为CNT-FAI中主张\"无政府主义体操\"（以暴力行动推动革命）的强硬派代表。1936年内战爆发后在巴塞罗那组织无政府主义民兵。1936年11月加入拉戈·卡巴雷罗政府出任司法大臣——一名无政府主义者进入政府担任部长级职务，在无政府主义运动史上堪称史无前例的矛盾，招致大量无政府主义者的批评。在任期间尝试改革刑事司法制度，设立人民法庭取代无序的革命审判。1937年5月巴塞罗那事件中试图调停CNT与共产党之间的冲突但未能成功。内战失败后流亡瑞典、法国、巴拿马，最终定居墨西哥，以经营洗衣店为生。1980年在瓜达拉哈拉去世，终年79岁。"
 SPR_juan_andrade_desc:0 "全名胡安·安德拉多·罗德里格斯，1897年生于马德里，1981年卒于巴黎。记者、政治理论家，马克思主义统一工人党联合创始人之一。早年加入西班牙社会主义青年团，1920年代转向共产主义，曾参与创建西班牙共产党，后因反对斯大林路线被开除。1930年代与安德烈乌·宁共同创建左翼共产主义者联盟，1935年该组织与工农联盟合并组成POUM。内战期间在POUM机关报《战斗报》任编辑，从事政治宣传和理论工作。1937年6月POUM遭取缔后被捕入狱，在巴塞罗那模范监狱中与其他POUM领导人一同受审，后获释。1939年流亡法国，此后长期居住在巴黎，继续从事反法西斯和社会主义运动的写作，撰写多部关于西班牙工人运动和内战的历史著作。1981年在巴黎去世。"
 CBIO_SPR_juan_andrade_desc:0 "全名胡安·安德拉多·罗德里格斯，1897年生于马德里，1981年卒于巴黎。记者、政治理论家，马克思主义统一工人党联合创始人之一。早年加入西班牙社会主义青年团，1920年代转向共产主义，曾参与创建西班牙共产党，后因反对斯大林路线被开除。1930年代与安德烈乌·宁共同创建左翼共产主义者联盟，1935年该组织与工农联盟合并组成POUM。内战期间在POUM机关报《战斗报》任编辑，从事政治宣传和理论工作。1937年6月POUM遭取缔后被捕入狱，在巴塞罗那模范监狱中与其他POUM领导人一同受审，后获释。1939年流亡法国，此后长期居住在巴黎，继续从事反法西斯和社会主义运动的写作，撰写多部关于西班牙工人运动和内战的历史著作。1981年在巴黎去世。"
 SPA_juan_vigon_suero_diaz_desc:0 "全名胡安·比贡·苏罗迪亚斯，1880年5月20日生于阿斯图里亚斯孔加斯-德·蒂内奥，1955年3月28日卒于马德里。国民阵营将领，职业参谋军官。参谋学院毕业后长期从事参谋工作。内战中在莫拉的北方军团任参谋长，莫拉1937年6月坠机身亡后继续在北方战线担任高级指挥职务，参与攻占毕尔巴鄂和坎塔布里亚的北方战役。此后在阿拉贡和加泰罗尼亚战役中指挥军级部队。被认为是国民军中最优秀的参谋人才之一。战后在佛朗哥政权中历任陆军参谋长（1940年代）和空军大臣（1939—1957年），长期掌管西班牙空军建设。以高度专业化和相对温和的政治姿态著称。1955年在马德里去世，终年74岁。"
 CBIO_SPA_juan_vigon_suero_diaz_desc:0 "全名胡安·比贡·苏罗迪亚斯，1880年5月20日生于阿斯图里亚斯孔加斯-德·蒂内奥，1955年3月28日卒于马德里。国民阵营将领，职业参谋军官。参谋学院毕业后长期从事参谋工作。内战中在莫拉的北方军团任参谋长，莫拉1937年6月坠机身亡后继续在北方战线担任高级指挥职务，参与攻占毕尔巴鄂和坎塔布里亚的北方战役。此后在阿拉贡和加泰罗尼亚战役中指挥军级部队。被认为是国民军中最优秀的参谋人才之一。战后在佛朗哥政权中历任陆军参谋长（1940年代）和空军大臣（1939—1957年），长期掌管西班牙空军建设。以高度专业化和相对温和的政治姿态著称。1955年在马德里去世，终年74岁。"
 SPR_juan_lopez_sanchez_desc:0 "1900年生于穆尔西亚省布利亚斯，1972年卒于伦敦。无政府主义者，全国劳工联盟重要领袖。印刷工出身，年轻时加入CNT瓦伦西亚地区组织，成为该地区工运核心人物之一。属CNT温和派，主张工会主义和参与政治。1936年11月拉戈·卡巴雷罗政府改组时与加西亚·奥利弗等三位无政府主义者一同入阁，出任商务大臣——四名无政府主义部长之一，这在无政府运动史上前所未有。在任期间致力于维持战时经济运转和外贸秩序。1937年5月巴塞罗那事件后随内阁变动离任。内战失败后流亡法国，后移居英国。在伦敦继续参与CNT流亡组织活动。1972年在伦敦去世。"
 CBIO_SPR_juan_lopez_sanchez_desc:0 "1900年生于穆尔西亚省布利亚斯，1972年卒于伦敦。无政府主义者，全国劳工联盟重要领袖。印刷工出身，年轻时加入CNT瓦伦西亚地区组织，成为该地区工运核心人物之一。属CNT温和派，主张工会主义和参与政治。1936年11月拉戈·卡巴雷罗政府改组时与加西亚·奥利弗等三位无政府主义者一同入阁，出任商务大臣——四名无政府主义部长之一，这在无政府运动史上前所未有。在任期间致力于维持战时经济运转和外贸秩序。1937年5月巴塞罗那事件后随内阁变动离任。内战失败后流亡法国，后移居英国。在伦敦继续参与CNT流亡组织活动。1972年在伦敦去世。"
 SPA_fidel_davila_arrondo_desc:0 "全名菲德尔·德维拉·阿隆多，1878年5月17日生于坎塔布里亚桑托尼亚（一说1881年），1962年3月5日卒于马德里。国民阵营高级将领。职业军人，参加过摩洛哥里夫战争。内战爆发后加入叛乱，出任国防委员会成员。1937年6月莫拉坠机身亡后接替其出任北方军团司令，指挥完成对北方共和区（比斯开、桑坦德、阿斯图里亚斯）的征服。此后转任国民军总参谋长。1938年1月出任国防大臣——国民政府中最高军事行政长官之一。参与策划加泰罗尼亚攻势和内战最后阶段的全面推进。战后历任陆军大臣（1945年前），1949年晋升上将。1962年在马德里去世。"
 CBIO_SPA_fidel_davila_arrondo_desc:0 "全名菲德尔·德维拉·阿隆多，1878年5月17日生于坎塔布里亚桑托尼亚（一说1881年），1962年3月5日卒于马德里。国民阵营高级将领。职业军人，参加过摩洛哥里夫战争。内战爆发后加入叛乱，出任国防委员会成员。1937年6月莫拉坠机身亡后接替其出任北方军团司令，指挥完成对北方共和区（比斯开、桑坦德、阿斯图里亚斯）的征服。此后转任国民军总参谋长。1938年1月出任国防大臣——国民政府中最高军事行政长官之一。参与策划加泰罗尼亚攻势和内战最后阶段的全面推进。战后历任陆军大臣（1945年前），1949年晋升上将。1962年在马德里去世。"
 SPA_salvador_moreno_fernandez_desc:0 "1886年生于费罗尔（一说1887年），1966年卒于马德里。国民阵营海军军官，弗朗西斯科·莫雷诺·费尔南德斯（名单#52）之弟。1936年7月在费罗尔参加叛乱，与其兄共同逮捕忠于共和国的上级阿扎罗拉少将（名单#43）——那位曾是其兄密友的海军大臣。内战中在国民派海军服役，参加地中海和大西洋的海上作战行动。战后出任佛朗哥政府海军大臣（1939—1945年），负责重建战后西班牙海军，推动新舰船建造计划。在任期间西班牙海军保持中立立场。1945年卸任海军大臣后继续在海军中任高级职务。1966年在马德里去世。佛朗哥曾称赞莫雷诺兄弟在费罗尔叛乱中的\"英勇表现\"，但对共和派而言，他们逮捕并致死昔日上级和密友的行为是叛乱中背信弃义的典型案例。"
 CBIO_SPA_salvador_moreno_fernandez_desc:0 "1886年生于费罗尔（一说1887年），1966年卒于马德里。国民阵营海军军官，弗朗西斯科·莫雷诺·费尔南德斯（名单#52）之弟。1936年7月在费罗尔参加叛乱，与其兄共同逮捕忠于共和国的上级阿扎罗拉少将（名单#43）——那位曾是其兄密友的海军大臣。内战中在国民派海军服役，参加地中海和大西洋的海上作战行动。战后出任佛朗哥政府海军大臣（1939—1945年），负责重建战后西班牙海军，推动新舰船建造计划。在任期间西班牙海军保持中立立场。1945年卸任海军大臣后继续在海军中任高级职务。1966年在马德里去世。佛朗哥曾称赞莫雷诺兄弟在费罗尔叛乱中的\"英勇表现\"，但对共和派而言，他们逮捕并致死昔日上级和密友的行为是叛乱中背信弃义的典型案例。"
 SPR_felipe_diaz_sandino_desc:0 "1891年9月25日生于巴塞罗那省卡尔德塔斯，1960年卒于哥伦比亚。共和航空军官和飞行先驱。1915年获得飞行员资格，后参加摩洛哥里夫战争，参与1925年阿尔胡塞马斯两栖登陆的空中掩护。1934年加泰罗尼亚独立事件期间拒绝奉命轰炸加泰罗尼亚政府宫殿，因此入狱。1935年成为反法西斯共和军人联盟创始人之一。1936年7月内战爆发时任第三航空队指挥官，与阿尔韦托·巴约协同将航空力量置于共和国与加泰罗尼亚自治政府麾下，对击溃巴塞罗那叛军贡献卓著。其后历任加泰罗尼亚军政府防御委员、共和空军加泰罗尼亚区指挥官，1937年7月赴巴黎任驻法武官兼海军副武官，在驻外期间向共和政府提供德意干涉情报。1939年1月至2月参与最后阶段的加泰罗尼亚航空力量疏散。战后流亡法国、多米尼加共和国、哥伦比亚、智利，在多个国家以多种职业维生，晚年在哥伦比亚因胃癌去世。著有回忆录《从阴谋到革命，1929—1937》。"
 CBIO_SPR_felipe_diaz_sandino_desc:0 "1891年9月25日生于巴塞罗那省卡尔德塔斯，1960年卒于哥伦比亚。共和航空军官和飞行先驱。1915年获得飞行员资格，后参加摩洛哥里夫战争，参与1925年阿尔胡塞马斯两栖登陆的空中掩护。1934年加泰罗尼亚独立事件期间拒绝奉命轰炸加泰罗尼亚政府宫殿，因此入狱。1935年成为反法西斯共和军人联盟创始人之一。1936年7月内战爆发时任第三航空队指挥官，与阿尔韦托·巴约协同将航空力量置于共和国与加泰罗尼亚自治政府麾下，对击溃巴塞罗那叛军贡献卓著。其后历任加泰罗尼亚军政府防御委员、共和空军加泰罗尼亚区指挥官，1937年7月赴巴黎任驻法武官兼海军副武官，在驻外期间向共和政府提供德意干涉情报。1939年1月至2月参与最后阶段的加泰罗尼亚航空力量疏散。战后流亡法国、多米尼加共和国、哥伦比亚、智利，在多个国家以多种职业维生，晚年在哥伦比亚因胃癌去世。著有回忆录《从阴谋到革命，1929—1937》。"
 SPR_federica_montseny_desc:0 "加泰罗尼亚语名弗雷德里卡·蒙特塞尼·伊·马涅，1905年2月12日生于马德里，1994年1月14日卒于图卢兹，享年88岁。西班牙无政府主义运动领袖、小说家和散文家。父母均为著名无政府主义作家，父为\"费德里科·乌拉莱斯\"、母为\"索莱达·古斯塔沃\"，共同主编无政府主义刊物《白色杂志》。在家中由父母教育长大，1920年代起为CNT和FAI撰写文章和讲演，凭出色的演说才能在工人中享有广泛声誉，1923年起至1936年间发表逾600篇文章，另出版约五十部以工人阶级女性为对象的社会浪漫题材小说。1927年加入伊比利亚无政府主义联盟。1936年11月拉戈·卡巴雷罗改组政府时，CNT以实现政治影响力的考量推荐其出任卫生与社会救助大臣，成为西班牙历史上首位女性内阁部长，亦为西欧最早的女性内阁部长之一（仅晚于丹麦的尼娜·邦和芬兰的米纳·西兰帕）。在任期间推动扩建战时医疗设施、设立孤儿院和难民援助项目，1936年12月25日颁布全国首个合法化堕胎的法令，该法令在西班牙直至1985年方才再次实现。1937年5月巴塞罗那事件后奉命广播呼吁民兵放下武器，但未能成功阻止镇压。内战失败后逃往法国，1942年被维希政府拘押，因国际压力免遭引渡回西班牙，1944年获释后定居图卢兹，主导CNT流亡组织重建并出版无政府主义报纸。1977年返回西班牙参与CNT重建工作，晚年在图卢兹去世。"
