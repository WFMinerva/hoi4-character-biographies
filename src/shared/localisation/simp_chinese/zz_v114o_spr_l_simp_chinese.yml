 SPR_indalecio_prieto_desc:0 "全名因达列西奥·普列托·图洛，1883年4月30日生于奥维耶多，1962年2月11日卒于墨西哥城。西班牙工人社会党核心领导人，党内温和右翼代表。幼年丧父后随母迁居毕尔巴鄂，家贫辍学，少年时即在报社当学徒，凭自学成为出色的新闻记者和演说家。1899年加入PSOE，1918年当选众议员，此后长期代表毕尔巴鄂选区。第二共和国成立后先后出任财政大臣（1931年）和公共工程大臣（1931—1933年）。1936年内战爆发后在拉戈·卡巴雷罗政府中任海军与空军大臣，1937年5月内格林组阁后升任国防大臣，负责共和军全面军事改组。与共产党关系日益紧张，反对苏联对共和政府的过度干预。1938年4月国民军切断共和区为南北两部后辞去国防大臣职务。内战失败后流亡墨西哥，成为PSOE流亡领导层的核心人物，主导反佛朗哥流亡政治活动长达二十余年。晚年健康恶化，1962年在墨西哥城去世，终年78岁。"
