 SPR_miguel_buiza_fernandez_palacios_desc:0 "1898年1月25日生于塞维利亚，1963年6月23日因肺癌卒于马赛。出身工厂主家庭，1915年入圣费尔南多海军学院，1932年升少校。内战爆发时任军用拖船\"独眼巨人号\"舰长，拒绝参加叛乱，效忠共和国。1936年8月率轻巡洋舰\"自由号\"参加直布罗陀海峡封锁和马略卡岛登陆战。9月2日被海军与空军大臣普列托任命为共和舰队总司令，时年仅38岁——因大批高级海军军官叛变投敌，普列托不得不越级提拔。其兄弗朗西斯科则加入叛军，在马德里前线阵亡——同胞兄弟分属敌对阵营。1937年9月谢尔谢尔角海战指挥失误后被解职，后获复职。1939年3月5日卡萨多政变当天卡塔赫纳遭轰炸，布伊萨决定率共和舰队残部——三艘巡洋舰、八艘驱逐舰和两艘潜艇——连夜驶离港口东奔。抵达奥兰后被拒入港，转往突尼斯比塞大，舰队被法国当局扣押，全体官兵被关入废弃磷矿集中营。布伊萨拒绝特殊待遇，要求与水手们同住。1939年5月加入法国外籍军团，以上尉军衔服役，二战中升至少校。战后曾指挥一艘船只运送犹太大屠杀幸存者前往巴勒斯坦，被英国当局逮捕并短暂拘押于海法。晚年移居马赛，1963年去世，葬于耶尔，终身未能返回故乡塞维利亚。"
 CBIO_SPR_miguel_buiza_fernandez_palacios_desc:0 "1898年1月25日生于塞维利亚，1963年6月23日因肺癌卒于马赛。出身工厂主家庭，1915年入圣费尔南多海军学院，1932年升少校。内战爆发时任军用拖船\"独眼巨人号\"舰长，拒绝参加叛乱，效忠共和国。1936年8月率轻巡洋舰\"自由号\"参加直布罗陀海峡封锁和马略卡岛登陆战。9月2日被海军与空军大臣普列托任命为共和舰队总司令，时年仅38岁——因大批高级海军军官叛变投敌，普列托不得不越级提拔。其兄弗朗西斯科则加入叛军，在马德里前线阵亡——同胞兄弟分属敌对阵营。1937年9月谢尔谢尔角海战指挥失误后被解职，后获复职。1939年3月5日卡萨多政变当天卡塔赫纳遭轰炸，布伊萨决定率共和舰队残部——三艘巡洋舰、八艘驱逐舰和两艘潜艇——连夜驶离港口东奔。抵达奥兰后被拒入港，转往突尼斯比塞大，舰队被法国当局扣押，全体官兵被关入废弃磷矿集中营。布伊萨拒绝特殊待遇，要求与水手们同住。1939年5月加入法国外籍军团，以上尉军衔服役，二战中升至少校。战后曾指挥一艘船只运送犹太大屠杀幸存者前往巴勒斯坦，被英国当局逮捕并短暂拘押于海法。晚年移居马赛，1963年去世，葬于耶尔，终身未能返回故乡塞维利亚。"
 SPA_luis_carrero_blanco_desc:0 "1904年3月4日生于桑坦德尔省桑托尼亚，1973年12月20日在马德里遭巴斯克分离组织\"埃塔\"汽车炸弹暗杀身亡，终年69岁。1918年入海军学院，毕业后长期从事海军潜艇和参谋工作。内战爆发时效忠共和政府但设法脱逃至国民区，此后在佛朗哥海军中服役。1940年代起成为佛朗哥最信赖的政治副手，1951年任国务副长官，1967年任副总统，1973年6月8日出任首相——佛朗哥自1939年以来首次将政府首脑职务分离授人，被视为佛朗哥安排的政治继承人。以保守天主教徒、坚定反共立场和对佛朗哥的绝对忠诚著称，主张维持独裁体制，抵制一切自由化改革。1973年12月20日清晨，\"埃塔\"突击队在马德里克劳迪奥·科埃略街教堂附近引爆埋设在地下隧道中的炸弹，其座车被炸飞越过五层楼高，卡雷罗·布兰科当场死亡。此次暗杀是佛朗哥政权晚期最具冲击力的事件，客观上加速了西班牙民主转型进程。"
 CBIO_SPA_luis_carrero_blanco_desc:0 "1904年3月4日生于桑坦德尔省桑托尼亚，1973年12月20日在马德里遭巴斯克分离组织\"埃塔\"汽车炸弹暗杀身亡，终年69岁。1918年入海军学院，毕业后长期从事海军潜艇和参谋工作。内战爆发时效忠共和政府但设法脱逃至国民区，此后在佛朗哥海军中服役。1940年代起成为佛朗哥最信赖的政治副手，1951年任国务副长官，1967年任副总统，1973年6月8日出任首相——佛朗哥自1939年以来首次将政府首脑职务分离授人，被视为佛朗哥安排的政治继承人。以保守天主教徒、坚定反共立场和对佛朗哥的绝对忠诚著称，主张维持独裁体制，抵制一切自由化改革。1973年12月20日清晨，\"埃塔\"突击队在马德里克劳迪奥·科埃略街教堂附近引爆埋设在地下隧道中的炸弹，其座车被炸飞越过五层楼高，卡雷罗·布兰科当场死亡。此次暗杀是佛朗哥政权晚期最具冲击力的事件，客观上加速了西班牙民主转型进程。"
 SPR_alexander_orlov_desc:0 "本名列夫·拉扎列维奇·费尔德宾，1895年8月21日生于俄罗斯帝国白俄罗斯博布鲁伊斯克，1973年4月15日卒于美国克利夫兰。苏联内务人民委员部高级情报官员。1920年代起从事苏联情报工作，精通多门语言。1936年9月被派往西班牙任NKVD驻西站长，负责苏联在共和区的秘密行动，包括监控国际纵队中的\"不可靠分子\"、组织反托洛茨基主义行动、以及将西班牙共和国黄金储备秘密运往莫斯科。与POUM领袖安德烈乌·宁1937年6月被绑架杀害事件密切相关。1938年7月，得知斯大林下令召回（意味着清洗），奥尔洛夫携妻女从巴塞罗那潜逃至法国，后辗转加拿大抵达美国。致信斯大林和叶若夫，威胁若遭追杀将公开苏联间谍网络，由此保全性命。在美国隐匿生活至1953年斯大林去世后才公开露面，撰写《斯大林罪行秘史》一书，成为冷战时期重要的反苏文献。"
 CBIO_SPR_alexander_orlov_desc:0 "本名列夫·拉扎列维奇·费尔德宾，1895年8月21日生于俄罗斯帝国白俄罗斯博布鲁伊斯克，1973年4月15日卒于美国克利夫兰。苏联内务人民委员部高级情报官员。1920年代起从事苏联情报工作，精通多门语言。1936年9月被派往西班牙任NKVD驻西站长，负责苏联在共和区的秘密行动，包括监控国际纵队中的\"不可靠分子\"、组织反托洛茨基主义行动、以及将西班牙共和国黄金储备秘密运往莫斯科。与POUM领袖安德烈乌·宁1937年6月被绑架杀害事件密切相关。1938年7月，得知斯大林下令召回（意味着清洗），奥尔洛夫携妻女从巴塞罗那潜逃至法国，后辗转加拿大抵达美国。致信斯大林和叶若夫，威胁若遭追杀将公开苏联间谍网络，由此保全性命。在美国隐匿生活至1953年斯大林去世后才公开露面，撰写《斯大林罪行秘史》一书，成为冷战时期重要的反苏文献。"
 SPR_ignacio_hidalgo_de_cisneros_desc:0 "1894年生于维多利亚（巴斯克地区），1966年11月1日卒于布加勒斯特。出身贵族军官家庭，早年在摩洛哥服役，政治立场从保守派逐步左转，共和国成立后加入社会党继而转入共产党。1936年内战爆发时任航空军事参谋，选择效忠共和国，被任命为共和空军总司令——整个内战期间共和方航空力量的最高指挥官。面临国民军拥有德国秃鹰军团和意大利航空军团支援的巨大劣势，依靠苏联提供的战斗机和飞行员勉力维持空战能力。其妻康斯坦西娅·德·拉·莫拉（佛朗哥妻子卡门·波洛的表妹）同为共和派活跃人物，战时负责外国记者新闻工作。内战失败后流亡苏联，后移居罗马尼亚。撰写回忆录《改变航向》，详述个人从贵族军官转向共和与共产主义的历程。1966年在布加勒斯特去世。"
