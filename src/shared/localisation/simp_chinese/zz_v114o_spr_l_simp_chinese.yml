 SPR_mohamed_meziane_desc:0 "全名穆罕默德·本·米兹安，1897年2月1日生于西属摩洛哥贝尼安萨尔，1975年5月1日卒。里夫柏柏尔部落酋长之子，1913年在国王阿方索十三世资助下入托莱多步兵学院。毕业后长期在西属摩洛哥\"雷古拉雷斯\"（土著正规军）服役，参加1921年里夫战争，据称1924年曾救佛朗哥一命，两人结下私交。1936年7月17日在梅利利亚率\"雷古拉雷斯\"第二大队率先响应叛乱，发动了内战第一战——攻击阿塔拉永水上飞机基地。其后率部渡海进入半岛，作为国民军先锋突击部队参加多场战役。其部队以作战凶猛著称，在纳瓦尔卡内罗战斗和托莱多陷落后发生严重暴行事件。1938年升上校，参加埃布罗河战役突破和加泰罗尼亚攻势。战后历任休达总司令（1950年）、加利西亚第八军区上将司令（1953年）、加那利群岛总督（1955年）。1956年摩洛哥独立后应穆罕默德五世之召回国，主持组建摩洛哥皇家陆军。1968至1971年任摩洛哥国防大臣（继任者为乌夫基尔）。1970年获授摩洛哥元帅衔——该国唯一获此军衔者。"
 CBIO_SPR_mohamed_meziane_desc:0 "全名穆罕默德·本·米兹安，1897年2月1日生于西属摩洛哥贝尼安萨尔，1975年5月1日卒。里夫柏柏尔部落酋长之子，1913年在国王阿方索十三世资助下入托莱多步兵学院。毕业后长期在西属摩洛哥\"雷古拉雷斯\"（土著正规军）服役，参加1921年里夫战争，据称1924年曾救佛朗哥一命，两人结下私交。1936年7月17日在梅利利亚率\"雷古拉雷斯\"第二大队率先响应叛乱，发动了内战第一战——攻击阿塔拉永水上飞机基地。其后率部渡海进入半岛，作为国民军先锋突击部队参加多场战役。其部队以作战凶猛著称，在纳瓦尔卡内罗战斗和托莱多陷落后发生严重暴行事件。1938年升上校，参加埃布罗河战役突破和加泰罗尼亚攻势。战后历任休达总司令（1950年）、加利西亚第八军区上将司令（1953年）、加那利群岛总督（1955年）。1956年摩洛哥独立后应穆罕默德五世之召回国，主持组建摩洛哥皇家陆军。1968至1971年任摩洛哥国防大臣（继任者为乌夫基尔）。1970年获授摩洛哥元帅衔——该国唯一获此军衔者。"
 SPA_miguel_cabanellas_desc:0 "1872年1月1日生于卡塔赫纳，1938年5月14日卒于法国比亚里茨（一说阿利坎特）。出身军人世家，早年参加古巴独立战争（效忠西班牙方），后在摩洛哥服役。政治立场偏共和主义和共济会，曾因参与桑胡尔霍政变（1932年）被短暂监禁后获释。1936年7月叛乱爆发时为萨拉戈萨第五军区司令，以在任最高军衔将领身份出任国防委员会主席——国民阵营成立的第一个统治机构。然而其共和派和共济会背景使其在佛朗哥阵营中处境尴尬。9月21日将领会议上据称唯一对授予佛朗哥全权投反对票。佛朗哥掌权后即被边缘化，国防委员会于10月1日解散。此后被送往法国\"养病\"，实为体面流放。1938年在法国去世，终年66岁。"
