 CBIO_SPA_miguel_cabanellas_desc:0 "1872年1月1日生于卡塔赫纳，1938年5月14日卒于法国比亚里茨（一说阿利坎特）。出身军人世家，早年参加古巴独立战争（效忠西班牙方），后在摩洛哥服役。政治立场偏共和主义和共济会，曾因参与桑胡尔霍政变（1932年）被短暂监禁后获释。1936年7月叛乱爆发时为萨拉戈萨第五军区司令，以在任最高军衔将领身份出任国防委员会主席——国民阵营成立的第一个统治机构。然而其共和派和共济会背景使其在佛朗哥阵营中处境尴尬。9月21日将领会议上据称唯一对授予佛朗哥全权投反对票。佛朗哥掌权后即被边缘化，国防委员会于10月1日解散。此后被送往法国\"养病\"，实为体面流放。1938年在法国去世，终年66岁。"
 SPR_juan_modesto_desc:0 "本名胡安·吉利奥托·莱昂，1906年生于安达卢西亚赫雷斯-德拉弗龙特拉附近的埃尔普韦托-德圣玛丽亚，1969年卒于捷克斯洛伐克布拉格。出身工人家庭，年轻时加入西班牙共产党，曾赴苏联伏龙芝军事学院接受训练。内战爆发后从基层民兵指挥员迅速晋升，以化名\"胡安·莫德斯托\"闻名。先后指挥旅、师和军级单位，1938年出任埃布罗河集团军司令，指挥共和军最后一次大规模攻势——7月25日横渡埃布罗河的行动，初期取得战术突破但最终在国民军反攻下损失惨重。1939年3月2日晋升将军，为内战末期与科登·加西亚同批晋升者。内战失败后流亡苏联，据报在二战中以苏联红军军官身份参战。战后定居捷克斯洛伐克，参与西共流亡组织活动，1969年在布拉格去世，终年约63岁。"
 CBIO_SPR_juan_modesto_desc:0 "本名胡安·吉利奥托·莱昂，1906年生于安达卢西亚赫雷斯-德拉弗龙特拉附近的埃尔普韦托-德圣玛丽亚，1969年卒于捷克斯洛伐克布拉格。出身工人家庭，年轻时加入西班牙共产党，曾赴苏联伏龙芝军事学院接受训练。内战爆发后从基层民兵指挥员迅速晋升，以化名\"胡安·莫德斯托\"闻名。先后指挥旅、师和军级单位，1938年出任埃布罗河集团军司令，指挥共和军最后一次大规模攻势——7月25日横渡埃布罗河的行动，初期取得战术突破但最终在国民军反攻下损失惨重。1939年3月2日晋升将军，为内战末期与科登·加西亚同批晋升者。内战失败后流亡苏联，据报在二战中以苏联红军军官身份参战。战后定居捷克斯洛伐克，参与西共流亡组织活动，1969年在布拉格去世，终年约63岁。"
 SPA_juan_yague_desc:0 "1891年11月9日（一说19日）生于索里亚省圣莱昂纳多，1952年10月21日卒（一说29日）。医生之子，入托莱多步兵学院时与佛朗哥同期，毕业后同赴非洲，在摩洛哥里夫战场多次负伤并屡获勋章。1932年晋升中校。1934年与佛朗哥、洛佩斯·奥乔亚合力以摩洛哥雷古拉雷斯和外籍军团镇压阿斯图里亚斯工人起义。长枪党早期坚定支持者，与何塞·安东尼奥私交甚笃。1936年叛乱中受莫拉委托负责摩洛哥方面阴谋，其部队率先在休达起事后渡过直布罗陀海峡与凯波·德·利亚诺在塞维利亚会师。8月14日率三千余人强攻巴达霍斯，激烈巷战后攻克该城，随即下令将大批战俘和平民押至斗牛场集体处决，因此获得\"巴达霍斯屠夫\"之恶名。美国记者惠特克质问时，雅古埃答称\"当然得枪毙他们\"，声言不可能带着四千名俘虏继续进军。此后沿塔霍河谷向马德里推进，攻克特鲁希略、纳瓦尔莫拉尔·德拉马塔和塔拉韦拉·德拉雷纳。后转战阿拉贡前线，参加贝尔奇特、卡斯佩、莱里达和埃布罗河等战役。1939年战后任空军大臣，1942年升中将。佛朗哥追赠\"圣莱昂纳多·德·雅古埃侯爵\"封号，其出生地村庄亦被更名为\"圣莱昂纳多·德·雅古埃\"。"
