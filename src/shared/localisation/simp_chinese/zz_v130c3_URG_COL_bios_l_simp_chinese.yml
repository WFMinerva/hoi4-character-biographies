l_simp_chinese:
 CBIO_URG_arnulf_fuhrmann_desc:0 "阿努尔夫·富尔曼是旅居乌拉圭的德裔记者与纳粹活动分子，笔名阿斯穆埃尔·富什曼。他在第一次世界大战末期由德国迁居乌拉圭，落脚北部城市萨尔托。1937年2月，他受聘为当地报纸拉坎帕尼亚的行政主管，同年3月升任社长，并在萨尔托创办乌拉圭德意志文化中心，出任主席。同年7月离开报社后，他娶了照相馆福托克拉韦原主人容布卢特的遗孀，借这家照相馆散布反犹与纳粹宣传。他是萨尔托纳粹支部的负责人，直接向鲁道夫·赫斯负责，绰号小元首。1930年代末至1940年间，他与五名同谋策划了史称富尔曼计划的图谋，企图推翻乌拉圭政府、清除犹太人，把国家变为德意志农民殖民地，并得到德国驻蒙得维的亚代表朗曼的支持。1940年6月，警方搜查其住所与照相馆，将他与同谋一并逮捕，缴获数挺轻机枪，并在其笔记中发现政变方案，他辩称那只是玩笑。获释后他在试图越境进入阿根廷时被当地当局再次逮捕，于布宜诺斯艾利斯受审，被判十三年监禁，1946年获释。"
 CBIO_URG_horacio_arredondo_desc:0 "霍拉西奥·阿雷东多·德·纳瓦斯1888年4月23日生于蒙得维的亚，父亲曾任国家财政总长，母亲在他七岁时早逝。他是自学成才的历史学家、作家与林业爱好者，1910年前后骑马遍游乌拉圭各省，博览群书，转而钻研历史、考古与本地动植物。1917年他游历罗查省，为古老的圣特雷莎要塞所震撼，立志考订其历史、修复要塞并以植树固定沙丘。1920年，总统布鲁姆委派他主持修复，与建筑师卡普罗及军事建筑负责人坎波斯上校同任，1923年动工。此后他长期投身文物保护，1925年任蒙得维的亚市立历史博物馆名誉馆长，1931年起常驻圣特雷莎公园，并于约1937年至1954年任国家旅游委员会主任，主持修复圣米格尔要塞、塞罗要塞、卡比尔多、奥里韦海关等古迹，创建圣特雷莎国家公园。他著述丰富，涉及乌拉圭文明史、蒙得维的亚要塞、图像志等。1967年4月1日去世，遗体安葬于圣特雷莎公园中央。"
 CBIO_URG_emilio_frugoni_desc:0 "埃米利奥·弗鲁戈尼·克伊罗洛1880年3月30日生于蒙得维的亚，律师、诗人、散文家、记者，也是共和国大学法学院院长。1904年内战中他曾站在巴特列一方作战，官至中尉，此后弃绝传统党派的武斗，转向社会主义。1910年他创建乌拉圭社会党并任首任总书记，成为乌拉圭历史上第一位社会党籍议员。1921年党代表大会决定加入共产国际、改组为共产党，弗鲁戈尼拒绝接受二十一条件，辞去议席并重建社会党。特拉独裁期间他被囚于布兰登格斯兵营，随后被逐往布宜诺斯艾利斯。1934年他重新当选议员，在议会内抗争。1942年他获阿梅萨加政府任命为乌拉圭驻苏联特命全权公使，1944年至1946年常驻莫斯科，归国后写成一部批评苏联体制的著作，始终自称马克思主义者而非列宁主义者。他一生诗文颇丰，1963年因党内分歧离开社会党，另组社会主义运动。1969年8月28日在蒙得维的亚去世。"
 CBIO_URG_adolfo_agorio_desc:0 "阿道弗·阿戈里奥·埃切韦里1888年9月15日生于蒙得维的亚，出身巴斯克后裔家庭，是散文家、戏剧评论家、大学教授与记者，笔名雅各布。早年他持自由主义立场，1914年进入巴特列派报纸埃尔迪亚，第一次世界大战期间撰文支持协约国与民主理念，凭借拉弗拉瓜等早期作品赢得声誉，法国政府因其战时支持授予其感恩勋章。此后他转向威权主义，成为乌拉圭法西斯主义的主要知识分子之一，创立乌拉圭修正主义行动，主办一份宣扬社团主义经济的杂志，该组织与巴西整体主义行动关系密切并吸收纳粹元素。他在报纸拉马尼亚上的文章赞颂纳粹德国的秩序、纪律与民族主义。1965年在蒙得维的亚去世。"
 CBIO_URG_augustus_caesar_bado_desc:0 "巴多是特拉政府时期的乌拉圭政治人物，属科罗拉多党，姓名更准确的写法为奥古斯托·塞萨尔·巴多。他在特拉1933年政变后的政府中出任工业部长，代表当局阐述温和的经济干预主张，认为国家干预应引导私人经济沿最有利的方向发展，而非取而代之。1936年他的二十二篇演说结集出版。此后他活跃于工商界，出任多家公司董事。"
 CBIO_URG_jose_espalter_desc:0 "何塞·埃斯帕尔特1868年10月19日生于蒙得维的亚，律师、教授与政治家，属科罗拉多党。他1892年取得法学与法理学学位，曾任检察官与法官，1930年至1931年出任共和国大学校长。作为科罗拉多党人，他历任众议员、参议员，先后担任内政部长与外交部长，并任参议院议长与共和国银行董事。特拉1933年发动政变、中止宪法保障后，他加入特拉组建的国务委员会，并成为1934年特拉召集的制宪会议成员。担任农业与开发部长期间，他在里奥内格罗省俄裔移民聚居地圣哈维尔的建立中发挥了重要作用。1940年8月30日在蒙得维的亚去世。"
 CBIO_URG_cesar_charlone_desc:0 "塞萨尔·查隆·罗德里格斯1895年10月5日生于蒙得维的亚，律师、政治家，属科罗拉多党内的三月派。1918年他年仅二十三岁便出任内政部情报处处长，效力于时任部长特拉。1933年特拉政变后，他主持公共服务退休金库的整顿，是三月派的核心人物之一，1935年至1938年任财政部长。1938年他与巴尔多米尔搭档，组成乌拉圭史上得票最高的竞选组合，出任第二副总统兼参议院议长，1942年巴尔多米尔政变后被免职。他以理财手腕著称，因增发货币的操作被戏称为巫手。此后他于1949年至1950年任外交部长，1967年起在赫斯蒂多与帕切科政府中再度出任财政部长，主导1968年的冻结物价与工资计划，1971年因银行倒闭丑闻辞职。1973年5月8日在蒙得维的亚去世。"
 CBIO_URG_eduardo_victor_haedo_desc:0 "爱德华多·维克多·海多1901年7月28日生于梅塞德斯，记者、画家与政治家，属民族党赫雷拉派。他出身贫寒，为一名裁缝的私生子，年轻时投身新闻业，后又任文学与国史教师。他曾任索里亚诺省众议员，六度出任参议员，并担任公共教育部长，任内提出在共和国大学设立人文学院、创建国家剧团等方案。他多年追随赫雷拉参加艰苦的政治斗争，直至1958年民族党胜选；1953年他一度加入费尔南德斯·克雷斯波的民众民族主义运动，数年后又回归正统赫雷拉派。1961年3月1日至1962年3月1日，他出任全国政府委员会主席。他以雄辩的街头演说和炽热的民族主义著称，也是伊比利亚美洲艺术的赞助人。1957年，一个议会委员会曾在华盛顿调查其与纳粹政权的所谓关联，未获确凿结论。1970年11月15日在蒙得维的亚去世。"
 CBIO_URG_martin_recaredo_echegoyen_desc:0 "马丁·雷卡雷多·埃切戈延1891年4月3日生于蒙得维的亚，法学家、政治家，属民族党赫雷拉派。他早年当过小学教师和中学西班牙语教师，1922年取得律师资格，曾任法学院宪法学兼职教授，并领导民族党执行局近三十年。1916年他从民族党青年委员会起步，后任选举法院秘书，特拉政变后加入制宪会议，1934年当选参议员，1935年至1936年任公共教育与社会保障部长、1936年至1938年任公共工程部长。1946年和1950年他两度为民族党副总统候选人。他两次进入全国政府委员会，1959年3月1日至1960年3月1日出任委员会主席，成为九十三年来首位领导该机构的白党人，同时执掌赫雷拉派。其后他任参议院议长，1966年角逐总统。晚年他出任1973年军政府设立的国务委员会主席，直至1974年5月18日在蒙得维的亚去世。"
 CBIO_URG_zoilo_saldias_desc:0 "佐伊洛·萨尔迪亚斯生于萨尔托，律师、政治人物。1935年至1938年，他在特拉政权下出任工业与劳工部长，这一部门是特拉1936年内阁改组时由旧的工业、劳工与公共教育部拆分而来。任内他与总统特拉、财政部长查隆联署了大批经济法令，涉及蒙得维的亚港装卸作业的用工规章、造船厂与船坞的税收优惠等，是特拉政府推行进口替代工业化的执行者之一。1938年初，最高法院法官布拉斯·比达尔与马里亚诺·佩雷拉·努涅斯相继在任上去世，一月之内空出两席，萨尔迪亚斯与罗曼·阿尔瓦雷斯·科尔特斯获选填补，由行政部门要员转入司法系统。他在最高法院任职四年，1942年4月前不久在任上去世。他留下的空缺与同期因年满七十岁退休的海梅·西比尔斯·拉拉维德的席位，由巴尔多米尔政变后设立的国务委员会以法令形式指定胡安·米内利与何塞·纳蒂诺接任，这一任命程序在乌拉圭最高法院史上绝无仅有。"
 CBIO_URG_juan_cesar_mussio_fournier_desc:0 "胡安·塞萨尔·穆西奥·富尼耶1890年2月7日生于蒙得维的亚一个知识分子家庭，父系为热那亚移民后裔，母亲二十三岁守寡后独自抚养他与弟弟长大。1917年他医科毕业，进入蒙得维的亚巴斯德医院任外科医生，1920年升任临床主任，同年起赴欧洲游学六年，遍访主要诊所。在巴黎，他与内克尔儿童医院院长于蒂内尔合作，发现了一例黏液水肿性偏瘫，五十年后被命名为于蒂内尔与穆西奥·富尼耶综合征。他由神经病学转向当时新兴的内分泌学，成为乌拉圭内分泌学的奠基人，1936年创建医学院内分泌研究所，该所后以他的名字命名，1937年又创办了世界上第一个专门收治内分泌疾病的中心。他1931年至1932年任公共教育部长，1930年代后期起长期执掌公共卫生部，任内确立了预防医学的地位，并两度邀请流亡法国的西班牙内分泌学权威格雷戈里奥·马拉尼翁访问乌拉圭。1950年他出版临床内分泌学论，马拉尼翁称之为内分泌学的一座丰碑，同年他获诺贝尔医学奖提名。1961年1月1日去世。"
 CBIO_URG_cesar_gutierrez_desc:0 "古特雷斯1892年生，全名的准确写法是塞萨尔·马约·古特雷斯，记者、政治家，属科罗拉多党巴特列派。1920年他以卡内洛内斯省候补众议员起步，1923年至1925年任正式众议员，1925年至1927年出任工业部长，1927年至1932年再度当选众议员，此后主持国家冷冻厂。1943年他当选巴特列派参议员，1947年连任并出任参议院议长，1946年至1947年兼任公共工程部长。他同时是写作者与诗人，用过笔名，作品被收入1945年编成的乌拉圭诗歌选集，其笔名亦见于1942年出版的乌拉圭笔名词典。蒙得维的亚有一条街道以他的名字命名。1951年去世。"
 CBIO_URG_domingo_mendivil_desc:0 "多明戈·门迪维尔1876年生，全名多明戈·门迪维尔·门迪拉尔苏，乌拉圭军人与政治人物。他在特拉执政期间两度出任战争与海军部长，即后来的国防部长，第一任在1933年，正值特拉发动三月政变、以独裁方式执政之际，第二任在1936年。1935年他受命指挥东部作战部队。其兄弟哈维尔·门迪维尔·门迪拉尔苏同样进入特拉政府任职，兄弟二人分掌军事与经济部门，哈维尔后于1943年至1945年出任工业与劳工部长。1959年去世。"
 CBIO_URG_andres_puyol_desc:0 "安德烈·普约尔1873年生于蒙得维的亚，全名的更准确写法是安德烈斯·费利佩·普约尔，乌拉圭儿科医生。1898年他在蒙得维的亚医学院取得博士学位，随即赴巴黎深造。1897年民族党起义期间，他在红十字会服务。归国后他在公共卫生系统与医学院担任要职并执掌多个讲席，获颁多项荣誉，其中包括国家卫生委员会奖章。他的著述集中于儿童保健与公共卫生，论题包括儿科医生在产科中应当扮演的角色、乌拉圭的儿童保护等。"
 CBIO_URG_alfredo_campos_desc:0 "阿尔弗雷多·坎波斯1880年2月18日生于蒙得维的亚，全名阿尔弗雷多·拉蒙·坎波斯，父母为拉蒙·坎波斯与欧拉利娅·坎波斯，是军人、建筑师、历史学家与作家。1895年入军校，1897年以少尉军衔毕业，1906年又在共和国大学数学系取得建筑师学位。1904年内战中他任机枪军官。他设计了大量公共建筑，包括塞里托炮兵营房、1924年立项的百年消防队营房和陆军总司令部大楼，主张以西班牙遗产为本的历史主义建筑语言，1920年蒙得维的亚泛美建筑师大会上力陈此说，终身不改。他与巴尔多米尔、历史学家阿雷东多共同促成了圣米格尔要塞的修复，还主持修复了拉瓦列哈将军故居。1936年10月5日他出任军校校长。1938年6月19日起两度执掌国防部，1940年2月提出义务兵役法案，未获通过；1942年他进入国务委员会。1943年他主导与美国的防务谈判，同年6月因防务工程遭赫雷拉派民族党指控，与外交部长塞拉托在议会接受长达十余小时的质询，最终获得支持。晚年著有《查科北部和平使命》、《二战期间乌拉圭领海的一段插曲》。1970年去世。"
 CBIO_URG_julio_roletti_desc:0 "胡里奥·罗莱提1882年4月24日生于蒙得维的亚，全名胡里奥·阿马德奥·罗莱提，乌拉圭将军，同时是执有文凭的农学家、军事地理学教授和历史与地理研究所的正式会员。1940年至1942年，他在巴尔多米尔政府中出任国防部长，任内正值乌拉圭外交明确倒向同盟国。1940年前后，美方就在埃斯特角地区租借一片土地九十九年、兴建海空军联合基地一事与乌拉圭接触，乌方开出的交换条件是三艘驱逐舰和十余架水上飞机，此事由巴尔多米尔、外交部长瓜尼与他经手。美国军舰频繁停靠蒙得维的亚与设立基地的传闻激怒了坚持中立的阿根廷，阿根廷海军一度以敌意的机动动作回应。乌拉圭参议院随后表决，二十六名到会者中二十五票通过决议，声明本院在任何情况下都不会批准任何在本国领土设立外国空军或海军基地的条约。蒙得维的亚有一条街道以他的名字命名。1959年去世。"
 CBIO_URG_gervasio_de_posadas_belgrano_desc:0 "杰尔瓦西奥·德·波萨达斯·贝尔格拉诺1902年3月15日生于蒙得维的亚，律师、政治家。他的父亲路易斯·德·波萨达斯·埃斯特维斯是阿根廷首任最高执政官杰尔瓦西奥·安东尼奥·德·波萨达斯的后裔，母亲卡门·贝尔格拉诺·索里利亚·德·圣马丁是诗人胡安·索里利亚·德·圣马丁的表亲，他因而也是曼努埃尔·贝尔格拉诺的后代，两支拉普拉塔河望族的血脉在他身上交汇。1926年他取得律师资格，不久与阿图罗·莱雷纳·阿塞韦多合办律师事务所，即今日的波萨达斯·波萨达斯与贝西诺事务所。1935年至1936年他任工业与劳工副部长，1939年至1941年在巴尔多米尔政府中升任该部部长，1941年至1942年任参议员。1953年他是民众民族主义运动的创始成员之一，次年参选全国政府委员会；1956年参与创建白色民主联盟。他长期活跃于农村联合会、商会与工业商会，先后出任银行、实验室、纺织厂和瓶装企业的董事长，也是乌拉圭最早的橄榄球运动员之一。晚年他专事商法的教学与研究，著述颇丰。1988年2月12日去世。"
 CBIO_COL_gustavo_rojas_pinilla_desc:0 "古斯塔沃·罗哈斯·皮尼利亚1900年3月12日生于博亚卡省通哈，父亲胡利奥·罗哈斯·希门尼斯，母亲埃尔门西亚·皮尼利亚·苏亚雷斯，家中共六个兄弟姐妹。他毕业后考入军事学校，1920年以少尉军衔毕业，1927年又赴美国印第安纳州三州学院深造，取得土木工程学位。归国后他参与多项公路建设工程。1949年至1950年，他在奥斯皮纳·佩雷斯政府中出任邮电部长。1952年底，代理总统罗伯托·乌尔达内塔·阿韦拉埃斯任命他为武装部队总司令，此前他已作为哥伦比亚出席泛美国防理事会的代表常驻华盛顿，并曾赴朝鲜视察哥伦比亚营的作战部队。1953年6月13日，在自由党与保守党长期内斗、暴力冲突蔓延全国的背景下，他发动不流血政变推翻了保守党总统劳雷亚诺·戈麦斯，就任总统，获得前总统奥斯皮纳·佩雷斯与乌尔达内塔等人的支持，被时任总统达里奥·埃昌迪亚称为\"民意政变\"。此前受戈麦斯召集的制宪国民大会随后通过法令追认其执政的合法性，1954年又批准延长其任期至1958年。他执政期间以实现和平、正义与自由为口号，试图平息暴力主义造成的社会撕裂，但1957年反对声浪达到顶点，他借国民大会将任期延长至1962年，最终在反对派联合抵制下于5月10日下台，由加夫列尔·帕里斯接任。1975年1月17日在托利马省梅尔加去世。"
 CBIO_COL_luis_acevedo_desc:0 "路易斯·阿塞韦多，全名路易斯·阿塞韦多·托雷斯，1890年12月26日生于波哥大，父亲同为军人路易斯·阿塞韦多，母亲特兰西托·托雷斯。他在布卡拉曼加求学，后于哥伦比亚国立大学攻读文学与法律。他曾投身亚马逊地区的军事殖民开拓工作。哥伦比亚—秘鲁战争期间，他出任河运舰队与航空编队指挥官，并曾在赫伯特·博伊少校驾驶的飞机上担任炮手参与作战。1934年他晋升为共和国将军，1939年从现役退休。他获颁哥伦比亚博亚卡勋章与安东尼奥·纳里尼奥奖章，以及秘鲁军事\"太阳\"勋章、委内瑞拉解放者半身像纪念章和智利功勋勋章。军校现设有以其名命名的\"路易斯·阿塞韦多·托雷斯将军班\"。1951年7月30日在波哥大去世。"
 CBIO_COL_gabriel_paris_gordillo_desc:0 "加夫列尔·帕里斯·戈迪略1910年3月8日生于托利马省伊瓦格，父亲阿尔韦托·帕里斯·蒙塔尔沃，母亲伊莎贝尔·戈迪略·迪亚斯。他在伊瓦格男子学校与圣西蒙学院求学，后入军校取得中学文凭，1929年12月11日以骑兵少尉军衔从军校毕业，分配至帕埃斯第一骑兵团。1933年他晋升中尉，以此军衔参加了哥伦比亚—秘鲁战争，转战巴拉亚—拉塔瓜一线。1936年他升任上尉，任军校骑术教官，随后在波哥大战争学院专攻参谋业务。1941年他晋升少校，此后出任波哥大桑坦德将军警官军校副校长。1946年他升任中校，赴美国深造，归国后获颁博亚卡勋章，并在战争学院任教。1953年2月28日他晋升准将并出任陆军司令，同年6月又受命以特命全权大使身份代表哥伦比亚出席联合国安理会裁军委员会。1954年2月9日他出任司法部长，同年8月7日转任战争部长，其间还曾短暂兼管外交部。1955年7月30日至8月2日，罗哈斯·皮尼利亚将军出访厄瓜多尔期间，他代理总统职务，同年2月29日晋升少将。1957年5月，面对罗哈斯·皮尼利亚在街头示威与总罢工压力下被迫下台的局面，他受命主持接替罗哈斯的军人执政委员会，成为事实上的国家元首，任内推行新闻自由、创设国家学徒培训局、偿还外债、启动瓦莱霍计划扶持出口多元化、召开中断九年的国会选举，并于1957年12月1日主持全民公投批准民族阵线协议，哥伦比亚妇女首次在这次公投中行使投票权。1958年8月7日他将政权移交阿尔韦托·耶拉斯·卡马戈，任内共和执政十四个月有余。他育有四名子女：加夫列尔、海梅、格洛丽亚与莉希亚。2008年3月21日，以九十八岁高龄在昆迪纳马卡省希拉多因呼吸系统疾病去世，是1957至1958年军政府成员中最后辞世的一位。"
 CBIO_COL_camilo_daza_alvarez_desc:0 "卡米洛·达萨·阿尔瓦雷斯1898年6月25日生于潘普洛纳，父亲安东尼奥·达萨，母亲埃莉萨·阿尔瓦雷斯。少年时被送往巴塞罗那附近的塔拉萨工业学校求学，由此接触并痴迷航空，得知一名飞行员飞越英吉利海峡的事迹后，不顾家人反对继续钻研并攒钱学习飞行。1919年他成为第一个驾驶飞机的哥伦比亚人，1920年3月获柯蒂斯公司颁发的飞行员与航空机械师文凭，1922年9月2日驾驶自己购置的名为\"桑坦德\"号的飞机飞越库库塔上空。他与合伙人在北桑坦德省创办了哥伦比亚首家航空公司北桑坦德航空公司。为组装从法国购得的一架库德龙飞机，他将其拆解装箱运至库拉索岛，原计划经停委内瑞拉马拉开波直飞库库塔，途中却因情报有误，委内瑞拉胡安·比森特·戈麦斯独裁政府误以为他企图轰炸委内瑞拉主要城市并协助推翻政权，将他逮捕、飞机没收；澄清误会后他被限令次日离境，飞机则在马拉开波湖畔风吹日晒一年后才得以取回并修复。瑞士籍的哥伦比亚航空学校校长亨利·皮利乔迪中尉闻其名，聘请达萨担任工程师，负责修复该校从法国购入却已闲置多年的器材。1927年3月15日，军校授予他少尉军衔，同月27日他以军事飞行员身份完成首飞。此后他在飞行生涯中历经三十余次事故，均奇迹般幸存，其中一次发生在他代表哥伦比亚驻塞维利亚世界博览会展馆担任飞行员期间。晚年他出任兰萨航空公司运营部主任，推动该公司开辟飞往古巴与委内瑞拉的国际航线，并倡议在波哥大、巴兰基亚、卡塔赫纳等地修建专属机场。政府后来授予他航空准将的荣誉军衔，数月后他在波哥大军事医院去世，时为1975年3月18日。库库塔的卡米洛·达萨国际机场即以他的名字命名。"
 CBIO_COL_german_olano_moreno_desc:0 "赫尔曼·奥拉诺·莫雷诺1903年生于安蒂奥基亚一个传统家族，在波士顿大学攻读经济学，学成后仅十七岁便回国打理家族生意。二十七岁时他被任命为哥伦比亚驻美国总领事，为1932年哥伦比亚与秘鲁冲突中的军备采购出力，促成购入当时最新式的战斗机，并参与了全部转运与调度事务。为了更直接地投身武装冲突，他辞去这一政治职位，进入美国彭萨科拉海军航空学校学习飞行，但尚未完成飞行员培训，战事已经结束。1934年年中他回国，先任空军基地督察，三个月后总统洛佩斯·普马雷霍任命他为航空总局局长。任内他从技术层面统筹飞行训练，推动卡利飞行学校发展，选定特雷斯埃斯基纳斯基地的位置，并下令在全国十余处修建跑道，将帕兰克罗基地扩充为南美同类基地中最现代化的一座，配备七十架飞机。1935年，他与挚友安德烈斯·M·迪亚斯在帕兰克罗表演特技飞行时发生事故，迪亚斯当场遇难，他本人于7月28日伤重去世。逝世后他被追授上尉军衔，并获颁博亚卡十字勋章，以表彰其在军政两界的贡献。今日的帕兰克罗空军基地即以他的名字命名。"
 CBIO_COL_ruben_piedrahita_arango_desc:0 "鲁文·彼德拉伊塔·阿朗戈，全名何塞·鲁文·彼德拉伊塔·阿朗戈，1908年6月19日生于安蒂奥基亚省亚鲁马尔，三岁时丧父。他在麦德林基督教兄弟会学校完成中学学业，后入麦德林矿业学院攻读土木与矿业工程，1932年11月毕业，同月入军校，1931年已取得步兵预备役少尉军衔。1933年4月24日他被征召现役，分配至皮钦查营。1936年他转入海军，赴英国接受海军专业深造，又在美国乔治·华盛顿大学修习企业管理。他历任\"安蒂奥基亚\"号副舰长兼舰长、\"巴兰基亚\"号河运基地司令、\"玻利瓦尔\"号海军基地司令、海军总局局长、驻华盛顿海军武官，并一路晋升至海军司令。1953年罗哈斯·皮尼利亚政府任命他执掌国土信贷院，1954年8月7日又转任公共工程部长，任内哥伦比亚基础设施建设加速推进，埃尔多拉多机场等工程均在此期间兴建。1957年5月10日，他作为海军代表加入接替罗哈斯·皮尼利亚的五人军政府，同僚包括陆军的加夫列尔·帕里斯·戈迪略等四人。1958年5月2日凌晨，一场企图恢复罗哈斯·皮尼利亚权力的未遂政变中，福雷罗·戈麦斯上校一度将其军政府同僚拘押送往卡尔达斯营，唯独身为海军中将的彼德拉伊塔躲过抓捕，在圣卡洛斯宫指挥了同僚的营救行动。他是玻利瓦尔学会成员，一生走访四十三个国家。晚年昆迪纳马卡省一座跨萨马纳河大桥以其名命名。1979年8月22日在波哥大去世。"
 CBIO_COL_m_e_rojas_de_moreno_desc:0 "玛丽亚·欧亨尼亚·罗哈斯·德·莫雷诺·迪亚斯1932年10月6日生于桑坦德省韦莱斯，是军人兼政治家古斯塔沃·罗哈斯·皮尼利亚与卡罗琳娜·科雷亚·隆多尼奥的独生女。她赴美国杜兰大学与华盛顿三一学院求学，归国后成为哥伦比亚国家警察史上首批女性军官之一，官至大尉，因而在政坛得绰号\"女大尉\"；她还是哥伦比亚第一位、世界第二位女性直升机飞行员，并三度夺得马术跳高冠军。1953年其父发动政变就任总统后，她投身社会事务，1954年推动国会通过第3号立法法令，赋予哥伦比亚妇女选举权与被选举权，是她从政生涯的重大成就之一。同年9月，其父创设国家社会救济秘书处，即SENDAS，交由她主持，专注于救助暴力冲突受害者及弱势群体，为其提供衣物、生活物资、工具与信贷，助其重返社会与劳动市场。1957年其父下台流亡后，她仍长期活跃于政坛，创办并主持《警报》周刊十年，主持广播节目《听玛丽亚·欧亨尼亚说》长达二十五年。1974年她代表其父创立的全国人民联盟参选总统，成为哥伦比亚政坛最具活力的女性人物之一，此后长期出任参议员。20世纪90年代末，她将本党与其他左翼力量合并，2003年参与创建民主选择极，直至晚年退出政坛前一直与该党保持关联。她还在图恩哈其父出生的故居创办并主持古斯塔沃·罗哈斯·皮尼利亚文化中心。"
