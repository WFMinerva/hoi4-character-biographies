  CBIO_CHL_juan_rosetti_desc:0 "胡安·包蒂斯塔·罗塞蒂·科隆比诺，1903年10月9日生于圣地亚哥，父母均为意大利移民后裔，1976年10月23日因帕金森并发症在圣地亚哥去世。律师兼左翼政治家，1928年以论文《关于和解》取得智利大学法学资格，早年兼任质押信贷局局长（1927–1931），并共同持有反对亚历山德里第二届政府的报纸《舆论报》，另独立持有“新世界”广播电台。1931年参与创建激进社会主义党并任领袖，1932年短暂出任达维拉政府劳工部长，任内创立物价管制总署——以他自己的话说，这是“埋葬自由主义国家”之举。此后先后加入社会主义联合党（1938年）与智利社会党（1942年）。到1936年前后，他已是圣地亚哥知名的左翼论辩家；1937年起连续三届当选圣地亚哥第七选区众议员（1937–1949），同期参与社会党学生运动。阿吉雷·塞尔达政府末期（1941–1942）出任外交与商务部长，以反法西斯立场出席里约热内卢美洲外长会议，抵制美国要求全面断绝对轴心国外交关系的压力、坚持智利中立路线而留名。其后历任冈萨雷斯·魏地拉政府司法部长与教育部长（1949–1950）、伊瓦涅斯第二届政府财政部长（1952–1953），并出任驻法大使（1953–1959）。与萨尔瓦多·阿连德同代的左翼阵营中，他被评为“最杰出的论战家之一”。"
  CHL_juan_rosetti_desc:0 "胡安·包蒂斯塔·罗塞蒂·科隆比诺，1903年10月9日生于圣地亚哥，父母均为意大利移民后裔，1976年10月23日因帕金森并发症在圣地亚哥去世。律师兼左翼政治家，1928年以论文《关于和解》取得智利大学法学资格，早年兼任质押信贷局局长（1927–1931），并共同持有反对亚历山德里第二届政府的报纸《舆论报》，另独立持有“新世界”广播电台。1931年参与创建激进社会主义党并任领袖，1932年短暂出任达维拉政府劳工部长，任内创立物价管制总署——以他自己的话说，这是“埋葬自由主义国家”之举。此后先后加入社会主义联合党（1938年）与智利社会党（1942年）。到1936年前后，他已是圣地亚哥知名的左翼论辩家；1937年起连续三届当选圣地亚哥第七选区众议员（1937–1949），同期参与社会党学生运动。阿吉雷·塞尔达政府末期（1941–1942）出任外交与商务部长，以反法西斯立场出席里约热内卢美洲外长会议，抵制美国要求全面断绝对轴心国外交关系的压力、坚持智利中立路线而留名。其后历任冈萨雷斯·魏地拉政府司法部长与教育部长（1949–1950）、伊瓦涅斯第二届政府财政部长（1952–1953），并出任驻法大使（1953–1959）。与萨尔瓦多·阿连德同代的左翼阵营中，他被评为“最杰出的论战家之一”。"
  CBIO_CHL_jaime_quintana_desc:0 "海梅·阿方索·金塔纳·布尔戈斯，1891年12月31日生于奇廉，1972年8月27日卒于圣地亚哥。律师、激进党政治家，通称“阿方索·金塔纳”，父亲圣地亚哥·金塔纳，母亲伊莎贝尔·布尔戈斯。就读奇廉大学预科中学及圣地亚哥国立中学，后入智利大学法学院，1918年6月11日宣誓就职律师，毕业论文为《证券交易业务》。早年在奇廉执业，活跃于当地激进党，历任奇廉市议员、市长及党内省议会主席，因此在伊瓦涅斯第一届政府期间（约1930年）遭流放至艾森。独裁垮台后重返政坛，1923年3月23日于永盖与贝尔塔·贝纳文特·德拉巴拉成婚，育有四女。1933至1937年当选奇廉—布内斯—永盖第十六选区众议员，在宪法立法与司法常设委员会任职，并积极推动为奇廉设立上诉法院；1937至1938年兼任奇廉上诉法院代理律师及涅布雷省律师协会主席。在众议院期间深入参与农业经济委员会工作，由此进入阿吉雷·塞尔达的视野；1933至1937年任众议员期间，他已是激进党内农业政策的重要推手，1939至1942年又出任农业信贷局法律顾问，成为新人民阵线政府农业改革的技术支柱之一。其后历任农业经济研究所执行副主席（1942）、智利振兴公司农业机械化部门法律顾问（1948）及硝石与碘销售公司主任（1949–1952）等职。晚年转入激进党右翼分支民主激进党，以该党党员身份于1972年辞世。"
  CHL_jaime_quintana_desc:0 "海梅·阿方索·金塔纳·布尔戈斯，1891年12月31日生于奇廉，1972年8月27日卒于圣地亚哥。律师、激进党政治家，通称“阿方索·金塔纳”，父亲圣地亚哥·金塔纳，母亲伊莎贝尔·布尔戈斯。就读奇廉大学预科中学及圣地亚哥国立中学，后入智利大学法学院，1918年6月11日宣誓就职律师，毕业论文为《证券交易业务》。早年在奇廉执业，活跃于当地激进党，历任奇廉市议员、市长及党内省议会主席，因此在伊瓦涅斯第一届政府期间（约1930年）遭流放至艾森。独裁垮台后重返政坛，1923年3月23日于永盖与贝尔塔·贝纳文特·德拉巴拉成婚，育有四女。1933至1937年当选奇廉—布内斯—永盖第十六选区众议员，在宪法立法与司法常设委员会任职，并积极推动为奇廉设立上诉法院；1937至1938年兼任奇廉上诉法院代理律师及涅布雷省律师协会主席。在众议院期间深入参与农业经济委员会工作，由此进入阿吉雷·塞尔达的视野；1933至1937年任众议员期间，他已是激进党内农业政策的重要推手，1939至1942年又出任农业信贷局法律顾问，成为新人民阵线政府农业改革的技术支柱之一。其后历任农业经济研究所执行副主席（1942）、智利振兴公司农业机械化部门法律顾问（1948）及硝石与碘销售公司主任（1949–1952）等职。晚年转入激进党右翼分支民主激进党，以该党党员身份于1972年辞世。"
