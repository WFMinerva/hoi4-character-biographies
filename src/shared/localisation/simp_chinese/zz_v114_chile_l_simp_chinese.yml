  # B01_CHL_智利：用户人工逐条修改版回写。空白条目跳过，不写入“我不知道”。
  # 采用 智利人物小传_人工逐条修改表_v114c.xlsx 的“人工修改正文_请改此列”；#17 皮诺切特按用户指定原文保留。
  CBIO_CHL_pedro_aguirre_cerda_desc:0 "1879年2月6日生于阿空加瓜的波库罗村。教育家、律师、激进党人，1900、1904年于智利大学先后取得西班牙语—哲学教师与律师资格，曾赴索邦进修；历任众议员、桑富恩特斯政府内政部长（1918）、亚历山德里政府司法与公共教育部长（1920–1921）、康塞普西翁参议员（1921–1924），人称\"红酒老爹\"\"穷人的总统\"。1938年10月25日他作为人民阵线（激进、社会、共产、民主各党与工人联合会的反法西斯联盟）候选人，以微弱优势击败右翼的古斯塔沃·罗斯——原获纳粹运动支持的伊瓦涅斯已在劳工保险局惨案后退选、转而支持他，对此次险胜至关重要；12月24日就任。以\"治国即办教育\"为念，任内小学生由约11万增至约61.6万、新建逾千校；依第6.640号法创建生产开发公司（CORFO，参院一票之差通过）与重建救济公司，奠定工业化基础；1939年遭奇廉大地震与\"阿里奥斯塔索\"未遂政变；同年4月接纳聂鲁达经办、\"温尼伯号\"载来的逾2200名西班牙难民及部分犹太难民；1940年划定智利南极领地；并推动米斯特拉尔角逐诺贝尔文学奖。其局限是否决农业工人工会化、农村改革未及推行。1941年11月将职权交予门德斯后病逝。"
  CHL_pedro_aguirre_cerda_desc:0 "1879年2月6日生于阿空加瓜的波库罗村。教育家、律师、激进党人，1900、1904年于智利大学先后取得西班牙语—哲学教师与律师资格，曾赴索邦进修；历任众议员、桑富恩特斯政府内政部长（1918）、亚历山德里政府司法与公共教育部长（1920–1921）、康塞普西翁参议员（1921–1924），人称\"红酒老爹\"\"穷人的总统\"。1938年10月25日他作为人民阵线（激进、社会、共产、民主各党与工人联合会的反法西斯联盟）候选人，以微弱优势击败右翼的古斯塔沃·罗斯——原获纳粹运动支持的伊瓦涅斯已在劳工保险局惨案后退选、转而支持他，对此次险胜至关重要；12月24日就任。以\"治国即办教育\"为念，任内小学生由约11万增至约61.6万、新建逾千校；依第6.640号法创建生产开发公司（CORFO，参院一票之差通过）与重建救济公司，奠定工业化基础；1939年遭奇廉大地震与\"阿里奥斯塔索\"未遂政变；同年4月接纳聂鲁达经办、\"温尼伯号\"载来的逾2200名西班牙难民及部分犹太难民；1940年划定智利南极领地；并推动米斯特拉尔角逐诺贝尔文学奖。其局限是否决农业工人工会化、农村改革未及推行。1941年11月将职权交予门德斯后病逝。"
  CBIO_CHL_carlos_ibanez_desc:0 "1877年11月3日生于利纳雷斯，1960年4月28日病逝于圣地亚哥。职业陆军军官，前后两度出任总统。1924年9月与1925年1月两次军人政变的核心人物，曾任亚历山德里政府战争部长。1925年迫使亚历山德里去职，1927年又逼退费格罗亚总统而自任总统。第一任期（1927–1931）行专政之实：以法令治国、流放或监禁政敌、压制工运，并于1927年整合各警力创设智利武装警察（Carabineros）。大萧条令以硝石、铜为支柱的智利经济崩溃，1931年7月他在民众抗议中被迫流亡。1930年代后期他自流亡中谋求复出，1938年获智利国家社会主义运动（纳粹派）支持参选总统；该年9月企图拥其上台的政变（劳工保险局惨案）失败后他退出竞选，1939年8月又卷入一次未遂起事。1952年他以民粹姿态再度当选总统（1952–1958），立场转趋中间，一贯反共。"
  CHL_carlos_ibanez_desc:0 "1877年11月3日生于利纳雷斯，1960年4月28日病逝于圣地亚哥。职业陆军军官，前后两度出任总统。1924年9月与1925年1月两次军人政变的核心人物，曾任亚历山德里政府战争部长。1925年迫使亚历山德里去职，1927年又逼退费格罗亚总统而自任总统。第一任期（1927–1931）行专政之实：以法令治国、流放或监禁政敌、压制工运，并于1927年整合各警力创设智利武装警察（Carabineros）。大萧条令以硝石、铜为支柱的智利经济崩溃，1931年7月他在民众抗议中被迫流亡。1930年代后期他自流亡中谋求复出，1938年获智利国家社会主义运动（纳粹派）支持参选总统；该年9月企图拥其上台的政变（劳工保险局惨案）失败后他退出竞选，1939年8月又卷入一次未遂起事。1952年他以民粹姿态再度当选总统（1952–1958），立场转趋中间，一贯反共。"
  CBIO_CHL_carlos_contreras_labarca_desc:0 "1899年生于布尔内斯，1982年8月2日在圣地亚哥去世。律师出身的智利共产党人，1924年9月5日于智利大学取得律师资格，是该党第一位职业知识分子党员。学生时代即入党，1931年7月28日起任党总书记，直至1946年10月31日，是该党史上任期最长的总书记之一。1935年共产国际转向人民阵线策略时他正在莫斯科，归国后成为1936年人民阵线的主要推动者之一，助力激进党人阿吉雷·塞尔达于1938年上台。1946年进入冈萨雷斯·魏地拉政府任公共工程部长，但1948年《保卫民主永久法》将共产党取缔后，党转入地下，他亦转事地下组织工作。后于阿连德时期出任驻东德大使，1973年政变后仍留东德，1979年归国。"
  CHL_carlos_contreras_labarca_desc:0 "1899年生于布尔内斯，1982年8月2日在圣地亚哥去世。律师出身的智利共产党人，1924年9月5日于智利大学取得律师资格，是该党第一位职业知识分子党员。学生时代即入党，1931年7月28日起任党总书记，直至1946年10月31日，是该党史上任期最长的总书记之一。1935年共产国际转向人民阵线策略时他正在莫斯科，归国后成为1936年人民阵线的主要推动者之一，助力激进党人阿吉雷·塞尔达于1938年上台。1946年进入冈萨雷斯·魏地拉政府任公共工程部长，但1948年《保卫民主永久法》将共产党取缔后，党转入地下，他亦转事地下组织工作。后于阿连德时期出任驻东德大使，1973年政变后仍留东德，1979年归国。"
  CBIO_CHL_elias_lafertte_gavino_desc:0 "1886年12月19日生于科金博省的萨拉曼卡，1961年2月17日在圣地亚哥病逝（时值竞选连任参议员期间，享年75岁）。硝石矿工出身、自学成才的工人领袖，人称\"硝石之子\"。少年即在塔拉帕卡硝石区做工，1907年12月伊基克圣玛丽亚学校大屠杀被视为其投身工运的关键事件（其本人是否在场各源有出入）。1911年结识雷卡瓦伦，1912年参与创建社会主义工人党，1922年参与创建智利共产党，长期领导智利工人联合会（FOCH），1926年起任总书记。伊瓦涅斯专政时期数度被流放——胡安·费尔南德斯群岛的\"最外岛\"、复活节岛等地，备受关押与酷刑。曾多次作为共产党总统候选人参选（1927年流放中受象征性提名、1931、1932年），得票均低。1937年起任塔拉帕卡与安托法加斯塔参议员，1956年起任党主席。"
  CHL_elias_lafertte_gavino_desc:0 "1886年12月19日生于科金博省的萨拉曼卡，1961年2月17日在圣地亚哥病逝（时值竞选连任参议员期间，享年75岁）。硝石矿工出身、自学成才的工人领袖，人称\"硝石之子\"。少年即在塔拉帕卡硝石区做工，1907年12月伊基克圣玛丽亚学校大屠杀被视为其投身工运的关键事件（其本人是否在场各源有出入）。1911年结识雷卡瓦伦，1912年参与创建社会主义工人党，1922年参与创建智利共产党，长期领导智利工人联合会（FOCH），1926年起任总书记。伊瓦涅斯专政时期数度被流放——胡安·费尔南德斯群岛的\"最外岛\"、复活节岛等地，备受关押与酷刑。曾多次作为共产党总统候选人参选（1927年流放中受象征性提名、1931、1932年），得票均低。1937年起任塔拉帕卡与安托法加斯塔参议员，1956年起任党主席。"
  CBIO_CHL_jorge_gonzalez_von_marees_desc:0 "1900年4月4日生于圣地亚哥，1962年3月14日在圣地亚哥去世。律师，母系出自德国冯·马雷斯家族（其姑祖辈为画家汉斯·冯·马雷斯），思想受斯宾格勒影响，追随者称其\"领袖\"（ElJefe）。1932年4月5日，他与经济学家卡洛斯·凯勒、退役军人弗朗西斯科·哈维尔·迪亚斯共同创建智利国家社会主义运动（MNS，\"纳粹派\"），自任领袖；该运动师法德意法西斯，1933年组建仿冲锋队的\"纳粹突击队\"，与社会党、共产党街头武斗。他早期亦自称反犹，但后来转而主导将种族主义从智利纳粹运动中剔除。1937年当选众议员，1938年5月21日曾在国会议场内开枪、旋遭剥夺豁免权。1938年纳粹派与伊瓦涅斯结盟，9月5日其青年党徒发动政变、占据智利大学校本部，企图拥伊瓦涅斯上台；政变失败后，约六十名缴械投降者被押至劳工保险局大楼集体枪杀（劳工保险局惨案），仅四人生还。此事重创亚历山德里政府声望，纳粹派转而支持阿吉雷·塞尔达，被认为促成其险胜。冯·马雷斯被判二十年徒刑，旋获阿吉雷·塞尔达特赦。运动随后左倾、更名人民先锋社会主义党，晚年他加入自由党。"
  CHL_jorge_gonzalez_von_marees_desc:0 "1900年4月4日生于圣地亚哥，1962年3月14日在圣地亚哥去世。律师，母系出自德国冯·马雷斯家族（其姑祖辈为画家汉斯·冯·马雷斯），思想受斯宾格勒影响，追随者称其\"领袖\"（ElJefe）。1932年4月5日，他与经济学家卡洛斯·凯勒、退役军人弗朗西斯科·哈维尔·迪亚斯共同创建智利国家社会主义运动（MNS，\"纳粹派\"），自任领袖；该运动师法德意法西斯，1933年组建仿冲锋队的\"纳粹突击队\"，与社会党、共产党街头武斗。他早期亦自称反犹，但后来转而主导将种族主义从智利纳粹运动中剔除。1937年当选众议员，1938年5月21日曾在国会议场内开枪、旋遭剥夺豁免权。1938年纳粹派与伊瓦涅斯结盟，9月5日其青年党徒发动政变、占据智利大学校本部，企图拥伊瓦涅斯上台；政变失败后，约六十名缴械投降者被押至劳工保险局大楼集体枪杀（劳工保险局惨案），仅四人生还。此事重创亚历山德里政府声望，纳粹派转而支持阿吉雷·塞尔达，被认为促成其险胜。冯·马雷斯被判二十年徒刑，旋获阿吉雷·塞尔达特赦。运动随后左倾、更名人民先锋社会主义党，晚年他加入自由党。"
  CBIO_CHL_arturo_alessandri_desc:0 "1868年12月20日生于隆加维。意大利裔自由党律师，人称\"塔拉帕卡雄狮\"，前后三度出任总统。长期任库里科众议员，1915年以煽动性演说当选塔拉帕卡参议员而得此绰号。1920年首次当选总统，但其社会与劳工立法在国会受阻；1924年9月军人\"佩剑之声\"风波后出走，1925年初被召回短暂复任，主持制定确立总统制的1925年宪法、创设中央银行，旋因与伊瓦涅斯冲突再度辞职流亡。1932年第三度当选（1932–1938），结束政局动荡、恢复文人统治，但本届政府趋于保守，以古斯塔沃·罗斯主持财政，镇压兰基尔起义与铁路罢工，并倚重\"共和民兵\"。1938年劳工保险局惨案中政府对缴械纳粹党徒的处置使其声望大损，亦被认为拖累了其属意的继任者罗斯落选。其子豪尔赫·亚历山德里、费尔南多·亚历山德里后亦活跃政坛。1945年起任参议院议长直至去世。"
  CHL_arturo_alessandri_desc:0 "1868年12月20日生于隆加维。意大利裔自由党律师，人称\"塔拉帕卡雄狮\"，前后三度出任总统。长期任库里科众议员，1915年以煽动性演说当选塔拉帕卡参议员而得此绰号。1920年首次当选总统，但其社会与劳工立法在国会受阻；1924年9月军人\"佩剑之声\"风波后出走，1925年初被召回短暂复任，主持制定确立总统制的1925年宪法、创设中央银行，旋因与伊瓦涅斯冲突再度辞职流亡。1932年第三度当选（1932–1938），结束政局动荡、恢复文人统治，但本届政府趋于保守，以古斯塔沃·罗斯主持财政，镇压兰基尔起义与铁路罢工，并倚重\"共和民兵\"。1938年劳工保险局惨案中政府对缴械纳粹党徒的处置使其声望大损，亦被认为拖累了其属意的继任者罗斯落选。其子豪尔赫·亚历山德里、费尔南多·亚历山德里后亦活跃政坛。1945年起任参议院议长直至去世。"
  CBIO_CHL_e_novoa_fuentes_desc:0 "1886年3月8日生于塔克纳。炮兵军官出身，亦是击剑选手，曾代表智利参加奥运会佩剑团体赛。1901年入军校，两年后以炮兵少尉毕业；1927年赴德国炮兵学校进修，归国后历任炮兵团长、战争军械总监、陆军第二师师长等职。1934年，正因其素来极不介入政治，被处于第二任期的亚历山德里任命为陆军总司令（时为师级将军）——这位总统亲历过1924、1925年的军人干政，最盼军队回归本职。任内他严禁军官涉政、整肃军纪、突击检查各部队，以恢复军队职业化著称。1938年9月5日纳粹派发动政变、占据劳工保险局大楼一带时，他作为陆军统帅奉召应对。约1938年卸任总司令。"
  CHL_e_novoa_fuentes_desc:0 "1886年3月8日生于塔克纳。炮兵军官出身，亦是击剑选手，曾代表智利参加奥运会佩剑团体赛。1901年入军校，两年后以炮兵少尉毕业；1927年赴德国炮兵学校进修，归国后历任炮兵团长、战争军械总监、陆军第二师师长等职。1934年，正因其素来极不介入政治，被处于第二任期的亚历山德里任命为陆军总司令（时为师级将军）——这位总统亲历过1924、1925年的军人干政，最盼军队回归本职。任内他严禁军官涉政、整肃军纪、突击检查各部队，以恢复军队职业化著称。1938年9月5日纳粹派发动政变、占据劳工保险局大楼一带时，他作为陆军统帅奉召应对。约1938年卸任总司令。"
  CBIO_CHL_pedro_calderon_desc:0 "1893年11月18日生于圣地亚哥的雷科莱塔。巴伦丁·莱特列尔中学毕业后，1908年12月1日以15岁之龄入圣地亚哥警察任三等警卫，分配至保安科所属的身份鉴识处。此后数十年间他在警察教育体系中逐级擢升，曾任武装警察学校校长。1940年1月30日，新设的武装警察高等学院（今警察科学学院）成立，他出任首任院长——当局为此专设一个上校督察编制由其担任；在任期间他从无到有地起草了学院章程、延聘师资、奠定教学基础。1942年2月2日退役。两个月后里奥斯总统延揽他出任武装警察总监（1942–1944）。任内正值第二次世界大战。"
  CHL_pedro_calderon_desc:0 "1893年11月18日生于圣地亚哥的雷科莱塔。巴伦丁·莱特列尔中学毕业后，1908年12月1日以15岁之龄入圣地亚哥警察任三等警卫，分配至保安科所属的身份鉴识处。此后数十年间他在警察教育体系中逐级擢升，曾任武装警察学校校长。1940年1月30日，新设的武装警察高等学院（今警察科学学院）成立，他出任首任院长——当局为此专设一个上校督察编制由其担任；在任期间他从无到有地起草了学院章程、延聘师资、奠定教学基础。1942年2月2日退役。两个月后里奥斯总统延揽他出任武装警察总监（1942–1944）。任内正值第二次世界大战。"
  CBIO_CHL_pedro_dartnell_desc:0 "1874年12月24日生于利纳雷斯，1944年9月26日在圣地亚哥（普罗维登西亚）去世。师级将军、军事工程师，爱尔兰裔（父为爱尔兰人罗伯特·达特内尔）。1885年入军校，1891年内战中以工兵少尉随国会派参加孔孔与普拉西利亚之役。早年赴法国进修，其考察报告促成1913年军事航空学校的创建，是智利军事航空的奠基人物之一，1919年任军事航空总监；正是凭他的支持，戈多伊于1918年首次驾机飞越安第斯山。1924年11月至1925年1月任陆军总监察长——当时军中最高职位。1925年1月23日，推翻\"九月军政府\"的青年军官将行政权交予他，他出任军政府主席（1月23–27日），但婉拒独揽大权，遂以成员身份加入随后由贝略·科德西多主持的军政府（1月27日–3月20日），促成亚历山德里复职。1926年退役，1930年起任塔尔卡—利纳雷斯—毛莱参议员（自由党），至1932年社会主义共和国解散国会为止。"
  CHL_pedro_dartnell_desc:0 "1874年12月24日生于利纳雷斯，1944年9月26日在圣地亚哥（普罗维登西亚）去世。师级将军、军事工程师，爱尔兰裔（父为爱尔兰人罗伯特·达特内尔）。1885年入军校，1891年内战中以工兵少尉随国会派参加孔孔与普拉西利亚之役。早年赴法国进修，其考察报告促成1913年军事航空学校的创建，是智利军事航空的奠基人物之一，1919年任军事航空总监；正是凭他的支持，戈多伊于1918年首次驾机飞越安第斯山。1924年11月至1925年1月任陆军总监察长——当时军中最高职位。1925年1月23日，推翻\"九月军政府\"的青年军官将行政权交予他，他出任军政府主席（1月23–27日），但婉拒独揽大权，遂以成员身份加入随后由贝略·科德西多主持的军政府（1月27日–3月20日），促成亚历山德里复职。1926年退役，1930年起任塔尔卡—利纳雷斯—毛莱参议员（自由党），至1932年社会主义共和国解散国会为止。"
  CBIO_CHL_rene_schneider_desc:0 "1913年12月31日生于康塞普西翁（父为德国移民、母为法国移民），1970年10月25日在圣地亚哥遇刺身亡。陆军职业军官，1929年15岁入军校。1969年10月出任陆军总司令。1970年总统大选前夕，他在《信使报》访谈（5月8日）中明确表态军队恪守宪法、不干预选举，此立场被称为\"施奈德主义\"。当左翼候选人阿连德赢得相对多数、须由国会确认之际，反对其上台的势力策划绑架施奈德以诱发军事政变。1970年10月22日，由退役将军罗伯托·维奥与卡米洛·巴伦苏埃拉将军指挥、得到美国中情局资助的突击队伏击其座车，施奈德拔枪自卫被近距离射中数枪，三日后（25日）伤重不治。此举适得其反，激起公愤，国会遂于10月24日确认阿连德当选。"
  CHL_rene_schneider_desc:0 "1913年12月31日生于康塞普西翁（父为德国移民、母为法国移民），1970年10月25日在圣地亚哥遇刺身亡。陆军职业军官，1929年15岁入军校。1969年10月出任陆军总司令。1970年总统大选前夕，他在《信使报》访谈（5月8日）中明确表态军队恪守宪法、不干预选举，此立场被称为\"施奈德主义\"。当左翼候选人阿连德赢得相对多数、须由国会确认之际，反对其上台的势力策划绑架施奈德以诱发军事政变。1970年10月22日，由退役将军罗伯托·维奥与卡米洛·巴伦苏埃拉将军指挥、得到美国中情局资助的突击队伏击其座车，施奈德拔枪自卫被近距离射中数枪，三日后（25日）伤重不治。此举适得其反，激起公愤，国会遂于10月24日确认阿连德当选。"
  CBIO_CHL_carlos_keller_reuff_desc:0 "全名卡洛斯·凯勒·鲁夫，1898年1月3日生于康塞普西翁的德国移民家庭，1974年2月28日因动脉硬化去世。德裔智利学者——社会学家、经济学家、地理学家与政论家。少年随家迁居德国莱比锡求学，在当地完成法学、经济学、哲学与社会学的大学学业，师从《西方的没落》作者斯宾格勒。归国后曾任康塞普西翁大学经济学教授，1928年起任职国家统计总局、并长期在军事理工学院讲授经济地理，1930年代初任统计总局局长。1931年出版影响广泛的《智利永恒的危机》，主张以威权与干预主义国家克服危机、批判自由民主与自由放任资本主义。1932年4月5日，他与冯·马雷斯、退役军人弗朗西斯科·哈维尔·迪亚斯共同创建智利国家社会主义运动（MNS，\"纳粹派\"），任副领袖与首席理论家。1938年纳粹派政变（他事先未与闻并予以谴责）失败后，他拒绝追随冯·马雷斯改组的左倾人民先锋社会主义党，此后逐渐退出政治、重返学术，至死专注教育与著述。"
  CHL_carlos_keller_reuff_desc:0 "全名卡洛斯·凯勒·鲁夫，1898年1月3日生于康塞普西翁的德国移民家庭，1974年2月28日因动脉硬化去世。德裔智利学者——社会学家、经济学家、地理学家与政论家。少年随家迁居德国莱比锡求学，在当地完成法学、经济学、哲学与社会学的大学学业，师从《西方的没落》作者斯宾格勒。归国后曾任康塞普西翁大学经济学教授，1928年起任职国家统计总局、并长期在军事理工学院讲授经济地理，1930年代初任统计总局局长。1931年出版影响广泛的《智利永恒的危机》，主张以威权与干预主义国家克服危机、批判自由民主与自由放任资本主义。1932年4月5日，他与冯·马雷斯、退役军人弗朗西斯科·哈维尔·迪亚斯共同创建智利国家社会主义运动（MNS，\"纳粹派\"），任副领袖与首席理论家。1938年纳粹派政变（他事先未与闻并予以谴责）失败后，他拒绝追随冯·马雷斯改组的左倾人民先锋社会主义党，此后逐渐退出政治、重返学术，至死专注教育与著述。"
  CBIO_CHL_carlos_fuentes_rabe_desc:0 "全名卡洛斯·富恩特斯·拉贝，1887年7月2日生于圣地亚哥，1974年5月17日在圣地亚哥去世。炮兵出身的师级将军，1902年入军校，曾赴德国进修。1937年晋升师级将军，1938年12月26日出任陆军总司令。1939年初奇廉大地震后，军队在灾区重建与维持秩序中发挥关键作用。1939年8月25日，退役将军阿里奥斯托·埃雷拉联合前总统伊瓦涅斯企图发动政变（史称\"阿里奥斯塔索\"）推翻阿吉雷·塞尔达政府时，他在布因团设立指挥部，派忠诚部队接管被波及的塔克纳团并逮捕埃雷拉，迅速平息了这场未遂政变。1940年8月23日卸任总司令。"
  CHL_carlos_fuentes_rabe_desc:0 "全名卡洛斯·富恩特斯·拉贝，1887年7月2日生于圣地亚哥，1974年5月17日在圣地亚哥去世。炮兵出身的师级将军，1902年入军校，曾赴德国进修。1937年晋升师级将军，1938年12月26日出任陆军总司令。1939年初奇廉大地震后，军队在灾区重建与维持秩序中发挥关键作用。1939年8月25日，退役将军阿里奥斯托·埃雷拉联合前总统伊瓦涅斯企图发动政变（史称\"阿里奥斯塔索\"）推翻阿吉雷·塞尔达政府时，他在布因团设立指挥部，派忠诚部队接管被波及的塔克纳团并逮捕埃雷拉，迅速平息了这场未遂政变。1940年8月23日卸任总司令。"
  CBIO_CHL_carlos_prats_desc:0 "全名卡洛斯·普拉茨·冈萨雷斯，1915年2月24日生于塔尔卡瓦诺，1974年9月30日在布宜诺斯艾利斯被汽车炸弹炸死。陆军职业军官，\"宪政派\"将领，奉行施奈德所立的军队不干政原则。1970年11月在前任施奈德遇刺后出任陆军总司令，并成为阿连德政府最坚定的军方支持者，数度入阁，曾在总统出访期间代理副总统。1973年6月迅速平息了\"坦克兵之乱\"未遂政变。同年8月，在主张政变的军官集团施压下，他于23日辞去总司令职，并亲自向阿连德举荐皮诺切特接任——此举移除了政变的最后障碍。9月11日政变后，他于9月15日流亡布宜诺斯艾利斯。1974年9月30日，皮诺切特政权的秘密警察DINA以遥控汽车炸弹将他与妻子索菲娅·库特贝特一同炸死。"
  CHL_carlos_prats_desc:0 "全名卡洛斯·普拉茨·冈萨雷斯，1915年2月24日生于塔尔卡瓦诺，1974年9月30日在布宜诺斯艾利斯被汽车炸弹炸死。陆军职业军官，\"宪政派\"将领，奉行施奈德所立的军队不干政原则。1970年11月在前任施奈德遇刺后出任陆军总司令，并成为阿连德政府最坚定的军方支持者，数度入阁，曾在总统出访期间代理副总统。1973年6月迅速平息了\"坦克兵之乱\"未遂政变。同年8月，在主张政变的军官集团施压下，他于23日辞去总司令职，并亲自向阿连德举荐皮诺切特接任——此举移除了政变的最后障碍。9月11日政变后，他于9月15日流亡布宜诺斯艾利斯。1974年9月30日，皮诺切特政权的秘密警察DINA以遥控汽车炸弹将他与妻子索菲娅·库特贝特一同炸死。"
  CBIO_CHL_guillermo_barrios_tirado_desc:0 "全名曼努埃尔·吉列尔莫·巴里奥斯·蒂拉多，1893年4月2日生于奥瓦列附近的索塔基，1967年9月8日在圣地亚哥去世。陆军军官与外交官。1912年入军校，1937年晋升上校并出任步兵学校校长，以治军严格著称——1938年劳工保险局事件后纳粹派缴械时，他正任此职。1939年因在挫败\"阿里奥斯塔索\"政变中的表现获一等\"尽责\"勋章。1942年任战争学院院长兼总参谋长（准将），翌年晋升师级将军。后于1946–1947年及1949–1950年两度出任陆军总司令，并在冈萨雷斯·魏地拉政府任国防部长（1947年8月—1952年，延续至伊瓦涅斯政府）。"
  CHL_guillermo_barrios_tirado_advisor_desc:0 "全名曼努埃尔·吉列尔莫·巴里奥斯·蒂拉多，1893年4月2日生于奥瓦列附近的索塔基，1967年9月8日在圣地亚哥去世。陆军军官与外交官。1912年入军校，1937年晋升上校并出任步兵学校校长，以治军严格著称——1938年劳工保险局事件后纳粹派缴械时，他正任此职。1939年因在挫败\"阿里奥斯塔索\"政变中的表现获一等\"尽责\"勋章。1942年任战争学院院长兼总参谋长（准将），翌年晋升师级将军。后于1946–1947年及1949–1950年两度出任陆军总司令，并在冈萨雷斯·魏地拉政府任国防部长（1947年8月—1952年，延续至伊瓦涅斯政府）。"
  CHL_guillermo_barrios_tirado_desc:0 "全名曼努埃尔·吉列尔莫·巴里奥斯·蒂拉多，1893年4月2日生于奥瓦列附近的索塔基，1967年9月8日在圣地亚哥去世。陆军军官与外交官。1912年入军校，1937年晋升上校并出任步兵学校校长，以治军严格著称——1938年劳工保险局事件后纳粹派缴械时，他正任此职。1939年因在挫败\"阿里奥斯塔索\"政变中的表现获一等\"尽责\"勋章。1942年任战争学院院长兼总参谋长（准将），翌年晋升师级将军。后于1946–1947年及1949–1950年两度出任陆军总司令，并在冈萨雷斯·魏地拉政府任国防部长（1947年8月—1952年，延续至伊瓦涅斯政府）。"
  CHL_guillermo_barrios_tirado_theorist_desc:0 "全名曼努埃尔·吉列尔莫·巴里奥斯·蒂拉多，1893年4月2日生于奥瓦列附近的索塔基，1967年9月8日在圣地亚哥去世。陆军军官与外交官。1912年入军校，1937年晋升上校并出任步兵学校校长，以治军严格著称——1938年劳工保险局事件后纳粹派缴械时，他正任此职。1939年因在挫败\"阿里奥斯塔索\"政变中的表现获一等\"尽责\"勋章。1942年任战争学院院长兼总参谋长（准将），翌年晋升师级将军。后于1946–1947年及1949–1950年两度出任陆军总司令，并在冈萨雷斯·魏地拉政府任国防部长（1947年8月—1952年，延续至伊瓦涅斯政府）。"
  CBIO_CHL_esteban_romero_sandoval_desc:0 "1906年生于帕德雷拉斯卡萨斯的特鲁夫-特鲁夫（今阿劳卡尼亚大区），1983年在圣地亚哥去世（仅有年份）。会计师、马普切政治领袖。他是1881年马普切\"大起义\"（FutaMalón）中的重要lonko埃斯特万·罗梅罗之后（英文维基称其为子、BCN称其为子、另有来源称为孙——血缘辈分存歧，正文不择一），自幼成长于抵抗智利国家扩张的马普切家族传统中。青年时代他加入\"考波利坎防卫会\"（SociedadCaupolicánDefensoradelaAraucanía），1928至1931年间任该会会长。1931年12月他将会长之位交予韦南西奥·科涅潘，自任秘书长；他与科涅潘、何塞·卡尤皮三人组成\"阿劳卡尼亚青年派\"核心，掌控了防卫会的方向。1938年这一派别主导创建了\"阿劳卡尼亚公司\"（CorporaciónAraucana），罗梅罗·桑多瓦尔是该组织的历史领袖之一，在其中活跃逾三十年。1953年他以\"国家基督教党\"（亲伊瓦涅斯的前保守党人组建）候选人身份当选特木科、因佩里亚尔、皮特鲁夫肯与比利亚里卡众议员（1953–1957），与卡尤皮同年进入国会。1957年争取连任失败，1961年以\"国家民主党\"候选人再选亦未果。1963年国会通过第15.129号法，向他与卡尤皮授予终身荣誉养老金。"
  CHL_esteban_romero_sandoval_desc:0 "1906年生于帕德雷拉斯卡萨斯的特鲁夫-特鲁夫（今阿劳卡尼亚大区），1983年在圣地亚哥去世（仅有年份）。会计师、马普切政治领袖。他是1881年马普切\"大起义\"（FutaMalón）中的重要lonko埃斯特万·罗梅罗之后（英文维基称其为子、BCN称其为子、另有来源称为孙——血缘辈分存歧，正文不择一），自幼成长于抵抗智利国家扩张的马普切家族传统中。青年时代他加入\"考波利坎防卫会\"（SociedadCaupolicánDefensoradelaAraucanía），1928至1931年间任该会会长。1931年12月他将会长之位交予韦南西奥·科涅潘，自任秘书长；他与科涅潘、何塞·卡尤皮三人组成\"阿劳卡尼亚青年派\"核心，掌控了防卫会的方向。1938年这一派别主导创建了\"阿劳卡尼亚公司\"（CorporaciónAraucana），罗梅罗·桑多瓦尔是该组织的历史领袖之一，在其中活跃逾三十年。1953年他以\"国家基督教党\"（亲伊瓦涅斯的前保守党人组建）候选人身份当选特木科、因佩里亚尔、皮特鲁夫肯与比利亚里卡众议员（1953–1957），与卡尤皮同年进入国会。1957年争取连任失败，1961年以\"国家民主党\"候选人再选亦未果。1963年国会通过第15.129号法，向他与卡尤皮授予终身荣誉养老金。"
  CBIO_CHL_augusto_pimochet_desc:0 "1915年11月25日生于瓦尔帕莱索的中产家庭，2006年12月10日因心脏并发症在圣地亚哥去世。职业陆军军官，智利总统。1931年入军校，1936年以步兵少尉毕业，派驻康塞普西翁查卡布科团，此后三十余年在陆军中循序擢升，历任参谋、团长、师长。1973年8月23日，阿连德总统在军队内部政治危机深重之际任命他为陆军总司令，以为他是可靠的宪政军人——仅十八天后的9月11日，他率陆军、海军、空军与武装警察联合发动政变，派战机轰炸总统府拉莫内达，推翻民选政府；阿连德在总统府内以武器自尽。政变当日他即出任军政府最高指挥官，1974年12月正式称总统，统治智利至1990年。其政权的统治手段包括：解散国会、取缔一切政党、以法令代替立法；通过秘密警察DINA及其后继机构系统性追捕、拷打、杀害异见者——据智利官方雷蒂希委员会认定，约三千二百余人被处决或强迫失踪；据瓦莱赫委员会，三万八千余人遭受酷刑。其政权还将迫害延伸至境外：1974年在布宜诺斯艾利斯用汽车炸弹炸死前总司令普拉茨，1976年在华盛顿用汽车炸弹炸死前外长莱特列尔。他与阿根廷、巴西、乌拉圭、玻利维亚等南美独裁政权共同组建了跨国政治清洗网络\"秃鹰行动\"。经济上，他委用芝加哥学派经济学家（\"芝加哥男孩\"）推行激进自由市场改革——削减国家干预、私有化国营企业、引进外资——进行新自由主义改革并取得显著成效，创造了“智利经济奇迹”。1980年他主导通过新宪法，为自身延任提供了法理背书；但1988年宪法规定的公民投票中，民众以55.99%对44.01%否决其续任，他被迫于1990年3月将政权移交当选总统帕特里西奥·艾尔文，惟依1980年宪法续任陆军总司令至1998年3月、随后成为终身参议员。1998年10月他赴伦敦就医期间，因西班牙法官巴尔塔萨·加尔松的国际逮捕令遭英国当局拘押，引发长达十六个月的引渡法律战，最终以健康为由于2000年3月获释返回智利。此后智利法院剥夺其终身参议员豁免权，对他发出数十项起诉，但在审判结束前他于2006年底病死，终未受到定罪。"
  CHL_augusto_pimochet_desc:0 "1915年11月25日生于瓦尔帕莱索的中产家庭，2006年12月10日因心脏并发症在圣地亚哥去世。职业陆军军官，智利总统。1931年入军校，1936年以步兵少尉毕业，派驻康塞普西翁查卡布科团，此后三十余年在陆军中循序擢升，历任参谋、团长、师长。1973年8月23日，阿连德总统在军队内部政治危机深重之际任命他为陆军总司令，以为他是可靠的宪政军人——仅十八天后的9月11日，他率陆军、海军、空军与武装警察联合发动政变，派战机轰炸总统府拉莫内达，推翻民选政府；阿连德在总统府内以武器自尽。政变当日他即出任军政府最高指挥官，1974年12月正式称总统，统治智利至1990年。其政权的统治手段包括：解散国会、取缔一切政党、以法令代替立法；通过秘密警察DINA及其后继机构系统性追捕、拷打、杀害异见者——据智利官方雷蒂希委员会认定，约三千二百余人被处决或强迫失踪；据瓦莱赫委员会，三万八千余人遭受酷刑。其政权还将迫害延伸至境外：1974年在布宜诺斯艾利斯用汽车炸弹炸死前总司令普拉茨，1976年在华盛顿用汽车炸弹炸死前外长莱特列尔。他与阿根廷、巴西、乌拉圭、玻利维亚等南美独裁政权共同组建了跨国政治清洗网络\"秃鹰行动\"。经济上，他委用芝加哥学派经济学家（\"芝加哥男孩\"）推行激进自由市场改革——削减国家干预、私有化国营企业、引进外资——进行新自由主义改革并取得显著成效，创造了“智利经济奇迹”。1980年他主导通过新宪法，为自身延任提供了法理背书；但1988年宪法规定的公民投票中，民众以55.99%对44.01%否决其续任，他被迫于1990年3月将政权移交当选总统帕特里西奥·艾尔文，惟依1980年宪法续任陆军总司令至1998年3月、随后成为终身参议员。1998年10月他赴伦敦就医期间，因西班牙法官巴尔塔萨·加尔松的国际逮捕令遭英国当局拘押，引发长达十六个月的引渡法律战，最终以健康为由于2000年3月获释返回智利。此后智利法院剥夺其终身参议员豁免权，对他发出数十项起诉，但在审判结束前他于2006年底病死，终未受到定罪。"
  CBIO_CHL_escudero_oscar_otarola_desc:0 "1891年3月22日生于圣费利佩，1957年8月4日在圣地亚哥去世。炮兵出身的师级将军，1906年军校毕业，战争学院（1917–1919）以同期第一名结业，曾获马耳他十字勋章。1926–1928年随军事使团赴法国进修。1932年晋升上校，历任总参谋部代理参谋长、军事院校机构主任、第四师参谋等职。1939年晋升师级将军。1940年8月23日接替富恩特斯·拉贝出任陆军总司令，至1943年3月8日卸任，其后于里奥斯政府任国防部长（1943–1944），1944年退役，1945–1948年任驻巴拉圭大使。"
  CHL_escudero_oscar_otarola_desc:0 "1891年3月22日生于圣费利佩，1957年8月4日在圣地亚哥去世。炮兵出身的师级将军，1906年军校毕业，战争学院（1917–1919）以同期第一名结业，曾获马耳他十字勋章。1926–1928年随军事使团赴法国进修。1932年晋升上校，历任总参谋部代理参谋长、军事院校机构主任、第四师参谋等职。1939年晋升师级将军。1940年8月23日接替富恩特斯·拉贝出任陆军总司令，至1943年3月8日卸任，其后于里奥斯政府任国防部长（1943–1944），1944年退役，1945–1948年任驻巴拉圭大使。"
  CBIO_CHL_oscar_fuentes_pantoja_desc:0 "1895年2月15日生于科尔查瓜省。炮兵出身的职业军人，1909年入伍军校，先后服务于数个炮兵团，1913年以陆军少尉身份在炮兵兵种任职，1915年晋升中尉，1919年晋升上尉。1925年入战争学院深造，次年奉派国内政部调配，出任共和国总统侍从官，同年晋升少校。1943年至1945年间以军事代表团团长暨陆军武官身份常驻美国，是智利军队在二战期间与美方维持联络的关键人物。归国后即晋升陆军少将，出任陆军教育总监。1945年11月12日接掌陆军总司令一职——据记载，其提名曾在高级军官集会中经合议确认，显示其在军中具有相当程度的跨派系认可。任内处于冈萨雷斯·魏地拉政府执政初期，政治气氛趋于复杂，他于1946年11月29日卸任，同年获颁三十五年服役金质勋章，随即宣布退役，结束长达三十余年的军旅生涯。"
  CHL_oscar_fuentes_pantoja_desc:0 "1895年2月15日生于科尔查瓜省。炮兵出身的职业军人，1909年入伍军校，先后服务于数个炮兵团，1913年以陆军少尉身份在炮兵兵种任职，1915年晋升中尉，1919年晋升上尉。1925年入战争学院深造，次年奉派国内政部调配，出任共和国总统侍从官，同年晋升少校。1943年至1945年间以军事代表团团长暨陆军武官身份常驻美国，是智利军队在二战期间与美方维持联络的关键人物。归国后即晋升陆军少将，出任陆军教育总监。1945年11月12日接掌陆军总司令一职——据记载，其提名曾在高级军官集会中经合议确认，显示其在军中具有相当程度的跨派系认可。任内处于冈萨雷斯·魏地拉政府执政初期，政治气氛趋于复杂，他于1946年11月29日卸任，同年获颁三十五年服役金质勋章，随即宣布退役，结束长达三十余年的军旅生涯。"
  CBIO_CHL_oscar_reeves_leiva_desc:0 "全名奥斯卡·里夫斯·雷瓦（ÓscarReevesLeiva），1894年3月18日生于康塞普西翁，1966年9月3日在圣地亚哥去世。智利武装警察（Carabineros）将领，也是智利人身识别（指纹建档）制度的先驱。1912年入警校，次年毕业；1924年《第26号法令》确立强制人身识别后，他出任中央识别处处长；1927年各警力合并成立武装警察时以少校身份转入，续掌识别业务。历任瓦尔迪维亚警长、督察等职，1935年晋升上校督察。1938年12月29日由阿吉雷·塞尔达总统任命为武装警察总监（至1942年4月4日）。任内于1939年12月5日创设武装警察高等学院（今警察科学学院）、组织社会福利服务、将总监部迁至现址（解放者奥希金斯大道），并更换军官制服。"
  CHL_oscar_reeves_leiva_desc:0 "全名奥斯卡·里夫斯·雷瓦（ÓscarReevesLeiva），1894年3月18日生于康塞普西翁，1966年9月3日在圣地亚哥去世。智利武装警察（Carabineros）将领，也是智利人身识别（指纹建档）制度的先驱。1912年入警校，次年毕业；1924年《第26号法令》确立强制人身识别后，他出任中央识别处处长；1927年各警力合并成立武装警察时以少校身份转入，续掌识别业务。历任瓦尔迪维亚警长、督察等职，1935年晋升上校督察。1938年12月29日由阿吉雷·塞尔达总统任命为武装警察总监（至1942年4月4日）。任内于1939年12月5日创设武装警察高等学院（今警察科学学院）、组织社会福利服务、将总监部迁至现址（解放者奥希金斯大道），并更换军官制服。"
  CBIO_CHL_bartolome_blanche_desc:0 "全名巴托洛梅·吉列尔莫·布兰切·埃斯佩霍，1879年6月6日生于拉塞雷纳，1970年6月10日在圣地亚哥军医院去世（葬于拉塞雷纳）。骑兵出身的将军，1895年入军校，曾赴德国汉诺威骑兵学校进修并名列第一。在伊瓦涅斯第一任政府中先后任战争部长、公共教育部长及警察总监。1931年4月至8月任陆军总司令。1932年智利政局动荡、\"社会主义共和国\"昙花一现之际，他在达维拉的临时政府中任内政部长；达维拉下台后，他于9月13日就任共和国临时总统。然而安托法加斯塔与康塞普西翁卫戍部队发动要求恢复宪政的军民起义，他选择交权而非动武，于10月2日将权力移交最高法院院长阿夫拉罕·奥亚内德尔，由后者召集大选，结果亚历山德里第三度当选。"
  CHL_bartolome_blanche_desc:0 "全名巴托洛梅·吉列尔莫·布兰切·埃斯佩霍，1879年6月6日生于拉塞雷纳，1970年6月10日在圣地亚哥军医院去世（葬于拉塞雷纳）。骑兵出身的将军，1895年入军校，曾赴德国汉诺威骑兵学校进修并名列第一。在伊瓦涅斯第一任政府中先后任战争部长、公共教育部长及警察总监。1931年4月至8月任陆军总司令。1932年智利政局动荡、\"社会主义共和国\"昙花一现之际，他在达维拉的临时政府中任内政部长；达维拉下台后，他于9月13日就任共和国临时总统。然而安托法加斯塔与康塞普西翁卫戍部队发动要求恢复宪政的军民起义，他选择交权而非动武，于10月2日将权力移交最高法院院长阿夫拉罕·奥亚内德尔，由后者召集大选，结果亚历山德里第三度当选。"
  CBIO_CHL_francisco_valderrama_desc:0 "全名弗朗西斯科·哈维尔·迪亚斯·巴尔德拉马，1877年4月5日生于圣克鲁斯，1950年在圣地亚哥去世（确切日期无记载）。工程兵出身的师级将军，1927–1930年任陆军总监（当时全军最高职位）。早年曾在德国受训，亦曾任驻哥伦比亚军事教官，是智利语言学院院士与多部军事史著作的作者。退役后成为智利法西斯运动的开创者：创建\"智利国家主义行动\"（智利第一个纳粹团体），并与凯勒、冯·马雷斯共同于1932年创建国家社会主义运动（MNS）——1932年3月他邀凯勒到家中商谈、出示自译的德国纳粹党纲，直接促成同年4月MNS的成立；旋因主张照搬德式纳粹而与二人分道，另组短命的\"国家社会主义军团\"。他公开宣扬反犹，与德国侨界及亲纳粹组织往来密切，二战期间为塞拉诺的种族主义刊物撰稿。"
  CHL_francisco_valderrama_advisor_desc:0 "全名弗朗西斯科·哈维尔·迪亚斯·巴尔德拉马，1877年4月5日生于圣克鲁斯，1950年在圣地亚哥去世（确切日期无记载）。工程兵出身的师级将军，1927–1930年任陆军总监（当时全军最高职位）。早年曾在德国受训，亦曾任驻哥伦比亚军事教官，是智利语言学院院士与多部军事史著作的作者。退役后成为智利法西斯运动的开创者：创建\"智利国家主义行动\"（智利第一个纳粹团体），并与凯勒、冯·马雷斯共同于1932年创建国家社会主义运动（MNS）——1932年3月他邀凯勒到家中商谈、出示自译的德国纳粹党纲，直接促成同年4月MNS的成立；旋因主张照搬德式纳粹而与二人分道，另组短命的\"国家社会主义军团\"。他公开宣扬反犹，与德国侨界及亲纳粹组织往来密切，二战期间为塞拉诺的种族主义刊物撰稿。"
