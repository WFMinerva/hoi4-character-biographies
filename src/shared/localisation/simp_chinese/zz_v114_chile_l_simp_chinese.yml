  CHL_arturo_benitez_theorist_desc:0 "智利航空之父，圣地亚哥国际机场即以其命名。1888年5月17日生于奇廉，1970年5月2日因中风在圣地亚哥去世，享年81岁。陆军炮兵军官出身，1903年入军校，1908年以少尉毕业。自1910年代起长期致力于将航空引入智利军事与民用体系，被后世誉为\"智利航空之父\"。1926年出任军事航空学校校长，1928年升任航空总监并创建智利航空俱乐部。1929年他主导开辟了圣地亚哥至阿里卡的航空邮递线路，这一举措直接催生了智利国家航空公司（LAN，今LATAM前身）的设立——这是拉丁美洲最早的国家航空公司之一。1924年\"佩剑之声\"军人政治运动期间他是积极参与者。1930年3月21日，在他的持续推动下，伊瓦涅斯总统签署法令正式创建智利空军（FACh），他出任首任空军司令兼首任航空副部长；同年他还推动在塞里约斯建立了柯蒂斯飞机制造厂。1932年退役，获\"空军准将\"（Comodoro）军衔。退役后长期参与LAN的经营管理，1952年再度出任LAN主席，持续推动智利航空网络向南部与极地延伸。政治上以\"左翼民族主义者\"自居，晚年是萨尔瓦多·阿连德的热情支持者。"
  CBIO_CHL_arnaldo_carrasco_desc:0 "1894年5月10日生于奥索尔诺省的罗布莱，父多洛里多·卡拉斯科，母克劳迪纳·卡拉斯科，1987年3月6日在圣地亚哥去世，享年92岁。陆军军官与军事飞行员。1910年军校毕业，曾赴美国空军进修，1923年取得军事飞行员资格。1933–1934年任陆军副部（SubsecretaríadeGuerra）机密科科长，1934年代理副部长。1939年出任军事学校校长，任职五年（至1944年）。1944年晋升准将，同年由里奥斯总统任命为国防部长，此后延续至杜阿尔德代理总统任期（1944–1946），其间还于1946年短暂代理司法部长。1946年退役。退役后转入外交领域，1947年任驻加拿大大使，1953–1954年任驻巴西大使，并曾出任智利在秘鲁—厄瓜多尔边境冲突中的担保国代表（驻阿根廷、巴西）。"
  CHL_arnaldo_carrasco_desc:0 "1894年5月10日生于奥索尔诺省的罗布莱，父多洛里多·卡拉斯科，母克劳迪纳·卡拉斯科，1987年3月6日在圣地亚哥去世，享年92岁。陆军军官与军事飞行员。1910年军校毕业，曾赴美国空军进修，1923年取得军事飞行员资格。1933–1934年任陆军副部（SubsecretaríadeGuerra）机密科科长，1934年代理副部长。1939年出任军事学校校长，任职五年（至1944年）。1944年晋升准将，同年由里奥斯总统任命为国防部长，此后延续至杜阿尔德代理总统任期（1944–1946），其间还于1946年短暂代理司法部长。1946年退役。退役后转入外交领域，1947年任驻加拿大大使，1953–1954年任驻巴西大使，并曾出任智利在秘鲁—厄瓜多尔边境冲突中的担保国代表（驻阿根廷、巴西）。"
  CBIO_CHL_antoine_iii_desc:0 "\"安托万三世\"（AntoineIII）的真名是雅克-安托万·贝尔纳（Jacques-AntoineBernard），1880年生于巴黎，1952年在巴黎去世，终身旅居法国，从未踏足智利或阿根廷。他是法国知名出版商，曾长期主持\"法国信使出版社\"（MercuredeFrance）编辑工作。他自1916年起以\"阿劳卡尼亚—巴塔哥尼亚国王安托万三世\"自称，直至1952年去世——其王位头衔承自母亲劳尔-泰蕾兹一世（即劳尔-泰蕾兹·克罗，1856–1916），而这一称号的源头可追溯至一场1860年代的法国冒险传奇。彼时法国佩里戈尔律师奥雷利-安托万·德·图南斯闯入马普切领地，自封\"奥雷利-安托万一世\"，宣布建立以法国为靠山的\"阿劳卡尼亚—巴塔哥尼亚王国\"；1862年他被智利军队逮捕、被法院宣判为疯人后驱逐回法国，1878年在穷困中去世。此后在法国，图南斯的前秘书、助手与仰慕者以\"遗嘱传承\"为由相继自立，形成了一条完全在巴黎运作、无领土、无臣民、无任何国际承认的虚幻\"王位\"传承链——安托万三世即此链中的第五位自封者。"
  CHL_antoine_iii_desc:0 "\"安托万三世\"（AntoineIII）的真名是雅克-安托万·贝尔纳（Jacques-AntoineBernard），1880年生于巴黎，1952年在巴黎去世，终身旅居法国，从未踏足智利或阿根廷。他是法国知名出版商，曾长期主持\"法国信使出版社\"（MercuredeFrance）编辑工作。他自1916年起以\"阿劳卡尼亚—巴塔哥尼亚国王安托万三世\"自称，直至1952年去世——其王位头衔承自母亲劳尔-泰蕾兹一世（即劳尔-泰蕾兹·克罗，1856–1916），而这一称号的源头可追溯至一场1860年代的法国冒险传奇。彼时法国佩里戈尔律师奥雷利-安托万·德·图南斯闯入马普切领地，自封\"奥雷利-安托万一世\"，宣布建立以法国为靠山的\"阿劳卡尼亚—巴塔哥尼亚王国\"；1862年他被智利军队逮捕、被法院宣判为疯人后驱逐回法国，1878年在穷困中去世。此后在法国，图南斯的前秘书、助手与仰慕者以\"遗嘱传承\"为由相继自立，形成了一条完全在巴黎运作、无领土、无臣民、无任何国际承认的虚幻\"王位\"传承链——安托万三世即此链中的第五位自封者。"
  CBIO_CHL_juan_antonio_rios_desc:0 "1888年11月10日生于比奥比奥的卡涅特，1946年6月27日在圣地亚哥因病去世（任内未竟）。律师、激进党政治家，1942至1946年任智利总统。早年从政，历任众议员、参议员。1942年2月大选中他代表激进党获胜，同年4月就任总统——接替代理总统门德斯（门德斯自阿吉雷·塞尔达1941年11月病逝后代行总统职权）。执政初期他维持智利在二战中的中立立场，但随着战局发展与美国压力增大，1943年智利与轴心国断交。任内他支持工业化（续推CORFO）、扩大社会保障，并于1945年在拉丁美洲较早地与苏联建交。1945年底他因癌症病重，无法继续理政，1946年1月将职权移交内政部长佩德罗·恩里克·阿方索代行——阿方索主持了1946年总统大选的组织工作。里奥斯于同年6月27日去世，继任者冈萨雷斯·魏地拉于11月就职。"
  CHL_juan_antonio_rios_desc:0 "1888年11月10日生于比奥比奥的卡涅特，1946年6月27日在圣地亚哥因病去世（任内未竟）。律师、激进党政治家，1942至1946年任智利总统。早年从政，历任众议员、参议员。1942年2月大选中他代表激进党获胜，同年4月就任总统——接替代理总统门德斯（门德斯自阿吉雷·塞尔达1941年11月病逝后代行总统职权）。执政初期他维持智利在二战中的中立立场，但随着战局发展与美国压力增大，1943年智利与轴心国断交。任内他支持工业化（续推CORFO）、扩大社会保障，并于1945年在拉丁美洲较早地与苏联建交。1945年底他因癌症病重，无法继续理政，1946年1月将职权移交内政部长佩德罗·恩里克·阿方索代行——阿方索主持了1946年总统大选的组织工作。里奥斯于同年6月27日去世，继任者冈萨雷斯·魏地拉于11月就职。"
  CBIO_CHL_fernando_alessandri_desc:0 "1897年5月10日生于圣地亚哥，1982年12月14日在圣地亚哥去世。律师、自由党政治家，阿图罗·亚历山德里总统之子、豪尔赫·亚历山德里总统之兄。智利大学法学院毕业后从事律师业与法学教育，后出任智利律师公会主席、智利大学法学院院长。1946年总统大选中他作为自由党候选人参选，但右翼选票在他与保守党—国民方阵候选人克鲁斯-科克之间分裂——克鲁斯-科克获约29.8%、亚历山德里获较低票数，两人合计虽超过激进党的冈萨雷斯·魏地拉，但因分票效应而双双落败，冈萨雷斯·魏地拉以相对多数当选。这次右翼分裂是1946年大选的关键转折。"
  CHL_fernando_alessandri_desc:0 "1897年5月10日生于圣地亚哥，1982年12月14日在圣地亚哥去世。律师、自由党政治家，阿图罗·亚历山德里总统之子、豪尔赫·亚历山德里总统之兄。智利大学法学院毕业后从事律师业与法学教育，后出任智利律师公会主席、智利大学法学院院长。1946年总统大选中他作为自由党候选人参选，但右翼选票在他与保守党—国民方阵候选人克鲁斯-科克之间分裂——克鲁斯-科克获约29.8%、亚历山德里获较低票数，两人合计虽超过激进党的冈萨雷斯·魏地拉，但因分票效应而双双落败，冈萨雷斯·魏地拉以相对多数当选。这次右翼分裂是1946年大选的关键转折。"

