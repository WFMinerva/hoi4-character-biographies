  CBIO_CHL_peter_hansen_desc:0 "全名彼得·阿道夫·凯撒·汉森，1896年9月30日生于圣地亚哥，德意混血，1967年5月23日在西德菲尔森去世。一战时志愿加入德意志帝国陆军（炮兵，晋升中尉）。战后返回智利；1933年希特勒上台后再赴德国，加入党卫队（SS）与纳粹党。1940年编入新建的武装党卫军（Waffen-SS），是最早的非欧裔成员之一。1943年在库尔斯克会战中随\"肯普夫\"集团作战；其后参与组建拉脱维亚党卫军师，并训练、指挥由萨罗傀儡政权意大利人组成的第29武装党卫军师，在意大利从事反游击作战——此类作战常伴随对平民的暴行——1944年参加安齐奥战役。军衔至党卫队旅队长（SS-Brigadeführer）。战后因智利已加入同盟国一方、党卫队被判定为犯罪组织，他无法返回故国，最终客死西德。"
  CHL_peter_hansen_desc:0 "全名彼得·阿道夫·凯撒·汉森，1896年9月30日生于圣地亚哥，德意混血，1967年5月23日在西德菲尔森去世。一战时志愿加入德意志帝国陆军（炮兵，晋升中尉）。战后返回智利；1933年希特勒上台后再赴德国，加入党卫队（SS）与纳粹党。1940年编入新建的武装党卫军（Waffen-SS），是最早的非欧裔成员之一。1943年在库尔斯克会战中随\"肯普夫\"集团作战；其后参与组建拉脱维亚党卫军师，并训练、指挥由萨罗傀儡政权意大利人组成的第29武装党卫军师，在意大利从事反游击作战——此类作战常伴随对平民的暴行——1944年参加安齐奥战役。军衔至党卫队旅队长（SS-Brigadeführer）。战后因智利已加入同盟国一方、党卫队被判定为犯罪组织，他无法返回故国，最终客死西德。"
  CBIO_CHL_rafael_reyes_desc:0 "1897年3月11日生，1964年去世。陆军将领，1950年1月9日至1952年10月28日任陆军总司令。亦是击剑选手，曾代表智利参加1924年巴黎奥运会个人佩剑赛。"
  CHL_rafael_reyes_desc:0 "1897年3月11日生，1964年去世。陆军将领，1950年1月9日至1952年10月28日任陆军总司令。亦是击剑选手，曾代表智利参加1924年巴黎奥运会个人佩剑赛。"
  CBIO_CHL_manuel_pedregal_desc:0 "全名曼努埃尔·圣地亚哥·孔查·佩德雷加尔，1881年11月22日生于圣地亚哥的名门世家（卡萨孔查侯爵后裔），1939年9月7日在圣地亚哥去世。职业警官，1931年8月6日由代理总统奥帕索任命为武装警察总监，是首位出身警界（而非陆军）执掌该机构的主官。1932年4月20日，国会立法（第5.109号法）增设\"将级总监\"军衔，翌日他获晋将军，成为首位由警界擢升、获此军衔的将领，标志着武装警察自陆军彻底独立、此后均由警察军官统领。数月后因健康原因辞职（适逢1932年6月反蒙特罗政变）。"
  CHL_manuel_pedregal_desc:0 "全名曼努埃尔·圣地亚哥·孔查·佩德雷加尔，1881年11月22日生于圣地亚哥的名门世家（卡萨孔查侯爵后裔），1939年9月7日在圣地亚哥去世。职业警官，1931年8月6日由代理总统奥帕索任命为武装警察总监，是首位出身警界（而非陆军）执掌该机构的主官。1932年4月20日，国会立法（第5.109号法）增设\"将级总监\"军衔，翌日他获晋将军，成为首位由警界擢升、获此军衔的将领，标志着武装警察自陆军彻底独立、此后均由警察军官统领。数月后因健康原因辞职（适逢1932年6月反蒙特罗政变）。"
  CBIO_CHL_manuel_manquilef_desc:0 "全名曼努埃尔·塞贡多·曼基莱夫·冈萨雷斯，1887年5月31日生于今阿劳卡尼亚的梅特伦科，是lonko（马普切首领）之子，1950年6月12日在特木科去世。师范出身的教师、作家与翻译家，被视为首位以本名发表马普切语言与文化研究的马普切知识分子（与格瓦拉合著《阿劳卡心理学》《阿劳卡民俗》，著双语《阿劳卡人评注》）。1910年与一批马普切领袖共同创建\"阿劳卡尼亚保卫会\"（SociedadCaupolicán），1916、1920年两度当选会长，主导该会至1925年。属自由民主党，1926–1930及1930–1934年两任众议员，是智利最早的马普切国会议员之一。任内主导起草了1927年第4.169号《原住民社区分割法》，主张以土地私有与教育推动马普切融入智利——此立场与阿布尔托·潘吉莱夫等自治派相左；1930年代他与保卫会渐行渐远。1936–1937年由亚历山德里委任为劳塔罗县长。"
  CHL_manuel_manquilef_desc:0 "全名曼努埃尔·塞贡多·曼基莱夫·冈萨雷斯，1887年5月31日生于今阿劳卡尼亚的梅特伦科，是lonko（马普切首领）之子，1950年6月12日在特木科去世。师范出身的教师、作家与翻译家，被视为首位以本名发表马普切语言与文化研究的马普切知识分子（与格瓦拉合著《阿劳卡心理学》《阿劳卡民俗》，著双语《阿劳卡人评注》）。1910年与一批马普切领袖共同创建\"阿劳卡尼亚保卫会\"（SociedadCaupolicán），1916、1920年两度当选会长，主导该会至1925年。属自由民主党，1926–1930及1930–1934年两任众议员，是智利最早的马普切国会议员之一。任内主导起草了1927年第4.169号《原住民社区分割法》，主张以土地私有与教育推动马普切融入智利——此立场与阿布尔托·潘吉莱夫等自治派相左；1930年代他与保卫会渐行渐远。1936–1937年由亚历山德里委任为劳塔罗县长。"
  CBIO_CHL_quintin_lame_desc:0 "1880年10月26日生于哥伦比亚考卡省波帕扬近郊的波林达拉庄园，1967年10月7日在托利马省奥尔特加去世。他是纳萨（派斯）族原住民领袖、自学成才的维权者与作家。20世纪上半叶，他在考卡、惠拉、托利马等省组织原住民反抗\"terraje\"（佃役）剥削、争取归还保留地（resguardo），屡遭监禁仍坚持以法律手段抗争，1938年促成奥尔特加与查帕拉尔保留地的归还。著有《在哥伦比亚丛林中受教育的印第安人的思想》（生前未刊，1971年方出版）。其精神在1980年代催生了以他命名的\"金廷·拉梅武装运动\"——拉美第一支原住民游击队。"
  CHL_quintin_lame_desc:0 "1880年10月26日生于哥伦比亚考卡省波帕扬近郊的波林达拉庄园，1967年10月7日在托利马省奥尔特加去世。他是纳萨（派斯）族原住民领袖、自学成才的维权者与作家。20世纪上半叶，他在考卡、惠拉、托利马等省组织原住民反抗\"terraje\"（佃役）剥削、争取归还保留地（resguardo），屡遭监禁仍坚持以法律手段抗争，1938年促成奥尔特加与查帕拉尔保留地的归还。著有《在哥伦比亚丛林中受教育的印第安人的思想》（生前未刊，1971年方出版）。其精神在1980年代催生了以他命名的\"金廷·拉梅武装运动\"——拉美第一支原住民游击队。"
  CBIO_CHL_gregorio_tascon_desc:0 "格雷戈里奥·罗德里格斯·塔斯孔，1901年生，1980年在智利去世。智利陆军将领，绰号\"戈伊托\"，以开创智利军事地缘政治学术传统著称。在智利战争学院主持地理与地缘政治讲席，并亲历智利早期南极探险，于同辈军人中声誉卓著。门下弟子包括日后的陆军总司令勒内·施奈德与卡洛斯·普拉斯，以及奥古斯托·皮诺切特——对皮诺切特他既是学术引路人，于1952年将其推荐为讲席助教、后又举荐其接任正职；却也在1960年代识破皮诺切特所著《地缘政治》（1968年）大段抄袭了他本人1949年在战争学院所作同名讲演，拒绝为该书作序，二人关系就此疏远。1961年退役后，他出任外交部所属智利边界委员会主席，主持与阿根廷的拉古纳德尔德西尔托等系列领土争端，多次亲率测量队进入争议地带，数度与阿根廷宪兵对峙乃至交火。政治上他是共济会会员、立场偏左，1973年政变后的皮诺切特政权与其理念迥异。"
  CHL_gregorio_tascon_desc:0 "格雷戈里奥·罗德里格斯·塔斯孔，1901年生，1980年在智利去世。智利陆军将领，绰号\"戈伊托\"，以开创智利军事地缘政治学术传统著称。在智利战争学院主持地理与地缘政治讲席，并亲历智利早期南极探险，于同辈军人中声誉卓著。门下弟子包括日后的陆军总司令勒内·施奈德与卡洛斯·普拉斯，以及奥古斯托·皮诺切特——对皮诺切特他既是学术引路人，于1952年将其推荐为讲席助教、后又举荐其接任正职；却也在1960年代识破皮诺切特所著《地缘政治》（1968年）大段抄袭了他本人1949年在战争学院所作同名讲演，拒绝为该书作序，二人关系就此疏远。1961年退役后，他出任外交部所属智利边界委员会主席，主持与阿根廷的拉古纳德尔德西尔托等系列领土争端，多次亲率测量队进入争议地带，数度与阿根廷宪兵对峙乃至交火。政治上他是共济会会员、立场偏左，1973年政变后的皮诺切特政权与其理念迥异。"
  CBIO_CHL_humberto_valdivieso_desc:0 "全名温贝托·阿里亚加达·巴尔迪维耶索，1892年3月24日生于塔尔卡，1942年12月12日在圣地亚哥去世。1908年入军校、1911年转入警界。1932年6月27日至1938年12月29日任武装警察总监。任内重视警员福利，创办合作社与夏令营，并发起兴建武装警察医院（1937年奠基，其身后1945年落成）。然而其任内发生了1938年9月5日的\"劳工保险局惨案\"：纳粹派青年发动政变失败、缴械投降后，在他奉亚历山德里总统之命亲自指挥的武装警察行动中，约59名缴械者被枪杀。屠杀的最终命令普遍被归于亚历山德里（多位在场者记下总统的处决口令），阿里亚加达本人则在公文中称系奉总统\"明令\"行事，但亦有目击者记下他下达的处决命令——责任在两人之间至今存争议。事后他被迫退役。"
  CHL_humberto_valdivieso_desc:0 "全名温贝托·阿里亚加达·巴尔迪维耶索，1892年3月24日生于塔尔卡，1942年12月12日在圣地亚哥去世。1908年入军校、1911年转入警界。1932年6月27日至1938年12月29日任武装警察总监。任内重视警员福利，创办合作社与夏令营，并发起兴建武装警察医院（1937年奠基，其身后1945年落成）。然而其任内发生了1938年9月5日的\"劳工保险局惨案\"：纳粹派青年发动政变失败、缴械投降后，在他奉亚历山德里总统之命亲自指挥的武装警察行动中，约59名缴械者被枪杀。屠杀的最终命令普遍被归于亚历山德里（多位在场者记下总统的处决口令），阿里亚加达本人则在公文中称系奉总统\"明令\"行事，但亦有目击者记下他下达的处决命令——责任在两人之间至今存争议。事后他被迫退役。"
  CBIO_CHL_venancio_huenchual_desc:0 "全名韦南西奥·科涅潘·韦丘亚尔，1905年12月25日生于考廷省的皮乌琴，出自一个自独立战争时期即活跃于智利的马普切lof（家族），祖上曾是占领阿劳卡尼亚时期的著名lonko，1968年4月30日去世（5月4日在特木科举行国葬）。马普切农人与政治家。1931年出任\"阿劳卡尼亚保卫会\"会长；1939年创建\"阿劳卡尼亚公司\"（CorporaciónAraucana），成为当时最有影响力的马普切组织，这一时期他倾向伊瓦涅斯主义。1937、1941年两度竞选众议员落败；1940年作为唯一的智利原住民代表，出席在墨西哥帕茨夸罗召开的首届美洲原住民大会。其后于1945、1949、1965年三度当选众议员，1947年加入保守党。1952–1953年任伊瓦涅斯政府的土地与殖民部长，是智利历史上首位原住民国务部长，并自1953年起首任原住民事务司（DASIN）司长。被史家视为智利当代最具影响力的马普切政治人物。"
  CHL_venancio_huenchual_desc:0 "全名韦南西奥·科涅潘·韦丘亚尔，1905年12月25日生于考廷省的皮乌琴，出自一个自独立战争时期即活跃于智利的马普切lof（家族），祖上曾是占领阿劳卡尼亚时期的著名lonko，1968年4月30日去世（5月4日在特木科举行国葬）。马普切农人与政治家。1931年出任\"阿劳卡尼亚保卫会\"会长；1939年创建\"阿劳卡尼亚公司\"（CorporaciónAraucana），成为当时最有影响力的马普切组织，这一时期他倾向伊瓦涅斯主义。1937、1941年两度竞选众议员落败；1940年作为唯一的智利原住民代表，出席在墨西哥帕茨夸罗召开的首届美洲原住民大会。其后于1945、1949、1965年三度当选众议员，1947年加入保守党。1952–1953年任伊瓦涅斯政府的土地与殖民部长，是智利历史上首位原住民国务部长，并自1953年起首任原住民事务司（DASIN）司长。被史家视为智利当代最具影响力的马普切政治人物。"
  CBIO_CHL_ricardo_aguayo_desc:0 "全名里卡多·丰塞卡·阿瓜约，1906年1月17日生于太平洋岸边的萨韦德拉港，教师出身的智利共产党人，1949年7月21日在党总书记任内病逝，年仅43岁。1923年于维多利亚师范学校取得小学教师资格，1924–1937年在瓦尔迪维亚、莫利纳、圣地亚哥等地任教。1929年入党，历任圣地亚哥区委书记（1933–1934）、中央委员，并于1936、1937、1938年任共产主义青年团总书记。1940年参与创办并主编党报《世纪报》（ElSiglo）。1941年起当选塔拉帕卡（阿里卡、伊基克、皮萨瓜）众议员，连任至1949年。1946年10月31日继孔特雷拉斯·拉瓦尔卡之后出任党总书记，任内恰逢1948年《保卫民主法》（民众称\"该死的法律\"）将共产党取缔、党转入地下、遭受迫害的艰难时期。其病逝后由加洛·冈萨雷斯接任。"
  CHL_ricardo_aguayo_advisor_desc:0 "全名里卡多·丰塞卡·阿瓜约，1906年1月17日生于太平洋岸边的萨韦德拉港，教师出身的智利共产党人，1949年7月21日在党总书记任内病逝，年仅43岁。1923年于维多利亚师范学校取得小学教师资格，1924–1937年在瓦尔迪维亚、莫利纳、圣地亚哥等地任教。1929年入党，历任圣地亚哥区委书记（1933–1934）、中央委员，并于1936、1937、1938年任共产主义青年团总书记。1940年参与创办并主编党报《世纪报》（ElSiglo）。1941年起当选塔拉帕卡（阿里卡、伊基克、皮萨瓜）众议员，连任至1949年。1946年10月31日继孔特雷拉斯·拉瓦尔卡之后出任党总书记，任内恰逢1948年《保卫民主法》（民众称\"该死的法律\"）将共产党取缔、党转入地下、遭受迫害的艰难时期。其病逝后由加洛·冈萨雷斯接任。"
