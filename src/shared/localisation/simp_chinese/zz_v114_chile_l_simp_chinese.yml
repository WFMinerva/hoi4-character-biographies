  CHL_ricardo_aguayo_desc:0 "全名里卡多·丰塞卡·阿瓜约，1906年1月17日生于太平洋岸边的萨韦德拉港，教师出身的智利共产党人，1949年7月21日在党总书记任内病逝，年仅43岁。1923年于维多利亚师范学校取得小学教师资格，1924–1937年在瓦尔迪维亚、莫利纳、圣地亚哥等地任教。1929年入党，历任圣地亚哥区委书记（1933–1934）、中央委员，并于1936、1937、1938年任共产主义青年团总书记。1940年参与创办并主编党报《世纪报》（ElSiglo）。1941年起当选塔拉帕卡（阿里卡、伊基克、皮萨瓜）众议员，连任至1949年。1946年10月31日继孔特雷拉斯·拉瓦尔卡之后出任党总书记，任内恰逢1948年《保卫民主法》（民众称\"该死的法律\"）将共产党取缔、党转入地下、遭受迫害的艰难时期。其病逝后由加洛·冈萨雷斯接任。"
  CBIO_CHL_augustin_de_guevara_desc:0 "全名阿古斯丁·莫雷诺·拉德隆·德·格瓦拉，1879年1月24日生于兰卡瓜，1964年8月17日在兰卡瓜去世。陆军师级将军。1895年入军校，1897年毕业。1913年任总参谋部军官并赴智利驻德军事委员会；一战期间任驻奥匈帝国（维也纳）使馆武官，密切关注战局（其时智利中立）。归国后历任要职，1927年晋准将。1929年4月14日至10月11日任武装警察总监（Carabineros创立初期主官之一）。1931年晋师级将军。1932年政局剧烈动荡、\"社会主义共和国\"前后的乱局中，他于6月15日至8月2日由达维拉政府任命为陆军总司令，旋即退役。"
  CHL_augustin_de_guevara_desc:0 "全名阿古斯丁·莫雷诺·拉德隆·德·格瓦拉，1879年1月24日生于兰卡瓜，1964年8月17日在兰卡瓜去世。陆军师级将军。1895年入军校，1897年毕业。1913年任总参谋部军官并赴智利驻德军事委员会；一战期间任驻奥匈帝国（维也纳）使馆武官，密切关注战局（其时智利中立）。归国后历任要职，1927年晋准将。1929年4月14日至10月11日任武装警察总监（Carabineros创立初期主官之一）。1931年晋师级将军。1932年政局剧烈动荡、\"社会主义共和国\"前后的乱局中，他于6月15日至8月2日由达维拉政府任命为陆军总司令，旋即退役。"
  CBIO_CHL_arturo_espinoza_mujica_desc:0 "全名卡洛斯·阿图罗·埃斯皮诺萨·穆希卡，1890年12月16日生于特木科，1978年在圣地亚哥去世（确切日期无记载）。步兵出身的陆军军官，1909年入军校。晋升师级将军后，于1939年出任陆军第二师师长——该职此前由阿里奥斯托·埃雷拉担任，埃雷拉因1939年\"阿里奥斯塔索\"政变去职。1940年出任智利驻美军事使团团长。1943年8月12日起以代理（suplente）身份出任陆军总司令，至1944年10月。"
  CHL_arturo_espinoza_mujica_desc:0 "全名卡洛斯·阿图罗·埃斯皮诺萨·穆希卡，1890年12月16日生于特木科，1978年在圣地亚哥去世（确切日期无记载）。步兵出身的陆军军官，1909年入军校。晋升师级将军后，于1939年出任陆军第二师师长——该职此前由阿里奥斯托·埃雷拉担任，埃雷拉因1939年\"阿里奥斯塔索\"政变去职。1940年出任智利驻美军事使团团长。1943年8月12日起以代理（suplente）身份出任陆军总司令，至1944年10月。"
  CBIO_CHL_alfredo_portales_mourgues_desc:0 "全名阿尔弗雷多·波塔莱斯·穆尔格斯，1892年1月20日生于圣地亚哥，出自智利显赫的波塔莱斯家族（与建构智利保守制国家的迭戈·波塔莱斯同宗）。1906年14岁入军校，1918–1920年就读战争学院。1927年由伊瓦涅斯任命为公共教育部体育司司长。1943年11月8日起以代理身份出任陆军总司令，1944年转为正职，至1945年11月12日退役。1945年以陆军总司令身份赴阿根廷，主持智利独立战争阵亡将士遗骸归国的仪式。"
  CHL_alfredo_portales_mourgues_desc:0 "全名阿尔弗雷多·波塔莱斯·穆尔格斯，1892年1月20日生于圣地亚哥，出自智利显赫的波塔莱斯家族（与建构智利保守制国家的迭戈·波塔莱斯同宗）。1906年14岁入军校，1918–1920年就读战争学院。1927年由伊瓦涅斯任命为公共教育部体育司司长。1943年11月8日起以代理身份出任陆军总司令，1944年转为正职，至1945年11月12日退役。1945年以陆军总司令身份赴阿根廷，主持智利独立战争阵亡将士遗骸归国的仪式。"
  CBIO_CHL_ariosto_herrera_desc:0 "全名达尼埃尔·阿里奥斯托·埃雷拉·拉米雷斯，1892年7月21日生于圣地亚哥，是太平洋战争英雄埃莱乌特里奥·拉米雷斯之外孙、阿尔贝托·埃雷拉将军之子，1952年8月7日因心脏病在普丘卡维去世（归葬圣地亚哥总公墓）。1907年入军校。曾任驻墨索里尼意大利的军事武官，期间吸收法西斯思想、公开崇拜法西斯。1938年9月晋升将军，1939年2月任陆军第二师师长兼圣地亚哥卫戍司令。1939年5月21日，在拉莫内达宫前的阅兵式上，他亲手扯下一面红旗。此后他被勒令退役，并力劝前总统伊瓦涅斯发动政变。1939年8月25日，他与伊瓦涅斯前往圣地亚哥的塔克纳团，企图煽动哗变、迫使阿吉雷·塞尔达政府下台，即所谓\"阿里奥斯塔索\"；但团长卢科上校已得密报，当场将其逮捕，政变迅即瓦解。他被判处20年流放巴拉圭并永久剥夺公职。阿吉雷·塞尔达去世后他返回智利。"
  CHL_ariosto_herrera_desc:0 "全名达尼埃尔·阿里奥斯托·埃雷拉·拉米雷斯，1892年7月21日生于圣地亚哥，是太平洋战争英雄埃莱乌特里奥·拉米雷斯之外孙、阿尔贝托·埃雷拉将军之子，1952年8月7日因心脏病在普丘卡维去世（归葬圣地亚哥总公墓）。1907年入军校。曾任驻墨索里尼意大利的军事武官，期间吸收法西斯思想、公开崇拜法西斯。1938年9月晋升将军，1939年2月任陆军第二师师长兼圣地亚哥卫戍司令。1939年5月21日，在拉莫内达宫前的阅兵式上，他亲手扯下一面红旗。此后他被勒令退役，并力劝前总统伊瓦涅斯发动政变。1939年8月25日，他与伊瓦涅斯前往圣地亚哥的塔克纳团，企图煽动哗变、迫使阿吉雷·塞尔达政府下台，即所谓\"阿里奥斯塔索\"；但团长卢科上校已得密报，当场将其逮捕，政变迅即瓦解。他被判处20年流放巴拉圭并永久剥夺公职。阿吉雷·塞尔达去世后他返回智利。"
  CBIO_CHL_marmaduke_grove_desc:0 "1878年7月6日生于科皮亚波的激进党家庭（\"Marmaduke\"为爱尔兰名），1954年5月15日在圣地亚哥去世。1892年入海军学校，1894年因参与\"硬面包哗变\"在毕业前夕被开除；1897年改入军校（炮兵科），与伊瓦涅斯、普加同期。智利军事航空的奠基者之一。1924年参与\"佩剑之声\"，后因密谋反伊瓦涅斯被流放复活节岛。伊瓦涅斯垮台后，1932年2月被蒙特罗召回军中、任空军总司令；他随即于6月4日从埃尔博斯克空军基地发动政变，推翻蒙特罗、宣布成立\"社会主义共和国\"，自任国防部长（6月5–16日）。该政权仅存12天，6月16日被达维拉推翻，他再度被流放复活节岛。1932年10月总统选举，他在投票前两天才从流放地归来，仍以17.7%得票位居第二。1933年4月19日，他与施纳克、阿连德、马丁内斯等共同创建智利社会主义党，并以\"既无无地之人，亦无无人之地\"的口号闻名。1934–1949年任参议员，1938年起任社会党总书记兼人民阵线主席。1943年因路线分歧离开社会党、另组\"正统社会党\"。"
  CHL_marmaduke_grove_desc:0 "1878年7月6日生于科皮亚波的激进党家庭（\"Marmaduke\"为爱尔兰名），1954年5月15日在圣地亚哥去世。1892年入海军学校，1894年因参与\"硬面包哗变\"在毕业前夕被开除；1897年改入军校（炮兵科），与伊瓦涅斯、普加同期。智利军事航空的奠基者之一。1924年参与\"佩剑之声\"，后因密谋反伊瓦涅斯被流放复活节岛。伊瓦涅斯垮台后，1932年2月被蒙特罗召回军中、任空军总司令；他随即于6月4日从埃尔博斯克空军基地发动政变，推翻蒙特罗、宣布成立\"社会主义共和国\"，自任国防部长（6月5–16日）。该政权仅存12天，6月16日被达维拉推翻，他再度被流放复活节岛。1932年10月总统选举，他在投票前两天才从流放地归来，仍以17.7%得票位居第二。1933年4月19日，他与施纳克、阿连德、马丁内斯等共同创建智利社会主义党，并以\"既无无地之人，亦无无人之地\"的口号闻名。1934–1949年任参议员，1938年起任社会党总书记兼人民阵线主席。1943年因路线分歧离开社会党、另组\"正统社会党\"。"
  CBIO_CHL_emilio_soto_desc:0 "1891年8月23日生于圣地亚哥。智利海军军官，海军中将。1910年自海军学校毕业（任海军候补军官）。曾任舰队司令，1947年至1948年任海军总司令，1948年退役。其任内适逢1948年2月冈萨雷斯·魏地拉总统首次视察智利南极领地，他作为海军总司令随行。"
  CHL_emilio_soto_desc:0 "1891年8月23日生于圣地亚哥。智利海军军官，海军中将。1910年自海军学校毕业（任海军候补军官）。曾任舰队司令，1947年至1948年任海军总司令，1948年退役。其任内适逢1948年2月冈萨雷斯·魏地拉总统首次视察智利南极领地，他作为海军总司令随行。"
  CBIO_CHL_olegario_reyes_desc:0 "1879年10月1日生于瓦尔帕莱索。智利海军军官，海军中将。1897年任海军候补军官，逐级晋升，1926年晋少将、1932年晋中将。1932至1938年任海军总监（DirectorGeneraldelaArmada）；1938年2月1日该职改称\"海军总司令\"后，他是首位持此衔者，任至同年9月。"
  CHL_olegario_reyes_desc:0 "1879年10月1日生于瓦尔帕莱索。智利海军军官，海军中将。1897年任海军候补军官，逐级晋升，1926年晋少将、1932年晋中将。1932至1938年任海军总监（DirectorGeneraldelaArmada）；1938年2月1日该职改称\"海军总司令\"后，他是首位持此衔者，任至同年9月。"
  CBIO_CHL_julio_allard_pinto_desc:0 "1885年6月11日生于拉塞雷纳，1975年5月29日在比尼亚德尔马去世。智利海军军官，海军中将。曾指挥\"巴克达诺\"号等智利标志性舰艇。1938年起任海军总司令（其间一度与梅里诺·别利奇轮替），至1943年。其后短暂出任里奥斯政府的内政部长。"
  CHL_julio_allard_pinto_desc:0 "1885年6月11日生于拉塞雷纳，1975年5月29日在比尼亚德尔马去世。智利海军军官，海军中将。曾指挥\"巴克达诺\"号等智利标志性舰艇。1938年起任海军总司令（其间一度与梅里诺·别利奇轮替），至1943年。其后短暂出任里奥斯政府的内政部长。"
  CBIO_CHL_vincente_merino_bielich_desc:0 "1889年1月1日生于圣地亚哥，是太平洋战争与1891年内战老将、海军指挥官比森特·梅里诺·哈尔帕之子，母亲为秘鲁人埃斯特尔·别利奇，1977年1月30日在圣地亚哥去世。海军军人兼政治人物，海军中将。1944年1月10日起任海军总司令，至1947年退役。1946年1月经副总统杜阿尔德任命为内政部长，至9月6日。其间于1946年8月3日至13日，因杜阿尔德转而参加（旋即撤回的）总统竞选，他短暂代理共和国副总统。"
  CHL_vincente_merino_bielich_desc:0 "1889年1月1日生于圣地亚哥，是太平洋战争与1891年内战老将、海军指挥官比森特·梅里诺·哈尔帕之子，母亲为秘鲁人埃斯特尔·别利奇，1977年1月30日在圣地亚哥去世。海军军人兼政治人物，海军中将。1944年1月10日起任海军总司令，至1947年退役。1946年1月经副总统杜阿尔德任命为内政部长，至9月6日。其间于1946年8月3日至13日，因杜阿尔德转而参加（旋即撤回的）总统竞选，他短暂代理共和国副总统。"
  CHL_vincente_merino_bielich_naval_chief_desc:0 "1889年1月1日生于圣地亚哥，是太平洋战争与1891年内战老将、海军指挥官比森特·梅里诺·哈尔帕之子，母亲为秘鲁人埃斯特尔·别利奇，1977年1月30日在圣地亚哥去世。海军军人兼政治人物，海军中将。1944年1月10日起任海军总司令，至1947年退役。1946年1月经副总统杜阿尔德任命为内政部长，至9月6日。其间于1946年8月3日至13日，因杜阿尔德转而参加（旋即撤回的）总统竞选，他短暂代理共和国副总统。"
  CHL_vincente_merino_bielich_theorist_desc:0 "1889年1月1日生于圣地亚哥，是太平洋战争与1891年内战老将、海军指挥官比森特·梅里诺·哈尔帕之子，母亲为秘鲁人埃斯特尔·别利奇，1977年1月30日在圣地亚哥去世。海军军人兼政治人物，海军中将。1944年1月10日起任海军总司令，至1947年退役。1946年1月经副总统杜阿尔德任命为内政部长，至9月6日。其间于1946年8月3日至13日，因杜阿尔德转而参加（旋即撤回的）总统竞选，他短暂代理共和国副总统。"
  CBIO_CHL_ulk_desc:0 "乌尔克是阿图罗·亚历山德里·帕尔马总统的褐色大丹犬，被视为\"智利第一只总统犬\"。亚历山德里第二任期（1932–1938）间，乌尔克几乎形影不离地陪伴在总统身旁，出入拉莫内达宫与公共场合，成为总统的标志性形象之一。据报道，乌尔克约于1941年死去。死后其身体被制成标本，现藏于智利国家历史博物馆。"
  CHL_ulk_desc:0 "乌尔克是阿图罗·亚历山德里·帕尔马总统的褐色大丹犬，被视为\"智利第一只总统犬\"。亚历山德里第二任期（1932–1938）间，乌尔克几乎形影不离地陪伴在总统身旁，出入拉莫内达宫与公共场合，成为总统的标志性形象之一。据报道，乌尔克约于1941年死去。死后其身体被制成标本，现藏于智利国家历史博物馆。"
  CBIO_CHL_jose_morales_desc:0 "1888年7月8日生于圣地亚哥，1955年10月16日去世。医生、社会卫生学家与政治人物，智利公共卫生事业的早期推动者之一。1925年1月至3月的贝略·科德西多军政府中，他出任卫生、社会救助与福利部长，参与推动了一系列社会立法。同年总统选举中他以\"工薪阶级候选人\"身份参选，代表\"智利工薪共和联盟\"（USRACh），败于埃米利亚诺·费格罗亚。1927年伊瓦涅斯政府中他再任司法与卫生部长。此后长期从事公共卫生工作。1946年冈萨雷斯·魏地拉任命他为圣地亚哥市长（任至1950年），1947年兼任该届政府的卫生部长。是20世纪智利社会医学的关键人物之一。"
  CHL_jose_morales_desc:0 "1888年7月8日生于圣地亚哥，1955年10月16日去世。医生、社会卫生学家与政治人物，智利公共卫生事业的早期推动者之一。1925年1月至3月的贝略·科德西多军政府中，他出任卫生、社会救助与福利部长，参与推动了一系列社会立法。同年总统选举中他以\"工薪阶级候选人\"身份参选，代表\"智利工薪共和联盟\"（USRACh），败于埃米利亚诺·费格罗亚。1927年伊瓦涅斯政府中他再任司法与卫生部长。此后长期从事公共卫生工作。1946年冈萨雷斯·魏地拉任命他为圣地亚哥市长（任至1950年），1947年兼任该届政府的卫生部长。是20世纪智利社会医学的关键人物之一。"
  CBIO_CHL_jose_luis_sanchez_besa_desc:0 "1879年2月13日生于圣地亚哥的名门家庭（祖父为厄瓜多尔驻智利总领事、外祖父为银行家何塞·贝萨），1955年3月2日在巴黎去世。律师出身，但以航空先驱与飞机制造者闻名于世——他是拉美航空史上最早设计制造飞机并大规模量产的人物之一。青年时移居法国，1908年在巴黎结识了巴西航空之父桑托斯·杜蒙并见证其飞行。1909年他与埃米利奥·爱德华兹·贝略在兰斯举行的首届世界航空大会上成为最早驾驶飞机升空的智利人。此后他在布洛涅-比扬库尔创办飞机工厂，设计制造以自己姓名命名的\"桑切斯-贝萨\"系列双翼机，同时也是水上飞机的先驱者之一。第一次世界大战期间其工厂被法国政府征用——他最终拥有四座工厂、约五千名法国工人，制造了逾三千架飞机，销往世界各地。1950年获法国航空功勋勋章。"
  CHL_jose_luis_sanchez_besa_desc:0 "1879年2月13日生于圣地亚哥的名门家庭（祖父为厄瓜多尔驻智利总领事、外祖父为银行家何塞·贝萨），1955年3月2日在巴黎去世。律师出身，但以航空先驱与飞机制造者闻名于世——他是拉美航空史上最早设计制造飞机并大规模量产的人物之一。青年时移居法国，1908年在巴黎结识了巴西航空之父桑托斯·杜蒙并见证其飞行。1909年他与埃米利奥·爱德华兹·贝略在兰斯举行的首届世界航空大会上成为最早驾驶飞机升空的智利人。此后他在布洛涅-比扬库尔创办飞机工厂，设计制造以自己姓名命名的\"桑切斯-贝萨\"系列双翼机，同时也是水上飞机的先驱者之一。第一次世界大战期间其工厂被法国政府征用——他最终拥有四座工厂、约五千名法国工人，制造了逾三千架飞机，销往世界各地。1950年获法国航空功勋勋章。"
  CBIO_CHL_pedro_alfonso_desc:0 "1903年3月25日生于奥瓦列，1977年9月10日因心脏病在圣地亚哥去世。律师、教授、激进党政治家，先后在四位总统政府中任部长。1925年智利大学法学院毕业。1933–1938年任科金博众议员。1934年起出任激进党主席，并担任人民阵线主席。1938年12月24日由阿吉雷·塞尔达任命为内政部长（任内经历1939年奇廉大地震），次年转任财政部长（至1940年）。里奥斯政府中他于1945–1946年任经济与商业部长。冈萨雷斯·魏地拉政府中他于1950–1951年再任内政部长，期间因总统出访，于1950年4月11日至5月8日短暂代理副总统。1952年他代表激进党参选总统，获19.95%选票居第三，败于伊瓦涅斯。后任豪尔赫·亚历山德里政府农业部长（1963）。晚年创建\"民主激进党\"，反对人民团结政府。"
  CHL_pedro_alfonso_desc:0 "1903年3月25日生于奥瓦列，1977年9月10日因心脏病在圣地亚哥去世。律师、教授、激进党政治家，先后在四位总统政府中任部长。1925年智利大学法学院毕业。1933–1938年任科金博众议员。1934年起出任激进党主席，并担任人民阵线主席。1938年12月24日由阿吉雷·塞尔达任命为内政部长（任内经历1939年奇廉大地震），次年转任财政部长（至1940年）。里奥斯政府中他于1945–1946年任经济与商业部长。冈萨雷斯·魏地拉政府中他于1950–1951年再任内政部长，期间因总统出访，于1950年4月11日至5月8日短暂代理副总统。1952年他代表激进党参选总统，获19.95%选票居第三，败于伊瓦涅斯。后任豪尔赫·亚历山德里政府农业部长（1963）。晚年创建\"民主激进党\"，反对人民团结政府。"
  CBIO_CHL_gabriel_gonzales_videla_desc:0 "全名加夫列尔·冈萨雷斯·魏地拉，1898年11月22日生于拉塞雷纳，1980年8月22日在圣地亚哥去世。律师、激进党政治家，1946至1952年任智利总统。年轻时追随亚历山德里投身政治，历任众议员、参议员、驻法与驻巴西大使。1946年在共产党的关键支持下当选总统——他是大选中唯一向共产党许诺入阁的候选人，击败保守党的克鲁斯-科克与自由党的费尔南多·亚历山德里。上任初期确实延揽三名共产党人入阁。然而不到两年，他即转向反共：1948年推动国会通过第8.987号法《保卫民主永久法》（民众蔑称\"该死的法律\"），将共产党全面取缔，从选民名册中删除约两万六千名注册党员与同情者——其中包括为女性选举权奋斗的埃莱娜·卡法雷纳。大批共产党人、工会领袖、矿工遭逮捕，部分被关押在北部沙漠的皮萨瓜集中营，条件极其恶劣。曾为其助选的诗人聂鲁达公开谴责他为\"叛徒\"，遭通缉后骑马翻越安第斯山流亡。与此同时，他在1940年划定的基础上进一步巩固智利的南极主权主张，1948年亲赴南极视察。"
  CHL_gabriel_gonzales_videla_desc:0 "全名加夫列尔·冈萨雷斯·魏地拉，1898年11月22日生于拉塞雷纳，1980年8月22日在圣地亚哥去世。律师、激进党政治家，1946至1952年任智利总统。年轻时追随亚历山德里投身政治，历任众议员、参议员、驻法与驻巴西大使。1946年在共产党的关键支持下当选总统——他是大选中唯一向共产党许诺入阁的候选人，击败保守党的克鲁斯-科克与自由党的费尔南多·亚历山德里。上任初期确实延揽三名共产党人入阁。然而不到两年，他即转向反共：1948年推动国会通过第8.987号法《保卫民主永久法》（民众蔑称\"该死的法律\"），将共产党全面取缔，从选民名册中删除约两万六千名注册党员与同情者——其中包括为女性选举权奋斗的埃莱娜·卡法雷纳。大批共产党人、工会领袖、矿工遭逮捕，部分被关押在北部沙漠的皮萨瓜集中营，条件极其恶劣。曾为其助选的诗人聂鲁达公开谴责他为\"叛徒\"，遭通缉后骑马翻越安第斯山流亡。与此同时，他在1940年划定的基础上进一步巩固智利的南极主权主张，1948年亲赴南极视察。"
  CBIO_CHL_gabriela_mistral_desc:0 "本名卢西拉·戈多伊·阿尔卡亚加，笔名加夫列拉·米斯特拉尔，1889年4月7日生于科金博省维库尼亚的埃尔基山谷，1957年1月10日因胰腺癌在纽约长岛的亨普斯特德去世。拉丁美洲第一位获得诺贝尔文学奖的作家（1945年）。幼年丧父，自幼随姐姐学习教育，15岁即在乡村学校执教。1914年以\"死亡的十四行诗\"三首获圣地亚哥\"花之节\"诗歌大赛一等奖而成名。此后兼任教育家与诗人，历任中学校长，1922年受墨西哥教育部长巴斯孔塞洛斯之邀赴墨参与教育改革。1920年代起，她在特木科任教时曾引导年轻的聂鲁达走上诗歌之路。主要诗集有《绝望》（1922）、《柔情》（1924）、《塔拉》（1938）、《酒榨》（1954）。1925年起长期驻外担任领事——马德里、里斯本、尼斯、佩特罗波利斯等地——且参与国际联盟文化委员会。1938年阿吉雷·塞尔达总统为她角逐诺贝尔奖积极奔走。1945年11月15日获诺贝尔文学奖，是至今唯一获此奖的智利女性。晚年定居美国，1957年病逝。"
  CHL_gabriela_mistral_desc:0 "本名卢西拉·戈多伊·阿尔卡亚加，笔名加夫列拉·米斯特拉尔，1889年4月7日生于科金博省维库尼亚的埃尔基山谷，1957年1月10日因胰腺癌在纽约长岛的亨普斯特德去世。拉丁美洲第一位获得诺贝尔文学奖的作家（1945年）。幼年丧父，自幼随姐姐学习教育，15岁即在乡村学校执教。1914年以\"死亡的十四行诗\"三首获圣地亚哥\"花之节\"诗歌大赛一等奖而成名。此后兼任教育家与诗人，历任中学校长，1922年受墨西哥教育部长巴斯孔塞洛斯之邀赴墨参与教育改革。1920年代起，她在特木科任教时曾引导年轻的聂鲁达走上诗歌之路。主要诗集有《绝望》（1922）、《柔情》（1924）、《塔拉》（1938）、《酒榨》（1954）。1925年起长期驻外担任领事——马德里、里斯本、尼斯、佩特罗波利斯等地——且参与国际联盟文化委员会。1938年阿吉雷·塞尔达总统为她角逐诺贝尔奖积极奔走。1945年11月15日获诺贝尔文学奖，是至今唯一获此奖的智利女性。晚年定居美国，1957年病逝。"
  CBIO_CHL_gustavo_silva_desc:0 "全名古斯塔沃·希尔瓦·坎波，1885年7月14日生于孔巴尔瓦拉，1959年9月10日在圣地亚哥去世。律师、作家、激进党政治家。智利大学法学院毕业后从政，长期任众议员。1920年代活跃于亚历山德里第一届政府期间的政治舞台，1923年出任陆海军部长（当时掌管军事事务的内阁职位）。此外他是一位多产的政论家与散文家，著述涉及政治哲学、教育改革与国家前途等议题，对激进党的纲领论述有所贡献。"
  CHL_gustavo_silva_desc:0 "全名古斯塔沃·希尔瓦·坎波，1885年7月14日生于孔巴尔瓦拉，1959年9月10日在圣地亚哥去世。律师、作家、激进党政治家。智利大学法学院毕业后从政，长期任众议员。1920年代活跃于亚历山德里第一届政府期间的政治舞台，1923年出任陆海军部长（当时掌管军事事务的内阁职位）。此外他是一位多产的政论家与散文家，著述涉及政治哲学、教育改革与国家前途等议题，对激进党的纲领论述有所贡献。"
  CBIO_CHL_gustavo_ross_santa_maria_desc:0 "全名古斯塔沃·罗斯·圣玛丽亚，1879年6月16日生于瓦尔帕莱索，1961年4月5日在圣地亚哥去世。金融家、企业家与保守派政治人物。早年在法国从事金融业多年，积累了丰富的国际金融经验。1932年应亚历山德里总统之邀回国出任财政部长（1932–1937），是该届政府的核心人物——他以正统财政手段整顿大萧条后的智利经济：削减公共开支、偿还外债、稳定汇率、恢复硝石与铜的出口收入，被右翼推崇为\"智利的修复者\"，也被左翼抨击为劫贫济富的寡头代言人。1938年大选中他作为自由党—保守党联盟候选人代表右翼参选。选前9月5日爆发的劳工保险局惨案使亚历山德里政府声望崩塌，纳粹派在伊瓦涅斯退选后转而支持人民阵线的阿吉雷·塞尔达，罗斯最终以微弱劣势落败。选后他退出政坛，返回私人金融与企业事务。"
  CHL_gustavo_ross_santa_maria_desc:0 "全名古斯塔沃·罗斯·圣玛丽亚，1879年6月16日生于瓦尔帕莱索，1961年4月5日在圣地亚哥去世。金融家、企业家与保守派政治人物。早年在法国从事金融业多年，积累了丰富的国际金融经验。1932年应亚历山德里总统之邀回国出任财政部长（1932–1937），是该届政府的核心人物——他以正统财政手段整顿大萧条后的智利经济：削减公共开支、偿还外债、稳定汇率、恢复硝石与铜的出口收入，被右翼推崇为\"智利的修复者\"，也被左翼抨击为劫贫济富的寡头代言人。1938年大选中他作为自由党—保守党联盟候选人代表右翼参选。选前9月5日爆发的劳工保险局惨案使亚历山德里政府声望崩塌，纳粹派在伊瓦涅斯退选后转而支持人民阵线的阿吉雷·塞尔达，罗斯最终以微弱劣势落败。选后他退出政坛，返回私人金融与企业事务。"
  CBIO_CHL_guillermo_araya_desc:0 "全名吉列尔莫·伊斯基耶多·阿拉亚，1902年4月16日生于圣地亚哥，1988年8月19日去世。律师与极右民族主义政治人物，具法西斯与纳粹倾向。1930年代他是智利国家社会主义运动（MNS，\"纳粹派\"）的活跃成员，与冯·马雷斯和凯勒关系密切。冯·马雷斯的纳粹运动瓦解后，他于1940年代参与创建\"秃鹰社\"（SociedaddelCóndor），这是一个带法西斯色彩的极端民族主义团体，吸引退役军人与右翼知识分子。他长期活跃于智利极右翼政治圈，在战后延续了民族主义与威权主义的政治立场。"
  CHL_guillermo_araya_desc:0 "全名吉列尔莫·伊斯基耶多·阿拉亚，1902年4月16日生于圣地亚哥，1988年8月19日去世。律师与极右民族主义政治人物，具法西斯与纳粹倾向。1930年代他是智利国家社会主义运动（MNS，\"纳粹派\"）的活跃成员，与冯·马雷斯和凯勒关系密切。冯·马雷斯的纳粹运动瓦解后，他于1940年代参与创建\"秃鹰社\"（SociedaddelCóndor），这是一个带法西斯色彩的极端民族主义团体，吸引退役军人与右翼知识分子。他长期活跃于智利极右翼政治圈，在战后延续了民族主义与威权主义的政治立场。"
  CBIO_CHL_guido_beck_desc:0 "1903年8月29日生于奥匈帝国利贝雷茨（今捷克），1988年10月21日在巴西里约热内卢去世。理论物理学家，曾在维也纳与莱比锡跟随泡利、海森堡等人学习，取得博士学位。纳粹上台后他离开欧洲，1943年起长期在阿根廷（科尔多瓦大学等）从事核物理教学与研究，后亦在巴西工作。他是南美理论物理学发展的重要推动者，培养了阿根廷与巴西的一代物理学家。"
  CHL_guido_beck_desc:0 "1903年8月29日生于奥匈帝国利贝雷茨（今捷克），1988年10月21日在巴西里约热内卢去世。理论物理学家，曾在维也纳与莱比锡跟随泡利、海森堡等人学习，取得博士学位。纳粹上台后他离开欧洲，1943年起长期在阿根廷（科尔多瓦大学等）从事核物理教学与研究，后亦在巴西工作。他是南美理论物理学发展的重要推动者，培养了阿根廷与巴西的一代物理学家。"
  CBIO_CHL_tancredo_pinochet_desc:0 "1880年3月17日生，1957年去世。是\"百年一代\"（GeneracióndelCentenario）的代表人物之一，作家、记者、教育家与社会批评家。1910年智利独立百年之际，这一代知识分子猛烈批判寡头统治下的社会弊病：教育落后、贫富悬殊、阶层固化。坦克雷多以尖锐的社会评论文章与著述闻名，抨击智利上层阶级的自满与对底层的漠视，主张以教育改革与实业兴国。他与弗朗西斯科·安东尼奥·恩西纳等人被视为智利民族主义思潮的早期旗手，并曾参与创建智利最早的民族主义政党。晚年笔耕不辍。"
  CHL_tancredo_pinochet_desc:0 "1880年3月17日生，1957年去世。是\"百年一代\"（GeneracióndelCentenario）的代表人物之一，作家、记者、教育家与社会批评家。1910年智利独立百年之际，这一代知识分子猛烈批判寡头统治下的社会弊病：教育落后、贫富悬殊、阶层固化。坦克雷多以尖锐的社会评论文章与著述闻名，抨击智利上层阶级的自满与对底层的漠视，主张以教育改革与实业兴国。他与弗朗西斯科·安东尼奥·恩西纳等人被视为智利民族主义思潮的早期旗手，并曾参与创建智利最早的民族主义政党。晚年笔耕不辍。"
  CBIO_CHL_ernesto_jarpa_desc:0 "全名埃内斯托·巴罗斯·哈尔帕，1894年7月7日生（出生地待核），1977年7月15日去世。律师、自由党政治家与外交家，三度出任外交部长。他最著名的外交成就是参与谈判解决智利与秘鲁之间延宕数十年的塔克纳—阿里卡争端：1929年的《利马条约》将塔克纳归还秘鲁、智利保留阿里卡，终结了太平洋战争以来两国最棘手的领土纠纷。智利以他的名字命名了一款经典三明治\"巴罗斯·哈尔帕\"（火腿与奶酪热压三明治），据传是他在外长任上经常点的简餐——与另一款以其同僚巴罗斯·卢科总统命名的\"巴罗斯·卢科\"（牛肉与奶酪）齐名，成为智利饮食文化的标志。"
  CHL_ernesto_jarpa_desc:0 "全名埃内斯托·巴罗斯·哈尔帕，1894年7月7日生（出生地待核），1977年7月15日去世。律师、自由党政治家与外交家，三度出任外交部长。他最著名的外交成就是参与谈判解决智利与秘鲁之间延宕数十年的塔克纳—阿里卡争端：1929年的《利马条约》将塔克纳归还秘鲁、智利保留阿里卡，终结了太平洋战争以来两国最棘手的领土纠纷。智利以他的名字命名了一款经典三明治\"巴罗斯·哈尔帕\"（火腿与奶酪热压三明治），据传是他在外长任上经常点的简餐——与另一款以其同僚巴罗斯·卢科总统命名的\"巴罗斯·卢科\"（牛肉与奶酪）齐名，成为智利饮食文化的标志。"
  CBIO_CHL_emilio_diaz_desc:0 "全名埃米利奥·萨帕塔·迪亚斯，1896年5月11日生于圣地亚哥，1977年5月15日去世。托洛茨基主义政治人物与农民运动领袖。他是智利最早将托洛茨基主义引入农村的组织者之一，致力于发动中央谷地的农业工人与佃农，争取土地权利与劳动保障。在政治上追随曼努埃尔·伊达尔戈·普拉萨的托派路线——伊达尔戈因反对共产国际的斯大林化而在1930年代初脱离共产党、创建托洛茨基主义派别，萨帕塔是其在农村运动中的重要力量。他曾当选众议员，在国会中代表农业工人的利益。"
  CHL_emilio_diaz_desc:0 "全名埃米利奥·萨帕塔·迪亚斯，1896年5月11日生于圣地亚哥，1977年5月15日去世。托洛茨基主义政治人物与农民运动领袖。他是智利最早将托洛茨基主义引入农村的组织者之一，致力于发动中央谷地的农业工人与佃农，争取土地权利与劳动保障。在政治上追随曼努埃尔·伊达尔戈·普拉萨的托派路线——伊达尔戈因反对共产国际的斯大林化而在1930年代初脱离共产党、创建托洛茨基主义派别，萨帕塔是其在农村运动中的重要力量。他曾当选众议员，在国会中代表农业工人的利益。"
  CBIO_CHL_emilio_codesido_desc:0 "全名埃米利奥·贝略·科德西多，1868年7月31日生于圣地亚哥（英文维基另作7月13日，存异），1963年3月3日在圣地亚哥去世。律师、政治家与外交官，出自智利最显赫的知识家族之一——贝略家族（委内瑞拉裔大学者安德烈斯·贝略之后）。早年从政，历任众议员、参议员与多个部长职位（内政、外交等）。其最重要的历史角色是1925年1月23日军政府的主席。当日，一批青年军官推翻了自1924年9月以来掌权的\"九月军政府\"，先将行政权交予达特内尔将军——达特内尔婉拒独揽后，27日组建由贝略·科德西多主持的新军政府（至3月20日），其核心使命即促成亚历山德里自流亡中归国复职。此后他在亚历山德里第二任政府（1932–1938）中任国防部长。1936/1939年间他年事已高但仍为政坛受尊敬的元老人物。"
  CHL_emilio_codesido_desc:0 "全名埃米利奥·贝略·科德西多，1868年7月31日生于圣地亚哥（英文维基另作7月13日，存异），1963年3月3日在圣地亚哥去世。律师、政治家与外交官，出自智利最显赫的知识家族之一——贝略家族（委内瑞拉裔大学者安德烈斯·贝略之后）。早年从政，历任众议员、参议员与多个部长职位（内政、外交等）。其最重要的历史角色是1925年1月23日军政府的主席。当日，一批青年军官推翻了自1924年9月以来掌权的\"九月军政府\"，先将行政权交予达特内尔将军——达特内尔婉拒独揽后，27日组建由贝略·科德西多主持的新军政府（至3月20日），其核心使命即促成亚历山德里自流亡中归国复职。此后他在亚历山德里第二任政府（1932–1938）中任国防部长。1936/1939年间他年事已高但仍为政坛受尊敬的元老人物。"
  CBIO_CHL_elena_caffarena_desc:0 "全名埃莱娜·卡法雷纳·德·希莱斯，1903年3月23日生于伊基克，2003年7月19日在圣地亚哥去世，享年一百岁。律师、女权运动领袖，智利妇女争取选举权与政治平等的最重要推动者之一。1926年毕业于智利大学法学院，是该校最早的女性法学毕业生之一。1935年5月11日，她与其他活动家共同创建\"争取智利妇女解放运动\"（MEMCh），这是智利最早的、也是拉美最具影响力的女权组织之一，推动女性的市民权利、劳动保障与政治参与。她还参与起草了1934年赋予妇女市政选举权的法律。经过十余年持续斗争，智利于1949年最终赋予女性完整的投票权。然而1948年冈萨雷斯·魏地拉政府颁布的《保卫民主永久法》（\"该死的法律\"）以她与左翼运动的关联为由，将她从选民名册中除名——她为之奋斗一生的投票权利，自己反而最先被剥夺。此后她长期在法律援助与人权领域工作。皮诺切特独裁时期她参与维护人权的活动。晚年获智利国家新闻学院\"社会服务奖\"等荣誉。"
  CHL_elena_caffarena_desc:0 "全名埃莱娜·卡法雷纳·德·希莱斯，1903年3月23日生于伊基克，2003年7月19日在圣地亚哥去世，享年一百岁。律师、女权运动领袖，智利妇女争取选举权与政治平等的最重要推动者之一。1926年毕业于智利大学法学院，是该校最早的女性法学毕业生之一。1935年5月11日，她与其他活动家共同创建\"争取智利妇女解放运动\"（MEMCh），这是智利最早的、也是拉美最具影响力的女权组织之一，推动女性的市民权利、劳动保障与政治参与。她还参与起草了1934年赋予妇女市政选举权的法律。经过十余年持续斗争，智利于1949年最终赋予女性完整的投票权。然而1948年冈萨雷斯·魏地拉政府颁布的《保卫民主永久法》（\"该死的法律\"）以她与左翼运动的关联为由，将她从选民名册中除名——她为之奋斗一生的投票权利，自己反而最先被剥夺。此后她长期在法律援助与人权领域工作。皮诺切特独裁时期她参与维护人权的活动。晚年获智利国家新闻学院\"社会服务奖\"等荣誉。"
  CBIO_CHL_oskar_schnake_desc:0 "全名奥斯卡·施纳克·贝尔加拉，1899年6月11日生于阿劳卡尼亚的加尔瓦里诺，1976年4月24日在圣地亚哥去世。德裔智利记者、政治家，智利社会党首任总书记。1933年4月19日，他与格罗韦、阿连德、马丁内斯等人在圣地亚哥共同创建智利社会党，并被推举为党的首任总书记——在创党大会上他是核心组织者。此前他曾参与共济会，并在1920年代投身工人运动。社会党成立后，他领导该党加入人民阵线联盟，为1938年阿吉雷·塞尔达的胜选出力。阿吉雷·塞尔达执政后，他于1939年出任生产开发公司（CORFO）的首任执行副主席或部长级职务（各源记载略异），负责推进智利工业化。后来他转入外交领域，曾出任驻法国大使。社会党后来的路线分裂中他逐渐淡出核心领导层。"
  CHL_oskar_schnake_desc:0 "全名奥斯卡·施纳克·贝尔加拉，1899年6月11日生于阿劳卡尼亚的加尔瓦里诺，1976年4月24日在圣地亚哥去世。德裔智利记者、政治家，智利社会党首任总书记。1933年4月19日，他与格罗韦、阿连德、马丁内斯等人在圣地亚哥共同创建智利社会党，并被推举为党的首任总书记——在创党大会上他是核心组织者。此前他曾参与共济会，并在1920年代投身工人运动。社会党成立后，他领导该党加入人民阵线联盟，为1938年阿吉雷·塞尔达的胜选出力。阿吉雷·塞尔达执政后，他于1939年出任生产开发公司（CORFO）的首任执行副主席或部长级职务（各源记载略异），负责推进智利工业化。后来他转入外交领域，曾出任驻法国大使。社会党后来的路线分裂中他逐渐淡出核心领导层。"
  CBIO_CHL_osvaldo_lira_perez_desc:0 "全名奥斯瓦尔多·利拉·佩雷斯，1904年2月11日生于圣地亚哥，1996年12月20日在圣地亚哥去世。圣心会神父、托马斯主义哲学家、天主教右翼政治思想家。1927年入圣心修会，此后长期在智利天主教大学讲授哲学。思想上深受西班牙卡洛斯派（正统主义）影响，推崇有机体论国家、反对自由主义与议会民主、捍卫天主教秩序。他是1930年代智利拉美裔西班牙主义运动与佛朗哥支持者中的重要声音。1940年代他与哈依梅·艾斯梅、胡安·安东尼奥·魏地拉等人创建了\"西班牙—美洲行动\"（AcciónHispanoamericana），一个带法西斯倾向的天主教威权主义运动——其纲领融合卡洛斯主义、社团主义与反共立场。在智利政治思想史上，他最深远的影响是作为海梅·古斯曼的精神导师——古斯曼日后成为皮诺切特独裁政权的首席宪法理论家与1980年宪法的主要设计者。利拉对皮诺切特政权持支持态度。"
  CHL_osvaldo_lira_perez_desc:0 "全名奥斯瓦尔多·利拉·佩雷斯，1904年2月11日生于圣地亚哥，1996年12月20日在圣地亚哥去世。圣心会神父、托马斯主义哲学家、天主教右翼政治思想家。1927年入圣心修会，此后长期在智利天主教大学讲授哲学。思想上深受西班牙卡洛斯派（正统主义）影响，推崇有机体论国家、反对自由主义与议会民主、捍卫天主教秩序。他是1930年代智利拉美裔西班牙主义运动与佛朗哥支持者中的重要声音。1940年代他与哈依梅·艾斯梅、胡安·安东尼奥·魏地拉等人创建了\"西班牙—美洲行动\"（AcciónHispanoamericana），一个带法西斯倾向的天主教威权主义运动——其纲领融合卡洛斯主义、社团主义与反共立场。在智利政治思想史上，他最深远的影响是作为海梅·古斯曼的精神导师——古斯曼日后成为皮诺切特独裁政权的首席宪法理论家与1980年宪法的主要设计者。利拉对皮诺切特政权持支持态度。"
  CBIO_CHL_pablo_neruda_desc:0 "本名里卡多·埃列塞尔·内夫塔利·雷耶斯·巴索阿尔托，笔名巴勃罗·聂鲁达，1904年7月12日生于毛莱省帕拉尔，1973年9月23日在圣地亚哥去世——官方死因为前列腺癌，但长期存在被皮诺切特政权下毒之疑，智利司法机关于2010年代启动调查、开棺验尸，2023年一国际专家组鉴定在其遗体中发现了梭状芽孢杆菌毒素，认定他极可能非自然死亡。少年时在特木科受米斯特拉尔启蒙而立志诗道，1920年以\"巴勃罗·聂鲁达\"为笔名发表作品，1924年出版《二十首情诗和一首绝望的歌》即成名。此后兼任诗人与外交官：1927年起任驻缅甸、锡兰、爪哇、新加坡、布宜诺斯艾利斯、巴塞罗那、马德里等地领事。西班牙内战深刻改变了他的政治信仰——1936年目睹洛尔迦遇害后全面转向左翼。1939年他受阿吉雷·塞尔达总统委托，以\"移民特使\"身份在法国包租\"温尼伯号\"货轮，将逾2200名西班牙共和派难民送往智利，这是他一生最重要的人道行动之一。1945年加入智利共产党并当选参议员。1948年因公开谴责冈萨雷斯·魏地拉颁布\"该死的法律\"而遭通缉，骑马翻越安第斯山流亡阿根廷。流亡期间创作了史诗巨著《漫歌》（1950）。1952年回国。1970年曾获共产党提名参选总统、后退出支持阿连德。1971年获诺贝尔文学奖。1973年9月11日政变后十二天病逝。聂鲁达与中国有深厚渊源：1927年赴缅甸途中曾短暂经停上海；新中国成立后，他于1951年作为世界和平理事会代表（与苏联作家爱伦堡同行）访华，向时任中华人民共和国副主席宋庆龄颁授国际和平奖；1957年再度访华。访华期间他与艾青、茅盾、丁玲、萧三等中国作家结谊，在回忆录《我坦言我曾历尽沧桑》中称艾青为\"中国诗人中的王子\"。1952年他与画家何塞·本图雷利共同创建了拉丁美洲首个智中文化协会。其《伐木者，醒来吧》（1950）是最早被译为中文的拉美文学作品之一，诗集《葡萄园与风》（1954）中有专门献给中国的诗篇。"
  CHL_pablo_neruda_desc:0 "本名里卡多·埃列塞尔·内夫塔利·雷耶斯·巴索阿尔托，笔名巴勃罗·聂鲁达，1904年7月12日生于毛莱省帕拉尔，1973年9月23日在圣地亚哥去世——官方死因为前列腺癌，但长期存在被皮诺切特政权下毒之疑，智利司法机关于2010年代启动调查、开棺验尸，2023年一国际专家组鉴定在其遗体中发现了梭状芽孢杆菌毒素，认定他极可能非自然死亡。少年时在特木科受米斯特拉尔启蒙而立志诗道，1920年以\"巴勃罗·聂鲁达\"为笔名发表作品，1924年出版《二十首情诗和一首绝望的歌》即成名。此后兼任诗人与外交官：1927年起任驻缅甸、锡兰、爪哇、新加坡、布宜诺斯艾利斯、巴塞罗那、马德里等地领事。西班牙内战深刻改变了他的政治信仰——1936年目睹洛尔迦遇害后全面转向左翼。1939年他受阿吉雷·塞尔达总统委托，以\"移民特使\"身份在法国包租\"温尼伯号\"货轮，将逾2200名西班牙共和派难民送往智利，这是他一生最重要的人道行动之一。1945年加入智利共产党并当选参议员。1948年因公开谴责冈萨雷斯·魏地拉颁布\"该死的法律\"而遭通缉，骑马翻越安第斯山流亡阿根廷。流亡期间创作了史诗巨著《漫歌》（1950）。1952年回国。1970年曾获共产党提名参选总统、后退出支持阿连德。1971年获诺贝尔文学奖。1973年9月11日政变后十二天病逝。聂鲁达与中国有深厚渊源：1927年赴缅甸途中曾短暂经停上海；新中国成立后，他于1951年作为世界和平理事会代表（与苏联作家爱伦堡同行）访华，向时任中华人民共和国副主席宋庆龄颁授国际和平奖；1957年再度访华。访华期间他与艾青、茅盾、丁玲、萧三等中国作家结谊，在回忆录《我坦言我曾历尽沧桑》中称艾青为\"中国诗人中的王子\"。1952年他与画家何塞·本图雷利共同创建了拉丁美洲首个智中文化协会。其《伐木者，醒来吧》（1950）是最早被译为中文的拉美文学作品之一，诗集《葡萄园与风》（1954）中有专门献给中国的诗篇。"
  CBIO_CHL_francisco_o_ryan_orrego_desc:0 "1901年1月16日生于瓦尔帕莱索的奥尔穆埃别墅，1968年6月7日卒于奥尔穆埃，享年67岁。爱尔兰裔家族后代，智利海军中将，以横跨军政的职业生涯著称。1914年入海军学校，1920年以准尉军衔毕业，此后历任炮术军官、训练教官及多艘舰艇舰长，积累深厚的海上与参谋双重经验。1936年前后，他已晋升为护卫舰长，任海军司令部规程与出版科主任；1939年转派伦敦海军使团担任秘书，经历第二次世界大战前夜的海军外交事务。战后仕途一路上升：1944年出任伊基克港务长，1952年晋升少将，同年出任舰队总司令兼最高海军法官，驻旗战列舰\"阿尔米兰特·拉托雷\"号。1954年1月晋中将，同年4月28日依命令出任智利海军总司令。在任期间权责屡次叠加——1955年6月奉命以特命全权大使身份赴委内瑞拉执行外交使命，同年12月兼任国防部长，此后又兼任内政部长；1957年8月伊瓦涅斯总统赴巴拉圭访问期间，依宪以副总统身份代行总统职权。1958年2月卸任内政部长，3月提交退役申请，正式结束长达四十四年的军旅生涯。"
  CHL_francisco_o_ryan_orrego_desc:0 "1901年1月16日生于瓦尔帕莱索的奥尔穆埃别墅，1968年6月7日卒于奥尔穆埃，享年67岁。爱尔兰裔家族后代，智利海军中将，以横跨军政的职业生涯著称。1914年入海军学校，1920年以准尉军衔毕业，此后历任炮术军官、训练教官及多艘舰艇舰长，积累深厚的海上与参谋双重经验。1936年前后，他已晋升为护卫舰长，任海军司令部规程与出版科主任；1939年转派伦敦海军使团担任秘书，经历第二次世界大战前夜的海军外交事务。战后仕途一路上升：1944年出任伊基克港务长，1952年晋升少将，同年出任舰队总司令兼最高海军法官，驻旗战列舰\"阿尔米兰特·拉托雷\"号。1954年1月晋中将，同年4月28日依命令出任智利海军总司令。在任期间权责屡次叠加——1955年6月奉命以特命全权大使身份赴委内瑞拉执行外交使命，同年12月兼任国防部长，此后又兼任内政部长；1957年8月伊瓦涅斯总统赴巴拉圭访问期间，依宪以副总统身份代行总统职权。1958年2月卸任内政部长，3月提交退役申请，正式结束长达四十四年的军旅生涯。"
  CBIO_CHL_francisco_encina_desc:0 "全名弗朗西斯科·安东尼奥·恩西纳·阿拉尼巴尔，1874年9月10日生于毛莱省圣哈维尔附近的塔尔卡镇，1965年8月23日在圣地亚哥去世。律师、政治家与史学家，智利20世纪最具影响力同时也最具争议性的历史著述者之一。1897年于智利大学取得律师资格，早年当选众议员（1906–1912），后渐从政坛退入学术。他是\"百年一代\"的代表，与坦克雷多·皮诺切特等人共同参与创建了智利最早的民族主义政党。其著作《我们的经济劣势》（1912）诊断智利经济衰退的原因——在这本书及后来的著述中，他援引了种族决定论与社会达尔文主义的论点，将智利的国家问题部分归因于族群构成，这一立场带有明显的种族偏见，至今备受批评。他的毕生巨著——20卷本《智利史》（1940–1952年陆续出版）——是智利最为宏大的通史写作工程，资料翔实、叙事生动，至今仍是智利史研究的重要参考；但该书同样渗透着他的民族主义史观与种族决定论色彩，读者须带批判视角。1955年获智利国家文学奖。"
  CHL_francisco_encina_desc:0 "全名弗朗西斯科·安东尼奥·恩西纳·阿拉尼巴尔，1874年9月10日生于毛莱省圣哈维尔附近的塔尔卡镇，1965年8月23日在圣地亚哥去世。律师、政治家与史学家，智利20世纪最具影响力同时也最具争议性的历史著述者之一。1897年于智利大学取得律师资格，早年当选众议员（1906–1912），后渐从政坛退入学术。他是\"百年一代\"的代表，与坦克雷多·皮诺切特等人共同参与创建了智利最早的民族主义政党。其著作《我们的经济劣势》（1912）诊断智利经济衰退的原因——在这本书及后来的著述中，他援引了种族决定论与社会达尔文主义的论点，将智利的国家问题部分归因于族群构成，这一立场带有明显的种族偏见，至今备受批评。他的毕生巨著——20卷本《智利史》（1940–1952年陆续出版）——是智利最为宏大的通史写作工程，资料翔实、叙事生动，至今仍是智利史研究的重要参考；但该书同样渗透着他的民族主义史观与种族决定论色彩，读者须带批判视角。1955年获智利国家文学奖。"
  CBIO_CHL_radomiro_romero_desc:0 "全名拉多米罗·托米克·罗梅罗，1914年5月7日生于安托法加斯塔省的卡拉马，克罗地亚移民之子，1992年1月3日在圣地亚哥去世。律师、基督教民主派政治家。智利大学法学院毕业后投身政治。1930年代末与爱德华多·弗雷·蒙塔尔瓦、贝尔纳多·莱顿等人共同创建国民方阵（FalangeNacional）——一个源于保守党青年翼但转向社会天主教路线的新政党，后发展为基督教民主党（1957年正式成立）。他在党内属左翼，主张激进的社会改革与国有化。历任众议员、参议员、驻美大使（1961–1964）。1970年作为基民党总统候选人参选，主张深化农业改革与铜矿国有化，得票居第三（27.8%），落后于阿连德与豪尔赫·亚历山德里。1973年政变后反对皮诺切特独裁政权。"
  CHL_radomiro_romero_desc:0 "全名拉多米罗·托米克·罗梅罗，1914年5月7日生于安托法加斯塔省的卡拉马，克罗地亚移民之子，1992年1月3日在圣地亚哥去世。律师、基督教民主派政治家。智利大学法学院毕业后投身政治。1930年代末与爱德华多·弗雷·蒙塔尔瓦、贝尔纳多·莱顿等人共同创建国民方阵（FalangeNacional）——一个源于保守党青年翼但转向社会天主教路线的新政党，后发展为基督教民主党（1957年正式成立）。他在党内属左翼，主张激进的社会改革与国有化。历任众议员、参议员、驻美大使（1961–1964）。1970年作为基民党总统候选人参选，主张深化农业改革与铜矿国有化，得票居第三（27.8%），落后于阿连德与豪尔赫·亚历山德里。1973年政变后反对皮诺切特独裁政权。"
  CBIO_CHL_rayen_quitral_desc:0 "本名玛丽亚·赫奥尔希纳·基特拉尔·埃斯皮诺萨，艺名拉延·基特拉尔，1916年11月7日生于毛莱省伊洛卡，1979年10月20日在圣地亚哥去世。首位在国际舞台上成名的马普切女高音歌唱家。出身马普切农家，\"拉延\"在马普切语中意为\"花\"。幼年展露歌唱天赋，获奖学金赴圣地亚哥音乐学院学习声乐。1937年她首登圣地亚哥市政剧院舞台，在普契尼《蝴蝶夫人》中担纲主角，引起轰动——一名马普切女性登上智利最高歌剧殿堂，在那个时代是破天荒之事。此后她赴意大利、法国深造并巡演欧洲与美洲，在《阿依达》《茶花女》《卡门》等经典剧目中担任主角，被誉为\"伊洛卡的云雀\"。1940年代至1950年代是她声誉的巅峰。她是马普切人在智利高雅艺术领域取得突破的标志性人物。晚年生活困顿，去世时几乎被遗忘。"
  CHL_rayen_quitral_desc:0 "本名玛丽亚·赫奥尔希纳·基特拉尔·埃斯皮诺萨，艺名拉延·基特拉尔，1916年11月7日生于毛莱省伊洛卡，1979年10月20日在圣地亚哥去世。首位在国际舞台上成名的马普切女高音歌唱家。出身马普切农家，\"拉延\"在马普切语中意为\"花\"。幼年展露歌唱天赋，获奖学金赴圣地亚哥音乐学院学习声乐。1937年她首登圣地亚哥市政剧院舞台，在普契尼《蝴蝶夫人》中担纲主角，引起轰动——一名马普切女性登上智利最高歌剧殿堂，在那个时代是破天荒之事。此后她赴意大利、法国深造并巡演欧洲与美洲，在《阿依达》《茶花女》《卡门》等经典剧目中担任主角，被誉为\"伊洛卡的云雀\"。1940年代至1950年代是她声誉的巅峰。她是马普切人在智利高雅艺术领域取得突破的标志性人物。晚年生活困顿，去世时几乎被遗忘。"
  CBIO_CHL_ramon_perez_desc:0 "全名拉蒙·叙贝尔卡索·佩雷斯，1872年4月14日生于圣地亚哥，1959年3月6日去世（去世地待核）。工程师、自由党政治家与财政专家。与同名的画家外交官拉蒙·叙贝尔卡索·维库尼亚（1854–1937）并非同一人——后者为知名水彩画家与驻欧外交官，两人虽同姓叙贝尔卡索、年代相近，但系不同人物。叙贝尔卡索·佩雷斯以工程与财政见长，三度出任智利财政部长。他最重要的任职是1933至1939年间担任智利中央银行行长——这一时期恰逢智利从大萧条中恢复，亚历山德里第二任政府依靠古斯塔沃·罗斯的财政部与他主持的中央银行来稳定金融秩序。这使他成为亚历山德里第二任政府金融稳定政策中的关键技术官僚。"
  CHL_ramon_perez_desc:0 "全名拉蒙·叙贝尔卡索·佩雷斯，1872年4月14日生于圣地亚哥，1959年3月6日去世（去世地待核）。工程师、自由党政治家与财政专家。与同名的画家外交官拉蒙·叙贝尔卡索·维库尼亚（1854–1937）并非同一人——后者为知名水彩画家与驻欧外交官，两人虽同姓叙贝尔卡索、年代相近，但系不同人物。叙贝尔卡索·佩雷斯以工程与财政见长，三度出任智利财政部长。他最重要的任职是1933至1939年间担任智利中央银行行长——这一时期恰逢智利从大萧条中恢复，亚历山德里第二任政府依靠古斯塔沃·罗斯的财政部与他主持的中央银行来稳定金融秩序。这使他成为亚历山德里第二任政府金融稳定政策中的关键技术官僚。"
  CBIO_CHL_manuel_hidalgo_plaza_desc:0 "全名曼努埃尔·伊达尔戈·普拉萨，1878年4月5日生于圣地亚哥，1967年12月20日去世。印刷工人出身的政治家，智利共产主义运动的早期领袖与拉丁美洲最早的托洛茨基主义者之一。早年加入民主党，1912年参与创建社会主义工人党（POS），1922年随该党改组为智利共产党（PCCh）。1920年代曾作为共产党代表出任参议员（塔拉帕卡与安托法加斯塔），并在共产国际的代表大会上为智利党发言。1931年他因反对共产国际的\"第三时期\"极左路线与斯大林化而被开除出党，随即率领一批追随者另立托洛茨基主义派别\"左翼共产党\"（后更名\"工人革命党\"），在智利左翼运动中形成了以他命名的\"伊达尔戈主义\"潮流。该派别参与了1936年人民阵线的组建。他后来曾出任智利驻墨西哥大使——值得注意的是，托洛茨基彼时正流亡墨西哥。萨帕塔·迪亚斯等农运领袖是其追随者。"
  CHL_manuel_hidalgo_plaza_desc:0 "全名曼努埃尔·伊达尔戈·普拉萨，1878年4月5日生于圣地亚哥，1967年12月20日去世。印刷工人出身的政治家，智利共产主义运动的早期领袖与拉丁美洲最早的托洛茨基主义者之一。早年加入民主党，1912年参与创建社会主义工人党（POS），1922年随该党改组为智利共产党（PCCh）。1920年代曾作为共产党代表出任参议员（塔拉帕卡与安托法加斯塔），并在共产国际的代表大会上为智利党发言。1931年他因反对共产国际的\"第三时期\"极左路线与斯大林化而被开除出党，随即率领一批追随者另立托洛茨基主义派别\"左翼共产党\"（后更名\"工人革命党\"），在智利左翼运动中形成了以他命名的\"伊达尔戈主义\"潮流。该派别参与了1936年人民阵线的组建。他后来曾出任智利驻墨西哥大使——值得注意的是，托洛茨基彼时正流亡墨西哥。萨帕塔·迪亚斯等农运领袖是其追随者。"
  CBIO_CHL_manuel_neculman_desc:0 "全名曼努埃尔·安东尼奥·内库尔曼，约1854年冬生于阿劳卡尼亚的梅特伦科（马普切领地、尚未被智利征服），1946年12月13日在特木科去世，享年约92岁。他被认为是智利历史上第一位获得正规师范学位的马普切人。1870年代他在智利\"占领阿劳卡尼亚\"（即对马普切领地的军事征服）期间的剧变中成长——那个时代马普切人几乎被排斥在正规教育之外。他克服重重障碍取得教师资格，此后长期在阿劳卡尼亚地区从事马普切儿童的教育工作。1910年代他与一批马普切领袖共同创建了\"考波利坎防卫会\"（SociedadCaupolicánDefensoradelaAraucanía），这是最早由马普切人自己建立的权益组织之一。内库尔曼属于\"整合派\"——主张马普切人通过教育与法律渠道融入智利社会以争取权利——与曼基莱夫同属此路线、但与阿武尔托·潘吉莱夫的\"自治派\"立场相左。"
  CHL_manuel_neculman_desc:0 "全名曼努埃尔·安东尼奥·内库尔曼，约1854年冬生于阿劳卡尼亚的梅特伦科（马普切领地、尚未被智利征服），1946年12月13日在特木科去世，享年约92岁。他被认为是智利历史上第一位获得正规师范学位的马普切人。1870年代他在智利\"占领阿劳卡尼亚\"（即对马普切领地的军事征服）期间的剧变中成长——那个时代马普切人几乎被排斥在正规教育之外。他克服重重障碍取得教师资格，此后长期在阿劳卡尼亚地区从事马普切儿童的教育工作。1910年代他与一批马普切领袖共同创建了\"考波利坎防卫会\"（SociedadCaupolicánDefensoradelaAraucanía），这是最早由马普切人自己建立的权益组织之一。内库尔曼属于\"整合派\"——主张马普切人通过教育与法律渠道融入智利社会以争取权利——与曼基莱夫同属此路线、但与阿武尔托·潘吉莱夫的\"自治派\"立场相左。"
  CBIO_CHL_manuel_panguilef_desc:0 "全名曼努埃尔·阿武尔托·潘吉莱夫，1887年3月3日生于科利马利英（今阿劳卡尼亚大区），1952年去世（确切日期无记载）。马普切领袖、先知式政治人物与马普切自治运动的奠基者。1916年（一说1922年）创建\"阿劳卡尼亚联合会\"（FederaciónAraucana），这是马普切自治运动最重要的组织。与内库尔曼、曼基莱夫等\"整合派\"截然不同，他坚定主张马普切民族的文化独立与政治自治。1931年他在联合会大会上首次提出建立\"印第安共和国\"（RepúblicaIndígena）的构想——这在当时被智利主流视为激进甚至荒诞，但也使他成为拉美原住民自决运动的先驱之一。他的政治实践融合了马普切传统仪式（如machitún）、基督教元素与现代政治动员。1932年\"社会主义共和国\"短暂存续期间，他曾在特木科组建地方执政团。1936年亚历山德里政府将他流放。1940年代他继续领导联合会直至去世。"
  CHL_manuel_panguilef_desc:0 "全名曼努埃尔·阿武尔托·潘吉莱夫，1887年3月3日生于科利马利英（今阿劳卡尼亚大区），1952年去世（确切日期无记载）。马普切领袖、先知式政治人物与马普切自治运动的奠基者。1916年（一说1922年）创建\"阿劳卡尼亚联合会\"（FederaciónAraucana），这是马普切自治运动最重要的组织。与内库尔曼、曼基莱夫等\"整合派\"截然不同，他坚定主张马普切民族的文化独立与政治自治。1931年他在联合会大会上首次提出建立\"印第安共和国\"（RepúblicaIndígena）的构想——这在当时被智利主流视为激进甚至荒诞，但也使他成为拉美原住民自决运动的先驱之一。他的政治实践融合了马普切传统仪式（如machitún）、基督教元素与现代政治动员。1932年\"社会主义共和国\"短暂存续期间，他曾在特木科组建地方执政团。1936年亚历山德里政府将他流放。1940年代他继续领导联合会直至去世。"
  CBIO_CHL_benjamin_larrain_desc:0 "全名本哈明·马特·拉腊因（BenjamínMatteLarraín），属智利最具影响力的经济家族之一——马特家族。他长期担任全国农业协会（SociedadNacionaldeAgricultura,SNA）主席，是智利大地主阶层与保守派农业利益的代言人。SNA在20世纪智利政治中扮演了关键角色：它是阻止历届政府推行土地改革的核心力量之一。马特·拉腊因坚定反对农业工人工会化与土地重新分配，捍卫大庄园（latifundio）体制。"
  CHL_benjamin_larrain_desc:0 "全名本哈明·马特·拉腊因（BenjamínMatteLarraín），属智利最具影响力的经济家族之一——马特家族。他长期担任全国农业协会（SociedadNacionaldeAgricultura,SNA）主席，是智利大地主阶层与保守派农业利益的代言人。SNA在20世纪智利政治中扮演了关键角色：它是阻止历届政府推行土地改革的核心力量之一。马特·拉腊因坚定反对农业工人工会化与土地重新分配，捍卫大庄园（latifundio）体制。"
  CBIO_CHL_eduardo_cruz_coke_desc:0 "全名爱德华多·克鲁斯-科克·拉萨贝，1899年4月22日生于瓦尔帕莱索，1974年3月18日在圣地亚哥去世。医生、保守党人、智利公共卫生体系的奠基者。1921年毕业于智利大学医学院；学生时代共同创建天主教学生协会（ANEC），任首任主席。1925年起任智利大学生理与病理化学教授。1937年1月15日至1938年9月出任亚历山德里第二任政府的卫生部长——任内制定《预防医学法》与1938年《母亲与儿童法》，奠定了智利现代公共卫生与社会保障体系的基础。1938年9月劳工保险局惨案发生后，他辞去部长职务。1941–1957年两任圣地亚哥参议员。1945年他作为智利代表团成员出席旧金山联合国制宪会议。1946年经保守党与国民方阵提名参选总统，但因右翼选票在他与费尔南多·亚历山德里之间分裂，败于冈萨雷斯·魏地拉，以约29.8%得票居第二。1948年创建\"社会基督教保守党\"，反对冈萨雷斯·魏地拉的\"该死的法律\"。1958–1960年任驻秘鲁大使；1963年任智利原子能委员会首任主席。由此，他成为亚历山德里第二任政府公共卫生改革中最重要的技术型部长之一。"
  CHL_eduardo_cruz_coke_desc:0 "全名爱德华多·克鲁斯-科克·拉萨贝，1899年4月22日生于瓦尔帕莱索，1974年3月18日在圣地亚哥去世。医生、保守党人、智利公共卫生体系的奠基者。1921年毕业于智利大学医学院；学生时代共同创建天主教学生协会（ANEC），任首任主席。1925年起任智利大学生理与病理化学教授。1937年1月15日至1938年9月出任亚历山德里第二任政府的卫生部长——任内制定《预防医学法》与1938年《母亲与儿童法》，奠定了智利现代公共卫生与社会保障体系的基础。1938年9月劳工保险局惨案发生后，他辞去部长职务。1941–1957年两任圣地亚哥参议员。1945年他作为智利代表团成员出席旧金山联合国制宪会议。1946年经保守党与国民方阵提名参选总统，但因右翼选票在他与费尔南多·亚历山德里之间分裂，败于冈萨雷斯·魏地拉，以约29.8%得票居第二。1948年创建\"社会基督教保守党\"，反对冈萨雷斯·魏地拉的\"该死的法律\"。1958–1960年任驻秘鲁大使；1963年任智利原子能委员会首任主席。由此，他成为亚历山德里第二任政府公共卫生改革中最重要的技术型部长之一。"
  CBIO_CHL_maria_de_la_cruz_desc:0 "1912年9月18日生于科尔查瓜省的钦巴龙戈，1995年9月1日在圣地亚哥去世。作家、记者、政治家，智利历史上首位女参议员。1946年她创建\"智利妇女党\"（PartidoFemeninodeChile），这是智利第二个妇女政党，致力于推动女性的完整选举权（1949年实现）。1952年总统大选中她出任伊瓦涅斯竞选总指挥，妇女党帮助伊瓦涅斯赢得了首次有女性参与投票的大选；选后她婉拒了教育部长之邀。1953年1月4日，她在圣地亚哥参议员补选中以逾50%得票当选——成为智利首位女参议员（2月13日就职）。然而同年8月4日参议院以21票对16票取消其资格（desafuero），罪名是\"私人行政事务代理人\"，牵涉一桩手表走私集资案与和阿根廷庇隆政权的经济联系；法院后来判她无罪，此案发生在智利反庇隆主义的高潮中。其后她转向支持豪尔赫·亚历山德里（1958）、加入国民党。"
  CHL_maria_de_la_cruz_desc:0 "1912年9月18日生于科尔查瓜省的钦巴龙戈，1995年9月1日在圣地亚哥去世。作家、记者、政治家，智利历史上首位女参议员。1946年她创建\"智利妇女党\"（PartidoFemeninodeChile），这是智利第二个妇女政党，致力于推动女性的完整选举权（1949年实现）。1952年总统大选中她出任伊瓦涅斯竞选总指挥，妇女党帮助伊瓦涅斯赢得了首次有女性参与投票的大选；选后她婉拒了教育部长之邀。1953年1月4日，她在圣地亚哥参议员补选中以逾50%得票当选——成为智利首位女参议员（2月13日就职）。然而同年8月4日参议院以21票对16票取消其资格（desafuero），罪名是\"私人行政事务代理人\"，牵涉一桩手表走私集资案与和阿根廷庇隆政权的经济联系；法院后来判她无罪，此案发生在智利反庇隆主义的高潮中。其后她转向支持豪尔赫·亚历山德里（1958）、加入国民党。"
  CBIO_CHL_marta_vergara_desc:0 "1898年1月2日生于瓦尔帕莱索（1906年大地震中失去家园与母亲），1995年在圣地亚哥去世。记者、作家、女权运动活动家。1920年代末因伊瓦涅斯上台离开智利赴欧洲，在巴黎任《信使报》驻外记者，由此接触国际女权运动——在海牙的一次女权会议上被推荐代表智利，从此走上女权之路。1935年5月她与埃莱娜·卡法雷纳、奥尔加·波布莱特等人共同创建\"争取智利妇女解放运动\"（MEMCh），并担任其月刊《新女性》的编辑，该刊讨论的议题包括妇女劳动权、母婴保障乃至堕胎合法化，在当时极具前瞻性。1937年她因与共产党员在MEMCh方向上的分歧而辞去职务。此后与丈夫马尔科斯·查穆德斯移居美国，二战期间在欧洲从事战地新闻工作，战后在华盛顿任美洲妇女委员会（CIM）专员，推动各成员国承诺妇女选举权与民事平等。1962年出版自传《一个不逊女子的回忆》，获圣地亚哥市文学奖。"
  CHL_marta_vergara_desc:0 "1898年1月2日生于瓦尔帕莱索（1906年大地震中失去家园与母亲），1995年在圣地亚哥去世。记者、作家、女权运动活动家。1920年代末因伊瓦涅斯上台离开智利赴欧洲，在巴黎任《信使报》驻外记者，由此接触国际女权运动——在海牙的一次女权会议上被推荐代表智利，从此走上女权之路。1935年5月她与埃莱娜·卡法雷纳、奥尔加·波布莱特等人共同创建\"争取智利妇女解放运动\"（MEMCh），并担任其月刊《新女性》的编辑，该刊讨论的议题包括妇女劳动权、母婴保障乃至堕胎合法化，在当时极具前瞻性。1937年她因与共产党员在MEMCh方向上的分歧而辞去职务。此后与丈夫马尔科斯·查穆德斯移居美国，二战期间在欧洲从事战地新闻工作，战后在华盛顿任美洲妇女委员会（CIM）专员，推动各成员国承诺妇女选举权与民事平等。1962年出版自传《一个不逊女子的回忆》，获圣地亚哥市文学奖。"
  CBIO_CHL_miguel_cruchaga_tacomal_desc:0 "全名米格尔·克鲁查加·托科尔纳尔，1869年9月29日生于圣地亚哥，1949年8月5日在圣地亚哥去世。律师、外交家与政治人物，出自智利最显赫的政治外交家族之一。智利大学法学院毕业后从政，历任众议员、参议员、多个部长职位。他最重要的角色是外交领域——多度出任外交部长（至少在亚历山德里政府期间），并在国际联盟事务中代表智利。1933年他当选国际联盟大会主席（PresidentedelaAsambleadelaSociedaddelasNaciones），是为数不多担任此职的拉美外交官之一。他还曾任智利驻阿根廷与驻巴西大使。"
  CHL_miguel_cruchaga_tacomal_desc:0 "全名米格尔·克鲁查加·托科尔纳尔，1869年9月29日生于圣地亚哥，1949年8月5日在圣地亚哥去世。律师、外交家与政治人物，出自智利最显赫的政治外交家族之一。智利大学法学院毕业后从政，历任众议员、参议员、多个部长职位。他最重要的角色是外交领域——多度出任外交部长（至少在亚历山德里政府期间），并在国际联盟事务中代表智利。1933年他当选国际联盟大会主席（PresidentedelaAsambleadelaSociedaddelasNaciones），是为数不多担任此职的拉美外交官之一。他还曾任智利驻阿根廷与驻巴西大使。"
  CBIO_CHL_miguel_serrano_desc:0 "全名米格尔·华金·迭戈·德尔卡门·塞拉诺·费尔南德斯，1917年9月10日生于圣地亚哥，2009年2月28日在圣地亚哥去世。外交家、作家与20世纪最臭名昭著的纳粹辩护者之一——他是所谓\"神秘希特勒主义\"（HitlerismoEsotérico）的创始人与主要传播者。早年以文学起家，参与\"文学一代1938\"（与聂鲁达等人有交集），著有旅行文学与回忆录。此后进入外交界，先后出任智利驻印度（任内结识赫尔曼·黑塞与荣格、接触印度教神秘主义）、驻南斯拉夫、驻奥地利大使。然而退休后他暴露出其思想的真面目：自1970年代起公开发表系统性的纳粹辩护著述，将希特勒神化为\"化身\"（avatar），融合北欧神话、印度教密宗与纳粹种族理论，构建了一套荒诞但具煽动力的\"神秘希特勒主义\"体系。他否认大屠杀、宣扬反犹主义、与全球新纳粹网络往来密切，晚年公开出席新纳粹集会。他是皮诺切特政权的支持者。"
  CHL_miguel_serrano_desc:0 "全名米格尔·华金·迭戈·德尔卡门·塞拉诺·费尔南德斯，1917年9月10日生于圣地亚哥，2009年2月28日在圣地亚哥去世。外交家、作家与20世纪最臭名昭著的纳粹辩护者之一——他是所谓\"神秘希特勒主义\"（HitlerismoEsotérico）的创始人与主要传播者。早年以文学起家，参与\"文学一代1938\"（与聂鲁达等人有交集），著有旅行文学与回忆录。此后进入外交界，先后出任智利驻印度（任内结识赫尔曼·黑塞与荣格、接触印度教神秘主义）、驻南斯拉夫、驻奥地利大使。然而退休后他暴露出其思想的真面目：自1970年代起公开发表系统性的纳粹辩护著述，将希特勒神化为\"化身\"（avatar），融合北欧神话、印度教密宗与纳粹种族理论，构建了一套荒诞但具煽动力的\"神秘希特勒主义\"体系。他否认大屠杀、宣扬反犹主义、与全球新纳粹网络往来密切，晚年公开出席新纳粹集会。他是皮诺切特政权的支持者。"
  CBIO_CHL_roberto_araya_desc:0 "弗朗西斯科·亚历杭德罗·罗伯托·瓦赫霍尔茨·阿拉亚（FranciscoAlejandroRobertoWachholtzAraya），1899年7月19日生于塔克纳（时属智利），1980年5月21日在伦戈去世。土木工程师、激进党政治家，德裔后代。其父马克西莫·瓦赫霍尔茨，母埃尔维拉·阿拉亚（母姓即名单所记之\"Araya\"）；兄豪尔赫·瓦赫霍尔茨曾任伊瓦涅斯第一届政府的塔拉帕卡区长与参议员。1925年毕业于智利大学工程学院，此后与卡洛斯·亚历山德里·阿尔塔米拉诺合组\"瓦赫霍尔茨与亚历山德里\"工程公司，承建托科皮利亚供水工程、科库莱至拉戈兰科铁路、伊基克至平塔多斯铁路机厂等重要基础设施，并参与创立智利石油公司（COPEC）。1938年12月24日由阿吉雷·塞尔达总统任命为财政部长——任内两件大事接踵而至：CORFO（生产开发公司）的创建以及1939年奇廉大地震后的紧急财政应对。后在冈萨雷斯·魏地拉政府中再度出任财政部长，并兼任经济与商业部长（1946年11月至1947年1月）。1959年在圣地亚哥参议员补选中以激进党候选人身份胜选，接替就任总统的豪尔赫·亚历山德里所遗空缺，任至1965年。"
  CHL_roberto_araya_desc:0 "弗朗西斯科·亚历杭德罗·罗伯托·瓦赫霍尔茨·阿拉亚（FranciscoAlejandroRobertoWachholtzAraya），1899年7月19日生于塔克纳（时属智利），1980年5月21日在伦戈去世。土木工程师、激进党政治家，德裔后代。其父马克西莫·瓦赫霍尔茨，母埃尔维拉·阿拉亚（母姓即名单所记之\"Araya\"）；兄豪尔赫·瓦赫霍尔茨曾任伊瓦涅斯第一届政府的塔拉帕卡区长与参议员。1925年毕业于智利大学工程学院，此后与卡洛斯·亚历山德里·阿尔塔米拉诺合组\"瓦赫霍尔茨与亚历山德里\"工程公司，承建托科皮利亚供水工程、科库莱至拉戈兰科铁路、伊基克至平塔多斯铁路机厂等重要基础设施，并参与创立智利石油公司（COPEC）。1938年12月24日由阿吉雷·塞尔达总统任命为财政部长——任内两件大事接踵而至：CORFO（生产开发公司）的创建以及1939年奇廉大地震后的紧急财政应对。后在冈萨雷斯·魏地拉政府中再度出任财政部长，并兼任经济与商业部长（1946年11月至1947年1月）。1959年在圣地亚哥参议员补选中以激进党候选人身份胜选，接替就任总统的豪尔赫·亚历山德里所遗空缺，任至1965年。"
  CBIO_CHL_rolando_reyes_desc:0 "名单提供的信息是\"罗兰多·雷耶斯/RolandoReyes/CHL_rolando_reyes/补漏\"，交接文档疑其为罗兰多·梅里诺·雷耶斯（RolandoMerinoReyes），与1932年\"社会主义共和国\"执政团相关。如此辨识正确，则此人在1932年6月的\"社会主义共和国\"短暂存续期间参与了执政团的运作——交接§11记载他\"顶替达维拉\"，即在达维拉被推翻后成为执政团的成员之一。1932年的政治更迭极为频繁（6月4日格罗韦政变→12天后达维拉推翻格罗韦→达维拉称临时总统→9月布兰切接任→10月恢复宪政），梅里诺·雷耶斯在其中的确切角色与任期因资料匮乏难以细述。其生卒日期无法在现有资料中确认。"
  CHL_rolando_reyes_desc:0 "名单提供的信息是\"罗兰多·雷耶斯/RolandoReyes/CHL_rolando_reyes/补漏\"，交接文档疑其为罗兰多·梅里诺·雷耶斯（RolandoMerinoReyes），与1932年\"社会主义共和国\"执政团相关。如此辨识正确，则此人在1932年6月的\"社会主义共和国\"短暂存续期间参与了执政团的运作——交接§11记载他\"顶替达维拉\"，即在达维拉被推翻后成为执政团的成员之一。1932年的政治更迭极为频繁（6月4日格罗韦政变→12天后达维拉推翻格罗韦→达维拉称临时总统→9月布兰切接任→10月恢复宪政），梅里诺·雷耶斯在其中的确切角色与任期因资料匮乏难以细述。其生卒日期无法在现有资料中确认。"
  CBIO_CHL_juan_gomez_millas_desc:0 "全名胡安·戈麦斯·米利亚斯，1900年8月19日生于圣地亚哥，1987年9月30日在圣地亚哥去世。教育家、知识分子，智利20世纪高等教育改革的核心人物。智利大学毕业后从事教育与人文研究。1953年出任智利大学校长，任职十年（至1963年），是该校任期最长的校长之一。任内他大力推动大学的民主化与扩展——增设地区分校、扩大招生、引进新学科，使智利大学从精英学府向面向全国的综合性大学转型。1964年弗雷·蒙塔尔瓦政府任命他为教育部长（1964–1968），任内推行教育改革，扩大基础教育覆盖率。"
  CHL_juan_gomez_millas_desc:0 "全名胡安·戈麦斯·米利亚斯，1900年8月19日生于圣地亚哥，1987年9月30日在圣地亚哥去世。教育家、知识分子，智利20世纪高等教育改革的核心人物。智利大学毕业后从事教育与人文研究。1953年出任智利大学校长，任职十年（至1963年），是该校任期最长的校长之一。任内他大力推动大学的民主化与扩展——增设地区分校、扩大招生、引进新学科，使智利大学从精英学府向面向全国的综合性大学转型。1964年弗雷·蒙塔尔瓦政府任命他为教育部长（1964–1968），任内推行教育改革，扩大基础教育覆盖率。"
  CBIO_CHL_salvador_allende_desc:0 "全名萨尔瓦多·吉列尔莫·阿连德·戈森斯，1908年6月26日生于瓦尔帕莱索一个上中产家庭（祖父为激进党创始人之一），1973年9月11日在圣地亚哥拉莫内达总统府内自杀身亡（2011年经开棺验尸确认为自杀）。医生、社会主义政治家，拉丁美洲首位经民主选举上台的马克思主义总统。1926年入智利大学医学院，学生时代即投身左翼运动——参与反伊瓦涅斯独裁的学生抗议。1933年4月19日他与格罗韦、施纳克、马丁内斯等人共同创建智利社会党。1937年（年仅29岁）当选瓦尔帕莱索众议员。1939年阿吉雷·塞尔达政府任命他为卫生部长，由此从年轻众议员进入全国行政核心。此后长期任参议员。他四度参选总统：1952年（第四名）、1958年（以约三万票之差负于豪尔赫·亚历山德里，居第二）、1964年（败于弗雷·蒙塔尔瓦）、1970年终以36.6%的相对多数胜出。1970年11月就任总统后，他推行\"智利社会主义之路\"——铜矿国有化、深化土地改革、国有化大型企业与银行。其激进经济政策导致通胀飙升、资本外逃与物资短缺，同时面临美国尼克松政府的经济封锁与秘密颠覆。1973年9月11日，皮诺切特率三军与武装警察发动政变，空军战斗机轰炸拉莫内达宫；阿连德拒绝出逃，以卡斯特罗所赠AK-47步枪自杀殉职。"
  CHL_salvador_allende_desc:0 "全名萨尔瓦多·吉列尔莫·阿连德·戈森斯，1908年6月26日生于瓦尔帕莱索一个上中产家庭（祖父为激进党创始人之一），1973年9月11日在圣地亚哥拉莫内达总统府内自杀身亡（2011年经开棺验尸确认为自杀）。医生、社会主义政治家，拉丁美洲首位经民主选举上台的马克思主义总统。1926年入智利大学医学院，学生时代即投身左翼运动——参与反伊瓦涅斯独裁的学生抗议。1933年4月19日他与格罗韦、施纳克、马丁内斯等人共同创建智利社会党。1937年（年仅29岁）当选瓦尔帕莱索众议员。1939年阿吉雷·塞尔达政府任命他为卫生部长，由此从年轻众议员进入全国行政核心。此后长期任参议员。他四度参选总统：1952年（第四名）、1958年（以约三万票之差负于豪尔赫·亚历山德里，居第二）、1964年（败于弗雷·蒙塔尔瓦）、1970年终以36.6%的相对多数胜出。1970年11月就任总统后，他推行\"智利社会主义之路\"——铜矿国有化、深化土地改革、国有化大型企业与银行。其激进经济政策导致通胀飙升、资本外逃与物资短缺，同时面临美国尼克松政府的经济封锁与秘密颠覆。1973年9月11日，皮诺切特率三军与武装警察发动政变，空军战斗机轰炸拉莫内达宫；阿连德拒绝出逃，以卡斯特罗所赠AK-47步枪自杀殉职。"
  CBIO_CHL_jorge_alessandri_desc:0 "1896年5月19日生于圣地亚哥，1986年8月31日在圣地亚哥去世。土木工程师、企业家与政治人物，阿图罗·亚历山德里总统之子。智利大学工程学院毕业后进入商界，后出任生产与商业联合会（ConfederacióndelaProducciónydelComercio）主席，成为工商界的代言人。1947–1950年任圣地亚哥参议员。1958年以无党派候选人身份（获保守党与自由党支持）当选总统——以约三万票优势险胜阿连德。任期（1958–1964）内推行保守的经济稳定政策、控制通胀、鼓励外国投资，但农业改革力度不足、社会矛盾加剧。1970年再度参选总统，得票居第二（34.9%），输给阿连德（36.6%）。1973年政变后他在皮诺切特军政府中参与起草1980年宪法的公投程序。"
  CHL_jorge_alessandri_desc:0 "1896年5月19日生于圣地亚哥，1986年8月31日在圣地亚哥去世。土木工程师、企业家与政治人物，阿图罗·亚历山德里总统之子。智利大学工程学院毕业后进入商界，后出任生产与商业联合会（ConfederacióndelaProducciónydelComercio）主席，成为工商界的代言人。1947–1950年任圣地亚哥参议员。1958年以无党派候选人身份（获保守党与自由党支持）当选总统——以约三万票优势险胜阿连德。任期（1958–1964）内推行保守的经济稳定政策、控制通胀、鼓励外国投资，但农业改革力度不足、社会矛盾加剧。1970年再度参选总统，得票居第二（34.9%），输给阿连德（36.6%）。1973年政变后他在皮诺切特军政府中参与起草1980年宪法的公投程序。"
  CBIO_CHL_bernardo_leighton_desc:0 "1909年8月16日生于比奥比奥的纳西缅托，1995年1月24日在圣地亚哥去世。律师、基督教民主派政治家，智利20世纪最受敬重的民主人物之一。青年时入保守党青年翼，后于1935年与弗雷·蒙塔尔瓦、托米克等人创建国民方阵——一个脱离保守党、转向社会天主教路线的新运动（后于1957年发展为基督教民主党）。1937年，经卫生部长克鲁斯-科克的举荐，年仅28岁的他被亚历山德里总统任命为劳工部长，成为内阁中最年轻的部长之一。此后历任众议员、参议员，在基民党内属左翼，主张与社会主义力量对话。1973年9月政变后他公开反对皮诺切特独裁，被迫流亡欧洲。1975年10月6日，在罗马街头遭皮诺切特政权秘密警察DINA派遣的意大利新法西斯分子枪击——他与妻子安妮塔·弗雷斯诺均中弹，双双幸存但身负重伤，莱顿此后终身行动不便。1990年民主回归后他返国，获授国家荣誉。"
  CHL_bernardo_leighton_desc:0 "1909年8月16日生于比奥比奥的纳西缅托，1995年1月24日在圣地亚哥去世。律师、基督教民主派政治家，智利20世纪最受敬重的民主人物之一。青年时入保守党青年翼，后于1935年与弗雷·蒙塔尔瓦、托米克等人创建国民方阵——一个脱离保守党、转向社会天主教路线的新运动（后于1957年发展为基督教民主党）。1937年，经卫生部长克鲁斯-科克的举荐，年仅28岁的他被亚历山德里总统任命为劳工部长，成为内阁中最年轻的部长之一。此后历任众议员、参议员，在基民党内属左翼，主张与社会主义力量对话。1973年9月政变后他公开反对皮诺切特独裁，被迫流亡欧洲。1975年10月6日，在罗马街头遭皮诺切特政权秘密警察DINA派遣的意大利新法西斯分子枪击——他与妻子安妮塔·弗雷斯诺均中弹，双双幸存但身负重伤，莱顿此后终身行动不便。1990年民主回归后他返国，获授国家荣誉。"
  CBIO_CHL_jeronimo_mendez_desc:0 "1887年9月25日生于查尼亚拉尔，1959年在圣地亚哥去世，享年71岁。外科医师出身的激进党政治家，1914年以论文《眼疾》毕业于智利大学医学院、取得外科医师资格，专攻眼科，1926年及1930–1931年两度赴欧洲进修。早年在奥瓦列行医，1921年起任科金博医院医师，1924至1945年长期出任该院院长，并兼科金博工人保险与国营铁路北区的主任医师。1905年即加入科金博激进党，连任省党部主席逾十八年，1946年出任激进党全国执委会主席；公职历任科金博市长、市政议员，1940年7月补选为阿塔卡马—科金博省参议员。1941年11月10日，重病的阿吉雷·塞尔达总统任命他为内政部长——依1925年宪法，内政部长即法定副总统，使他在总统养病期间得以代行职权。同月25日阿吉雷·塞尔达因肺结核病逝后，他依宪以副总统身份代理总统职权，直至1942年4月2日里奥斯就职。这约五个月的过渡期内，其首要使命是主持1942年2月1日的总统大选并确保权力平稳交接，最终由激进党人胡安·安东尼奥·里奥斯胜出。其间他兼任智利国家航空公司（LAN）总裁；卸任后又于里奥斯及冈萨雷斯·魏地拉两届政府短期出任卫生部长、内政部长等职。"
  CHL_jeronimo_mendez_desc:0 "1887年9月25日生于查尼亚拉尔，1959年在圣地亚哥去世，享年71岁。外科医师出身的激进党政治家，1914年以论文《眼疾》毕业于智利大学医学院、取得外科医师资格，专攻眼科，1926年及1930–1931年两度赴欧洲进修。早年在奥瓦列行医，1921年起任科金博医院医师，1924至1945年长期出任该院院长，并兼科金博工人保险与国营铁路北区的主任医师。1905年即加入科金博激进党，连任省党部主席逾十八年，1946年出任激进党全国执委会主席；公职历任科金博市长、市政议员，1940年7月补选为阿塔卡马—科金博省参议员。1941年11月10日，重病的阿吉雷·塞尔达总统任命他为内政部长——依1925年宪法，内政部长即法定副总统，使他在总统养病期间得以代行职权。同月25日阿吉雷·塞尔达因肺结核病逝后，他依宪以副总统身份代理总统职权，直至1942年4月2日里奥斯就职。这约五个月的过渡期内，其首要使命是主持1942年2月1日的总统大选并确保权力平稳交接，最终由激进党人胡安·安东尼奥·里奥斯胜出。其间他兼任智利国家航空公司（LAN）总裁；卸任后又于里奥斯及冈萨雷斯·魏地拉两届政府短期出任卫生部长、内政部长等职。"
  CBIO_CHL_luis_alamos_barros_desc:0 "1893年2月8日生于奇廉，1960年1月6日在圣地亚哥去世。律师、记者、激进党政治家。在奇廉中学完成中等教育后，入智利大学法学院，1916年12月14日取得律师资格；此后长期从事农业，拥有圣贝纳多苏尔庄园，亦任奇廉《今日报》（ElDía）的创办人与主任，并在多家报刊发表经济、政治与法律评论。1924年任尼布莱省省长，曾任奇廉市议员。1926年当选众议员（圣卡洛斯、奇廉、布尔内斯与扬盖选区，任至1930年）。1932年当选参议员（尼布莱与康塞普西翁省，任至1937年），期间为1936年奇廉上诉法院的成立出力。在政府任职方面，他多度出任部长：1931年在特鲁科代总统任内短暂出任促进部长；1936年9月12日至1937年3月29日再任亚历山德里政府促进部长；1945年任里奥斯政府内政部长；1946年在杜阿尔德代理政府短暂出任财政部长。1944年代表智利出席布雷顿森林会议。曾任激进党主席（1938年一届）、中央银行顾问、硝石与碘销售公司（Covensa）副主席、对外贸易委员会顾问。为共济会成员，并为奇廉的多个社会慈善机构积极效力。"
  CHL_luis_alamos_barros_desc:0 "1893年2月8日生于奇廉，1960年1月6日在圣地亚哥去世。律师、记者、激进党政治家。在奇廉中学完成中等教育后，入智利大学法学院，1916年12月14日取得律师资格；此后长期从事农业，拥有圣贝纳多苏尔庄园，亦任奇廉《今日报》（ElDía）的创办人与主任，并在多家报刊发表经济、政治与法律评论。1924年任尼布莱省省长，曾任奇廉市议员。1926年当选众议员（圣卡洛斯、奇廉、布尔内斯与扬盖选区，任至1930年）。1932年当选参议员（尼布莱与康塞普西翁省，任至1937年），期间为1936年奇廉上诉法院的成立出力。在政府任职方面，他多度出任部长：1931年在特鲁科代总统任内短暂出任促进部长；1936年9月12日至1937年3月29日再任亚历山德里政府促进部长；1945年任里奥斯政府内政部长；1946年在杜阿尔德代理政府短暂出任财政部长。1944年代表智利出席布雷顿森林会议。曾任激进党主席（1938年一届）、中央银行顾问、硝石与碘销售公司（Covensa）副主席、对外贸易委员会顾问。为共济会成员，并为奇廉的多个社会慈善机构积极效力。"
  CBIO_CHL_dario_mujica_gamboa_desc:0 "智利海军军官，后成为智利空军的创始成员之一。他在海军中官至护卫舰上尉（capitándecorbeta）。1930年3月21日伊瓦涅斯总统签署法令创建智利空军（FAN，今FACh）后，同月28日海军发布命令，将20名海军军官移交至新建的空军建制——穆希卡·甘博亚即在此名单之中，与阿迪里奥·赫森、曼努埃尔·弗兰克、路易斯·马林等人一同成为空军的首批骨干军官。这批从海军转入的飞行员与陆军转入的航空军官（由梅里诺·贝尼特斯统领）共同构成了智利空军的初创阵容。"
  CHL_dario_mujica_gamboa_desc:0 "智利海军军官，后成为智利空军的创始成员之一。他在海军中官至护卫舰上尉（capitándecorbeta）。1930年3月21日伊瓦涅斯总统签署法令创建智利空军（FAN，今FACh）后，同月28日海军发布命令，将20名海军军官移交至新建的空军建制——穆希卡·甘博亚即在此名单之中，与阿迪里奥·赫森、曼努埃尔·弗兰克、路易斯·马林等人一同成为空军的首批骨干军官。这批从海军转入的飞行员与陆军转入的航空军官（由梅里诺·贝尼特斯统领）共同构成了智利空军的初创阵容。"
  CBIO_CHL_diego_aguilar_desc:0 "迭戈·阿拉塞纳·阿吉拉尔（DiegoAracenaAguilar）智利航空先驱与军事飞行员。1891年2月22日生于科皮亚波，1978年8月2日在圣地亚哥去世。1913年入军校，后转入航空领域。1920年代他是智利军事航空发展的关键人物之一，1930年出任空军参谋长。最著名的壮举是领导了多次远程飞行任务，推动了智利领空的拓展与航空基础设施的建设。后晋升航空将军。"
  CHL_diego_aguilar_desc:0 "迭戈·阿拉塞纳·阿吉拉尔（DiegoAracenaAguilar）智利航空先驱与军事飞行员。1891年2月22日生于科皮亚波，1978年8月2日在圣地亚哥去世。1913年入军校，后转入航空领域。1920年代他是智利军事航空发展的关键人物之一，1930年出任空军参谋长。最著名的壮举是领导了多次远程飞行任务，推动了智利领空的拓展与航空基础设施的建设。后晋升航空将军。"
  CBIO_CHL_arturo_olavaria_desc:0 "1900年4月2日生于库里科，父阿尔曼多·奥拉瓦里亚，母阿梅利亚·布拉沃，1977年1月12日在圣地亚哥去世。律师、激进党政治家，兼以多卷本政治回忆录名世。早年在圣地亚哥应用中学就读，后赴智利大学法学院攻读，兼修厄瓜多尔基多大学课程，1923年在基多取得法学与法理学博士学位，1927年12月24日在智利正式宣誓就职律师。1918年起出任塔拉帕卡参议员阿图罗·亚历山德里的私人秘书，随其入驻拉莫内达宫（1920），直至1924年军事干政为止，由此积累了总统府内情与第一手政治观察，成为日后政治著述的素材库。1931年加入社会共和党，1938年转投激进党，出任党总书记并主持阿吉雷·塞尔达的总统竞选活动。阿吉雷·塞尔达就任后即于1938年12月24日任命他为农业部长（至1940年2月），任内主导推动《小农合作社法》（第6382号法律，1939年8月颁布）。1940年12月23日转任内政部长（至1941年9月16日），任内以强硬手段镇压工潮——以驱逐拒绝复工的农场工人、以\"极刑\"威慑铁路工人罢工，这套手段被他自己命名为\"末日审判体系\"，引发强烈批评。1946年冈萨雷斯·魏地拉将共产党纳入内阁，他随即创建\"智利反共行动\"（ACHA）并退出激进党，转入激进党民主派（右翼分支）任副主席。伊瓦涅斯第二届政府期间先后出任教育部长（1953）及驻哥斯达黎加大使。晚年将数十年政治亲历写成四卷本回忆录《两个亚历山德里之间的智利》（1962–1965，纳西门托出版社），是研究1920至1950年代智利政坛的重要一手史料。"
  CHL_arturo_olavaria_desc:0 "1900年4月2日生于库里科，父阿尔曼多·奥拉瓦里亚，母阿梅利亚·布拉沃，1977年1月12日在圣地亚哥去世。律师、激进党政治家，兼以多卷本政治回忆录名世。早年在圣地亚哥应用中学就读，后赴智利大学法学院攻读，兼修厄瓜多尔基多大学课程，1923年在基多取得法学与法理学博士学位，1927年12月24日在智利正式宣誓就职律师。1918年起出任塔拉帕卡参议员阿图罗·亚历山德里的私人秘书，随其入驻拉莫内达宫（1920），直至1924年军事干政为止，由此积累了总统府内情与第一手政治观察，成为日后政治著述的素材库。1931年加入社会共和党，1938年转投激进党，出任党总书记并主持阿吉雷·塞尔达的总统竞选活动。阿吉雷·塞尔达就任后即于1938年12月24日任命他为农业部长（至1940年2月），任内主导推动《小农合作社法》（第6382号法律，1939年8月颁布）。1940年12月23日转任内政部长（至1941年9月16日），任内以强硬手段镇压工潮——以驱逐拒绝复工的农场工人、以\"极刑\"威慑铁路工人罢工，这套手段被他自己命名为\"末日审判体系\"，引发强烈批评。1946年冈萨雷斯·魏地拉将共产党纳入内阁，他随即创建\"智利反共行动\"（ACHA）并退出激进党，转入激进党民主派（右翼分支）任副主席。伊瓦涅斯第二届政府期间先后出任教育部长（1953）及驻哥斯达黎加大使。晚年将数十年政治亲历写成四卷本回忆录《两个亚历山德里之间的智利》（1962–1965，纳西门托出版社），是研究1920至1950年代智利政坛的重要一手史料。"
  CBIO_CHL_arturo_benitez_desc:0 "智利航空之父，圣地亚哥国际机场即以其命名。1888年5月17日生于奇廉，1970年5月2日因中风在圣地亚哥去世，享年81岁。陆军炮兵军官出身，1903年入军校，1908年以少尉毕业。自1910年代起长期致力于将航空引入智利军事与民用体系，被后世誉为\"智利航空之父\"。1926年出任军事航空学校校长，1928年升任航空总监并创建智利航空俱乐部。1929年他主导开辟了圣地亚哥至阿里卡的航空邮递线路，这一举措直接催生了智利国家航空公司（LAN，今LATAM前身）的设立——这是拉丁美洲最早的国家航空公司之一。1924年\"佩剑之声\"军人政治运动期间他是积极参与者。1930年3月21日，在他的持续推动下，伊瓦涅斯总统签署法令正式创建智利空军（FACh），他出任首任空军司令兼首任航空副部长；同年他还推动在塞里约斯建立了柯蒂斯飞机制造厂。1932年退役，获\"空军准将\"（Comodoro）军衔。退役后长期参与LAN的经营管理，1952年再度出任LAN主席，持续推动智利航空网络向南部与极地延伸。政治上以\"左翼民族主义者\"自居，晚年是萨尔瓦多·阿连德的热情支持者。"
