 CBIO_POR_antonio_de_oliveira_salazar_desc:0 "全名安东尼奥·德·奥利维拉·萨拉查，1889年4月28日生于中部贝拉地区维塞乌区圣孔巴当村一个小地主家庭。少年入韦米亚里神学院预备晋铎，后转科英布拉大学法律系，1914年毕业，1917年获经济学与财政学博士学位并留校任教。1921年当选天主教中心党众议员，一周后辞去。1926年5月28日军事政变后短暂出任财政部长九日辞职。1928年再度出任财政部长，迫使政府让其全权掌控国家财政。1932年7月5日出任内阁总理，成为葡萄牙实际最高领导人。1933年主持新宪法通过，确立法团主义威权体制新国家。西班牙内战期间暗助佛朗哥、组织维里亚托志愿军。二战期间维持中立同时向英美出售亚速尔基地。战后镇压反对派、维系殖民帝国。1961年安哥拉与葡属印度危机、1962年萨拉查主义鼎盛。1968年8月因跌倒引发脑溢血，秘密由马塞洛·卡埃塔诺接任但对其隐瞒实情。1970年7月27日在里斯本去世。执政三十六载，实为二十世纪欧洲在位最久的独裁者之一。"
 CBIO_POR_bento_goncalves_desc:0 "全名本托·安东尼奥·贡萨尔维斯，1902年3月2日生于波尔图区菲盖伊拉，父亲为农业工人。少年时随家赴巴西谋生，1919年返国后入阿马多拉铁路工场当学徒机械工。1927年经好友介绍加入葡萄牙共产党，很快展露组织才能。1929年当选中央委员会委员并任总书记，此后领导党的秘密改组，从内部涤除无政府工联主义影响、建立职业革命家党组织，被公认为葡共布尔什维克化的关键人物。1935年秘密赴莫斯科出席共产国际第七次代表大会，任葡共代表并当选共产国际执行委员会候补委员，途中路过巴黎、马赛、苏联多城。返国后于1935年11月被政治警察逮捕，判刑后被押往佛得角塔拉法尔集中营。狱中他仍继续以纸笔与外界党务联络、教育难友、组织狱中党支部。在长期营养不良和热带疾病折磨下，1942年9月11日在塔拉法尔集中营病逝，年仅四十岁。"
 CBIO_POR_rolao_preto_desc:0 "全名弗朗西斯科·德·巴塞洛斯·罗朗·普雷托，1893年2月14日生于阿连特茹北部加维昂一个小地主家庭。青年时期考入科英布拉大学法律系，期间积极参与君主派运动，与安东尼奥·萨尔迪尼亚、路易斯·德·阿尔梅达·布拉加、拉波索等一同参与卢济塔尼亚整体主义的早期活动。1917年赴意大利深造，回国后参与整体主义机关刊物君主国报编纂，1921年因君主派活动被下狱，出狱后曾一度代理该报主编。1932年他决心自立门户，创立国民工团主义运动 MNS，即所谓蓝衫党，试图将整体主义、法西斯组织形式与工团主义纲领相糅合，一度吸纳数万党员。1934年他公开与萨拉查决裂，遭政治警察镇压。1935年运动被取缔后他与蒙萨拉斯一同被流放至共和西班牙。西班牙内战爆发后他倒向共和派方面，与萨拉查体制的合作彻底破裂。二战后他持续以流亡姿态发起对萨拉查体制的批判，是自由派、社会党、共产党等各路反对派均能对话的少数右翼元老。1974年康乃馨革命后回国参与新的民主政治，同年参选总统败选。1977年12月18日去世。"
 CBIO_POR_jose_norton_de_matos_desc:0 "全名若泽·门德斯·里贝罗·诺顿·德·马托斯，1867年3月23日生于科英布拉区上蒙德古县庞比阿尔小镇一个中产家庭。少年入科英布拉大学预科，1888年入陆军工兵专业。1898年赴葡属印度果阿服役，1907年出任葡属莫桑比克总参谋部工作。1911年至1915年任葡属安哥拉总督，主持修铁路与推动殖民行政现代化。第一次世界大战末期任战争部长，主持组建葡萄牙远征军赴法国参战。1921年至1923年再度出任葡属安哥拉总督兼高级专员。此后主持共济会葡萄牙总部大东方组织多年。1949年应反对派共同推举以八十二岁高龄出任总统候选人对阵萨拉查所支持的现任总统奥斯卡·卡尔莫纳，在选举日前夕以政府不给予公平竞选环境为由退选。此后成为民主统一运动 MUD 的精神领袖并长期承受政治警察监视。1955年1月3日在里斯本去世。"
 CBIO_POR_jose_vicente_de_freitas_desc:0 "1869年3月23日生于马德拉群岛丰沙尔。工程兵军官出身，长期在葡萄牙陆军服役，晋升至将军。1926年5月28日军事政变后进入新政府核心圈，1928年4月18日至1929年7月8日任军事独裁时期第二任内阁总理，任内首次将萨拉查引入政府担任财政部长，并给予其全权处理财政的关键让步，为日后新国家体制的诞生铺就制度基础。他并兼任战争部长与殖民地部长。曾任里斯本市长。属军事独裁时期温和派军人的代表人物之一，对萨拉查最终一党集权体制虽有保留但未公开反对。1952年10月6日去世。"
 CBIO_POR_luis_augusto_ferreira_martins_desc:0 "全名路易斯·奥古斯托·费雷拉·马丁斯，1885年8月23日生于里斯本区新村县。陆军军官出身，长期服役于炮兵部队并擅长军事史与殖民史研究。第一次世界大战期间随葡萄牙远征军赴法国参战。战后专注军事历史撰述，出版多部葡萄牙参战史与殖民战争史著作，其中三卷本葡萄牙大战为葡语世界研究葡萄牙一战参战的经典参考。晚年任葡萄牙军事史学会主席，为葡萄牙国立军事博物馆与相关军史机构建设做出重要贡献。作为忠于新国家体制的军人史家，他的著作长期被作为官方军事教育与史学参考。1966年11月13日去世。"
 CBIO_POR_raul_augusto_esteves_desc:0 "1878年6月20日生于里斯本。步兵军官出身，长期服役并晋升至将军。第一次世界大战期间在葡萄牙远征军中赴法国佛兰德斯前线参战，任步兵旅长指挥。战后长期在陆军总参谋部工作。1936年西班牙内战爆发后，出任葡萄牙军事观察团团长赴西班牙考察佛朗哥方作战，率参谋长若泽·菲利佩·德·巴罗斯·罗德里格斯与幕僚随维里亚托志愿军深入前线，为萨拉查政府提供对西政策与葡军作战方式改革的第一手建议。曾任战争学院院长与陆军上将。作为萨拉查体制信任的军事技术官员，他为新国家早期葡军现代化与情报体系建设发挥关键作用。1955年2月6日去世。"
 CBIO_POR_jose_mendes_cabecadas_desc:0 "全名若泽·门德斯·卡贝萨达斯·儒尼奥尔，1883年8月19日生于阿尔加维洛勒区洛勒。海军军官出身，1910年10月5日共和革命的核心参与者之一，事后长期任海军军官并晋升至海军中将。1919年任共产党倾向的年轻共和派军人组织民主左翼核心成员。1926年5月28日军事政变期间联合陆海军策动，胜利后于5月31日至6月17日短暂出任国家元首与总理之职，仅十八日即被戈麦斯·达·科斯塔将军接管而卸任。此后长期在海军服役，转向反对派立场，1932年退役后成为民主派温和阵营的元老之一。二战期间任反萨拉查军人组织国家解放军事组织的核心，1946年领导反对派联合体国家解放军事委员会。1965年6月11日去世。"
 CBIO_POR_humberto_delgado_desc:0 "全名温贝托·达·席尔瓦·德尔加多，1906年5月15日生于圣塔伦区托雷什诺瓦什。空军飞行员出身，青年时受萨拉查体制青睐，先后任新国家青年运动全国司令、葡萄牙民航局局长、驻华盛顿武官兼北约常任军事代表。1957年因不满萨拉查独裁转向反对派。1958年应反对派共推为总统候选人对阵亚美利哥·托马斯，5月10日在里斯本金钥匙咖啡馆记者会上被法新社记者问及若当选将如何对待萨拉查时脱口答曰显然我将解雇他，一时震动全国，被誉为无畏将军。同年6月8日选举遭政府舞弊落败。此后遭撤职并流亡巴西，创立葡萄牙全国独立运动，1961年参与圣塔玛丽亚号劫船事件与贝雅军营突袭。1965年2月13日在西班牙巴达霍斯边境被 PIDE 特工组诱杀，与秘书阿拉贾雅·坎波斯同时遇害。"
 CBIO_POR_francisco_craveiro_lopes_desc:0 "全名弗朗西斯科·希吉诺·克拉维罗·洛佩斯，1894年4月12日生于里斯本。陆军军官出身，一战末期随葡萄牙远征军赴法国参战，战后在陆军参谋系统长期任职并晋升至陆军上将。1949年由萨拉查提名接替已故元帅奥斯卡·卡尔莫纳之遗缺，1951年7月21日总统选举中因反对派候选人金唐·梅雷莱斯抗议选票纸张丑闻退选后无对手当选，出任葡萄牙第十二任总统。任内他保持与萨拉查的表面配合，但在殖民政策、军事改革与与美国关系的处理上多次与总理意见相左，尤其在1961年博特略·莫尼斯与达科斯塔·戈麦斯发动的四月事件政变企图中被萨拉查怀疑与阴谋派有默契。1958年被萨拉查以政党大会决议方式拒绝提名连任，改由亚美利哥·托马斯继任，是新国家体制下第一位被萨拉查以非正常方式撤换的总统。1964年9月2日在里斯本去世。"
 CBIO_POR_antonio_oscar_carmona_desc:0 "全名安东尼奥·奥斯卡·德·弗拉戈索·卡尔莫纳，1869年11月24日生于里斯本佩纳教区。父与祖均为陆军将军。1882年入里斯本军校，1890年入陆军学校修骑兵专业。1899年晋中尉，1907年上尉，1916年中校，1919年上校，1922年将军，1947年元帅。一战末期任锡多尼奥·派斯政府战争部秘书。1923年任战争部长镇压左派激进阴谋，1924年任第二区军事法庭庭长、1925年4月18日革命军人审判的检察官，庭上以祖国有病令法庭审判其最亲爱的儿子的名言反将共和体制推上被告席。1926年5月28日军事政变后先后任外交部长、战争部长与内阁总理，11月16日任国家元首。1928年3月25日以唯一候选人当选总统，此后1935、1942、1949年连任，任内共二十五年为葡萄牙共和国在位最久的总统。他将萨拉查引入政府并信任其至终，1932年将总理职位交予其手。战后一度与反对派秘密接触谋议改革但未成事。1951年4月18日因支气管肺炎在里斯本鲁米亚尔家中去世，享年八十一岁，1966年安葬国家先贤祠。"
 CBIO_POR_americo_tomas_desc:0 "全名亚美利哥·德·德乌斯·罗德里格斯·托马斯，1894年11月19日生于波尔图市中心圣尼古拉斯教区。海军军官出身，专修水文学与航海科学。1918年海军学校毕业。1935年出任海军部长曼努埃尔·奥丁斯·德·贝滕库尔的办公厅主任，同时兼任水文任务多项，包括安哥拉隆达边界勘定任务、扎伊尔河水文任务、佛得角地理任务的团长。1940年任国家商船工业委员会主席。1944年9月6日接替奥丁斯·德·贝滕库尔出任新国家体制第三届政府海军部长，1945年8月10日颁布100号令，制定葡萄牙商船队现代化更新计划，为后来一系列发展计划的先声。1958年6月8日总统选举中作为国民联盟候选人对阵反对派温贝托·德尔加多，靠电子舞弊当选。1958年8月9日至1974年4月25日康乃馨革命之日在任，为新国家体制最后一任总统。任内三度访问葡属海外省作宣示。革命后被免职，1980年获亚美利哥·塔玛斯赦免。1987年9月18日在卡斯凯什去世。"
 CBIO_POR_francisco_da_costa_gomes_desc:0 "全名弗朗西斯科·达科斯塔·戈麦斯，1914年6月30日生于布拉干萨区希亚兹德萨拉门托教区。陆军军官出身，专修数学与工程。二战期间在亚速尔基地服役与英美盟军协调。1958年任战争部长副国务秘书，1961年博特略·莫尼斯四月事件政变企图中与其一同签名要求总理辞职，事败被免职。此后任葡属莫桑比克军事总司令，1965年任葡属安哥拉军事总司令，1970年任陆军参谋长。1972年因公开批评殖民战争政策被撤职并调任东部军区。1974年3月14日与斯宾诺拉将军因拒绝出席公开支持殖民战争的集会一同被免。4月25日康乃馨革命胜利后加入国家救国委员会，1974年9月30日接任临时总统直至1976年7月14日。任内主持革命进程各种冲突调解与制宪工作，被称为人民元帅。2001年7月31日在里斯本去世。"
 CBIO_POR_julio_botelho_moniz_desc:0 "全名儒略·卡洛斯·阿尔维斯·迪亚斯·博特略·莫尼斯，1900年3月28日生于阿连特茹葡萄园区一个贵族家庭。1917年入军校，一战末期赴法国参战。二战期间任驻华盛顿武官，深入观察美军作战方式。战后长期在葡军参谋系统与非洲殖民地服役，1951至1958年任葡属莫桑比克军事总司令。1958年被萨拉查任命为国防部长，试图推动葡军现代化并将葡军装备改采北约标准。1961年3月安哥拉起义爆发后他主张对殖民政策做出重大改革与政治开放，4月13日联合达科斯塔·戈麦斯等要求萨拉查辞职，这场未遂的宫廷政变即四月事件。事败被免职并被软禁。1944年为博特略·莫尼斯撰写殖民作战之实施一书，由若昂·德·阿泽维多·科蒂尼奥作序。1970年1月10日去世。"
 CBIO_POR_domingos_oliveira_desc:0 "全名多明戈斯·奥古斯托·阿尔维斯·达·科斯塔·奥利维拉，1873年11月28日生于阿威罗区。骑兵军官出身，晋升至将军。第一次世界大战末期在葡萄牙远征军中任高级指挥官。1926年5月28日军事政变后进入独裁政府核心，1930年1月21日至1932年7月5日任军事独裁时期第五任内阁总理，任期跨越关键的过渡阶段，任内主持1930年 União Nacional 国民联盟的初步组建与新宪法草案的推进，为萨拉查最终登上总理之位铺平最后台阶。他并兼任战争部长与内政部长。属军事独裁末期最坚定支持萨拉查的军人代表之一。1957年7月18日去世。"
 CBIO_POR_duarte_jose_pacheco_desc:0 "全名杜阿尔特·若泽·帕谢科，1900年9月24日生于法罗区洛勒。工程师出身，里斯本高等工学院电工工程博士。1928年应萨拉查邀请出任公共工程与通讯部长，仅二十七岁即入阁，为新国家体制最年轻的部长之一。任内主持里斯本大学城建设、里斯本国际机场、多条国道与水利工程。1932年一度辞职专事工程学研究。1938年再度出任公共工程与通讯部长，任内推动1940年葡萄牙世界博览会的筹备、贝伦发现者纪念碑与宝塔广场改造、里斯本-辛特拉高速公路等重大工程。1938年至1943年兼任里斯本市长。他以雷厉风行的作风著称，名言我没有时间体现其急促而高效的行政风格。1943年11月16日在维塞乌区因公务出行途中车祸重伤，同日在当地医院去世，年仅四十三岁。"
 CBIO_POR_augusto_de_vasconcelos_desc:0 "全名奥古斯托·佩雷拉·德·瓦斯康塞洛斯·科雷亚，1867年7月25日生于波尔图区。医生与政治家。1891年里斯本医学院毕业。1908年当选共和派众议员。1910年共和革命后长期担任第一共和国关键外交与政府职位。1911年8月出任外交部长，同年11月至1912年6月任总理兼外交部长，为共和国早期最重要的政治协调人物之一。1914年再度出任外交部长，是葡萄牙加入第一次世界大战协约国方面的关键推动者。战后长期任葡萄牙驻国际联盟代表，1922年出任国联大会主席。他为葡萄牙外交现代化与国际化奠定基础。1951年9月27日去世。"
 CBIO_POR_manuel_goncalves_cerejeira_desc:0 "全名曼努埃尔·贡萨尔维斯·塞雷热拉，1888年11月29日生于布拉加区维拉·维尔德。青年时代与萨拉查同为科英布拉大学天主教中心党学术核心与私人挚友。历史学博士，长期任科英布拉大学教会史教授。1928年任布拉加大主教助理，1929年11月18日被教宗庇护十一世任命为里斯本枢机主教，1929年至1971年在位四十二年，是新国家体制期间葡萄牙教会最高负责人。1932至1933年时期与老友萨拉查携手主持天主教会与法团国家的合作关系，签署1940年葡萄牙梵蒂冈协定与殖民协定，构筑葡萄牙天主教的国家教会体制。他多次公开支持萨拉查体制。1970年萨拉查去世后他为其举行盛大追悼弥撒。1971年因高龄退休。1977年8月1日去世。"
 CBIO_POR_fernando_dos_santos_costa_desc:0 "全名费尔南多·多斯·桑托斯·科斯塔，1899年6月4日生于圣塔伦区。工兵军官出身，与萨拉查、塞雷热拉同为科英布拉大学天主教中心党学术核心成员。1929年入职政府陆军副国务秘书处。1936年出任战争副国务秘书，同年组建葡萄牙军团法团民兵组织，任其最高指挥官至康乃馨革命前夕。1944年出任战争部长，1950年新国防部成立后转任国防部长兼战争部长直至1958年，为萨拉查最信任的军事事务掌门人。任内主持葡萄牙加入北约、殖民驻军扩编与葡军装备现代化。1958年被亚美利哥·托马斯当选总统后免职。1961年博特略·莫尼斯政变企图中他率军团民兵包围反叛部长并助萨拉查渡过危机。1982年4月10日去世。"
 CBIO_POR_agostinho_lourenco_desc:0 "全名阿戈斯蒂尼奥·洛伦索，1886年7月10日生于波尔图。骑兵军官出身，早年赴莫桑比克与安哥拉服役。1926年5月28日军事政变后转入警务系统，1928年出任新成立的国家警察总局长，1933年8月29日国家监视与保护警察 PVDE 成立时任其创始局长兼总监。他为萨拉查设计出以政治侦察、审讯、劳改营为核心的政治警察体系，并主持1936年在佛得角设立塔拉法尔集中营，本托·贡萨尔维斯 1942 年即殉难于此。1945年在葡萄牙战后转型压力下将 PVDE 改组为 PIDE 国家防卫与国际警察，继任局长至1956年退休。任内多次赴德国盖世太保与佛朗哥政治警察交流学习。他被公认为新国家体制政治警察体制的实际创立者。1968年6月15日去世。"
 CBIO_POR_jose_adriano_rebelo_pequito_desc:0 "1892年5月21日生于阿连特茹北部加维昂一个君主派家庭，同乡出身的另有罗朗·普雷托。在科英布拉大学修习法律，随家人流亡巴黎期间接触法兰西行动派，皈依保王传统主义。1914年返国后与何塞·希波利托·拉波索、阿尔贝托·蒙萨拉斯、安东尼奥·萨尔迪尼亚共同创立卢济塔尼亚整体主义。他是这一小圈子中唯一亲身加入葡萄牙远征军赴佛兰德斯参战的成员，同时为整体主义刊物撰写大量攻击城市文明的文章。1919年1月帕伊瓦·科塞罗发动北方君主起事，他参战重伤未死。二十年代末受乔治·瓦卢瓦影响，思想一度激进化并向工团派靠拢，与罗朗·普雷托的国民工团主义运动几近合流后又抽身而退，转而效忠萨拉查，1932年劝其废除现行宪法另立新秩序，此后两人保持三十年代长期私人通信。1936年志愿以飞行员身份赴西班牙内战，加入佛朗哥一方作战。晚年成为殖民主义的旗帜性辩护者，1961年葡属安哥拉殖民战争爆发之际，年近七旬仍主动请缨赴安哥拉执行反游击飞行任务。1983年1月22日在里斯本去世。"
 CBIO_POR_jose_adriano_pequito_rebelo_desc:0 "1892年5月21日生于阿连特茹北部加维昂一个君主派家庭，同乡出身的另有罗朗·普雷托。在科英布拉大学修习法律，随家人流亡巴黎期间接触法兰西行动派，皈依保王传统主义。1914年返国后与何塞·希波利托·拉波索、阿尔贝托·蒙萨拉斯、安东尼奥·萨尔迪尼亚共同创立卢济塔尼亚整体主义。他是这一小圈子中唯一亲身加入葡萄牙远征军赴佛兰德斯参战的成员，同时为整体主义刊物撰写大量攻击城市文明的文章。1919年1月帕伊瓦·科塞罗发动北方君主起事，他参战重伤未死。二十年代末受乔治·瓦卢瓦影响，思想一度激进化并向工团派靠拢，与罗朗·普雷托的国民工团主义运动几近合流后又抽身而退，转而效忠萨拉查，1932年劝其废除现行宪法另立新秩序，此后两人保持三十年代长期私人通信。1936年志愿以飞行员身份赴西班牙内战，加入佛朗哥一方作战。晚年成为殖民主义的旗帜性辩护者，1961年葡属安哥拉殖民战争爆发之际，年近七旬仍主动请缨赴安哥拉执行反游击飞行任务。1983年1月22日在里斯本去世。"
 CBIO_POR_alberto_monsaraz_desc:0 "全名阿尔贝托·德·莫雷斯·蒙萨拉斯，第二代蒙萨拉斯伯爵，1889年2月28日生于里斯本，父亲为诗人、第一代蒙萨拉斯伯爵安东尼奥·德·马塞多·帕潘萨。1907年入科英布拉大学修习法律，同时为右翼杂志新祖国撰稿。1911年10月追随帕伊瓦·科塞罗发动的君主入侵行动，事败流亡巴黎，在法国首都与其他被驱逐的青年君主派结成日后决定其政治走向的圈子。1914年与拉波索、佩基托·雷贝洛、安东尼奥·萨尔迪尼亚共同创立卢济塔尼亚整体主义。因家世富庶，他资助葡萄牙国、国民思想、君主国等整体主义机关刊物。1919年1月再度追随帕伊瓦·科塞罗参加北方君主起事，1月24日蒙桑图战斗中受重伤失去右肾，健康自此每况愈下。1925年因君主继承之争一度退出中央理事会。此后接触索雷尔与瓦卢瓦学说，皈依民族工团主义，1933年出任罗朗·普雷托蓝衫党国民工团主义运动的总书记。1935年运动被萨拉查取缔，他与罗朗·普雷托一同被流放至共和西班牙，一度公开将希特勒奉为政治偶像。1936年返国后重归整体主义立场。此后一生拒绝直呼萨拉查其名，讥其为里斯科堂的演讲人。1959年1月23日去世。"
 CBIO_POR_joao_de_azevedo_coutinho_desc:0 "全名若昂·安东尼奥·德·阿泽维多·科蒂尼奥·弗拉戈索·德·塞盖拉，1865年2月3日生于阿连特茹阿尔特·杜·尚一个贵族家庭。1880年以骑兵入伍，1882年转入海军见习军官。1886至1888年指挥屯格号、卢里奥号等艇在葡属莫桑比克进行军事行动与海岸测绘。1890年英国最后通牒前后的希雷与卢奥河流域抗争中，他指挥切林号炮艇助赛尔帕·平托维持葡萄牙对希雷地区的统治，平定甘比酋长与切洛莫地区。1891年1月15日以二十五岁之龄被众议院一致通过宣布为祖国功臣。此后任赞比西亚区总督、多次连任国会议员。1905至1906年出任莫桑比克总督，1909至1910年任海军与殖民部长。共和革命后拒绝效忠新政权，长期为流亡海外的曼努埃尔二世国王之侍从长，先后卷入多次君主派政变企图遭下狱与流放。1925至1926年再度当选参议员。萨拉查上台后与新国家体制和解，1942年经国民议会一致通过恢复海军军籍并晋升荣誉海军中将。撰有殖民战争回忆录多种，1944年为博特略·莫尼斯的殖民作战著作作序。1944年12月7日在里斯本去世。"
 CBIO_POR_jose_hipolito_raposo_desc:0 "全名何塞·希波利托·瓦兹·拉波索，1885年2月13日生于中部贝拉地区圣文森特-达贝拉。就读科英布拉大学后任律师。1911年偕好友蒙萨拉斯赴巴黎期间接触法兰西行动派，与其宗旨相共鸣。1913年与蒙萨拉斯、佩基托·雷贝洛、若昂·杜·阿马拉尔与安东尼奥·萨尔迪尼亚等联手重启保王派刊物葡萄牙国，翌年在科英布拉共同创立卢济塔尼亚整体主义，成为运动最主要的意识形态制定者之一，日后深刻影响巴西整体主义领袖普利尼奥·萨尔加多。他曾主编君主国报，短期入狱期间由罗朗·普雷托代理主编。1920年代与首批公开支持墨索里尼与意大利法西斯主义的十字军诺阿尔瓦雷斯团体过从甚密。虽同情国民工团主义，但不像蒙萨拉斯那样正式加入蓝衫党。他反对与纳粹相联的种族主义理论，认为葡属安哥拉与莫桑比克的黑人臣民同葡萄牙人一样属于葡萄牙民族。1932年与阿尔梅达·布拉加合办杂志卢济塔尼亚整体主义未获成功。起初对萨拉查态度矛盾，1940年断定其在毁掉葡萄牙，出版著作爱与效劳予以严厉批判。1947年所著露易莎·德·古兹曼传，迄今为该王后的标准传记。1953年8月26日去世。"
 CBIO_POR_jose_manuel_sarmento_de_beires_desc:0 "1892年9月4日生。葡萄牙陆军军官与航空先驱，1916 年入葡军军事航空学校首批学员。1920 年1月22日完成葡萄牙首次夜间飞行任务。1924 年与布里托·派斯少校以及机械师曼努埃尔·古维亚驾驶祖国号完成葡萄牙至澳门的首次远程飞行，历经全程一万六千余公里、总飞行时间117小时41分钟，中途因故障两次坠机、机组均生还。1927年3月至4月与副驾杜瓦莱·葡萄牙、领航员豪尔赫·德·卡斯蒂略与机械师曼努埃尔·古维亚驾驶多尼尔阿尔戈斯号金属水上飞机完成南大西洋首次夜间飞越，从里斯本经卡萨布兰卡、几内亚博拉马至累西腓、纳塔尔与里约热内卢，用星图与人工水平仪导航实现无线电视线外的精确航路。同年他致信共和国总统呼吁政府重视商用与民用航空的地缘战略布局。1928 年7月20日为反萨拉查独裁的巴黎联盟葡萄牙内部起事主谋，事败流亡。晚年逐渐淡出。1974年6月8日去世。"
 CBIO_POR_jaime_cortesao_desc:0 "全名詹姆·祖萨尔特·柯尔特西奥，1884年4月29日生于科英布拉地区坎塔涅德的安萨，父亲为医生兼语言学家。先后就读科英布拉大学与波尔图医外科学校，1910年在里斯本获医学学位。1911年加入共济会。1912年参与创立葡萄牙文艺复兴运动，1915至1917年任国会议员。第一次世界大战志愿以民兵上尉军医赴法国佛兰德斯参战，中毒气受伤后获战功十字。1919年出任里斯本国家图书馆馆长，创立图书馆小组知识分子圈。1921年与劳尔·普罗恩萨、卡玛拉·雷斯共同创办新播种杂志。1922年随共和国总统访问巴西，从此转向大发现史研究，成为葡萄牙海洋扩张史学的奠基者之一。1927年2月波尔图起义反抗军事独裁失败后流亡欧洲，1940年再度流亡巴西。旅巴期间著述丰硕，代表作为二卷本葡萄牙人的发现（1960 至 1962）。1957年获准返国，翌年被反对派推举为总统候选人婉拒。同年当选葡萄牙作家协会主席，接替阿基利诺·里贝罗。1958年11月74岁高龄第四度被捕，经巴西声援获释。1960年8月14日在里斯本去世。"
 CBIO_POR_alvaro_cunhal_desc:0 "全名阿尔瓦罗·巴雷里尼亚斯·昆哈尔，1913年11月10日生于科英布拉。父亲为律师、日后升任瓜尔达区总督，共和派并具宗教怀疑倾向。1924年全家迁居里斯本。就读里斯本大学法学院期间于1931年加入非法的葡萄牙共产党，师从本托·贡萨尔维斯。1935年首赴莫斯科出席共产国际第七次代表大会，1936年入党中央委员会。1937年首次被捕。1940年7月狱中提交论文人工流产的社会效应取得法学学位，答辩委员会成员包括未来总理马塞洛·卡埃塔诺。1941至1949年转入地下，实际上主持党务。1949年被 PIDE 逮捕，判处十一年徒刑并遭酷刑。1960年1月自佩尼谢要塞越狱脱身，政府声称有苏联潜艇在近海接应。1961年本托·贡萨尔维斯在塔拉法尔集中营病逝后，他当选葡萄牙共产党总书记。此后流亡莫斯科与巴黎，其女安娜·昆哈尔1960年12月生于莫斯科。1974年康乃馨革命后回国接管合法化的葡共，历任临时政府不管部部长。1992年卸任总书记改任党全国理事会主席。他同时是笔名马努埃尔·蒂亚戈的小说家。2005年6月13日在里斯本去世，葬礼有超过二十五万人送行。"
 CBIO_POR_raul_brandao_desc:0 "全名劳尔·热尔马诺·布兰登，1867年3月12日生于波尔图区福斯-杜-杜罗一个海员小地主家庭，海洋与渔民主题贯穿其一生创作。就读波尔图理工学院期间与安东尼奥·诺布雷等结交。1888年入里斯本军校，1891年结业后长期任职于陆军部并兼营新闻。1896年调往吉马良斯，翌年成婚。1901年调回里斯本，与知识分子及无政府主义者往来。1910年前后精神崩溃，1912年以少校军衔退役后专事写作，进入其创作最丰产的时期。他为月度新闻、葡萄牙评论撰稿，并任日报与共和国主编。1917年出版代表作腐殖土，与画家哥伦巴诺同题肖像互相印证。1921年与詹姆·柯尔特西奥、劳尔·普罗恩萨、阿基利诺·里贝罗等参加新播种杂志的创办。晚年游历亚速尔与马德拉，写成1926年的未知的诸岛。计划中的四卷本葡萄牙人民卑微的历史仅完成第一卷。1930年12月5日在里斯本拉帕去世，享年六十三岁。"
 CBIO_POR_francisco_da_cunha_leal_desc:0 "全名弗朗西斯科·平托·达·库尼亚·莱亚尔，1888年8月22日生于佩纳马科尔区佩德罗冈-德-圣佩德罗。1905至1908年就读里斯本理工学校，1912年从军校毕业为工兵与土木采矿工程师。1914至1915年任安哥拉铁路公司旅长，1917年晋升上尉后随葡萄牙远征军赴法国参战。1918年在锡多尼奥·派斯当政期间投身政治，先后加入民族主义共和党与埃加斯·莫尼斯的中心派共和党，1918至1919年任科维良选区议员。1919年1月参与桑塔伦叛乱反对塔马尼尼·巴尔博萨政府被捕入狱。1923年创立自由共和联盟。曾任第一共和国末期短命政府总理、财政部长与科英布拉大学校长。虽支持1926年5月28日军事政变，但很快与萨拉查决裂，被视为新国家体制初期最著名的反对派与葡属殖民地自决路线的首倡者之一。1939年出版四卷本战争逐日纪。1958年总统选举反对派原拟推举他为候选人，葡共前锋报甚至发文声援，因病弃权，最终由阿尔林多·维森特接手。代表著作有反殖民主义者的殖民主义与死神的镰刀。1970年4月26日在里斯本去世。"
 CBIO_POR_bento_de_jesus_caraca_desc:0 "1901年4月18日生于阿连特茹埃武拉区维拉维索萨一个农工家庭，父母在布拉冈萨家族的地产上耕种为生。少年时靠农人邻居启蒙识字，因显露过人的求知能力受当地贵族阿尔布克尔克家族资助上学。1918年入里斯本高等商学院。1919年因风湿病心脏受损，同年获米拉·费尔南德斯教授破格提拔为二级助教，年仅十八。1923年毕业留校，1927年任教授，1929年升为高等数学讲席教授。他早已加入并推动葡萄牙人民大学的运作，1928年出任其行政委员会主席。作为坚定的葡萄牙共产党员，他将数学教育与工人阶级启蒙紧密结合。1940年他与安东尼奥·蒙泰罗等共同创办葡萄牙数学学会与数学公报，1941年创立宇宙丛书出版计划，向普通读者引介现代科学与文化。二战末期投身反法西斯运动，1943年参与葡萄牙全国反法西斯联盟MUNAF的筹建，1944年当选葡萄牙数学学会主席，1945年为民主统一运动MUD的核心创始人之一。1946年被 PIDE 逮捕并被剥夺高等经济金融学院教席。1948年6月25日去世，年仅四十七岁，葬礼有数千人自发送行。"
 CBIO_POR_maria_lamas_desc:0 "全名玛丽亚·达·孔塞桑·瓦萨洛·席尔瓦·达·库尼亚·拉玛斯，1893年10月6日生于圣塔伦区托雷什诺瓦什。父亲为共济会员，母亲为虔诚天主教徒。她是葡属印度末任总督曼努埃尔·安东尼奥·瓦萨洛·席尔瓦的姐姐。17岁初婚随夫赴安哥拉，返国后打破当时禁忌坚持离婚，1920年再婚，1936年再离。1928年应作家费雷拉·德·卡斯特罗之邀主编月度日报的服饰与刺绣女性副刊，任期近二十年，以女性对女性的口吻挑战传统性别刻板并使副刊转亏为盈。1934年因妇女权益工作获颁圣詹姆斯剑军事勋章军官级。1935年加入葡萄牙妇女和平协会。1936年任葡萄牙妇女全国理事会 CNMP 主席。二战期间投身反法西斯运动，任民主统一运动 MUD 理事，参与1949年诺顿·德·马托斯总统竞选。1948年出版摄影文集我的国家的女人们，为二十世纪葡萄牙妇女处境的经典写实之作。1949、1950、1962年三度被 PIDE 逮捕。1962年出走巴黎流亡至1969年方获准返国。1974年康乃馨革命后加入葡萄牙共产党，1975年任民主妇女运动名誉主席，1980年获自由勋章。1983年12月6日在里斯本因心脏骤停辞世，享年九十岁。"
 CBIO_POR_alfredo_da_silva_desc:0 "1871年6月30日生于里斯本圣尼古拉斯教区一个殷商家庭。少年赴法留学，1885年父亲去世后返国就读高等商学院。19岁接手家族遗产，1893年任卢西塔诺银行与联合工厂公司CAF管理人。1897年策划CAF与竞争对手联合工厂合并，1898至1901年完成合并组成新的联合工厂公司CUF，此后终生领导直至去世。1907年选定里斯本对岸的巴雷罗建设新工业基地，1908年氮肥厂投产，此后逐步扩展成葡萄牙最大工业综合体，兴建工人镇并提供学校、医疗与社保。1911年进入航运业订造八艘货轮，1927年创立塔巴凯拉香烟厂，1937年租得罗查·孔德·德·奥比多什造船厂。至1930年代CUF已有工厂遍布全国、雇员达一万六千人。他的口号是祖国没有的CUF创造，后又立更多更好为家训。1937年成立CUF运动集团，后成葡超劲旅。二战期间CUF承揽内外舰船建造与修理，弥补运输缺口。1942年8月22日去世前不久成立帝国保险公司；身后其女婿曼努埃尔·德·梅洛接掌集团，历经三代经营至1975年被国有化，鼎盛时雇员逾八万人。"
 CBIO_POR_vieira_da_rocha_desc:0 "全名埃尔内斯托·玛丽亚·维埃拉·达罗查，1872年10月18日生于埃武拉，父为骑兵军官。1892年入伍，早年赴葡属莫桑比克与葡属帝汶服役，1904至1905年任国王卡洛斯一世的随从副官，1905年赴帝汶任维克克与包考军事总督，1908年底返国。1909年调入里斯本市卫队，1911年该队改组为共和国国民卫队后继续留任骑兵中队长。1913年晋升少校。第一次世界大战中于1915年参战葡属安哥拉，后调法国出任葡萄牙远征军登陆基地指挥官。1919年2月率军镇压蒙桑图北方君主复辟起义中的君主派叛军，同年2月晋升上校，因功获多项勋章。1921年10月至1922年9月任共和国国民卫队总指挥。此后四度出任战争部长（1922、1924、1925年两次），1925年因公开主张与4月18日起事者谈判被免。1925至1926年两度出任殖民地部长，1926年5月28日军事政变胜利后卸任。军事独裁与新国家体制下先后任骑兵科科长（1930至1931年）、航空兵科科长，并主持最高军事法院。1934年任里斯本蓬巴尔侯爵纪念碑落成执行委员会主席。终身为共济会员，任卢济塔尼亚东方总部理事。1952年4月16日在里斯本去世。"
 CBIO_POR_jaime_afreixo_desc:0 "全名詹姆·玛丽亚·达·格拉萨·阿弗雷索，1867年12月10日生于里斯本。父亲若泽·玛丽亚·达·格拉萨·阿弗雷索是教育家与律师。就读科英布拉大学后转入海军学校，后来晋任海军中将。1926年5月28日军事政变期间任葡萄牙海军领导人，为政变海军一翼的核心。政变胜利后先后入首届独裁政府任海军部长，第三届政府再任海军部长，并曾兼任内政部长。1927年因故未接受阿维斯军事勋章大十字。1930至1940年任葡萄牙海军总局长，为萨拉查体制初期海军现代化与战略规划的实际主持者，任内主导葡萄牙海军的整编与舰艇更新。1942年1月2日在里斯本去世。"
 CBIO_POR_manuel_gouveia_desc:0 "全名曼努埃尔·安东尼奥·古维亚，1890年生于波尔图。葡萄牙陆军机械师少尉，后升为军官飞行员。他是1920年代葡萄牙两次里程碑式远程航行任务的机械师与地面英雄。1924年葡萄牙至澳门首航中，他自突尼斯登机加入布里托·派斯与萨尔门托·德·贝雷斯的祖国号机组，历时二个月完成一万六千余公里的分段飞行，中途祖国号在印度失事，乘员从民间募捐所购的祖国二号续航直至澳门，全程飞行时间逾115小时。1927年3月至4月南大西洋首次夜间飞越中，他继续担任多尼尔阿尔戈斯号金属水上飞机机组机械师，与萨尔门托·德·贝雷斯、副驾杜瓦莱·葡萄牙与领航员豪尔赫·德·卡斯蒂略同机启程；博拉马起飞前他两度亲手排除燃料输送故障挽救飞行。飞越成功后与队友一同在里约热内卢受总统级礼遇。此后长期在葡军航空系统工作，参与地面维护与训练。1966年在葡萄牙因车祸去世，享年七十六岁。"
 CBIO_POR_lobato_guerra_desc:0 "全名若泽·奥古斯托·洛巴托·格拉，1874年6月21日生于马德拉群岛丰沙尔市圣贡萨洛教区。以陆军上校军衔长期任战争部第二处处长，主管军事情报、地形测绘与航空业务。1920年12月8日获颁基督军事勋章司令级，1923年6月28日晋升大军官级，1934年10月5日获授大十字级。1935年至1939年任陆军后备勤务大队长，为该单位任期最长的将官之一，届龄退休时年届六十五。晋升准将后又任国防军总参谋长，掌管与国家空中理事会的协作事务。军旅生涯长期奉献于军事情报、军事测绘与陆空协作的行政工作，为萨拉查体制初期葡军技术性军政体系的关键幕僚型将领之一。"
 CBIO_POR_manuel_quintao_meireles_desc:0 "全名曼努埃尔·卡洛斯·金唐·梅雷莱斯，1880年12月14日生于布拉干萨区弗雷索-德埃斯帕达-阿辛塔。海军军官出身，历任要职并晋升海军中将。1926年5月28日军事政变后最初支持军事独裁体制，1928年12月19日出任若泽·维森特·德·弗雷塔斯总理领导下的国家独裁政府外交部长，任至1929年7月9日随内阁总辞而卸任。此后随萨拉查集权体制成型，他逐步转向反对派立场，成为民主反对派温和派的代表人物。1951年奥斯卡·卡尔莫纳总统去世后提前举行的总统选举中，他接受反对派共同推举成为温和派候选人对阵国民联盟的克拉维罗·洛佩斯将军。投票前三日他愤然宣布退选，理由为选票印制在特殊纸张上便于政治警察辨认投票者、根本不具备自由公正选举的条件；洛佩斯遂在无对手条件下当选。此后他退居幕后。1962年3月11日在里斯本去世。"
 CBIO_POR_manuel_ortins_torres_de_bettencourt_desc:0 "1892年6月12日生于亚速尔群岛格拉西奥萨圣克鲁斯。1909年12月2日入海军，就读海军学校后逐级晋升，1920年6月26日取得海军飞行员飞行执照，成为葡萄牙首位不着陆完成往返亚速尔飞行的飞行员，1921年因执飞里斯本至马德拉水上飞机而获宝剑塔与剑勋章骑士级。后任亚速尔海军航空指挥官。曾任驻伦敦公使馆武官。1936年1月18日至1944年9月6日担任新国家体制第二届政府海军部长，为其人生最重要的公职，任内推动葡萄牙海军的整编与现代化，为亚美利哥·托马斯继任海军部长后主持的商船队重建工程铺垫基础。1938年晋升海军中校，1941年晋升上校，1945年12月14日晋升海军准将。1949年出任石油燃料公司董事，并参与整理二战期间葡萄牙内政政策相关文献的委员会工作。1951年12月28日至1955年2月18日担任葡萄牙国防军第二任总参谋长。1957年获美国总统艾森豪威尔授予功勋军团司令级勋章。1969年7月8日在卡斯凯什埃斯托里尔去世。"
 CBIO_POR_jose_filipe_de_barros_rodrigues_desc:0 "1890年8月31日生于维拉·雷阿尔圣佩德罗。少年就读里斯本军校，后成为炮兵科军官。军旅生涯专注于炮兵与总参谋部工作，兼任军校教授。1920年7月10日获颁宝剑塔与剑勋章军官级，1928年晋升司令级，1941年晋升大军官级，1946年获授阿维斯军事勋章大十字。西班牙内战期间任葡萄牙军事观察团参谋长，为主帅劳尔·奥古斯托·埃斯特韦斯的核心助手，随维里亚托志愿军进入西班牙考察佛朗哥方作战。二战结束前后升任陆军总参谋长，1945年发出多项与葡萄牙军事档案馆运作有关的公文，主持葡军后备勤务大队工作至1955年，为该单位任期最长的将官之一。由法团政府提名出任法团议会议员，代表军界担任第一届与第二届立法机构议员。1957年2月6日在里斯本去世。"
 CBIO_POR_joao_francisco_de_barbosa_azevedo_desc:0 "全名若昂·弗朗西斯科·德·巴博萨·阿泽维多·德·桑德·艾雷斯·德·康波斯，笔名若昂·阿梅亚尔，第二代阿梅亚尔子爵及第三代阿梅亚尔伯爵。1902年10月23日生于科英布拉，祖父为第一代阿梅亚尔伯爵、著名藏书家与艺术收藏家。里斯本大学法律系毕业。青年时代加入君主派传统主义阵营，与安东尼奥·萨尔迪尼亚私交甚笃，属整体主义第二代干将。1923年参加五人组共同创办葡萄牙皇党行动，1926年任皇党行动日报总编。1934年撰写新国家纲领十戒海报，系统阐述萨拉查政治纲领的十项原则，成为新国家体制官方意识形态的经典文本。1935年经安东尼奥·费罗荐举参加罗马大学行动委员会葡萄牙分部。1932年起兼任里斯本市政厅图书馆与历史档案部主任。1940年出版葡萄牙史多卷本，获1941年阿列山德雷·埃尔库拉诺奖，1974年前七次重印共二万二千册，成为二十世纪最畅销的葡萄牙国史著作。1942至1945年任国民议会议员，1961至1965年代表文人以法团议会议员身份出席。1944年任葡萄牙青年运动文化事务主任。1982年11月23日在里斯本去世。"
 CBIO_MEX_adolfo_de_la_huerta_desc:0 "全名费利佩·阿道弗·德·拉韦尔塔·马科尔，1881年5月26日生于索诺拉州瓜伊马斯。他早年在银行任会计，兼修声乐，后投身反对波费里奥·迪亚斯的政治活动。墨西哥革命中追随卡兰萨的立宪派，历任索诺拉州州长、驻纽约总领事与联邦参议员。1920年他与奥夫雷贡、卡列斯发动阿瓜普列塔计划，推翻卡兰萨政权，卡兰萨在出逃途中遇害；同年6月至11月，他经国会推举出任临时总统，主政仅半年却致力于全国和解，最大的成就是通过谈判说服比利亚放下武器接受招安，稳定了革命后的局势。奥夫雷贡就任总统后，他任财政部长，主持谈判达成德拉韦尔塔-拉蒙特债务协定。1923年他因与奥夫雷贡决裂发动德拉韦尔塔叛乱，兵败后流亡洛杉矶，以教授声乐谋生。1935年经卡德纳斯特赦回国，出任驻美领事视察员等职。1955年7月9日在墨西哥城因心脏病去世。"
 CBIO_MEX_plutarco_calles_desc:0 "原名弗朗西斯科·普鲁塔尔科·埃利亚斯·坎普萨诺，1877年9月25日生于索诺拉州瓜伊马斯，幼年丧母、由舅父母抚养，早年当过教师、记者与旅馆经理。墨西哥革命中效力于卡兰萨立宪派、隶属奥夫雷贡麾下，历任索诺拉州州长与内政部长。1924年至1928年任总统，任内创建墨西哥银行等一批制度性机构；其严厉的反教权立法激化矛盾，引发克里斯特罗战争。1928年奥夫雷贡遇刺后，他于1929年创建国民革命党，以幕后强人身份主导了1928年至1934年被称为马克西马托的时期，人称最高领袖，接连左右波特斯·希尔、奥尔蒂斯·鲁维奥与阿韦拉多·罗德里格斯三届政府。因不断掣肘卡德纳斯的施政，1936年被卡德纳斯逐出国门、流亡美国，1941年获准回国后退出政坛。1945年10月19日在墨西哥城因术后大出血去世，遗体后来安葬于革命纪念碑。"
 CBIO_MEX_abelardo_rodriguez_desc:0 "全名阿韦拉多·罗德里格斯·卢汉，1889年5月12日生于索诺拉州圣何塞·瓜伊马斯的贫寒之家。少年随家迁往边境城市诺加莱斯，做过五金店员、矿工与职业棒球手，1906年赴美打工数年，其间习惯以美式方式书写姓名，遂有阿韦拉多·L·罗德里格斯之名。1913年回国加入立宪派，在奥夫雷贡麾下从中尉起步，逐级升至师级将领，并长期任下加利福尼亚北部特区军事长官，任内借职务之便积累了大量个人产业。马克西马托后期，奥尔蒂斯·鲁维奥辞职后，他于1932年9月经国会推举出任替补总统，直至1934年11月，是这一时期三位过渡总统中的最后一人，也是其中较能顶住卡列斯影响、伸张总统权力的一位。任内确立全国最低工资制度，落成美术宫。卸任后转向实业，成为墨西哥最富有的企业家之一，晚年出任索诺拉州州长。1967年2月13日在美国加利福尼亚州拉霍亚去世。"
 CBIO_MEX_manuel_avila_camacho_desc:0 "1897年4月24日生于普埃布拉州特西乌特兰，早年在家乡就读、修习会计并经商。墨西哥革命爆发后投身立宪派，从少尉起步，曾在卡德纳斯部下任职，1920年参与镇抚亚基人的行动时已是上校。此后长期在军政两界任要职，1933年任战争与海军部次长，1938年升任国防部长并晋升为师级将领。1940年他代表执政党参选总统，在一场伴随暴力与舞弊争议的选举中击败右翼将领胡安·安德鲁·阿尔马桑，同年12月就任，任期至1946年。他为人温和宽厚，作战时常赦免俘虏、避免多造杀戮，被墨西哥人亲切地称为绅士总统。任内于1943年创建墨西哥社会保障局；二战期间因两艘墨西哥油轮被德国潜艇击沉，他于1942年对轴心国宣战，并派遣第201飞行中队赴太平洋对日作战。1944年他在国家宫遭一名辛纳基斯塔军官行刺，因身着防弹衣而幸免。1955年10月13日在墨西哥州的拉埃拉杜拉庄园因心脏疾病去世。"
 CBIO_MEX_lazaro_cardenas_desc:0 "全名拉萨罗·卡德纳斯·德尔里奥，1895年5月21日生于米却肯州希基尔潘，出身有普雷佩查血统的清寒之家，少年时当过税吏与排字工。1913年投身革命，先后隶属多支队伍，后归入卡列斯麾下并迅速晋升为将领。他于1928年至1932年任米却肯州州长，又历任国民革命党主席、内政部长与战争部长。1934年12月就任总统。执政期间他与恩师卡列斯决裂并于1936年将其逐出国门，推行大规模土地改革，扶植劳工，组建墨西哥劳工联合会与全国农民联合会。1937年他将铁路收归国有，1938年3月18日签署石油征收令、把外资石油公司国有化，此举获得举国支持，成为其执政的标志。他还平定了塞迪略在圣路易斯波托西发动的叛乱，并创办国立理工学院、墨西哥学院与国立人类学历史学院。卸任后于1942年至1945年在阿维拉·卡马乔政府中任国防部长，晚年始终是墨西哥左翼的道义领袖。1970年10月19日在墨西哥城因癌症去世，安葬于革命纪念碑。"
 CBIO_MEX_saturnino_cedillo_desc:0 "1890年11月29日生于圣路易斯波托西州玉米城附近的帕洛马斯农庄，出身务农之家。他与兄弟马格达莱诺、克莱奥法斯在革命中屡屡起兵，先随马德罗，后转投奥罗斯科与萨帕塔一系，几经辗转又归入立宪派，1920年加入阿瓜普列塔计划。凭借麾下的农民武装与军事农垦区，他成为圣路易斯波托西州不容撼动的农民考迪罗，人称本州强人。克里斯特罗战争中他站在政府一边，1929年6月其部击毙克里斯特罗军统帅恩里克·戈罗斯蒂塔。他两度出任农业部长，先后在奥尔蒂斯·鲁维奥与卡德纳斯政府任职，并与格拉西亚诺·桑切斯共同创建全国农民联合会。因反对社会主义教育、石油征收与集体分地，1938年5月他辞去部长职务、返乡举兵反抗卡德纳斯，掀起革命后墨西哥最后一场大规模叛乱。隆巴尔多·托莱达诺当年曾指控他勾结纳粹，此说后来已被证伪。叛乱于次年初被平定，1939年1月11日，他在本州拉本塔纳山脉与联邦军交战时阵亡。"
 CBIO_MEX_aaron_saenz_desc:0 "1891年6月1日生于新莱昂州蒙特雷，是教育家莫伊塞斯·萨恩斯之弟。他攻读法律，1913年因马德罗遇害而投身立宪派，很快成为奥夫雷贡的私人秘书，随之在革命军中步步高升。奥夫雷贡与卡列斯先后执政期间，他两度出任外交部长，1927年至1931年任新莱昂州州长。1928年奥夫雷贡在拉邦比利亚餐厅遇刺时，正是倒在他的怀中；此后他一度被拥立为总统候选人，最终不敌奥尔蒂斯·鲁维奥。他还历任公共教育部长、工商劳工部长与联邦特区首长，因与卡列斯关系密切，人称卡列斯的影子。晚年转向实业，经营制糖、银行与墨西哥航空等产业，被誉为墨西哥制糖大王。1983年2月26日在墨西哥城去世。"
 CBIO_MEX_manuel_perez_trevino_desc:0 "1890年6月5日生于科阿韦拉州维拉德格雷罗。他原在墨西哥城攻读工程，1913年投身革命，以炮兵上尉之职在巴勃罗·冈萨雷斯与卡兰萨麾下参战，二十七岁便晋升为将军。此后他历任战争与海军部机要长、奥夫雷贡总统的参谋长、工商部长与科阿韦拉州州长。1929年他参与筹建国民革命党，是该党首任主席，建党时还担任司库。他又出任农业部长，一度被视为总统热门人选，但权力的天平最终倾向了卡德纳斯。此后他转入外交界，先后出任驻智利、西班牙、葡萄牙与土耳其大使。1945年4月29日在科阿韦拉州的新罗西塔去世。"
 CBIO_MEX_hernan_laborde_desc:0 "全名埃尔南·拉沃尔德·罗德里格斯，1895年11月18日生于韦拉克鲁斯。他是铁路工人出身的共产党人，1925年前后加入墨西哥共产党，在1926至1927年的铁路大罢工中充任领导，被卡列斯政府逮捕入狱。1928年当选联邦众议员。1929年起他出任墨西哥共产党总书记，长期主编党报《砍刀报》，是该党到1940年初为止的主要领袖，并在1934年代表工农阵线参选总统，仅得数百票。1940年初，他因反对共产国际的激进路线、主张推迟对托洛茨基下手，与巴伦廷·坎帕一同被开除出党。此后他参与创建统一社会主义行动，并于1951年参与组建墨西哥工农党。1955年5月1日在墨西哥城去世。"
 CBIO_MEX_dionisio_encina_desc:0 "全名迪奥尼西奥·恩西纳·罗德里格斯，1907年生于萨卡特卡斯州一个矿工家庭，早年在科阿韦拉州托雷翁做木工与铁匠。1928年他加入墨西哥共产主义青年联盟，次年进入其全国领导层。1936年他是拉古纳地区农业工人大罢工的知名领导人之一。1940年，他参与党内清洗委员会，推动开除总书记拉沃尔德与巴伦廷·坎帕，随后自己当选墨西哥共产党总书记，此职一坐约二十年。任内他奉行亲苏的斯大林主义路线，曾出席苏共二十大与二十一大。1982年8月20日在墨西哥城伊斯塔帕拉帕去世。"
 CBIO_MEX_valentin_campa_desc:0 "全名巴伦廷·坎帕·萨拉萨尔，1904年2月14日生于新莱昂州蒙特雷，幼年随家迁居科阿韦拉州托雷翁。他从铁路工人做起，投身工会运动，因思想激进、宣传迅捷而被同伴称为布尔什维克。1927年2月他加入墨西哥共产党，入党次日即爆发全国铁路大罢工，卡列斯一度下令将他枪决，幸得塔毛利帕斯州长波特斯·希尔出手相救。他很快成为党中央委员会最年轻的成员。1940年3月，他因主张推迟刺杀托洛茨基、认为杀害托洛茨基只会使其成为烈士并损害党的信誉，与拉沃尔德一同被开除出党。此后他继续投身工运，1952年参与创建墨西哥工农党，并与德梅特里奥·巴列霍一道领导了1958至1959年的铁路大罢工，为此长期系狱。1999年11月25日在墨西哥城去世。"
 CBIO_MEX_vicente_lombardo_desc:0 "全名比森特·隆巴尔多·托莱达诺，1894年7月16日生于普埃布拉州特西乌特兰的殷实之家，祖父是靠铜矿致富的意大利移民。他早年就读于国立法学院，取得法学学士与哲学博士学位，是知名知识分子团体七贤之一。步入政界后，他曾任普埃布拉州临时州长，并逐渐成为墨西哥马克思主义的旗手。1936年他整合全国工人，创建了强大的墨西哥劳工联合会并出任总书记，直至1941年，同年还创办了工人大学。他支持卡德纳斯政府扶助劳工、对抗法西斯的路线。二战后他被排挤出劳联，转而于1948年创建人民党，即后来的人民社会主义党，并在1952年参选总统。1968年11月16日在墨西哥城去世。"
 CBIO_MEX_francisco_mugica_desc:0 "全名弗朗西斯科·何塞·穆希卡·贝拉斯克斯，1884年9月3日生于米却肯州廷金丁，父亲是乡村教师。他早年为反迪亚斯的自由派报刊撰稿，投身马德罗革命，后加入立宪派，1913年与卢西奥·布兰科一道进行了革命中最早的分地。作为1917年制宪会议的激进派代表，他主导起草了宪法中关于宗教、土地、劳工与教育的第三、二十七、一百二十三、一百三十等条款，被视为墨西哥革命的重要思想家，也是卡德纳斯的思想导师。他历任塔巴斯科、米却肯与南下加利福尼亚州州长，1928年至1932年主管群岛监狱期间推行人道改革。卡德纳斯执政期间，他先后任国民经济部长与通信公共工程部长，并亲笔起草了1938年3月18日宣布石油征收的告国民书。他一度被视为卡德纳斯的天然接班人，但因立场过于激进，1940年退出竞逐、转而支持阿维拉·卡马乔。1954年4月12日在墨西哥城去世。"
 CBIO_MEX_leon_trotsky_desc:0 "原名列夫·达维多维奇·布隆施泰因，1879年11月7日生于俄罗斯帝国治下乌克兰的亚诺夫卡，是二十世纪最重要的革命家之一。他与列宁并肩领导了1917年十月革命，缔造红军，是苏维埃国家的核心人物；列宁去世后，他在与斯大林的权力斗争中落败，1929年被逐出苏联，从此流亡各国，1938年创建第四国际，并以不断革命论著称。因在欧洲各国屡遭拒绝，他经卡德纳斯总统以人道理由批准，于1937年1月抵达墨西哥坦皮科港，起初住在迭戈·里维拉与弗里达·卡罗位于科约阿坎的蓝房子，后迁往维也纳街寓所。1940年5月，他躲过了壁画家西凯罗斯一伙的枪击；同年8月20日，斯大林派遣的特工拉蒙·梅尔卡德以登山镐将其重创，次日即1940年8月21日，他在墨西哥城去世。"
 CBIO_MEX_salvador_abascal_desc:0 "全名萨尔瓦多·阿瓦斯卡尔·因凡特，1910年5月18日生于米却肯州莫雷利亚，出身于瓜纳华托州巴列德圣地亚哥的地主家庭，因革命而家道中落。其父阿达尔韦托·阿瓦斯卡尔是天主教地下组织“U”的活跃成员，与后来出任墨西哥城大主教的路易斯·马里亚·马丁内斯交往密切。他少年入莫雷利亚神学院就读，后转入自由法学院，1931年取得法学学位，曾任阿尤特拉法官，因判决有利于土地索偿人而得罪地方头目被免职。他先后加入秘密天主教组织“军团”与“基地”，投身政教斗争。1937年他参与创建辛纳基斯塔全国联盟，1938年亲率信众在塔巴斯科州恢复天主教崇拜，一举成名。1940年他接替曼努埃尔·塞尔梅尼奥出任辛纳基斯塔全国领袖，彼时该组织拥有约五十万成员，是阿维拉·卡马乔政府面对的唯一实质性反对力量。他公开反对马克思主义与自由民主制度，主张建立天主教社会秩序，被对手指控亲纳粹，他本人则正式否认。1941年他率数百名殖民者远赴南下加利福尼亚州，在沙漠中建立玛丽亚·奥克西利亚多拉殖民地，意图打造一个信仰共同体，但因气候恶劣、物资匮乏与领导方式过于严苛，殖民计划以失败告终。1944年他被“基地”撤换并逐出运动，返回墨西哥城后公开揭露“基地”对辛纳基斯塔的幕后操控，引发组织大分裂。此后他转入文化阵线，先后主持胡斯出版社与传统出版社，出版大量天主教保守主义与反革命著作，并长期发行战斗通讯。2000年3月30日在墨西哥城家中因跌倒受伤去世。"
 CBIO_MEX_jesus_degollado_guizar_desc:0 "全名何塞·德·赫苏斯·迪哥拉多·吉萨尔，1892年8月3日生于米却肯州科蒂哈德拉帕斯，其母毛拉·吉萨尔·巴伦西亚是后来的主教拉斐尔·吉萨尔与安东尼奥·吉萨尔·巴伦西亚的姐妹，他自幼在虔诚的天主教家庭中长大。青年时他随家迁居哈利斯科州阿托托尼尔科埃尔阿尔托，加入墨西哥天主教青年会与天主教徒联盟。1926年卡列斯反教权立法激化矛盾后，他投身克里斯特罗战争，在哈利斯科西部地区指挥作战，逐步升至将领。1929年6月2日克里斯特罗军总司令恩里克·戈罗斯蒂塔在阿托托尼尔科遭伏击阵亡后，他于6月4日被推举为克里斯特罗军末代总司令。在位仅数周便不得不接受莫雷利亚大主教莱奥波尔多·鲁伊斯·伊弗洛雷斯与总统波特斯·希尔于6月21日签署的停战协定，主持裁撤克里斯特罗军。协定后大批克里斯特罗军官遭政府方面暗杀，死者比三年战争中还多。他晚年致力于纪念克里斯特罗运动，1951年召集战争二十五周年纪念活动并重组克里斯特罗老兵组织，著有回忆录。1957年8月27日在瓜达拉哈拉去世。"
 CBIO_MEX_jose_gonzalo_escobar_desc:0 "1892年1月31日生于锡那罗亚州马萨特兰。1913年加入卡兰萨的立宪派，参加了对比利亚的历次战役，1919年在华雷斯城之战中指挥联邦骑兵冲锋，最后一次击败比利亚的武装，由此声名鹊起。此后他又先后参与镇压1923年的德拉韦尔塔叛乱与1927年的戈麦斯-塞拉诺叛乱，屡立战功，成为墨西哥军中最受欢迎的将领之一。1928年奥夫雷贡遇刺后政局动荡，他因不满卡列斯以文官波特斯·希尔出任临时总统，于1929年3月3日发动“革新革命”，以《埃尔莫西约计划》号召推翻卡列斯-波特斯·希尔政权，起初拥兵近三万，控制了科阿韦拉、奇瓦瓦与索诺拉等北方数州。然而美国政府封锁边境并向联邦政府提供飞机与弹药，4月3日埃斯科瓦尔在奇瓦瓦州希梅内斯遭到决定性的惨败，叛军迅速瓦解。他逃入美国后流亡加拿大多年。1942年初他取道埃尔帕索回国，向卡德纳斯请缨效力，此后重返军界，1952年晋升师级将领。1969年12月16日去世。"
 CBIO_MEX_enrique_estrada_desc:0 "全名恩里克·埃斯特拉达·雷诺索，1890年2月18日生于萨卡特卡斯州莫亚瓦，是法学家、政治家罗克·埃斯特拉达之弟。他早年在瓜达拉哈拉就学，1910年加入马德罗运动，1913年再度拿起武器投身立宪派，在哈利斯科与萨卡特卡斯一带作战。他三度出任萨卡特卡斯州州长，1920年参加阿瓜普列塔计划。奥夫雷贡执政期间，他于1921年至1922年任战争与海军部副部长，1923年任哈利斯科军区司令。同年底他响应德拉韦尔塔叛乱，自任西部叛军统帅，控制哈利斯科、萨卡特卡斯、科利马、纳亚里特、米却肯与瓜纳华托六州，在奥科特兰战役中被奥夫雷贡亲率联邦军击败，流亡美国。1926年他在加利福尼亚组织武装企图入境推翻卡列斯政权，在圣迭戈附近的拉梅萨被美国当局逮捕，后获保释。1929年他又呼应埃斯科瓦尔叛乱。此后获赦回国，历任联邦众议员、参议员与墨西哥国家铁路总局长。1942年11月3日在墨西哥城去世。"
 CBIO_MEX_luis_maria_martinez_desc:0 "全名路易斯·马里亚·马丁内斯·罗德里格斯，1881年6月9日生于米却肯州埃皮塔西奥·韦尔塔市莫利诺斯·德·卡瓦列罗斯庄园，父亲是来自阿斯图里亚斯的西班牙移民罗森多·马丁内斯，出生仅十二天便丧父，由身为神父的舅父卡西米罗·罗德里格斯抚养长大。他九岁入莫雷利亚教区神学院，1904年晋铎，此后在神学院任教，历任训育长、副院长与院长，主持院务长达三十二年。墨西哥革命期间他创立至少六个天主教平信徒组织，包括全国家长联合会与工人团体。1922年任奇拉帕教区管理员，1923年受祝圣为莫雷利亚辅理主教。克里斯特罗战争期间他遭通缉，辗转藏匿于信众家中。1937年他被任命为墨西哥城大主教，正值教会与国家关系最敏感的年代。他与卡德纳斯总统自少年时代起即为米却肯同乡故交，两人的良好私谊弥合了革命后教会与左翼之间的裂痕。他在阿维拉·卡马乔与后续几届政府中始终维持亲善态度，二战期间公开反对法西斯主义与亲轴心国团体。1951年他获授墨西哥首任首席主教衔，同年还当选墨西哥语言学院院士，著有大量灵修著作。1956年2月9日在墨西哥城因肠硬化症去世，逾十万民众瞻仰灵柩，遗体安葬于墨西哥城主教座堂大主教地下墓穴，目前正在接受列福调查程序。"
 CBIO_MEX_gildardo_magana_desc:0 "全名希尔达多·马加尼亚·塞尔达，1891年3月7日生于米却肯州萨莫拉，父亲是信奉自由主义的商人。他少年入家乡教区神学院就读，后赴美国费城坦普尔学院习商。1907年回国后参加反连选连任运动，1911年投奔萨帕塔，因善于交际、长于斡旋，很快成为萨帕塔最倚重的政治代理人。1912年他在墨西哥城监狱中结识同被关押的弗朗西斯科·比利亚，教其识字，并向他阐释阿亚拉计划与土地改革思想，促成了后来比利亚与萨帕塔的联合。1914年他作为南方解放军代表出席阿瓜斯卡连特斯公约，1915年在罗克·冈萨雷斯·加尔萨政府时期短暂出任墨西哥城州长。1916年他升任萨帕塔参谋长。1919年4月萨帕塔遇害后，主要将领投票选举他为南方解放军继任统帅。1920年他支持阿瓜普列塔计划，率萨帕塔余部归入联邦军，获授师级将领衔。此后他参与创建全国农民联合会，出任北下加利福尼亚特区军事长官，并撰写多卷本著作《埃米利亚诺·萨帕塔与墨西哥土地改革》。1936年他当选家乡米却肯州州长，1939年一度被推举为总统候选人。1939年12月13日在墨西哥城因心脏病发作去世，时仍在州长任上。"
 CBIO_MEX_heliodoro_charis_desc:0 "全名埃略多罗·查里斯·卡斯特罗，1896年7月3日生于瓦哈卡州胡奇坦德萨拉戈萨利马区，萨波特克族，父为埃瓦里斯托·查里斯·希梅内斯，母为阿松西翁·卡斯特罗·马丁内斯，出身低微，幼年失学，不会读写，只说萨波特克语。他自幼以萨波特克民族英雄、抗法名将阿尔比诺·希梅内斯的侄孙身份为荣。1911年他年仅十五岁便投身革命，先随胡奇坦地方领袖切·戈麦斯起事，后辗转于各支革命队伍。1919年12月他自行发布“圣维森特计划”，要求地峡从瓦哈卡州分离独立，与联邦军及当地敌对武装激战数月后获胜。1920年他加入阿瓜普列塔计划，所部编入联邦军，此后他在军中步步晋升，其麾下第十三营几乎全由胡奇坦与地峡各镇的萨波特克与瓦维族战士组成，以骁勇善战著称，在克里斯特罗战争等多次战役中屡立战功。退出军界后他转入地方政治，历任胡奇坦市长、联邦众议员与参议员，凭借在联邦层面的人脉为家乡争取到大量公共建设项目，包括奥夫雷贡军事农业殖民地、胡奇坦中心学校与民政医院，并推动泛美公路胡奇坦段竣工。他五十岁才开始学习读写。1964年4月26日在墨西哥城去世。"
 CBIO_MEX_agustin_olachea_desc:0 "全名何塞·阿古斯丁·欧拉基亚·阿维莱斯，1890年9月3日生于南下加利福尼亚州托多斯桑托斯，巴斯克裔。他在半岛偏远之地长大，早年投身革命，后成为卡德纳斯的坚定支持者。卡德纳斯执政期间，他出任北下加利福尼亚联邦特区长官，其任内正值墨西卡利地区排华浪潮高涨。1946年他再度受命出任南下加利福尼亚州长，一任长达十年。1958年洛佩斯·马特奥斯总统任命他为国防部长，任期至1964年。他退役后返回家乡拉帕斯。1974年4月13日在拉帕斯去世，安葬于南下加利福尼亚杰出人士纪念堂。"
 CBIO_MEX_gilberto_limon_desc:0 "全名吉尔贝托·雷蒙多·利蒙·马尔克斯，1895年3月15日生于索诺拉州阿拉莫斯的塔皮苏埃拉斯，少年在阿拉莫斯与纳沃霍亚接受初等教育。1913年6月他加入奥夫雷贡在索诺拉组建的立宪派部队，以少尉入伍，参加了塞拉亚战役等对比利亚的历次大战。1916年他转赴奇瓦瓦继续追剿比利亚。1920年他是阿瓜普列塔计划的签署人之一。此后他长期在军中任职，历任总统卫队长、军事工厂总局长与军事学院院长，并先后指挥多个军区。1946年米格尔·阿莱曼总统任命他为国防部长，任期至1952年，主持了战后墨西哥军队的整编。任内他获瑞典政府授予皇家宝剑勋章大十字。1988年11月25日在墨西哥城去世。"
 CBIO_MEX_pablo_macias_desc:0 "全名巴勃罗·E·马西亚斯·巴伦苏埃拉，1891年11月15日生于锡那罗亚州埃尔富埃尔特附近的拉斯卡夫拉斯牧场。1912年3月他投身马德罗革命，加入索诺拉第四非正规营。韦尔塔篡权后，他与曼努埃尔·迪耶格斯、普鲁塔尔科·卡列斯等人共同发起纳科萨里计划，是索诺拉最早起兵反韦尔塔的军人之一。奥夫雷贡在战场上授予他步兵少校军衔。此后他长期服役，历任多州军区司令，1940年12月至1942年9月出任阿维拉·卡马乔政府的国防部长。卸任后他又担任太平洋军区总司令与第一军区司令，最后出任国家军事养老金局长直至退休。1945年至1950年他出任锡那罗亚州州长，任内整顿了前任留下的巨额债务。其弟安塞尔莫·马西亚斯·巴伦苏埃拉亦为将领，曾任索诺拉州州长。晚年他获参议院授予贝利萨里奥·多明格斯奖章。1975年4月30日在墨西哥城去世。"
 CBIO_MEX_antonio_cardenas_rodriguez_desc:0 "1903年10月6日生于科阿韦拉州，是墨西哥空军史上最著名的飞行员之一，绰号“查罗”。他早年加入军事航空队，参加了亚基人战争与克里斯特罗战争的空中作战。1940年他以上校军衔驾驶洛克希德12型飞机“卡兰萨总统号”完成拉丁美洲亲善飞行，历时一百一十八小时，航程近三万五千公里。1942年他奉命将国歌作曲家海梅·努尼奥的遗骨从美国空运回墨西哥。1944年他被任命为墨西哥远征空军司令，率第201飞行中队赴太平洋战场参加对日作战，这是墨西哥军事史上唯一一次海外作战。该部编入美国第五航空队第五十八战斗大队，1945年6月至8月在菲律宾吕宋岛执行了近百次对地支援与空中封锁任务。他以师级将领退役，瓦哈卡州伊斯特佩克第二空军基地以其名命名。1969年7月4日去世。"
 CBIO_MEX_luis_farell_desc:0 "1902年9月27日生于科阿韦拉州圣佩德罗德拉斯科洛尼亚斯，父亲是来自加泰罗尼亚的珠宝商恩里克·法雷尔·索拉，母亲是桑坦德尔人孔苏埃洛·库维利亚斯·古铁雷斯。1911年他在墨西哥城巴尔布埃纳平原目睹莫瓦桑兄弟的飞行表演，对航空产生浓厚兴趣。1920年他考入军事航空学校，师从美国教官拉尔夫·奥尼尔等一战老兵，1922年以中尉飞行员毕业。此后他几乎参加了1920年代至1930年代的每一场内战空中作战：先是1923年镇压德拉韦尔塔叛乱时驾机轰炸叛军阵地，继而在索诺拉参与对亚基人的空中行动，1926至1929年投入克里斯特罗战争的哈利斯科、瓜纳华托与米却肯战场，还执行了对埃斯科瓦尔叛乱与塞迪略叛乱的轰炸与扫射任务。他曾赴美国得克萨斯州布鲁克斯飞行基地深造。此后他历任空军多级指挥职务，官至空军副总司令，任内见证了圣卢西亚空军基地的建成与喷气时代的到来。1965年以师级将领退役。其弟阿尔塞尼奥·法雷尔·库维利亚斯后成为墨西哥著名政治家。1977年7月17日在墨西哥城去世。"
 CBIO_MEX_pablo_gonzalez_desc:0 "1879年5月5日生于新莱昂州兰帕索斯德纳兰霍，五岁便失去双亲成为孤儿，在科阿韦拉州纳达多雷斯由亲属抚养。少年时他曾获军事学院奖学金但未完成学业，后赴美国在圣塔菲铁路与加利福尼亚做工。经堂弟安东尼奥·比利亚雷亚尔介绍，他结识了里卡多·弗洛雷斯·马贡，参加自由主义运动，1907年为墨西哥自由党报纸《革命》撰稿。1911年他投身马德罗革命，韦尔塔篡权后加入立宪派，卡兰萨任命他为东北军团总司令，与奥夫雷贡的西北军团并列为两大主力。1914年他先后攻占蒙特雷、坦皮科与圣路易斯波托西，1915年在埃瓦诺战役中以一万五千人顶住比利亚两万大军历时七十余日。同年8月他率部收复墨西哥城。1916年起他受命镇压莫雷洛斯的萨帕塔运动，手段极为严厉，下令将被视为支持萨帕塔的平民集中遣送、违者就地枪决。1919年4月他策划并指使部下赫苏斯·瓜哈尔多以假投诚诱杀埃米利亚诺·萨帕塔，被普遍视为暗杀的幕后主谋。同年他参选总统，后退出。1920年他初时效忠卡兰萨，随后自行宣布参选并反叛，被捕后判处死刑，经临时总统德拉韦尔塔特赦后流亡美国。1940年回国后退出政坛，其在美国经营的银行因大萧条破产，晚年穷困潦倒。1950年3月4日在蒙特雷去世。"
 CBIO_MEX_othon_blanco_desc:0 "全名奥顿·庞佩约·布兰科·努涅斯·德·卡塞雷斯，1868年3月7日生于塔毛利帕斯州，是圣多明各独立之父何塞·努涅斯·德·卡塞雷斯的后裔。他在家乡完成初等教育后入国立预科学校，1885年进入军事学院，1889年毕业加入墨西哥海军，被分配至“萨拉戈萨号”护卫舰。1895年他受命指挥“切图马尔浮台”，前往里约翁多河口设立海关，在切图马尔湾行使主权。为建立永久定居点，他联络此前因马雅人袭击而逃往英属洪都拉斯的墨西哥人，说服他们重返故土。1898年5月5日他正式创建帕约奥比斯波村，即今天的金塔纳罗奥州首府切图马尔。这一举措为1902年金塔纳罗奥联邦特区的设立奠定了基础。此后他在海军中继续服役，历任炮舰副舰长、海军学校副校长与海军局长。1914年他作为韦尔塔政府海军代表参与签署特奥洛尤坎协定。1941年至1946年他在阿维拉·卡马乔政府中出任海军副部长。1959年10月18日在墨西哥城去世，遗骨安葬于切图马尔总督府广场为他修建的纪念碑中。金塔纳罗奥州奥顿·P·布兰科市以其名命名。"
 CBIO_MEX_heriberto_corona_desc:0 "1879年7月10日生于韦拉克鲁斯州诺加莱斯，独子，父母均为普埃布拉人。他早年在奥里萨瓦的模范学校就学，后在帕丘卡的科学文学自治学院取得簿记员资格。回到奥里萨瓦后他在圣罗莎与里奥布兰科纺织厂任会计，目睹工人惨状，十九岁加入弗洛雷斯·马贡兄弟的墨西哥自由党从事宣传工作，1907年参与里奥布兰科罢工的组织。1910年他响应马德罗号召拿起武器，1912年当选韦拉克鲁斯州联邦众议员，任内推动将纺织工人的日工时由十六小时缩减为十小时并确立最低工资。1913年反韦尔塔后加入立宪派，曾任墨西哥城军事长官，并主持美军从韦拉克鲁斯港撤离。1916至1917年他作为制宪会议激进派代表，与穆希卡等人共同推动将教育、土地与劳工权利条款（第三、二十七与一百二十三条）写入宪法。此后他历任驻古巴大使、联邦参议员、塔巴斯科与韦拉克鲁斯州长。1939年他出任革命党主席，1940年12月被阿维拉·卡马乔任命为新成立的海军部首任部长，任期涵盖整个二战参战时期。晚年他积极参与世界和平运动，1952年获斯大林和平奖，1959年获贝利萨里奥·多明格斯奖章。1968年4月17日在墨西哥城去世。"
 CBIO_MEX_eduardo_hay_desc:0 "全名埃杜阿多·海·福图尼奥，1877年1月29日生于墨西哥城。他赴美就读，1900年毕业于圣母大学工程专业。回国后他投身反对迪亚斯连任运动，是反连选连任党的联合创始人之一，与马德罗结为挚友。1911年马德罗起义时他任参谋长，在奇瓦瓦州卡萨斯格兰德斯战役中为掩护马德罗负伤，失去右眼。韦尔塔篡权后他加入立宪派，1914年短暂代理战争与海军部长。他先后作为阿瓜斯卡连特斯公约代表与立宪派众议员活跃于政坛，又曾任驻意大利、日本与危地马拉大使及驻巴黎总领事。1935年卡德纳斯任命他为外交部长，任期至1940年。任内他主持了石油国有化后艰巨的外交善后工作，与各石油公司所属国谈判赔偿，反击国际舆论对墨西哥的围攻。他积极声援西班牙共和国，不仅售予军火，还接纳了约五百名西班牙内战孤儿与大批共和派流亡者。他批准了对列夫·托洛茨基的政治庇护，并于1939年宣布墨西哥在欧战中保持中立。1941年12月27日在墨西哥城去世。"
 CBIO_MEX_luis_montes_de_oca_desc:0 "1894年8月30日生于墨西哥城。他在高等商业管理学院学习会计，1913年加入马德罗阵营，韦尔塔篡权后流亡美国，回国后加入立宪派。阿瓜普列塔计划之后，他开始外交与财政生涯，先后在埃尔帕索、汉堡与巴黎任领事。1924年卡列斯任命他为联邦审计长，1927年升任财政部长，一任跨卡列斯、波特斯·希尔与奥尔蒂斯·鲁维奥三届政府。任内他推行一系列重大改革：编撰墨西哥首部税法典，设立公共工程执行机构，1930年签署蒙特斯·德·奥卡-拉蒙特协定将外债削减百分之四十五，1931年推行货币改革将黄金非货币化并确立比索新本位。他是奥地利经济学派在墨西哥的重要推动者，与路德维希·冯·米塞斯有私人交往。1935年至1940年他出任墨西哥银行行长，任内推动1936年银行组织法改革，强化了央行的独立性。1940年他辞去行长职务，担任胡安·安德鲁·阿尔马桑总统竞选的财务长。此后他转入商界，创办国际银行并主持多家金融机构。1958年12月4日在墨西哥城去世。"
 CBIO_MEX_alberto_pani_desc:0 "全名阿尔贝托·何塞·帕尼·阿尔特阿加，1878年6月12日生于阿瓜斯卡连特斯，母亲是该州前州长赫苏斯·特兰的外侄女。他在本州科学文学学院完成预科，后赴墨西哥城入国立工程学院，1902年取得土木工程师学位。1911年他加入马德罗运动，任公共教育副部长。1917年卡兰萨任命他为工商部长，随后派往巴黎任驻法特使，出席凡尔赛和会。1921年奥夫雷贡任命他为外交部长，1923年转任财政部长，此职延续至卡列斯政府，至1927年。任内他主持创建墨西哥银行与农业信贷银行，确立所得税制度，重组公共财政，推动灌溉工程与公路建设，被视为墨西哥现代金融体系的缔造者。1932年至1933年他在奥尔蒂斯·鲁维奥与阿韦拉多·罗德里格斯政府中再任财政部长，推行温和的反周期财政政策应对大萧条，主持美术宫竣工与宪法广场改造，并将革命纪念碑从废弃的立法宫骨架改建而成。他还是艺术收藏家，曾将自己在巴黎购得的画作出售给国家。1955年8月25日在墨西哥城去世。"
 CBIO_MEX_jose_vasconcelos_desc:0 "全名何塞·瓦斯康塞洛斯·卡尔德隆，1882年2月27日生于瓦哈卡州。他童年随父亲辗转于边境地区，在科阿韦拉与得克萨斯求学，后入国立法学院取得律师资格。1909年他加入反连选连任运动与马德罗结盟，革命后出任多项文化要职。1920年阿瓜普列塔计划胜利后他出任国立大学校长，1921年奥夫雷贡将久遭废止的教育部恢复重建，任命他为首任教育部长。任内他发起了墨西哥革命后最宏大的文化工程：在全国偏远地区广设乡村学校与图书馆，大规模出版经典读物，委托迭戈·里维拉、何塞·克莱门特·奥罗斯科与大卫·阿尔法罗·西凯罗斯在公共建筑上创作壁画，开启了举世闻名的墨西哥壁画运动，因此获得“美洲大师”的尊号。1925年他出版代表作《宇宙种族》，提出美洲大陆将诞生融合各族之长的第五种族的理想。1929年他反对卡列斯指定候选人参选总统，获得巨大民众支持，但选举伴随暴力与舞弊，他宣称遭到严重作弊后流亡海外，撰写了四卷自传体巨著。晚年他的思想转向保守，对法兰哥政权表示同情，立场引发争议。1940年回国后他出任国家图书馆长，1953年当选语言学院院士。1959年6月30日在墨西哥城去世，安葬于名人圣坛。"
 CBIO_MEX_juan_andreu_desc:0 "全名是胡安·安德鲁·阿尔马桑，1891年5月12日生于格雷罗州奥利纳拉，父亲胡安·安德鲁·帕雷哈是加泰罗尼亚裔农场主。1907年他入普埃布拉医学院就读，在校期间参加反迪亚斯运动，投身马德罗革命后放弃学业。马德罗当选后他倒向萨帕塔，1913年韦尔塔篡权时又追随韦尔塔与奥罗斯科的“科洛拉多斯”部队作战，后重归萨帕塔阵营，1914年底率部与萨帕塔联军攻占普埃布拉城，是其军事生涯的高光时刻。此后他在萨帕塔与费利克斯·迪亚斯之间辗转。1920年他支持阿瓜普列塔计划，由此编入联邦军，1921年获授师级将领衔。此后他一边在军中任要职，一边经营筑路公司，利用担任奥尔蒂斯·鲁维奥政府通信与公共工程部长的便利，将泛美公路拉雷多至墨西哥城段承包给自己的公司，积累了巨额财富，成为墨西哥与拉丁美洲最富有的人物之一。1939年5月他退出现役，7月宣布以右翼立场参选总统，获革命统一民族党、国家行动党与劳工党支持。1940年7月7日的选举伴随严重暴力与舞弊，官方宣布阿维拉·卡马乔以压倒性优势当选，但许多人相信安德鲁·阿尔马桑才是真正的赢家。他指控选举舞弊后赴古巴与美国试探罗斯福政府的态度，未获支持后放弃武装起义，返回墨西哥出席阿维拉·卡马乔的就职典礼，此后退出政坛转入商界。1965年10月9日在墨西哥城去世。"
 CBIO_MEX_maria_de_iturbide_desc:0 "全名玛丽亚·约瑟法·索菲娅·德·伊图尔维德·伊·米科什，1872年2月29日生于奥匈帝国瓦什州米科斯塞普拉克庄园，1949年11月在罗马尼亚德瓦去世。父亲萨尔瓦多·德·伊图尔维德·伊·马尔桑是墨西哥第一帝国皇帝阿古斯丁一世的孙子，曾被膝下无嗣的墨西哥第二帝国皇帝马西米利亚诺一世与皇后卡洛塔收为养子，获封伊图尔维德亲王衔；母亲是巴龙夫人吉塞拉·玛丽亚·特雷西娅·米科什。1881年家族因外祖产业易主而迁居威尼斯。1908年她嫁给奥匈帝国骑兵上尉、巴龙约翰·内波穆克·通克尔，育有两女玛丽亚·安娜与玛丽亚·希塞拉；1915年丈夫在第一次世界大战中阵亡后守寡，1923年改嫁夏尔·德·卡里耶尔，未再生育。1895年其父去世后，伊图尔维德皇室继承序位几经辗转；1925年马西米利亚诺的另一养子阿古斯丁·德·伊图尔维德·格林无嗣而终后，她成为伊图尔维德皇室名义继承人，直至1949年去世。她终生未曾踏足墨西哥，其血脉经外孙马克西米利安·冯·格岑-伊图尔维德延续至今，但墨西哥宪法第十二条不承认贵族头衔，该皇室仅具象征意义。"
 CBIO_MEX_matias_santos_ramos_desc:0 "实际姓名为马蒂亚斯·拉莫斯·桑托斯，1891年2月24日生于萨卡特卡斯州埃尔萨尔瓦多尔，出身于曾在十九世纪六十年代抗法战争中服役的军人家庭。1911年3月他被革命理想所感召，不顾独子身份与母亲的劝阻，加入马德罗派，先后在赫尔特鲁迪斯·桑切斯与欧拉利奥·古铁雷斯麾下作战，从列兵起步，经历六十五次战斗，逐级晋升至师级将领。他先后参加了反联邦军、反比利亚、反奥罗斯科、反德拉韦尔塔与反埃斯特拉达的历次战役。此后他在军政两界任要职，历任多州军区司令、国防部次长与官房长。1932年至1936年他出任萨卡特卡斯州州长，任内推行社会主义教育并编撰该州首部税法典。1936年至1937年他出任国民革命党主席。1952年鲁伊斯·科尔蒂内斯总统任命他为国防部长，任期六年，期间他大力支持空军现代化。1962年3月4日在墨西哥城去世。"
 CBIO_MEX_bartolome_garcia_correa_desc:0 "1893年4月2日生于尤卡坦州乌曼，马雅后裔，在州立文学学院取得初等教师与簿记员资格。他自1909年起投身政治，加入反连选连任党，1911年在家乡创建工人互助联盟。萨尔瓦多·阿尔瓦拉多主政尤卡坦期间他任乌曼军事指挥官，此后追随费利佩·卡里略·普埃尔托加入东南社会主义党，1918年在莫图尔第一届工人社会主义大会上当选副主席。1920年他支持阿瓜普列塔计划，在德拉韦尔塔叛乱期间因卡里略·普埃尔托遇害而被迫藏匿于阿内肯庄园躲避追杀。他参与了国民革命党的筹建，在建党大会上当选首届全国执委秘书。1930年2月他就任尤卡坦州长，成为该州历史上首位以马雅血统为主的行政长官。任内他推行社会主义教育，创设名为“红色星期一”的政治宣讲活动以传播卡里略·普埃尔托思想，收购了蒙特霍大道上的坎顿宫改作州长官邸，该建筑今为尤卡坦人类学与历史博物馆。1931年他下令封闭《尤卡坦日报》并创办《东南日报》以打破私营媒体垄断。执政末期，卡里略·普埃尔托的兄弟瓜尔韦托等人与社会主义党决裂，双方在奥皮钦发生武装冲突、造成多人死亡，他因此被召至墨西哥城向总统罗德里格斯解释。卸任后他于1934年二度当选联邦参议员，1940年退出政坛，迁居科利马州特科曼经商。1978年12月17日去世。"
 CBIO_YUG_prince_paul_desc:0 "保罗亲王，原名帕夫莱·卡拉乔尔杰维奇，1893年4月27日生于俄国圣彼得堡，是塞尔维亚阿尔森亲王之子、国王彼得一世之侄，早年就读于牛津大学。1934年10月9日，堂兄亚历山大一世在法国马赛遇刺身亡，保罗依亚历山大遗嘱出任摄政委员会首席，代未成年的彼得二世治理南斯拉夫。任内他致力缓和塞尔维亚与克罗地亚的紧张关系，促成1939年茨维特科维奇与马切克协定，设立克罗地亚自治省。他亲英亲法，却也认为南斯拉夫须向德国倾斜以求自保。1941年3月25日，他在维也纳签署三国同盟条约，引发国内强烈抗议，两天后一批军官发动政变将其罢黜，宣布彼得二世亲政。此后他与家人被英国软禁于肯尼亚。战后南斯拉夫共产党政权缺席判处其为国家敌人，没收其财产并禁止归国，2011年贝尔格莱德法院撤销该判决为其平反。1976年9月14日，他在巴黎去世。"
 CBIO_YUG_milan_stojadinovic_desc:0 "米兰·斯托亚迪诺维奇，1888年8月4日生于塞尔维亚查查克，曾三度出任南斯拉夫王国财政部长。1935年他创立塞尔维亚激进党并联合数党组成南斯拉夫激进联盟，同年6月就任总理兼外交部长。任内他推行亲德意的外交路线，1937年与意大利签订互不侵犯条约，又与保加利亚缔结永久友好条约，并试图与教廷签署宗教协定，但因塞尔维亚东正教会强烈反对而未获批准。他组建身着绿衫的青年团体，在克罗地亚问题上未能达成和解。1939年2月5日，摄政保罗亲王将其免职，此后一度将其软禁。二战后他流亡阿根廷，出任贝隆总统的经济顾问，创办报纸埃尔经济学人报。1954年他与二战期间克罗地亚傀儡政权领袖安特·帕维利奇会晤，商讨分立塞尔维亚与克罗地亚国家的构想，此举使其名誉在南斯拉夫及塞侨群体中大受损害。1961年10月24日，他在布宜诺斯艾利斯去世。"
 CBIO_YUG_milan_grol_desc:0 "米兰·格罗尔，1876年9月12日生于贝尔格莱德，塞尔维亚文学评论家、历史学者、政治家，曾长期担任贝尔格莱德国家剧院院长。一战期间他在日内瓦主持塞尔维亚新闻局。战后他与柳博米尔·达维多维奇共同创立民主联盟，即后来的民主党，1929年出任教育部长后转入反对派。1940年达维多维奇去世后，他接任民主党主席。1941年3月他加入杜尚·西莫维奇政府，轴心国入侵后随政府流亡伦敦，先后出任社会福利与公共卫生部长、交通部长、外交部长。1945年他曾获国王彼得二世提名进入摄政委员会，但铁托拒绝其出任而未果。同年3月流亡政府与游击队临时政府合并，他出任无任所副总理，因共产党未履行组阁协议，同年8月18日辞职。此后他试图复刊民主党机关报民主报，遭游击队当局阻挠，同年11月被软禁，此后淡出公共生活。1952年12月3日，他在贝尔格莱德去世。"
 CBIO_YUG_peter_ii_desc:0 "彼得二世，全名彼得·卡拉乔尔杰维奇，1923年9月6日生于贝尔格莱德，是国王亚历山大一世与罗马尼亚公主玛丽亚之长子。1934年10月9日父亲遇刺身亡后，年仅11岁的他继位为王，由堂叔保罗亲王摄政。1941年3月27日，一批军官因不满保罗签署三国同盟条约发动政变，宣布彼得已成年亲政，两周后轴心国入侵南斯拉夫，他与政府辗转希腊、耶路撒冷、开罗后抵达伦敦，组建流亡政府。他在剑桥大学完成学业并加入英国皇家空军。1944年3月他与希腊的亚历山德拉公主在伦敦成婚。战争期间他先支持德拉查·米哈伊洛维奇的切特尼克，后转而承认铁托游击队的地位。1945年11月29日，南斯拉夫制宪会议宣布废黜其王位，他本人始终未正式退位。战后他定居美国，长年受抑郁与酗酒困扰并因此罹患肝硬化。1970年11月3日，他在接受肝移植手术后于美国丹佛去世。"
 CBIO_YUG_josip_broz_tito_desc:0 "约瑟普·布罗兹，即铁托，1892年5月7日生于克罗地亚库姆罗韦茨的农民家庭，父为克罗地亚人，母为斯洛文尼亚人。一战期间他在奥匈军队服役，成为该军最年轻的士官长，后被俄军俘虏，在乌拉尔战俘营期间投身俄国革命，并参加红军。1920年返回南斯拉夫后加入南斯拉夫共产党，1937年受共产国际委派重组该党，1939年出任总书记。1941年轴心国占领南斯拉夫后，他组建游击队展开抵抗，逐步压倒米哈伊洛维奇的切特尼克并获得盟国支持。1943年11月他在雅伊策主持召开南斯拉夫民族解放反法西斯委员会第二次会议，为战后联邦体制奠定基础。1945年他出任新联邦政府总理，1953年当选总统，1963年任期改为不受限，1974年被定为终身总统。任内他于1948年公开与苏联决裂，走出独立于莫斯科的社会主义道路，并与埃及、印度等国共同发起不结盟运动。1980年1月他因下肢循环障碍住进卢布尔雅那临床中心，左腿随后截肢。1980年5月4日，他在该院去世。"
 CBIO_YUG_vladimir_Cukavac_desc:0 "弗拉迪米尔·丘卡瓦茨，1884年5月29日生于瓦列沃，南斯拉夫王国陆军上将。1936年至1940年他出任南斯拉夫军事学院院长。1941年轴心国入侵期间，他指挥第五集团军，负责多瑙河铁门至希腊边境一线，防御罗马尼亚与保加利亚方向。德军第一装甲集群从索非亚方向突破其防线后，他下令全军渡过摩拉瓦河撤退，但留在河东岸的部队随后被德军第十二集团军击溃。他曾于1934年获得法国荣誉军团勋章。1965年4月7日，他在贝尔格莱德去世。"
 CBIO_YUG_ivan_gosnjak_desc:0 "伊万·戈什尼亚克，1909年6月10日生于奥古林，木匠出身，1933年加入南斯拉夫共产党。1935年他被派往莫斯科列宁学校学习一年，次年在梁赞接受军事训练，代号第三十六号，随后作为志愿者赴西班牙内战，在国际纵队中任上尉。西班牙共和国战败后，他于1939年在法国被拘留，法国投降后越狱，1941年前往德国当劳工，持假护照隐藏身份，1942年7月返回克罗地亚并立即加入铁托游击队。1943年他获授克罗地亚境内各游击部队指挥权，整编为第四军。战后他出任副总司令直至1950年，此后任国防部副部长，1953年起任国防部长直至1967年。1949年布达佩斯拉伊克案审判中，他曾被诬指为盖世太保特工。1974年他退役，此后担任联邦委员会顾问。1980年2月8日，他在贝尔格莱德去世。"
 CBIO_YUG_danilo_kalafatovic_desc:0 "达尼洛·卡拉法托维奇，1875年10月27日生于科纳雷沃，南斯拉夫王国陆军上将。一战末期他出任塞尔维亚总参谋部作战处处长。两次大战间他历任多个军区参谋长及驻保加利亚、罗马尼亚武官。1941年4月13日，轴心国入侵期间，国王彼得二世任命他接替杜尚·西莫维奇出任总参谋长，并授权其与轴心国谈判投降事宜。4月17日，他委派外交部长亚历山大·钦查尔马尔科维奇与拉迪沃耶·扬科维奇将军代表南斯拉夫在贝尔格莱德签署无条件投降书，结束为期十一天的四月战争。此后他被德军俘虏。1946年，他在盟军占领下的德国摩斯堡去世。"
 CBIO_YUG_milutin_nedic_desc:0 "米卢廷·内迪奇，1882年10月26日生于贝尔格莱德近郊索波特，是米兰·内迪奇之弟。1901年加入塞尔维亚军队，参加两次巴尔干战争与第一次世界大战。两战期间他历任驻保加利亚、法国、意大利武官及空军总监，1936年出任总参谋长，次年批准应对德国吞并奥地利后局势的作战计划。1938年他改任陆海军部长，由杜尚·西莫维奇接任总参谋长。1941年轴心国入侵期间，他指挥第二集团军群，下辖第一、第二集团军，负责多瑙河至蒂萨河一线防务。战败后他被德军俘虏，1942年获准返回贝尔格莱德。1944年他撤往奥地利。1945年，他在奥地利自杀身亡。"
 CBIO_YUG_petar_kosic_desc:0 "佩塔尔·科西奇，1881年5月13日生于瓦列沃附近的布亚契奇村，南斯拉夫王国陆军上将，反对与纳粹德国开战。他1898年考入军事学院炮兵科，历任多个军区参谋长、第二骑兵师代理师长，1932至1933年出任南斯拉夫裁军会议代表团成员，其后出任陆军部长兼总参谋长。1941年3月27日，其军校同窗、陆军上将杜尚·西莫维奇发动政变推翻摄政保罗亲王，科西奇随即被免职退役，西莫维奇接任总参谋长并兼任总理。1949年5月18日去世。"
 CBIO_YUG_marijan_polic_desc:0 "马里扬·波利奇，1876年5月5日生，克罗地亚裔海军军官，曾服役于奥匈帝国海军，后转入南斯拉夫王国海军。1918年10月一战末期，时任科尔维特舰长的他为防止普拉港内的奥匈军舰落入意大利海军之手，率部分舰只悬挂美国国旗迷惑意方，突围南下最终将舰队移交斯普利特的塞尔维亚克罗地亚斯洛文尼亚国当局。1934年3月至1940年4月他出任南斯拉夫海军总司令，1939年英国观察员评价其为人和气但专业知识欠缺。他在开战前已退役，未在1941年四月战争中直接指挥。轴心国占领期间，他于1942年被列入克罗地亚独立国国土防卫军的退役军官名册，伦敦流亡政府因此于同年3月剥夺其军衔并宣布其为军事逃兵。1958年12月4日，他在萨格勒布去世，葬于米罗戈伊公墓。"
 CBIO_SOV_vasily_flug_desc:0 "瓦西里·叶戈罗维奇·弗卢格，一八六零年三月十九日生于圣彼得堡，帝俄步兵上将，曾参加庚子事变、日俄战争与第一次世界大战。一战期间他曾短暂出任第十集团军司令，后长期担任第二军军长，一九一五年维尔纳战役中顶住德军楔入两军防线的攻势并转入反击，因功获圣乔治勋章四级，一九一七年四月一度代理第九集团军司令。二月革命后他被编入彼得格勒军区军官预备役，十月政变后南下顿河，向阿列克谢耶夫将军请缨加入志愿军，随后受命秘密赴西伯利亚组织反布尔什维克地下军官团体，化名瓦西里·法杰耶夫辗转鄂木斯克、托木斯克、伊尔库茨克与海参崴，并加入霍尔瓦特将军的远东政府。此后他返回南俄，在邓尼金麾下从事后勤整顿，基辅失守后随部撤往克里米亚。一九二零年弗兰格尔军自克里米亚撤离后，他侨居南斯拉夫王国，一九二二年起任职该国军事部，并长期活跃于俄国全军联合会贝尔格莱德分部。二战爆发、南斯拉夫遭占领后，他在由白俄侨民组成的俄国保卫军团中任职。战后他移居美国。一九五五年十二月三日，他在旧金山去世。"
 CBIO_SOV_boris_shteifon_desc:0 "鲍里斯·亚历山德罗维奇·施泰丰，一八八一年十二月十八日生于哈尔科夫，父亲是受洗的犹太裔工匠，母亲是教会助祭之女。他毕业于哈尔科夫实科中学与丘古耶夫步兵士官学校，一九零二年任少尉，参加日俄战争并因伤获圣弗拉基米尔勋章。第一次世界大战期间他在高加索集团军服役，因埃尔祖鲁姆要塞侦察有功获圣乔治金质武器，一九一七年升任师参谋长，晋上校。十月政变后，他在哈尔科夫组织地下军官团体，协助将军官与武器输送至志愿军，同年秋辗转叶卡捷琳诺达尔，受命组建别洛焦尔斯克步兵团并参加第一次库班远征，此后在德罗兹多夫斯基师任职。弗兰格尔军自克里米亚撤退后，他受库捷波夫将军委任为加里波利营地专员，因功晋升少将，随后任第一军参谋长。一九二二年他被保加利亚政府驱逐至南斯拉夫王国，定居贝尔格莱德。一九四一年南斯拉夫遭德军占领后，他受斯科罗杜莫夫将军之邀出任新组建的俄国保卫军团总参谋长；斯科罗杜莫夫与德方发生冲突被捕后，他接任军团司令，率部与铁托游击队作战，一九四四年底又与挺进巴尔干的苏联红军交战。他多次要求将军团调往东线未获德方批准，一九四三年获德国国防军中将军衔。一九四五年四月三十日，他在萨格勒布病发去世。"
 CBIO_YUG_borivoje_mirkovic_desc:0 "博里维耶·米尔科维奇，一八八四年九月二十三日生于瓦列沃，南斯拉夫王家空军准将。一九零七年参军，一九一六年加入新组建的塞尔维亚航空队并随法国联队作战。一九三零年结婚，妻子米拉一九三七年病逝。他是一九四一年三月二十七日政变的主要组织者，联合齐万·克涅热维奇等军官推翻摄政保罗亲王，拥立十七岁的彼得二世亲政，并支持杜尚·西莫维奇出任总理。政变引发德国为首的轴心国入侵，一九四一年四月十四日他将空军代理指挥权移交武克切维奇上校，两天后乘机撤离时座机遭希腊高射炮击中，本人身负重伤。此后他辗转开罗，卷入流亡政府内部权力斗争，一九四二年一月与陆海军部长伊利奇一同被彼得二世撤职，即所谓开罗丑闻。此后他转入英国军队服役，战后定居伦敦。一九六九年八月二十一日，他在伦敦去世。"
 CBIO_YUG_dusan_simovic_desc:0 "杜尚·西莫维奇，一八八二年十月二十八日生于克拉古耶瓦茨，一九零零年毕业于贝尔格莱德军事学院，参加巴尔干战争与第一次世界大战，战后转投航空事业，一九三六至一九三八年任南斯拉夫王家空军司令。一九三八年五月至一九四零年他出任总参谋长，主张全境设防的作战计划，因政治考量优先于军事合理性备受质疑。一九四一年三月二十七日，他名义上领导了推翻摄政保罗亲王的政变，就任总理并兼任总参谋长，随后组建包含克罗地亚农民党等各党派的举国一致内阁。他未撕毁三国同盟条约，试图以此避免德国入侵，但徒劳无功，一九四一年四月六日德军轰炸贝尔格莱德，当日恰逢其女儿婚礼。他随王室经希腊、耶路撒冷辗转流亡伦敦，一九四一年十月获悉拉夫纳山有支游击力量后，将其确认为德拉查·米哈伊洛维奇领导的切特尼克并予以支持。一九四二年一月十一日，因与内阁矛盾激化，他被彼得二世免去总理职务。一九四五年六月他返回贝尔格莱德，次年在米哈伊洛维奇审判中出庭作证，此后著书论军事问题。一九六二年八月二十六日，他在贝尔格莱德去世。"
 CBIO_YUG_draza_mihailovic_desc:0 "德拉查·米哈伊洛维奇，本名德拉戈柳布，一八九三年四月二十七日生于伊万伊察，七岁丧父由伯父在贝尔格莱德抚养长大，一九一零年考入塞尔维亚军事学院，参加巴尔干战争与第一次世界大战表现出色。一九四一年南斯拉夫战败后，他没有随军投降，转入拉夫纳山组织游击力量，即切特尼克，起初与铁托领导的游击队一同抵抗轴心国占领。因战略分歧与相互猜疑，两支力量自一九四一年底转为交战。流亡政府一九四二年一月任命他为陆海空军部长，同年六月晋升为总参谋长。他麾下部分地方指挥官与意大利占领当局及德军达成默契甚至合作，以对抗游击队为条件换取给养，这一做法招致盟国不满。一九四四年他协助营救数百名盟军飞行员，即军旗行动，但盟国已转向支持铁托，一九四四年八月他被免去职务。战后他继续在东波斯尼亚一带潜伏，一九四六年三月十二日被捕，同年六月受审，被控叛国及战争罪。一九四六年七月十七日，他在贝尔格莱德被处决。二零一五年五月，塞尔维亚最高法院以审判具有政治动机为由撤销原判。"
 CBIO_YUG_mihajlo_lukic_desc:0 "米哈伊洛·卢基奇，一八八六年九月二十四日生于克罗地亚波德拉维纳地区，塞尔维亚裔家庭出身，本人自认克罗地亚人。他先后就读贝洛瓦尔中学、卡尔洛瓦茨高等士官学校，毕业于维也纳军事学院，一战期间在奥匈军队服役，战后转入南斯拉夫王国军队。一九四一年四月战争爆发时，他指挥特里格拉夫山地支队。同年四月克罗地亚独立国成立后，他随即加入其本土卫队，先后执掌奥西耶克师、驻比哈奇的利卡旅，并短期兼任驻第二意大利集团军联络官及步兵总监。一九四一年底至一九四三年四月，他出任第三本土卫队军军长，负责克罗地亚独立国南部大片辖区，其间曾与朱雷·弗兰切蒂奇的黑色军团协同作战。一九四二年起，他公开反对将克罗地亚志愿兵编入德国国防军，因而于一九四三年被迫退役。他是傀儡组织克罗地亚东正教会的发起人之一。战后他被判十年监禁，服刑五年后获释，此后以退休金领取者身份在萨格勒布终老。一九六一年七月十八日，他在萨格勒布去世。"
 CBIO_YUG_bogoljub_ilic_desc:0 "博戈柳布·伊利奇，一八八一年二月二十二日生于波扎雷瓦茨，一九零零年任军官，参加巴尔干战争与第一次世界大战并历任多个参谋职务。一九二五年晋升准将，此后历任第五集团军参谋长、第一骑兵师师长、总参谋部第二副总长，一九三六年九月起出任驻萨拉热窝第二集团军司令。一九四一年三月二十七日政变后，他短暂出任陆海军部长，德国入侵期间随流亡政府撤往开罗，并接替西莫维奇兼任总参谋长，统辖滞留埃及、巴勒斯坦一带的南斯拉夫残部。一九四二年一月，因与米尔科维奇一同卷入所谓开罗丑闻，彼得二世将二人一并免职并勒令退役，由德拉查·米哈伊洛维奇接任陆海空军部长兼总参谋长一职。此后他返回南斯拉夫定居。一九五六年四月二十三日，他在贝尔格莱德去世。"
 CBIO_YUG_petar_vukcevic_desc:0 "佩塔尔·武克切维奇，一八九四年十一月七日生于戈列马迪村，先后就读贝尔格莱德中学与军事学院初级班。第一次世界大战期间他在第六步兵团服役，经历了塞尔维亚军队的阿尔巴尼亚苦难历程，一九一六年在萨洛尼卡前线身负重伤，一九一七年在萨洛尼卡完成侦察飞行员课程后转入航空兵。一九四一年四月战争爆发时，他任第四轰炸机旅旅长。四月十四日，出逃前的空军司令博里维耶·米尔科维奇将代理司令职务移交给他，他一直履职至十七日。他拒绝随国王与政府一同撤离，随后被俘押往意大利战俘营，并拒绝了以自称黑山人换取释放的机会，直至一九四三年意大利投降后才转往瑞士。一九七六年四月二十五日，他在苏黎世去世。"
 CBIO_YUG_ljubomir_maric_desc:0 "胡博米尔·马里克，一八七八年一月十八日生于科西耶里奇附近的加洛维奇村，塞尔维亚军官，历经巴尔干战争与第一次世界大战，曾任军事学院教授。一九三五年五月至一九三六年三月，他出任南斯拉夫王家陆军总参谋长；一九三六年三月至一九三八年八月，转任陆海军部长，其间曾会见来访的波兰外长约瑟夫·贝克。一九三八年由米卢廷·内迪奇接任部长一职，一九三九年他正式退役。一九六零年八月十一日，他在贝尔格莱德去世。"
 CBIO_YUG_arso_jovanovic_desc:0 "阿尔索·约万诺维奇，一九零七年三月二十四日生于波德戈里察附近扎瓦拉村的皮佩里氏族家庭，一九二五年考入贝尔格莱德军事学院，通晓法语、俄语与英语，是游击队将领中受教育程度最高者之一。一九四一年四月战争爆发时他任萨拉热窝方向学兵营营长，德军装甲部队攻入萨拉热窝后他没有驰援在杰尔文塔遇袭的米哈伊洛维奇，而是返回黑山家乡，参加同年七月十三日黑山起义。他曾独自率部俘获两千名意大利军人，后升任黑山与博卡地区游击队参谋长。一九四一年十二月十二日，他被任命为南斯拉夫游击队最高统帅部参谋长，此后长期撰写详尽的军事报告，并在一九四四年德尔瓦尔游击军官学校任教。一九四五年三月他出任新组建的南斯拉夫人民军总参谋长。一九四八年铁托与斯大林决裂后，他公开倒向苏联一方，同年八月十二日，在试图与另两名持不同政见的黑山人一同越境逃往罗马尼亚途中，被南斯拉夫边防军击毙，其死因至今仍存争议。"
 CBIO_YUG_slobodan_jovanovic_desc:0 "斯洛博丹·约万诺维奇，一八六九年十二月三日生于诺维萨德，一八九零年在日内瓦获法学学位，一八九七年起任贝尔格莱德大学法学院教授逾四十年，两度出任校长，一九零八年加入塞尔维亚皇家科学院，一九二八至一九三一年任院长，一九一九年出席巴黎和会担任南斯拉夫代表团专家。一九二零年他受托主持起草日后成为维多夫丹宪法的南斯拉夫首部宪法草案。他是南斯拉夫宪法学权威，也是塞尔维亚散文大家，被称为贝尔格莱德文体的代表人物。一九四一年三月政变后他出任副总理，同年随王室流亡，一九四二年一月十一日至一九四三年六月二十六日任流亡政府总理，任内确认并支持德拉查·米哈伊洛维奇领导的切特尼克为南斯拉夫正统抵抗力量。战后南斯拉夫共产党政权将其与米哈伊洛维奇一同缺席审判，一九四六年七月判处二十年徒刑并剥夺政治权利及财产，此后他一直侨居伦敦。一九五八年十二月十二日，他在伦敦去世。二零零七年贝尔格莱德法院为其平反，二零一一年他的遗骨迁葬回贝尔格莱德。"
 CBIO_YUG_milovan_djilas_desc:0 "米洛万·吉拉斯，一九一一年六月十二日生于黑山莫伊科瓦茨附近的波德比什切村的农民家庭。他就读贝尔格莱德大学期间接触马克思主义，一九三二年因参加反政府示威被拘留，次年再度被捕并遭刑讯，被判监禁三年，狱中结识多名南共高层。一九三七年他结识铁托，一九三八年进入南共中央委员会，一九四零年进入政治局。一九四一年轴心国入侵后，他协助铁托组建游击队，在黑山与波斯尼亚指挥抵抗力量，一九四四年作为军事及党的代表团成员访问苏联，会见斯大林等人。战后他出任黑山部长，后任不管部部长兼政治局书记，一九五三年当选副总统。一九四八年铁托与斯大林决裂后，他随铁托出使莫斯科谈判未果。此后他逐渐对南共体制产生质疑，一九五四年因公开批评党内特权阶层被开除出中央委员会及一切职务，一九五五年出版《新阶级》，深刻批判共产主义制度制造出的新特权官僚阶层，因此再度被捕入狱，一九六二年出版《同斯大林的谈话》后刑期再度加重，狱中他曾用卫生纸译出弥尔顿的《失乐园》。一九六六年十二月三十一日获特赦出狱，此后定居贝尔格莱德，晚年仍反对南斯拉夫走向解体和民族冲突。一九九五年四月二十日，他在贝尔格莱德去世。"
 CBIO_YUG_milan_nedic_desc:0 "米兰·内迪奇，一八七八年九月二日生于贝尔格莱德近郊格罗茨卡，一九零四年从贝尔格莱德军事学院毕业任职，参加巴尔干战争屡获战功勋章，一九一五年经阿尔巴尼亚大撤退，三十八岁即成为塞尔维亚总参谋部最年轻的上校。一九三四至一九三五年他出任南斯拉夫总参谋长，一九三九年任陆海军部长，因反对与纳粹德国开战，一九四零年十一月被摄政保罗亲王免职。一九四一年他支持推翻保罗亲王的政变，德国入侵期间不久前刚在斯梅德雷沃一次军火库爆炸中失去独子及待产儿媳。一九四一年八月二十九日，他接受德国占领当局委任，出任德占塞尔维亚傀儡政权国家救亡政府总理，宣称此举旨在保全塞尔维亚民族的核心，并反对民众组织抵抗，其治下政府参与对犹太人的登记及财产没收，境内大批犹太人在此期间被杀害。一九四四年十月四日，随游击队攻克贝尔格莱德，他出逃至奥地利，向英军投诚。一九四六年一月一日，英方将他移交南斯拉夫游击队当局，同年二月四日，据官方说法他在贝尔格莱德监狱跳窗自杀身亡，这一说法后来受到质疑。"
 CBIO_YUG_ivan_ribar_desc:0 "伊万·里巴尔，一八八一年一月二十一日生于卡尔洛瓦茨附近的武克马尼奇村，克罗地亚裔政治家，先后在维也纳、布拉格、萨格勒布学习法律并获博士学位，一九零六年参与创立克罗地亚进步民主党。一九二零年他出任南斯拉夫王国立宪议会及议会主席直至一九二二年，曾主持议会会议期间目睹普尼沙·拉契奇枪击克罗地亚农民党领袖斯捷潘·拉迪奇等议员。一九二九年六一独裁确立后，他长期在法庭为多名被控共产党人辩护，其中包括其长子伊沃·洛拉·里巴尔。一九四二年他加入游击队，同年十月起草筹备南斯拉夫民族解放反法西斯委员会，一九四二年十一月在比哈奇当选该委员会执行委员会主席，一九四三年十一月主持雅伊策第二次会议，一九四三年成为南共党员。战争期间他失去两个儿子和妻子，长子伊沃·洛拉一九四三年十一月牺牲，次子尤里察同年十月牺牲，妻子安东尼娅一九四四年七月在斯雷姆被德军处决。一九四五年三月至一九五三年一月，他出任临时人民议会及联邦人民议会主席团主席，依宪法相当于国家元首。一九五三年铁托当选总统后，他退出该职务，晚年定居萨格勒布。一九六八年二月二日，他在萨格勒布去世。"
 CBIO_YUG_dimitrije_ljotic_desc:0 "迪米特里耶·廖蒂奇，一八九一年八月十二日生于贝尔格莱德，父亲弗拉基米尔曾任斯梅德雷沃市长及塞尔维亚驻萨洛尼卡领事。他在萨洛尼卡塞尔维亚中学毕业后就读贝尔格莱德大学法学院，巴尔干战争期间志愿服务军医队，一战期间随军经历阿尔巴尼亚大撤退，一九二零年退役后加入人民激进党从政，一九三一年被亚历山大一世国王任命为司法部长，旋即因宪政理念分歧辞职。一九三五年一月六日，他创立并出任南斯拉夫民族运动主席，该党持威权、反共、反犹立场，带教权法西斯色彩，历届选举得票不足百分之一。一九三九年他反对茨维特科维奇与马切克协定，其支持者引发骚乱后该运动被政府取缔，他本人转入地下。一九四一年轴心国占领南斯拉夫后，他拒绝在德方扶植的委员会政府任职，但推荐米兰·内迪奇出任国家救亡政府总理，并主导本党骨干组建塞尔维亚志愿军，配合德军镇压游击队与切特尼克。一九四四年十二月他为促成塞尔维亚东正教牧首加夫里洛·多日奇获释奔走。一九四五年战争末期，他随塞尔维亚志愿军等反共力量撤往斯洛文尼亚，图谋复辟君主制。一九四五年四月二十三日夜，他乘坐的汽车在斯洛文尼亚境内因路况受损冲下断桥坠河，他与司机当场身亡，安葬于斯洛文尼亚申佩特尔。"
 CBIO_YUG_ivo_lola_ribar_desc:0 "伊沃·洛拉·里巴尔，本名伊万，一九一六年四月二十三日生，是伊万·里巴尔的长子，就读贝尔格莱德大学法学院期间加入南斯拉夫共产主义青年团，一九三四年亚历山大一世国王遇刺后一度避居日内瓦。一九三六年他出任南斯拉夫共产主义青年团中央委员会书记，成为铁托身边最年轻的核心成员之一，战前创办多份左翼青年刊物。一九四一年轴心国占领后，他成为游击队最高统帅部成员，一九四二年参与创建统一南斯拉夫反法西斯青年联盟。一九四三年十月，铁托任命他为游击队首个赴中东盟军司令部代表团团长，准备乘缴获的德国飞机经格拉莫奇机场飞赴开罗。一九四三年十一月二十七日，起飞前夕德军战机空袭该机场，他与两名英国军官等人一同罹难，年仅二十七岁。他的未婚妻斯洛博达·特拉伊科维奇因拒绝写信引诱他暴露行踪，后被关入巴尼察集中营并遭毒气杀害。他最初秘密安葬于克柳奇附近戈尔尼里布尼克村，一九四八年迁葬至贝尔格莱德要塞民族英雄墓，一九四四年十一月十八日被追授南斯拉夫人民英雄称号。"
