l_simp_chinese:
 BRM_archibald_cochrane_desc:0 "阿奇博尔德·道格拉斯·科克伦,1885年1月8日生于苏格兰法夫郡斯普林菲尔德,是卡尔茨男爵托马斯·科克伦次子。1901年加入英国皇家海军,历任军舰军官,一战期间三次获嘉奖并两获杰出服务勋章。战后他投身政界,1924年至1929年任统一党下院议员代表东法夫选区,1932年补选后代表邓巴顿郡选区直至1936年。1936年他被任命为缅甸总督,此举本身即为对缅甸民族主义情绪的一种让步,因为此前历任总督均出身印度文官系统,而他是首位出身海军的非文官总督。1937年4月1日缅甸正式脱离印度成为单独行省,他主持了同年缅甸史上首次大选。任内缅甸相对平静,他于1941年卸任,翌年继任总督多曼-史密斯即遭遇日军入侵之祸。二战期间他改任商船巡洋舰舰长执行护航任务,战后转入商界,出任苏格兰标准人寿公司董事。1958年4月16日,他在东洛锡安因格利斯菲尔德去世。"
 CBIO_AOI_enrico_cerulli_desc:0 "恩里科·切鲁利,1898年2月15日生于那不勒斯,在那不勒斯腓特烈二世大学攻读法律,博士论文研究索马里马杰尔廷部落习惯法,同时在那不勒斯东方学院师从加利纳研习埃塞俄比亚闪含语系语言,师从莱维·德拉·维达与纳利诺研习阿拉伯语及伊斯兰学。毕业后他进入意大利殖民部任职,派驻意属索马里兰负责政治事务,其索马里语言与文化研究成果至今仍受重视。1928至1929年他参与阿布鲁齐公爵探险队考察韦比河源头。1935至1936年意埃战争期间,他多次奉命执行外交斡旋任务。1937年12月15日至1939年5月5日,他出任意属东非副总督,常驻亚的斯亚贝巴,协助总督兼副王阿梅迪奥亲王处理政务。此后他历任绍阿总督、哈拉尔总督。1940年他退居预备役,1943至1945年因政局变故避居梵蒂冈城。战后埃塞俄比亚政府曾将其列入向联合国战争罪行委员会提交的十名意大利战犯嫌疑人名单,但案件最终未有定论。他后转入外交界,1950至1954年出任驻德黑兰大使,任内对什叶派宗教剧塔齐叶产生浓厚兴趣并加以研究。他是意大利研究索马里、埃塞俄比亚及但丁与伊斯兰关系的著名东方学家,1954年将大批埃塞俄比亚珍稀手稿捐赠梵蒂冈图书馆。1988年,他在罗马去世。"
 CBIO_AOI_guglielmo_nasi_desc:0 "古列尔莫·纳西,1879年2月21日生于奇维塔韦基亚,1898年毕业于都灵军校任炮兵少尉。1911年他参加意土战争,1912年获颁勇敢勋章,一战结束时已升至中校。1924年至1928年他出任意大利陆军驻巴黎武官,后调往殖民地,1928年任殖民地部队参谋长,1934至1935年任昔兰尼加副总督,1936至1939年任哈拉尔总督,1939至1940年任绍阿总督,并自1939年起兼任意属东非副总督。他致力于整肃军政腐败,善于笼络当地部族首领。1936年第二次意埃战争期间,他指挥格拉齐亚尼元帅南线三路纵队之一,所部多为利比亚籍士兵。1940年战争爆发后,他率军攻占英属索马里兰,凭借空中与装甲优势迫使英联邦守军经海路撤往亚丁。1941年英军反攻后他退守要塞贡德尔,在意属东非其余据点相继陷落后仍坚持抵抗,阿梅迪奥亲王与加泽拉将军相继投降后,他一度代理总督之职,直至同年11月28日方在贡德尔投降,成为意属东非最后一支正规抵抗力量的指挥官。此后他被押往肯尼亚战俘营,阿梅迪奥亲王去世后接管六万意军战俘事务,1945年返回意大利。1949年联合国将索马里托管交予意大利后,他一度出任索马里临时行政专员,后因埃塞俄比亚方面指控其战争罪行而遭撤换。1971年9月21日,他去世。"
 CBIO_AOI_prince_amedeo_desc:0 "阿梅迪奥亲王,全名阿梅迪奥·翁贝托·伊莎贝拉·路易吉·菲利波,1898年10月21日生于都灵,是意大利王室萨伏依-奥斯塔支系成员,阿奥斯塔第二代公爵埃马努埃莱·菲利贝托之子,意大利国王维克托·伊曼纽尔三世的堂侄。他早年就读英国雷盖特圣戴维学院,养成英式做派,能讲一口牛津腔英语。他入读那不勒斯军事学院,一战期间在炮兵部队服役表现出色,1921年退役后游历非洲各地,后重返军界成为飞行员,1932年加入意大利皇家空军,曾在利比亚参与镇压塞努西游击队的行动。1931年父亲去世后他袭封阿奥斯塔公爵。1937年,他接替格拉齐亚尼元帅出任意属东非总督兼副王,同时统率驻厄立特里亚、埃塞俄比亚和索马里兰全部意大利军队,其治理普遍被认为优于前任。1940年意大利参战后他统率东非意军,先后攻入苏丹、肯尼亚并占领英属索马里兰,1941年初英军发起反攻后意军转入守势。因补给断绝,他将残部集中至阿姆巴阿拉吉等要塞据守,本人亲率七千守军坚守阿姆巴阿拉吉,在断水断粮、遭九千英联邦军与逾两万埃塞俄比亚游击队围攻后,于1941年5月18日体面投降,所部因抵抗顽强获准以军礼投降。此后他被关押在肯尼亚内罗毕战俘营,在狱中被推举统领意大利战俘。1942年3月3日,他因肺结核与疟疾并发症在战俘营中去世。"
 CBIO_AOI_ruggero_santini_desc:0 "鲁杰罗·圣蒂尼,1870年4月16日生于巴勒莫附近的西西里文蒂米利亚,1892年9月获步兵少尉军衔,后转入总参谋部。他参加过第一次意埃战争与意土战争,第一次世界大战期间在对奥匈作战中效力。1935年第二次意埃战争爆发,他出任第一军军长,随德博诺元帅纵队自厄立特里亚一线向南推进,参与攻占马卡莱,1936年随巴多利奥元帅主力纵队向亚的斯亚贝巴挺进途中经过阿姆巴阿拉吉,在当地为1895年阵亡的托塞利少校等烈士举行悼念仪式。他也曾出任意属索马里兰殖民总督。1958年4月4日,他去世。"
 CBIO_AOI_vincenzo_de_feo_desc:0 "温琴佐·德·费奥,1876年9月16日生于坎波巴索附近米拉贝洛萨尼蒂科,毕业于利沃诺海军学院并获电气工程学位。1911至1912年他参加意土战争,一战期间在潜艇部队服役,先后于1915年与1918年两获银质军事勇敢奖章。他兼具技术发明才能,在水下武器、化学炸药、电子、电报及弹道学五个领域拥有专利,发明的吉米特罗陀螺瞄准仪自1930年起装备意大利舰队全部炮瞄系统,并曾资助外甥乌戈·蒂贝里奥在利沃诺海军学院研发意大利雷达系统。1934年12月20日他晋升海军上将。1937年4月1日至12月15日,他出任意属厄立特里亚总督。1939年3月25日经海军部提名获任王国参议员,同年4月17日宣誓就职。二战爆发后他被派往对法停战委员会,负责签署涉及海军事务的停战议定书,期间秘密主导反间谍行动破获两个法方情报网络。1944年8月7日,法西斯制裁最高法院以其曾支持法西斯政权为由对其提出指控。1949年他正式退役。1955年1月17日,他在罗马家中去世,葬于韦拉诺公墓。"
 CBIO_BRM_ba_maw_desc:0 "巴莫,1893年2月8日生于缅甸毛淡棉附近毛宾一个孟族与缅族混血家庭,父亲吴皆是曾服务末代缅王廷的官员。他先后就读仰光学院、印度加尔各答大学,后赴英国剑桥大学深造,1923年在格雷律师学院取得律师资格,又赴法国波尔多大学攻读博士学位,以缅甸佛教研究撰写法语论文。1917年他成为仰光大学首位缅籍讲师。二十年代起他从事律师与政治活动,1931年因出任农民起义领袖萨亚桑的辩护律师而声名大噪。1934年他出任教育卫生部长,1937年4月缅甸脱离印度实行新宪法后,他成为缅甸首任总理,任至1939年2月在联合政府倒台中下野。此后他联合其他民族主义者组建自由集团,反对缅甸参与英国主导的二战,1940年8月因煽动罪被英方逮捕入狱。1942年日军入侵缅甸后将他救出监狱,先出任临时行政委员会主席,1943年8月1日日本宣布名义上的缅甸独立,他就任国家元首兼总理,同年11月出席东京大东亚会议。1945年日军败退前夕,他经泰国出逃日本,同年年底被美军占领当局逮捕,关押于东京巢鸭监狱至1946年,后获准返回缅甸,创立大缅甸党。1962年奈温政变后,他于1965至1968年间再度遭无罪羁押。他晚年撰写回忆录突破缅甸记述这段历史。1977年5月29日,他在仰光去世。"
 CBIO_BRM_myat_phaya_lat_desc:0 "密亚特·帕亚·拉,1883年10月4日生于曼德勒王宫,是缅甸贡榜王朝末代国王锡袍与王后苏帕耶拉之次女。1885年第三次英缅战争后,锡袍战败退位,全家被英方流放至印度孟买管区拉特纳吉里。1916年锡袍在流亡中去世,由于长姊密亚特·帕亚基已因与印度平民相恋而放弃王族身份,她遂成为贡榜王室最年长的在世成员,承袭家督之位。1917年2月20日,她在拉特纳吉里与前锡袍私人秘书、印度警察官员钦貌拉特成婚,婚后未有亲生子女,收养了一名尼泊尔女仆之子取名貌卢基作为嗣子。此后余生她一直以贡榜王室最高长辈身份维系流亡家族的凝聚,后世自称贡榜王位继承人者多溯源于她这一支。1956年4月4日,她在印度噶伦堡去世。"
 CBIO_BRM_ne_win_desc:0 "奈温,本名瑞貌,1911年5月24日(一说1910年7月10日)生于缅甸邦德勒附近一村庄。1929年他入读仰光大学攻读生物学,原本有意从医,1931年因考试不及格遭学校开除。此后他加入民族主义组织德钦党,与昂山、吴努等同为骨干成员。1941年他作为三十志士之一被选派赴中国海南接受日方军事训练,取化名波奈温,意为光辉的太阳。1942年他随日军及缅甸独立军返回缅甸,1943年出任由该军改编的缅甸国防军指挥官,后对日方日渐失望,暗中协助组织抵抗运动。1945年3月缅甸国防军倒戈反正,加入盟军对日作战。1948年缅甸独立后他出任缅军第二任总司令,1949年1月31日晋升武装部队总参谋长,同年4月至1950年9月兼任国防部长,主导重建军队镇压各地民族与共产主义叛乱及国民党残军。1958年,吴努政府因党争陷入瘫痪,他受邀出任看守政府总理,1960年选举后交还政权。1962年3月2日,他发动政变推翻吴努,建立革命委员会实行军事统治,创立缅甸社会主义纲领党,推行缅甸式社会主义实行国有化与孤立主义外交。1974年新宪法颁布后他改任总统直至1981年,此后仍以党主席身份掌握实权。1988年在大规模反政府示威后辞职,但据信仍在幕后左右政局。2002年12月5日,他在仰光去世。"
 CBIO_BRM_u_nu_desc:0 "吴努,1907年5月25日生于缅甸伊洛瓦底省瓦克马镇,毕业于仰光苗玛国立中学,1929年获仰光大学学士学位,同窗好友包括后来的联合国秘书长吴丹。他曾任教师、记者数年,1934年重返仰光大学攻读法律并当选大学生会主席,1935年与妙伊结婚。1936年他与昂山共同领导仰光大学学生罢课运动,双双遭校方开除,由此声名鹊起,加入德钦民族主义运动。1940年他因煽动罪被英方关入仁安羌监狱,至1942年日军入侵前获释。日据时期他先后出任巴莫政权外交部长(1943年)、宣传部长(1944年),1945年三月反法西斯人民自由同盟发起全国起义时他一度仍留在巴莫一方随日军撤退,战后退出政坛专事写作,著有回忆录记述这段经历。1947年7月昂山遇刺后,他临危受命出任自由同盟领袖,同年十月与英国首相艾德礼签署努-艾德礼条约。1948年1月4日缅甸独立,他出任首任总理,此后三度组阁(1948—1956、1957—1958、1960—1962),任内推行福邦经济福利计划及土地改革,并为不结盟运动创始人之一。1958年他一度邀请奈温组建看守政府,1960年选举获胜后复任总理,1961年推动佛教定为国教。1962年3月奈温政变后,他被扣押四年。1969年他借朝圣之机出走印度,后辗转伦敦,自称合法总理领导流亡抵抗运动,1980年应奈温邀请返缅出家为僧。1988年八八民主运动期间他一度重返政坛自任合法总理组建过渡政府,未获昂山素季等反对派认同,1989年遭软禁至1992年获释。1995年2月14日,他在仰光家中自然辞世。"
 CBIO_CRO_ante_pavelic_desc:0 "安特·帕韦利奇,1889年7月14日生于波斯尼亚布拉迪纳,在萨格勒布攻读法律并执业,早年加入克罗地亚权利党,主张克罗地亚独立、反对塞尔维亚人主导的南斯拉夫中央集权。1927年当选南斯拉夫议会议员,1929年亚历山大一世实施独裁、取缔政党后,他流亡意大利,创建乌斯塔沙运动,以恐怖主义手段谋求克罗地亚独立,1934年伙同马其顿内部革命组织在马赛刺杀亚历山大一世,因此先后被南斯拉夫、法国缺席判处死刑。1941年轴心国入侵南斯拉夫后,他返回萨格勒布,就任克罗地亚独立国元首,自称波格拉夫尼克。任内他推行极端民族主义与种族清洗政策,大规模迫害塞尔维亚人、犹太人和罗姆人,建立雅塞诺瓦茨等集中营,南斯拉夫法庭认定其应对约七十万人的死亡负责。1945年战败前夕,他组织大批军民撤往奥地利,自己则辗转经意大利于1948年抵达阿根廷,在庇隆庇护下继续活动。1957年遇刺重伤后逃往西班牙。1959年12月28日,他因枪伤并发症在马德里去世。"
 CBIO_CRO_duro_jakcin_desc:0 "杜罗·雅钦,1889年2月22日生于维也纳,1909年毕业于海军学院后加入奥匈帝国海军,一战期间累升至战列舰海军上尉,1917年出任第9号鱼雷艇艇长。1919年他自军中退役,后加入新组建的南斯拉夫王家海军,1921年再度以原军衔退役。南斯拉夫解体后,1941年4月10日克罗地亚独立国当局授予他海军少将军衔,任命其为克罗地亚海军首任司令。由于1941年罗马条约禁止克罗地亚独立国组建正规海军,他这一职务多流于名义,实际长期出任驻柏林军事代表,1942年11月起改任与党卫军第七欧根亲王志愿山地师的联络军官,直至1943年9月卸任海军司令一职。同月他改任克罗地亚驻保加利亚公使,常驻索非亚。1944年2月16日,他在索非亚任上因病突然去世,遗体归葬萨格勒布米罗戈伊公墓。"
 CBIO_CRO_joseph_francis_desc:0 "约瑟夫·弗朗茨·冯·哈布斯堡,1895年3月28日生于波希米亚布尔诺,是哈布斯堡家族匈牙利帕拉丁支系成员,其父约瑟夫·奥古斯特大公为匈牙利末代帕拉丁,1919年至1920年间一度被视为匈牙利王位的可能人选,他本人也因此被视为匈牙利潜在的王储。他出生时,母系曾外祖父弗朗茨·约瑟夫一世皇帝尚在位。1924年他迎娶萨克森王国末代国王弗里德里希·奥古斯特三世之女安娜公主,育有八名子女。他曾为作曲家埃乌根·扎多尔1939年歌剧作品撰写剧本。他终身以哈布斯堡家族大公身份活动,未登临任何王位。1957年9月25日,他在葡萄牙卡尔卡维洛什去世,遗体归葬布达佩斯帕拉丁墓室。"
 CBIO_CRO_miroslav_navratil_desc:0 "米罗斯拉夫·弗里德里希·纳夫拉蒂尔,1893年7月19日生于萨拉热窝,在当地读完中学后入格拉茨士官学校。一战期间他先在奥匈陆军服役,后转入奥匈皇家航空队任战斗机飞行员,在东线与意大利战线共取得十次空战胜利。战后他加入塞尔维亚人克罗地亚人斯洛文尼亚人王国空军,官至上校,1940年因与塞尔维亚裔军官矛盾被强制退役。1941年克罗地亚独立国成立后,他重返现役,一度出任克罗地亚空军总指挥,旋即调任驻布加勒斯特军事代表。1943年9月他晋升上将并出任武装部队部长兼总司令,任内曾随外交部长佩里奇会晤希特勒,后因不满政权暴行于1944年1月遭解职,转任驻罗马尼亚大使,同年十月退役。他随后前往维也纳,战争结束后移居泽尔阿姆湖,1946年被美军寻获,同年十二月被引渡至南斯拉夫。在萨格勒布,他以战犯罪被判处死刑。1947年6月7日,他被处决。"
 CBIO_CRO_nikola_mandic_desc:0 "尼古拉·曼蒂克,1869年1月20日生于奥斯曼波斯尼亚特拉夫尼克一个波斯尼亚克罗地亚人家庭,在萨拉热窝读完中学后赴维也纳大学攻读法律,1894年获博士学位。他返回萨拉热窝先后任司法书记员、律师,二十世纪初成为波斯尼亚最具影响力的克罗地亚政治家之一,1907年参与创建克罗地亚人民联盟。1908年奥匈帝国正式吞并波黑,他表示支持,1910年当选波黑议会议员,1911年任议长,并受弗朗茨·约瑟夫皇帝敕命出任波黑副总督。一战后波黑并入塞尔维亚人克罗地亚人斯洛文尼亚人王国,他退出一线政治,以执业律师身份出任萨拉热窝律师公会会长直至1943年。1943年9月2日,克罗地亚独立国元首帕韦利奇任命年届七旬的他出任总理,此举引发部分强硬派不满。任内他与克罗地亚农民党就联合政府问题展开磋商,并于1944年随外交部长佩里奇会晤希特勒。1945年5月他随政府撤往奥地利,向英军投降后遭移交南斯拉夫游击队,以战犯罪名受审。1945年6月7日,他被处决。"
 CBIO_CRO_slavko_kvaternik_desc:0 "斯拉夫克·卡瓦特尼克,1878年8月25日生于克罗地亚-斯拉沃尼亚王国莫拉维采,毕业于军事学院后加入奥匈军队,一战期间任博罗耶维奇元帅副官并获德国一级铁十字勋章。奥匈帝国解体后,他效力于斯洛文尼亚人克罗地亚人塞尔维亚人国民议会,1918年底率部在默吉穆列地区击退匈牙利军队,后转入南斯拉夫王家军队服役至1921年。1929年他参与在意大利创建乌斯塔沙运动。1941年4月10日,德军进入萨格勒布当日,他代表乌斯塔沙宣布成立克罗地亚独立国,并出任武装部队总司令,获授沃伊斯科沃达(元帅)军衔,成为帕韦利奇之下地位最高的多格拉夫尼克。他一手创建克罗地亚国民卫队与乌斯塔沙民兵,对塞尔维亚人、犹太人和罗姆人的大规模屠杀及雅塞诺瓦茨集中营的设立负有直接责任。其妻奥尔加出身已改宗天主教的犹太裔家庭,1941年8月自杀身亡。1943年1月他与帕韦利奇矛盾激化后被解除职务,退居奥地利。战后他被美军俘获并引渡南斯拉夫,以战犯罪受审判处死刑。1947年6月7日,他在萨格勒布被绞死。"
 CBIO_CRO_vladko_macek_desc:0 "弗拉德科·马切克,1879年6月20日生于萨格勒布附近库皮内茨,毕业于萨格勒布大学法学院,一战期间在奥匈军队服役并受伤。战后他成为克罗地亚农民党领袖斯捷潘·拉迪奇的亲密盟友,1925年一度因该党加入共产国际农民会而被捕入狱,狱中当选国民议会议员。1928年拉迪奇遇刺身亡后,他接任党魁,成为反对亚历山大一世中央集权统治的核心人物,1933年再度被捕并判处三年徒刑,1934年国王遇刺后获释。他主张将南斯拉夫改造为承认克罗地亚地位的联邦国家,1939年8月与首相茨维特科维奇达成协议,建立克罗地亚自治省,自己出任南斯拉夫副首相。1941年轴心国入侵南斯拉夫后,自治省随之瓦解,德国一度属意由他出任克罗地亚独立国元首,他两次拒绝,转而呼吁民众与新政权合作,自己则遭软禁。1945年战争结束前夕,他辗转流亡法国、美国。此后他协助创立国际农民联盟,晚年拒绝出任克罗地亚流亡团体领袖。1964年5月15日,他在华盛顿因心脏病去世。"
 CBIO_GEO_george_bagration_desc:0 "吉奥尔基·巴格拉季昂-穆赫拉涅利,1884年7月28日生于圣彼得堡,出身格鲁吉亚巴格拉季昂王朝旁支穆赫拉尼公爵世家,毕业于贵胄军官学校。1908年他迎娶波兰与格鲁吉亚混血贵族叶莲娜·兹沃特尼茨卡。俄国十月革命后,他拥护格鲁吉亚独立,在俄国内战期间与布尔什维克作战。1921年格鲁吉亚苏维埃化后,他选择留在国内而未随家人流亡,1930年一度被苏联当局逮捕,经俄国作家马克西姆·高尔基斡旋后获释,随后离开苏联与欧洲的家人团聚。1944年他最终定居西班牙。其女列奥尼达后嫁予俄国罗曼诺夫皇位觊觎者弗拉基米尔·基里洛维奇大公。1957年9月29日,他在马德里去世。"
 CBIO_GEO_giorgi_kvinitadze_desc:0 "乔治·克维尼塔德泽,本姓奇科瓦尼,1874年8月21日生于俄军上校之家,1894年毕业于圣彼得堡康斯坦丁军校,后参加日俄战争,1910年毕业于总参军事学院。第一次世界大战期间他升至上校,任高加索步兵师参谋长。俄国革命后,他先出任外高加索联邦政府副陆军部长,1918年格鲁吉亚独立后任格鲁吉亚陆军总司令,后因与孟什维克领导层意见不合辞职,同年转任对亚美尼亚作战参谋长。1919年他指挥格鲁吉亚军队平定阿哈尔齐赫地区伊斯兰教徒叛乱,攻占原属土耳其的阿尔特温市,并创办第比利斯陆军军官学校出任校长。1920年5月布尔什维克策动政变时,他再度出任总司令,率军校学员击退进攻,1921年苏俄红军大举入侵时三度临危受命统军抵抗,终因寡不敌众战败。此后他流亡法国,先后在百代唱片公司当职员、自营酸奶作坊维生,晚年撰写回忆录记述格鲁吉亚独立岁月。1970年8月7日,他在巴黎近郊沙图去世,葬于勒维尔苏尔奥尔日格鲁吉亚侨民墓地,2013年被追授格鲁吉亚国家英雄称号,2021年遗骨迁葬第比利斯姆塔茨明达先贤祠。"
 CBIO_GEO_grigol_robakidze_desc:0 "格里戈尔·罗巴基泽,1880年10月28日生于伊梅列季斯维里村,毕业于库塔伊西古典中学后赴爱沙尼亚塔尔图大学、德国莱比锡大学深造。1908年回国后逐渐成为格鲁吉亚青年象征主义文学的领军人物,1915年创立并领导\"蓝角\"诗人团体。1917年他参与创建格鲁吉亚作家协会,1919年作为格鲁吉亚民主共和国代表团执行秘书出席巴黎和会。1921年苏维埃化后他留在国内,以反苏立场知名,其代表剧作拉玛拉1930年由名导演阿赫梅特利搬上舞台,在莫斯科戏剧奥林匹克获奖,但同年他即借赴德监督译作之机叛逃德国,此后该剧仍被继续上演却隐去其名。作为流亡者,他在德国生活至1945年,期间参与创建格鲁吉亚独立委员会(1941年)及格鲁吉亚传统主义者联盟(1942年,与沙尔瓦·马格拉凯利泽等人共同发起),战后所著两部论墨索里尼与希特勒的著作被认为带有亲纳粹倾向,遭部分格鲁吉亚流亡人士否认。1945年后移居瑞士。1962年11月19日,他在日内瓦郁郁而终,后迁葬法国勒维尔苏尔奥尔日格鲁吉亚侨民墓园。"
 CBIO_GEO_ioseb_jughashvili_desc:0 "约瑟夫·朱加什维利,本名约瑟布·别萨里奥尼斯泽·朱加什维利,1878年12月18日生于格鲁吉亚哥里城一个鞋匠家庭,父亲别萨里翁酗酒成性,常年家暴,母亲叶卡捷琳娜靠洗衣帮佣维持生计,望子成为神父。他自幼罹患天花留下麻脸,又因马车事故导致左臂终生残疾,但在哥里教会学校成绩优异,并显露绘画与诗歌才华。1894年他凭奖学金入读第比利斯东正教神学院,期间以笔名索塞洛在格鲁吉亚报刊伊维利亚上发表诗作,获民族诗人伊利亚·查夫查瓦泽赏识刊出。神学院内他接触马克思主义读物,加入格鲁吉亚早期马克思主义团体美萨美达西,逐渐走上革命道路,1899年因从事马克思主义宣传被神学院开除。此后他在第比利斯天文台短暂任职,全身投入高加索地区的地下革命活动,组织巴统、第比利斯等地罢工,期间取化名科巴(取自格鲁吉亚作家卡兹别吉小说中的绿林好汉)。1901年后他屡遭沙俄当局逮捕流放西伯利亚,又多次潜逃。1903年俄国社会民主工党分裂后他倒向列宁一方的布尔什维克。1907年他策划第比利斯银行押运车劫案为布尔什维克筹措经费,此役造成数十人死伤。此后他逐步进入全俄革命运动核心层,1912年列宁将其增补入布尔什维克中央委员会,并开始使用斯大林(意为钢铁之人)这一笔名。1917年十月革命后,他凭借在高加索的地下革命资历跻身布尔什维克党核心,此后历任要职直至成为苏联最高领导人,长期主导苏联内政外交与二战东线战局。1953年3月5日,他在莫斯科郊外孔策沃逝世。"
 CBIO_GEO_kandid_charkviani_desc:0 "卡基德·查克维尼,1907年2月12日生于格鲁吉亚列奇胡米地区察格里,毕业于库塔伊西中学与第比利斯工程学院,早年在多家格鲁吉亚报刊任记者。他先后出任格鲁吉亚共产党中央委员会教育文化部部长、格鲁吉亚作家协会第一书记,任内主持了十二世纪诗人鲁斯塔维利史诗骑士与虎皮问世七百五十年纪念活动。1938年8月31日,年仅三十二岁的他在斯大林亲自属意下当选格鲁吉亚共产党中央委员会第一书记,此举起初遭贝利亚不满,但因斯大林力挺而未能阻止。任内他致力于经济建设,著有葡萄酒酿造、电力工业等领域研究论文四十余篇,并将海涅、歌德等德语诗作译成格鲁吉亚语。1952年明格列尔案件爆发,他被指控未能及时侦破党内所谓民族主义反革命集团,同年四月遭降职,调往莫斯科中央委员会任闲职,1953年至1958年在塔什干管理一家建筑企业。此后他逐渐淡出政坛。1994年9月13日,他在第比利斯去世。"
 CBIO_GEO_noe_zhordania_desc:0 "诺伊·佐达尼亚,1868年1月14日生于西格鲁吉亚古里亚地区一个小地主家庭,毕业于第比利斯东正教神学院后赴华沙兽医学院求学,在当地接触马克思主义思想,1892年参与创立格鲁吉亚早期马克思主义团体美萨美达西(第三代)。1905年他率格鲁吉亚社会民主党人转投孟什维克阵营,此后长期主导格鲁吉亚社会民主运动。1917年二月革命后他出任第比利斯苏维埃主席,1918年5月26日主持通过格鲁吉亚民主共和国独立宣言,同年7月24日出任政府首脑。任内他推行土地改革及各项社会立法,使格鲁吉亚成为外高加索唯一获得苏俄及西方大国法理承认的国家,并创立第比利斯国立大学。1921年2月苏俄红军入侵格鲁吉亚,他的政府战败后流亡法国,在巴黎近郊勒维尔庄园继续领导格鲁吉亚流亡政府,1924年策动的反苏起义遭血腥镇压后仍矢志不渝。1953年1月11日,他在巴黎去世。"
 CBIO_GEO_shalva_maglakelidze_desc:0 "沙尔瓦·马格拉凯利泽,1893年生于格鲁吉亚,早年就读库塔伊西中学,后获柏林大学法学博士学位。第一次世界大战期间他在俄军服役,俄国革命后投身格鲁吉亚独立事业,是1918至1921年格鲁吉亚民主共和国的高级官员。苏俄红军入侵后他流亡欧洲,先定居拉脱维亚里加,协调高加索流亡群体与流亡政府联系,1929年与同胞什万吉拉泽创立伊维利亚社,后更名高加索协会援助流亡同胞;1934年移居法国,1938年定居德国,与德国驻高加索代表舒伦堡过从甚密,二人皆主张以德国王子约阿希姆取代格鲁吉亚社会民主政府建立君主立宪制,并一度游说拥立格鲁吉亚流亡贵族伊拉克利·巴格拉季昂出任在柏林的格鲁吉亚民族委员会主席、作为复辟君主人选。1942年他协助创立白乔治及格鲁吉亚传统主义者联盟,同年出任德军格鲁吉亚军团上校指挥官,因抗议将格鲁吉亚营调去镇压欧洲各地抵抗运动、坚持只应用于对苏作战,1943年10月被迫辞职,遭以借口调往波罗的海德军部队。战后他先居意大利,1950年返回西德,出任阿登纳的军事顾问,1954年在慕尼黑创立海外格鲁吉亚军人联盟,同年八月遭苏联特工从西德绑架,经短暂关押后获准在苏联监视下返回格鲁吉亚定居行医执律。1976年,他在第比利斯去世。"
 CBIO_KOR_choe_hyon_desc:0 "崔贤,1907年5月6日生于中国吉林珲春一个朝鲜移民家庭,父亲崔化心早年曾参加洪范图部朝鲜独立军。1925年他被日方逮捕,在延吉狱中关押七年,1932年获释后投身抗日游击运动,加入东北抗日联军并成为中共党员,是满洲地区朝鲜族抗日武装的重要将领之一。1937年普天堡战斗实际由他指挥,后来在朝鲜官方叙事中这一战功被归于金日成,但两人在游击岁月里始终是至交。日军对其所部展开重点围剿后,他随部队退入苏联,编入苏联远东红旗军第88独立步兵旅。1945年朝鲜光复后,他与金日成、崔庸健等游击派骨干一致推举金日成为未来国家领袖,自己出任朝鲜人民军江界联队联队长等职。朝鲜战争期间,他执掌朝鲜人民军第二军团,战事失利后在敌后组织游击作战,为主力部队重整赢得时间。战后他历任要职,1968年至1976年出任人民武力部长,凭借与金日成的私交在多轮清洗中屹立不倒。1982年4月10日去世。"
 CBIO_KOR_jiro_minami_desc:0 "南次郎,1874年8月10日生于日本大分县日出町一个旧士族家庭,1895年毕业于日本陆军士官学校,历任骑兵军官,参加过日俄战争旅顺围城战。此后他历任要职,1931年出任陆军大臣,同年至1934年任军事参议官,1934年至1936年任关东军司令官兼驻满洲国大使。1936年二二六事件后被编入预备役,同年转任第八任朝鲜总督,任期至1942年。任内他推行较前任更强硬的殖民统治,废止此前部分自由化改革,只保留一家朝鲜语报纸、查禁其余,并大力推行创氏改名政策强迫朝鲜人改用日本姓名。卸任后他于1942年至1945年任枢密顾问官。战后远东国际军事法庭以其在殖民统治及战争政策中的责任判处终身监禁。1955年12月5日,他在服刑期间去世。"
 CBIO_KOR_kim_il_sung_desc:0 "金日成,本名金成柱,1912年4月15日生于平壤附近万景台一个贫苦家庭,幼年随父母迁居中国东北躲避日本殖民统治。青年时期在满洲加入共产主义青年团,1929年因从事相关活动被捕入狱。出狱后他投身抗日游击斗争,加入中国共产党领导的东北抗日联军,并借用早年一位传奇抗日义士之名改称金日成。1937年普天堡战斗后声名鹊起,后随部队退入苏联,编入苏联远东红旗军第88独立步兵旅接受整训。1945年日本投降后,他在苏联扶持下返回朝鲜北部,同年12月出任朝鲜共产党北朝鲜分局书记。1948年9月朝鲜民主主义人民共和国成立,他出任内阁首相,1949年兼任朝鲜劳动党委员长。1950年6月,他发动战争试图以武力统一朝鲜半岛,战事在美国主导的联合国军介入及中国志愿军参战后陷入僵持,1953年停战。此后他清除党内异己,巩固个人权力,推行主体思想路线,长期执掌朝鲜。1972年起任国家主席。1994年7月8日,他在平壤逝世。"
 CBIO_KOR_lyuh_woon_hyung_desc:0 "吕运亨,号梦阳,1886年5月25日生于朝鲜京畿道杨平一个两班家庭。青年时入读培材学堂接受西式教育,皈依基督教,后赴中国求学,先后在南京、上海活动,投身朝鲜独立运动。1919年他参与起草东京二八独立宣言,并作为创始成员之一参与成立大韩民国临时政府,在议政院任职。二十年代他一度加入高丽共产党,出席莫斯科远东劳苦者代表大会,并在担任《朝鲜中央日报》社长期间,因该报刊登孙基祯获柏林奥运会金牌照片时抹去其运动服上的日本国旗而遭日方查封报社、本人被捕。1944年他秘密组织建国同盟,筹备日本战败后的接管工作。1945年8月日本投降后,他随即成立朝鲜建国准备委员会,九月宣布建立朝鲜人民共和国并任主席,但未获美国军政府承认。同年十月他改组朝鲜人民党并任党魁,此后力图在左右两派之间维持中间路线,推动南北统一与美苏共同委员会协商,但屡遭左右两翼夹击。1947年7月19日,他在首尔惠化洞被一名十九岁右翼分子韩智根枪杀身亡。"
 CBIO_KOR_pak_hon_yong_desc:0 "朴宪永,号德永,1900年5月28日生于朝鲜忠清南道礼山一个两班家族的庶出子弟,1919年三一运动后投身独立与共产主义运动。1921年他加入上海高丽共产党(伊尔库茨克派)朝鲜共产党分部,任高丽共产青年会书记,1922年参加共产国际远东劳苦者代表大会后回国被捕。1925年他参与创建朝鲜共产党,此后长期从事地下活动,1926年受审时佯装精神失常以求脱罪,获释后经满洲逃往苏联,入列宁国际学校深造,1940年潜回朝鲜继续从事地下抵抗。1945年日本投降后,他重建朝鲜共产党并任书记,后因美军政府打压率部南下受阻,1946年组织南朝鲜劳动党并任副委员长之一。1948年4月他与金九、金奎植一同北上参加南北协商,此后留在北方,同年九月出任朝鲜民主主义人民共和国副首相兼外务相,后又任朝鲜劳动党副委员长。朝鲜战争停战后,他于1953年8月因南方派系问题遭金日成清洗,以美国间谍罪名被捕,1955年12月15日被判处死刑,同年内处决。"
 CBIO_KOR_yi_kang_desc:0 "李堈,号义亲王,1877年3月30日生于汉城,是朝鲜高宗与宫女张氏所生第五子。1900年被封为义亲王。1895年起他曾作为特命全权大使出访英、德、法、俄、意、奥匈等国,后又赴日本、美国游历,1901年入读美国罗诺克学院攻读数学。因生母出身低微且本人声名不佳,高宗禅位、纯宗继位时储君之位由异母弟李垠承袭。1910年日韩合并后,他对处境日益不满,曾多次尝试逃往上海投奔大韩民国临时政府,均在满洲一带被日方截获遣返。三一运动期间,他以朝鲜代表身份参与其中。此后他被日方严密监视,活动受限,晚年皈依天主教,以此为其祖先兴宣大院君迫害天主教徒之举忏悔。1955年8月15日,他在首尔去世。"
 CBIO_KOR_yi_un_desc:0 "李垠,号英亲王,1897年10月20日生于汉城德寿宫,是朝鲜高宗第七子。1907年纯宗继位后,他越过兄长李堈被立为皇太子,同年底在伊藤博文安排下被送往日本就读学习院,此后长期滞留日本。他先后就读日本陆军中央幼年学校、陆军士官学校,1920年与日本梨本宫守正王之女方子结婚,1926年纯宗去世后承袭王位称号,史称昌德宫李王。他在日本陆军历任要职,累升至中将,曾任驻华日军指挥官,1945年出任最高战争指导会议成员。日本战败后,他的王族身份于1947年被美国占领当局废除,同年沦为无国籍人士,后取得日本国籍。李承晚就任韩国总统后长期拒绝其回国请求,他遂滞留日本,1959年一度中风。1963年他终获准返回韩国,晚年居于昌德宫乐善斋。1970年5月1日,他在首尔去世。"
 CBIO_KUR_ahmed_barzani_desc:0 "艾哈迈德·巴尔扎尼,又称库丹,1896年生于伊拉克库尔德斯坦巴尔赞,出身纳格什班迪教团谢赫世家,是巴尔赞部落的宗教与部落双重领袖,也是穆斯塔法·巴尔扎尼的兄长。他一度信奉带有异端色彩的教义,曾与亚述人发生冲突,后又与相邻部落首领因宗教纠纷结怨,引发伊拉克当局武力介入。他同情库尔德流亡组织霍伊布纳,曾接纳投奔巴尔赞的科尔·侯赛因帕夏等库尔德难民,土耳其方面亦怀疑他暗中支持阿拉拉特起义。1931年,巴尔赞部落与巴格达当局爆发大规模冲突,英国出动飞机助阵伊拉克军队轰炸重创部落武装,他于1932年6月在土耳其边境地带向土方投降,其弟穆斯塔法则率部又坚持作战一年后方奉兄命向伊拉克投降。此后他历经流放,直到1958年伊拉克七月革命后方获释。晚年他重新皈依正统伊斯兰教。1969年1月11日去世,以穆斯林葬礼下葬。"
 CBIO_KUR_ferzende_bege_haseni_desc:0 "费尔曾德·贝格·赫塞尼,库尔德海塞南部落人,1889年生于凡省埃尔吉什(一说生于埃尔祖鲁姆省希纳斯),父名艾哈迈德,母名阿西耶。1925年谢赫赛义德起义期间,他率部在马拉兹吉尔特一带作战,起义失败后率约一百五十人退入波斯境内,因拒绝波斯当局缴械要求,双方爆发冲突,他本人在交火中负伤,其父苏莱曼·艾哈迈德等多名亲属阵亡。1927年他返回土耳其,加入阿拉拉特起义,参与多次战斗与破袭行动,1930年在塔什布伦附近的战斗中负伤。起义失败后,他再次退入波斯。1931年马库附近库尔德人与波斯军队再度爆发激烈冲突,波斯一名上校在交战中阵亡,他随后被波斯保安部队逮捕入狱。1939年,他在波斯狱中去世,一说系遭投毒所害。"
 CBIO_KUR_haji_baba_desc:0 "哈吉·巴巴,通称哈吉·巴巴谢赫,十九世纪末生于马哈巴德,是当地颇具声望的部族与宗教领袖。1946年卡齐·穆罕默德宣布成立库尔德斯坦共和国(马哈巴德共和国)后,委任他出任共和国总理,库尔德诗人、记者赫敏·穆克里亚尼曾任其秘书。同年底伊朗军队攻陷马哈巴德,共和国覆灭,卡齐·穆罕默德等人遭处决,他则因宗教身份特殊而幸免于难。他的经历后来常被库尔德民族主义者引作马哈巴德共和国尝试将传统宗教与部族权威纳入现代政治架构的例证。"
 CBIO_KUR_ihsan_nuri_desc:0 "伊赫桑·努里帕夏,1892年生于比特利斯(一说1893年),出身杰拉利部落吉卜兰支系,早年就读比特利斯戈克梅丹清真寺附属小学,后入埃尔津詹军校,毕业于奥斯曼军事学院,1910年获少尉军衔进入奥斯曼军队,曾在阿尔巴尼亚参与镇压行动,又赴也门服役近三年,第一次世界大战期间在高加索前线负伤。奥斯曼帝国崩溃后,他一度效力于新生的土耳其共和国军队,后转向库尔德民族运动,1925年谢赫赛义德起义爆发时他身在波斯避难未能领兵参与,但此前已在军中策动过反叛行动。1927年,库尔德流亡组织霍伊布纳授予他帕夏军衔,任命他为库尔德民族军总司令;同年十月他在阿拉拉特山地区宣布库尔德独立,建立阿拉拉特共和国。此后三年间他指挥游击部队据守阿拉拉特山周边,一度控制凡湖沿岸大片乡村。1930年夏,土耳其空军对库尔德阵地展开持续轰炸,叛军士气瓦解,起义归于失败,他退入波斯避难。此后数十年他一直被限制活动于德黑兰,1960年获准移居乌尔米耶库尔德人聚居区,1962年曾赴西柏林出席库尔德语大会,期间与卡穆兰·阿里·拜德尔汗会面,并访问科隆与维也纳。1976年3月25日,在德黑兰去世。"
 CBIO_KUR_ishan_nuri_desc:0 "伊赫桑·努里帕夏,1892年生于比特利斯(一说1893年),出身杰拉利部落吉卜兰支系,早年就读比特利斯戈克梅丹清真寺附属小学,后入埃尔津詹军校,毕业于奥斯曼军事学院,1910年获少尉军衔进入奥斯曼军队,曾在阿尔巴尼亚参与镇压行动,又赴也门服役近三年,第一次世界大战期间在高加索前线负伤。奥斯曼帝国崩溃后,他一度效力于新生的土耳其共和国军队,后转向库尔德民族运动,1925年谢赫赛义德起义爆发时他身在波斯避难未能领兵参与,但此前已在军中策动过反叛行动。1927年,库尔德流亡组织霍伊布纳授予他帕夏军衔,任命他为库尔德民族军总司令;同年十月他在阿拉拉特山地区宣布库尔德独立,建立阿拉拉特共和国。此后三年间他指挥游击部队据守阿拉拉特山周边,一度控制凡湖沿岸大片乡村。1930年夏,土耳其空军对库尔德阵地展开持续轰炸,叛军士气瓦解,起义归于失败,他退入波斯避难。此后数十年他一直被限制活动于德黑兰,1960年获准移居乌尔米耶库尔德人聚居区,1962年曾赴西柏林出席库尔德语大会,期间与卡穆兰·阿里·拜德尔汗会面,并访问科隆与维也纳。1976年3月25日,在德黑兰去世。"
 CBIO_KUR_kamuran_ali_bedirxan_desc:0 "卡穆兰·阿里·拜德尔汗,1895年8月21日生于伊斯坦布尔,出身世代统治博坦公国的库尔德拜德尔汗家族,祖父拜德尔汗贝格十九世纪中叶曾起兵反抗奥斯曼未果,举家被流放。其父艾敏·阿里·拜德尔汗是库尔德复兴会创始人之一,兄长杰拉代特·阿里·拜德尔汗后来创制库尔德库尔曼吉语拉丁字母。1919年他随英国军官爱德华·诺埃尔在伊拉克一带活动,试图评估建立库尔德国家的可能。土耳其共和国成立后他被凯末尔政权缺席判处死刑,遂赴德国,先后在慕尼黑大学、莱比锡大学攻读法律。1927年他定居叙利亚,在贝鲁特执业律师,加入库尔德民族组织霍伊布纳,协助兄长编辑库尔德文刊物《呼声》。1942年至1946年,他在贝鲁特黎凡特电台主持库尔德语广播节目,并创办库尔德语与法语双语刊物《新日》。1948年他移居巴黎,任巴黎东方语言学院库尔德语讲师。1960年起,他成为穆斯塔法·巴尔扎尼领导的伊拉克库尔德人在欧洲的代言人,并牵线库尔德与以色列建立联系。1962年他曾在西柏林与伊赫桑·努里帕夏会面。1970年退休。1978年12月6日,在巴黎去世。"
 CBIO_KUR_nuri_dersimi_desc:0 "努里·德西姆,又称拜塔尔·努里(意为兽医努里),1893年3月生于代尔西姆霍扎特附近的阿克普纳尔村。他在伊斯坦布尔攻读兽医,期间加入库尔德学生团体,1912年出任库尔德斯坦亲善会秘书长。第一次世界大战期间他作为随军兽医派驻东安纳托利亚,后转赴锡瓦斯任职,并参与协调科奇吉里起义与代尔西姆各部落的联络,因被视为该起义主要策动者之一被判处死刑,遂潜入代尔西姆,与赛义德·里扎结为挚交,教授当地人拉丁字母库尔德文。1931年获土耳其政府赦免,获准在霍尔文克定居务农,但仍长期受当局监视。1937年代尔西姆起义爆发,他参与其中,起义遭镇压后于当年九月经希腊辗转逃往叙利亚,此后终生流亡,先后旅居叙利亚、约旦、伊拉克等地,以行医为生,并撰写回忆录记述代尔西姆历史与库尔德民族斗争。1973年8月22日,在阿勒颇去世,葬于阿夫林。"
 CBIO_KUR_qazi_muhamad_desc:0 "卡齐·穆罕默德,1893年5月1日生于马哈巴德一个逊尼派库尔德士绅家庭,父亲谢赫赛义德·卡齐出身沙姆萨丁部落,是纳格什班迪教团谢赫。他自幼接受伊斯兰传统教育,后出任伊斯兰教法官,兼具宗教与司法双重身份。1945年他加入苏联支持的库尔德组织科马拉,不久成为该组织领导人。1946年1月22日,他在马哈巴德宣布成立库尔德斯坦共和国(通称马哈巴德共和国),出任总统,建立起内阁、议会与自己的军队佩什梅格,推行库尔德语教育与文化建设,同年四月与阿塞拜疆人民政府领导人皮舍瓦里签订互保协议。他主张的库尔德民族主义强调伊斯兰传统与部族权威并重,争取到不少宗教与部落领袖支持。1946年底苏联从伊朗撤军,失去外援的马哈巴德共和国迅速被伊朗中央军队攻陷,他于同年十二月被捕,押往乌鲁米耶受审。经过一场仓促的军事法庭审判,他与两名兄弟一同被判处死刑。1947年3月31日,他在马哈巴德恰尔恰拉广场被绞死,行刑前神情镇定,诵读古兰经文。"
 CBIO_KUR_seyid_riza_desc:0 "赛义德·里扎,阿列维库尔德人,约1863年生于代尔西姆奥瓦哲克地区利尔蒂克村,是海塞南部落首领赛义德·易卜拉欣第四子,依父亲遗命继承部落领导权。第一次世界大战期间,他曾率部随奥斯曼军队对抗占领代尔西姆的俄军。土耳其共和国成立后,代尔西姆长期游离于中央政府控制之外,1934年土耳其颁布移民安置法,1935年又通过通杰利法,将代尔西姆改设通杰利省并置于军事管制之下,当地阿列维库尔德人视之为强制同化,群起抵制。1937年诺鲁孜节期间,他号召各部起事,焚毁桥梁、袭击哨所,土耳其随即调集重兵并出动飞机轰炸镇压。同年九月,他应邀前往埃尔津詹与土方谈判和平,行至当地即遭逮捕,连同随行七十余人一并被押往埃拉泽。经过仓促审判,他与其子及数名同伴一并被判处死刑。临刑前,他留下那句后来广为传诵的话,称自己是卡尔巴拉的子孙,未做过任何错事。1937年11月15日夜,他在埃拉泽被绞死,遗体下落至今成谜。"
 CBIO_LIB_benjamin_o_davis_desc:0 "本杰明·奥利弗·戴维斯,1877年7月1日生于华盛顿哥伦比亚特区(一说1880年5月28日),美国陆军军官。1898年参加美西战争入伍,后转入第九骑兵团服役,1901年获少尉军衔。1909年至1911年任美国驻利比里亚军事专员,负责考察利比里亚军队并提出整训建议;他认为该国军队缺乏统一指挥且训练不足,曾建议由美国军官改组,未获采纳。利比里亚政府随后提出聘他入伍任职,美国战争部以他不能同时效力两国为由婉拒。此后他历任国民警卫队教官、军事科学教授等职,1940年晋升准将,成为美国陆军史上首位非裔将官。第二次世界大战期间,他任监察长特别助理,负责视察黑人部队并就种族政策提出建议,1943年随利比里亚总统巴克莱访美时任军事随员。战后他推动军队种族融合,1948年退役。1970年11月26日,他因白血病在伊利诺伊州大湖海军医院去世。"
 CBIO_LIB_edwin_barclay_desc:0 "埃德温·詹姆斯·巴克莱,1882年1月5日生于利比里亚蒙特塞拉多县布鲁尔维尔,祖辈是1865年由巴巴多斯迁居利比里亚的移民家庭。他毕业于利比里亚学院,先后从教、从政,1920年至1930年任查尔斯·D.B.金政府国务卿。1930年,金与副总统扬西因强制劳役丑闻遭国际联盟调查而辞职,巴克莱受命继任总统完成金的任期,1931年正式当选,此后连任至1944年。任内他废止1864年限制外商经营的港口开放法,与荷兰、丹麦、德国、波兰等国签订经济租让协定,1934年又在国联监督下推行财政重组以偿还对外债务。第二次世界大战期间,利比里亚出产的天然橡胶及战略位置对盟军至关重要,1942年与美国签订防务协定,罗伯茨机场随之扩建。1943年1月罗斯福访问利比里亚,同年5月巴克莱回访美国并在国会发表演说,成为首位以贵宾身份登上美国国会讲坛的黑人政治家。1944年1月,利比里亚正式对德意日宣战。他是真正辉格党人,青年时曾作利比里亚爱国歌曲孤星永存。1944年任满退休,由威廉·杜伯曼继任;1955年他再度参选总统,与杜伯曼较量落败,同年11月6日去世。"
 CBIO_LIB_john__r_fox_desc:0 "约翰·罗伯特·福克斯,1915年5月18日生于俄亥俄州辛辛那提。他就读俄亥俄州立大学,后转入威尔伯福斯大学参加预备役军官训练,1940年获少尉军衔,后编入黑人官兵组成的第366步兵团。1944年该团随第92步兵师调往意大利作战,福克斯作为加农炮连前进观察员,随第598野战炮兵营行动。同年12月25日夜,德军化装渗透进入索莫科洛尼亚镇,次日凌晨大批德军发起攻击,美军步兵撤离,福克斯与观察小组留守在一栋房屋二楼继续指挥炮火。他不断要求炮火向自己阵地方向逼近,营长提醒此举将危及其自身安全,福克斯回答阵地已被围,坚持呼叫最后一次校射,随后与观察小组一同阵亡,其阵地周围发现约百具德军尸体,他的行动为友军重整防线争取了时间。由于当时的种族因素,他生前未获应有表彰,1982年追授杰出服役十字勋章,1997年经调查确认存在种族歧视性遗漏后,克林顿总统将勋章追授为荣誉勋章,由其遗孀代领。"
 CBIO_LIB_won_loy_chan_desc:0 "陈云罗,英文名温洛伊·陈,美国俄勒冈州华裔移民家庭出身,毕业于斯坦福大学。第二次世界大战期间,他因通晓日语被征召入伍,派往中国缅甸印度战区,在约瑟夫·史迪威将军麾下担任作战情报军官,负责审讯日军战俘、搜集敌情。由于中国士兵普遍痛恨日军、常将俘虏就地处决,审讯工作推进十分困难;加之他与两名日裔美军同事外貌与日军相近,在前线活动时屡次被中美双方误认为日本特工,处境颇为微妙。战后他继续在军中服役,长期从事情报工作,1968年以上校军衔退役。1986年他出版回忆录《缅甸:未被讲述的故事》,记述这段战时经历。"
 CBIO_MAL_ibrahim_hj_yaacob_desc:0 "依布拉欣·耶谷,1911年生于彭亨州淡马鲁一个武吉士人后裔家庭,曾任新闻记者,1938年创立青年马来人联盟,主张建立涵盖马来亚与荷属东印度的大马来由联邦,反对英国殖民统治,深受苏加诺民族主义思想影响。1940至41年间他游历马来亚半岛考察马来人社会经济状况,撰写见我的祖国一书批评英国殖民政策。1941年12月他因民族主义活动被英方逮捕,1942年2月日军占领后获释,随即率青年马来人联盟代表团求见日军将领藤原岩市寻求合作。1942年该联盟改组的义勇军由他出任中校司令,同年该联盟本身遭日方以激进为由取缔,他改任马来事务顾问,继续暗中扩充军事力量。1945年5月他创立特别人民力量组织,筹划日本投降后的抵抗行动,8月12至13日在太平与苏加诺、哈达会晤,提议马来亚并入印度尼西亚,但日本投降后该计划因局势混乱而搁浅。1945年8月19日,为躲避英方以通敌罪逮捕,他乘日机出逃雅加达,此后化名伊斯坎达尔·卡梅尔·阿加斯提亚定居印度尼西亚,终生倡导马来-印尼统一。1979年3月8日,他在雅加达去世。"
 CBIO_MAL_lai_teck_desc:0 "莱特,真名范文达(一说黄亚岳),1901年(一说1903年)生于法属印度支那巴地,越南与华裔混血。青年时加入胡志明领导的印度支那共产党,二十二岁时被法国当局逮捕,为求自保转而充当法国情报机关的线人,自此开启其反复变节的谍报生涯。二十年代末三十年代初他辗转苏联、中国活动,据信曾赴莫斯科接受培训,因谙熟共产主义理论而在同志中赢得马来亚的列宁之名。1934年他经香港抵达新加坡,自称受中共派遣协助马来亚共产党,实为受英国新加坡特别调查科策反打入该党,凭借向英方告发对手而在党内平步青云,1939年4月当选马来亚共产党总书记。他主导该党在二战初期采取对英不对抗路线。新加坡沦陷前夕他未及撤离,1942年3月初被日军宪兵队逮捕,随即转投日方充当密探。1942年9月1日,他向日方通报马共及马来亚人民抗日军领导层在蝙蝠洞举行秘密会议的时间地点,导致该次会议遭日军突袭,几乎全歼马共高层。战后他一度促成马来亚人民抗日军于1945年12月正式解散,但其通敌行径逐渐败露,1947年2月他被传唤到党中央委员会说明,竟携带绝大部分党内经费潜逃。继任总书记陈平随即展开追捕,1947年,他在曼谷被泰国共产党人抓获处决,尸体被弃入河中。"
 CBIO_MAL_onn_jaafar_desc:0 "翁·嘉化,1895年2月12日生于柔佛武吉甘蜀,母亲是被献予柔佛苏丹宫廷的土耳其切尔克斯人。其父加法尔·穆罕默德曾任柔佛首席部长,他自幼与柔佛王室关系密切,一度被苏丹易卜拉欣视同养子。1904年至1910年他赴英国奥尔德堡洛奇学校就读,后入马来学院深造以加强马来语能力。归国后他投身新闻界,主编叻报及马来亚新闻报,因撰文批评苏丹施政一度遭放逐新加坡,后获赦返回柔佛,在地方政府任职至新山县长。1946年英国提出马来亚联邦方案,拟削弱各州苏丹主权并赋予各族平等公民权,他认为此举将导致马来民族灭绝,遂发起反对运动,同年五月创立巫统并任首任主席,成为反对马来亚联邦运动的旗帜人物,迫使英方收回该方案,代之以联邦制的马来亚联合邦。1947年至1950年他出任柔佛州务大臣,任内创立农村工业发展局改善马来人生计。1951年他因主张巫统向各族开放会籍未获采纳而辞去主席职务,另组马来亚独立党,后又创建国家党,均未能撼动东姑阿都拉曼领导的联盟党。1962年1月19日,他在新山综合医院去世。"
 CBIO_SAU_faisal_al_saud_desc:0 "费萨尔·本·阿卜杜勒阿齐兹·阿勒沙特,1906年4月15日生于利雅得,是沙特阿拉伯开国君主阿卜杜勒阿齐兹(伊本·沙特)的第三子,母亲塔尔法出自以宗教学者辈出著称的谢赫家族。他自幼被父亲委以军政重任:1919年年仅十三岁便代父出使伦敦,成为首位访问英国的沙特王室成员;1922年率约六千兵力进军阿西尔,年底完全控制该地。1926年父亲攻取汉志后,他出任汉志总督,1930年起兼任沙特首任外交大臣,长期主管王国外交。1932年9月23日,他在麦加代父宣读将汉志与内志合并为沙特阿拉伯王国的敕令。1934年他统率一路大军参加沙特与也门的战争,取得决定性胜利,促成塔伊夫条约的签订。1943年他应罗斯福之邀访问美国,成为沙美早期接触之一。其父晚年曾属意由他继位。1953年父亲去世后,他被立为王储兼外交大臣,1964年即位为沙特国王。1975年3月25日在利雅得被侄子费萨尔·本·穆萨伊德开枪刺杀身亡。"
 CBIO_SAU_faisal_saud_desc:0 "费萨尔·本·阿卜杜勒阿齐兹·阿勒沙特,1906年4月15日生于利雅得,是沙特阿拉伯开国君主阿卜杜勒阿齐兹(伊本·沙特)的第三子,母亲塔尔法出自以宗教学者辈出著称的谢赫家族。他自幼被父亲委以军政重任:1919年年仅十三岁便代父出使伦敦,成为首位访问英国的沙特王室成员;1922年率约六千兵力进军阿西尔,年底完全控制该地。1926年父亲攻取汉志后,他出任汉志总督,1930年起兼任沙特首任外交大臣,长期主管王国外交。1932年9月23日,他在麦加代父宣读将汉志与内志合并为沙特阿拉伯王国的敕令。1934年他统率一路大军参加沙特与也门的战争,取得决定性胜利,促成塔伊夫条约的签订。1943年他应罗斯福之邀访问美国,成为沙美早期接触之一。其父晚年曾属意由他继位。1953年父亲去世后,他被立为王储兼外交大臣,1964年即位为沙特国王。1975年3月25日在利雅得被侄子费萨尔·本·穆萨伊德开枪刺杀身亡。"
 CBIO_SAU_saud_al_saud_desc:0 "沙特·本·阿卜杜勒阿齐兹·阿勒沙特,1902年1月15日生于科威特城,当时其家族正流亡此地,是沙特阿拉伯开国君主阿卜杜勒阿齐兹(伊本·沙特)的次子。兄长图尔基1919年死于流感大流行,他遂成为父亲的继承人选。他自幼随父征战,是伊本·沙特统一阿拉伯半岛过程中的重要将领,1921年率军进攻哈伊勒,1929年参与在萨比拉战役中平定伊赫万叛乱。1926年起他出任内志总督,1933年5月11日被立为王储。1934年沙特与也门开战,他统率一路大军攻取奈季兰、深入也门山地。他还多次代表父亲出访，1937年曾赴伦敦出席乔治六世加冕典礼。1953年父亲去世后他即位为沙特第二任国王,确立国王主持大臣会议的惯例,1961年率沙特加入不结盟运动。因未能扭转财政困局,他与异母弟、王储费萨尔陷入权力之争,1964年11月被迫退位,此后流亡海外,曾在部分王子支持下试图夺回王位未果。1969年2月23日在希腊雅典因心脏病去世。"
 CBIO_TAN_homushku_churguj_ool_desc:0 "库哈穆西库拉·朱维古·乌奥,1918年5月10日生于洪德伦村一个牧民家庭,六年制学校毕业后在集体农庄放牧。1936年他应征加入图瓦人民革命军,在军中加入图瓦人民革命党;退伍后曾任司机,1941年获图瓦小呼拉尔颁发的荣誉证书。同年6月苏德战争爆发,图瓦随即参战,他申请奔赴前线,1943年5月作为图瓦首批志愿者之一奔赴苏联,先在高尔基市接受装甲兵训练。1944年2月他被编入第25独立坦克团,隶属乌克兰第2方面军第52集团军。同年3月,在第聂伯河-喀尔巴阡战役中,他驾驶的坦克在切尔卡瑟州雷占诺夫卡与科比利亚基村附近突破德军防线,以火力和履带摧毁德军火力点与有生力量,因功获苏联英雄称号,成为首位获此殊荣的图瓦人。战后他返回图瓦,投身青年爱国教育工作,1948年转入预备役,后当选苏联最高苏维埃代表。1978年7月10日去世。"
 CBIO_TAN_kechir_ool_desc:0 "克其尔·乌尔出身图瓦一个牧民家庭,早年习得文字后曾任教员,后毕业于以布琼尼命名的坦波夫学校,回国后负责图瓦人民革命军士兵及初级指挥员的培训教育工作,先后获图瓦人民共和国勋章、红旗勋章与列宁勋章。1944年图瓦并入苏联后,图瓦人民革命军改编为红旗西伯利亚军区第7独立骑兵团,他随即在该团继续服役。1945年7月10日,他因故去世,葬于克孜勒旧公墓。1990年5月5日,苏联最高苏维埃主席团追授其苏联英雄称号,以表彰他在苏联卫国战争中表现出的英勇。克孜勒一条主要街道及一所中学均以他命名,故乡还立有其半身像。"
 CBIO_TAN_salchak_toka_desc:0 "萨尔查克·卡尔巴克霍列科维奇·托卡,1901年12月15日生于唐努图瓦卡阿赫姆地区一个牧民家庭,曾赴莫斯科东方劳动者共产主义大学学习。1929年,苏联支持的政变推翻了信奉藏传佛教、亲蒙古路线的棟杜克·库拉尔政府,托卡作为特派全权代表之一被派往图瓦。1932年3月,他接替棟杜克出任图瓦人民革命党中央总书记,棟杜克随后被处决,托卡自此成为图瓦人民共和国的实际统治者。他推行苏联式集体化政策,没收游牧民牲畜,取缔藏传佛教与萨满教寺庙,并在国内树立起个人崇拜,凭借文学作品屡获苏联奖项。1940年,他与图瓦小呼拉尔主席凯尔捷克·安奇玛结婚。1944年,他主导图瓦并入苏联,同年10月正式生效,图瓦人民共和国改制为俄罗斯联邦图瓦自治州,他相应改任苏共图瓦州委第一书记,继续执掌该地区直至去世。1973年5月11日去世。"
 CBIO_TAN_sodmon_balchor_desc:0 "索德蒙·巴尔秋,通译奥云·索德南-巴尔秋,出身图瓦奥云旗贵族世家,是唐努乌梁海末代安班诺颜(总管)。他承袭前任安班诺颜贡布多尔济,自1916年起以总管(Bugude-darga)身份统辖图瓦诸旗,持有\"衮\"的王公封号,是清末至俄国保护国交替之际图瓦名义上的最高统治者。俄国在图瓦设立保护国期间,他不满沙俄委员对安班诺颜制度的轻慢,转而亲近蒙古,一度接受蒙古方面授予的贵族封号。1921年8月,全图瓦立宪大呼拉尔在苏格巴日村召开,宣告成立独立的唐努图瓦人民共和国,他作为旧贵族代表进入首届政府并被推举为政府首脑。此后他仍在二十年代图瓦党政高层任职,1927年至1929年间出任图瓦人民革命党第一书记,是图瓦由旧式王公制向苏联式人民共和国过渡时期的关键人物之一。"
 CBIO_TAN_tanchak_shoma_desc:0 "坦察·绍马,全名谢苗·达尼洛维奇·绍马,1955年前使用格森·鲍里索维奇·绍马之名,族名库拉尔,1903年10月16日生于唐努乌梁海哲恩-赫姆奇克旗巴彦-塔拉一带,是图瓦人民共和国首位本民族将军。他生父是一名早逝的华人商人,幼年由一户哈卡斯人家抚养,乳名\"谢玛\",图瓦语读作\"绍马\",后被他用作姓氏。1925年他加入图瓦阿拉特红军(后改称图瓦人民革命军),先后在加里宁、克拉斯诺达尔、坦波夫等地的骑兵学校受训,历任骑兵排长、团长,1937年一度改任图瓦人民共和国总检察长。1940年图瓦军队初设军衔,他被授予当时最高的上校军衔,同年出任新设立的图瓦军事部首任部长。卫国战争爆发后,他大力扩充部队并组织全民军事训练,1942年8月成为图瓦历史上第一位晋升少将的人。1943年5月卸去部长职务,赴苏联伏罗希洛夫高等军事学院深造。1962年6月14日在克孜勒去世。"
 CBIO_TAN_vladimir_sokoline_desc:0 "弗拉迪米尔·索科利勒,全名弗拉基米尔·亚历山德罗维奇·索科林,本姓沙皮罗,1896年4月2日生于瑞士日内瓦一个旅居当地的俄国犹太革命者家庭,是苏联外交官。他幼年被寄养在瑞士本地家庭,兼通俄语与法语,教育经历横跨俄瑞两国。二十年代他曾主持加米涅夫的秘书处,1927年转入苏联外交人民委员部,先后供职于苏联驻巴黎、布加勒斯特的使团。1934年苏联加入国际联盟后,他于1937年出任国联秘书长助理,是苏联在国联机构中的唯一代表。1939年底因苏芬战争爆发,苏联被开除出国联。此后他拒绝返回苏联,成为所谓\"不归者\",据信与1936年其旧上司加米涅夫在莫斯科审判中被处决有关。他滞留瑞士,后以法语从事写作。1984年在瑞士去世。"
 KOR_syngman_rhee_desc:0 "李承晚,1875年3月26日生于朝鲜黄海道一个没落两班家庭,自称太宗大王后裔。他早年接受传统儒学教育,后入培材学堂接受西式教育并皈依基督教。1896年他加入独立协会投身开化运动,1897年因牵涉废黜高宗密谋被捕入狱,直至1904年获释后赴美留学,先后就读乔治华盛顿大学、哈佛大学,1910年获普林斯顿大学哲学博士学位,是首位获得美国博士学位的朝鲜人。此后他长期旅居美国,以朝鲜独立活动家身份奔走游说。1919年大韩民国临时政府在上海成立,他被推举为首任总统,后于1925年遭弹劾去职。太平洋战争爆发后,他继续在美国为朝鲜战后独立奔走。1945年日本投降后,他在麦克阿瑟安排下返回朝鲜,凭借在美声望迅速成为南方保守派公认的领袖人物。1948年8月,大韩民国成立,他当选首任总统,此后连续三次连任,任内推行强硬反共政策、镇压异己。1960年因选举舞弊引发四一九学生革命,他被迫辞职流亡夏威夷。1965年7月19日,他在檀香山去世。"
 KUR_mahmud_barzanji_desc:0 "谢赫·马哈茂德·巴尔赞吉,又称马哈茂德·哈菲德扎德,1878年生于苏莱曼尼亚,出身卡迪里教团苏非世家巴尔赞吉家族,自称先知穆罕默德后裔。第一次世界大战后,英国在美索不达米亚建立托管统治,1918年起用他管理杜胡克地区,1919年又委任他为苏莱曼尼亚地区长官。同年五月他召集部众驱逐英方顾问,宣布建立库尔德斯坦国,旋即遭英军镇压,他本人受伤被俘,先被判处死刑,后改判流放印度。1922年英方为牵制土耳其势力,将他召回并再度任命为南库尔德斯坦长官,同年十月他在苏莱曼尼亚发布政令,组建内阁,十一月正式自立为库尔德斯坦国王,拒绝接受英伊联合声明,转而与土耳其方面暗通声气。他领导的库尔德斯坦国持续至1924年,此后仍断续领导反英起事,内阁中曾任命一名基督徒出任财政大臣。1932年英国皇家空军联合伊拉克军队将他彻底击败,再度流放伊拉克南部,他随后请和,1941年获准返回故里。1956年10月9日,在巴格达去世。"
 MAL_shenton_thomas_desc:0 "珊顿·托马斯,全名托马斯·珊顿·怀特莱格·托马斯,1879年10月10日生于英国伦敦,毕业于剑桥大学皇后学院。他在英国殖民地部历任要职,先后在东非、乌干达、尼日利亚、黄金海岸任职,1929年出任尼亚萨兰总督,1932年调任黄金海岸总督。1934年11月9日,他出任海峡殖民地总督兼联邦马来国高级专员,兼任驻婆罗洲与砂拉越英方代表。任内他主持新加坡新法院大楼、乔治五世国家公园等建设,但其政府被普遍认为未能正视日益逼近的日本威胁,防务准备严重不足。1941年12月日军入侵马来亚,1942年2月15日新加坡陷落,他本人拒绝撤离,随即沦为日军战俘,先囚于樟宜监狱,后转押台湾、满洲战俘营,直至1945年8月获美军解救。同年九月他短暂复任高级专员至1946年4月马来亚联邦成立、海峡殖民地建制解体为止,随后正式退休返回英国。新加坡珊顿道即以其姓氏命名。1962年1月15日,他在伦敦寓所去世。"
 SAU_abdulaziz_ibn_saud_desc:0 "阿卜杜勒阿齐兹·本·阿卜杜勒·拉赫曼·阿勒沙特,西方通称伊本·沙特,1876年1月15日生于利雅得,是沙特阿拉伯王国的缔造者与首位国王。他是内志埃米尔、第二沙特王国末代统治者阿卜杜勒·拉赫曼之子;1890年家族被拉希德家族逐出利雅得,流亡科威特。1902年1月,他率少数随从夜袭利雅得,以斜靠的椰枣树翻越城墙夺回故都,开启第三沙特王国。此后三十年间他南征北战,借助由定居化贝都因人组成的伊赫万武装,于1922年巩固内志、1925年攻取汉志,1926年加冕为汉志国王。伊赫万后因他禁止继续劫掠而反叛,1929年被他在萨比拉战役中击败。1932年9月23日,他将内志与汉志合并,建立沙特阿拉伯王国,自任国王。1915年他与英国签订达林条约,1933年将首份石油开采权授予美国公司,1938年沙特发现大规模油田。他一生育有众多子女,包括四十五个儿子,此后历代沙特国王皆出自其后裔。1953年11月9日在塔伊夫去世。"
