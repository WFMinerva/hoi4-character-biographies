 CBIO_ENG_george_v_desc:0 "1865年6月生于伦敦马尔伯勒府，维多利亚女王之孙、爱德华七世次子，英国国王兼印度皇帝，1910年至1936年在位。他本非王位的第一继承人，兄长阿尔伯特·维克托王子1892年去世后才转入继承序列。乔治五世性格谨慎、重秩序，在位期间经历第一次世界大战、爱尔兰问题、工党兴起、妇女参政权扩大、帝国自治领地位上升等重大变局。大战期间，他多次巡视前线和医院，1917年在反德情绪高涨的背景下将王室姓氏由“萨克森-科堡-哥达”改为“温莎”，并放弃德意志头衔，使王室与英国民族国家进一步绑定。1924年，他接受首届工党政府组阁，显示君主制对议会民主与大众政治时代的适应。1931年《威斯敏斯特法令》确认自治领地位，英帝国逐渐转向英联邦框架。1935年银禧庆典中，他仍拥有较高公众声望。1936年1月病逝后，长子爱德华八世继位，并很快引发退位危机。"
