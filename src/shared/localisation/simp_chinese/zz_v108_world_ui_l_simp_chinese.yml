 POLITICS_EDWIN_BARCLAY_DESC:0 "1882年生，利比里亚政治家、真辉格党人，1930年至1944年任总统。其叔阿瑟·巴克利亦曾任总统，他本人长期出入美裔利比里亚精英政治圈。1930年，查尔斯·金政府因向费尔南多波输出强迫劳工的丑闻遭国际联盟调查而倒台，时任国务卿的巴克利继任总统。他在丑闻余波中抵制国际接管压力，力图保住这个由获释美国黑奴建立的非洲共和国的主权。第二次世界大战使利比里亚的战略价值骤升：费尔斯通橡胶园在日本占领东南亚后成为盟军天然橡胶的重要来源，美国又在利比里亚修建罗伯茨机场、港口并部署力量。1943年罗斯福在途中访问利比里亚，与巴克利会晤，成为首位到访该国的在任美国总统。1944年利比里亚对轴心国宣战。同年巴克利卸任，由威廉·杜伯曼继任，1955年去世。"
 POLITICS_MUHAMMAD_NAGUIB_DESC:0 "1901年生于苏丹喀土穆，父亲为驻当地的埃及军官，埃及职业军人、共和国首任总统。二战时期他仍是埃及军队中资历渐深的军官，真正崭露头角是在1948年第一次中东战争中作战负伤、声望上升之后。1952年7月，以纳赛尔为核心的“自由军官组织”推举这位资历较高、形象较稳妥的将领作为门面发动政变，迫使法鲁克国王退位。1953年6月埃及宣布成立共和国，纳吉布出任首任总统兼总理。然而他很快与纳赛尔发生权力冲突：纳吉布主张恢复议会政治、还政于民，纳赛尔及其同僚则倾向继续由军方掌握革命政权。1954年11月，纳吉布被解除职务并长期软禁，直到萨达特时代才获得较宽松待遇与部分平反。1984年去世。"
 CBIO_EGY_mohamed_naguib_desc:0 "1901年生于苏丹喀土穆，父亲为驻当地的埃及军官，埃及职业军人、共和国首任总统。二战时期他仍是埃及军队中资历渐深的军官，真正崭露头角是在1948年第一次中东战争中作战负伤、声望上升之后。1952年7月，以纳赛尔为核心的“自由军官组织”推举这位资历较高、形象较稳妥的将领作为门面发动政变，迫使法鲁克国王退位。1953年6月埃及宣布成立共和国，纳吉布出任首任总统兼总理。然而他很快与纳赛尔发生权力冲突：纳吉布主张恢复议会政治、还政于民，纳赛尔及其同僚则倾向继续由军方掌握革命政权。1954年11月，纳吉布被解除职务并长期软禁，直到萨达特时代才获得较宽松待遇与部分平反。1984年去世。"
 CBIO_KOR_syngman_rhee_desc:0 "1875年生，朝鲜独立运动家、大韩民国首任总统。早年因参与改革运动被朝鲜王朝监禁，狱中接触基督教，获释后赴美国留学，1910年获普林斯顿大学博士学位，是最早取得美国博士学位的朝鲜人之一。日本吞并朝鲜后，李承晚长期流亡海外，1919年曾任上海大韩民国临时政府首任总统，后因政治分歧被弹劾去职，此后主要在美国华盛顿活动，持续游说美国支持朝鲜独立。二战结束、日本投降后，他返回朝鲜半岛南部，在美军政厅和右翼势力支持下成为反共阵营核心人物。1948年大韩民国成立后任首任总统，后领导韩国度过朝鲜战争，但执政日益专断，操纵选举并镇压反对派。1960年“四月革命”后被迫下台，流亡夏威夷，1965年病逝于檀香山。"
