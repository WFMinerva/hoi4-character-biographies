 CBIO_ELS_augustin_farabundo_marti_desc:0 "萨尔瓦多革命家、共产党人，全名是阿古斯丁·法拉邦多·马蒂·罗德里格斯，1893年5月5日生于拉利韦塔省特奥特佩克。父亲佩德罗·马蒂是当地镇长兼地主，据未经证实的说法，原姓为马蒂尔，因仰慕古巴人何塞·马蒂而改姓马蒂。他在萨尔瓦多大学攻读法学，在图书馆里读遍马克思主义与无政府主义著作，此后屡遭逮捕与驱逐。1925年参与在危地马拉创建中美洲共产党。1928年赴美加入美洲反帝大同盟，受派前往尼加拉瓜，一度担任桑地诺的机要秘书，1929年5月4日被授予保卫国家主权军上校衔。因始终无法使桑地诺接受马克思列宁主义，他于同年返国，但终生对桑地诺保持敬意。1930年萨尔瓦多共产党成立，他成为核心领导人。1932年1月19日，他在圣萨尔瓦多圣米格利托区被捕，同时落网的还有大学生阿方索·卢纳与马里奥·萨帕塔。三天后西部农民起义爆发，遭马丁内斯政权血腥镇压，死难者估计一万五千至三万人，史称大屠杀。1932年2月1日，他经军事法庭判决在圣萨尔瓦多被枪决。1980年，萨尔瓦多五支游击力量联合，以他的名字命名为法拉本多·马蒂民族解放阵线。"
 CBIO_ELS_benito_ubico_desc:0 "虚构架空人物。其名贝尼托出自拉丁语Benedictus，由bene与dictus合成，字面意为受祝福者，亦可解作为人称道者。这一名字的传播归功于努尔西亚的圣本笃，约生于480年，547年3月21日卒于卡西诺山，被视为西方隐修制度的奠基者。在萨尔瓦多，圣本笃之名落在首都圣萨尔瓦多的圣本笃区，今日的总统府即坐落于此。而在二十世纪，贝尼托这个名字更强烈地指向意大利的贝尼托·墨索里尼。姓氏乌维科则指向危地马拉独裁者豪尔赫·乌维科，1878年生，1946年卒，1931至1944年在任。二者的关联并非附会：乌维科公开倾慕墨索里尼、佛朗哥与希特勒，1937年将危地马拉的格查尔勋章授予墨索里尼，同年希特勒亦致函向他道贺。这个名字是把一位法西斯领袖的教名，直接安在一位仰慕他的中美洲独裁者的姓氏之上，取名逻辑近乎明示。"
 CBIO_ELS_hector_escobar_serrano_desc:0 "萨尔瓦多外交官、法学家，1904年8月14日生于查拉特南戈省特胡特拉。他在墨西哥国立自治大学取得法学博士学位，1927年进入外交界，首任驻柏林使馆随员。1930年至1934年在圣萨尔瓦多任一审刑事法庭法官。1934年3月，他作为代表出席在危地马拉城召开的首届中美洲友好会议。1934年至1937年任驻特古西加尔巴公使，1937年起在萨尔瓦多大学讲授公法与法学，同年转任驻墨西哥城公使至1939年，随后当选制宪议会议员。1940年起，他以特命全权公使身份先后驻节哈瓦那、危地马拉城与圣多明各，其间于1944年短暂出任财政部长。1947年至1950年任驻墨西哥大使，参与了在查普尔特佩克举行的美洲国家会议。1951年1月12日起出任驻马德里大使，此后近十年常驻西班牙；自1952年3月25日起，他兼任驻埃及、摩洛哥、安道尔与圣座使节，是萨尔瓦多派驻梵蒂冈的首位大使。1962年7月19日至1965年7月19日，在胡利奥·阿达尔韦托·里维拉·卡瓦略政府中出任外交部长。妻子是马蒂尔德·加西亚。1986年去世。"
 CBIO_ELS_humbert_aberle_desc:0 "萨尔瓦多航空事业的开创者，通行姓名是温贝托·阿贝莱，1891年8月10日生于圣安娜省，是那不勒斯作曲家胡安·阿贝莱与图拉·阿贝莱之子。1906年8月25日入军事理工学校，同年即以见习少尉身份参加对危地马拉军队的战役，1908年10月15日授少尉衔，1911年已是萨尔瓦多陆军中尉。1917年2月1日，他辞去驻旧金山领事馆的秘书职务，奉政府之命进入加利福尼亚红木城飞行学校，1918年1月24日毕业为飞行员，1920年5月24日晋上尉。1922年12月16日，他驾驶名为圣萨尔瓦多号的林肯标准型飞机，自墨西哥塔帕丘拉不着陆直飞圣萨尔瓦多，六小时飞越五百公里，创下中美洲纪录，次年获总统授予四等军功十字勋章。1923年3月20日萨尔瓦多空中飞行队成立，他出任首任队长兼军事航空课程主任。1926年赴西班牙四风飞行学校深造，取得国际航空联合会飞行员与西班牙军事飞行员资格，随后在赫塔菲战斗机学校服役，参加了西属撒哈拉的军事行动，同年4月20日获国王阿方索十三世授予一等军功十字勋章。1935年7月5日晋大尉。1937年9月3日转入战争部教育科任义务协作员。他起草了萨尔瓦多民用航空条例与军事航空课程章程，并与意大利飞行员恩里科·马西一同选定了伊洛潘戈机场的场址，被视为萨尔瓦多空军之父。1970年2月10日去世。"
 CBIO_ELS_humberto_costa_desc:0 "萨尔瓦多政治家，1906年9月2日生于圣安娜。他不是军人，而是以文职专业人士的身份进入政坛。1948年12月14日，一批少壮军官推翻卡斯塔涅达·卡斯特罗，成立革命政府委员会，科斯塔与年方三十的雷纳多·加林多·波赫尔同为其中仅有的两名文职成员，被延揽进来给这个军人政权一副文官面孔。委员会于1950年9月14日交权。此后他被任命为萨尔瓦多最高法院院长，一直任职到1956年大选。同年，他以民主统一革命党候选人的身份，作为何塞·玛丽亚·莱穆斯的竞选搭档当选副总统，并兼任财政部长，主掌财政至1959年。1959年3月9日至3月31日，莱穆斯离国期间，由他代行总统职权。1960年10月的政变推翻了莱穆斯政府，科斯塔就此退出政坛。"
 CBIO_ELS_jose_angel_castillo_desc:0 "萨尔瓦多政治家，通行姓名是何塞·安赫尔·阿文达尼奥。他在萨尔瓦多·卡斯塔涅达·卡斯特罗总统任内出任内政部长，这是当时掌管地方行政、治安与选举事务的要职，而卡斯塔涅达政府恰以沿袭马丁内斯时代的镇压手段著称：1945年空军政变未遂后，全国长期处于戒严状态，1946年的数次罢工被宣布非法，自由广场上的罢工者遭安全部队开枪射杀。1948年12月13日，立法议会通过第253号法令，为卡斯塔涅达延长任期开路，激起军中少壮派的军事青年运动起兵。次日凌晨政变爆发，警察总部升起白旗；卡斯塔涅达与国防部长毛罗·埃斯皮诺拉·卡斯特罗、内政部长阿文达尼奥及其余数名高官一同被捕，押入中央监狱。"
 CBIO_ELS_manuel_de_jesus_cordova_desc:0 "萨尔瓦多军人，全名是曼努埃尔·德·赫苏斯·科尔多瓦·梅尔加尔，1911年12月25日生于查拉特南戈城，父亲路易斯·科尔多瓦，母亲德尔菲娜·梅尔加尔。1931年他参与推翻阿图罗·阿劳霍的政变。1930年代末，他与奥斯卡·奥索里奥一同被派往意大利都灵深造，1944年归国后出任国民警卫队队长。同年4月2日，反马丁内斯的军人起事以突袭伊洛潘戈机场开场，机场在叛军手中被控制了二十四小时，最终由他率领的国民警卫队会同圣比森特与萨卡特科卢卡的驻军夺回，起事在4月3日夜间平息。1948年他已是中校、军校副校长；同年12月14日，因不满卡斯塔涅达·卡斯特罗延长任期，他反过来领导政变推翻总统，出任革命政府委员会主席，下令逮捕卡斯塔涅达与阿吉罗，并查封二人及其亲属的财产。1949年1月4日他辞去主席职务，由奥索里奥接任，转任驻阿根廷、驻美国使馆武官。1956年晋升将军，任军事学校校长至1958年，随后在莱穆斯任内出任三军联合参谋长，晚年历任驻哥伦比亚与哥斯达黎加特命全权公使。2005年10月在圣萨尔瓦多去世。"
 CBIO_ELS_manuel_jose_maria_lemus_lopez_desc:0 "萨尔瓦多军人、政治家，通行姓名是何塞·玛丽亚·莱穆斯·洛佩斯，1911年7月22日生于拉乌尼翁港一个清寒家庭，毕业于国立军事学校，1933年起服役，最终晋升上校。1948年至1949年任国防部次长，1950年至1955年在奥斯卡·奥索里奥政府中任内政部长，因整肃贪腐而开罪同僚。作为奥索里奥属意的接班人，他在争议重重的1956年大选中以唯一候选人身份当选，9月14日就任总统。他废除前任的反煽动法，允许流亡者回国，释放大批政治犯，延请知名文官入阁，反因此触怒军方；又强令报纸刊登对新闻与社论的答复，得罪了新闻界。1958年咖啡价格下跌，他以生产管制应对，激怒了种植园主，物价上涨与失业则疏远了工人。他颁行的租户法限制房租涨幅、强制签订租约，至今仍然有效。1960年国会选举争议激化局势，学生集会声援古巴革命，他调警镇压、突袭国立大学并宣布戒严。1960年10月26日，他在一场不流血政变中被推翻并遭放逐。1993年3月31日，他在流亡中因霍奇金淋巴瘤去世；去世地点一说哥斯达黎加圣何塞，一说美国纽约。"
 CBIO_ELS_mauro_espinola_castro_desc:0 "萨尔瓦多将军。1945年3月1日，卡斯塔涅达·卡斯特罗就任总统后一度自兼国防部长，同年3月31日把这一职位交给埃斯皮诺拉·卡斯特罗，他任职至1948年12月14日。任内军中派系倾轧不断：1945年6月10日空军策动政变、轰炸国家警察总部未遂，此后全国长期戒严。卡斯塔涅达未征询其他军官的意见，便径自指定这位马丁内斯一系的老将为1949年大选的官方候选人，他随即着手组建自己的政治组织民族联盟党；然而他在军中与民间都不孚众望，声望远不及奥斯明·阿吉罗，也压不住少壮派的奥斯卡·奥索里奥。1948年12月，卡斯塔涅达反悔谋求延任，埃斯皮诺拉是反对最力的人之一；据美国驻萨尔瓦多使馆当时呈报华盛顿的报告，卡斯塔涅达之所以挑在那一周动手，正因为埃斯皮诺拉刚做完阑尾手术躺在医院里。12月14日，卡斯塔涅达亲自收回国防部长一职并调换数名要地驻军司令，当天即被少壮军官发动的少校政变推翻。政变者公开声明与埃斯皮诺拉并无政治瓜葛。他随即与卡斯塔涅达、内政部长阿文达尼奥一同以贪渎罪名被押入中央监狱，财产依1949年2月11日颁行的廉正法被查封。"
 CBIO_ELS_oscar_a_bolanos_desc:0 "萨尔瓦多军人，全名是奥斯卡·亚当·博拉尼奥斯。他毕业于萨尔瓦多军事学校第二期，同期同学中有后来的总统奥斯卡·奥索里奥，以及日后同样出任国防部长的亚当·帕拉达；第一期的毕业生里则有曼努埃尔·德·赫苏斯·科尔多瓦。1948年12月14日，一批年龄多半不满四十岁的少校发动政变，推翻了谋求延任的卡斯塔涅达·卡斯特罗，史称少校政变；博拉尼奥斯与温贝托·皮内达·比利亚尔塔、奥斯卡·奥索里奥同为这场政变的主要领导人。政变后成立的革命政府委员会中，他是军人成员之一，委员会的头一批举措便是把马丁内斯一系的将领悉数免职、监禁并以贪渎罪起诉。1950年9月14日奥索里奥就任总统、委员会解散，博拉尼奥斯以少校军衔出任国防部长，任职至1953年12月10日。"
 CBIO_ELS_osmin_aguirre_y_salinas_desc:0 "萨尔瓦多军人、政治家，1889年12月24日生于圣米格尔。1931年12月2日，他参与推翻总统阿图罗·阿劳霍的政变，出任军民理事会成员兼战争、海军与航空部长；理事会两天后解散，把权力交给马丁内斯，他随即被任命为国家警察总监。1932年1月西部农民起义爆发，抓捕法拉邦多·马蒂的任务正由他负责，他也因此成为大屠杀的主要执行者之一。1944年5月9日马丁内斯辞职，安德烈斯·伊格纳西奥·梅嫩德斯出任临时总统；同年10月21日，阿吉罗联合一批旧马丁内斯派军官发动政变，推翻的是梅嫩德斯而非马丁内斯，他以第一总统指定人身份接掌临时总统。上任即宣布戒严，直至卸任未曾解除；12月圣萨尔瓦多爆发学生武装起事，流亡者亦自危地马拉越境来攻。1945年1月大选，五名候选人指控选举不公集体退出，卡斯塔涅达·卡斯特罗以百分之九十九点七的得票当选，阿吉罗本人只得六百九十票。3月1日他如约交权，此后退出军政两界。最高法院其后宣告其任期违宪，美国也拒绝承认，视之为亲法西斯政权。1977年7月12日，他在圣萨尔瓦多住所前遭枪击，送往军队医院途中身亡，终年八十七岁，法拉本多·马蒂人民解放力量宣称对此负责。"
 CBIO_ELS_reinaldo_galindo_pohl_desc:0 "萨尔瓦多法学家、外交官、法哲学教授，1918年10月21日生于松索纳特。父亲埃克托尔·加林多·加西亚是本地牙医，母亲莉莲·波赫尔是美国籍语言教师。1944年他还是萨尔瓦多大学法学院学生，参与了那场迫使马丁内斯下台的垂臂罢工；学生们凯旋返校时，他代表萨尔瓦多大学生总会致辞，说萨尔瓦多不负其国名，正如一个世纪之前，又一次率先踏上通往第二次独立的道路。1948年他参与推翻卡斯塔涅达·卡斯特罗的军人运动，进入革命政府委员会任职。1950年当选制宪议会主席，成为该年宪法的主要制定者，同年在萨尔瓦多大学取得法学与社会科学博士学位，此后长期在该校讲授法哲学。1950年至1956年任教育部长。其后转向国际舞台，历任美洲人权委员会委员、维也纳条约法公约谈判代表、萨尔瓦多驻联合国大使，1974年至1980年主持美洲国家组织法律部。1987年起，他出任联合国伊朗人权问题特别代表长达八年，三度亲赴伊朗，坚持在狱中或在当局阻挠的场合会见证人，其报告成为记录该国人权状况的重要文献。2012年1月4日在圣萨尔瓦多去世。"
 CBIO_ELS_salvador_castaneda_castro_desc:0 "萨尔瓦多军人、政治家，1888年8月6日生于恰尔丘阿帕。1906年从军，同年7月11日授少尉衔，1929年5月21日晋升将军，曾任军事学校校长。1931年政变后，马丁内斯视其为可信赖的老资格军官，任命他为内政、劝业、农业、劳工、卫生与慈善部长，任职至1935年；1934年1月，马丁内斯又反过来指控他与其他军官密谋政变。1945年1月大选，他以社会民主统一党候选人身份在对手集体退选的情况下几乎无竞争地当选，3月1日就任总统。他一度自兼国防部长，随后把这一职位交给毛罗·埃斯皮诺拉·卡斯特罗。同年5月17日，他与危地马拉总统阿雷瓦洛在两国边境签署协定，宣示政治联合意向；6月10日空军发动政变未遂，此后全国长期处于戒严状态。他签令设立伦帕河水电执行委员会，开启萨尔瓦多的电气化。1946年他一度放宽工会限制并重设劳工部，但当年八九月的罢工被宣布非法，自由广场上的罢工者遭安全部队开枪射杀，年底工会转入地下。当时的评论者普遍认为，他的执政不过是没有马丁内斯的马丁内斯主义。1948年12月13日立法议会开绿灯准其连任，次日他即被以奥斯卡·奥索里奥为首的少壮军官推翻。1965年3月5日在圣萨尔瓦多去世。"
 CBIO_ELS_victoriano_ubico_desc:0 "虚构架空人物。其名维克托里亚诺出自拉丁语Victorianus，是Victor的派生形式，词根victor意为胜利者。天主教传统中最著名的同名圣徒是迦太基总督圣维克托里亚诺，公元484年，汪达尔国王胡内里克强令境内基督徒改奉阿里乌派，他拒不从命，被施以酷刑而死。这个凯旋意味浓重的教名，与萨尔瓦多国名本身的救世主含义构成一组基督教语汇上的呼应。姓氏乌维科在中美洲只有一个强指向，即危地马拉军人、政治家豪尔赫·乌维科·卡斯塔涅达，生于1878年11月10日，1931年2月14日就任危地马拉总统，独裁至1944年，绰号五号，又称中美洲的拿破仑，1946年6月14日死于流亡地美国新奥尔良。乌维科与萨尔瓦多的交集恰在1932年：萨尔瓦多西部农民起义遭镇压后，幸存者逃向危地马拉，乌维科下令封锁边界，将越境者尽数交还萨尔瓦多军队。此名把一个殉道圣徒的胜利之名，嫁接到一位镇压者的姓氏之上。"
 CBIO_NIC_benjamin_lacayo_sacasa_desc:0 "尼加拉瓜政治家，1893年6月27日生于格拉纳达，父亲是丹尼尔·拉卡约·贝穆德斯，母亲是恩卡纳西翁·萨卡萨·夸德拉。拉卡约与萨卡萨两姓都是尼加拉瓜最古老的家族，他是前总统胡安·包蒂斯塔·萨卡萨的亲属，也是索摩查之妻萨尔瓦多拉的舅父。1934年他任国会众议院议长。1947年，索摩查对刚扶上台的阿圭略心生不满，5月26日发动政变，国会以精神失能为由罢免阿圭略，当夜由早已被内定为总统指定人的拉卡约接掌政权，次日宣誓，时年五十四岁。他的政府只得到阿根廷贝隆政权一家承认，美国与中美洲各国一概不予承认。在国际压力与索摩查的安排下，他于8月3日召集新一届制宪议会选举，投票者不足合格选民的一成。8月15日制宪议会开幕当天便接受他辞职，改选罗曼·瓦·瑞斯为总统。他在位不足三个月，此后退出权力核心。1959年4月4日去世。"
 CBIO_NIC_bernardo_doroteo_desc:0 "贝尔纳多·多罗特奥·雷耶斯·奥加松，墨西哥军人、政治家，1850年8月30日生于哈利斯科州瓜达拉哈拉，父亲是移居墨西哥的尼加拉瓜莱昂人多明戈·雷耶斯·罗维拉，官至中校。他十四岁投身自由派军队抗击法国干涉军，在克雷塔罗围城战中两度负伤，并目睹马克西米连诺一世皇帝被处决。此后在镇压地方军阀叛乱中屡建战功，1880年锡那罗亚比利亚乌尼翁一役以少胜多，波费里奥·迪亚斯破格提拔他为准将。1885年起他历任新莱昂州州长逾二十年，推动工业化，改善教育医疗，并批准工人赔偿法。1900年出任陆军海军部长，扩编军队并组建第二后备军，因与迪亚斯身边的科学家派系冲突，两年后辞职。他一度被视为迪亚斯最有力的接班人，支持者推举他竞选总统，但他未与迪亚斯正面竞争。马德罗推翻迪亚斯后，他先支持马德罗，后又策划反对马德罗的政变。1913年2月9日，蒙德拉贡部队将其从监狱释放，他随即率部进攻国家宫，冲锋途中中弹身亡，揭开悲剧十日政变的序幕。"
 CBIO_NIC_carlos_brenes_jarquin_desc:0 "尼加拉瓜政治家、医生，通行姓名是卡洛斯·阿尔韦托·布雷内斯·哈尔金，1884年12月2日生于马萨亚。他属民族自由党，1936年任尼加拉瓜国会众议院议长。当年5月31日，国民警卫队总监索摩查·加西亚的部队进攻马那瓜；6月6日总统萨卡萨与副总统辞职流亡；6月9日，国会一致接受辞呈，并一致推举索摩查属意的人选布雷内斯出任临时总统，为这场政变披上合法外衣。国会里的保守派为自己的投票辩解说，他们只是想让危机和平收场，但仍要以反对党自居，并保留提名总统候选人的权利。布雷内斯任内并无实权：索摩查在6月16日宣布参选，随后设法让国会把大选推迟到12月，以满足参选前一年须辞去军职的宪法要求。12月，国民警卫队负责计票，宣布索摩查以压倒多数当选。1937年1月1日，布雷内斯把权力交给索摩查，任期恰好半年余。此后他出任尼加拉瓜驻美国公使。1942年1月2日在马那瓜去世。"
 CBIO_NIC_leonardo_arguello_vargas_desc:0 "尼加拉瓜医生、作家、外交官、政治家，通行姓名是莱昂纳多·阿圭略·巴雷托，1875年8月29日生于莱昂，兄长是著名诗人圣地亚哥·阿圭略·巴雷托。他在莱昂行医，1912年投身自由党政治，参加了1926年的护宪战争，历任国会众议院议长、教育部长、内政部长与外交部长。1936年他参选总统，败于索摩查。1947年索摩查因美国压力不便再度连任，选中这位七十二岁的老医生做傀儡，用国民警卫队制造舞弊，把对手埃诺克·阿瓜多的选票记到他名下。5月1日就职，他在就职演说中说自己绝不做一个随波逐流的过渡总统，随即着手把索摩查解除国民警卫队总监职务、令其退役，并撤掉索摩查之子在警卫队与马那瓜警察中的职位。5月26日，索摩查发动政变；国会宣布他精神失能，予以罢免。他带着总统绶带与国玺躲进墨西哥大使馆，避难五个月，11月29日乘墨西哥军机离境，始终未曾辞职，也再未回国。1947年12月15日，他因长期心脏病在墨西哥城希洛旅馆去世，终年七十二岁。遗骸至今未归葬故土。"
 CBIO_NIC_victor_roman_y_reyes_desc:0 "尼加拉瓜医生、政治家，通行姓名是维克托·曼努埃尔·罗曼·伊·雷耶斯，1872年10月13日生于卡拉索省希诺特佩。1896年他毕业于费城的哈内曼医学院，在美国行医多年后归国，历任卫生部长、财政部长、驻旧金山总领事，1929年至1930年任国会参议院议长。他是索摩查·加西亚的舅父，即索摩查之父阿纳斯塔西奥·索摩查·雷耶斯的堂兄弟，因此被称作维克托叔叔。1947年拉卡约政府不获国际承认，索摩查需要一个既有些许合法性又对自己忠诚的人；他与罗曼签下荣誉协定，罗曼承诺当选后确认索摩查续任国民警卫队总监，并支持索摩查下届参选。8月15日制宪议会推举他就任总统。任内他签署1948年新宪法，把索摩查留在国民警卫队总监兼战争部长的位子上；促成索摩查与保守党的夸德拉·帕索斯协定；出兵支援哥斯达黎加的皮卡多，并在皮卡多被推翻后给予其庇护。他推行全国造林计划，将若干中学收归国有，兴建通信宫与国家体育场，也是第一位把每周记者会制度化的尼加拉瓜总统。1950年5月6日，他因病在费城的哈内曼医院去世，任内病逝，遗体运回希诺特佩安葬。次日索摩查接任总统。"
 CBIO_NZL_a_e_davy_desc:0 "阿尔伯特·欧内斯特·戴维，新西兰政治组织者，1886年8月17日生于惠灵顿，父亲是警察。少年随家迁居塞姆斯、达格维尔及霍克斯湾各地，1907年定居吉斯本，做过鞋匠、布商、理发师，业余投身新西兰摩托车联盟与田径自行车联盟组织工作。1919年协助道格拉斯·莱斯纳竞选吉斯本议席，1923年受聘为改革党组织干事，1925年为党魁戈登·科茨策划总统式竞选宣传，被认为促成该党当年大胜。1926年因与科茨不睦离党，1927年受奥克兰商人麦克阿瑟资助另立新西兰联合政治组织，1928年联合乔治·福布斯的国民派及威廉·维奇的自由党残部组成联合党，并说服在加拿大的约瑟夫·沃德爵士回国出任党魁；联合党当年上台执政。1930年他辞去联合党组织主任一职。1934年获实业家威廉·古德费洛资助创立民主党，反对工党政府的社会主义政策，招募前惠灵顿市长托马斯·希斯洛普任党魁，但该党在1935年大选中未能赢得议席，反而分散了反工党选票。此后他一度经营报业、股票经纪，1940年加入人民运动，1941年该运动部分并入国家党，他又另立合作党，1943年协助独立派参选，此后彻底退出政界从商。1958年工党政府任命他为贸易惯例与物价委员会委员，后代理主席。1959年6月13日在惠灵顿去世，终年七十二岁。"
 CBIO_NZL_a_j_stallworthy_desc:0 "亚瑟·约翰·斯托沃西，1877年4月18日生于奥克兰，父亲约翰·斯托沃西1872年移民新西兰，曾任凯帕拉选区议员。全家迁居霍布森县阿拉塔普后，其父经营当地报纸怀罗阿钟声与北方广告人报，晚年失明，斯托沃西接手经营，1923年父亲去世后他继承并很快售出报社，迁居奥克兰。1927年当选奥克兰市议员，任满一届后不再连任。1928年当选伊登选区联合党议员，同年出任卫生部长直至1931年。1935年他曾角逐奥克兰市长，在三人竞选中位列第三；同年联合/改革联合政府将他排除出候选人名单，他改以民主党身份参选伊登议席，败于工党候选人比尔·安德顿。1935年获乔治五世银禧奖章。1954年8月1日去世，终年七十七岁。"
 CBIO_NZL_alexander_galbraith_desc:0 "亚历山大·加尔布雷思，1883年2月15日生于新西兰奥塔哥奥泰波波附近，苏格兰移民之子。父亲威廉在惠灵顿码头做工，因参加罢工失业，全家辗转迁居马尔堡安蒂弥尔湾，做锑矿工，1892年病逝，家境更为艰难，亚历克斯很早便送报、在皮克顿学校做勤杂工谋生。此后随家迁居西海岸尼尔森溪，长年在木材业做工，投身当地工党政治，出任西地木材场与锯木厂工会会长。1918年他曾代表工党角逐帕默斯顿补选，仅以315票之差落败。1922年因在惠灵顿的一次演讲中主张以武力推翻资本主义而被判煽动罪。1926年他在新西兰共产党全国大会上崭露头角，出任全国执行委员会主席兼党刊工人先锋报首任主编。1930至1931年任总书记，1936至1937年再任党主席。1930年他作为新西兰代表赴莫斯科出席红色工会国际大会，此行令他更加坚定信念，此后四年全职为党工作，长期生活拮据，一度兼任党报注册出版人。1932年入狱期间感染肺结核，健康每况愈下，1934年病情复发。1959年10月7日去世，终年七十六岁。"
 CBIO_NZL_bernard_ashwin_desc:0 "伯纳德·卡尔·阿什温，新西兰公务员、经济学家，1896年9月22日生于新西兰派罗亚。战后回国在教育部任职，后转入国民公积金局，1921年取得会计师资格，1925年获惠灵顿维多利亚大学学院商学荣誉硕士学位。1922年加入财政部，历任总巡视员、助理会计师，1935年任助理秘书，实际自1930年代中期起已代行秘书之职。1939年正式接任财政部秘书长，将该部从单纯的出纳记账机构改造为经济决策核心，参与社会保障体系与储备银行的筹建。二战期间他兼任稳定化局局长，1943年起主持经济稳定委员会，与雇主代表威廉·马歇尔及劳工联合会主席沃尔什共同实际掌管战时经济，尤其在1942至1944年财政部长纳什驻美期间独自主持财政部工作并编制历年预算。他在货币政策上态度保守，坚决反对工党党团内的社会信用派主张。1946年获颁圣米迦勒及圣乔治勋章。1955年卸任财政部秘书长，1956年封爵。1975年2月12日去世，终年七十八岁。"
 CBIO_NZL_bernard_freyberg_desc:0 "伯纳德·弗赖伯格，1889年3月21日生于英国伦敦里士满，两岁随家人移居新西兰惠灵顿并在此完成学业，青年时是新西兰百码游泳冠军。一战期间他以英国皇家海军师军官身份参加加里波利登陆战，后转赴西线作战，九次负伤，1916年因博库尔战斗表现获维多利亚十字勋章，并三获杰出服务勋章，二十七岁即晋升准将，为当时英军最年轻的将官。战间期他历任多个参谋及指挥职务，1934年晋升少将，1937年因体检查出心脏问题被迫退役。二战爆发后恢复现役，受新西兰政府邀请出任新西兰第二远征军及新西兰第二师司令，率部转战希腊、克里特岛与北非。在克里特岛战役中他兼任盟军克里特部队总指挥，未能阻止德军占领该岛。此后他率部参加北非阿拉曼战役与意大利战役，因坚持部队完整建制、必要时可直接向新西兰总理弗雷泽陈情而与部分英军高层不睦，但深受本国官兵爱戴。1946年起出任新西兰总督至1952年，是首位在新西兰长大的总督。1951年封男爵，此后定居英国，任温莎城堡副堡守，1963年7月4日在温莎因旧战伤复发去世。"
 CBIO_NZL_bob_semple_desc:0 "罗伯特·森博，新西兰工党政治家，1873年10月21日生于澳大利亚新南威尔士索法拉，九岁起在利斯戈煤矿做工，后辗转纽卡斯尔及维多利亚各矿区。1903年因参与矿工大罢工被列入黑名单，遂移居新西兰西海岸鲁纳加煤矿，1907年当选鲁纳加矿工工会主席，人称斗士鲍勃。他与P.H.希基、P.C.韦布等人推动矿工联合会及新西兰劳工联合会成立，1913年因支持大罢工入狱，1916年又因反对征兵再度入狱一年。1918年当选国会议员，1926年任工党主席。1935年工党执政，萨维奇任命他为公共工程部长，1941年起兼任铁路部长直至1949年，是工党政府基础设施建设的代表人物，将公共工程部从大萧条时期的救济机构重新转型为国家开发主力。二战中他主持研发以拖拉机底盘和瓦楞铁皮制造的国产坦克，后世称为森博坦克，因设计缺陷从未量产。晚年他成为坚定的反共人士，1948年出版反共小册子。1954年因病未再参选，1955年1月31日在新普利茅斯去世，终年八十一岁。"
 CBIO_NZL_edmund_rupert_drummond_desc:0 "埃德蒙·鲁珀特·德拉蒙德，1884年5月8日生于英国，第十代斯特拉塞兰子爵詹姆斯·德拉蒙德幼子，就读于达特茅斯皇家海军学院，1906年晋升海军中尉。一战期间他历任轻巡洋舰卡罗琳号大副及加的夫号军官，参加日德兰海战。战间期他历任多个舰艇指挥与参谋职务，1927年任开普敦号巡洋舰舰长，1930年任朴次茅斯总司令部参谋长，随后转任美洲及西印度群岛总司令部参谋长。1935年至1938年出任新西兰海军基地总司令，其间于1936年获任乔治六世的海军侍从武官。二战爆发后他任朴特兰海军船坞司令，后于1942年起任罗塞斯总司令部参谋长直至1945年退役，1940年晋升退役中将。战后定居英格兰，1965年9月9日在温莎去世，终年八十一岁。"
 CBIO_NZL_edward_puttick_desc:0 "爱德华·帕蒂克，1890年6月26日生于新西兰蒂马鲁，就读怀塔基男子中学，一战爆发前已在准备役服役。1914年随远征军占领德属萨摩亚，后随新西兰步枪旅第一营赴埃及，参加对抗苏努西部族的战役，随师部调赴西线，1917年晋升中校并指挥步枪旅第三营参加帕斯尚尔战役，1918年春季攻势中肺部中弹回国休养。1919年转入新西兰参谋团，此后二十年历任多个参谋及指挥职务，1937年代表新西兰出席帝国会议并任乔治六世加冕典礼引座员，1939年任中央军区司令。二战爆发后他率第四步兵旅赴中东，1941年参加希腊战役后撤至克里特岛，在弗赖伯格出任克里特部队总指挥期间代管新西兰师，因未能有效督促部下发起反击导致马莱梅机场失守，是克里特战役盟军失利的争议焦点之一。撤至埃及后，他接受来访的新西兰总理弗雷泽提议，回国出任新西兰军队总参谋长，1942年晋升中将，为首位晋此军衔的新西兰本土出生军人。1945年卸任，1946年封爵士并率新西兰代表团参加伦敦胜利大阅兵。退役后撰写新西兰官方战史中第25营分册。1976年7月25日去世，终年八十六岁。"
 CBIO_NZL_elsie_farrelly_desc:0 "埃尔茜·法雷利，新西兰作家、社会活动家，1912年8月17日生于汉密尔顿，六个孩子中最小的一个，父亲是建筑工人，母亲投身妇女权利运动。她在怀尤库长大，考入奥克兰大学学院，1933年获文学学士学位。大萧条期间她目睹奥克兰失业者示威及皇后街骚乱，深受触动，同年加入新西兰共产党，出任妇女工人运动全国组织者，创办面向女工的通讯刊物，并组织了新西兰首次全国工作妇女大会。1935年她与刚从苏联归国、旋即出任新西兰共产党领袖的弗雷德里克·恩格斯·弗里曼结婚，1940年离异，1941年改嫁约翰·洛克。1956年因苏联镇压匈牙利革命及对斯大林主义的反思，她退出共产党，但未放弃社会主义理想，此后投身和平运动，是新西兰核裁军运动创始成员之一，撰写多部回忆性著作与反映拓荒移民历史的儿童文学作品。1987年获坎特伯雷大学荣誉文学博士学位，1996年获奥克兰大学杰出校友奖。2001年4月8日在克赖斯特彻奇去世，终年八十八岁。"
 CBIO_NZL_h_e_horan_desc:0 "亨利·爱德华·霍兰，1890年8月12日生于爱尔兰利默里克郡纽卡斯尔韦斯特，父亲是土木工程师。就读斯塔宾顿豪斯学校，1906年入达特茅斯不列颠尼亚皇家海军学院，1910年加入皇家海军，一战期间参加1914年黑尔戈兰湾海战。战间期他历任多个舰艇与参谋职务，1930年晋升上校，1931年任巡洋舰考文垂号舰长，1935年起任帝国国防学院参谋主任，1937年任战列舰巴勒姆号舰长。1938年4月他借调至新西兰海军部队，出任海军参谋长兼首席海军委员。1940年1月他兼任轻巡洋舰利安德号舰长及新西兰分舰队准将司令；同年5月利安德号调离新西兰海域执行特遣任务后，他卸任新西兰的军职，恢复上校军衔。1941年7月8日晋升海军少将，次日即转入退役名单，但仍留用为登陆艇与基地少将，1943年出任西部战区与罗塞斯联合作战基地司令。1947年获颁巴斯勋章司令勋位。1961年8月15日去世，终年七十一岁。"
 CBIO_NZL_j_e_duigan_desc:0 "约翰·埃夫林·戴根，1883年3月30日生于新西兰旺阿努伊，就读旺阿努伊学院。布尔战争爆发后自费赴南非，加入布拉班特骑兵团志愿部队，韦彭尼围城战中负伤，后又随第十新西兰特遣队重返南非但战事已近尾声。1903年加入新西兰常备军，1905年获委任新西兰皇家工兵中尉，赴英国进修工程与通信课程。一战期间他指挥新西兰隧道工兵连，因功获颁杰出服务勋章，1918年赴美协助推销战争公债。战后历任奥克兰军区参谋官，1930年起统领该军区，1931年晋升上校。1937年4月1日晋升少将，出任新西兰军队司令兼总参谋长，是首位担任该职的本土出生军人；同年他推动废除司令一职，改由军事委员会掌管军队，自己出任首任军方委员。此举引发部分本土军官不满，四名上校联署发表宣言抨击军队积弱，遭勒令退役。他任内大幅缩减国民军规模，未能有效制衡政府对新兴空军的政策倾斜。二战爆发后他曾希望执掌新西兰远征军，但因缺乏野战指挥经验及性情顾虑未获任命，1941年退役。1950年1月9日去世，终年六十六岁。"
 CBIO_NZL_john_a_lee_desc:0 "约翰·阿尔弗雷德·亚历山大·李，新西兰工党政治家、作家，1891年10月31日生于达尼丁，父母未婚且家境赤贫，童年经历后成为其自传体小说素材。少年时数度因盗窃被判入感化院，此后浪迹各地打零工。一战中他志愿从军，因作战负伤失去一臂，获颁优异服务勋章，退伍当日即加入工党。1922年当选奥克兰东区议员，1931年起代表灰林区。1934年他以真实经历写成小说，题为穷人的孩子，反映大萧条时期的贫困与暴力，广受好评。1935年工党大胜后，他因作风张扬未获萨维奇纳入内阁，改任财政部政务次官，主持工党标志性的国家住房计划，成效显著。他逐渐成为工党左翼领袖，主张信用理论与更激进的社会主义路线，与财政部长纳什多次交锋。1939年萨维奇病重期间，他在左翼刊物上发表抨击萨维奇领导的文章，1940年3月25日被工党大会以546票对344票除名，两天后萨维奇病逝。他随即组建民主工党，但因作风专断很快失去支持，1943年大选中丢掉议席，政治生涯就此终结。此后他专事写作与经营书店。1982年6月13日在奥克兰去世，终年九十岁。"
 CBIO_NZL_john_ormond_desc:0 "约翰·戴维斯·怀尔德·奥蒙德，新西兰牧场主、商人，1905年9月8日生于怀普卡劳，祖父约翰·戴维斯·奥蒙德是霍克斯湾政坛要人，曾任霍克斯湾省督、公共工程部长。他就读于克赖斯特彻奇基督学院，1927年起经营家族在瓦林福德的大型牧场，历任怀普卡劳农牧业协会及赛马会会长。1930年代他是右翼激进团体新西兰军团的主要倡导者之一，1935年以独立改革派身份参选怀帕瓦选区、1938年代表国家党参选内皮尔选区，均落败。1939年8月与朱迪思·沃尔结婚，一周后二战爆发，他不顾政治导师戈登·科茨的劝阻应征入伍，随新西兰远征军赴中东，在希腊撤退中负伤，后调回国内任教官，晋升上尉。战后他长期担任新西兰肉类生产商局主席，并组建新西兰航运公司任主席至1979年。1964年封爵。1995年3月8日在瓦林福德家中去世，终年八十九岁。"
 CBIO_NZL_keith_j_holyoake_desc:0 "基思·雅卡·霍利约克，新西兰国家党政治家，1904年2月11日生于帕希亚图阿附近的斯卡伯勒，家族世代务农。十二岁因父亲病重辍学务农，由曾任教师的母亲在家教导。1932年在莫图埃卡补选中当选国会议员，年仅二十八岁即成为当时最年轻的议员。1935年工党大胜后，他参与将改革党与联合党残余力量整合为国家党，1936年国家党成立时是骨干成员之一。1938年因选区重划落选，返乡务农五年，其间历任农民联合会等农业组织要职。1943年补选代表帕希亚图阿重返国会，此后长期担任反对党前座议员，1947年出任副党魁。1949年国家党执政后任农业与市场部长，1954年正式获任副总理。1957年霍兰德因病辞职时指定他继任总理兼党魁，但执政仅两个月即在大选中败于工党。1960年他率国家党重新执政，此后连续四届蝉联总理直至1972年，是新西兰在任第三久的总理。1977年出任新西兰总督至1980年，是首位曾任总理者出任此职的政治家。1983年12月8日在惠灵顿去世。"
 CBIO_NZL_leslie_lefeaux_desc:0 "莱斯利·勒福，英国银行家，1886年4月28日出生，长期任职英格兰银行，历任副总出纳及总裁助理。1934年应新西兰政府之请由英格兰银行推荐，出任新成立的新西兰储备银行首任行长，其签名出现在该行首版纸币上。他作风拘谨保守，未能很好适应惠灵顿的生活，1935年工党上台后计划将储备银行完全收归国有，他一度愤而考虑辞职，经英格兰银行旧同僚劝说才留任。1940年任满离任，1946年返回英国。1962年11月11日去世，享年七十六岁。"
 CBIO_NZL_n_weir_desc:0 "诺曼·威廉·麦克唐纳·韦尔，1893年7月6日生于克赖斯特彻奇附近的希思科特谷，父亲是爱尔兰移民消防员。就读克赖斯特彻奇西区中学后，作为新西兰第一批学员赴澳大利亚邓特伦皇家军事学院深造，一战爆发后提前中断学业奔赴前线，在加里波利作战负伤。伤愈后转入新西兰参谋团，历任多个参谋职务。1930年受命统领一支拟赴西萨摩亚的宪兵队但未及成行。1937年以上校军衔随新西兰代表团赴伦敦出席乔治六世加冕礼，回国后任新西兰总督副官。二战爆发时他任北方军区中校指挥官，1940年晋升上校继而准将，指挥中央军区。1942年新西兰本土防御部队组建第四师，他晋升临时少将出任师长。1942至1944年他率部在中东与地中海战区随新西兰第二师作战，获记功嘉奖，1943年11月起任驻埃及新西兰部队司令，1945年回国任军需总监。1946年1月接替爱德华·帕蒂克出任新西兰军队总参谋长，其少将军衔转为实授，并获颁美国军功勋章。任内他主持新西兰第二远征军复员工作，并因应冷战局势主张恢复义务军训、重建国民军。1949年9月退役，1948年封爵。1961年7月11日在剑桥镇家中去世，终年六十八岁。"
 CBIO_NZL_norris_stephen_falla_desc:0 "诺里斯·斯蒂芬·法拉，1883年5月3日生于新西兰韦斯特波特，父亲是仓库管理员。十五岁进入联合汽船公司韦斯特波特分部做办公室勤杂工，后升初级职员，因表现出众被调至但尼丁总部，1906年取得新西兰会计师公会资格，1908年任利特尔顿分部副经理，1909年任巡回审计员，走遍全国各分公司。1919年回任总公司货运总经理，1922年随总部迁至惠灵顿。1925至1930年任总督府名誉副官，1927至1929年任中海岸炮兵团团长，获殖民地辅助部队军官勋章。1931年借调至联邦轮船公司任新西兰总经理，1934年因联合汽船公司常务董事戴维·艾肯病重被召回任总经理，同年艾肯去世后他继任；1936年公司创始人詹姆斯·米尔斯爵士去世后，他升任董事长。他推动公司在大萧条后复苏，1935至1939年间订购十一艘新船更新货运船队，并率先带领公司进军航空业：1934年参股东海岸航空公司，1935年参股库克海峡航空公司并创办联合新西兰航空公司，开辟国内主要城市间航线；他还推动新西兰皇家空军于1937年改组为独立军种，1938年获授名誉空军上校衔。1944年他获任联合公司母公司太平洋东方轮船公司及英印轮船公司董事。1945年他乘船返新西兰途中，于11月6日因脑溢血猝逝于海上，终年六十二岁。"
 CBIO_NZL_peter_phipps_desc:0 "彼得·菲普斯，1908年12月7日生于澳大利亚悉尼，在克赖斯特彻奇长大，就读于克赖斯特彻奇男子中学，毕业后供职于新西兰国民银行。因参加海童军对航海产生兴趣，1928年加入皇家海军志愿预备队新西兰分队，1930年获委任军官。二战爆发后他调赴英国服役，1940至1941年指挥反潜拖网渔船贝湾号在英吉利海峡护航，获杰出服务十字勋章。1942年返回新西兰指挥斯卡巴号扫雷艇，1943年指挥莫亚号在所罗门群岛参与击沉日军潜艇I-1的行动，获十字勋章加叙及美国海军十字勋章；同年莫亚号在图拉吉港被日机击沉，他受伤但生还。战后他转入新西兰皇家海军，指挥菲洛梅尔号训练基地期间妥善处理了1947年的哗变事件。1953年赴英国参加海军部行动处副处长任职培训，1955至1956年先后指挥贝洛纳号与皇家号巡洋舰。1957年成为首位进入新西兰海军委员会的本国军官，1960年出任海军参谋长，1963年出任新西兰首任国防参谋长，为该职首位新西兰人。1964年封爵，1965年以中将军衔退役。1989年9月18日死于车祸，终年八十岁。"
 CBIO_NZL_r_a_cochrane_desc:0 "拉尔夫·亚历山大·科克伦，苏格兰人，1895年2月24日生于法夫郡斯普林菲尔德，古尔特男爵托马斯·科克伦幼子。就读奥斯本与达特茅斯皇家海军学院，1912年任海军少尉，一战期间转入皇家海军航空勤务队驾驶飞艇，获颁空军十字勋章。1919年获英国皇家空军正式委任，历任第三、第八中队指挥官，1935年入帝国国防学院深造。1936年英国空军部应新西兰政府之请，派他赴新西兰考察建立独立空军的可行性；他提交报告，建议新西兰空军脱离陆军独立、设两个常备轰炸机中队并辅以预备役体系。报告获采纳后，他留任新西兰两年负责落实计划，1937年4月1日新西兰皇家空军正式成立，他出任首任参谋长，主持惠纳帕怀、奥哈卡等基地建设。1939年任满返回英国，历任多个轰炸机联队指挥官，1943年起指挥皇家空军轰炸机司令部第五大队，策划1943年惩戒行动（即水坝突击）及击沉德国战列舰提尔皮茨号等行动。战后历任运输司令部、飞行训练司令部总司令，主持1948至1949年柏林空运，1950年任副空军参谋长，1952年退役后转任罗尔斯罗伊斯公司董事。1977年12月17日在英格兰伯福德去世，享年八十二岁。"
 CBIO_NZL_robert_row_desc:0 "罗伯特·阿莫斯·罗，1888年7月30日生于新西兰克赖斯特彻奇，就读于克赖斯特彻奇男子中学与坎特伯雷学院，曾任商务旅行推销员。1909年加入民兵组织帝国步枪队，两年后转入准备役第一（坎特伯雷）团，晋升少校。一战爆发后随新西兰远征军赴中东，在加里波利战役中负伤，后转战西线，1917年晋升中校，指挥坎特伯雷团第三营参加梅森战役，因表现获杰出服务勋章。战后他留任新西兰参谋团，历任多个参谋职务，1933至1939年任惠灵顿中央司令部参谋官。二战中他随新西兰第二远征军司令部赴中东，希腊战役期间一度调至澳新军团司令部任职，1941年6月因太平洋局势紧张调回新西兰。1940年底起指挥第八旅驻防斐济以防范日本进攻，1943年该旅参加所罗门群岛战役，在宝藏岛战役的两栖登陆中立功，获杰出服务勋章勋表加叙及美国军功勋章。1943年12月他被调回新西兰，1944年退出现役，此后加入新西兰参谋团任文职参谋官。1959年1月7日去世，终年七十岁。"
 CBIO_NZL_vic_wilcox_desc:0 "维克多·乔治·威尔考克斯，新西兰农场工人、工会活动家，1912年11月6日生于英国伦敦威尔斯登，父亲是铁路调车员。约1923、24年随家人移居新西兰，父亲在北地怀哈拉拉经营奶牛场，他就读塔卡普纳文法学校，此后在北地各农场做工，1936至1939年任怀哈拉拉新西兰农民联合会分会秘书。大萧条中他广泛阅读马克思主义著作，转而认同苏联模式，1933年在怀哈拉拉组建苏联之友分会，次年加入新西兰共产党。1941年进入党全国委员会，1946年任全国执行委员会司库，同年起三度代表阿奇山选区参选国会均落败，其中1946年得票率百分之四点一是共产党候选人历来最高纪录。1951年接替西德·斯科特出任总书记，是该党最高领导人。1956年赫鲁晓夫秘密报告及苏联镇压匈牙利事件后，他逐步转向亲中立场，1963年率党签署联合声明公开倒向中国共产党，成为西方世界首个公开支持毛泽东路线的共产党总书记，此后多次访华并获毛泽东、周恩来、邓小平等接见。1966年约三分之一党员因不满其亲华路线出走另立亲苏的社会主义统一党。中国大陆转向三个世界理论后，他仍坚持亲华立场，1977年被剥夺党内职务，1978年被开除出党，此后组建亲华的筹备委员会，影响力已微。1989年4月29日因癌症在奥克兰亨德森的家中去世，终年七十六岁。"
 CBIO_NZL_w_a_veitch_milne_desc:0 "威廉·安德鲁·维奇，1870年5月25日生于苏格兰珀斯郡门蒂斯港，父亲是当地教师。1887年起在邮电部门工作，1889年移居新西兰，先淘金后重操电报旧业，同年加入新西兰铁路部门，从清洁工做起，1908年升至火车司机，其间长期活跃于铁路工人联合会，1908年当选全国会长。1911年他以独立工党候选人身份当选旺阿努伊议员，此后在自由党与工党之间几度转向：1912年加入新成立的联合工党，1913年统一大会上因反对罢工集中管控退场；1916年因反对征兵与政治工党运动决裂；1919年以温和工党身份连任，1922年改称自由工党，1925年正式加入自由党。1928年联合党成立后，他出任矿务、劳工、交通部长，1930年福布斯接任总理后转任铁路兼交通部长。1931年联合党与改革党组成联合政府后，他让出阁员席位给改革党人。1933年政府货币贬值政策出台后，他与另外四名议员一同游说唐尼·斯图尔特另组新党未果。1935年大选中落选，1943年代表国家党参选惠灵顿郊区选区仍未成功。1935年获乔治五世银禧奖章，1937年获加冕奖章。1961年1月1日在帕拉帕拉乌姆去世，终年九十岁。"
 CBIO_NZL_w_h_stratton_desc:0 "威廉·赫克托·斯特拉顿，1916年7月22日生于新西兰黑斯廷斯，自幼醉心飞行，1937年加入英国皇家空军，起初驾驶战斗机隶属第一中队参加1940年法国战役，5月14日击落一架容克87俯冲轰炸机，次日又击落一架梅塞施密特Bf110，为英国皇家空军首架被击落的该型机，机组因此获邀在巴黎马克西姆餐厅聚餐；19日他又击伤一架亨克尔He111。部队且战且退最终撤回英国后，他因法国战役战绩获颁优异飞行十字勋章。此后调往罗得西亚担任教官，1943年6月出任第134中队指挥官，在中东与印度作战期间又击落多架敌机，获优异飞行十字勋章加叙并获记功嘉奖。1944年初他正式转入新西兰皇家空军，同年5月卸任中队长返回新西兰。战后他历任多个参谋职务，1961年任副空军参谋长，1962年率评估团赴美考察新型海上巡逻机以替换老旧的桑德兰水上飞机，力主采购洛克希德P-3猎户座，说服了时任空军参谋长伊恩·莫里森，促成采购。1963年获颁大英帝国官佐勋章，1964年起赴伦敦任新西兰皇家空军总部指挥官三年，回国后任空军委员会人事委员。1969年7月出任空军参谋长，任内引进A-4天鹰攻击机服役，1970年获颁巴斯勋章司令勋位。1971年11月正式以空军副元帅衔退役。2005年12月27日在澳大利亚珀斯去世，享年八十九岁。"
 CBIO_NZL_walter_nash_desc:0 "沃尔特·纳什，新西兰工党政治家，1882年2月12日生于英格兰伍斯特郡基德明斯特，家境贫寒，幼年辍学做文员，后自学成才。1909年移居新西兰，随即加入工党，1919年起任党执行委员会委员长达四十余年。1929年补选当选惠灵顿哈特选区议员，此后连任十三届直至去世，是新西兰任职第四久的议员。1935年工党首次执政，他出任财政部长，在萨维奇与弗雷泽两届政府中主持财政十四年，为该职任期最长者。任内他主导储备银行国有化、担保乳品收购价、推动1938年社会保障法立法，并在二战期间实施物价管制、配给与增税以维持战时经济。1940年萨维奇去世后他当选副总理。1942至1944年任新西兰驻美国公使，参与太平洋战争委员会，并出席布雷顿森林会议。1949年工党败选后任反对党领袖，1957年率工党险胜重新执政，出任总理兼外交与毛利事务部长，但1958年黑色预算引发的加税风波致工党1960年大选惨败。此后再度出任反对党领袖至1963年，1965年封爵。1968年6月4日在奥克兰去世，终年八十六岁。"
 CBIO_NZL_william_polson_desc:0 "威廉·约翰·波尔森，新西兰政治家，1875年6月6日生于旺阿努伊，苏格兰移民后裔，就读旺阿努伊学院。毕业后在父亲农场务农，因病休养期间自学速记，后转行做记者。1920至1921年任新西兰农民联合会惠灵顿省会长，1921年起任全国会长长达十五年，任内该会因反对政府政策而声名渐著，他推动1922年肉类出口管制法案以保护农民收益。1928年当选斯特拉特福选区独立议员，1936年国家党成立后加入该党，并辞去农民联合会会长职务。1940年国家党党魁之争中，他支持西德尼·霍兰德击败戈登·科茨与亚当·汉密尔顿一派，此后成为霍兰德倚重的非正式副党魁，以维系该党城乡两翼团结。1942年任战时行政当局初级产品部长，同年十月辞职，1943年霍兰德出访期间代理反对党领袖。他力主新西兰军队部署于太平洋战区而非欧洲。1946年因选区撤销退出国会，1950年出任末届立法院议长，负责主持该院解散事宜。1951年封爵。1960年10月8日在芒阿马胡去世，终年八十五岁。"
 CBIO_NZL_william_sinclair_burgess_desc:0 "威廉·利文斯顿·哈奇韦尔·辛克莱-伯吉斯，1880年2月18日生于英格兰曼彻斯特朗赛特，父母离异后随改嫁的母亲移居新西兰，因继父乔治·伯吉斯而改姓伯吉斯，1926年结婚后恢复生父姓氏辛克莱，两姓合并为辛克莱-伯吉斯。他年轻时当过木匠与工程师，1898年加入新西兰志愿部队，1911年转入常备军，成为新西兰参谋团首批军官之一。一战爆发时他正以交换军官身份在澳大利亚服役，遂随澳新军团参加加里波利战役，任第九炮兵连指挥官并两次负伤；转战西线后指挥第三野战炮兵旅，获颁杰出服务勋章、六次获记功嘉奖，并获法国荣誉军团勋章，是新西兰军队中仅十四人获此殊荣者之一。1919年回国后历任新西兰军队总部参谋、军事情报与训练主任，1924年晋升上校并出任总参谋长，1928年晋准将。1931年晋少将，出任新西兰军队司令兼总参谋长，任内正值大萧条财政紧缩，他仍推动重整因裁撤义务军训而萎靡的国民军，并因应日本侵占中国东北与进犯上海的局势推动六年扩军计划，促成飞机采购等建议获采纳。1934年封爵士，1935年获KBE勋衔并延任两年，1937年退役，该职随之废止。二战爆发后他曾自荐服役，但未获采纳。晚年他以早年木工手艺自建房屋，1959年毁于火灾，军中同僚集资为他补置勋章。1964年4月3日在惠灵顿附近伊斯特本去世，终年八十四岁。"
 CBIO_NZL_william_stevens_desc:0 "威廉·乔治·史蒂文斯，1893年12月11日生于伦敦，父亲是新西兰航运公司职员，1895年随家人移居新西兰，就读于奥克兰文法学校。原拟报考澳大利亚皇家军事学院，但因体检查出心脏杂音未能入学，遂改任新西兰炮兵军官。1916年随新西兰师赴法国，在阿芒蒂耶尔一带作战，因骑马事故负伤回英国疗养，其间召未婚妻自奥克兰赴伦敦成婚。战后历任新西兰陆军多个参谋及训练职务，1937年出任新西兰国防委员会秘书，调至总理府任职。二战中他任新西兰第二师及第二远征军司令部行政主任，1940年10月起专职负责远征军总部行政事务直至战争结束，1942年起兼管开罗马迪营地。他自称在弗赖伯格麾下任参谋官是一生中最宝贵的经历。战后他撰写了新西兰官方战史中的两卷及一部弗赖伯格研究专著。1975年8月7日因心脏病发作在纳尔逊医院去世，终年八十一岁。"
