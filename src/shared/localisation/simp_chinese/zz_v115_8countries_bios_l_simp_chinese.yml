l_simp_chinese:
 ARM_calouste_gulbenkian_desc:0 "卡洛斯特·萨尔基斯·古尔本基扬（1869年3月23日，生于奥斯曼帝国斯库台—1955年7月20日，卒于葡萄牙里斯本），亚美尼亚裔石油大亨，绰号“5%先生”。早年在伊斯坦布尔及伦敦从事石油行业金融与中介业务，凭借对中东石油资源潜力的先见之明以及卓越的商业谈判才能，在伊拉克石油公司（IPC）及其前身土耳其石油公司中持有5%的股份，由此获得“5%先生”之称。他是将英、法、荷、美各国石油巨头联合起来共同开发伊拉克石油资源的关键斡旋者。一生积累了巨额财富，同时也是一位热情的艺术收藏家，逝世后其遗产成立了里斯本古尔本基扬基金会，至今仍是世界最富有的慈善基金会之一。他虽与伊拉克石油开发关系极深，但本人是亚美尼亚裔商业人物，并非伊拉克本国政军官员。"
 BUL_atanas_zhilkov_desc:0 "阿塔纳斯·帕夫洛夫·日尔科夫生于1888年10月14日，保加利亚陆军中将。日尔科夫长期在骑兵和军队指挥系统任职，1936年至1941年担任骑兵监察官。第二次世界大战前后，他进入最高统帅部系统，1941年至1944年任最高统帅部通信主任，负责战时通信和指挥保障事务。1940年南多布罗加回归保加利亚的过程中，他也参与过相关军事委员会工作。日尔科夫的履历主要集中在骑兵监察、通信和参谋保障岗位，1955年去世。"
 BUL_dobri_bozhilov_desc:0 "多布里·博日洛夫·哈吉扬纳基耶夫，科泰尔人，斯维什托夫高等商业学校毕业后于1902年起在保加利亚国民银行任职，此后三十六年间历任该行行长职务达五届（1922—1938年间断续在任），1938年11月出任乔塞瓦诺夫内阁财政大臣，菲洛夫接任总理后仍留任该职。1943年鲍里斯三世猝逝后，摄政团首席摄政菲洛夫将其提拔为总理（兼财政大臣），任内几乎完全追随德国政策、实质沦为傀儡，唯一例外是拒绝执行纳粹关于遣送保加利亚本土犹太人的要求。1944年6月，随着轴心国战局急剧恶化，博日洛夫辞去总理职务，重返国民银行出任行长。1944年9月祖国阵线政变后被捕，1945年2月1日经人民法庭以战争罪判处死刑并没收全部财产，判决翌日凌晨执行，1996年获最高法院平反。"
 BUL_ferdinand_i_desc:0 "斐迪南一世（1861年2月26日—1948年9月10日），萨克森-科堡-哥达家族出身，生于维也纳，1887年经保加利亚国民议会选举出任保加利亚亲王，1908年趁奥匈吞并波黑之机宣布保加利亚完全独立并自封沙皇。在位期间大力推动国家现代化，扩充军力，主导发起1912年首次巴尔干战争的巴尔干同盟，却在1913年第二次巴尔干战争中因树敌过多而遭塞、希、罗、奥斯曼四面围攻惨败。一战中他执意加入同盟国一方作战，寄望借此夺回失地，1918年9月保加利亚军队在马其顿战线全面崩溃、国内爆发兵变，10月3日在协约国压力下被迫退位，传位于长子鲍里斯三世，即于次日出走德国科堡，此后三十年终生流亡未再踏足保加利亚国土。流亡期间他寄情于园艺、鸟类学、昆虫学等博物学研究，1922年曾获准返索非亚短暂停留即遭南斯拉夫强烈抗议而作罢。晚年接连遭受打击：1943年长子鲍里斯三世离奇猝逝，1945年次子基里尔亲王被保加利亚人民法庭处决，1946年公投废除君主制、幼孙西美昂二世被逐流亡。1948年在科堡逝世，终年87岁，至死仍自称保加利亚人的沙皇。"
 BUL_georgi_ivanov_kyoseivanov_desc:0 "格奥尔基·伊万诺夫·乔塞瓦诺夫（1884年1月19日—1960年7月27日），保加利亚政治家、外交官，1935年11月23日出任总理并兼任外交大臣，任职至1940年2月，是继利亚普切夫之后在任时间最长的总理。其政府主持审判1934年政变主谋，并与南斯拉夫、希腊签订和解条约，借助与希腊总理梅塔克萨斯达成的协议突破《讷伊条约》与《洛桑条约》的军事限制条款、推行重整军备。尽管在任近五年，其内阁实质上被视为鲍里斯三世个人独裁统治的政治工具，未能取得实质性施政成就，仅令国王得以借国王政府之名行绝对君主之实。1940年卸任后转任驻瑞士公使，此后长驻瑞士，1944年祖国阵线政变后未归国，1960年在瑞士逝世。"
 BUL_georgi_petsov_desc:0 "格奥尔基·格奥尔基耶夫·佩佐夫，1899年11月21日生于加布罗沃，1970年8月10日卒于瓦尔纳，保加利亚海军一级舰长。1917年入索非亚军事学校，1920年完成海军军官课程后进入多瑙河海上警察部队服役，后任海军学校教官。1927年被派往德国柏林学习水文学与气象学，1931年以黑海气旋研究论文取得物理海洋学博士学位，成为少见的学者型海军军官。回国后历任“斯梅利”号鱼雷艇艇长、海军学校负责人和舰队参谋长。1944年保加利亚政局急转，他由阿森·托舍夫手中接任海军司令，同年12月又将职务移交斯特凡·托舍夫·察内夫。佩佐夫的分量不在海战功绩，而在海军教育、气象水文与黑海专业化建设。"
 BUL_hristo_lukov_desc:0 "赫里斯托·尼古拉夫·卢科夫，保加利亚陆军中将、政治家，1935—1938年任军事大臣。一战期间晋升少校并任炮兵营长（常被误传为一战末期第13步兵师师长，实为同名的另一位赫里斯托·卢科夫（茨奥内夫）将军，二者并非同一人）。战间期历任炮兵学校校长、总参谋部炮兵督察训练处处长、第2及第3步兵师师长。1935—1938年任军事大臣期间，他与纳粹德国高层建立密切联系，力主秘密扩军突破《讷伊条约》限制，任内寻求德方技术转让、军官培训及军购合作。1938年被免职并转入预备役后，他转而专注于极右翼组织保加利亚国民军团联盟（简称军团），该组织奉行反犹、反共及威权国家主义，1941年该联盟支持通过带有种族歧视性质的《保卫民族法》，其1942年纲领公开将犹太人列为需要打击的对象。1942年1月他统一整合了此前分裂的两派军团势力，出任统一后的联盟领袖直至遇刺，德国使馆官员曾一度提议由他取代王室建立法西斯政权。1943年2月13日晚，两名保加利亚共产党抵抗运动成员（伊万·布鲁贾耶夫及维奥莱塔·亚科娃）在其索非亚寓所前将其枪杀，一人中弹后仍反抗，最终被亚科娃补射身亡。21世纪以来，极右翼团体保加利亚民族联盟每年二月在索非亚举行以其名字命名的卢科夫游行纪念活动，因涉及新纳粹色彩而屡遭禁止及强烈争议。"
 BUL_kiril_stanchev_desc:0 "基里尔·尼古拉夫·斯坦切夫（1895年12月14日—1968年4月11日），生于丘斯滕迪尔，1916年索非亚军校毕业授少尉衔，一战期间在马其顿战线服役，历经晋升，1933年升少校。战间期历任边防部队、步兵团及第2步兵师军官，兼任军事学院教官，是军官同盟成员，并创立同盟内部秘密的亲共和派上尉运动。因参与1934年政变及其共和派立场，1935年鲍里斯三世巩固权力后被开除军籍并判处死刑，后改判无期徒刑；1940年获赦、恢复军籍，同年10月晋上校，1941—1944年在索非亚大学攻读法律。1944年祖国阵线政变后，他率领保加利亚第2集团军参与对德作战，在尼什战役和科索沃战役中指挥保军协同南斯拉夫游击队及苏军作战击败当地德军，因战功于1944年11月18日晋升中将。然而1946年，他被以参与“军官同盟”密谋政变罪名逮捕——现代史学界普遍认为该指控系保加利亚国家安全部门捏造，意在清除对新政权忠诚度存疑的旧军官、并虚构军队与农民党反对派的关联。斯坦切夫始终拒绝招供，也拒绝牵连他人。1968年在索非亚逝世。"
 BUL_konstantin_muraviev_desc:0 "康斯坦丁·弗拉多夫·穆拉维耶夫（1893年3月5日—1965年1月31日），帕扎尔吉克人，农民同盟领袖斯坦博利伊斯基之侄，1923年年仅29岁即在其舅父政府中出任军事大臣，因未能及时正视政变风险而被视为该政府垮台的重要原因之一，1931—1934年联合政府中历任多个内阁职务，逐渐挽回政治声誉，二战期间是议会合法反对派中最活跃的领袖之一。1944年9月2日，在盟国拒绝其前任巴格里亚诺夫的求和努力后，摄政团任命穆拉维耶夫组阁以争取西方盟国接受，其内阁明确排除祖国阵线及农民同盟左翼势力，9月5日废除全部排犹法律，9月8日对纳粹德国宣战，但为时已晚——苏联已于9月5日单方面对保加利亚宣战，9月9日祖国阵线发动政变将其推翻，在任仅一周有余。与同时代多数政要不同，穆拉维耶夫战后未被处决，但被判无期徒刑，监禁至1955年，1956年再度被捕关押至1961年方获释，此后基本接受了新政权现实，1961年还曾与祖国阵线人士会谈，因此遭部分右翼农民同盟旧部谴责。1963年出版回忆录《事件与人物》。1965年在索非亚逝世。"
 BUL_nikola_hadzipetkov_desc:0 "尼古拉·哈吉佩特科夫（1891年—1949年），保加利亚陆军中将，1938年12月10日至1941年8月11日出任保加利亚陆军总参谋长，是1941年保加利亚参与轴心国行动前夕的军队最高指挥官，其后由康斯坦丁·卢卡什接任该职。1949年逝世。"
 BUL_nikola_nakov_desc:0 "尼古拉·科切夫·纳科夫（1892年2月24日，生于弗拉察—？），1913年毕业于索非亚军校，历任第3边境步兵团及第54比托拉步兵团军官。1929年起任军事大臣副官，1932年任近卫营营长，1934年任第4普列文步兵团团长。1935年晋上校并出任第1索非亚步兵师参谋长，1938年升任该师师长，1940年10月晋少将。1942年4月11日至1944年9月13日任保加利亚第1集团军司令。1944年9月13日以服役满25年为由被解职，实为祖国阵线新政权对旧军官系统展开的首轮清洗之一。此后遭人民法庭审判，据保加利亚史料记载他与卢卡什、斯坦切夫等多名将领一同在1945年的大规模政治清算中被处决。"
 BUL_stoyan_stoyanov_desc:0 "斯托扬·伊利耶夫·斯托亚诺夫（1913年3月12日，生于加拉塔村（今属瓦尔纳）—1997年3月13日），出生前五个月，其父作为瓦尔纳第8海军团旗手在巴尔干战争中阵亡于埃迪尔内附近，他因此被瓦尔纳战争孤儿学校收留，少年时曾在街头卖报维生。1930年入索非亚国家神学院就读中学，1934年获奖学金入读高等军官学校。1938年被派往德国接受飞行训练，先后在考夫博伊伦完成特技飞行课程、在柏林附近的韦尔诺伊兴高级战斗机飞行员学校深造，1939年学成回国后曾培训多名后来成为保加利亚王牌飞行员的同僚，本人也在卡尔洛沃机场飞行员学校任教官，训练飞行员驾驶新到货的Bf109战斗机。二战期间他驾驶Bf109参与保卫索非亚领空的多次空战，主要战果集中在1943—1944年间击落及击伤美军B-24、B-17轰炸机及P-38战斗机等，官方战绩为15次确认击落，是二战期间保加利亚皇家空军战绩最高的王牌飞行员。战后他在人民空军短暂留任，1945年3月保加利亚接收120架苏制雅克-9M战斗机后负责培训新飞行员，1956年以微薄军人抚恤金被强制退役，此后三十年在里拉修道院担任导游维生。1997年逝世，享年84岁。"
 BUL_vasil_boydev_desc:0 "瓦西尔·捷涅夫·博伊德夫，上校捷纽·博伊德夫之子、中校安东·博伊德夫之兄，参加两次巴尔干战争及一战。1936年10月6日出任保加利亚空军司令，此后近五年间积极推动这一此前受《讷伊条约》严格限制的新兴军种的恢复与建设。1941年8月11日接替尼古拉·米霍夫将军出任新组建的第5集团军司令，负责占领南斯拉夫马其顿及皮罗特地区，1944年5月11日因不满摄政团（以菲洛夫为首）及军事大臣鲁西·鲁塞夫坚持的亲德路线而辞职退役。1945年他被人民法庭审判定罪并送往劳改营，刑满后又被强制安置于特罗扬，与妻子在当地共同生活直至1983年逝世。"
 CBIO_ARM_calouste_gulbenkian_desc:0 "卡洛斯特·萨尔基斯·古尔本基扬（1869年3月23日，生于奥斯曼帝国斯库台—1955年7月20日，卒于葡萄牙里斯本），亚美尼亚裔石油大亨，绰号“5%先生”。早年在伊斯坦布尔及伦敦从事石油行业金融与中介业务，凭借对中东石油资源潜力的先见之明以及卓越的商业谈判才能，在伊拉克石油公司（IPC）及其前身土耳其石油公司中持有5%的股份，由此获得“5%先生”之称。他是将英、法、荷、美各国石油巨头联合起来共同开发伊拉克石油资源的关键斡旋者。一生积累了巨额财富，同时也是一位热情的艺术收藏家，逝世后其遗产成立了里斯本古尔本基扬基金会，至今仍是世界最富有的慈善基金会之一。他虽与伊拉克石油开发关系极深，但本人是亚美尼亚裔商业人物，并非伊拉克本国政军官员。"
 CBIO_BUL_aleksandar_tsankov_desc:0 "亚历山大·佐洛夫·灿科夫（1879年6月29日—1959年7月27日），索非亚大学政治经济学教授，1922年组建保守派国民联盟，1923年6月9日军事政变推翻斯坦博利伊斯基政府后即出任总理，任职至1926年1月。任内他残酷镇压保共及左翼农民派力量，1925年在沙皇遇刺未遂及索非亚圣周日教堂爆炸案后宣布戒严、取缔保共，共产国际因此斥其政权为胜利的保加利亚法西斯集团；同期与希腊爆发短暂边境冲突。1926年因未能获得外国贷款支持而下台。此后他逐渐转向法西斯主义并崇拜希特勒，1932年仿照纳粹党模式组建民族社会运动，但该运动始终未获纳粹德国正式青睐（后者更倚重保加利亚国民军团联盟），影响力有限。1943年他是右翼阵营中少数联署佩舍夫反对遣送犹太人请愿书的议员之一。1944年9月祖国阵线政变后，纳粹德国在奥地利扶植灿科夫组建保加利亚流亡傀儡政府，为期数月，战后曾被美军拘押于奥地利，获释后流亡阿根廷，1959年在布宜诺斯艾利斯逝世。"
 CBIO_BUL_angel_dotsev_desc:0 "安杰尔·格奥尔基耶夫·多采夫，保加利亚陆军少将，1941—1942年间曾作为保加利亚军方考察团军官之一被派往德军东线观摩，与康斯坦丁·卢卡什等人一同亲历德军对苏作战。1980年逝世。"
 CBIO_BUL_asen_nikolov_desc:0 "阿森·尼科洛夫·尼科洛夫（1891年9月12日，生于扬博尔—1946年），1912年毕业于索非亚军校。1923年起在瓦尔纳海岸要塞服役，1934年出任索非亚炮兵学校校长，1936年任第2军事督察区炮兵处处长兼炮兵督察部防空处处长，1938年出任第2色雷斯步兵师师长。1941年起出任保加利亚第1占领军军长，率部协同德军参与占领塞尔维亚的治安作战。1944年9月保加利亚倒戈对德后，他于同年9月4日被德军俘虏。1944年10月，他拒绝参与组建效忠德国一方作战的保加利亚部队。1946年逝世。"
 CBIO_BUL_asen_toshev_desc:0 "安德烈·斯拉沃夫·托舍夫，斯塔拉扎戈拉人，植物学教授兼职业外交官，1898年当选保加利亚文学学会（保加利亚科学院前身）通讯院士，1931年升任正式院士，长期从事巴尔干地区植物区系研究，著述颇丰。外交生涯始于1908年，先后出任驻黑山（1905—1906）、希腊（1906—1908）、塞尔维亚（1909—1913）及奥斯曼帝国（1913—1915）公使，任驻塞公使期间为促成巴尔干同盟的形成发挥了重要斡旋作用，一战期间转任驻维也纳公使（1915—1919），期间一度兼任驻伯尔尼临时代表。1919年退出职业外交界后专注于保加利亚少数族裔权益保护及历史民族学写作。1935年4月21日，在环节集团军事统治结束、鲍里斯三世发动反政变夺回大权之际，年已68岁的托舍夫受命组阁，成为国王巩固个人统治的过渡性文官内阁负责人，同年11月即因。此后重归学术著述，1944年在索非亚逝世。"
 CBIO_BUL_atanas_zhilkov_desc:0 "阿塔纳斯·帕夫洛夫·日尔科夫生于1888年10月14日，保加利亚陆军中将。日尔科夫长期在骑兵和军队指挥系统任职，1936年至1941年担任骑兵监察官。第二次世界大战前后，他进入最高统帅部系统，1941年至1944年任最高统帅部通信主任，负责战时通信和指挥保障事务。1940年南多布罗加回归保加利亚的过程中，他也参与过相关军事委员会工作。日尔科夫的履历主要集中在骑兵监察、通信和参谋保障岗位，1955年去世。"
 CBIO_BUL_blagoi_ivanov_desc:0 "布拉戈伊·伊万诺夫，保加利亚陆军中将。二战期间他是保加利亚共产党领导的人民解放起义军（游击队）核心成员之一，1944年7月起进入该组织领导核心。1944年祖国阵线上台后，在新组建的人民军中晋升中将，曾出任战后组建的保加利亚解放军部队指挥官。"
 CBIO_BUL_bogdan_filov_desc:0 "波格丹·菲洛夫，斯塔拉扎戈拉人，考古学家出身，曾赴德国莱比锡、弗赖堡、维尔茨堡留学，获古典学及罗马史博士学位，此后长期在波恩、巴黎、罗马研修考古学、博物馆学及钱币学，是保加利亚古典考古学的奠基性人物，1910—1920年任国家考古博物馆馆长，1920年创立并首任保加利亚考古研究所所长，主持发掘迈泽克色雷斯圆顶墓等重要遗址，1929年当选保加利亚科学院院士，获多国科学机构荣誉头衔。1938年出任乔塞瓦诺夫内阁教育大臣，1940年2月接任总理，任内保加利亚成为第七个加入轴心国阵营的国家，1941年3月签署《三国同盟条约》；同年11月其内阁提出、经议会通过的《保卫民族法》确立了针对犹太人的种族歧视立法。1943年鲍里斯三世猝逝后，菲洛夫以总理身份兼任摄政团首席摄政，与基里尔亲王、米霍夫将军共同辅佐幼主西美昂二世。1944年9月祖国阵线政变后被捕，1945年2月1日经共产党主导的人民法庭以战争罪及通敌罪判处死刑，与其他92名前政要同夜遭枪决，弃于炸弹坑集体掩埋，其死刑判决于1996年被保加利亚最高法院撤销平反。"
 CBIO_BUL_boris_iii_desc:0 "鲍里斯三世（1894年1月30日—1943年8月28日），斐迪南一世长子，1918年10月其父战败退位后即位为沙皇，在位至1943年猝逝。即位初期保加利亚政局动荡，历经农民同盟斯坦博利伊斯基政府、1923年军事政变及九月起义、灿科夫镇压等乱局。1934年环节集团政变解散政党后，鲍里斯于1935年发动反政变夺回实权，此后以国王政府名义推行事实上的君主个人独裁，不再恢复政党政治。二战爆发后力图中立，1940年借轴心国斡旋从罗马尼亚收回南多布罗加，1941年3月被迫签署《三国同盟条约》倒向轴心，并借德军之势占领南斯拉夫、希腊部分领土；但他拒绝向苏联宣战，仅对英美象征性宣战。1941年批准通过带有种族歧视色彩的《保卫民族法》，但1943年面对纳粹要求遣送本土犹太人时以筑路劳工需要为由一再拖延，在国内舆论及东正教会领袖压力下最终实际拒绝执行遣送令，约4.8万名保加利亚本土犹太人因此幸免于难，但同期他仍批准将约1.1万名马其顿、色雷斯占领区犹太人交予德方。1943年8月希特勒召其至东普鲁士总部当面质问，双方就出兵苏联及犹太人问题激烈交锋，鲍里斯坚持拒绝。返回索非亚仅十余天后，他于8月28日突然病逝，官方诊断为心脏病发，但因死因蹊跷，当时及后世均流传毒杀猜测（疑德方或苏方所为），真相至今未有定论。其六岁幼子西美昂二世继位，由菲洛夫等组成摄政团。"
 CBIO_BUL_damian_velchev_desc:0 "达米扬·韦尔切夫，加布罗沃人，1925—1935年任军官同盟领袖，1930年加入环节集团。1934年5月19日政变的实际策划核心，但刻意隐身幕后、未在新内阁中任职，以避嫌争权，转而力促基蒙·格奥尔基耶夫出任总理。1935年鲍里斯三世反政变后，他一度流亡海外，此后潜回国内图谋再度政变，事泄被捕，1936年被判死刑，经国王特赦改判无期徒刑，监禁至1941年获释。1943年他加入反轴心的祖国阵线。1944年祖国阵线政变成功后，他以上将军衔出任国防大臣，1946年因军队内部清洗问题辞职。此后转任驻瑞士大使，任职一段时间后辞职并申请政治庇护，此后一直侨居瑞士直至逝世。"
 CBIO_BUL_dimitr_ayryanov_desc:0 "迪米塔尔·瓦西列夫·阿伊拉诺夫，出身军人世家，其父瓦西尔·阿伊拉诺夫为解放后首批军官之一。1912年毕业于索非亚军校，参加两次巴尔干战争及一战，1917年获三枚勇敢勋章及德皇威廉二世颁授的铁十字勋章。1929年起进入沙皇侍从武官团，历任汽车营营长、第2工兵团团长、总参谋部工程督察处处长等职，1938年任第4步兵师师长并率部参与收复南多布罗加，1940年10月晋少将。1941年8月至1944年9月出任保加利亚空军司令，任内主持制定该军种平战两用编制体系，1943年3月下令兴建格拉夫伊格纳季耶沃机场并组建保加利亚陆军首支伞兵部队。1944年9月13日被解职，1945年3月15日被人民法庭判处无期徒刑，狱中审判记录显示其虽被控对德谄媚，但证人证词多证实他实际上告诫年轻军官提防德方、避免透露信息。1948年前后仍在服刑期间抱有获释希望，但1950年在狱中被秘密杀害，官方长期讳莫如深，1990年代解密档案证实此案系由国家安全部门下令执行。"
 CBIO_BUL_dimitrana_ivanova_desc:0 "迪米特拉娜·伊万诺娃，商人之女，保加利亚教育改革家、妇女参政权运动领袖。因当时保加利亚女子中学学制不足、无法满足索非亚大学入学要求，她转赴瑞士苏黎世大学攻读教育学与哲学，成为该校首位女性在读生。1900年回国后任教于波波沃、舒门、普列文、大特尔诺沃及鲁塞等地，1905年起为《教师觉醒》《妇女之声》等刊物撰稿，1920—1944年出任《妇女之声》主编。1911年6月作为鲁塞妇女协会代表出席保加利亚妇女联盟大会，此后长期投身妇女选举权及家庭、母婴社会保障议题，1925年参与创立儿童保护协会并任理事至1935年。1921年首次申请入读索非亚大学法学院被拒（官方理由为中学学历不完整），经长期抗争后于1927年毕业，成为保加利亚首批获准执业的女律师之一。1926—1944年任保加利亚妇女联盟主席，任内力争女性执业律师及法官资格、争取妇女选举权，1937年促成已婚、离异或丧偶且年满21岁的妇女获得市政选举投票权（尚不含被选举权）。1944年9月28日祖国阵线政变后，她因与德国方面联系密切而以亲德、亲法西斯嫌疑被捕，四个月后获释但被限令离开索非亚、迁居鲁塞，后获准返回索非亚。1960年在索非亚逝世，享年79岁。"
 CBIO_BUL_dobri_bozhilov_desc:0 "多布里·博日洛夫·哈吉扬纳基耶夫，科泰尔人，斯维什托夫高等商业学校毕业后于1902年起在保加利亚国民银行任职，此后三十六年间历任该行行长职务达五届（1922—1938年间断续在任），1938年11月出任乔塞瓦诺夫内阁财政大臣，菲洛夫接任总理后仍留任该职。1943年鲍里斯三世猝逝后，摄政团首席摄政菲洛夫将其提拔为总理（兼财政大臣），任内几乎完全追随德国政策、实质沦为傀儡，唯一例外是拒绝执行纳粹关于遣送保加利亚本土犹太人的要求。1944年6月，随着轴心国战局急剧恶化，博日洛夫辞去总理职务，重返国民银行出任行长。1944年9月祖国阵线政变后被捕，1945年2月1日经人民法庭以战争罪判处死刑并没收全部财产，判决翌日凌晨执行，1996年获最高法院平反。"
 CBIO_BUL_ferdinand_i_desc:0 "斐迪南一世（1861年2月26日—1948年9月10日），萨克森-科堡-哥达家族出身，生于维也纳，1887年经保加利亚国民议会选举出任保加利亚亲王，1908年趁奥匈吞并波黑之机宣布保加利亚完全独立并自封沙皇。在位期间大力推动国家现代化，扩充军力，主导发起1912年首次巴尔干战争的巴尔干同盟，却在1913年第二次巴尔干战争中因树敌过多而遭塞、希、罗、奥斯曼四面围攻惨败。一战中他执意加入同盟国一方作战，寄望借此夺回失地，1918年9月保加利亚军队在马其顿战线全面崩溃、国内爆发兵变，10月3日在协约国压力下被迫退位，传位于长子鲍里斯三世，即于次日出走德国科堡，此后三十年终生流亡未再踏足保加利亚国土。流亡期间他寄情于园艺、鸟类学、昆虫学等博物学研究，1922年曾获准返索非亚短暂停留即遭南斯拉夫强烈抗议而作罢。晚年接连遭受打击：1943年长子鲍里斯三世离奇猝逝，1945年次子基里尔亲王被保加利亚人民法庭处决，1946年公投废除君主制、幼孙西美昂二世被逐流亡。1948年在科堡逝世，终年87岁，至死仍自称保加利亚人的沙皇。"
 CBIO_BUL_ferdinand_kozovski_desc:0 "费迪南德·托多罗夫·科佐夫斯基（1892年1月27日—1965年9月12日），生于克涅扎，1911年加入保加利亚工人社会民主党（窄派），曾参加两次巴尔干战争及一战。战后于索非亚大学攻读法律，1923年是发动反抗六月政变的六月起义领导人之一，同年又参与更具组织性的保共九月起义，起义失败后被迫流亡苏联，毕业于伏龙芝军事学院，此后在西方少数民族共产主义大学任军事学讲师。1936—1939年参加西班牙内战，加入国际纵队，后升任第12国际旅副司令。二战期间他主持莫斯科对保加利亚广播的保语频道并编辑多份地下出版物。1944年祖国阵线政变后返回保加利亚，在保军驱逐纳粹出南斯拉夫及匈牙利的行动中任副总参谋长。战后任国防部副部长，1948—1949年任驻匈牙利公使，1949—1950年任驻中华人民共和国公使。1950年起出任国民议会主席，连任四届议会主席直至1965年逝世，是国际纵队退伍军人中在本国议会体系内担任职务最高者。"
 CBIO_BUL_gancho_manchev_desc:0 "甘乔·伊万诺夫·曼切夫，1917年毕业于索非亚军校炮兵专业，参加一战，1918年转入航空兵。两战间历任混合航空联队副官、中队长、机场指挥官等职，1935年因涉入反君主共和派军官案被军队开除并被捕，判处八年徒刑，服刑五年后于1940年获释。1944年9月9日祖国阵线政变前夕，他受命协调特利什空军基地参与政变行动。政变成功后，他于1944年10月23日接替格奥尔基·德列尼科夫出任空军司令并晋升少将，指挥保加利亚空军参与祖国战争（1944—1945年对德作战）。1946年11月被解除军职。1948年一度被捕入狱两月后获释，1951年4月在德良诺沃再度被捕，指控其涉嫌密谋推翻祖国阵线政府、意图使保加利亚重投资本主义阵营，被关押至1954年12月，先后辗转瓦尔纳监狱及别列内劳改营，后经军事法庭宣判无罪获释。1968年在索非亚逝世。"
 CBIO_BUL_georgi_dimitrov_desc:0 "格奥尔基·米哈伊洛维奇·季米特洛夫（1882年6月18日—1949年7月2日），生于科瓦切夫齐村，印刷工出身，早年投身工会运动，1902年加入保加利亚工人社会民主党，后随布拉戈耶夫转入窄派，1919年该派改组为保加利亚共产党。一战期间任议员，因反对战争信贷及民族主义于1915年遭短期监禁。1923年斯坦博利伊斯基政府被政变推翻后，他与科拉罗夫领导九月起义反抗灿科夫政权，起义失败，二人经南斯拉夫流亡维也纳，季米特洛夫被缺席判处死刑。此后长期担任共产国际中欧局负责人，1933年国会纵火案后遭纳粹指控为纵火同谋，在莱比锡审判中他拒绝律师代理、亲自当庭反击戈林等纳粹指控者，最终因证据不足获判无罪释放，一举成为全球反法西斯运动的标志性人物，被誉为德国唯一的勇敢者。1935年起任共产国际总书记直至1943年该组织解散，此间提出人民阵线策略，主张联合各国社会民主党及反法西斯力量共同抵抗纳粹。二战期间他侨居莫斯科，遥控指导保加利亚国内的抵抗运动及祖国阵线的筹建（1942年）。1945年11月返回保加利亚，1946年经大国民议会选举出任总理，主导建立共产党主导的一党体制，1947年推动通过苏联模式宪法。1949年7月在莫斯科附近逝世，遗体运回索非亚安葬于专为其修建的陵墓。"
 CBIO_BUL_georgi_drenikov_desc:0 "格奥尔基·斯托伊门诺夫·德列尼科夫，1917年毕业于索非亚军校，一战期间在切尔纳河湾战线作战，因战功获三枚勇敢勋章及德方颁授的铁十字勋章、功勋勋章。战间期投身航空事业，1928年取得第56号飞行员证书，历任侦察中队长、混合航空联队队长等职，1935年赴德国格林瑙学习滑翔飞行并获教员资格，同年在布雷日尼克创办保加利亚首所滑翔飞行学校里拉之鹰，1936年柏林奥运会滑翔项目获铜牌，翌年欧锦赛获银牌，是保加利亚航空运动的奠基人之一。1939年起任卡尔洛沃机场航空教导团团长，1941年3月起任驻保加利亚德国第8航空军联络组组长，因贡献获纳粹德国最高航空荣誉白鹰勋章指挥官级十字勋章。1942年任分驻卡尔洛沃等十处机场的教导部队指挥官。1944年9月9日祖国阵线政变后，他以上校军衔临时出任空军司令，任内致力避免部队陷入混乱、协助释放被新政权逮捕的军官、维持军纪与士气，任职至1944年10月23日由甘乔·曼切夫接替。此后旋即遭逮捕，人民法庭判处其十五年徒刑并没收全部财产、剥夺养老金，服刑期满后仍遭继续关押，辗转瓦尔纳监狱及别列内劳改营。1980年在保加利亚逝世。2002年，国防部曾提议为其平反并追授少将军衔。"
 CBIO_BUL_georgi_ivanov_kyoseivanov_desc:0 "格奥尔基·伊万诺夫·乔塞瓦诺夫（1884年1月19日—1960年7月27日），保加利亚政治家、外交官，1935年11月23日出任总理并兼任外交大臣，任职至1940年2月，是继利亚普切夫之后在任时间最长的总理。其政府主持审判1934年政变主谋，并与南斯拉夫、希腊签订和解条约，借助与希腊总理梅塔克萨斯达成的协议突破《讷伊条约》与《洛桑条约》的军事限制条款、推行重整军备。尽管在任近五年，其内阁实质上被视为鲍里斯三世个人独裁统治的政治工具，未能取得实质性施政成就，仅令国王得以借国王政府之名行绝对君主之实。1940年卸任后转任驻瑞士公使，此后长驻瑞士，1944年祖国阵线政变后未归国，1960年在瑞士逝世。"
 CBIO_BUL_georgi_markov_desc:0 "格奥尔基·马尔科夫·马尔科夫（Georgi Markov，1886—1966）是保加利亚陆军中将。1923年晋中校，1928年晋上校，1936年先后晋少将、中将。军旅生涯历任第7团团长、边防区指挥官、第8团团长，1934年任第4师师长，随后出任陆军军需总监（1934—1936）；1936年任第3步兵师师长，1936—1941年任第2军区司令，1941年8月退役。"
 CBIO_BUL_georgi_petsov_desc:0 "格奥尔基·格奥尔基耶夫·佩佐夫，1899年11月21日生于加布罗沃，1970年8月10日卒于瓦尔纳，保加利亚海军一级舰长。1917年入索非亚军事学校，1920年完成海军军官课程后进入多瑙河海上警察部队服役，后任海军学校教官。1927年被派往德国柏林学习水文学与气象学，1931年以黑海气旋研究论文取得物理海洋学博士学位，成为少见的学者型海军军官。回国后历任“斯梅利”号鱼雷艇艇长、海军学校负责人和舰队参谋长。1944年保加利亚政局急转，他由阿森·托舍夫手中接任海军司令，同年12月又将职务移交斯特凡·托舍夫·察内夫。佩佐夫的分量不在海战功绩，而在海军教育、气象水文与黑海专业化建设。"
 CBIO_BUL_georgi_popov_desc:0 "格奥尔基·尼古拉夫·波波夫，1907年入索非亚军校，一战期间历任步兵及参谋官职，因法语娴熟一度随卢科夫将军参与停战谈判代表团（1918年9月29日）。战间期长期在总参谋部及军校任职，1919年任《讷伊条约》军事监督委员会保方代表之一，1933年任步兵团长，1934年任军校校长兼军事教育机构负责人，1935年升任总参谋部副参谋长，同年晋少将。1940年9月至1941年8月，在保加利亚借《克拉约瓦条约》收复南多布罗加期间，他出任该地区总督。1941—1945年二战期间任第3集团军司令，晋炮兵上将。1953年10月在索非亚逝世。"
 CBIO_BUL_hristo_lukov_desc:0 "赫里斯托·尼古拉夫·卢科夫，保加利亚陆军中将、政治家，1935—1938年任军事大臣。一战期间晋升少校并任炮兵营长（常被误传为一战末期第13步兵师师长，实为同名的另一位赫里斯托·卢科夫（茨奥内夫）将军，二者并非同一人）。战间期历任炮兵学校校长、总参谋部炮兵督察训练处处长、第2及第3步兵师师长。1935—1938年任军事大臣期间，他与纳粹德国高层建立密切联系，力主秘密扩军突破《讷伊条约》限制，任内寻求德方技术转让、军官培训及军购合作。1938年被免职并转入预备役后，他转而专注于极右翼组织保加利亚国民军团联盟（简称军团），该组织奉行反犹、反共及威权国家主义，1941年该联盟支持通过带有种族歧视性质的《保卫民族法》，其1942年纲领公开将犹太人列为需要打击的对象。1942年1月他统一整合了此前分裂的两派军团势力，出任统一后的联盟领袖直至遇刺，德国使馆官员曾一度提议由他取代王室建立法西斯政权。1943年2月13日晚，两名保加利亚共产党抵抗运动成员（伊万·布鲁贾耶夫及维奥莱塔·亚科娃）在其索非亚寓所前将其枪杀，一人中弹后仍反抗，最终被亚科娃补射身亡。21世纪以来，极右翼团体保加利亚民族联盟每年二月在索非亚举行以其名字命名的卢科夫游行纪念活动，因涉及新纳粹色彩而屡遭禁止及强烈争议。"
 CBIO_BUL_ivan_dochev_desc:0 "伊万·迪米特罗夫·多切夫，陆军上校之子，1926—1932年供职公务员系统，后入索非亚大学攻读法律与政治学，其间投身学生运动。1933年他是青年国民军团联盟创始人之一及三人领导团体成员，该组织初期反共及民族主义色彩浓厚，后逐渐吸纳意大利法西斯主义及纳粹主义影响，加入统合主义及反犹立场。1934年他随尼古拉·哲科夫将军赴纳粹德国访问，会晤希特勒及罗森贝格。1937年该运动正式定名保加利亚国民军团联盟，翌年因内部分歧，多切夫率一派出走另立山头，与赫里斯托·卢科夫领导的主流派分道扬镳。二战期间他与卢科夫重归于好，成为这位亲纳粹将军的主要支持者之一，其亲德立场使他在战争末期日益不得人心。1941—1943年间他曾任锡利斯特拉市长。1944年他与亚历山大·灿科夫一同接受纳粹德国安排流亡维也纳，在当地度过余下战事。战后他被三次缺席判处死刑，但因其始终身处流亡未曾归国，判决从未执行。1947年他在慕尼黑创立坚决反共的保加利亚民族阵线，此后长期在北美从事反共侨民活动，1984年将领导权移交后仍任名誉主席，1991年苏东剧变后返回保加利亚，晚年自称支持民主力量联盟，但仍坚称保留军团时期的政治理念不变。2005年在美国逝世。"
 CBIO_BUL_ivan_markov_desc:0 "伊万·赫里斯托夫·马尔科夫生于1889年11月7日，保加利亚陆军中将。马尔科夫曾任保加利亚驻贝尔格莱德和布拉格武官，熟悉巴尔干与中欧军事外交环境。回国后，他先后担任第2快速师、第2步兵师、第4军区和第2集团军等指挥职务。第二次世界大战初期，保加利亚在德意阵营压力和巴尔干局势变化中调整军队部署，马尔科夫的职务主要位于军区和集团军指挥层面。"
 CBIO_BUL_ivan_variklechkov_desc:0 "伊万·彼得罗夫·瓦里克列奇科夫（1891年7月7日，生于索非亚—1974年），少校瓦里克列奇科夫之子，索非亚军校炮兵专业毕业，一战期间历任海岸炮兵及潜艇军官，曾随保加利亚首艘潜艇第18号潜水艇出海，此后转赴德国潜艇部队在北海、大西洋服役，研发出一套探测敌方潜艇的方法，并指挥果敢号鱼雷艇。保加利亚退出一战后，他协助运送法军渡过多瑙河，获法国荣誉军团勋章。战间期历任海军参谋长、多瑙河团团长（1931年）、海军旅参谋（1932年）、海军学校校长（1933年）等职，1933—1935年任海军总司令，任内引入水雷布设体系。1935年起入沙皇侍从，1936年出任鲍里斯三世副官（为国王宠信之一），1937年再度出任海军总司令，为海军配备德制吕森式鱼雷艇并制定作战方案，同年5月1日成为保加利亚海军首位实职少将（少将衔准将）。1939年10月10日御前会议上，他当着国王及内阁大臣的面公开反对保加利亚沦为纳粹德国盟友的方案，随即被解职，此后务农为生。精通德、法、英、俄四国语言，擅长小提琴。1974年逝世。"
 CBIO_BUL_kimon_georgiev_desc:0 "基蒙·格奥尔基耶夫·斯托亚诺夫（1882年8月11日—1969年9月28日），生于塔塔尔-帕扎尔吉克，因母系希腊血统绰号希腊人。1902年投身军旅，参与1923年推翻斯坦博利伊斯基政府的政变，此后与迪莫·卡扎索夫等人共同创立超党派权威主义政治团体环节集团，主张以强人政府整肃议会党争乱象，兼受意大利法西斯统合主义影响。1934年5月19日，他联合达米扬·韦尔切夫领导的军官同盟发动政变推翻穆沙诺夫政府，出任总理并一度兼任外交、司法、军事大臣，取缔一切政党及工会，推行统合主义经济体制，取缔内马其顿革命组织。因其集团内部共和派倾向引发鲍里斯三世警觉，1935年1月国王发动反政变将其罢黜，此后他遭长期软禁监视，一度被流放布尔加斯。二战期间他逐渐向左翼靠拢，1942年祖国阵线成立后加入其全国委员会。1944年9月9日，他领导祖国阵线政变推翻摄政团及菲洛夫内阁，再度出任总理直至1946年，任内保加利亚倒戈对德宣战。因在保加利亚历史上主导策划过1923、1934、1944三次政变，被称为老政变家。1946年后历任副总理兼外交部长等职，1949年环节正式解散后他仍留任内阁要职直至1962年，此后任国民议会主席团成员直至逝世，两度获社会主义劳动英雄称号。1969年在索非亚逝世。"
 CBIO_BUL_kiril_dimitrov_yanchulev_desc:0 "基里尔·迪米特罗夫·扬丘列夫（1896年2月19日，生于普里莱普（时属奥斯曼帝国，今属北马其顿）—1961年4月），保加利亚民族复兴活动家迪米塔尔·扬丘列夫之子，母亲叶芙根尼娅为教师，就读于萨洛尼卡保加利亚男子中学。1916年3月毕业于索非亚军校，参加一战。战后赴法国圣西尔军校深造，1923年晋上尉，1928—1929年在索非亚军校讲授军事史，1930年晋少校，1931年出版《1877—1878年俄土战争》一书，1934年晋上校，1934—1939年任驻巴黎、伦敦武官，1938年出任军校校长，同年8月任军队总部负责人。1942年3月任副总参谋长，1943年5月晋少将。1944年9月6日出任保加利亚陆军总参谋长，任职仅一周即于9月13日被解职。战后遭共产主义当局迫害，被关押于别列内劳改营。1961年4月逝世。"
 CBIO_BUL_kiril_stanchev_desc:0 "基里尔·尼古拉夫·斯坦切夫（1895年12月14日—1968年4月11日），生于丘斯滕迪尔，1916年索非亚军校毕业授少尉衔，一战期间在马其顿战线服役，历经晋升，1933年升少校。战间期历任边防部队、步兵团及第2步兵师军官，兼任军事学院教官，是军官同盟成员，并创立同盟内部秘密的亲共和派上尉运动。因参与1934年政变及其共和派立场，1935年鲍里斯三世巩固权力后被开除军籍并判处死刑，后改判无期徒刑；1940年获赦、恢复军籍，同年10月晋上校，1941—1944年在索非亚大学攻读法律。1944年祖国阵线政变后，他率领保加利亚第2集团军参与对德作战，在尼什战役和科索沃战役中指挥保军协同南斯拉夫游击队及苏军作战击败当地德军，因战功于1944年11月18日晋升中将。然而1946年，他被以参与“军官同盟”密谋政变罪名逮捕——现代史学界普遍认为该指控系保加利亚国家安全部门捏造，意在清除对新政权忠诚度存疑的旧军官、并虚构军队与农民党反对派的关联。斯坦切夫始终拒绝招供，也拒绝牵连他人。1968年在索非亚逝世。"
 CBIO_BUL_konstantin_lukash_desc:0 "康斯坦丁·卢德维希·卢卡什，1909年毕业于索非亚军校，历任步兵团军官。1940年1月晋中将，1941年8月11日出任保加利亚陆军总参谋长，任职至1944年5月11日。任内他是1941—1942年保加利亚军方向德军东线派遣多批考察团军官的关键推动者之一，他本人亦亲赴东线前线视察德军对苏作战，其未公开日记后来成为研究保加利亚与纳粹东线战事关联程度的重要史料。1944年5月卸任总参谋长后不久，祖国阵线于9月发动政变。他随后被逮捕，1945年3月15日经人民法庭判处死刑并于索非亚处决。"
 CBIO_BUL_konstantin_muraviev_desc:0 "康斯坦丁·弗拉多夫·穆拉维耶夫（1893年3月5日—1965年1月31日），帕扎尔吉克人，农民同盟领袖斯坦博利伊斯基之侄，1923年年仅29岁即在其舅父政府中出任军事大臣，因未能及时正视政变风险而被视为该政府垮台的重要原因之一，1931—1934年联合政府中历任多个内阁职务，逐渐挽回政治声誉，二战期间是议会合法反对派中最活跃的领袖之一。1944年9月2日，在盟国拒绝其前任巴格里亚诺夫的求和努力后，摄政团任命穆拉维耶夫组阁以争取西方盟国接受，其内阁明确排除祖国阵线及农民同盟左翼势力，9月5日废除全部排犹法律，9月8日对纳粹德国宣战，但为时已晚——苏联已于9月5日单方面对保加利亚宣战，9月9日祖国阵线发动政变将其推翻，在任仅一周有余。与同时代多数政要不同，穆拉维耶夫战后未被处决，但被判无期徒刑，监禁至1955年，1956年再度被捕关押至1961年方获释，此后基本接受了新政权现实，1961年还曾与祖国阵线人士会谈，因此遭部分右翼农民同盟旧部谴责。1963年出版回忆录《事件与人物》。1965年在索非亚逝世。"
 CBIO_BUL_nikola_hadzipetkov_desc:0 "尼古拉·哈吉佩特科夫（1891年—1949年），保加利亚陆军中将，1938年12月10日至1941年8月11日出任保加利亚陆军总参谋长，是1941年保加利亚参与轴心国行动前夕的军队最高指挥官，其后由康斯坦丁·卢卡什接任该职。1949年逝世。"
 CBIO_BUL_nikola_mihov_desc:0 "尼古拉·米哈伊洛夫·米霍夫，1911年毕业于索非亚军校，炮兵出身，参加两次巴尔干战争及一战（曾参与攻占图特拉坎要塞）。战间期长期在炮兵督察部门及军校任职，1933—1935年任第7炮兵师师长，1936年起任第3步兵师副师长、师长，1937—1941年任军校校长。1941年4—8月率第5集团军参与占领马其顿，此后短暂指挥第1集团军。1942年晋中将，同年4月起任军事大臣直至1943年9月，任内于1943年多次陪同鲍里斯三世会晤希特勒及凯特尔、约德尔等德军将领。1943年鲍里斯三世猝逝后，他成为为幼主西美昂二世设立的三人摄政团成员之一（另二人为菲洛夫、基里尔亲王）。1944年9月祖国阵线政变后遭逮捕，1945年1月28日被人民法庭判处死刑，翌日与菲洛夫、基里尔亲王等一同处决，是保加利亚历史上称为血腥星期四的大规模政治清算的一部分。1996年获最高法院平反。其战时日记于2004年出版。"
 CBIO_BUL_nikola_mushanov_desc:0 "尼古拉·斯托伊科夫·穆沙诺夫（1872年4月12日—1951年5月10日），德良诺沃人，法学出身，1902年首次当选国民议会议员，1908—1944年间历任九届政府要职，1920年起任民主党副主席，1938年接任主席直至1947年。1931年10月接替因病辞职的马利诺夫出任总理，1932年促成终止一战战争赔款支付，但内外交困、经济持续低迷，1934年5月被环节集团军事政变推翻。二战期间他是议会合法反对派领袖，公开反对1940年《保卫民族法》等排犹立法，坚持严格中立立场，反对加入轴心国及对英美宣战。因其反纳粹立场获盟国信任，1944年盟国与保加利亚就投降谈判时明确要求穆沙诺夫须在新内阁中担任要职，他遂出任穆拉维耶夫短命政府（1944年9月2日—9日）的不管部部长。祖国阵线政变后，他与穆拉维耶夫内阁其他成员一同被人民法庭审判判刑（未判死刑），1945年获释后试图重建民主党、恢复议会民主未果，1947年被流放特尔诺沃，1949年虽已78岁高龄仍被捕关入劳改营，1951年在索非亚国家安全局看守所内逝世，官方称死于心脏破裂，死因存疑。1996年最高法院撤销其人民法庭原判。"
 CBIO_BUL_nikola_nakov_desc:0 "尼古拉·科切夫·纳科夫（1892年2月24日，生于弗拉察—？），1913年毕业于索非亚军校，历任第3边境步兵团及第54比托拉步兵团军官。1929年起任军事大臣副官，1932年任近卫营营长，1934年任第4普列文步兵团团长。1935年晋上校并出任第1索非亚步兵师参谋长，1938年升任该师师长，1940年10月晋少将。1942年4月11日至1944年9月13日任保加利亚第1集团军司令。1944年9月13日以服役满25年为由被解职，实为祖国阵线新政权对旧军官系统展开的首轮清洗之一。此后遭人民法庭审判，据保加利亚史料记载他与卢卡什、斯坦切夫等多名将领一同在1945年的大规模政治清算中被处决。"
 CBIO_BUL_nikola_petkov_desc:0 "尼古拉·迪米特罗夫·佩特科夫（1893年7月8日—1947年9月23日），保加利亚前总理迪米塔尔·佩特科夫之子，其兄佩特科·佩特科夫1924年遭不明刺客暗杀。1910年毕业于索非亚第一男子中学，赴巴黎索邦大学攻读法律与政治学，其间回国参加两次巴尔干战争，一战后返巴黎完成学业（1922年以优异成绩毕业），曾在保加利亚驻巴黎使馆任职。1923年6月政变推翻斯坦博利伊斯基政府后辞职留法从事新闻工作，1929年回国，1931—1933年任农民同盟系报刊主编，出版关于斯坦博利伊斯基的政治评述专著。1934年政变后他与包括保共外围劳工党在内的民主力量合作，1938年当选议员，因反法西斯活动1938年12月当选资格被取消并遭内禁。1941年G·M·迪米特罗夫流亡后，佩特科夫接掌农民同盟斯坦博利伊斯基派领导权，同年被关入贡达沃达集中营，此后参与祖国阵线筹建谈判并代表农民同盟进入该阵线全国委员会。1944年祖国阵线上台后，他出任首届政府不管部部长（1944年9月—1945年8月），1945年1月起转为坚决的反共联合反对派领袖，坚持捍卫议会民主，被视为对共产党一党化进程的最大障碍。1947年6月5日，其议员豁免权被剥夺，他本人在议会大厅内当场被捕，试图阻止的同僚遭殴打。经一场剥夺辩护权、不容举证的政治审判，他于8月16日被判间谍及策动军事政变罪成立、判处死刑，尽管西方国家强烈抗议，仍于9月23日被绞死，葬于不公开墓地，成为战后保加利亚乃至东欧农民党反对派遭清算的标志性人物，1990年获平反昭雪。"
 CBIO_BUL_nikola_stoychev_desc:0 "尼古拉·斯托伊切夫，保加利亚陆军将领，1937年5月6日晋升少将，1942年1月1日晋升中将。二战末期出任保加利亚第3集团军司令，参与1944—1945年祖国战争（对德作战）。据保加利亚史料记载，他与康斯坦丁·卢卡什、特里丰·特里弗诺夫等多名旧军官一同在1945年的人民法庭大规模政治清算浪潮中被处决。"
 CBIO_BUL_nikola_zhekov_desc:0 "尼古拉·托多罗夫·哲科夫，商人家庭出身，1883年入索非亚军校，1885年塞保战争中以志愿兵身份参战，1886年因卷入推翻亚历山大·巴滕贝格亲王的政变而被降级处分，后获赦并完成学业。1898年毕业于意大利都灵军事学院，1912年出任索非亚军校校长，第一次巴尔干战争期间任第2集团军参谋长。1915年8月出任军事大臣，同年9月24日在斐迪南一世支持下出任保加利亚陆军总司令，主张加入同盟国一方参战。一战期间他指挥保军协同德奥联军击溃塞尔维亚，攻占南多布罗加，并成功挫败1916、1917年协约国在萨洛尼卡战线的多次攻势。1918年战事恶化期间他因病赴维也纳就医，将指挥权移交副手格奥尔基·托多罗夫，此举在保加利亚军事史学界长期存在争议。战后他流亡德国，1921年归国为其战时决策辩护，被斯坦博利伊斯基政府判处十年徒刑，1923年政变后获特赦，此后在军事学院任教并撰写军事著作及回忆录，1936年晋升步兵上将（保加利亚陆军最高军衔）。两战间他是保加利亚极端民族主义代表人物之一，一度出任保加利亚国民军团联盟名誉领袖。二战期间他与希特勒建立友好关系，1940年法国战败后应邀以贵宾身份访问巴黎。1944年祖国阵线政变后，他因担忧遭政治清算而流亡德国，1945年2月1日被人民法庭缺席判处死刑，因下落不明未能执行。1949年在德国巴伐利亚菲森逝世，1992年遗骸迁回保加利亚安葬于索非亚军事陵园。"
 CBIO_BUL_sava_ivanov_desc:0 "萨瓦·伊万诺夫（1891年—1958年），保加利亚海军少将（一说少将衔准将），索非亚军校毕业后转赴圣彼得堡海军士官团深造。一战期间以少尉身份于1916年袭击苏利纳的俄国仓库，创建了保加利亚海军航空兵，此后长期关注海军航空、海洋学及鱼雷艇编队指挥。1928—1935年任瓦尔纳海军学校（前身为海军机械学校）校长，1935—1937年出任保加利亚海军总司令，此后由伊万·瓦里克列奇科夫再度接任。1944年他一度被迫离开索非亚，此后返回，1958年逝世。他晚年著述颇丰，涉及海洋学、海军史及海军教程等领域，是保加利亚海军史学的奠基人之一，被誉为该领域公认却鲜为人知的元老级人物。"
 CBIO_BUL_stoyan_stoyanov_desc:0 "斯托扬·伊利耶夫·斯托亚诺夫（1913年3月12日，生于加拉塔村（今属瓦尔纳）—1997年3月13日），出生前五个月，其父作为瓦尔纳第8海军团旗手在巴尔干战争中阵亡于埃迪尔内附近，他因此被瓦尔纳战争孤儿学校收留，少年时曾在街头卖报维生。1930年入索非亚国家神学院就读中学，1934年获奖学金入读高等军官学校。1938年被派往德国接受飞行训练，先后在考夫博伊伦完成特技飞行课程、在柏林附近的韦尔诺伊兴高级战斗机飞行员学校深造，1939年学成回国后曾培训多名后来成为保加利亚王牌飞行员的同僚，本人也在卡尔洛沃机场飞行员学校任教官，训练飞行员驾驶新到货的Bf109战斗机。二战期间他驾驶Bf109参与保卫索非亚领空的多次空战，主要战果集中在1943—1944年间击落及击伤美军B-24、B-17轰炸机及P-38战斗机等，官方战绩为15次确认击落，是二战期间保加利亚皇家空军战绩最高的王牌飞行员。战后他在人民空军短暂留任，1945年3月保加利亚接收120架苏制雅克-9M战斗机后负责培训新飞行员，1956年以微薄军人抚恤金被强制退役，此后三十年在里拉修道院担任导游维生。1997年逝世，享年84岁。"
 CBIO_BUL_stoycho_mushanov_desc:0 "斯托伊乔·莫沙诺夫，德良诺沃人，总理尼古拉·穆沙诺夫之侄，与其叔父分属不同政党——莫沙诺夫是民族联盟（后并入民主联盟）领袖，1935年短暂出任托舍夫内阁的财政大臣，此后长期任国民议会议长。二战期间他参与合法反对派活动，公开反对武装抵抗祖国阵线的路线。1944年8月，在轴心国败局已定之际，他受命秘密赴开罗与英美方面举行谈判，试图为保加利亚争取体面退出战争、避免遭苏联占领的条件，是保加利亚战时最重要的秘密外交使命之一，但因国内政局急转、9月政变爆发而未能达成实质成果。战后遭共产主义政权多次政治清算与迫害，1944—1947年间他仍参与民主党相关活动，此后淡出政坛，1975年在索非亚逝世。"
 CBIO_BUL_theodosi_daskalov_desc:0 "特奥多西·彼得罗夫·达斯卡洛夫，抵抗运动人士巴乔·基罗的外孙，1907年毕业于索非亚军校，炮兵出身，参加两次巴尔干战争及一战，历任连、营指挥官。1920年一度被军队解职，1924年复职，此后历任军事刊物主编、总参谋部处长、第5多瑙河步兵团参谋长、第5集团军副司令等职。1938年1月24日出任乔塞瓦诺夫第二届内阁军事大臣，此后在历届内阁中留任该职直至1942年（包括菲洛夫首届内阁）。他本人反对保加利亚加入《三国同盟条约》，但1941年3月1日条约签署后，仍依职权签发第82号令，准许德国免税向保加利亚输入武器装备。1942年4月11日被免去阁员职务并以步兵上将军衔退役。此后他转向反法西斯立场，据称参与秘密抵抗活动。1944年祖国阵线政变后仍被逮捕，1945年2月1日被人民法庭判处死刑并处决，1996年获平反。"
 CBIO_BUL_todor_pavlov_desc:0 "托多尔·迪米特罗夫·巴甫洛夫（1890年2月14日—1977年5月8日），生于什蒂普（时属奥斯曼帝国科索沃州），保加利亚马克思主义哲学家、政治家、记者，保加利亚共产党重要理论家。1943年鲍里斯三世猝逝后，1944年9月祖国阵线政变，他出任为幼主西美昂二世设立的三人摄政团中代表共产党一方的摄政，任职至1946年君主制被公投废除。此后转向学术领域，1947—1962年出任保加利亚科学院院长，是保加利亚马克思主义反映论美学与认识论的主要奠基人之一，著述颇丰。1977年在索非亚逝世。"
 CBIO_BUL_trifon_trifonov_desc:0 "特里丰·约尔达诺夫·特里弗诺夫，保加利亚科学院院士约尔丹·特里弗诺夫之子、教授伊万·特里弗诺夫之弟。1916年以第36期学员身份毕业于索非亚军校炮兵专业，1943年5月6日晋升少将，同年11月22日出任第2占领军军长。1944年5月11日出任保加利亚陆军总参谋长，任职期间恰逢保加利亚战略处境急剧恶化，同年9月6日因与新任军事大臣伊万·马里诺夫将军意见相左而辞职。祖国阵线政变后遭逮捕，1945年3月15日被人民法庭以违反《特尔诺沃宪法》程序的方式判处死刑并处决，是继纳科夫、卢卡什等人之后又一位在战后大清洗中被处决的保加利亚高级将领。"
 CBIO_BUL_valko_chervenkov_desc:0 "瓦尔科·维利奥夫·契尔文科夫（1900年9月6日—1980年10月21日），生于兹拉蒂察，1919年加入保加利亚共产党，1923年参与保共起义失败后流亡苏联，就读莫斯科马克思-恩格斯学院，后任该院讲师及院长，兼任共产国际驻共产主义大学教官，长期从事保加利亚流亡党人的思想教育工作。1926年迎娶季米特洛夫胞妹叶莲娜为妻，由此成为季米特洛夫的连襟。1941年出任对保加利亚广播的赫里斯托·博特夫电台台长。1944年受季米特洛夫委派返回保加利亚，此后历任文化部长（1947年）、副总理（1949年）等职。1949年季米特洛夫逝世后，他凭借与季米特洛夫的姻亲关系及斯大林的信任接任保共总书记，1950年科拉罗夫逝世后再兼任总理，集党政大权于一身，因效仿斯大林治国方式被称为小斯大林。其统治期间大规模清洗党内异己（1953年前开除约十万名党员）、推行农业集体化及重工业优先的经济政策，1953年镇压普罗夫迪夫烟草工人罢工。1953年斯大林去世后其地位受到冲击，1954年被迫将总书记职位让予日夫科夫，1956年赫鲁晓夫去斯大林化后被迫辞去总理职务，1961年被逐出政治局，1962年因反党活动被开除党籍，1969年经日夫科夫提议恢复党籍。1980年在索非亚逝世，当局刻意压低葬礼规模以防演变为对日夫科夫政权的抗议。"
 CBIO_BUL_vasil_boydev_desc:0 "瓦西尔·捷涅夫·博伊德夫，上校捷纽·博伊德夫之子、中校安东·博伊德夫之兄，参加两次巴尔干战争及一战。1936年10月6日出任保加利亚空军司令，此后近五年间积极推动这一此前受《讷伊条约》严格限制的新兴军种的恢复与建设。1941年8月11日接替尼古拉·米霍夫将军出任新组建的第5集团军司令，负责占领南斯拉夫马其顿及皮罗特地区，1944年5月11日因不满摄政团（以菲洛夫为首）及军事大臣鲁西·鲁塞夫坚持的亲德路线而辞职退役。1945年他被人民法庭审判定罪并送往劳改营，刑满后又被强制安置于特罗扬，与妻子在当地共同生活直至1983年逝世。"
 CBIO_BUL_vasil_kolarov_desc:0 "瓦西尔·彼得罗夫·科拉罗夫（1877年7月16日—1950年1月23日），生于舒门，鞋匠之子，日内瓦大学攻读法律，1897年加入保加利亚工人社会民主党，后随布拉戈耶夫转入窄派。1919年保加利亚共产党成立后任中央委员会首任书记，长期是仅次于季米特洛夫的党内元老，两战间大部分时间流亡苏联，是共产国际执行委员会核心成员，1922年起任共产国际总书记。1923年他潜回保加利亚，与季米特洛夫共同促成保共发动九月起义反抗灿科夫政权，失败后再度流亡。1943年共产国际解散后，他继续在莫斯科从事保加利亚流亡共产党人的协调工作。1945年苏军占领期间返回保加利亚，历任国民议会主席（1945—1946）、大国民议会主席（1946—1950）、临时国家元首（1946—1947）、副总理兼外交部长（1947—1949）。1949年季米特洛夫逝世后，他继任总理，是保加利亚农业问题理论方面的重要著述者。1950年1月在索非亚任内逝世，享年72岁，获国葬礼遇，安葬于季米特洛夫陵墓。"
 CBIO_BUL_vladimir_stoychev_desc:0 "弗拉基米尔·迪米特罗夫·斯托伊切夫，维也纳特蕾西亚军事学院及索非亚军校毕业，骑兵出身，参加两次巴尔干战争及一战。两战间他是保加利亚著名马术运动员，代表保加利亚参加1924年巴黎及1928年阿姆斯特丹夏季奥运会马术项目，1930—1934年任驻法国及英国武官。1934年出任索非亚骑兵学校校长，翌年因其反君主立场及与环节集团的关联被军队开除，此后数次因政治立场被捕入狱。1944年他加入祖国阵线全国委员会办公室，保加利亚倒戈对德后，他出任保加利亚第1集团军司令，率部协同苏军及南斯拉夫游击队将德军逐出南斯拉夫、匈牙利大部地区，1945年3月19日在德拉瓦河战役中击败当地德军，5月8日在奥地利克拉根福与英军第5军司令柯特利就分界线达成协议，标志保军作战行动结束。1945—1947年任保加利亚驻华盛顿及联合国代表，回国后任部长会议最高体育委员会主席，1951或1952年至1982年任保加利亚奥林匹克委员会主席，此后任名誉主席直至逝世，1952—1987年任国际奥委会委员。1954年晋升上将。1990年在索非亚逝世，享年98岁。"
 CBIO_BUL_zachari_zachariev_desc:0 "扎哈里·西梅奥诺夫·扎哈里耶夫（1904年2月4日—1987年4月29日），生于巴萨尔博沃，乡村教师之子，1928年毕业于博茹里什特飞行学校，任第1侦察航空队飞行员。1931年因组织五一罢工等反法西斯活动被军队开除，遂与三名飞行员好友一同投奔苏联，经季米特洛夫推荐赴坦波夫飞行学校受训，后留校任教官，为躲避保加利亚亲法西斯政府对其家人的迫害而化名沃尔坎·戈拉诺夫。1936年他主动请缨加入即将派往西班牙的苏联志愿航空队，以土耳其化名哈利勒·埃克雷姆驾驶波泰兹-54轰炸机、后改驾SB轰炸机，对佛朗哥军目标执行多次空袭任务，因战功获授苏联英雄称号及列宁勋章，是保加利亚人中获此殊荣者之一。1929—1944年间他在苏联红军服役，二战期间任民用航空培训机构负责人，培训飞行员逾万两千人。1944年祖国阵线执政后，他以本名返回保加利亚，主持重建保加利亚空军，1945年任空军副总司令，1947—1955年任空军总司令兼国防部副部长，晋升少将（1947）、中将（1951），主持推动保加利亚航空部队向喷气式装备转型。1959年起任驻莫斯科武官，1965年后再任国防部副部长，1973年退休。1987年在索非亚逝世。"
 CBIO_INS_a_t_van_starkenborgh_stachouwer_desc:0 "阿利迪厄斯·瓦尔莫尔杜斯·兰贝图斯·恰尔达·范·斯塔尔肯博赫·斯塔豪韦尔（1888年3月7日—1978年8月16日）出生于荷兰格罗宁根一个古老贵族世家。早年就读于格罗宁根大学法学专业，毕业后进入荷兰外交系统任职，历任驻哥本哈根、斯德哥尔摩、柏林等地使馆参赞，1925年至1933年出任格罗宁根省省长，1933年至1936年出任驻比利时大使。1936年9月，恰尔达就任荷属东印度总督，是该殖民地末任总督。1940年荷兰本土向纳粹德国投降后，恰尔达在东印度宣布戒严，下令扣押境内德国船只并拘押德国侨民。1941年末日本发动太平洋战争后，东印度防务陷入绝境，1942年3月荷军接受日方无条件投降条件，恰尔达随即被日军俘虏，先后辗转爪哇多地战俘营，最终被押送至中国东北（伪满洲国）战俘营关押，直至1945年8月获苏军解放。战后恰尔达携家人返回荷兰，虽获荷兰女王邀请重返东印度总督之职，但因不愿卷入印尼独立进程的复杂局面而婉拒。1978年8月16日，恰尔达在荷兰逝世。"
 CBIO_INS_achmad_soebardjo_desc:0 "艾哈迈德·苏巴尔佐（原名阿卜杜勒·马纳夫，Achmad Soebardjo，1896年3月23日—1978年12月15日）出生于西爪哇卡拉旺一个具有亚齐贵族血统的家庭。1919年赴荷兰莱顿大学求学，曾任“印度尼西亚学生协会”主席，长期活跃于欧洲的印尼民族主义活动，1927年参与在布鲁塞尔召开的“反帝国主义与殖民压迫同盟”成立大会。1934年回国后从事律师工作，并与日本军方建立联系，1942年日本占领荷属东印度后加入日方军政机构任职。1945年，苏巴尔佐参与独立筹备调查会工作，协助起草宪法文本，并在8月17日独立宣言的酝酿过程中发挥关键作用，同年9月出任印尼共和国首任外交部长，主持外交部初创工作。此后因政治立场与沙里尔总理相左，1946年卷入一场未遂政变而遭长期监禁。1951年，苏巴尔佐在苏基曼内阁再度出任外交部长，任内签署《旧金山和约》并与美国商谈援助事宜，后因未经内阁同意擅自批准援助条款引咎辞职。此后他继续在外交部任职多年，1957年至1961年出任驻瑞士大使，1978年在雅加达逝世，2009年被追封为印度尼西亚民族英雄。"
 CBIO_INS_adipati_soejono_desc:0 "潘吉兰·拉登·阿迪帕蒂·阿里奥·苏约诺（1886年3月31日—1943年1月5日）出生于东爪哇杜伦阿贡一个爪哇摄政王世家，毕业于泗水高级中学，通过巴达维亚高等文官考试后进入荷属东印度地方行政系统任职，后出任帕苏鲁安摄政王。1920年，苏约诺获任命为人民议事会（“荷印国会”）议员，此后历经1924、1927、1931年多次连任，并出任该会代表团成员。1930年，他受荷方派遣赴荷兰进修一年，期间作为荷属东印度代表参加日内瓦国际劳工组织大会，就废除强迫劳役问题进行谈判。1934年11月，苏约诺离开人民议事会，移居海牙，代表殖民地事务部出任国际橡胶管制委员会成员。1940年初返回爪哇，接替胡塞因·贾贾迪宁拉特出任荷属东印度参事会成员。1942年日军入侵前夕，苏约诺随胡贝尔·范·穆克一同撤离至澳大利亚；范·穆克其后出任伦敦荷兰流亡政府第二届赫布兰迪内阁殖民地事务大臣，苏约诺遂成为其高级顾问。范·穆克主张战后给予荷属东印度更大自治权，提议擢升苏约诺出任内阁不管部大臣，此议获外交大臣范·克莱芬斯支持，后者认为此举有助于向美国反殖民舆论表明荷方视印尼人为政治平等伙伴。威廉明娜女王起初对任命一名非荷兰籍公民入阁有所顾虑，但最终于1942年6月9日批准苏约诺宣誓就职，成为唯一一位出任荷兰内阁大臣的印尼人，也是荷兰历史上首位穆斯林大臣。任内，苏约诺就战后荷兰与荷属东印度之间的宪制关系向威廉明娜女王进言，1942年10月两度向内阁提交政策简报，指出多数印尼人不会接受战后重返殖民统治，呼吁荷方尊重荷属东印度的自决权利并作出实质性让步，但相关主张未能获得内阁多数支持。1942年12月7日威廉明娜女王发表广播演说，暗示战后荷印关系地位可能调整，被认为部分反映了苏约诺的进言。1943年1月5日，就职仅七个月的苏约诺因心脏骤停猝然离世，享年56岁，安葬于英国沃金穆斯林墓园，荷兰政府及荷属东印度海军印尼籍人员出席葬礼。"
 CBIO_INS_alauddin_syah_desc:0 "阿拉乌丁·穆罕默德·达乌德沙（1864年—1939年2月6日）是亚齐苏丹国第35任（末代）苏丹，1875年3月4日，年仅7岁的他在故都兰泰翁清真寺加冕即位，继承因霍乱猝逝的阿拉乌丁·马哈茂德沙二世之位，即位初期由摄政曼库布米图安库·哈希姆辅政。达乌德沙在位期间正值荷兰发动“亚齐战争”（1873年爆发）对该苏丹国展开长期军事征服，他与抵抗领袖潘利马波勒姆等人长期在丛林中辗转坚持游击抵抗，曾一度将荷占区压缩至古达拉贾周边仅二十平方公里范围。1890年代，荷军在范·休茨将军指挥下改用“招抚结合镇压”新战术，达乌德沙与潘利马波勒姆被迫持续向西北海岸转移；1901年在巴泰伊利遭遇惨败后，他与部众撤入尚未被荷军踏足的加约高地，但荷方随即派遣以残酷著称的范·达伦少校率领“宪兵队”追剿。1902年，达乌德沙的正室王妃及次年其本人先后被荷军俘获。1903年1月10日，达乌德沙在西吉正式向荷方投降，投降时不着盛装、赤足以示以个人身份而非亚齐国家名义交出佩剑，并当众表示“亚齐的主权属于人民”，拒绝在荷方拟定的正式割让文件上签字。此后达乌德沙被流放亚齐境外，长期客居各地，亚齐苏丹国自此名存实亡，苏丹国体制于1903年后被荷方废除。1939年2月6日，达乌德沙在雅加达逝世，葬于当地拉瓦芒安公共墓地，其毕生反抗荷兰殖民统治的经历，使他被视为荷属东印度全境唯一始终未向荷兰屈膝称臣的传统统治者。"
 CBIO_INS_amir_sjarifuddin_harahap_desc:0 "阿米尔·谢里夫丁·哈拉哈普（1907年4月27日—1948年12月19日）出生于棉兰一个巴塔克族贵族家庭，皈依基督教，曾赴荷兰莱顿大学求学。1937年，他领导一批年轻马克思主义者创立印度尼西亚人民运动党（Gerindo），为地下共产党活动提供合法外衣。日本占领期间，阿米尔是少数积极组织地下抵抗的印尼政治人物之一，一度因此被日方逮捕，幸赖苏加诺出面斡旋才免于处决。印尼独立后，阿米尔历任新闻部长（1945—1946）及国防部长（1945—1948），1947年7月接替沙里尔出任第二任总理。任内主持与荷兰谈判并签署伦维尔协定，因协定被普遍视为对荷方让步过多而在1948年1月引咎辞职。同年，阿米尔承认自己自1935年起即为印尼共产党秘密党员，此后成为左翼“人民民主阵线”核心人物。1948年9月“茉莉芬事件”爆发，阿米尔卷入其中，事件平息后遭政府军逮捕，同年12月19日未经审判即被处决，终年41岁。"
 CBIO_INS_andries_cornelis_dirk_de_graeff_desc:0 "安德里斯·科内利斯·迪尔克·德赫拉夫（1872年8月7日—1957年4月24日）出生于荷兰，是荷兰黄金时代显赫的德赫拉夫家族后裔，其父曾任荷兰驻日公使。德赫拉夫早年就读于莱顿大学法律专业，毕业后前往荷属东印度任职，此后历任驻东京（1919—1922）及驻华盛顿（1922—1926）公使等外交要职。1926年至1931年，德赫拉夫出任荷属东印度总督，任内曾尝试推行相对温和的“伦理政策”，力图与温和派民族主义者维持一定合作关系，但收效有限。其任内经历了1926年至1927年印尼共产党发动的反殖民武装起义，起义遭当局迅速镇压，大批共产党人被捕、判刑或流放。卸任总督后，德赫拉夫于1936年至1937年间出任荷兰外交大臣，任内荷兰重申中立外交政策。1957年4月24日，德赫拉夫在荷兰逝世。"
 CBIO_INS_bonifacius_cornelis_de_jonge_desc:0 "博尼法修斯·科内利斯·德容格（1875年1月22日—1958年6月24日）出生于荷兰海牙一个法律世家。早年就读于乌得勒支大学法律专业，毕业后短暂执业律师，后转入荷兰殖民事务部及战争部任职。1917年，德容格出任科尔特·范·德·林登内阁战争大臣，任内曾短暂兼代海军大臣。1931年，德容格出任荷属东印度总督，任内正值全球经济大萧条，他在紧缩财政开支与地方经济发展诉求之间反复权衡，同时对印尼民族主义运动采取强硬镇压路线，严格限制“人民议事会”权力，大批民族主义领袖（包括苏加诺、哈达、沙里尔等）在其任内遭逮捕流放至博文迪古集中营，原定逐步关闭该集中营的计划亦被他推翻。1933年，殖民当局颁布“野校法令”限制民间私立学校办学自由，引发民族主义阵营强烈反弹，德容格被迫于当年撤回该法令。1936年卸任总督后，德容格返回荷兰，1958年6月24日在海牙逝世。"
 CBIO_INS_charles_welter_desc:0 "查尔斯·约瑟夫·伊尼亚斯·马利·韦尔特（1880年4月6日—1972年3月28日）出生于荷兰海牙。早年就读代尔夫特印度学院，1902年前往荷属东印度任职，先后在爪哇克杜、北加浪岸等地担任驻扎官助理，1908年调任巴达维亚总秘书处，1921年出任总秘书，是总督身边最核心的行政幕僚之一。1924年，韦尔特出任荷属东印度参事会成员，1925年首度出任荷兰殖民地事务大臣，惟任期仅数月即因内阁垮台而卸任；此后重返参事会，1929年起出任副主席。1931年韦尔特返回荷兰，曾主持财政紧缩委员会。1937年，韦尔特再度出任殖民地事务大臣，任内于1938年主导否决“苏塔尔乔请愿”——该请愿曾要求荷兰召开帝国会议、逐步给予荷属东印度自治地位，韦尔特在国会发言中明确表示“我的时代不属于伟大的改革者”，主张维持现状、渐进发展。1940年荷兰本土沦陷后，韦尔特随流亡政府迁往伦敦继续任殖民地事务大臣，1941年因与首相赫布兰迪就盟军轰炸荷兰本土目标问题产生分歧而辞职。战后韦尔特长期活跃于荷兰国会，对荷兰政府的印尼政策持续提出批评，1972年3月28日在海牙逝世。"
 CBIO_INS_christian_willhelm_bodenhausen_desc:0 "克里斯蒂安·威廉·博登豪森（1869年6月24日—1966年4月8日）出生于荷兰吕伐登。早年任职荷兰税务部门，曾任阿姆斯特丹市税务局局长，此后被派往荷属东印度任职，历任殖民地行政官员，后出任荷属东印度参事会成员及副主席。1939年，博登豪森短暂出任荷兰第五届科林内阁财政大臣，惟该届内阁存续仅约三日即告垮台。作为参事会副主席期间，博登豪森与迈耶·兰内夫特一同应对1930年代大萧条造成的经济危机以及日益迫近的日本威胁等重大殖民地治理难题。1966年4月8日，博登豪森在荷兰布卢门达尔逝世，享年96岁。"
 CBIO_INS_dewa_geg_desc:0 "伊达·伊·德瓦·阿贡·格德·奥卡·格格出生于巴厘岛克伦孔王国王室分支塞马拉巴瓦宫，是克伦孔王族成员。1908年荷兰军队发动“普普坦”（玉碎战）攻打克伦孔王国时，他是极少数在战斗中幸存的王室成员之一，身负重伤后被当地德詹派村民救起，旋即遭荷兰殖民当局俘获并救治，此后被流放龙目岛长达二十年之久。返回巴厘后，奥卡格格于1929年被荷方拥立为克伦孔王国新任国王，加冕仪式在格尔格尔达萨布瓦纳神庙举行。1938年，荷属东印度当局将他与巴厘岛其余七位地方统治者的地位提升为正式“自治统治者”（“拉惹”）。1949至1950年印尼建国统一进程中，巴厘诸邦“拉惹”体制逐步被撤销，但奥卡格格个人仍受地方尊崇，继续为巴厘地区的文化与社会事务作出贡献。1964年，奥卡格格逝世，“克伦孔大王”这一王室称号自此断绝，其后人此后仅以摄政官身份延续家族在克伦孔地方事务中的影响力。"
 CBIO_INS_dick_de_hoog_desc:0 "弗雷德里克·赫尔曼努斯·“迪克”·德·霍赫出生于安汶，是荷属东印度海军荷兰籍雇员之子及印欧混血（“印欧”/Indo）母亲之子，他本人也是荷属东印度印欧混血群体的代表性政治领袖。父亲早逝后，德·霍赫凭共济会奖学金完成学业，16岁即以优异成绩从泗水高级中学毕业。他先在泗水任文书，19岁加入国营铁路公司，数年内升任货运总站站长，1905年出任荏磅站长，惟因当时殖民地高级职位多保留给受荷兰本土教育者而遇晋升瓶颈。1914年，已婚的德·霍赫在友人资助下赴荷兰求学，1916年从莱顿大学毕业，次年携妻取道美国返回东印度，在巴达维亚出任国营铁路公司总经理助理，1922年调任日惹首席官员，1925年晋升万隆一等督察。与此同时，德·霍赫投身“印欧联盟”（IEV）政治活动——这是当时印欧混血群体争取权益的最重要组织，由卡雷尔·扎尔贝格于1919年创立。德·霍赫1920年加入该联盟理事会，1922年任副主席，1923年出任其在人民议事会（“荷印国会”）的代表，1927年当选负责该会日常事务的“代表团”成员，遂辞去铁路公司职务全身投入政治工作。1929年，德·霍赫成为印欧联盟唯一一任主席，当年即成功吸纳近1.5万名会员，人称“大老板”。1930年，他出任人民议事会代表团副主席及该会副议长，印欧联盟在其领导下发展为议会最大政治派系。德·霍赫致力于团结印欧社群各阶层，推动殖民地本地居民公民权利及荷属东印度自治进程，惟受制于殖民当局的保守立场，包括废除印欧混血群体土地所有权限制及殖民地自治等核心诉求始终未能实现。1938年，印欧联盟为庆祝德·霍赫任主席十周年设立以其名字命名的社会基金，彼时他声望正隆，获赠“印欧联盟无冕之王”及“印欧将军”等美誉。惟其健康状况随后急转直下，历经多次心脏衰竭后，1939年1月3日因中风逝世，享年57岁，其死讯为荷属东印度及荷兰本土头版新闻，万隆葬礼场面盛大，以纪念他为印欧混血群体权益所做出的毕生贡献。"
 CBIO_INS_dirk_reinhard_adelbert_van_langen_desc:0 "迪尔克·赖因哈德·阿德尔贝特·范·兰亨（通称Rein van Langen，1898年生于荷属东印度中爪哇一带，出身世代服役荷属东印度皇家陆军（KNIL）的军人世家）。他在荷兰布雷达皇家军事学院完成军官教育后返回东印度服役。印尼独立战争期间（1945—1950），范·兰亨出任“老虎旅”旅长，1948年12月荷兰发动第二次“警察行动”期间，他率部主攻共和国临时首都日惹，直接指挥了俘获苏加诺、哈达等印尼共和国领导人的军事行动，是该战役中荷方最具争议的指挥官之一——战后有退役军官暗示其部队在行动中曾有不留俘虏、就地处决的情况，但相关指控因保密协议长期未获证实。1949年至1950年，范·兰亨出任KNIL总参谋长，负责主持该军队解散前的收尾工作。1950年7月25日，他与荷方驻印尼武装力量总司令布尔曼·范·弗雷登中将一同获苏加诺总统在默迪卡宫接见，举行正式告别仪式；次日（7月26日）KNIL依王室谕令正式解散，结束近120年建制史，范·兰亨在此仪式上晋升少将军衔，是这支殖民军队历史终结时刻的见证者之一。晚年范·兰亨的家族历史因其外孙、荷兰历史学者及电视节目主持人汉斯·胡德库普所著传记《最后一人》（2012年）及系列纪录片《印度尼西亚在呼唤》而重新引发公众关注与反思，该系列作品追溯了范·兰亨在印尼独立战争期间的角色及其部队被指涉入战争罪行的历史争议。"
 CBIO_INS_djatikoesoemo_desc:0 "贾蒂库苏莫（1917年7月1日—1992年7月4日）出生于中爪哇梭罗，是梭罗苏南（苏丹）帕库布沃诺十世的次子，出身传统王室贵族家庭。他早年接受荷式教育，印尼独立战争期间投身国民军建设工作，凭借军事组织才能崭露头角。1948年至1949年，贾蒂库苏莫出任印度尼西亚陆军首任参谋长，负责建军初期陆军力量的整合与规范化工作，是建国初期军方高层核心人物之一。荷兰承认印尼独立后，贾蒂库苏莫转入外交领域，1958年至1960年出任印尼驻新加坡大使。2002年，贾蒂库苏莫被追封为印度尼西亚民族英雄，以表彰其在建军初期的贡献。"
 CBIO_INS_dr_boentaran_martooatmodjo_desc:0 "奔塔兰·马尔托阿特莫佐（1896年1月11日—1979年10月3日）出生于中爪哇普禾雷佐洛阿诺村一个爪哇贵族家庭。早年就读巴达维亚土著医科学校（STOVIA），1918年毕业成为医生，先后在三宝垄等地政府医院任职，曾参与处理1920年代加里曼丹霍乱疫情。1928年，奔塔兰获奖学金赴荷兰莱顿大学深造，期间加入“印度尼西亚学生协会”，结识艾哈迈德·苏巴尔佐、伊瓦·库苏马·苏曼特里等日后建国先驱。1931年获医学博士学位后返国，任职雅加达中央医院，后于1933年被派往三宝垄主持麻风病防治工作长达五年。日本占领时期，奔塔兰历任“祖国服务团”副团长、“先锋队”副团长等职，并作为独立筹备调查会成员参与1945年宪法起草工作，曾就宪法第32条条文措辞与苏波莫展开讨论，主张应明确写入国家对全体人民健康的保障责任。1945年8月19日印尼独立后，奔塔兰出任首届内阁首任卫生部长（任期至11月14日），任内于9月17日促成印度尼西亚红十字会成立，自己出任副会长，哈达任会长。此后奔塔兰转任国会议员等职，1979年10月3日在雅加达逝世，享年83岁。"
 CBIO_INS_dr_samsi_sastrawidagda_desc:0 "萨姆西·萨斯特拉维达格达（1894年3月13日—1963年）出生于中爪哇梭罗。早年赴荷兰鹿特丹商学院深造，1925年以论文《日本贸易政策的发展》获博士学位。留荷期间，萨姆西加入“印度尼西亚学生协会”，并曾在莱顿大学教授爪哇语课程。回国后，萨姆西活跃于泗水一带的合作社及新闻事业，1927年与苏加诺、伊斯卡格、萨托诺等人共同创立印度尼西亚民族党。日本占领时期，萨姆西任泗水税务管理处处长，并出任“祖国服务团”顾问及“中央参议院”成员。1945年8月19日，独立筹备委员会第二次会议决定设立12部及4名国务部长，萨姆西受委任为首届内阁首任财政部长。任内，萨姆西通过秘密渠道联络日方人士，策划从泗水埃斯康普托银行取得一批日方查扣的荷属东印度旧币，以“银行突袭行动”名义由人民治安军秘密转移，充作新生共和国的启动资金，是印尼建国初期财政史上的重要事件。惟因健康状况不佳，萨姆西于1945年9月末即辞去财政部长一职，由亚历山大·安德里斯·马拉米斯接任，此后萨姆西鲜少涉足政坛核心。1963年逝世。"
 CBIO_INS_gatot_soebroto_desc:0 "加托·苏布罗托（1907年10月10日—1962年6月11日）出生于中爪哇普禾加多。早年在荷属东印度接受教育后从军，1923年入马吉冷军校，毕业后加入荷属东印度皇家军队（KNIL）并晋升军士。1942年日本占领荷属东印度后，加托加入日方组建的“祖国防卫义勇军”（PETA），在茂物接受训练，先后出任连长、营长。1945年印尼独立后，加托投身国民军建设，独立战争期间历任师级指挥官，参与整合中爪哇地区武装力量。1949年荷兰威胁发动第三次“警察行动”之际，加托出任第三师（狄波尼哥罗师）师长。建国后长期在军队高层任职，1956年出任陆军副参谋长直至去世，期间与参谋长纳苏蒂安一同推动1959年恢复1945年宪法。1962年6月11日，加托在雅加达骤然辞世，一周后被追授印度尼西亚国家英雄称号。"
 CBIO_INS_gerardus_johannes_berenschot_desc:0 "赫拉尔杜斯·约翰内斯·贝伦斯霍特（1887年7月24日—1941年10月13日）出生于苏门答腊索洛克，是荷属东印度皇家陆军（KNIL）一位荷兰籍中校军官与本地混血夫人之子，家族属荷属东印度当地欧亚混血（“印欧”/Indo）群体。15岁时被送往荷兰阿尔克马尔军校就读，后进入布雷达皇家军事学院并以全班第一名成绩毕业，是唯一出身“印欧”背景而官至KNIL总司令的军官。返回东印度后，贝伦斯霍特曾长期在亚齐随荷军“宪兵队”参与镇压亚齐战争末期的抵抗活动，后历任荷兰高等军事学院教官（1925—1930）、KNIL总参谋长（1934年起）等职，1939年7月升任中将并出任KNIL总司令，主持在国际局势日益紧张背景下推动KNIL的现代化整军工作。贝伦斯霍特以处事沉稳、深孚众望著称，被普遍视为KNIL历史上最杰出的总司令之一，与英美等盟国将领关系融洽。1941年10月13日，贝伦斯霍特在巴达维亚与英军远东总司令布鲁克-波帕姆会晤后，搭乘飞机返回万隆途中于起飞后数分钟坠毁，机上人员全部罹难，死因坊间一度流传日谍破坏之说，但未获证实。荷属东印度当局下令全境降半旗致哀，贝伦斯霍特葬于万隆潘杜荷军公墓，其总司令一职由参谋长特尔·波尔滕接任。"
 CBIO_INS_gustav_adolf_ilgen_desc:0 "古斯塔夫·阿道夫·伊尔根生于1887年7月3日，德国威斯巴登，是荷属东印度皇家陆军步兵少将。其军旅履历长期隶属KNIL步兵系统，属于印尼独立战争前后荷属东印度高级军官团成员之一。1956年5月24日，伊尔根在荷兰海牙逝世。"
 CBIO_INS_gustave_statius_muller_desc:0 "生于1889年4月23日，荷属东印度默斯特·科尔内利斯，即今雅加达贾蒂内加拉地区，是荷属东印度皇家陆军工兵科少将级军官。1962年10月26日在荷兰海牙逝世。"
 CBIO_INS_harry_kuneman_desc:0 "约翰·赫尔曼·伯恩哈德·库内曼出生于西爪哇普禾加达。青年时期曾是荷兰足球运动员，1908年10月25日代表荷兰国家队出场一次国际比赛。此后库内曼转入荷属东印度行政系统任职，1933年至1936年出任东爪哇省省长，此后出任荷属东印度参事会成员。日本占领荷属东印度期间，库内曼作为参事会成员遭日方拘押，被关押于中爪哇一处平民集中营。1945年8月15日日本宣布投降后数周，库内曼于1945年9月7日在集中营内病逝，未及亲眼见证战争结束后的自由，葬于雅加达门滕布鲁荷兰军人公墓。"
 CBIO_INS_hein_ter_poorten_desc:0 "海因·特尔·波尔滕（1887年11月21日—1968年1月15日）出生于荷属东印度茂物，是荷属东印度皇家陆军（KNIL）军官之子。1908年从阿尔克马尔军校毕业后加入KNIL炮兵部队，后自费赴比利时、法国接受飞行训练，1911年成为荷兰首位获得国际飞行执照的职业军官，此后参与筹建KNIL航空部队初期工作，但1916年一次试飞事故中身负重伤，同机的KNIL总司令米希伦斯中将罹难，特尔·波尔滕此后转回炮兵及参谋系统任职。1919年起在荷兰高等军事学院深造，1922年返回东印度，1926年至1936年间两度在KNIL总参谋部任职，1939年7月升任总参谋长。1941年10月，时任KNIL总司令贝伦斯霍特因飞机失事罹难，特尔·波尔滕随即升任中将并接任总司令一职，同时兼任驻爪哇盟军（ABDACOM）陆军部队总司令。1942年3月，日军全面入侵爪哇，特尔·波尔滕在评估盟军已无力抵抗的情况下，与荷属东印度总督恰尔达商议后，于3月9日与日军今村均中将签署无条件投降协议。此后特尔·波尔滕被日军长期关押，辗转爪哇、台湾战俘营，1944年10月被押送至中国东北（伪满洲国）战俘营，1945年8月17日获释，此后返回荷兰，晚年始终为荷兰承认其战时功绩而奔走。1968年1月15日，特尔·波尔滕在海牙逝世。"
 CBIO_INS_hok_hoei_kan_desc:0 "简福辉（印尼语称Hok Hoei Kan，汉名简福辉，1881年1月6日—1951年3月1日）出生于巴达维亚一个显赫的土生华人望族，家族可追溯至爪哇最古老的华裔世家之一。1905年，简福辉获得与欧洲人平等的法律地位。1918年“人民议事会”首次召开时，简福辉即受委任为议员，此后长期担任该机构华裔社群代表，直至1942年日本占领解散该机构为止。1928年，简福辉出任“中华会”创党主席，该党主要吸引受荷兰教育的土生华人支持，主张与荷兰殖民当局合作以争取华人社群的种族与法律平等地位。简福辉政治立场总体偏向亲荷合作路线，1927年曾投票反对扩大“人民议事会”选举权范围，但1936年他也曾投票支持“苏塔尔乔请愿”。日本占领爪哇后，简福辉因其反日活动嫌疑被日方逮捕，拘押于芝马己集中营直至1945年日本投降。1951年3月1日，简福辉在雅加达逝世。"
 CBIO_INS_i_j_k_hendrowahyono_desc:0 "卡西莫早年就读土著初等学校（HIS），后升入MULO及AMS中学。1923年，卡西莫参与创立印度尼西亚天主教党，是荷属东印度末期最早成立的本土政党之一，他本人也以立场温和、致力于团结印尼各政治派系而著称。日本占领时期及印尼独立筹备阶段，卡西莫参与独立筹备调查会（BPUPKI）及独立筹备委员会（PPKI）的相关工作。印尼独立后，卡西莫长期活跃于国会政坛，并在建国初期多届内阁中出任农业部长。1986年8月1日，卡西莫在雅加达逝世，后获追认为印度尼西亚民族英雄。"
 CBIO_INS_iskandar_sjah_desc:0 "苏丹穆罕默德·贾比尔·沙阿出生于摩鹿加群岛特尔纳特，是特尔纳特苏丹国第47任统治者。其父穆罕默德·乌斯曼苏丹因抵制荷兰殖民当局干预苏丹国内政，于1914年遭荷方逮捕流放爪哇，此后特尔纳特苏丹之位长期虚悬，由荷属当局直接管理当地行政事务。贾比尔早年接受欧式基础教育，后转入巴达维亚初级中学深造。1929年，贾比尔被拥立为特尔纳特苏丹，是印尼独立后仍保有实际执政权力的最后一任特尔纳特苏丹。1944年，盟军自摩罗泰岛发起反攻东印度群岛，贾比尔一度秘密联络盟军并获接应撤离至澳大利亚；1945年日本投降后，他以荷属东印度皇家军队（KNIL）中校军衔身份返回特尔纳特，并出任北摩鹿加驻扎官。1946年，贾比尔参与荷方主导的马利诺会议与登巴萨会议，支持成立“东印度尼西亚邦”联邦体制，并当选东印度尼西亚邦参议院代表北摩鹿加地区议员。1949年至1950年，贾比尔出任东印度尼西亚邦内政部长。此后随着联邦体制于1950年并入统一印尼共和国，他逐渐淡出政坛，1975年7月4日在特尔纳特逝世。"
 CBIO_INS_iwa_kusuma_sumantri_desc:0 "伊瓦·库苏马·苏曼特里（1899年5月31日—1971年11月27日）出生于西爪哇加密士一个贵族家庭，早年就读于巴达维亚法律学校，1921年赴荷兰莱顿大学深造，期间出任“印度尼西亚学生协会”主席。此后他一度赴苏联东方劳动者共产主义大学求学，深入接触马克思主义理论。回国后，伊瓦投身劳工运动，在棉兰创办报纸并组织石油、电力行业工会，1929年因鼓动劳工权益活动遭荷兰殖民当局逮捕，流放至西新几内亚博文迪古集中营长达十年之久。日本占领时期，伊瓦于1943年获释返回爪哇。1945年印尼独立后，伊瓦出任首届内阁社会与劳工部长，同年加入陈马六甲领导的“斗争联盟”，因涉嫌1946年“七三事件”未遂政变遭沙里尔政府逮捕入狱一年半。此后他历任多届内阁国防部长、国务部长等职，1957年出任帕查加兰大学首任校长。伊瓦晚年著述颇丰，1971年11月27日在雅加达病逝，2002年被追封为印度尼西亚民族英雄。"
 CBIO_INS_jacob_jan_pesman_desc:0 "雅各布·扬·佩斯曼生于1888年，是荷属东印度皇家陆军步兵少将。1939年前后，他与皮埃尔·安托万·考克斯等人同属KNIL高级军官团，曾在万隆合影留念，反映其在殖民地军队高层中的地位。1950年，佩斯曼逝世。"
 CBIO_INS_kartosoewirjo_desc:0 "卡尔托苏维尔佐（1905年1月7日—1962年9月5日）出生于中爪哇井，早年就读于泗水荷属印度医科学校，期间寄住于伊斯兰联盟领袖佐克罗阿米诺托家中并深受其影响，后中断学业投身政治活动。1945年马斯友美党成立时，卡尔托苏维尔佐是其领导层成员之一，并在西爪哇发展该党组织。印尼独立战争期间，他领导的西爪哇伊斯兰武装长期与印尼共和国军保持合作关系，共同抵抗荷兰殖民军；但1948年荷方依伦维尔协定条款迫使共和国军撤出西爪哇后，卡尔托苏维尔佐拒绝随军撤离，与重新渗入该地区的共和国游击队爆发冲突。1949年8月7日，他单方面宣布成立“印度尼西亚伊斯兰国”（NII），自任“伊玛目”，领导“达鲁伊斯兰”运动对抗新生的印尼共和国政府，叛乱一度波及南苏拉威西、亚齐等地，并两度策划暗杀苏加诺未遂。经印尼政府军多年围剿，1962年6月卡尔托苏维尔佐在西爪哇格贝尔山被捕，同年9月5日被军事法庭判处死刑并执行。作为一位早年抗荷、后期却与新生共和国兵戎相见的复杂人物，卡尔托苏维尔佐的历史评价至今仍存在争议。"
 CBIO_INS_ki_hajar_dewantara_desc:0 "基·哈亚尔·德万塔拉（原名苏瓦迪·苏尔亚宁格拉特，Ki Hajar Dewantara，1889年5月2日—1959年4月26日）出生于日惹帕库阿拉曼王室世家，是帕库阿拉姆三世的孙辈。凭借贵族出身，他得以进入殖民地公立教育体系就读，后转入土著医科预备学校（STOVIA）但未毕业。1912年，德万塔拉与蒂普托·芒温库苏莫、杜韦斯·德克尔共同创立“东印度党”，是最早公开主张印尼独立的政治组织之一，不久遭荷兰当局取缔。1913年，他发表著名檄文《假如我是荷兰人》，尖锐批评荷兰殖民当局借“荷兰独立百年纪念”向包括印尼原住民在内的殖民地居民摊派捐款的做法，因此遭流放荷兰。流亡期间，他获得荷兰教师资格证，并深受福禄贝尔、蒙台梭利教育理念影响。1919年，德万塔拉返回印尼，1922年在日惹创办“塔曼西斯瓦”（意为“学生花园”）民族教育学校体系，专门招收此前被排斥于殖民地精英教育体系之外的普通印尼子弟，提出“在前者树立榜样，在中者激发意志，在后者给予支持”的教育理念，并首倡沿用至今的教育格言“从后引导”。1922年，时年满40岁的苏瓦迪依爪哇传统习俗更名“基·哈亚尔·德万塔拉”，并弃用贵族头衔“拉登·马斯”，以示与平民打成一片的决心。印尼独立后，德万塔拉出任首届内阁教育与文化部长，1957年获日惹加查马达大学荣誉博士学位。1959年4月26日，德万塔拉在日惹逝世，同年11月28日苏加诺追封其为印度尼西亚民族英雄暨“印尼民族教育之父”，其生日5月2日至今被定为印尼全国教育日。"
 CBIO_INS_ludolph_hendrik_van_oyen_desc:0 "路多尔夫·亨德里克·范厄延（1889年4月25日—1953年7月28日）出生于荷兰海牙，毕业于布雷达皇家军事学院及海牙高等军事学院，是荷属东印度军航空兵（ML-KNIL）高级将领。1943年至1946年间，范厄延出任ML-KNIL中将级总司令，主持流亡澳大利亚期间荷属东印度空军力量的重建与训练工作，并率部以盟军西南太平洋战区序列参与对日反攻作战。战后范厄延继续负责ML-KNIL在印尼独立战争期间的整军与作战指挥事务，直至1946年卸任。他曾获荷兰橙拿骚勋章军官衔及荷兰狮子勋章骑士衔，并获英美两国分别授予“巴斯勋章”同僚衔及“军功勋章”指挥官衔，反映其在盟军内部的声望。1953年7月28日，范厄延在海牙逝世。"
 CBIO_INS_mas_pardi_desc:0 "马斯·帕尔迪（1901年10月1日—1968年8月13日）出生于中爪哇安巴拉瓦。荷兰殖民统治时期，帕尔迪已是印尼本土少数活跃于航海领域的资深海员之一，1922年即在荷属东印度海军舰队担任大副。日本占领时期，他曾于日方创办的高级航海学校（SPT）任教，培养出苏多莫、阿里·萨迪金、马达迪纳塔等日后印尼海军重要将领。1945年印尼独立后，帕尔迪于同年9月10日联合雅加达本地海员创立“人民治安军海军部队”（BKR Laut），是印度尼西亚海军（ALRI）的直接前身，并出任该部队总参谋长（相当于今日海军参谋长一职），9月10日后来被定为印尼海军建军纪念日。1946年帕尔迪因年事渐高，交棒予穆罕默德·纳齐尔·伊萨接任海军领导职务，此后帕尔迪转向航海教育事业，1952年创办雅加达航海学院及三宝垄航海学校，并撰有多部航海学著作，被誉为“印尼航海学之父”。1958年，帕尔迪作为印尼代表团成员出席日内瓦国际海洋法会议。1968年8月13日，帕尔迪在三宝垄病逝，葬于当地英雄公墓。"
 CBIO_INS_moestopo_desc:0 "穆斯托波（1913年6月13日—1986年9月29日）出生于东爪哇谏义里，毕业于泗水牙科学校（STOVIT），曾任该校副校长及执业牙医。1945年印尼独立后，穆斯托波主导解除泗水地区日军武装，并在同年11月泗水战役期间参与指挥抵抗英军的行动，曾与英方指挥官马拉比进行谈判。1946年后穆斯托波转赴日惹从事军事教育工作，此后长期投身牙科医学教育，1958年创办牙科学院，1961年发展为大学并获印尼大学博士学位。1986年9月29日，穆斯托波在万隆病逝，2007年被追封为印度尼西亚民族英雄。"
 CBIO_INS_mohammad_hatta_desc:0 "穆罕默德·哈达（1902年8月12日—1980年3月14日）出生于苏门答腊布吉丁宜。1921年至1932年在荷兰求学期间，曾任民族主义团体“印度尼西亚学生协会”主席，积极宣传印尼独立主张。1932年从鹿特丹经济学院毕业后返回苏门答腊，继续投身民族独立运动，1933年出任国民教育党主席，1935年遭荷兰殖民当局逮捕流放。1942年日本占领荷属东印度后获释，与苏加诺一同利用日占当局提供的组织资源积蓄本土力量，1943年协助组建“祖国防卫义勇军”（PETA）。1945年8月17日，哈达与苏加诺联合发表印度尼西亚独立宣言，史称“双诺”，哈达出任首任副总统，后多次兼任总理及外交部长。1948年荷兰发动第二次“警察行动”期间，哈达与苏加诺一同被俘遭荷方拘押流放。1949年荷兰承认印尼独立后，哈达代表印尼出席圆桌会议协定谈判。哈达长期主张温和渐进的合作社经济路线，与苏加诺日趋集权、亲共的施政方向渐生分歧，1956年因不满苏加诺推行“指导民主”而辞去副总统职务，此后仍是印尼政坛具有重要影响力的元老人物，1980年在雅加达病逝。"
 CBIO_INS_mohammad_hunsi_tharmin_desc:0 "穆罕默德·胡斯尼·丹戎林（Mohammad Husni Thamrin，1894年2月16日—1941年1月11日），出生于巴达维亚韦尔特弗雷登。其父塔姆林·穆罕默德·塔布里曾任雅加达一带“韦达纳”（县级行政官）。丹戎林毕业于威廉三世国王中学后，先后任职政府部门及荷兰皇家邮船公司长达十年。1919年，他当选巴达维亚市议会议员，1929年出任副市长。1927年，时任总督德赫拉夫委任丹戎林递补人民议事会（“荷印国会”）议席空缺，此后历经1931年委任及1935、1939年两度当选连任。1930年1月27日，丹戎林在人民议事会宣布成立“民族派”，联合十位印尼民族主义议员共同发声，部分是对1929年苏加诺及印尼民族党成员遭逮捕一事的回应。他曾与库苏莫·乌托约一同赴东苏门答腊考察种植园劳工待遇，回国后在人民议事会公开谴责种植园主及当地体罚劳工的陋习。1935年，丹戎林成为“大印度尼西亚党”（Parindra）创党成员之一，1938年苏托莫医生逝世后接任该党副主席。1939年，丹戎林在人民议事会提议以“印度尼西亚”取代荷方沿用的“荷属东印度”称谓，该动议获会议多数支持，但遭荷兰政府否决；同年他主导四大民族主义团体联合成立“印度尼西亚政治联盟”（GAPI）。1941年1月6日，丹戎林因被指控与日方勾结而遭软禁，不得会客，五日后的1月11日猝然离世，年仅46岁，其死因存在争议，部分说法认为他系遭殖民当局暗中毒害或谋害，官方结论未予采信，葬于雅加达卡烈公墓。1960年，印尼政府追封丹戎林为民族英雄。"
 CBIO_INS_mohammad_natsir_desc:0 "穆罕默德·纳西尔（1908年7月17日—1993年2月6日）出生于西苏门答腊亚拉哈，早年接受伊斯兰宗教教育与荷式西式教育双重熏陶。1930年代，纳西尔投身伊斯兰教育与新闻事业，创办伊斯兰教育机构并主编刊物，逐渐成为伊斯兰现代主义思潮的重要代表人物。日本占领及印尼独立战争期间，纳西尔已是重要的伊斯兰政治活动家，1945年马斯友美党成立后长期担任其领导层核心成员。1946年至1949年，纳西尔历任新闻部长等职，积极通过外交渠道为印尼独立争取国际支持。1950年至1951年，纳西尔出任印度尼西亚共和国第五任总理（此时印尼刚恢复单一共和国体制），任内奉行伊斯兰改革路线，反对苏加诺日趋集权亲共的政治走向。1958年，纳西尔因公开支持地方分裂武装（印尼革命政府运动）而遭政府通缉，长期流亡在外，1961年被捕入狱，直至1966年获释。晚年纳西尔转而投身伊斯兰宣教及国际伊斯兰组织事务，1993年2月6日在雅加达病逝，2008年被追封为印度尼西亚民族英雄。"
 CBIO_INS_mohammad_nazir_isa_desc:0 "穆罕默德·纳齐尔·伊萨（1910年7月10日—1982年8月30日）出生于西苏门答腊阿甘马宁焦。早年赴荷兰求学并投身航海事业，1938年获荷兰“远洋航行”证书，是首位获此资格的印尼人。1938年回国后在荷兰航运公司任职，日本占领时期加入日本海军服役，1943年出任三宝垄高级航海学校校长。印尼独立后，纳齐尔与其他船长共同组建人民治安军海军部队并出任副司令，1946年2月起出任印度尼西亚国民军海军总参谋长，主持建国初期海军力量的组建工作，直至1948年。此后他历任交通部海运总局局长等职，1957年至1959年出任航运部长，后转任驻瑞士及梵蒂冈大使。1982年8月30日，纳齐尔在雅加达病逝，享年72岁。"
 CBIO_INS_mohammad_roem_desc:0 "穆罕默德·鲁姆（1908年5月16日—1983年9月24日）出生于中爪哇特马光。早年就读于巴达维亚医科预备学校，后转攻法律，1939年毕业于巴达维亚法学院，此后从事律师工作，并长期活跃于伊斯兰联盟党等伊斯兰政治组织。日本占领时期，鲁姆出任马斯友美党所属“回教军”青年副领袖。印尼独立战争期间，鲁姆凭借出色的外语与谈判能力，先后作为印尼代表团成员参与林牙椰蒂协定（1946）及伦维尔协定（1948）谈判。1949年，鲁姆出任印尼代表团团长，与荷兰代表范罗恩就恢复印尼主权问题展开谈判，同年5月7日签署“鲁姆-范罗恩协定”，为荷兰承认印尼独立、召开海牙圆桌会议奠定基础。此后鲁姆历任沙里尔第三届内阁内政部长、纳西尔内阁外交部长、维洛坡内阁内政部长、阿里·沙斯特罗阿米佐约第二届内阁第一副总理等要职。1960年马斯友美党被取缔后，鲁姆因涉嫌支持地方叛乱于1962年遭无审判拘押，至1966年方获释。1983年9月24日，鲁姆因肺部疾病在雅加达逝世。"
 CBIO_INS_murk_boersta_desc:0 "穆尔克·布尔斯塔（Murk Boerstra，1883年11月28日—1953年5月9日）是荷兰炮兵军官，后晋升中将。1935年至1939年间，他出任荷属东印度皇家陆军（KNIL）司令，位居殖民地陆军体系最高层。其任期正值荷属东印度当局因日益紧张的国际局势而推动军队现代化整备的初期阶段，为其后继者贝伦斯霍特、特尔·波尔滕接续的备战工作奠定基础。"
 CBIO_INS_musso_desc:0 "慕梭（印尼语全名穆诺纳尔·慕梭，Musso，1897年生于东爪哇谏义里农民家庭，卒于1948年10月31日）是印度尼西亚共产党资深领导人。1923年加入印尼共产党，翌年出任中央理事会理事并创办党报。1926年印尼共产党起义失败后，慕梭流亡苏联，1927至1928年在莫斯科东方大学（列宁大学）学习，并当选共产国际执行委员会委员。1935年，他奉共产国际指示秘密回国重建地下印尼共产党组织，不久后再度流亡苏联，直至二战结束后的1948年8月方才回国。回国后，慕梭在党内大力推动激进路线，发表《印度尼西亚共和国新道路》报告，同年8月当选印尼共产党总书记。"
 CBIO_INS_njono_desc:0 "约诺（印尼语全称约诺·普拉维罗，Njono，1925年8月28日—1968年10月，一说另有争议）出生于井里汶一带，是铁路职员之子。1931年入塔曼西斯瓦“人民学校”就读，1938年毕业。日本占领时期，约诺曾在雅加达《亚洲拉亚报》担任青年记者。印尼独立初期，约诺投身劳工运动，曾在雅加达地区中央印度尼西亚国民委员会及其工作机构任职，并领导克拉马特一带的有轨电车工人工会，加入印度尼西亚劳工党并一度代理其主席。1949年独立战争结束后，约诺在印尼工会运动中地位渐升，出任全印度尼西亚中央工人组织（SOBSI）总书记及主席，1954年12月正式申请加入印尼共产党，1955年当选国会议员，此后长期活跃于劳工与党务领域。"
 CBIO_INS_oerip_soemohardjo_desc:0 "乌里普·苏莫哈佐（1893年2月22日—1948年11月17日）出生名穆罕默德·西迪克，生于荷属东印度中爪哇普禾雷佐一个地方官员家庭。1914年毕业于巴达维亚军事学院，成为荷属东印度皇家军队（KNIL）少尉，此后近25年军旅生涯中屡获擢升，最终成为该军队中军衔最高的本土出身军官。1938年前后因与所驻地方官员不和而辞职退役，1940年纳粹德国入侵荷兰后被重新征召服役。1942年日本占领荷属东印度后，乌里普一度遭日方拘押于战俘营三个半月，余下占领时期赋闲在家。1945年10月14日，印尼宣告独立数月后，乌里普被任命为印度尼西亚国民军代理总司令兼总参谋长，凭借其丰富的荷属军队从军经验，负责将各地派系林立的零散抗日、抗荷武装力量整合为统一的正规军队，为苏迪尔曼其后领导的抵抗斗争打下组织基础。1948年11月17日，乌里普在任内病逝，未及见证翌年印尼独立获得荷兰正式承认。1964年，乌里普被追封为印度尼西亚民族英雄。"
 CBIO_INS_oto_iskandar_di_nata_desc:0 "奥托·伊斯坎达尔·迪·纳塔（1897年3月31日—1945年12月19日失踪，翌日被追认死亡），昵称“斗鸡”，出生于万隆一个巽他族贵族家庭。他早年投身“至善社”民族主义组织，历任万隆、北加浪岸分社副主席，并当选北加浪岸市议会议员，任内多次公开批评荷兰种植园主对当地民众的苛待。奥托还曾在荷属东印度殖民地议会（“人民议事会”）任职，为巽他族民众争取权益发声。1945年印尼独立后，奥托短暂出任国务部长，并投身整合各地零散抗日、抗荷武装力量的工作。1973年，奥托被追封为印度尼西亚民族英雄。"
 CBIO_INS_pierre_antoine_cox_desc:0 "生于1888年10月3日，荷兰阿纳姆，是荷属东印度皇家陆军步兵少将。1939年前后，他与雅各布·扬·佩斯曼等人同属KNIL高级军官团，在万隆等地参与殖民地陆军指挥体系。1979年4月12日逝世。"
 CBIO_INS_sam_ratulangi_desc:0 "萨姆·拉图兰吉（全名赫龙甘·绍尔·萨缪尔·雅各布·拉图兰吉，Sam Ratulangi，1890年11月5日—1949年6月30日）出生于北苏拉威西托恩达诺一个米纳哈萨族望族家庭。早年赴荷兰阿姆斯特丹求学，1919年获瑞士苏黎世大学数理学博士学位，是印尼首批获得欧洲博士学位的本土知识分子之一。回国后，拉图兰吉曾任教师及保险公司创办人，1927年在殖民地议会（“人民议事会”）任职，积极为本土民众争取政治与经济权益，并于同年创立“米纳哈萨统一党”。1937年出版《太平洋中的印度尼西亚》一书，曾预见日本可能因资源需求而侵略印尼群岛。1945年印尼独立后，拉图兰吉出任独立筹备委员会成员并参与宪法制定，同年8月22日被任命为苏拉威西省首任省长。1946年4月，拉图兰吉因“叛国罪”遭荷兰当局逮捕，流放至西新几内亚塞鲁伊三年。1948年底再度被荷方拘押，因健康恶化于1949年2月获准移至雅加达软禁，同年6月30日在雅加达病逝。1961年，拉图兰吉被追封为印度尼西亚民族独立英雄。"
 CBIO_INS_setyadjit_soegondo_desc:0 "塞蒂亚吉特·苏贡多生于1907年6月7日，是印度尼西亚社会党内左翼政治人物。二战前赴荷兰求学，曾任民族主义团体“印度尼西亚学生协会”主席；二战期间留在荷兰，参与反抗纳粹占领的地下活动。1946年回到印尼后投身社会党政治，先后在沙里尔第三届内阁任通讯部副部长，又在阿米尔·谢里夫丁第二届内阁任副总理。1948年“茉莉芬事件”期间，他与维卡纳等左翼人物卷入反政府行动，事件被镇压后于同年12月20日在茉莉芬遇害。"
 CBIO_INS_simon_spoor_desc:0 "西蒙·亨德里克·斯波尔（1902年1月12日—1949年5月25日）出生于荷兰阿姆斯特丹，父亲是荷兰音乐厅管弦乐团指挥。斯波尔早年就读阿尔克马尔军校及布雷达皇家军事学院，1923年任步兵少尉，1924年起被派驻荷属婆罗洲，1929年至1932年在海牙高等军事学院深造，后于万隆总参谋部任职两年，1934年转任布雷达军事学院战略战术教官。1938年，斯波尔重返荷属东印度，出任总参谋部政治事务处处长兼万隆高等军事学院职务。二战期间他一度流亡澳大利亚，负责荷属东印度流亡军事情报工作。1946年，斯波尔出任荷属东印度皇家陆军（KNIL）暨驻当地荷兰陆军总参谋长，主持对印尼共和国发动的两次“警察行动”军事攻势（1947年7月、1948年12月），期间荷军行动造成大量平民伤亡，备受国际社会谴责。1949年5月25日，斯波尔在巴达维亚突然病逝，荷方官方结论为心脏病发，但也有印尼方面人士称其在北苏门答腊地区遭伏击重伤后不治，死因至今存在不同说法。斯波尔葬于雅加达门滕布鲁荷兰军人公墓。"
 CBIO_INS_sjafruddin_prawiranegara_desc:0 "夏夫尔丁·普拉维拉内加拉（1911年2月28日—1989年2月15日）出生于万丹安耶尔基杜尔一个具有米南加保血统的贵族家庭。1939年毕业于巴达维亚法学院，1940年进入荷属东印度财政部门任职。日本占领及印尼独立初期，夏夫尔丁凭借与沙里尔的密切关系，历任多届内阁财政部长，负责筹划印尼独立货币的发行事宜。1948年12月19日，荷兰发动第二次“警察行动”攻占日惹，苏加诺、哈达等共和国领导人被俘，危急关头，时任福利部长的夏夫尔丁在苏门答腊武吉丁宜宣布成立“印度尼西亚紧急政府”（PDRI），代行总统职权长达七个月，维系了共和国的法统连续性，史称“没有总统府的总统”。1949年“鲁姆-范罗恩协定”签署后（该协定夏夫尔丁本人曾表示反对），他将治权交还苏加诺。此后夏夫尔丁历任副总理、财政部长，并出任印尼中央银行首任行长，任内以“夏夫尔丁削减”政策（将荷属货币面值削半）控制通货膨胀。1958年，夏夫尔丁因反对苏加诺“指导民主”路线，出任苏门答腊地方叛乱政权（印尼共和国革命政府）总理，叛乱失败后于1961年投降，遭监禁至1966年。晚年他持续批评苏哈托“新秩序”政权的腐败问题，1989年2月15日病逝，2011年被追封为印度尼西亚民族英雄。"
 CBIO_INS_soengkono_desc:0 "松科诺（1911年1月1日—1977年9月12日）出生于中爪哇普尔巴林加一个裁缝家庭。早年赴泗水求学，后赴望加锡修读船舶技术专业，曾在荷兰皇家海军任职。1943年，松科诺加入日本占领当局在班约马斯组建的“祖国防卫义勇军”（PETA），1945年初升任连长。日本投降后，松科诺于1945年9月出任泗水地区人民治安军（BKR）司令，主持以谈判方式和平解除当地日军武装。1945年11月泗水战役爆发，松科诺出任泗水城防司令，组织指挥印尼军民抵抗英军进攻，是这场印尼独立战争中最惨烈战役的核心指挥官之一。此后，松科诺历任东爪哇多支部队指挥官，1948年“茉莉芬事件”期间受命出任东爪哇军事长官，负责镇压平叛。建国后，松科诺继续在军队任职，1958年升任陆军监察总监，1968年退役，1977年在雅加达病逝。"
 CBIO_INS_soerjadi_soerjadarma_desc:0 "埃朗·苏里亚迪·苏里亚达尔玛（1912年12月6日—1975年8月16日）出生于东爪哇巴纽旺基一个具有井里汶王室血统的家庭，幼年父母相继过世，由外祖父抚养长大。1931年，苏里亚迪考入荷兰布雷达皇家军事学院，是获准入学的少数印尼裔学员之一，1934年毕业授少尉军衔。因荷兰殖民当局禁止印尼本土人士担任飞行员，苏里亚迪历经两次因罹患疟疾而落选的挫折后，终于于1938年从荷属东印度加利查蒂飞行学校毕业，但囿于种族歧视政策，毕业后长期未获正式飞行员资质认证，转任领航员、观测员等职。1942年日军入侵爪哇前夕，苏里亚迪曾参与轰炸日军舰船的作战行动。日本占领期间，他出任万隆警察局行政科长。1945年印尼独立后，苏里亚迪受命组建印尼空军力量，1946年4月9日被苏加诺正式任命为首任空军参谋长，是印度尼西亚空军（AURI）的主要奠基人，被誉为“印尼空军之父”。建军初期，他在玛古沃、马斯帕蒂、玛琅等地设立飞行、通信、伞兵等训练基地，并率先意识到印尼群岛地理特性对空降部队的战略价值，为日后印尼空军“快速部队”（伞兵部队前身）奠定基础；同时他大力支持早期国产飞机与直升机研发试验，并促成荷属“皇家荷印航空公司”改组为印尼国营嘉鲁达航空公司。苏里亚迪历任空军参谋长直至1962年，1960年“毛卡尔事件”（印尼空军中尉枪击总统府事件）及1962年“阿鲁海海战”引发的军种矛盾先后两度促使他主动请辞，均获苏加诺挽留或另作安排。1962年1月19日，苏里亚迪最终卸任空军参谋长一职，转任总统军事顾问、邮电部长等职，1968年退役。1975年8月16日，苏里亚迪在雅加达病逝，享年62岁，以军礼安葬于雅加达卡烈公墓。"
 CBIO_INS_soetardjo_kartohadikusomo_desc:0 "苏塔尔乔·卡尔托哈迪库索莫（1890年10月22日—1976年12月20日）出生于中爪哇布罗拉一个地方官员家庭。早年在荷属东印度殖民地行政体系内从基层文员做起，历任雷姆邦、博约内哥罗、布罗拉等地行政助理，1924年出任布罗拉三邦县知县。1931年，苏塔尔乔当选“人民议事会”议员，代表本土文官阶层利益。1936年，他向“人民议事会”提出著名的“苏塔尔乔请愿”，要求荷属东印度在十年内逐步获得与荷兰本土平等的自治地位，该请愿最终遭荷兰当局否决，但成为两战间温和渐进派民族主义运动的标志性事件。日本占领时期，苏塔尔乔出任雅加达驻扎官，并参与独立筹备调查会及独立筹备委员会工作。1945年独立宣言发表后，苏塔尔乔于9月6日出任印尼共和国首任西爪哇省省长，并曾参与冷雅斯登克洛事件及独立宣言文本起草工作的相关事务。此后他继续在政界、教育界及社会事务领域任职多年，1976年12月20日在雅加达逝世。"
 CBIO_INS_sudirman_desc:0 "苏迪尔曼（1916年1月24日—1950年1月29日）出生于荷属东印度中爪哇普尔巴林加。青年时期曾投身教育工作，1944年加入日本占领当局资助组建的“祖国防卫义勇军”（PETA），接受军事训练。1945年印度尼西亚独立后，苏迪尔曼在整合各地零散抗日、抗荷武装力量的过程中崭露头角，同年11月当选为印度尼西亚国民军首任总司令。1948年末，荷兰发动第二次“警察行动”，大举进攻共和国控制区，苏迪尔曼此时已身患严重肺结核，仍抱病率部撤离日惹，在爪哇腹地坚持领导游击抵抗长达数月，极大鼓舞了印尼军民的抗荷士气，成为印尼军方精神象征性人物。1949年印尼共和国政府迁回日惹后，苏迪尔曼病情持续恶化，于1950年1月29日病逝，享年34岁，印尼全国为此降半旗致哀。1964年，苏迪尔曼被追封为印度尼西亚民族英雄。"
 CBIO_INS_sukarno_desc:0 "苏加诺（1901年6月6日—1970年6月21日）出生于东爪哇泗水，父为爪哇教师，母亲出身巴厘印度教家庭，毕业于万隆理工学院，获土木工程学位。求学期间投身民族主义活动，1927年创立印度尼西亚民族协会（后改组为印度尼西亚民族党）并任主席，号召印尼人民团结争取脱离荷兰殖民统治，因此于1929年至1930年代两度遭荷兰殖民当局逮捕流放。1942年日本占领荷属东印度后，苏加诺获释，为争取印尼独立，一度与日本占领当局合作，借助其组织资源积蓄本土力量。1945年8月15日日本宣布投降后，苏加诺与穆罕默德·哈达于8月17日联合发表独立宣言，宣告印度尼西亚共和国成立，苏加诺出任首任总统。此后数年，苏加诺领导印尼人民以外交与军事手段抵抗荷兰重新殖民的企图，直至1949年荷兰正式承认印尼独立。执政期间，苏加诺奉行独立自主的不结盟外交政策，倡导召开1955年万隆会议，推动亚非国家团结，并提出融合民族主义、宗教与共产主义的“纳沙贡”理念，自1959年起推行“指导民主”，集权色彩渐浓。1965年“九·三〇事件”后，苏加诺的实权逐步被军方将领苏哈托削夺，1967年被撤销总统职权并遭软禁，1970年6月21日于雅加达病逝。"
 CBIO_INS_sultan_muhibuddin_desc:0 "架空虚构人物。“穆希卜丁”由阿拉伯语两部分构成：“穆希卜”（Muhibb，意为“热爱者”、“朋友”）和“丁”（Din，意为“宗教、信仰”，常特指伊斯兰教）。其最直接的含义就是“宗教的热爱者”或“信仰之友”。在伊斯兰世界的不同时期和地区，被多个杰出的个人和家族作为名字或尊号的一部分所采用。如马来西亚第五、第十四任最高元首，苏丹阿卜杜勒·哈利姆·穆阿扎姆·沙阿（Sultan Abdul Halim Mu'adzam Shah），其全名中就包含“穆希卜丁”（Muhibbuddin）。作为苏丹尊号的一部分。"
 CBIO_INS_supomo_desc:0 "苏波莫（1903年1月22日—1958年9月12日）出生于荷属东印度梭罗驻扎地苏科哈尔佐一个贵族家庭。早年就读于巴达维亚法学院，毕业后先后在梭罗法院及荷兰莱顿大学深造。回国后，苏波莫曾在巴达维亚高等法律学院任兼职讲师，并参与“爪哇青年”等民族主义组织活动。日本占领末期，苏波莫因其深厚的法学素养，获委任为独立筹备调查会及独立筹备委员会委员，与苏加诺、穆罕默德·亚明共同承担起草1945年宪法的核心工作，是印尼建国宪法的主要设计者之一。印尼独立后，苏波莫两度出任司法部长（1945年8月—11月、1949年12月—1950年9月）。此后他转向学术与外交领域，历任日惹加查马达大学与印度尼西亚大学教授，1951年至1954年出任印尼大学校长，1954年至1956年出任驻英国大使。1958年9月12日，苏波莫在雅加达病逝。"
 CBIO_INS_surachman_tjokoadisurjo_desc:0 "潘吉·苏拉赫曼·乔科阿迪苏里约（1894年8月30日—1952年11月16日）出生于中爪哇沃诺索博一个摄政王世家，是印尼首位本土化学工程师。1915年，苏拉赫曼获荷兰政府资助赴代尔夫特理工大学深造，1920年以化学工程学位毕业，归国后主持万隆一所化学实验室工作，期间与苏加诺等万隆民族主义者建立联系，并曾资助1928年第二届青年大会。1936年，苏拉赫曼调任巴达维亚殖民地经济部门任职。日本占领时期，他历任“祖国服务团”成员，1945年7月出任经济部门负责人。1945年8月19日印尼独立后，苏拉赫曼出任首届内阁经济部长（后改称福利部长），主持应对日占货币遗留导致的严重通货膨胀问题。1946年沙里尔第三届内阁期间，苏拉赫曼转任财政部长，任内首次发行印尼独立货币（“印度尼西亚共和国货币”），并于1946年4月主持发行印尼首批政府公债，45天内即募得目标金额的八成，不足一年即全额募足。1946年10月，苏拉赫曼卸任财政部长，由副手夏夫尔丁·普拉维拉内加拉接任。1949年印尼恢复主权后，苏拉赫曼于1950年2月出任印度尼西亚大学首任校长。1952年，苏拉赫曼作为印尼代表团团长赴荷兰谈判荷资锡矿国有化事宜，任务期间因高血压病发，1952年11月16日病逝于荷兰海牙。"
 CBIO_INS_sutan_sjahrir_desc:0 "苏丹·沙里尔（1909年3月5日—1966年4月9日）出生于西苏门答腊巴东班让一个米南加保贵族家庭。1929年赴荷兰求学，先后就读于阿姆斯特丹大学与莱顿大学法学院，期间接受社会主义思想熏陶，并短期出任“印度尼西亚学生协会”秘书。1932年回国后与哈达一同从事民族独立活动，1934年遭荷兰当局逮捕流放。日本占领荷属东印度期间，沙里尔是少数拒绝与日方合作、坚持从事地下抵抗的印尼民族主义领导人之一，并参与了1945年8月的冷雅斯登克洛事件与独立宣言的酝酿。1945年11月，年仅36岁的沙里尔出任印度尼西亚共和国首任总理，是当时世界上最年轻的政府首脑，此后三度组阁，任内主持与荷兰的早期谈判，促成1946年林牙椰蒂协定。1947年因协定内容让步过多引发左翼不满而辞职。1948年，沙里尔另立印度尼西亚社会党（PSI），在政治上与印尼共产党相抗衡。该党在建国初期一度颇具影响，但1955年大选表现不佳，1960年因涉嫌支持地方叛乱而被苏加诺取缔。1962年沙里尔因被控密谋罪遭无审判拘押，1965年因中风获准赴瑞士苏黎世就医，次年病逝于当地。"
 CBIO_INS_sutomo_desc:0 "苏托莫（1920年10月3日—1981年10月7日），民间昵称“东魔”，出生于泗水一个普通职员家庭，早年因家境贫困中断学业。日本占领时期，他曾在日方通讯社工作，1944年被选为日方扶植的“新人民运动”成员。1945年10月，苏托莫创立“印度尼西亚人民抵抗阵线”（BPRI），并创办“反抗电台”，以其极具感染力的演说风格号召泗水民众抵抗英军接管。同年11月，泗水战役爆发，这是印尼独立战争中最惨烈的一役，苏托莫的广播演说极大鼓舞了印尼军民的抵抗意志，战役虽以印尼一方战败告终，但极大激发了国际社会对印尼独立事业的同情与关注。1955年，苏托莫短暂出任布尔汉丁·哈拉哈普内阁国务部长。此后他与苏加诺渐生嫌隙，1965年后一度支持苏哈托上台，但很快转而批评“新秩序”政权的贪腐与滥权，1978年因言论遭当局拘押三年。1981年10月7日，苏托莫在麦加朝觐期间病逝。"
 CBIO_INS_syarif_kasim_desc:0 "谢里夫·卡希姆二世（原名东库·苏隆·谢里夫·卡希姆，1893年12月1日—1968年4月23日）出生于苏门答腊廖内锡亚克斯里因德拉普拉，是锡亚克苏丹国第11任苏丹谢里夫·哈希姆之子。早年在巴达维亚接受法律与政务教育，1915年其父病逝后，年仅21岁的他继位为锡亚克苏丹国第12任（末代）苏丹。执政期间，谢里夫·卡希姆锐意革新，大力兴办各类学校并资助本地青年赴埃及、欧洲留学，同时长期通过外交与经济手段暗中支持印尼民族独立运动，对荷兰殖民统治表现出隐性的不合作态度。1945年8月17日印尼独立宣言发表后，谢里夫·卡希姆二世于同年11月发电报向苏加诺总统宣誓效忠，宣布锡亚克苏丹国全境并入印度尼西亚共和国，并将包括黄金、珠宝及现金在内、总值约1300万荷兰盾的全部王室财产悉数捐献给新生共和国政府，是印尼建国初期规模最大的一笔民间捐助。此举激怒荷兰殖民当局，谢里夫·卡希姆被迫流亡亚齐，期间继续通过广播动员苏门答腊各地统治者效忠共和国。战后他往返雅加达、锡亚克与新加坡之间，晚年返回故里安度余生。1968年4月23日，谢里夫·卡希姆二世在北干巴鲁附近的鲁姆拜逝世，1998年被追封为印度尼西亚民族英雄。"
 CBIO_INS_syarif_muhammad_alkadrie_desc:0 "谢里夫·哈米德二世（原名谢里夫·阿卜杜勒·哈米德·阿尔卡德里，Sultan Hamid II，1913年7月12日—1978年3月30日）出生于西加里曼丹坤甸，其父为坤甸苏丹谢里夫·穆罕默德·阿尔卡德里。早年由两位英籍女教师抚养至12岁，精通英语，后接受荷式教育并毕业于荷兰布雷达皇家军事学院，成为荷属东印度皇家军队（KNIL）军官。日本占领期间，哈米德因与荷方关系密切遭日军拘押三年，其父及两位兄弟连同当地多名马来精英一同在“坤甸事件”中被日军处决，哈米德本人则幸免于难。1945年10月29日，哈米德继位为第七任坤甸苏丹，称哈米德二世。印尼独立战争期间，哈米德二世同情荷方立场，支持建立联邦制的“印度尼西亚合众国”以对抗爪哇为中心的统一共和国路线，并作为西加里曼丹邦代表参与马利诺会议、登巴萨会议及海牙圆桌会议谈判，1949年出任印尼联邦共和国不管部部长。1949年末，哈米德二世受哈达委托设计国徽，最终完成的“加鲁达潘查希拉”国徽方案于1950年正式采用，成为其留给印尼最重要且不受争议的遗产。然而，1950年1月，哈米德二世卷入前荷属特种部队军官韦斯特林策划的“正义女王军”（APRA）未遂政变，该政变企图颠覆联邦政府并暗杀包括国防部长哈孟古布沃诺九世在内的多名共和国要员，哈米德二世被指为幕后策划者之一而遭逮捕，监禁至1956年方获释。此案至今在印尼史学界存在争议，部分学者认为其罪责证据并不充分。晚年哈米德二世远离公众视野，1978年3月30日在雅加达病逝。"
 CBIO_INS_t_b_simatupang_desc:0 "T·B·西马图庞（1920年1月28日—1990年1月1日）出生于北苏门答腊锡迪卡朗一个巴塔克族基督教家庭。1940年考入万隆荷属东印度皇家军事学院，同年日军入侵中断学业。印尼独立战争期间，西马图庞加入西利汪宜师，凭借出色才干在军队高层中崭露头角。1948年荷兰发动第二次“警察行动”期间，他随部队转移至班纳兰坚持游击抵抗，战后据此写成回忆录《班纳兰来信》。1950年苏迪尔曼将军病逝后，年仅29岁的西马图庞出任印度尼西亚武装力量代理参谋长，是建国初期最年轻的军方高层领导人之一。1953年，西马图庞因立场问题被解除军职，此后转任国防部顾问及军事院校讲师，1959年正式退役。此后他投身基督教会事务，曾任印尼基督教教会联合会主席及世界基督教教会联合会主席等职。2013年，西马图庞被追封为印度尼西亚民族英雄。"
 CBIO_INS_tan_malaka_desc:0 "陈马六甲（印尼语称丹·马拉卡，全名拿督苏丹·马拉卡·西马布阿·伊布拉欣，生年约在1894年至1897年间，一般采信1897年6月2日，卒于1949年2月21日）出生于荷属东印度西苏门答腊省一个米南加保贵族家庭。1913年赴荷兰阿姆斯特丹求学，回国后于1921年出任印度尼西亚共产党主席，1922年因支持全国当店工人罢工遭荷兰当局逮捕流放，此后开始长达约二十年的海外流亡生涯，足迹遍及苏联、菲律宾、中国厦门、新加坡等地。1925年，陈马六甲率先提出建立“印度尼西亚共和国”的政治构想，1927年因与共产国际及印尼共产党路线分歧决裂，另立政党坚持独立革命路线。1942年日军占领新加坡后，他辗转回到苏门答腊，日占时期一度成为苏加诺的重要谋士。1945年独立宣言发表后，陈马六甲无法接受沙里尔政府与荷兰谈判妥协的立场，于1946年1月组织“斗争联盟”，主张荷兰军队全部撤出、印尼完全独立，一度迫使沙里尔辞去总理职务，后遭印尼当局逮捕入狱，直至1948年“茉莉芬事件”期间获释，随即另立“大众协商党”。1948年末荷兰军队占领日惹后，他被迫流亡东爪哇，投奔当地游击武装，1949年2月21日在东爪哇被印尼国民军右翼部队秘密处决，终年五十余岁。1963年，陈马六甲被追封为印度尼西亚民族英雄。"
 CBIO_INS_tjalling_bakker_desc:0 "贾林·巴克生于1885年10月7日，荷属东印度万鸦老，是荷属东印度皇家陆军中将级军官。其履历属于KNIL高级军官体系，晚年退役后居留荷兰。1962年4月18日，巴克在海牙逝世。"
 CBIO_INS_wirantakusumah_v_desc:0 "维拉纳塔库苏马五世（1888年11月23日—1965年1月22日）出生于西爪哇万隆一个传统贵族世家，是万隆摄政王库苏马迪拉加之子。五岁丧父后，他在多位监护人抚养下接受荷式教育，先后就读于欧洲人小学及高级中学，后转入土著官员培训学校。1912年，年仅24岁的维拉纳塔库苏马出任芝安珠尔县摄政王，是荷属东印度最年轻的摄政王之一；1920年调任万隆摄政王，先后两度出任此职（1920—1931年、1935—1945年），任内致力于发展当地经济与逊达文化事业，并长期担任“人民议事会”议员。日本占领末期，他获委任为独立筹备调查会及独立筹备委员会委员，参与建国准备工作。印尼独立后，维拉纳塔库苏马于1945年出任首任内政部长，后转任最高咨议会主席（1945—1948）。1948年至1950年，荷兰扶植成立联邦制“巴逊丹国”，维拉纳塔库苏马出任其唯一一任“国家守护者”（元首），该邦于1950年并入统一的印度尼西亚共和国后随之解散。1965年1月22日，维拉纳塔库苏马在长期患病后于万隆逝世。"
 CBIO_IRQ_abd_al_ilah_desc:0 "阿卜杜勒·伊拉·本·阿里（1913年11月14日—1958年7月14日），伊拉克摄政王（1939—1953年）兼王储。为汉志末代国王阿里之子、费萨尔一世之侄、加齐一世的堂兄弟。1939年加齐车祸身亡后被任命为幼主费萨尔二世的摄政。1941年拉希德·阿里联合“黄金方阵”四校发动亲轴心政变时遭罢黜，他逃往外约旦投奔叔父阿卜杜拉国王，英军反击成功后被恢复摄政地位。此后他与努里·赛义德一道成为伊拉克亲英亲西方政策的核心支柱，积极参与镇压国内左翼及民族主义反对运动。1953年费萨尔二世亲政后，他转任王储，但实际上仍在幕后深度介入政治决策。1958年7月14日政变中与费萨尔二世一同在里哈卜宫被杀，遗体遭拖过巴格达街头、焚烧侮辱。"
 CBIO_IRQ_abdullah_al-tell_desc:0 "阿卜杜拉·塔勒（1918年—1973年），约旦军官。1948年第一次中东战争期间，他以上校军衔指挥阿拉伯军团在耶路撒冷的战斗，在围攻耶路撒冷旧城的军事行动中发挥了关键作用。战后他因与约旦国王阿卜杜拉一世在巴勒斯坦问题上产生政治分歧而流亡埃及，在开罗出版回忆录揭露约旦与以色列之间的秘密谈判，引起阿拉伯世界震动。"
 CBIO_IRQ_abdullah_desc:0 "他是麦加大谢里夫侯赛因·本·阿里之次子、伊拉克费萨尔一世之兄弟，一战中参加阿拉伯大起义，1921年出任英国委任统治下的外约旦埃米尔，1946年外约旦独立后成为首任国王。他与伊拉克哈希姆王室为同族至亲——伊拉克摄政王阿卜杜勒·伊拉即其侄子。1948年第一次中东战争中他指挥阿拉伯军团占领约旦河西岸及东耶路撒冷。1951年7月在耶路撒冷阿克萨清真寺被巴勒斯坦民族主义者暗杀。他并非伊拉克本国官员，但与伊拉克哈希姆王室同属一族，其弟费萨尔一世曾为伊拉克国王，摄政王阿卜杜勒·伊拉亦为其亲族。"
 CBIO_IRQ_ahmed_barzani_desc:0 "谢赫艾哈迈德·巴尔扎尼，库尔德巴尔扎尼部族宗教及政治领袖，穆斯塔法·巴尔扎尼之兄。是纳克什班迪教团的谢赫，在巴尔扎尼地区拥有巨大的宗教权威与部族号召力。1931—1932年他领导了针对伊拉克中央政府的大规模库尔德起义，要求库尔德自治，起义遭英国皇家空军轰炸及伊拉克地面部队镇压后失败。此后他被流放至伊拉克南部，弟弟穆斯塔法继承了他在库尔德民族运动中的领导角色。他晚年逐渐退出政治前台。1969年逝世。"
 KUR_ahmed_barzani_desc:0 "谢赫艾哈迈德·巴尔扎尼，库尔德巴尔扎尼部族宗教及政治领袖，穆斯塔法·巴尔扎尼之兄。是纳克什班迪教团的谢赫，在巴尔扎尼地区拥有巨大的宗教权威与部族号召力。1931—1932年他领导了针对伊拉克中央政府的大规模库尔德起义，要求库尔德自治，起义遭英国皇家空军轰炸及伊拉克地面部队镇压后失败。此后他被流放至伊拉克南部，弟弟穆斯塔法继承了他在库尔德民族运动中的领导角色。他晚年逐渐退出政治前台。1969年逝世。"
 CBIO_IRQ_akram_mushtak_desc:0 "阿克拉姆·穆什塔克，伊拉克皇家空军最早的开创者之一。1929年伊拉克组建本国空军之初，仅选派五名飞行学员赴英国接受训练，穆什塔克即为其中之一，与纳提克·穆罕默德·哈利勒·塔伊、穆罕默德·阿里·贾瓦德（后于1937年与巴克尔·西德基一同遇刺）、哈夫兹·阿齐兹及穆萨·阿里同批受训，归国后驾驶德哈维兰“吉普赛蛾”教练机组成伊拉克空军首支中队。1931年马哈茂德·萨勒曼（后为“黄金方阵”四校之一）等人由陆军转入空军补充该批飞行员队伍。穆什塔克由此成为伊拉克现代空军奠基一代的代表人物。"
 CBIO_IRQ_ali_abn_hussein_desc:0 "他是麦加大谢里夫侯赛因·本·阿里之长子、伊拉克费萨尔一世及外约旦阿卜杜拉之兄。1924年其父退位后短暂继任汉志国王，但次年即被伊本·沙特的沙特势力击败，被迫流亡巴格达。此后定居伊拉克，其女儿阿里娅公主嫁给伊拉克国王加齐一世，生下费萨尔二世——这使得阿里成为费萨尔二世的外祖父、摄政王阿卜杜勒·伊拉的父亲。1935年在巴格达逝世。"
 CBIO_IRQ_ali_mahmud_al_shaykh_desc:0 "阿里·马哈茂德·谢赫·阿里·希亚齐·奥贝迪（1901年6月3日，生于阿布格莱布），伊拉克政治家。1922年投身政坛，当选迪瓦尼耶选区众议员。1937年希克马特·苏莱曼内阁中接替辞职的萨利赫·贾卜尔出任司法部长。1941年拉希德·阿里·盖拉尼第三届内阁中短暂出任外交部长，同年在其第四届内阁中转任司法部长。1941年政变失败后被逮捕入狱。此后一度淡出政坛，1952年在穆斯塔法·奥马里内阁中重返财政部长之职（接替被免职的易卜拉欣·沙班达尔），并在努尔丁·马哈茂德内阁中留任。其政治笔记于1985年经穆罕默德·侯赛因·祖拜迪整理考订后出版。"
 CBIO_IRQ_amir_al_illah_desc:0 "阿卜杜勒·伊拉·本·阿里（1913年11月14日—1958年7月14日），伊拉克摄政王（1939—1953年）兼王储。为汉志末代国王阿里之子、费萨尔一世之侄、加齐一世的堂兄弟。1939年加齐车祸身亡后被任命为幼主费萨尔二世的摄政。1941年拉希德·阿里联合“黄金方阵”四校发动亲轴心政变时遭罢黜，他逃往外约旦投奔叔父阿卜杜拉国王，英军反击成功后被恢复摄政地位。此后他与努里·赛义德一道成为伊拉克亲英亲西方政策的核心支柱，积极参与镇压国内左翼及民族主义反对运动。1953年费萨尔二世亲政后，他转任王储，但实际上仍在幕后深度介入政治决策。1958年7月14日政变中与费萨尔二世一同在里哈卜宫被杀，遗体遭拖过巴格达街头、焚烧侮辱。"
 CBIO_IRQ_bakr_sidqi_desc:0 "巴克尔·西德基·阿斯卡里（1890年，生于基尔库克附近—1937年8月11日，卒于摩苏尔），库尔德裔伊拉克陆军将领，1936年政变主谋（现代阿拉伯世界首次军事政变）。奥斯曼帝国军校出身，一战中加入费萨尔的阿拉伯起义军。1921年进入英国委任统治下的伊拉克陆军，因才干出众迅速晋升。1933年8月他奉命率军“平定”北部亚述人，在西米勒地区实施了对亚述平民的无差别屠杀（西米勒惨案），包括妇女儿童在内约三千人遇害，西德基却因此被国内民族主义者奉为英雄并晋升准将——这一事件后来启发了拉斐尔·莱姆金提出“种族灭绝”概念。1935年他以同样的铁腕手段镇压南部什叶派部族叛乱。1936年10月29日他以代理参谋长身份调动忠于自己的部队向巴格达进军，空军在首都上空散发传单要求更换内阁，成功推翻亚辛·哈希米政府并扶植希克马特·苏莱曼出任首相，自己则以参谋长身份实际掌权。1937年8月11日他在摩苏尔机场准备赴土耳其访问时被反对派军人枪杀，在权力巅峰仅十个月。"
 CBIO_IRQ_fahmi_said_desc:0 "法赫米·萨伊德（1898—1942），伊拉克陆军上校，“黄金方阵”四校之一，1941年反英政变的军方核心成员。1898年生于苏莱曼尼亚，父亲是出身安巴克部落的阿拉伯人，母亲有土耳其血统；早年在奥斯曼军队任中尉，后曾短暂在叙利亚阿拉伯军服役，再加入新独立的伊拉克王国皇家陆军。政变及英伊战争期间，他统辖独立机械化旅，凭借该部机动性在夺取巴格达电报、电话枢纽和控制首都的行动中发挥重要作用。他与萨拉赫丁·萨巴格、卡米尔·沙比卜、马哈茂德·萨勒曼一道罢黜摄政、拥立盖拉尼执政。政变被英方镇压后，他被判处死刑，并于1942年5月5日被绞死。"
 CBIO_IRQ_faisal_ii_desc:0 "费萨尔·本·加齐（1935年5月2日，生于巴格达—1958年7月14日，卒于巴格达），伊拉克末代国王（1939—1958年在位）。三岁时因父亲加齐一世车祸身亡而继位，由母舅阿卜杜勒·伊拉亲王任摄政。1941年拉希德·阿里政变期间，摄政遭罢黜，幼年费萨尔随母亲撤至英国避难，在哈罗公学就读期间与堂弟、日后的约旦国王侯赛因结下深厚友谊。1953年年满十八岁亲政后，实际仍倚重叔父及老牌政治家努里·赛义德。1950年代石油收入增加，政府将大量收入投入开发项目，但社会不公与贫困未获根本改善，加之1955年加入巴格达公约、1956年苏伊士危机中未能有力声援埃及，使王室声望急剧下降。1958年2月与约旦组建阿拉伯联邦以抗衡埃叙联合共和国。1958年7月14日凌晨，阿卜杜勒·卡里姆·卡西姆准将率部发动政变，费萨尔下令卫队不予抵抗并投降，随即在里哈卜宫庭院中与叔父阿卜杜勒·伊拉等王室成员一同被机枪射杀，哈希姆王朝在伊拉克三十七年的统治就此终结。"
 CBIO_IRQ_fawsi_al_kaukji_desc:0 "法齐·卡武齐（1890年—1977年），黎巴嫩/叙利亚裔泛阿拉伯军事人物，与伊拉克有密切渊源。出身黎巴嫩的黎波里，奥斯曼帝国军校毕业。一战后投身阿拉伯民族主义军事运动，1925年参加叙利亚大起义反抗法国委任统治。1936年巴勒斯坦阿拉伯大起义期间他率领志愿军进入巴勒斯坦与英军作战，成为泛阿拉伯武装抵抗运动的标志性人物。1941年伊拉克拉希德·阿里政变期间他亦参与其中。1948年第一次中东战争中他指挥阿拉伯解放军在巴勒斯坦北部作战。此后长期流亡贝鲁特。1977年逝世。"
 CBIO_IRQ_fritz_grobba_desc:0 "弗里茨·格罗巴（1886年7月18日—1973年9月2日），德国外交官，纳粹德国中东政策的核心执行者。1932—1939年及1941年两度出任德国驻伊拉克公使。精通阿拉伯语，在巴格达建立了广泛的情报与宣传网络，向伊拉克军方及政界人士输送纳粹意识形态，与“黄金方阵”四校及拉希德·阿里·盖拉尼保持密切联系。1941年政变期间他是德方与伊拉克反英势力之间的主要联络人，协调德国对伊拉克的军事援助。政变失败后撤回德国，此后在沙特阿拉伯等地从事外交工作。战后被美军拘押后获释。1973年逝世。"
 CBIO_IRQ_ghazi_i_desc:0 "加齐·本·费萨尔（1912年3月21日，生于麦加—1939年4月4日，卒于巴格达），伊拉克王国第二任国王（1933—1939年在位），费萨尔一世独子。幼年随祖父、麦加大谢里夫侯赛因·本·阿里长大，1924年哈希姆家族被沙特势力逐出汉志后迁至巴格达，被立为王储。1933年9月费萨尔一世病逝后继位。与其老练的父亲截然不同，加齐性格内向缺乏政治经验，却怀有强烈的泛阿拉伯民族主义热情，公开反对英国对伊拉克事务的干涉。他在祖胡尔王宫私设广播电台，宣传吞并科威特等激进主张，据传同情纳粹德国。1936年他支持巴克尔·西德基将军发动政变（现代阿拉伯世界首次军事政变），以军人政府取代文官内阁。1939年4月4日加齐驾驶跑车在巴格达撞车身亡，终年二十七岁，官方说法为交通事故，但坊间广泛流传他系被努里·赛义德等亲英势力谋害的猜测。其年仅三岁的幼子费萨尔二世继位，叔父阿卜杜勒·伊拉出任摄政。"
 CBIO_IRQ_hamdi_al_pachachi_desc:0 "哈姆迪·帕萨齐（Hamdi al-Pachachi，1886—1948）是伊拉克政治家，出身巴格达名门帕萨齐家族，其弟穆扎希姆·帕萨齐亦曾任首相。早年在伊斯坦布尔皇家学堂攻读法律，1909年毕业，后在巴格达法学院任教并加入阿拉伯民族主义“盟约社”。因支持1920年反英起义一度被流放至波斯湾亨贾姆岛。此后经商务农，1935年当选众议员，1941年任社会福利大臣，1941—1943年任众议院议长。1944年6月至1946年2月出任首相：任内放宽新闻审查、推行1945年“米里·瑟尔夫”土地改革法，外交上着力加强阿拉伯联盟合作、释放1941年政变后被拘的民族主义者，路线较努里·赛义德更倾向阿拉伯民族主义。因与摄政阿卜杜勒·伊拉不睦，1946年2月被迫辞职，1948年任外交大臣，同年3月28日逝世。"
 CBIO_IRQ_harry_george_smart_desc:0 "哈里·乔治·斯玛特（1893年—1963年），英国皇家空军副元帅。1941年英伊战争期间，他担任伊拉克哈巴尼亚皇家空军基地的英方指挥官。当拉希德·阿里的政变军队包围哈巴尼亚基地并要求英军不得活动时，斯玛特拒绝最后通牒，下令以基地有限的训练机和过时战斗机发动先发制人的空袭，成功击退了围攻部队，为英军随后的全面反击赢得了关键时间。哈巴尼亚保卫战被视为二战中东战场的转折点之一。"
 CBIO_IRQ_hikmat_suleiman_desc:0 "希克马特·苏莱曼（1889年—1964年），伊拉克政治家，1936年巴克尔·西德基政变后出任首相（1936年10月—1937年8月）。出身巴格达显赫家庭，兄弟中亦有多人从政。1936年10月他与西德基将军联手推翻亚辛·哈希米政府，以文官首相身份组阁，背后实际军权掌握在西德基手中。其内阁推行了若干社会改革措施，但政权本质上依赖军人支撑。1937年8月西德基在赴土耳其途中遭军中对手暗杀，苏莱曼随即失去军事靠山并被迫辞职。此后淡出核心政坛。1964年逝世。"
 CBIO_IRQ_husain_al_rahhal_desc:0 "侯赛因·拉哈勒（约1900年—1927或1928年），伊拉克最早的马克思主义思想家之一。出身纳西里耶，早年在巴格达及贝鲁特接受教育期间接触马克思主义思想。1920年代他是在伊拉克传播社会主义与共产主义理论的先驱者，参与创办了伊拉克最早的左翼政治小组及出版物。他英年早逝，年仅二十余岁，但其思想启蒙工作为此后伊拉克共产党的建立奠定了重要的知识基础。"
 CBIO_IRQ_jafar_al_timman_desc:0 "贾法尔·阿布·提曼（Ja’far Abu al-Timman，1881—1945）是伊拉克民族主义运动元老。生于巴格达一什叶派商人世家。1919年起投身秘密政治团体“独立卫士”，1920年参与反英大起义，在中幼发拉底一带领导起义者并筹措经费，主张建立由逊尼、什叶共治的完全独立的伊拉克。起义失败后一度流亡波斯，费萨尔一世加冕后归国，创立“国民党”。他坚决反对教派政治、主张政教分离，被视为连接逊尼与什叶两派的桥梁人物，1930年抵制大选以抗议《英伊条约》。1936年巴克尔·西德基政变后出任希克马特·苏莱曼内阁的财政大臣，次年因不满苏莱曼揽权及血腥镇压什叶派起义而辞职。长期任巴格达商会会长（1935—1945），1945年11月在一场爆炸中身亡。"
 CBIO_IRQ_jamil_abdul_wahab_desc:0 "贾米勒·阿卜杜勒·瓦哈卜·阿卜杜勒·拉扎克（1913年，生于巴格达—1973年，卒于贝鲁特），伊拉克律师、法官兼政治家。在巴格达完成中小学教育后入读法律学院，1931年毕业。1933年投身司法界任职，后转而执业律师并从政。1940年及1943年两度当选迪亚拉选区众议员，并两度当选律师界代表。哈希姆王朝末期他历任教育大臣、社会事务大臣及司法大臣等多个内阁要职，是伊拉克王国晚期文官政府中的资深法律官员。1973年在贝鲁特逝世。"
 CBIO_IRQ_jamil_al_midfai_desc:0 "贾米勒·米德法伊（Jamil al-Midfai，1890—1958）是伊拉克政治家，曾五度出任首相。生于摩苏尔，一战期间在奥斯曼军队服役，1916年被俄军俘虏后转投英方支持的阿拉伯大起义，战后在费萨尔短暂统治叙利亚期间任其副官。1920年返回伊拉克参与反英大起义，因民族主义活动被迫流亡外约旦，1923年获准回国，此后历任多地省长，1930年入阁并任众议院议长。他以温和、妥协的政治风格著称，先后于1933、1935、1937—1938、1941及1953年五次组阁；1938年其内阁在“黄金方阵”军人施压下垮台。作为坚定的君主派，1941年拉希德·阿里政变期间他随摄政阿卜杜勒·伊拉一同流亡，英军平定政变后于6月再度组阁以稳定局势。晚年任参议院议长，1958年10月26日因肺癌逝世。"
 CBIO_IRQ_kamil_al_jaderji_desc:0 "卡米尔·查迪尔奇（1897年—1968年），伊拉克国家民主党创始人兼领袖。出身巴格达显赫家族，法学教育背景。1930年代他是进步知识分子团体“人民报”（阿哈利）运动的核心成员，主张社会改革与民主化。1936年巴克尔·西德基政变后曾短暂参与苏莱曼内阁。此后他创立国家民主党，成为哈希姆王朝时期最重要的合法民主反对派力量之一，主张议会民主、土地改革及限制王室权力。1940—1950年代他多次遭到当局逮捕与迫害。1958年革命后初期一度获释参政，但很快对卡西姆政权的专制倾向感到失望。1968年逝世。"
 CBIO_IRQ_kamil_shabib_desc:0 "卡米尔·沙比卜（1895—1944），伊拉克陆军上校，“黄金方阵”四校之一，1941年反英政变的军方核心成员。1895年生于巴格达；一战期间在奥斯曼军队中任军官，1921年加入新独立的伊拉克王国皇家陆军。政变及英伊战争期间，他统辖驻巴格达一带的第1步兵师，是拥立盖拉尼、驱逐摄政阿卜杜勒·伊拉的核心力量之一。政变失败后，他与其他三校一同出逃，此后被擒回国，经审判被判处死刑，于1944年8月20日在巴格达被绞死。"
 CBIO_IRQ_mahmud_salman_desc:0 "马哈茂德·萨勒曼（1889—1942），伊拉克皇家空军上校，“黄金方阵”四校之一，也是四人中唯一的空军军官。1889年1月7日生于巴格达；早年先后在奥斯曼、叙利亚和伊拉克三国军队中服役，1925年加入伊拉克军队，后转入伊拉克空军并升任空军司令。1937年巴克尔·西德基政变之后，他是策划处决西德基的一小群军官之一。1941年政变期间，他主管空军方面的协调与指挥，与萨拉赫丁·萨巴格等三校一道罢黜摄政、拥立盖拉尼执政。政变被英方镇压后，他被军事法庭审判并处决，于1942年5月5日行刑。"
 CBIO_IRQ_maruf_al_rusafi_desc:0 "马鲁夫·拉萨菲（1875年—1945年），伊拉克著名阿拉伯语诗人、民族主义者兼教育家。出身巴格达库尔德裔家庭。早年在伊斯坦布尔接受教育并开始文学创作，以古典阿拉伯诗歌的精湛技艺配合尖锐的社会批判著称，作品主题涉及妇女解放、教育改革、反殖民主义及社会正义，被誉为伊拉克现代文学的奠基人之一。他同时活跃于政坛，当选过议员，公开批评政府腐败与英国干涉。晚年他撰写了一部极具争议的伊斯兰教创立史著作，因挑战正统叙事而长期未能出版。关于加齐一世1939年车祸身亡是否系谋杀的问题，拉萨菲是坚持“谋杀论”的著名知识分子之一。1945年在巴格达逝世。"
 CBIO_IRQ_max_von_oppenheim_desc:0 "马克斯·冯·奥本海姆（1860年7月15日—1946年11月15日），德国考古学家兼情报官，出身科隆银行家家族（犹太裔皈依新教）。一战期间他为德国政府制定了鼓动伊斯兰世界对协约国发动“圣战”的战略方案，被视为德国利用宗教进行地缘政治操纵的先驱。同时他也是一位严肃的考古学家，发现了叙利亚泰勒·哈拉夫遗址。二战期间已年逾八十的他再度被纳粹政府启用，参与对阿拉伯世界的宣传与煽动工作，与伊拉克1941年亲轴心政变的情报策划有间接关联。1946年逝世。"
 CBIO_IRQ_mohamed_hadid_desc:0 "穆罕默德·哈迪德（1907年—1999年），伊拉克经济学家兼政治家，国家民主党重要成员。出身摩苏尔，在伦敦政治经济学院接受教育，回国后投身政治与经济改革事业。作为民族阵线的核心人物之一，他参与了摩萨台时期石油国有化运动的相关讨论，在伊拉克国内倡导类似的石油利润改革方案。1950年代他是国家民主党的关键经济政策理论家。1958年革命后一度出任财政部长。他同时也是一位成功的实业家。其女儿扎哈·哈迪德后来成为举世闻名的建筑师（2004年普利兹克奖得主）。1999年逝世。"
 CBIO_IRQ_mohamed_mahdi_kubba_desc:0 "穆罕默德·马赫迪·库巴（Muhammad Mahdi Kubba，1900—1984）是伊拉克民族主义政治家，独立党领袖。独立党1945年12月成立，前身为“穆桑纳俱乐部”，主张伊拉克完全独立与泛阿拉伯主义，不少成员曾支持1941年反英政变，是哈希姆王朝后期最重要的反对党之一，曾在1948年大选中赢得单一政党最多席位。库巴长期领导该党，1953年起与“自由军官”运动合作推动变革。1958年七月革命推翻君主制后，他被任命为三人“主权委员会”成员，代表什叶派与代表库尔德人、逊尼派者共同行使国家元首职权。晚年撰有回忆录。1984年逝世。"
 CBIO_IRQ_muhammad_amin_zaki_desc:0 "穆罕默德·阿明·扎基（1880年—1948年），库尔德裔伊拉克将军、学者兼政治家。出身苏莱曼尼亚地区库尔德名门，奥斯曼帝国军校毕业后在奥斯曼军中服役。伊拉克独立后进入政坛，曾出任内阁部长。同时他是一位多产的历史学者，以研究库尔德民族历史著称，著有《库尔德人与库尔德斯坦史》等重要著作，是库尔德民族史书写的奠基人之一。1948年逝世。"
 CBIO_IRQ_muhammad_husayn_kashif_al_ghita_desc:0 "穆罕默德·侯赛因·卡希夫·盖塔（约1877年—1954年），伊拉克什叶派大教长（玛尔贾），纳杰夫阿勒·卡希夫·盖塔学术家族的领袖。作为二十世纪上半叶伊拉克什叶派最具权威的宗教领袖之一，他在宗教法学、教派关系及政治事务中拥有广泛影响力。他主张什叶派与逊尼派团结，支持阿拉伯民族统一运动，在伊拉克国内政治危机中多次以宗教权威身份充当调解角色。同时他也是一位多产的宗教学者，著述涵盖教法、教义及伊斯兰哲学等领域。1954年逝世。"
 CBIO_IRQ_mustafa_barzani_desc:0 "穆斯塔法·巴尔扎尼（1903年3月14日，生于巴尔赞—1979年3月1日，卒于美国华盛顿特区），库尔德民族运动最具标志性的领袖。谢赫艾哈迈德·巴尔扎尼之弟。1930年代参与其兄领导的库尔德起义，1943年再度在伊拉克北部发动武装抗争，遭伊拉克政府军镇压后于1945年率部撤入伊朗。1946年他在苏联支持下参与建立短暂的马哈巴德库尔德共和国，出任该共和国军队总司令。马哈巴德共和国于同年底被伊朗政府摧毁后，穆斯塔法率残部翻越雪山进入苏联避难，在苏联流亡长达十一年。1958年伊拉克革命后应卡西姆将军之邀回国，此后领导库尔德民主党（KDP）与伊拉克历届政府反复进行和战交替的武装斗争，成为二十世纪库尔德民族解放运动的象征。1975年在伊朗撤回支持后起义崩溃，他流亡美国并于1979年在华盛顿因肺癌逝世。其子马苏德·巴尔扎尼后来出任伊拉克库尔德斯坦自治区主席。"
 CBIO_IRQ_naji_al_suwaidi_desc:0 "纳吉·苏瓦伊迪（Naji al-Suwaidi，1882—1942）是伊拉克政治家，陶菲克·苏瓦伊迪之兄。1929年11月，在前首相阿卜杜勒·穆赫辛·萨敦自杀后受命组阁出任首相。其任内正值街头抗议高涨、舆论要求签订通往独立的条约之际，加之遭国王费萨尔一世与努里·赛义德掣肘，他于1930年3月辞职，在任仅约四个月。1937年他主持了声援巴勒斯坦阿拉伯人、反对犹太复国主义的首届布卢丹泛阿拉伯会议。此外历任财政大臣等要职，是伊拉克独立初期的建制派政要之一。1942年8月17日逝世。"
 CBIO_IRQ_nuri_as_said_desc:0 "努里·赛义德（1888年12月，生于巴格达—1958年7月15日，卒于巴格达），伊拉克哈希姆王朝头号政治强人，先后八次出任首相。1906年毕业于伊斯坦布尔军校，一战期间加入费萨尔一世领导的阿拉伯大起义，此后成为费萨尔最信赖的军事及政治助手。1930年首次出任首相，签署《英伊条约》为伊拉克加入国际联盟铺路，但该条约赋予英国在伊永久驻军权，也使他背负“亲英”的政治标签。1936年巴克尔·西德基政变后他逃入英国使馆并流亡埃及。1938年回国后与“黄金方阵”军官合作推翻米德法伊内阁、重新执政。1941年拉希德·阿里政变后再度流亡，英军平乱后于同年10月第三次出任首相。此后他主导伊拉克对轴心宣战、签订新石油利润分成协议、加入巴格达公约，并于1958年出任伊拉克—约旦阿拉伯联邦首任首相。1958年7月14日革命翌日，他女扮男装试图出逃被识破，遭暴民杀害。"
 CBIO_IRQ_rashid_ali_algaylani_desc:0 "拉希德·阿里·盖拉尼（1892年—1965年8月28日），伊拉克民族主义政治家、1941年反英政变领袖。出身巴格达逊尼派显贵家庭。1930年代先后出任内务大臣及首相。1941年4月他联合“黄金方阵”四名亲轴心上校发动政变，罢黜摄政阿卜杜勒·伊拉，自任首相并寻求纳粹德国及意大利军事援助，试图摆脱英国对伊拉克的控制。英军以哈巴尼亚空军基地为据点发起反击（英伊战争），德国承诺的援助迟迟未能大规模到达（仅派少量飞机由容克将军指挥），政变军队在五月底被击溃。盖拉尼携耶路撒冷大穆夫提阿明·侯赛尼等人先逃往伊朗，后辗转至纳粹德国。其出逃后巴格达爆发针对犹太社区的“法胡德”暴乱。战后他流亡沙特阿拉伯及埃及，1958年伊拉克革命后一度回国，1965年在贝鲁特逝世。"
 CBIO_IRQ_saib_shawkat_desc:0 "赛义卜·肖卡特（1898年—1984年2月13日），伊拉克外科医生兼泛阿拉伯民族主义活动家，努里·赛义德政府首相纳吉·肖卡特之弟。出身格鲁吉亚裔巴格达显贵家庭，1913—1918年就读伊斯坦布尔医学院，后赴德国深造普通外科。他是伊拉克首位在皇家医学院讲授解剖学的本国医生，1930年代出任巴格达医院总监，1940年代出任医学院院长，是伊拉克现代外科的开拓者之一。1932年他是伊拉克红新月会创始委员会成员。政治上他是狂热的泛阿拉伯民族主义者，深受欧洲法西斯主义影响，1933年发表题为《死亡的制造》的著名演讲，号召青年以战争与牺牲实现阿拉伯统一，广为伊拉克学校传诵。1938年出任教育总监后，他与塔哈·哈希米于1939年共同创立“马斯纳俱乐部”（以7世纪阿拉伯名将命名），并一手缔造了仿照希特勒青年团模式的“福图瓦”青年军事化组织，将民族主义意识形态灌输编入学校课程体系。1941年5月31日“法胡德”暴乱期间，身为巴格达中心医院总管的他曾亲自持枪弹压蓄意侵犯犹太伤患的军人，救治了大批遇袭的犹太平民——这一举动与他本人的泛阿拉伯民族主义及反犹立场形成鲜明反差。"
 CBIO_IRQ_salah_al_din_al_sabbagh_desc:0 "萨拉赫丁·萨巴格（1889—1945），伊拉克陆军上校，“黄金方阵”之首，1939至1941年间伊拉克军中泛阿拉伯民族主义势力的灵魂人物。1889年生于摩苏尔，早年在当地受教育，后入伊斯坦布尔的奥斯曼军事学院，1915年毕业任军官；一战期间在巴勒斯坦和马其顿服役并一度被俘，后投奔埃米尔费萨尔，1921年回到伊拉克加入伊拉克军队，其军事教育还包括在比利时和英国进修的课程。1924年起他在巴格达军事学院任教官，后转参谋学院，1937年升任伊拉克陆军副参谋长。作为民族主义者，他还督导“福图瓦”青年准军事运动的训练；他推崇耶路撒冷大穆夫提阿明·侯赛尼，与之及拉希德·阿里·盖拉尼一道向轴心国寻求对泛阿拉伯目标的支持，并成为1941年英伊战争的主要鼓吹者。1941年4月，他与法赫米·萨伊德、卡米尔·沙比卜、马哈茂德·萨勒曼三位上校联手发动政变，拥立盖拉尼执政、驱逐摄政阿卜杜勒·伊拉。战败后逃往伊朗，再转土耳其，1945年被英方擒获引渡回国，经军事法庭以叛国罪判处死刑，于1945年10月16日公开绞死。他著有回忆录《伊拉克的阿拉伯骑士》，1956年在巴格达出版，详述其泛阿拉伯理念与政变经过。"
 CBIO_IRQ_sharaf_bin_rajeh_desc:0 "沙里夫·沙拉夫·本·拉杰赫（1881年，生于塔伊夫—1955年），哈希姆宗室远支成员，1941年伊拉克政变期间的傀儡摄政王（1941年4月1日—6月1日）。生于奥斯曼治下汉志的塔伊夫，为该地埃米尔继承人，一战期间参加反抗奥斯曼当局的阿拉伯大起义及征服阿西尔之役，此后出任塔伊夫埃米尔直至逝世。1941年拉希德·阿里·盖拉尼发动政变、摄政王阿卜杜勒·伊拉出逃后，盖拉尼急需另立摄政以维系君主制的表面合法性，遂征召这位与阿卜杜勒·伊拉有远亲关系、年迈而虔诚的宗室成员出任摄政，为其亲轴心政府提供名义上的王室背书。政变失败、英军平乱后，阿卜杜勒·伊拉复位，沙拉夫·本·拉杰赫的摄政随之终结。他此后还曾出任约旦参议员。1955年逝世。"
 CBIO_IRQ_taha_al_hashemi_desc:0 "塔哈·哈希米（1888年—1961年），伊拉克陆军将领兼政治家，首相亚辛·哈希米之弟。奥斯曼帝国军校及参谋学院出身，一战中参加阿拉伯起义。伊拉克独立后历任高级军职，1936年巴克尔·西德基政变时他正在安卡拉出访，被西德基电令阻止回国。1941年拉希德·阿里政变前后他是关键人物之一，一度出任首相（1941年2—4月），与“黄金方阵”四校及拉希德·阿里在反英民族主义立场上合流。政变失败后流亡，战后一度遭审判。著有关于阿拉伯军事史的学术著作。1961年逝世。"
 CBIO_IRQ_tawfiq_al_suawaidi_desc:0 "陶菲克·苏瓦伊迪（Tawfiq al-Suwaidi，1892—1968）是伊拉克政治家、外交官，纳吉·苏瓦伊迪之弟，曾三度出任首相。生于巴格达一个学者、法官辈出的名门，先后就读伊斯坦布尔法学院与巴黎索邦大学，1914年学成回国。1929年首次组阁，年仅36岁，是伊拉克史上最年轻的首相。1932年伊拉克加入国际联盟后，他因精通法语等外语出任伊拉克首任常驻国联代表。此后长期活跃政坛，多次出任外交大臣、司法大臣，三度组阁（1929、1946、1950年），亦曾任摄政委员会成员及中央银行行长。1958年革命后因与王室关系密切被捕、判处终身监禁，1961年获赦后流亡黎巴嫩，1968年病逝于当地。"
 CBIO_IRQ_werner_junck_desc:0 "维尔纳·容克（1895年—1976年），德国空军将领，1941年伊拉克战事中的“伊拉克飞行队长”（Fliegerführer Irak）。拉希德·阿里政变后，纳粹德国为支援伊拉克反英势力，匆忙组建了一支由梅塞施密特Bf 110战斗机及亨克尔He 111轰炸机组成的小型空军分遣队，经法属叙利亚中转部署至伊拉克，由容克指挥。然而这支增援力量规模有限、后勤困难，未能扭转战局，英军最终从哈巴尼亚基地反击成功，击败政变军队。容克随后撤离伊拉克。"
 CBIO_IRQ_yasin_al_hashimi_desc:0 "亚辛·哈希米（1884年—1937年1月21日，卒于贝鲁特），伊拉克军人出身的政治家，两度出任首相。奥斯曼帝国军校出身，一战中参加阿拉伯民族主义运动。1920年代在伊拉克政坛崛起，以泛阿拉伯民族主义立场著称。1935年3月首次出任首相，在任期间推行征兵制并强化与德国的经贸关系。1936年10月巴克尔·西德基将军发动政变推翻其政府——这是现代阿拉伯世界首次军事政变。亚辛被迫流亡，先赴叙利亚后转赴黎巴嫩。1937年1月在贝鲁特因心脏病去世，终年约五十三岁。其弟塔哈·哈希米亦为军政要人，后在1941年政变前后发挥重要作用。"
 CBIO_IRQ_yusuf_salman_yusuf_desc:0 "优素福·萨勒曼·优素福（1901年7月19日，生于巴格达—1949年2月14日，卒于巴格达），化名“法赫德同志”（阿拉伯语意为“豹”），伊拉克共产党奠基领袖。出身摩苏尔省巴尔泰拉的亚述族迦勒底天主教家庭，父亲靠卖糕饼为生。少年时在巴士拉基督教学校及美国教会学校受教育，1920年代末投身共产主义运动。1941年10月出任伊拉克共产党第一书记，此后十年间以铁腕组织才能将该党从地下小团体改造为拥有大量工人基层的群众性政党，成功在基尔库克油田、铁路及巴士拉港口工人中建立起强大的工会网络。1944年主持召开首届党代会并通过《国民宪章》。1947年1月被捕入狱，但在狱中继续遥控指挥党务。1948年“瓦斯巴”反英大起义中共产党发挥了核心动员作用，当局遂以组织煽动罪对法赫德进行军事审判。1949年2月14日他与两名同志在巴格达三个广场被分别公开绞死，遗体悬挂示众数小时，后被秘密葬于无标记墓穴。"
 CBIO_PER_abdolhossein_hazhir_desc:0 "阿卜杜勒侯赛因·哈兹尔（1902年6月4日—1949年11月5日），伊朗政治家，曾十度入阁。1948年出任首相，任内因其政策受到卡沙尼教士及民族主义力量的猛烈抨击。卸任后转任宫廷大臣。1949年11月5日，年仅四十七岁的哈兹尔在德黑兰遭伊斯兰敢死队（费达伊安-伊斯兰）成员赛义德·侯赛因·伊玛米枪杀身亡，是继历史学家卡斯拉维之后该组织暗杀的又一位重要人物。该组织此后又于1951年暗杀首相拉兹马拉，其一系列政治暗杀事件深刻影响了1950年代初的伊朗政局走向。"
 CBIO_PER_abdolsamad_kambakhsh_desc:0 "阿卜杜勒萨马德·坎巴克什（1902或1903年，生于加兹温—1971年），原名阿卜杜勒萨马德·阿德勒·卡扎尔，图德党强硬派核心人物，伊朗唯一的共产国际（第三国际）成员，与苏联情报机构（从OGPU到克格勃）保持长期密切联系。出身卡扎尔贵族家庭，1915年赴俄留学，受十月革命启发回国后加入伊朗社会党及共产党。1920年代获政府奖学金赴莫斯科大学深造，此后成为斯大林信赖的伊朗代理人。1937年作为五十三人案成员被捕入狱前，他曾秘密向苏方出卖阿拉尼小组情报。1941年获释后参与创建图德党，1944年当选中央委员，主导建立了图德党在军队中的秘密军事网络。1946年阿塞拜疆危机后遭通缉、军事法庭缺席判处死刑，流亡苏联直至逝世。学者评价他并非理论家，而是与苏联有强大个人关系的党务干部。"
 CBIO_PER_abol_ghasem_kashani_desc:0 "赛义德·阿布-卡西姆·莫斯塔法维·卡沙尼（1882年11月19日—1962年3月14日），伊朗什叶派教士兼政治家，石油国有化运动中的关键宗教力量。出身教士家庭，十六岁入神学院、二十五岁获纳杰夫教法学位。一战期间在伊拉克参加1920年反英起义。因民族主义立场多次遭英方逮捕流放。1941年二战期间因被指控亲纳粹而遭英国逮捕、流放至巴勒斯坦。1950年回国后发起反英石油运动，发布教令宣布石油国有化为宗教义务，动员数万民众上街，并庇护激进组织伊斯兰敢死队。1951年石油国有化运动高潮期间出任议会议长，与摩萨台结成联盟。然而1953年他与摩萨台决裂，转向支持王室，在1953年8月政变中发挥了推波助澜的作用。后因承认曾下令暗杀拉兹马拉总理而遭短暂拘押，晚年退出政坛。霍梅尼视其为精神导师之一。1962年逝世。"
 CBIO_PER_ahmad_ahmadi_desc:0 "艾哈迈德·艾哈迈迪（1885年，生于马什哈德—1944年10月），绰号佩泽什克·艾哈迈迪（意为医生艾哈迈迪），实为礼萨·沙时期德黑兰卡斯尔监狱中臭名昭著的狱中杀手。其真实身份并非医生而是护士，受命以向囚犯注射空气等方式秘密处决政治犯。已确认在其手下遇害的知名人物包括宫廷大臣泰穆尔塔什、诗人法罗赫·亚兹迪、萨达尔·阿萨德兄弟、马克思主义知识分子塔吉·阿拉尼等。每杀一人他通常获得十至十五图曼报酬，若受害者身份显赫则可得百图曼。1941年礼萨·沙退位后，他潜逃至伊拉克，被泰穆尔塔什之女伊朗·泰穆尔塔什追踪并安排引渡回伊朗受审。1944年被判处死刑并处决，临刑前高喊我不是凶手，我只是执行了上级命令。注意勿与#16埃米尔·艾哈迈迪将军混淆。"
 CBIO_PER_ahmad_amir_ahmadi_desc:0 "艾哈迈德·埃米尔·艾哈迈迪，伊朗陆军中将，礼萨·沙时期核心将领之一。出身军人世家，入哥萨克学校受训，是1921年政变的重要策划者之一，与礼萨·汗及齐亚丁·塔巴塔别伊共同推翻卡扎尔末朝政府。政变成功后成为礼萨·沙最信赖的军人，是巴列维王朝首位获授塞帕赫博德（陆军中将）军衔者。1920—1930年代受命镇压卢里斯坦部族叛乱，手段强硬，被卢里人视为令儿童止啼的恐怖符号。1925年任全国治安总监。1941年礼萨·沙退位后出任福鲁吉内阁内务大臣，此后在卡瓦姆及苏海利内阁中出任陆军大臣，又任德黑兰军事总督、中央卫戍司令及军队总监等职。退休后获任命为参议员。1965年因癌症在德黑兰逝世。"
 CBIO_PER_ahmad_khan_nakhjavan_desc:0 "艾哈迈德·汗·纳赫万，伊朗陆军少将兼首任空军司令。出身大不里士纳希切万名门（突厥康加尔部族）。1925年赴法国接受飞行训练，同年2月驾驶一架布雷盖-19型飞机从法国起飞、悬挂伊朗旗帜飞抵德黑兰加莱莫尔吉机场，成为伊朗航空史上首位驾驶本国飞机从国外飞入国境的伊朗飞行员，由此获伊朗首位飞行员之称。此后出任伊朗帝国空军首任司令（1924—1937年间数度任免），1929年晋准将。1940年出任代理陆军大臣。1941年英苏入侵期间，他主持最高军事会议提出停止抵抗及遣散部分军队的方案，触怒礼萨·沙，遭沙当场以手杖殴打并剥夺军衔、投入监狱。礼萨·沙退位后获释，9月20日在福鲁吉内阁中再度出任陆军大臣。此后历任军事督察及穆罕默德·礼萨·沙的军事办公室主任。1966年逝世。"
 CBIO_PER_ahmad_mira_khosravani_desc:0 "艾哈迈德·米尔扎·霍斯拉瓦尼是巴列维王朝早期伊朗航空军的重要军官。1930年前后，他曾短暂主持陆军航空科事务，此后在1936年重新出任伊朗空军指挥官，1938年晋升将官。其任内，伊朗空军已由陆军内部的小型航空部门发展为独立军种，并在礼萨沙阿推动的军事现代化中持续扩编。1941年英苏入侵伊朗时，这支年轻空军尚未具备抵抗大国联合进攻的能力，机场、训练机构和飞机装备很快遭到占领与破坏，霍斯拉瓦尼的任期也随之结束。"
 CBIO_PER_ahmad_zirakzadeh_desc:0 "艾哈迈德·齐拉克扎德，伊朗工程师出身的民族阵线政治家，石油国有化运动骨干。出身宗教家庭，早年入达尔奥尔富农学校，后获伊朗国防部奖学金赴巴黎理工大学攻读海洋工程。1935年回国后在胡齐斯坦海军任职，1941年调入交通部。1943年参与创建工程师协会（后改组为伊朗党），该组织成为民族阵线的核心组成部分。1951年摩萨台出任首相后，齐拉克扎德任经济部副部长；1952年以民族阵线候选人身份当选第十七届议会德黑兰代表，继续推动石油国有化事业。1953年政变当夜他在摩萨台家中，逃跑时摔断腿。政变后遭逮捕入狱数年。1980年赴美定居，晚年返回伊朗，遗嘱以个人财产设立齐拉克扎德科学基金会。"
 CBIO_PER_ali_akbar_davar_desc:0 "阿里-阿克巴尔·达瓦尔，伊朗现代司法体系奠基人。早年就读于达尔奥尔富农学院，后赴瑞士日内瓦大学获法学学位。1921年回国，创办自由人报及激进党，当选第四、五、六届议会议员。1925年他是投票废黜卡扎尔王朝、拥立礼萨·汗的关键议员之一。1926年出任司法大臣，次年大胆解散旧有全部司法机构，延聘法国专家协助，以法国法典为蓝本全面重建伊朗司法体系，制定民事登记法、财产登记法、婚姻法等基础法规，奠定了伊朗现代法治基础。此后转任财政大臣，在福鲁吉内阁中推行税制改革、创办国家保险公司。1936年他曾期望出任首相未果，转觉失宠于礼萨·沙，加之保障德黑兰粮食供应的压力与日俱增，1937年2月10日在被沙严厉训斥后服鸦片自杀身亡，成为礼萨·沙专制统治吞噬自身功臣的标志性事件之一。"
 CBIO_PER_ali_dashti_desc:0 "阿里·达什提，伊朗作家、报人兼政治家。出身什叶派教士家庭，少年时在卡尔巴拉及纳杰夫接受传统宗教教育，却拒绝走教士道路，转投新闻业。1922—1935年在德黑兰创办并主编《红色曙光》报，以世俗理性主义立场著称。1928年起多次当选议会议员，1946年因公开反对图德党入阁及对苏让步而入狱。1954年起出任参议员，兼任驻埃及及黎巴嫩大使。其文学生涯同样瞩目，精研哈菲兹、萨迪、鲁米等波斯古典诗人并撰写多部创新性文学评论。其最知名、也最具争议的著作《二十三年——穆罕默德先知生涯研究》以理性主义视角审视伊斯兰教创立史，挑战正统信仰叙事，生前匿名出版，遗嘱死后方可发行英文译本。1979年伊斯兰革命后遭逮捕入狱，在审讯中被殴打致股骨骨折，此后健康急剧恶化，1982年初在被拘禁状态下离世。"
 CBIO_PER_ali_khan_mansour_desc:0 "阿里·汗·曼苏尔（1886年，生于德黑兰—1974年12月8日），号曼苏尔·莫尔克，两度出任伊朗首相（1940—1941年、1950年）。历任呼罗珊及阿塞拜疆省总督、驻意大利与土耳其大使等职，先后六次入阁。1940年出任首相，1941年8月英苏入侵伊朗后数日即辞职下台，由福鲁吉接替处理危局。1950年4月再度出任首相，但此时伊朗国内石油国有化运动高涨，曼苏尔无力驾驭局势，仅在任数月即于同年6月辞职，由拉兹马拉将军接任。其子哈桑·阿里·曼苏尔后来亦出任首相（1964—1965年），1965年遭伊斯兰敢死队成员暗杀身亡。"
 CBIO_PER_ali_razmara_desc:0 "哈吉·阿里·拉兹马拉，伊朗陆军中将，1950—1951年任首相。出身军官家庭，毕业于法国圣西尔军校，归国后在军中迅速晋升，曾主持编纂伊朗军事地理志。1946年受命率军南下平定与苏联扶植的阿塞拜疆分裂势力有关的动乱。1950年6月在英方推动下被沙任命为首相，任内力推行政分权化改革，但在石油国有化问题上持审慎立场，反对立即全面国有化，认为伊朗尚不具备独立运营石油工业的技术条件，此举使他同时遭到民族阵线及宗教极端势力的强烈敌视。1951年3月7日，拉兹马拉前往沙皇清真寺参加追悼仪式时，被伊斯兰敢死队成员哈利勒·塔赫马塞比连开三枪射杀，是伊朗历史上第三位遇刺身亡的首相。其遇刺后不到两个月，摩萨台即出任首相并推动石油国有化法案通过。"
 CBIO_PER_andre_godard_desc:0 "安德烈·戈达尔，法国考古学家、建筑师兼中东艺术史学者。巴黎美术学院毕业，1910年首赴中东从事考古发掘。1928年受礼萨·沙之命出任伊朗考古局局长，此后主持该局工作长达三十余年（1928—1953年、1956—1960年）。他设计了伊朗国家博物馆（1936年落成并出任首任馆长），该建筑以萨珊王朝拱门为灵感、成为德黑兰地标。此外他与同事西鲁合作设计了德黑兰大学主校区、伊朗国家图书馆及设拉子哈菲兹陵墓等重要建筑。任内他主持修复了伊斯法罕聚礼清真寺、沙皇清真寺及谢赫·洛特福拉清真寺等伊朗重要历史建筑，并组织卢里斯坦青铜器及波斯波利斯的大型发掘。二战期间支持自由法国运动，维希政府代表离开德黑兰后出任法国临时政府驻伊朗外交代表。著有《伊朗的艺术》。1960年返回巴黎，1965年逝世。他是法国籍考古学家与建筑师，其在伊朗的影响主要来自长期主持考古、博物馆与公共建筑事务。"
 CBIO_PER_ardeshir_ovanessian_desc:0 "阿尔达希尔·奥瓦内西安，亚美尼亚裔伊朗共产主义领导人，图德党创始成员之一。出身拉什特亚美尼亚家庭（祖籍萨尔马斯），学成药剂师后投身激进政治运动。1923年加入伊朗共产党，1925年赴莫斯科东方劳动者共产主义大学受训，回国后组建药剂师工会，在伊朗共产党内从事组织工作。后被捕入狱长达十一年，在卡斯尔监狱中他组织囚犯的文化教育活动并自学法语。1941年获释后参与创建图德党，任临时中央委员会委员。1944年以亚美尼亚少数族裔代表身份当选第十四届议会议员，同年主持图德党首届代表大会并当选中央委员。此后在阿塞拜疆地区领导图德党工会运动及农民运动，参与组织1945年的阿塞拜疆自治运动。阿塞拜疆人民政府崩溃后流亡苏联，定居埃里温直至1990年逝世。"
 CBIO_PER_arthur_millspaugh_desc:0 "阿瑟·切斯特·米尔斯波（1883年—1955年），美国人，曾两度受聘主理伊朗财政的美方顾问。密歇根州奥古斯塔人，先后就读于阿尔比恩学院、伊利诺伊大学及约翰斯·霍普金斯大学，获政治学博士。曾任教政治学、在美国国务院外贸顾问办公室任职。1922年应伊朗政府之请赴德黑兰出任财政总监，抵达时国库空虚、财政混乱，他在伊朗军政当局配合下成功实现预算平衡并使伊朗摆脱对外国贷款的依赖，但其新税法加重了底层民众负担，被礼萨·沙用于为纵贯铁路筹资。1927年因屡次拒绝满足沙增加军费开支的要求而被解约。1942年应第十三届议会之邀再度赴伊主理财政，但此次任务受制于伊朗国内政治纷争、既得利益集团阻挠及频繁的内阁更迭而未能取得理想成效，1945年被终止职务。著有《美国人在波斯》等书，晚年对伊朗自治能力持悲观态度。他是美国籍外部财政顾问，其影响主要来自伊朗政府授予的财政整顿职权，而非伊朗本国官僚体系。"
 CBIO_PER_bahram_aryana_desc:0 "巴赫拉姆·阿里亚纳，原名侯赛因·马努切赫里，伊朗帝国陆军元帅，穆罕默德·礼萨·沙时期最高军事指挥官。母为格鲁吉亚赫拉克略二世国王后裔。他是巴列维时代最著名的皈依琐罗亚斯德教者，1950年改名巴赫拉姆·阿里亚纳以示其波斯民族主义与古代伊朗文化认同。军旅生涯中历任多个高级指挥职务，曾任库尔德斯坦军事总督，深受当地库尔德民众爱戴。他的复古民族主义倾向日趋极端，甚至以《列王纪》取代办公室中的《古兰经》、提议以拉丁字母书写波斯文以切断与阿拉伯文化的联系，萨瓦克认为其观点有伤风化。1969年在沙的间接命令下离开伊朗赴巴黎。1979年革命后从事反霍梅尼流亡运动。1985年在巴黎逝世，葬于蒙帕纳斯公墓。"
 CBIO_PER_dalir_pesyan_desc:0 "架空虚构人物。\"达利尔\"（Dalir）在波斯语中意为\"勇敢\"。"
 CBIO_PER_davud_monshizadeh_desc:0 "达武德·蒙希扎德，伊朗亲纳粹政治家兼伊朗学学者。1931年赴法国留学，后转赴纳粹德国，在柏林洪堡大学获哲学与文学博士。二战期间为纳粹担任翻译、从事反盟国宣传，并加入党卫军，参加柏林战役时负伤。1943年获博士学位。战后任慕尼黑大学伊朗学教师。1951年返回伊朗，次年创立伊朗国家社会主义工人党（SUMKA），该组织公然模仿纳粹党的组织形式与意识形态符号，在石油国有化运动中充当反国有化力量。该党虽影响有限，但是冷战初期中东亲法西斯运动的典型案例。蒙希扎德后移居瑞典，出任乌普萨拉大学伊朗语言教授直至逝世。"
 CBIO_PER_fakhrafagh_parsa_desc:0 "法赫尔-阿法赫·帕尔萨，1898年生于德黑兰，伊朗早期妇女权利活动家、记者。1920年在马什哈德创办《妇女世界》杂志，宣传女性教育权利并呼吁修改婚姻法，成为伊朗历史上首位因新闻活动而遭流放的女记者。其文章引发教士阶层愤怒，宗教狂热者袭击了杂志社和她的住宅。此后她与丈夫被流放至阿拉克，后辗转于库姆度过两年流放生涯。回到德黑兰后加入穆赫塔拉姆·伊斯坎达里创立的爱国妇女联盟，继续投身妇女权利事业。她的女儿法罗赫鲁·帕尔萨后来成为伊朗历史上首位女性内阁部长（1968年出任教育大臣），1980年伊斯兰革命后被处决。"
 CBIO_PER_fawzia_faud_desc:0 "法齐娅·福阿德，埃及公主，穆罕默德·礼萨·巴列维首任王后。为埃及国王福阿德一世之女、法鲁克国王之妹，曾在瑞士接受教育，通晓阿拉伯语、法语和英语。1939年与伊朗王储穆罕默德·礼萨成婚，这桩婚姻本质上是埃及与伊朗两个王室之间的政治联姻，旨在展示逊尼派与什叶派王室之间的团结。1940年生下女儿沙赫纳兹。然而法齐娅在德黑兰生活极不适应，多次出现抑郁及厌食症状，1945年返回开罗后再未回伊朗。1948年双方离婚。1949年她在开罗改嫁伊斯梅尔·希林，此后婚姻维持四十五年。晚年居住在亚历山大，2013年逝世。她并非伊朗官员，而是埃及王室成员与巴列维王朝的王室外戚，其政治意义主要体现在两国王室联姻。"
 CBIO_PER_fazlollah_zahedi_desc:0 "法兹洛拉·扎赫迪，伊朗陆军中将，1953年英美政变的出面执行者。出身哈马丹大地主家庭，为苏菲派圣者扎赫德·吉拉尼后裔。早年入波斯哥萨克旅服役，礼萨·汗即其军中上级。1920年代以平定库尔德叛乱及镇压胡齐斯坦阿拉伯自治运动而崛起，礼萨·沙先后委任其为胡齐斯坦及伊斯法罕省军事总督。1942年英军怀疑他与德国人密谋并囤积粮食牟利，将其逮捕并拘禁于巴勒斯坦至1945年。战后回国历任南部军区视察员、全国警察总监及参议员。1951年出任摩萨台内阁内务大臣，后因政见不合辞职。1953年8月，在美国中央情报局与英国军情六处策动下，沙签署解除摩萨台职务的敕令，任命扎赫迪为首相。首次政变尝试失败、沙出逃后，扎赫迪于8月19日发动第二次政变成功推翻摩萨台，执政至1955年。此后任驻日内瓦联合国大使，1963年在日内瓦逝世。"
 CBIO_PER_gholam_ali_oveissi_desc:0 "戈拉姆·阿里·奥韦西（1918年4月16日—1984年2月7日），伊朗帝国陆军四星上将，穆罕默德·礼萨·沙时期陆军总司令（1972—1978年）。与王储穆罕默德·礼萨自军校起即为同窗密友。军校毕业后长期在法尔斯省及各地部队服役，1960年成为同侪中最年轻的四星上将。1978年出任德黑兰戒严司令，在革命风暴中实施军事管制，其名与1978年9月8日黑色星期五事件密切相关——当日安全部队向示威者开枪，造成数十人死亡。1979年1月被迫辞职离国。流亡后积极从事反霍梅尼活动，联络美国中情局及伊拉克萨达姆政权。1984年2月7日在巴黎与其弟一同遭暗杀，伊斯兰圣战组织宣称负责。"
 CBIO_PER_gholamali_bayandor_desc:0 "戈拉姆-阿里·巴扬多，伊朗帝国海军首任司令（1933—1941年），祖先可追溯至拜延杜尔突厥部族。在礼萨·沙推行海军现代化期间，他主持向意大利采购军舰并在意大利顾问协助下培训伊朗海军军官，建立了霍拉姆沙赫尔及安扎利港等海军基地。1941年8月25日英苏联合入侵伊朗，英国皇家海军及澳大利亚海军对波斯湾伊朗舰艇发动突袭，在霍拉姆沙赫尔击沉伊朗军舰虎号等多艘战舰。巴扬多在混乱中亲赴前线指挥抵抗，在赶往霍拉姆沙赫尔海军总部途中被英印部队射杀殉国，其弟——里海舰队代理指挥官叶海亚·巴扬多上校同日亦在苏军空袭安扎利港中阵亡。英军进攻舰队指挥官科斯莫·格雷厄姆准将在报告中称其死讯令所有认识他的人惋惜，他聪明、能干，对波斯忠心耿耿。1964年伊朗海军以其名字命名一艘护卫舰。"
 CBIO_PER_ghulam_yahya_daneshian_desc:0 "古拉姆·叶海亚·达内希安，伊朗阿塞拜疆裔政治家与军人，苏联扶植的阿塞拜疆人民政府（1945—1946年）军政核心成员之一。早年曾赴巴库油田劳动，精通群众动员。1941年获释后加入图德党，出任阿塞拜疆省委委员。1945年阿塞拜疆民主党成立后加入，成为准军事组织费达伊的组建者之一，在皮什瓦里内阁中任国防部副部长（副于贾法尔·卡维安）。1946年12月伊朗中央政府军收复阿塞拜疆后，他随皮什瓦里等人经朱尔法边境逃入苏联，此后长期定居巴库。1960年阿塞拜疆民主党与图德党合并后，他进入图德党中央委员会，在党内人事安排中发挥重要影响（包括推动伊拉吉·伊斯坎达里出任第一书记）。一度被指控参与将党内异见者流放西伯利亚。1983年在巴库逝世。"
 CBIO_PER_hasan_arfa_desc:0 "哈桑·阿尔法（1895年，生于第比利斯—1984年），伊朗陆军少将，外交官。其父为资深外交官礼萨·阿尔法亲王，母亲兼有英国及俄国（杰米多夫家族）血统。少年在法国接受教育，1912年入伊斯坦布尔军校，1914年回国选择从军。一战后加入新建陆军，1921年在平定库尔德叛乱中初识礼萨·汗，此后成为巴列维王朝终身忠诚支持者。1926年曾短暂出任驻伦敦武官并迎娶英国芭蕾舞者希尔达·贝维克为妻，后赴法国参谋学院深造。1936年任骑兵与装甲兵总监，1939年晋准将。1941年英苏入侵时被沙任命为德黑兰防御参谋长。1944年12月出任陆军参谋长，任内向沙赫塞万部族提供武器以对抗苏联扶植的阿塞拜疆分裂势力，1946年2月卸任。此后历任驻土耳其及巴基斯坦大使。著有回忆录《在五位沙皇治下》及《库尔德人》等书，是研究二十世纪伊朗军政史的重要一手文献。"
 CBIO_PER_hassan_majid_firooz_desc:0 "马吉德·菲鲁兹是伊朗军官，第二次世界大战期间短暂主持伊朗空军事务。1941年英苏入侵后，伊朗空军遭受沉重打击，基地被占、训练停顿、飞机被拆解或接收，指挥系统也频繁更换。菲鲁兹并非典型空军出身军官，却在1942年前后接手空军指挥，并于1943年一度与米尔—穆罕默德·穆罕纳共同负责空军事务。在战时占领环境下维持残存机构运转。"
 CBIO_PER_iraj_eskandari_desc:0 "伊拉吉·伊斯坎达里，伊朗图德党（人民党）创始人之一及长期领导人。出身卡扎尔王族，其父叶海亚·米尔扎为第一届议会进步派议员，叔父苏莱曼·伊斯坎达里为社会主义运动先驱。早年就读于达尔奥尔富农学院及德黑兰政治学院，1930年代初结识马克思主义理论家塔吉·阿拉尼，协助创办《世界》杂志，参与传播马克思主义。1937年作为五十三人案成员被捕入狱，1941年英苏入侵后获释，随即参与创建图德党，出任首任总书记。1944年当选第十四届议会议员，在议会中主张向苏联让渡北部石油开发权——此举后来令他深感悔恨，摩萨台曾当面严厉训斥他这一立场。1946年出任卡瓦姆联合内阁的工商大臣。1949年刺杀沙未遂事件后图德党遭取缔，他被缺席判处死刑，此后流亡海外近三十年。1969年出任图德党第一书记直至1979年，因拒绝支持霍梅尼而被党内解职，由基亚努里取代。晚年竭力阻止图德党分裂未果，1985年病逝于莱比锡。他还将马克思《资本论》全三卷译为波斯语。"
 CBIO_PER_jafar_kavian_desc:0 "贾法尔·卡维安，本名贾法尔·马马德扎德，伊朗阿塞拜疆裔革命军人，阿塞拜疆人民政府国防部长（人民军部长）。早年即投身革命运动，先后参加立宪运动、希亚巴尼起义及拉胡蒂起义，在历次起义中率领费达伊武装作战。1945年苏联扶植皮什瓦里在大不里士建立阿塞拜疆人民政府后，卡维安被任命为人民军部长，主持组建克孜勒巴什人民军（以萨法维王朝军队命名），短时间内集结三百名军官、将部队扩充至一万八千人。1946年12月人民政府在苏军撤离后瓦解，卡维安随即流亡苏联定居巴库。1975年在巴库逝世。"
 CBIO_PER_karim_buzarjamehri_desc:0 "1886年生。少年时代即接受军事训练，后成为礼萨·巴列维最信任的军政人物之一。礼萨沙阿掌权后，布扎尔乔梅里长期活跃于巴列维政权的军政体系中，也曾参与德黑兰市政事务。1941年英苏入侵伊朗后，礼萨沙阿被迫退位并离开德黑兰，布扎尔乔梅里亦随其一同被排挤出权力中心。晚年他还承担过护送礼萨沙阿遗体返回伊朗的任务，是巴列维王朝早期军人集团中的亲信代表。"
 CBIO_PER_kazem_hasibi_desc:0 "卡泽姆·哈西比，伊朗工程师、大学教授兼民族阵线政治家，摩萨台的首席石油顾问。出身商人家庭，早年毕业于德黑兰法律学校，后赴法国就读于巴黎综合理工学院，获矿业工程学位。1941年回国后在德黑兰大学工程学院任教，同年与齐拉克扎德等人共同创立工程师协会。在石油国有化运动中，他主持撰写了对英伊石油公司四十五年资产负债表的全面分析报告，该报告在议会中宣读数日，成为推动国有化立法的关键技术依据。1951年任摩萨台内阁财政部副部长及石油国有化谈判代表团成员。他立场强硬，拒绝参加哈里曼主持的英伊调解谈判，后参与斯托克斯调解。学者评价他虽忠诚于国有化事业、信仰虔诚，但行事刻板、对国际石油政治的复杂性认识不足，对谈判失败负有部分责任。1953年政变后被捕，获释后继续活跃于民族阵线。1990年在德黑兰逝世。"
 CBIO_PER_mahmud_jam_desc:0 "马哈茂德·贾姆，号莫迪尔-莫尔克，礼萨·沙时期首相（1935年12月—1939年10月）。早年在大不里士自学法语并入法国使馆任翻译，此后进入文官系统，1921年在齐亚丁内阁中出任外交大臣，历任克尔曼及呼罗珊省总督、内务大臣等职。出任首相期间恰逢礼萨·沙专制统治最黑暗的时期，泰穆尔塔什、达瓦尔、莫达雷斯等前朝重臣已相继被清洗，贾姆作为温顺的行政官僚得以留任近四年，其间经手的两件大事为1936年强制揭面纱运动和1937年签订《萨达巴德公约》（伊朗、土耳其、伊拉克、阿富汗四国互不侵犯条约），任内还赴埃及为王储穆罕默德·礼萨与法齐娅公主联姻事宜斡旋。1939年卸任后转任宫廷大臣。穆罕默德·礼萨·沙时期历任驻埃及大使、陆军大臣及参议员。1969年在德黑兰逝世。"
 CBIO_PER_mohammad_ali_foroughi_desc:0 "穆罕默德·阿里·福鲁吉，号佐卡奥尔-莫尔克，伊朗学者型政治家，三度出任首相（1926年、1933—1935年、1941年）。出身伊斯法罕商人家庭，早年就读于达尔奥尔富农学院，1907年出任德黑兰政治学院院长，1909年当选议员并历任议长、多部大臣及最高法院院长。1925年作为代理首相主持礼萨·汗加冕仪式。1935年因姻亲涉入马什哈德反世俗化骚乱而被罢黜。1941年英苏入侵后，礼萨·沙在王朝存亡之际重新起用福鲁吉，后者成功说服盟国保留巴列维王朝、由王储穆罕默德·礼萨继位，主持了这一关键权力交接。此外，他创立伊朗学院（波斯语科学院）并主持重修菲尔多西陵墓，著有《哲学在欧洲的演进》等学术专著，精心校勘了萨迪、哈菲兹、鲁米等波斯古典大家的作品集。1942年在德黑兰逝世。"
 CBIO_PER_mohammad_hassan_mirza_desc:0 "穆罕默德·哈桑·米尔扎，卡扎尔王朝末代储君，末代沙阿赫迈德·沙之弟。1909年因兄长尚无男嗣而被立为王储，1918—1924年出任阿塞拜疆省总督。1923年阿赫迈德·沙赴巴黎后久不归国，穆罕默德·哈桑以储君身份出任摄政。1924年他成功联合议会力量阻止礼萨·汗宣布共和国的计划，维护了君主制框架，但这一胜利转瞬即逝——1925年议会废黜卡扎尔王朝，礼萨·汗自立为沙，穆罕默德·哈桑被驱逐出国，流亡英国。1930年兄长阿赫迈德·沙去世后，他自立为流亡沙皇，但未获国际承认。1943年在英国梅登黑德逝世，遗体葬于伊拉克卡尔巴拉。其子哈米德·米尔扎曾在二战中一度被英方视为取代巴列维王朝的备选人物，但因不通波斯语而未被采纳。"
 CBIO_PER_mohammad_mosaddegh_desc:0 "穆罕默德·摩萨台，伊朗民族主义政治家，二十世纪伊朗最具影响力的政治人物之一。出身卡扎尔贵族家庭，父为财政大臣，少年即获摩萨台封号。留学巴黎、纳沙泰尔及洛桑大学，获法学博士学位后归国，历任法尔斯省总督、财政大臣及外交大臣等职。1923年当选议员，1925年因反对礼萨·汗称帝而被迫退出政坛。1944年复出，当选议员后迅速崛起为民族主义阵营领袖，成功阻止苏联获取北部石油租让权。1951年出任首相，主导将英伊石油公司国有化，此举震动全球石油格局，引发英国全面经济封锁与外交对抗。1953年8月，英美情报机构联合策动政变（代号阿贾克斯行动）将其推翻，扎赫迪将军取而代之。摩萨台被军事法庭判处三年监禁，此后被软禁于艾哈迈达巴德庄园直至1967年逝世，终年八十四岁。他至今仍是伊朗民族主权与反帝国主义运动的象征性人物。"
 CBIO_PER_mohammed_nakhjavani_desc:0 "第二次世界大战时期伊朗空军指挥官。1942年，英苏入侵伊朗后的占领局面仍未结束，伊朗空军在基地、训练、装备和人员方面均受到严重削弱。纳赫贾瓦尼在这一时期接替马吉德·菲鲁兹主持空军事务，任期延续至1943年。"
 CBIO_PER_mohammed_reza_pahlavi_desc:0 "穆罕默德·礼萨·巴列维，巴列维王朝末代沙，礼萨·沙长子。1926年被立为王储，少年时赴瑞士洛赛学校求学，1935年回国入军校。1939年迎娶埃及法齐娅公主。1941年英苏入侵后其父被迫退位，年仅21岁的他于9月16日继位。即位初期权力受限于盟国占领与议会政治，1945—1946年成功化解苏联扶植的阿塞拜疆分裂危机。1951年摩萨台主导石油国有化运动，双方权力斗争激化，1953年8月沙一度出逃，旋即在英美情报机构策动下由扎赫迪将军发动政变推翻摩萨台，此后巩固个人权力。1963年发起白色革命推行土地改革、工业国有化及妇女解放等现代化举措，但同时以秘密警察萨瓦克严酷镇压异见。1970年代石油繁荣期间权势达到顶峰，1979年伊斯兰革命爆发后流亡海外，1980年病逝于开罗。"
 CBIO_PER_mohtaram_eskandari_desc:0 "穆赫塔拉姆·伊斯坎达里（1895年—1924年7月27日），伊朗妇女运动先驱，卡扎尔王族出身。出身于政治活跃、思想开明的伊斯坎达里家族。1922年她在德黑兰创立爱国妇女联盟，这是伊朗历史上第一个妇女权利组织，并创办同名报刊《爱国妇女》。该组织致力于推动女性教育、保护孤女、建立贫困妇女医院，同时呼吁妇女争取社会权利、反对包办早婚与文盲现象。穆赫塔拉姆亲自演讲宣传妇女权利，组织协会成员参加集会游行，为伊朗现代妇女运动奠定了基础。1924年7月27日逝世，年仅二十九岁。"
 CBIO_PER_nikolai_markov_desc:0 "尼古拉·利沃维奇·马尔科夫，俄裔建筑师，二十世纪初德黑兰城市建筑的重要塑造者。出身俄国贵族家庭，先后在圣彼得堡帝国美术学院学习建筑并在圣彼得堡大学东方学系研修波斯语。一战期间在高加索地区俄军服役，十月革命后随白军辗转至伊朗，在波斯哥萨克旅中升至参谋长，并获授伊朗将军军衔。1921年退役后选择定居德黑兰，创办私人建筑事务所。1920—1930年代他为德黑兰设计并建造了数十座建筑，包括财政部、国防部、司法部、邮政总局、意大利大使馆、阿尔博兹中学、圣尼古拉斯俄国东正教堂等，风格融合装饰艺术、俄罗斯、拜占庭及伊朗传统元素，被誉为将旧建筑与新建筑巧妙衔接的纽带。他惯用的20×20厘米砖块在伊朗被称为马尔科夫砖。虽为东正教徒，他亦设计了法赫尔特·道莱及阿敏·道莱清真寺。1957年在德黑兰逝世，葬于杜拉布俄国公墓。他是俄裔归化伊朗的建筑师，其履历横跨俄国军旅、波斯哥萨克旅与德黑兰现代建筑实践。"
 CBIO_PER_reza_mizani_desc:0 "伊朗早期航空事业的筹建人员。1923年，伊朗开始在陆军体系内建立航空部门时，他被任命负责陆军航空科事务。当时伊朗尚缺乏成熟的飞行员、地勤体系和机场设施，航空力量仍停留在采购飞机、训练人员和建立行政机构的起步阶段。米扎尼的任期虽短，却处在伊朗空军制度化的开端。此后，艾哈迈德·纳赫贾万等受过飞行训练的军官逐步接手航空部门，伊朗空军也从陆军内部小机构发展为独立军种。"
 CBIO_PER_reza_shah_pahlavi_desc:0 "礼萨·沙·巴列维，巴列维王朝开创者，伊朗近代史上最具争议的君主之一。出身军人家庭，幼年丧父，入波斯哥萨克旅从军，凭借过人意志与军事才能逐级晋升。1921年2月联合齐亚丁·塔巴塔别伊发动政变推翻卡扎尔末朝政府，出任军队总司令兼陆军大臣，迅速掌握实权。1923年出任首相，1925年议会废黜长年旅居欧洲的卡扎尔末代沙阿赫迈德·沙，制宪会议选举礼萨·汗为沙，开创巴列维王朝。在位期间推行大刀阔斧的世俗化与现代化改革：打破部族割据、废除外国特权与治外法权、修筑纵贯伊朗铁路、建立世俗司法与教育体系、强制推行礼帽令与揭面纱运动、创办德黑兰大学，同时以铁腕手段压制教士阶层与政治异见。1930年代与纳粹德国经贸关系日趋密切，引发英苏警惕。1941年8月英苏联合入侵伊朗，礼萨·沙被迫于9月16日退位，传位于长子穆罕默德·礼萨，本人先后被流放至毛里求斯及南非。1944年在约翰内斯堡逝世。"
 CBIO_PER_rokneddin_mokhtari_desc:0 "罗克内丁·莫赫塔里，伊朗身兼两重身份的奇特人物——既是礼萨·沙时期以严酷著称的警察总监，也是一位卓越的小提琴家与作曲家。早年在克尔曼沙赫学习卡曼契琴，后转习小提琴，师从侯赛因·伊斯梅尔扎德并结交了传奇琴师达尔维什·汗，在伊朗传统音乐创作方面颇具天赋，尤以马胡尔调式的皮什达拉马德（序曲）闻名。然而在行政生涯中，他于1935年接替流亡的艾罗姆上校出任礼萨·沙的警察总部负责人，以铁腕手段执行沙的治安命令直至1941年。礼萨·沙退位后他被逮捕受审，1942年被判处八年监禁，1945年获减刑释放，此后再未恢复往日活跃。"
 CBIO_PER_ruhollah_khomeini_desc:0 "鲁霍拉·穆萨维·霍梅尼，什叶派教士，1979年伊斯兰革命领袖及伊朗最高领袖。出身教士世家，父亲在他出生五个月时被杀害。约1921年追随导师哈埃里·亚兹迪迁至库姆神学院研习伊斯兰法学、哲学及神秘主义，此后长期在库姆讲授教法与伦理。1930年代已是库姆颇受尊重的教师，但尚未涉足政治。1942年发表首部政治性著作《揭秘》，逐条驳斥世俗主义者对伊斯兰教的攻击，同时谴责礼萨·沙的世俗化政策——这是他反对巴列维王朝的最早公开表态。1940—1950年代他专注于宗教教学与学术写作，未直接参与摩萨台时期的政治斗争。1963年大阿亚图拉博鲁杰尔迪去世后成为宗教权威，随即公开抨击沙的白色革命及对以色列和美国的臣服，引发大规模骚乱，被捕入狱后于1964年被驱逐出境，先后流亡土耳其、伊拉克纳杰夫及法国巴黎近郊。在纳杰夫期间他系统阐发法基赫的监护权理论，主张由最高宗教法学家统治国家。1979年2月返回伊朗，领导推翻巴列维王朝的革命，建立伊斯兰共和国并出任终身最高领袖直至1989年逝世。"
 CBIO_PER_soleiman_eskandari_desc:0 "苏莱曼·米尔扎·伊斯坎达里（约1875年—1944年1月7日），伊朗卡扎尔王族出身的社会主义政治家，图德党首任主席。其兄叶海亚·米尔扎因1908年穆罕默德·阿里·沙炮轰议会事件受伤殉难，苏莱曼由此投身立宪运动，成为民主党在第二至五届议会的主要代言人，以坚决反英立场著称，获英国人冠以饶舌亲王之绰号。1920年代先后赴苏联、德国及法国，会晤苏联外交官员及法共领袖卡尚等人。礼萨·沙当政后被排斥出政坛长达十余年。1941年礼萨·沙退位后，苏莱曼与驻伊苏军取得联系，于同年9月29日在德黑兰主持召开图德党创立大会并当选首任主席。作为虔诚穆斯林，他一度主张禁止女性入党，并在党内设立祈祷室、组织穆哈兰姆仪式，试图以此争取宗教群众，但此路线很快被党内激进派否定。1944年1月逝世，此后图德党迅速左转。"
 CBIO_PER_teymourtash_desc:0 "阿卜杜勒-侯赛因·泰穆尔塔什，巴列维王朝首任宫廷大臣，礼萨·沙早期最具权势的辅臣。出身呼罗珊地主家庭，少年时赴俄国圣彼得堡军校求学长达十一年，兼通俄、法、英等多国语言。回国后投身立宪运动，当选多届议会议员，1921年政变后成为礼萨·汗最早的坚定支持者。1925年礼萨·汗称帝后，泰穆尔塔什出任宫廷大臣，礼萨·沙公开宣称泰穆尔塔什之言即朕之言，他实际负责国家现代化的蓝图设计与外交事务，包括主持1926年加冕典礼、废除外国治外法权、与苏联谈判新约，并在与英伊石油公司的谈判中力争修改不平等的达西石油租让协议。1932年底突遭礼萨·沙猜忌免职，旋即以捏造的贪腐罪名被捕入狱。1933年10月3日在卡斯尔监狱中身亡，终年约五十岁，普遍被认为系遭狱方毒杀，成为礼萨·沙翻脸清洗功臣的典型案例。"
 CBIO_PER_teymur_bakhtiar_desc:0 "泰穆尔·巴赫蒂亚尔，伊朗陆军将领，萨瓦克（SAVAK，国家安全与情报组织）创始人兼首任局长。出身巴赫蒂亚里大部族名门，少年赴贝鲁特法国学校及巴黎圣西尔军校求学，回国后入德黑兰军校。1953年政变后被召回德黑兰晋准将，出任德黑兰戒严司令，主持清洗图德党及伊斯兰敢死队。1956年出任新成立的萨瓦克首任局长，以铁腕手段镇压一切反对力量。1961年因图谋扩权并被发现秘密接触肯尼迪政府而遭沙猜忌免职，遂成为沙的宿敌。此后流亡欧洲、黎巴嫩及伊拉克，广泛联络包括霍梅尼、图德党领袖在内的各路反沙势力。1970年8月12日，萨瓦克特工伪装为其支持者，在伊拉克一次狩猎活动中将其射杀，沙本人事后公开承认这是其个人的成功之举。"
 CBIO_PER_zia_ol_din_tabatabee_desc:0 "赛义德·齐亚丁·塔巴塔别伊，伊朗报人兼政治家，1921年政变的文职策划者。出身教士家庭，早年投身新闻业，先后创办《闪电》《雷声》等报刊，一战期间以亲英立场著称。1921年2月与礼萨·汗联手发动政变推翻卡扎尔末朝政府，年仅三十三岁即出任首相，上台后下令逮捕旧贵族、宣布戒严、推行激进改革，但仅在任九十三天即因与礼萨·汗生隙而被迫辞职流亡。此后长期侨居巴勒斯坦，在贝特哈农经营农场。二战期间获准回国从政，以坚决反共立场著称，成为抵御苏联压力的重要政治力量，1940年代一度被沙视为首相人选。战后投身政党政治，组建民族意志党对抗图德党，晚年影响力渐衰。1969年在德黑兰逝世。"
 CBIO_POL_aleksander_kakowski_desc:0 "卡科夫斯基生于1862年2月5日，普热什尼什附近登比尼村，1886年在华沙晋铎，翌年起在华沙神学院任教。1910年出任圣彼得堡罗马天主教神学院院长，1913年7月晋牧，同年9月起出任华沙总主教，成为波兰王国末代名义primate。第一次世界大战爆发后留驻华沙，1917年9月受德占当局委任为“摄政议会”三摄政之一，与卢博米尔斯基公爵、约瑟夫·奥斯特罗夫斯基共同构成过渡最高权力机构。1919年11月主持为教廷驻波兰大使拉蒂祝圣（后者即后来的教皇庇护十一世），同年12月本人获擢升为枢机。任华沙总主教期间大力扶植天主教报刊事业，推动华沙大学神学系及“公教行动”运动的建立。1938年12月30日在华沙逝世，安葬于布鲁德诺公墓。"
 CBIO_POL_anna_andersson_desc:0 "安娜·安德森原名弗兰齐丝卡·尚兹科夫斯卡，约1896年生于西普鲁士。1920年她在柏林获救后长期自称为俄国沙皇尼古拉二世幼女阿纳斯塔西娅，是罗曼诺夫皇室遇害案后最著名的冒名者之一。她先后在德国和美国生活，并长期通过诉讼争取承认其罗曼诺夫身份；1970年西德法院以证据不足驳回其主张。1984年2月12日，她在美国弗吉尼亚州夏洛茨维尔去世。20世纪90年代遗传检测显示，她与尚兹科夫斯基家族更接近，而非罗曼诺夫家族。"
 CBIO_POL_boleslaw_bierut_desc:0 "比鲁特生于1892年4月18日，卢布林近郊鲁雷村贫苦农民家庭，未完成小学学业，1905年因参与反俄语教学抗议遭学校开除。青年时投身合作社运动，1910年结识影响其走向社会主义的扬·亨佩尔，1912年加入地下社会主义运动，一战前加入“波兰社会党左派”，1918年该党并入共产党，比鲁特自此成为共产党人。1920年代在波兰共产党及合作社运动内部逐步晋升，1925年起多次赴苏联，就读共产国际“列宁学校”接受政治、军事及情报训练，1931至1932年化名“伊万诺夫”任共产国际驻奥地利、保加利亚、捷克斯洛伐克特派员。1933年因“反国家活动”在波兰被判十年监禁（实际服刑至1938年获特赦）。1938年斯大林下令解散波兰共产党期间，他因深得斯大林信任而幸免于随后的大清洗，赴苏联定居。1943年返回波兰，出任苏联扶植的“国家全国委员会”主席（1944—1947，实际行使国家元首职权），1947至1952年任波兰总统，1952至1954年任部长会议主席（总理），同时1948至1956年出任波兰统一工人党第一书记，是战后波兰人民共和国的实际缔造者及“波兰的斯大林”。任内推行全面苏维埃化，纵容公安部对地下抵抗力量及政治异见人士的系统性镇压与处决，并主导华沙重建及文化宫等地标建设。1956年3月赴莫斯科出席苏共二十大，聆听赫鲁晓夫“秘密报告”批判斯大林个人崇拜后健康急剧恶化，3月12日在莫斯科因心脏病发作去世，遗体运回华沙以隆重国葬安葬于鲍翁兹基军人公墓。"
 CBIO_POL_boleslaw_piasecki_desc:0 "皮亚塞茨基生于1915年2月18日，罗兹，出身没落贵族家庭，两岁随父母迁居华沙。青年时投身极右翼民族主义运动，是“民族激进营”（ONR）领导层的重要成员之一。1934年因内政部长遭乌克兰民族主义者刺杀后当局大规模拘捕ONR活动分子，他被关押于别雷扎-卡尔图斯卡拘留营；此后其派系另立门户，创办《方阵报》（Falanga），“民族激进营法兰吉”由此得名，主张融合天主教教义与极权主义的“天主教极权国家”理念，被多数学者视为具有法西斯主义色彩的运动。1939年波兰保卫战中他作为华沙装甲摩托化旅士兵参战，10月潜回华沙后组建地下抵抗组织，此后主导创建“民族联合会”，参加维尔诺地区对德、对苏地下武装斗争，1943年该组织并入国家军。1944年华沙起义后期，他被苏联内务人民委员部逮捕并关押于卢布林城堡，经该部将领谢罗夫审讯后立场发生急剧转变，转而与波兰共产党政权合作。1945年出狱后，他随即创办以“天主教与马克思主义调和”为宗旨的《今日与明日》周刊，并于1946年公投期间为当局造势宣传，1947年创立“PAX天主教团体协会”并终身担任主席，主导该协会庞大的出版、企业及天主教用品生产网络，同时接管被收归国有的“明爱会”波兰分支。1957年，其少年儿子博赫丹遭绑架失踪，据传与波兰公安部特工有关。他始终未获波兰主流天主教会认可，红衣主教维辛斯基曾禁止神职人员订阅其主办的报刊。1965年起当选议会议员并主持PAX议员团体，1971至1979年任国务委员会委员。1979年1月1日在华沙逝世。"
 CBIO_POL_boleslaw_wieniawa_glugoszowski_desc:0 "维尼亚瓦-德乌戈斯基生于1881年7月22日，出身加利西亚贵族之家，曾在利沃夫攻读医学。第一次世界大战期间投身波兰军团，长期担任毕苏斯基的副官，以骑兵将领和文人风范著称，与华沙文学界交往密切。1918年受命出使苏俄期间被契卡逮捕关押，经其未婚妻斡旋获释。1921年起任驻罗马尼亚武官，1926年“五月政变”中协助毕苏斯基筹划行动；此后长期统率骑兵部队，1932年晋升准将，1938年晋升少将，同年起出任波兰驻意大利大使。1939年9月波兰战败前夕，总统莫希奇茨基一度指定他为总统职位继任人选，他仅名义在任约一日，即因西科尔斯基及英法方面的反对而让位于拉茨基维茨。此后辗转里斯本、纽约，1942年获委任为波兰流亡政府驻古巴、多米尼加及海地公使。同年7月1日在纽约身故。"
 CBIO_POL_edward_osobka_morawski_desc:0 "奥索布卡-莫拉维斯基生于1909年10月5日，斯卡尔日斯科-卡缅纳附近布利任村，1928年加入波兰社会党。第二次世界大战期间投身抵抗运动，1944年7月受苏联支持在卢布林成立的“波兰民族解放委员会”（“卢布林委员会”）出任主席，同年10月起兼任外交部长及农业部长。1945年6月起出任“全国团结临时政府”总理直至1947年2月，是战后波兰的第一任政府首脑，任内主张波兰社会党应与农民党联合组成对抗共产党的统一阵线，但这一立场使他与主张与共产党合作的党内对手齐兰凯维奇产生分歧，最终在共产党及苏联支持下于1947年2月被迫辞去总理职务，由齐兰凯维奇接任。此后逐渐向斯大林主义靠拢，但1949年仍以“右倾偏离”罪名被解除公共管理部长职务。1956年“波兰十月”期间重新获准加入已更名为“波兰统一工人党”的执政党，此后长期担任党务官员直至1989年剧变。1990年曾尝试重建旧波兰社会党未果。1997年1月9日在华沙逝世，享年87岁。"
 CBIO_POL_edward_rydzsmigly_desc:0 "雷兹-希米格维生于1886年3月11日，加利西亚瓦普申村，幼年丧父，由外祖父母抚养成人，曾在雅盖隆大学攻读哲学与艺术史。第一次世界大战期间加入毕苏斯基麾下波兰军团，1920年波苏战争中指挥中央方面军，在华沙战役的决定性阶段发挥关键作用。1926年毕苏斯基发动“五月政变”时，他率维尔诺驻军驰援华沙，自此深受毕苏斯基信赖，1929年起负责东部事务的军事协调。1935年毕苏斯基逝世后，他被任命为武装力量总监，成为萨纳齐政权内与总统莫希奇茨基、总理斯瓦韦克三方分权格局中的实力人物，并最终通过与莫希奇茨基的协议压制斯瓦韦克，成为事实上的军政强人。1936年11月晋升波兰元帅，并被官方称为“仅次于总统的国家第二人”。1939年9月出任波兰武装力量总司令，指挥波兰保卫战；战败后于9月18日经罗马尼亚边境撤离并遭软禁，后转赴匈牙利。1941年10月，他秘密离开匈牙利，经斯洛伐克返抵被占领的华沙，自愿放弃元帅军衔，以普通地下抵抗战士身份参与秘密活动，同年12月2日在华沙病逝。其墓碑直至1991年仍未使用真实姓名，1994年华沙市民为其重立刻有全名的墓碑。"
 CBIO_POL_eugeniusz_kwiatkowiski_desc:0 "克维亚特科夫斯基生于1888年12月30日，克拉科夫人，先后在利沃夫大学与慕尼黑大学攻读化学。1926年毕苏斯基政变后，经总统莫希奇茨基举荐出任工商部长（1926—1930），主持建设格丁尼亚海港、发展波兰商船队，使波兰获得独立的出海通道。1935年起任副总理兼财政部长直至1939年，期间主导创建“中央工业区”（COP）大型工业化项目，是萨纳齐政权后期经济建设的核心设计者。1939年波兰战败后经罗马尼亚边境遭拘留；其子在同年9月的保卫战中阵亡。战后一度出任共产党治下政府的沿海事务全权代表，主持战后海港重建，但三年后遭当局解职，并被禁止在沿海地区及首都居留，遂返回故乡克拉科夫从事学术研究直至1974年8月22日去世。"
 CBIO_POL_friedrich_christian_desc:0 "弗里德里希·克里斯蒂安生于1893年12月31日，德累斯顿，萨克森末代国王弗里德里希·奥古斯特三世次子。10岁起循家族传统受封为萨克森禁卫掷弹兵团中尉，1913年入读德累斯顿军事学院。第一次世界大战期间在西线德军总参谋部服役并获多枚战功勋章，凭借出色的语言天赋多次奉派出访西班牙国王阿方索十三世、奥斯曼苏丹穆罕默德五世及奥地利皇帝卡尔一世。1918年一战末期，他是“摄政议会”讨论迎立外国王公方案时，被同时提及为拟议中的波兰王国及立陶宛王国候选人之一——该方案最终未能实现，波兰改行共和体制，他本人从未真正即位或以任何形式统治过波兰，仅是当时被提及、讨论过的候选人选之一。1918年11月13日，其父在德国战败后逊位，他率萨克森军队自比利时、法国撤回德国于富尔达复员。战后转攻法律，先后就读科隆、弗莱堡、弗罗茨瓦夫及维尔茨堡大学，获尼古拉·库萨研究博士学位。1923年因兄长格奥尔格放弃继承权出家为耶稣会士，他成为萨克森王室继承人；1932年父亲去世后正式成为萨克森王室（阿尔贝特系）家族之首，采用“迈森藩侯”称号。此后长期主持家族在萨克森、西里西亚的地产事务，二战期间及战后几经辗转，最终定居慕尼黑，创立“萨克森历史文化研究会”。1968年8月9日在瑞士萨梅丹逝世，安葬于北蒂罗尔卡勒斯滕王室礼拜堂。"
 CBIO_POL_henryk_floyar_rajchman_desc:0 "弗洛亚尔-拉伊奇曼生于1893年12月7日，华沙人，青年时期加入“射击协会”，第一次世界大战期间在波兰军团步兵团服役，后转入秘密的波兰军事组织，1919至1920年波苏战争期间任第一军团步兵师参谋军官。1923年入读华沙高等军事学院，1928至1931年出任波兰驻日本武官。此后转入国会及工商部任职，1934年5月至1935年10月出任工商部长。1939年9月波兰战败之际，他参与组织将波兰黄金储备经罗马尼亚转移至流亡政府控制之下的行动，行动完成后于1940年初退出现役。此后辗转伦敦、巴西，1941年6月抵达纽约，先后受雇于多家美国工业企业，并成为1943年在纽约创立的约瑟夫·毕苏斯基研究所创始成员之一，1947至1951年出任该所副所长。1951年3月22日因心脏病发作逝世于纽约，与另一波兰政治家马图舍夫斯基合葬于皇后区加略山公墓。"
 CBIO_POL_ignacy_moscicki_desc:0 "莫希奇茨基生于1867年12月1日，位于齐哈努夫附近的梅热扎诺沃。青年时代在里加理工学院攻读化学，并加入波兰地下左翼组织“无产者党”，因遭沙俄当局通缉于1892年流亡伦敦，后转赴瑞士弗里堡大学任教，以合成硝酸工业化技术闻名欧洲化学界。1926年毕苏斯基发动“五月政变”后，经毕苏斯基属意，于6月1日由国民议会选举出任波兰总统，1933年连任。任内长期依附于毕苏斯基的权威，鲜少公开表达异议；1935年毕苏斯基逝世后，与雷兹-希米格维达成分权协议，共同边缘化竞争者瓦莱雷·斯瓦韦克，自己则继续担任总统直至战败。1939年9月德苏两国入侵波兰后流亡罗马尼亚，遭软禁并在法国压力下被迫辞职，先将总统职位移交维尼亚瓦-德乌戈斯基，后者仅任职一日即由拉茨基维茨接任。同年底转赴瑞士定居，在日内瓦附近的沃尔索担任化学实验室研究员直至1946年10月2日病逝。1993年，其遗骸经波兰当局迁回国内，安葬于华沙圣若望主教座堂地下墓室。"
 CBIO_POL_irena_anders_desc:0 "伊蕾娜·安德斯原名伊雷娜·雅罗谢维奇（舞台艺名“雷娜塔·波格丹丝卡”），1920年5月12日生于布伦塔尔（时属捷克斯洛伐克，今属捷克），父亲是希腊礼天主教随军神父，家族具有乌克兰血统。她在利沃夫师从多位声乐教师学习演唱，1939年波兰战败后随文艺团体辗转各地，为在西方作战的波兰军队进行慰问演出，是最早演唱著名军歌《卡西诺山上的红罂粟》的歌手之一，该曲纪念1944年卡西诺山战役阵亡将士。她随波兰第二军团辗转中东、意大利等地进行演出，战后定居英国，1948年与瓦迪斯瓦夫·安德斯将军结婚，育有一女安娜·玛丽亚。此后她继续从事演艺事业，在广播、电影中多次出演，2007年获波兰第二等公民荣誉勋章以表彰其对波兰文化的贡献。2010年11月29日在伦敦逝世。"
 CBIO_POL_jan_kowalewski_desc:0 "科瓦莱夫斯基生于1892年10月23日，罗兹人，1909至1913年就读比利时列日大学化学系。第一次世界大战爆发后被强征入沙俄军队工兵通信部队，在白俄罗斯及罗马尼亚前线服役，1918年底获准加入波兰部队。因精通多国语言又对密码破译抱有业余兴趣，他在波乌战争期间偶然破译截获的布尔什维克电报，由此于1919年7月调任波兰总参谋部无线电情报处处长，并招募华沙大学及利沃夫大学的数学家组建团队，在1920年波苏战争期间破译逾百种苏军密码，为华沙战役的胜利提供了关键情报支持，他本人也因此获得波兰最高军事勋章维尔图蒂·米利塔里银十字勋章，但这一贡献直至70余年后才为世人所知。战后他一度负责第三次西里西亚起义的情报工作，1923年赴东京为日本军官开设无线电情报课程，获日本“旭日勋章”。1928年毕业于巴黎高等军事学院，此后转任外交及情报系统，1929年起任驻莫斯科武官，1933年被苏联宣布为不受欢迎人物后转任驻布加勒斯特武官直至1937年。二战期间他在里斯本主持代号“大陆行动”的情报网络，试图策动匈牙利、罗马尼亚脱离轴心国，后因苏联方面施压于1944年被英国要求解职调往伦敦，此后出任波兰特种作战总部行动局局长，筹备欧洲各地抵抗组织配合诺曼底登陆，但为时已晚难有实际作为。战后留居英国从事新闻及教育工作，1965年10月31日因癌症在伦敦逝世。"
 CBIO_POL_jan_mosdorf_desc:0 "莫斯多夫生于1904年5月30日，华沙人，曾获哲学博士学位，师从塔塔尔凯维奇研究奥古斯特·孔德思想。1926年投身民族民主运动，1928年出任“全波青年”组织负责人，持强烈右翼民族主义及反犹立场，是极右翼“民族激进营”（ONR）的创始人及思想宣言的主要执笔者之一。1934年该组织遭当局取缔后，他一度被关押于别雷扎-卡尔图斯卡拘留营，此后以笔名“安杰伊·维特科夫斯基”从事政论写作，1938年出版代表作《昨日与明日》。1939年波兰战败后转入地下民族党，参与组建反纳粹地下武装“民族军事组织”。1940年7月被盖世太保逮捕，关押于华沙帕维亚克监狱，1941年1月被押送至奥斯维辛集中营。据幸存者回忆，他在集中营患斑疹伤寒康复后转变了此前对犹太囚犯的敌视态度，尽力向狱中犹太难友提供帮助。1943年10月11日，他与其他一批囚犯一同在奥斯维辛集中营遭处决身亡。"
 CBIO_POL_jan_zumbach_desc:0 "祖姆巴赫生于1915年4月14日，华沙附近的乌雷诺夫，父亲具有瑞士血统，他本人终生持瑞士护照。1935年加入波兰陆军步兵，1936年转入波兰空军，1938年毕业于登布林飞行军官学校后编入第111歼击机中队。1939年波兰保卫战期间因训练事故骨折未能参战，战败后经罗马尼亚辗转撤至法国，驾驶莫兰406及柯蒂斯“鹰”75型战斗机参加法国战役。法国沦陷后经海路抵达英国，1940年8月成为新组建的英国皇家空军第303“波兰”歼击机中队创始成员之一，在不列颠之战中取得8架确认战果。此后历任分队长、中队长（1942年5月至1943年11月），后升任波兰第二歼击机联队（第133联队）指挥官，1944年9月在阿纳姆上空取得最后一次战果，1945年1月因导航失误迫降德占区，以战俘身份度过战争最后一个月。战后他继续从事飞行工作，持瑞士护照往返南欧及中东地区，一度涉及走私活动；1962年受聘组建并指挥刚果加丹加分离政权的“阿维卡特”空军，1967年又化名“约翰·布朗”组建并指挥尼日利亚比亚法拉分离政权空军。1975年出版回忆录《最后一战：我作为飞行员、走私者与冒险家的一生》。1986年1月3日在法国死于情况不明的事件，调查经法国当局下令终止且未公开解释，遗体安葬于华沙鲍翁兹基军人公墓。"
 CBIO_POL_joachim_stefan_bartoszewicz_desc:0 "巴托斯泽维奇生于1867年9月3日，华沙人，先在华沙帝国大学攻读医学并获博士学位，后转赴巴黎政治学院攻读外交专业，以第一名成绩获得文凭；此后又在利沃夫大学攻读法学并获双法学博士学位。第一次世界大战前投身“全波”民族运动，1905年移居基辅，1906至1912年任民族民主派机关报《基辅日报》主编，并自1906年起担任民族联盟驻俄罗斯领土的基辅特派员。1922年11月当选参议员，代表卢布林省，隶属“人民民族联盟”（ZLN），1923年当选该联盟中央执行委员会委员直至1924年。他长期活跃于“保卫东部边疆波兰协会”，发表关于东部边疆政治意义的论著。1927年11月议会任期结束后退出参议院。1930年波兰议会选举期间，他领导民族党参选，该党在选举中获得第二高票。1937年6月，因年事已高（时年70岁），他将民族党执行委员会主席一职移交年轻一代的卡齐米日·科瓦尔斯基。1938年9月23日因心脏病发作在华沙去世。"
 CBIO_POL_jozef_beck_desc:0 "贝克生于1894年10月4日，华沙人，第一次世界大战期间加入波兰军团并担任毕苏斯基的副官，后参与秘密的波兰军事组织。1922至1923年出任波兰驻法国武官。1926年协助筹划“五月政变”，此后历任军事部长办公厅主任（1926—1930）、副总理兼副外交部长（1930—1932），1932年起出任外交部长直至1939年，是两战间波兰外交政策的主要制定者。他奉行在德苏两大强邻之间保持“等距离”平衡的路线，先后于1932年与苏联、1934年与德国签署互不侵犯条约；1938年慕尼黑协定后波兰趁机吞并捷克斯洛伐克切欣地区。1939年4月促成英波互助条约，同年5月在众议院演说中公开拒绝希特勒关于但泽及“波兰走廊”的要求。德苏入侵波兰后随政府撤往罗马尼亚并遭软禁，1944年6月5日在罗马尼亚斯特内什蒂病逝于肺结核，其回忆录后以法文出版。"
 CBIO_POL_jozef_haller_desc:0 "哈勒尔生于1873年8月13日，克拉科夫附近尤尔奇采村，家族世代具有强烈爱国及宗教传统。就读维也纳军事技术学院炮兵科，1895至1910年在奥匈军队第11炮兵团服役至上尉军衔后退役，此后投身农民合作运动及“猎鹰”体育爱国团体。第一次世界大战期间出任波兰军团第二旅旅长，1918年“拉拉尼查冲锋”后突破奥俄防线转赴乌克兰，后因德方视波兰军团驻乌克兰为非法而遭围困缴械，他本人逃往莫斯科，辗转经摩尔曼斯克抵达巴黎，受波兰民族委员会委托组建“蓝军”（因其法式军装得名），该部队后来发展至逾7万人规模，1919年4月率部凯旋华沙，获授荣誉市民称号。此后蓝军投入波乌战线作战，1920年他主持“波兰迎娶波罗的海”象征性仪式，正式将波莫瑞地区并入波兰版图并进驻但泽；波苏战争期间出任志愿军督察并指挥东北战线，参与华沙保卫战外围防御。战后历任炮兵总监（1920—1926年）及最高军事鉴定委员会主席等职，1920至1927年任议会议员，1922年纳鲁托维奇当选总统后逐渐失势，1926年毕苏斯基政变后被勒令退役，此后共同组织反对派“莫尔日阵线”。1939年波兰战败时他身在国外，1939年11月起任流亡政府不管部部长，1940至1943年出任西科尔斯基流亡政府教育部长。战后定居伦敦，以“蓝色将军”传奇之名度过晚年，1960年6月4日逝世，安葬于伦敦冈斯伯里公墓，1993年骨灰迁葬克拉科夫圣阿格涅什卡驻军教堂地下墓室。"
 CBIO_POL_jozef_unrug_desc:0 "乌鲁克生于1884年10月7日，德国勃兰登堡，出身普鲁士与波兰混合血统的贵族家庭，父亲为普鲁士陆军少将。1907年毕业于基尔海军学院后加入德意志帝国海军，一战期间指挥潜艇并晋升潜艇支队指挥官。1919年波兰独立后，他毅然放弃德国国籍投身尚不存在的波兰海军，自费购置蒸汽船作为波兰海军首艘测量船，历任水文处处长、潜艇支队指挥官，1925年出任波兰舰队司令，1932年晋升海军少将。他与海军总监希维尔斯基长期力主建设“绿水海军”乃至“蓝水海军”，但受限于经费，主要成果是1932年“维赫尔”号驱逐舰强行进入但泽引发的“但泽危机”。1939年8月起出任沿海防御区司令，波兰战败后率残部死守海尔半岛，10月2日在弹尽粮绝下率部投降。此后被俘，辗转多个德军战俘营包括科尔迪茨城堡，面对德方屡次利诱其“叛降”均予拒绝，声称“自1939年9月1日起我已忘记德语”，坚持只用波兰语或法语与德方沟通，以精神感召鼓舞狱中波兰军人。战后定居英国，继而摩洛哥、法国，1973年2月28日在法国莱伊昂瓦尔逝世。2018年，波兰总统追授其海军上将军衔，其遗骸与夫人一同迁葬格丁尼亚。"
 CBIO_POL_jozef_zajac_desc:0 "扎永茨生于1891年3月14日，热舒夫人，在克拉科夫雅盖隆大学攻读哲学并于1915年获博士学位。1912年加入“射击协会”并接受军官训练，1914年加入波兰军团，历任多个步兵团指挥官。1918年加入哈勒尔将军麾下“蓝军”，一度驻留法国并就读高等军事学院，后参加波苏战争末期作战，任维斯瓦河集团军、“北方”作战集群及第三集团军参谋长。两战间历任第一部处参谋长（1922年）、准将（1924年）、总参谋部第一副总长（1925年）及波兰第26步兵师师长（1926年）。1936年出任克拉科夫军区司令兼波兰空军督察，1937年起接受飞行员训练并出任防空司令，1939年出任波兰空军总司令，负责统筹当年9月对德空战。波兰战败后经罗马尼亚转赴法国参加战役，法国沦陷后撤至英国，1940年9月出任波兰第一军副司令，1941年出任中东战区波兰空军司令并晋升师级将军，安德斯军并入西方指挥体系后，他出任中东波兰军队副司令直至1943年3月，此后至1946年任西方波兰武装力量训练督察。战后选择不返回共产党治下波兰，定居爱丁堡并再获哲学博士学位，在当地从事学术工作，出版心理学及军事科学著作与回忆录。1963年12月12日在加拿大渥太华逝世。"
 CBIO_POL_karl_albrecht_desc:0 "卡尔·阿尔布雷希特生于1697年8月6日，布鲁塞尔，出身维特尔斯巴赫家族，父亲为巴伐利亚选帝侯马克西米利安二世·埃曼努埃尔，母亲特蕾莎·库内贡达为波兰国王扬三世·索别斯基之女。1726年他继任巴伐利亚选帝侯。奥地利王位继承战争爆发后，他以血缘和婚姻关系向哈布斯堡遗产提出继承要求，1741年一度占领布拉格并受封波希米亚国王。1742年在法兰克福加冕为神圣罗马皇帝查理七世，成为三百年来首位非哈布斯堡出身的皇帝。其统治长期受战争牵制，巴伐利亚本土多次遭奥地利军队占领，1745年1月20日在慕尼黑去世。"
 CBIO_POL_karol_korytowski_desc:0 "科里托夫斯基生于1892年1月28日，克拉科夫人，1913年毕业于阜姆海军候补学校，1914年毕业于海军军官学校。第一次世界大战期间在奥匈帝国海军鱼雷艇部队服役。1918年底晋升海军上尉后加入意大利境内波兰军队，回国后参加波苏战争。1920年底出任“毕苏斯基指挥官”号炮舰舰长，该舰先后担任舰队礼仪舰及训练舰。1921至1925年任希维奇海军专业学校校长，后调任托伦海军候补生学校校长，1929至1933年出任海军候补生学校校长（格丁尼亚）。1933年起任海军总部参谋长直至1939年战争爆发。战败后随海军总部撤退至平斯克继而罗马尼亚，1939年10月抵达巴黎出任海军总部副职。1940年6月法国沦陷期间负责组织波兰军队向英国撤离，此后长期在伦敦担任海军总部副职，1941年一度与总司令希维尔斯基一同被总理西科尔斯基解职（因潜艇部队指挥官自杀事件引咎），1942年10月官复原职。1945年5月晋升海军少将，出任海军总部第二副职。西方波兰武装力量解散后未返回波兰，先后主持波兰安置团海事处及伦敦海事学院，以笔名“卡罗尔·莫拉”在多家波兰侨界刊物发表文章。1966年10月11日在伦敦逝世，安葬于冈斯伯里公墓。"
 CBIO_POL_kazimierz_sosnkowski_desc:0 "索森科夫斯基生于1885年11月19日，华沙贵族家庭，精通拉丁语、希腊语、英语、法语、德语、意大利语及俄语。青年时期投身秘密进步青年组织及波兰社会党，1908年协助毕苏斯基创建“武装斗争同盟”，第一次世界大战期间任波兰军团第一旅参谋长兼毕苏斯基副手，“效忠危机”中与毕苏斯基一同被囚于马格德堡，1918年11月获释后随毕苏斯基返回华沙。1920至1924年任军事部长，主持波兰军队现代化建设及对法条约谈判，并主持格丁尼亚港的初期建设。1925年任波兰常驻国际联盟代表期间，推动通过首个针对生物武器的国际公约。1926年政变前未获毕苏斯基告知计划，一度试图自杀。1939年9月波兰战败，他一度指挥南方战线并在向利沃夫撤退途中屡获小胜，后因苏联入侵被迫解散部队，乔装穿越苏占区经匈牙利抵达法国，出任流亡政府不管部部长，并受总统拉茨基维茨指定为总统继承人（西科尔斯基对此持反对意见）。1941年因抗议《西科尔斯基—迈斯基协定》未就波兰东部边界作出明确保障而辞去政府职务，此后两年成为政府的坚定批评者。1943年7月西科尔斯基空难身亡后，他接任流亡武装力量总司令；因公开批评盟国未能有效支援华沙起义，在丘吉尔施压下于1944年9月30日被解除总司令职务。同年11月移居加拿大，此后因对苏联持强硬立场，直至1949年才获准取得美英签证。1952至1954年积极推动波兰流亡各派系团结运动。1969年10月11日在加拿大魁北克阿伦德尔逝世，1992年骨灰迁葬华沙圣若望主教座堂。"
 CBIO_POL_kazimierz_switalski_desc:0 "希维塔尔斯基生于1886年3月4日，萨诺克人，青年时期加入毕苏斯基创建的“武装斗争同盟”地下组织，第一次世界大战中在波兰军团服役。1926年“五月政变”中支持毕苏斯基，政变后历任总统府文官厅厅长、内政部政治司司长，1928年出任教育部长，1929年4月至12月出任总理，与卡齐米日·巴特尔轮替执政。此后任众议院议员，1930至1935年间出任众议院议长，后转任参议院副议长，1935年底至1936年初兼任克拉科夫省长。1939年波兰战败后被俘，在沃尔登贝格战俘营中度过整个战争时期；其独子在华沙起义首日阵亡。1945年返回波兰后，遭共产党当局关押至1956年。1962年因电车事故受伤，于华沙去世。"
 CBIO_POL_lucjan_zeligowski_desc:0 "泽利戈斯基生于1865年10月17日，维尔纽斯附近奥斯米亚纳一带（今属白俄罗斯），自幼生活贫困，只讲当地白俄罗斯方言，自认为立陶宛人而非白俄罗斯人。1885年毕业于里加军官学校后加入俄军，参加过日俄战争（1904—1905），一战期间任俄军步兵团中校团长。1917年俄国二月革命后投身在俄波兰军队的组建工作，历任步兵团长、旅长，1918年在库班地区组建波兰第4步枪师并加入邓尼金“白军”作战，同年10月出任在俄全体波兰部队总司令。波苏战争爆发后，他率部撤入罗马尼亚比萨拉比亚地区防御布尔什维克袭扰，此后晋升将军并统率以其名字命名的作战集群，在波列西耶及平斯克沼泽地区作战；华沙战役期间所部隶属波兰第三集团军，参与涅曼河战役追击溃退苏军。1920年10月，他奉毕苏斯基密令制造“泽利戈斯基兵变”，率部“哗变”占领维尔诺，10月12日宣布成立“中立陶宛共和国”并自任军事独裁者，后将权力移交新选出的议会，该议会决定并入波兰，1922年3月正式并入波兰版图。两战间历任军区督察、1925年出任军事部长（毕苏斯基政变期间一度被撤职，后官复原职），1926年政变后出任调查五月事件的清算委员会主席，1927年8月退役。1935至1939年当选议会议员。1939年波兰战败时，73岁高龄的他自愿请缨从军，但因年事已高未获批准。二战结束后他表示愿意返回波兰，却于1947年7月9日在伦敦骤然离世，遗体运回波兰安葬于华沙鲍翁兹基军人公墓。"
 CBIO_POL_ludomil_rayski_desc:0 "路多米克雷斯基生于1892年12月29日，克拉科夫附近的恰斯瓔夫村，其父为一月起义参与者，失败后流亡奥斯曼帝国并加入土耳其军队，故他本人自幼持土耳其国籍。第一次世界大战爆发后志愿加入毕苏斯基麾下波兰军团，负伤后受劝说转赴伊斯坦布尔谋求航空作战经验，1915年编入土耳其空军并参加加里波利战役，两度负重伤。1919年他自行购机飞越黑海抵达敖德萨，加入泽利戈斯基将军麾下波兰第4步兵师并组建其航空分队。1926年“五月政变”期间他以步兵身份支持毕苏斯基一方，政变后出任军事部航空司司长，1926至1939年长期担任波兰空军实际最高负责人，主持推动以波兰本国设计、本国制造飞机为核心的空军现代化路线，是国家航空工业（PZL）体系的主要缔造者之一。1939年3月因当局对空军发展重视不足而愤然辞职。波兰战败后辗转法国、英国，一度加入法国外籍军团，后转入英国皇家空军从事运输及联络飞行，1943年出任中东地区波兰空军督察。战后定居伦敦，长期未获流亡当局平反，直至1977年病重弥留之际才经流亡政府名誉委员会撤销此前指控，同年4月11日去世。1993年其骨灰移葬华沙军队主教座堂。"
 CBIO_POL_maria_koszutska_desc:0 "科苏茨卡生于1876年2月2日，卡利什附近格沃夫琴庄园地主家庭，化名“维拉·科斯特热娃”。1902年加入波兰社会党，主要在罗兹从事党务工作，1903年遭沙俄当局监禁，1904年遭流放。1905年革命期间恢复地下活动，1906年该党分裂后成为“波兰社会党左派”创始领导人之一，长期投身工人教育运动。1918年参与创建波兰共产党（初称“波兰共产工人党”），与阿道夫·瓦尔斯基、亨里克·瓦莱茨基并称党内“三W”核心领导层，1918至1929年间断任中央委员会委员，1923至1929年任政治局委员，在党内代表相对温和的“多数派”立场。1925年12月她曾联署声明将托洛茨基与十月革命胜利紧密相连，这一立场后来使她在斯大林主义氛围下备受猜忌。1929年后移居苏联，在一家出版社工作，被排除于波兰共产党实际事务之外，公开反对该党及共产国际的斯大林化进程。1937年6月苏联大清洗期间，内务人民委员部头目叶若夫宣称破获所谓“波兰军事组织”间谍网，她作为被控“领导人”之一遭秘密逮捕，是该案中唯一的女性被告，也是其中唯一未被处决者，但最终于1939年7月9日死于莫斯科狱中，享年63岁。"
 CBIO_POL_marian_kukiel_desc:0 "库基尔生于1885年5月15日，加利西亚东布罗瓦-塔尔诺夫斯卡人，父亲曾参加1863年一月起义。1903年入读利沃夫扬·卡齐米日大学历史系，师从著名历史学家阿谢纳齐，1909年获博士学位，专攻拿破仑时代波兰军事史。1908年与索森科夫斯基、西科尔斯基共同创建“武装斗争同盟”，一战期间在毕苏斯基麾下波兰军团任参谋官，参加科斯秋赫努夫卡等战役。1919至1920年任总参谋部第三处副处长，参加波苏战争，1920年出任第20旅旅长兼历史局局长。1923至1925年任第13步兵师师长，毕苏斯基1926年政变后转入预备役。1927年起任雅盖隆大学军事史教授，1930至1939年兼任克拉科夫恰尔托雷斯基博物馆馆长，1932年当选波兰学术能力学会院士。1939年参加利沃夫保卫战，战败后经罗马尼亚辗转抵达法国，出任流亡政府军事部副部长（1939—1940）。法国沦陷后转赴英国，1940至1942年任驻苏格兰科特布里奇的波兰第一军军长，1942年9月起出任流亡政府军事部长（后改称国防部长）直至1949年，任内长期主张彻查卡廷惨案真相。战后拒绝返回波兰，历任伦敦“波兰海外大学”教授（1945—1973）、伦敦波兰历史研究所所长（1946—1973）、西科尔斯基研究所成员（1951—1966），是两战间及流亡时期波兰军事史学的奠基人之一。1973年8月15日，他在伦敦因车祸受伤后不治身亡，享年88岁，安葬于肯萨尔格林公墓。"
 CBIO_POL_marian_rejewski_desc:0 "雷耶夫斯基生于1905年8月16日，比得哥什人（时属德占普鲁士分区，德语称布龙贝格），就读德语文理中学后转入波兹南密茨凯维奇大学攻读数学，1929年获硕士学位。在校期间受教授克雷戈夫斯基推荐，参加密码局为德语数学优秀生开设的秘密密码学课程，1932年9月起进入华沙密码局全职工作。同年冬，他在极少量法国情报机构提供的资料辅助下，以纯数学置换理论破译了德军恩尼格玛密码机的内部接线原理，此后与同事鲁日茨基、齐加尔斯基合作近七年，持续开发破译方法与设备（包括著名的“密码炸弹”），即便德方不断更新加密程序仍能保持破译能力。1939年7月25日，即德国入侵波兰前五周，波兰密码局在华沙近郊皮雷向法英情报代表移交全部破译成果与设备，为英国“超级机密”（Ultra）计划奠定基础。波兰战败后，他经罗马尼亚辗转至法国继续破译工作，法国沦陷后又转入维希法国及北非从事秘密工作，1942年11月德军全面占领法国后经西班牙、葡萄牙、直布罗陀逃往英国，加入波兰军队从事低级别德军密码破译工作。1946年返回波兰后从事会计工作，直至1967年退休前一直对其密码破译经历守口如瓶。1980年2月13日因心脏病发作在华沙家中去世，以军礼安葬于鲍翁兹基军人公墓。"
 CBIO_POL_mieczyslaw_michalowicz_desc:0 "米哈沃维奇生于1876年9月10日，圣彼得堡人，后成为华沙大学儿科学教授、波兰社会党活动家，1930至1931年出任华沙大学校长，是波兰科学能力学会及波兰科学院院士。两战间当选参议员，初期支持萨纳齐政权，后转为反对派，1939年参与创立中间派“民主党”。二战期间遭德国当局逮捕关押（1942年11月起），战后选择与苏联扶植的波兰共产党政权合作。他是波兰现代儿科学的重要奠基人之一，也是较早将电子学、控制论方法引入波兰医学领域的学者。1965年11月22日在华沙逝世，安葬于鲍翁兹基公墓。"
 CBIO_POL_pavel_bermondt_avalov_desc:0 "贝蒙德-阿瓦洛夫生于1877年3月4日（儒略历），第比利斯，身世存在多种说法，较可信的一种称其生父为格鲁吉亚贵族米哈伊尔·阿瓦利什维利，养父为俄军军士拉法伊尔·贝蒙特，故兼采两姓。青年时在华沙音乐学院接受音乐教育后加入外贝加尔哥萨克部队任军乐指挥，1904年志愿参军，1905年日俄战争期间获圣乔治十字勋章，后皈依东正教并转入乌苏里哥萨克部队。第一次世界大战期间任米先科将军私人副官，在东普鲁士及加利西亚前线服役。俄国革命后投身白俄运动，1918年一度在基辅抵抗彼得留拉的乌克兰武装，后遭俘获流亡德国，同年获少将军衔。1919年在德国支持下于波罗的海地区组建“特别俄罗斯军团”（后改称“西俄志愿军”），并与德国指挥官吕迪格·冯·德·戈尔茨的部队合并，总兵力号称5万人（实际约2万），主要成分是德国自由军团志愿者及获释俄国战俘。该部队名义上打着“反布尔什维克”旗号，实际矛头指向新独立的拉脱维亚、立陶宛，一度攻占库尔兰大部及里加，并对占领区实施劫掠，在当地历史记述中留下“冒险家军阀”的恶名。1919年11月遭拉脱维亚军队击退，继而在拉德维利什基斯战役中被立陶宛军队重创，同年12月全军撤入德国。此后他长期定居德国，出版回忆录，深度介入极右翼白俄侨民运动，坚定支持纳粹党并自建“俄罗斯民族社会主义运动”组织，但1939年仍因挪用组织资金遭纳粹当局逮捕并送入集中营，此后经瑞士逃往意大利，继而贝尔格莱德，最终移民美国。1973年12月27日在纽约逝世。"
 CBIO_POL_roman_abraham_desc:0 "阿布拉罕生于1891年2月28日，利沃夫人，父亲为利沃夫大学教会法教授兼校长。曾就读希罗夫耶稣会学校，后入读利沃夫扬·卡齐米日大学哲学法律系。第一次世界大战期间在奥匈军队骑兵团服役，转战法国、罗马尼亚、俄国、塞尔维亚及意大利战线，战争结束时任骑兵中尉。波兰独立后加入波兰军队，参加波乌战争及波苏战争。两战间历任骑兵团长、骑兵旅长等职，1930至1931年短暂出任议会议员，1938年3月晋升准将并执掌大波兰骑兵旅。1939年波兰保卫战中，他率部隶属库特兹巴指挥的波兹南集团军，在莱什诺、希雷姆、拉维奇一带作战；9月9日起参加布祖拉河战役，指挥部队对索博塔及瓦莱维采发起攻击，此后在布罗胡夫、谢拉库夫等地持续激战。9月15至21日他统一指挥大波兰骑兵旅及波多利亚骑兵旅组成的作战集群，部分部队于9月20日突围抵达华沙。他麾下骑兵部队在整场保卫战中未遭遇一次战役性失败，是波兰保卫战中战绩最为完整的骑兵指挥官之一。曾流传其部队“骑兵冲锋德军坦克”的说法。9月23日起他受命统一指挥华沙保卫战中的骑兵联合旅直至9月28日投降。此后被俘，在穆尔瑙战俘营度过战争余下时间，1945年4月获美军解放后选择返回战后波兰。1976年8月26日在华沙逝世。"
 CBIO_POL_roman_dmowski_desc:0 "德莫夫斯基生于1864年8月9日，华沙近郊人，青年时代投身争取波兰独立的运动，1893年参与创建“民族联盟”地下组织，1895年迁居利沃夫，1897年创立“民族民主党”，自此长期担任该运动的思想领袖，与毕苏斯基构成两战间波兰政治的两大对立极——毕苏斯基主张多民族联邦式的波兰，德莫夫斯基则主张以波兰语、天主教为纽带的单一民族国家。第一次世界大战期间，他在巴黎创建“波兰民族委员会”，作为协约国承认的波兰代表机构；1919年他与帕德雷夫斯基共同代表波兰出席巴黎和会，并于同年6月在《凡尔赛条约》上签字，同年9月代表波兰签署《圣日耳曼条约》。他在巴黎和会上极力反对协约国强加给波兰的“少数民族保护条约”，并为波兰争取到较条约草案更靠西的对德边界。1919至1922年任波兰立宪议会议员，1923年短暂出任外交部长后基本退出一线政坛。1926年毕苏斯基政变后，他创建“大波兰营”作为反对派政治组织。晚年定居罗兹多沃庄园，1939年1月2日在该地逝世，葬于华沙布鲁德诺公墓。"
 CBIO_POL_rudinger_von_der_goltz_desc:0 "冯·德·戈尔茨生于1865年12月8日，勃兰登堡祖利肖，德国戈尔茨贵族世家，1885年加入德军。第一次世界大战期间历任多个旅长职务，1918年3月奉命率“波罗的海师”驰援芬兰白军，4月在汉科登陆后进军赫尔辛基，协助芬兰内战中白军击败红军及苏俄部队，一度被称为“芬兰事实上的摄政”。1919年1月受任利耶帕亚“总督”，指挥德国-拉脱维亚联合第六后备军，3月起接连击败当地布尔什维克武装，5月攻占里加，试图扶植亲德傀儡政权。因协约国压力被要求撤军，他以“部队已改编为反布尔什维克白俄武装”为由拖延近五个月，其部队6月进攻爱沙尼亚军队在采西斯战役中遭挫败，此后被迫将部队移交俄裔将领贝蒙德-阿瓦洛夫指挥，本人于1919年12月最终撤入东普鲁士。战后投身德国右翼政治，参与1920年“卡普政变”，两战间长期活跃于极右翼团体，1930年代初出任“德国爱国团体联合会”主席，参与“哈尔茨堡阵线”。1946年11月4日在德国上巴伐利亚金塞格庄园逝世。"
 CBIO_POL_sejmik_regency_desc:0 "“摄政议会”是1917年9月由德奥占领当局在波兰王国扶植设立的过渡性集体统治机构，由三位摄政共同行使国家元首职权，直至1918年11月毕苏斯基接掌权力为止。"
 CBIO_POL_stanislav_maczek_desc:0 "马切克生于1892年3月31日，利沃夫近郊谢尔泽茨村，父亲为律师。第一次世界大战爆发后入伍加入奥匈军队，战争期间屡建战功获得晋升与勋章。1918年11月奥匈帝国崩溃后加入波兰军队，在波乌边境冲突中表现英勇，1919年4月起自行创建并指挥仿效德军突击营模式组建的“飞行连”，装备精良、机动力强，曾参与德罗霍贝奇、斯坦尼斯瓦沃夫、布恰奇等地激战。两战间他率先在波兰军队中倡导装甲机械化理念，1937年出任波兰唯一一支机械化部队第10骑兵旅旅长。1939年波兰保卫战中，该旅是波兰军队仅有的成建制机械化部队，战斗中多次给德军以重创。战败后经匈牙利辗转抵达法国，重建一支机械化部队参加1940年法国战役，6月18日在缺乏后援、弹药耗尽的情况下下令销毁重装备、化整为零突围，他本人与部分官兵经维希法国、北非、葡萄牙辗转抵达英国。1942年2月他在苏格兰整训两年后正式组建波兰第一装甲师并任师长，1944年8月该师投入诺曼底战役，在蒙特奥梅尔、262高地及尚布瓦镇的战斗中协同盟军合围德军14个师，即著名的“法莱斯口袋”战役，他的部队担负了封闭包围圈的关键任务。此后该师作为盟军先锋部队转战法国北部、比利时、荷兰直至德国，曾解放荷兰布雷达市并获该市荣誉市民称号。战争结束后升任波兰第一军军长，统率英国境内全体波兰部队直至1947年复员。战后遭波兰共产党政权剥夺国籍，被迫留居英国，英国政府又以其非英国军队成员为由拒发将官退休金，他不得不在爱丁堡一家酒店当调酒师维生直至上世纪60年代。1994年12月11日在爱丁堡逝世，享年102岁，遵其遗愿安葬于荷兰布雷达的波兰军人公墓，与麾下阵亡将士长眠一处。"
 CBIO_POL_stanislaw_kopanski_desc:0 "科潘斯基生于1895年5月19日，圣彼得堡波兰裔家庭，1914年因一战爆发中断工程学业应征入俄军，毕业于米哈伊洛夫斯基炮兵学校后在俄军第2骑兵师服役。1917年二月革命后加入在俄组建的波兰第一军，1918年后辗转返回波兰，加入波兰第1枪骑兵团参加波乌战争，1919年4月在维尔诺战斗中身负重伤失去左眼，康复后转任炮兵军士学校校长，同年9月起指挥骑炮兵支队参加波苏战争并获维尔图蒂·米利塔里银十字勋章。两战间历任炮兵学校副校长、总参谋部各处职务，1935年起任装甲兵副总监，1937至1939年指挥自行火炮团，1939年3月起任总参谋部第三处处长。波兰战败后经罗马尼亚辗转法国，1940年4月受命在法属叙利亚组建“喀尔巴阡独立步兵旅”并任旅长，该旅1941年8月投入托卜鲁克围城战末期防御，后参加加扎拉战役，因战功获英军授予“托卜鲁克之鼠”荣誉称号。1942年该旅扩编为第三喀尔巴阡步兵师，他继续担任师长，1943年7月调任伦敦，出任流亡武装力量总司令部参谋长直至1947年。1946年9月26日被波兰“全国团结临时政府”剥夺国籍（直至1972年恢复）。1947至1949年任波兰安置团总监，1970至1976年出任流亡政府名誉总参谋长及武装力量总监，1970至1973年兼任“三人委员会”成员。1976年3月23日在伦敦逝世，安葬于诺斯伍德公墓。"
 CBIO_POL_stanislaw_mikolajczyk_desc:0 "米科拉伊奇克生于1901年7月18日，德国西发利亚霍尔斯特豪森（今属北莱茵-威斯特法伦州），出身波兹南地区移居德国鲁尔矿区谋生的“鲁尔波兰人”家庭，十岁随家迁回波兹南。青年时在制糖厂做工并投身波兰爱国团体，1920年加入波兰军队参加波苏战争，在华沙战役附近负伤后退伍，返乡继承父业务农。1929年当选议员，1931至1939年出任“人民党”（农民党）领导人之一。1939年德国入侵波兰时以列兵身份参加华沙保卫战，战败后经匈牙利辗转南斯拉夫、意大利抵达法国，随即受邀出任流亡政府波兰全国委员会副主席。1941年出任内政部长兼西科尔斯基政府副总理，主管与波兰本土地下抵抗力量的联络。1943年4月卡廷惨案真相公开后，苏联单方面与流亡政府断交；同年7月西科尔斯基空难身亡后，他于7月14日继任流亡政府总理直至1944年11月，任内多次赴莫斯科同斯大林、丘吉尔谈判争取波兰东部边界及主权，但收效甚微，最终因盟国对华沙起义支援不力及东部边界问题于1944年11月辞职。1945年6月27日返回波兰，出任苏联扶植的“全国团结临时政府”第二副总理兼农业与土地改革部长，随即着手重建“波兰人民党”（PSL），该党迅速发展成为波兰境内规模最大的政党。1946年“三个赞成”公投及1947年1月国会选举中均遭当局系统性舞弊打压，人民党实际获得的支持率被严重低报。眼见大规模政治迫害与逮捕即将波及自身，他于1947年10月出走西方，定居伦敦继而美国，长期从事反苏反共宣传及游说工作，出版《波兰的强暴：苏联侵略模式》一书。1966年12月13日在华盛顿逝世，2000年遗骸迁葬波兹南。"
 CBIO_POL_stanislaw_pawluc_desc:0 "斯坦尼斯瓦夫·帕夫卢奇生于1897年6月21日，维捷布斯克省利克斯纳村医生之家。1916年应征入俄军航空学校，后转入波兰军队，1919年编入第1侦察机中队参加波苏战争，历任技术军官、飞行员长及副官，1920年3月参与巴拉诺维奇及利达空袭行动，同年4月经历一次坠机幸存。1921年因涉嫌渎职指控离开波兰军队。1939年波兰保卫战期间任“克拉科夫”集团军航空参谋部作战军官，9月19日在托马舒夫-卢贝尔斯基附近被俘，关押穆尔瑙战俘营直至1945年4月获释，后留驻当地波兰军事中心。1947年6月返回波兰，此后任职于波兰航空公司及交通出版社，1984年8月20日在华沙逝世。"
 CBIO_POL_stanislaw_radkiewicz_desc:0 "拉德凯维奇生于1903年1月19日，格罗德诺省罗兹米耶尔基村农民家庭，仅完成三年级学业。1915年随家人被沙俄军队强制东迁至俄国，俄国革命期间加入共青团。1922年返回故乡，随后移居苏联，在白俄罗斯共产党波兰局工作。1925年被莫斯科秘密派回波兰负责非法波兰共产党青年部工作，1928年因“危害波兰主权独立活动”被判四年监禁，1937年再度被捕服刑半年。1938年斯大林下令解散波兰共产党并处决其大批领导人期间，他因深受斯大林信任而幸免，反被委以清算该党地下组织的任务。1944年波兰民族解放委员会（“卢布林委员会”）成立后，他受命出任公安部门负责人，1944至1954年担任波兰公安部（原“安全局”UB，后改称“公安部”MBP）部长，是战后波兰斯大林化时期国家安全机关的核心缔造者与负责人，主导了对地下抵抗组织、反对党人士及政治异见者的系统性镇压，其部门在此期间发展至逾三万名特工规模。他曾下令将对“波兰人民党”成员的“清算”行动伪装成地下抵抗组织所为，1945年春至1947年初造成至少140名该党成员遇害。1954年底因斯大林时期镇压丑闻曝光被解除公安部长职务，转任国营农场部长，1956年“波兰十月”后经“自我批评”被逐出中央委员会及党组织（三年后恢复党籍），此后未再受到任何刑事追究。1960至1968年任国家储备局局长，1968年退休。1987年12月13日在华沙逝世，享年84岁。"
 CBIO_POL_stanislaw_sosabowski_desc:0 "索萨博夫斯基生于1892年5月8日，加利西亚斯坦尼斯瓦沃夫人（今属乌克兰伊万诺-弗兰科夫斯克），铁路职工之子。青年时期投身波兰独立地下运动，1913年应征入奥匈军队，一战期间在加利西亚、斯洛伐克等地作战并两度负伤。1918年波兰独立后加入波兰军队，两战间历任多个步兵单位指挥官，1939年出任华沙“孩子们”第21步兵旅旅长，率部参加华沙保卫战。战败后经匈牙利辗转抵达法国，后转赴英国，决意将麾下部队改建为波兰军中首支伞兵部队，1942年正式组建为波兰独立伞兵旅，以“经最短的路”为非正式格言，旨在空降协助本土起义。1944年该旅奉命参加“市场花园行动”，9月21日在德里尔附近空降增援阿纳姆的英军，伤亡率接近四成，但因空投地点距目标过远而未能扭转战局。战役后英方将领布朗宁施压要求撤换其指挥权，1944年12月流亡政府在盟国压力下将其解职。战后留居英国，以零售及工厂工作维生，长期未获应有承认，直至战后数十年才逐渐获荷兰及波兰方面追授荣誉。1967年9月25日因心脏病在伦敦逝世，骨灰安葬于华沙鲍翁兹基军人公墓。"
 CBIO_POL_stanislaw_wojciechowski_desc:0 "沃伊切霍夫斯基生于1869年3月15日，卡利什人，出身没落贵族知识分子家庭。在华沙大学攻读期间投身地下学生组织，1892年因社会主义活动遭沙俄当局逮捕后流亡苏黎世、巴黎、伦敦，期间与毕苏斯基结为挚友，1892年共同参与创建波兰社会党。1899年与出身地主家庭的玛利亚结婚，1905年因政见分歧（反对将波兰独立运动与国际阶级斗争捆绑）退出波兰社会党，转而投身合作社运动，1906年返回波兰后长期从事合作社理论研究与实践。第一次世界大战期间因认为德国对波兰威胁最大而选择留在俄国，1915年迁居莫斯科，俄国革命后当选“波兰各党联合会”主席。1919年1月至1920年7月出任内政部长（历经三届内阁），参与起草波兰宪法。1922年12月纳鲁托维奇总统遇刺后，他作为各方均可接受的妥协人选，于12月20日经国民议会选举当选波兰第二任总统。任内他与军事总参谋长毕苏斯基在国家发展方向上产生分歧，主张继续议会制民主，反对毕苏斯基的威权倾向。1926年5月毕苏斯基发动政变，他拒绝了毕苏斯基要求解散维托斯政府的最后通牒，一度组织忠于政府的军队抵抗，但为避免内战及邻国乘机入侵，于5月14日辞职。此后退出政坛，任教于华沙经济学院及华沙农业大学，继续从事合作社事业。1953年4月9日在华沙近郊戈翁布基逝世。"
 CBIO_POL_stefan_frankowski_desc:0 "弗兰科夫斯基生于1887年4月3日，沃里尼亚人，1908年毕业于圣彼得堡海军候补学校，1908至1917年在俄罗斯帝国海军服役，历任“皇太子”号及“光荣”号战列舰、“阿芙乐尔”号巡洋舰航海军官，一战期间任波罗的海舰队第二战列舰旅航海军官。1919年志愿加入波兰军队，历任军事部海军处作战部门负责人、驻斯德哥尔摩武官、海事部人事培训处处长等职。1923至1925年就读巴黎法国海军军官学校并获总参谋官衔，回国后指挥格丁尼亚鱼雷艇支队，1926至1929年任托伦海军军官学校校长，1929年任海军总部参谋长直至1932年，是《海洋评论》期刊的主要创办人之一。1933年4月起出任沿海防御司令。1939年波兰战败，他率部撤往海尔半岛，与乌鲁克共同巡视全岛工事、动员军民抵抗；10月1日深夜与乌鲁克等将领共同决定投降，次日率部放下武器。此后被俘，辗转多个德军战俘营，1940年因腹痛加剧被转送德国比拉瓦医院，手术后于同年9月25日不治身亡。战后遗骸迁葬弗罗茨瓦夫波兰军人公墓，1946年9月26日追授海军少将军衔。"
 CBIO_POL_tadeusz_bielecki_desc:0 "别莱茨基生于1901年1月30日，出身教师家庭，先后就读雅盖隆大学哲学系与法律系，期间曾志愿参加波苏战争。他长期担任罗曼·德莫夫斯基的私人秘书，是民族党及“大波兰营”的核心成员，但反对更为激进的“民族激进营”（ONR）路线。1930至1935年任众议院议员，1934年起负责民族党青年部，1935年出任该党副主席，1939年6月正式当选主席。波兰战败后经法国辗转加入流亡政府的国民议会体系，长期是总理西科尔斯基对苏政策的坚定反对者，尤其反对1941年的“西科尔斯基—迈斯基协定”。战后他继续留居伦敦，担任流亡界“政治委员会”及“民族团结委员会”成员，始终未承认华沙的共产党政权。1982年2月5日凌晨在伦敦查令十字医院去世，葬礼在布朗普顿圣堂举行，后安葬于伦敦冈斯伯里公墓。"
 CBIO_POL_tadeusz_kutrzeba_desc:0 "库特兹巴生于1885年4月15日，克拉科夫人，父亲为奥地利帝国军队上尉。青年时就读维也纳附近的军事技术学院，1906年以优异成绩毕业后编入工兵部队。1939年波兰保卫战中出任波兹南集团军司令，下辖四个步兵师及两个骑兵旅，他策划并指挥了波兰保卫战中规模最大的反击行动——布祖拉河战役，联合博尔特诺夫斯基指挥的波莫瑞集团军对德军第8集团军侧翼发起反攻。战役失利后，他率残部突围抵达华沙，一度出任华沙集团军副司令，受司令罗梅尔委托与德军第8集团军谈判，并于9月28日签署华沙投降文件。此后被俘，辗转关押于霍亨施泰因、柯尼希施泰因及穆尔瑙战俘营直至1945年4月获美军解放。1945年他婉拒流亡政府提出的国防部长一职，转而主持研究1939年保卫战及西线波兰军队战史的历史委员会。因健康原因未能返回波兰，1947年1月8日因癌症在伦敦逝世，以军礼安葬于布鲁克伍德公墓，后追授维尔图蒂·米利塔里三级勋章。1957年遵其遗愿，骨灰迁葬华沙鲍翁兹基军人公墓功勋区。"
 CBIO_POL_tomislaw_lupaszko_desc:0 "齐格蒙特·申杰拉日生于1910年3月12日，出生地为斯特雷伊，出身铁路职工家庭，战前曾在波兰骑兵部队服役。第二次世界大战期间，他加入波兰家乡军，以“乌帕什卡”或“乌帕什科”为化名，指挥第5维尔纽斯旅在维尔纽斯地区和波兰东北部进行地下抵抗活动。他的部队先后同德国占领机关、苏联内务人民委员部及战后波兰共产党安全力量作战。战后申杰拉日继续从事反共游击，1948年被捕，1950年被判处死刑，1951年2月8日在华沙莫科托夫监狱被处决。1989年后，其案件在波兰被重新评价，他被追认为反共抵抗人物；但其部队在战时针对平民的暴力行动也长期存在争议。"
 CBIO_POL_vladislav_korchits_desc:0 "科尔奇茨（波兰语作瓦迪斯瓦夫·科尔奇茨）生于1893年9月1日，俄国革命期间加入布尔什维克红军一方，参加波苏战争（站在苏方阵营）。两战间毕业于苏联伏龙芝军事学院，1938至1940年大清洗期间一度遭受审查，但指控最终被撤销并官复原职。他参加了苏联卫国战争，1944年起转隶苏联扶植组建的波兰武装力量（“波兰人民军”体系），与两战间萨纳齐政权或流亡政府麾下的波兰军界人物阵营性质完全不同，而是战后波兰人民共和国军事体制的奠基者之一。1945年1月1日至1954年1月18日出任波兰人民军总参谋长，期间加入波兰统一工人党，并兼任国防部副部长（1949/1950年起）及1952至1956年议会代表。1954年退休后返回苏联定居，1966年10月17日在苏联逝世。"
 CBIO_POL_walery_slawek_desc:0 "斯瓦韦克生于1879年11月2日，出身波多利亚一个没落贵族家庭，青年时代投身波兰社会党地下武装组织，1908年参与毕苏斯基领导的别兹丹雷劫车行动，为其地下组织筹措经费。此后长期担任毕苏斯基最亲信的追随者，1928年创建“支持政府无党派集团”（BBWR）并任主席。两战间三度出任总理（1930年、1930—1931年、1935年），并参与主持1935年“四月宪法”的起草工作，主张扩大总统权力。毕苏斯基本属意由他接任领导地位，但1935年毕苏斯基逝世后，总统莫希奇茨基与雷兹-希米格维结成同盟，逐步将他排挤出权力核心。1938年6至11月短暂出任众议院议长，同年选举中失去议席。1939年4月2日晚，即毕苏斯基逝世的同一时刻，他在华沙寓所开枪自伤，经抢救无效于翌日凌晨去世，留下遗书表示不愿归咎他人。"
 CBIO_POL_wanda_wasilewska_desc:0 "瓦西勒斯加生于1905年1月25日，克拉科夫，父亲莱昂·瓦西列夫斯基是波兰社会党政治家及波兰复国后首任外交部长。在雅盖隆大学攻读波兰语言文学并获博士学位，两战间长期从事教师及左翼报刊编辑工作，加入波兰社会党，因激进左翼立场屡遭排挤。1939年德国入侵后逃往苏占利沃夫，加入苏联布尔什维克党，1940年获斯大林接见，成为苏联对波兰政策重新定位的关键人物。苏德战争爆发后随撤退辗转抵达莫斯科，以红军战地记者及政治部工作人员身份从军并获上校军衔，多次巡回东线鼓舞士气；她创作的战争小说《虹》为其赢得斯大林文学奖，并被改编为电影。1943年1月与友人联名致信莫洛托夫，促成“波兰爱国者联盟”于同年6月正式成立，她出任主席，该组织致力于在苏联境内波兰人中推动社会主义建设，并促成“塔德乌什·科希丘什科第一步兵师”的组建（后发展为苏联扶植的“波兰人民军”），同时组织救济流散于苏联各地的波兰难民及近三万名波兰孤儿。1944年任“波兰民族解放委员会”副主席之一，为该委员会及战后波兰人民共和国的建立发挥了关键作用，但此后其名字逐渐从领导层名单中淡出。战后她选择留居苏联，与乌克兰剧作家亚历山大·科尔尼丘克结为伴侣并移居基辅，此后基本退出波兰国内政坛，历任苏联最高苏维埃代表六届，但因俄语、乌克兰语能力有限，实际影响力有限。1964年7月29日在基辅逝世，安葬于拜科沃公墓。"
 CBIO_POL_wincenty_kowalski_desc:0 "科瓦尔斯基生于1892年9月11日，华沙一个普通工人家庭，先后就读华沙多所学校，后赴比利时列日理工学院攻读机械制造专业，期间加入反沙俄地下组织“武装斗争同盟”。第一次世界大战爆发后加入波兰军团，历任连长、营长，1917年“效忠危机”中因持俄国国籍遭拘禁于贝尼亚米诺沃。波兰独立后加入波兰军队，参加波乌战争及波苏战争，1922年晋升中校，1928年晋升上校，此后历任驻维尔诺、莫德林等地部队指挥官及要塞司令。1939年3月19日晋升准将，出任第一军团步兵师（“毕苏斯基师”）及以该师为核心组建的维什库夫作战集群司令。波兰保卫战中，他指挥的部队是表现较为出色的单位之一，尽管在数量和装备上处于劣势，仍持续经海乌姆一带向弗沃达瓦、卢布林、利沃夫方向撤退作战；9月18至19日在海乌姆附近与增援部队会合重组，后于托马舒夫-卢贝尔斯基战役中成功突破德军装甲部队及步兵防线，但终因弹尽粮绝，9月23日进攻塔尔纳瓦特卡受挫，负伤后于9月24日被俘。此后被关押德军战俘营直至1945年4月获美军解放，战后加入西方波兰军队，1946年退伍后定居伦敦继而移居纽约，长期活跃于波兰侨界组织，曾任波兰战斗人员协会主席、约瑟夫·毕苏斯基研究所及“波兰兄弟互助会”负责人。1984年11月29日在美国伊利诺伊州河林逝世，遵遗愿于1986年将骨灰安葬在其部队阵亡将士长眠的卡武申战争公墓。"
 CBIO_POL_wincenty_witos_desc:0 "维托斯生于1874年1月21日（一说22日），加利西亚维日霍斯瓦维采村贫苦农民家庭。18岁投身农民运动，1895年加入“人民党”，1908至1914年任加利西亚议会议员，1911年起兼任维也纳帝国议会议员。1914年农民运动分裂后，他创立“波兰人民党“皮亚斯特””并任党魁直至1931年。第一次世界大战期间与波兰独立运动保持联系，1918年出任“波兰清算委员会”主席。1920年7月，在波苏战争最危急关头受命组建全国团结联合政府并出任总理，呼吁全国动员抗敌，任职至1921年9月；1923年5月至12月第二次出任总理；1926年5月组建第三届内阁，数日后即遭毕苏斯基“五月政变”推翻。此后他坚持反对派立场，1929年联合多党组建“中左联盟”要求恢复宪政，1930年在布列斯特审判前夕遭当局逮捕入狱，1932年再度被判刑（该判决直至2023年才被波兰最高法院撤销平反）。为避免再次被捕，1933年流亡捷克斯洛伐克，在侨界被尊为“农民的救世主”。1939年返回波兰后旋即遭德国占领当局逮捕，1941年因健康恶化获准软禁于原籍村庄，1944年拒绝德占当局要求其发表反苏声明的要求。1945年出任战后“全国国民会议”副主席之一，同年10月30日在克拉科夫逝世。"
 CBIO_POL_witold_pilecki_desc:0 "皮莱茨基生于1901年5月13日，俄罗斯卡累利阿奥洛涅茨镇，家族因参与1863年一月起义遭沙俄流放至此，属波兰贵族“莱利瓦”纹章世家。1910年随家迁居维尔诺，少年时加入地下波兰童子军组织，1918年参加维尔诺地区自卫队。波苏战争期间（1919—1921）在骑兵部队服役。战后定居利达经营家族农场，1931年与当地女教师玛丽亚·奥斯特罗夫斯卡结婚，育有两子女，业余从事绘画与诗歌创作。1939年8月应征入伍参加波兰保卫战，战败后转赴华沙加入地下抵抗，创建“秘密波兰军”（后并入国家军）。1940年，波兰地下军获悉多名被押往奥斯维辛的政治犯“死亡”通知后心生怀疑，皮莱茨基自愿在华沙一次围捕行动中故意让德军将自己逮捕，1940年9月21至22日夜被押往奥斯维辛集中营，编号4859，在营内潜伏近两年半，秘密组建地下抵抗网络，持续向华沙地下军总部及流亡政府传递集中营内部情报（包括大屠杀相关信息），成为最早向盟国揭露纳粹种族灭绝暴行的一手情报来源之一。1943年4月，眼见盟军无意营救，他与另两名囚犯成功越狱逃出集中营。1944年8月华沙起义爆发后，他志愿以普通士兵身份加入“华沙人”连队作战，起义军官阵亡后公开身份接掌指挥，战败后被俘成为德军战俘直至1945年美军解放。此后加入意大利境内波兰第二军团，1945年10月返回波兰从事地下情报工作，为伦敦流亡政府搜集苏联占领当局情报。1947年5月被波兰公安部逮捕，历经酷刑审讯及不公正审判，1948年3月被判处死刑，总统比鲁特拒绝赦免，1948年5月25日在华沙莫科图夫监狱遭处决，时年47岁，遗体下落至今不明。1990年波兰剧变后获平反昭雪，1995年追授“波兰复兴勋章”，2006年追授波兰最高荣誉“白鹰勋章”。"
 CBIO_POL_wladyslaw_anders_desc:0 "安德斯生于1892年8月11日，华沙以西克罗希涅维采-布沃涅村，家族为波罗的海德意志裔，已波兰化数代，受洗为新教徒（二战期间改信天主教）。青年时就读里加理工学院，第一次世界大战期间在沙俄军队骑兵团服役，三次负伤，获俄罗斯帝国最高军事勋章圣乔治勋章。波兰独立后加入波兰军队，参与1919年大波兰起义任参谋长，波苏战争期间指挥波兹南第15枪骑兵团，因战功获颁维尔图蒂·米利塔里勋章。1926年政变中支持政府一方反对毕苏斯基。1939年9月指挥诺沃格鲁德卡骑兵旅参战，负伤被俘，遭苏联关押于莫斯科卢比扬卡监狱。1941年苏德战争爆发后，依据《西科尔斯基—迈斯基协定》获释，受命组建由波兰战俘及流放者组成的军队（“安德斯军”），因苏方物资短缺及政治摩擦，1942年经协议将部队及大批平民经伊朗撤至中东，并入英军指挥体系，后扩编为波兰第二军团。1944年率部参加意大利战役，5月18日攻克卡西诺山，7月攻占安科纳，此后参与突破“哥特防线”及春季总攻。雅尔塔会议后对盟国出卖波兰东部领土表示强烈抗议。1945年2月起兼任流亡武装力量总司令直至6月。战后拒绝返回苏联控制下的波兰，1946年遭波兰共产党政权剥夺国籍及军衔，留居英国出任流亡武装力量总监，并投身多项侨界慈善及互助事业，1949年出版回忆录《流亡的军队》。1970年5月12日在伦敦逝世，遵其遗愿安葬于意大利卡西诺山波兰军人公墓，与麾下阵亡将士长眠一处；1989年波兰后共产主义政府成立后，其国籍及军衔获追认恢复。"
 CBIO_POL_wladyslaw_bortnowski_desc:0 "博尔特诺夫斯基生于1891年11月12日，拉多姆人，曾在日托米尔完成中学教育后入读莫斯科大学医学系，一年后转入克拉科夫雅盖隆大学继续攻读医学。1908年加入“武装斗争同盟”，1912年加入“射击协会”并接受军官训练，一战爆发后加入波兰军团。波兰独立后参加波乌战争及波苏战争，1924年晋升上校，1932年晋升准将。1935年10月起任托伦地区武装力量总监，1938年秋指挥“西里西亚”独立作战集群，在慕尼黑协定后占领捷克斯洛伐克切欣地区，声望一度高涨，曾被考虑作为雷兹-希米格维的接班人选。1939年3月晋升师级将军并出任波莫瑞集团军司令，是参战波兰各集团军中最北翼的一支。波兰保卫战初期其部队因奉命坚守“波兰走廊”而遭德军两面夹击，在图霍拉森林战役中损失惨重；9月9日起其部队并入库特兹巴指挥的布祖拉河反击战，在沃维奇、索哈切夫一带作战。9月14日奉命撤至布祖拉河北岸，9月21日负伤被俘，此后辗转多个德军战俘营直至1945年获美军解放。战后留居西方，先在英国参与创建伦敦约瑟夫·毕苏斯基研究所，1954年移居美国，1961至1962年出任该研究所美国分部主席。1966年11月21日在纽约格伦科夫逝世。"
 CBIO_POL_wladyslaw_gomulka_desc:0 "哥穆尔卡生于1905年2月6日，加利西亚克罗斯诺近郊比亚沃布热吉-弗兰齐什坎斯基村贫苦家庭，14岁起当水管工学徒，青年时投身工会及左翼运动，1926年加入地下波兰共产党。两战间历经毕苏斯基政权及地方当局多次监禁。1939年德苏入侵波兰后一度被苏方拘押于利沃夫后获释，此后在被占领的华沙投身地下抵抗，1943年出任重建后的波兰工人党总书记，参与创建“国家全国委员会”。1945年1月至1948年出任波兰事实上的领导人，兼任副总理，但因反对强制农业集体化、对共产国际情报局持怀疑态度、主张“波兰特色社会主义道路”而与莫斯科扶植的比鲁特一派发生激烈冲突。1948年在斯大林授意下被以“右倾民族主义偏向”罪名撤销总书记职务，1949年被解除一切职务并开除党籍，1951至1954年遭监禁近四年。1956年比鲁特去世、苏共二十大启动去斯大林化后，他获平反并于同年10月重掌党的第一书记职务，主导“波兰十月”改革，结束强制集体化、缓和对天主教会的迫害，赢得广泛支持，实为1956至1970年波兰实际最高领导人。执政后期趋于保守僵化，1968年支持华沙条约组织出兵镇压捷克斯洛伐克“布拉格之春”，同年纵容“反犹太复国主义”排犹运动。1970年12月签署波兰—西德条约，促成西德承认奥德河—尼斯河战后边界，但同月因物价上涨引发波罗的海沿岸工人流血冲突事件，被迫辞职下野，由爱德华·盖莱克接掌党的领导权。1982年9月1日在华沙因癌症逝世。"
 CBIO_POL_wladyslaw_kalkus_desc:0 "1918年11月起以连长身份参加利沃夫保卫战（波乌战争），1919年转入克拉科夫飞行学校学习，1920年以上尉军衔参加波苏战争，历任多个侦察机中队飞行员及指挥官。两战间历任团级、旅级航空指挥官，1929年起任波兹南第3航空团团长，1933年调任华沙第1航空团团长，1934年晋升上校，1935年出任第3航空大队司令，1938年参与切欣行动期间统筹“西里西亚”独立作战集群所属空军。1939年3月19日晋升准将并代理军事部航空司令直至波兰战败。战败后经罗马尼亚辗转法国，1939年10月至1940年3月出任法国境内波兰空军总负责人，此后短暂在英国任类似职务，4至8月任波兰空军驻皇家空军督察，此后历任布拉姆科特第18作战训练部队指挥官及布莱克浦波兰空军基地波方指挥官，战争期间一度被拘留于比特岛罗西赛拘留营。1945年2月23日在英国布莱克浦逝世。"
 CBIO_POL_wladyslaw_raczkiewicz_desc:0 "拉茨基维茨生于1885年1月28日，格鲁吉亚库塔伊西（时属俄罗斯帝国），波兰裔法官之子。在圣彼得堡求学期间加入波兰青年组织，后于多帕特大学攻读法律，毕业后在明斯克执业律师。第一次世界大战期间在俄军服役，俄国革命后投身波兰独立事业，曾主持“最高波兰军事委员会”，协助在俄境内组建波兰第一军。两战间曾任内政部长、克拉科夫省长（1935年）及波莫瑞省长（1936—1939年）。1939年波兰战败后经安热逃往法国，1939年9月30日依宪法程序就任流亡波兰总统，1940年6月法国沦陷前转往伦敦，与总理西科尔斯基、米科拉伊奇克共同主持流亡政府运作，是《西科尔斯基—迈斯基协定》的反对者。1945年2月雅尔塔会议后，盟国撤销对流亡政府的承认，转而承认苏联扶植的华沙政权，但拉茨基维茨在西方侨界仍被视为合法波兰元首直至1947年6月6日在威尔士鲁辛镇逝世。安葬于英国纽瓦克-昂-特伦特公墓，2022年11月其遗骸与另外两位流亡总统一同迁葬华沙“天主圣意”神殿流亡总统陵墓。"
 CBIO_POL_wladyslaw_sikorski_desc:0 "西科尔斯基生于1881年5月20日，加利西亚图舒夫-纳罗多维村，战前投身多个争取波兰独立的秘密组织，与毕苏斯基一同参与创建“武装斗争同盟”。第一次世界大战期间任波兰军团战争专员，后于波苏战争中崭露头角，1920年指挥波兰第五集团军，在华沙战役决定性阶段发挥重要作用。1921年出任总参谋长，1922至1923年短暂出任总理，1923至1924年任军事部长期间主持军队现代化。1926年毕苏斯基政变中保持中立，1928年因遭解除军职转而加入反毕苏斯基阵营。1939年波兰战败后经罗马尼亚辗转抵达法国，9月30日出任流亡政府总理，11月7日接替雷兹-希米格维出任武装力量总司令兼总监，并兼任军事部长，集军政大权于一身。法国沦陷后率政府及部分部队撤往伦敦，1940年8月与英国签署波英军事协定，着手重建流亡波兰军队。1941年与苏联大使迈斯基谈判恢复波苏外交关系，促成《西科尔斯基—迈斯基协定》，推动安德斯获释组建军队。1943年4月苏联借口卡廷惨案调查要求与波兰断交，双方关系急剧恶化。同年5月起赴中东视察波兰部队，7月4日返程途中，其“解放者”式飞机于直布罗陀起飞16秒后坠海，西科尔斯基与其女儿、参谋长克利梅茨基等11人罹难，仅飞行员一人生还；事故原因官方认定为升降舵卡死导致失控，但具体成因及是否涉及蓄意破坏，历史学界至今存在争议，相关英国官方档案封存至2050年。"
 CBIO_POL_wojtek_desc:0 "沃伊泰克是二战期间随波兰第二军团服役的叙利亚棕熊。1942年，波兰“安德斯军”自苏联撤往伊朗途中收养了这只幼熊，后由第22炮兵补给连饲养，随部队辗转伊拉克、巴勒斯坦、埃及。1944年该连赴意大利作战时，英方运输规定禁止携带宠物，波兰军方遂将沃伊泰克正式登记为士兵，使其得以随部队登船。卡西诺山战役期间，它因协助搬运炮弹箱而成为部队象征，第22炮兵补给连后来采用“背负炮弹的熊”作为徽章。战后沃伊泰克随部队至苏格兰，1947年移交爱丁堡动物园，1963年12月2日去世。"
 CBIO_POL_xawery_czernicki_desc:0 "希斯基生于1882年10月16日，维尔纽斯省奥斯米亚纳县基德伊基村贵族家庭，1901年毕业于当地中学后入读喀琅施塔得帝国海军工程学校，1905年毕业于造船系并以海军候补少尉军衔加入俄罗斯海军。此后历任圣彼得堡海军基地工程师、结雷茨克小型船厂负责人（1910年起，期间设计多艘河用重炮舰）、“塞瓦斯托波尔”级战列舰副总工程师及总工程师，1913年晋升上尉，一战期间任雷瓦尔（今塔林）海军船厂船体总设计师，1917年晋升海军中校，1918年退役。1919年返回波兰志愿加入波兰海军，任维斯瓦河区舰队技术处处长，波苏战争期间任莫德林要塞内河海军基地司令。1925年起主持格丁尼亚海军基地建设监督委员会，1926年起兼任多艘舰艇建造监督委员会主席。1932年晋升海军上校后返回波兰，出任海军总部勤务处处长兼副总监，1938年晋升海军少将。1939年波兰战败后，他随海军总部从格丁尼亚撤往华沙，继而东撤至平斯克、布罗迪地区，在杰拉日内村遭苏联红军截获；转往罗夫诺后被内务人民委员部逮捕，辗转塔利察后转押科泽尔斯克战俘营。1940年春，他与其他波兰军官一同遭苏联内务人民委员部秘密处决，时年57岁，是震惊世界的“卡廷惨案”遇难者之一，也是此次惨案中唯一遇害的波兰海军将官。1989年苏联解体前后真相逐渐公开，他后来成为波兰海军的精神主保人物之一。"
 CBIO_POL_zdzislaw_lubomirski_desc:0 "卢博米尔斯基生于1865年4月4日，俄罗斯下诺夫哥罗德（其父母因一月起义受牵连遭流放至此），出身卢博米尔斯基公爵世家。为使儿子在波兰精神熏陶下成长，父母将其送往加利西亚克拉科夫圣安娜中学就读，后于雅盖隆大学及格拉茨大学攻读法律，1887年获学位。1893年迁居华沙，凭借慈善事业成为知名公众人物，历任华沙慈善协会副会长、会长及眼科研究所监理。第一次世界大战爆发后主持“华沙市民委员会”，1915年8月德军占领华沙后经德方认可继续出任华沙市长（1916—1917），同时兼任“中央公民委员会”主席，推动波兰语学校体系建设。1917年9月起出任“摄政议会”三摄政之一，与大主教卡科夫斯基、约瑟夫·奥斯特罗夫斯基共同构成波兰王国过渡时期最高权力机构；他是三摄政中最为活跃的一位，推动解散“临时国务会议”、发布波兰独立宣言（1918年10月7日），并于同年11月10日在华沙车站迎接刚获释的毕苏斯基，先后向其移交军事及政治权力。1918年后一度淡出政坛，1926年政变期间出任毕苏斯基与政府间的调解人；1928至1935年任参议员，1931至1935年兼任“地主组织理事会”主席。1930年因抗议布列斯特审判提出辞去参议员职务未获批准。1939年华沙保卫战期间参与市民委员会工作，此后投身地下抵抗活动。1942年11月10日遭盖世太保逮捕，在帕维亚克监狱关押两个月并遭受严酷审讯，获释后因伤病及肺结核缠身未能康复，1943年7月31日在自家庄园马瓦维希逝世。"
 CBIO_POL_zygmunt_buhusz_szysko_desc:0 "第一次世界大战期间在沙俄军队服役。两战间长期在波兰军队中任团级军官，1938年出任波兰第1步兵师师长，1939年改任第16步兵师师长。波兰战败后撤离国境，1940年出任在英国组建的波兰独立高地旅旅长，率部参加挪威纳尔维克战役，该旅一度成功夺取安克内斯半岛。1941至1943年间他被派往苏联，先后出任驻莫斯科波兰军事使团团长及东线波兰部队参谋长，亲历安德斯军的组建与撤离过程。1943至1945年出任波兰第二军团副司令，协助安德斯指挥卡西诺山战役及博洛尼亚战役等意大利战场作战。战后留居英国，1976至1980年出任流亡武装力量总监。1982年6月在伦敦逝世，享年89岁。"
 CBIO_SIA_aditya_dibabha_desc:0 "阿提贴·阿帕生于1900年7月27日，阿帕卡拉·基亚提翁亲王（朱拉隆功五世第四十一子、暹罗海军现代化重要推手）之子。早年任教师，讲授法国大革命史，1934年将卢梭著作译为泰文出版，收录于朱拉隆功大学文学院教材《法国大革命时代》。虽出身宗室，却是1932年立宪革命的支持者，倾向英式君主立宪而非法式共和体制。1933年博沃拉德叛乱期间协助政府平叛有功获奖。1935年拉玛七世逊位、年幼的拉玛八世继位后，他出任摄政委员会主席直至1944年，是绝对君主制终结后暹罗过渡时期的关键权力人物之一；任内与銮披汶军政府关系一度紧张，1943年获晋升陆军中将、海军中将、空军中将三军同衔。1942年1月銮披汶政府对英美宣战诏书亦因其拒绝签署而在法理上存在瑕疵。1946年5月19日因癌症在曼谷逝世，享年45岁。"
 CBIO_SIA_adul_aduldejajaras_desc:0 "阿杜·阿杜德差叻生于1894年6月28日，本名“巴特·平帕拉孔”，1932年立宪革命“人民党”成员之一，人称“锐目将军”。革命后由陆军转入警界，1933年出任副警察总监，1936年升任警察总监，执掌暹罗警政长达十二年之久，是銮披汶政权时期令人畏惧的强力执法者，与军方长期存在权力角力。二战期间他表面效忠銮披汶，暗中却与“自由泰运动”保持秘密联系，战争末期一度出面协助该运动。1945年社尼·巴莫组阁后，他出任副总理兼公共卫生部长，同年卸任警察总监，转而于1946年6月受比里·帕侬荣委任出任陆军总司令直至1947年11月銮披汶集团政变。政变前夕他一度试图调兵抵制军事政变，后经协商妥协作罢。战后曾任枢密顾问，1969年12月17日逝世，享年75岁。"
 CBIO_SIA_ananda_mahidol_desc:0 "阿南塔·玛希敦生于1925年9月20日，德国海德堡（其父母时在当地留学），马希敦亲王（朱拉隆功五世之子）与桑万夫人之长子，是首位在境外出生的暹罗王室成员。四岁丧父后随母移居瑞士洛桑。1935年3月拉玛七世逊位且未指定继承人，依王位继承法由年仅9岁的他继位为拉玛八世，因年幼且长期在瑞士就学，由摄政委员会代行王权。1938年曾短暂回国两月旋即返欧。1941年12月日军登陆暹罗后，他滞留瑞士未归，比里·帕侬荣代行摄政并暗中拒绝在对英美宣战书上签字，使暹罗对英美宣战在法理上存在瑕疵。1945年12月获洛桑大学法学学位后返回暹罗，次年6月计划再赴瑞士攻读博士学位。1946年6月9日凌晨，即预定启程返欧前四天，他被发现头部中弹身亡于大皇宫波隆宾曼宫寝宫内，官方最终认定并非意外而属他杀，但真凶至今未明，三名王室侍从其后被判处死刑并于1955年执行，连当时继位的九世王普密蓬本人后来也表示不相信三人有罪。此案至今仍是泰国现代史上讳莫如深的悬案，其弟普密蓬·阿杜德（拉玛九世）随即继位。"
 CBIO_SIA_bowardej_desc:0 "博沃拉德亲王生于1877年4月2日，曼谷，蒙固王（拉玛四世）之孙、纳雷特亲王之子。早年就读英国哈罗公学及伍尔维奇皇家军事学院，1900年返暹罗任职陆军统帅参谋部，1902至1905年出任驻巴黎大使，此后长期历任国防大臣等要职，绝对君主制末期地位显赫。1932年立宪革命前夕曾拒绝直接参与政变筹划，革命后未获“人民党”重用，转而对政局日益不满，尤其反感新政府允许民众对国王提起诉讼一事，加之对1933年披耶帕凤政变推翻保守派总理玛诺巴功心怀怨愤。1933年10月，他联合陆军上校披耶·西迪颂堪等人在呵叻集结军队，以“国家救亡团”名义于10月11日发动叛乱（史称“博沃拉德叛乱”），率部一度逼近曼谷占领廊曼机场，要求政府立即辞职，但未获海军及大部分驻曼谷部队响应。经銮披汶指挥政府军反击，叛军至10月下旬溃散，他于10月25日携妻乘机逃往法属印度支那，此后在柬埔寨避难长达十五年，直至1948年获准返回泰国并授予陆军上将衔，1953年11月16日在泰国逝世，享年76岁。"
 CBIO_SIA_chamkat_phalangkun_desc:0 "猜姆卡·帕朗恭（本名“查甘·帕朗恭”）生于1914年10月30日，曼谷，父为著名教育官员帕耶·帕敦·维塔森。早年就读曼谷佛统寺学校及帖沙林中学，考入朱拉隆功大学文学院后获政府奖学金赴英国留学，1938年获牛津大学贝利奥尔学院哲学、政治学与经济学专业荣誉学位。归国后任职教育部，因政治立场与当权者相左遭免职，转而组建“救国团”团结民主派人士。日军入侵暹罗后，他成为国内“自由泰运动”核心成员并出任秘书长。1943年2月受比里·帕侬荣委派，作为该运动全权代表秘密前往中国重庆，向盟军通报暹罗境内存在反日地下抵抗力量，并成功促成中国政府（继而美国）率先承认该运动、间接促使英国放弃战后将暹罗降格为受保护国的构想，为战后暹罗避免以“战败国”身份被处置作出关键贡献。他在重庆期间曾与蒋介石会面，并通过驻英自由泰领袖社尼·巴莫了解英方态度。1943年10月7日在重庆病逝，加拿大随行医生诊断为肝癌及胃癌，但英美情报人员及其传记作者均对死因存疑，怀疑系遭日方特工投毒所致，年仅28岁。"
 CBIO_SIA_chao_phonphayuhasena_desc:0 "披耶帕凤·丰派育哈色纳生于1887年3月29日，曼谷，本名朴·帕凤裕庭，父为潮州华裔上校吉姆，母为泰-孟裔。早年就读朱拉隆功皇家陆军官校，1903年获王室奖学金赴德意志普鲁士主要军官候补学校深造（据传与后来的纳粹元帅戈林同窗），继而转赴丹麦哥本哈根工程学院，因奖学金中断仅完成一年学业，1912年返暹罗。1931年获拉玛七世授“披耶帕凤·丰派育哈色纳”衔，1932年出任暹罗陆军总司令，是策划1932年立宪革命的“四剑客”核心成员之一、革命当日宣读《暹罗新国家宣言》之人，革命后被视为“人民党”资深领袖。1933年3月，总理玛诺巴功以“黄皮书”经济计划争议为由将他逐出内阁并中止宪法，他遂于6月20日发动不流血政变推翻玛诺巴功，次日自任第二任总理直至1938年，任内经历1933年10月博沃拉德叛乱等多次政局动荡，依靠个人威望及銮披汶等亲信军官维系统治。1938年因王室地产贱卖丑闻及国会选举失利被迫辞职，銮披汶继任总理。此后退出政坛，二战期间出任武装力量总监。1947年2月14日因脑出血在曼谷逝世，享年59岁，据传身后家人一度因经济拮据无力操办丧事，后由銮披汶出面协助安排。"
 CBIO_SIA_chao_phraya_sri_dharmathibhet_desc:0 "西·探玛提贝即“昭披耶·西·探玛提贝”（本名吉特·纳颂卡拉），生于1885年10月30日，宋卡府人，出身当地世家，家族历任宋卡地方长官。早年留学英国修习法律，1911年拉玛六世朝返国，历任民事法院法官等职，因才干出众迅速晋升，先后获封“銮·金达披隆”“帕·金达披隆·拉查萨帕波迪”“披耶·金达披隆·拉查萨帕波迪”，1931年拉玛七世特授其“昭披耶·西·探玛提贝”衔（食邑万莱），是暹罗历史上末代获封“昭披耶”（最高等级贵族衔）之人，此后该衔位随立宪革命而废止未再册封。1932年立宪革命后，他历任司法、外交、卫生、财政等多个内阁部长职务（历经披耶帕凤、銮披汶、宽·阿派旺等多届政府），并于1934年当选国会第四任议长。战后1946年他创办泰国人寿保险公司并任首任董事长，是首家由泰国人自主创立经营的人寿保险公司。此后长期出任九世王普密蓬枢密顾问，一度出任枢密院院长，官宦生涯横跨五朝、历时逾七十二年。1976年9月25日逝世，享年90岁零11个月。"
 CBIO_SIA_charun_rattanakun_seriroengrit_desc:0 "差伦·拉达那恭·社里龙里生于1895年10月27日，曼谷，惯称封号“銮·社里龙里”。1904年入伍，1932年立宪革命“人民党”元老成员之一。1938年晋升上校，在銮披汶政府中出任要职，历任国营铁路局局长、多个内阁部长（无任所部长、1939年商务部次长、1941年国防部次长）。1940至1941年法泰战争结束后，1942年2月晋升中将，出任“帕耶普军团”（西北军团）总司令，率部参与日军缅甸战役并占领掸邦部分地区直至1945年战争结束。1942年5月起转任政界，1942年3至9月出任商务部长，此后至1944年出任交通部长。1944年銮披汶下台后一度以“战犯”罪名被捕，1946年3月获释，此后出任国营贸易公司董事及1946年5月起出任参议员直至1951年。1947年他参与推翻文人政府、助銮披汶重掌政权的政变。其子迎娶九世王胞姊甘拉雅妮公主。1983年7月19日在曼谷逝世，享年87岁。"
 CBIO_SIA_damrong_rajanubhab_desc:0 "丹隆·拉差努帕生于1862年6月21日，蒙固王（拉玛四世）之子，朱拉隆功国王（拉玛五世）异母弟。早年历任近卫军团统领、教育大臣，1892年出任暹罗史上首任内政大臣直至1915年，主持全面改革地方行政体系，创设“猜”（府）辖区制度并推行官员任命薪俸化，是暹罗近代行政、教育体系的主要奠基人。卸任后转向自学成才的史学研究，1925年出任暹罗艺文学会首任会长，推动创建国家图书馆与国家博物馆，被誉为“泰国近代史学之父”，1929年拉玛七世特授予其“丹隆·拉差努帕亲王”尊号。1932年立宪革命后，作为绝对君主制的重要拥护者遭“人民党”排挤，同年流亡英属槟城，1942年局势变化后获准返回曼谷，翌年12月1日在曼谷家中（原瓦拉迪宫）逝世。1962年获联合国教科文组织追授“世界杰出人物”称号，是首位获此殊荣的泰国人。"
 CBIO_SIA_dhani_nivat_desc:0 "达尼·尼瓦生于1885年11月7日，本名丹尼尼瓦·索纳古，1922年获封亲王衔“达尼·尼瓦亲王”。拉玛七世朝出任教育大臣（1926年起），1932年立宪革命后连同其他宗室成员一并被“人民党”逐出政府，此后转向学术研究，长期担任暹罗学会会长逾二十年，以泰国历史、宗教及文化研究著称。战后于1950年起出任九世王普密蓬的枢密顾问，先后三次代行摄政（1951年3月至1952年国王返国期间，以及1963年国王两次出访期间），并长期担任枢密院院长直至晚年。1974年9月8日在曼谷逝世，享年88岁。"
 CBIO_SIA_direk_jayanama_desc:0 "里绿·猜耶南生于1905年1月18日，1932年立宪革命文官派成员之一，与比里·帕侬荣关系密切。1933年加入外交界，1938至1941年历任副外长、外交部长，1941年12月日军登陆暹罗时在任，因反对銮披汶政府对日结盟而辞职，1942年在銮披汶压力下改任驻日大使，得以近距离观察泰日关系内情，1943年7月因健康原因返国。此后深度参与“自由泰运动”地下抵抗活动，1943年底至1944年8月再度出任外交部长直至退出公职专注抵抗事业。战后历任司法、财政、外交部长及副总理等职，1946至1947年再度出任外长，1947年后转任驻英、驻联邦德国、驻芬兰大使。1949年创立法政大学政治学院并任首任院长（1949—1952），此后长期执教并撰写外交事务著作，其回忆录《泰国与二战》是研究该国1938至1948年外交、军事、经济史的重要一手史料。1967年5月1日在曼谷逝世，享年62岁。"
 CBIO_SIA_jira_wichitsongkhram_desc:0 "生于1897年10月4日，1932年立宪革命“人民党”元老成员之一，历任陆军要职，晋升中将后曾婉拒晋升元帅殊荣。"
 CBIO_SIA_josiah_crosby_desc:0 "約西亚·克罗斯比生于1880年5月25日，英国康沃尔郡法尔茅斯，船长之子。剑桥大学冈维尔与凯斯学院毕业，1902年获现代语言荣誉学位一等成绩。1904年加入英国领事界，早年即在暹罗任职多年，1917年调任驻西贡领事，1919至1920年代理驻曼谷总领事，此后历任驻西贡、巴达维亚总领事。1931年出任驻巴拿马及哥斯达黎加公使，1934年调任英国驻暹罗公使直至1941年退休，是1930年代暹罗与英国关系的关键中间人，1941年12月日军入侵暹罗前后，他与暹罗政府及美国方面均保持密切沟通，试图斡旋避免战事扩大，但未能阻止銮披汶政府倒向日本。日军占领期间他一度遭日方拘押扣留，后获释遣返回国并退休。著有回忆暹罗政局的著作，是研究1930年代末暹罗外交史的重要史料来源。1958年12月4日逝世，享年78岁。"
 CBIO_SIA_kuang_abhayavongsa_desc:0 "宽·阿派旺生于1902年5月17日，柬埔寨马德望（时属暹罗管辖的柏当省），暹罗籍柬埔寨裔贵族世家，父为暹罗籍马德望总督昭披耶·阿派普贝。早年就读代实林学校及易三仓学校，赴法国里昂中央理工学院攻读土木工程，归国后任职电信局并升任局长，获封“銮·柯维·阿派旺”衔。1932年立宪革命中作为文官派成员参与，此后在披耶帕凤及銮披汶内阁出任无任所部长，二战期间以少校军衔加入国王卫队，1941年法泰战争后率团接管柬埔寨马德望地区，此后出任商务通信部长。1944年7月銮披汶辞职后，他被国会推举出任总理（1944年8月至1945年8月），任内表面配合日方、暗中庇护“自由泰运动”地下工作，并成功废除銮披汶的“武装力量最高统帅”职位。日本投降后他辞职让位于自由泰阵营组阁，1946年创立民主党并任首任党魁，同年1至3月二度出任总理，1947年11月政变后三度出任总理直至1948年4月被军方逼迫辞职，此后长期担任反对党领袖直至1958年政党遭禁。1968年3月15日在曼谷逝世，享年65岁。"
 CBIO_SIA_luang_chawengsaksongkhram_desc:0 "銮·差勇萨颂堪生于1899年3月10日，本名庄·宽绰。1932年暹罗立宪革命发起时，他以陆军上尉身份加入“人民党”密谋核心，是参与政变的最早一批成员之一。此后他历任政府要职，晋升陆军上将，并曾出任公共卫生部长、农业部长等内阁职务。1962年3月9日逝世，享年62岁。"
 CBIO_SIA_luang_haansongkhram_desc:0 "銮·汉颂堪本名披猜·汉颂堪，生于1896年。最高军衔为陆军上将。1968年逝世，享年约72岁。"
 CBIO_SIA_luang_phibunsongkhram_desc:0 "銮披汶·颂堪生于1897年7月14日，暖武里府一户榴莲种植农家，祖父为广东移民后裔。早年就读佛寺学堂，后入朱拉隆功皇家陆军官校，1914年毕业授炮兵少尉衔，一战后赴法国炮兵应用学校深造，期间结识比里·帕侬荣，共同萌生推翻绝对君主制的构想。1928年获拉玛七世授“銮”衔封号“銮披汶·颂堪”，此后即以此为姓氏沿用终身。1932年6月24日政变中作为“人民党”军人派核心骨干之一发挥关键作用，1933年协助平定博沃拉德叛乱，1934年出任国防大臣，1938年12月出任总理并兼陆军总司令，开始其长达十余年的军政强人统治。任内大力推行泛泰民族主义文化改造，1939年将国号由“暹罗”改为“泰国”，发布一系列“文化敕令”强制推行西式着装、致敬国旗等国民生活准则。1940至1941年发动法泰战争夺回被法国占据的领土，1941年12月日军登陆后被迫允许日军过境，1942年1月对英美宣战（驻美大使拒绝递交宣战书使其法理无效），后因战局恶化于1944年7月辞职，战后一度因“战犯”罪名遭起诉但获释。1948年4月借政变重新出任总理直至1957年，任内转向坚定反共立场并与美国结盟，历经多次未遂政变（包括1949年“王宫叛乱”及1951年“曼哈顿号事件”）。1957年9月被部下沙立·他那叻发动政变推翻，被迫流亡日本，1964年6月11日因心脏衰竭病逝于日本神奈川县相模原市。"
 CBIO_SIA_luang_sinthusongkhramchai_desc:0 "辛徒·甲玛叻那温生于1901年6月23日，本名“辛徒·甲玛叻那温”，惯称封号“銮·信突颂堪猜”。毕业于宽古拉威塔雅莱学校，获政府奖学金赴丹麦深造海军技术。1928年在巴黎结识“人民党”筹建者，受他威·蓬雅盖邀请加入并出任海军派领袖。1932年立宪革命后历任多项内阁职务、海军总司令（1934年及1938至1951年），任内力主海军现代化，主持引进暹罗史上首批潜艇。1951年6月“曼哈顿号事件”（海军兵变劫持总理銮披汶未遂）爆发后，他虽未直接参与叛乱，仍遭撤销海军总司令职务并以“叛国罪”判处监禁三年。出狱后淡出政坛，1952年他曾发起兴建曼谷吞武里区海军医院（今“帕蓬克劳亲王医院”）。1976年5月14日逝世，享年74岁。"
 CBIO_SIA_luang_subhachalasai_desc:0 "銮·苏帕查拉赛本名“崩·苏帕查拉赛”，生于1895年1月22日，曼谷，早年入读暹罗皇家海军官校，1932年立宪革命时以海军少校军衔加入“人民党”海军派，是当时最资深的海军军官（时年37岁），协助策划海军方面行动，革命当日率部切断皇家码头一带电话电报线路并集结武器弹药支援政变行动。革命成功后，他奉命亲率暹罗号军舰前往华欣远镇宫，向国王呈递邀请拉玛七世返京出任立宪君主的信函，是该次历史性邀约的直接执行者。此后他历任副海军总司令，1934年获任首任体育厅厅长，主持修建暹罗国家体育场（今“苏帕查拉赛体育场”，1942年为纪念他而更名），被誉为“泰国体育之父”。1942至1944年间兼任教育部次长及内政部长。他曾迎娶朱拉隆功五世之子朱蓬亲王之女。1965年10月26日因肝病在朱拉隆功医院逝世，享年70岁。"
 CBIO_SIA_luang_wichitwathakan_desc:0 "銮·威集瓦他干生于1898年8月11日，乌泰他尼府一华裔商人之子，本名“金良”。早年在佛寺学堂接受教育，因佛学造诣优异获拉玛六世颁发全国第一名证书，1921至1927年留学巴黎，其间与法国妻子结婚（1933年离异）。归国后结识“人民党”密谋成员，虽受邀参与1932年革命筹划但因忠于拉玛七世一度持保留态度，直至1933年博沃拉德叛乱期间国王暗中默许保皇派武装反扑后，他才彻底转向支持“人民党”。此后成为銮披汶政权的首席意识形态设计师及宣传部长，主导缔造銮披汶个人崇拜，1939年主持将国号由“暹罗”改为“泰国”的国会委员会，并鼓吹“大泰族”扩张主义、以法国远东学院地图为据宣称南中国及中南半岛存在六千万“泰族”人口。1938年演讲中曾将暹罗境内潮州华人比作纳粹德国治下的犹太人。战后与銮披汶一同以“战犯”罪名被盟军拘押，因证据不足获释。1947年协助銮披汶发动政变后出任财政、经济事务部长，后历任驻印度、瑞士、奥地利、南斯拉夫大使，创作多部宣扬民族团结的爱国主义戏剧（“安努帕系列”）。1958年参与沙立·他那叻推翻銮披汶的政变，出任总理府副职，继续担任沙立的亲信顾问。1962年3月31日因长期心脏病在曼谷逝世，享年63岁。"
 CBIO_SIA_mangkorn_phromyothi_desc:0 "芒功·伏龙育提生于1896年，本名“芒功·蓬齐温”，1932年立宪革命时以陆军上尉军衔加入“人民党”密谋核心成员，此后历任陆军要职并晋升上将，1940至1941年法泰战争期间在陆军担任指挥职务。今泰国北柳府“蓬约提堡”（第2皇家卫队步兵师驻地）即以其原名命名。1966年逝世，享年约70岁。"
 CBIO_SIA_manopakorn_nitithada_desc:0 "玛诺巴功·尼蒂他达生于1884年7月15日，曼谷华裔家庭，本名孔·胡塔辛哈。早年就读曼谷阿松申学院，赴英国获中殿律师学院律师资格，回国后任职司法部并逐步晋升，获封“披耶·玛诺巴功·尼蒂他达”衔，1918年入拉玛六世枢密院。1932年6月立宪革命后，“人民党”出于不愿被外界视为自我扩权，选定这位与革命毫无渊源的资深法官出任首任总理，主持起草并于同年12月10日颁布首部宪法（今泰国宪法日由此而来）。任内实为“人民党”傀儡内阁首脑，1933年因比里·帕侬荣提出带有社会主义色彩的经济计划（“黄皮书”）引发保守派反弹，他于同年4月以敕令中止国会、封锁部分宪法条款，实施所谓“四月政变”（“沉默政变”），迫使比里出走法国，并通过《反共法》大肆搜捕暹罗共产党人士。6月20日披耶帕凤发动政变将其推翻，他随即被流放至英属槟城，此后终生未获准返国，1948年10月1日在槟城中风逝世，享年64岁，遗骸未运回泰国，葬于槟城当地寺庙墓地。"
 CBIO_SIA_manphya_khanphialong_desc:0 "架空虚构人物。“Luang”是暹罗官僚体系中的爵衔，通常译作“銮”，多见于近代暹罗军政官员名号。"
 CBIO_SIA_nangklao_chichalerm_desc:0 "架空虚构人物。\"Nangklao\"（那空高）是却克里王朝第三代君主拉玛三世（1824—1851在位）专属的谥号，由其侄子拉玛四世（蒙固）追封，泰国传统上君主本名讳而不称，该谥号仅属拉玛三世一人所有。"
 CBIO_SIA_nangklao_suriyawongse_desc:0 "架空虚构人物。“Nangklao”是拉玛三世的谥号，1824年至1851年在位后由拉玛四世追封；“Suriyawongse”与19世纪暹罗宾纳家族的高等贵族封号有关，庄·宾纳曾在1868年至1873年拉玛五世成年亲政前担任摄政，封号中即含“西·素里亚旺”。"
 CBIO_SIA_pao_pienlert_boripanyutakit_desc:0 "保·边莱·波里潘育塔吉生于1893年11月10日，家中12名子女中排行第二，早年在泰国国内军校就读至16岁，其后获全额奖学金赴德意志深造军事，一战爆发后转赴瑞士，暹罗参战后又转往法国圣西尔军校完成学业，留法期间兼任暹罗驻巴黎使馆国防武官助理直至毕业。28岁返国后在陆军服役，36岁获封“銮·边莱·波里潘育塔吉”衔。此后历任要职，官至陆军上将，先后出任财政部长与商务部长。1970年3月4日逝世，享年76岁。"
 CBIO_SIA_paribatra_sukhumbandhu_desc:0 "帕里巴特拉·素坤攀生于1881年6月29日，朱拉隆功国王（拉玛五世）第三十三子，母为素坤玛拉·玛拉丝丽王后。早年随父赴欧考察后入读普鲁士军校，回国后历任陆军总参谋长、暹罗海军总司令、海军部长、陆军部长、国防部长及内政部长，并长期担任拉玛六世、拉玛七世两朝枢密顾问，是绝对君主制末期最具实权的重臣之一，1932年4月国王离京避暑期间曾短暂代行摄政。因权势过大被“人民党”视为眼中钉，1932年立宪革命后遭逮捕并被放逐至荷属东印度万隆，此后终生未获准返国，二战期间当地转归日军占领下继续流亡，1944年1月18日病逝于万隆，遗骸至1948年才由王室专使护送归国安葬。"
 CBIO_SIA_phichit_kriangsakphichit_desc:0 "披集·江沙披集本名銮·克良沙披集，生于1895年。1932年暹罗立宪革命时，他以陆军上尉身份加入“人民党”密谋核心成员行列，此后晋升陆军中将。1964年逝世，享年约69岁。"
 CBIO_SIA_phin_choonhavan_desc:0 "屏·春哈旺生于1891年8月14日，暹罗一位潮州移民医生之子，其妻家族同样祖籍潮州澄海。二战期间出任“帕耶普军团”第三师师长，暹罗占领英属掸邦期间兼任当地军政总督。1947年11月8日夜，他联合卡·卡颂堪上校发动政变，推翻他威·探隆纳瓦沙越政府，自任“国家军事委员会”主席，9日通过广播发表政变声明，因情绪激动落泪，被媒体讥为“含泪英雄”，8日至10日短暂出任代理总理，随后让位于銮披汶。此后长期出任副总理及陆军总司令（1948—1954），是战后军政“叻查库集团”（因该集团成员多聚居于曼谷叻查库巷而得名）的核心人物，其子猜差·春哈旺后来官至泰国总理，女婿炮·实亚农为权势熏天的警察总监。1957年9月沙立·他那叻发动政变推翻銮披汶政权，他本人虽未遭放逐但实权旁落，此后转而与沙立维持合作关系，长期担任农业部长等职，1957年伊善大旱期间曾因轻描淡写灾情引发舆论批评。1973年1月26日逝世，享年81岁。"
 CBIO_SIA_phra_bisal_sukhumvit_desc:0 "帕·比沙·素坤威本名“巴索·苏坤”，暹罗内政大臣、拉玛八世朝摄政颂·苏坤之子。早年赴美留学，先后就读菲利普斯埃克塞特中学（1919届）及麻省理工学院土木工程系（1923届），凭“波士顿州长广场交通研究及规制建议”为题的论文毕业，是首位从麻省理工毕业的泰国人；求学期间曾与友人组成“暹罗双子”音乐组合，在校内外演出暹罗歌曲及美式拉格泰姆改编曲。归国后任卫生工程局助理工程师，1930至1940年代主持暹罗公路网快速扩建，暹罗史上重要干道“素坤逸路”（1936年建成，1942年起以其封号“帕·比沙·素坤威”命名）即以其名字命名至今。1942至1943年出任皇家灌溉厅厅长。他也是“自由泰运动”成员，战争末期获比里·帕侬荣派往美国，随代表团设法争取美方对暹罗战后重建给予积极支持，尽管暹罗战时曾支持日本。"
 CBIO_SIA_phra_sitthi_ruang_dejpol_desc:0 "帕·西提·伦·德差波本名“生·潘杜巴拉帕”，陆军上校军衔，1933年出任暹罗第一届国会（第二类指派议员）成员，1939年9月9日辞去议员职务。"
 CBIO_SIA_phra_vechayanrangsarit_desc:0 "帕·维查扬冉西列本名“穆尼·玛哈山他那”，官至空军准将。1937年4月9日，暹罗空军正式升格为独立军种“皇家暹罗空军”（今泰国皇家空军前身），他出任升格后首任空军总司令，这一天此后被定为泰国“空军节”。"
 CBIO_SIA_phraya_chalermarkiart_desc:0 "帕耶·切伦阿卡本名“苏尼·素万巴提”，生于1887年4月26日，素攀武里府，早年就读军校工程科。1911年2月2日目睹比利时飞行员范登博恩在暹罗首次公开飞行表演后深受触动。1911年1月18日，暹罗陆军部选派他与另两名军官（后分别封为帕耶·维哈萨延西拉巴西、帕耶·塔延披卡）赴法国学习飞行技术，是暹罗最早的三名飞行员，三人后来并称“暹罗空军之创始三元老”。1913年学成归国，同年12月29日在沙巴通马场完成暹罗史上首次本国飞行员试飞。此后主持组建陆军航空营（1915年）、选定廊曼为永久机场并于1914年建成、筹建升格为“陆军航空署”（1918年，即今空军前身），长期出任该署署长，直至1932年立宪革命后被免去将官职务。1938年获授空军准将衔，其后退役。1955年9月14日在朱拉隆功医院逝世，享年68岁，被誉为“泰国第一飞行员”及“泰国空军之父”。"
 CBIO_SIA_phraya_chitnasongkhla_desc:0 "西·探玛提贝即“昭披耶·西·探玛提贝”（本名吉特·纳颂卡拉），生于1885年10月30日，宋卡府人，出身当地世家，家族历任宋卡地方长官。早年留学英国修习法律，1911年拉玛六世朝返国，历任民事法院法官等职，因才干出众迅速晋升，先后获封“銮·金达披隆”“帕·金达披隆·拉查萨帕波迪”“披耶·金达披隆·拉查萨帕波迪”，1931年拉玛七世特授其“昭披耶·西·探玛提贝”衔（食邑万莱），是暹罗历史上末代获封“昭披耶”（最高等级贵族衔）之人，此后该衔位随立宪革命而废止未再册封。1932年立宪革命后，他历任司法、外交、卫生、财政等多个内阁部长职务（历经披耶帕凤、銮披汶、宽·阿派旺等多届政府），并于1934年当选国会第四任议长。战后1946年他创办泰国人寿保险公司并任首任董事长，是首家由泰国人自主创立经营的人寿保险公司。此后长期出任九世王普密蓬枢密顾问，一度出任枢密院院长，官宦生涯横跨五朝、历时逾七十二年。1976年9月25日逝世，享年90岁零11个月。"
 CBIO_SIA_phraya_phahon_desc:0 "披耶帕凤·丰派育哈色纳生于1887年3月29日，曼谷，本名朴·帕凤裕庭，父为潮州华裔上校吉姆，母为泰-孟裔。早年就读朱拉隆功皇家陆军官校，1903年获王室奖学金赴德意志普鲁士主要军官候补学校深造（据传与后来的纳粹元帅戈林同窗），继而转赴丹麦哥本哈根工程学院，因奖学金中断仅完成一年学业，1912年返暹罗。1931年获拉玛七世授“披耶帕凤·丰派育哈色纳”衔，1932年出任暹罗陆军总司令，是策划1932年立宪革命的“四剑客”核心成员之一、革命当日宣读《暹罗新国家宣言》之人，革命后被视为“人民党”资深领袖。1933年3月，总理玛诺巴功以“黄皮书”经济计划争议为由将他逐出内阁并中止宪法，他遂于6月20日发动不流血政变推翻玛诺巴功，次日自任第二任总理直至1938年，任内经历1933年10月博沃拉德叛乱等多次政局动荡，依靠个人威望及銮披汶等亲信军官维系统治。1938年因王室地产贱卖丑闻及国会选举失利被迫辞职，銮披汶继任总理。此后退出政坛，二战期间出任武装力量总监。1947年2月14日因脑出血在曼谷逝世，享年59岁，据传身后家人一度因经济拮据无力操办丧事，后由銮披汶出面协助安排。"
 CBIO_SIA_phraya_preechacholayudha_desc:0 "巴耶·普里查乔拉育本名“旺·扎鲁帕”，早年就读帖沙林中学（1909年入学，1915年毕业），海军军官出身。1932年6月立宪革命后，他出任临时执政机构“人民委员会”委员（1932年6月28日至12月10日），继而在首部宪法颁布后转任内阁部长（1932年12月至1933年8月），并于1932年7月6日起出任革命后首任海军总司令，直至1933年8月因调任内政部任职而离任，由披耶·维吉特查拉提接任。"
 CBIO_SIA_phraya_songsuradet_desc:0 "披耶·颂素拉德生于1892年8月12日，曼谷一军人世家，本名“帖·潘图森”。早年在普鲁士皇家陆军候补生学校受训，回国后长期主持暹罗多条铁路工程建设，1932年革命前夕出任作战厅厅长，独自策划1932年革命行动方案，直至行动前一日才向同僚透露细节，因学识渊博被并称“四剑客”之一，据评论家评价是四人中最具才干者。1933年6月披耶帕凤政变后，因其曾支持被推翻的玛诺巴功一派而遭终身禁止从政，流亡锡兰两年。同年10月博沃拉德叛乱爆发前夕，他与同僚普拉萨上校已提前出走国外并拒绝归国参战；因此，他并未协助政府平定叛乱，而是对是否出兵态度暧昧。1938年銮披汶出任总理后，两人积怨爆发，1939年1月銮披汶借口“颂素拉德叛乱案”（又称“十八具尸体叛乱案”）大肆搜捕政敌五十余人，其本人被褫夺军职流放印度支那，此后在金边以修理自行车、与妻子磨面制售糕点为生，境况潦倒，1944年6月1日因败血症死于金边一处废弃宅邸，亦有传言称系遭毒杀。"
 CBIO_SIA_phraya_thayarnpikart_desc:0 "帕耶·塔延披卡本名“提普·格图达”，是暹罗最早三名飞行员之一，1911年与帕耶·切伦阿卡、帕耶·维哈萨延西拉巴西一同奉命赴法学习飞行技术，留法期间曾因飞行训练事故受伤，休养后继续完成学业，1913年学成归国后进入陆军工程督察部负责航空事务，此后出任陆军航空营副营长，与帕耶·切伦阿卡等共同缔造暹罗军事航空事业，三人并称“暹罗空军之创始三元老”。其子后来是泰国知名科学家兼教育家西帕暖·格图达。"
 CBIO_SIA_phraya_wichcitcholathai_desc:0 "披耶·维吉特查拉提本名“通迪·苏万普勒”，生于1890年10月23日，曼谷，早年就读寺庙学校及皇家学院，1905年考入海军官校，1908年毕业服役。历任海军多项职务，1917年晋升海军少校，1921年获封“帕·仁光沙蒙”衔，1923年晋升海军上校。1932年立宪革命12天后即获任命为海军总参谋长，1933年8月5日接替披耶·普里查乔拉育出任海军总司令，但仅任职四个月即于同年12月1日辞职，由辛徒·甲玛叻那温以代理身份接任。此后历任国防部次长及内阁部长等职，并两度出任御前侍卫。1958年6月27日逝世，享年67岁。"
 CBIO_SIA_plaek_phibunsongkhram_desc:0 "銮披汶·颂堪生于1897年7月14日，暖武里府一户榴莲种植农家，祖父为广东移民后裔。早年就读佛寺学堂，后入朱拉隆功皇家陆军官校，1914年毕业授炮兵少尉衔，一战后赴法国炮兵应用学校深造，期间结识比里·帕侬荣，共同萌生推翻绝对君主制的构想。1928年获拉玛七世授“銮”衔封号“銮披汶·颂堪”，此后即以此为姓氏沿用终身。1932年6月24日政变中作为“人民党”军人派核心骨干之一发挥关键作用，1933年协助平定博沃拉德叛乱，1934年出任国防大臣，1938年12月出任总理并兼陆军总司令，开始其长达十余年的军政强人统治。任内大力推行泛泰民族主义文化改造，1939年将国号由“暹罗”改为“泰国”，发布一系列“文化敕令”强制推行西式着装、致敬国旗等国民生活准则。1940至1941年发动法泰战争夺回被法国占据的领土；1941年12月日军登陆后被迫允许日军过境，随后对盟国宣战，引发自由泰运动反弹。因战局恶化，他于1944年7月辞职，战后一度因“战犯”罪名遭起诉但获释。1948年4月借政变重新出任总理直至1957年，任内转向坚定反共立场并与美国结盟，历经多次未遂政变。1957年9月被部下沙立·他那叻发动政变推翻，被迫流亡日本，1964年6月11日因心脏衰竭病逝于日本神奈川县相模原市。"
 CBIO_SIA_prajadhipok_desc:0 "巴差提朴生于1893年11月8日，曼谷，朱拉隆功国王（拉玛五世）幼子。早年赴英国伊顿公学及伍尔维奇皇家军事学院受训，并在英国陆军皇家骑炮兵团服役，一战期间因暹罗中立被兄长拉玛六世召回。1918年与表姐兰拜·巴尼公主结婚。1925年11月兄长瓦栖拉兀（拉玛六世）猝逝且无嫡子继承，26日他仓促继位，是为拉玛七世，史称暹罗末代绝对君主。任内推行财政紧缩、设立枢密院、创建国家图书馆、扩大大学教育，并着手起草宪法草案，但受制于保守宗室阻挠迟迟未能颁布。1932年6月24日，“人民党”发动不流血政变，时值国王在华欣避暑，他接受立宪要求，同年12月10日颁布暹罗首部永久宪法，成为该国首位立宪君主。此后与“人民党”政府矛盾渐深，1933年博沃拉德叛乱后威望受损，1934年赴英就医期间与政府就赦免权等问题谈判破裂，1935年3月2日宣布逊位，发表声明表示愿将权力交还全体人民、但不愿交给任何个人或团体擅自使用。此后终老英国，未再返回暹罗，1941年5月30日在英国萨里郡病逝，骨灰由王后带回暹罗安放。"
 CBIO_SIA_prayoon_pamornmontri_desc:0 "巴允·帕蒙蒙特里生于1897年2月5日（一说1898年），德国柏林，其父为暹罗驻德武官颜·帕蒙蒙特里少校，母为德裔医师安内莉·帕蒙蒙特里，曾在德国教授多名暹罗留学军官德语，其中不少人后来成为“人民党”骨干。他与孪生兄弟巴永幼年同任拉玛六世侍从，成年后同任皇家卫队军官，此后辞职赴巴黎攻读政治学。留欧期间，他是最早与比里·帕侬荣共同筹划“人民党”的两名核心成员之一，1927年2月5日（他30岁生日当天）在巴黎索梅拉尔街9号召开该党首次正式会议，负责联络协调各方成员。1932年立宪革命后，他在銮披汶内阁出任教育部长，战后又于1954至1957年出任卫生部长。军事方面，他创立“国土防卫志愿队”，官至陆军中将，1957年2月大选中代表清迈府当选国会议员。1982年8月12日因车祸在曼谷逝世，享年85岁。"
 CBIO_SIA_prayoon_yuthasastrkosol_desc:0 "巴允·育他塞哥颂本名“巴允·育他塞哥颂”，惯称封号“銮·育他塞哥颂”，生于1893年10月19日。1919年入暹罗皇家海军官校，1932年入海军战争学院深造期间获同窗赠绰号“教授”，此后终生沿用。1932年革命后长期在海军服役至1957年退役，历任多项要职，1953年率领暹罗海军仪仗队代表出席英国女王伊丽莎白二世加冕典礼阅兵式，另曾代表暹罗出访西班牙、意大利、日本、瑞士、法国、比利时、挪威、瑞典、丹麦、美国、台湾及香港等地。1956年晋升海军元帅，1957年出任副总理。晚年投身农业事业，推动蒸谷米农户建立自主经销市场及冷藏保鲜设施，并涉足液化石油气农村建设与橡胶产业发展。1975年12月11日逝世，享年82岁。"
 CBIO_SIA_pridi_banomyong_desc:0 "比里·帕侬荣生于1900年5月11日，大城府一农户家庭的驳船上，19岁即成为暹罗最年轻的执业律师之一。1920年获王室奖学金赴法留学，先后获卡昂大学硕士学位及巴黎大学法学博士学位（1927年），留法期间深受法国社会主义思想影响，与銮披汶·颂堪等旅法暹罗学生共同创立“人民党”。1932年6月24日，他领导人民党文官派与军人派发动不流血政变，终结绝对君主制，主持起草暹罗首部宪法。1933年因提出国有化色彩浓厚的经济计划遭保守势力猛烈抨击，一度被迫短暂流亡海外，返国后历任内政、外交、财政部长，1936至1937年任外交部长期间促成废除与十二国的不平等条约。1941至1945年出任摄政，代行年幼的拉玛八世王权；日军登陆暹罗后，他暗中领导国内“自由泰运动”从事对日地下抵抗，同时拒绝在对英美宣战书上签字使该宣战在法理上无效。1946年3月出任暹罗史上首位民选总理，同年6月因拉玛八世离奇身亡于王宫，他遭政敌污蔑为幕后主使，8月被迫辞职。1947年11月銮披汶发动政变后被迫流亡，1949年策动反政变未遂后彻底转入长期海外流亡，先后辗转中国大陆二十余年，1970年移居法国巴黎，1983年5月2日病逝于巴黎，骨灰三年后运回泰国撒入暹罗湾。"
 CBIO_SIA_puey_ungpakorn_desc:0 "贝·黄培谦生于1916年3月9日，曼谷一潮州移民鱼贩家庭，中文名黄培谦，祖籍广东饶平。1934年考入新成立的法政大学首届学生，1937年毕业后短暂任法语翻译，1938年获政府奖学金赴伦敦政治经济学院攻读经济学。1941年12月日本入侵暹罗、銮披汶政府结盟日本后，他中断学业加入“自由泰运动”，协助在英国境内组织该运动，接受英方军事训练，化名“甘·延英”。1944年他伞降泰国猜纳府执行秘密联络比里·帕侬荣的任务，降落后被当地政府逮捕关押寺庙，后经自由泰同志营救获释。战后完成学业，1948年获伦敦政经学院经济学博士学位，1949年加入财政部任经济学者，1953年出任国家经济委员会常务董事及泰国央行副行长，1959年升任央行行长，年仅43岁即成为该行史上最年轻及任期最长的行长（至1971年，逾十二年），任内推动汇率改革、成立预算局并力保央行独立性，1964年获菲律宾麦格塞塞奖，成为首位获此殊荣的泰国人。1966年起兼任法政大学经济学院院长，1967年在猜纳府创立“泰国乡村重建基金会”推动农村发展，获国王御赐赞助。1973年他那滕军人政权垮台后出任经济顾问委员会主席，1975年出任法政大学校长，1976年10月6日法政大学血腥镇压事件中因被极右翼势力污蔑为“颠覆分子”被迫流亡英国，此后中风致丧失语言与写作能力，长居伦敦直至1999年7月28日逝世，享年83岁。"
 CBIO_SIA_rambai_barni_desc:0 "兰拜·巴尼生于1904年12月20日，曼谷，蒙固王（拉玛四世）之孙、沙瓦斯迪·索帕纳亲王之女，自幼被送入宫中由王后梳华帕蓬西抚养教育。1918年8月26日与表兄巴差提朴亲王在邦芭茵宫成婚，婚后未育有子女。1925年丈夫继位为拉玛七世后，她成为暹罗历史上首位在加冕礼上正式册立的王后，拉玛七世自此废止历代蓄妃传统，终身只立她一人为后。1932年立宪革命及1933年博沃拉德叛乱期间，她始终陪伴丈夫辗转华欣、宋卡等地，1933年随夫赴英就医，1935年丈夫逊位后定居英国。二战期间以红十字会志愿者身份在英服务，并与其弟一同暗中支持“自由泰运动”。1941年丈夫病逝后，她于1949年携带丈夫骨灰返回泰国，此后长期投身章达武里府农业、畜牧及手工艺发展事业，在当地创办“班交园”农庄示范经营十八年，并资助改建当地医院。1984年5月22日在曼谷沙可太宫寝宫内因心脏衰竭辞世，享年79岁。"
 CBIO_SIA_rangsit_prayurasakdi_desc:0 "兰实·拍裕沙迪生于1885年11月12日，朱拉隆功国王（拉玛五世）第五十二子，封号“猜纳亲王”，早年被沙宛·瓦塔纳王后收养，与马希敦亲王情同手足。1913年返国后长期致力于暹罗公共卫生事业，创建卫生部并任首任部长，被誉为泰国现代公共卫生体系奠基人，另兼任大学事务厅首任厅长、朱拉隆功大学规划发展委员会主席。1932年立宪革命后未涉足政治，但1938年仍以“叛国”罪名遭銮披汶军政府逮捕入狱近五年，狱中以禅修及撰写回忆录度日，1943年获释，1944年銮披汶下台后爵位与荣衔悉数恢复。1946年6月拉玛八世离奇身亡后，因新即位的九世王普密蓬计划先完成海外学业，他于同年6月16日起出任暹罗摄政，1947年起兼任国务委员会主席，1949至1951年多次出任摄政直至1951年3月7日因心脏病发作在曼谷逝世，是朱拉隆功国王最后一位在世的儿子，享年65岁。今曼谷北郊“兰实”地区及运河即以其名命名。"
 CBIO_SIA_sanguan_tularaksa_desc:0 "沙愿·都拉叻沙生于1902年6月18日，潮州华裔家庭。长期追随比里·帕侬荣，是1932年立宪革命“人民党”元老成员之一，历任国会议员、财政部烟草专卖局局长。1943年受比里派遣，出任“自由泰运动”驻重庆代表团团长，其外交努力对争取英美两国支持该地下抵抗运动至关重要，为该运动此后获得盟军军事装备补给奠定基础。1946年出任驻华大使。1947年政变后他拒绝返回泰国，公开宣称新宪法不具合法性，此后长期流亡海外。1995年5月15日逝世，享年92岁。"
 CBIO_SIA_seni_pramoj_desc:0 "社尼·巴莫生于1905年5月26日，拉玛二世玄孙，父为堪罗普亲王，母为宾纳家族出身。早年就读英国德比郡特伦特公学，获牛津大学伍斯特学院法学学士学位（二等荣誉），继而在伦敦格雷律师学院深造获一等荣誉，回国后先后在最高法院实习及民事法庭任职，后转入外交部，1940年获派任驻美大使。1941年12月日军登陆暹罗后，1942年1月銮披汶政府对英美宣战，他拒绝向美国国务院递交宣战书，率使馆全体人员倒向盟国一方，随即在美国境内筹组“自由泰运动”，动用暹罗在美冻结资产武装训练逾五万名泰裔及旅美泰国学生，因此举使美国战后未将暹罗视为战败敌国、免于承受战争赔偿责任。1945年9月17日返抵曼谷当日即出任总理，但因内阁充斥比里·帕侬荣派系人马而感掣肘，1946年1月辞职，同年与胞弟克立·巴莫共同创立民主党。此后长期在野从政并兼任律师，1975年2月至3月、1976年4月至10月两度短暂复任总理，末次任内适逢1976年10月6日法政大学血腥镇压事件，他被军方逼宫下台，此后辞去民主党党魁职务永久退出政坛，重操律师旧业直至退休。1997年7月28日在曼谷病逝，享年92岁。"
 CBIO_SIA_sindh_kamalanavin_desc:0 "辛徒·甲玛叻那温生于1901年6月23日，本名“辛徒·甲玛叻那温”，惯称封号“銮·信突颂堪猜”。毕业于宽古拉威塔雅莱学校，获政府奖学金赴丹麦深造海军技术。1928年在巴黎结识“人民党”筹建者，受他威·蓬雅盖邀请加入并出任海军派领袖。1932年立宪革命后历任多项内阁职务、海军总司令（1934年及1938至1951年），任内力主海军现代化，主持引进暹罗史上首批潜艇。1951年6月“曼哈顿号事件”（海军兵变劫持总理銮披汶未遂）爆发后，他虽未直接参与叛乱，仍遭撤销海军总司令职务并以“叛国罪”判处监禁三年。出狱后淡出政坛，1952年他曾发起兴建曼谷吞武里区海军医院（今“帕蓬克劳亲王医院”）。1976年5月14日逝世，享年74岁。"
 CBIO_SIA_sindhu_kamalanavin_desc:0 "辛徒·甲玛叻那温生于1901年6月23日，本名“辛徒·甲玛叻那温”，惯称封号“銮·信突颂堪猜”。毕业于宽古拉威塔雅莱学校，获政府奖学金赴丹麦深造海军技术。1928年在巴黎结识“人民党”筹建者，受他威·蓬雅盖邀请加入并出任海军派领袖。1932年立宪革命后历任多项内阁职务、海军总司令（1934年及1938至1951年），任内力主海军现代化，主持引进暹罗史上首批潜艇。1951年6月“曼哈顿号事件”（海军兵变劫持总理銮披汶未遂）爆发后，他虽未直接参与叛乱，仍遭撤销海军总司令职务并以“叛国罪”判处监禁三年。出狱后淡出政坛，1952年他曾发起兴建曼谷吞武里区海军医院（今“帕蓬克劳亲王医院”）。1976年5月14日逝世，享年74岁。"
 CBIO_SIA_thawee_punyaketu_desc:0 "他威·蓬雅盖生于1904年11月10日，曼谷，早年就读英国剑桥大学国王学院及法国格里尼翁高等农业学院，归国后任职农业部。1932年6月24日加入“人民党”参与立宪革命，此后出任銮披汶内阁秘书长，继而在宽·阿派旺内阁出任教育部长。1945年8月，宽·阿派旺辞职后，因首选人选一时未能到位，他于8月31日临危受命出任总理，仅执政18天即于9月17日辞职让位于社尼·巴莫，是泰国史上任期最短的总理。此后出任沙立·他那叻政府时期宪法起草委员会主席。1971年11月3日逝世，享年66岁。"
 CBIO_SIA_thawon_thamrongnawasawat_desc:0 "他威·探隆纳瓦沙越本名“他威·塔里沙越”，惯称封号“銮·探隆纳瓦沙越”，生于1901年11月21日，华裔背景，中文名郑连淡。海军军官出身，官至海军少将，1935至1938年出任内政部长。二战期间是“自由泰运动”地下抵抗核心领导人之一。1946年8月，因拉玛八世离奇身亡引发比里·帕侬荣政府信誉危机，比里于同年8月21日辞职，他作为折中人选于8月23日当选总理，任内主要处理战后对盟军赔偿事宜（主要以稻米输送形式向盟国交付赔偿），并推动1946年对英和约签署以恢复泰国国际地位。1947年11月8日銮披汶集团发动政变将其推翻，他一度流亡香港。是泰国史上首位、也是迄今唯一一位出身海军的总理。1988年12月3日在帕蒙库特陆军医院逝世，享年87岁。"
 CBIO_SIA_tiang_sirikhan_desc:0 "提昂·西里坎生于1909年，泰国东北部沙功那空府，本名“提昂·西里坎”，绰号“普潘勇士”。毕业于朱拉隆功大学，曾任乌顿披他育中学及朱拉隆功大学教师，是东北部四位早年当选国会议员的“人民党”背景政治家之一，与通英·普里帕、他文·乌敦、詹隆·道銮并称“东北四虎”，1933年首届民选国会大选中当选沙功那空府议员，此后连任五届直至1952年，三度出任内阁部长。1943年比里·帕侬荣委派他在沙功那空府普潘山区建立“自由泰运动”训练营，代号“普鲁托”，鼎盛时期训练游击队员逾万人，与英方特种作战136部队及美国战略情报局密切合作，是全国规模最大的自由泰武装力量之一，战争末期还负责解除当地日军武装。战后他积极扶持东南亚反殖民独立运动，1946年为逃离法国重占印支的越南难民提供庇护并向越盟武装供应军火，1947年发起“东南亚同盟”并出任主席。1949年2月比里派海军策动反政变失败后，他因涉嫌“分离主义”遭当局搜捕并受审，1952年11月被捕，同年12月12日与另四人一同秘密处决，遗体焚毁掩埋，直至1959年才在北碧府寻获遗骸。他是“东北四虎”中最后一位遇难者，其余三人已于1949年“11公里事件”中遭警方枪杀。"
 CBIO_SIA_tianliang_huntrakool_desc:0 "帕耶·西·维萨拉瓦扎本名“田良·洪特拉贡”，生于1896年2月25日，泰国潮州华裔商人世家，家族原姓“洪”，1911年由长兄资助赴英国留学，就读达利奇学院。归国后长期任职宫廷，官至拉玛七世朝“御前秘书长”（政府文官系统最高职位之一），并参与起草拟呈拉玛七世的宪法草案（与西·探玛提贝及美籍顾问雷蒙德·史蒂文斯共同草拟）。1932年立宪革命后转任外交界，1946年2月至3月短暂出任财政部长，1947至1948年出任外交部长。他培养提携多位后进，包括后来出任泰国总理的阿南·班雅拉春（1948年赴其母校达利奇学院留学即由他推荐）。其胞兄经商致富，家族后代颂迈·洪特拉贡后来在炳·廷素拉暖政府出任财政部长。1968年3月23日逝世，享年72岁。"
 CBIO_SIA_vilas_osathanondh_desc:0 "威拉斯·奥萨他暖生于1900年11月7日，曼谷，父为暹罗地方总督帕耶·帕拉查吉贡查克，“威拉斯”（意为“英国人”）之名由丹隆亲王御赐，因其父曾留学英国。早年就读皇家侍从学校，获拉玛六世奖学金赴英国攻读农业，归国后任职农业部，结识同僚他威·蓬雅盖，经其引荐加入“人民党”，1932年6月24日政变当日随宽·阿派旺一组负责切断挖龙寺附近电话线路以阻断当权者通讯。革命后历任临时国会代表、正式国会议员，1932年12月出任无任所部长兼交通部次长。1941年5月起任宣传厅首任厅长兼内阁部长，日军入侵暹罗后，因日方不满他与比里·帕侬荣的立场，双双被迫离阁，此后投身“自由泰运动”抵抗工作。战后曾任商业部长，1946年新宪法设立两院制国会后，当选参议院（元老院）首任议长，同时兼任国会两院联合首任议长，是泰国史上首位担任此职者。1997年1月13日因心脏衰竭辞世，享年96岁。"
 CBIO_SIA_wan_waithayakon_desc:0 "旺·威泰耶康生于1891年8月25日，曼谷，蒙固王（拉玛四世）之孙，全名“瓦纳·维达雅卡拉亲王”，封号“纳拉提·蓬萨帕班亲王”。早年就读曼谷素安宽拉学校及皇家学院，赴英国牛津大学贝利奥尔学院攻读历史并获荣誉学位，继而在巴黎政治学院深造。1917年投身外交界，1922年出任表兄拉玛六世顾问，1924年晋升外交部次长，负责与西方列强修订不平等条约相关谈判，1926年出任驻英、荷、比公使并率团出席国际联盟会议历任要职。1930年返国出任朱拉隆功大学教授。此后长期活跃于外交舞台，1943年参与对日谈判，战后促成暹罗加入联合国，1947年出任驻美大使兼常驻联合国代表，1952至1957年、1958年两度出任外交部长，1956至1957年当选联合国大会第十一届会议主席，是首位担任此职的亚洲人。他精通英语、巴利语、梵语，为泰语创造大量对译新词（如“民主”“宪法”“银行”“战争”等常用词汇均出自其手），长期担任泰国皇家学会会长，被视为泰国语文学考据学奠基人之一。1976年9月5日在曼谷逝世，享年85岁。"
 CBIO_SWE_archibald_douglas_desc:0 "阿奇博尔德·道格拉斯（1883年2月14日—1960年2月11日），瑞典陆军中将，出身苏格兰裔瑞典望族道格拉斯家族（该家族十七世纪即已迁居瑞典并归化，在瑞典军事贵族史上享有显赫地位）。他在瑞典陆军中历任军区司令等高级职务。其家族背景使他在瑞典军界具有独特的社会地位。1960年逝世。"
 CBIO_SWE_arne_beurling_desc:0 "阿尔内·卡尔-奥古斯特·伯伊林（1905年2月3日，生于哥德堡—1986年11月20日），瑞典数学家兼密码学家，二战中瑞典信号情报的核心人物。乌普萨拉大学教授，在调和分析、复分析及势论领域做出杰出学术贡献。1940年夏天，德军经瑞典电缆发送的加密电传打字机通信被瑞典信号情报机构截获，伯伊林仅凭密文磁带、不接触任何实物机器，在两周之内以纸笔独力破解了西门子T52“秘密打字机”（Geheimschreiber）的加密原理——该机器产生近一百京种变化组合，德方认为绝不可能被破译。这一壮举被密码学史家评价为“可能是二战中最杰出的密码分析成就”，堪与英国布莱切利园破译恩尼格玛相媲美，但被保密逾五十年。凭借破译成果，瑞典当局在巴巴罗萨行动发起前即已知悉德国攻苏计划。被问及如何做到时他只说“魔术师不透露秘密”。战后赴美，继承了爱因斯坦在普林斯顿高等研究院的办公室。1986年逝世。"
 CBIO_SWE_axel_pehrssonbramstorp_desc:0 "阿克塞尔·皮尔森-布拉姆斯托尔普（1883年8月19日—1954年2月26日），瑞典农民党领袖（1934—1949年），1936年短暂出任首相（著名的“假期内阁”）。出身斯科讷省农民家庭。1936年6月社民党内阁因国防开支问题辞职后，国王委托皮尔森-布拉姆斯托尔普组阁，他组成了一个仅持续约三个月的农民党少数政府（因恰逢议会夏季休会而被戏称为“假期内阁”），随后与汉森达成协议组建社民党-农民党联合政府，他在联合政府中长期担任农业大臣。二战期间作为联合政府成员参与治国。1954年逝世。"
 CBIO_SWE_axel_rappe_desc:0 "阿克塞尔·奥斯卡·拉佩（1884年6月22日，生于斯德哥尔摩—1945年10月31日），瑞典陆军少将，出身军事贵族家庭（其父同名，曾任战争大臣）。1904年入伍瑞典皇家炮兵团，后就读炮兵工程学院及陆军参谋学院。1918年他离开瑞典军队参加芬兰内战，在曼纳海姆麾下的总参谋部服役并晋升中校，出任东部军团参谋长。回国后历任炮兵工程学院教员、上诺尔兰军区参谋长、东部军区参谋长及总参谋部中央处处长等职，1935年晋升上校。此后担任约塔炮兵团及斯韦阿炮兵团团长、炮兵总监及第五军区司令。著有多部关于国防政策及东部军团作战指挥的军事著作。1945年逝世。"
 CBIO_SWE_bengt_nordenskiold_desc:0 "本特·诺登许尔德（1891年10月29日—1972年9月6日），瑞典空军将军，空军现代化的关键推手。出身著名的诺登许尔德探险家族。1931年瑞典空军从陆军独立为单独军种后，他担任空军总监（后为空军司令），主持了瑞典空军从初创到具备独立作战能力的全过程。二战期间他负责扩充空军实力、引进和自行生产现代战机，使瑞典空军成为维护武装中立的重要力量。1954年退役时被晋升为将军——他是瑞典空军史上首位获授将军军衔的非王室现役军官。1972年逝世。"
 CBIO_SWE_birger_furugard_desc:0 "比里耶·富鲁戈德（1887年11月4日—1961年7月19日），瑞典纳粹运动最早的创始人之一。原为兽医，1920年代末开始组织瑞典最早的国家社会主义团体，1930年创建瑞典国家社会主义党（SNSP），是瑞典纳粹运动的先驱。其组织在1930年代初曾获得一定支持，但1933年林霍尔姆脱离另建NSAP后，瑞典纳粹运动分裂为两个相互竞争的团体。富鲁戈德的组织此后逐渐衰落。1950年代他仍活跃于极右翼边缘，但影响力已大为下降。1961年逝世。"
 CBIO_SWE_carl_ehrensvard_desc:0 "卡尔·埃伦斯韦德，瑞典陆军将领。埃伦斯韦德家族是瑞典著名军事贵族世家（以十八世纪建造卡尔斯克鲁纳海军基地的奥古斯丁·埃伦斯韦德最为知名）。"
 CBIO_SWE_carl_lindhagen_desc:0 "卡尔·林德哈根（Carl Lindhagen，1860—1946）是瑞典法学家、社会主义政治家兼和平主义者，出身法律世家，父亲为知名法学家兼城市规划者阿尔贝特·林德哈根。他在乌普萨拉攻读法律，曾任诺贝尔遗嘱执行顾问及1899年诺贝尔委员会秘书，并因反军国主义立场数度被提名诺贝尔和平奖。1903—1930年长期担任斯德哥尔摩市首席法官，是一项法律职务而非民选市长。1902年他在议会提出女性选举权动议，直接催生了瑞典有组织的妇女参政运动。1909年加入社民党，1917年参与左翼分裂、加入社会民主左翼党；1921年因反对共产国际“二十一条”被开除，1923年重归社民党。他毕生倡导民主、妇女权利与工农权益，也是世界语的长期支持者。1946年逝世。"
 CBIO_SWE_christian_gunter_desc:0 "克里斯蒂安·云特（1886年4月19日—1966年6月6日），瑞典外交官兼政治家，无党派人士，1939—1945年出任战时联合政府外交大臣，是瑞典二战期间中立外交政策的主要执行者。他在极其艰难的国际环境下——瑞典被轴心势力包围、同时面临来自德国和盟国的双重压力——主导了对德妥协政策（允许借道、出口铁矿石）与维护国家主权之间的平衡，这一外交路线至今仍受争议。战后因战时对德妥协立场而遭到批评，被翁登接替。1966年逝世。"
 CBIO_SWE_erik_palmstierna_desc:0 "埃里克·帕尔姆谢纳（1877年6月9日—1959年3月16日），瑞典男爵、外交官兼政治家。出身贵族帕尔姆谢纳家族，社民党人。一战期间曾任海军大臣，后转向外交领域，历任驻英国公使等职。他同时是一位多产的日记作家，其详尽的政治日记成为研究瑞典二十世纪政治史的重要一手史料。1959年逝世。"
 CBIO_SWE_ernst_linder_desc:0 "恩斯特·林德（1868年4月7日—1943年4月14日），瑞典陆军中将兼马术奥运选手。他是一位文武双全的人物——既是职业军人（历任骑兵团长等职），又是卓越的马术运动家，在1912年斯德哥尔摩奥运会马术比赛中代表瑞典赢得团体金牌（盛装舞步）。1939—1940年冬季战争期间，年逾七旬的他受命赴芬兰指挥瑞典志愿军，展现了非凡的军事经验与个人勇气。1943年逝世。"
 CBIO_SWE_ernst_wigforss_desc:0 "厄恩斯特·维格弗斯（1881年1月17日—1977年1月2日），瑞典社会民主党首席经济理论家兼财政大臣（1925—1926年、1932—1949年）。语言学出身，在哥德堡大学任教期间转向经济学与社会主义理论研究。作为“人民之家”福利经济的设计师，他在1930年代大萧条期间提出以赤字财政刺激经济、扩大公共就业的政策，早于凯恩斯理论在英美的实践——被称为“瑞典式凯恩斯主义”的先驱。他的财政政策与社会改革理念为瑞典战后福利国家的全面建设奠定了理论与制度基础。同时他也是一位多产的作家与知识分子。1977年逝世，享年九十五岁。"
 CBIO_SWE_fabian_tamm_desc:0 "法比安·塔姆（1886年—1957年），瑞典海军上将，二战期间海军最高指挥官。塔姆家族在瑞典军政界有悠久传统。他在战时主管瑞典海军的中立巡逻与领海防务任务——在波罗的海被轴心势力控制、同时盟国亦有侵入瑞典水域之虞的复杂局面下，指挥海军维护瑞典的海上中立地位。1957年逝世。"
 CBIO_SWE_frans_severin_desc:0 "弗兰斯·塞韦林（1875年—1961年），瑞典左翼/社民党政治家。早年曾参加社民党左翼运动，后回归社民党主流。曾任议员及市政官员。其政治生涯在社民党内部虽非最核心层，但代表了一批从左翼立场经历分裂与回归后最终融入“人民之家”福利建设的社民党老一代政治家群体。1961年逝世。"
 CBIO_SWE_fredrik_strom_desc:0 "弗雷德里克·斯特伦（1880年8月22日—1948年10月27日），瑞典早期共产党/社民党作家兼政治家。1917年参与创建左翼社会民主党，加入共产主义运动。后离开共产党回归社民党。他同时是一位多产的作家，著有大量政治评论、诗歌及回忆录，记录了瑞典左翼运动早期的风云变幻。曾任斯德哥尔摩市政官员。1948年逝世。"
 CBIO_SWE_gosta_bagge_desc:0 "约斯塔·巴格（Gösta Bagge，1882—1951）是瑞典经济学家、保守派政治家，1935—1944年任右翼党党魁。生于斯德哥尔摩，就读乌普萨拉大学，曾赴美国约翰·霍普金斯大学深造，后获经济学博士，1921年起任斯德哥尔摩大学经济学与社会政策教授，并与赫克舍尔共同创办保守派刊物《瑞典杂志》。1935年接替阿尔维德·林德曼出任党魁，1939—1944年在二战联合政府中任教育大臣。他在社会问题上持保守立场、经济上倾向自由主义，是社民党财政大臣维格弗斯经济政策的尖锐批评者，也是援助芬兰的主要主张者。1944年卸任党魁，1951年逝世。"
 CBIO_SWE_gunnar_myrdal_desc:0 "贡纳尔·米达尔（1898年12月6日—1987年5月17日），瑞典经济学家、社会理论家，1974年诺贝尔经济学奖得主（与弗里德里希·哈耶克共同获奖）。斯德哥尔摩大学教授，社会民主党人。1934年他与妻子阿尔瓦·米达尔合著《人口问题危机》一书，直接推动瑞典政府在住房、家庭补贴及母婴保健领域的重大社会改革，奠定了“人民之家”福利体系的理论基础。1930年代他发展了制度经济学方法论，强调经济分析不可脱离价值判断。1944年出版巨著《美国困境》，以经济学家的笔触系统分析美国种族问题，对美国民权运动产生深远影响。战后历任联合国、瑞典政府及国际组织要职。1987年逝世。"
 CBIO_SWE_helge_jung_desc:0 "黑尔格·荣格（Helge Jung，1886—1978）是瑞典陆军上将，军事改革派代表人物。生于马尔默，1906年毕业于卡尔贝里军校后入伍。他曾在军事学院讲授战史与战略，聚集起一批主张扩军备战的年轻军官，出任1930年国防委员会秘书，推动了1938年国会通过的重整军备计划。1937—1940年任陆军参谋长，1938年晋升少将。二战期间主张援助芬兰对抗苏联，1943年兼任斯德哥尔摩卫戍司令。1944年4月晋升上将并出任瑞典武装力量最高统帅，直至1951年卸任，任内主导战后瑞典国防的重组与现代化，被视为影响深远的国防奠基者。1978年逝世于斯德哥尔摩。"
 CBIO_SWE_hugo_silen_desc:0 "胡戈·西伦（1889年—1934年），瑞典共产党（莫斯科派）早期领导人。1929年瑞典共产党分裂时，他是共产国际忠实派的核心组织者——虽然他这一派仅保留了约四千名党员（全党一万七千人中的少数），但得到莫斯科的承认而成为“正统”瑞典共产党。在他领导下，党执行激进的“阶级对阶级”路线，拒绝与社民党合作。其追随者被称为“西伦派”（Sillénare），以区别于被开除的多数派“希尔布姆派”（Kilbommare）。1934年他因病早逝，党的领导权随后转移至林德罗特手中。"
 CBIO_SWE_ivar_holmquist_desc:0 "卡尔·阿克塞尔·弗雷德里克·伊瓦尔·霍尔姆奎斯特（1879年2月22日，生于赫尔辛堡—1954年9月24日），瑞典陆军中将兼体育界要人，1940—1944年出任陆军总监。1899年任约塔近卫团少尉，1902—1904年就读陆军参谋学院，此后历任参谋学院教员、驻奥匈帝国观察军官等职。1928年出任诺尔博滕团团长，1934年任北方军区旅长，1935年晋升少将，1937年任第二军区司令，1940年晋升中将并出任陆军总监直至1944年。他同时是瑞典体育界的重要人物——1924—1934年出任国际滑雪联合会（FIS）首任主席（此后为终身名誉主席），是该组织的联合创始人之一，长期担任瑞典滑雪推广协会主席（1923—1950年），并致力于将高山滑雪引入瑞典。1954年逝世。"
 CBIO_SWE_karl_kilbom_desc:0 "卡尔·希尔布姆（1885年5月8日—1961年12月24日），瑞典共产党/社会党政治家。出身乌普萨拉省铁匠之子的工人家庭。早年投身社民党，1917年加入左翼分裂组建的共产党。1929年因拒绝完全服从莫斯科路线而与弗吕格一道被共产国际开除，遂另建平行的共产党（后改名社会党），其追随者被称为“希尔布姆派”。1930年代初社会党规模一度远超莫斯科派共产党。然而1937年他与日益亲纳粹的弗吕格发生尖锐矛盾后被弗吕格开除出党，带走了大部分党员。1938年他重新加入社民党，此后在人民之家运动及工人合作社领域积极活动，支持汉森的战时联合政府。著有三卷本自传。1961年逝世。"
 CBIO_SWE_king_gustaf_v_desc:0 "古斯塔夫五世（1858年6月16日，生于德罗特宁霍尔姆宫—1950年10月29日，卒于斯德哥尔摩），瑞典国王（1907—1950年在位），奥斯卡二世之长子。在位四十三年，是瑞典历史上最长寿的君主（享年九十二岁），也是最后一位实际行使过王权的瑞典国王——此后王室权力逐步象征化，至1974年新宪法正式废除。1914年他在“院落危机”中因支持加强国防而迫使自由派政府辞职，但1917年后接受了议会民主原则。二战期间他扮演了争议角色：据首相汉森记述，1941年仲夏危机中他以威胁退位为手段迫使政府同意德国恩格尔布雷希特师借道瑞典领土，并曾背着政府向希特勒发电报祝贺其侵苏“胜利”。他还曾邀请瑞典纳粹领袖林霍尔姆进入王宫。另一方面，1944年他亲自致函匈牙利摄政霍尔蒂施压停止遣送犹太人，支持了瓦伦贝格的营救行动。他同时是一位狂热的网球爱好者，以“G先生”化名参加比赛至八旬高龄。"
 CBIO_SWE_lise_meitner_desc:0 "丽泽·迈特纳（1878年11月7日，生于奥地利维也纳—1968年10月27日，卒于英国剑桥），奥地利出生的物理学家，核裂变理论的关键贡献者。犹太裔，早年在维也纳大学获博士学位后赴柏林，与化学家奥托·哈恩合作三十年，在放射化学及核物理领域取得一系列重要成果。1938年纳粹德国吞并奥地利后，她因犹太血统被迫流亡瑞典，在斯德哥尔摩的诺贝尔物理研究所和皇家工学院继续研究。同年12月哈恩在柏林实验室成功实现铀裂变但无法从化学角度解释该现象，迈特纳与侄子奥托·弗里施在瑞典通过物理学理论首次正确解释了核裂变过程——这一突破为原子能的开发和原子弹的研制奠定了理论基础。然而1944年诺贝尔化学奖仅授予哈恩一人而未及迈特纳，被广泛认为是诺贝尔奖历史上最大的遗憾之一。她拒绝参与曼哈顿计划。战后她继续在瑞典工作，晚年移居英国。1968年逝世。她出生于奥地利，1938年后流亡瑞典，并在瑞典科研机构继续从事核物理研究。"
 CBIO_SWE_martin_ekstrom_desc:0 "马丁·埃克斯特伦（1890年—1964年），军人出身的瑞典极右翼/亲纳粹活动家。早年从军，曾在多个国家参加军事行动或志愿服务。1930年代他活跃于瑞典极右翼政治圈，与纳粹运动有密切关联，代表了哈希姆王朝时期部分军人中的反民主倾向。战后其政治影响力消退。1964年逝世。"
 CBIO_SWE_natanael_beskow_desc:0 "纳塔内尔·贝斯科夫（1865年3月10日—1953年2月20日），瑞典神学家、和平主义者、画家兼社会活动家。身兼路德宗牧师、托尔斯泰式和平主义者与视觉艺术家三重身份。倡导基督教社会主义理念，参与和平运动和社会改良事业。他的妻子埃尔莎·贝斯科夫是瑞典最著名的儿童读物插画家之一。1953年逝世。"
 CBIO_SWE_nils_flyg_desc:0 "尼尔斯·斯万特·弗吕格（1891年6月9日—1943年1月9日），瑞典政治家，经历了从共产主义到亲纳粹的极端转向，是二十世纪欧洲政治极端化现象的典型案例。出身斯德哥尔摩南城工人区，1917年参与创建左翼社会民主党（后改名共产党），成为重要领导人。1929年党内分裂时他与希尔布姆一道被共产国际开除，另组社会党。1934年社会党仍保留一定左翼色彩，但在弗吕格主导下逐渐从反斯大林主义滑向反苏、反共产主义，进而在1930年代末公开转向亲纳粹德国立场。1937年他将温和派希尔布姆开除出社会党，带领残余成员明确支持希特勒。二战期间他的社会党沦为公开的亲纳粹组织。1943年1月9日弗吕格突然去世，终年五十一岁。"
 CBIO_SWE_olof_thornell_desc:0 "奥洛夫·格哈德·托内尔（1877年10月19日，生于瑟德哈姆—1977年7月25日），瑞典陆军上将，二战期间首任最高统帅（1939年12月—1944年4月）。在他之前，最高统帅一职名义上由国王兼任。1897年入伍乌普兰团，后毕业于陆军参谋学院。1930年代历任步兵监察官、国防参谋长（1936年），1939年二战爆发后被任命为新设的最高统帅职务。任内他在维护瑞典武装中立的复杂博弈中采取了政治上极为谨慎（有人认为过于保守）的路线，同时因1940年接受纳粹德国颁发的德意志鹰勋章大十字而受到公开批评，被普遍视为亲德。他是一位出色的组织者，对参谋班子要求严格。1944年4月卸任，由黑尔格·荣格接任。此后他担任国王侍卫长直至古斯塔夫五世1950年去世。他本人高寿近百，1977年逝世，享年九十九岁。"
 CBIO_SWE_oscar_nygren_desc:0 "奥斯卡·尼格伦，瑞典陆军上将。据瑞典军衔史料记载，他于1937年退役时晋升上将，但1939年被重新征召服役，在二战初期出任上诺尔兰及瑞典西部地区的第二军团司令，是当时与最高统帅托内尔同时在役的少数上将之一。"
 CBIO_SWE_osten_unden_desc:0 "厄斯滕·翁登（1886年8月25日—1974年1月14日），瑞典社会民主党政治家兼法学家，曾两度出任外交大臣（1924—1926年、1945—1962年）。乌普萨拉大学国际法教授出身，是瑞典战后中立与不结盟外交政策的主要设计者。1946年汉森猝逝时他曾短暂代理首相直至埃兰德就任。他主导了瑞典在冷战初期拒绝加入北约、坚持独立中立路线的外交决策，同时积极参与联合国事务。1962年卸任后淡出政坛。1974年逝世。"
 CBIO_SWE_per_albin_hansson_desc:0 "佩尔·阿尔宾·汉森（1885年10月28日，生于马尔默附近—1946年10月6日，卒于斯德哥尔摩），瑞典社会民主党领袖（1925年起）、首相（1932—1946年），“人民之家”（folkhemmet）福利国家模式的缔造者，被誉为现代瑞典之父。出身工人阶级家庭，几乎未受过正规教育，十几岁即投身社民党青年组织并从事新闻工作。1928年他在议会辩论中提出“人民之家”理念——国家如同一个美好的家庭，没有特权者也没有被遗弃者，人人平等互助。1932年出任首相后与农民党结盟，推行大规模反萧条公共工程、失业保险及养老金改革。二战中他主持跨党派联合政府（唯共产党除外）维持武装中立，在对德妥协（允许借道、出口铁矿石）与维护主权之间艰难平衡。1946年10月6日晚他在从歌剧院餐厅回家途中突发心脏病去世，终年六十岁。"
 CBIO_SWE_per_edvin_skold_desc:0 "佩尔·埃德温·舍尔德（Per Edvin Sköld，1891—1972）是瑞典社会民主党资深政治家，代表马尔默在国会连任达46年（1918—1964）。生于斯科讷的斯韦达拉一个农民家庭，就读隆德大学。他被誉为社民党的“救火队员”，先后出任农业大臣（1932—1936、1945—1948）、商务大臣（1936—1938）、二战期间的国防大臣（1938—1945）及财政大臣（1949—1955）。任农业大臣期间，他是1933年社民党与农民党达成的“母牛交易”危机协议的关键推手，奠定了两党长期合作的基础。其子女中有陆军司令尼尔斯·舍尔德、王室典礼官佩尔·舍尔德等。1972年逝世。"
 CBIO_SWE_raoul_wallenberg_desc:0 "拉乌尔·瓦伦贝格（1912年8月4日，生于斯德哥尔摩附近利丁厄—失踪后被宣告死亡），瑞典外交官，二十世纪最著名的人道主义英雄之一。出身瑞典最显赫的瓦伦贝格银行家族。早年在美国密歇根大学学习建筑学，后因家族安排转向商业，在南非及海法从事贸易。1944年7月他受瑞典政府及美国战争难民委员会委派，以瑞典驻布达佩斯使馆一秘身份前往匈牙利，利用外交豁免权大规模签发瑞典“保护护照”，建立数十处“瑞典之家”庇护所，以惊人的个人勇气——多次当面对抗纳粹官员甚至闯入火车站从遣送列车上抢人——营救了数万名匈牙利犹太人免于被送往奥斯维辛灭绝。1945年1月苏军攻入布达佩斯后，瓦伦贝格被苏联军方带走，此后杳无音讯。苏方后称他于1947年死于卢比扬卡监狱，但其命运至今仍是历史悬案。瑞典于2016年正式宣告其死亡。"
 CBIO_SWE_rickard_sandler_desc:0 "里卡德·桑德勒（1884年1月11日—1964年10月12日），瑞典社会民主党政治家，曾任首相（1925—1926年短暂在任）及外交大臣（1932—1939年）。在汉森内阁中长期主管外交事务，1939年冬季战争爆发后，他主张瑞典对芬兰提供更积极的军事援助——这一立场与政府的严格中立政策冲突，导致他于1939年12月被迫辞去外交大臣职务，由无党派的克里斯蒂安·云特接替。此后他虽仍活跃于社民党内部，但未再担任核心政府职务。1964年逝世。"
 CBIO_SWE_sven_hedin_desc:0 "斯文·安德斯·赫丁（1865年2月19日，生于斯德哥尔摩—1952年11月26日，卒于斯德哥尔摩），瑞典著名探险家与地理学家，因在中亚及西藏的大规模考察而成名，同时因其公开的亲德、亲纳粹政治立场而备受争议。1890年代至1930年代他先后四次深入中亚腹地探险，发现了楼兰古城、绘制了塔里木盆地及喜马拉雅山脉的详细地图。在政治上，他从一战起即坚定亲德，二战期间更公开为纳粹德国辩护，多次访问德国并会见希特勒及纳粹高层。他甚至在1942年古斯塔夫五世生日宴会上发表亲纳粹演说，令瑞典政界尴尬。他的政治立场使他在战后遭到瑞典社会的广泛唾弃。1952年逝世。"
 CBIO_SWE_sven_linderot_desc:0 "斯文·哈拉尔德·林德罗特（1889年10月8日，生于东约特兰省谢德维—1956年4月7日），瑞典共产党（莫斯科派）领袖。原姓拉尔松，1918年改姓林德罗特。1914年加入社民党，1917年左翼分裂时加入左翼社会民主党（即后来的瑞典共产党）。1921年赴莫斯科为共产国际工作。1929年瑞典共产党发生决定性分裂时，他与胡戈·西伦一道站在共产国际一边，将占党员多数的希尔布姆-弗吕格派开除出党。此后林德罗特接替被开除的弗吕格出任党主席（1929—1951年），在其领导下共产党虽规模不大但始终忠实追随莫斯科路线，二战期间坚持反法西斯统一战线立场。战后因冷战中瑞典共产党的亲苏立场遭到社会排斥，1951年他本人亦在党内权力斗争中被替代。1956年逝世。"
 CBIO_SWE_sven_olov_lindholm_desc:0 "斯文·奥洛夫·林霍尔姆（1903年2月8日—1998年4月26日），瑞典国家社会主义运动的头号领袖。1933年1月他脱离比里耶·富鲁戈德的纳粹组织，自行创建国家社会主义工人党（NSAP），后改名“瑞典社会主义联盟”（SSS），公然模仿纳粹德国的组织形式与意识形态，包括反犹太主义与种族理论。他曾被古斯塔夫五世国王邀入王宫。其组织虽在瑞典选举中从未获得重大突破，但在1930—1940年代初对瑞典政治光谱构成了不容忽视的极端侧翼。战后他逐渐退出政治活动。值得注意的是，晚年（1970—1980年代）他公开否定了自己此前的反犹立场，承认纳粹大屠杀的真实性并称其为犯罪，转而支持左翼和平运动。1998年逝世。"
 CBIO_SWE_tage_erlander_desc:0 "塔格·弗里乔夫·埃兰德（1901年6月13日—1985年6月21日），瑞典社会民主党人，1946年汉森猝逝后出任首相，执政长达二十三年（1946—1969年），是瑞典历史上任期最长的首相。出身贫寒，在隆德大学受教育后投身政治，1932年当选议员。1944年入阁任不管部大臣，1945年转任教育大臣。1946年汉森去世后意外当选党魁及首相（由外交大臣翁登代理首相至他就任）。在任期间他主导了“瑞典模式”福利国家的全面扩展——全民医保、九年义务教育、养老制度改革及大规模公共住房建设，同时在冷战中推行不结盟中立政策。以务实温和、自嘲幽默的政治风格著称。1969年主动让位于奥洛夫·帕尔梅。1985年逝世。"
 CBIO_SWE_thorwald_bergquist_desc:0 "托瓦尔特·博格奎斯特（1899年12月1日，生于耶夫尔堡省内韦尔舍—1972年12月3日），瑞典人民党（自由派）政治家。法学出身，1931年起在瑞典法院系统任职，同年出任议会第二议庭秘书。1933年起出任韦斯特罗斯市长。此后进入国家政治舞台，在联合政府及人民党内担任要职，是瑞典“1945年一代”知识分子中兼具理性主义文化观及经历过一战世代烙印的代表人物之一。1972年逝世。"
 CBIO_SWE_torsten_friis_desc:0 "托尔斯滕·弗里斯，瑞典空军将领，诺登许尔德的前任。在瑞典空军独立初期担任首任空军总监（约1926—1931年），为空军独立建制奠定了组织基础。1942年最高统帅托内尔曾力劝已退休的弗里斯继续留任。"
 CBIO_SWE_ture_nerman_desc:0 "图勒·内尔曼（Ture Nerman，1886—1969）是瑞典诗人、记者兼反纳粹左翼活动家，素食者与禁酒主义者。1917年参与社民党左翼分裂，此后投身共产主义运动，曾赴革命后的俄国，1931—1937年任国会第一院议员。因反对尼尔斯·弗吕格将党转向亲纳粹，他于1939年重新加入社民党。同年秋创办并主编反纳粹周报《纵然如此》，刊名取自李卜克内西遇害前所写的“Trotz alledem!”，以尖锐笔触抨击纳粹暴行及瑞典允许德军过境的做法，1942年发行量峰值达约六万六千份；他因反希特勒言论于1939年冬被判监禁三个月，报纸也屡遭查禁。他还是受尊重的诗人与译者。1946—1953年再任国会议员。1969年逝世。"
 CBIO_SWE_zeth_hoglund_desc:0 "塞特·赫格隆德（1884年11月29日—1956年8月13日），瑞典早期左翼社会主义及共产主义运动元老。1917年他是社民党左翼分裂的领导者之一，与希尔布姆、弗吕格等人一道创建左翼社会民主党（后改名共产党），成为该党首任主要领导人之一。然而1924年他因与共产国际产生路线分歧而率一批追随者退出共产党，另组独立共产党，不久后即回归社民党。此后他在社民党内重新获得地位，当选议员并长期活跃于工运与新闻出版领域。他的政治轨迹——从社民党分裂到共产党、又从共产党回归社民党——是瑞典左翼运动反复分裂与重组的缩影。1956年逝世。"
 CBIO_SWI_adolf_brunner_desc:0 "阿道夫·布伦纳（1901年6月25日—1992年2月15日），苏黎世人，瑞士作曲家、教会音乐家、记者、哲学家与人文主义者，对瑞士冷战时期的政治与文化生活影响深远。对社会中弥漫的冷漠感到不安，他投身圣哥达同盟，先在州一级、1942年起在全国层面出任该同盟执行主席，协助会长特奥菲尔·施波里分担事务。在同盟内他重启了此前于1936年受挫的老年及遗属保险（AHV）立法倡议，由同盟出资完成的前期研究获得各党派认可，最终促成该制度于1947年经公投通过设立。1948年底他受邀筹建苏黎世电台的政治时事部门，主持长达十二年，创办至今仍是瑞士最受欢迎广播节目之一的《时代回声》，秉持客观全面报道、为宪法框架内各政治派别提供平等发声空间的理念。1950年他以邀请合唱指挥参观排练为名获得签证进入民主德国，走访柏林、莱比锡、蔡茨、茨维考等地，将与当地民众及统一社会党官员交流的观感、以及与马歇尔计划扶持下西德重建的对比写成多篇广播报道。作为作曲家及教会音乐改革者，他被认为是二十世纪瑞士归正宗教会音乐最重要的革新者之一。1992年在塔尔维尔逝世。"
 CBIO_SWI_adolf_furrer_desc:0 "其一为阿道夫·富雷尔（1873—1958），瑞士著名兵器设计师，联邦兵工厂工程师，主持研制富雷尔系列步枪及1925式轻机枪等制式装备，对两战间瑞士军队制式武器现代化贡献显著。其二为阿道夫·富雷尔（1897年12月9日—1978年2月10日），索洛图恩州德伦丁根人，师范学校毕业，1918—1933年任格伦兴小学教师，1933年起任格伦兴市镇长直至1960年，1935—1963年代表社会民主党任联邦国民院议员。"
 CBIO_SWI_albert_meyer_desc:0 "阿尔贝特·迈耶（1870年3月13日—1953年10月22日），苏黎世州自由激进党籍联邦委员，曾任《新苏黎世报》主编。1897年获博士学位后短暂任苏黎世市财政秘书，同年转入《新苏黎世报》编辑部，主管商业版，1915年起任总编辑直至1930年。1907—1927年任苏黎世市议会议员，1915年当选国民院议员，1923—1929年任自由激进党全国主席。1929年12月经四轮投票当选联邦委员，1930年起先主管内政部门，1934年转任财政关税部门。作为财政部长，他反对瑞士法郎贬值，但在1936年联邦委员会多数决定下（其本人时任联邦主席）被迫接受贬值。他致力于推动联邦财政的长期性改革，但最终只促成了一项临时性方案，1938年底卸任联邦委员。此后淡出政坛，1953年在苏黎世逝世。"
 CBIO_SWI_august_lindt_desc:0 "奥古斯特·鲁道夫·林特（1905年8月5日—2000年4月14日），伯尔尼人，药剂师兼巧克力制造商之子（林特巧克力家族近亲），瑞士律师、记者与外交官。伯尔尼及日内瓦大学攻读法律，1927年获博士学位。1929—1940年从事银行职员及驻外记者工作。1940年他与汉斯·豪萨曼、马克斯·魏贝尔等人共同创立军官同盟，随后又参与创建其民间后继组织全国抵抗行动，坚决反对任何向纳粹德国妥协迁就的倾向。1941—1945年任军队与家园宣传处新闻处处长。1945—1946年任红十字国际委员会驻柏林特别使团代表。1946年11月起转入联邦政治部，先任驻伯尔尼新闻发言人，后任驻伦敦使馆参赞。1952年主持联合国儿童基金会执行委员会，1953年主持国际鸦片会议。1953—1956年任瑞士常驻联合国观察员（1955年起升任全权公使）。1956年主持瑞士出席国际原子能机构章程会议代表团。1956—1960年出任联合国难民事务高级专员（继任第二任高专），任内主导应对匈牙利十月事件、阿尔及利亚战争等难民危机，推动难民署职能从欧洲扩展至全球。此后历任瑞士驻美国（1960—1962年）、苏联（1966—1969年）大使。1968—1969年受瑞士政府委派代表红十字国际委员会主持尼日利亚—比夫拉内战救援行动，后因与尼日利亚政府关系恶化遭驱逐。此后再任驻蒙古、印度、尼泊尔大使，1973—1975年任卢旺达总统顾问。1987年仍在瑞士参与反对收紧庇护法的公民运动。2000年在伯尔尼逝世。"
 CBIO_SWI_benno_schaeppi_desc:0 "本诺·海因里希·舍皮（1911年11月24日—1988年8月26日），圣加仑出生，自幼父母双亡、在教养院长大，阵线运动核心骨干及武装党卫队军官。1932年在苏黎世完成商校学业。1936—1938年任国民阵线全国宣传部长兼沙夫豪森阵线派报纸《边境信使报》编辑。1938年与阿尔弗雷德·灿德尔共同创立更极端的亲纳粹团体忠诚邦联联盟，此后多次被捕。1939年因替德国从事经济与政治情报活动被判监禁四个月。1941年起为大德意志瑞士人联盟骨干成员，同年3月加入武装党卫队并被派往东线，1942—1944年主持斯图加特的瑞士志愿者接待站全景之家，1944年在巴特特尔茨党卫队军官学校完成军官培训，同年10月晋升党卫队少尉，指挥第三日耳曼党卫装甲军的宣传连。战争结束后被美军俘虏两年，经非纳粹化审查于1947年获释，同年主动向瑞士当局自首，在卢塞恩联邦刑事法院受审，与里德韦格同案，因危害邦联独立、泄露军事机密及为外国从事兵役被判处十六年徒刑，经两次复审后于1956年提前获释并被遣送至联邦德国，1955年已取得德国国籍。此后任驻巴黎记者及出版社代表，1988年在埃克恩弗尔德逝世。"
 CBIO_SWI_carl_jacob_burckhardt_desc:0 "卡尔·雅各布·布尔克哈特（1891年9月10日—1974年3月3日），巴塞尔望族出身，法学家之子，历史学者、散文家、外交官。1918年获历史学博士学位，1918—1922年任瑞士驻维也纳使馆随员，期间与作家胡戈·冯·霍夫曼斯塔尔结为至交。1929年任苏黎世大学历史学教授，1932年起兼任日内瓦国际问题高等研究院教授。1923年他首次代表红十字国际委员会赴土耳其探视希腊战俘，1933年成为该委员会委员，1935、1936年曾以此身份视察德国境内的集中营。1937年2月经国际联盟任命，出任受《凡尔赛条约》约束、处于国联监管下的但泽自由市高级专员，任内周旋于纳粹化已基本完成的但泽当局与国联之间，1939年8月11日曾亲赴上萨尔茨堡与希特勒会晤，试图为危局寻求和平出路，未能阻止战争爆发。1941年他出任红十字国际委员会与红十字会联盟联合救济委员会主席，同年12月赴英国经济作战部谈判，为红十字会争取到部分放宽海上封锁、便利战俘及平民救济物资运送的安排。1944年12月他当选红十字国际委员会主席（1945年1月起就任），同时兼任瑞士驻巴黎公使（1945—1949年）。他延续了委员会一贯的审慎路线，未就纳粹种族屠杀发表公开谴责，仅限于依循传统方式提供有限援助，这一立场后来成为历史学界持续检视与批评的焦点。1948年卸任红十字国际委员会主席。1974年在沃州万泽尔逝世。"
 CBIO_SWI_carl_stucki_desc:0 "卡尔（全名卡尔·特奥多尔）·斯图基，又作查尔斯·斯图基（1889年4月24日—1963年2月8日），圣加仑州盖泽瓦尔德人，父系归属伯尔尼州奥腾巴赫（今属林登镇），瑞士外交官，曾任日耳曼语文学者，人称小斯图基以区别于同姓同事沃尔特·斯图基（大斯图基）。他在圣加仑读中学后，赴慕尼黑、柏林及苏黎世大学攻读日耳曼语文学，1914年接替其博士导师担任《瑞士德语词典》编辑，后因一战期间兵役及经费削减被迫于1919年离职。此后受出版社委托编写瑞士德语语法教材，1921年出版，是同类著作中的开创之作。1919年他转入联邦政治部任职，初在新闻处工作，1925—1926年任驻维也纳使馆秘书，1928年起任礼宾司司长兼领事事务负责人，1929年升二等处长，1933年升一等处长，1935年起兼任人事负责人。1942年出任外事司副司长，兼任政治处处长。1946年出任瑞士驻希腊公使，直至1954年底退休。1955年一度被召回，赴朝鲜半岛短期出任中立国监察委员会代理主席，监督朝鲜战争停战协议执行。1959年受托整理有关瑞士二十世纪对外关系（尤其对美关系）的机密文献汇编。1963年在伯尔尼逝世。"
 CBIO_SWI_christian_gasser_desc:0 "克里斯蒂安·加塞尔应为1940年瑞士反纳粹公民抵抗组织圣哥达同盟的创始签署人之一，代表自由派团体非受援者联盟参与联署丹尼斯·德·鲁热蒙执笔的1940年7月22日《告瑞士人民书》，与他共同署名的还有沃尔特·阿尔格韦尔、罗伯特·艾贝尔等人，该同盟旨在对抗战败气氛与纳粹宣传、捍卫瑞士联邦制及独立传统。"
 CBIO_SWI_clara_thalmann_desc:0 "克拉拉·塔尔曼，巴塞尔工人家庭出身，瑞士无政府主义者与西班牙内战参战者。她早年加入瑞士共产党，后因同情托洛茨基的左翼反对派及倾向西班牙无政府工团主义而于1929年与其伴侣保罗·塔尔曼一同被开除党籍，转而投身共产党反对派运动。1932年起任沙夫豪森《工人报》编辑。1936年夏，她作为工人游泳俱乐部代表前往巴塞罗那参加为抗议柏林奥运会而举办的人民奥林匹克，因西班牙内战爆发赛事取消，她随即投身街垒战斗，后加入杜鲁蒂纵队赴阿拉贡前线作战，是该纵队中为数不多的外籍女性战斗员之一。1937年5月巴塞罗那五月事件中，她与马统工党（POUM）民兵一同卷入巷战，据记载曾与在场的英国作家乔治·奥威尔同处一个屋顶据点。事件后她与丈夫一度试图乘船逃离西班牙，被西班牙共产党方面逮捕关押，经国际社会主义工人联盟斡旋后获释，转赴法国。二战期间她在法国参与地下抵抗活动，协助隐藏犹太难民及地下革命者。战后移居尼斯附近，1987年在当地逝世。"
 CBIO_SWI_eduard_von_steiger_desc:0 "爱德华·冯·施泰格尔（1881年7月2日—1962年2月10日），伯尔尼世家出身，农民、工商、公民党籍联邦委员，律师。1940年12月当选联邦委员，1941年起主管司法警察部门直至1951年，两次出任联邦主席（1945、1951年）。任内他主导瑞士战时的国家安全与难民政策，对犹太难民等群体持限制性立场。1942年8月13日，联邦委员会决定关闭边境，规定仅因种族原因而寻求庇护者一律不予接纳，此决定作出时瑞士当局已获悉纳粹在东欧对犹太人的系统性屠杀；同年8月30日，他在苏黎世-厄利孔向新教青年团体青年教会发表演讲，以救生艇作比喻为该政策辩护，称指挥一艘已严重超载、给养有限的小艇者，即便无法救起海难中呼救的所有人，也仍不失人道，这番讲话后来被概括为救生艇已满一语，成为瑞士战时难民政策最具争议的象征。该政策在其任内曾几度松紧调整，并非始终如一，但历史学界普遍认为其造成了本可避免的悲剧。1951年底卸任联邦委员，1962年在伯尔尼逝世。"
 CBIO_SWI_enrico_celio_desc:0 "恩里科·切利奥（1889年6月19日—1980年2月23日），提契诺意语区天主教保守派政治家，记者与律师出身，曾任《人民与自由报》主编。1913年起长期任提契诺州大议会议员，1932年进入州政府主管教育与警察部门。1940年2月22日当选联邦委员，接替去世的莫塔，主管邮电铁路部门直至1950年，两次出任联邦主席（1943、1948年）。他在任内以推动民用航空事业发展见长，战后瑞士民航业迅速起步与其任内的政策支持有关。作为继莫塔之后第二位来自提契诺的联邦委员，他在战时也承担了维系瑞士意大利语区与联邦整体认同的象征角色，尤其是在瑞士毗邻的意大利陷入法西斯统治、局势敏感的年代。政治上的挫折曾使他一度感到党内及新闻界支持不足。1950年10月辞去联邦委员职务后出任瑞士驻罗马公使，1955年卸任，此后退出公职，1980年在卢加诺逝世。"
 CBIO_SWI_ernest_beuin_desc:0 "埃内斯特·贝甘（1879年2月6日—1966年4月18日），纳沙泰尔人，律师出身，瑞士自由激进党资深政治家。纳沙泰尔、巴塞尔及巴黎攻读法律，1904年获律师资格，1905年即出任纳沙泰尔州民事法庭庭长。1907—1916年任纳沙泰尔州大议会议员，1909—1918年任纳沙泰尔市议会议员并兼任该州检察官。1918—1942年任纳沙泰尔州政府委员，主管司法警察部门，任内推动多项立法改革，包括1922年《反不正当竞争法》、1925年司法体系改革及1927年州警察法。1912—1939年任联邦院（参议院）议员，1935年出任联邦院议长。1934—1940年出任瑞士自由激进党全国主席。1920年起兼任《新苏黎世报》驻纳沙泰尔通讯员。退休后主持纳沙泰尔归正会教务评议会。1966年在纳沙泰尔逝世。"
 CBIO_SWI_ernst_laur_desc:0 "恩斯特·费迪南德·劳尔（1871年3月27日—1964年5月30日），巴塞尔人，医院管理者之子，成长于虔诚宗教家庭。1886年入苏黎世施特里克霍夫农业学校，1888年获文凭，此后在法国及莱茵瑙精神病院庄园实习，1890年起入苏黎世联邦理工学院攻读农学，1893年以全年级仅两名瑞士学生之一的身份获农艺工程师文凭。1896年在莱比锡大学获哲学博士学位。1898年出任新设立的瑞士农民秘书处首任负责人，同时兼任1897年成立的瑞士农民协会总干事，后升任会长（总干事职务后改称主任），两职均任至1939年，长达四十余年，是两战间瑞士公共生活中最具影响力的人物之一，人称农民博士。1901年起在联邦理工学院兼任农业政策编外讲师，1908—1937年任农业经营学正教授。他主导创立瑞士农民协会的统计与会计调查体系，为该协会的政策游说提供数据支撑，并著有多部被译为多种语言的农业经营学教科书，在两战间东欧新独立国家中亦被奉为对抗大地产制、扶植自耕农经济的典范。他是瑞士即农民这一民族保守主义农本意识形态的主要鼓吹者，将其与精神国防运动相勾连，主张通过统购统销及保护性关税维护农民阶层生存空间，同时以农场账簿等经营现代化手段推动农业向企业化转型。1904—1945年任联邦委员会贸易协定谈判代表，直接参与制定瑞士关税政策。1937年因严重事故辞去教授职务，1939年辞去秘书处职务，迁居阿尔高州埃芬根。1948—1950年任新成立的欧洲农业联盟首任主席。1964年在埃芬根逝世。"
 CBIO_SWI_ernst_nobs_desc:0 "恩斯特·诺布斯（1886年7月14日—1957年3月15日），伯尔尼农家出身，长期在苏黎世担任社民党报纸《人民权利报》编辑，一战末期属于党内左翼，曾因发表颠覆性言论被军事法庭判处监禁四周，并卷入1918年全国大罢工的领导层。此后他的立场逐渐转向温和改良主义，接受国防政策，与阶级斗争路线保持距离。1935年起任苏黎世州政府委员，1942年出任苏黎世市长。1943年在《赫尔维蒂革新》一文中阐述了将瑞士建成社会民主国家的构想。同年12月15日，他当选联邦委员，成为社会民主党历史上第一位联邦委员，主管财政关税部门直至1951年，1949年出任联邦主席。任内他致力于推动联邦财政改革，但该方案在1950年遭到议会及舆论反对而搁浅。尽管已是联邦委员，联邦国家安全机构仍对他保持监控档案，记录持续至1948年。1951年底卸任，1957年在梅伦逝世。"
 CBIO_SWI_ernst_wetter_desc:0 "恩斯特·韦特尔（1877年8月27日—1963年8月10日），苏黎世州自由激进党籍联邦委员，经济学者出身，曾任苏黎世大学教授并长期在联邦经济部门与工商促进机构任职。1938年12月当选联邦委员，接替阿尔贝特·迈耶主管财政关税部门直至1943年底，1941年出任联邦主席。任内他对军方频繁的经费需求及对德国的清算贷款持谨慎态度，但1943年仍在联邦委员会一致决定下同意瑞士国家银行购入德国黄金（部分为纳粹掠夺所得）。他主张对新闻界采取更大程度的克制，并在皮莱-戈拉与阵线运动代表团接触一事上有所斡旋。1941年联邦主席任内，他在瑞士建国650周年纪念活动上呼吁国民团结坚持。1943年底卸任联邦委员后重返商界，曾任瑞士人寿保险公司及瑞士铝业公司董事长等职，1963年在苏黎世逝世。"
 CBIO_SWI_etienne_primault_desc:0 "艾蒂安·普里莫（1904年5月5日—1984年11月30日），伯尔尼州科尔莫雷人，钟表匠兼酒店业主之子，纳沙泰尔大学政治学专业出身，曾任联邦航空局及瑞士航空俱乐部秘书。1930年转入军旅，在空军及防空部队任教官军官兼军事飞行员，二战期间（1930—1944年）他的身份主要是教官与飞行员，而非空军最高指挥官——二战时期空军及防空部队的实际指挥官先后是汉斯·班迪（1936—1943年在任）与弗里茨·里纳（1944—1952年在任）。1945—1952年他升任科长，1946年晋上校，1953年晋师长，同年起出任空军及防空部队总指挥（武器长）直至1964年，由此成为战后瑞士空军现代化及幻影战斗机采购的主要负责人，曾在1957年国防委员会秘密会议上公开谈及以幻影携带核武器打击苏联纵深的设想，反映出当时瑞士军方曾认真考虑发展核打击能力。1964年幻影项目严重超支引发丑闻（幻影事件），他因此被解职，后经联邦法院查明其个人无过错。1984年在苏黎世逝世。"
 CBIO_SWI_eugen_bircher_desc:0 "欧根·比歇尔（1882年2月17日—1956年10月20日），阿尔高州阿劳人，外科医生、军官与政治人物。他在巴塞尔及海德堡攻读医学，1915—1916年赴保加利亚战地医院积累战地外科经验，1917—1934年任阿劳州立医院外科主任、1932年起兼任院长，以甲状腺、胃部、膝关节及战伤外科研究知名，被公认为膝关节镜检术的创始人之一。1919年他创立带有准军事及秘密社团性质、与境外法西斯团体有联系的瑞士祖国联盟，并借助1931—1937年出任瑞士军官协会主席及1934—1942年主编官方军事报纸的身份，使该联盟在军官阶层中颇具影响力。1934年晋升少将，1934—1942年先后指挥第4、第5师，与联邦委员鲁道夫·明格尔同为两战间推动瑞士扩军备战的主要倡导者，与皮莱-戈拉、莫塔、冯·施泰格尔、埃特、斯坦普夫利、韦特尔等联邦委员私交密切。他寻求瑞士与纳粹德国建立紧密关系，苏德战争爆发后，他与瑞士驻柏林公使弗勒利歇尔合作，借瑞士红十字会名义于1941—1943年间组织四批瑞士志愿医疗队奔赴德军东线战场救治伤员，行动经费主要来自瑞士大企业私人捐款，他本人曾多次随队亲赴前线；参与人员事后发现在不知情下已被置于德国军事管辖之下，部分医疗队成员还目击了德军对平民及战俘的暴行。1942年他当选国民院议员，同年在议会公开反对接纳犹太难民。1956年在阿劳逝世。"
 CBIO_SWI_franz_riedweg_desc:0 "弗朗茨·里德韦格（1907年4月10日—2005年1月22日），卢塞恩富裕酒店业主家庭出身，医学博士，二战期间武装党卫队中军阶最高的瑞士人。他在伯尔尼、罗斯托克与柏林学医，1933—1935年间参加国民阵线，1936—1937年任前联邦委员让-马里·穆西的秘书及反共产主义行动顾问，1937—1938年参与制作反共宣传片《红色瘟疫》。1938年迁居德国并加入党卫队，同年迎娶德国陆军元帅维尔纳·冯·布隆贝格之女西比勒，借此深度融入纳粹精英圈层与普鲁士贵族网络，晋升至党卫队一级突击队大队长，是二战期间军阶最高的瑞士籍党卫队成员。他以军医身份随党卫队阿道夫·希特勒警卫旗队参加波兰战役及法国战役，1941年在柏林党卫队总部创建日耳曼总局，负责招募欧洲日耳曼血统志愿者加入武装党卫队，并在斯图加特设立全景之家作为瑞士志愿者接待站。1944年他被调往东线担任军医。1945年被美军俘虏，后转由英军拘押至1948年。1947年12月瑞士联邦刑事法院缺席判处其十六年徒刑，罪名为叛国，但瑞士政府始终未提出引渡请求。他此后终生未再返回瑞士，定居慕尼黑行医至2005年去世，始终未对其纳粹历史表示悔意。"
 CBIO_SWI_friedrich_wahlen_desc:0 "弗里德里希·特劳戈特·瓦伦（1899年4月10日—1985年11月7日），伯尔尼州埃门塔尔地区人，农学家，苏黎世联邦理工学院博士，曾在加拿大从事农业研究多年。1929年起任苏黎世-厄利孔农业试验站站长，1943年起兼任联邦理工学院植物栽培学教授。1938—1945年任联邦战时粮食局农业生产处处长，是瑞士二战时期耕作运动的主要设计者与执行者，通过大规模扩大耕地面积、动员城市空地及公园种植粮食作物，推动瑞士粮食自给率大幅提升，成为战时瑞士家喻户晓的公众人物。战后他先后在联合国粮农组织任职，1958—1959年任副总干事。1958年底当选联邦委员，1959年起先后主管司法警察、经济、政治（外交）等部门，1961年出任联邦主席，任内推动欧洲自由贸易联盟的建立及瑞士对第三世界的技术援助。1965年卸任联邦委员，此后主持联邦宪法全面修订筹备工作，1985年在伯尔尼逝世。"
 CBIO_SWI_fritz_platten_desc:0 "弗里茨·普拉滕（1883年7月8日—1942年4月22日），圣加仑人，瑞士共产主义运动的核心创建者之一，锁匠出身，青年时期曾参与1906年里加的第一次俄国革命并被监禁，后逃回瑞士。他长期活跃于苏黎世工人运动，1917年最广为人知的事迹是组织流亡瑞士的列宁经德国乘封闭列车返回俄国，促成其参与随后爆发的十月革命；他本人也随行至俄国，并于1918年1月列宁遇刺未遂事件中因用身体护住列宁而负伤。1918年他是瑞士全国大罢工的组织者之一。1919年他在莫斯科参与共产国际的创建，是主席团成员之一。1921年他成为瑞士共产党创党成员，曾短暂出任国民院议员。1923年移居苏联，在当地建立农业合作社，后于莫斯科外语学院任教。1927年他因同情苏共党内反对派而受到猜忌，此后被边缘化。1938年在大清洗中被捕，1939年被判处四年劳改，监禁于阿尔汉格尔斯克附近的劳改营，1942年4月22日（列宁诞辰纪念日）被处决。1956年苏联为其平反。"
 CBIO_SWI_georg_von_trapp_desc:0 "格奥尔格·约翰内斯·冯·特拉普（1880年4月4日—1947年5月30日），生于达尔马提亚海岸城市扎拉（今克罗地亚扎达尔），奥匈帝国海军军官之子，是电影《音乐之声》中特拉普上校的原型人物，其真实生平与瑞士并无史实关联。他就读于阜姆（今里耶卡）海军学院，1900年参与镇压义和团运动期间因表现获勋，1908年转入新组建的奥匈潜艇部队。一战期间，他先后指挥U-5、U-14两艘潜艇在亚得里亚海及地中海执行多次战斗巡航，击沉包括法国装甲巡洋舰莱昂·甘必大号在内的两艘军舰及十一艘协约国商船，总吨位逾四万七千吨，是奥匈帝国海军史上战绩最卓著的潜艇指挥官，获颁最高等级的玛丽亚·特蕾西娅军事勋章。1918年晋海军少校，战争结束前出任卡塔罗潜艇基地司令。一战后奥地利成为内陆国、不再需要海军，他随即退役。1922年发妻阿加特病逝，留下七名子女；1927年他续娶家庭教师玛丽亚·库切拉。1930年代经济大萧条中家产大部亏损，全家转而以歌唱演出维生。1938年德奥合并后，他拒绝了纳粹德国海军提供的军职，携全家出走美国，后定居佛蒙特州斯托。1947年在美国病逝。"
 CBIO_SWI_giuseppe_motta_desc:0 "朱塞佩·莫塔（1871年12月29日—1940年1月23日），提契诺意语区人，天主教保守派政治家。1911年12月当选联邦委员，任职近28年直至在任上去世，是瑞士联邦委员任期第三长者。1912—1919年主管财政关税部门，1920—1940年主管政治部（相当于外交部），先后五次出任联邦主席。他是瑞士加入国际联盟的主要推动者之一，1920年协助促成加入公投通过，1924年出任国联大会主席，长期是瑞士两战间外交政策的主导者。对内他是反共产主义的坚定代表，推动瑞士在1934年反对苏联加入国联；对意大利，他倾向维持友好关系，1935年意大利入侵埃塞俄比亚后，瑞士仅象征性执行国联制裁，1936年瑞士率先事实承认意大利对埃塞俄比亚的吞并。对纳粹德国，他试图在维护瑞士独立与避免刺激柏林之间寻求平衡，1938年后转而重申中立原则。1940年1月在伯尔尼任上病逝。"
 CBIO_SWI_hans_hausamann_desc:0 "汉斯·豪萨曼（1897年3月6日—1974年12月17日），阿彭策尔人，摄影师之子，私营情报机构哈氏办公室（BüroHa）创办人。一战期间任中尉，战后成为激进的反左翼人士，积极倡导加强国防。1925年创办哈萨曼摄影公司，在圣加仑及苏黎世设分店及冲印实验室，并开创瑞士首个邮购业务，借此建立起服务于新闻界的资讯网络。他曾任军队教学电影处负责人，1936年前任瑞士军官协会新闻处处长，并主持了1935年成功促成延长兵役期公投的宣传运动。对纳粹德国，他起初一度抱有好感，后转为坚决反对。1936年总参谋部派其赴柏林普鲁士军事学院受训。1935年起他将原有的新闻服务逐渐转向军事情报搜集，1939年9月在阿彭策尔州托伊芬正式建立哈氏办公室（伪装为剪报社），战时该机构隶属于情报处处长罗杰·马松麾下，同时豪萨曼本人也与国防部长卡尔·科贝尔特及吉桑将军保持越级直接联系。1939年起，鲁道夫·勒斯勒经其助手转达情报，成为该机构最重要的情报来源之一。1938年起任社民党国防政策顾问。1940年他是军官同盟核心成员之一，该团体主张即便联邦政府投降也要继续抵抗德军入侵，后遭吉桑将军解散并施以纪律处分；同年他又参与创建其民间后继组织全国抵抗行动。1946年哈氏办公室解散后，他重返本行经营摄影企业，并在圣加伦高等商业学校讲授二战军事史，1973年获该校名誉博士。1974年在奥尔塞利纳逝世。"
 CBIO_SWI_hans_oehler_desc:0 "汉斯·厄勒（1888年12月18日—1967年1月7日），阿尔高州维尔德埃格人，哲学博士，记者与出版人，瑞士两战间亲德右翼舆论的重要塑造者。他在慕尼黑、格勒诺布尔、莱比锡、柏林及苏黎世攻读哲学、历史及艺术文学史，1913年获博士学位。1918—1920年在周刊《自由之言》上反对《凡尔赛条约》体系及国际联盟。1921年他参与创立并主编《瑞士政治文化月刊》，该刊自创刊起即走亲德路线，是反对国联的瑞士独立人民同盟的机关刊物。1923年他在苏黎世与来访的希特勒有过一面之缘。1929—1930年，他在厄勒俱乐部聚集了一批对现状不满的学院青年，这批人后来发展为新阵线运动的雏形，他本人虽是苏黎世民主党成员，仍于1931年加入新阵线。1932年成为国民阵线创始成员之一。因其刊物日益沦为阵线运动的理论喉舌，1934年被刊物董事会解职，同年另办《瑞士民族小册》与原刊竞争，内容延续亲纳粹立场并试图规避明文禁令，该刊直至1946年停刊。1940年他参与慕尼黑召集瑞士各亲纳粹派系领袖的会议。1947年联邦法院以叛国罪判处其两年徒刑。战后他仍活跃于极右翼刊物，1967年在迪尔斯多夫逝世。"
 CBIO_SWI_hans_oprecht_desc:0 "汉斯·奥普雷希特（1894年7月19日—1978年6月21日），苏黎世社会民主党籍工会与政界领袖，曾任小学教师，1918年获苏黎世大学法学博士学位。1921—1931年任瑞士市政与国家雇员联合会（后更名公共服务人员联合会VPOD）主席，此后长期担任该会总书记直至1946年，同时1928—1946年任瑞士工会联合会执行委员。1925年当选国民院议员，连任至1963年。1933年参与创办跨党派反法西斯刊物《民族报》。1936年，在围绕军费信贷问题的党内路线之争后，他接替因此下台的伯尔尼派领导层，当选社民党主席直至1952年，主导该党在二战期间及战后融入瑞士协商民主体制的进程。1940年他参与创立全国抵抗行动组织。战时及战后他积极参与营救难民及流亡文化人士的工作。1951年诺布斯辞任联邦委员时，他曾与马克斯·韦伯竞逐党内提名，最终败给后者。1946年后他还长期担任《谷登堡藏书会》及瑞士广播电视协会主席等职，1978年在恩布拉赫逝世。"
 CBIO_SWI_henri_guisan_desc:0 "亨利·吉桑（1874年10月21日—1960年4月7日），沃州梅济耶尔人，医生之子，瑞士二战期间的将军（General），这一军衔仅在战时由联邦议会推选产生，他是瑞士历史上第四位、也是迄今最后一位获此军衔者。1894年投身军旅，历任炮兵、步兵及总参谋官职，1921年晋准将，1927年晋师长，1932年晋军长，达到和平时期瑞士军队的最高军衔。1939年8月30日，面对战争阴云，联邦议会以204票对21票选举他为将军，授权其捍卫国家独立与领土完整。他重视与部队及民众的直接接触，大量出巡部队、注重士气激励，与他的一战前任乌尔里希·维勒将军的疏离作风形成对比，因而在民众中享有极高声望。1940年法国败降后，他推行国家堡垒（Réduit）战略，将军队主力撤入阿尔卑斯山区，并于同年7月25日在吕特利草地召集600余名高级军官发表吕特利报告，阐明该战略并号召坚决抵抗，成为瑞士战时精神抵抗的标志性事件。他本人对墨索里尼一度心存好感，视其为反共产主义的屏障，1943年3月还曾与党卫队将领瓦尔特·舍伦贝格秘密会晤，寻求德方承诺不会入侵瑞士，这一举动战后引发一定争议。1945年8月他卸任将军。1960年逝世时，包括众多身着军装的老兵在内，三十万人为其送葬。"
 CBIO_SWI_herman_obrecht_desc:0 "赫尔曼·奥布雷希特（1882年3月26日—1940年8月21日），索洛图恩州自由激进党籍联邦委员。1935年4月当选，主管经济部门直至1940年。他被称为瑞士战时经济体制的奠基人，推动1939年6月全民公投通过的《加强国防与解决失业法案》，为战时物资调配与军工生产建立法律基础，并在1940年为服役军人设计了工资补偿制度，后来成为瑞士社会保障体系的重要先声。1939年3月他在巴塞尔发表演讲，针对德国吞并奥地利后的紧张局势，以强硬措辞警告谁若侵犯我们的独立与领土完整，战争在等着他，瑞士人不会率先向外邦朝圣，这番讲话在民众中引发广泛共鸣，使他成为瑞士战时坚持独立立场的象征人物之一。同时他也长期与瑞士索洛图恩军工企业有商业关联，该企业二十年代曾向奥地利、匈牙利出口违反《圣日耳曼条约》限制的武器，这一角色与其公开的强硬爱国形象形成对照。1940年6月因健康原因辞去联邦委员职务，同年8月在伯尔尼去世。"
 CBIO_SWI_jakob_huber_desc:0 "雅各布·胡贝尔（1883年11月1日—1953年3月11日），阿尔高州约嫩人，农民之子，曾在温特图尔学习化学工程，并先后在阿劳、苏黎世及法国从事化学工作，又自学测量学在突尼斯、埃及从事测量员工作。1911年转入军旅任教官军官，1913年被派往德国斯德丁的第38炮兵团见习。此后历任师参谋长、旅长、军参谋长、圣莫里斯要塞司令等职，1937年任总参谋部后方及要塞事务处处长，年底出任副总参谋长。1939年11月他因不满时任总参谋长雅各布·拉布哈特否决其改革方案，向吉桑将军请求调职；吉桑遂将拉布哈特调任新组建的第4军军长，任命胡贝尔为代理总参谋长，1940年3月23日转为正式任命，一直任职至1945年。他与性情外向、善于交际的吉桑形成互补，以沉默寡言、深谋远虑著称，被公认为二战期间仅次于吉桑本人的最重要瑞士军事人物。1940年底晋升为军长（联邦级最高军衔之一）。1953年在布里恩茨逝世。"
 CBIO_SWI_jakob_labhart_desc:0 "雅各布·拉布哈特（1881年1月28日—1949年8月6日），图尔高州施特克博恩人，曾在柏林夏洛滕堡及慕尼黑高等工业学院深造，1905—1916年任炮兵教官，期间于1907—1908年赴普鲁士兰炮兵团受训，深受德式军事传统影响。此后历任军团参谋部运输科科长、团长、旅长、军参谋长等职，1936年出任总参谋长，晋升为军长。任内他一手主导瑞士秘密化学武器计划的筹建工作——该计划由联邦委员鲁道夫·明格尔于1937年2月私下下令、未告知其余联邦委员，以规避瑞士1932年已批准的《日内瓦议定书》。他因欣赏德国国防军的方法和体制而与吉桑将军产生摩擦，尤其是未被告知吉桑与法方进行的秘密总参谋部会谈。1940年初吉桑将其调离总参谋长职务，改任新组建的第4军军长（该职务他一直担任至1947年），原总参谋长一职名义上仍挂在其名下，实际总参谋工作则由胡贝尔代行。1949年在西格里斯维尔逝世。"
 CBIO_SWI_jakob_schaffner_desc:0 "雅各布·沙夫纳（1875年11月14日—1944年9月23日），巴塞尔出生，巴塞尔乡村州人，幼年丧父，母亲随情人出走美国，他在巴登州博伊根的一所严苛的虔敬派孤儿院中长大，这段经历成为其代表作《约翰内斯》（1922年）的素材。少年时期学做鞋匠，此后作为帮工游历荷兰、比利时、法国等地，开始写作。1911年定居德国，先后居住柏林近郊夏洛滕堡及魏玛，以长篇小说《约翰内斯》系列确立文坛地位，并因刻意采用北德语言习惯以摆脱瑞士方言痕迹而自诩为全德意志人。他对犹太教及基督教均持强烈批判态度。1933年希特勒攫取政权后，他将其视为美好未来的开端，此后日益深陷纳粹意识形态，1936年参与瑞士国民阵线活动直至1938年，与罗尔夫·亨纳、汉斯·厄勒一同退出后曾短暂加入更极端的忠诚邦联联盟。他多次为纳粹机关刊物撰稿，1936年在柏林大学生面前演讲时，竟在讲台上摆放瑞士国旗并行纳粹举手礼致意听众，其对故国与纳粹德国的态度始终充满矛盾。1940年曾短暂回瑞士与联邦主席皮莱-戈拉私下会晤。1944年9月在斯特拉斯堡遭盟军轰炸身亡，遗体运回瑞士巴塞尔乡村州故乡布斯安葬，葬礼遭到当地民众大规模抗议。"
 CBIO_SWI_jean_de_muralt_desc:0 "让·德·穆拉尔特，沃州法语区世家出身，律师，自由激进党籍国民院议员。他是1924年由日内瓦律师泰奥多尔·奥贝尔发起的国际反共产主义协约在瑞士政界的重要支持者与联络人：1931年他在联邦国民院内组织起一个反布尔什维主义议员小组，成员包括沃州议员亨利·瓦洛东、皮埃尔·罗沙等人，借此协助该跨国反共组织在瑞士议会内建立影响力。该组织与日内瓦检察机关、联邦警察负责人海因里希·罗特蒙德等保持密切的情报交流关系，并与红十字国际委员会有人员交叉。"
 CBIO_SWI_johann_august_sutter_desc:0 "约翰·奥古斯特·祖特尔，生于巴登藩国坎德恩（今属德国），祖籍瑞士巴塞尔乡村州吕嫩贝格，瑞士裔美国拓荒者、加州殖民者。他早年在瑞士经商及从军，1834年因经营纺织品生意破产、面临牢狱之灾，抛下妻子及五名子女只身出走北美，化名约翰·奥古斯都·祖特尔上尉（冒充曾为拿破仑战争流亡的瑞士近卫军官）。历经辗转，1839年抵达墨西哥治下的加利福尼亚，获总督阿尔瓦拉多批准在萨克拉门托河与美利坚河交汇处定居垦殖，命名新赫尔维蒂亚（即新瑞士），并受托兼任当地治安官，负责遏制盗马及冲突。1841年建成祖特尔堡，成为加州中央谷地第一个永久性欧洲人定居点的经济中心，鼎盛时期雇用及役使大量米沃克、迈杜、尼森南等原住民部落成员及夏威夷劳工建设、维护堡垒。1848年1月24日，他雇佣的木匠詹姆斯·马歇尔在为其建造锯木厂（祖特尔磨坊）时于河床发现金屑，消息外泄后引发举世闻名的加州淘金热。淘金热非但未使祖特尔获利，反而使其事业彻底崩溃：工人纷纷弃工淘金，大批淘金者及侵占者涌入其领地，劫掠牲畜、破坏产业，美国法院其后又裁定其墨西哥时期地契无效，1852年他宣告破产。此后他移居羽毛河畔的霍克农场，1864年获加州议会批准发放养老金，1865年住宅遭纵火焚毁，1871年迁居宾夕法尼亚州利蒂茨，余生多次赴华盛顿国会请愿求偿未果，1880年在华盛顿逝世。近数十年来，史学界对其经营中的原住民奴役及殖民暴力有更多批判性反思，其历史形象已从传统意义上的开拓者英雄转变为更具争议的殖民者。"
 CBIO_SWI_johannes_baumann_desc:0 "约翰内斯·鲍曼（1874年11月27日—1953年9月8日），外阿彭策尔州人，自由激进党籍联邦委员，律师出身。1905年起任州政府委员，主管军事与警察部门，曾多次出任州长；1911—1934年任州议会代表。1934年3月当选联邦委员，主管司法警察部门直至1940年，1938年出任联邦主席。他在任内积极推动为对抗纳粹主义而巩固瑞士民主团结，支持社会民主党人进入联邦委员会的主张。但其司法警察部门的外国人政策也引发争议，他任内曾容忍德国当局在护照上加盖J字戳记以标识犹太人持有者，这一做法此后被认为与其民主自由捍卫者的自我定位存在明显矛盾。1940年底卸任联邦委员，退出政坛后仍活跃于多个企业董事会及瑞士国家银行理事会，1953年在故乡赫里绍因心脏病发作逝世。"
 CBIO_SWI_karl_kobelt_desc:0 "卡尔·科贝尔特（1891年8月1日—1968年1月5日），圣加仑州自由激进党籍联邦委员，土木工程师出身，曾主持联邦水利事务并任圣加仑州建设部门负责人。1940年12月当选联邦委员，1941年起主管军事部门直至1954年，两次出任联邦主席（1946、1952年）。他在二战期间的多数时间里，处于极受民众爱戴、握有战时特殊权力的吉桑将军的阴影之下，两人关系较为疏远、甚至存在猜忌，军政协调主要通过联络军官居中传递。战后他主持瑞士国防体系向机动防御军的转型，推动军队组织与装备现代化，包括1951年军备计划，但这一转型过程中他在议会与舆论中始终未能完全摆脱各方的政治与个人保留态度。1954年底卸任联邦委员，1968年在伯尔尼逝世。"
 CBIO_SWI_lucien_tronchet_desc:0 "吕西安·特龙谢，瑞士无政府工团主义活动家，日内瓦工运的标志性人物。他早年当过面包学徒，后转做泥瓦工，1922年因拒服兵役被判监禁二十天，期间结识自由派无政府主义者路易·贝托尼，同年参与重建泥瓦工与力工独立工会。1926年他加入木材建筑业工人联合会（FOBB），此后长期担任该会日内瓦分会秘书，以激进的无政府工团主义手法组织罢工与抗争闻名，包括1928年泥瓦工大罢工及1935年针对贫民窟住房的直接行动。1932年11月9日日内瓦反法西斯示威遭军队开枪镇压，他的兄弟皮埃尔·特龙谢在事件中受伤。1936年西班牙内战爆发后，他与贝托尼一同前往巴塞罗那声援西班牙全国劳工联盟（CNT），此后在瑞士国内组织前进小组，向西班牙无政府工团主义者输送武器、资金与物资。1940年因拒服兵役再度被判入狱八个月。二战后他逐渐淡出无政府主义运动核心圈，1949年基于策略考虑加入日内瓦社会党，但本人始终自认为无政府工团主义者。"
 CBIO_SWI_marcel_pilet_golaz_desc:0 "马塞尔·皮莱-戈拉（1889年12月31日—1958年4月11日），沃州法语区人，自由激进党籍联邦委员。1928年12月当选联邦委员，历任邮电铁路部门负责人，1940年3月接替病逝的莫塔主管政治部（外交），同年出任联邦主席。1940年6月25日，法国对德停战次日，他以联邦主席身份发表广播讲话，呼吁国民适应新形势，讲话未提及抵抗武装中立独立等惯用词语，在德语区激起强烈不满，被普遍解读为向轴心国妥协的信号，尽管讲话内容事先经全体联邦委员审阅通过。此后他被视为战时对德绥靖的象征性人物，与同年吉桑将军在吕特利草地重申抵抗意志的强硬立场形成鲜明对比。1940年秋接见鼓吹瑞士并入第三帝国的瑞士民族运动代表团，进一步招致舆论抨击。1944年因斡旋恢复瑞士与苏联外交关系失败，在压力下于当年年底辞去联邦委员职务。此后淡出政坛，1958年在洛桑逝世。"
 CBIO_SWI_max_leo_keller_desc:0 "马克斯·莱奥·凯勒（1897年8月22日—1956年2月13日），苏黎世人，电气工程师，政治经济学博士，瑞士阵线运动后期最具影响力的极端亲纳粹人物之一。1918年起在瑞士与美国从事电气工程工作，1931年获博士学位，1932—1939年任伯尔尼州新兴产业推广局局长。1933年起为法西斯性质的国民阵线担任经济政策撰稿人，1938—1939年出任亲阵线的《新巴塞尔报》董事会主席。1940年法国败降后，他与同志们期待右翼势力借势崛起（所谓第二次阵线之春），同年创立瑞士民族运动（NBS），意图整合分裂的阵线各派系，该运动一度获纳粹副元首鲁道夫·赫斯支持，并要求瑞士与纳粹德国建立更紧密关系、取缔资产阶级报刊、退出国联，凯勒因此在德国被视为最具影响力的瑞士纳粹分子。1940年9月他与该运动其他领导人曾获联邦主席皮莱-戈拉正式接见。1940年11月该运动被联邦委员会取缔。1941年6月因非法活动被捕，后因证据不足获保释，同年11月出走德国，出任赫尔曼·戈林国营工厂驻柏林及魏玛的董事，1944年试图统合海外瑞士纳粹团体。战后返回瑞士，因泄露军事机密及危害瑞士独立，先后两次审判合计被判处十四年徒刑，1956年在比尔门斯多夫逝世。"
 CBIO_SWI_max_petitpierre_desc:0 "马克斯·佩蒂皮耶雷（1899年2月26日—1994年3月25日），纳沙泰尔州法语区人，自由激进党籍联邦委员，法学家，曾任纳沙泰尔大学国际私法教授。1937年起进入纳沙泰尔州大议会，1942—1944年任州议会代表。1944年12月当选联邦委员，主管政治部（外交）长达十六年直至1961年，三次出任联邦主席（1950、1955、1960年）。他接任时瑞士的中立立场因战时对德关系而在盟国间声誉受损，他借助1946年恢复与苏联外交关系及签署《华盛顿协定》稳定了瑞士在战后初期的国际处境，并在冷战格局下确立了以中立与团结为核心的外交路线，主张瑞士不加入军事同盟，但通过人道主义参与、技术援助及斡旋冲突的斡旋服务体现国际团结，他反对瑞士加入联合国、欧洲委员会及欧洲经济共同体。1961年6月卸任联邦委员后，曾任红十字国际委员会委员，1994年在纳沙泰尔逝世。"
 CBIO_SWI_max_waibel_desc:0 "马克斯·魏贝尔（1901年5月2日—1971年1月20日），巴塞尔商人之子，二战期间瑞士情报军官，1923年获政治学博士学位。1927年起任卢塞恩驻地教官军官，1935年调入总参谋部，1938年赴柏林军事学院受训，1939年战争爆发后返回瑞士，主持设于卢塞恩里吉的情报收集站。1940年他是军官同盟创始成员之一，曾一度与副手一同被捕，后获释，同年底晋少校。他最广为人知的事迹发生在1945年春：凭借与美国战略情报局驻伯尔尼负责人艾伦·杜勒斯的私交，他成为德军驻意大利党卫队总指挥卡尔·沃尔夫与杜勒斯之间秘密接触的关键中间人与安排者，促成双方于1945年3月8日在苏黎世首次会晤，史称日出行动。此后数月间，他多次安排、陪同双方在卢塞恩、阿斯科纳等地举行秘密会谈，最终促成德军在意大利北部于1945年4月29日签署投降书，5月2日正式停火。历史学家埃德加·邦儒尔认为，日出行动使欧洲战事提前六至八周结束，并使意大利北部丰富的文化遗产免遭德军焦土战术破坏。战后联邦委员会以其未经授权行事为由对其表示不满，并对其相关报告实施长期出版禁令。1953年他晋升师长。晚年因担任一家私人银行董事长、该行于1970年破产而深感自责，1971年1月以佩枪自尽于卢塞恩。"
 CBIO_SWI_max_weber_desc:0 "马克斯·韦伯（1897年8月2日—1974年12月2日），苏黎世社会民主党籍联邦委员，财政学者与工会活动家，同时期还有一位社会学家也叫这个名字。他1919年在日内瓦大学获博士学位，同年加入社民党。1926年起任瑞士工会联合会秘书及经济事务研究员，与汉斯·奥普雷希特一同推动工会与党的政策从阶级斗争路线转向改良主义。1934年，他在党内反对声中提出凯恩斯主义色彩的危机倡议，1935年公投遭否决。1935—1940年历任建筑木业工会中央书记、主席，1940—1951年任瑞士消费合作社联合会专职主席。1948年获伯尔尼大学社会政策与合作社学编外教授职位。1951年12月接替诺布斯当选联邦委员，主管财政关税部门，任命之初因其1931年曾因拒服兵役被判监禁八天并被逐出军队而在右翼阵营引发争议。他精心筹备的联邦财政改革方案兼顾直接税与间接税的社会平衡，却在1953年12月6日的全民公投中被否决，他随即于1954年1月辞去联邦委员职务，此后重返伯尔尼大学任教，1974年在伯尔尼逝世。"
 CBIO_SWI_oskar_bider_desc:0 "奥斯卡·比德（1891年7月12日—1919年7月7日），巴塞尔乡村州朗根布鲁克人，布商之子，原本立志务农，曾在阿根廷当过一年高乔牧人。1912年11月赴法国波城的布莱里奥飞行学校学习飞行，一个月后即取得瑞士第32号国际飞行员执照。1913年1月他首次飞越比利牛斯山脉，7月13日（其22岁生日次日）驾驶仅70马力的布莱里奥XI单翼机从伯尔尼起飞，在多莫多索拉中途加油后飞抵米兰，完成人类首次完整飞越阿尔卑斯山脉主脊的壮举，飞行高度达3457米，创下当时的瑞士飞行高度纪录，归国后获联邦委员会赠予金表，一举成为举国瞩目的英雄人物。一战期间他自带私人飞机编入瑞士飞行部队，1915年出任首席飞行教官，1917年破格晋升中尉。战争结束后，他转向民用航空，1919年6月21日完成一次搭载两名乘客、历时七个半小时的环瑞士飞行，并参与筹建民用航空旅游公司至星（AdAstra）。1919年7月7日凌晨，在结束通宵聚饮后，他于杜本多夫机场进行特技飞行表演时坠机身亡，年仅27岁；当天他的妹妹莱尼·比德闻讯后自尽，兄妹二人合葬于故乡朗根布鲁克。事故调查未发现飞机故障，后世研究者依据多名目击者证词及其精神状态，倾向认为这是一起蓄意的自我坠机，但官方结论迟至数十年后才逐步为人所知。"
 CBIO_SWI_philip_etter_desc:0 "菲利普·埃特，楚格州天主教保守派政治家。1934年3月以43岁当选联邦委员，主管内政部长达25年直至1959年退休，四次出任联邦主席（1939、1942、1947、1953年）。他被公认为精神国防理念的主要倡导者与塑造者，借助1939年苏黎世Landi39国家博览会等场合，将强调瑞士文化独特性与民主价值的思想动员为一场全国性运动，并推动建立文化基金会瑞士文化基金会及罗曼什语被确立为第四种国家语言。1940年6月25日，他负责将皮莱-戈拉的广播讲话译为德语并朗读播出，因翻译与措辞问题也被卷入该讲话引发的争议。战时他主管新闻审查，对纳粹德国采取谨慎克制的态度，其思想中曾流露出对威权体制的某种认同，并在1933—1934年阵线之春时期的若干言论，后来被历史学界认为带有反自由主义与排犹倾向的色彩，但他本人始终反对建立法西斯式的等级国家。战后他在扩建联邦理工学院、创立瑞士国家科学基金会及推动残疾人保险（IV）方面留下重要建树。1977年在伯尔尼逝世。"
 CBIO_SWI_robert_eibel_desc:0 "罗伯特·艾贝尔（1906年6月7日—1986年5月26日），沃州韦维人，乐器商人之子，童年在斯特拉斯堡度过，苏黎世大学法学博士（1931年），自由激进党籍政治人物、公关业先驱。1933年秋苏黎世市自由激进党与国民阵线达成联合名单协议时，他任该党秘书；这层间接关联曾在1979年出版的《不安分的爱国者》一书中被用以暗示其思想倾向，但瑞士联邦法院在其提起的名誉权诉讼（载于BGE111II209号判决）中认定，仅凭这一事实及其一次出席民族与家园联盟活动的经历，不足以将其定性为阵线思想的追随者。二战期间他实际担任吉桑将军私人参谋秘书处主任，并是1940年圣哥达同盟的共同发起人之一，该同盟是一个反纳粹宣传、捍卫瑞士独立与民主价值的公民运动。1947年他开设公关事务所，承接企业及政治宣传业务，是民族重建行动等经济自由主义团体的重要推手，长期倡导激进的自由市场理念。1963—1975年任国民院议员（自由激进党）。1986年在苏黎世逝世。"
 CBIO_SWI_robert_grimm_desc:0 "罗伯特·格里姆（1881年4月16日—1958年3月8日），苏黎世州瓦尔德人，印刷工出身，瑞士社会民主党元老级人物。1909—1918年任《伯尔尼守望报》主编，1915、1916年分别组织齐美尔瓦尔德会议与基恩塔尔会议，召集反对一战的国际社会主义者，并因此与列宁相识，但两人在革命策略上分歧明显、关系紧张。1917年他卷入格里姆-霍夫曼事件（涉嫌斡旋德俄单独媾和），一度受挫。1918年初他发起成立奥尔滕行动委员会，同年11月作为该委员会主席发出全国大罢工的号召并领导罢工，军队随后大规模动员予以镇压。1919年4月军事法庭以煽动哗变罪判处他六个月监禁。此后他转向温和路线，1920年代主导社民党拒绝加入第三国际，导致党内革命派出走另立瑞士共产党；1935年他作为主要执笔人参与制定放弃无产阶级专政、承认国防必要性的新党纲，使社民党逐步具备执政资格。他1911—1943年任伯尔尼州社民党主席，1938—1946年任伯尔尼州政府委员（首位社民党籍），1946年出任国民院议长。尽管声望崇高，他终生未能进入联邦委员会。1958年在伯尔尼逝世。"
 CBIO_SWI_robert_tobler_desc:0 "罗伯特·托布勒（1901年12月22日—1962年6月17日），苏黎世人，律师之子，法学博士，瑞士阵线运动的核心人物，也是该运动唯一一位曾进入联邦议会的成员。1930年他参与创建新阵线，1933年该组织与国民阵线合并。1934—1938年任苏黎世市议会议员，1935—1939年任州议会及国民院议员，是国民阵线在联邦层面唯一的国民院议席持有者。他主办党报《阵线报》，该报获得纳粹德国的资金支持。1938年1月他接替罗尔夫·亨纳出任国民阵线全国领袖，试图寻求与主流政界的某种妥协，但为时已晚，该运动已被普遍视为亲纳粹组织。1938—1939年地方选举中该党丧失全部议席，1939年不再参与国民院选举。1940年春他因涉嫌为德国从事间谍活动、非法越境德国而被短暂逮捕，案件后因证据不足而撤销，同年国民阵线解散。此后他执掌其后继组织联邦集结直至该组织于1943年遭联邦委员会取缔。1947年苏黎世州高等法院因其政治历史禁止其在该州执业律师，1948年联邦法院撤销该判决，他得以恢复律师职业，此后未再涉足政治，1962年在苏黎世逝世。"
 CBIO_SWI_roger_masson_desc:0 "罗杰·马松（1894年7月1日—1967年10月19日），生于苏黎世，归属沃州韦托镇，二战期间瑞士军事情报处处长。1915年任步兵少尉，1922年任步兵上尉，1927年起任总参谋部军官，1928—1930年在苏黎世联邦理工学院及巴黎高等军事学院深造。1931年起主编《瑞士军事评论》直至1967年去世，1935年兼任联邦理工学院军事学科讲师。1936年底出任总参谋部第5处（情报处）负责人，着手重建两战间几近荒废的情报体系；1938年将民间哈氏办公室（汉斯·豪萨曼创办）纳入情报体系，情报处人员从1938年5人增至战时高峰约120人。1942—1945年兼任副总参谋长。战时他主导了一条颇具争议的秘密联络渠道：1942年起通过中间人与党卫队保安处高官瓦尔特·舍伦贝格建立联系，1943年促成吉桑将军与舍伦贝格两次秘密会晤，意图借此向德方传达瑞士坚决抵抗的决心，并借舍伦贝格之力营救被盖世太保逮捕的瑞士情报人员莫尔盖利。1945年战后联邦当局对其展开行政调查，主审的联邦法官库什潘最终认定，除了与一名纳粹军官保持联系外，无法归咎他其他过错。1967年在洛桑逝世。"
 CBIO_SWI_rolf_henne_desc:0 "罗尔夫·亨纳（1901年10月7日—1966年7月22日），沙夫豪森人，法学博士，执业律师，瑞士阵线运动早期最重要的领导人之一。他早年曾主张瑞士与苏联接近及纳粹党与德国工会结成联盟，1933年退出自由激进党。受希特勒在德国夺权成功的鼓舞，他在沙夫豪森州组建新阵线，1933年州议会候补选举中获得27%选票。1934年2月他出任统合后的国民阵线全国领袖，该运动是瑞士两战间最具影响力的法西斯主义政党，鼎盛时期约有九千名成员。他主导该党于1936年正式表态效忠国家社会主义意识形态，1937年赴纽伦堡出席纳粹党代表大会。因其与纳粹德国过从甚密、公开鼓吹《锡安长老会纪要》等极端立场，在党内引发反弹，1938年被迫辞去党魁职务，由较温和的罗伯特·托布勒接任。此后他退出一线政治，但1940—1943年间仍主编阵线运动刊物《民族小册》。战后他转入新闻剪报行业，1944年接手苏黎世一家剪报服务社，1948年与国际同业合并，1966年在库斯纳赫特逝世。"
 CBIO_SWI_rudolf_minger_desc:0 "鲁道夫·明格尔（1881年11月13日—1955年8月23日），伯尔尼州农民出身的政治家，农民、工商、公民党（BGB，今瑞士人民党前身）创始人之一。1918年发起创建该党伯尔尼州分支并任主席，1919年当选国民院议员，1927年任国民院议长。1929年12月当选联邦委员，成为该党首位联邦委员，主管军事部门直至1940年，1935年出任联邦主席。任内他直言德国军事扩张带来的威胁，力主加强瑞士国防建设，与其继任者吉桑将军私交甚笃，友谊持续至去世。他在1938年也曾就列支敦士登在纳粹德奥合并后的安全处境向联邦委员会提出关切，并支持向列支敦士登开放边境劳务以削弱德国影响力。1940年任满后卸任联邦委员，回归农业与合作社事务，曾任伯尔尼州经济与公益协会主席及瑞士农民协会等团体要职，1955年在故乡许普芬逝世。"
 CBIO_SWI_rudolf_roessler_desc:0 "鲁道夫·勒斯勒，生于德国考夫博伊伦，新教徒，坚定的反纳粹人士，二战期间在瑞士运作的露西（Lucy）间谍网核心人物。一战期间曾任志愿兵参战，战后在奥格斯堡及柏林从事戏剧评论与文化新闻工作，与托马斯·曼等文化名流有交往，1928年出任柏林舞台人民同盟总秘书。1933年纳粹上台后，他以难民身份流亡瑞士，定居卢塞恩，创办小型出版社新生活出版社，出版流亡作家作品，1937年被纳粹德国剥夺国籍。1939年经中间人引荐，他开始向汉斯·豪萨曼的哈氏办公室提供来自德国的情报，每月经中间人转交八十至一百三十份报告，来源始终未予公开，据信部分源自德军统帅部内部反纳粹人士。1942年夏起，他的情报经另一条渠道也直接流向由匈牙利裔苏联情报人员亚历山大·拉多主持的苏联在瑞士间谍网（即红色三人组，隶属红色乐队情报体系），塔斯社代号露西，他提供的情报以详尽准确著称，涵盖德军东线部署及作战决策，对斯大林格勒战役及库尔斯克战役期间苏方决策产生重要参考价值。1943年秋该苏联间谍网遭瑞士联邦警方破获，多名成员被捕，勒斯勒本人因情报仍对瑞士自身有价值而未受株连。1944年5月因德方向瑞士施压，他一度被捕，1945年10月被判有罪，但鉴于其对瑞士的贡献而未被处罚。战后生活拮据，以自由撰稿为业，1958年在瑞士克林斯逝世。"
 CBIO_SWI_saly_mayer_desc:0 "绍伊（又译萨利）·迈耶（1882年6月3日—1950年7月31日），巴塞尔出生，幼年随家迁居圣加仑，瑞士犹太纺织实业家、犹太社群领袖。1907年与其兄马克斯在英国合伙创办纺织品出口公司，1911年兄长因意外身故后返回圣加仑独自经营并扩大业务。1930年取得圣加仑市民权，1933年加入自由激进党并当选市议员。1929年起义务出任瑞士以色列社群联合会（SIG）秘书，1936—1943年任该会主席，任内该会加入世界犹太人大会。作为成功的国际纺织企业家，他借助商业网络为犹太援助组织建立起隐秘的资金转运渠道，圣加仑因而成为美国犹太人联合分配委员会（JDC，通称联合会）等救援组织向纳粹占领区犹太人及犹太组织输送资金的枢纽。他曾出面接济因协助非法难民入境而被革职的圣加仑警察局长保罗·格林尼格，并与联邦外国人警察负责人海因里希·罗特蒙德保持复杂而暧昧的关系——后者恰是瑞士战时限制性难民政策的主要设计者。1940年起他出任联合会驻瑞士代表，为此在极端保密状态下建立地下网络，通过瑞士犹太社群领袖内森·施瓦尔布与豪萨曼、奥普雷希特等抵抗人士圈子建立联系。1944年8月至9月间，他在圣马格雷滕边境桥多次与党卫队军官库尔特·贝歇尔及匈牙利犹太营救委员会代表拉斯洛·卡斯特纳会面，就人换物资方案与党卫队周旋谈判，虚与委蛇地拖延周旋以争取时间、避免触发盟国外汇管制的红线。战争后期及战后，他利用联合会资金资助犹太难民非法移民巴勒斯坦的行动。1943年他因与瑞士当局过于顺从合作的立场在犹太社群内部引发不满，被迫辞去SIG主席职务。1950年在圣莫里茨逝世。"
 CBIO_SWI_walter_allgower_desc:0 "沃尔特（又作瓦尔特）·阿尔格韦尔（1912年8月18日—1980年4月15日），圣加仑人，刺绣商人之子，外科医生马丁·阿尔格韦尔之兄，瑞士记者与政治人物。维也纳、哥廷根及巴塞尔大学攻读日耳曼语文学、历史及哲学，1937年获博士学位。二战期间在军官同盟及圣哥达同盟中担任领导角色，是1940年7月圣哥达同盟《告瑞士人民书》的联署人之一；因不满该同盟内部日益浓厚的统合主义倾向，不久即退出，转而与神学家卡尔·巴特、沙夫豪森市长瓦尔特·布林戈尔夫等人共同创立立场更加民主的全国抵抗行动，并参与军官同盟策划的应急方案——一旦联邦委员会及吉桑将军对纳粹入侵的抵抗意志不足，该同盟拟采取行动予以纠正。战时及战后，他先后任教官军官、《观察家报》记者及编辑，1949—1956年任《民族报》国内新闻编辑，1956—1977年任《我们建桥者》主编。1950年代初曾属自由激进党，1954年因军事及社会政策立场分歧转投独立联盟（LdU），1954—1966年任巴塞尔市大议会议员，1960—1969年任巴塞尔双州制宪会议代表，1963—1979年任联邦国民院议员，任内积极推动瑞士加入联合国及欧共体，反对组建职业化军队。1980年在巴塞尔逝世。"
 CBIO_SWI_walter_stucki_desc:0 "沃尔特·奥托·斯图基（1888年8月9日—1963年10月8日），伯尔尼人，律师出身，瑞士著名外交官，人称大斯图基以区别于同姓同事卡尔·斯图基（小斯图基）。伯尔尼大学攻读法律及国民经济学，1912年获律师资格，后赴慕尼黑、巴黎、伦敦深造国际法及国际商约法。1917年经联邦委员埃德蒙·舒尔特斯提携，任联邦经济部总秘书，1919—1925年重操律师业，1925年出任经济部贸易司司长，直至1935年主导瑞士对外贸易谈判，1933年获联邦委员会授予公使外交头衔（为非职业外交官中首例）。1938年出任瑞士驻法国公使，1940年法国败降后随维希政府南迁，此后近四年常驻维希，期间还代表英国、美国等已撤离维希的国家利益，并通过秘密走私的短波电台向瑞士当局传递情报。1944年8月19日，他在德军威胁轰炸维希、企图逮捕贝当元帅之际挺身斡旋，说服德军指挥官冯·诺伊布龙将军以体面方式完成逮捕、避免流血冲突，随后又亲赴中央高原与逼近的抵抗组织马基谈判，最终使维希在盟军逼近时未经战斗即被德军放弃，几乎完全避免了针对通敌民众的报复行动。维希市政府授予他荣誉市民称号，并于次年赠以一套二十六件纯银餐具志谢，1957年该市一条街道以他命名。1945年回国后任联邦政治部外事司司长，主导柯里使团谈判，迫使瑞士承诺冻结德国资产、大幅削减对德贸易；后因与新任外交部长马克斯·佩蒂皮耶雷政见不合，1946年改任联邦特使，同年就华盛顿协定与盟国达成妥协，1953年又就德国对外债务达成伦敦协定，此后致力改革瑞士外交官选拔培养制度。1963年在伯尔尼逝世。"
 CBIO_SWI_walther_stampfli_desc:0 "瓦尔特·斯坦普夫利（1884年12月3日—1965年10月11日），索洛图恩州自由激进党籍联邦委员，曾任冯·罗尔铁工厂高级经理。1940年7月18日当选联邦委员，主管经济部门达七年，1944年出任联邦主席。任内正值瑞士被轴心国全面包围、物资供应最为紧张的时期，他通过配给制、战时经济动员及与德意两国的艰难贸易谈判，保障了国内粮食、就业与能源供应，同时尽力维护瑞士在经济上的独立自主。他大力支持弗里德里希·瓦伦主持的瓦伦计划（战时耕作运动）。战争后期，他积极推动建立全国性的老年与遗属保险制度（AHV），1947年该制度经公投通过，他称之为其政治生涯中最大的成就，因而常被称为AHV之父。1947年底卸任联邦委员，此后出任冯·罗尔铁工厂及比伯里斯特造纸厂董事长等职，并长期投身残疾人劳动融入事业。1965年在苏黎世逝世。"
 INS_a_t_van_starkenborgh_stachouwer_desc:0 "阿利迪厄斯·瓦尔莫尔杜斯·兰贝图斯·恰尔达·范·斯塔尔肯博赫·斯塔豪韦尔（1888年3月7日—1978年8月16日）出生于荷兰格罗宁根一个古老贵族世家。早年就读于格罗宁根大学法学专业，毕业后进入荷兰外交系统任职，历任驻哥本哈根、斯德哥尔摩、柏林等地使馆参赞，1925年至1933年出任格罗宁根省省长，1933年至1936年出任驻比利时大使。1936年9月，恰尔达就任荷属东印度总督，是该殖民地末任总督。1940年荷兰本土向纳粹德国投降后，恰尔达在东印度宣布戒严，下令扣押境内德国船只并拘押德国侨民。1941年末日本发动太平洋战争后，东印度防务陷入绝境，1942年3月荷军接受日方无条件投降条件，恰尔达随即被日军俘虏，先后辗转爪哇多地战俘营，最终被押送至中国东北（伪满洲国）战俘营关押，直至1945年8月获苏军解放。战后恰尔达携家人返回荷兰，虽获荷兰女王邀请重返东印度总督之职，但因不愿卷入印尼独立进程的复杂局面而婉拒。1978年8月16日，恰尔达在荷兰逝世。"
 INS_achmad_soebardjo_desc:0 "艾哈迈德·苏巴尔佐（原名阿卜杜勒·马纳夫，Achmad Soebardjo，1896年3月23日—1978年12月15日）出生于西爪哇卡拉旺一个具有亚齐贵族血统的家庭。1919年赴荷兰莱顿大学求学，曾任“印度尼西亚学生协会”主席，长期活跃于欧洲的印尼民族主义活动，1927年参与在布鲁塞尔召开的“反帝国主义与殖民压迫同盟”成立大会。1934年回国后从事律师工作，并与日本军方建立联系，1942年日本占领荷属东印度后加入日方军政机构任职。1945年，苏巴尔佐参与独立筹备调查会工作，协助起草宪法文本，并在8月17日独立宣言的酝酿过程中发挥关键作用，同年9月出任印尼共和国首任外交部长，主持外交部初创工作。此后因政治立场与沙里尔总理相左，1946年卷入一场未遂政变而遭长期监禁。1951年，苏巴尔佐在苏基曼内阁再度出任外交部长，任内签署《旧金山和约》并与美国商谈援助事宜，后因未经内阁同意擅自批准援助条款引咎辞职。此后他继续在外交部任职多年，1957年至1961年出任驻瑞士大使，1978年在雅加达逝世，2009年被追封为印度尼西亚民族英雄。"
 INS_adipati_soejono_desc:0 "潘吉兰·拉登·阿迪帕蒂·阿里奥·苏约诺（1886年3月31日—1943年1月5日）出生于东爪哇杜伦阿贡一个爪哇摄政王世家，毕业于泗水高级中学，通过巴达维亚高等文官考试后进入荷属东印度地方行政系统任职，后出任帕苏鲁安摄政王。1920年，苏约诺获任命为人民议事会（“荷印国会”）议员，此后历经1924、1927、1931年多次连任，并出任该会代表团成员。1930年，他受荷方派遣赴荷兰进修一年，期间作为荷属东印度代表参加日内瓦国际劳工组织大会，就废除强迫劳役问题进行谈判。1934年11月，苏约诺离开人民议事会，移居海牙，代表殖民地事务部出任国际橡胶管制委员会成员。1940年初返回爪哇，接替胡塞因·贾贾迪宁拉特出任荷属东印度参事会成员。1942年日军入侵前夕，苏约诺随胡贝尔·范·穆克一同撤离至澳大利亚；范·穆克其后出任伦敦荷兰流亡政府第二届赫布兰迪内阁殖民地事务大臣，苏约诺遂成为其高级顾问。范·穆克主张战后给予荷属东印度更大自治权，提议擢升苏约诺出任内阁不管部大臣，此议获外交大臣范·克莱芬斯支持，后者认为此举有助于向美国反殖民舆论表明荷方视印尼人为政治平等伙伴。威廉明娜女王起初对任命一名非荷兰籍公民入阁有所顾虑，但最终于1942年6月9日批准苏约诺宣誓就职，成为唯一一位出任荷兰内阁大臣的印尼人，也是荷兰历史上首位穆斯林大臣。任内，苏约诺就战后荷兰与荷属东印度之间的宪制关系向威廉明娜女王进言，1942年10月两度向内阁提交政策简报，指出多数印尼人不会接受战后重返殖民统治，呼吁荷方尊重荷属东印度的自决权利并作出实质性让步，但相关主张未能获得内阁多数支持。1942年12月7日威廉明娜女王发表广播演说，暗示战后荷印关系地位可能调整，被认为部分反映了苏约诺的进言。1943年1月5日，就职仅七个月的苏约诺因心脏骤停猝然离世，享年56岁，安葬于英国沃金穆斯林墓园，荷兰政府及荷属东印度海军印尼籍人员出席葬礼。"
 INS_alauddin_syah_desc:0 "阿拉乌丁·穆罕默德·达乌德沙（1864年—1939年2月6日）是亚齐苏丹国第35任（末代）苏丹，1875年3月4日，年仅7岁的他在故都兰泰翁清真寺加冕即位，继承因霍乱猝逝的阿拉乌丁·马哈茂德沙二世之位，即位初期由摄政曼库布米图安库·哈希姆辅政。达乌德沙在位期间正值荷兰发动“亚齐战争”（1873年爆发）对该苏丹国展开长期军事征服，他与抵抗领袖潘利马波勒姆等人长期在丛林中辗转坚持游击抵抗，曾一度将荷占区压缩至古达拉贾周边仅二十平方公里范围。1890年代，荷军在范·休茨将军指挥下改用“招抚结合镇压”新战术，达乌德沙与潘利马波勒姆被迫持续向西北海岸转移；1901年在巴泰伊利遭遇惨败后，他与部众撤入尚未被荷军踏足的加约高地，但荷方随即派遣以残酷著称的范·达伦少校率领“宪兵队”追剿。1902年，达乌德沙的正室王妃及次年其本人先后被荷军俘获。1903年1月10日，达乌德沙在西吉正式向荷方投降，投降时不着盛装、赤足以示以个人身份而非亚齐国家名义交出佩剑，并当众表示“亚齐的主权属于人民”，拒绝在荷方拟定的正式割让文件上签字。此后达乌德沙被流放亚齐境外，长期客居各地，亚齐苏丹国自此名存实亡，苏丹国体制于1903年后被荷方废除。1939年2月6日，达乌德沙在雅加达逝世，葬于当地拉瓦芒安公共墓地，其毕生反抗荷兰殖民统治的经历，使他被视为荷属东印度全境唯一始终未向荷兰屈膝称臣的传统统治者。"
 INS_amir_sjarifuddin_harahap_desc:0 "阿米尔·谢里夫丁·哈拉哈普（1907年4月27日—1948年12月19日）出生于棉兰一个巴塔克族贵族家庭，皈依基督教，曾赴荷兰莱顿大学求学。1937年，他领导一批年轻马克思主义者创立印度尼西亚人民运动党（Gerindo），为地下共产党活动提供合法外衣。日本占领期间，阿米尔是少数积极组织地下抵抗的印尼政治人物之一，一度因此被日方逮捕，幸赖苏加诺出面斡旋才免于处决。印尼独立后，阿米尔历任新闻部长（1945—1946）及国防部长（1945—1948），1947年7月接替沙里尔出任第二任总理。任内主持与荷兰谈判并签署伦维尔协定，因协定被普遍视为对荷方让步过多而在1948年1月引咎辞职。同年，阿米尔承认自己自1935年起即为印尼共产党秘密党员，此后成为左翼“人民民主阵线”核心人物。1948年9月“茉莉芬事件”爆发，阿米尔卷入其中，事件平息后遭政府军逮捕，同年12月19日未经审判即被处决，终年41岁。"
 INS_andries_cornelis_dirk_de_graeff_desc:0 "安德里斯·科内利斯·迪尔克·德赫拉夫（1872年8月7日—1957年4月24日）出生于荷兰，是荷兰黄金时代显赫的德赫拉夫家族后裔，其父曾任荷兰驻日公使。德赫拉夫早年就读于莱顿大学法律专业，毕业后前往荷属东印度任职，此后历任驻东京（1919—1922）及驻华盛顿（1922—1926）公使等外交要职。1926年至1931年，德赫拉夫出任荷属东印度总督，任内曾尝试推行相对温和的“伦理政策”，力图与温和派民族主义者维持一定合作关系，但收效有限。其任内经历了1926年至1927年印尼共产党发动的反殖民武装起义，起义遭当局迅速镇压，大批共产党人被捕、判刑或流放。卸任总督后，德赫拉夫于1936年至1937年间出任荷兰外交大臣，任内荷兰重申中立外交政策。1957年4月24日，德赫拉夫在荷兰逝世。"
 INS_bonifacius_cornelis_de_jonge_desc:0 "博尼法修斯·科内利斯·德容格（1875年1月22日—1958年6月24日）出生于荷兰海牙一个法律世家。早年就读于乌得勒支大学法律专业，毕业后短暂执业律师，后转入荷兰殖民事务部及战争部任职。1917年，德容格出任科尔特·范·德·林登内阁战争大臣，任内曾短暂兼代海军大臣。1931年，德容格出任荷属东印度总督，任内正值全球经济大萧条，他在紧缩财政开支与地方经济发展诉求之间反复权衡，同时对印尼民族主义运动采取强硬镇压路线，严格限制“人民议事会”权力，大批民族主义领袖（包括苏加诺、哈达、沙里尔等）在其任内遭逮捕流放至博文迪古集中营，原定逐步关闭该集中营的计划亦被他推翻。1933年，殖民当局颁布“野校法令”限制民间私立学校办学自由，引发民族主义阵营强烈反弹，德容格被迫于当年撤回该法令。1936年卸任总督后，德容格返回荷兰，1958年6月24日在海牙逝世。"
 INS_charles_welter_desc:0 "查尔斯·约瑟夫·伊尼亚斯·马利·韦尔特（1880年4月6日—1972年3月28日）出生于荷兰海牙。早年就读代尔夫特印度学院，1902年前往荷属东印度任职，先后在爪哇克杜、北加浪岸等地担任驻扎官助理，1908年调任巴达维亚总秘书处，1921年出任总秘书，是总督身边最核心的行政幕僚之一。1924年，韦尔特出任荷属东印度参事会成员，1925年首度出任荷兰殖民地事务大臣，惟任期仅数月即因内阁垮台而卸任；此后重返参事会，1929年起出任副主席。1931年韦尔特返回荷兰，曾主持财政紧缩委员会。1937年，韦尔特再度出任殖民地事务大臣，任内于1938年主导否决“苏塔尔乔请愿”——该请愿曾要求荷兰召开帝国会议、逐步给予荷属东印度自治地位，韦尔特在国会发言中明确表示“我的时代不属于伟大的改革者”，主张维持现状、渐进发展。1940年荷兰本土沦陷后，韦尔特随流亡政府迁往伦敦继续任殖民地事务大臣，1941年因与首相赫布兰迪就盟军轰炸荷兰本土目标问题产生分歧而辞职。战后韦尔特长期活跃于荷兰国会，对荷兰政府的印尼政策持续提出批评，1972年3月28日在海牙逝世。"
 INS_christian_willhelm_bodenhausen_desc:0 "克里斯蒂安·威廉·博登豪森（1869年6月24日—1966年4月8日）出生于荷兰吕伐登。早年任职荷兰税务部门，曾任阿姆斯特丹市税务局局长，此后被派往荷属东印度任职，历任殖民地行政官员，后出任荷属东印度参事会成员及副主席。1939年，博登豪森短暂出任荷兰第五届科林内阁财政大臣，惟该届内阁存续仅约三日即告垮台。作为参事会副主席期间，博登豪森与迈耶·兰内夫特一同应对1930年代大萧条造成的经济危机以及日益迫近的日本威胁等重大殖民地治理难题。1966年4月8日，博登豪森在荷兰布卢门达尔逝世，享年96岁。"
 INS_dewa_geg_desc:0 "伊达·伊·德瓦·阿贡·格德·奥卡·格格出生于巴厘岛克伦孔王国王室分支塞马拉巴瓦宫，是克伦孔王族成员。1908年荷兰军队发动“普普坦”（玉碎战）攻打克伦孔王国时，他是极少数在战斗中幸存的王室成员之一，身负重伤后被当地德詹派村民救起，旋即遭荷兰殖民当局俘获并救治，此后被流放龙目岛长达二十年之久。返回巴厘后，奥卡格格于1929年被荷方拥立为克伦孔王国新任国王，加冕仪式在格尔格尔达萨布瓦纳神庙举行。1938年，荷属东印度当局将他与巴厘岛其余七位地方统治者的地位提升为正式“自治统治者”（“拉惹”）。1949至1950年印尼建国统一进程中，巴厘诸邦“拉惹”体制逐步被撤销，但奥卡格格个人仍受地方尊崇，继续为巴厘地区的文化与社会事务作出贡献。1964年，奥卡格格逝世，“克伦孔大王”这一王室称号自此断绝，其后人此后仅以摄政官身份延续家族在克伦孔地方事务中的影响力。"
 INS_dick_de_hoog_desc:0 "弗雷德里克·赫尔曼努斯·“迪克”·德·霍赫出生于安汶，是荷属东印度海军荷兰籍雇员之子及印欧混血（“印欧”/Indo）母亲之子，他本人也是荷属东印度印欧混血群体的代表性政治领袖。父亲早逝后，德·霍赫凭共济会奖学金完成学业，16岁即以优异成绩从泗水高级中学毕业。他先在泗水任文书，19岁加入国营铁路公司，数年内升任货运总站站长，1905年出任荏磅站长，惟因当时殖民地高级职位多保留给受荷兰本土教育者而遇晋升瓶颈。1914年，已婚的德·霍赫在友人资助下赴荷兰求学，1916年从莱顿大学毕业，次年携妻取道美国返回东印度，在巴达维亚出任国营铁路公司总经理助理，1922年调任日惹首席官员，1925年晋升万隆一等督察。与此同时，德·霍赫投身“印欧联盟”（IEV）政治活动——这是当时印欧混血群体争取权益的最重要组织，由卡雷尔·扎尔贝格于1919年创立。德·霍赫1920年加入该联盟理事会，1922年任副主席，1923年出任其在人民议事会（“荷印国会”）的代表，1927年当选负责该会日常事务的“代表团”成员，遂辞去铁路公司职务全身投入政治工作。1929年，德·霍赫成为印欧联盟唯一一任主席，当年即成功吸纳近1.5万名会员，人称“大老板”。1930年，他出任人民议事会代表团副主席及该会副议长，印欧联盟在其领导下发展为议会最大政治派系。德·霍赫致力于团结印欧社群各阶层，推动殖民地本地居民公民权利及荷属东印度自治进程，惟受制于殖民当局的保守立场，包括废除印欧混血群体土地所有权限制及殖民地自治等核心诉求始终未能实现。1938年，印欧联盟为庆祝德·霍赫任主席十周年设立以其名字命名的社会基金，彼时他声望正隆，获赠“印欧联盟无冕之王”及“印欧将军”等美誉。惟其健康状况随后急转直下，历经多次心脏衰竭后，1939年1月3日因中风逝世，享年57岁，其死讯为荷属东印度及荷兰本土头版新闻，万隆葬礼场面盛大，以纪念他为印欧混血群体权益所做出的毕生贡献。"
 INS_dirk_reinhard_adelbert_van_langen_desc:0 "迪尔克·赖因哈德·阿德尔贝特·范·兰亨（通称Rein van Langen，1898年生于荷属东印度中爪哇一带，出身世代服役荷属东印度皇家陆军（KNIL）的军人世家）。他在荷兰布雷达皇家军事学院完成军官教育后返回东印度服役。印尼独立战争期间（1945—1950），范·兰亨出任“老虎旅”旅长，1948年12月荷兰发动第二次“警察行动”期间，他率部主攻共和国临时首都日惹，直接指挥了俘获苏加诺、哈达等印尼共和国领导人的军事行动，是该战役中荷方最具争议的指挥官之一——战后有退役军官暗示其部队在行动中曾有不留俘虏、就地处决的情况，但相关指控因保密协议长期未获证实。1949年至1950年，范·兰亨出任KNIL总参谋长，负责主持该军队解散前的收尾工作。1950年7月25日，他与荷方驻印尼武装力量总司令布尔曼·范·弗雷登中将一同获苏加诺总统在默迪卡宫接见，举行正式告别仪式；次日（7月26日）KNIL依王室谕令正式解散，结束近120年建制史，范·兰亨在此仪式上晋升少将军衔，是这支殖民军队历史终结时刻的见证者之一。晚年范·兰亨的家族历史因其外孙、荷兰历史学者及电视节目主持人汉斯·胡德库普所著传记《最后一人》（2012年）及系列纪录片《印度尼西亚在呼唤》而重新引发公众关注与反思，该系列作品追溯了范·兰亨在印尼独立战争期间的角色及其部队被指涉入战争罪行的历史争议。"
 INS_djatikoesoemo_desc:0 "贾蒂库苏莫（1917年7月1日—1992年7月4日）出生于中爪哇梭罗，是梭罗苏南（苏丹）帕库布沃诺十世的次子，出身传统王室贵族家庭。他早年接受荷式教育，印尼独立战争期间投身国民军建设工作，凭借军事组织才能崭露头角。1948年至1949年，贾蒂库苏莫出任印度尼西亚陆军首任参谋长，负责建军初期陆军力量的整合与规范化工作，是建国初期军方高层核心人物之一。荷兰承认印尼独立后，贾蒂库苏莫转入外交领域，1958年至1960年出任印尼驻新加坡大使。2002年，贾蒂库苏莫被追封为印度尼西亚民族英雄，以表彰其在建军初期的贡献。"
 INS_dr_boentaran_martooatmodjo_desc:0 "奔塔兰·马尔托阿特莫佐（1896年1月11日—1979年10月3日）出生于中爪哇普禾雷佐洛阿诺村一个爪哇贵族家庭。早年就读巴达维亚土著医科学校（STOVIA），1918年毕业成为医生，先后在三宝垄等地政府医院任职，曾参与处理1920年代加里曼丹霍乱疫情。1928年，奔塔兰获奖学金赴荷兰莱顿大学深造，期间加入“印度尼西亚学生协会”，结识艾哈迈德·苏巴尔佐、伊瓦·库苏马·苏曼特里等日后建国先驱。1931年获医学博士学位后返国，任职雅加达中央医院，后于1933年被派往三宝垄主持麻风病防治工作长达五年。日本占领时期，奔塔兰历任“祖国服务团”副团长、“先锋队”副团长等职，并作为独立筹备调查会成员参与1945年宪法起草工作，曾就宪法第32条条文措辞与苏波莫展开讨论，主张应明确写入国家对全体人民健康的保障责任。1945年8月19日印尼独立后，奔塔兰出任首届内阁首任卫生部长（任期至11月14日），任内于9月17日促成印度尼西亚红十字会成立，自己出任副会长，哈达任会长。此后奔塔兰转任国会议员等职，1979年10月3日在雅加达逝世，享年83岁。"
 INS_dr_samsi_sastrawidagda_desc:0 "萨姆西·萨斯特拉维达格达（1894年3月13日—1963年）出生于中爪哇梭罗。早年赴荷兰鹿特丹商学院深造，1925年以论文《日本贸易政策的发展》获博士学位。留荷期间，萨姆西加入“印度尼西亚学生协会”，并曾在莱顿大学教授爪哇语课程。回国后，萨姆西活跃于泗水一带的合作社及新闻事业，1927年与苏加诺、伊斯卡格、萨托诺等人共同创立印度尼西亚民族党。日本占领时期，萨姆西任泗水税务管理处处长，并出任“祖国服务团”顾问及“中央参议院”成员。1945年8月19日，独立筹备委员会第二次会议决定设立12部及4名国务部长，萨姆西受委任为首届内阁首任财政部长。任内，萨姆西通过秘密渠道联络日方人士，策划从泗水埃斯康普托银行取得一批日方查扣的荷属东印度旧币，以“银行突袭行动”名义由人民治安军秘密转移，充作新生共和国的启动资金，是印尼建国初期财政史上的重要事件。惟因健康状况不佳，萨姆西于1945年9月末即辞去财政部长一职，由亚历山大·安德里斯·马拉米斯接任，此后萨姆西鲜少涉足政坛核心。1963年逝世。"
 INS_gatot_soebroto_desc:0 "加托·苏布罗托（1907年10月10日—1962年6月11日）出生于中爪哇普禾加多。早年在荷属东印度接受教育后从军，1923年入马吉冷军校，毕业后加入荷属东印度皇家军队（KNIL）并晋升军士。1942年日本占领荷属东印度后，加托加入日方组建的“祖国防卫义勇军”（PETA），在茂物接受训练，先后出任连长、营长。1945年印尼独立后，加托投身国民军建设，独立战争期间历任师级指挥官，参与整合中爪哇地区武装力量。1949年荷兰威胁发动第三次“警察行动”之际，加托出任第三师（狄波尼哥罗师）师长。建国后长期在军队高层任职，1956年出任陆军副参谋长直至去世，期间与参谋长纳苏蒂安一同推动1959年恢复1945年宪法。1962年6月11日，加托在雅加达骤然辞世，一周后被追授印度尼西亚国家英雄称号。"
 INS_gerardus_johannes_berenschot_desc:0 "赫拉尔杜斯·约翰内斯·贝伦斯霍特（1887年7月24日—1941年10月13日）出生于苏门答腊索洛克，是荷属东印度皇家陆军（KNIL）一位荷兰籍中校军官与本地混血夫人之子，家族属荷属东印度当地欧亚混血（“印欧”/Indo）群体。15岁时被送往荷兰阿尔克马尔军校就读，后进入布雷达皇家军事学院并以全班第一名成绩毕业，是唯一出身“印欧”背景而官至KNIL总司令的军官。返回东印度后，贝伦斯霍特曾长期在亚齐随荷军“宪兵队”参与镇压亚齐战争末期的抵抗活动，后历任荷兰高等军事学院教官（1925—1930）、KNIL总参谋长（1934年起）等职，1939年7月升任中将并出任KNIL总司令，主持在国际局势日益紧张背景下推动KNIL的现代化整军工作。贝伦斯霍特以处事沉稳、深孚众望著称，被普遍视为KNIL历史上最杰出的总司令之一，与英美等盟国将领关系融洽。1941年10月13日，贝伦斯霍特在巴达维亚与英军远东总司令布鲁克-波帕姆会晤后，搭乘飞机返回万隆途中于起飞后数分钟坠毁，机上人员全部罹难，死因坊间一度流传日谍破坏之说，但未获证实。荷属东印度当局下令全境降半旗致哀，贝伦斯霍特葬于万隆潘杜荷军公墓，其总司令一职由参谋长特尔·波尔滕接任。"
 INS_gustav_adolf_ilgen_desc:0 "古斯塔夫·阿道夫·伊尔根生于1887年7月3日，德国威斯巴登，是荷属东印度皇家陆军步兵少将。其军旅履历长期隶属KNIL步兵系统，属于印尼独立战争前后荷属东印度高级军官团成员之一。1956年5月24日，伊尔根在荷兰海牙逝世。"
 INS_gustave_statius_muller_desc:0 "生于1889年4月23日，荷属东印度默斯特·科尔内利斯，即今雅加达贾蒂内加拉地区，是荷属东印度皇家陆军工兵科少将级军官。1962年10月26日在荷兰海牙逝世。"
 INS_harry_kuneman_desc:0 "约翰·赫尔曼·伯恩哈德·库内曼出生于西爪哇普禾加达。青年时期曾是荷兰足球运动员，1908年10月25日代表荷兰国家队出场一次国际比赛。此后库内曼转入荷属东印度行政系统任职，1933年至1936年出任东爪哇省省长，此后出任荷属东印度参事会成员。日本占领荷属东印度期间，库内曼作为参事会成员遭日方拘押，被关押于中爪哇一处平民集中营。1945年8月15日日本宣布投降后数周，库内曼于1945年9月7日在集中营内病逝，未及亲眼见证战争结束后的自由，葬于雅加达门滕布鲁荷兰军人公墓。"
 INS_hein_ter_poorten_desc:0 "海因·特尔·波尔滕（1887年11月21日—1968年1月15日）出生于荷属东印度茂物，是荷属东印度皇家陆军（KNIL）军官之子。1908年从阿尔克马尔军校毕业后加入KNIL炮兵部队，后自费赴比利时、法国接受飞行训练，1911年成为荷兰首位获得国际飞行执照的职业军官，此后参与筹建KNIL航空部队初期工作，但1916年一次试飞事故中身负重伤，同机的KNIL总司令米希伦斯中将罹难，特尔·波尔滕此后转回炮兵及参谋系统任职。1919年起在荷兰高等军事学院深造，1922年返回东印度，1926年至1936年间两度在KNIL总参谋部任职，1939年7月升任总参谋长。1941年10月，时任KNIL总司令贝伦斯霍特因飞机失事罹难，特尔·波尔滕随即升任中将并接任总司令一职，同时兼任驻爪哇盟军（ABDACOM）陆军部队总司令。1942年3月，日军全面入侵爪哇，特尔·波尔滕在评估盟军已无力抵抗的情况下，与荷属东印度总督恰尔达商议后，于3月9日与日军今村均中将签署无条件投降协议。此后特尔·波尔滕被日军长期关押，辗转爪哇、台湾战俘营，1944年10月被押送至中国东北（伪满洲国）战俘营，1945年8月17日获释，此后返回荷兰，晚年始终为荷兰承认其战时功绩而奔走。1968年1月15日，特尔·波尔滕在海牙逝世。"
 INS_hok_hoei_kan_desc:0 "简福辉（印尼语称Hok Hoei Kan，汉名简福辉，1881年1月6日—1951年3月1日）出生于巴达维亚一个显赫的土生华人望族，家族可追溯至爪哇最古老的华裔世家之一。1905年，简福辉获得与欧洲人平等的法律地位。1918年“人民议事会”首次召开时，简福辉即受委任为议员，此后长期担任该机构华裔社群代表，直至1942年日本占领解散该机构为止。1928年，简福辉出任“中华会”创党主席，该党主要吸引受荷兰教育的土生华人支持，主张与荷兰殖民当局合作以争取华人社群的种族与法律平等地位。简福辉政治立场总体偏向亲荷合作路线，1927年曾投票反对扩大“人民议事会”选举权范围，但1936年他也曾投票支持“苏塔尔乔请愿”。日本占领爪哇后，简福辉因其反日活动嫌疑被日方逮捕，拘押于芝马己集中营直至1945年日本投降。1951年3月1日，简福辉在雅加达逝世。"
 INS_i_j_k_hendrowahyono_desc:0 "卡西莫早年就读土著初等学校（HIS），后升入MULO及AMS中学。1923年，卡西莫参与创立印度尼西亚天主教党，是荷属东印度末期最早成立的本土政党之一，他本人也以立场温和、致力于团结印尼各政治派系而著称。日本占领时期及印尼独立筹备阶段，卡西莫参与独立筹备调查会（BPUPKI）及独立筹备委员会（PPKI）的相关工作。印尼独立后，卡西莫长期活跃于国会政坛，并在建国初期多届内阁中出任农业部长。1986年8月1日，卡西莫在雅加达逝世，后获追认为印度尼西亚民族英雄。"
 INS_iskandar_sjah_desc:0 "苏丹穆罕默德·贾比尔·沙阿出生于摩鹿加群岛特尔纳特，是特尔纳特苏丹国第47任统治者。其父穆罕默德·乌斯曼苏丹因抵制荷兰殖民当局干预苏丹国内政，于1914年遭荷方逮捕流放爪哇，此后特尔纳特苏丹之位长期虚悬，由荷属当局直接管理当地行政事务。贾比尔早年接受欧式基础教育，后转入巴达维亚初级中学深造。1929年，贾比尔被拥立为特尔纳特苏丹，是印尼独立后仍保有实际执政权力的最后一任特尔纳特苏丹。1944年，盟军自摩罗泰岛发起反攻东印度群岛，贾比尔一度秘密联络盟军并获接应撤离至澳大利亚；1945年日本投降后，他以荷属东印度皇家军队（KNIL）中校军衔身份返回特尔纳特，并出任北摩鹿加驻扎官。1946年，贾比尔参与荷方主导的马利诺会议与登巴萨会议，支持成立“东印度尼西亚邦”联邦体制，并当选东印度尼西亚邦参议院代表北摩鹿加地区议员。1949年至1950年，贾比尔出任东印度尼西亚邦内政部长。此后随着联邦体制于1950年并入统一印尼共和国，他逐渐淡出政坛，1975年7月4日在特尔纳特逝世。"
 INS_iwa_kusuma_sumantri_desc:0 "伊瓦·库苏马·苏曼特里（1899年5月31日—1971年11月27日）出生于西爪哇加密士一个贵族家庭，早年就读于巴达维亚法律学校，1921年赴荷兰莱顿大学深造，期间出任“印度尼西亚学生协会”主席。此后他一度赴苏联东方劳动者共产主义大学求学，深入接触马克思主义理论。回国后，伊瓦投身劳工运动，在棉兰创办报纸并组织石油、电力行业工会，1929年因鼓动劳工权益活动遭荷兰殖民当局逮捕，流放至西新几内亚博文迪古集中营长达十年之久。日本占领时期，伊瓦于1943年获释返回爪哇。1945年印尼独立后，伊瓦出任首届内阁社会与劳工部长，同年加入陈马六甲领导的“斗争联盟”，因涉嫌1946年“七三事件”未遂政变遭沙里尔政府逮捕入狱一年半。此后他历任多届内阁国防部长、国务部长等职，1957年出任帕查加兰大学首任校长。伊瓦晚年著述颇丰，1971年11月27日在雅加达病逝，2002年被追封为印度尼西亚民族英雄。"
 INS_jacob_jan_pesman_desc:0 "雅各布·扬·佩斯曼生于1888年，是荷属东印度皇家陆军步兵少将。1939年前后，他与皮埃尔·安托万·考克斯等人同属KNIL高级军官团，曾在万隆合影留念，反映其在殖民地军队高层中的地位。1950年，佩斯曼逝世。"
 INS_kartosoewirjo_desc:0 "卡尔托苏维尔佐（1905年1月7日—1962年9月5日）出生于中爪哇井，早年就读于泗水荷属印度医科学校，期间寄住于伊斯兰联盟领袖佐克罗阿米诺托家中并深受其影响，后中断学业投身政治活动。1945年马斯友美党成立时，卡尔托苏维尔佐是其领导层成员之一，并在西爪哇发展该党组织。印尼独立战争期间，他领导的西爪哇伊斯兰武装长期与印尼共和国军保持合作关系，共同抵抗荷兰殖民军；但1948年荷方依伦维尔协定条款迫使共和国军撤出西爪哇后，卡尔托苏维尔佐拒绝随军撤离，与重新渗入该地区的共和国游击队爆发冲突。1949年8月7日，他单方面宣布成立“印度尼西亚伊斯兰国”（NII），自任“伊玛目”，领导“达鲁伊斯兰”运动对抗新生的印尼共和国政府，叛乱一度波及南苏拉威西、亚齐等地，并两度策划暗杀苏加诺未遂。经印尼政府军多年围剿，1962年6月卡尔托苏维尔佐在西爪哇格贝尔山被捕，同年9月5日被军事法庭判处死刑并执行。作为一位早年抗荷、后期却与新生共和国兵戎相见的复杂人物，卡尔托苏维尔佐的历史评价至今仍存在争议。"
 INS_ki_hajar_dewantara_desc:0 "基·哈亚尔·德万塔拉（原名苏瓦迪·苏尔亚宁格拉特，Ki Hajar Dewantara，1889年5月2日—1959年4月26日）出生于日惹帕库阿拉曼王室世家，是帕库阿拉姆三世的孙辈。凭借贵族出身，他得以进入殖民地公立教育体系就读，后转入土著医科预备学校（STOVIA）但未毕业。1912年，德万塔拉与蒂普托·芒温库苏莫、杜韦斯·德克尔共同创立“东印度党”，是最早公开主张印尼独立的政治组织之一，不久遭荷兰当局取缔。1913年，他发表著名檄文《假如我是荷兰人》，尖锐批评荷兰殖民当局借“荷兰独立百年纪念”向包括印尼原住民在内的殖民地居民摊派捐款的做法，因此遭流放荷兰。流亡期间，他获得荷兰教师资格证，并深受福禄贝尔、蒙台梭利教育理念影响。1919年，德万塔拉返回印尼，1922年在日惹创办“塔曼西斯瓦”（意为“学生花园”）民族教育学校体系，专门招收此前被排斥于殖民地精英教育体系之外的普通印尼子弟，提出“在前者树立榜样，在中者激发意志，在后者给予支持”的教育理念，并首倡沿用至今的教育格言“从后引导”。1922年，时年满40岁的苏瓦迪依爪哇传统习俗更名“基·哈亚尔·德万塔拉”，并弃用贵族头衔“拉登·马斯”，以示与平民打成一片的决心。印尼独立后，德万塔拉出任首届内阁教育与文化部长，1957年获日惹加查马达大学荣誉博士学位。1959年4月26日，德万塔拉在日惹逝世，同年11月28日苏加诺追封其为印度尼西亚民族英雄暨“印尼民族教育之父”，其生日5月2日至今被定为印尼全国教育日。"
 INS_ludolph_hendrik_van_oyen_desc:0 "路多尔夫·亨德里克·范厄延（1889年4月25日—1953年7月28日）出生于荷兰海牙，毕业于布雷达皇家军事学院及海牙高等军事学院，是荷属东印度军航空兵（ML-KNIL）高级将领。1943年至1946年间，范厄延出任ML-KNIL中将级总司令，主持流亡澳大利亚期间荷属东印度空军力量的重建与训练工作，并率部以盟军西南太平洋战区序列参与对日反攻作战。战后范厄延继续负责ML-KNIL在印尼独立战争期间的整军与作战指挥事务，直至1946年卸任。他曾获荷兰橙拿骚勋章军官衔及荷兰狮子勋章骑士衔，并获英美两国分别授予“巴斯勋章”同僚衔及“军功勋章”指挥官衔，反映其在盟军内部的声望。1953年7月28日，范厄延在海牙逝世。"
 INS_mas_pardi_desc:0 "马斯·帕尔迪（1901年10月1日—1968年8月13日）出生于中爪哇安巴拉瓦。荷兰殖民统治时期，帕尔迪已是印尼本土少数活跃于航海领域的资深海员之一，1922年即在荷属东印度海军舰队担任大副。日本占领时期，他曾于日方创办的高级航海学校（SPT）任教，培养出苏多莫、阿里·萨迪金、马达迪纳塔等日后印尼海军重要将领。1945年印尼独立后，帕尔迪于同年9月10日联合雅加达本地海员创立“人民治安军海军部队”（BKR Laut），是印度尼西亚海军（ALRI）的直接前身，并出任该部队总参谋长（相当于今日海军参谋长一职），9月10日后来被定为印尼海军建军纪念日。1946年帕尔迪因年事渐高，交棒予穆罕默德·纳齐尔·伊萨接任海军领导职务，此后帕尔迪转向航海教育事业，1952年创办雅加达航海学院及三宝垄航海学校，并撰有多部航海学著作，被誉为“印尼航海学之父”。1958年，帕尔迪作为印尼代表团成员出席日内瓦国际海洋法会议。1968年8月13日，帕尔迪在三宝垄病逝，葬于当地英雄公墓。"
 INS_moestopo_desc:0 "穆斯托波（1913年6月13日—1986年9月29日）出生于东爪哇谏义里，毕业于泗水牙科学校（STOVIT），曾任该校副校长及执业牙医。1945年印尼独立后，穆斯托波主导解除泗水地区日军武装，并在同年11月泗水战役期间参与指挥抵抗英军的行动，曾与英方指挥官马拉比进行谈判。1946年后穆斯托波转赴日惹从事军事教育工作，此后长期投身牙科医学教育，1958年创办牙科学院，1961年发展为大学并获印尼大学博士学位。1986年9月29日，穆斯托波在万隆病逝，2007年被追封为印度尼西亚民族英雄。"
 INS_mohammad_hatta_desc:0 "穆罕默德·哈达（1902年8月12日—1980年3月14日）出生于苏门答腊布吉丁宜。1921年至1932年在荷兰求学期间，曾任民族主义团体“印度尼西亚学生协会”主席，积极宣传印尼独立主张。1932年从鹿特丹经济学院毕业后返回苏门答腊，继续投身民族独立运动，1933年出任国民教育党主席，1935年遭荷兰殖民当局逮捕流放。1942年日本占领荷属东印度后获释，与苏加诺一同利用日占当局提供的组织资源积蓄本土力量，1943年协助组建“祖国防卫义勇军”（PETA）。1945年8月17日，哈达与苏加诺联合发表印度尼西亚独立宣言，史称“双诺”，哈达出任首任副总统，后多次兼任总理及外交部长。1948年荷兰发动第二次“警察行动”期间，哈达与苏加诺一同被俘遭荷方拘押流放。1949年荷兰承认印尼独立后，哈达代表印尼出席圆桌会议协定谈判。哈达长期主张温和渐进的合作社经济路线，与苏加诺日趋集权、亲共的施政方向渐生分歧，1956年因不满苏加诺推行“指导民主”而辞去副总统职务，此后仍是印尼政坛具有重要影响力的元老人物，1980年在雅加达病逝。"
 INS_mohammad_hunsi_tharmin_desc:0 "穆罕默德·胡斯尼·丹戎林（Mohammad Husni Thamrin，1894年2月16日—1941年1月11日），出生于巴达维亚韦尔特弗雷登。其父塔姆林·穆罕默德·塔布里曾任雅加达一带“韦达纳”（县级行政官）。丹戎林毕业于威廉三世国王中学后，先后任职政府部门及荷兰皇家邮船公司长达十年。1919年，他当选巴达维亚市议会议员，1929年出任副市长。1927年，时任总督德赫拉夫委任丹戎林递补人民议事会（“荷印国会”）议席空缺，此后历经1931年委任及1935、1939年两度当选连任。1930年1月27日，丹戎林在人民议事会宣布成立“民族派”，联合十位印尼民族主义议员共同发声，部分是对1929年苏加诺及印尼民族党成员遭逮捕一事的回应。他曾与库苏莫·乌托约一同赴东苏门答腊考察种植园劳工待遇，回国后在人民议事会公开谴责种植园主及当地体罚劳工的陋习。1935年，丹戎林成为“大印度尼西亚党”（Parindra）创党成员之一，1938年苏托莫医生逝世后接任该党副主席。1939年，丹戎林在人民议事会提议以“印度尼西亚”取代荷方沿用的“荷属东印度”称谓，该动议获会议多数支持，但遭荷兰政府否决；同年他主导四大民族主义团体联合成立“印度尼西亚政治联盟”（GAPI）。1941年1月6日，丹戎林因被指控与日方勾结而遭软禁，不得会客，五日后的1月11日猝然离世，年仅46岁，其死因存在争议，部分说法认为他系遭殖民当局暗中毒害或谋害，官方结论未予采信，葬于雅加达卡烈公墓。1960年，印尼政府追封丹戎林为民族英雄。"
 INS_mohammad_natsir_desc:0 "穆罕默德·纳西尔（1908年7月17日—1993年2月6日）出生于西苏门答腊亚拉哈，早年接受伊斯兰宗教教育与荷式西式教育双重熏陶。1930年代，纳西尔投身伊斯兰教育与新闻事业，创办伊斯兰教育机构并主编刊物，逐渐成为伊斯兰现代主义思潮的重要代表人物。日本占领及印尼独立战争期间，纳西尔已是重要的伊斯兰政治活动家，1945年马斯友美党成立后长期担任其领导层核心成员。1946年至1949年，纳西尔历任新闻部长等职，积极通过外交渠道为印尼独立争取国际支持。1950年至1951年，纳西尔出任印度尼西亚共和国第五任总理（此时印尼刚恢复单一共和国体制），任内奉行伊斯兰改革路线，反对苏加诺日趋集权亲共的政治走向。1958年，纳西尔因公开支持地方分裂武装（印尼革命政府运动）而遭政府通缉，长期流亡在外，1961年被捕入狱，直至1966年获释。晚年纳西尔转而投身伊斯兰宣教及国际伊斯兰组织事务，1993年2月6日在雅加达病逝，2008年被追封为印度尼西亚民族英雄。"
 INS_mohammad_nazir_isa_desc:0 "穆罕默德·纳齐尔·伊萨（1910年7月10日—1982年8月30日）出生于西苏门答腊阿甘马宁焦。早年赴荷兰求学并投身航海事业，1938年获荷兰“远洋航行”证书，是首位获此资格的印尼人。1938年回国后在荷兰航运公司任职，日本占领时期加入日本海军服役，1943年出任三宝垄高级航海学校校长。印尼独立后，纳齐尔与其他船长共同组建人民治安军海军部队并出任副司令，1946年2月起出任印度尼西亚国民军海军总参谋长，主持建国初期海军力量的组建工作，直至1948年。此后他历任交通部海运总局局长等职，1957年至1959年出任航运部长，后转任驻瑞士及梵蒂冈大使。1982年8月30日，纳齐尔在雅加达病逝，享年72岁。"
 INS_mohammad_roem_desc:0 "穆罕默德·鲁姆（1908年5月16日—1983年9月24日）出生于中爪哇特马光。早年就读于巴达维亚医科预备学校，后转攻法律，1939年毕业于巴达维亚法学院，此后从事律师工作，并长期活跃于伊斯兰联盟党等伊斯兰政治组织。日本占领时期，鲁姆出任马斯友美党所属“回教军”青年副领袖。印尼独立战争期间，鲁姆凭借出色的外语与谈判能力，先后作为印尼代表团成员参与林牙椰蒂协定（1946）及伦维尔协定（1948）谈判。1949年，鲁姆出任印尼代表团团长，与荷兰代表范罗恩就恢复印尼主权问题展开谈判，同年5月7日签署“鲁姆-范罗恩协定”，为荷兰承认印尼独立、召开海牙圆桌会议奠定基础。此后鲁姆历任沙里尔第三届内阁内政部长、纳西尔内阁外交部长、维洛坡内阁内政部长、阿里·沙斯特罗阿米佐约第二届内阁第一副总理等要职。1960年马斯友美党被取缔后，鲁姆因涉嫌支持地方叛乱于1962年遭无审判拘押，至1966年方获释。1983年9月24日，鲁姆因肺部疾病在雅加达逝世。"
 INS_murk_boersta_desc:0 "穆尔克·布尔斯塔（Murk Boerstra，1883年11月28日—1953年5月9日）是荷兰炮兵军官，后晋升中将。1935年至1939年间，他出任荷属东印度皇家陆军（KNIL）司令，位居殖民地陆军体系最高层。其任期正值荷属东印度当局因日益紧张的国际局势而推动军队现代化整备的初期阶段，为其后继者贝伦斯霍特、特尔·波尔滕接续的备战工作奠定基础。"
 INS_musso_desc:0 "慕梭（印尼语全名穆诺纳尔·慕梭，Musso，1897年生于东爪哇谏义里农民家庭，卒于1948年10月31日）是印度尼西亚共产党资深领导人。1923年加入印尼共产党，翌年出任中央理事会理事并创办党报。1926年印尼共产党起义失败后，慕梭流亡苏联，1927至1928年在莫斯科东方大学（列宁大学）学习，并当选共产国际执行委员会委员。1935年，他奉共产国际指示秘密回国重建地下印尼共产党组织，不久后再度流亡苏联，直至二战结束后的1948年8月方才回国。回国后，慕梭在党内大力推动激进路线，发表《印度尼西亚共和国新道路》报告，同年8月当选印尼共产党总书记。"
 INS_njono_desc:0 "约诺（印尼语全称约诺·普拉维罗，Njono，1925年8月28日—1968年10月，一说另有争议）出生于井里汶一带，是铁路职员之子。1931年入塔曼西斯瓦“人民学校”就读，1938年毕业。日本占领时期，约诺曾在雅加达《亚洲拉亚报》担任青年记者。印尼独立初期，约诺投身劳工运动，曾在雅加达地区中央印度尼西亚国民委员会及其工作机构任职，并领导克拉马特一带的有轨电车工人工会，加入印度尼西亚劳工党并一度代理其主席。1949年独立战争结束后，约诺在印尼工会运动中地位渐升，出任全印度尼西亚中央工人组织（SOBSI）总书记及主席，1954年12月正式申请加入印尼共产党，1955年当选国会议员，此后长期活跃于劳工与党务领域。"
 INS_oerip_soemohardjo_desc:0 "乌里普·苏莫哈佐（1893年2月22日—1948年11月17日）出生名穆罕默德·西迪克，生于荷属东印度中爪哇普禾雷佐一个地方官员家庭。1914年毕业于巴达维亚军事学院，成为荷属东印度皇家军队（KNIL）少尉，此后近25年军旅生涯中屡获擢升，最终成为该军队中军衔最高的本土出身军官。1938年前后因与所驻地方官员不和而辞职退役，1940年纳粹德国入侵荷兰后被重新征召服役。1942年日本占领荷属东印度后，乌里普一度遭日方拘押于战俘营三个半月，余下占领时期赋闲在家。1945年10月14日，印尼宣告独立数月后，乌里普被任命为印度尼西亚国民军代理总司令兼总参谋长，凭借其丰富的荷属军队从军经验，负责将各地派系林立的零散抗日、抗荷武装力量整合为统一的正规军队，为苏迪尔曼其后领导的抵抗斗争打下组织基础。1948年11月17日，乌里普在任内病逝，未及见证翌年印尼独立获得荷兰正式承认。1964年，乌里普被追封为印度尼西亚民族英雄。"
 INS_oto_iskandar_di_nata_desc:0 "奥托·伊斯坎达尔·迪·纳塔（1897年3月31日—1945年12月19日失踪，翌日被追认死亡），昵称“斗鸡”，出生于万隆一个巽他族贵族家庭。他早年投身“至善社”民族主义组织，历任万隆、北加浪岸分社副主席，并当选北加浪岸市议会议员，任内多次公开批评荷兰种植园主对当地民众的苛待。奥托还曾在荷属东印度殖民地议会（“人民议事会”）任职，为巽他族民众争取权益发声。1945年印尼独立后，奥托短暂出任国务部长，并投身整合各地零散抗日、抗荷武装力量的工作。1973年，奥托被追封为印度尼西亚民族英雄。"
 INS_pierre_antoine_cox_desc:0 "生于1888年10月3日，荷兰阿纳姆，是荷属东印度皇家陆军步兵少将。1939年前后，他与雅各布·扬·佩斯曼等人同属KNIL高级军官团，在万隆等地参与殖民地陆军指挥体系。1979年4月12日逝世。"
 INS_sam_ratulangi_desc:0 "萨姆·拉图兰吉（全名赫龙甘·绍尔·萨缪尔·雅各布·拉图兰吉，Sam Ratulangi，1890年11月5日—1949年6月30日）出生于北苏拉威西托恩达诺一个米纳哈萨族望族家庭。早年赴荷兰阿姆斯特丹求学，1919年获瑞士苏黎世大学数理学博士学位，是印尼首批获得欧洲博士学位的本土知识分子之一。回国后，拉图兰吉曾任教师及保险公司创办人，1927年在殖民地议会（“人民议事会”）任职，积极为本土民众争取政治与经济权益，并于同年创立“米纳哈萨统一党”。1937年出版《太平洋中的印度尼西亚》一书，曾预见日本可能因资源需求而侵略印尼群岛。1945年印尼独立后，拉图兰吉出任独立筹备委员会成员并参与宪法制定，同年8月22日被任命为苏拉威西省首任省长。1946年4月，拉图兰吉因“叛国罪”遭荷兰当局逮捕，流放至西新几内亚塞鲁伊三年。1948年底再度被荷方拘押，因健康恶化于1949年2月获准移至雅加达软禁，同年6月30日在雅加达病逝。1961年，拉图兰吉被追封为印度尼西亚民族独立英雄。"
 INS_setyadjit_soegondo_desc:0 "塞蒂亚吉特·苏贡多生于1907年6月7日，是印度尼西亚社会党内左翼政治人物。二战前赴荷兰求学，曾任民族主义团体“印度尼西亚学生协会”主席；二战期间留在荷兰，参与反抗纳粹占领的地下活动。1946年回到印尼后投身社会党政治，先后在沙里尔第三届内阁任通讯部副部长，又在阿米尔·谢里夫丁第二届内阁任副总理。1948年“茉莉芬事件”期间，他与维卡纳等左翼人物卷入反政府行动，事件被镇压后于同年12月20日在茉莉芬遇害。"
 INS_simon_spoor_desc:0 "西蒙·亨德里克·斯波尔（1902年1月12日—1949年5月25日）出生于荷兰阿姆斯特丹，父亲是荷兰音乐厅管弦乐团指挥。斯波尔早年就读阿尔克马尔军校及布雷达皇家军事学院，1923年任步兵少尉，1924年起被派驻荷属婆罗洲，1929年至1932年在海牙高等军事学院深造，后于万隆总参谋部任职两年，1934年转任布雷达军事学院战略战术教官。1938年，斯波尔重返荷属东印度，出任总参谋部政治事务处处长兼万隆高等军事学院职务。二战期间他一度流亡澳大利亚，负责荷属东印度流亡军事情报工作。1946年，斯波尔出任荷属东印度皇家陆军（KNIL）暨驻当地荷兰陆军总参谋长，主持对印尼共和国发动的两次“警察行动”军事攻势（1947年7月、1948年12月），期间荷军行动造成大量平民伤亡，备受国际社会谴责。1949年5月25日，斯波尔在巴达维亚突然病逝，荷方官方结论为心脏病发，但也有印尼方面人士称其在北苏门答腊地区遭伏击重伤后不治，死因至今存在不同说法。斯波尔葬于雅加达门滕布鲁荷兰军人公墓。"
 INS_sjafruddin_prawiranegara_desc:0 "夏夫尔丁·普拉维拉内加拉（1911年2月28日—1989年2月15日）出生于万丹安耶尔基杜尔一个具有米南加保血统的贵族家庭。1939年毕业于巴达维亚法学院，1940年进入荷属东印度财政部门任职。日本占领及印尼独立初期，夏夫尔丁凭借与沙里尔的密切关系，历任多届内阁财政部长，负责筹划印尼独立货币的发行事宜。1948年12月19日，荷兰发动第二次“警察行动”攻占日惹，苏加诺、哈达等共和国领导人被俘，危急关头，时任福利部长的夏夫尔丁在苏门答腊武吉丁宜宣布成立“印度尼西亚紧急政府”（PDRI），代行总统职权长达七个月，维系了共和国的法统连续性，史称“没有总统府的总统”。1949年“鲁姆-范罗恩协定”签署后（该协定夏夫尔丁本人曾表示反对），他将治权交还苏加诺。此后夏夫尔丁历任副总理、财政部长，并出任印尼中央银行首任行长，任内以“夏夫尔丁削减”政策（将荷属货币面值削半）控制通货膨胀。1958年，夏夫尔丁因反对苏加诺“指导民主”路线，出任苏门答腊地方叛乱政权（印尼共和国革命政府）总理，叛乱失败后于1961年投降，遭监禁至1966年。晚年他持续批评苏哈托“新秩序”政权的腐败问题，1989年2月15日病逝，2011年被追封为印度尼西亚民族英雄。"
 INS_soengkono_desc:0 "松科诺（1911年1月1日—1977年9月12日）出生于中爪哇普尔巴林加一个裁缝家庭。早年赴泗水求学，后赴望加锡修读船舶技术专业，曾在荷兰皇家海军任职。1943年，松科诺加入日本占领当局在班约马斯组建的“祖国防卫义勇军”（PETA），1945年初升任连长。日本投降后，松科诺于1945年9月出任泗水地区人民治安军（BKR）司令，主持以谈判方式和平解除当地日军武装。1945年11月泗水战役爆发，松科诺出任泗水城防司令，组织指挥印尼军民抵抗英军进攻，是这场印尼独立战争中最惨烈战役的核心指挥官之一。此后，松科诺历任东爪哇多支部队指挥官，1948年“茉莉芬事件”期间受命出任东爪哇军事长官，负责镇压平叛。建国后，松科诺继续在军队任职，1958年升任陆军监察总监，1968年退役，1977年在雅加达病逝。"
 INS_soerjadi_soerjadarma_desc:0 "埃朗·苏里亚迪·苏里亚达尔玛（1912年12月6日—1975年8月16日）出生于东爪哇巴纽旺基一个具有井里汶王室血统的家庭，幼年父母相继过世，由外祖父抚养长大。1931年，苏里亚迪考入荷兰布雷达皇家军事学院，是获准入学的少数印尼裔学员之一，1934年毕业授少尉军衔。因荷兰殖民当局禁止印尼本土人士担任飞行员，苏里亚迪历经两次因罹患疟疾而落选的挫折后，终于于1938年从荷属东印度加利查蒂飞行学校毕业，但囿于种族歧视政策，毕业后长期未获正式飞行员资质认证，转任领航员、观测员等职。1942年日军入侵爪哇前夕，苏里亚迪曾参与轰炸日军舰船的作战行动。日本占领期间，他出任万隆警察局行政科长。1945年印尼独立后，苏里亚迪受命组建印尼空军力量，1946年4月9日被苏加诺正式任命为首任空军参谋长，是印度尼西亚空军（AURI）的主要奠基人，被誉为“印尼空军之父”。建军初期，他在玛古沃、马斯帕蒂、玛琅等地设立飞行、通信、伞兵等训练基地，并率先意识到印尼群岛地理特性对空降部队的战略价值，为日后印尼空军“快速部队”（伞兵部队前身）奠定基础；同时他大力支持早期国产飞机与直升机研发试验，并促成荷属“皇家荷印航空公司”改组为印尼国营嘉鲁达航空公司。苏里亚迪历任空军参谋长直至1962年，1960年“毛卡尔事件”（印尼空军中尉枪击总统府事件）及1962年“阿鲁海海战”引发的军种矛盾先后两度促使他主动请辞，均获苏加诺挽留或另作安排。1962年1月19日，苏里亚迪最终卸任空军参谋长一职，转任总统军事顾问、邮电部长等职，1968年退役。1975年8月16日，苏里亚迪在雅加达病逝，享年62岁，以军礼安葬于雅加达卡烈公墓。"
 INS_soetardjo_kartohadikusomo_desc:0 "苏塔尔乔·卡尔托哈迪库索莫（1890年10月22日—1976年12月20日）出生于中爪哇布罗拉一个地方官员家庭。早年在荷属东印度殖民地行政体系内从基层文员做起，历任雷姆邦、博约内哥罗、布罗拉等地行政助理，1924年出任布罗拉三邦县知县。1931年，苏塔尔乔当选“人民议事会”议员，代表本土文官阶层利益。1936年，他向“人民议事会”提出著名的“苏塔尔乔请愿”，要求荷属东印度在十年内逐步获得与荷兰本土平等的自治地位，该请愿最终遭荷兰当局否决，但成为两战间温和渐进派民族主义运动的标志性事件。日本占领时期，苏塔尔乔出任雅加达驻扎官，并参与独立筹备调查会及独立筹备委员会工作。1945年独立宣言发表后，苏塔尔乔于9月6日出任印尼共和国首任西爪哇省省长，并曾参与冷雅斯登克洛事件及独立宣言文本起草工作的相关事务。此后他继续在政界、教育界及社会事务领域任职多年，1976年12月20日在雅加达逝世。"
 INS_sudirman_desc:0 "苏迪尔曼（1916年1月24日—1950年1月29日）出生于荷属东印度中爪哇普尔巴林加。青年时期曾投身教育工作，1944年加入日本占领当局资助组建的“祖国防卫义勇军”（PETA），接受军事训练。1945年印度尼西亚独立后，苏迪尔曼在整合各地零散抗日、抗荷武装力量的过程中崭露头角，同年11月当选为印度尼西亚国民军首任总司令。1948年末，荷兰发动第二次“警察行动”，大举进攻共和国控制区，苏迪尔曼此时已身患严重肺结核，仍抱病率部撤离日惹，在爪哇腹地坚持领导游击抵抗长达数月，极大鼓舞了印尼军民的抗荷士气，成为印尼军方精神象征性人物。1949年印尼共和国政府迁回日惹后，苏迪尔曼病情持续恶化，于1950年1月29日病逝，享年34岁，印尼全国为此降半旗致哀。1964年，苏迪尔曼被追封为印度尼西亚民族英雄。"
 INS_sukarno_desc:0 "苏加诺（1901年6月6日—1970年6月21日）出生于东爪哇泗水，父为爪哇教师，母亲出身巴厘印度教家庭，毕业于万隆理工学院，获土木工程学位。求学期间投身民族主义活动，1927年创立印度尼西亚民族协会（后改组为印度尼西亚民族党）并任主席，号召印尼人民团结争取脱离荷兰殖民统治，因此于1929年至1930年代两度遭荷兰殖民当局逮捕流放。1942年日本占领荷属东印度后，苏加诺获释，为争取印尼独立，一度与日本占领当局合作，借助其组织资源积蓄本土力量。1945年8月15日日本宣布投降后，苏加诺与穆罕默德·哈达于8月17日联合发表独立宣言，宣告印度尼西亚共和国成立，苏加诺出任首任总统。此后数年，苏加诺领导印尼人民以外交与军事手段抵抗荷兰重新殖民的企图，直至1949年荷兰正式承认印尼独立。执政期间，苏加诺奉行独立自主的不结盟外交政策，倡导召开1955年万隆会议，推动亚非国家团结，并提出融合民族主义、宗教与共产主义的“纳沙贡”理念，自1959年起推行“指导民主”，集权色彩渐浓。1965年“九·三〇事件”后，苏加诺的实权逐步被军方将领苏哈托削夺，1967年被撤销总统职权并遭软禁，1970年6月21日于雅加达病逝。"
 INS_sultan_muhibuddin_desc:0 "架空虚构人物。“穆希卜丁”由阿拉伯语两部分构成：“穆希卜”（Muhibb，意为“热爱者”、“朋友”）和“丁”（Din，意为“宗教、信仰”，常特指伊斯兰教）。其最直接的含义就是“宗教的热爱者”或“信仰之友”。在伊斯兰世界的不同时期和地区，被多个杰出的个人和家族作为名字或尊号的一部分所采用。如马来西亚第五、第十四任最高元首，苏丹阿卜杜勒·哈利姆·穆阿扎姆·沙阿（Sultan Abdul Halim Mu'adzam Shah），其全名中就包含“穆希卜丁”（Muhibbuddin）。作为苏丹尊号的一部分。"
 INS_supomo_desc:0 "苏波莫（1903年1月22日—1958年9月12日）出生于荷属东印度梭罗驻扎地苏科哈尔佐一个贵族家庭。早年就读于巴达维亚法学院，毕业后先后在梭罗法院及荷兰莱顿大学深造。回国后，苏波莫曾在巴达维亚高等法律学院任兼职讲师，并参与“爪哇青年”等民族主义组织活动。日本占领末期，苏波莫因其深厚的法学素养，获委任为独立筹备调查会及独立筹备委员会委员，与苏加诺、穆罕默德·亚明共同承担起草1945年宪法的核心工作，是印尼建国宪法的主要设计者之一。印尼独立后，苏波莫两度出任司法部长（1945年8月—11月、1949年12月—1950年9月）。此后他转向学术与外交领域，历任日惹加查马达大学与印度尼西亚大学教授，1951年至1954年出任印尼大学校长，1954年至1956年出任驻英国大使。1958年9月12日，苏波莫在雅加达病逝。"
 INS_surachman_tjokoadisurjo_desc:0 "潘吉·苏拉赫曼·乔科阿迪苏里约（1894年8月30日—1952年11月16日）出生于中爪哇沃诺索博一个摄政王世家，是印尼首位本土化学工程师。1915年，苏拉赫曼获荷兰政府资助赴代尔夫特理工大学深造，1920年以化学工程学位毕业，归国后主持万隆一所化学实验室工作，期间与苏加诺等万隆民族主义者建立联系，并曾资助1928年第二届青年大会。1936年，苏拉赫曼调任巴达维亚殖民地经济部门任职。日本占领时期，他历任“祖国服务团”成员，1945年7月出任经济部门负责人。1945年8月19日印尼独立后，苏拉赫曼出任首届内阁经济部长（后改称福利部长），主持应对日占货币遗留导致的严重通货膨胀问题。1946年沙里尔第三届内阁期间，苏拉赫曼转任财政部长，任内首次发行印尼独立货币（“印度尼西亚共和国货币”），并于1946年4月主持发行印尼首批政府公债，45天内即募得目标金额的八成，不足一年即全额募足。1946年10月，苏拉赫曼卸任财政部长，由副手夏夫尔丁·普拉维拉内加拉接任。1949年印尼恢复主权后，苏拉赫曼于1950年2月出任印度尼西亚大学首任校长。1952年，苏拉赫曼作为印尼代表团团长赴荷兰谈判荷资锡矿国有化事宜，任务期间因高血压病发，1952年11月16日病逝于荷兰海牙。"
 INS_sutan_sjahrir_desc:0 "苏丹·沙里尔（1909年3月5日—1966年4月9日）出生于西苏门答腊巴东班让一个米南加保贵族家庭。1929年赴荷兰求学，先后就读于阿姆斯特丹大学与莱顿大学法学院，期间接受社会主义思想熏陶，并短期出任“印度尼西亚学生协会”秘书。1932年回国后与哈达一同从事民族独立活动，1934年遭荷兰当局逮捕流放。日本占领荷属东印度期间，沙里尔是少数拒绝与日方合作、坚持从事地下抵抗的印尼民族主义领导人之一，并参与了1945年8月的冷雅斯登克洛事件与独立宣言的酝酿。1945年11月，年仅36岁的沙里尔出任印度尼西亚共和国首任总理，是当时世界上最年轻的政府首脑，此后三度组阁，任内主持与荷兰的早期谈判，促成1946年林牙椰蒂协定。1947年因协定内容让步过多引发左翼不满而辞职。1948年，沙里尔另立印度尼西亚社会党（PSI），在政治上与印尼共产党相抗衡。该党在建国初期一度颇具影响，但1955年大选表现不佳，1960年因涉嫌支持地方叛乱而被苏加诺取缔。1962年沙里尔因被控密谋罪遭无审判拘押，1965年因中风获准赴瑞士苏黎世就医，次年病逝于当地。"
 INS_sutomo_desc:0 "苏托莫（1920年10月3日—1981年10月7日），民间昵称“东魔”，出生于泗水一个普通职员家庭，早年因家境贫困中断学业。日本占领时期，他曾在日方通讯社工作，1944年被选为日方扶植的“新人民运动”成员。1945年10月，苏托莫创立“印度尼西亚人民抵抗阵线”（BPRI），并创办“反抗电台”，以其极具感染力的演说风格号召泗水民众抵抗英军接管。同年11月，泗水战役爆发，这是印尼独立战争中最惨烈的一役，苏托莫的广播演说极大鼓舞了印尼军民的抵抗意志，战役虽以印尼一方战败告终，但极大激发了国际社会对印尼独立事业的同情与关注。1955年，苏托莫短暂出任布尔汉丁·哈拉哈普内阁国务部长。此后他与苏加诺渐生嫌隙，1965年后一度支持苏哈托上台，但很快转而批评“新秩序”政权的贪腐与滥权，1978年因言论遭当局拘押三年。1981年10月7日，苏托莫在麦加朝觐期间病逝。"
 INS_syarif_kasim_desc:0 "谢里夫·卡希姆二世（原名东库·苏隆·谢里夫·卡希姆，1893年12月1日—1968年4月23日）出生于苏门答腊廖内锡亚克斯里因德拉普拉，是锡亚克苏丹国第11任苏丹谢里夫·哈希姆之子。早年在巴达维亚接受法律与政务教育，1915年其父病逝后，年仅21岁的他继位为锡亚克苏丹国第12任（末代）苏丹。执政期间，谢里夫·卡希姆锐意革新，大力兴办各类学校并资助本地青年赴埃及、欧洲留学，同时长期通过外交与经济手段暗中支持印尼民族独立运动，对荷兰殖民统治表现出隐性的不合作态度。1945年8月17日印尼独立宣言发表后，谢里夫·卡希姆二世于同年11月发电报向苏加诺总统宣誓效忠，宣布锡亚克苏丹国全境并入印度尼西亚共和国，并将包括黄金、珠宝及现金在内、总值约1300万荷兰盾的全部王室财产悉数捐献给新生共和国政府，是印尼建国初期规模最大的一笔民间捐助。此举激怒荷兰殖民当局，谢里夫·卡希姆被迫流亡亚齐，期间继续通过广播动员苏门答腊各地统治者效忠共和国。战后他往返雅加达、锡亚克与新加坡之间，晚年返回故里安度余生。1968年4月23日，谢里夫·卡希姆二世在北干巴鲁附近的鲁姆拜逝世，1998年被追封为印度尼西亚民族英雄。"
 INS_syarif_muhammad_alkadrie_desc:0 "谢里夫·哈米德二世（原名谢里夫·阿卜杜勒·哈米德·阿尔卡德里，Sultan Hamid II，1913年7月12日—1978年3月30日）出生于西加里曼丹坤甸，其父为坤甸苏丹谢里夫·穆罕默德·阿尔卡德里。早年由两位英籍女教师抚养至12岁，精通英语，后接受荷式教育并毕业于荷兰布雷达皇家军事学院，成为荷属东印度皇家军队（KNIL）军官。日本占领期间，哈米德因与荷方关系密切遭日军拘押三年，其父及两位兄弟连同当地多名马来精英一同在“坤甸事件”中被日军处决，哈米德本人则幸免于难。1945年10月29日，哈米德继位为第七任坤甸苏丹，称哈米德二世。印尼独立战争期间，哈米德二世同情荷方立场，支持建立联邦制的“印度尼西亚合众国”以对抗爪哇为中心的统一共和国路线，并作为西加里曼丹邦代表参与马利诺会议、登巴萨会议及海牙圆桌会议谈判，1949年出任印尼联邦共和国不管部部长。1949年末，哈米德二世受哈达委托设计国徽，最终完成的“加鲁达潘查希拉”国徽方案于1950年正式采用，成为其留给印尼最重要且不受争议的遗产。然而，1950年1月，哈米德二世卷入前荷属特种部队军官韦斯特林策划的“正义女王军”（APRA）未遂政变，该政变企图颠覆联邦政府并暗杀包括国防部长哈孟古布沃诺九世在内的多名共和国要员，哈米德二世被指为幕后策划者之一而遭逮捕，监禁至1956年方获释。此案至今在印尼史学界存在争议，部分学者认为其罪责证据并不充分。晚年哈米德二世远离公众视野，1978年3月30日在雅加达病逝。"
 INS_t_b_simatupang_desc:0 "T·B·西马图庞（1920年1月28日—1990年1月1日）出生于北苏门答腊锡迪卡朗一个巴塔克族基督教家庭。1940年考入万隆荷属东印度皇家军事学院，同年日军入侵中断学业。印尼独立战争期间，西马图庞加入西利汪宜师，凭借出色才干在军队高层中崭露头角。1948年荷兰发动第二次“警察行动”期间，他随部队转移至班纳兰坚持游击抵抗，战后据此写成回忆录《班纳兰来信》。1950年苏迪尔曼将军病逝后，年仅29岁的西马图庞出任印度尼西亚武装力量代理参谋长，是建国初期最年轻的军方高层领导人之一。1953年，西马图庞因立场问题被解除军职，此后转任国防部顾问及军事院校讲师，1959年正式退役。此后他投身基督教会事务，曾任印尼基督教教会联合会主席及世界基督教教会联合会主席等职。2013年，西马图庞被追封为印度尼西亚民族英雄。"
 INS_tan_malaka_desc:0 "陈马六甲（印尼语称丹·马拉卡，全名拿督苏丹·马拉卡·西马布阿·伊布拉欣，生年约在1894年至1897年间，一般采信1897年6月2日，卒于1949年2月21日）出生于荷属东印度西苏门答腊省一个米南加保贵族家庭。1913年赴荷兰阿姆斯特丹求学，回国后于1921年出任印度尼西亚共产党主席，1922年因支持全国当店工人罢工遭荷兰当局逮捕流放，此后开始长达约二十年的海外流亡生涯，足迹遍及苏联、菲律宾、中国厦门、新加坡等地。1925年，陈马六甲率先提出建立“印度尼西亚共和国”的政治构想，1927年因与共产国际及印尼共产党路线分歧决裂，另立政党坚持独立革命路线。1942年日军占领新加坡后，他辗转回到苏门答腊，日占时期一度成为苏加诺的重要谋士。1945年独立宣言发表后，陈马六甲无法接受沙里尔政府与荷兰谈判妥协的立场，于1946年1月组织“斗争联盟”，主张荷兰军队全部撤出、印尼完全独立，一度迫使沙里尔辞去总理职务，后遭印尼当局逮捕入狱，直至1948年“茉莉芬事件”期间获释，随即另立“大众协商党”。1948年末荷兰军队占领日惹后，他被迫流亡东爪哇，投奔当地游击武装，1949年2月21日在东爪哇被印尼国民军右翼部队秘密处决，终年五十余岁。1963年，陈马六甲被追封为印度尼西亚民族英雄。"
 INS_tjalling_bakker_desc:0 "贾林·巴克生于1885年10月7日，荷属东印度万鸦老，是荷属东印度皇家陆军中将级军官。其履历属于KNIL高级军官体系，晚年退役后居留荷兰。1962年4月18日，巴克在海牙逝世。"
 INS_wirantakusumah_v_desc:0 "维拉纳塔库苏马五世（1888年11月23日—1965年1月22日）出生于西爪哇万隆一个传统贵族世家，是万隆摄政王库苏马迪拉加之子。五岁丧父后，他在多位监护人抚养下接受荷式教育，先后就读于欧洲人小学及高级中学，后转入土著官员培训学校。1912年，年仅24岁的维拉纳塔库苏马出任芝安珠尔县摄政王，是荷属东印度最年轻的摄政王之一；1920年调任万隆摄政王，先后两度出任此职（1920—1931年、1935—1945年），任内致力于发展当地经济与逊达文化事业，并长期担任“人民议事会”议员。日本占领末期，他获委任为独立筹备调查会及独立筹备委员会委员，参与建国准备工作。印尼独立后，维拉纳塔库苏马于1945年出任首任内政部长，后转任最高咨议会主席（1945—1948）。1948年至1950年，荷兰扶植成立联邦制“巴逊丹国”，维拉纳塔库苏马出任其唯一一任“国家守护者”（元首），该邦于1950年并入统一的印度尼西亚共和国后随之解散。1965年1月22日，维拉纳塔库苏马在长期患病后于万隆逝世。"
 IRQ_abd_al_ilah_desc:0 "阿卜杜勒·伊拉·本·阿里（1913年11月14日—1958年7月14日），伊拉克摄政王（1939—1953年）兼王储。为汉志末代国王阿里之子、费萨尔一世之侄、加齐一世的堂兄弟。1939年加齐车祸身亡后被任命为幼主费萨尔二世的摄政。1941年拉希德·阿里联合“黄金方阵”四校发动亲轴心政变时遭罢黜，他逃往外约旦投奔叔父阿卜杜拉国王，英军反击成功后被恢复摄政地位。此后他与努里·赛义德一道成为伊拉克亲英亲西方政策的核心支柱，积极参与镇压国内左翼及民族主义反对运动。1953年费萨尔二世亲政后，他转任王储，但实际上仍在幕后深度介入政治决策。1958年7月14日政变中与费萨尔二世一同在里哈卜宫被杀，遗体遭拖过巴格达街头、焚烧侮辱。"
 IRQ_abdullah_al-tell_desc:0 "阿卜杜拉·塔勒（1918年—1973年），约旦军官。1948年第一次中东战争期间，他以上校军衔指挥阿拉伯军团在耶路撒冷的战斗，在围攻耶路撒冷旧城的军事行动中发挥了关键作用。战后他因与约旦国王阿卜杜拉一世在巴勒斯坦问题上产生政治分歧而流亡埃及，在开罗出版回忆录揭露约旦与以色列之间的秘密谈判，引起阿拉伯世界震动。"
 IRQ_abdullah_desc:0 "他是麦加大谢里夫侯赛因·本·阿里之次子、伊拉克费萨尔一世之兄弟，一战中参加阿拉伯大起义，1921年出任英国委任统治下的外约旦埃米尔，1946年外约旦独立后成为首任国王。他与伊拉克哈希姆王室为同族至亲——伊拉克摄政王阿卜杜勒·伊拉即其侄子。1948年第一次中东战争中他指挥阿拉伯军团占领约旦河西岸及东耶路撒冷。1951年7月在耶路撒冷阿克萨清真寺被巴勒斯坦民族主义者暗杀。他并非伊拉克本国官员，但与伊拉克哈希姆王室同属一族，其弟费萨尔一世曾为伊拉克国王，摄政王阿卜杜勒·伊拉亦为其亲族。"
 IRQ_ahmed_barzani_desc:0 "谢赫艾哈迈德·巴尔扎尼，库尔德巴尔扎尼部族宗教及政治领袖，穆斯塔法·巴尔扎尼之兄。是纳克什班迪教团的谢赫，在巴尔扎尼地区拥有巨大的宗教权威与部族号召力。1931—1932年他领导了针对伊拉克中央政府的大规模库尔德起义，要求库尔德自治，起义遭英国皇家空军轰炸及伊拉克地面部队镇压后失败。此后他被流放至伊拉克南部，弟弟穆斯塔法继承了他在库尔德民族运动中的领导角色。他晚年逐渐退出政治前台。1969年逝世。"
 IRQ_akram_mushtak_desc:0 "阿克拉姆·穆什塔克，伊拉克皇家空军最早的开创者之一。1929年伊拉克组建本国空军之初，仅选派五名飞行学员赴英国接受训练，穆什塔克即为其中之一，与纳提克·穆罕默德·哈利勒·塔伊、穆罕默德·阿里·贾瓦德（后于1937年与巴克尔·西德基一同遇刺）、哈夫兹·阿齐兹及穆萨·阿里同批受训，归国后驾驶德哈维兰“吉普赛蛾”教练机组成伊拉克空军首支中队。1931年马哈茂德·萨勒曼（后为“黄金方阵”四校之一）等人由陆军转入空军补充该批飞行员队伍。穆什塔克由此成为伊拉克现代空军奠基一代的代表人物。"
 IRQ_ali_abn_hussein_desc:0 "他是麦加大谢里夫侯赛因·本·阿里之长子、伊拉克费萨尔一世及外约旦阿卜杜拉之兄。1924年其父退位后短暂继任汉志国王，但次年即被伊本·沙特的沙特势力击败，被迫流亡巴格达。此后定居伊拉克，其女儿阿里娅公主嫁给伊拉克国王加齐一世，生下费萨尔二世——这使得阿里成为费萨尔二世的外祖父、摄政王阿卜杜勒·伊拉的父亲。1935年在巴格达逝世。"
 IRQ_ali_mahmud_al_shaykh_desc:0 "阿里·马哈茂德·谢赫·阿里·希亚齐·奥贝迪（1901年6月3日，生于阿布格莱布），伊拉克政治家。1922年投身政坛，当选迪瓦尼耶选区众议员。1937年希克马特·苏莱曼内阁中接替辞职的萨利赫·贾卜尔出任司法部长。1941年拉希德·阿里·盖拉尼第三届内阁中短暂出任外交部长，同年在其第四届内阁中转任司法部长。1941年政变失败后被逮捕入狱。此后一度淡出政坛，1952年在穆斯塔法·奥马里内阁中重返财政部长之职（接替被免职的易卜拉欣·沙班达尔），并在努尔丁·马哈茂德内阁中留任。其政治笔记于1985年经穆罕默德·侯赛因·祖拜迪整理考订后出版。"
 IRQ_amir_al_illah_desc:0 "阿卜杜勒·伊拉·本·阿里（1913年11月14日—1958年7月14日），伊拉克摄政王（1939—1953年）兼王储。为汉志末代国王阿里之子、费萨尔一世之侄、加齐一世的堂兄弟。1939年加齐车祸身亡后被任命为幼主费萨尔二世的摄政。1941年拉希德·阿里联合“黄金方阵”四校发动亲轴心政变时遭罢黜，他逃往外约旦投奔叔父阿卜杜拉国王，英军反击成功后被恢复摄政地位。此后他与努里·赛义德一道成为伊拉克亲英亲西方政策的核心支柱，积极参与镇压国内左翼及民族主义反对运动。1953年费萨尔二世亲政后，他转任王储，但实际上仍在幕后深度介入政治决策。1958年7月14日政变中与费萨尔二世一同在里哈卜宫被杀，遗体遭拖过巴格达街头、焚烧侮辱。"
 IRQ_bakr_sidqi_desc:0 "巴克尔·西德基·阿斯卡里（1890年，生于基尔库克附近—1937年8月11日，卒于摩苏尔），库尔德裔伊拉克陆军将领，1936年政变主谋（现代阿拉伯世界首次军事政变）。奥斯曼帝国军校出身，一战中加入费萨尔的阿拉伯起义军。1921年进入英国委任统治下的伊拉克陆军，因才干出众迅速晋升。1933年8月他奉命率军“平定”北部亚述人，在西米勒地区实施了对亚述平民的无差别屠杀（西米勒惨案），包括妇女儿童在内约三千人遇害，西德基却因此被国内民族主义者奉为英雄并晋升准将——这一事件后来启发了拉斐尔·莱姆金提出“种族灭绝”概念。1935年他以同样的铁腕手段镇压南部什叶派部族叛乱。1936年10月29日他以代理参谋长身份调动忠于自己的部队向巴格达进军，空军在首都上空散发传单要求更换内阁，成功推翻亚辛·哈希米政府并扶植希克马特·苏莱曼出任首相，自己则以参谋长身份实际掌权。1937年8月11日他在摩苏尔机场准备赴土耳其访问时被反对派军人枪杀，在权力巅峰仅十个月。"
 IRQ_fahmi_said_desc:0 "法赫米·萨伊德（1898—1942），伊拉克陆军上校，“黄金方阵”四校之一，1941年反英政变的军方核心成员。1898年生于苏莱曼尼亚，父亲是出身安巴克部落的阿拉伯人，母亲有土耳其血统；早年在奥斯曼军队任中尉，后曾短暂在叙利亚阿拉伯军服役，再加入新独立的伊拉克王国皇家陆军。政变及英伊战争期间，他统辖独立机械化旅，凭借该部机动性在夺取巴格达电报、电话枢纽和控制首都的行动中发挥重要作用。他与萨拉赫丁·萨巴格、卡米尔·沙比卜、马哈茂德·萨勒曼一道罢黜摄政、拥立盖拉尼执政。政变被英方镇压后，他被判处死刑，并于1942年5月5日被绞死。"
 IRQ_faisal_ii_desc:0 "费萨尔·本·加齐（1935年5月2日，生于巴格达—1958年7月14日，卒于巴格达），伊拉克末代国王（1939—1958年在位）。三岁时因父亲加齐一世车祸身亡而继位，由母舅阿卜杜勒·伊拉亲王任摄政。1941年拉希德·阿里政变期间，摄政遭罢黜，幼年费萨尔随母亲撤至英国避难，在哈罗公学就读期间与堂弟、日后的约旦国王侯赛因结下深厚友谊。1953年年满十八岁亲政后，实际仍倚重叔父及老牌政治家努里·赛义德。1950年代石油收入增加，政府将大量收入投入开发项目，但社会不公与贫困未获根本改善，加之1955年加入巴格达公约、1956年苏伊士危机中未能有力声援埃及，使王室声望急剧下降。1958年2月与约旦组建阿拉伯联邦以抗衡埃叙联合共和国。1958年7月14日凌晨，阿卜杜勒·卡里姆·卡西姆准将率部发动政变，费萨尔下令卫队不予抵抗并投降，随即在里哈卜宫庭院中与叔父阿卜杜勒·伊拉等王室成员一同被机枪射杀，哈希姆王朝在伊拉克三十七年的统治就此终结。"
 IRQ_fawsi_al_kaukji_desc:0 "法齐·卡武齐（1890年—1977年），黎巴嫩/叙利亚裔泛阿拉伯军事人物，与伊拉克有密切渊源。出身黎巴嫩的黎波里，奥斯曼帝国军校毕业。一战后投身阿拉伯民族主义军事运动，1925年参加叙利亚大起义反抗法国委任统治。1936年巴勒斯坦阿拉伯大起义期间他率领志愿军进入巴勒斯坦与英军作战，成为泛阿拉伯武装抵抗运动的标志性人物。1941年伊拉克拉希德·阿里政变期间他亦参与其中。1948年第一次中东战争中他指挥阿拉伯解放军在巴勒斯坦北部作战。此后长期流亡贝鲁特。1977年逝世。"
 IRQ_fritz_grobba_desc:0 "弗里茨·格罗巴（1886年7月18日—1973年9月2日），德国外交官，纳粹德国中东政策的核心执行者。1932—1939年及1941年两度出任德国驻伊拉克公使。精通阿拉伯语，在巴格达建立了广泛的情报与宣传网络，向伊拉克军方及政界人士输送纳粹意识形态，与“黄金方阵”四校及拉希德·阿里·盖拉尼保持密切联系。1941年政变期间他是德方与伊拉克反英势力之间的主要联络人，协调德国对伊拉克的军事援助。政变失败后撤回德国，此后在沙特阿拉伯等地从事外交工作。战后被美军拘押后获释。1973年逝世。"
 IRQ_hamdi_al_pachachi_desc:0 "哈姆迪·帕萨齐（Hamdi al-Pachachi，1886—1948）是伊拉克政治家，出身巴格达名门帕萨齐家族，其弟穆扎希姆·帕萨齐亦曾任首相。早年在伊斯坦布尔皇家学堂攻读法律，1909年毕业，后在巴格达法学院任教并加入阿拉伯民族主义“盟约社”。因支持1920年反英起义一度被流放至波斯湾亨贾姆岛。此后经商务农，1935年当选众议员，1941年任社会福利大臣，1941—1943年任众议院议长。1944年6月至1946年2月出任首相：任内放宽新闻审查、推行1945年“米里·瑟尔夫”土地改革法，外交上着力加强阿拉伯联盟合作、释放1941年政变后被拘的民族主义者，路线较努里·赛义德更倾向阿拉伯民族主义。因与摄政阿卜杜勒·伊拉不睦，1946年2月被迫辞职，1948年任外交大臣，同年3月28日逝世。"
 IRQ_harry_george_smart_desc:0 "哈里·乔治·斯玛特（1893年—1963年），英国皇家空军副元帅。1941年英伊战争期间，他担任伊拉克哈巴尼亚皇家空军基地的英方指挥官。当拉希德·阿里的政变军队包围哈巴尼亚基地并要求英军不得活动时，斯玛特拒绝最后通牒，下令以基地有限的训练机和过时战斗机发动先发制人的空袭，成功击退了围攻部队，为英军随后的全面反击赢得了关键时间。哈巴尼亚保卫战被视为二战中东战场的转折点之一。"
 IRQ_hikmat_suleiman_desc:0 "希克马特·苏莱曼（1889年—1964年），伊拉克政治家，1936年巴克尔·西德基政变后出任首相（1936年10月—1937年8月）。出身巴格达显赫家庭，兄弟中亦有多人从政。1936年10月他与西德基将军联手推翻亚辛·哈希米政府，以文官首相身份组阁，背后实际军权掌握在西德基手中。其内阁推行了若干社会改革措施，但政权本质上依赖军人支撑。1937年8月西德基在赴土耳其途中遭军中对手暗杀，苏莱曼随即失去军事靠山并被迫辞职。此后淡出核心政坛。1964年逝世。"
 IRQ_husain_al_rahhal_desc:0 "侯赛因·拉哈勒（约1900年—1927或1928年），伊拉克最早的马克思主义思想家之一。出身纳西里耶，早年在巴格达及贝鲁特接受教育期间接触马克思主义思想。1920年代他是在伊拉克传播社会主义与共产主义理论的先驱者，参与创办了伊拉克最早的左翼政治小组及出版物。他英年早逝，年仅二十余岁，但其思想启蒙工作为此后伊拉克共产党的建立奠定了重要的知识基础。"
 IRQ_jafar_al_timman_desc:0 "贾法尔·阿布·提曼（Ja’far Abu al-Timman，1881—1945）是伊拉克民族主义运动元老。生于巴格达一什叶派商人世家。1919年起投身秘密政治团体“独立卫士”，1920年参与反英大起义，在中幼发拉底一带领导起义者并筹措经费，主张建立由逊尼、什叶共治的完全独立的伊拉克。起义失败后一度流亡波斯，费萨尔一世加冕后归国，创立“国民党”。他坚决反对教派政治、主张政教分离，被视为连接逊尼与什叶两派的桥梁人物，1930年抵制大选以抗议《英伊条约》。1936年巴克尔·西德基政变后出任希克马特·苏莱曼内阁的财政大臣，次年因不满苏莱曼揽权及血腥镇压什叶派起义而辞职。长期任巴格达商会会长（1935—1945），1945年11月在一场爆炸中身亡。"
 IRQ_jamil_abdul_wahab_desc:0 "贾米勒·阿卜杜勒·瓦哈卜·阿卜杜勒·拉扎克（1913年，生于巴格达—1973年，卒于贝鲁特），伊拉克律师、法官兼政治家。在巴格达完成中小学教育后入读法律学院，1931年毕业。1933年投身司法界任职，后转而执业律师并从政。1940年及1943年两度当选迪亚拉选区众议员，并两度当选律师界代表。哈希姆王朝末期他历任教育大臣、社会事务大臣及司法大臣等多个内阁要职，是伊拉克王国晚期文官政府中的资深法律官员。1973年在贝鲁特逝世。"
 IRQ_jamil_al_midfai_desc:0 "贾米勒·米德法伊（Jamil al-Midfai，1890—1958）是伊拉克政治家，曾五度出任首相。生于摩苏尔，一战期间在奥斯曼军队服役，1916年被俄军俘虏后转投英方支持的阿拉伯大起义，战后在费萨尔短暂统治叙利亚期间任其副官。1920年返回伊拉克参与反英大起义，因民族主义活动被迫流亡外约旦，1923年获准回国，此后历任多地省长，1930年入阁并任众议院议长。他以温和、妥协的政治风格著称，先后于1933、1935、1937—1938、1941及1953年五次组阁；1938年其内阁在“黄金方阵”军人施压下垮台。作为坚定的君主派，1941年拉希德·阿里政变期间他随摄政阿卜杜勒·伊拉一同流亡，英军平定政变后于6月再度组阁以稳定局势。晚年任参议院议长，1958年10月26日因肺癌逝世。"
 IRQ_kamil_al_jaderji_desc:0 "卡米尔·查迪尔奇（1897年—1968年），伊拉克国家民主党创始人兼领袖。出身巴格达显赫家族，法学教育背景。1930年代他是进步知识分子团体“人民报”（阿哈利）运动的核心成员，主张社会改革与民主化。1936年巴克尔·西德基政变后曾短暂参与苏莱曼内阁。此后他创立国家民主党，成为哈希姆王朝时期最重要的合法民主反对派力量之一，主张议会民主、土地改革及限制王室权力。1940—1950年代他多次遭到当局逮捕与迫害。1958年革命后初期一度获释参政，但很快对卡西姆政权的专制倾向感到失望。1968年逝世。"
 IRQ_kamil_shabib_desc:0 "卡米尔·沙比卜（1895—1944），伊拉克陆军上校，“黄金方阵”四校之一，1941年反英政变的军方核心成员。1895年生于巴格达；一战期间在奥斯曼军队中任军官，1921年加入新独立的伊拉克王国皇家陆军。政变及英伊战争期间，他统辖驻巴格达一带的第1步兵师，是拥立盖拉尼、驱逐摄政阿卜杜勒·伊拉的核心力量之一。政变失败后，他与其他三校一同出逃，此后被擒回国，经审判被判处死刑，于1944年8月20日在巴格达被绞死。"
 IRQ_mahmud_salman_desc:0 "马哈茂德·萨勒曼（1889—1942），伊拉克皇家空军上校，“黄金方阵”四校之一，也是四人中唯一的空军军官。1889年1月7日生于巴格达；早年先后在奥斯曼、叙利亚和伊拉克三国军队中服役，1925年加入伊拉克军队，后转入伊拉克空军并升任空军司令。1937年巴克尔·西德基政变之后，他是策划处决西德基的一小群军官之一。1941年政变期间，他主管空军方面的协调与指挥，与萨拉赫丁·萨巴格等三校一道罢黜摄政、拥立盖拉尼执政。政变被英方镇压后，他被军事法庭审判并处决，于1942年5月5日行刑。"
 IRQ_maruf_al_rusafi_desc:0 "马鲁夫·拉萨菲（1875年—1945年），伊拉克著名阿拉伯语诗人、民族主义者兼教育家。出身巴格达库尔德裔家庭。早年在伊斯坦布尔接受教育并开始文学创作，以古典阿拉伯诗歌的精湛技艺配合尖锐的社会批判著称，作品主题涉及妇女解放、教育改革、反殖民主义及社会正义，被誉为伊拉克现代文学的奠基人之一。他同时活跃于政坛，当选过议员，公开批评政府腐败与英国干涉。晚年他撰写了一部极具争议的伊斯兰教创立史著作，因挑战正统叙事而长期未能出版。关于加齐一世1939年车祸身亡是否系谋杀的问题，拉萨菲是坚持“谋杀论”的著名知识分子之一。1945年在巴格达逝世。"
 IRQ_max_von_oppenheim_desc:0 "马克斯·冯·奥本海姆（1860年7月15日—1946年11月15日），德国考古学家兼情报官，出身科隆银行家家族（犹太裔皈依新教）。一战期间他为德国政府制定了鼓动伊斯兰世界对协约国发动“圣战”的战略方案，被视为德国利用宗教进行地缘政治操纵的先驱。同时他也是一位严肃的考古学家，发现了叙利亚泰勒·哈拉夫遗址。二战期间已年逾八十的他再度被纳粹政府启用，参与对阿拉伯世界的宣传与煽动工作，与伊拉克1941年亲轴心政变的情报策划有间接关联。1946年逝世。"
 IRQ_mohamed_hadid_desc:0 "穆罕默德·哈迪德（1907年—1999年），伊拉克经济学家兼政治家，国家民主党重要成员。出身摩苏尔，在伦敦政治经济学院接受教育，回国后投身政治与经济改革事业。作为民族阵线的核心人物之一，他参与了摩萨台时期石油国有化运动的相关讨论，在伊拉克国内倡导类似的石油利润改革方案。1950年代他是国家民主党的关键经济政策理论家。1958年革命后一度出任财政部长。他同时也是一位成功的实业家。其女儿扎哈·哈迪德后来成为举世闻名的建筑师（2004年普利兹克奖得主）。1999年逝世。"
 IRQ_mohamed_mahdi_kubba_desc:0 "穆罕默德·马赫迪·库巴（Muhammad Mahdi Kubba，1900—1984）是伊拉克民族主义政治家，独立党领袖。独立党1945年12月成立，前身为“穆桑纳俱乐部”，主张伊拉克完全独立与泛阿拉伯主义，不少成员曾支持1941年反英政变，是哈希姆王朝后期最重要的反对党之一，曾在1948年大选中赢得单一政党最多席位。库巴长期领导该党，1953年起与“自由军官”运动合作推动变革。1958年七月革命推翻君主制后，他被任命为三人“主权委员会”成员，代表什叶派与代表库尔德人、逊尼派者共同行使国家元首职权。晚年撰有回忆录。1984年逝世。"
 IRQ_muhammad_amin_zaki_desc:0 "穆罕默德·阿明·扎基（1880年—1948年），库尔德裔伊拉克将军、学者兼政治家。出身苏莱曼尼亚地区库尔德名门，奥斯曼帝国军校毕业后在奥斯曼军中服役。伊拉克独立后进入政坛，曾出任内阁部长。同时他是一位多产的历史学者，以研究库尔德民族历史著称，著有《库尔德人与库尔德斯坦史》等重要著作，是库尔德民族史书写的奠基人之一。1948年逝世。"
 IRQ_muhammad_husayn_kashif_al_ghita_desc:0 "穆罕默德·侯赛因·卡希夫·盖塔（约1877年—1954年），伊拉克什叶派大教长（玛尔贾），纳杰夫阿勒·卡希夫·盖塔学术家族的领袖。作为二十世纪上半叶伊拉克什叶派最具权威的宗教领袖之一，他在宗教法学、教派关系及政治事务中拥有广泛影响力。他主张什叶派与逊尼派团结，支持阿拉伯民族统一运动，在伊拉克国内政治危机中多次以宗教权威身份充当调解角色。同时他也是一位多产的宗教学者，著述涵盖教法、教义及伊斯兰哲学等领域。1954年逝世。"
 IRQ_mustafa_barzani_desc:0 "穆斯塔法·巴尔扎尼（1903年3月14日，生于巴尔赞—1979年3月1日，卒于美国华盛顿特区），库尔德民族运动最具标志性的领袖。谢赫艾哈迈德·巴尔扎尼之弟。1930年代参与其兄领导的库尔德起义，1943年再度在伊拉克北部发动武装抗争，遭伊拉克政府军镇压后于1945年率部撤入伊朗。1946年他在苏联支持下参与建立短暂的马哈巴德库尔德共和国，出任该共和国军队总司令。马哈巴德共和国于同年底被伊朗政府摧毁后，穆斯塔法率残部翻越雪山进入苏联避难，在苏联流亡长达十一年。1958年伊拉克革命后应卡西姆将军之邀回国，此后领导库尔德民主党（KDP）与伊拉克历届政府反复进行和战交替的武装斗争，成为二十世纪库尔德民族解放运动的象征。1975年在伊朗撤回支持后起义崩溃，他流亡美国并于1979年在华盛顿因肺癌逝世。其子马苏德·巴尔扎尼后来出任伊拉克库尔德斯坦自治区主席。"
 IRQ_naji_al_suwaidi_desc:0 "纳吉·苏瓦伊迪（Naji al-Suwaidi，1882—1942）是伊拉克政治家，陶菲克·苏瓦伊迪之兄。1929年11月，在前首相阿卜杜勒·穆赫辛·萨敦自杀后受命组阁出任首相。其任内正值街头抗议高涨、舆论要求签订通往独立的条约之际，加之遭国王费萨尔一世与努里·赛义德掣肘，他于1930年3月辞职，在任仅约四个月。1937年他主持了声援巴勒斯坦阿拉伯人、反对犹太复国主义的首届布卢丹泛阿拉伯会议。此外历任财政大臣等要职，是伊拉克独立初期的建制派政要之一。1942年8月17日逝世。"
 IRQ_nuri_as_said_desc:0 "努里·赛义德（1888年12月，生于巴格达—1958年7月15日，卒于巴格达），伊拉克哈希姆王朝头号政治强人，先后八次出任首相。1906年毕业于伊斯坦布尔军校，一战期间加入费萨尔一世领导的阿拉伯大起义，此后成为费萨尔最信赖的军事及政治助手。1930年首次出任首相，签署《英伊条约》为伊拉克加入国际联盟铺路，但该条约赋予英国在伊永久驻军权，也使他背负“亲英”的政治标签。1936年巴克尔·西德基政变后他逃入英国使馆并流亡埃及。1938年回国后与“黄金方阵”军官合作推翻米德法伊内阁、重新执政。1941年拉希德·阿里政变后再度流亡，英军平乱后于同年10月第三次出任首相。此后他主导伊拉克对轴心宣战、签订新石油利润分成协议、加入巴格达公约，并于1958年出任伊拉克—约旦阿拉伯联邦首任首相。1958年7月14日革命翌日，他女扮男装试图出逃被识破，遭暴民杀害。"
 IRQ_rashid_ali_algaylani_desc:0 "拉希德·阿里·盖拉尼（1892年—1965年8月28日），伊拉克民族主义政治家、1941年反英政变领袖。出身巴格达逊尼派显贵家庭。1930年代先后出任内务大臣及首相。1941年4月他联合“黄金方阵”四名亲轴心上校发动政变，罢黜摄政阿卜杜勒·伊拉，自任首相并寻求纳粹德国及意大利军事援助，试图摆脱英国对伊拉克的控制。英军以哈巴尼亚空军基地为据点发起反击（英伊战争），德国承诺的援助迟迟未能大规模到达（仅派少量飞机由容克将军指挥），政变军队在五月底被击溃。盖拉尼携耶路撒冷大穆夫提阿明·侯赛尼等人先逃往伊朗，后辗转至纳粹德国。其出逃后巴格达爆发针对犹太社区的“法胡德”暴乱。战后他流亡沙特阿拉伯及埃及，1958年伊拉克革命后一度回国，1965年在贝鲁特逝世。"
 IRQ_saib_shawkat_desc:0 "赛义卜·肖卡特（1898年—1984年2月13日），伊拉克外科医生兼泛阿拉伯民族主义活动家，努里·赛义德政府首相纳吉·肖卡特之弟。出身格鲁吉亚裔巴格达显贵家庭，1913—1918年就读伊斯坦布尔医学院，后赴德国深造普通外科。他是伊拉克首位在皇家医学院讲授解剖学的本国医生，1930年代出任巴格达医院总监，1940年代出任医学院院长，是伊拉克现代外科的开拓者之一。1932年他是伊拉克红新月会创始委员会成员。政治上他是狂热的泛阿拉伯民族主义者，深受欧洲法西斯主义影响，1933年发表题为《死亡的制造》的著名演讲，号召青年以战争与牺牲实现阿拉伯统一，广为伊拉克学校传诵。1938年出任教育总监后，他与塔哈·哈希米于1939年共同创立“马斯纳俱乐部”（以7世纪阿拉伯名将命名），并一手缔造了仿照希特勒青年团模式的“福图瓦”青年军事化组织，将民族主义意识形态灌输编入学校课程体系。1941年5月31日“法胡德”暴乱期间，身为巴格达中心医院总管的他曾亲自持枪弹压蓄意侵犯犹太伤患的军人，救治了大批遇袭的犹太平民——这一举动与他本人的泛阿拉伯民族主义及反犹立场形成鲜明反差。"
 IRQ_salah_al_din_al_sabbagh_desc:0 "萨拉赫丁·萨巴格（1889—1945），伊拉克陆军上校，“黄金方阵”之首，1939至1941年间伊拉克军中泛阿拉伯民族主义势力的灵魂人物。1889年生于摩苏尔，早年在当地受教育，后入伊斯坦布尔的奥斯曼军事学院，1915年毕业任军官；一战期间在巴勒斯坦和马其顿服役并一度被俘，后投奔埃米尔费萨尔，1921年回到伊拉克加入伊拉克军队，其军事教育还包括在比利时和英国进修的课程。1924年起他在巴格达军事学院任教官，后转参谋学院，1937年升任伊拉克陆军副参谋长。作为民族主义者，他还督导“福图瓦”青年准军事运动的训练；他推崇耶路撒冷大穆夫提阿明·侯赛尼，与之及拉希德·阿里·盖拉尼一道向轴心国寻求对泛阿拉伯目标的支持，并成为1941年英伊战争的主要鼓吹者。1941年4月，他与法赫米·萨伊德、卡米尔·沙比卜、马哈茂德·萨勒曼三位上校联手发动政变，拥立盖拉尼执政、驱逐摄政阿卜杜勒·伊拉。战败后逃往伊朗，再转土耳其，1945年被英方擒获引渡回国，经军事法庭以叛国罪判处死刑，于1945年10月16日公开绞死。他著有回忆录《伊拉克的阿拉伯骑士》，1956年在巴格达出版，详述其泛阿拉伯理念与政变经过。"
 IRQ_sharaf_bin_rajeh_desc:0 "沙里夫·沙拉夫·本·拉杰赫（1881年，生于塔伊夫—1955年），哈希姆宗室远支成员，1941年伊拉克政变期间的傀儡摄政王（1941年4月1日—6月1日）。生于奥斯曼治下汉志的塔伊夫，为该地埃米尔继承人，一战期间参加反抗奥斯曼当局的阿拉伯大起义及征服阿西尔之役，此后出任塔伊夫埃米尔直至逝世。1941年拉希德·阿里·盖拉尼发动政变、摄政王阿卜杜勒·伊拉出逃后，盖拉尼急需另立摄政以维系君主制的表面合法性，遂征召这位与阿卜杜勒·伊拉有远亲关系、年迈而虔诚的宗室成员出任摄政，为其亲轴心政府提供名义上的王室背书。政变失败、英军平乱后，阿卜杜勒·伊拉复位，沙拉夫·本·拉杰赫的摄政随之终结。他此后还曾出任约旦参议员。1955年逝世。"
 IRQ_taha_al_hashemi_desc:0 "塔哈·哈希米（1888年—1961年），伊拉克陆军将领兼政治家，首相亚辛·哈希米之弟。奥斯曼帝国军校及参谋学院出身，一战中参加阿拉伯起义。伊拉克独立后历任高级军职，1936年巴克尔·西德基政变时他正在安卡拉出访，被西德基电令阻止回国。1941年拉希德·阿里政变前后他是关键人物之一，一度出任首相（1941年2—4月），与“黄金方阵”四校及拉希德·阿里在反英民族主义立场上合流。政变失败后流亡，战后一度遭审判。著有关于阿拉伯军事史的学术著作。1961年逝世。"
 IRQ_tawfiq_al_suawaidi_desc:0 "陶菲克·苏瓦伊迪（Tawfiq al-Suwaidi，1892—1968）是伊拉克政治家、外交官，纳吉·苏瓦伊迪之弟，曾三度出任首相。生于巴格达一个学者、法官辈出的名门，先后就读伊斯坦布尔法学院与巴黎索邦大学，1914年学成回国。1929年首次组阁，年仅36岁，是伊拉克史上最年轻的首相。1932年伊拉克加入国际联盟后，他因精通法语等外语出任伊拉克首任常驻国联代表。此后长期活跃政坛，多次出任外交大臣、司法大臣，三度组阁（1929、1946、1950年），亦曾任摄政委员会成员及中央银行行长。1958年革命后因与王室关系密切被捕、判处终身监禁，1961年获赦后流亡黎巴嫩，1968年病逝于当地。"
 IRQ_werner_junck_desc:0 "维尔纳·容克（1895年—1976年），德国空军将领，1941年伊拉克战事中的“伊拉克飞行队长”（Fliegerführer Irak）。拉希德·阿里政变后，纳粹德国为支援伊拉克反英势力，匆忙组建了一支由梅塞施密特Bf 110战斗机及亨克尔He 111轰炸机组成的小型空军分遣队，经法属叙利亚中转部署至伊拉克，由容克指挥。然而这支增援力量规模有限、后勤困难，未能扭转战局，英军最终从哈巴尼亚基地反击成功，击败政变军队。容克随后撤离伊拉克。"
 IRQ_yasin_al_hashimi_desc:0 "亚辛·哈希米（1884年—1937年1月21日，卒于贝鲁特），伊拉克军人出身的政治家，两度出任首相。奥斯曼帝国军校出身，一战中参加阿拉伯民族主义运动。1920年代在伊拉克政坛崛起，以泛阿拉伯民族主义立场著称。1935年3月首次出任首相，在任期间推行征兵制并强化与德国的经贸关系。1936年10月巴克尔·西德基将军发动政变推翻其政府——这是现代阿拉伯世界首次军事政变。亚辛被迫流亡，先赴叙利亚后转赴黎巴嫩。1937年1月在贝鲁特因心脏病去世，终年约五十三岁。其弟塔哈·哈希米亦为军政要人，后在1941年政变前后发挥重要作用。"
 IRQ_yusuf_salman_yusuf_desc:0 "优素福·萨勒曼·优素福（1901年7月19日，生于巴格达—1949年2月14日，卒于巴格达），化名“法赫德同志”（阿拉伯语意为“豹”），伊拉克共产党奠基领袖。出身摩苏尔省巴尔泰拉的亚述族迦勒底天主教家庭，父亲靠卖糕饼为生。少年时在巴士拉基督教学校及美国教会学校受教育，1920年代末投身共产主义运动。1941年10月出任伊拉克共产党第一书记，此后十年间以铁腕组织才能将该党从地下小团体改造为拥有大量工人基层的群众性政党，成功在基尔库克油田、铁路及巴士拉港口工人中建立起强大的工会网络。1944年主持召开首届党代会并通过《国民宪章》。1947年1月被捕入狱，但在狱中继续遥控指挥党务。1948年“瓦斯巴”反英大起义中共产党发挥了核心动员作用，当局遂以组织煽动罪对法赫德进行军事审判。1949年2月14日他与两名同志在巴格达三个广场被分别公开绞死，遗体悬挂示众数小时，后被秘密葬于无标记墓穴。"
 PER_abdolhossein_hazhir_desc:0 "阿卜杜勒侯赛因·哈兹尔（1902年6月4日—1949年11月5日），伊朗政治家，曾十度入阁。1948年出任首相，任内因其政策受到卡沙尼教士及民族主义力量的猛烈抨击。卸任后转任宫廷大臣。1949年11月5日，年仅四十七岁的哈兹尔在德黑兰遭伊斯兰敢死队（费达伊安-伊斯兰）成员赛义德·侯赛因·伊玛米枪杀身亡，是继历史学家卡斯拉维之后该组织暗杀的又一位重要人物。该组织此后又于1951年暗杀首相拉兹马拉，其一系列政治暗杀事件深刻影响了1950年代初的伊朗政局走向。"
 PER_abdolsamad_kambakhsh_desc:0 "阿卜杜勒萨马德·坎巴克什（1902或1903年，生于加兹温—1971年），原名阿卜杜勒萨马德·阿德勒·卡扎尔，图德党强硬派核心人物，伊朗唯一的共产国际（第三国际）成员，与苏联情报机构（从OGPU到克格勃）保持长期密切联系。出身卡扎尔贵族家庭，1915年赴俄留学，受十月革命启发回国后加入伊朗社会党及共产党。1920年代获政府奖学金赴莫斯科大学深造，此后成为斯大林信赖的伊朗代理人。1937年作为五十三人案成员被捕入狱前，他曾秘密向苏方出卖阿拉尼小组情报。1941年获释后参与创建图德党，1944年当选中央委员，主导建立了图德党在军队中的秘密军事网络。1946年阿塞拜疆危机后遭通缉、军事法庭缺席判处死刑，流亡苏联直至逝世。学者评价他并非理论家，而是与苏联有强大个人关系的党务干部。"
 PER_abol_ghasem_kashani_desc:0 "赛义德·阿布-卡西姆·莫斯塔法维·卡沙尼（1882年11月19日—1962年3月14日），伊朗什叶派教士兼政治家，石油国有化运动中的关键宗教力量。出身教士家庭，十六岁入神学院、二十五岁获纳杰夫教法学位。一战期间在伊拉克参加1920年反英起义。因民族主义立场多次遭英方逮捕流放。1941年二战期间因被指控亲纳粹而遭英国逮捕、流放至巴勒斯坦。1950年回国后发起反英石油运动，发布教令宣布石油国有化为宗教义务，动员数万民众上街，并庇护激进组织伊斯兰敢死队。1951年石油国有化运动高潮期间出任议会议长，与摩萨台结成联盟。然而1953年他与摩萨台决裂，转向支持王室，在1953年8月政变中发挥了推波助澜的作用。后因承认曾下令暗杀拉兹马拉总理而遭短暂拘押，晚年退出政坛。霍梅尼视其为精神导师之一。1962年逝世。"
 PER_ahmad_ahmadi_desc:0 "艾哈迈德·艾哈迈迪（1885年，生于马什哈德—1944年10月），绰号佩泽什克·艾哈迈迪（意为医生艾哈迈迪），实为礼萨·沙时期德黑兰卡斯尔监狱中臭名昭著的狱中杀手。其真实身份并非医生而是护士，受命以向囚犯注射空气等方式秘密处决政治犯。已确认在其手下遇害的知名人物包括宫廷大臣泰穆尔塔什、诗人法罗赫·亚兹迪、萨达尔·阿萨德兄弟、马克思主义知识分子塔吉·阿拉尼等。每杀一人他通常获得十至十五图曼报酬，若受害者身份显赫则可得百图曼。1941年礼萨·沙退位后，他潜逃至伊拉克，被泰穆尔塔什之女伊朗·泰穆尔塔什追踪并安排引渡回伊朗受审。1944年被判处死刑并处决，临刑前高喊我不是凶手，我只是执行了上级命令。注意勿与#16埃米尔·艾哈迈迪将军混淆。"
 PER_ahmad_amir_ahmadi_desc:0 "艾哈迈德·埃米尔·艾哈迈迪，伊朗陆军中将，礼萨·沙时期核心将领之一。出身军人世家，入哥萨克学校受训，是1921年政变的重要策划者之一，与礼萨·汗及齐亚丁·塔巴塔别伊共同推翻卡扎尔末朝政府。政变成功后成为礼萨·沙最信赖的军人，是巴列维王朝首位获授塞帕赫博德（陆军中将）军衔者。1920—1930年代受命镇压卢里斯坦部族叛乱，手段强硬，被卢里人视为令儿童止啼的恐怖符号。1925年任全国治安总监。1941年礼萨·沙退位后出任福鲁吉内阁内务大臣，此后在卡瓦姆及苏海利内阁中出任陆军大臣，又任德黑兰军事总督、中央卫戍司令及军队总监等职。退休后获任命为参议员。1965年因癌症在德黑兰逝世。"
 PER_ahmad_khan_nakhjavan_desc:0 "艾哈迈德·汗·纳赫万，伊朗陆军少将兼首任空军司令。出身大不里士纳希切万名门（突厥康加尔部族）。1925年赴法国接受飞行训练，同年2月驾驶一架布雷盖-19型飞机从法国起飞、悬挂伊朗旗帜飞抵德黑兰加莱莫尔吉机场，成为伊朗航空史上首位驾驶本国飞机从国外飞入国境的伊朗飞行员，由此获伊朗首位飞行员之称。此后出任伊朗帝国空军首任司令（1924—1937年间数度任免），1929年晋准将。1940年出任代理陆军大臣。1941年英苏入侵期间，他主持最高军事会议提出停止抵抗及遣散部分军队的方案，触怒礼萨·沙，遭沙当场以手杖殴打并剥夺军衔、投入监狱。礼萨·沙退位后获释，9月20日在福鲁吉内阁中再度出任陆军大臣。此后历任军事督察及穆罕默德·礼萨·沙的军事办公室主任。1966年逝世。"
 PER_ahmad_mira_khosravani_desc:0 "艾哈迈德·米尔扎·霍斯拉瓦尼是巴列维王朝早期伊朗航空军的重要军官。1930年前后，他曾短暂主持陆军航空科事务，此后在1936年重新出任伊朗空军指挥官，1938年晋升将官。其任内，伊朗空军已由陆军内部的小型航空部门发展为独立军种，并在礼萨沙阿推动的军事现代化中持续扩编。1941年英苏入侵伊朗时，这支年轻空军尚未具备抵抗大国联合进攻的能力，机场、训练机构和飞机装备很快遭到占领与破坏，霍斯拉瓦尼的任期也随之结束。"
 PER_ahmad_zirakzadeh_desc:0 "艾哈迈德·齐拉克扎德，伊朗工程师出身的民族阵线政治家，石油国有化运动骨干。出身宗教家庭，早年入达尔奥尔富农学校，后获伊朗国防部奖学金赴巴黎理工大学攻读海洋工程。1935年回国后在胡齐斯坦海军任职，1941年调入交通部。1943年参与创建工程师协会（后改组为伊朗党），该组织成为民族阵线的核心组成部分。1951年摩萨台出任首相后，齐拉克扎德任经济部副部长；1952年以民族阵线候选人身份当选第十七届议会德黑兰代表，继续推动石油国有化事业。1953年政变当夜他在摩萨台家中，逃跑时摔断腿。政变后遭逮捕入狱数年。1980年赴美定居，晚年返回伊朗，遗嘱以个人财产设立齐拉克扎德科学基金会。"
 PER_ali_akbar_davar_desc:0 "阿里-阿克巴尔·达瓦尔，伊朗现代司法体系奠基人。早年就读于达尔奥尔富农学院，后赴瑞士日内瓦大学获法学学位。1921年回国，创办自由人报及激进党，当选第四、五、六届议会议员。1925年他是投票废黜卡扎尔王朝、拥立礼萨·汗的关键议员之一。1926年出任司法大臣，次年大胆解散旧有全部司法机构，延聘法国专家协助，以法国法典为蓝本全面重建伊朗司法体系，制定民事登记法、财产登记法、婚姻法等基础法规，奠定了伊朗现代法治基础。此后转任财政大臣，在福鲁吉内阁中推行税制改革、创办国家保险公司。1936年他曾期望出任首相未果，转觉失宠于礼萨·沙，加之保障德黑兰粮食供应的压力与日俱增，1937年2月10日在被沙严厉训斥后服鸦片自杀身亡，成为礼萨·沙专制统治吞噬自身功臣的标志性事件之一。"
 PER_ali_dashti_desc:0 "阿里·达什提，伊朗作家、报人兼政治家。出身什叶派教士家庭，少年时在卡尔巴拉及纳杰夫接受传统宗教教育，却拒绝走教士道路，转投新闻业。1922—1935年在德黑兰创办并主编《红色曙光》报，以世俗理性主义立场著称。1928年起多次当选议会议员，1946年因公开反对图德党入阁及对苏让步而入狱。1954年起出任参议员，兼任驻埃及及黎巴嫩大使。其文学生涯同样瞩目，精研哈菲兹、萨迪、鲁米等波斯古典诗人并撰写多部创新性文学评论。其最知名、也最具争议的著作《二十三年——穆罕默德先知生涯研究》以理性主义视角审视伊斯兰教创立史，挑战正统信仰叙事，生前匿名出版，遗嘱死后方可发行英文译本。1979年伊斯兰革命后遭逮捕入狱，在审讯中被殴打致股骨骨折，此后健康急剧恶化，1982年初在被拘禁状态下离世。"
 PER_ali_khan_mansour_desc:0 "阿里·汗·曼苏尔（1886年，生于德黑兰—1974年12月8日），号曼苏尔·莫尔克，两度出任伊朗首相（1940—1941年、1950年）。历任呼罗珊及阿塞拜疆省总督、驻意大利与土耳其大使等职，先后六次入阁。1940年出任首相，1941年8月英苏入侵伊朗后数日即辞职下台，由福鲁吉接替处理危局。1950年4月再度出任首相，但此时伊朗国内石油国有化运动高涨，曼苏尔无力驾驭局势，仅在任数月即于同年6月辞职，由拉兹马拉将军接任。其子哈桑·阿里·曼苏尔后来亦出任首相（1964—1965年），1965年遭伊斯兰敢死队成员暗杀身亡。"
 PER_ali_razmara_desc:0 "哈吉·阿里·拉兹马拉，伊朗陆军中将，1950—1951年任首相。出身军官家庭，毕业于法国圣西尔军校，归国后在军中迅速晋升，曾主持编纂伊朗军事地理志。1946年受命率军南下平定与苏联扶植的阿塞拜疆分裂势力有关的动乱。1950年6月在英方推动下被沙任命为首相，任内力推行政分权化改革，但在石油国有化问题上持审慎立场，反对立即全面国有化，认为伊朗尚不具备独立运营石油工业的技术条件，此举使他同时遭到民族阵线及宗教极端势力的强烈敌视。1951年3月7日，拉兹马拉前往沙皇清真寺参加追悼仪式时，被伊斯兰敢死队成员哈利勒·塔赫马塞比连开三枪射杀，是伊朗历史上第三位遇刺身亡的首相。其遇刺后不到两个月，摩萨台即出任首相并推动石油国有化法案通过。"
 PER_andre_godard_desc:0 "安德烈·戈达尔，法国考古学家、建筑师兼中东艺术史学者。巴黎美术学院毕业，1910年首赴中东从事考古发掘。1928年受礼萨·沙之命出任伊朗考古局局长，此后主持该局工作长达三十余年（1928—1953年、1956—1960年）。他设计了伊朗国家博物馆（1936年落成并出任首任馆长），该建筑以萨珊王朝拱门为灵感、成为德黑兰地标。此外他与同事西鲁合作设计了德黑兰大学主校区、伊朗国家图书馆及设拉子哈菲兹陵墓等重要建筑。任内他主持修复了伊斯法罕聚礼清真寺、沙皇清真寺及谢赫·洛特福拉清真寺等伊朗重要历史建筑，并组织卢里斯坦青铜器及波斯波利斯的大型发掘。二战期间支持自由法国运动，维希政府代表离开德黑兰后出任法国临时政府驻伊朗外交代表。著有《伊朗的艺术》。1960年返回巴黎，1965年逝世。他是法国籍考古学家与建筑师，其在伊朗的影响主要来自长期主持考古、博物馆与公共建筑事务。"
 PER_ardeshir_ovanessian_desc:0 "阿尔达希尔·奥瓦内西安，亚美尼亚裔伊朗共产主义领导人，图德党创始成员之一。出身拉什特亚美尼亚家庭（祖籍萨尔马斯），学成药剂师后投身激进政治运动。1923年加入伊朗共产党，1925年赴莫斯科东方劳动者共产主义大学受训，回国后组建药剂师工会，在伊朗共产党内从事组织工作。后被捕入狱长达十一年，在卡斯尔监狱中他组织囚犯的文化教育活动并自学法语。1941年获释后参与创建图德党，任临时中央委员会委员。1944年以亚美尼亚少数族裔代表身份当选第十四届议会议员，同年主持图德党首届代表大会并当选中央委员。此后在阿塞拜疆地区领导图德党工会运动及农民运动，参与组织1945年的阿塞拜疆自治运动。阿塞拜疆人民政府崩溃后流亡苏联，定居埃里温直至1990年逝世。"
 PER_arthur_millspaugh_desc:0 "阿瑟·切斯特·米尔斯波（1883年—1955年），美国人，曾两度受聘主理伊朗财政的美方顾问。密歇根州奥古斯塔人，先后就读于阿尔比恩学院、伊利诺伊大学及约翰斯·霍普金斯大学，获政治学博士。曾任教政治学、在美国国务院外贸顾问办公室任职。1922年应伊朗政府之请赴德黑兰出任财政总监，抵达时国库空虚、财政混乱，他在伊朗军政当局配合下成功实现预算平衡并使伊朗摆脱对外国贷款的依赖，但其新税法加重了底层民众负担，被礼萨·沙用于为纵贯铁路筹资。1927年因屡次拒绝满足沙增加军费开支的要求而被解约。1942年应第十三届议会之邀再度赴伊主理财政，但此次任务受制于伊朗国内政治纷争、既得利益集团阻挠及频繁的内阁更迭而未能取得理想成效，1945年被终止职务。著有《美国人在波斯》等书，晚年对伊朗自治能力持悲观态度。他是美国籍外部财政顾问，其影响主要来自伊朗政府授予的财政整顿职权，而非伊朗本国官僚体系。"
 PER_bahram_aryana_desc:0 "巴赫拉姆·阿里亚纳，原名侯赛因·马努切赫里，伊朗帝国陆军元帅，穆罕默德·礼萨·沙时期最高军事指挥官。母为格鲁吉亚赫拉克略二世国王后裔。他是巴列维时代最著名的皈依琐罗亚斯德教者，1950年改名巴赫拉姆·阿里亚纳以示其波斯民族主义与古代伊朗文化认同。军旅生涯中历任多个高级指挥职务，曾任库尔德斯坦军事总督，深受当地库尔德民众爱戴。他的复古民族主义倾向日趋极端，甚至以《列王纪》取代办公室中的《古兰经》、提议以拉丁字母书写波斯文以切断与阿拉伯文化的联系，萨瓦克认为其观点有伤风化。1969年在沙的间接命令下离开伊朗赴巴黎。1979年革命后从事反霍梅尼流亡运动。1985年在巴黎逝世，葬于蒙帕纳斯公墓。"
 PER_dalir_pesyan_desc:0 "架空虚构人物。\"达利尔\"（Dalir）在波斯语中意为\"勇敢\"。"
 PER_davud_monshizadeh_desc:0 "达武德·蒙希扎德，伊朗亲纳粹政治家兼伊朗学学者。1931年赴法国留学，后转赴纳粹德国，在柏林洪堡大学获哲学与文学博士。二战期间为纳粹担任翻译、从事反盟国宣传，并加入党卫军，参加柏林战役时负伤。1943年获博士学位。战后任慕尼黑大学伊朗学教师。1951年返回伊朗，次年创立伊朗国家社会主义工人党（SUMKA），该组织公然模仿纳粹党的组织形式与意识形态符号，在石油国有化运动中充当反国有化力量。该党虽影响有限，但是冷战初期中东亲法西斯运动的典型案例。蒙希扎德后移居瑞典，出任乌普萨拉大学伊朗语言教授直至逝世。"
 PER_fakhrafagh_parsa_desc:0 "法赫尔-阿法赫·帕尔萨，1898年生于德黑兰，伊朗早期妇女权利活动家、记者。1920年在马什哈德创办《妇女世界》杂志，宣传女性教育权利并呼吁修改婚姻法，成为伊朗历史上首位因新闻活动而遭流放的女记者。其文章引发教士阶层愤怒，宗教狂热者袭击了杂志社和她的住宅。此后她与丈夫被流放至阿拉克，后辗转于库姆度过两年流放生涯。回到德黑兰后加入穆赫塔拉姆·伊斯坎达里创立的爱国妇女联盟，继续投身妇女权利事业。她的女儿法罗赫鲁·帕尔萨后来成为伊朗历史上首位女性内阁部长（1968年出任教育大臣），1980年伊斯兰革命后被处决。"
 PER_fawzia_faud_desc:0 "法齐娅·福阿德，埃及公主，穆罕默德·礼萨·巴列维首任王后。为埃及国王福阿德一世之女、法鲁克国王之妹，曾在瑞士接受教育，通晓阿拉伯语、法语和英语。1939年与伊朗王储穆罕默德·礼萨成婚，这桩婚姻本质上是埃及与伊朗两个王室之间的政治联姻，旨在展示逊尼派与什叶派王室之间的团结。1940年生下女儿沙赫纳兹。然而法齐娅在德黑兰生活极不适应，多次出现抑郁及厌食症状，1945年返回开罗后再未回伊朗。1948年双方离婚。1949年她在开罗改嫁伊斯梅尔·希林，此后婚姻维持四十五年。晚年居住在亚历山大，2013年逝世。她并非伊朗官员，而是埃及王室成员与巴列维王朝的王室外戚，其政治意义主要体现在两国王室联姻。"
 PER_fazlollah_zahedi_desc:0 "法兹洛拉·扎赫迪，伊朗陆军中将，1953年英美政变的出面执行者。出身哈马丹大地主家庭，为苏菲派圣者扎赫德·吉拉尼后裔。早年入波斯哥萨克旅服役，礼萨·汗即其军中上级。1920年代以平定库尔德叛乱及镇压胡齐斯坦阿拉伯自治运动而崛起，礼萨·沙先后委任其为胡齐斯坦及伊斯法罕省军事总督。1942年英军怀疑他与德国人密谋并囤积粮食牟利，将其逮捕并拘禁于巴勒斯坦至1945年。战后回国历任南部军区视察员、全国警察总监及参议员。1951年出任摩萨台内阁内务大臣，后因政见不合辞职。1953年8月，在美国中央情报局与英国军情六处策动下，沙签署解除摩萨台职务的敕令，任命扎赫迪为首相。首次政变尝试失败、沙出逃后，扎赫迪于8月19日发动第二次政变成功推翻摩萨台，执政至1955年。此后任驻日内瓦联合国大使，1963年在日内瓦逝世。"
 PER_gholam_ali_oveissi_desc:0 "戈拉姆·阿里·奥韦西（1918年4月16日—1984年2月7日），伊朗帝国陆军四星上将，穆罕默德·礼萨·沙时期陆军总司令（1972—1978年）。与王储穆罕默德·礼萨自军校起即为同窗密友。军校毕业后长期在法尔斯省及各地部队服役，1960年成为同侪中最年轻的四星上将。1978年出任德黑兰戒严司令，在革命风暴中实施军事管制，其名与1978年9月8日黑色星期五事件密切相关——当日安全部队向示威者开枪，造成数十人死亡。1979年1月被迫辞职离国。流亡后积极从事反霍梅尼活动，联络美国中情局及伊拉克萨达姆政权。1984年2月7日在巴黎与其弟一同遭暗杀，伊斯兰圣战组织宣称负责。"
 PER_gholamali_bayandor_desc:0 "戈拉姆-阿里·巴扬多，伊朗帝国海军首任司令（1933—1941年），祖先可追溯至拜延杜尔突厥部族。在礼萨·沙推行海军现代化期间，他主持向意大利采购军舰并在意大利顾问协助下培训伊朗海军军官，建立了霍拉姆沙赫尔及安扎利港等海军基地。1941年8月25日英苏联合入侵伊朗，英国皇家海军及澳大利亚海军对波斯湾伊朗舰艇发动突袭，在霍拉姆沙赫尔击沉伊朗军舰虎号等多艘战舰。巴扬多在混乱中亲赴前线指挥抵抗，在赶往霍拉姆沙赫尔海军总部途中被英印部队射杀殉国，其弟——里海舰队代理指挥官叶海亚·巴扬多上校同日亦在苏军空袭安扎利港中阵亡。英军进攻舰队指挥官科斯莫·格雷厄姆准将在报告中称其死讯令所有认识他的人惋惜，他聪明、能干，对波斯忠心耿耿。1964年伊朗海军以其名字命名一艘护卫舰。"
 PER_ghulam_yahya_daneshian_desc:0 "古拉姆·叶海亚·达内希安，伊朗阿塞拜疆裔政治家与军人，苏联扶植的阿塞拜疆人民政府（1945—1946年）军政核心成员之一。早年曾赴巴库油田劳动，精通群众动员。1941年获释后加入图德党，出任阿塞拜疆省委委员。1945年阿塞拜疆民主党成立后加入，成为准军事组织费达伊的组建者之一，在皮什瓦里内阁中任国防部副部长（副于贾法尔·卡维安）。1946年12月伊朗中央政府军收复阿塞拜疆后，他随皮什瓦里等人经朱尔法边境逃入苏联，此后长期定居巴库。1960年阿塞拜疆民主党与图德党合并后，他进入图德党中央委员会，在党内人事安排中发挥重要影响（包括推动伊拉吉·伊斯坎达里出任第一书记）。一度被指控参与将党内异见者流放西伯利亚。1983年在巴库逝世。"
 PER_hasan_arfa_desc:0 "哈桑·阿尔法（1895年，生于第比利斯—1984年），伊朗陆军少将，外交官。其父为资深外交官礼萨·阿尔法亲王，母亲兼有英国及俄国（杰米多夫家族）血统。少年在法国接受教育，1912年入伊斯坦布尔军校，1914年回国选择从军。一战后加入新建陆军，1921年在平定库尔德叛乱中初识礼萨·汗，此后成为巴列维王朝终身忠诚支持者。1926年曾短暂出任驻伦敦武官并迎娶英国芭蕾舞者希尔达·贝维克为妻，后赴法国参谋学院深造。1936年任骑兵与装甲兵总监，1939年晋准将。1941年英苏入侵时被沙任命为德黑兰防御参谋长。1944年12月出任陆军参谋长，任内向沙赫塞万部族提供武器以对抗苏联扶植的阿塞拜疆分裂势力，1946年2月卸任。此后历任驻土耳其及巴基斯坦大使。著有回忆录《在五位沙皇治下》及《库尔德人》等书，是研究二十世纪伊朗军政史的重要一手文献。"
 PER_hassan_majid_firooz_desc:0 "马吉德·菲鲁兹是伊朗军官，第二次世界大战期间短暂主持伊朗空军事务。1941年英苏入侵后，伊朗空军遭受沉重打击，基地被占、训练停顿、飞机被拆解或接收，指挥系统也频繁更换。菲鲁兹并非典型空军出身军官，却在1942年前后接手空军指挥，并于1943年一度与米尔—穆罕默德·穆罕纳共同负责空军事务。在战时占领环境下维持残存机构运转。"
 PER_iraj_eskandari_desc:0 "伊拉吉·伊斯坎达里，伊朗图德党（人民党）创始人之一及长期领导人。出身卡扎尔王族，其父叶海亚·米尔扎为第一届议会进步派议员，叔父苏莱曼·伊斯坎达里为社会主义运动先驱。早年就读于达尔奥尔富农学院及德黑兰政治学院，1930年代初结识马克思主义理论家塔吉·阿拉尼，协助创办《世界》杂志，参与传播马克思主义。1937年作为五十三人案成员被捕入狱，1941年英苏入侵后获释，随即参与创建图德党，出任首任总书记。1944年当选第十四届议会议员，在议会中主张向苏联让渡北部石油开发权——此举后来令他深感悔恨，摩萨台曾当面严厉训斥他这一立场。1946年出任卡瓦姆联合内阁的工商大臣。1949年刺杀沙未遂事件后图德党遭取缔，他被缺席判处死刑，此后流亡海外近三十年。1969年出任图德党第一书记直至1979年，因拒绝支持霍梅尼而被党内解职，由基亚努里取代。晚年竭力阻止图德党分裂未果，1985年病逝于莱比锡。他还将马克思《资本论》全三卷译为波斯语。"
 PER_jafar_kavian_desc:0 "贾法尔·卡维安，本名贾法尔·马马德扎德，伊朗阿塞拜疆裔革命军人，阿塞拜疆人民政府国防部长（人民军部长）。早年即投身革命运动，先后参加立宪运动、希亚巴尼起义及拉胡蒂起义，在历次起义中率领费达伊武装作战。1945年苏联扶植皮什瓦里在大不里士建立阿塞拜疆人民政府后，卡维安被任命为人民军部长，主持组建克孜勒巴什人民军（以萨法维王朝军队命名），短时间内集结三百名军官、将部队扩充至一万八千人。1946年12月人民政府在苏军撤离后瓦解，卡维安随即流亡苏联定居巴库。1975年在巴库逝世。"
 PER_karim_buzarjamehri_desc:0 "1886年生。少年时代即接受军事训练，后成为礼萨·巴列维最信任的军政人物之一。礼萨沙阿掌权后，布扎尔乔梅里长期活跃于巴列维政权的军政体系中，也曾参与德黑兰市政事务。1941年英苏入侵伊朗后，礼萨沙阿被迫退位并离开德黑兰，布扎尔乔梅里亦随其一同被排挤出权力中心。晚年他还承担过护送礼萨沙阿遗体返回伊朗的任务，是巴列维王朝早期军人集团中的亲信代表。"
 PER_kazem_hasibi_desc:0 "卡泽姆·哈西比，伊朗工程师、大学教授兼民族阵线政治家，摩萨台的首席石油顾问。出身商人家庭，早年毕业于德黑兰法律学校，后赴法国就读于巴黎综合理工学院，获矿业工程学位。1941年回国后在德黑兰大学工程学院任教，同年与齐拉克扎德等人共同创立工程师协会。在石油国有化运动中，他主持撰写了对英伊石油公司四十五年资产负债表的全面分析报告，该报告在议会中宣读数日，成为推动国有化立法的关键技术依据。1951年任摩萨台内阁财政部副部长及石油国有化谈判代表团成员。他立场强硬，拒绝参加哈里曼主持的英伊调解谈判，后参与斯托克斯调解。学者评价他虽忠诚于国有化事业、信仰虔诚，但行事刻板、对国际石油政治的复杂性认识不足，对谈判失败负有部分责任。1953年政变后被捕，获释后继续活跃于民族阵线。1990年在德黑兰逝世。"
 PER_mahmud_jam_desc:0 "马哈茂德·贾姆，号莫迪尔-莫尔克，礼萨·沙时期首相（1935年12月—1939年10月）。早年在大不里士自学法语并入法国使馆任翻译，此后进入文官系统，1921年在齐亚丁内阁中出任外交大臣，历任克尔曼及呼罗珊省总督、内务大臣等职。出任首相期间恰逢礼萨·沙专制统治最黑暗的时期，泰穆尔塔什、达瓦尔、莫达雷斯等前朝重臣已相继被清洗，贾姆作为温顺的行政官僚得以留任近四年，其间经手的两件大事为1936年强制揭面纱运动和1937年签订《萨达巴德公约》（伊朗、土耳其、伊拉克、阿富汗四国互不侵犯条约），任内还赴埃及为王储穆罕默德·礼萨与法齐娅公主联姻事宜斡旋。1939年卸任后转任宫廷大臣。穆罕默德·礼萨·沙时期历任驻埃及大使、陆军大臣及参议员。1969年在德黑兰逝世。"
 PER_mohammad_ali_foroughi_desc:0 "穆罕默德·阿里·福鲁吉，号佐卡奥尔-莫尔克，伊朗学者型政治家，三度出任首相（1926年、1933—1935年、1941年）。出身伊斯法罕商人家庭，早年就读于达尔奥尔富农学院，1907年出任德黑兰政治学院院长，1909年当选议员并历任议长、多部大臣及最高法院院长。1925年作为代理首相主持礼萨·汗加冕仪式。1935年因姻亲涉入马什哈德反世俗化骚乱而被罢黜。1941年英苏入侵后，礼萨·沙在王朝存亡之际重新起用福鲁吉，后者成功说服盟国保留巴列维王朝、由王储穆罕默德·礼萨继位，主持了这一关键权力交接。此外，他创立伊朗学院（波斯语科学院）并主持重修菲尔多西陵墓，著有《哲学在欧洲的演进》等学术专著，精心校勘了萨迪、哈菲兹、鲁米等波斯古典大家的作品集。1942年在德黑兰逝世。"
 PER_mohammad_hassan_mirza_desc:0 "穆罕默德·哈桑·米尔扎，卡扎尔王朝末代储君，末代沙阿赫迈德·沙之弟。1909年因兄长尚无男嗣而被立为王储，1918—1924年出任阿塞拜疆省总督。1923年阿赫迈德·沙赴巴黎后久不归国，穆罕默德·哈桑以储君身份出任摄政。1924年他成功联合议会力量阻止礼萨·汗宣布共和国的计划，维护了君主制框架，但这一胜利转瞬即逝——1925年议会废黜卡扎尔王朝，礼萨·汗自立为沙，穆罕默德·哈桑被驱逐出国，流亡英国。1930年兄长阿赫迈德·沙去世后，他自立为流亡沙皇，但未获国际承认。1943年在英国梅登黑德逝世，遗体葬于伊拉克卡尔巴拉。其子哈米德·米尔扎曾在二战中一度被英方视为取代巴列维王朝的备选人物，但因不通波斯语而未被采纳。"
 PER_mohammad_mosaddegh_desc:0 "穆罕默德·摩萨台，伊朗民族主义政治家，二十世纪伊朗最具影响力的政治人物之一。出身卡扎尔贵族家庭，父为财政大臣，少年即获摩萨台封号。留学巴黎、纳沙泰尔及洛桑大学，获法学博士学位后归国，历任法尔斯省总督、财政大臣及外交大臣等职。1923年当选议员，1925年因反对礼萨·汗称帝而被迫退出政坛。1944年复出，当选议员后迅速崛起为民族主义阵营领袖，成功阻止苏联获取北部石油租让权。1951年出任首相，主导将英伊石油公司国有化，此举震动全球石油格局，引发英国全面经济封锁与外交对抗。1953年8月，英美情报机构联合策动政变（代号阿贾克斯行动）将其推翻，扎赫迪将军取而代之。摩萨台被军事法庭判处三年监禁，此后被软禁于艾哈迈达巴德庄园直至1967年逝世，终年八十四岁。他至今仍是伊朗民族主权与反帝国主义运动的象征性人物。"
 PER_mohammed_nakhjavani_desc:0 "第二次世界大战时期伊朗空军指挥官。1942年，英苏入侵伊朗后的占领局面仍未结束，伊朗空军在基地、训练、装备和人员方面均受到严重削弱。纳赫贾瓦尼在这一时期接替马吉德·菲鲁兹主持空军事务，任期延续至1943年。"
 PER_mohammed_reza_pahlavi_desc:0 "穆罕默德·礼萨·巴列维，巴列维王朝末代沙，礼萨·沙长子。1926年被立为王储，少年时赴瑞士洛赛学校求学，1935年回国入军校。1939年迎娶埃及法齐娅公主。1941年英苏入侵后其父被迫退位，年仅21岁的他于9月16日继位。即位初期权力受限于盟国占领与议会政治，1945—1946年成功化解苏联扶植的阿塞拜疆分裂危机。1951年摩萨台主导石油国有化运动，双方权力斗争激化，1953年8月沙一度出逃，旋即在英美情报机构策动下由扎赫迪将军发动政变推翻摩萨台，此后巩固个人权力。1963年发起白色革命推行土地改革、工业国有化及妇女解放等现代化举措，但同时以秘密警察萨瓦克严酷镇压异见。1970年代石油繁荣期间权势达到顶峰，1979年伊斯兰革命爆发后流亡海外，1980年病逝于开罗。"
 PER_mohtaram_eskandari_desc:0 "穆赫塔拉姆·伊斯坎达里（1895年—1924年7月27日），伊朗妇女运动先驱，卡扎尔王族出身。出身于政治活跃、思想开明的伊斯坎达里家族。1922年她在德黑兰创立爱国妇女联盟，这是伊朗历史上第一个妇女权利组织，并创办同名报刊《爱国妇女》。该组织致力于推动女性教育、保护孤女、建立贫困妇女医院，同时呼吁妇女争取社会权利、反对包办早婚与文盲现象。穆赫塔拉姆亲自演讲宣传妇女权利，组织协会成员参加集会游行，为伊朗现代妇女运动奠定了基础。1924年7月27日逝世，年仅二十九岁。"
 PER_nikolai_markov_desc:0 "尼古拉·利沃维奇·马尔科夫，俄裔建筑师，二十世纪初德黑兰城市建筑的重要塑造者。出身俄国贵族家庭，先后在圣彼得堡帝国美术学院学习建筑并在圣彼得堡大学东方学系研修波斯语。一战期间在高加索地区俄军服役，十月革命后随白军辗转至伊朗，在波斯哥萨克旅中升至参谋长，并获授伊朗将军军衔。1921年退役后选择定居德黑兰，创办私人建筑事务所。1920—1930年代他为德黑兰设计并建造了数十座建筑，包括财政部、国防部、司法部、邮政总局、意大利大使馆、阿尔博兹中学、圣尼古拉斯俄国东正教堂等，风格融合装饰艺术、俄罗斯、拜占庭及伊朗传统元素，被誉为将旧建筑与新建筑巧妙衔接的纽带。他惯用的20×20厘米砖块在伊朗被称为马尔科夫砖。虽为东正教徒，他亦设计了法赫尔特·道莱及阿敏·道莱清真寺。1957年在德黑兰逝世，葬于杜拉布俄国公墓。他是俄裔归化伊朗的建筑师，其履历横跨俄国军旅、波斯哥萨克旅与德黑兰现代建筑实践。"
 PER_reza_mizani_desc:0 "伊朗早期航空事业的筹建人员。1923年，伊朗开始在陆军体系内建立航空部门时，他被任命负责陆军航空科事务。当时伊朗尚缺乏成熟的飞行员、地勤体系和机场设施，航空力量仍停留在采购飞机、训练人员和建立行政机构的起步阶段。米扎尼的任期虽短，却处在伊朗空军制度化的开端。此后，艾哈迈德·纳赫贾万等受过飞行训练的军官逐步接手航空部门，伊朗空军也从陆军内部小机构发展为独立军种。"
 PER_reza_shah_pahlavi_desc:0 "礼萨·沙·巴列维，巴列维王朝开创者，伊朗近代史上最具争议的君主之一。出身军人家庭，幼年丧父，入波斯哥萨克旅从军，凭借过人意志与军事才能逐级晋升。1921年2月联合齐亚丁·塔巴塔别伊发动政变推翻卡扎尔末朝政府，出任军队总司令兼陆军大臣，迅速掌握实权。1923年出任首相，1925年议会废黜长年旅居欧洲的卡扎尔末代沙阿赫迈德·沙，制宪会议选举礼萨·汗为沙，开创巴列维王朝。在位期间推行大刀阔斧的世俗化与现代化改革：打破部族割据、废除外国特权与治外法权、修筑纵贯伊朗铁路、建立世俗司法与教育体系、强制推行礼帽令与揭面纱运动、创办德黑兰大学，同时以铁腕手段压制教士阶层与政治异见。1930年代与纳粹德国经贸关系日趋密切，引发英苏警惕。1941年8月英苏联合入侵伊朗，礼萨·沙被迫于9月16日退位，传位于长子穆罕默德·礼萨，本人先后被流放至毛里求斯及南非。1944年在约翰内斯堡逝世。"
 PER_rokneddin_mokhtari_desc:0 "罗克内丁·莫赫塔里，伊朗身兼两重身份的奇特人物——既是礼萨·沙时期以严酷著称的警察总监，也是一位卓越的小提琴家与作曲家。早年在克尔曼沙赫学习卡曼契琴，后转习小提琴，师从侯赛因·伊斯梅尔扎德并结交了传奇琴师达尔维什·汗，在伊朗传统音乐创作方面颇具天赋，尤以马胡尔调式的皮什达拉马德（序曲）闻名。然而在行政生涯中，他于1935年接替流亡的艾罗姆上校出任礼萨·沙的警察总部负责人，以铁腕手段执行沙的治安命令直至1941年。礼萨·沙退位后他被逮捕受审，1942年被判处八年监禁，1945年获减刑释放，此后再未恢复往日活跃。"
 PER_ruhollah_khomeini_desc:0 "鲁霍拉·穆萨维·霍梅尼，什叶派教士，1979年伊斯兰革命领袖及伊朗最高领袖。出身教士世家，父亲在他出生五个月时被杀害。约1921年追随导师哈埃里·亚兹迪迁至库姆神学院研习伊斯兰法学、哲学及神秘主义，此后长期在库姆讲授教法与伦理。1930年代已是库姆颇受尊重的教师，但尚未涉足政治。1942年发表首部政治性著作《揭秘》，逐条驳斥世俗主义者对伊斯兰教的攻击，同时谴责礼萨·沙的世俗化政策——这是他反对巴列维王朝的最早公开表态。1940—1950年代他专注于宗教教学与学术写作，未直接参与摩萨台时期的政治斗争。1963年大阿亚图拉博鲁杰尔迪去世后成为宗教权威，随即公开抨击沙的白色革命及对以色列和美国的臣服，引发大规模骚乱，被捕入狱后于1964年被驱逐出境，先后流亡土耳其、伊拉克纳杰夫及法国巴黎近郊。在纳杰夫期间他系统阐发法基赫的监护权理论，主张由最高宗教法学家统治国家。1979年2月返回伊朗，领导推翻巴列维王朝的革命，建立伊斯兰共和国并出任终身最高领袖直至1989年逝世。"
 PER_soleiman_eskandari_desc:0 "苏莱曼·米尔扎·伊斯坎达里（约1875年—1944年1月7日），伊朗卡扎尔王族出身的社会主义政治家，图德党首任主席。其兄叶海亚·米尔扎因1908年穆罕默德·阿里·沙炮轰议会事件受伤殉难，苏莱曼由此投身立宪运动，成为民主党在第二至五届议会的主要代言人，以坚决反英立场著称，获英国人冠以饶舌亲王之绰号。1920年代先后赴苏联、德国及法国，会晤苏联外交官员及法共领袖卡尚等人。礼萨·沙当政后被排斥出政坛长达十余年。1941年礼萨·沙退位后，苏莱曼与驻伊苏军取得联系，于同年9月29日在德黑兰主持召开图德党创立大会并当选首任主席。作为虔诚穆斯林，他一度主张禁止女性入党，并在党内设立祈祷室、组织穆哈兰姆仪式，试图以此争取宗教群众，但此路线很快被党内激进派否定。1944年1月逝世，此后图德党迅速左转。"
 PER_teymourtash_desc:0 "阿卜杜勒-侯赛因·泰穆尔塔什，巴列维王朝首任宫廷大臣，礼萨·沙早期最具权势的辅臣。出身呼罗珊地主家庭，少年时赴俄国圣彼得堡军校求学长达十一年，兼通俄、法、英等多国语言。回国后投身立宪运动，当选多届议会议员，1921年政变后成为礼萨·汗最早的坚定支持者。1925年礼萨·汗称帝后，泰穆尔塔什出任宫廷大臣，礼萨·沙公开宣称泰穆尔塔什之言即朕之言，他实际负责国家现代化的蓝图设计与外交事务，包括主持1926年加冕典礼、废除外国治外法权、与苏联谈判新约，并在与英伊石油公司的谈判中力争修改不平等的达西石油租让协议。1932年底突遭礼萨·沙猜忌免职，旋即以捏造的贪腐罪名被捕入狱。1933年10月3日在卡斯尔监狱中身亡，终年约五十岁，普遍被认为系遭狱方毒杀，成为礼萨·沙翻脸清洗功臣的典型案例。"
 PER_teymur_bakhtiar_desc:0 "泰穆尔·巴赫蒂亚尔，伊朗陆军将领，萨瓦克（SAVAK，国家安全与情报组织）创始人兼首任局长。出身巴赫蒂亚里大部族名门，少年赴贝鲁特法国学校及巴黎圣西尔军校求学，回国后入德黑兰军校。1953年政变后被召回德黑兰晋准将，出任德黑兰戒严司令，主持清洗图德党及伊斯兰敢死队。1956年出任新成立的萨瓦克首任局长，以铁腕手段镇压一切反对力量。1961年因图谋扩权并被发现秘密接触肯尼迪政府而遭沙猜忌免职，遂成为沙的宿敌。此后流亡欧洲、黎巴嫩及伊拉克，广泛联络包括霍梅尼、图德党领袖在内的各路反沙势力。1970年8月12日，萨瓦克特工伪装为其支持者，在伊拉克一次狩猎活动中将其射杀，沙本人事后公开承认这是其个人的成功之举。"
 PER_zia_ol_din_tabatabee_desc:0 "赛义德·齐亚丁·塔巴塔别伊，伊朗报人兼政治家，1921年政变的文职策划者。出身教士家庭，早年投身新闻业，先后创办《闪电》《雷声》等报刊，一战期间以亲英立场著称。1921年2月与礼萨·汗联手发动政变推翻卡扎尔末朝政府，年仅三十三岁即出任首相，上台后下令逮捕旧贵族、宣布戒严、推行激进改革，但仅在任九十三天即因与礼萨·汗生隙而被迫辞职流亡。此后长期侨居巴勒斯坦，在贝特哈农经营农场。二战期间获准回国从政，以坚决反共立场著称，成为抵御苏联压力的重要政治力量，1940年代一度被沙视为首相人选。战后投身政党政治，组建民族意志党对抗图德党，晚年影响力渐衰。1969年在德黑兰逝世。"
 POL_aleksander_kakowski_desc:0 "卡科夫斯基生于1862年2月5日，普热什尼什附近登比尼村，1886年在华沙晋铎，翌年起在华沙神学院任教。1910年出任圣彼得堡罗马天主教神学院院长，1913年7月晋牧，同年9月起出任华沙总主教，成为波兰王国末代名义primate。第一次世界大战爆发后留驻华沙，1917年9月受德占当局委任为“摄政议会”三摄政之一，与卢博米尔斯基公爵、约瑟夫·奥斯特罗夫斯基共同构成过渡最高权力机构。1919年11月主持为教廷驻波兰大使拉蒂祝圣（后者即后来的教皇庇护十一世），同年12月本人获擢升为枢机。任华沙总主教期间大力扶植天主教报刊事业，推动华沙大学神学系及“公教行动”运动的建立。1938年12月30日在华沙逝世，安葬于布鲁德诺公墓。"
 POL_anna_andersson_desc:0 "安娜·安德森原名弗兰齐丝卡·尚兹科夫斯卡，约1896年生于西普鲁士。1920年她在柏林获救后长期自称为俄国沙皇尼古拉二世幼女阿纳斯塔西娅，是罗曼诺夫皇室遇害案后最著名的冒名者之一。她先后在德国和美国生活，并长期通过诉讼争取承认其罗曼诺夫身份；1970年西德法院以证据不足驳回其主张。1984年2月12日，她在美国弗吉尼亚州夏洛茨维尔去世。20世纪90年代遗传检测显示，她与尚兹科夫斯基家族更接近，而非罗曼诺夫家族。"
 POL_boleslaw_bierut_desc:0 "比鲁特生于1892年4月18日，卢布林近郊鲁雷村贫苦农民家庭，未完成小学学业，1905年因参与反俄语教学抗议遭学校开除。青年时投身合作社运动，1910年结识影响其走向社会主义的扬·亨佩尔，1912年加入地下社会主义运动，一战前加入“波兰社会党左派”，1918年该党并入共产党，比鲁特自此成为共产党人。1920年代在波兰共产党及合作社运动内部逐步晋升，1925年起多次赴苏联，就读共产国际“列宁学校”接受政治、军事及情报训练，1931至1932年化名“伊万诺夫”任共产国际驻奥地利、保加利亚、捷克斯洛伐克特派员。1933年因“反国家活动”在波兰被判十年监禁（实际服刑至1938年获特赦）。1938年斯大林下令解散波兰共产党期间，他因深得斯大林信任而幸免于随后的大清洗，赴苏联定居。1943年返回波兰，出任苏联扶植的“国家全国委员会”主席（1944—1947，实际行使国家元首职权），1947至1952年任波兰总统，1952至1954年任部长会议主席（总理），同时1948至1956年出任波兰统一工人党第一书记，是战后波兰人民共和国的实际缔造者及“波兰的斯大林”。任内推行全面苏维埃化，纵容公安部对地下抵抗力量及政治异见人士的系统性镇压与处决，并主导华沙重建及文化宫等地标建设。1956年3月赴莫斯科出席苏共二十大，聆听赫鲁晓夫“秘密报告”批判斯大林个人崇拜后健康急剧恶化，3月12日在莫斯科因心脏病发作去世，遗体运回华沙以隆重国葬安葬于鲍翁兹基军人公墓。"
 POL_boleslaw_piasecki_desc:0 "皮亚塞茨基生于1915年2月18日，罗兹，出身没落贵族家庭，两岁随父母迁居华沙。青年时投身极右翼民族主义运动，是“民族激进营”（ONR）领导层的重要成员之一。1934年因内政部长遭乌克兰民族主义者刺杀后当局大规模拘捕ONR活动分子，他被关押于别雷扎-卡尔图斯卡拘留营；此后其派系另立门户，创办《方阵报》（Falanga），“民族激进营法兰吉”由此得名，主张融合天主教教义与极权主义的“天主教极权国家”理念，被多数学者视为具有法西斯主义色彩的运动。1939年波兰保卫战中他作为华沙装甲摩托化旅士兵参战，10月潜回华沙后组建地下抵抗组织，此后主导创建“民族联合会”，参加维尔诺地区对德、对苏地下武装斗争，1943年该组织并入国家军。1944年华沙起义后期，他被苏联内务人民委员部逮捕并关押于卢布林城堡，经该部将领谢罗夫审讯后立场发生急剧转变，转而与波兰共产党政权合作。1945年出狱后，他随即创办以“天主教与马克思主义调和”为宗旨的《今日与明日》周刊，并于1946年公投期间为当局造势宣传，1947年创立“PAX天主教团体协会”并终身担任主席，主导该协会庞大的出版、企业及天主教用品生产网络，同时接管被收归国有的“明爱会”波兰分支。1957年，其少年儿子博赫丹遭绑架失踪，据传与波兰公安部特工有关。他始终未获波兰主流天主教会认可，红衣主教维辛斯基曾禁止神职人员订阅其主办的报刊。1965年起当选议会议员并主持PAX议员团体，1971至1979年任国务委员会委员。1979年1月1日在华沙逝世。"
 POL_boleslaw_wieniawa_glugoszowski_desc:0 "维尼亚瓦-德乌戈斯基生于1881年7月22日，出身加利西亚贵族之家，曾在利沃夫攻读医学。第一次世界大战期间投身波兰军团，长期担任毕苏斯基的副官，以骑兵将领和文人风范著称，与华沙文学界交往密切。1918年受命出使苏俄期间被契卡逮捕关押，经其未婚妻斡旋获释。1921年起任驻罗马尼亚武官，1926年“五月政变”中协助毕苏斯基筹划行动；此后长期统率骑兵部队，1932年晋升准将，1938年晋升少将，同年起出任波兰驻意大利大使。1939年9月波兰战败前夕，总统莫希奇茨基一度指定他为总统职位继任人选，他仅名义在任约一日，即因西科尔斯基及英法方面的反对而让位于拉茨基维茨。此后辗转里斯本、纽约，1942年获委任为波兰流亡政府驻古巴、多米尼加及海地公使。同年7月1日在纽约身故。"
 POL_edward_osobka_morawski_desc:0 "奥索布卡-莫拉维斯基生于1909年10月5日，斯卡尔日斯科-卡缅纳附近布利任村，1928年加入波兰社会党。第二次世界大战期间投身抵抗运动，1944年7月受苏联支持在卢布林成立的“波兰民族解放委员会”（“卢布林委员会”）出任主席，同年10月起兼任外交部长及农业部长。1945年6月起出任“全国团结临时政府”总理直至1947年2月，是战后波兰的第一任政府首脑，任内主张波兰社会党应与农民党联合组成对抗共产党的统一阵线，但这一立场使他与主张与共产党合作的党内对手齐兰凯维奇产生分歧，最终在共产党及苏联支持下于1947年2月被迫辞去总理职务，由齐兰凯维奇接任。此后逐渐向斯大林主义靠拢，但1949年仍以“右倾偏离”罪名被解除公共管理部长职务。1956年“波兰十月”期间重新获准加入已更名为“波兰统一工人党”的执政党，此后长期担任党务官员直至1989年剧变。1990年曾尝试重建旧波兰社会党未果。1997年1月9日在华沙逝世，享年87岁。"
 POL_edward_rydzsmigly_desc:0 "雷兹-希米格维生于1886年3月11日，加利西亚瓦普申村，幼年丧父，由外祖父母抚养成人，曾在雅盖隆大学攻读哲学与艺术史。第一次世界大战期间加入毕苏斯基麾下波兰军团，1920年波苏战争中指挥中央方面军，在华沙战役的决定性阶段发挥关键作用。1926年毕苏斯基发动“五月政变”时，他率维尔诺驻军驰援华沙，自此深受毕苏斯基信赖，1929年起负责东部事务的军事协调。1935年毕苏斯基逝世后，他被任命为武装力量总监，成为萨纳齐政权内与总统莫希奇茨基、总理斯瓦韦克三方分权格局中的实力人物，并最终通过与莫希奇茨基的协议压制斯瓦韦克，成为事实上的军政强人。1936年11月晋升波兰元帅，并被官方称为“仅次于总统的国家第二人”。1939年9月出任波兰武装力量总司令，指挥波兰保卫战；战败后于9月18日经罗马尼亚边境撤离并遭软禁，后转赴匈牙利。1941年10月，他秘密离开匈牙利，经斯洛伐克返抵被占领的华沙，自愿放弃元帅军衔，以普通地下抵抗战士身份参与秘密活动，同年12月2日在华沙病逝。其墓碑直至1991年仍未使用真实姓名，1994年华沙市民为其重立刻有全名的墓碑。"
 POL_eugeniusz_kwiatkowiski_desc:0 "克维亚特科夫斯基生于1888年12月30日，克拉科夫人，先后在利沃夫大学与慕尼黑大学攻读化学。1926年毕苏斯基政变后，经总统莫希奇茨基举荐出任工商部长（1926—1930），主持建设格丁尼亚海港、发展波兰商船队，使波兰获得独立的出海通道。1935年起任副总理兼财政部长直至1939年，期间主导创建“中央工业区”（COP）大型工业化项目，是萨纳齐政权后期经济建设的核心设计者。1939年波兰战败后经罗马尼亚边境遭拘留；其子在同年9月的保卫战中阵亡。战后一度出任共产党治下政府的沿海事务全权代表，主持战后海港重建，但三年后遭当局解职，并被禁止在沿海地区及首都居留，遂返回故乡克拉科夫从事学术研究直至1974年8月22日去世。"
 POL_friedrich_christian_desc:0 "弗里德里希·克里斯蒂安生于1893年12月31日，德累斯顿，萨克森末代国王弗里德里希·奥古斯特三世次子。10岁起循家族传统受封为萨克森禁卫掷弹兵团中尉，1913年入读德累斯顿军事学院。第一次世界大战期间在西线德军总参谋部服役并获多枚战功勋章，凭借出色的语言天赋多次奉派出访西班牙国王阿方索十三世、奥斯曼苏丹穆罕默德五世及奥地利皇帝卡尔一世。1918年一战末期，他是“摄政议会”讨论迎立外国王公方案时，被同时提及为拟议中的波兰王国及立陶宛王国候选人之一——该方案最终未能实现，波兰改行共和体制，他本人从未真正即位或以任何形式统治过波兰，仅是当时被提及、讨论过的候选人选之一。1918年11月13日，其父在德国战败后逊位，他率萨克森军队自比利时、法国撤回德国于富尔达复员。战后转攻法律，先后就读科隆、弗莱堡、弗罗茨瓦夫及维尔茨堡大学，获尼古拉·库萨研究博士学位。1923年因兄长格奥尔格放弃继承权出家为耶稣会士，他成为萨克森王室继承人；1932年父亲去世后正式成为萨克森王室（阿尔贝特系）家族之首，采用“迈森藩侯”称号。此后长期主持家族在萨克森、西里西亚的地产事务，二战期间及战后几经辗转，最终定居慕尼黑，创立“萨克森历史文化研究会”。1968年8月9日在瑞士萨梅丹逝世，安葬于北蒂罗尔卡勒斯滕王室礼拜堂。"
 POL_henryk_floyar_rajchman_desc:0 "弗洛亚尔-拉伊奇曼生于1893年12月7日，华沙人，青年时期加入“射击协会”，第一次世界大战期间在波兰军团步兵团服役，后转入秘密的波兰军事组织，1919至1920年波苏战争期间任第一军团步兵师参谋军官。1923年入读华沙高等军事学院，1928至1931年出任波兰驻日本武官。此后转入国会及工商部任职，1934年5月至1935年10月出任工商部长。1939年9月波兰战败之际，他参与组织将波兰黄金储备经罗马尼亚转移至流亡政府控制之下的行动，行动完成后于1940年初退出现役。此后辗转伦敦、巴西，1941年6月抵达纽约，先后受雇于多家美国工业企业，并成为1943年在纽约创立的约瑟夫·毕苏斯基研究所创始成员之一，1947至1951年出任该所副所长。1951年3月22日因心脏病发作逝世于纽约，与另一波兰政治家马图舍夫斯基合葬于皇后区加略山公墓。"
 POL_ignacy_moscicki_desc:0 "莫希奇茨基生于1867年12月1日，位于齐哈努夫附近的梅热扎诺沃。青年时代在里加理工学院攻读化学，并加入波兰地下左翼组织“无产者党”，因遭沙俄当局通缉于1892年流亡伦敦，后转赴瑞士弗里堡大学任教，以合成硝酸工业化技术闻名欧洲化学界。1926年毕苏斯基发动“五月政变”后，经毕苏斯基属意，于6月1日由国民议会选举出任波兰总统，1933年连任。任内长期依附于毕苏斯基的权威，鲜少公开表达异议；1935年毕苏斯基逝世后，与雷兹-希米格维达成分权协议，共同边缘化竞争者瓦莱雷·斯瓦韦克，自己则继续担任总统直至战败。1939年9月德苏两国入侵波兰后流亡罗马尼亚，遭软禁并在法国压力下被迫辞职，先将总统职位移交维尼亚瓦-德乌戈斯基，后者仅任职一日即由拉茨基维茨接任。同年底转赴瑞士定居，在日内瓦附近的沃尔索担任化学实验室研究员直至1946年10月2日病逝。1993年，其遗骸经波兰当局迁回国内，安葬于华沙圣若望主教座堂地下墓室。"
 POL_irena_anders_desc:0 "伊蕾娜·安德斯原名伊雷娜·雅罗谢维奇（舞台艺名“雷娜塔·波格丹丝卡”），1920年5月12日生于布伦塔尔（时属捷克斯洛伐克，今属捷克），父亲是希腊礼天主教随军神父，家族具有乌克兰血统。她在利沃夫师从多位声乐教师学习演唱，1939年波兰战败后随文艺团体辗转各地，为在西方作战的波兰军队进行慰问演出，是最早演唱著名军歌《卡西诺山上的红罂粟》的歌手之一，该曲纪念1944年卡西诺山战役阵亡将士。她随波兰第二军团辗转中东、意大利等地进行演出，战后定居英国，1948年与瓦迪斯瓦夫·安德斯将军结婚，育有一女安娜·玛丽亚。此后她继续从事演艺事业，在广播、电影中多次出演，2007年获波兰第二等公民荣誉勋章以表彰其对波兰文化的贡献。2010年11月29日在伦敦逝世。"
 POL_jan_kowalewski_desc:0 "科瓦莱夫斯基生于1892年10月23日，罗兹人，1909至1913年就读比利时列日大学化学系。第一次世界大战爆发后被强征入沙俄军队工兵通信部队，在白俄罗斯及罗马尼亚前线服役，1918年底获准加入波兰部队。因精通多国语言又对密码破译抱有业余兴趣，他在波乌战争期间偶然破译截获的布尔什维克电报，由此于1919年7月调任波兰总参谋部无线电情报处处长，并招募华沙大学及利沃夫大学的数学家组建团队，在1920年波苏战争期间破译逾百种苏军密码，为华沙战役的胜利提供了关键情报支持，他本人也因此获得波兰最高军事勋章维尔图蒂·米利塔里银十字勋章，但这一贡献直至70余年后才为世人所知。战后他一度负责第三次西里西亚起义的情报工作，1923年赴东京为日本军官开设无线电情报课程，获日本“旭日勋章”。1928年毕业于巴黎高等军事学院，此后转任外交及情报系统，1929年起任驻莫斯科武官，1933年被苏联宣布为不受欢迎人物后转任驻布加勒斯特武官直至1937年。二战期间他在里斯本主持代号“大陆行动”的情报网络，试图策动匈牙利、罗马尼亚脱离轴心国，后因苏联方面施压于1944年被英国要求解职调往伦敦，此后出任波兰特种作战总部行动局局长，筹备欧洲各地抵抗组织配合诺曼底登陆，但为时已晚难有实际作为。战后留居英国从事新闻及教育工作，1965年10月31日因癌症在伦敦逝世。"
 POL_jan_mosdorf_desc:0 "莫斯多夫生于1904年5月30日，华沙人，曾获哲学博士学位，师从塔塔尔凯维奇研究奥古斯特·孔德思想。1926年投身民族民主运动，1928年出任“全波青年”组织负责人，持强烈右翼民族主义及反犹立场，是极右翼“民族激进营”（ONR）的创始人及思想宣言的主要执笔者之一。1934年该组织遭当局取缔后，他一度被关押于别雷扎-卡尔图斯卡拘留营，此后以笔名“安杰伊·维特科夫斯基”从事政论写作，1938年出版代表作《昨日与明日》。1939年波兰战败后转入地下民族党，参与组建反纳粹地下武装“民族军事组织”。1940年7月被盖世太保逮捕，关押于华沙帕维亚克监狱，1941年1月被押送至奥斯维辛集中营。据幸存者回忆，他在集中营患斑疹伤寒康复后转变了此前对犹太囚犯的敌视态度，尽力向狱中犹太难友提供帮助。1943年10月11日，他与其他一批囚犯一同在奥斯维辛集中营遭处决身亡。"
 POL_jan_zumbach_desc:0 "祖姆巴赫生于1915年4月14日，华沙附近的乌雷诺夫，父亲具有瑞士血统，他本人终生持瑞士护照。1935年加入波兰陆军步兵，1936年转入波兰空军，1938年毕业于登布林飞行军官学校后编入第111歼击机中队。1939年波兰保卫战期间因训练事故骨折未能参战，战败后经罗马尼亚辗转撤至法国，驾驶莫兰406及柯蒂斯“鹰”75型战斗机参加法国战役。法国沦陷后经海路抵达英国，1940年8月成为新组建的英国皇家空军第303“波兰”歼击机中队创始成员之一，在不列颠之战中取得8架确认战果。此后历任分队长、中队长（1942年5月至1943年11月），后升任波兰第二歼击机联队（第133联队）指挥官，1944年9月在阿纳姆上空取得最后一次战果，1945年1月因导航失误迫降德占区，以战俘身份度过战争最后一个月。战后他继续从事飞行工作，持瑞士护照往返南欧及中东地区，一度涉及走私活动；1962年受聘组建并指挥刚果加丹加分离政权的“阿维卡特”空军，1967年又化名“约翰·布朗”组建并指挥尼日利亚比亚法拉分离政权空军。1975年出版回忆录《最后一战：我作为飞行员、走私者与冒险家的一生》。1986年1月3日在法国死于情况不明的事件，调查经法国当局下令终止且未公开解释，遗体安葬于华沙鲍翁兹基军人公墓。"
 POL_joachim_stefan_bartoszewicz_desc:0 "巴托斯泽维奇生于1867年9月3日，华沙人，先在华沙帝国大学攻读医学并获博士学位，后转赴巴黎政治学院攻读外交专业，以第一名成绩获得文凭；此后又在利沃夫大学攻读法学并获双法学博士学位。第一次世界大战前投身“全波”民族运动，1905年移居基辅，1906至1912年任民族民主派机关报《基辅日报》主编，并自1906年起担任民族联盟驻俄罗斯领土的基辅特派员。1922年11月当选参议员，代表卢布林省，隶属“人民民族联盟”（ZLN），1923年当选该联盟中央执行委员会委员直至1924年。他长期活跃于“保卫东部边疆波兰协会”，发表关于东部边疆政治意义的论著。1927年11月议会任期结束后退出参议院。1930年波兰议会选举期间，他领导民族党参选，该党在选举中获得第二高票。1937年6月，因年事已高（时年70岁），他将民族党执行委员会主席一职移交年轻一代的卡齐米日·科瓦尔斯基。1938年9月23日因心脏病发作在华沙去世。"
 POL_jozef_beck_desc:0 "贝克生于1894年10月4日，华沙人，第一次世界大战期间加入波兰军团并担任毕苏斯基的副官，后参与秘密的波兰军事组织。1922至1923年出任波兰驻法国武官。1926年协助筹划“五月政变”，此后历任军事部长办公厅主任（1926—1930）、副总理兼副外交部长（1930—1932），1932年起出任外交部长直至1939年，是两战间波兰外交政策的主要制定者。他奉行在德苏两大强邻之间保持“等距离”平衡的路线，先后于1932年与苏联、1934年与德国签署互不侵犯条约；1938年慕尼黑协定后波兰趁机吞并捷克斯洛伐克切欣地区。1939年4月促成英波互助条约，同年5月在众议院演说中公开拒绝希特勒关于但泽及“波兰走廊”的要求。德苏入侵波兰后随政府撤往罗马尼亚并遭软禁，1944年6月5日在罗马尼亚斯特内什蒂病逝于肺结核，其回忆录后以法文出版。"
 POL_jozef_haller_desc:0 "哈勒尔生于1873年8月13日，克拉科夫附近尤尔奇采村，家族世代具有强烈爱国及宗教传统。就读维也纳军事技术学院炮兵科，1895至1910年在奥匈军队第11炮兵团服役至上尉军衔后退役，此后投身农民合作运动及“猎鹰”体育爱国团体。第一次世界大战期间出任波兰军团第二旅旅长，1918年“拉拉尼查冲锋”后突破奥俄防线转赴乌克兰，后因德方视波兰军团驻乌克兰为非法而遭围困缴械，他本人逃往莫斯科，辗转经摩尔曼斯克抵达巴黎，受波兰民族委员会委托组建“蓝军”（因其法式军装得名），该部队后来发展至逾7万人规模，1919年4月率部凯旋华沙，获授荣誉市民称号。此后蓝军投入波乌战线作战，1920年他主持“波兰迎娶波罗的海”象征性仪式，正式将波莫瑞地区并入波兰版图并进驻但泽；波苏战争期间出任志愿军督察并指挥东北战线，参与华沙保卫战外围防御。战后历任炮兵总监（1920—1926年）及最高军事鉴定委员会主席等职，1920至1927年任议会议员，1922年纳鲁托维奇当选总统后逐渐失势，1926年毕苏斯基政变后被勒令退役，此后共同组织反对派“莫尔日阵线”。1939年波兰战败时他身在国外，1939年11月起任流亡政府不管部部长，1940至1943年出任西科尔斯基流亡政府教育部长。战后定居伦敦，以“蓝色将军”传奇之名度过晚年，1960年6月4日逝世，安葬于伦敦冈斯伯里公墓，1993年骨灰迁葬克拉科夫圣阿格涅什卡驻军教堂地下墓室。"
 POL_jozef_unrug_desc:0 "乌鲁克生于1884年10月7日，德国勃兰登堡，出身普鲁士与波兰混合血统的贵族家庭，父亲为普鲁士陆军少将。1907年毕业于基尔海军学院后加入德意志帝国海军，一战期间指挥潜艇并晋升潜艇支队指挥官。1919年波兰独立后，他毅然放弃德国国籍投身尚不存在的波兰海军，自费购置蒸汽船作为波兰海军首艘测量船，历任水文处处长、潜艇支队指挥官，1925年出任波兰舰队司令，1932年晋升海军少将。他与海军总监希维尔斯基长期力主建设“绿水海军”乃至“蓝水海军”，但受限于经费，主要成果是1932年“维赫尔”号驱逐舰强行进入但泽引发的“但泽危机”。1939年8月起出任沿海防御区司令，波兰战败后率残部死守海尔半岛，10月2日在弹尽粮绝下率部投降。此后被俘，辗转多个德军战俘营包括科尔迪茨城堡，面对德方屡次利诱其“叛降”均予拒绝，声称“自1939年9月1日起我已忘记德语”，坚持只用波兰语或法语与德方沟通，以精神感召鼓舞狱中波兰军人。战后定居英国，继而摩洛哥、法国，1973年2月28日在法国莱伊昂瓦尔逝世。2018年，波兰总统追授其海军上将军衔，其遗骸与夫人一同迁葬格丁尼亚。"
 POL_jozef_zajac_desc:0 "扎永茨生于1891年3月14日，热舒夫人，在克拉科夫雅盖隆大学攻读哲学并于1915年获博士学位。1912年加入“射击协会”并接受军官训练，1914年加入波兰军团，历任多个步兵团指挥官。1918年加入哈勒尔将军麾下“蓝军”，一度驻留法国并就读高等军事学院，后参加波苏战争末期作战，任维斯瓦河集团军、“北方”作战集群及第三集团军参谋长。两战间历任第一部处参谋长（1922年）、准将（1924年）、总参谋部第一副总长（1925年）及波兰第26步兵师师长（1926年）。1936年出任克拉科夫军区司令兼波兰空军督察，1937年起接受飞行员训练并出任防空司令，1939年出任波兰空军总司令，负责统筹当年9月对德空战。波兰战败后经罗马尼亚转赴法国参加战役，法国沦陷后撤至英国，1940年9月出任波兰第一军副司令，1941年出任中东战区波兰空军司令并晋升师级将军，安德斯军并入西方指挥体系后，他出任中东波兰军队副司令直至1943年3月，此后至1946年任西方波兰武装力量训练督察。战后选择不返回共产党治下波兰，定居爱丁堡并再获哲学博士学位，在当地从事学术工作，出版心理学及军事科学著作与回忆录。1963年12月12日在加拿大渥太华逝世。"
 POL_karl_albrecht_desc:0 "卡尔·阿尔布雷希特生于1697年8月6日，布鲁塞尔，出身维特尔斯巴赫家族，父亲为巴伐利亚选帝侯马克西米利安二世·埃曼努埃尔，母亲特蕾莎·库内贡达为波兰国王扬三世·索别斯基之女。1726年他继任巴伐利亚选帝侯。奥地利王位继承战争爆发后，他以血缘和婚姻关系向哈布斯堡遗产提出继承要求，1741年一度占领布拉格并受封波希米亚国王。1742年在法兰克福加冕为神圣罗马皇帝查理七世，成为三百年来首位非哈布斯堡出身的皇帝。其统治长期受战争牵制，巴伐利亚本土多次遭奥地利军队占领，1745年1月20日在慕尼黑去世。"
 POL_karol_korytowski_desc:0 "科里托夫斯基生于1892年1月28日，克拉科夫人，1913年毕业于阜姆海军候补学校，1914年毕业于海军军官学校。第一次世界大战期间在奥匈帝国海军鱼雷艇部队服役。1918年底晋升海军上尉后加入意大利境内波兰军队，回国后参加波苏战争。1920年底出任“毕苏斯基指挥官”号炮舰舰长，该舰先后担任舰队礼仪舰及训练舰。1921至1925年任希维奇海军专业学校校长，后调任托伦海军候补生学校校长，1929至1933年出任海军候补生学校校长（格丁尼亚）。1933年起任海军总部参谋长直至1939年战争爆发。战败后随海军总部撤退至平斯克继而罗马尼亚，1939年10月抵达巴黎出任海军总部副职。1940年6月法国沦陷期间负责组织波兰军队向英国撤离，此后长期在伦敦担任海军总部副职，1941年一度与总司令希维尔斯基一同被总理西科尔斯基解职（因潜艇部队指挥官自杀事件引咎），1942年10月官复原职。1945年5月晋升海军少将，出任海军总部第二副职。西方波兰武装力量解散后未返回波兰，先后主持波兰安置团海事处及伦敦海事学院，以笔名“卡罗尔·莫拉”在多家波兰侨界刊物发表文章。1966年10月11日在伦敦逝世，安葬于冈斯伯里公墓。"
 POL_kazimierz_sosnkowski_desc:0 "索森科夫斯基生于1885年11月19日，华沙贵族家庭，精通拉丁语、希腊语、英语、法语、德语、意大利语及俄语。青年时期投身秘密进步青年组织及波兰社会党，1908年协助毕苏斯基创建“武装斗争同盟”，第一次世界大战期间任波兰军团第一旅参谋长兼毕苏斯基副手，“效忠危机”中与毕苏斯基一同被囚于马格德堡，1918年11月获释后随毕苏斯基返回华沙。1920至1924年任军事部长，主持波兰军队现代化建设及对法条约谈判，并主持格丁尼亚港的初期建设。1925年任波兰常驻国际联盟代表期间，推动通过首个针对生物武器的国际公约。1926年政变前未获毕苏斯基告知计划，一度试图自杀。1939年9月波兰战败，他一度指挥南方战线并在向利沃夫撤退途中屡获小胜，后因苏联入侵被迫解散部队，乔装穿越苏占区经匈牙利抵达法国，出任流亡政府不管部部长，并受总统拉茨基维茨指定为总统继承人（西科尔斯基对此持反对意见）。1941年因抗议《西科尔斯基—迈斯基协定》未就波兰东部边界作出明确保障而辞去政府职务，此后两年成为政府的坚定批评者。1943年7月西科尔斯基空难身亡后，他接任流亡武装力量总司令；因公开批评盟国未能有效支援华沙起义，在丘吉尔施压下于1944年9月30日被解除总司令职务。同年11月移居加拿大，此后因对苏联持强硬立场，直至1949年才获准取得美英签证。1952至1954年积极推动波兰流亡各派系团结运动。1969年10月11日在加拿大魁北克阿伦德尔逝世，1992年骨灰迁葬华沙圣若望主教座堂。"
 POL_kazimierz_switalski_desc:0 "希维塔尔斯基生于1886年3月4日，萨诺克人，青年时期加入毕苏斯基创建的“武装斗争同盟”地下组织，第一次世界大战中在波兰军团服役。1926年“五月政变”中支持毕苏斯基，政变后历任总统府文官厅厅长、内政部政治司司长，1928年出任教育部长，1929年4月至12月出任总理，与卡齐米日·巴特尔轮替执政。此后任众议院议员，1930至1935年间出任众议院议长，后转任参议院副议长，1935年底至1936年初兼任克拉科夫省长。1939年波兰战败后被俘，在沃尔登贝格战俘营中度过整个战争时期；其独子在华沙起义首日阵亡。1945年返回波兰后，遭共产党当局关押至1956年。1962年因电车事故受伤，于华沙去世。"
 POL_lucjan_zeligowski_desc:0 "泽利戈斯基生于1865年10月17日，维尔纽斯附近奥斯米亚纳一带（今属白俄罗斯），自幼生活贫困，只讲当地白俄罗斯方言，自认为立陶宛人而非白俄罗斯人。1885年毕业于里加军官学校后加入俄军，参加过日俄战争（1904—1905），一战期间任俄军步兵团中校团长。1917年俄国二月革命后投身在俄波兰军队的组建工作，历任步兵团长、旅长，1918年在库班地区组建波兰第4步枪师并加入邓尼金“白军”作战，同年10月出任在俄全体波兰部队总司令。波苏战争爆发后，他率部撤入罗马尼亚比萨拉比亚地区防御布尔什维克袭扰，此后晋升将军并统率以其名字命名的作战集群，在波列西耶及平斯克沼泽地区作战；华沙战役期间所部隶属波兰第三集团军，参与涅曼河战役追击溃退苏军。1920年10月，他奉毕苏斯基密令制造“泽利戈斯基兵变”，率部“哗变”占领维尔诺，10月12日宣布成立“中立陶宛共和国”并自任军事独裁者，后将权力移交新选出的议会，该议会决定并入波兰，1922年3月正式并入波兰版图。两战间历任军区督察、1925年出任军事部长（毕苏斯基政变期间一度被撤职，后官复原职），1926年政变后出任调查五月事件的清算委员会主席，1927年8月退役。1935至1939年当选议会议员。1939年波兰战败时，73岁高龄的他自愿请缨从军，但因年事已高未获批准。二战结束后他表示愿意返回波兰，却于1947年7月9日在伦敦骤然离世，遗体运回波兰安葬于华沙鲍翁兹基军人公墓。"
 POL_ludomil_rayski_desc:0 "路多米克雷斯基生于1892年12月29日，克拉科夫附近的恰斯瓔夫村，其父为一月起义参与者，失败后流亡奥斯曼帝国并加入土耳其军队，故他本人自幼持土耳其国籍。第一次世界大战爆发后志愿加入毕苏斯基麾下波兰军团，负伤后受劝说转赴伊斯坦布尔谋求航空作战经验，1915年编入土耳其空军并参加加里波利战役，两度负重伤。1919年他自行购机飞越黑海抵达敖德萨，加入泽利戈斯基将军麾下波兰第4步兵师并组建其航空分队。1926年“五月政变”期间他以步兵身份支持毕苏斯基一方，政变后出任军事部航空司司长，1926至1939年长期担任波兰空军实际最高负责人，主持推动以波兰本国设计、本国制造飞机为核心的空军现代化路线，是国家航空工业（PZL）体系的主要缔造者之一。1939年3月因当局对空军发展重视不足而愤然辞职。波兰战败后辗转法国、英国，一度加入法国外籍军团，后转入英国皇家空军从事运输及联络飞行，1943年出任中东地区波兰空军督察。战后定居伦敦，长期未获流亡当局平反，直至1977年病重弥留之际才经流亡政府名誉委员会撤销此前指控，同年4月11日去世。1993年其骨灰移葬华沙军队主教座堂。"
 POL_maria_koszutska_desc:0 "科苏茨卡生于1876年2月2日，卡利什附近格沃夫琴庄园地主家庭，化名“维拉·科斯特热娃”。1902年加入波兰社会党，主要在罗兹从事党务工作，1903年遭沙俄当局监禁，1904年遭流放。1905年革命期间恢复地下活动，1906年该党分裂后成为“波兰社会党左派”创始领导人之一，长期投身工人教育运动。1918年参与创建波兰共产党（初称“波兰共产工人党”），与阿道夫·瓦尔斯基、亨里克·瓦莱茨基并称党内“三W”核心领导层，1918至1929年间断任中央委员会委员，1923至1929年任政治局委员，在党内代表相对温和的“多数派”立场。1925年12月她曾联署声明将托洛茨基与十月革命胜利紧密相连，这一立场后来使她在斯大林主义氛围下备受猜忌。1929年后移居苏联，在一家出版社工作，被排除于波兰共产党实际事务之外，公开反对该党及共产国际的斯大林化进程。1937年6月苏联大清洗期间，内务人民委员部头目叶若夫宣称破获所谓“波兰军事组织”间谍网，她作为被控“领导人”之一遭秘密逮捕，是该案中唯一的女性被告，也是其中唯一未被处决者，但最终于1939年7月9日死于莫斯科狱中，享年63岁。"
 POL_marian_kukiel_desc:0 "库基尔生于1885年5月15日，加利西亚东布罗瓦-塔尔诺夫斯卡人，父亲曾参加1863年一月起义。1903年入读利沃夫扬·卡齐米日大学历史系，师从著名历史学家阿谢纳齐，1909年获博士学位，专攻拿破仑时代波兰军事史。1908年与索森科夫斯基、西科尔斯基共同创建“武装斗争同盟”，一战期间在毕苏斯基麾下波兰军团任参谋官，参加科斯秋赫努夫卡等战役。1919至1920年任总参谋部第三处副处长，参加波苏战争，1920年出任第20旅旅长兼历史局局长。1923至1925年任第13步兵师师长，毕苏斯基1926年政变后转入预备役。1927年起任雅盖隆大学军事史教授，1930至1939年兼任克拉科夫恰尔托雷斯基博物馆馆长，1932年当选波兰学术能力学会院士。1939年参加利沃夫保卫战，战败后经罗马尼亚辗转抵达法国，出任流亡政府军事部副部长（1939—1940）。法国沦陷后转赴英国，1940至1942年任驻苏格兰科特布里奇的波兰第一军军长，1942年9月起出任流亡政府军事部长（后改称国防部长）直至1949年，任内长期主张彻查卡廷惨案真相。战后拒绝返回波兰，历任伦敦“波兰海外大学”教授（1945—1973）、伦敦波兰历史研究所所长（1946—1973）、西科尔斯基研究所成员（1951—1966），是两战间及流亡时期波兰军事史学的奠基人之一。1973年8月15日，他在伦敦因车祸受伤后不治身亡，享年88岁，安葬于肯萨尔格林公墓。"
 POL_marian_rejewski_desc:0 "雷耶夫斯基生于1905年8月16日，比得哥什人（时属德占普鲁士分区，德语称布龙贝格），就读德语文理中学后转入波兹南密茨凯维奇大学攻读数学，1929年获硕士学位。在校期间受教授克雷戈夫斯基推荐，参加密码局为德语数学优秀生开设的秘密密码学课程，1932年9月起进入华沙密码局全职工作。同年冬，他在极少量法国情报机构提供的资料辅助下，以纯数学置换理论破译了德军恩尼格玛密码机的内部接线原理，此后与同事鲁日茨基、齐加尔斯基合作近七年，持续开发破译方法与设备（包括著名的“密码炸弹”），即便德方不断更新加密程序仍能保持破译能力。1939年7月25日，即德国入侵波兰前五周，波兰密码局在华沙近郊皮雷向法英情报代表移交全部破译成果与设备，为英国“超级机密”（Ultra）计划奠定基础。波兰战败后，他经罗马尼亚辗转至法国继续破译工作，法国沦陷后又转入维希法国及北非从事秘密工作，1942年11月德军全面占领法国后经西班牙、葡萄牙、直布罗陀逃往英国，加入波兰军队从事低级别德军密码破译工作。1946年返回波兰后从事会计工作，直至1967年退休前一直对其密码破译经历守口如瓶。1980年2月13日因心脏病发作在华沙家中去世，以军礼安葬于鲍翁兹基军人公墓。"
 POL_mieczyslaw_michalowicz_desc:0 "米哈沃维奇生于1876年9月10日，圣彼得堡人，后成为华沙大学儿科学教授、波兰社会党活动家，1930至1931年出任华沙大学校长，是波兰科学能力学会及波兰科学院院士。两战间当选参议员，初期支持萨纳齐政权，后转为反对派，1939年参与创立中间派“民主党”。二战期间遭德国当局逮捕关押（1942年11月起），战后选择与苏联扶植的波兰共产党政权合作。他是波兰现代儿科学的重要奠基人之一，也是较早将电子学、控制论方法引入波兰医学领域的学者。1965年11月22日在华沙逝世，安葬于鲍翁兹基公墓。"
 POL_pavel_bermondt_avalov_desc:0 "贝蒙德-阿瓦洛夫生于1877年3月4日（儒略历），第比利斯，身世存在多种说法，较可信的一种称其生父为格鲁吉亚贵族米哈伊尔·阿瓦利什维利，养父为俄军军士拉法伊尔·贝蒙特，故兼采两姓。青年时在华沙音乐学院接受音乐教育后加入外贝加尔哥萨克部队任军乐指挥，1904年志愿参军，1905年日俄战争期间获圣乔治十字勋章，后皈依东正教并转入乌苏里哥萨克部队。第一次世界大战期间任米先科将军私人副官，在东普鲁士及加利西亚前线服役。俄国革命后投身白俄运动，1918年一度在基辅抵抗彼得留拉的乌克兰武装，后遭俘获流亡德国，同年获少将军衔。1919年在德国支持下于波罗的海地区组建“特别俄罗斯军团”（后改称“西俄志愿军”），并与德国指挥官吕迪格·冯·德·戈尔茨的部队合并，总兵力号称5万人（实际约2万），主要成分是德国自由军团志愿者及获释俄国战俘。该部队名义上打着“反布尔什维克”旗号，实际矛头指向新独立的拉脱维亚、立陶宛，一度攻占库尔兰大部及里加，并对占领区实施劫掠，在当地历史记述中留下“冒险家军阀”的恶名。1919年11月遭拉脱维亚军队击退，继而在拉德维利什基斯战役中被立陶宛军队重创，同年12月全军撤入德国。此后他长期定居德国，出版回忆录，深度介入极右翼白俄侨民运动，坚定支持纳粹党并自建“俄罗斯民族社会主义运动”组织，但1939年仍因挪用组织资金遭纳粹当局逮捕并送入集中营，此后经瑞士逃往意大利，继而贝尔格莱德，最终移民美国。1973年12月27日在纽约逝世。"
 POL_roman_abraham_desc:0 "阿布拉罕生于1891年2月28日，利沃夫人，父亲为利沃夫大学教会法教授兼校长。曾就读希罗夫耶稣会学校，后入读利沃夫扬·卡齐米日大学哲学法律系。第一次世界大战期间在奥匈军队骑兵团服役，转战法国、罗马尼亚、俄国、塞尔维亚及意大利战线，战争结束时任骑兵中尉。波兰独立后加入波兰军队，参加波乌战争及波苏战争。两战间历任骑兵团长、骑兵旅长等职，1930至1931年短暂出任议会议员，1938年3月晋升准将并执掌大波兰骑兵旅。1939年波兰保卫战中，他率部隶属库特兹巴指挥的波兹南集团军，在莱什诺、希雷姆、拉维奇一带作战；9月9日起参加布祖拉河战役，指挥部队对索博塔及瓦莱维采发起攻击，此后在布罗胡夫、谢拉库夫等地持续激战。9月15至21日他统一指挥大波兰骑兵旅及波多利亚骑兵旅组成的作战集群，部分部队于9月20日突围抵达华沙。他麾下骑兵部队在整场保卫战中未遭遇一次战役性失败，是波兰保卫战中战绩最为完整的骑兵指挥官之一。曾流传其部队“骑兵冲锋德军坦克”的说法。9月23日起他受命统一指挥华沙保卫战中的骑兵联合旅直至9月28日投降。此后被俘，在穆尔瑙战俘营度过战争余下时间，1945年4月获美军解放后选择返回战后波兰。1976年8月26日在华沙逝世。"
 POL_roman_dmowski_desc:0 "德莫夫斯基生于1864年8月9日，华沙近郊人，青年时代投身争取波兰独立的运动，1893年参与创建“民族联盟”地下组织，1895年迁居利沃夫，1897年创立“民族民主党”，自此长期担任该运动的思想领袖，与毕苏斯基构成两战间波兰政治的两大对立极——毕苏斯基主张多民族联邦式的波兰，德莫夫斯基则主张以波兰语、天主教为纽带的单一民族国家。第一次世界大战期间，他在巴黎创建“波兰民族委员会”，作为协约国承认的波兰代表机构；1919年他与帕德雷夫斯基共同代表波兰出席巴黎和会，并于同年6月在《凡尔赛条约》上签字，同年9月代表波兰签署《圣日耳曼条约》。他在巴黎和会上极力反对协约国强加给波兰的“少数民族保护条约”，并为波兰争取到较条约草案更靠西的对德边界。1919至1922年任波兰立宪议会议员，1923年短暂出任外交部长后基本退出一线政坛。1926年毕苏斯基政变后，他创建“大波兰营”作为反对派政治组织。晚年定居罗兹多沃庄园，1939年1月2日在该地逝世，葬于华沙布鲁德诺公墓。"
 POL_rudinger_von_der_goltz_desc:0 "冯·德·戈尔茨生于1865年12月8日，勃兰登堡祖利肖，德国戈尔茨贵族世家，1885年加入德军。第一次世界大战期间历任多个旅长职务，1918年3月奉命率“波罗的海师”驰援芬兰白军，4月在汉科登陆后进军赫尔辛基，协助芬兰内战中白军击败红军及苏俄部队，一度被称为“芬兰事实上的摄政”。1919年1月受任利耶帕亚“总督”，指挥德国-拉脱维亚联合第六后备军，3月起接连击败当地布尔什维克武装，5月攻占里加，试图扶植亲德傀儡政权。因协约国压力被要求撤军，他以“部队已改编为反布尔什维克白俄武装”为由拖延近五个月，其部队6月进攻爱沙尼亚军队在采西斯战役中遭挫败，此后被迫将部队移交俄裔将领贝蒙德-阿瓦洛夫指挥，本人于1919年12月最终撤入东普鲁士。战后投身德国右翼政治，参与1920年“卡普政变”，两战间长期活跃于极右翼团体，1930年代初出任“德国爱国团体联合会”主席，参与“哈尔茨堡阵线”。1946年11月4日在德国上巴伐利亚金塞格庄园逝世。"
 POL_sejmik_regency_desc:0 "“摄政议会”是1917年9月由德奥占领当局在波兰王国扶植设立的过渡性集体统治机构，由三位摄政共同行使国家元首职权，直至1918年11月毕苏斯基接掌权力为止。"
 POL_stanislav_maczek_desc:0 "马切克生于1892年3月31日，利沃夫近郊谢尔泽茨村，父亲为律师。第一次世界大战爆发后入伍加入奥匈军队，战争期间屡建战功获得晋升与勋章。1918年11月奥匈帝国崩溃后加入波兰军队，在波乌边境冲突中表现英勇，1919年4月起自行创建并指挥仿效德军突击营模式组建的“飞行连”，装备精良、机动力强，曾参与德罗霍贝奇、斯坦尼斯瓦沃夫、布恰奇等地激战。两战间他率先在波兰军队中倡导装甲机械化理念，1937年出任波兰唯一一支机械化部队第10骑兵旅旅长。1939年波兰保卫战中，该旅是波兰军队仅有的成建制机械化部队，战斗中多次给德军以重创。战败后经匈牙利辗转抵达法国，重建一支机械化部队参加1940年法国战役，6月18日在缺乏后援、弹药耗尽的情况下下令销毁重装备、化整为零突围，他本人与部分官兵经维希法国、北非、葡萄牙辗转抵达英国。1942年2月他在苏格兰整训两年后正式组建波兰第一装甲师并任师长，1944年8月该师投入诺曼底战役，在蒙特奥梅尔、262高地及尚布瓦镇的战斗中协同盟军合围德军14个师，即著名的“法莱斯口袋”战役，他的部队担负了封闭包围圈的关键任务。此后该师作为盟军先锋部队转战法国北部、比利时、荷兰直至德国，曾解放荷兰布雷达市并获该市荣誉市民称号。战争结束后升任波兰第一军军长，统率英国境内全体波兰部队直至1947年复员。战后遭波兰共产党政权剥夺国籍，被迫留居英国，英国政府又以其非英国军队成员为由拒发将官退休金，他不得不在爱丁堡一家酒店当调酒师维生直至上世纪60年代。1994年12月11日在爱丁堡逝世，享年102岁，遵其遗愿安葬于荷兰布雷达的波兰军人公墓，与麾下阵亡将士长眠一处。"
 POL_stanislaw_kopanski_desc:0 "科潘斯基生于1895年5月19日，圣彼得堡波兰裔家庭，1914年因一战爆发中断工程学业应征入俄军，毕业于米哈伊洛夫斯基炮兵学校后在俄军第2骑兵师服役。1917年二月革命后加入在俄组建的波兰第一军，1918年后辗转返回波兰，加入波兰第1枪骑兵团参加波乌战争，1919年4月在维尔诺战斗中身负重伤失去左眼，康复后转任炮兵军士学校校长，同年9月起指挥骑炮兵支队参加波苏战争并获维尔图蒂·米利塔里银十字勋章。两战间历任炮兵学校副校长、总参谋部各处职务，1935年起任装甲兵副总监，1937至1939年指挥自行火炮团，1939年3月起任总参谋部第三处处长。波兰战败后经罗马尼亚辗转法国，1940年4月受命在法属叙利亚组建“喀尔巴阡独立步兵旅”并任旅长，该旅1941年8月投入托卜鲁克围城战末期防御，后参加加扎拉战役，因战功获英军授予“托卜鲁克之鼠”荣誉称号。1942年该旅扩编为第三喀尔巴阡步兵师，他继续担任师长，1943年7月调任伦敦，出任流亡武装力量总司令部参谋长直至1947年。1946年9月26日被波兰“全国团结临时政府”剥夺国籍（直至1972年恢复）。1947至1949年任波兰安置团总监，1970至1976年出任流亡政府名誉总参谋长及武装力量总监，1970至1973年兼任“三人委员会”成员。1976年3月23日在伦敦逝世，安葬于诺斯伍德公墓。"
 POL_stanislaw_mikolajczyk_desc:0 "米科拉伊奇克生于1901年7月18日，德国西发利亚霍尔斯特豪森（今属北莱茵-威斯特法伦州），出身波兹南地区移居德国鲁尔矿区谋生的“鲁尔波兰人”家庭，十岁随家迁回波兹南。青年时在制糖厂做工并投身波兰爱国团体，1920年加入波兰军队参加波苏战争，在华沙战役附近负伤后退伍，返乡继承父业务农。1929年当选议员，1931至1939年出任“人民党”（农民党）领导人之一。1939年德国入侵波兰时以列兵身份参加华沙保卫战，战败后经匈牙利辗转南斯拉夫、意大利抵达法国，随即受邀出任流亡政府波兰全国委员会副主席。1941年出任内政部长兼西科尔斯基政府副总理，主管与波兰本土地下抵抗力量的联络。1943年4月卡廷惨案真相公开后，苏联单方面与流亡政府断交；同年7月西科尔斯基空难身亡后，他于7月14日继任流亡政府总理直至1944年11月，任内多次赴莫斯科同斯大林、丘吉尔谈判争取波兰东部边界及主权，但收效甚微，最终因盟国对华沙起义支援不力及东部边界问题于1944年11月辞职。1945年6月27日返回波兰，出任苏联扶植的“全国团结临时政府”第二副总理兼农业与土地改革部长，随即着手重建“波兰人民党”（PSL），该党迅速发展成为波兰境内规模最大的政党。1946年“三个赞成”公投及1947年1月国会选举中均遭当局系统性舞弊打压，人民党实际获得的支持率被严重低报。眼见大规模政治迫害与逮捕即将波及自身，他于1947年10月出走西方，定居伦敦继而美国，长期从事反苏反共宣传及游说工作，出版《波兰的强暴：苏联侵略模式》一书。1966年12月13日在华盛顿逝世，2000年遗骸迁葬波兹南。"
 POL_stanislaw_pawluc_desc:0 "斯坦尼斯瓦夫·帕夫卢奇生于1897年6月21日，维捷布斯克省利克斯纳村医生之家。1916年应征入俄军航空学校，后转入波兰军队，1919年编入第1侦察机中队参加波苏战争，历任技术军官、飞行员长及副官，1920年3月参与巴拉诺维奇及利达空袭行动，同年4月经历一次坠机幸存。1921年因涉嫌渎职指控离开波兰军队。1939年波兰保卫战期间任“克拉科夫”集团军航空参谋部作战军官，9月19日在托马舒夫-卢贝尔斯基附近被俘，关押穆尔瑙战俘营直至1945年4月获释，后留驻当地波兰军事中心。1947年6月返回波兰，此后任职于波兰航空公司及交通出版社，1984年8月20日在华沙逝世。"
 POL_stanislaw_radkiewicz_desc:0 "拉德凯维奇生于1903年1月19日，格罗德诺省罗兹米耶尔基村农民家庭，仅完成三年级学业。1915年随家人被沙俄军队强制东迁至俄国，俄国革命期间加入共青团。1922年返回故乡，随后移居苏联，在白俄罗斯共产党波兰局工作。1925年被莫斯科秘密派回波兰负责非法波兰共产党青年部工作，1928年因“危害波兰主权独立活动”被判四年监禁，1937年再度被捕服刑半年。1938年斯大林下令解散波兰共产党并处决其大批领导人期间，他因深受斯大林信任而幸免，反被委以清算该党地下组织的任务。1944年波兰民族解放委员会（“卢布林委员会”）成立后，他受命出任公安部门负责人，1944至1954年担任波兰公安部（原“安全局”UB，后改称“公安部”MBP）部长，是战后波兰斯大林化时期国家安全机关的核心缔造者与负责人，主导了对地下抵抗组织、反对党人士及政治异见者的系统性镇压，其部门在此期间发展至逾三万名特工规模。他曾下令将对“波兰人民党”成员的“清算”行动伪装成地下抵抗组织所为，1945年春至1947年初造成至少140名该党成员遇害。1954年底因斯大林时期镇压丑闻曝光被解除公安部长职务，转任国营农场部长，1956年“波兰十月”后经“自我批评”被逐出中央委员会及党组织（三年后恢复党籍），此后未再受到任何刑事追究。1960至1968年任国家储备局局长，1968年退休。1987年12月13日在华沙逝世，享年84岁。"
 POL_stanislaw_sosabowski_desc:0 "索萨博夫斯基生于1892年5月8日，加利西亚斯坦尼斯瓦沃夫人（今属乌克兰伊万诺-弗兰科夫斯克），铁路职工之子。青年时期投身波兰独立地下运动，1913年应征入奥匈军队，一战期间在加利西亚、斯洛伐克等地作战并两度负伤。1918年波兰独立后加入波兰军队，两战间历任多个步兵单位指挥官，1939年出任华沙“孩子们”第21步兵旅旅长，率部参加华沙保卫战。战败后经匈牙利辗转抵达法国，后转赴英国，决意将麾下部队改建为波兰军中首支伞兵部队，1942年正式组建为波兰独立伞兵旅，以“经最短的路”为非正式格言，旨在空降协助本土起义。1944年该旅奉命参加“市场花园行动”，9月21日在德里尔附近空降增援阿纳姆的英军，伤亡率接近四成，但因空投地点距目标过远而未能扭转战局。战役后英方将领布朗宁施压要求撤换其指挥权，1944年12月流亡政府在盟国压力下将其解职。战后留居英国，以零售及工厂工作维生，长期未获应有承认，直至战后数十年才逐渐获荷兰及波兰方面追授荣誉。1967年9月25日因心脏病在伦敦逝世，骨灰安葬于华沙鲍翁兹基军人公墓。"
 POL_stanislaw_wojciechowski_desc:0 "沃伊切霍夫斯基生于1869年3月15日，卡利什人，出身没落贵族知识分子家庭。在华沙大学攻读期间投身地下学生组织，1892年因社会主义活动遭沙俄当局逮捕后流亡苏黎世、巴黎、伦敦，期间与毕苏斯基结为挚友，1892年共同参与创建波兰社会党。1899年与出身地主家庭的玛利亚结婚，1905年因政见分歧（反对将波兰独立运动与国际阶级斗争捆绑）退出波兰社会党，转而投身合作社运动，1906年返回波兰后长期从事合作社理论研究与实践。第一次世界大战期间因认为德国对波兰威胁最大而选择留在俄国，1915年迁居莫斯科，俄国革命后当选“波兰各党联合会”主席。1919年1月至1920年7月出任内政部长（历经三届内阁），参与起草波兰宪法。1922年12月纳鲁托维奇总统遇刺后，他作为各方均可接受的妥协人选，于12月20日经国民议会选举当选波兰第二任总统。任内他与军事总参谋长毕苏斯基在国家发展方向上产生分歧，主张继续议会制民主，反对毕苏斯基的威权倾向。1926年5月毕苏斯基发动政变，他拒绝了毕苏斯基要求解散维托斯政府的最后通牒，一度组织忠于政府的军队抵抗，但为避免内战及邻国乘机入侵，于5月14日辞职。此后退出政坛，任教于华沙经济学院及华沙农业大学，继续从事合作社事业。1953年4月9日在华沙近郊戈翁布基逝世。"
 POL_stefan_frankowski_desc:0 "弗兰科夫斯基生于1887年4月3日，沃里尼亚人，1908年毕业于圣彼得堡海军候补学校，1908至1917年在俄罗斯帝国海军服役，历任“皇太子”号及“光荣”号战列舰、“阿芙乐尔”号巡洋舰航海军官，一战期间任波罗的海舰队第二战列舰旅航海军官。1919年志愿加入波兰军队，历任军事部海军处作战部门负责人、驻斯德哥尔摩武官、海事部人事培训处处长等职。1923至1925年就读巴黎法国海军军官学校并获总参谋官衔，回国后指挥格丁尼亚鱼雷艇支队，1926至1929年任托伦海军军官学校校长，1929年任海军总部参谋长直至1932年，是《海洋评论》期刊的主要创办人之一。1933年4月起出任沿海防御司令。1939年波兰战败，他率部撤往海尔半岛，与乌鲁克共同巡视全岛工事、动员军民抵抗；10月1日深夜与乌鲁克等将领共同决定投降，次日率部放下武器。此后被俘，辗转多个德军战俘营，1940年因腹痛加剧被转送德国比拉瓦医院，手术后于同年9月25日不治身亡。战后遗骸迁葬弗罗茨瓦夫波兰军人公墓，1946年9月26日追授海军少将军衔。"
 POL_tadeusz_bielecki_desc:0 "别莱茨基生于1901年1月30日，出身教师家庭，先后就读雅盖隆大学哲学系与法律系，期间曾志愿参加波苏战争。他长期担任罗曼·德莫夫斯基的私人秘书，是民族党及“大波兰营”的核心成员，但反对更为激进的“民族激进营”（ONR）路线。1930至1935年任众议院议员，1934年起负责民族党青年部，1935年出任该党副主席，1939年6月正式当选主席。波兰战败后经法国辗转加入流亡政府的国民议会体系，长期是总理西科尔斯基对苏政策的坚定反对者，尤其反对1941年的“西科尔斯基—迈斯基协定”。战后他继续留居伦敦，担任流亡界“政治委员会”及“民族团结委员会”成员，始终未承认华沙的共产党政权。1982年2月5日凌晨在伦敦查令十字医院去世，葬礼在布朗普顿圣堂举行，后安葬于伦敦冈斯伯里公墓。"
 POL_tadeusz_kutrzeba_desc:0 "库特兹巴生于1885年4月15日，克拉科夫人，父亲为奥地利帝国军队上尉。青年时就读维也纳附近的军事技术学院，1906年以优异成绩毕业后编入工兵部队。1939年波兰保卫战中出任波兹南集团军司令，下辖四个步兵师及两个骑兵旅，他策划并指挥了波兰保卫战中规模最大的反击行动——布祖拉河战役，联合博尔特诺夫斯基指挥的波莫瑞集团军对德军第8集团军侧翼发起反攻。战役失利后，他率残部突围抵达华沙，一度出任华沙集团军副司令，受司令罗梅尔委托与德军第8集团军谈判，并于9月28日签署华沙投降文件。此后被俘，辗转关押于霍亨施泰因、柯尼希施泰因及穆尔瑙战俘营直至1945年4月获美军解放。1945年他婉拒流亡政府提出的国防部长一职，转而主持研究1939年保卫战及西线波兰军队战史的历史委员会。因健康原因未能返回波兰，1947年1月8日因癌症在伦敦逝世，以军礼安葬于布鲁克伍德公墓，后追授维尔图蒂·米利塔里三级勋章。1957年遵其遗愿，骨灰迁葬华沙鲍翁兹基军人公墓功勋区。"
 POL_tomislaw_lupaszko_desc:0 "齐格蒙特·申杰拉日生于1910年3月12日，出生地为斯特雷伊，出身铁路职工家庭，战前曾在波兰骑兵部队服役。第二次世界大战期间，他加入波兰家乡军，以“乌帕什卡”或“乌帕什科”为化名，指挥第5维尔纽斯旅在维尔纽斯地区和波兰东北部进行地下抵抗活动。他的部队先后同德国占领机关、苏联内务人民委员部及战后波兰共产党安全力量作战。战后申杰拉日继续从事反共游击，1948年被捕，1950年被判处死刑，1951年2月8日在华沙莫科托夫监狱被处决。1989年后，其案件在波兰被重新评价，他被追认为反共抵抗人物；但其部队在战时针对平民的暴力行动也长期存在争议。"
 POL_vladislav_korchits_desc:0 "科尔奇茨（波兰语作瓦迪斯瓦夫·科尔奇茨）生于1893年9月1日，俄国革命期间加入布尔什维克红军一方，参加波苏战争（站在苏方阵营）。两战间毕业于苏联伏龙芝军事学院，1938至1940年大清洗期间一度遭受审查，但指控最终被撤销并官复原职。他参加了苏联卫国战争，1944年起转隶苏联扶植组建的波兰武装力量（“波兰人民军”体系），与两战间萨纳齐政权或流亡政府麾下的波兰军界人物阵营性质完全不同，而是战后波兰人民共和国军事体制的奠基者之一。1945年1月1日至1954年1月18日出任波兰人民军总参谋长，期间加入波兰统一工人党，并兼任国防部副部长（1949/1950年起）及1952至1956年议会代表。1954年退休后返回苏联定居，1966年10月17日在苏联逝世。"
 POL_walery_slawek_desc:0 "斯瓦韦克生于1879年11月2日，出身波多利亚一个没落贵族家庭，青年时代投身波兰社会党地下武装组织，1908年参与毕苏斯基领导的别兹丹雷劫车行动，为其地下组织筹措经费。此后长期担任毕苏斯基最亲信的追随者，1928年创建“支持政府无党派集团”（BBWR）并任主席。两战间三度出任总理（1930年、1930—1931年、1935年），并参与主持1935年“四月宪法”的起草工作，主张扩大总统权力。毕苏斯基本属意由他接任领导地位，但1935年毕苏斯基逝世后，总统莫希奇茨基与雷兹-希米格维结成同盟，逐步将他排挤出权力核心。1938年6至11月短暂出任众议院议长，同年选举中失去议席。1939年4月2日晚，即毕苏斯基逝世的同一时刻，他在华沙寓所开枪自伤，经抢救无效于翌日凌晨去世，留下遗书表示不愿归咎他人。"
 POL_wanda_wasilewska_desc:0 "瓦西勒斯加生于1905年1月25日，克拉科夫，父亲莱昂·瓦西列夫斯基是波兰社会党政治家及波兰复国后首任外交部长。在雅盖隆大学攻读波兰语言文学并获博士学位，两战间长期从事教师及左翼报刊编辑工作，加入波兰社会党，因激进左翼立场屡遭排挤。1939年德国入侵后逃往苏占利沃夫，加入苏联布尔什维克党，1940年获斯大林接见，成为苏联对波兰政策重新定位的关键人物。苏德战争爆发后随撤退辗转抵达莫斯科，以红军战地记者及政治部工作人员身份从军并获上校军衔，多次巡回东线鼓舞士气；她创作的战争小说《虹》为其赢得斯大林文学奖，并被改编为电影。1943年1月与友人联名致信莫洛托夫，促成“波兰爱国者联盟”于同年6月正式成立，她出任主席，该组织致力于在苏联境内波兰人中推动社会主义建设，并促成“塔德乌什·科希丘什科第一步兵师”的组建（后发展为苏联扶植的“波兰人民军”），同时组织救济流散于苏联各地的波兰难民及近三万名波兰孤儿。1944年任“波兰民族解放委员会”副主席之一，为该委员会及战后波兰人民共和国的建立发挥了关键作用，但此后其名字逐渐从领导层名单中淡出。战后她选择留居苏联，与乌克兰剧作家亚历山大·科尔尼丘克结为伴侣并移居基辅，此后基本退出波兰国内政坛，历任苏联最高苏维埃代表六届，但因俄语、乌克兰语能力有限，实际影响力有限。1964年7月29日在基辅逝世，安葬于拜科沃公墓。"
 POL_wincenty_kowalski_desc:0 "科瓦尔斯基生于1892年9月11日，华沙一个普通工人家庭，先后就读华沙多所学校，后赴比利时列日理工学院攻读机械制造专业，期间加入反沙俄地下组织“武装斗争同盟”。第一次世界大战爆发后加入波兰军团，历任连长、营长，1917年“效忠危机”中因持俄国国籍遭拘禁于贝尼亚米诺沃。波兰独立后加入波兰军队，参加波乌战争及波苏战争，1922年晋升中校，1928年晋升上校，此后历任驻维尔诺、莫德林等地部队指挥官及要塞司令。1939年3月19日晋升准将，出任第一军团步兵师（“毕苏斯基师”）及以该师为核心组建的维什库夫作战集群司令。波兰保卫战中，他指挥的部队是表现较为出色的单位之一，尽管在数量和装备上处于劣势，仍持续经海乌姆一带向弗沃达瓦、卢布林、利沃夫方向撤退作战；9月18至19日在海乌姆附近与增援部队会合重组，后于托马舒夫-卢贝尔斯基战役中成功突破德军装甲部队及步兵防线，但终因弹尽粮绝，9月23日进攻塔尔纳瓦特卡受挫，负伤后于9月24日被俘。此后被关押德军战俘营直至1945年4月获美军解放，战后加入西方波兰军队，1946年退伍后定居伦敦继而移居纽约，长期活跃于波兰侨界组织，曾任波兰战斗人员协会主席、约瑟夫·毕苏斯基研究所及“波兰兄弟互助会”负责人。1984年11月29日在美国伊利诺伊州河林逝世，遵遗愿于1986年将骨灰安葬在其部队阵亡将士长眠的卡武申战争公墓。"
 POL_wincenty_witos_desc:0 "维托斯生于1874年1月21日（一说22日），加利西亚维日霍斯瓦维采村贫苦农民家庭。18岁投身农民运动，1895年加入“人民党”，1908至1914年任加利西亚议会议员，1911年起兼任维也纳帝国议会议员。1914年农民运动分裂后，他创立“波兰人民党“皮亚斯特””并任党魁直至1931年。第一次世界大战期间与波兰独立运动保持联系，1918年出任“波兰清算委员会”主席。1920年7月，在波苏战争最危急关头受命组建全国团结联合政府并出任总理，呼吁全国动员抗敌，任职至1921年9月；1923年5月至12月第二次出任总理；1926年5月组建第三届内阁，数日后即遭毕苏斯基“五月政变”推翻。此后他坚持反对派立场，1929年联合多党组建“中左联盟”要求恢复宪政，1930年在布列斯特审判前夕遭当局逮捕入狱，1932年再度被判刑（该判决直至2023年才被波兰最高法院撤销平反）。为避免再次被捕，1933年流亡捷克斯洛伐克，在侨界被尊为“农民的救世主”。1939年返回波兰后旋即遭德国占领当局逮捕，1941年因健康恶化获准软禁于原籍村庄，1944年拒绝德占当局要求其发表反苏声明的要求。1945年出任战后“全国国民会议”副主席之一，同年10月30日在克拉科夫逝世。"
 POL_witold_pilecki_desc:0 "皮莱茨基生于1901年5月13日，俄罗斯卡累利阿奥洛涅茨镇，家族因参与1863年一月起义遭沙俄流放至此，属波兰贵族“莱利瓦”纹章世家。1910年随家迁居维尔诺，少年时加入地下波兰童子军组织，1918年参加维尔诺地区自卫队。波苏战争期间（1919—1921）在骑兵部队服役。战后定居利达经营家族农场，1931年与当地女教师玛丽亚·奥斯特罗夫斯卡结婚，育有两子女，业余从事绘画与诗歌创作。1939年8月应征入伍参加波兰保卫战，战败后转赴华沙加入地下抵抗，创建“秘密波兰军”（后并入国家军）。1940年，波兰地下军获悉多名被押往奥斯维辛的政治犯“死亡”通知后心生怀疑，皮莱茨基自愿在华沙一次围捕行动中故意让德军将自己逮捕，1940年9月21至22日夜被押往奥斯维辛集中营，编号4859，在营内潜伏近两年半，秘密组建地下抵抗网络，持续向华沙地下军总部及流亡政府传递集中营内部情报（包括大屠杀相关信息），成为最早向盟国揭露纳粹种族灭绝暴行的一手情报来源之一。1943年4月，眼见盟军无意营救，他与另两名囚犯成功越狱逃出集中营。1944年8月华沙起义爆发后，他志愿以普通士兵身份加入“华沙人”连队作战，起义军官阵亡后公开身份接掌指挥，战败后被俘成为德军战俘直至1945年美军解放。此后加入意大利境内波兰第二军团，1945年10月返回波兰从事地下情报工作，为伦敦流亡政府搜集苏联占领当局情报。1947年5月被波兰公安部逮捕，历经酷刑审讯及不公正审判，1948年3月被判处死刑，总统比鲁特拒绝赦免，1948年5月25日在华沙莫科图夫监狱遭处决，时年47岁，遗体下落至今不明。1990年波兰剧变后获平反昭雪，1995年追授“波兰复兴勋章”，2006年追授波兰最高荣誉“白鹰勋章”。"
 POL_wladyslaw_anders_desc:0 "安德斯生于1892年8月11日，华沙以西克罗希涅维采-布沃涅村，家族为波罗的海德意志裔，已波兰化数代，受洗为新教徒（二战期间改信天主教）。青年时就读里加理工学院，第一次世界大战期间在沙俄军队骑兵团服役，三次负伤，获俄罗斯帝国最高军事勋章圣乔治勋章。波兰独立后加入波兰军队，参与1919年大波兰起义任参谋长，波苏战争期间指挥波兹南第15枪骑兵团，因战功获颁维尔图蒂·米利塔里勋章。1926年政变中支持政府一方反对毕苏斯基。1939年9月指挥诺沃格鲁德卡骑兵旅参战，负伤被俘，遭苏联关押于莫斯科卢比扬卡监狱。1941年苏德战争爆发后，依据《西科尔斯基—迈斯基协定》获释，受命组建由波兰战俘及流放者组成的军队（“安德斯军”），因苏方物资短缺及政治摩擦，1942年经协议将部队及大批平民经伊朗撤至中东，并入英军指挥体系，后扩编为波兰第二军团。1944年率部参加意大利战役，5月18日攻克卡西诺山，7月攻占安科纳，此后参与突破“哥特防线”及春季总攻。雅尔塔会议后对盟国出卖波兰东部领土表示强烈抗议。1945年2月起兼任流亡武装力量总司令直至6月。战后拒绝返回苏联控制下的波兰，1946年遭波兰共产党政权剥夺国籍及军衔，留居英国出任流亡武装力量总监，并投身多项侨界慈善及互助事业，1949年出版回忆录《流亡的军队》。1970年5月12日在伦敦逝世，遵其遗愿安葬于意大利卡西诺山波兰军人公墓，与麾下阵亡将士长眠一处；1989年波兰后共产主义政府成立后，其国籍及军衔获追认恢复。"
 POL_wladyslaw_bortnowski_desc:0 "博尔特诺夫斯基生于1891年11月12日，拉多姆人，曾在日托米尔完成中学教育后入读莫斯科大学医学系，一年后转入克拉科夫雅盖隆大学继续攻读医学。1908年加入“武装斗争同盟”，1912年加入“射击协会”并接受军官训练，一战爆发后加入波兰军团。波兰独立后参加波乌战争及波苏战争，1924年晋升上校，1932年晋升准将。1935年10月起任托伦地区武装力量总监，1938年秋指挥“西里西亚”独立作战集群，在慕尼黑协定后占领捷克斯洛伐克切欣地区，声望一度高涨，曾被考虑作为雷兹-希米格维的接班人选。1939年3月晋升师级将军并出任波莫瑞集团军司令，是参战波兰各集团军中最北翼的一支。波兰保卫战初期其部队因奉命坚守“波兰走廊”而遭德军两面夹击，在图霍拉森林战役中损失惨重；9月9日起其部队并入库特兹巴指挥的布祖拉河反击战，在沃维奇、索哈切夫一带作战。9月14日奉命撤至布祖拉河北岸，9月21日负伤被俘，此后辗转多个德军战俘营直至1945年获美军解放。战后留居西方，先在英国参与创建伦敦约瑟夫·毕苏斯基研究所，1954年移居美国，1961至1962年出任该研究所美国分部主席。1966年11月21日在纽约格伦科夫逝世。"
 POL_wladyslaw_gomulka_desc:0 "哥穆尔卡生于1905年2月6日，加利西亚克罗斯诺近郊比亚沃布热吉-弗兰齐什坎斯基村贫苦家庭，14岁起当水管工学徒，青年时投身工会及左翼运动，1926年加入地下波兰共产党。两战间历经毕苏斯基政权及地方当局多次监禁。1939年德苏入侵波兰后一度被苏方拘押于利沃夫后获释，此后在被占领的华沙投身地下抵抗，1943年出任重建后的波兰工人党总书记，参与创建“国家全国委员会”。1945年1月至1948年出任波兰事实上的领导人，兼任副总理，但因反对强制农业集体化、对共产国际情报局持怀疑态度、主张“波兰特色社会主义道路”而与莫斯科扶植的比鲁特一派发生激烈冲突。1948年在斯大林授意下被以“右倾民族主义偏向”罪名撤销总书记职务，1949年被解除一切职务并开除党籍，1951至1954年遭监禁近四年。1956年比鲁特去世、苏共二十大启动去斯大林化后，他获平反并于同年10月重掌党的第一书记职务，主导“波兰十月”改革，结束强制集体化、缓和对天主教会的迫害，赢得广泛支持，实为1956至1970年波兰实际最高领导人。执政后期趋于保守僵化，1968年支持华沙条约组织出兵镇压捷克斯洛伐克“布拉格之春”，同年纵容“反犹太复国主义”排犹运动。1970年12月签署波兰—西德条约，促成西德承认奥德河—尼斯河战后边界，但同月因物价上涨引发波罗的海沿岸工人流血冲突事件，被迫辞职下野，由爱德华·盖莱克接掌党的领导权。1982年9月1日在华沙因癌症逝世。"
 POL_wladyslaw_kalkus_desc:0 "1918年11月起以连长身份参加利沃夫保卫战（波乌战争），1919年转入克拉科夫飞行学校学习，1920年以上尉军衔参加波苏战争，历任多个侦察机中队飞行员及指挥官。两战间历任团级、旅级航空指挥官，1929年起任波兹南第3航空团团长，1933年调任华沙第1航空团团长，1934年晋升上校，1935年出任第3航空大队司令，1938年参与切欣行动期间统筹“西里西亚”独立作战集群所属空军。1939年3月19日晋升准将并代理军事部航空司令直至波兰战败。战败后经罗马尼亚辗转法国，1939年10月至1940年3月出任法国境内波兰空军总负责人，此后短暂在英国任类似职务，4至8月任波兰空军驻皇家空军督察，此后历任布拉姆科特第18作战训练部队指挥官及布莱克浦波兰空军基地波方指挥官，战争期间一度被拘留于比特岛罗西赛拘留营。1945年2月23日在英国布莱克浦逝世。"
 POL_wladyslaw_raczkiewicz_desc:0 "拉茨基维茨生于1885年1月28日，格鲁吉亚库塔伊西（时属俄罗斯帝国），波兰裔法官之子。在圣彼得堡求学期间加入波兰青年组织，后于多帕特大学攻读法律，毕业后在明斯克执业律师。第一次世界大战期间在俄军服役，俄国革命后投身波兰独立事业，曾主持“最高波兰军事委员会”，协助在俄境内组建波兰第一军。两战间曾任内政部长、克拉科夫省长（1935年）及波莫瑞省长（1936—1939年）。1939年波兰战败后经安热逃往法国，1939年9月30日依宪法程序就任流亡波兰总统，1940年6月法国沦陷前转往伦敦，与总理西科尔斯基、米科拉伊奇克共同主持流亡政府运作，是《西科尔斯基—迈斯基协定》的反对者。1945年2月雅尔塔会议后，盟国撤销对流亡政府的承认，转而承认苏联扶植的华沙政权，但拉茨基维茨在西方侨界仍被视为合法波兰元首直至1947年6月6日在威尔士鲁辛镇逝世。安葬于英国纽瓦克-昂-特伦特公墓，2022年11月其遗骸与另外两位流亡总统一同迁葬华沙“天主圣意”神殿流亡总统陵墓。"
 POL_wladyslaw_sikorski_desc:0 "西科尔斯基生于1881年5月20日，加利西亚图舒夫-纳罗多维村，战前投身多个争取波兰独立的秘密组织，与毕苏斯基一同参与创建“武装斗争同盟”。第一次世界大战期间任波兰军团战争专员，后于波苏战争中崭露头角，1920年指挥波兰第五集团军，在华沙战役决定性阶段发挥重要作用。1921年出任总参谋长，1922至1923年短暂出任总理，1923至1924年任军事部长期间主持军队现代化。1926年毕苏斯基政变中保持中立，1928年因遭解除军职转而加入反毕苏斯基阵营。1939年波兰战败后经罗马尼亚辗转抵达法国，9月30日出任流亡政府总理，11月7日接替雷兹-希米格维出任武装力量总司令兼总监，并兼任军事部长，集军政大权于一身。法国沦陷后率政府及部分部队撤往伦敦，1940年8月与英国签署波英军事协定，着手重建流亡波兰军队。1941年与苏联大使迈斯基谈判恢复波苏外交关系，促成《西科尔斯基—迈斯基协定》，推动安德斯获释组建军队。1943年4月苏联借口卡廷惨案调查要求与波兰断交，双方关系急剧恶化。同年5月起赴中东视察波兰部队，7月4日返程途中，其“解放者”式飞机于直布罗陀起飞16秒后坠海，西科尔斯基与其女儿、参谋长克利梅茨基等11人罹难，仅飞行员一人生还；事故原因官方认定为升降舵卡死导致失控，但具体成因及是否涉及蓄意破坏，历史学界至今存在争议，相关英国官方档案封存至2050年。"
 POL_wojtek_desc:0 "沃伊泰克是二战期间随波兰第二军团服役的叙利亚棕熊。1942年，波兰“安德斯军”自苏联撤往伊朗途中收养了这只幼熊，后由第22炮兵补给连饲养，随部队辗转伊拉克、巴勒斯坦、埃及。1944年该连赴意大利作战时，英方运输规定禁止携带宠物，波兰军方遂将沃伊泰克正式登记为士兵，使其得以随部队登船。卡西诺山战役期间，它因协助搬运炮弹箱而成为部队象征，第22炮兵补给连后来采用“背负炮弹的熊”作为徽章。战后沃伊泰克随部队至苏格兰，1947年移交爱丁堡动物园，1963年12月2日去世。"
 POL_xawery_czernicki_desc:0 "希斯基生于1882年10月16日，维尔纽斯省奥斯米亚纳县基德伊基村贵族家庭，1901年毕业于当地中学后入读喀琅施塔得帝国海军工程学校，1905年毕业于造船系并以海军候补少尉军衔加入俄罗斯海军。此后历任圣彼得堡海军基地工程师、结雷茨克小型船厂负责人（1910年起，期间设计多艘河用重炮舰）、“塞瓦斯托波尔”级战列舰副总工程师及总工程师，1913年晋升上尉，一战期间任雷瓦尔（今塔林）海军船厂船体总设计师，1917年晋升海军中校，1918年退役。1919年返回波兰志愿加入波兰海军，任维斯瓦河区舰队技术处处长，波苏战争期间任莫德林要塞内河海军基地司令。1925年起主持格丁尼亚海军基地建设监督委员会，1926年起兼任多艘舰艇建造监督委员会主席。1932年晋升海军上校后返回波兰，出任海军总部勤务处处长兼副总监，1938年晋升海军少将。1939年波兰战败后，他随海军总部从格丁尼亚撤往华沙，继而东撤至平斯克、布罗迪地区，在杰拉日内村遭苏联红军截获；转往罗夫诺后被内务人民委员部逮捕，辗转塔利察后转押科泽尔斯克战俘营。1940年春，他与其他波兰军官一同遭苏联内务人民委员部秘密处决，时年57岁，是震惊世界的“卡廷惨案”遇难者之一，也是此次惨案中唯一遇害的波兰海军将官。1989年苏联解体前后真相逐渐公开，他后来成为波兰海军的精神主保人物之一。"
 POL_zdzislaw_lubomirski_desc:0 "卢博米尔斯基生于1865年4月4日，俄罗斯下诺夫哥罗德（其父母因一月起义受牵连遭流放至此），出身卢博米尔斯基公爵世家。为使儿子在波兰精神熏陶下成长，父母将其送往加利西亚克拉科夫圣安娜中学就读，后于雅盖隆大学及格拉茨大学攻读法律，1887年获学位。1893年迁居华沙，凭借慈善事业成为知名公众人物，历任华沙慈善协会副会长、会长及眼科研究所监理。第一次世界大战爆发后主持“华沙市民委员会”，1915年8月德军占领华沙后经德方认可继续出任华沙市长（1916—1917），同时兼任“中央公民委员会”主席，推动波兰语学校体系建设。1917年9月起出任“摄政议会”三摄政之一，与大主教卡科夫斯基、约瑟夫·奥斯特罗夫斯基共同构成波兰王国过渡时期最高权力机构；他是三摄政中最为活跃的一位，推动解散“临时国务会议”、发布波兰独立宣言（1918年10月7日），并于同年11月10日在华沙车站迎接刚获释的毕苏斯基，先后向其移交军事及政治权力。1918年后一度淡出政坛，1926年政变期间出任毕苏斯基与政府间的调解人；1928至1935年任参议员，1931至1935年兼任“地主组织理事会”主席。1930年因抗议布列斯特审判提出辞去参议员职务未获批准。1939年华沙保卫战期间参与市民委员会工作，此后投身地下抵抗活动。1942年11月10日遭盖世太保逮捕，在帕维亚克监狱关押两个月并遭受严酷审讯，获释后因伤病及肺结核缠身未能康复，1943年7月31日在自家庄园马瓦维希逝世。"
 POL_zygmunt_buhusz_szysko_desc:0 "第一次世界大战期间在沙俄军队服役。两战间长期在波兰军队中任团级军官，1938年出任波兰第1步兵师师长，1939年改任第16步兵师师长。波兰战败后撤离国境，1940年出任在英国组建的波兰独立高地旅旅长，率部参加挪威纳尔维克战役，该旅一度成功夺取安克内斯半岛。1941至1943年间他被派往苏联，先后出任驻莫斯科波兰军事使团团长及东线波兰部队参谋长，亲历安德斯军的组建与撤离过程。1943至1945年出任波兰第二军团副司令，协助安德斯指挥卡西诺山战役及博洛尼亚战役等意大利战场作战。战后留居英国，1976至1980年出任流亡武装力量总监。1982年6月在伦敦逝世，享年89岁。"
 SIA_aditya_dibabha_desc:0 "阿提贴·阿帕生于1900年7月27日，阿帕卡拉·基亚提翁亲王（朱拉隆功五世第四十一子、暹罗海军现代化重要推手）之子。早年任教师，讲授法国大革命史，1934年将卢梭著作译为泰文出版，收录于朱拉隆功大学文学院教材《法国大革命时代》。虽出身宗室，却是1932年立宪革命的支持者，倾向英式君主立宪而非法式共和体制。1933年博沃拉德叛乱期间协助政府平叛有功获奖。1935年拉玛七世逊位、年幼的拉玛八世继位后，他出任摄政委员会主席直至1944年，是绝对君主制终结后暹罗过渡时期的关键权力人物之一；任内与銮披汶军政府关系一度紧张，1943年获晋升陆军中将、海军中将、空军中将三军同衔。1942年1月銮披汶政府对英美宣战诏书亦因其拒绝签署而在法理上存在瑕疵。1946年5月19日因癌症在曼谷逝世，享年45岁。"
 SIA_adul_aduldejajaras_desc:0 "阿杜·阿杜德差叻生于1894年6月28日，本名“巴特·平帕拉孔”，1932年立宪革命“人民党”成员之一，人称“锐目将军”。革命后由陆军转入警界，1933年出任副警察总监，1936年升任警察总监，执掌暹罗警政长达十二年之久，是銮披汶政权时期令人畏惧的强力执法者，与军方长期存在权力角力。二战期间他表面效忠銮披汶，暗中却与“自由泰运动”保持秘密联系，战争末期一度出面协助该运动。1945年社尼·巴莫组阁后，他出任副总理兼公共卫生部长，同年卸任警察总监，转而于1946年6月受比里·帕侬荣委任出任陆军总司令直至1947年11月銮披汶集团政变。政变前夕他一度试图调兵抵制军事政变，后经协商妥协作罢。战后曾任枢密顾问，1969年12月17日逝世，享年75岁。"
 SIA_ananda_mahidol_desc:0 "阿南塔·玛希敦生于1925年9月20日，德国海德堡（其父母时在当地留学），马希敦亲王（朱拉隆功五世之子）与桑万夫人之长子，是首位在境外出生的暹罗王室成员。四岁丧父后随母移居瑞士洛桑。1935年3月拉玛七世逊位且未指定继承人，依王位继承法由年仅9岁的他继位为拉玛八世，因年幼且长期在瑞士就学，由摄政委员会代行王权。1938年曾短暂回国两月旋即返欧。1941年12月日军登陆暹罗后，他滞留瑞士未归，比里·帕侬荣代行摄政并暗中拒绝在对英美宣战书上签字，使暹罗对英美宣战在法理上存在瑕疵。1945年12月获洛桑大学法学学位后返回暹罗，次年6月计划再赴瑞士攻读博士学位。1946年6月9日凌晨，即预定启程返欧前四天，他被发现头部中弹身亡于大皇宫波隆宾曼宫寝宫内，官方最终认定并非意外而属他杀，但真凶至今未明，三名王室侍从其后被判处死刑并于1955年执行，连当时继位的九世王普密蓬本人后来也表示不相信三人有罪。此案至今仍是泰国现代史上讳莫如深的悬案，其弟普密蓬·阿杜德（拉玛九世）随即继位。"
 SIA_bowardej_desc:0 "博沃拉德亲王生于1877年4月2日，曼谷，蒙固王（拉玛四世）之孙、纳雷特亲王之子。早年就读英国哈罗公学及伍尔维奇皇家军事学院，1900年返暹罗任职陆军统帅参谋部，1902至1905年出任驻巴黎大使，此后长期历任国防大臣等要职，绝对君主制末期地位显赫。1932年立宪革命前夕曾拒绝直接参与政变筹划，革命后未获“人民党”重用，转而对政局日益不满，尤其反感新政府允许民众对国王提起诉讼一事，加之对1933年披耶帕凤政变推翻保守派总理玛诺巴功心怀怨愤。1933年10月，他联合陆军上校披耶·西迪颂堪等人在呵叻集结军队，以“国家救亡团”名义于10月11日发动叛乱（史称“博沃拉德叛乱”），率部一度逼近曼谷占领廊曼机场，要求政府立即辞职，但未获海军及大部分驻曼谷部队响应。经銮披汶指挥政府军反击，叛军至10月下旬溃散，他于10月25日携妻乘机逃往法属印度支那，此后在柬埔寨避难长达十五年，直至1948年获准返回泰国并授予陆军上将衔，1953年11月16日在泰国逝世，享年76岁。"
 SIA_chamkat_phalangkun_desc:0 "猜姆卡·帕朗恭（本名“查甘·帕朗恭”）生于1914年10月30日，曼谷，父为著名教育官员帕耶·帕敦·维塔森。早年就读曼谷佛统寺学校及帖沙林中学，考入朱拉隆功大学文学院后获政府奖学金赴英国留学，1938年获牛津大学贝利奥尔学院哲学、政治学与经济学专业荣誉学位。归国后任职教育部，因政治立场与当权者相左遭免职，转而组建“救国团”团结民主派人士。日军入侵暹罗后，他成为国内“自由泰运动”核心成员并出任秘书长。1943年2月受比里·帕侬荣委派，作为该运动全权代表秘密前往中国重庆，向盟军通报暹罗境内存在反日地下抵抗力量，并成功促成中国政府（继而美国）率先承认该运动、间接促使英国放弃战后将暹罗降格为受保护国的构想，为战后暹罗避免以“战败国”身份被处置作出关键贡献。他在重庆期间曾与蒋介石会面，并通过驻英自由泰领袖社尼·巴莫了解英方态度。1943年10月7日在重庆病逝，加拿大随行医生诊断为肝癌及胃癌，但英美情报人员及其传记作者均对死因存疑，怀疑系遭日方特工投毒所致，年仅28岁。"
 SIA_chao_phonphayuhasena_desc:0 "披耶帕凤·丰派育哈色纳生于1887年3月29日，曼谷，本名朴·帕凤裕庭，父为潮州华裔上校吉姆，母为泰-孟裔。早年就读朱拉隆功皇家陆军官校，1903年获王室奖学金赴德意志普鲁士主要军官候补学校深造（据传与后来的纳粹元帅戈林同窗），继而转赴丹麦哥本哈根工程学院，因奖学金中断仅完成一年学业，1912年返暹罗。1931年获拉玛七世授“披耶帕凤·丰派育哈色纳”衔，1932年出任暹罗陆军总司令，是策划1932年立宪革命的“四剑客”核心成员之一、革命当日宣读《暹罗新国家宣言》之人，革命后被视为“人民党”资深领袖。1933年3月，总理玛诺巴功以“黄皮书”经济计划争议为由将他逐出内阁并中止宪法，他遂于6月20日发动不流血政变推翻玛诺巴功，次日自任第二任总理直至1938年，任内经历1933年10月博沃拉德叛乱等多次政局动荡，依靠个人威望及銮披汶等亲信军官维系统治。1938年因王室地产贱卖丑闻及国会选举失利被迫辞职，銮披汶继任总理。此后退出政坛，二战期间出任武装力量总监。1947年2月14日因脑出血在曼谷逝世，享年59岁，据传身后家人一度因经济拮据无力操办丧事，后由銮披汶出面协助安排。"
 SIA_chao_phraya_sri_dharmathibhet_desc:0 "西·探玛提贝即“昭披耶·西·探玛提贝”（本名吉特·纳颂卡拉），生于1885年10月30日，宋卡府人，出身当地世家，家族历任宋卡地方长官。早年留学英国修习法律，1911年拉玛六世朝返国，历任民事法院法官等职，因才干出众迅速晋升，先后获封“銮·金达披隆”“帕·金达披隆·拉查萨帕波迪”“披耶·金达披隆·拉查萨帕波迪”，1931年拉玛七世特授其“昭披耶·西·探玛提贝”衔（食邑万莱），是暹罗历史上末代获封“昭披耶”（最高等级贵族衔）之人，此后该衔位随立宪革命而废止未再册封。1932年立宪革命后，他历任司法、外交、卫生、财政等多个内阁部长职务（历经披耶帕凤、銮披汶、宽·阿派旺等多届政府），并于1934年当选国会第四任议长。战后1946年他创办泰国人寿保险公司并任首任董事长，是首家由泰国人自主创立经营的人寿保险公司。此后长期出任九世王普密蓬枢密顾问，一度出任枢密院院长，官宦生涯横跨五朝、历时逾七十二年。1976年9月25日逝世，享年90岁零11个月。"
 SIA_charun_rattanakun_seriroengrit_desc:0 "差伦·拉达那恭·社里龙里生于1895年10月27日，曼谷，惯称封号“銮·社里龙里”。1904年入伍，1932年立宪革命“人民党”元老成员之一。1938年晋升上校，在銮披汶政府中出任要职，历任国营铁路局局长、多个内阁部长（无任所部长、1939年商务部次长、1941年国防部次长）。1940至1941年法泰战争结束后，1942年2月晋升中将，出任“帕耶普军团”（西北军团）总司令，率部参与日军缅甸战役并占领掸邦部分地区直至1945年战争结束。1942年5月起转任政界，1942年3至9月出任商务部长，此后至1944年出任交通部长。1944年銮披汶下台后一度以“战犯”罪名被捕，1946年3月获释，此后出任国营贸易公司董事及1946年5月起出任参议员直至1951年。1947年他参与推翻文人政府、助銮披汶重掌政权的政变。其子迎娶九世王胞姊甘拉雅妮公主。1983年7月19日在曼谷逝世，享年87岁。"
 SIA_damrong_rajanubhab_desc:0 "丹隆·拉差努帕生于1862年6月21日，蒙固王（拉玛四世）之子，朱拉隆功国王（拉玛五世）异母弟。早年历任近卫军团统领、教育大臣，1892年出任暹罗史上首任内政大臣直至1915年，主持全面改革地方行政体系，创设“猜”（府）辖区制度并推行官员任命薪俸化，是暹罗近代行政、教育体系的主要奠基人。卸任后转向自学成才的史学研究，1925年出任暹罗艺文学会首任会长，推动创建国家图书馆与国家博物馆，被誉为“泰国近代史学之父”，1929年拉玛七世特授予其“丹隆·拉差努帕亲王”尊号。1932年立宪革命后，作为绝对君主制的重要拥护者遭“人民党”排挤，同年流亡英属槟城，1942年局势变化后获准返回曼谷，翌年12月1日在曼谷家中（原瓦拉迪宫）逝世。1962年获联合国教科文组织追授“世界杰出人物”称号，是首位获此殊荣的泰国人。"
 SIA_dhani_nivat_desc:0 "达尼·尼瓦生于1885年11月7日，本名丹尼尼瓦·索纳古，1922年获封亲王衔“达尼·尼瓦亲王”。拉玛七世朝出任教育大臣（1926年起），1932年立宪革命后连同其他宗室成员一并被“人民党”逐出政府，此后转向学术研究，长期担任暹罗学会会长逾二十年，以泰国历史、宗教及文化研究著称。战后于1950年起出任九世王普密蓬的枢密顾问，先后三次代行摄政（1951年3月至1952年国王返国期间，以及1963年国王两次出访期间），并长期担任枢密院院长直至晚年。1974年9月8日在曼谷逝世，享年88岁。"
 SIA_direk_jayanama_desc:0 "里绿·猜耶南生于1905年1月18日，1932年立宪革命文官派成员之一，与比里·帕侬荣关系密切。1933年加入外交界，1938至1941年历任副外长、外交部长，1941年12月日军登陆暹罗时在任，因反对銮披汶政府对日结盟而辞职，1942年在銮披汶压力下改任驻日大使，得以近距离观察泰日关系内情，1943年7月因健康原因返国。此后深度参与“自由泰运动”地下抵抗活动，1943年底至1944年8月再度出任外交部长直至退出公职专注抵抗事业。战后历任司法、财政、外交部长及副总理等职，1946至1947年再度出任外长，1947年后转任驻英、驻联邦德国、驻芬兰大使。1949年创立法政大学政治学院并任首任院长（1949—1952），此后长期执教并撰写外交事务著作，其回忆录《泰国与二战》是研究该国1938至1948年外交、军事、经济史的重要一手史料。1967年5月1日在曼谷逝世，享年62岁。"
 SIA_jira_wichitsongkhram_desc:0 "生于1897年10月4日，1932年立宪革命“人民党”元老成员之一，历任陆军要职，晋升中将后曾婉拒晋升元帅殊荣。"
 SIA_josiah_crosby_desc:0 "約西亚·克罗斯比生于1880年5月25日，英国康沃尔郡法尔茅斯，船长之子。剑桥大学冈维尔与凯斯学院毕业，1902年获现代语言荣誉学位一等成绩。1904年加入英国领事界，早年即在暹罗任职多年，1917年调任驻西贡领事，1919至1920年代理驻曼谷总领事，此后历任驻西贡、巴达维亚总领事。1931年出任驻巴拿马及哥斯达黎加公使，1934年调任英国驻暹罗公使直至1941年退休，是1930年代暹罗与英国关系的关键中间人，1941年12月日军入侵暹罗前后，他与暹罗政府及美国方面均保持密切沟通，试图斡旋避免战事扩大，但未能阻止銮披汶政府倒向日本。日军占领期间他一度遭日方拘押扣留，后获释遣返回国并退休。著有回忆暹罗政局的著作，是研究1930年代末暹罗外交史的重要史料来源。1958年12月4日逝世，享年78岁。"
 SIA_kuang_abhayavongsa_desc:0 "宽·阿派旺生于1902年5月17日，柬埔寨马德望（时属暹罗管辖的柏当省），暹罗籍柬埔寨裔贵族世家，父为暹罗籍马德望总督昭披耶·阿派普贝。早年就读代实林学校及易三仓学校，赴法国里昂中央理工学院攻读土木工程，归国后任职电信局并升任局长，获封“銮·柯维·阿派旺”衔。1932年立宪革命中作为文官派成员参与，此后在披耶帕凤及銮披汶内阁出任无任所部长，二战期间以少校军衔加入国王卫队，1941年法泰战争后率团接管柬埔寨马德望地区，此后出任商务通信部长。1944年7月銮披汶辞职后，他被国会推举出任总理（1944年8月至1945年8月），任内表面配合日方、暗中庇护“自由泰运动”地下工作，并成功废除銮披汶的“武装力量最高统帅”职位。日本投降后他辞职让位于自由泰阵营组阁，1946年创立民主党并任首任党魁，同年1至3月二度出任总理，1947年11月政变后三度出任总理直至1948年4月被军方逼迫辞职，此后长期担任反对党领袖直至1958年政党遭禁。1968年3月15日在曼谷逝世，享年65岁。"
 SIA_luang_chawengsaksongkhram_desc:0 "銮·差勇萨颂堪生于1899年3月10日，本名庄·宽绰。1932年暹罗立宪革命发起时，他以陆军上尉身份加入“人民党”密谋核心，是参与政变的最早一批成员之一。此后他历任政府要职，晋升陆军上将，并曾出任公共卫生部长、农业部长等内阁职务。1962年3月9日逝世，享年62岁。"
 SIA_luang_haansongkhram_desc:0 "銮·汉颂堪本名披猜·汉颂堪，生于1896年。最高军衔为陆军上将。1968年逝世，享年约72岁。"
 SIA_luang_phibunsongkhram_desc:0 "銮披汶·颂堪生于1897年7月14日，暖武里府一户榴莲种植农家，祖父为广东移民后裔。早年就读佛寺学堂，后入朱拉隆功皇家陆军官校，1914年毕业授炮兵少尉衔，一战后赴法国炮兵应用学校深造，期间结识比里·帕侬荣，共同萌生推翻绝对君主制的构想。1928年获拉玛七世授“銮”衔封号“銮披汶·颂堪”，此后即以此为姓氏沿用终身。1932年6月24日政变中作为“人民党”军人派核心骨干之一发挥关键作用，1933年协助平定博沃拉德叛乱，1934年出任国防大臣，1938年12月出任总理并兼陆军总司令，开始其长达十余年的军政强人统治。任内大力推行泛泰民族主义文化改造，1939年将国号由“暹罗”改为“泰国”，发布一系列“文化敕令”强制推行西式着装、致敬国旗等国民生活准则。1940至1941年发动法泰战争夺回被法国占据的领土，1941年12月日军登陆后被迫允许日军过境，1942年1月对英美宣战（驻美大使拒绝递交宣战书使其法理无效），后因战局恶化于1944年7月辞职，战后一度因“战犯”罪名遭起诉但获释。1948年4月借政变重新出任总理直至1957年，任内转向坚定反共立场并与美国结盟，历经多次未遂政变（包括1949年“王宫叛乱”及1951年“曼哈顿号事件”）。1957年9月被部下沙立·他那叻发动政变推翻，被迫流亡日本，1964年6月11日因心脏衰竭病逝于日本神奈川县相模原市。"
 SIA_luang_sinthusongkhramchai_desc:0 "辛徒·甲玛叻那温生于1901年6月23日，本名“辛徒·甲玛叻那温”，惯称封号“銮·信突颂堪猜”。毕业于宽古拉威塔雅莱学校，获政府奖学金赴丹麦深造海军技术。1928年在巴黎结识“人民党”筹建者，受他威·蓬雅盖邀请加入并出任海军派领袖。1932年立宪革命后历任多项内阁职务、海军总司令（1934年及1938至1951年），任内力主海军现代化，主持引进暹罗史上首批潜艇。1951年6月“曼哈顿号事件”（海军兵变劫持总理銮披汶未遂）爆发后，他虽未直接参与叛乱，仍遭撤销海军总司令职务并以“叛国罪”判处监禁三年。出狱后淡出政坛，1952年他曾发起兴建曼谷吞武里区海军医院（今“帕蓬克劳亲王医院”）。1976年5月14日逝世，享年74岁。"
 SIA_luang_subhachalasai_desc:0 "銮·苏帕查拉赛本名“崩·苏帕查拉赛”，生于1895年1月22日，曼谷，早年入读暹罗皇家海军官校，1932年立宪革命时以海军少校军衔加入“人民党”海军派，是当时最资深的海军军官（时年37岁），协助策划海军方面行动，革命当日率部切断皇家码头一带电话电报线路并集结武器弹药支援政变行动。革命成功后，他奉命亲率暹罗号军舰前往华欣远镇宫，向国王呈递邀请拉玛七世返京出任立宪君主的信函，是该次历史性邀约的直接执行者。此后他历任副海军总司令，1934年获任首任体育厅厅长，主持修建暹罗国家体育场（今“苏帕查拉赛体育场”，1942年为纪念他而更名），被誉为“泰国体育之父”。1942至1944年间兼任教育部次长及内政部长。他曾迎娶朱拉隆功五世之子朱蓬亲王之女。1965年10月26日因肝病在朱拉隆功医院逝世，享年70岁。"
 SIA_luang_wichitwathakan_desc:0 "銮·威集瓦他干生于1898年8月11日，乌泰他尼府一华裔商人之子，本名“金良”。早年在佛寺学堂接受教育，因佛学造诣优异获拉玛六世颁发全国第一名证书，1921至1927年留学巴黎，其间与法国妻子结婚（1933年离异）。归国后结识“人民党”密谋成员，虽受邀参与1932年革命筹划但因忠于拉玛七世一度持保留态度，直至1933年博沃拉德叛乱期间国王暗中默许保皇派武装反扑后，他才彻底转向支持“人民党”。此后成为銮披汶政权的首席意识形态设计师及宣传部长，主导缔造銮披汶个人崇拜，1939年主持将国号由“暹罗”改为“泰国”的国会委员会，并鼓吹“大泰族”扩张主义、以法国远东学院地图为据宣称南中国及中南半岛存在六千万“泰族”人口。1938年演讲中曾将暹罗境内潮州华人比作纳粹德国治下的犹太人。战后与銮披汶一同以“战犯”罪名被盟军拘押，因证据不足获释。1947年协助銮披汶发动政变后出任财政、经济事务部长，后历任驻印度、瑞士、奥地利、南斯拉夫大使，创作多部宣扬民族团结的爱国主义戏剧（“安努帕系列”）。1958年参与沙立·他那叻推翻銮披汶的政变，出任总理府副职，继续担任沙立的亲信顾问。1962年3月31日因长期心脏病在曼谷逝世，享年63岁。"
 SIA_mangkorn_phromyothi_desc:0 "芒功·伏龙育提生于1896年，本名“芒功·蓬齐温”，1932年立宪革命时以陆军上尉军衔加入“人民党”密谋核心成员，此后历任陆军要职并晋升上将，1940至1941年法泰战争期间在陆军担任指挥职务。今泰国北柳府“蓬约提堡”（第2皇家卫队步兵师驻地）即以其原名命名。1966年逝世，享年约70岁。"
 SIA_manopakorn_nitithada_desc:0 "玛诺巴功·尼蒂他达生于1884年7月15日，曼谷华裔家庭，本名孔·胡塔辛哈。早年就读曼谷阿松申学院，赴英国获中殿律师学院律师资格，回国后任职司法部并逐步晋升，获封“披耶·玛诺巴功·尼蒂他达”衔，1918年入拉玛六世枢密院。1932年6月立宪革命后，“人民党”出于不愿被外界视为自我扩权，选定这位与革命毫无渊源的资深法官出任首任总理，主持起草并于同年12月10日颁布首部宪法（今泰国宪法日由此而来）。任内实为“人民党”傀儡内阁首脑，1933年因比里·帕侬荣提出带有社会主义色彩的经济计划（“黄皮书”）引发保守派反弹，他于同年4月以敕令中止国会、封锁部分宪法条款，实施所谓“四月政变”（“沉默政变”），迫使比里出走法国，并通过《反共法》大肆搜捕暹罗共产党人士。6月20日披耶帕凤发动政变将其推翻，他随即被流放至英属槟城，此后终生未获准返国，1948年10月1日在槟城中风逝世，享年64岁，遗骸未运回泰国，葬于槟城当地寺庙墓地。"
 SIA_manphya_khanphialong_desc:0 "架空虚构人物。“Luang”是暹罗官僚体系中的爵衔，通常译作“銮”，多见于近代暹罗军政官员名号。"
 SIA_nangklao_chichalerm_desc:0 "架空虚构人物。\"Nangklao\"（那空高）是却克里王朝第三代君主拉玛三世（1824—1851在位）专属的谥号，由其侄子拉玛四世（蒙固）追封，泰国传统上君主本名讳而不称，该谥号仅属拉玛三世一人所有。"
 SIA_nangklao_suriyawongse_desc:0 "架空虚构人物。“Nangklao”是拉玛三世的谥号，1824年至1851年在位后由拉玛四世追封；“Suriyawongse”与19世纪暹罗宾纳家族的高等贵族封号有关，庄·宾纳曾在1868年至1873年拉玛五世成年亲政前担任摄政，封号中即含“西·素里亚旺”。"
 SIA_pao_pienlert_boripanyutakit_desc:0 "保·边莱·波里潘育塔吉生于1893年11月10日，家中12名子女中排行第二，早年在泰国国内军校就读至16岁，其后获全额奖学金赴德意志深造军事，一战爆发后转赴瑞士，暹罗参战后又转往法国圣西尔军校完成学业，留法期间兼任暹罗驻巴黎使馆国防武官助理直至毕业。28岁返国后在陆军服役，36岁获封“銮·边莱·波里潘育塔吉”衔。此后历任要职，官至陆军上将，先后出任财政部长与商务部长。1970年3月4日逝世，享年76岁。"
 SIA_paribatra_sukhumbandhu_desc:0 "帕里巴特拉·素坤攀生于1881年6月29日，朱拉隆功国王（拉玛五世）第三十三子，母为素坤玛拉·玛拉丝丽王后。早年随父赴欧考察后入读普鲁士军校，回国后历任陆军总参谋长、暹罗海军总司令、海军部长、陆军部长、国防部长及内政部长，并长期担任拉玛六世、拉玛七世两朝枢密顾问，是绝对君主制末期最具实权的重臣之一，1932年4月国王离京避暑期间曾短暂代行摄政。因权势过大被“人民党”视为眼中钉，1932年立宪革命后遭逮捕并被放逐至荷属东印度万隆，此后终生未获准返国，二战期间当地转归日军占领下继续流亡，1944年1月18日病逝于万隆，遗骸至1948年才由王室专使护送归国安葬。"
 SIA_phichit_kriangsakphichit_desc:0 "披集·江沙披集本名銮·克良沙披集，生于1895年。1932年暹罗立宪革命时，他以陆军上尉身份加入“人民党”密谋核心成员行列，此后晋升陆军中将。1964年逝世，享年约69岁。"
 SIA_phin_choonhavan_desc:0 "屏·春哈旺生于1891年8月14日，暹罗一位潮州移民医生之子，其妻家族同样祖籍潮州澄海。二战期间出任“帕耶普军团”第三师师长，暹罗占领英属掸邦期间兼任当地军政总督。1947年11月8日夜，他联合卡·卡颂堪上校发动政变，推翻他威·探隆纳瓦沙越政府，自任“国家军事委员会”主席，9日通过广播发表政变声明，因情绪激动落泪，被媒体讥为“含泪英雄”，8日至10日短暂出任代理总理，随后让位于銮披汶。此后长期出任副总理及陆军总司令（1948—1954），是战后军政“叻查库集团”（因该集团成员多聚居于曼谷叻查库巷而得名）的核心人物，其子猜差·春哈旺后来官至泰国总理，女婿炮·实亚农为权势熏天的警察总监。1957年9月沙立·他那叻发动政变推翻銮披汶政权，他本人虽未遭放逐但实权旁落，此后转而与沙立维持合作关系，长期担任农业部长等职，1957年伊善大旱期间曾因轻描淡写灾情引发舆论批评。1973年1月26日逝世，享年81岁。"
 SIA_phra_bisal_sukhumvit_desc:0 "帕·比沙·素坤威本名“巴索·苏坤”，暹罗内政大臣、拉玛八世朝摄政颂·苏坤之子。早年赴美留学，先后就读菲利普斯埃克塞特中学（1919届）及麻省理工学院土木工程系（1923届），凭“波士顿州长广场交通研究及规制建议”为题的论文毕业，是首位从麻省理工毕业的泰国人；求学期间曾与友人组成“暹罗双子”音乐组合，在校内外演出暹罗歌曲及美式拉格泰姆改编曲。归国后任卫生工程局助理工程师，1930至1940年代主持暹罗公路网快速扩建，暹罗史上重要干道“素坤逸路”（1936年建成，1942年起以其封号“帕·比沙·素坤威”命名）即以其名字命名至今。1942至1943年出任皇家灌溉厅厅长。他也是“自由泰运动”成员，战争末期获比里·帕侬荣派往美国，随代表团设法争取美方对暹罗战后重建给予积极支持，尽管暹罗战时曾支持日本。"
 SIA_phra_sitthi_ruang_dejpol_desc:0 "帕·西提·伦·德差波本名“生·潘杜巴拉帕”，陆军上校军衔，1933年出任暹罗第一届国会（第二类指派议员）成员，1939年9月9日辞去议员职务。"
 SIA_phra_vechayanrangsarit_desc:0 "帕·维查扬冉西列本名“穆尼·玛哈山他那”，官至空军准将。1937年4月9日，暹罗空军正式升格为独立军种“皇家暹罗空军”（今泰国皇家空军前身），他出任升格后首任空军总司令，这一天此后被定为泰国“空军节”。"
 SIA_phraya_chalermarkiart_desc:0 "帕耶·切伦阿卡本名“苏尼·素万巴提”，生于1887年4月26日，素攀武里府，早年就读军校工程科。1911年2月2日目睹比利时飞行员范登博恩在暹罗首次公开飞行表演后深受触动。1911年1月18日，暹罗陆军部选派他与另两名军官（后分别封为帕耶·维哈萨延西拉巴西、帕耶·塔延披卡）赴法国学习飞行技术，是暹罗最早的三名飞行员，三人后来并称“暹罗空军之创始三元老”。1913年学成归国，同年12月29日在沙巴通马场完成暹罗史上首次本国飞行员试飞。此后主持组建陆军航空营（1915年）、选定廊曼为永久机场并于1914年建成、筹建升格为“陆军航空署”（1918年，即今空军前身），长期出任该署署长，直至1932年立宪革命后被免去将官职务。1938年获授空军准将衔，其后退役。1955年9月14日在朱拉隆功医院逝世，享年68岁，被誉为“泰国第一飞行员”及“泰国空军之父”。"
 SIA_phraya_chitnasongkhla_desc:0 "西·探玛提贝即“昭披耶·西·探玛提贝”（本名吉特·纳颂卡拉），生于1885年10月30日，宋卡府人，出身当地世家，家族历任宋卡地方长官。早年留学英国修习法律，1911年拉玛六世朝返国，历任民事法院法官等职，因才干出众迅速晋升，先后获封“銮·金达披隆”“帕·金达披隆·拉查萨帕波迪”“披耶·金达披隆·拉查萨帕波迪”，1931年拉玛七世特授其“昭披耶·西·探玛提贝”衔（食邑万莱），是暹罗历史上末代获封“昭披耶”（最高等级贵族衔）之人，此后该衔位随立宪革命而废止未再册封。1932年立宪革命后，他历任司法、外交、卫生、财政等多个内阁部长职务（历经披耶帕凤、銮披汶、宽·阿派旺等多届政府），并于1934年当选国会第四任议长。战后1946年他创办泰国人寿保险公司并任首任董事长，是首家由泰国人自主创立经营的人寿保险公司。此后长期出任九世王普密蓬枢密顾问，一度出任枢密院院长，官宦生涯横跨五朝、历时逾七十二年。1976年9月25日逝世，享年90岁零11个月。"
 SIA_phraya_phahon_desc:0 "披耶帕凤·丰派育哈色纳生于1887年3月29日，曼谷，本名朴·帕凤裕庭，父为潮州华裔上校吉姆，母为泰-孟裔。早年就读朱拉隆功皇家陆军官校，1903年获王室奖学金赴德意志普鲁士主要军官候补学校深造（据传与后来的纳粹元帅戈林同窗），继而转赴丹麦哥本哈根工程学院，因奖学金中断仅完成一年学业，1912年返暹罗。1931年获拉玛七世授“披耶帕凤·丰派育哈色纳”衔，1932年出任暹罗陆军总司令，是策划1932年立宪革命的“四剑客”核心成员之一、革命当日宣读《暹罗新国家宣言》之人，革命后被视为“人民党”资深领袖。1933年3月，总理玛诺巴功以“黄皮书”经济计划争议为由将他逐出内阁并中止宪法，他遂于6月20日发动不流血政变推翻玛诺巴功，次日自任第二任总理直至1938年，任内经历1933年10月博沃拉德叛乱等多次政局动荡，依靠个人威望及銮披汶等亲信军官维系统治。1938年因王室地产贱卖丑闻及国会选举失利被迫辞职，銮披汶继任总理。此后退出政坛，二战期间出任武装力量总监。1947年2月14日因脑出血在曼谷逝世，享年59岁，据传身后家人一度因经济拮据无力操办丧事，后由銮披汶出面协助安排。"
 SIA_phraya_preechacholayudha_desc:0 "巴耶·普里查乔拉育本名“旺·扎鲁帕”，早年就读帖沙林中学（1909年入学，1915年毕业），海军军官出身。1932年6月立宪革命后，他出任临时执政机构“人民委员会”委员（1932年6月28日至12月10日），继而在首部宪法颁布后转任内阁部长（1932年12月至1933年8月），并于1932年7月6日起出任革命后首任海军总司令，直至1933年8月因调任内政部任职而离任，由披耶·维吉特查拉提接任。"
 SIA_phraya_songsuradet_desc:0 "披耶·颂素拉德生于1892年8月12日，曼谷一军人世家，本名“帖·潘图森”。早年在普鲁士皇家陆军候补生学校受训，回国后长期主持暹罗多条铁路工程建设，1932年革命前夕出任作战厅厅长，独自策划1932年革命行动方案，直至行动前一日才向同僚透露细节，因学识渊博被并称“四剑客”之一，据评论家评价是四人中最具才干者。1933年6月披耶帕凤政变后，因其曾支持被推翻的玛诺巴功一派而遭终身禁止从政，流亡锡兰两年。同年10月博沃拉德叛乱爆发前夕，他与同僚普拉萨上校已提前出走国外并拒绝归国参战；因此，他并未协助政府平定叛乱，而是对是否出兵态度暧昧。1938年銮披汶出任总理后，两人积怨爆发，1939年1月銮披汶借口“颂素拉德叛乱案”（又称“十八具尸体叛乱案”）大肆搜捕政敌五十余人，其本人被褫夺军职流放印度支那，此后在金边以修理自行车、与妻子磨面制售糕点为生，境况潦倒，1944年6月1日因败血症死于金边一处废弃宅邸，亦有传言称系遭毒杀。"
 SIA_phraya_thayarnpikart_desc:0 "帕耶·塔延披卡本名“提普·格图达”，是暹罗最早三名飞行员之一，1911年与帕耶·切伦阿卡、帕耶·维哈萨延西拉巴西一同奉命赴法学习飞行技术，留法期间曾因飞行训练事故受伤，休养后继续完成学业，1913年学成归国后进入陆军工程督察部负责航空事务，此后出任陆军航空营副营长，与帕耶·切伦阿卡等共同缔造暹罗军事航空事业，三人并称“暹罗空军之创始三元老”。其子后来是泰国知名科学家兼教育家西帕暖·格图达。"
 SIA_phraya_wichcitcholathai_desc:0 "披耶·维吉特查拉提本名“通迪·苏万普勒”，生于1890年10月23日，曼谷，早年就读寺庙学校及皇家学院，1905年考入海军官校，1908年毕业服役。历任海军多项职务，1917年晋升海军少校，1921年获封“帕·仁光沙蒙”衔，1923年晋升海军上校。1932年立宪革命12天后即获任命为海军总参谋长，1933年8月5日接替披耶·普里查乔拉育出任海军总司令，但仅任职四个月即于同年12月1日辞职，由辛徒·甲玛叻那温以代理身份接任。此后历任国防部次长及内阁部长等职，并两度出任御前侍卫。1958年6月27日逝世，享年67岁。"
 SIA_plaek_phibunsongkhram_desc:0 "銮披汶·颂堪生于1897年7月14日，暖武里府一户榴莲种植农家，祖父为广东移民后裔。早年就读佛寺学堂，后入朱拉隆功皇家陆军官校，1914年毕业授炮兵少尉衔，一战后赴法国炮兵应用学校深造，期间结识比里·帕侬荣，共同萌生推翻绝对君主制的构想。1928年获拉玛七世授“銮”衔封号“銮披汶·颂堪”，此后即以此为姓氏沿用终身。1932年6月24日政变中作为“人民党”军人派核心骨干之一发挥关键作用，1933年协助平定博沃拉德叛乱，1934年出任国防大臣，1938年12月出任总理并兼陆军总司令，开始其长达十余年的军政强人统治。任内大力推行泛泰民族主义文化改造，1939年将国号由“暹罗”改为“泰国”，发布一系列“文化敕令”强制推行西式着装、致敬国旗等国民生活准则。1940至1941年发动法泰战争夺回被法国占据的领土；1941年12月日军登陆后被迫允许日军过境，随后对盟国宣战，引发自由泰运动反弹。因战局恶化，他于1944年7月辞职，战后一度因“战犯”罪名遭起诉但获释。1948年4月借政变重新出任总理直至1957年，任内转向坚定反共立场并与美国结盟，历经多次未遂政变。1957年9月被部下沙立·他那叻发动政变推翻，被迫流亡日本，1964年6月11日因心脏衰竭病逝于日本神奈川县相模原市。"
 SIA_prajadhipok_desc:0 "巴差提朴生于1893年11月8日，曼谷，朱拉隆功国王（拉玛五世）幼子。早年赴英国伊顿公学及伍尔维奇皇家军事学院受训，并在英国陆军皇家骑炮兵团服役，一战期间因暹罗中立被兄长拉玛六世召回。1918年与表姐兰拜·巴尼公主结婚。1925年11月兄长瓦栖拉兀（拉玛六世）猝逝且无嫡子继承，26日他仓促继位，是为拉玛七世，史称暹罗末代绝对君主。任内推行财政紧缩、设立枢密院、创建国家图书馆、扩大大学教育，并着手起草宪法草案，但受制于保守宗室阻挠迟迟未能颁布。1932年6月24日，“人民党”发动不流血政变，时值国王在华欣避暑，他接受立宪要求，同年12月10日颁布暹罗首部永久宪法，成为该国首位立宪君主。此后与“人民党”政府矛盾渐深，1933年博沃拉德叛乱后威望受损，1934年赴英就医期间与政府就赦免权等问题谈判破裂，1935年3月2日宣布逊位，发表声明表示愿将权力交还全体人民、但不愿交给任何个人或团体擅自使用。此后终老英国，未再返回暹罗，1941年5月30日在英国萨里郡病逝，骨灰由王后带回暹罗安放。"
 SIA_prayoon_pamornmontri_desc:0 "巴允·帕蒙蒙特里生于1897年2月5日（一说1898年），德国柏林，其父为暹罗驻德武官颜·帕蒙蒙特里少校，母为德裔医师安内莉·帕蒙蒙特里，曾在德国教授多名暹罗留学军官德语，其中不少人后来成为“人民党”骨干。他与孪生兄弟巴永幼年同任拉玛六世侍从，成年后同任皇家卫队军官，此后辞职赴巴黎攻读政治学。留欧期间，他是最早与比里·帕侬荣共同筹划“人民党”的两名核心成员之一，1927年2月5日（他30岁生日当天）在巴黎索梅拉尔街9号召开该党首次正式会议，负责联络协调各方成员。1932年立宪革命后，他在銮披汶内阁出任教育部长，战后又于1954至1957年出任卫生部长。军事方面，他创立“国土防卫志愿队”，官至陆军中将，1957年2月大选中代表清迈府当选国会议员。1982年8月12日因车祸在曼谷逝世，享年85岁。"
 SIA_prayoon_yuthasastrkosol_desc:0 "巴允·育他塞哥颂本名“巴允·育他塞哥颂”，惯称封号“銮·育他塞哥颂”，生于1893年10月19日。1919年入暹罗皇家海军官校，1932年入海军战争学院深造期间获同窗赠绰号“教授”，此后终生沿用。1932年革命后长期在海军服役至1957年退役，历任多项要职，1953年率领暹罗海军仪仗队代表出席英国女王伊丽莎白二世加冕典礼阅兵式，另曾代表暹罗出访西班牙、意大利、日本、瑞士、法国、比利时、挪威、瑞典、丹麦、美国、台湾及香港等地。1956年晋升海军元帅，1957年出任副总理。晚年投身农业事业，推动蒸谷米农户建立自主经销市场及冷藏保鲜设施，并涉足液化石油气农村建设与橡胶产业发展。1975年12月11日逝世，享年82岁。"
 SIA_pridi_banomyong_desc:0 "比里·帕侬荣生于1900年5月11日，大城府一农户家庭的驳船上，19岁即成为暹罗最年轻的执业律师之一。1920年获王室奖学金赴法留学，先后获卡昂大学硕士学位及巴黎大学法学博士学位（1927年），留法期间深受法国社会主义思想影响，与銮披汶·颂堪等旅法暹罗学生共同创立“人民党”。1932年6月24日，他领导人民党文官派与军人派发动不流血政变，终结绝对君主制，主持起草暹罗首部宪法。1933年因提出国有化色彩浓厚的经济计划遭保守势力猛烈抨击，一度被迫短暂流亡海外，返国后历任内政、外交、财政部长，1936至1937年任外交部长期间促成废除与十二国的不平等条约。1941至1945年出任摄政，代行年幼的拉玛八世王权；日军登陆暹罗后，他暗中领导国内“自由泰运动”从事对日地下抵抗，同时拒绝在对英美宣战书上签字使该宣战在法理上无效。1946年3月出任暹罗史上首位民选总理，同年6月因拉玛八世离奇身亡于王宫，他遭政敌污蔑为幕后主使，8月被迫辞职。1947年11月銮披汶发动政变后被迫流亡，1949年策动反政变未遂后彻底转入长期海外流亡，先后辗转中国大陆二十余年，1970年移居法国巴黎，1983年5月2日病逝于巴黎，骨灰三年后运回泰国撒入暹罗湾。"
 SIA_puey_ungpakorn_desc:0 "贝·黄培谦生于1916年3月9日，曼谷一潮州移民鱼贩家庭，中文名黄培谦，祖籍广东饶平。1934年考入新成立的法政大学首届学生，1937年毕业后短暂任法语翻译，1938年获政府奖学金赴伦敦政治经济学院攻读经济学。1941年12月日本入侵暹罗、銮披汶政府结盟日本后，他中断学业加入“自由泰运动”，协助在英国境内组织该运动，接受英方军事训练，化名“甘·延英”。1944年他伞降泰国猜纳府执行秘密联络比里·帕侬荣的任务，降落后被当地政府逮捕关押寺庙，后经自由泰同志营救获释。战后完成学业，1948年获伦敦政经学院经济学博士学位，1949年加入财政部任经济学者，1953年出任国家经济委员会常务董事及泰国央行副行长，1959年升任央行行长，年仅43岁即成为该行史上最年轻及任期最长的行长（至1971年，逾十二年），任内推动汇率改革、成立预算局并力保央行独立性，1964年获菲律宾麦格塞塞奖，成为首位获此殊荣的泰国人。1966年起兼任法政大学经济学院院长，1967年在猜纳府创立“泰国乡村重建基金会”推动农村发展，获国王御赐赞助。1973年他那滕军人政权垮台后出任经济顾问委员会主席，1975年出任法政大学校长，1976年10月6日法政大学血腥镇压事件中因被极右翼势力污蔑为“颠覆分子”被迫流亡英国，此后中风致丧失语言与写作能力，长居伦敦直至1999年7月28日逝世，享年83岁。"
 SIA_rambai_barni_desc:0 "兰拜·巴尼生于1904年12月20日，曼谷，蒙固王（拉玛四世）之孙、沙瓦斯迪·索帕纳亲王之女，自幼被送入宫中由王后梳华帕蓬西抚养教育。1918年8月26日与表兄巴差提朴亲王在邦芭茵宫成婚，婚后未育有子女。1925年丈夫继位为拉玛七世后，她成为暹罗历史上首位在加冕礼上正式册立的王后，拉玛七世自此废止历代蓄妃传统，终身只立她一人为后。1932年立宪革命及1933年博沃拉德叛乱期间，她始终陪伴丈夫辗转华欣、宋卡等地，1933年随夫赴英就医，1935年丈夫逊位后定居英国。二战期间以红十字会志愿者身份在英服务，并与其弟一同暗中支持“自由泰运动”。1941年丈夫病逝后，她于1949年携带丈夫骨灰返回泰国，此后长期投身章达武里府农业、畜牧及手工艺发展事业，在当地创办“班交园”农庄示范经营十八年，并资助改建当地医院。1984年5月22日在曼谷沙可太宫寝宫内因心脏衰竭辞世，享年79岁。"
 SIA_rangsit_prayurasakdi_desc:0 "兰实·拍裕沙迪生于1885年11月12日，朱拉隆功国王（拉玛五世）第五十二子，封号“猜纳亲王”，早年被沙宛·瓦塔纳王后收养，与马希敦亲王情同手足。1913年返国后长期致力于暹罗公共卫生事业，创建卫生部并任首任部长，被誉为泰国现代公共卫生体系奠基人，另兼任大学事务厅首任厅长、朱拉隆功大学规划发展委员会主席。1932年立宪革命后未涉足政治，但1938年仍以“叛国”罪名遭銮披汶军政府逮捕入狱近五年，狱中以禅修及撰写回忆录度日，1943年获释，1944年銮披汶下台后爵位与荣衔悉数恢复。1946年6月拉玛八世离奇身亡后，因新即位的九世王普密蓬计划先完成海外学业，他于同年6月16日起出任暹罗摄政，1947年起兼任国务委员会主席，1949至1951年多次出任摄政直至1951年3月7日因心脏病发作在曼谷逝世，是朱拉隆功国王最后一位在世的儿子，享年65岁。今曼谷北郊“兰实”地区及运河即以其名命名。"
 SIA_sanguan_tularaksa_desc:0 "沙愿·都拉叻沙生于1902年6月18日，潮州华裔家庭。长期追随比里·帕侬荣，是1932年立宪革命“人民党”元老成员之一，历任国会议员、财政部烟草专卖局局长。1943年受比里派遣，出任“自由泰运动”驻重庆代表团团长，其外交努力对争取英美两国支持该地下抵抗运动至关重要，为该运动此后获得盟军军事装备补给奠定基础。1946年出任驻华大使。1947年政变后他拒绝返回泰国，公开宣称新宪法不具合法性，此后长期流亡海外。1995年5月15日逝世，享年92岁。"
 SIA_seni_pramoj_desc:0 "社尼·巴莫生于1905年5月26日，拉玛二世玄孙，父为堪罗普亲王，母为宾纳家族出身。早年就读英国德比郡特伦特公学，获牛津大学伍斯特学院法学学士学位（二等荣誉），继而在伦敦格雷律师学院深造获一等荣誉，回国后先后在最高法院实习及民事法庭任职，后转入外交部，1940年获派任驻美大使。1941年12月日军登陆暹罗后，1942年1月銮披汶政府对英美宣战，他拒绝向美国国务院递交宣战书，率使馆全体人员倒向盟国一方，随即在美国境内筹组“自由泰运动”，动用暹罗在美冻结资产武装训练逾五万名泰裔及旅美泰国学生，因此举使美国战后未将暹罗视为战败敌国、免于承受战争赔偿责任。1945年9月17日返抵曼谷当日即出任总理，但因内阁充斥比里·帕侬荣派系人马而感掣肘，1946年1月辞职，同年与胞弟克立·巴莫共同创立民主党。此后长期在野从政并兼任律师，1975年2月至3月、1976年4月至10月两度短暂复任总理，末次任内适逢1976年10月6日法政大学血腥镇压事件，他被军方逼宫下台，此后辞去民主党党魁职务永久退出政坛，重操律师旧业直至退休。1997年7月28日在曼谷病逝，享年92岁。"
 SIA_sindh_kamalanavin_desc:0 "辛徒·甲玛叻那温生于1901年6月23日，本名“辛徒·甲玛叻那温”，惯称封号“銮·信突颂堪猜”。毕业于宽古拉威塔雅莱学校，获政府奖学金赴丹麦深造海军技术。1928年在巴黎结识“人民党”筹建者，受他威·蓬雅盖邀请加入并出任海军派领袖。1932年立宪革命后历任多项内阁职务、海军总司令（1934年及1938至1951年），任内力主海军现代化，主持引进暹罗史上首批潜艇。1951年6月“曼哈顿号事件”（海军兵变劫持总理銮披汶未遂）爆发后，他虽未直接参与叛乱，仍遭撤销海军总司令职务并以“叛国罪”判处监禁三年。出狱后淡出政坛，1952年他曾发起兴建曼谷吞武里区海军医院（今“帕蓬克劳亲王医院”）。1976年5月14日逝世，享年74岁。"
 SIA_sindhu_kamalanavin_desc:0 "辛徒·甲玛叻那温生于1901年6月23日，本名“辛徒·甲玛叻那温”，惯称封号“銮·信突颂堪猜”。毕业于宽古拉威塔雅莱学校，获政府奖学金赴丹麦深造海军技术。1928年在巴黎结识“人民党”筹建者，受他威·蓬雅盖邀请加入并出任海军派领袖。1932年立宪革命后历任多项内阁职务、海军总司令（1934年及1938至1951年），任内力主海军现代化，主持引进暹罗史上首批潜艇。1951年6月“曼哈顿号事件”（海军兵变劫持总理銮披汶未遂）爆发后，他虽未直接参与叛乱，仍遭撤销海军总司令职务并以“叛国罪”判处监禁三年。出狱后淡出政坛，1952年他曾发起兴建曼谷吞武里区海军医院（今“帕蓬克劳亲王医院”）。1976年5月14日逝世，享年74岁。"
 SIA_thawee_punyaketu_desc:0 "他威·蓬雅盖生于1904年11月10日，曼谷，早年就读英国剑桥大学国王学院及法国格里尼翁高等农业学院，归国后任职农业部。1932年6月24日加入“人民党”参与立宪革命，此后出任銮披汶内阁秘书长，继而在宽·阿派旺内阁出任教育部长。1945年8月，宽·阿派旺辞职后，因首选人选一时未能到位，他于8月31日临危受命出任总理，仅执政18天即于9月17日辞职让位于社尼·巴莫，是泰国史上任期最短的总理。此后出任沙立·他那叻政府时期宪法起草委员会主席。1971年11月3日逝世，享年66岁。"
 SIA_thawon_thamrongnawasawat_desc:0 "他威·探隆纳瓦沙越本名“他威·塔里沙越”，惯称封号“銮·探隆纳瓦沙越”，生于1901年11月21日，华裔背景，中文名郑连淡。海军军官出身，官至海军少将，1935至1938年出任内政部长。二战期间是“自由泰运动”地下抵抗核心领导人之一。1946年8月，因拉玛八世离奇身亡引发比里·帕侬荣政府信誉危机，比里于同年8月21日辞职，他作为折中人选于8月23日当选总理，任内主要处理战后对盟军赔偿事宜（主要以稻米输送形式向盟国交付赔偿），并推动1946年对英和约签署以恢复泰国国际地位。1947年11月8日銮披汶集团发动政变将其推翻，他一度流亡香港。是泰国史上首位、也是迄今唯一一位出身海军的总理。1988年12月3日在帕蒙库特陆军医院逝世，享年87岁。"
 SIA_tiang_sirikhan_desc:0 "提昂·西里坎生于1909年，泰国东北部沙功那空府，本名“提昂·西里坎”，绰号“普潘勇士”。毕业于朱拉隆功大学，曾任乌顿披他育中学及朱拉隆功大学教师，是东北部四位早年当选国会议员的“人民党”背景政治家之一，与通英·普里帕、他文·乌敦、詹隆·道銮并称“东北四虎”，1933年首届民选国会大选中当选沙功那空府议员，此后连任五届直至1952年，三度出任内阁部长。1943年比里·帕侬荣委派他在沙功那空府普潘山区建立“自由泰运动”训练营，代号“普鲁托”，鼎盛时期训练游击队员逾万人，与英方特种作战136部队及美国战略情报局密切合作，是全国规模最大的自由泰武装力量之一，战争末期还负责解除当地日军武装。战后他积极扶持东南亚反殖民独立运动，1946年为逃离法国重占印支的越南难民提供庇护并向越盟武装供应军火，1947年发起“东南亚同盟”并出任主席。1949年2月比里派海军策动反政变失败后，他因涉嫌“分离主义”遭当局搜捕并受审，1952年11月被捕，同年12月12日与另四人一同秘密处决，遗体焚毁掩埋，直至1959年才在北碧府寻获遗骸。他是“东北四虎”中最后一位遇难者，其余三人已于1949年“11公里事件”中遭警方枪杀。"
 SIA_tianliang_huntrakool_desc:0 "帕耶·西·维萨拉瓦扎本名“田良·洪特拉贡”，生于1896年2月25日，泰国潮州华裔商人世家，家族原姓“洪”，1911年由长兄资助赴英国留学，就读达利奇学院。归国后长期任职宫廷，官至拉玛七世朝“御前秘书长”（政府文官系统最高职位之一），并参与起草拟呈拉玛七世的宪法草案（与西·探玛提贝及美籍顾问雷蒙德·史蒂文斯共同草拟）。1932年立宪革命后转任外交界，1946年2月至3月短暂出任财政部长，1947至1948年出任外交部长。他培养提携多位后进，包括后来出任泰国总理的阿南·班雅拉春（1948年赴其母校达利奇学院留学即由他推荐）。其胞兄经商致富，家族后代颂迈·洪特拉贡后来在炳·廷素拉暖政府出任财政部长。1968年3月23日逝世，享年72岁。"
 SIA_vilas_osathanondh_desc:0 "威拉斯·奥萨他暖生于1900年11月7日，曼谷，父为暹罗地方总督帕耶·帕拉查吉贡查克，“威拉斯”（意为“英国人”）之名由丹隆亲王御赐，因其父曾留学英国。早年就读皇家侍从学校，获拉玛六世奖学金赴英国攻读农业，归国后任职农业部，结识同僚他威·蓬雅盖，经其引荐加入“人民党”，1932年6月24日政变当日随宽·阿派旺一组负责切断挖龙寺附近电话线路以阻断当权者通讯。革命后历任临时国会代表、正式国会议员，1932年12月出任无任所部长兼交通部次长。1941年5月起任宣传厅首任厅长兼内阁部长，日军入侵暹罗后，因日方不满他与比里·帕侬荣的立场，双双被迫离阁，此后投身“自由泰运动”抵抗工作。战后曾任商业部长，1946年新宪法设立两院制国会后，当选参议院（元老院）首任议长，同时兼任国会两院联合首任议长，是泰国史上首位担任此职者。1997年1月13日因心脏衰竭辞世，享年96岁。"
 SIA_wan_waithayakon_desc:0 "旺·威泰耶康生于1891年8月25日，曼谷，蒙固王（拉玛四世）之孙，全名“瓦纳·维达雅卡拉亲王”，封号“纳拉提·蓬萨帕班亲王”。早年就读曼谷素安宽拉学校及皇家学院，赴英国牛津大学贝利奥尔学院攻读历史并获荣誉学位，继而在巴黎政治学院深造。1917年投身外交界，1922年出任表兄拉玛六世顾问，1924年晋升外交部次长，负责与西方列强修订不平等条约相关谈判，1926年出任驻英、荷、比公使并率团出席国际联盟会议历任要职。1930年返国出任朱拉隆功大学教授。此后长期活跃于外交舞台，1943年参与对日谈判，战后促成暹罗加入联合国，1947年出任驻美大使兼常驻联合国代表，1952至1957年、1958年两度出任外交部长，1956至1957年当选联合国大会第十一届会议主席，是首位担任此职的亚洲人。他精通英语、巴利语、梵语，为泰语创造大量对译新词（如“民主”“宪法”“银行”“战争”等常用词汇均出自其手），长期担任泰国皇家学会会长，被视为泰国语文学考据学奠基人之一。1976年9月5日在曼谷逝世，享年85岁。"
 SWE_archibald_douglas_desc:0 "阿奇博尔德·道格拉斯（1883年2月14日—1960年2月11日），瑞典陆军中将，出身苏格兰裔瑞典望族道格拉斯家族（该家族十七世纪即已迁居瑞典并归化，在瑞典军事贵族史上享有显赫地位）。他在瑞典陆军中历任军区司令等高级职务。其家族背景使他在瑞典军界具有独特的社会地位。1960年逝世。"
 SWE_arne_beurling_desc:0 "阿尔内·卡尔-奥古斯特·伯伊林（1905年2月3日，生于哥德堡—1986年11月20日），瑞典数学家兼密码学家，二战中瑞典信号情报的核心人物。乌普萨拉大学教授，在调和分析、复分析及势论领域做出杰出学术贡献。1940年夏天，德军经瑞典电缆发送的加密电传打字机通信被瑞典信号情报机构截获，伯伊林仅凭密文磁带、不接触任何实物机器，在两周之内以纸笔独力破解了西门子T52“秘密打字机”（Geheimschreiber）的加密原理——该机器产生近一百京种变化组合，德方认为绝不可能被破译。这一壮举被密码学史家评价为“可能是二战中最杰出的密码分析成就”，堪与英国布莱切利园破译恩尼格玛相媲美，但被保密逾五十年。凭借破译成果，瑞典当局在巴巴罗萨行动发起前即已知悉德国攻苏计划。被问及如何做到时他只说“魔术师不透露秘密”。战后赴美，继承了爱因斯坦在普林斯顿高等研究院的办公室。1986年逝世。"
 SWE_axel_pehrssonbramstorp_desc:0 "阿克塞尔·皮尔森-布拉姆斯托尔普（1883年8月19日—1954年2月26日），瑞典农民党领袖（1934—1949年），1936年短暂出任首相（著名的“假期内阁”）。出身斯科讷省农民家庭。1936年6月社民党内阁因国防开支问题辞职后，国王委托皮尔森-布拉姆斯托尔普组阁，他组成了一个仅持续约三个月的农民党少数政府（因恰逢议会夏季休会而被戏称为“假期内阁”），随后与汉森达成协议组建社民党-农民党联合政府，他在联合政府中长期担任农业大臣。二战期间作为联合政府成员参与治国。1954年逝世。"
 SWE_axel_rappe_desc:0 "阿克塞尔·奥斯卡·拉佩（1884年6月22日，生于斯德哥尔摩—1945年10月31日），瑞典陆军少将，出身军事贵族家庭（其父同名，曾任战争大臣）。1904年入伍瑞典皇家炮兵团，后就读炮兵工程学院及陆军参谋学院。1918年他离开瑞典军队参加芬兰内战，在曼纳海姆麾下的总参谋部服役并晋升中校，出任东部军团参谋长。回国后历任炮兵工程学院教员、上诺尔兰军区参谋长、东部军区参谋长及总参谋部中央处处长等职，1935年晋升上校。此后担任约塔炮兵团及斯韦阿炮兵团团长、炮兵总监及第五军区司令。著有多部关于国防政策及东部军团作战指挥的军事著作。1945年逝世。"
 SWE_bengt_nordenskiold_desc:0 "本特·诺登许尔德（1891年10月29日—1972年9月6日），瑞典空军将军，空军现代化的关键推手。出身著名的诺登许尔德探险家族。1931年瑞典空军从陆军独立为单独军种后，他担任空军总监（后为空军司令），主持了瑞典空军从初创到具备独立作战能力的全过程。二战期间他负责扩充空军实力、引进和自行生产现代战机，使瑞典空军成为维护武装中立的重要力量。1954年退役时被晋升为将军——他是瑞典空军史上首位获授将军军衔的非王室现役军官。1972年逝世。"
 SWE_birger_furugard_desc:0 "比里耶·富鲁戈德（1887年11月4日—1961年7月19日），瑞典纳粹运动最早的创始人之一。原为兽医，1920年代末开始组织瑞典最早的国家社会主义团体，1930年创建瑞典国家社会主义党（SNSP），是瑞典纳粹运动的先驱。其组织在1930年代初曾获得一定支持，但1933年林霍尔姆脱离另建NSAP后，瑞典纳粹运动分裂为两个相互竞争的团体。富鲁戈德的组织此后逐渐衰落。1950年代他仍活跃于极右翼边缘，但影响力已大为下降。1961年逝世。"
 SWE_carl_ehrensvard_desc:0 "卡尔·埃伦斯韦德，瑞典陆军将领。埃伦斯韦德家族是瑞典著名军事贵族世家（以十八世纪建造卡尔斯克鲁纳海军基地的奥古斯丁·埃伦斯韦德最为知名）。"
 SWE_carl_lindhagen_desc:0 "卡尔·林德哈根（Carl Lindhagen，1860—1946）是瑞典法学家、社会主义政治家兼和平主义者，出身法律世家，父亲为知名法学家兼城市规划者阿尔贝特·林德哈根。他在乌普萨拉攻读法律，曾任诺贝尔遗嘱执行顾问及1899年诺贝尔委员会秘书，并因反军国主义立场数度被提名诺贝尔和平奖。1903—1930年长期担任斯德哥尔摩市首席法官，是一项法律职务而非民选市长。1902年他在议会提出女性选举权动议，直接催生了瑞典有组织的妇女参政运动。1909年加入社民党，1917年参与左翼分裂、加入社会民主左翼党；1921年因反对共产国际“二十一条”被开除，1923年重归社民党。他毕生倡导民主、妇女权利与工农权益，也是世界语的长期支持者。1946年逝世。"
 SWE_christian_gunter_desc:0 "克里斯蒂安·云特（1886年4月19日—1966年6月6日），瑞典外交官兼政治家，无党派人士，1939—1945年出任战时联合政府外交大臣，是瑞典二战期间中立外交政策的主要执行者。他在极其艰难的国际环境下——瑞典被轴心势力包围、同时面临来自德国和盟国的双重压力——主导了对德妥协政策（允许借道、出口铁矿石）与维护国家主权之间的平衡，这一外交路线至今仍受争议。战后因战时对德妥协立场而遭到批评，被翁登接替。1966年逝世。"
 SWE_erik_palmstierna_desc:0 "埃里克·帕尔姆谢纳（1877年6月9日—1959年3月16日），瑞典男爵、外交官兼政治家。出身贵族帕尔姆谢纳家族，社民党人。一战期间曾任海军大臣，后转向外交领域，历任驻英国公使等职。他同时是一位多产的日记作家，其详尽的政治日记成为研究瑞典二十世纪政治史的重要一手史料。1959年逝世。"
 SWE_ernst_linder_desc:0 "恩斯特·林德（1868年4月7日—1943年4月14日），瑞典陆军中将兼马术奥运选手。他是一位文武双全的人物——既是职业军人（历任骑兵团长等职），又是卓越的马术运动家，在1912年斯德哥尔摩奥运会马术比赛中代表瑞典赢得团体金牌（盛装舞步）。1939—1940年冬季战争期间，年逾七旬的他受命赴芬兰指挥瑞典志愿军，展现了非凡的军事经验与个人勇气。1943年逝世。"
 SWE_ernst_wigforss_desc:0 "厄恩斯特·维格弗斯（1881年1月17日—1977年1月2日），瑞典社会民主党首席经济理论家兼财政大臣（1925—1926年、1932—1949年）。语言学出身，在哥德堡大学任教期间转向经济学与社会主义理论研究。作为“人民之家”福利经济的设计师，他在1930年代大萧条期间提出以赤字财政刺激经济、扩大公共就业的政策，早于凯恩斯理论在英美的实践——被称为“瑞典式凯恩斯主义”的先驱。他的财政政策与社会改革理念为瑞典战后福利国家的全面建设奠定了理论与制度基础。同时他也是一位多产的作家与知识分子。1977年逝世，享年九十五岁。"
 SWE_fabian_tamm_desc:0 "法比安·塔姆（1886年—1957年），瑞典海军上将，二战期间海军最高指挥官。塔姆家族在瑞典军政界有悠久传统。他在战时主管瑞典海军的中立巡逻与领海防务任务——在波罗的海被轴心势力控制、同时盟国亦有侵入瑞典水域之虞的复杂局面下，指挥海军维护瑞典的海上中立地位。1957年逝世。"
 SWE_frans_severin_desc:0 "弗兰斯·塞韦林（1875年—1961年），瑞典左翼/社民党政治家。早年曾参加社民党左翼运动，后回归社民党主流。曾任议员及市政官员。其政治生涯在社民党内部虽非最核心层，但代表了一批从左翼立场经历分裂与回归后最终融入“人民之家”福利建设的社民党老一代政治家群体。1961年逝世。"
 SWE_fredrik_strom_desc:0 "弗雷德里克·斯特伦（1880年8月22日—1948年10月27日），瑞典早期共产党/社民党作家兼政治家。1917年参与创建左翼社会民主党，加入共产主义运动。后离开共产党回归社民党。他同时是一位多产的作家，著有大量政治评论、诗歌及回忆录，记录了瑞典左翼运动早期的风云变幻。曾任斯德哥尔摩市政官员。1948年逝世。"
 SWE_gosta_bagge_desc:0 "约斯塔·巴格（Gösta Bagge，1882—1951）是瑞典经济学家、保守派政治家，1935—1944年任右翼党党魁。生于斯德哥尔摩，就读乌普萨拉大学，曾赴美国约翰·霍普金斯大学深造，后获经济学博士，1921年起任斯德哥尔摩大学经济学与社会政策教授，并与赫克舍尔共同创办保守派刊物《瑞典杂志》。1935年接替阿尔维德·林德曼出任党魁，1939—1944年在二战联合政府中任教育大臣。他在社会问题上持保守立场、经济上倾向自由主义，是社民党财政大臣维格弗斯经济政策的尖锐批评者，也是援助芬兰的主要主张者。1944年卸任党魁，1951年逝世。"
 SWE_gunnar_myrdal_desc:0 "贡纳尔·米达尔（1898年12月6日—1987年5月17日），瑞典经济学家、社会理论家，1974年诺贝尔经济学奖得主（与弗里德里希·哈耶克共同获奖）。斯德哥尔摩大学教授，社会民主党人。1934年他与妻子阿尔瓦·米达尔合著《人口问题危机》一书，直接推动瑞典政府在住房、家庭补贴及母婴保健领域的重大社会改革，奠定了“人民之家”福利体系的理论基础。1930年代他发展了制度经济学方法论，强调经济分析不可脱离价值判断。1944年出版巨著《美国困境》，以经济学家的笔触系统分析美国种族问题，对美国民权运动产生深远影响。战后历任联合国、瑞典政府及国际组织要职。1987年逝世。"
 SWE_helge_jung_desc:0 "黑尔格·荣格（Helge Jung，1886—1978）是瑞典陆军上将，军事改革派代表人物。生于马尔默，1906年毕业于卡尔贝里军校后入伍。他曾在军事学院讲授战史与战略，聚集起一批主张扩军备战的年轻军官，出任1930年国防委员会秘书，推动了1938年国会通过的重整军备计划。1937—1940年任陆军参谋长，1938年晋升少将。二战期间主张援助芬兰对抗苏联，1943年兼任斯德哥尔摩卫戍司令。1944年4月晋升上将并出任瑞典武装力量最高统帅，直至1951年卸任，任内主导战后瑞典国防的重组与现代化，被视为影响深远的国防奠基者。1978年逝世于斯德哥尔摩。"
 SWE_hugo_silen_desc:0 "胡戈·西伦（1889年—1934年），瑞典共产党（莫斯科派）早期领导人。1929年瑞典共产党分裂时，他是共产国际忠实派的核心组织者——虽然他这一派仅保留了约四千名党员（全党一万七千人中的少数），但得到莫斯科的承认而成为“正统”瑞典共产党。在他领导下，党执行激进的“阶级对阶级”路线，拒绝与社民党合作。其追随者被称为“西伦派”（Sillénare），以区别于被开除的多数派“希尔布姆派”（Kilbommare）。1934年他因病早逝，党的领导权随后转移至林德罗特手中。"
 SWE_ivar_holmquist_desc:0 "卡尔·阿克塞尔·弗雷德里克·伊瓦尔·霍尔姆奎斯特（1879年2月22日，生于赫尔辛堡—1954年9月24日），瑞典陆军中将兼体育界要人，1940—1944年出任陆军总监。1899年任约塔近卫团少尉，1902—1904年就读陆军参谋学院，此后历任参谋学院教员、驻奥匈帝国观察军官等职。1928年出任诺尔博滕团团长，1934年任北方军区旅长，1935年晋升少将，1937年任第二军区司令，1940年晋升中将并出任陆军总监直至1944年。他同时是瑞典体育界的重要人物——1924—1934年出任国际滑雪联合会（FIS）首任主席（此后为终身名誉主席），是该组织的联合创始人之一，长期担任瑞典滑雪推广协会主席（1923—1950年），并致力于将高山滑雪引入瑞典。1954年逝世。"
 SWE_karl_kilbom_desc:0 "卡尔·希尔布姆（1885年5月8日—1961年12月24日），瑞典共产党/社会党政治家。出身乌普萨拉省铁匠之子的工人家庭。早年投身社民党，1917年加入左翼分裂组建的共产党。1929年因拒绝完全服从莫斯科路线而与弗吕格一道被共产国际开除，遂另建平行的共产党（后改名社会党），其追随者被称为“希尔布姆派”。1930年代初社会党规模一度远超莫斯科派共产党。然而1937年他与日益亲纳粹的弗吕格发生尖锐矛盾后被弗吕格开除出党，带走了大部分党员。1938年他重新加入社民党，此后在人民之家运动及工人合作社领域积极活动，支持汉森的战时联合政府。著有三卷本自传。1961年逝世。"
 SWE_king_gustaf_v_desc:0 "古斯塔夫五世（1858年6月16日，生于德罗特宁霍尔姆宫—1950年10月29日，卒于斯德哥尔摩），瑞典国王（1907—1950年在位），奥斯卡二世之长子。在位四十三年，是瑞典历史上最长寿的君主（享年九十二岁），也是最后一位实际行使过王权的瑞典国王——此后王室权力逐步象征化，至1974年新宪法正式废除。1914年他在“院落危机”中因支持加强国防而迫使自由派政府辞职，但1917年后接受了议会民主原则。二战期间他扮演了争议角色：据首相汉森记述，1941年仲夏危机中他以威胁退位为手段迫使政府同意德国恩格尔布雷希特师借道瑞典领土，并曾背着政府向希特勒发电报祝贺其侵苏“胜利”。他还曾邀请瑞典纳粹领袖林霍尔姆进入王宫。另一方面，1944年他亲自致函匈牙利摄政霍尔蒂施压停止遣送犹太人，支持了瓦伦贝格的营救行动。他同时是一位狂热的网球爱好者，以“G先生”化名参加比赛至八旬高龄。"
 SWE_lise_meitner_desc:0 "丽泽·迈特纳（1878年11月7日，生于奥地利维也纳—1968年10月27日，卒于英国剑桥），奥地利出生的物理学家，核裂变理论的关键贡献者。犹太裔，早年在维也纳大学获博士学位后赴柏林，与化学家奥托·哈恩合作三十年，在放射化学及核物理领域取得一系列重要成果。1938年纳粹德国吞并奥地利后，她因犹太血统被迫流亡瑞典，在斯德哥尔摩的诺贝尔物理研究所和皇家工学院继续研究。同年12月哈恩在柏林实验室成功实现铀裂变但无法从化学角度解释该现象，迈特纳与侄子奥托·弗里施在瑞典通过物理学理论首次正确解释了核裂变过程——这一突破为原子能的开发和原子弹的研制奠定了理论基础。然而1944年诺贝尔化学奖仅授予哈恩一人而未及迈特纳，被广泛认为是诺贝尔奖历史上最大的遗憾之一。她拒绝参与曼哈顿计划。战后她继续在瑞典工作，晚年移居英国。1968年逝世。她出生于奥地利，1938年后流亡瑞典，并在瑞典科研机构继续从事核物理研究。"
 SWE_martin_ekstrom_desc:0 "马丁·埃克斯特伦（1890年—1964年），军人出身的瑞典极右翼/亲纳粹活动家。早年从军，曾在多个国家参加军事行动或志愿服务。1930年代他活跃于瑞典极右翼政治圈，与纳粹运动有密切关联，代表了哈希姆王朝时期部分军人中的反民主倾向。战后其政治影响力消退。1964年逝世。"
 SWE_natanael_beskow_desc:0 "纳塔内尔·贝斯科夫（1865年3月10日—1953年2月20日），瑞典神学家、和平主义者、画家兼社会活动家。身兼路德宗牧师、托尔斯泰式和平主义者与视觉艺术家三重身份。倡导基督教社会主义理念，参与和平运动和社会改良事业。他的妻子埃尔莎·贝斯科夫是瑞典最著名的儿童读物插画家之一。1953年逝世。"
 SWE_nils_flyg_desc:0 "尼尔斯·斯万特·弗吕格（1891年6月9日—1943年1月9日），瑞典政治家，经历了从共产主义到亲纳粹的极端转向，是二十世纪欧洲政治极端化现象的典型案例。出身斯德哥尔摩南城工人区，1917年参与创建左翼社会民主党（后改名共产党），成为重要领导人。1929年党内分裂时他与希尔布姆一道被共产国际开除，另组社会党。1934年社会党仍保留一定左翼色彩，但在弗吕格主导下逐渐从反斯大林主义滑向反苏、反共产主义，进而在1930年代末公开转向亲纳粹德国立场。1937年他将温和派希尔布姆开除出社会党，带领残余成员明确支持希特勒。二战期间他的社会党沦为公开的亲纳粹组织。1943年1月9日弗吕格突然去世，终年五十一岁。"
 SWE_olof_thornell_desc:0 "奥洛夫·格哈德·托内尔（1877年10月19日，生于瑟德哈姆—1977年7月25日），瑞典陆军上将，二战期间首任最高统帅（1939年12月—1944年4月）。在他之前，最高统帅一职名义上由国王兼任。1897年入伍乌普兰团，后毕业于陆军参谋学院。1930年代历任步兵监察官、国防参谋长（1936年），1939年二战爆发后被任命为新设的最高统帅职务。任内他在维护瑞典武装中立的复杂博弈中采取了政治上极为谨慎（有人认为过于保守）的路线，同时因1940年接受纳粹德国颁发的德意志鹰勋章大十字而受到公开批评，被普遍视为亲德。他是一位出色的组织者，对参谋班子要求严格。1944年4月卸任，由黑尔格·荣格接任。此后他担任国王侍卫长直至古斯塔夫五世1950年去世。他本人高寿近百，1977年逝世，享年九十九岁。"
 SWE_oscar_nygren_desc:0 "奥斯卡·尼格伦，瑞典陆军上将。据瑞典军衔史料记载，他于1937年退役时晋升上将，但1939年被重新征召服役，在二战初期出任上诺尔兰及瑞典西部地区的第二军团司令，是当时与最高统帅托内尔同时在役的少数上将之一。"
 SWE_osten_unden_desc:0 "厄斯滕·翁登（1886年8月25日—1974年1月14日），瑞典社会民主党政治家兼法学家，曾两度出任外交大臣（1924—1926年、1945—1962年）。乌普萨拉大学国际法教授出身，是瑞典战后中立与不结盟外交政策的主要设计者。1946年汉森猝逝时他曾短暂代理首相直至埃兰德就任。他主导了瑞典在冷战初期拒绝加入北约、坚持独立中立路线的外交决策，同时积极参与联合国事务。1962年卸任后淡出政坛。1974年逝世。"
 SWE_per_albin_hansson_desc:0 "佩尔·阿尔宾·汉森（1885年10月28日，生于马尔默附近—1946年10月6日，卒于斯德哥尔摩），瑞典社会民主党领袖（1925年起）、首相（1932—1946年），“人民之家”（folkhemmet）福利国家模式的缔造者，被誉为现代瑞典之父。出身工人阶级家庭，几乎未受过正规教育，十几岁即投身社民党青年组织并从事新闻工作。1928年他在议会辩论中提出“人民之家”理念——国家如同一个美好的家庭，没有特权者也没有被遗弃者，人人平等互助。1932年出任首相后与农民党结盟，推行大规模反萧条公共工程、失业保险及养老金改革。二战中他主持跨党派联合政府（唯共产党除外）维持武装中立，在对德妥协（允许借道、出口铁矿石）与维护主权之间艰难平衡。1946年10月6日晚他在从歌剧院餐厅回家途中突发心脏病去世，终年六十岁。"
 SWE_per_edvin_skold_desc:0 "佩尔·埃德温·舍尔德（Per Edvin Sköld，1891—1972）是瑞典社会民主党资深政治家，代表马尔默在国会连任达46年（1918—1964）。生于斯科讷的斯韦达拉一个农民家庭，就读隆德大学。他被誉为社民党的“救火队员”，先后出任农业大臣（1932—1936、1945—1948）、商务大臣（1936—1938）、二战期间的国防大臣（1938—1945）及财政大臣（1949—1955）。任农业大臣期间，他是1933年社民党与农民党达成的“母牛交易”危机协议的关键推手，奠定了两党长期合作的基础。其子女中有陆军司令尼尔斯·舍尔德、王室典礼官佩尔·舍尔德等。1972年逝世。"
 SWE_raoul_wallenberg_desc:0 "拉乌尔·瓦伦贝格（1912年8月4日，生于斯德哥尔摩附近利丁厄—失踪后被宣告死亡），瑞典外交官，二十世纪最著名的人道主义英雄之一。出身瑞典最显赫的瓦伦贝格银行家族。早年在美国密歇根大学学习建筑学，后因家族安排转向商业，在南非及海法从事贸易。1944年7月他受瑞典政府及美国战争难民委员会委派，以瑞典驻布达佩斯使馆一秘身份前往匈牙利，利用外交豁免权大规模签发瑞典“保护护照”，建立数十处“瑞典之家”庇护所，以惊人的个人勇气——多次当面对抗纳粹官员甚至闯入火车站从遣送列车上抢人——营救了数万名匈牙利犹太人免于被送往奥斯维辛灭绝。1945年1月苏军攻入布达佩斯后，瓦伦贝格被苏联军方带走，此后杳无音讯。苏方后称他于1947年死于卢比扬卡监狱，但其命运至今仍是历史悬案。瑞典于2016年正式宣告其死亡。"
 SWE_rickard_sandler_desc:0 "里卡德·桑德勒（1884年1月11日—1964年10月12日），瑞典社会民主党政治家，曾任首相（1925—1926年短暂在任）及外交大臣（1932—1939年）。在汉森内阁中长期主管外交事务，1939年冬季战争爆发后，他主张瑞典对芬兰提供更积极的军事援助——这一立场与政府的严格中立政策冲突，导致他于1939年12月被迫辞去外交大臣职务，由无党派的克里斯蒂安·云特接替。此后他虽仍活跃于社民党内部，但未再担任核心政府职务。1964年逝世。"
 SWE_sven_hedin_desc:0 "斯文·安德斯·赫丁（1865年2月19日，生于斯德哥尔摩—1952年11月26日，卒于斯德哥尔摩），瑞典著名探险家与地理学家，因在中亚及西藏的大规模考察而成名，同时因其公开的亲德、亲纳粹政治立场而备受争议。1890年代至1930年代他先后四次深入中亚腹地探险，发现了楼兰古城、绘制了塔里木盆地及喜马拉雅山脉的详细地图。在政治上，他从一战起即坚定亲德，二战期间更公开为纳粹德国辩护，多次访问德国并会见希特勒及纳粹高层。他甚至在1942年古斯塔夫五世生日宴会上发表亲纳粹演说，令瑞典政界尴尬。他的政治立场使他在战后遭到瑞典社会的广泛唾弃。1952年逝世。"
 SWE_sven_linderot_desc:0 "斯文·哈拉尔德·林德罗特（1889年10月8日，生于东约特兰省谢德维—1956年4月7日），瑞典共产党（莫斯科派）领袖。原姓拉尔松，1918年改姓林德罗特。1914年加入社民党，1917年左翼分裂时加入左翼社会民主党（即后来的瑞典共产党）。1921年赴莫斯科为共产国际工作。1929年瑞典共产党发生决定性分裂时，他与胡戈·西伦一道站在共产国际一边，将占党员多数的希尔布姆-弗吕格派开除出党。此后林德罗特接替被开除的弗吕格出任党主席（1929—1951年），在其领导下共产党虽规模不大但始终忠实追随莫斯科路线，二战期间坚持反法西斯统一战线立场。战后因冷战中瑞典共产党的亲苏立场遭到社会排斥，1951年他本人亦在党内权力斗争中被替代。1956年逝世。"
 SWE_sven_olov_lindholm_desc:0 "斯文·奥洛夫·林霍尔姆（1903年2月8日—1998年4月26日），瑞典国家社会主义运动的头号领袖。1933年1月他脱离比里耶·富鲁戈德的纳粹组织，自行创建国家社会主义工人党（NSAP），后改名“瑞典社会主义联盟”（SSS），公然模仿纳粹德国的组织形式与意识形态，包括反犹太主义与种族理论。他曾被古斯塔夫五世国王邀入王宫。其组织虽在瑞典选举中从未获得重大突破，但在1930—1940年代初对瑞典政治光谱构成了不容忽视的极端侧翼。战后他逐渐退出政治活动。值得注意的是，晚年（1970—1980年代）他公开否定了自己此前的反犹立场，承认纳粹大屠杀的真实性并称其为犯罪，转而支持左翼和平运动。1998年逝世。"
 SWE_tage_erlander_desc:0 "塔格·弗里乔夫·埃兰德（1901年6月13日—1985年6月21日），瑞典社会民主党人，1946年汉森猝逝后出任首相，执政长达二十三年（1946—1969年），是瑞典历史上任期最长的首相。出身贫寒，在隆德大学受教育后投身政治，1932年当选议员。1944年入阁任不管部大臣，1945年转任教育大臣。1946年汉森去世后意外当选党魁及首相（由外交大臣翁登代理首相至他就任）。在任期间他主导了“瑞典模式”福利国家的全面扩展——全民医保、九年义务教育、养老制度改革及大规模公共住房建设，同时在冷战中推行不结盟中立政策。以务实温和、自嘲幽默的政治风格著称。1969年主动让位于奥洛夫·帕尔梅。1985年逝世。"
 SWE_thorwald_bergquist_desc:0 "托瓦尔特·博格奎斯特（1899年12月1日，生于耶夫尔堡省内韦尔舍—1972年12月3日），瑞典人民党（自由派）政治家。法学出身，1931年起在瑞典法院系统任职，同年出任议会第二议庭秘书。1933年起出任韦斯特罗斯市长。此后进入国家政治舞台，在联合政府及人民党内担任要职，是瑞典“1945年一代”知识分子中兼具理性主义文化观及经历过一战世代烙印的代表人物之一。1972年逝世。"
 SWE_torsten_friis_desc:0 "托尔斯滕·弗里斯，瑞典空军将领，诺登许尔德的前任。在瑞典空军独立初期担任首任空军总监（约1926—1931年），为空军独立建制奠定了组织基础。1942年最高统帅托内尔曾力劝已退休的弗里斯继续留任。"
 SWE_ture_nerman_desc:0 "图勒·内尔曼（Ture Nerman，1886—1969）是瑞典诗人、记者兼反纳粹左翼活动家，素食者与禁酒主义者。1917年参与社民党左翼分裂，此后投身共产主义运动，曾赴革命后的俄国，1931—1937年任国会第一院议员。因反对尼尔斯·弗吕格将党转向亲纳粹，他于1939年重新加入社民党。同年秋创办并主编反纳粹周报《纵然如此》，刊名取自李卜克内西遇害前所写的“Trotz alledem!”，以尖锐笔触抨击纳粹暴行及瑞典允许德军过境的做法，1942年发行量峰值达约六万六千份；他因反希特勒言论于1939年冬被判监禁三个月，报纸也屡遭查禁。他还是受尊重的诗人与译者。1946—1953年再任国会议员。1969年逝世。"
 SWE_zeth_hoglund_desc:0 "塞特·赫格隆德（1884年11月29日—1956年8月13日），瑞典早期左翼社会主义及共产主义运动元老。1917年他是社民党左翼分裂的领导者之一，与希尔布姆、弗吕格等人一道创建左翼社会民主党（后改名共产党），成为该党首任主要领导人之一。然而1924年他因与共产国际产生路线分歧而率一批追随者退出共产党，另组独立共产党，不久后即回归社民党。此后他在社民党内重新获得地位，当选议员并长期活跃于工运与新闻出版领域。他的政治轨迹——从社民党分裂到共产党、又从共产党回归社民党——是瑞典左翼运动反复分裂与重组的缩影。1956年逝世。"
 SWI_adolf_brunner_desc:0 "阿道夫·布伦纳（1901年6月25日—1992年2月15日），苏黎世人，瑞士作曲家、教会音乐家、记者、哲学家与人文主义者，对瑞士冷战时期的政治与文化生活影响深远。对社会中弥漫的冷漠感到不安，他投身圣哥达同盟，先在州一级、1942年起在全国层面出任该同盟执行主席，协助会长特奥菲尔·施波里分担事务。在同盟内他重启了此前于1936年受挫的老年及遗属保险（AHV）立法倡议，由同盟出资完成的前期研究获得各党派认可，最终促成该制度于1947年经公投通过设立。1948年底他受邀筹建苏黎世电台的政治时事部门，主持长达十二年，创办至今仍是瑞士最受欢迎广播节目之一的《时代回声》，秉持客观全面报道、为宪法框架内各政治派别提供平等发声空间的理念。1950年他以邀请合唱指挥参观排练为名获得签证进入民主德国，走访柏林、莱比锡、蔡茨、茨维考等地，将与当地民众及统一社会党官员交流的观感、以及与马歇尔计划扶持下西德重建的对比写成多篇广播报道。作为作曲家及教会音乐改革者，他被认为是二十世纪瑞士归正宗教会音乐最重要的革新者之一。1992年在塔尔维尔逝世。"
 SWI_adolf_furrer_desc:0 "其一为阿道夫·富雷尔（1873—1958），瑞士著名兵器设计师，联邦兵工厂工程师，主持研制富雷尔系列步枪及1925式轻机枪等制式装备，对两战间瑞士军队制式武器现代化贡献显著。其二为阿道夫·富雷尔（1897年12月9日—1978年2月10日），索洛图恩州德伦丁根人，师范学校毕业，1918—1933年任格伦兴小学教师，1933年起任格伦兴市镇长直至1960年，1935—1963年代表社会民主党任联邦国民院议员。"
 SWI_albert_meyer_desc:0 "阿尔贝特·迈耶（1870年3月13日—1953年10月22日），苏黎世州自由激进党籍联邦委员，曾任《新苏黎世报》主编。1897年获博士学位后短暂任苏黎世市财政秘书，同年转入《新苏黎世报》编辑部，主管商业版，1915年起任总编辑直至1930年。1907—1927年任苏黎世市议会议员，1915年当选国民院议员，1923—1929年任自由激进党全国主席。1929年12月经四轮投票当选联邦委员，1930年起先主管内政部门，1934年转任财政关税部门。作为财政部长，他反对瑞士法郎贬值，但在1936年联邦委员会多数决定下（其本人时任联邦主席）被迫接受贬值。他致力于推动联邦财政的长期性改革，但最终只促成了一项临时性方案，1938年底卸任联邦委员。此后淡出政坛，1953年在苏黎世逝世。"
 SWI_august_lindt_desc:0 "奥古斯特·鲁道夫·林特（1905年8月5日—2000年4月14日），伯尔尼人，药剂师兼巧克力制造商之子（林特巧克力家族近亲），瑞士律师、记者与外交官。伯尔尼及日内瓦大学攻读法律，1927年获博士学位。1929—1940年从事银行职员及驻外记者工作。1940年他与汉斯·豪萨曼、马克斯·魏贝尔等人共同创立军官同盟，随后又参与创建其民间后继组织全国抵抗行动，坚决反对任何向纳粹德国妥协迁就的倾向。1941—1945年任军队与家园宣传处新闻处处长。1945—1946年任红十字国际委员会驻柏林特别使团代表。1946年11月起转入联邦政治部，先任驻伯尔尼新闻发言人，后任驻伦敦使馆参赞。1952年主持联合国儿童基金会执行委员会，1953年主持国际鸦片会议。1953—1956年任瑞士常驻联合国观察员（1955年起升任全权公使）。1956年主持瑞士出席国际原子能机构章程会议代表团。1956—1960年出任联合国难民事务高级专员（继任第二任高专），任内主导应对匈牙利十月事件、阿尔及利亚战争等难民危机，推动难民署职能从欧洲扩展至全球。此后历任瑞士驻美国（1960—1962年）、苏联（1966—1969年）大使。1968—1969年受瑞士政府委派代表红十字国际委员会主持尼日利亚—比夫拉内战救援行动，后因与尼日利亚政府关系恶化遭驱逐。此后再任驻蒙古、印度、尼泊尔大使，1973—1975年任卢旺达总统顾问。1987年仍在瑞士参与反对收紧庇护法的公民运动。2000年在伯尔尼逝世。"
 SWI_benno_schaeppi_desc:0 "本诺·海因里希·舍皮（1911年11月24日—1988年8月26日），圣加仑出生，自幼父母双亡、在教养院长大，阵线运动核心骨干及武装党卫队军官。1932年在苏黎世完成商校学业。1936—1938年任国民阵线全国宣传部长兼沙夫豪森阵线派报纸《边境信使报》编辑。1938年与阿尔弗雷德·灿德尔共同创立更极端的亲纳粹团体忠诚邦联联盟，此后多次被捕。1939年因替德国从事经济与政治情报活动被判监禁四个月。1941年起为大德意志瑞士人联盟骨干成员，同年3月加入武装党卫队并被派往东线，1942—1944年主持斯图加特的瑞士志愿者接待站全景之家，1944年在巴特特尔茨党卫队军官学校完成军官培训，同年10月晋升党卫队少尉，指挥第三日耳曼党卫装甲军的宣传连。战争结束后被美军俘虏两年，经非纳粹化审查于1947年获释，同年主动向瑞士当局自首，在卢塞恩联邦刑事法院受审，与里德韦格同案，因危害邦联独立、泄露军事机密及为外国从事兵役被判处十六年徒刑，经两次复审后于1956年提前获释并被遣送至联邦德国，1955年已取得德国国籍。此后任驻巴黎记者及出版社代表，1988年在埃克恩弗尔德逝世。"
 SWI_carl_jacob_burckhardt_desc:0 "卡尔·雅各布·布尔克哈特（1891年9月10日—1974年3月3日），巴塞尔望族出身，法学家之子，历史学者、散文家、外交官。1918年获历史学博士学位，1918—1922年任瑞士驻维也纳使馆随员，期间与作家胡戈·冯·霍夫曼斯塔尔结为至交。1929年任苏黎世大学历史学教授，1932年起兼任日内瓦国际问题高等研究院教授。1923年他首次代表红十字国际委员会赴土耳其探视希腊战俘，1933年成为该委员会委员，1935、1936年曾以此身份视察德国境内的集中营。1937年2月经国际联盟任命，出任受《凡尔赛条约》约束、处于国联监管下的但泽自由市高级专员，任内周旋于纳粹化已基本完成的但泽当局与国联之间，1939年8月11日曾亲赴上萨尔茨堡与希特勒会晤，试图为危局寻求和平出路，未能阻止战争爆发。1941年他出任红十字国际委员会与红十字会联盟联合救济委员会主席，同年12月赴英国经济作战部谈判，为红十字会争取到部分放宽海上封锁、便利战俘及平民救济物资运送的安排。1944年12月他当选红十字国际委员会主席（1945年1月起就任），同时兼任瑞士驻巴黎公使（1945—1949年）。他延续了委员会一贯的审慎路线，未就纳粹种族屠杀发表公开谴责，仅限于依循传统方式提供有限援助，这一立场后来成为历史学界持续检视与批评的焦点。1948年卸任红十字国际委员会主席。1974年在沃州万泽尔逝世。"
 SWI_carl_stucki_desc:0 "卡尔（全名卡尔·特奥多尔）·斯图基，又作查尔斯·斯图基（1889年4月24日—1963年2月8日），圣加仑州盖泽瓦尔德人，父系归属伯尔尼州奥腾巴赫（今属林登镇），瑞士外交官，曾任日耳曼语文学者，人称小斯图基以区别于同姓同事沃尔特·斯图基（大斯图基）。他在圣加仑读中学后，赴慕尼黑、柏林及苏黎世大学攻读日耳曼语文学，1914年接替其博士导师担任《瑞士德语词典》编辑，后因一战期间兵役及经费削减被迫于1919年离职。此后受出版社委托编写瑞士德语语法教材，1921年出版，是同类著作中的开创之作。1919年他转入联邦政治部任职，初在新闻处工作，1925—1926年任驻维也纳使馆秘书，1928年起任礼宾司司长兼领事事务负责人，1929年升二等处长，1933年升一等处长，1935年起兼任人事负责人。1942年出任外事司副司长，兼任政治处处长。1946年出任瑞士驻希腊公使，直至1954年底退休。1955年一度被召回，赴朝鲜半岛短期出任中立国监察委员会代理主席，监督朝鲜战争停战协议执行。1959年受托整理有关瑞士二十世纪对外关系（尤其对美关系）的机密文献汇编。1963年在伯尔尼逝世。"
 SWI_christian_gasser_desc:0 "克里斯蒂安·加塞尔应为1940年瑞士反纳粹公民抵抗组织圣哥达同盟的创始签署人之一，代表自由派团体非受援者联盟参与联署丹尼斯·德·鲁热蒙执笔的1940年7月22日《告瑞士人民书》，与他共同署名的还有沃尔特·阿尔格韦尔、罗伯特·艾贝尔等人，该同盟旨在对抗战败气氛与纳粹宣传、捍卫瑞士联邦制及独立传统。"
 SWI_clara_thalmann_desc:0 "克拉拉·塔尔曼，巴塞尔工人家庭出身，瑞士无政府主义者与西班牙内战参战者。她早年加入瑞士共产党，后因同情托洛茨基的左翼反对派及倾向西班牙无政府工团主义而于1929年与其伴侣保罗·塔尔曼一同被开除党籍，转而投身共产党反对派运动。1932年起任沙夫豪森《工人报》编辑。1936年夏，她作为工人游泳俱乐部代表前往巴塞罗那参加为抗议柏林奥运会而举办的人民奥林匹克，因西班牙内战爆发赛事取消，她随即投身街垒战斗，后加入杜鲁蒂纵队赴阿拉贡前线作战，是该纵队中为数不多的外籍女性战斗员之一。1937年5月巴塞罗那五月事件中，她与马统工党（POUM）民兵一同卷入巷战，据记载曾与在场的英国作家乔治·奥威尔同处一个屋顶据点。事件后她与丈夫一度试图乘船逃离西班牙，被西班牙共产党方面逮捕关押，经国际社会主义工人联盟斡旋后获释，转赴法国。二战期间她在法国参与地下抵抗活动，协助隐藏犹太难民及地下革命者。战后移居尼斯附近，1987年在当地逝世。"
 SWI_eduard_von_steiger_desc:0 "爱德华·冯·施泰格尔（1881年7月2日—1962年2月10日），伯尔尼世家出身，农民、工商、公民党籍联邦委员，律师。1940年12月当选联邦委员，1941年起主管司法警察部门直至1951年，两次出任联邦主席（1945、1951年）。任内他主导瑞士战时的国家安全与难民政策，对犹太难民等群体持限制性立场。1942年8月13日，联邦委员会决定关闭边境，规定仅因种族原因而寻求庇护者一律不予接纳，此决定作出时瑞士当局已获悉纳粹在东欧对犹太人的系统性屠杀；同年8月30日，他在苏黎世-厄利孔向新教青年团体青年教会发表演讲，以救生艇作比喻为该政策辩护，称指挥一艘已严重超载、给养有限的小艇者，即便无法救起海难中呼救的所有人，也仍不失人道，这番讲话后来被概括为救生艇已满一语，成为瑞士战时难民政策最具争议的象征。该政策在其任内曾几度松紧调整，并非始终如一，但历史学界普遍认为其造成了本可避免的悲剧。1951年底卸任联邦委员，1962年在伯尔尼逝世。"
 SWI_enrico_celio_desc:0 "恩里科·切利奥（1889年6月19日—1980年2月23日），提契诺意语区天主教保守派政治家，记者与律师出身，曾任《人民与自由报》主编。1913年起长期任提契诺州大议会议员，1932年进入州政府主管教育与警察部门。1940年2月22日当选联邦委员，接替去世的莫塔，主管邮电铁路部门直至1950年，两次出任联邦主席（1943、1948年）。他在任内以推动民用航空事业发展见长，战后瑞士民航业迅速起步与其任内的政策支持有关。作为继莫塔之后第二位来自提契诺的联邦委员，他在战时也承担了维系瑞士意大利语区与联邦整体认同的象征角色，尤其是在瑞士毗邻的意大利陷入法西斯统治、局势敏感的年代。政治上的挫折曾使他一度感到党内及新闻界支持不足。1950年10月辞去联邦委员职务后出任瑞士驻罗马公使，1955年卸任，此后退出公职，1980年在卢加诺逝世。"
 SWI_ernest_beuin_desc:0 "埃内斯特·贝甘（1879年2月6日—1966年4月18日），纳沙泰尔人，律师出身，瑞士自由激进党资深政治家。纳沙泰尔、巴塞尔及巴黎攻读法律，1904年获律师资格，1905年即出任纳沙泰尔州民事法庭庭长。1907—1916年任纳沙泰尔州大议会议员，1909—1918年任纳沙泰尔市议会议员并兼任该州检察官。1918—1942年任纳沙泰尔州政府委员，主管司法警察部门，任内推动多项立法改革，包括1922年《反不正当竞争法》、1925年司法体系改革及1927年州警察法。1912—1939年任联邦院（参议院）议员，1935年出任联邦院议长。1934—1940年出任瑞士自由激进党全国主席。1920年起兼任《新苏黎世报》驻纳沙泰尔通讯员。退休后主持纳沙泰尔归正会教务评议会。1966年在纳沙泰尔逝世。"
 SWI_ernst_laur_desc:0 "恩斯特·费迪南德·劳尔（1871年3月27日—1964年5月30日），巴塞尔人，医院管理者之子，成长于虔诚宗教家庭。1886年入苏黎世施特里克霍夫农业学校，1888年获文凭，此后在法国及莱茵瑙精神病院庄园实习，1890年起入苏黎世联邦理工学院攻读农学，1893年以全年级仅两名瑞士学生之一的身份获农艺工程师文凭。1896年在莱比锡大学获哲学博士学位。1898年出任新设立的瑞士农民秘书处首任负责人，同时兼任1897年成立的瑞士农民协会总干事，后升任会长（总干事职务后改称主任），两职均任至1939年，长达四十余年，是两战间瑞士公共生活中最具影响力的人物之一，人称农民博士。1901年起在联邦理工学院兼任农业政策编外讲师，1908—1937年任农业经营学正教授。他主导创立瑞士农民协会的统计与会计调查体系，为该协会的政策游说提供数据支撑，并著有多部被译为多种语言的农业经营学教科书，在两战间东欧新独立国家中亦被奉为对抗大地产制、扶植自耕农经济的典范。他是瑞士即农民这一民族保守主义农本意识形态的主要鼓吹者，将其与精神国防运动相勾连，主张通过统购统销及保护性关税维护农民阶层生存空间，同时以农场账簿等经营现代化手段推动农业向企业化转型。1904—1945年任联邦委员会贸易协定谈判代表，直接参与制定瑞士关税政策。1937年因严重事故辞去教授职务，1939年辞去秘书处职务，迁居阿尔高州埃芬根。1948—1950年任新成立的欧洲农业联盟首任主席。1964年在埃芬根逝世。"
 SWI_ernst_nobs_desc:0 "恩斯特·诺布斯（1886年7月14日—1957年3月15日），伯尔尼农家出身，长期在苏黎世担任社民党报纸《人民权利报》编辑，一战末期属于党内左翼，曾因发表颠覆性言论被军事法庭判处监禁四周，并卷入1918年全国大罢工的领导层。此后他的立场逐渐转向温和改良主义，接受国防政策，与阶级斗争路线保持距离。1935年起任苏黎世州政府委员，1942年出任苏黎世市长。1943年在《赫尔维蒂革新》一文中阐述了将瑞士建成社会民主国家的构想。同年12月15日，他当选联邦委员，成为社会民主党历史上第一位联邦委员，主管财政关税部门直至1951年，1949年出任联邦主席。任内他致力于推动联邦财政改革，但该方案在1950年遭到议会及舆论反对而搁浅。尽管已是联邦委员，联邦国家安全机构仍对他保持监控档案，记录持续至1948年。1951年底卸任，1957年在梅伦逝世。"
 SWI_ernst_wetter_desc:0 "恩斯特·韦特尔（1877年8月27日—1963年8月10日），苏黎世州自由激进党籍联邦委员，经济学者出身，曾任苏黎世大学教授并长期在联邦经济部门与工商促进机构任职。1938年12月当选联邦委员，接替阿尔贝特·迈耶主管财政关税部门直至1943年底，1941年出任联邦主席。任内他对军方频繁的经费需求及对德国的清算贷款持谨慎态度，但1943年仍在联邦委员会一致决定下同意瑞士国家银行购入德国黄金（部分为纳粹掠夺所得）。他主张对新闻界采取更大程度的克制，并在皮莱-戈拉与阵线运动代表团接触一事上有所斡旋。1941年联邦主席任内，他在瑞士建国650周年纪念活动上呼吁国民团结坚持。1943年底卸任联邦委员后重返商界，曾任瑞士人寿保险公司及瑞士铝业公司董事长等职，1963年在苏黎世逝世。"
 SWI_etienne_primault_desc:0 "艾蒂安·普里莫（1904年5月5日—1984年11月30日），伯尔尼州科尔莫雷人，钟表匠兼酒店业主之子，纳沙泰尔大学政治学专业出身，曾任联邦航空局及瑞士航空俱乐部秘书。1930年转入军旅，在空军及防空部队任教官军官兼军事飞行员，二战期间（1930—1944年）他的身份主要是教官与飞行员，而非空军最高指挥官——二战时期空军及防空部队的实际指挥官先后是汉斯·班迪（1936—1943年在任）与弗里茨·里纳（1944—1952年在任）。1945—1952年他升任科长，1946年晋上校，1953年晋师长，同年起出任空军及防空部队总指挥（武器长）直至1964年，由此成为战后瑞士空军现代化及幻影战斗机采购的主要负责人，曾在1957年国防委员会秘密会议上公开谈及以幻影携带核武器打击苏联纵深的设想，反映出当时瑞士军方曾认真考虑发展核打击能力。1964年幻影项目严重超支引发丑闻（幻影事件），他因此被解职，后经联邦法院查明其个人无过错。1984年在苏黎世逝世。"
 SWI_eugen_bircher_desc:0 "欧根·比歇尔（1882年2月17日—1956年10月20日），阿尔高州阿劳人，外科医生、军官与政治人物。他在巴塞尔及海德堡攻读医学，1915—1916年赴保加利亚战地医院积累战地外科经验，1917—1934年任阿劳州立医院外科主任、1932年起兼任院长，以甲状腺、胃部、膝关节及战伤外科研究知名，被公认为膝关节镜检术的创始人之一。1919年他创立带有准军事及秘密社团性质、与境外法西斯团体有联系的瑞士祖国联盟，并借助1931—1937年出任瑞士军官协会主席及1934—1942年主编官方军事报纸的身份，使该联盟在军官阶层中颇具影响力。1934年晋升少将，1934—1942年先后指挥第4、第5师，与联邦委员鲁道夫·明格尔同为两战间推动瑞士扩军备战的主要倡导者，与皮莱-戈拉、莫塔、冯·施泰格尔、埃特、斯坦普夫利、韦特尔等联邦委员私交密切。他寻求瑞士与纳粹德国建立紧密关系，苏德战争爆发后，他与瑞士驻柏林公使弗勒利歇尔合作，借瑞士红十字会名义于1941—1943年间组织四批瑞士志愿医疗队奔赴德军东线战场救治伤员，行动经费主要来自瑞士大企业私人捐款，他本人曾多次随队亲赴前线；参与人员事后发现在不知情下已被置于德国军事管辖之下，部分医疗队成员还目击了德军对平民及战俘的暴行。1942年他当选国民院议员，同年在议会公开反对接纳犹太难民。1956年在阿劳逝世。"
 SWI_franz_riedweg_desc:0 "弗朗茨·里德韦格（1907年4月10日—2005年1月22日），卢塞恩富裕酒店业主家庭出身，医学博士，二战期间武装党卫队中军阶最高的瑞士人。他在伯尔尼、罗斯托克与柏林学医，1933—1935年间参加国民阵线，1936—1937年任前联邦委员让-马里·穆西的秘书及反共产主义行动顾问，1937—1938年参与制作反共宣传片《红色瘟疫》。1938年迁居德国并加入党卫队，同年迎娶德国陆军元帅维尔纳·冯·布隆贝格之女西比勒，借此深度融入纳粹精英圈层与普鲁士贵族网络，晋升至党卫队一级突击队大队长，是二战期间军阶最高的瑞士籍党卫队成员。他以军医身份随党卫队阿道夫·希特勒警卫旗队参加波兰战役及法国战役，1941年在柏林党卫队总部创建日耳曼总局，负责招募欧洲日耳曼血统志愿者加入武装党卫队，并在斯图加特设立全景之家作为瑞士志愿者接待站。1944年他被调往东线担任军医。1945年被美军俘虏，后转由英军拘押至1948年。1947年12月瑞士联邦刑事法院缺席判处其十六年徒刑，罪名为叛国，但瑞士政府始终未提出引渡请求。他此后终生未再返回瑞士，定居慕尼黑行医至2005年去世，始终未对其纳粹历史表示悔意。"
 SWI_friedrich_wahlen_desc:0 "弗里德里希·特劳戈特·瓦伦（1899年4月10日—1985年11月7日），伯尔尼州埃门塔尔地区人，农学家，苏黎世联邦理工学院博士，曾在加拿大从事农业研究多年。1929年起任苏黎世-厄利孔农业试验站站长，1943年起兼任联邦理工学院植物栽培学教授。1938—1945年任联邦战时粮食局农业生产处处长，是瑞士二战时期耕作运动的主要设计者与执行者，通过大规模扩大耕地面积、动员城市空地及公园种植粮食作物，推动瑞士粮食自给率大幅提升，成为战时瑞士家喻户晓的公众人物。战后他先后在联合国粮农组织任职，1958—1959年任副总干事。1958年底当选联邦委员，1959年起先后主管司法警察、经济、政治（外交）等部门，1961年出任联邦主席，任内推动欧洲自由贸易联盟的建立及瑞士对第三世界的技术援助。1965年卸任联邦委员，此后主持联邦宪法全面修订筹备工作，1985年在伯尔尼逝世。"
 SWI_fritz_platten_desc:0 "弗里茨·普拉滕（1883年7月8日—1942年4月22日），圣加仑人，瑞士共产主义运动的核心创建者之一，锁匠出身，青年时期曾参与1906年里加的第一次俄国革命并被监禁，后逃回瑞士。他长期活跃于苏黎世工人运动，1917年最广为人知的事迹是组织流亡瑞士的列宁经德国乘封闭列车返回俄国，促成其参与随后爆发的十月革命；他本人也随行至俄国，并于1918年1月列宁遇刺未遂事件中因用身体护住列宁而负伤。1918年他是瑞士全国大罢工的组织者之一。1919年他在莫斯科参与共产国际的创建，是主席团成员之一。1921年他成为瑞士共产党创党成员，曾短暂出任国民院议员。1923年移居苏联，在当地建立农业合作社，后于莫斯科外语学院任教。1927年他因同情苏共党内反对派而受到猜忌，此后被边缘化。1938年在大清洗中被捕，1939年被判处四年劳改，监禁于阿尔汉格尔斯克附近的劳改营，1942年4月22日（列宁诞辰纪念日）被处决。1956年苏联为其平反。"
 SWI_georg_von_trapp_desc:0 "格奥尔格·约翰内斯·冯·特拉普（1880年4月4日—1947年5月30日），生于达尔马提亚海岸城市扎拉（今克罗地亚扎达尔），奥匈帝国海军军官之子，是电影《音乐之声》中特拉普上校的原型人物，其真实生平与瑞士并无史实关联。他就读于阜姆（今里耶卡）海军学院，1900年参与镇压义和团运动期间因表现获勋，1908年转入新组建的奥匈潜艇部队。一战期间，他先后指挥U-5、U-14两艘潜艇在亚得里亚海及地中海执行多次战斗巡航，击沉包括法国装甲巡洋舰莱昂·甘必大号在内的两艘军舰及十一艘协约国商船，总吨位逾四万七千吨，是奥匈帝国海军史上战绩最卓著的潜艇指挥官，获颁最高等级的玛丽亚·特蕾西娅军事勋章。1918年晋海军少校，战争结束前出任卡塔罗潜艇基地司令。一战后奥地利成为内陆国、不再需要海军，他随即退役。1922年发妻阿加特病逝，留下七名子女；1927年他续娶家庭教师玛丽亚·库切拉。1930年代经济大萧条中家产大部亏损，全家转而以歌唱演出维生。1938年德奥合并后，他拒绝了纳粹德国海军提供的军职，携全家出走美国，后定居佛蒙特州斯托。1947年在美国病逝。"
 SWI_giuseppe_motta_desc:0 "朱塞佩·莫塔（1871年12月29日—1940年1月23日），提契诺意语区人，天主教保守派政治家。1911年12月当选联邦委员，任职近28年直至在任上去世，是瑞士联邦委员任期第三长者。1912—1919年主管财政关税部门，1920—1940年主管政治部（相当于外交部），先后五次出任联邦主席。他是瑞士加入国际联盟的主要推动者之一，1920年协助促成加入公投通过，1924年出任国联大会主席，长期是瑞士两战间外交政策的主导者。对内他是反共产主义的坚定代表，推动瑞士在1934年反对苏联加入国联；对意大利，他倾向维持友好关系，1935年意大利入侵埃塞俄比亚后，瑞士仅象征性执行国联制裁，1936年瑞士率先事实承认意大利对埃塞俄比亚的吞并。对纳粹德国，他试图在维护瑞士独立与避免刺激柏林之间寻求平衡，1938年后转而重申中立原则。1940年1月在伯尔尼任上病逝。"
 SWI_hans_hausamann_desc:0 "汉斯·豪萨曼（1897年3月6日—1974年12月17日），阿彭策尔人，摄影师之子，私营情报机构哈氏办公室（BüroHa）创办人。一战期间任中尉，战后成为激进的反左翼人士，积极倡导加强国防。1925年创办哈萨曼摄影公司，在圣加仑及苏黎世设分店及冲印实验室，并开创瑞士首个邮购业务，借此建立起服务于新闻界的资讯网络。他曾任军队教学电影处负责人，1936年前任瑞士军官协会新闻处处长，并主持了1935年成功促成延长兵役期公投的宣传运动。对纳粹德国，他起初一度抱有好感，后转为坚决反对。1936年总参谋部派其赴柏林普鲁士军事学院受训。1935年起他将原有的新闻服务逐渐转向军事情报搜集，1939年9月在阿彭策尔州托伊芬正式建立哈氏办公室（伪装为剪报社），战时该机构隶属于情报处处长罗杰·马松麾下，同时豪萨曼本人也与国防部长卡尔·科贝尔特及吉桑将军保持越级直接联系。1939年起，鲁道夫·勒斯勒经其助手转达情报，成为该机构最重要的情报来源之一。1938年起任社民党国防政策顾问。1940年他是军官同盟核心成员之一，该团体主张即便联邦政府投降也要继续抵抗德军入侵，后遭吉桑将军解散并施以纪律处分；同年他又参与创建其民间后继组织全国抵抗行动。1946年哈氏办公室解散后，他重返本行经营摄影企业，并在圣加伦高等商业学校讲授二战军事史，1973年获该校名誉博士。1974年在奥尔塞利纳逝世。"
 SWI_hans_oehler_desc:0 "汉斯·厄勒（1888年12月18日—1967年1月7日），阿尔高州维尔德埃格人，哲学博士，记者与出版人，瑞士两战间亲德右翼舆论的重要塑造者。他在慕尼黑、格勒诺布尔、莱比锡、柏林及苏黎世攻读哲学、历史及艺术文学史，1913年获博士学位。1918—1920年在周刊《自由之言》上反对《凡尔赛条约》体系及国际联盟。1921年他参与创立并主编《瑞士政治文化月刊》，该刊自创刊起即走亲德路线，是反对国联的瑞士独立人民同盟的机关刊物。1923年他在苏黎世与来访的希特勒有过一面之缘。1929—1930年，他在厄勒俱乐部聚集了一批对现状不满的学院青年，这批人后来发展为新阵线运动的雏形，他本人虽是苏黎世民主党成员，仍于1931年加入新阵线。1932年成为国民阵线创始成员之一。因其刊物日益沦为阵线运动的理论喉舌，1934年被刊物董事会解职，同年另办《瑞士民族小册》与原刊竞争，内容延续亲纳粹立场并试图规避明文禁令，该刊直至1946年停刊。1940年他参与慕尼黑召集瑞士各亲纳粹派系领袖的会议。1947年联邦法院以叛国罪判处其两年徒刑。战后他仍活跃于极右翼刊物，1967年在迪尔斯多夫逝世。"
 SWI_hans_oprecht_desc:0 "汉斯·奥普雷希特（1894年7月19日—1978年6月21日），苏黎世社会民主党籍工会与政界领袖，曾任小学教师，1918年获苏黎世大学法学博士学位。1921—1931年任瑞士市政与国家雇员联合会（后更名公共服务人员联合会VPOD）主席，此后长期担任该会总书记直至1946年，同时1928—1946年任瑞士工会联合会执行委员。1925年当选国民院议员，连任至1963年。1933年参与创办跨党派反法西斯刊物《民族报》。1936年，在围绕军费信贷问题的党内路线之争后，他接替因此下台的伯尔尼派领导层，当选社民党主席直至1952年，主导该党在二战期间及战后融入瑞士协商民主体制的进程。1940年他参与创立全国抵抗行动组织。战时及战后他积极参与营救难民及流亡文化人士的工作。1951年诺布斯辞任联邦委员时，他曾与马克斯·韦伯竞逐党内提名，最终败给后者。1946年后他还长期担任《谷登堡藏书会》及瑞士广播电视协会主席等职，1978年在恩布拉赫逝世。"
 SWI_henri_guisan_desc:0 "亨利·吉桑（1874年10月21日—1960年4月7日），沃州梅济耶尔人，医生之子，瑞士二战期间的将军（General），这一军衔仅在战时由联邦议会推选产生，他是瑞士历史上第四位、也是迄今最后一位获此军衔者。1894年投身军旅，历任炮兵、步兵及总参谋官职，1921年晋准将，1927年晋师长，1932年晋军长，达到和平时期瑞士军队的最高军衔。1939年8月30日，面对战争阴云，联邦议会以204票对21票选举他为将军，授权其捍卫国家独立与领土完整。他重视与部队及民众的直接接触，大量出巡部队、注重士气激励，与他的一战前任乌尔里希·维勒将军的疏离作风形成对比，因而在民众中享有极高声望。1940年法国败降后，他推行国家堡垒（Réduit）战略，将军队主力撤入阿尔卑斯山区，并于同年7月25日在吕特利草地召集600余名高级军官发表吕特利报告，阐明该战略并号召坚决抵抗，成为瑞士战时精神抵抗的标志性事件。他本人对墨索里尼一度心存好感，视其为反共产主义的屏障，1943年3月还曾与党卫队将领瓦尔特·舍伦贝格秘密会晤，寻求德方承诺不会入侵瑞士，这一举动战后引发一定争议。1945年8月他卸任将军。1960年逝世时，包括众多身着军装的老兵在内，三十万人为其送葬。"
 SWI_herman_obrecht_desc:0 "赫尔曼·奥布雷希特（1882年3月26日—1940年8月21日），索洛图恩州自由激进党籍联邦委员。1935年4月当选，主管经济部门直至1940年。他被称为瑞士战时经济体制的奠基人，推动1939年6月全民公投通过的《加强国防与解决失业法案》，为战时物资调配与军工生产建立法律基础，并在1940年为服役军人设计了工资补偿制度，后来成为瑞士社会保障体系的重要先声。1939年3月他在巴塞尔发表演讲，针对德国吞并奥地利后的紧张局势，以强硬措辞警告谁若侵犯我们的独立与领土完整，战争在等着他，瑞士人不会率先向外邦朝圣，这番讲话在民众中引发广泛共鸣，使他成为瑞士战时坚持独立立场的象征人物之一。同时他也长期与瑞士索洛图恩军工企业有商业关联，该企业二十年代曾向奥地利、匈牙利出口违反《圣日耳曼条约》限制的武器，这一角色与其公开的强硬爱国形象形成对照。1940年6月因健康原因辞去联邦委员职务，同年8月在伯尔尼去世。"
 SWI_jakob_huber_desc:0 "雅各布·胡贝尔（1883年11月1日—1953年3月11日），阿尔高州约嫩人，农民之子，曾在温特图尔学习化学工程，并先后在阿劳、苏黎世及法国从事化学工作，又自学测量学在突尼斯、埃及从事测量员工作。1911年转入军旅任教官军官，1913年被派往德国斯德丁的第38炮兵团见习。此后历任师参谋长、旅长、军参谋长、圣莫里斯要塞司令等职，1937年任总参谋部后方及要塞事务处处长，年底出任副总参谋长。1939年11月他因不满时任总参谋长雅各布·拉布哈特否决其改革方案，向吉桑将军请求调职；吉桑遂将拉布哈特调任新组建的第4军军长，任命胡贝尔为代理总参谋长，1940年3月23日转为正式任命，一直任职至1945年。他与性情外向、善于交际的吉桑形成互补，以沉默寡言、深谋远虑著称，被公认为二战期间仅次于吉桑本人的最重要瑞士军事人物。1940年底晋升为军长（联邦级最高军衔之一）。1953年在布里恩茨逝世。"
 SWI_jakob_labhart_desc:0 "雅各布·拉布哈特（1881年1月28日—1949年8月6日），图尔高州施特克博恩人，曾在柏林夏洛滕堡及慕尼黑高等工业学院深造，1905—1916年任炮兵教官，期间于1907—1908年赴普鲁士兰炮兵团受训，深受德式军事传统影响。此后历任军团参谋部运输科科长、团长、旅长、军参谋长等职，1936年出任总参谋长，晋升为军长。任内他一手主导瑞士秘密化学武器计划的筹建工作——该计划由联邦委员鲁道夫·明格尔于1937年2月私下下令、未告知其余联邦委员，以规避瑞士1932年已批准的《日内瓦议定书》。他因欣赏德国国防军的方法和体制而与吉桑将军产生摩擦，尤其是未被告知吉桑与法方进行的秘密总参谋部会谈。1940年初吉桑将其调离总参谋长职务，改任新组建的第4军军长（该职务他一直担任至1947年），原总参谋长一职名义上仍挂在其名下，实际总参谋工作则由胡贝尔代行。1949年在西格里斯维尔逝世。"
 SWI_jakob_schaffner_desc:0 "雅各布·沙夫纳（1875年11月14日—1944年9月23日），巴塞尔出生，巴塞尔乡村州人，幼年丧父，母亲随情人出走美国，他在巴登州博伊根的一所严苛的虔敬派孤儿院中长大，这段经历成为其代表作《约翰内斯》（1922年）的素材。少年时期学做鞋匠，此后作为帮工游历荷兰、比利时、法国等地，开始写作。1911年定居德国，先后居住柏林近郊夏洛滕堡及魏玛，以长篇小说《约翰内斯》系列确立文坛地位，并因刻意采用北德语言习惯以摆脱瑞士方言痕迹而自诩为全德意志人。他对犹太教及基督教均持强烈批判态度。1933年希特勒攫取政权后，他将其视为美好未来的开端，此后日益深陷纳粹意识形态，1936年参与瑞士国民阵线活动直至1938年，与罗尔夫·亨纳、汉斯·厄勒一同退出后曾短暂加入更极端的忠诚邦联联盟。他多次为纳粹机关刊物撰稿，1936年在柏林大学生面前演讲时，竟在讲台上摆放瑞士国旗并行纳粹举手礼致意听众，其对故国与纳粹德国的态度始终充满矛盾。1940年曾短暂回瑞士与联邦主席皮莱-戈拉私下会晤。1944年9月在斯特拉斯堡遭盟军轰炸身亡，遗体运回瑞士巴塞尔乡村州故乡布斯安葬，葬礼遭到当地民众大规模抗议。"
 SWI_jean_de_muralt_desc:0 "让·德·穆拉尔特，沃州法语区世家出身，律师，自由激进党籍国民院议员。他是1924年由日内瓦律师泰奥多尔·奥贝尔发起的国际反共产主义协约在瑞士政界的重要支持者与联络人：1931年他在联邦国民院内组织起一个反布尔什维主义议员小组，成员包括沃州议员亨利·瓦洛东、皮埃尔·罗沙等人，借此协助该跨国反共组织在瑞士议会内建立影响力。该组织与日内瓦检察机关、联邦警察负责人海因里希·罗特蒙德等保持密切的情报交流关系，并与红十字国际委员会有人员交叉。"
 SWI_johann_august_sutter_desc:0 "约翰·奥古斯特·祖特尔，生于巴登藩国坎德恩（今属德国），祖籍瑞士巴塞尔乡村州吕嫩贝格，瑞士裔美国拓荒者、加州殖民者。他早年在瑞士经商及从军，1834年因经营纺织品生意破产、面临牢狱之灾，抛下妻子及五名子女只身出走北美，化名约翰·奥古斯都·祖特尔上尉（冒充曾为拿破仑战争流亡的瑞士近卫军官）。历经辗转，1839年抵达墨西哥治下的加利福尼亚，获总督阿尔瓦拉多批准在萨克拉门托河与美利坚河交汇处定居垦殖，命名新赫尔维蒂亚（即新瑞士），并受托兼任当地治安官，负责遏制盗马及冲突。1841年建成祖特尔堡，成为加州中央谷地第一个永久性欧洲人定居点的经济中心，鼎盛时期雇用及役使大量米沃克、迈杜、尼森南等原住民部落成员及夏威夷劳工建设、维护堡垒。1848年1月24日，他雇佣的木匠詹姆斯·马歇尔在为其建造锯木厂（祖特尔磨坊）时于河床发现金屑，消息外泄后引发举世闻名的加州淘金热。淘金热非但未使祖特尔获利，反而使其事业彻底崩溃：工人纷纷弃工淘金，大批淘金者及侵占者涌入其领地，劫掠牲畜、破坏产业，美国法院其后又裁定其墨西哥时期地契无效，1852年他宣告破产。此后他移居羽毛河畔的霍克农场，1864年获加州议会批准发放养老金，1865年住宅遭纵火焚毁，1871年迁居宾夕法尼亚州利蒂茨，余生多次赴华盛顿国会请愿求偿未果，1880年在华盛顿逝世。近数十年来，史学界对其经营中的原住民奴役及殖民暴力有更多批判性反思，其历史形象已从传统意义上的开拓者英雄转变为更具争议的殖民者。"
 SWI_johannes_baumann_desc:0 "约翰内斯·鲍曼（1874年11月27日—1953年9月8日），外阿彭策尔州人，自由激进党籍联邦委员，律师出身。1905年起任州政府委员，主管军事与警察部门，曾多次出任州长；1911—1934年任州议会代表。1934年3月当选联邦委员，主管司法警察部门直至1940年，1938年出任联邦主席。他在任内积极推动为对抗纳粹主义而巩固瑞士民主团结，支持社会民主党人进入联邦委员会的主张。但其司法警察部门的外国人政策也引发争议，他任内曾容忍德国当局在护照上加盖J字戳记以标识犹太人持有者，这一做法此后被认为与其民主自由捍卫者的自我定位存在明显矛盾。1940年底卸任联邦委员，退出政坛后仍活跃于多个企业董事会及瑞士国家银行理事会，1953年在故乡赫里绍因心脏病发作逝世。"
 SWI_karl_kobelt_desc:0 "卡尔·科贝尔特（1891年8月1日—1968年1月5日），圣加仑州自由激进党籍联邦委员，土木工程师出身，曾主持联邦水利事务并任圣加仑州建设部门负责人。1940年12月当选联邦委员，1941年起主管军事部门直至1954年，两次出任联邦主席（1946、1952年）。他在二战期间的多数时间里，处于极受民众爱戴、握有战时特殊权力的吉桑将军的阴影之下，两人关系较为疏远、甚至存在猜忌，军政协调主要通过联络军官居中传递。战后他主持瑞士国防体系向机动防御军的转型，推动军队组织与装备现代化，包括1951年军备计划，但这一转型过程中他在议会与舆论中始终未能完全摆脱各方的政治与个人保留态度。1954年底卸任联邦委员，1968年在伯尔尼逝世。"
 SWI_lucien_tronchet_desc:0 "吕西安·特龙谢，瑞士无政府工团主义活动家，日内瓦工运的标志性人物。他早年当过面包学徒，后转做泥瓦工，1922年因拒服兵役被判监禁二十天，期间结识自由派无政府主义者路易·贝托尼，同年参与重建泥瓦工与力工独立工会。1926年他加入木材建筑业工人联合会（FOBB），此后长期担任该会日内瓦分会秘书，以激进的无政府工团主义手法组织罢工与抗争闻名，包括1928年泥瓦工大罢工及1935年针对贫民窟住房的直接行动。1932年11月9日日内瓦反法西斯示威遭军队开枪镇压，他的兄弟皮埃尔·特龙谢在事件中受伤。1936年西班牙内战爆发后，他与贝托尼一同前往巴塞罗那声援西班牙全国劳工联盟（CNT），此后在瑞士国内组织前进小组，向西班牙无政府工团主义者输送武器、资金与物资。1940年因拒服兵役再度被判入狱八个月。二战后他逐渐淡出无政府主义运动核心圈，1949年基于策略考虑加入日内瓦社会党，但本人始终自认为无政府工团主义者。"
 SWI_marcel_pilet_golaz_desc:0 "马塞尔·皮莱-戈拉（1889年12月31日—1958年4月11日），沃州法语区人，自由激进党籍联邦委员。1928年12月当选联邦委员，历任邮电铁路部门负责人，1940年3月接替病逝的莫塔主管政治部（外交），同年出任联邦主席。1940年6月25日，法国对德停战次日，他以联邦主席身份发表广播讲话，呼吁国民适应新形势，讲话未提及抵抗武装中立独立等惯用词语，在德语区激起强烈不满，被普遍解读为向轴心国妥协的信号，尽管讲话内容事先经全体联邦委员审阅通过。此后他被视为战时对德绥靖的象征性人物，与同年吉桑将军在吕特利草地重申抵抗意志的强硬立场形成鲜明对比。1940年秋接见鼓吹瑞士并入第三帝国的瑞士民族运动代表团，进一步招致舆论抨击。1944年因斡旋恢复瑞士与苏联外交关系失败，在压力下于当年年底辞去联邦委员职务。此后淡出政坛，1958年在洛桑逝世。"
 SWI_max_leo_keller_desc:0 "马克斯·莱奥·凯勒（1897年8月22日—1956年2月13日），苏黎世人，电气工程师，政治经济学博士，瑞士阵线运动后期最具影响力的极端亲纳粹人物之一。1918年起在瑞士与美国从事电气工程工作，1931年获博士学位，1932—1939年任伯尔尼州新兴产业推广局局长。1933年起为法西斯性质的国民阵线担任经济政策撰稿人，1938—1939年出任亲阵线的《新巴塞尔报》董事会主席。1940年法国败降后，他与同志们期待右翼势力借势崛起（所谓第二次阵线之春），同年创立瑞士民族运动（NBS），意图整合分裂的阵线各派系，该运动一度获纳粹副元首鲁道夫·赫斯支持，并要求瑞士与纳粹德国建立更紧密关系、取缔资产阶级报刊、退出国联，凯勒因此在德国被视为最具影响力的瑞士纳粹分子。1940年9月他与该运动其他领导人曾获联邦主席皮莱-戈拉正式接见。1940年11月该运动被联邦委员会取缔。1941年6月因非法活动被捕，后因证据不足获保释，同年11月出走德国，出任赫尔曼·戈林国营工厂驻柏林及魏玛的董事，1944年试图统合海外瑞士纳粹团体。战后返回瑞士，因泄露军事机密及危害瑞士独立，先后两次审判合计被判处十四年徒刑，1956年在比尔门斯多夫逝世。"
 SWI_max_petitpierre_desc:0 "马克斯·佩蒂皮耶雷（1899年2月26日—1994年3月25日），纳沙泰尔州法语区人，自由激进党籍联邦委员，法学家，曾任纳沙泰尔大学国际私法教授。1937年起进入纳沙泰尔州大议会，1942—1944年任州议会代表。1944年12月当选联邦委员，主管政治部（外交）长达十六年直至1961年，三次出任联邦主席（1950、1955、1960年）。他接任时瑞士的中立立场因战时对德关系而在盟国间声誉受损，他借助1946年恢复与苏联外交关系及签署《华盛顿协定》稳定了瑞士在战后初期的国际处境，并在冷战格局下确立了以中立与团结为核心的外交路线，主张瑞士不加入军事同盟，但通过人道主义参与、技术援助及斡旋冲突的斡旋服务体现国际团结，他反对瑞士加入联合国、欧洲委员会及欧洲经济共同体。1961年6月卸任联邦委员后，曾任红十字国际委员会委员，1994年在纳沙泰尔逝世。"
 SWI_max_waibel_desc:0 "马克斯·魏贝尔（1901年5月2日—1971年1月20日），巴塞尔商人之子，二战期间瑞士情报军官，1923年获政治学博士学位。1927年起任卢塞恩驻地教官军官，1935年调入总参谋部，1938年赴柏林军事学院受训，1939年战争爆发后返回瑞士，主持设于卢塞恩里吉的情报收集站。1940年他是军官同盟创始成员之一，曾一度与副手一同被捕，后获释，同年底晋少校。他最广为人知的事迹发生在1945年春：凭借与美国战略情报局驻伯尔尼负责人艾伦·杜勒斯的私交，他成为德军驻意大利党卫队总指挥卡尔·沃尔夫与杜勒斯之间秘密接触的关键中间人与安排者，促成双方于1945年3月8日在苏黎世首次会晤，史称日出行动。此后数月间，他多次安排、陪同双方在卢塞恩、阿斯科纳等地举行秘密会谈，最终促成德军在意大利北部于1945年4月29日签署投降书，5月2日正式停火。历史学家埃德加·邦儒尔认为，日出行动使欧洲战事提前六至八周结束，并使意大利北部丰富的文化遗产免遭德军焦土战术破坏。战后联邦委员会以其未经授权行事为由对其表示不满，并对其相关报告实施长期出版禁令。1953年他晋升师长。晚年因担任一家私人银行董事长、该行于1970年破产而深感自责，1971年1月以佩枪自尽于卢塞恩。"
 SWI_max_weber_desc:0 "马克斯·韦伯（1897年8月2日—1974年12月2日），苏黎世社会民主党籍联邦委员，财政学者与工会活动家，同时期还有一位社会学家也叫这个名字。他1919年在日内瓦大学获博士学位，同年加入社民党。1926年起任瑞士工会联合会秘书及经济事务研究员，与汉斯·奥普雷希特一同推动工会与党的政策从阶级斗争路线转向改良主义。1934年，他在党内反对声中提出凯恩斯主义色彩的危机倡议，1935年公投遭否决。1935—1940年历任建筑木业工会中央书记、主席，1940—1951年任瑞士消费合作社联合会专职主席。1948年获伯尔尼大学社会政策与合作社学编外教授职位。1951年12月接替诺布斯当选联邦委员，主管财政关税部门，任命之初因其1931年曾因拒服兵役被判监禁八天并被逐出军队而在右翼阵营引发争议。他精心筹备的联邦财政改革方案兼顾直接税与间接税的社会平衡，却在1953年12月6日的全民公投中被否决，他随即于1954年1月辞去联邦委员职务，此后重返伯尔尼大学任教，1974年在伯尔尼逝世。"
 SWI_oskar_bider_desc:0 "奥斯卡·比德（1891年7月12日—1919年7月7日），巴塞尔乡村州朗根布鲁克人，布商之子，原本立志务农，曾在阿根廷当过一年高乔牧人。1912年11月赴法国波城的布莱里奥飞行学校学习飞行，一个月后即取得瑞士第32号国际飞行员执照。1913年1月他首次飞越比利牛斯山脉，7月13日（其22岁生日次日）驾驶仅70马力的布莱里奥XI单翼机从伯尔尼起飞，在多莫多索拉中途加油后飞抵米兰，完成人类首次完整飞越阿尔卑斯山脉主脊的壮举，飞行高度达3457米，创下当时的瑞士飞行高度纪录，归国后获联邦委员会赠予金表，一举成为举国瞩目的英雄人物。一战期间他自带私人飞机编入瑞士飞行部队，1915年出任首席飞行教官，1917年破格晋升中尉。战争结束后，他转向民用航空，1919年6月21日完成一次搭载两名乘客、历时七个半小时的环瑞士飞行，并参与筹建民用航空旅游公司至星（AdAstra）。1919年7月7日凌晨，在结束通宵聚饮后，他于杜本多夫机场进行特技飞行表演时坠机身亡，年仅27岁；当天他的妹妹莱尼·比德闻讯后自尽，兄妹二人合葬于故乡朗根布鲁克。事故调查未发现飞机故障，后世研究者依据多名目击者证词及其精神状态，倾向认为这是一起蓄意的自我坠机，但官方结论迟至数十年后才逐步为人所知。"
 SWI_philip_etter_desc:0 "菲利普·埃特，楚格州天主教保守派政治家。1934年3月以43岁当选联邦委员，主管内政部长达25年直至1959年退休，四次出任联邦主席（1939、1942、1947、1953年）。他被公认为精神国防理念的主要倡导者与塑造者，借助1939年苏黎世Landi39国家博览会等场合，将强调瑞士文化独特性与民主价值的思想动员为一场全国性运动，并推动建立文化基金会瑞士文化基金会及罗曼什语被确立为第四种国家语言。1940年6月25日，他负责将皮莱-戈拉的广播讲话译为德语并朗读播出，因翻译与措辞问题也被卷入该讲话引发的争议。战时他主管新闻审查，对纳粹德国采取谨慎克制的态度，其思想中曾流露出对威权体制的某种认同，并在1933—1934年阵线之春时期的若干言论，后来被历史学界认为带有反自由主义与排犹倾向的色彩，但他本人始终反对建立法西斯式的等级国家。战后他在扩建联邦理工学院、创立瑞士国家科学基金会及推动残疾人保险（IV）方面留下重要建树。1977年在伯尔尼逝世。"
 SWI_robert_eibel_desc:0 "罗伯特·艾贝尔（1906年6月7日—1986年5月26日），沃州韦维人，乐器商人之子，童年在斯特拉斯堡度过，苏黎世大学法学博士（1931年），自由激进党籍政治人物、公关业先驱。1933年秋苏黎世市自由激进党与国民阵线达成联合名单协议时，他任该党秘书；这层间接关联曾在1979年出版的《不安分的爱国者》一书中被用以暗示其思想倾向，但瑞士联邦法院在其提起的名誉权诉讼（载于BGE111II209号判决）中认定，仅凭这一事实及其一次出席民族与家园联盟活动的经历，不足以将其定性为阵线思想的追随者。二战期间他实际担任吉桑将军私人参谋秘书处主任，并是1940年圣哥达同盟的共同发起人之一，该同盟是一个反纳粹宣传、捍卫瑞士独立与民主价值的公民运动。1947年他开设公关事务所，承接企业及政治宣传业务，是民族重建行动等经济自由主义团体的重要推手，长期倡导激进的自由市场理念。1963—1975年任国民院议员（自由激进党）。1986年在苏黎世逝世。"
 SWI_robert_grimm_desc:0 "罗伯特·格里姆（1881年4月16日—1958年3月8日），苏黎世州瓦尔德人，印刷工出身，瑞士社会民主党元老级人物。1909—1918年任《伯尔尼守望报》主编，1915、1916年分别组织齐美尔瓦尔德会议与基恩塔尔会议，召集反对一战的国际社会主义者，并因此与列宁相识，但两人在革命策略上分歧明显、关系紧张。1917年他卷入格里姆-霍夫曼事件（涉嫌斡旋德俄单独媾和），一度受挫。1918年初他发起成立奥尔滕行动委员会，同年11月作为该委员会主席发出全国大罢工的号召并领导罢工，军队随后大规模动员予以镇压。1919年4月军事法庭以煽动哗变罪判处他六个月监禁。此后他转向温和路线，1920年代主导社民党拒绝加入第三国际，导致党内革命派出走另立瑞士共产党；1935年他作为主要执笔人参与制定放弃无产阶级专政、承认国防必要性的新党纲，使社民党逐步具备执政资格。他1911—1943年任伯尔尼州社民党主席，1938—1946年任伯尔尼州政府委员（首位社民党籍），1946年出任国民院议长。尽管声望崇高，他终生未能进入联邦委员会。1958年在伯尔尼逝世。"
 SWI_robert_tobler_desc:0 "罗伯特·托布勒（1901年12月22日—1962年6月17日），苏黎世人，律师之子，法学博士，瑞士阵线运动的核心人物，也是该运动唯一一位曾进入联邦议会的成员。1930年他参与创建新阵线，1933年该组织与国民阵线合并。1934—1938年任苏黎世市议会议员，1935—1939年任州议会及国民院议员，是国民阵线在联邦层面唯一的国民院议席持有者。他主办党报《阵线报》，该报获得纳粹德国的资金支持。1938年1月他接替罗尔夫·亨纳出任国民阵线全国领袖，试图寻求与主流政界的某种妥协，但为时已晚，该运动已被普遍视为亲纳粹组织。1938—1939年地方选举中该党丧失全部议席，1939年不再参与国民院选举。1940年春他因涉嫌为德国从事间谍活动、非法越境德国而被短暂逮捕，案件后因证据不足而撤销，同年国民阵线解散。此后他执掌其后继组织联邦集结直至该组织于1943年遭联邦委员会取缔。1947年苏黎世州高等法院因其政治历史禁止其在该州执业律师，1948年联邦法院撤销该判决，他得以恢复律师职业，此后未再涉足政治，1962年在苏黎世逝世。"
 SWI_roger_masson_desc:0 "罗杰·马松（1894年7月1日—1967年10月19日），生于苏黎世，归属沃州韦托镇，二战期间瑞士军事情报处处长。1915年任步兵少尉，1922年任步兵上尉，1927年起任总参谋部军官，1928—1930年在苏黎世联邦理工学院及巴黎高等军事学院深造。1931年起主编《瑞士军事评论》直至1967年去世，1935年兼任联邦理工学院军事学科讲师。1936年底出任总参谋部第5处（情报处）负责人，着手重建两战间几近荒废的情报体系；1938年将民间哈氏办公室（汉斯·豪萨曼创办）纳入情报体系，情报处人员从1938年5人增至战时高峰约120人。1942—1945年兼任副总参谋长。战时他主导了一条颇具争议的秘密联络渠道：1942年起通过中间人与党卫队保安处高官瓦尔特·舍伦贝格建立联系，1943年促成吉桑将军与舍伦贝格两次秘密会晤，意图借此向德方传达瑞士坚决抵抗的决心，并借舍伦贝格之力营救被盖世太保逮捕的瑞士情报人员莫尔盖利。1945年战后联邦当局对其展开行政调查，主审的联邦法官库什潘最终认定，除了与一名纳粹军官保持联系外，无法归咎他其他过错。1967年在洛桑逝世。"
 SWI_rolf_henne_desc:0 "罗尔夫·亨纳（1901年10月7日—1966年7月22日），沙夫豪森人，法学博士，执业律师，瑞士阵线运动早期最重要的领导人之一。他早年曾主张瑞士与苏联接近及纳粹党与德国工会结成联盟，1933年退出自由激进党。受希特勒在德国夺权成功的鼓舞，他在沙夫豪森州组建新阵线，1933年州议会候补选举中获得27%选票。1934年2月他出任统合后的国民阵线全国领袖，该运动是瑞士两战间最具影响力的法西斯主义政党，鼎盛时期约有九千名成员。他主导该党于1936年正式表态效忠国家社会主义意识形态，1937年赴纽伦堡出席纳粹党代表大会。因其与纳粹德国过从甚密、公开鼓吹《锡安长老会纪要》等极端立场，在党内引发反弹，1938年被迫辞去党魁职务，由较温和的罗伯特·托布勒接任。此后他退出一线政治，但1940—1943年间仍主编阵线运动刊物《民族小册》。战后他转入新闻剪报行业，1944年接手苏黎世一家剪报服务社，1948年与国际同业合并，1966年在库斯纳赫特逝世。"
 SWI_rudolf_minger_desc:0 "鲁道夫·明格尔（1881年11月13日—1955年8月23日），伯尔尼州农民出身的政治家，农民、工商、公民党（BGB，今瑞士人民党前身）创始人之一。1918年发起创建该党伯尔尼州分支并任主席，1919年当选国民院议员，1927年任国民院议长。1929年12月当选联邦委员，成为该党首位联邦委员，主管军事部门直至1940年，1935年出任联邦主席。任内他直言德国军事扩张带来的威胁，力主加强瑞士国防建设，与其继任者吉桑将军私交甚笃，友谊持续至去世。他在1938年也曾就列支敦士登在纳粹德奥合并后的安全处境向联邦委员会提出关切，并支持向列支敦士登开放边境劳务以削弱德国影响力。1940年任满后卸任联邦委员，回归农业与合作社事务，曾任伯尔尼州经济与公益协会主席及瑞士农民协会等团体要职，1955年在故乡许普芬逝世。"
 SWI_rudolf_roessler_desc:0 "鲁道夫·勒斯勒，生于德国考夫博伊伦，新教徒，坚定的反纳粹人士，二战期间在瑞士运作的露西（Lucy）间谍网核心人物。一战期间曾任志愿兵参战，战后在奥格斯堡及柏林从事戏剧评论与文化新闻工作，与托马斯·曼等文化名流有交往，1928年出任柏林舞台人民同盟总秘书。1933年纳粹上台后，他以难民身份流亡瑞士，定居卢塞恩，创办小型出版社新生活出版社，出版流亡作家作品，1937年被纳粹德国剥夺国籍。1939年经中间人引荐，他开始向汉斯·豪萨曼的哈氏办公室提供来自德国的情报，每月经中间人转交八十至一百三十份报告，来源始终未予公开，据信部分源自德军统帅部内部反纳粹人士。1942年夏起，他的情报经另一条渠道也直接流向由匈牙利裔苏联情报人员亚历山大·拉多主持的苏联在瑞士间谍网（即红色三人组，隶属红色乐队情报体系），塔斯社代号露西，他提供的情报以详尽准确著称，涵盖德军东线部署及作战决策，对斯大林格勒战役及库尔斯克战役期间苏方决策产生重要参考价值。1943年秋该苏联间谍网遭瑞士联邦警方破获，多名成员被捕，勒斯勒本人因情报仍对瑞士自身有价值而未受株连。1944年5月因德方向瑞士施压，他一度被捕，1945年10月被判有罪，但鉴于其对瑞士的贡献而未被处罚。战后生活拮据，以自由撰稿为业，1958年在瑞士克林斯逝世。"
 SWI_saly_mayer_desc:0 "绍伊（又译萨利）·迈耶（1882年6月3日—1950年7月31日），巴塞尔出生，幼年随家迁居圣加仑，瑞士犹太纺织实业家、犹太社群领袖。1907年与其兄马克斯在英国合伙创办纺织品出口公司，1911年兄长因意外身故后返回圣加仑独自经营并扩大业务。1930年取得圣加仑市民权，1933年加入自由激进党并当选市议员。1929年起义务出任瑞士以色列社群联合会（SIG）秘书，1936—1943年任该会主席，任内该会加入世界犹太人大会。作为成功的国际纺织企业家，他借助商业网络为犹太援助组织建立起隐秘的资金转运渠道，圣加仑因而成为美国犹太人联合分配委员会（JDC，通称联合会）等救援组织向纳粹占领区犹太人及犹太组织输送资金的枢纽。他曾出面接济因协助非法难民入境而被革职的圣加仑警察局长保罗·格林尼格，并与联邦外国人警察负责人海因里希·罗特蒙德保持复杂而暧昧的关系——后者恰是瑞士战时限制性难民政策的主要设计者。1940年起他出任联合会驻瑞士代表，为此在极端保密状态下建立地下网络，通过瑞士犹太社群领袖内森·施瓦尔布与豪萨曼、奥普雷希特等抵抗人士圈子建立联系。1944年8月至9月间，他在圣马格雷滕边境桥多次与党卫队军官库尔特·贝歇尔及匈牙利犹太营救委员会代表拉斯洛·卡斯特纳会面，就人换物资方案与党卫队周旋谈判，虚与委蛇地拖延周旋以争取时间、避免触发盟国外汇管制的红线。战争后期及战后，他利用联合会资金资助犹太难民非法移民巴勒斯坦的行动。1943年他因与瑞士当局过于顺从合作的立场在犹太社群内部引发不满，被迫辞去SIG主席职务。1950年在圣莫里茨逝世。"
 SWI_walter_allgower_desc:0 "沃尔特（又作瓦尔特）·阿尔格韦尔（1912年8月18日—1980年4月15日），圣加仑人，刺绣商人之子，外科医生马丁·阿尔格韦尔之兄，瑞士记者与政治人物。维也纳、哥廷根及巴塞尔大学攻读日耳曼语文学、历史及哲学，1937年获博士学位。二战期间在军官同盟及圣哥达同盟中担任领导角色，是1940年7月圣哥达同盟《告瑞士人民书》的联署人之一；因不满该同盟内部日益浓厚的统合主义倾向，不久即退出，转而与神学家卡尔·巴特、沙夫豪森市长瓦尔特·布林戈尔夫等人共同创立立场更加民主的全国抵抗行动，并参与军官同盟策划的应急方案——一旦联邦委员会及吉桑将军对纳粹入侵的抵抗意志不足，该同盟拟采取行动予以纠正。战时及战后，他先后任教官军官、《观察家报》记者及编辑，1949—1956年任《民族报》国内新闻编辑，1956—1977年任《我们建桥者》主编。1950年代初曾属自由激进党，1954年因军事及社会政策立场分歧转投独立联盟（LdU），1954—1966年任巴塞尔市大议会议员，1960—1969年任巴塞尔双州制宪会议代表，1963—1979年任联邦国民院议员，任内积极推动瑞士加入联合国及欧共体，反对组建职业化军队。1980年在巴塞尔逝世。"
 SWI_walter_stucki_desc:0 "沃尔特·奥托·斯图基（1888年8月9日—1963年10月8日），伯尔尼人，律师出身，瑞士著名外交官，人称大斯图基以区别于同姓同事卡尔·斯图基（小斯图基）。伯尔尼大学攻读法律及国民经济学，1912年获律师资格，后赴慕尼黑、巴黎、伦敦深造国际法及国际商约法。1917年经联邦委员埃德蒙·舒尔特斯提携，任联邦经济部总秘书，1919—1925年重操律师业，1925年出任经济部贸易司司长，直至1935年主导瑞士对外贸易谈判，1933年获联邦委员会授予公使外交头衔（为非职业外交官中首例）。1938年出任瑞士驻法国公使，1940年法国败降后随维希政府南迁，此后近四年常驻维希，期间还代表英国、美国等已撤离维希的国家利益，并通过秘密走私的短波电台向瑞士当局传递情报。1944年8月19日，他在德军威胁轰炸维希、企图逮捕贝当元帅之际挺身斡旋，说服德军指挥官冯·诺伊布龙将军以体面方式完成逮捕、避免流血冲突，随后又亲赴中央高原与逼近的抵抗组织马基谈判，最终使维希在盟军逼近时未经战斗即被德军放弃，几乎完全避免了针对通敌民众的报复行动。维希市政府授予他荣誉市民称号，并于次年赠以一套二十六件纯银餐具志谢，1957年该市一条街道以他命名。1945年回国后任联邦政治部外事司司长，主导柯里使团谈判，迫使瑞士承诺冻结德国资产、大幅削减对德贸易；后因与新任外交部长马克斯·佩蒂皮耶雷政见不合，1946年改任联邦特使，同年就华盛顿协定与盟国达成妥协，1953年又就德国对外债务达成伦敦协定，此后致力改革瑞士外交官选拔培养制度。1963年在伯尔尼逝世。"
 SWI_walther_stampfli_desc:0 "瓦尔特·斯坦普夫利（1884年12月3日—1965年10月11日），索洛图恩州自由激进党籍联邦委员，曾任冯·罗尔铁工厂高级经理。1940年7月18日当选联邦委员，主管经济部门达七年，1944年出任联邦主席。任内正值瑞士被轴心国全面包围、物资供应最为紧张的时期，他通过配给制、战时经济动员及与德意两国的艰难贸易谈判，保障了国内粮食、就业与能源供应，同时尽力维护瑞士在经济上的独立自主。他大力支持弗里德里希·瓦伦主持的瓦伦计划（战时耕作运动）。战争后期，他积极推动建立全国性的老年与遗属保险制度（AHV），1947年该制度经公投通过，他称之为其政治生涯中最大的成就，因而常被称为AHV之父。1947年底卸任联邦委员，此后出任冯·罗尔铁工厂及比伯里斯特造纸厂董事长等职，并长期投身残疾人劳动融入事业。1965年在苏黎世逝世。"
