l_simp_chinese:
 CBIO_GRE_konstantinos_demertzis_desc:0 "希腊法学家、政治家，一八七六年生于雅典，早年在雅典大学取得法学博士学位，后赴慕尼黑深造，归国后任民法教授。一九一三年及一九一七年两度出任海军部长，一九二四年参与创建短命的统一进步党并任党首。一九三五年王国复辟后，不属任何政党的他受国王乔治二世之邀出面组阁，于一九三五年十一月三十日就任第四十九任首相，兼掌外交部，主要任务是筹办一九三六年一月的大选，选举以秩序井然著称。选后各党组阁谈判破裂，国王再度请他留任，并任命梅塔克萨斯为副首相兼军事部长。任期未及完成，一九三六年四月十三日，德默齐斯因心脏病发在任上去世，首相之位随即由梅塔克萨斯接掌，为其后的独裁埋下伏笔。"
 CBIO_GRE_nikos_zachariadis_desc:0 "希腊共产党的核心领袖。一九〇三年四月二十七日生于奥斯曼帝国的埃迪尔内一个希腊族家庭，希土人口交换后随家迁入希腊。早年在伊斯坦布尔做工，接触工人运动，后赴苏联在东方劳动者共产主义大学受训。一九三一年奉共产国际之命回国整顿派系林立的希共，同年起任中央总书记，直至一九五六年，任内使党员数倍增并进入议会。一九三六年八月被梅塔克萨斯政权逮捕入狱，狱中发出公开信，号召希腊人抵抗一九四〇年的意大利入侵，这封信成为希共参与民族抵抗的重要标志。德国占领期间他被关入达豪集中营，一九四五年获释回国，重掌党务，并领导内战中的民主军，因在游击战与正规战之争中排挤马科斯·瓦菲阿迪斯、坚持强硬路线而饱受争议。一九五六年被解职，次年被开除出党，此后长期流放西伯利亚。据苏联内务部解密档案，一九七三年八月一日，他在苏尔古特自杀身亡。遗骸于一九九一年运回希腊，二〇一一年希共正式为其恢复名誉。"
 CBIO_GRE_george_mercouris_desc:0 "希腊极右翼政治人物，一八八六年生于雅典的显赫政治世家，父亲斯皮里宗·默库里斯长年担任雅典市长。他在雅典大学与巴黎攻读法律与政治学，一九一五年首次当选议员。一九三二年一度任人民党副主席，因与党首帕纳伊斯·察尔扎里斯不和而退党，同年十二月创建希腊国家社会主义党，这是当时希腊数个小型极右政党之一。他偏向亲德，一九三四年代表该党出席在蒙特勒举行的法西斯国际会议，充当希腊与纳粹德国之间的中间人。轴心国占领期间，一九四三年由通敌首相扬尼斯·拉利斯任命为希腊国家银行行长。其弟斯塔马蒂斯是左翼议员，侄女是日后的著名影星与文化部长梅利娜·默库里。因政见分歧，家族对他极为反感。一九四三年十二月，默库里斯因心脏病去世，据记载家人拒绝出席他的葬礼。"
 CBIO_GRE_ioannis_metaxas_desc:0 "希腊军官、政治家与独裁者，一八七一年四月十二日生于伊萨基岛的贵族家庭。早年参加一八九七年的希土战争与巴尔干战争，在德国接受军事教育，一九一三年任总参谋长。作为坚定的保王派，他在民族分裂时期与韦尼泽洛斯对立，反对希腊参加第一次世界大战，一度遭流放。一九三六年三月由国王乔治二世任命为军事部长，同年四月十三日德默齐斯猝逝后继任首相。八月四日，他在国王支持下发动自我政变，建立威权、民族主义、反共的八月四日政权，效仿其他欧洲独裁体制取缔政党、审查言论，推行国民青年组织与部分社会改革，自称第三希腊文明的缔造者。一九四〇年十月二十八日，面对意大利要求让其驻军的最后通牒，他断然拒绝，这一拒绝被希腊后世纪念为拒绝日，随即将国家带入对意作战并取得反攻胜利。一九四一年一月二十九日，在德国入侵之前，他因咽部脓肿引发的败血症在雅典去世。"
 CBIO_GRE_king_george_ii_desc:0 "希腊国王，一八九〇年七月十九日生于雅典近郊的塔托伊王家别墅，是国王康斯坦丁一世与普鲁士索菲亚公主的长子。他早年接受军事训练，参加过巴尔干战争。一九一七年民族分裂中随父流亡，一九二二年小亚细亚败局后其父退位，他继位为乔治二世。次年保王派政变失败，他被迫离国流亡罗马尼亚，一九二四年希腊宣布成立第二共和国，他被正式废黜并被剥夺国籍。一九三五年，一场普遍被视为舞弊的公民投票使君主制复辟，他重返王位，此后长期支持梅塔克萨斯的独裁统治。一九四一年德国入侵后，他第三次流亡，辗转克里特、埃及直至伦敦，领导流亡政府。战后一九四六年公投保留了君主制，他于同年九月返回希腊。因数度流亡，他曾说希腊国王最重要的工具是一只手提箱。他没有子嗣。一九四七年四月一日，他因动脉硬化在雅典去世，由其弟保罗继位。"
 CBIO_GRE_markos_vafiadis_desc:0 "希腊共产党在抵抗运动与内战时期的重要人物，以将军马科斯之名为人所知。一九〇六年一月二十八日生于奥斯曼帝国境内本都地区的托西亚，一九二三年希土人口交换后作为难民来到塞萨洛尼基一带。他早年加入共产主义青年组织，屡遭监禁流放，梅塔克萨斯独裁时期曾被流放又逃脱。德国占领期间投身抵抗，一九四二年进入希共中央委员会，任希腊人民解放军马其顿部队的负责人。一九四六年十月民主军总司令部成立后，他出任总司令，一九四七年十二月又出任临时民主政府的总理兼军事部长。内战后期，他因在游击战与正规战问题上与扎哈里亚季斯分歧而于一九四八至四九年间被解除职务。此后他流亡苏联，化名伊万·库利耶夫，一度被开除出党，又几度恢复与除名。一九八三年结束长期流亡回到希腊，一九八四年获授希腊陆军上将军衔，并于一九八九年和一九九〇年经泛希腊社会主义运动全国名单荣誉当选议员。一九九二年二月二十二日在雅典去世。"
 CBIO_GRE_konstantinos_tsaldaris_desc:0 "希腊政治家，两度出任首相。一八八四年四月十四日生于埃及亚历山大，先后在雅典、柏林、伦敦和佛罗伦萨攻读法律。一九二六年首次当选议员，一九二八年加入由其叔父帕纳伊斯·察尔扎里斯领导的人民党，并在叔父政府中任交通副部长。一九三六年帕纳伊斯去世后，他进入人民党领导层。一九四四年解放后，他被公认为重建的人民党领袖，在一九四六年颇具争议的大选中获胜，出任首相，任期自一九四六年四月至一九四七年一月，其间政府于一九四六年九月举行公民投票，使国王乔治二世复位。此后他又在一九四七年八月至十一月短暂再任首相，并长期兼任外交部长与副首相，在内战年代代表希腊出席联合国大会。随着帕帕戈斯的希腊集结党崛起，人民党大幅失势，他在一九五二年选举中落败，逐渐淡出政坛。一九七〇年十一月十五日在雅典去世。"
 CBIO_GRE_georgios_kosmidis_desc:0 "希腊极右翼政治人物，约一八八〇年生于高加索地区卡尔斯附近的希腊族家庭，操土耳其语，是一名不识字的商人，在塞萨洛尼基以裁缝为业。一九二七年，他在塞萨洛尼基参与创建希腊民族联盟，这是一个由小亚细亚难民商人发起、章程规定仅基督徒可加入的极右组织，成员与当地人数众多的犹太社群在商业和政治上尖锐对立。他起初较少直接参与，一九二九年当选该组织主席，并亲手为成员缝制土黄色制服。该组织带有强烈的反犹与反共色彩，其领导层是一九三一年坎贝尔纵火案审判的主要被告，该案中希腊民族主义暴徒袭击了塞萨洛尼基的犹太人聚居区。组织在一九三〇年代初一度有数千名成员，曾仿效墨索里尼的进军罗马组织成员向雅典进发，后在内讧中瓦解，并于梅塔克萨斯政权建立后的一九三六年被解散。一九七〇年一月十七日去世。"
 CBIO_GRE_charalambos_katsimitros_desc:0 "希腊将军，一八八六年生于埃夫里塔尼亚的克利苏拉，一九〇四年从军。他参加过巴尔干战争，在小亚细亚战役中负伤。一九三八年二月起出任驻约阿尼纳的第八步兵师师长，负责伊庇鲁斯方向的防务，意大利占领阿尔巴尼亚后，他着力构筑工事、熟悉山地。一九四〇年十月意大利入侵时，他违背总参谋部原定后撤的指令，集中兵力在埃莱阿至卡拉马斯河一线全力迎战，在卡尔帕基顶住了兵力占优的意军，成为第二次世界大战中最早击退轴心国军队的将领之一，随后率师攻入阿尔巴尼亚。德国入侵后，他随伊庇鲁斯军团撤退，投降时身在约阿尼纳。此后他加入楚拉科格卢的第一届通敌政府，一九四一年四月至九月先后任劳动部长和农业部长。解放后他因此受审，被判五年监禁，一九四九年获王室赦免，并因希意战争中的功绩晋升为中将。一九六二年二月在雅典去世。"
 CBIO_GRE_markos_drakos_desc:0 "希腊陆军将领，官至中将，出身伊庇鲁斯名门德拉科斯（索佐斯）家族，一八八八年生于雅典。一九一二年，他被派往法国的法尔曼飞行学校受训，成为希腊最早的军事飞行员之一；巴尔干战争爆发后他奉召回国，参与在拉里萨组建希腊航空队，是希腊军事航空的先驱之一。他原为炮兵军官，历经巴尔干战争、第一次世界大战马其顿战线和一九一九至一九二二年的希土战争。一九四〇至一九四一年的希意战争与随后的希腊保卫战期间，他先后出任东马其顿军区和伊庇鲁斯军区司令，是抗击意大利入侵的高级指挥官之一。一九七五年去世。"
 CBIO_GRE_theodoros_pangalos_desc:0 "希腊将领、政治人物、独裁者，一八七八年一月十一日生于萨拉米斯岛。他是坚定的韦尼泽洛斯派与反保王派，参加过一九〇九年的古迪政变，在巴尔干战争、第一次世界大战马其顿战线和希土战争中屡有表现，并在一九二二年推翻国王康斯坦丁一世、建立第二共和国的革命中发挥要角，出任军事部长，主持对若干保王派政要的军事审判。他曾指挥埃夫罗斯军团，因反对《洛桑条约》而一度辞职。一九二五年六月，他发动不流血政变出任首相，次年一月自立为独裁者，四月又操纵选举当上总统，任内查禁新闻自由、颁行多项严苛法令（包括限制女性裙长的规定），并一度对保加利亚动武。一九二六年八月，他被孔迪利斯的反政变推翻。此后他两度入狱。占领期间，他和亲近的军官参与组建了保安营，被广泛怀疑与德国人合作，一九四四年被捕，次年获判无罪。一九五二年二月二十六日去世。"
 CBIO_GRE_dimitrios_psarros_desc:0 "希腊陆军军官，抵抗组织希腊民族与社会解放的创建者与领袖，一八九三年生于福基斯的赫里索村。他一九一六年从军官学校毕业，任炮兵少尉，早年参加巴尔干战争、第一次世界大战马其顿战线、协约国在克里米亚的干涉行动以及希土战争。轴心国占领期间，一九四二年秋他与政治家卡尔塔利斯等人共同创建带有反共、自由派和共和色彩的希腊民族与社会解放，并以其旧部番号重建第五四二埃夫佐内团作为武装力量，兵力约一千人，主要活动于希腊中部的乔纳山一带。由于希腊人民解放军力图独占抵抗运动的主导权，一九四四年四月十七日复活节星期一，该团遭希腊人民解放军攻击并被击溃。普萨罗斯在这场战斗中遇害，他的死震动了各抵抗阵营。一九四五年，他被希腊陆军追授少将军衔。"
 CBIO_GRE_panagiotis_demestichas_desc:0 "希腊陆军军官，官至中将，一八八五年生于拉科尼亚的科特罗纳斯村。他一九〇五年放弃雅典大学法律学业参军，一九一二年从军士学校毕业任步兵少尉。他历经巴尔干战争、第一次世界大战马其顿战线、一九一九年在乌克兰与克里米亚的干涉行动以及小亚细亚战役。一九二五年升上校，一九三四年晋少将，一九三四至一九三九年任陆军副总参谋长，并先后指挥第二、第四和第九步兵师，一度出任国王军事内廷主管。一九四〇年八月晋中将，接掌第一军，并率该军参加希意战争。德国入侵、希腊投降之际，一九四一年四月，他与楚拉科格卢等将领一同转向对德投降，随后在楚拉科格卢的第一届通敌政府中出任内务部长，至同年九月。一九六〇年十一月十四日去世。"
 CBIO_GRE_nikolaos_plastiras_desc:0 "希腊将军、政治家，三度出任首相，一八八三年十一月四日生于卡尔迪察。他一九〇四年从军，在一九一九至一九二二年的希土战争中指挥第五四二埃夫佐内团，以骁勇著称，得绰号黑骑士。希腊战败后，他与其他韦尼泽洛斯派军官发动一九二二年九月的革命，推翻国王康斯坦丁一世，军政府执政至一九二四年交权，随后成立第二共和国。作为坚定的共和派，他为阻止君主复辟在一九三三年和一九三五年两度发动政变，均告失败，被迫流亡法国。轴心国占领期间，他是抵抗组织希腊民族共和联盟的名义领袖，但本人留在马赛。占领结束后，他返回希腊，创建全国进步中间联盟，三度出任中间派首相，力图弥合内战造成的社会裂痕，倡导妇女选举权、释放政治犯与废除死刑。但他执政期间仍于一九五二年处决了共产党人贝罗亚尼斯，招致国际抗议。一九五二年败于帕帕戈斯的希腊集结党后，他退出政坛。一九五三年七月二十六日，他在贫困中于雅典去世，获国葬礼遇。"
 CBIO_GRE_stylianos_gonatas_desc:0 "希腊陆军军官、韦尼泽洛斯派政治家，一八七六年八月十五日生于帕特雷。他先后参加马其顿斗争、巴尔干战争和小亚细亚战役，一度以上校身份任师长。一九二二年小亚细亚惨败后，他与普拉斯提拉斯等人共同发动九月革命，推翻君主与政府，并在革命委员会主导的政府中出任首相，任期自一九二二年至一九二四年，为随后成立的第二共和国铺路。此后他长期活跃于共和派政治。因与自由党领袖索福利斯不和，他另组民族自由党，在一九四六年大选中与保守的人民党结盟，转而支持君主复辟，并在察尔扎里斯政府中出任公共工程部长。一九六六年三月二十九日去世。"
 CBIO_GRE_napoleon_zervas_desc:0 "希腊陆军军官、二战抵抗运动领袖，一八九一年五月十七日生于伊庇鲁斯的阿尔塔，祖上属著名的苏利氏族。他早年从军，是坚定的韦尼泽洛斯派，参加过巴尔干战争和第一次世界大战。一九四一年九月占领开始后，他与其他韦尼泽洛斯派军官创建希腊民族共和联盟，主张抗击占领者、废除君主制、建立共和国，同时强烈反共。其武装称希腊游击队民族支队，主要活动于伊庇鲁斯山区。一九四二年十一月，他的部队与阿里斯·维勒奇奥蒂斯的希腊人民解放军及英国破坏专家合作炸毁戈尔戈波塔莫斯铁路桥。此后他与共产党主导的抵抗力量冲突不断，一九四三年三月转而表态效忠国王。占领末期，他的组织被指参与将伊庇鲁斯的穆斯林查姆阿尔巴尼亚人驱逐出境。一九四四年十二月，他被希腊人民解放军击败，退往科孚岛，次年二月解散残部。战后他创建希腊民族党并当选议员，一九四七年任公共秩序部长期间大量逮捕共产党人。一九五七年十二月十日在雅典去世。"
 CBIO_GRE_dimitrios_oikonomou_desc:0 "希腊海军将领，一八八三年六月四日生于哈尔基斯。他在巴尔干战争中作为下级军官参战，因坚定的保王立场在一九一七至一九二〇年间被逐出军队，后获复职，历任舰艇与高级指挥职务。一九三四年升海军少将，一九三五年三月出任海军总参谋长兼海军部总司长。同年五月，他主持审判参与三月亲韦尼泽洛斯政变的海军军官的特别军事法庭，但随即成功请求不执行判处的死刑。十月十日，他与陆军的帕帕戈斯、空军的雷帕斯一道推翻第二共和国、恢复君主制，扶持孔迪利斯上台。此外他曾任希腊奥林匹克委员会委员及希腊游艇俱乐部主席，退役后长期主持与海洋相关的社团。一九五七年九月十一日去世。"
 CBIO_GRE_konstantinos_ventiris_desc:0 "希腊陆军军官，官至中将，一八九二年生于卡拉马塔，兄长格奥尔基奥斯是韦尼泽洛斯的亲信。他一九一〇年从军，历经巴尔干战争、第一次世界大战马其顿战线和小亚细亚战役。一九三〇年升上校，曾任驻南斯拉夫和捷克斯洛伐克武官、总参谋部情报部门主管和陆军学院副院长。作为韦尼泽洛斯派共和军官，他在一九三五年三月流产的政变后被逐出军队。占领期间他创建抵抗组织拉恩，一九四三年转赴中东加入流亡政府的军队。随着共产党主导的民族解放阵线壮大，他与许多同派军官一样转向右翼与拥护君主的立场，一九四四年十二月雅典事件中指挥政府军作战。他两度出任陆军总参谋长，在内战中的作用举足轻重，美国将领范弗利特称他常被视为希腊最出色的军事指挥官。他获颁希腊最高战时勋赏英勇十字级司令勋章，一九五一年出任国王保罗的侍从武官长。一九六〇年在雅典去世。"
 CBIO_GRE_nikos_beloyannis_desc:0 "希腊共产党的重要干部，一九一五年生于伯罗奔尼撒的阿马利亚达一个较殷实的家庭。他在雅典学习法律，因政治活动被开除，一九三四年加入希腊共产党。梅塔克萨斯独裁时期，他被关押于阿克罗纳夫普利亚监狱，一九四一年占领开始后被移交给德国人。一九四三年他越狱，在伯罗奔尼撒加入阿里斯·维勒奇奥蒂斯麾下的希腊人民解放军，内战期间任民主军政治委员，一九四九年败局后是最后撤离的人员之一。一九五〇年六月，他潜返希腊，重建被取缔的希共雅典组织，同年十二月被捕受审。他佩戴康乃馨受审的形象为世人所知，被称为戴康乃馨的人，毕加索曾为他作素描；毕加索、卓别林、萨特、艾吕雅、希克梅特等国际知名人士纷纷呼吁赦免。尽管国内外一再请求宽大，一九五二年三月三十日，他仍在普拉斯提拉斯政府任内被枪决于雅典的古迪军营。"
 CBIO_GRE_alexandros_sakellariou_desc:0 "希腊海军上将、政治家，二战期间领导希腊皇家海军，一八八七年一月一日生于埃莱夫西纳附近的曼德拉村。他一九〇六年从海军学校毕业，巴尔干战争中在旗舰阿韦罗夫号巡洋舰上参加埃利海战与莱姆诺斯海战。作为保王派，他在民族分裂中一度被逐、监禁，后复职。一九三五年升海军少将，在同年十月孔迪利斯恢复君主制的兵变中发挥关键作用。一九三七年一月起任海军总参谋长，直至一九四一年德国入侵。首相科里齐斯自杀后，国王乔治二世任命他为海军部长兼副首相。面对德军推进和舰只在空袭中的重大损失，他下令残存舰艇撤往埃及，此后统领流亡舰队直至一九四三年底退役。战后他组建全希腊民族党并当选议员，先后出任补给、海军、国防等部长。一九八二年七月七日在雅典去世。"
 CBIO_GRE_spyridon_avgeris_desc:0 "希腊海军军官，官至海军中将，一九〇九年九月十日生于萨拉米斯岛。他一九二九年从海军学校毕业，专攻海军炮术。希意战争与随后的德国入侵期间，他在埃加莱奥山指挥一处海军高射炮阵地。占领初期，他一度在通敌政府的国防部任职，随后设法出逃，其船只一九四二年二月在安塔利亚湾附近失事，他作为幸存者辗转抵达中东的盟军。一九四三年七月，他作为卡纳里斯号驱逐舰的副长参加盟军在西西里的登陆，因在攻取奥古斯塔时的表现获颁英勇十字勋章。希腊内战期间，他任平多斯号驱逐舰舰长，一九四九年初在击退共产党游击队对莱奥尼迪翁的进攻中表现突出，再获英勇十字勋章。此后他历任多种舰艇与岸上指挥职务，一九六〇年升海军少将，一九六三年升海军中将并出任海军总参谋长。一九六七年三月，他改任国防总参谋长，任内经历了当年四月的上校集团政变，同年十二月国王康斯坦丁二世反政变失败后被解职。一九七二年一月三日去世。"
 CBIO_GRE_panagiotis_gazis_desc:0 "希腊空军将领，官至少将，一八八八年生。他原为陆军军官，一九三〇年升中校，一九三四年升上校。自一九三五年一月起，他出任希腊空军总参谋长，在梅塔克萨斯政权时期主持希腊空军的建设，直至一九四〇年十二月卸任、由察尔帕利斯接替。同年八月他已晋升少将；卸任参谋长数日后，他改任第十步兵师师长，在希意战争与德军入侵期间率部作战，直至一九四一年四月下旬希腊投降。一九四一年去世。"
 CBIO_GRE_alexandros_papagos_desc:0 "希腊军官，是唯一晋升元帅的希腊职业军人，一八八三年十二月九日生于雅典。他一九〇六年在布鲁塞尔军校毕业后入伍，历经巴尔干战争与小亚细亚战役。一九三五年任军事部长，一九三六年八月起任陆军总参谋长，以军队支持梅塔克萨斯的八月四日独裁，是该政权的关键人物。一九四〇年十月希意战争爆发时，他任总司令，指挥希军顶住意大利入侵并反攻进入阿尔巴尼亚。一九四三年他被德国占领当局逮捕，关押于达豪集中营，直至一九四五年获释。一九四九年，他领导国民军取得内战最后胜利，同年获授元帅军衔，并于一九五〇年出任首任国防军总参谋长。一九五一年他退役从政，仿照戴高乐创建希腊集结党，在一九五二年大选中获胜出任首相。其执政时期希腊加入北约、允许美军驻扎、建立强硬的反共体制，并于一九五三年将德拉克马贬值一半。一九五五年十月四日，他在首相任上去世。"
 CBIO_GRE_petros_voulgaris_desc:0 "希腊海军上将，一九四五年曾短暂出任首相，一八八三年九月十三日生于伊兹拉岛。他一九〇三年从海军学校毕业，巴尔干战争中在潘西尔号驱逐舰上参加埃利海战。作为亲韦尼泽洛斯派，他在一九一六年加入塞萨洛尼基的民族防卫运动，第一次世界大战期间在爱琴海及后来的小亚细亚战役中指挥驱逐舰。一九三五年三月政变失败后，他因韦尼泽洛斯派立场被清洗，一度在私营部门任职。一九四三年流亡政府召他复职，任航空部长。一九四四年海军哗变爆发时，他出任舰队司令，主持以军官分队强行夺回哗变舰只，稳定了舰队，为此获颁英勇十字级司令勋章。同年十月他率舰队返回希腊，任海军总参谋长。一九四五年四月，摄政达马斯基诺斯大主教任命他组建过渡政府，他出任首相至同年十月，任内一度兼掌军事、海军、航空等部。一九五七年十一月二十六日在雅典海军医院去世。"
 CBIO_GRE_eleftherios_venizelos_desc:0 "希腊近代最杰出的政治家，自由党的创立者。一八六四年八月二十三日生于奥斯曼统治下克里特的穆尔涅斯，父亲是参与克里特反抗运动的商人。他在雅典大学攻读法律，返乡后当律师并投身政治，在一八九七年克里特起义中崭露头角，推动克里特自治乃至与希腊合并。一九一〇年应邀赴雅典出任首相，此后先后七次组阁，执政共约十二年。他创建自由党，推行军事与制度改革，率希腊参加一九一二至一九一三年的巴尔干战争，使国土与人口近乎倍增。第一次世界大战期间，他主张站在协约国一方，与主张中立的国王康斯坦丁一世发生激烈冲突，酿成撕裂希腊多年的民族分裂。战后他在巴黎和会上为希腊争得大片领土，签署色佛尔条约，又以希土人口强制交换和洛桑条约重塑希腊的对外格局。晚年因反对君主复辟而卷入一九三五年流产的政变，随后流亡巴黎。一九三六年三月十八日，他因中风在巴黎的寓所去世，遗体经海路运回克里特，安葬在他出生地附近的阿克罗蒂里。"
 CBIO_GRE_georgios_tsolakoglou_desc:0 "希腊陆军军官，占领时期第一届通敌政府的首脑，一八八六年四月生于色萨利的伦蒂纳，属阿罗马尼亚裔。他历经巴尔干战争、第一次世界大战、一九一九年乌克兰远征和小亚细亚战役。希意战争中，他以中将衔指挥西马其顿军区。一九四一年四月德军入侵、希腊军队被切断退路后，他不顾总司令帕帕戈斯继续抵抗的命令，与几名将领擅自向德军投降，并签署了希腊军队的投降书。四月三十日，他被轴心国占领当局任命为傀儡政权希腊国的首相。其政府自始便充斥腐败与内讧，无力阻止保加利亚吞并希腊北部，也无从缓解德国对希腊的大规模劫掠——这一时期爆发了导致数十万人死亡的大饥荒。一九四二年十二月，他被解职，由洛戈塞托普洛斯接替。希腊光复后，他于一九四五年被特别通敌者法庭判处死刑，后减为无期徒刑。一九四八年五月二十二日，他因白血病死于狱中。"
 CBIO_GRE_epameinondas_kavvadias_desc:0 "希腊海军上将，曾三度出任海军总参谋长，一八八六年一月一日生于雅典，家族来自凯法利尼亚，其父帕纳伊奥蒂斯·卡夫瓦迪亚斯是著名考古学家、希腊文物总监。他一九〇六年从海军学校毕业，巴尔干战争中在纳夫克拉图萨号驱逐舰服役，小亚细亚战役期间指挥蒂埃拉号与尼基号驱逐舰。一九二二年因保王立场在九月革命后被逐出海军，一九二五年由潘加洛斯政权复职。他在一九三三至一九三四年首次出任海军总参谋长，一九三五年任潜艇部队司令，一九三六年底至次年初以及一九三八年又两度短暂执掌海军总参谋部，是梅塔克萨斯时期海军高层的重要人物。一九六五年四月十日去世。"
 CBIO_GRE_marinos_mitralexis_desc:0 "希腊空军飞行员，希意战争中的传奇人物，约一九二〇年生于梅塞尼亚。他从希腊空军军校毕业后任少尉，被派往驻塞萨洛尼基的第二十二驱逐机中队。一九四〇年十一月二日，一队意大利轰炸机在战斗机护航下空袭塞萨洛尼基，他驾驶波兰制战斗机迎击，先击落一架轰炸机，弹药耗尽后，索性用螺旋桨撞击一架敌机的尾翼，削断其方向舵，使之失控坠毁。随后他迫降在坠机附近，仅凭手枪俘获了跳伞生还的意军机组。凭此壮举，他获颁希腊最高战时勋赏金质英勇十字勋章，是战争期间唯一获此殊荣的空军军官。希腊投降后，他撤往北非继续对轴心国作战，累计取得五次空战胜利。一九四八年九月十九日，他在爱琴海一次训练飞行中因飞机失事殉职，身后被追授联队长军衔。"
 CBIO_GRE_georgios_kosmas_desc:0 "希腊高级陆军军官，一八八四年生于梅塞尼亚的法兰提村，一九〇四年从军。他历经巴尔干战争、第一次世界大战马其顿战线和小亚细亚战役，在希意战争中先后指挥第四、第五和第一军。德国入侵与希腊投降后，他因参与抵抗运动被捕，遭流放至德国的集中营，一九四五年四月在蒂罗尔随达豪集中营的知名囚犯一同获释。返回希腊后，他于一九四七至一九四八年任西色雷斯总督，一九四九年一月出任陆军总参谋长，直至一九五一年三月退役，任内正值内战收尾阶段。此后他从政，多次当选议员，并在帕帕戈斯政府中出任北希腊部长。一九六四年去世。"
 CBIO_GRE_aristeidis_moraitinis_desc:0 "希腊海军军官、海军航空的先驱，一八九一年二月三日生于埃伊纳岛。他一九一〇年从海军学校毕业，巴尔干战争期间志愿加入初创的海军航空队。一九一三年，他作为观察员与陆军中尉穆图西斯一同驾驶水上飞机侦察达达尼尔海峡内的奥斯曼舰队，这被视为军事史上第一次海军航空行动，在希腊与国际报界广受关注。一九一四年，他参与创办了希腊第一所海军航空学校，并创建了希腊第一家飞机制造厂。第一次世界大战希腊参战后，他在爱琴海北部作战，隶属英国皇家海军航空队，共取得九次空战胜利，是希腊在一战中唯一的王牌飞行员，并出任海军航空队指挥官，获英国颁授杰出服务勋章。一九一八年十二月二十二日，他驾机从塞萨洛尼基飞往雅典，途中在奥林波斯山一带遭遇恶劣天气坠机身亡，机骸与遗体长期未能寻获。"
 CBIO_GRE_aris_velouchiotis_desc:0 "希腊人民解放军最著名的领袖与主要发起人，本名阿萨纳西奥斯·克拉拉斯，一九〇五年八月二十七日生于拉米亚一个上层家庭。他一九二五年加入希腊共产党，曾在共产党报纸供职，梅塔克萨斯独裁时期屡遭监禁与流放。一九四二年，他受党派遣赴希腊中部山区发动游击，六月七日在埃夫里塔尼亚的多姆尼斯塔村首次公开露面，以战神阿瑞斯和当地韦卢希山为名取化名阿里斯·维勒奇奥蒂斯，宣告希腊人民解放军成立。他以铁的纪律著称，使这支队伍成长为希腊历史上最大的游击军，并在一九四二年十一月参与炸毁戈尔戈波塔莫斯桥。他与另一位抵抗领袖泽瓦斯还是远房表亲。一九四五年瓦尔基扎协议签订后，他视缴械为背叛而拒绝服从，遭扎哈里亚季斯和希共斥为叛徒并被开除。他重上山区试图再起，同年六月十六日在阿格拉法山区被围，与副手一同自杀身亡，两人的头颅随后被割下示众。"
 CBIO_GRE_aristeidis_dimitratos_desc:0 "希腊工会活动家、政治人物，一九〇二年一月三十一日生于凯法利尼亚。他早年投身工人运动，一九一八年是希腊社会主义工人党的创始成员之一，该党是希腊共产党的前身；他还曾任希腊总工会总书记。一九三〇年代前期，他的立场从激进左翼转向保守民族主义和坚定反共。梅塔克萨斯建立四八独裁后，他被任命为劳工部长，任职至一九四一年德国入侵。占领开始后，他在流亡政府中续任劳工部长，至一九四二年二月，因流亡政府力图变得更具代表性而被免职，随后在美国度过战争余下的时间，一九四四至一九四五年间与美军情报部门合作。战后他返回希腊，另组一个右翼劳工党当选议员，一九五〇年代加入民族激进联盟，并在一九五八年卡拉曼利斯内阁中再度出任劳工部长。一九八六年去世。"
 CBIO_GRE_xenophon_giosmas_desc:0 "希腊通敌者、被定为战争罪犯，一九〇六年生于克尔卡阿奇，出身小亚细亚难民家庭，定居卡泰里尼。占领期间，他在皮耶里亚和后来的塞萨洛尼基领导通敌的反共准军事组织，其武装配合德军镇压以民族解放阵线和希腊人民解放军为主的抵抗力量，并主管普洛斯营的宣传事务，还担任过占领军方面的新闻与宣传职务，后逃往维也纳，在流亡的亲轴心政权中任宣传部长。一九四五年，他因通敌被缺席判处死刑，刑罚后获减免，一九五二年出狱。战后他组织了多个反共准军事团体。一九六三年，他卷入左翼议员兰布拉基斯遇刺案，被后来成为希腊总统的预审法官萨尔泽塔基斯下令收押。一九七五年一月十四日去世。"
 CBIO_GRE_georgios_papandreou_desc:0 "希腊自由派政治家，被支持者称为“民主老人”，帕潘德里欧政治世家的开创者，一八八八年二月十三日生于阿哈伊亚的卡伦齐，是一位东正教大司祭之子。他在雅典学习法律，又在柏林研习政治学，深受德国社会民主思想影响，既反对君主制，也坚决反共。他是韦尼泽洛斯的追随者，参与一九二二年革命，梅塔克萨斯独裁时期遭流放。占领期间他被轴心国当局监禁，后逃脱，一九四四年出任流亡政府首相，同年十月希腊光复后成为战后首任首相，任内经历了雅典的十二月冲突，一九四五年一月辞职。战后他历任要职，一九六一年创建中间联盟，一九六三年和一九六四年两度出任首相，一九六五年因与国王康斯坦丁二世冲突而被免职。一九六七年上校集团政变后，他遭软禁，一九六八年十一月一日在软禁中去世，葬礼演变为一场大规模的反独裁示威。"
 CBIO_GRE_father_dimistrios_desc:0 "希腊东正教司祭、语文学者，通称“帕帕-霍莱瓦斯”，一九〇七年一月二十六日生于弗西奥蒂斯的楚卡村，在马克拉科米长大。他在雅典与塞萨洛尼基攻读文学与考古学，一九三八年在拉米亚受祝圣为司祭。一九四二年，他加入希腊人民解放军，取化名“帕帕弗莱萨斯”，出任该军第十三师的随军神父，后成为山区政权民族解放政治委员会议会的议员。一九四三年，他在斯佩尔希亚达召集神职人员大会，创办拥有约四千名成员的全希神职人员联合会并任总书记。战后，他因支持希腊人民解放军而受迫害：教会圣议会法庭停止其圣职三年，一九四七年又将他流放到伊卡里亚岛。此后他在拉米亚、拉夫里翁、莱罗斯、罗得岛和尼凯亚等地的学校教授语文。二〇〇一年，希腊教会圣议会为表彰他在抵抗运动中的贡献，授予他圣保罗金十字勋章。同年七月十六日去世。"
 CBIO_GRE_sophoklis_venizelos_desc:0 "希腊政治家，大政治家埃莱夫塞里奥斯·韦尼泽洛斯的次子，一八九四年十一月三日生于克里特的哈尼亚，母亲因他的出生而亡故。第一次世界大战及小亚细亚战役初期，他在希腊军队中服役，升至上尉。他退役后随父亲的自由党于一九二〇年当选议员。一九四一年占领开始后，他出任驻美大使，代表设在开罗的流亡政府，一九四三年成为该政府的部长，并于一九四四年短暂出任流亡政府首相。战后他返回希腊，任自由党副主席，一九四八年接掌该党，一九五〇年与一九五〇至一九五一年两度出任首相。一九六一年他是中间联盟的创始成员之一。一九六四年二月七日，他在从哈尼亚驶往比雷埃夫斯的客轮上突发肺水肿去世，安葬于父亲墓旁。"
 CBIO_GRE_dimitris_glinos_desc:0 "希腊教育家、哲学家和政治人物，一八八二年九月二日生于士麦那，是家中十二个孩子中的长子。他在雅典大学攻读哲学，后赴德国的耶拿和莱比锡深造，师从倭铿和冯特，并在那里接触到社会主义思想。一九一七年，他在韦尼泽洛斯政府中出任教育部秘书长，力推以通俗希腊语为核心的教育改革，但随政局更迭屡遭挫折。一九二六年他创办左翼评论刊物，成为一九三〇年代希腊重要的马克思主义理论家，一九三六年当选共产党籍议员。梅塔克萨斯独裁下，他被流放、监禁并遭软禁，其间仍潜心著述。一九四二年十二月他当选希共政治局委员，投身抵抗运动，撰写阐释民族解放阵线宗旨的文本。一九四三年十二月二十六日，他在一次手术后于雅典去世，当时正准备前往自由希腊参与山区政权的筹建。"
 CBIO_GRE_evripidis_bakirtris_desc:0 "希腊陆军军官、政治人物，因在共产党报纸上的笔名而得绰号红色上校，一八九五年一月十六日生于奥斯曼帝国的塞雷斯。他曾两度因参与共和派政变而被逐出军队，两次被判死刑，均获减刑。轴心国占领期间，他与普萨罗斯共同创建希腊民族与社会解放，任该组织的军事负责人，后加入民族解放阵线与希腊人民解放军，出任其马其顿战区的指挥官。一九四四年三月十日至四月十八日，他出任抵抗运动在山区建立的民族解放政治委员会的首任主席，即所谓山区政府，此后转任副主席。同年十月三十日，他与马科斯·瓦菲阿迪斯率部解放塞萨洛尼基。一九四七年三月九日，他在福尔尼·科尔塞翁去世。"
 CBIO_GRE_aristotle_onassis_desc:0 "希腊船王、商业巨子，一九〇六年一月生于士麦那一个富裕的希腊烟草商家庭。一九二二年士麦那大火后，他随家人逃往希腊，一九二三年又持难民护照移居阿根廷，起初在电话公司做夜班接线员，继而经营烟草进口生意，二十多岁即成为百万富翁。一九三〇年代经济大萧条期间，他低价购入货船进入航运业，一九三八年又拥有了第一艘油轮。第二次世界大战期间，他移居纽约，经营旗下的油轮船队，将船舶出租给盟军。战后，他大量购入美国的剩余自由轮，率先建造超级油轮，船队急剧扩张，一度成为世界上最大的私人船队；他还创办奥林匹克航空公司，并曾与摩纳哥亲王争夺蒙特卡洛的经济控制权。他的私生活广受瞩目，先后与船业巨头之女蒂娜·利瓦诺斯以及美国前第一夫人杰奎琳·肯尼迪结婚，并与歌剧名伶玛丽亚·卡拉斯有长期交往。一九七三年独子亚历山大空难去世令他备受打击。一九七五年三月十五日，他在巴黎近郊的美国医院去世，安葬于其私人岛屿斯科尔皮奥斯。"
 CBIO_GRE_dimitrios_holevas_desc:0 "希腊东正教司祭、语文学者，通称“帕帕-霍莱瓦斯”，一九〇七年一月二十六日生于弗西奥蒂斯的楚卡村，在马克拉科米长大。他在雅典与塞萨洛尼基攻读文学与考古学，一九三八年在拉米亚受祝圣为司祭。一九四二年，他加入希腊人民解放军，取化名“帕帕弗莱萨斯”，出任该军第十三师的随军神父，后成为山区政权民族解放政治委员会议会的议员。一九四三年，他在斯佩尔希亚达召集神职人员大会，创办拥有约四千名成员的全希神职人员联合会并任总书记。战后，他因支持希腊人民解放军而受迫害：教会圣议会法庭停止其圣职三年，一九四七年又将他流放到伊卡里亚岛。此后他在拉米亚、拉夫里翁、莱罗斯、罗得岛和尼凯亚等地的学校教授语文。二〇〇一年，希腊教会圣议会为表彰他在抵抗运动中的贡献，授予他圣保罗金十字勋章。同年七月十六日去世。"
 CBIO_GRE_emmanouil_tsouderos_desc:0 "希腊政治家、银行家，一八八二年七月十九日生于克里特的雷西姆诺。他在雅典学习法律，又在巴黎和伦敦研习经济学，早年曾任克里特议会与希腊议会议员，先后在韦尼泽洛斯与索富利斯政府中任交通部长、财政部长，并于一九三一至一九三九年间出任希腊银行行长。一九四一年四月，首相科里齐斯自杀后，国王乔治二世任命他为首相。他随国王撤往克里特，继而转赴中东与埃及，领导获国际承认的流亡政府，先设伦敦、后迁开罗，重整希腊军队继续对轴心国作战。一九四四年四月，因流亡军队发生哗变、各方要求组建更具代表性的民族团结政府，他辞去首相职务。战后他仍以不同身份活动。一九五六年二月十日，他在意大利内尔维去世。"
 CBIO_GRE_damaskinos_desc:0 "希腊东正教教长，本名季米特里奥斯·帕潘德里欧（与政治家帕潘德里欧无亲缘），一八九一年三月三日生于多尔维察。他在巴尔干战争中服役，一九一七年受祝圣为司祭，一九二二年出任科林斯主教，一九三〇年代初作为普世牧首的使节前往美国，协助组织美洲希腊正教会。一九三八年他当选雅典大主教，却被梅塔克萨斯否决，直到一九四一年德国入侵后才得以就任雅典及全希腊大主教。占领期间，他多次与德国当局及傀儡政府发生冲突；一九四三年德国着手驱逐希腊犹太人时，他公开提出抗议，并指示神职人员发放假的洗礼证明以掩护犹太人，因此在战后被雅德·瓦谢姆列为国际义人。一九四四年底，他被任命为希腊摄政，并于一九四五年一度兼任首相，主持了寻求平息十二月冲突的会议。一九四六年，他在国王返国后卸任摄政。一九四九年五月二十日在雅典去世。"
 CBIO_GRE_konstantinos_maniadakis_desc:0 "希腊陆军工兵军官、政治人物，一八九三年七月二十五日生于科林西亚的索菲科，一九二九年从军队退役。他是梅塔克萨斯的旧识；四八独裁建立后，梅塔克萨斯任命他执掌新设的公共安全副部，统辖全国警宪力量。他仿照盖世太保建立政治警察“阿斯法利亚”，据称与希姆莱在手段与技术上保持联系；任内他大肆逮捕、流放异己，几乎彻底瓦解了作为主要反对力量的希腊共产党，甚至逮捕了党首扎哈里亚季斯，还出版官方操纵的假《人民报》以制造混乱。因手段之酷烈，他被称为“希腊的希姆莱”。德国入侵后，他在流亡政府初期续任内务部长，不久被迫辞职，随后旅居阿根廷至一九四九年才返回希腊，此后多次当选议员。一九七二年二月二十八日在雅典去世。"
