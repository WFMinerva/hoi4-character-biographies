l_simp_chinese:
 CBIO_SOV_tsar_iosif_stalin_desc:0 "1878年生于格鲁吉亚哥里，本名约瑟夫·维萨里奥诺维奇·朱加什维利，早年参加布尔什维克革命活动，多次遭沙俄当局流放。十月革命后历任党政要职，1922年出任联共（布）中央总书记。列宁逝世后，他先后击败托洛茨基、布哈林等党内对手，至1929年前后确立个人领导地位。在其主政期间，苏联推行社会主义工业化与农业全盘集体化，建立重工业体系；但强制集体化、征粮政策与1932—1933年的严重灾荒交织，造成乌克兰、哈萨克等地大饥荒。1936至1938年，大清洗由肃反扩大化演变为大规模政治清洗，大批党政军干部遭处决或流放，严重削弱了红军战斗力。1941年德国入侵后，他出任国防委员会主席兼最高统帅，领导苏联历经莫斯科、斯大林格勒、库尔斯克等关键战役，最终击败纳粹德国。1945年8月又组织对日作战，苏军迅速击溃日本关东军，并在战后扶植东欧各国建立人民民主政权。1953年3月5日因脑溢血病逝于莫斯科。"
 CBIO_SOV_tsar_vladimir_kirillovich_desc:0 "1917年生于芬兰，全名弗拉基米尔·基里洛维奇·罗曼诺夫，是基里尔·弗拉基米罗维奇大公与维多利亚·梅利塔的独子。其父基里尔于1924年在流亡中自称全俄皇帝，此举令侨民君主派分裂为拥基里尔系与反对系两营。1938年基里尔去世后，他被拥基里尔系奉为罗曼诺夫皇室首领，长期居于法国、西班牙等地。1948年与列奥妮达·巴格拉季昂结婚。1992年在美国去世，遗体随后归葬圣彼得堡彼得保罗大教堂的罗曼诺夫皇陵，是革命后首位安葬于此的皇室成员。"
 CBIO_SOV_tsar_vsevolod_ivanovich_desc:0 "1914年生于圣彼得堡，全名弗谢沃洛德·约安诺维奇，属罗曼诺夫皇族”皇室血亲亲王“一支。其父约安·康斯坦丁诺维奇亲王在1918年阿拉帕耶夫斯克的处决中与多名罗曼诺夫成员一同遇害。年幼的他随家族撤离俄国，先后在南斯拉夫与英国成长，并在英格兰长期定居。他在皇室继承序列中位置较为靠后，一生未掌实权，主要以侨民社群成员的身份生活。1973年在伦敦去世。"
 CBIO_SOV_metropolitan_meletius_desc:0 "1869年生于西伯利亚托木斯克省一个神职人员家庭，俗名米哈伊尔·扎博罗夫斯基。就读托木斯克神学院，1889年晋铎；丧妻后转入修道生活，1898年在喀山神学院出家，法名梅列季，翌年获神学博士学位。1908年祝圣为副主教，此后历任雅库茨克、外贝加尔等地主教。十月革命后，随白军及流亡人员撤入满洲，1920年出任哈尔滨主教，主持在华俄国侨民的东正教事务，并与海外俄罗斯正教会卡尔洛瓦茨总主教公会保持联系。1932年接掌哈尔滨教区，1939年晋升都主教。日占时期拒绝配合当局强迫东正教信众向天照大神行礼的要求。1946年4月在哈尔滨逝世。"
 CBIO_SOV_supreme_soviet_desc:0 "苏联最高国家权力机关，依1936年宪法（即”斯大林宪法“）设立，取代此前的苏维埃代表大会，并于1938年首次召开。采用两院制，由按人口选出的联盟院与按行政区划选出的民族院构成，经宪法确认为国家唯一的立法机关，拥有制定法律、批准预算、任免最高国家机关成员的权力。其常设机构主席团对外代表国家，主席团主席由加里宁担任。"
 CBIO_SOV_provisional_government_desc:0 "1917年二月革命后建立的俄国临时政府。沙皇尼古拉二世退位后，原国家杜马成员组建临时政府，最初由李沃夫公爵领衔，1917年7月起由克伦斯基出任总理。它与彼得格勒苏维埃并存，形成所谓”两个政权并立“的局面，权力基础始终薄弱。临时政府选择继续参加第一次世界大战，在前线失利与国内经济恶化中迅速失去民心，先后经历四月危机、六月攻势失败、七月事件与科尔尼洛夫事件的冲击。同年十月，布尔什维克发动起义将其推翻，前后存续不足八个月。"
 CBIO_SOV_georgy_zhukov_desc:0 "卫国战争期间苏军最具代表性的统帅，四度荣膺苏联英雄称号。1896年生于卡卢加省一个农民家庭，早年在莫斯科当皮货学徒。第一次世界大战中他在骑兵部队服役，获两枚圣乔治十字勋章；1918年加入红军，参加国内战争，战后在骑兵系统中逐级擢升。1939年，他指挥苏蒙军队在哈拉欣河（诺门坎）合围并重创日本第六军，由此进入最高层视野。1941年1月出任总参谋长，同年7月去职转赴前线。卫国战争期间，他成为最高统帅部最倚重的”救火“将领：先后参与列宁格勒与莫斯科的防御及反攻，协调斯大林格勒的”天王星“反攻，合围33万德军，成为二战转折点。参加库尔斯克会战，指挥1944年白俄罗斯战役与1945年维斯瓦河—奥得河攻势，最终主持柏林战役，并于1945年5月代表苏方接受德国投降，战时任最高副统帅。战后，斯大林忌惮其声望，于1946年将他外调敖德萨、乌拉尔军区。斯大林去世后他复出，1955年任国防部长，1957年再度被免职。1974年病逝。"
 CBIO_SOV_konstantin_rokossovsky_desc:0 "1896年生于华沙（时属俄属波兰），父为波兰人、母为俄国人。第一次世界大战与国内战争期间他在骑兵部队服役，战后任骑兵指挥官。1937年大清洗中，他被控通敌而遭逮捕入狱，受到酷刑，被关押至1940年随清洗松动方获释复职。卫国战争中，他历任要职：莫斯科会战中指挥第十六集团军，斯大林格勒战役中统率顿河方面军完成对德军的合围，并于1943年2月接受保卢斯元帅投降。库尔斯克会战中他负责中央方面军的北线防御。1944年指挥白俄罗斯第一方面军参与”巴格拉季昂“行动，在方案制定中坚持采用两个主要突击方向。战争后期转任白俄罗斯第二方面军，进攻东普鲁士与波美拉尼亚。战后，因其波兰血统，他于1949至1956年出任波兰国防部长并获波兰元帅衔，这一安排出于苏联的政治需要；1956年波兰政局变动后，他被调回苏联。1968年在莫斯科去世。"
 CBIO_SOV_aleksandr_vasilevsky_desc:0 "\"关东军掘墓人\"。二战苏军总参谋长、远东战役总指挥，1943年晋升苏联元帅，两度荣膺苏联英雄称号。1895年生于科斯特罗马省一神父家庭，第一次世界大战期间在俄军服役，十月革命后加入红军，长期任参谋与军事训练职务。1937年大清洗期间被提拔进入总参谋部。1941年任副总参谋长兼作战部部长，莫斯科危急时留守克里姆林宫地下指挥所主持前线协调。1942年接任总参谋长，作为最高统帅部大本营代表协调斯大林格勒、库尔斯克、顿巴斯、克里米亚、白俄罗斯和波罗的海沿岸等重大战役。1945年2月切尔尼亚霍夫斯基阵亡后，他接掌白俄罗斯第三方面军，4月攻克柯尼斯堡。同年7月任远东苏军总司令，8月9日指挥苏军分三路对日本关东军发起总攻，在短期内击溃关东军主力，解放中国东北、北朝鲜及南萨哈林。战时苏军也利用了东北抗联教导旅等提供的情报支援。战后再任总参谋长，1949至1953年任苏联武装力量部部长，1977年病逝。著有回忆录《毕生的事业》。"
 CBIO_SOV_boris_shaposhnikov_desc:0 "1882年生于乌拉尔地区的兹拉托乌斯特，沙俄军队上校、参谋军官出身，1918年加入红军。两次世界大战之间，他多次出任红军总参谋长，是苏联总参谋部建设的主要奠基者之一；所著《军队的大脑》系统阐述了总参谋部在现代战争中的职能，影响深远。1940年晋升苏联元帅。他是少数得到斯大林信任与尊重的高级将领，在1936至1938年大清洗中得以幸免。卫国战争爆发时，他再度执掌总参谋部，主持战争初期的战略部署，后因健康原因于1942年由华西列夫斯基接任，转而负责军事院校与战史工作。1945年3月，他在卫国战争胜利前夕病逝。"
 CBIO_SOV_nikolay_vatutin_desc:0 "1901年生于库尔斯克省一个农民家庭，红军总参谋部出身的将领，战前曾任副总参谋长。卫国战争中，他先后指挥沃罗涅日方面军、西南方面军和乌克兰第一方面军。斯大林格勒战役中，他统率西南方面军参加”天王星“反攻，负责外层合围；库尔斯克会战中负责南线作战。1943年11月，他指挥乌克兰第一方面军收复基辅，随后参与科尔孙—切尔卡瑟战役，合围德军重兵集团。1944年2月，他在视察前线途中遭乌克兰民族主义武装伏击，身负重伤，同年4月不治去世，是卫国战争中阵亡的少数方面军级指挥员之一。"
 CBIO_SOV_ivan_konev_desc:0 "1897年生于沃洛格达地区一个农民家庭，早年以政治委员身份从军，后转为军事指挥员。卫国战争中，他历任西方面军、加里宁方面军、草原方面军司令，在库尔斯克会战中担纲一线，随后指挥乌克兰第二、第一方面军，先后进行科尔孙、利沃夫—桑多梅日、维斯瓦河—奥得河等战役，并参加柏林战役与解放布拉格的作战。1944年2月晋升苏联元帅。在柏林方向的进军中，他与朱可夫一度形成竞争态势，这一安排出自最高统帅部的部署。战后他出任陆军总司令，1955年华沙条约组织成立后任首任武装力量总司令；1956年指挥苏军参与平息匈牙利事件。1973年病逝，是卫国战争后期红军最主要的方面军指挥员之一。"
 CBIO_SOV_semyon_timoshenko_desc:0 "1895年生于比萨拉比亚一个农民家庭，国内战争时期在第一骑兵集团军任职，属布琼尼、伏罗希洛夫一系。1939至1940年苏芬战争后期，他出任前线总指挥，组织突破曼纳海姆防线，战后升任国防人民委员并晋升苏联元帅，主持战前红军的整顿。卫国战争初期，他先后负责西方向和西南方向的作战；1942年春，他指挥的哈尔科夫进攻战役遭遇重大失利，苏军损失惨重。此后他多以最高统帅部代表身份协调各方面军，前线指挥地位有所下降。战后历任军区司令等职。1970年病逝。"
 CBIO_SOV_kliment_voroshilov_desc:0 "1881年生于叶卡捷琳诺斯拉夫一个工人家庭，国内战争时期任第一骑兵集团军政治委员，与斯大林关系密切。1925年起长期出任军事与海军人民委员（后改称国防人民委员），1935年成为苏联首批元帅之一，在政治上对斯大林高度忠诚；1936至1938年大清洗期间，红军大批指挥员遭到清洗，他作为军队主管负有责任。1939至1940年苏芬战争中苏军受挫，他随后被解除国防人民委员职务。卫国战争初期，他负责列宁格勒方向的防御，因战局不利于1941年9月被朱可夫接替，此后多担任礼仪性与协调性职务。1953年至1960年，他出任最高苏维埃主席团主席，为名义上的国家元首，其间于1957年访问中国。1969年病逝。"
 CBIO_SOV_mikhail_tukhachevsky_desc:0 "苏联”纵深作战“理论的主要缔造者，1935年首批苏联元帅之一。1893年生于斯摩棱斯克省一个贵族家庭，第一次世界大战中任军官并曾被俘，1918年加入红军和布尔什维克党。国内战争时期他指挥多个方面军，1920年苏波战争中率部进攻华沙受挫。他是苏联”纵深作战“理论的主要倡导者，主张大规模发展坦克、航空兵和空降兵，推动红军机械化建设。1925年起任红军参谋长，后转任军备与国防副人民委员，1935年晋升苏联元帅。1937年5月，他在大清洗中被诬陷为”军事法西斯阴谋集团“首脑而遭逮捕，受到刑讯，经秘密审判后于同年6月被处决；其案成为红军指挥员遭大规模清洗的开端。1957年，苏联为其平反、恢复名誉。他被公认为这一时期最具才能的军事理论家之一，其遇害对红军战前建设造成严重损失。"
 CBIO_SOV_semyon_budyonny_desc:0 "1883年生于顿河地区一个农民家庭，沙俄军队骑兵士官出身，参加过日俄战争和第一次世界大战。国内战争时期，他创建并指挥第一骑兵集团军，成为红军骑兵的代表性人物，与斯大林、伏罗希洛夫关系密切，1935年成为苏联首批元帅之一。他长期推崇骑兵的作用，对军队机械化持保守态度。卫国战争初期，他出任西南方向总司令，在1941年的基辅战役中苏军遭德军合围，损失极为惨重，他随后被铁木辛哥接替；其后又负责北高加索方向，战局同样不利。此后他主要担任骑兵总监等荣誉性职务，在历次清洗中因对斯大林的忠诚而得以保全。1973年病逝。"
 CBIO_SOV_ivan_chernyakhovsky_desc:0 "1907年生于乌克兰一个贫苦家庭，坦克和机械化部队出身的将领。卫国战争中，他升迁迅速，先后指挥步兵师和第六十集团军，参加库尔斯克会战和收复基辅的作战。1944年，他出任白俄罗斯第三方面军司令，时年仅三十余岁，是红军最年轻的方面军级指挥员。在”巴格拉季昂“行动中，他率部突破德军防线，收复白俄罗斯西部并攻入立陶宛，随后参加东普鲁士战役。1945年2月，他在东普鲁士前线被弹片击中身亡，年仅三十七岁，是卫国战争中阵亡的最高级别指挥员之一。他生前两次获苏联英雄称号。"
 CBIO_SOV_issa_pliyev_desc:0 "苏联大将，卫国战争中骑兵机械化集群指挥的代表人物，两度荣膺苏联英雄称号，获蒙古人民共和国英雄称号。1903年11月生于沙俄帝国捷列克州（今北奥塞梯—阿兰共和国）巴特克村一个奥塞梯族农民家庭，自幼丧父。1922年入红军，1926年毕业于列宁格勒骑兵学校，1933年毕业于伏龙芝军事学院。1936年6月赴外蒙古，任蒙古人民革命军联合军事学校司令部顾问，奠定其后与蒙古的长期关系。1939年9月参加苏军进入西白俄罗斯的行动。卫国战争爆发后，他历任第五十骑兵师师长、近卫骑兵第二军军长、近卫骑兵第三军军长，先后参加莫斯科保卫战、斯大林格勒会战及其大反攻——所部在西南方面军最左翼突破德军防御，形成对斯大林格勒包围圈的西北翼。1944年初编成\"普利耶夫骑兵机械化集群\"，将骑兵的机动性与坦克部队的突击力相结合，先后在乌克兰、白俄罗斯、罗马尼亚和匈牙利方向作战：科尔孙—舍甫琴科夫斯基战役、别列兹涅戈瓦托耶—斯尼吉廖夫卡攻势、敖德萨战役、白俄罗斯会战、雅西—基什尼奥夫战役、布达佩斯第二与第三次攻势均有其参与；1944年4月，他率部迂回截断敖德萨德军陆上退路，因功获第一次苏联英雄称号。1945年初参加布拉迪斯拉发—布尔诺战役与布拉格战役，5月晋升上将。同年8月对日作战中，他指挥外贝加尔方面军的苏蒙骑兵机械化集群，由蒙古人民共和国境内出发，穿越戈壁沙漠与大兴安岭突入中国东北，参加兴安岭—奉天战役，与各路苏军配合围歼日本关东军；所部在艰苦的山地荒漠条件下高速运动作战，9月8日因此获第二次苏联英雄称号。战后历任军区第一副司令等职，1958至1968年任北高加索军区司令。1962年4月晋升苏联大将；同年7月至1963年5月，他出任苏联驻古巴军事顾问组组长（驻古巴苏军最高指挥官），负责\"阿纳德尔行动\"——将R—12中程导弹及战术核武器秘密运抵古巴，引发古巴导弹危机；危机期间苏军在古巴上空击落美军U-2侦察机，赫鲁晓夫密电直接发往他的指挥所，下令撤回R-12导弹。1971年获蒙古人民共和国英雄称号。1979年2月病逝，葬于家乡北奥塞梯。"
 CBIO_SOV_leonid_govorov_desc:0 "1897年生于维亚特卡省，炮兵军官出身，是红军中的炮兵专家。国内战争初期，他曾被征入高尔察克白卫军服役，后转投红军，直至1942年才加入联共（布）。两次世界大战之间，他长期从事炮兵教学与指挥。卫国战争中，他在莫斯科保卫战中指挥第五集团军坚守莫扎伊斯克防线；1942年起出任列宁格勒方面军司令，长期组织该城防御。1943年1月，他指挥所部参与打破对列宁格勒的封锁；1944年初又在列宁格勒—诺夫哥罗德战役中彻底解除该城被围局面，随后实施维堡战役。1944年晋升苏联元帅。战后他主管国土防空，任副国防部长。1955年病逝。"
 CBIO_SOV_grigory_kulik_desc:0 "1890年生于波尔塔瓦省一个农民家庭，炮兵出身。国内战争时期，他在第一骑兵集团军主管炮兵，与斯大林一系关系密切。1937年起出任红军炮兵总局局长，后兼国防副人民委员，1940年晋升苏联元帅。他在军备建设上多持保守甚至错误的判断，对一些新式武器和机械化部队的发展持怀疑态度，曾参与撤销机械化军的决定。卫国战争初期，他被派往列宁格勒和刻赤方向，因刻赤失守等问题受到追究。1942年2月，他经军事法庭审判由元帅降为少将，此后仅任较低职务。战后于1947年被捕，1950年被处决，1957年获平反。"
 CBIO_SOV_kirill_meretskov_desc:0 "\"机灵的雅罗斯拉夫尔人\"。1897年生于梁赞省扎赖斯克县纳扎列沃村一个农民家庭，自幼随父务农；1909年独自赴莫斯科进金属厂当钳工，参加工人夜校与革命活动。1917年加入俄国社会民主工党（布），十月革命中参加夺取地方政权。1918年8月正式加入红军，在喀山战役中身中两弹仍坚持指挥，获红旗勋章；国内战争期间多次负伤，曾在第一骑兵集团军任职。1921年毕业于工农红军军事学院，此后在多个军区任参谋长，参与军事改革。1935年调任红旗远东特别集团军参谋长，与布柳赫尔元帅相处融洽，熟悉远东战备与关东军情况。1936年化名\"彼得洛维奇\"赴西班牙内战，作为军事顾问参与马德里防御，并在1937年初指挥哈马拉河战役和瓜达拉哈拉战役，重创意大利远征军，回国后获列宁勋章。1937年5月任副总参谋长，苏芬战争中指挥第七集团军在维堡方向突破曼纳海姆防线，因功获苏联英雄称号，1940年6月成为苏军首批三名大将之一。1940年8月任总参谋长。1941年6月23日被捕入狱，遭酷刑拷打，9月6日获释复职，成为大清洗后罕见的高级将领平反起用案例。其后历任独立第七集团军、第四集团军司令，组织粉碎季赫温德军、防止列宁格勒被彻底包围；1941年12月起任沃尔霍夫方面军司令，组织柳班战役、\"火花\"行动等多次解围列宁格勒的作战，1944年实施斯维里河—彼得罗扎沃茨克战役，迫使芬兰退出战争，转任卡累利阿方面军司令。同年秋在佩察莫—希尔克内斯攻势中击败德军第二十山地集团军、解放挪威北部，10月26日晋升苏联元帅。1945年因熟悉远东及森林筑垒地区作战，化名\"马克西莫夫上将\"调赴远东，先后任滨海集群和远东第一方面军司令，与华西列夫斯基、安东诺夫共同制定远东战局计划。8月对日作战中，他从正面突破关东军第一方面军永备筑垒地域，一周内向中国东北纵深推进120至150公里，并解放北朝鲜。斯大林惯于戏称他\"机灵的雅罗斯拉夫尔人\"，看重其在军队训练、密林地区进攻与突破筑垒地域方面的经验。1955至1964年任苏联国防部长助理，主管高等军事院校。1968年12月病逝，葬于克里姆林宫红场墓园。著有回忆录《为人民服役》。"
 CBIO_SOV_filipp_golikov_desc:0 "1900年生于维亚特卡省一个农民家庭，早年从事政治工作，后转入军事指挥。1940年7月起任红军情报总局局长，主管对外军事情报。战前他将关于德国即将进攻的多方情报判定为假情报，未予足够重视。卫国战争中，他先后指挥第十集团军、布良斯克方面军和沃罗涅日方面军；1943年初一度收复哈尔科夫，旋又在德军反扑下失守，同年4月被解除方面军指挥职务，转而负责干部管理和战俘遣返事务。战后他长期主持军队政治工作，1961年晋升苏联元帅。1980年病逝。"
 CBIO_SOV_andrey_yeryomenko_desc:0 "1892年生于哈尔科夫省一个农民家庭，骑兵出身，曾在第一骑兵集团军服役。卫国战争中，他先后指挥多个方面军，作战中多次负伤。1942年，他出任斯大林格勒方向的方面军司令，与赫鲁晓夫共同组织该城的防御；在”天王星“反攻中，他指挥斯大林格勒方面军实施南翼突击，与西南方面军在卡拉奇会师，完成对德军第六集团军的合围。此后他转战加里宁、波罗的海沿岸和乌克兰第四方面军等方向，参加解放克里米亚、波罗的海地区和捷克斯洛伐克的作战。战后晋升苏联元帅。1970年病逝。他是卫国战争中负伤较多、长期坚持一线指挥的方面军将领之一。"
 CBIO_SOV_georgy_zakharov_desc:0 "1897年生于萨拉托夫省一个农民家庭，沙俄军队士官出身。卫国战争中，他历任多个方面军的参谋长，并指挥集团军作战，1941至1942年间曾在高加索和克里米亚方向组织防御，又在斯大林格勒方向担任方面军副司令。1944年6月，他出任白俄罗斯第二方面军司令，参加”巴格拉季昂“行动，向莫吉廖夫方向实施进攻。战役后他转回集团军一级任职，继续在前线作战直至战争结束。1957年逝世。"
 CBIO_SOV_yakov_cherevichenko_desc:0 "1894年生于顿河地区一个农民家庭，骑兵出身，曾在第一骑兵集团军服役。卫国战争初期，他指挥第九集团军，后出任南方面军司令；1941年11月，他指挥所部在罗斯托夫方向发起反击，一度收复罗斯托夫，是战争初期苏军为数不多的局部胜利之一。其后他短期担任布良斯克方面军司令，1942年起改任集团军及筑垒地域等较低职务，未再独当方面军一级的指挥。战争后期主要负责后方筑垒和地方部队的组织工作。1976年逝世。"
 CBIO_SOV_maks_reyter_desc:0 "1886年生于拉脱维亚库尔泽梅地区，拉脱维亚人，沙俄军队军官出身，第一次世界大战期间在东线作战。国内战争后他留在红军，长期从事后方与司令部工作。卫国战争中，他于1942至1943年间出任布良斯克方面军司令，1943年初指挥沃罗涅日—卡斯托尔诺耶战役，配合友邻合围德军和匈牙利军队。此后他转任预备队方面军和草原军区等职，并负责军事训练工作。1950年在莫斯科逝世。他属于由旧俄军官转入红军、在卫国战争中担任方面军级指挥的少数族裔将领之一。"
 CBIO_SOV_nikandr_chibisov_desc:0 "1892年生于坦波夫省一个农民家庭，沙俄军队士官出身，参加过第一次世界大战，国内战争时期加入红军。卫国战争中，他先后指挥第三突击集团军、第三十八集团军和近卫第一集团军，参加沃罗涅日方向的防御与反攻作战。1943年下半年，他在强渡第聂伯河的战役中指挥部队夺取登陆场，因功获苏联英雄称号。战争后期及战后，他转入军事院校工作，从事教学与培养军官的事务。1959年逝世。"
 CBIO_SOV_vasily_kuznetsov_desc:0 "1894年生于彼尔姆省一个农民家庭，沙俄军队军官出身。卫国战争爆发时，他指挥第三集团军，在比亚韦斯托克方向被德军合围，率残部徒步突围归队。此后他历任多个集团军司令，在莫斯科会战中指挥第一突击集团军参加反攻，又在斯大林格勒方向指挥近卫第一集团军作战。1945年，他指挥第三突击集团军参加柏林战役，其所部攻入柏林市中心并夺取国会大厦，胜利红旗即由该集团军官兵升起。因战功获苏联英雄称号。1964年逝世。"
 CBIO_SOV_andrey_vlasov_desc:0 "1901年生于下诺夫哥罗德省一个农民家庭。卫国战争初期，他在基辅方向指挥第三十七集团军，又在莫斯科会战中指挥第二十集团军参加反攻，受到表彰。1942年春，他出任沃尔霍夫方面军副司令，并接掌被围困的突击第二集团军；该集团军在柳班地域被德军围歼，他本人于同年7月被俘。被俘后，他投靠纳粹德国，出面组织由苏联战俘和反苏分子拼凑的”俄罗斯解放军“，并于1944年牵头成立”俄罗斯各民族解放委员会“，从事反苏宣传和附敌活动。1945年5月，其残部在布拉格一度反戈，随后他被苏军俘获。1946年8月，他以叛国罪被处决。"
 CBIO_SOV_bronislav_kaminski_desc:0 "1899年生，具有波兰和德意志血统，工程师出身，1930年代曾被关入劳改营。德军占领布良斯克、奥廖尔一带后，他在洛科特地区参与当地附敌政权；沃斯科博伊尼克被击毙后，他接掌大权，组建并指挥附敌的”俄罗斯国民解放军“，充当德军的反游击工具，对当地游击队和居民实施残酷镇压。1944年，该部被编入党卫军序列。同年，他率部参与镇压华沙起义，纵兵抢掠屠杀，暴行累累，连德方亦难以约束，最终于1944年8月被德国人处死。"
 CBIO_SOV_konstantin_voskoboinik_desc:0 "1895年生，早年曾秘密参与反对苏维埃政权的活动。德军占领布良斯克地区后，他在洛科特出面组织附敌的地方自治政权，自任首脑，纠集人员成立武装，并鼓吹一套仿效纳粹的政治主张，公开与占领者合作、对抗游击队。1942年1月，他在苏联游击队的一次袭击中被击毙，其经营的附敌组织随后由卡明斯基接掌。"
 CBIO_SOV_ivan_fedyuninsky_desc:0 "1900年生于一个农民家庭。1939年，他在哈拉欣河（诺门坎）对日作战中表现突出，获苏联英雄称号。卫国战争中，他历任军长和集团军司令，并曾短期代理列宁格勒方面军司令，参与该城最艰难时期的防御。此后他先后指挥第五、第十一集团军和突击第二集团军，参加解除列宁格勒封锁、解放波罗的海沿岸地区以及进攻东普鲁士的一系列作战。战后历任军区司令、副总监等职。1977年逝世。"
 CBIO_SOV_maksim_purkayev_desc:0 "苏联大将，卫国战争中加里宁方面军司令、对日作战中远东第二方面军司令。1894年生于辛比尔斯克省（今莫尔多瓦共和国）纳利托沃村一个农民家庭，莫尔多瓦族人。1915年应征入沙俄军队，毕业于萨拉托夫准尉学校，一战中任炮兵军官；1918年加入红军，参加国内战争，国内战争期间三次负伤，先后任连长、营长、团长。1923年毕业于\"维斯特列尔\"高级步兵进修班，1936年入伏龙芝军事学院深造。1938年任白俄罗斯军区参谋长；1939年苏德互不侵犯条约签订前后出任苏联驻德国武官，赴柏林任职，曾陪同苏联新任驻德大使施克瓦尔采夫向希特勒递交国书，并参与策划苏联入侵波兰的行动。1940年7月任基辅特别军区参谋长。卫国战争爆发后，1941年6至7月任西南方面军参谋长，此后历任第六十集团军司令、第三突击集团军司令；1942至1943年任加里宁方面军司令，参加莫斯科保卫战、热泽夫战役与大卢基战役，主持解放大卢基。1943年4月起调任远东方面军司令，长期负责对日警戒与战备。1944年10月晋升苏联大将。1945年8月对日作战中，他指挥远东第二方面军（下辖五个集团军、二十三个师），在阿穆尔分舰队配合下，从黑龙江沿岸方向强渡黑龙江、乌苏里江，沿松花江南下逼近佳木斯，向哈尔滨与齐齐哈尔推进，截断日军南撤退路，是包围关东军的北线助攻；其方面军还组织实施了南库页岛与千岛群岛登陆作战。1945年9月至1947年1月任远东军区司令，1947年6月起任远东军参谋长兼第一副司令，1952年任苏联国防部高等军事教育机构局长。1953年1月在莫斯科病逝，终年五十八岁。"
 CBIO_SOV_kuzma_galitsky_desc:0 "1897年生。卫国战争中，他历任集团军司令，先后指挥第三突击集团军和近卫第十一集团军，作战中多次负伤。1943年起，他率近卫第十一集团军参加奥廖尔战役和”巴格拉季昂“行动，向东普鲁士方向推进，并在1945年初参加攻克柯尼斯堡的作战，因战功获苏联英雄称号。他长期统率近卫第十一集团军，是该部在卫国战争后期主要战役中的指挥者。战后他继续担任军区等指挥职务。1973年逝世。"
 CBIO_SOV_markian_popov_desc:0 "1902年生。卫国战争爆发时，他出任列宁格勒方向的方面军司令。其后他历任布良斯克方面军、预备队方面军等职，并多次指挥快速集群作战。1943年初，他指挥的快速集群在顿巴斯方向遭德军反击受挫；同年他参加奥廖尔战役，并先后指挥布良斯克方面军和波罗的海沿岸第二方面军。战争期间，他的军衔曾因纪律问题被降级，但仍长期担任要职。战后他出任陆军参谋长等职。1969年逝世。"
 CBIO_SOV_nikolay_berzarin_desc:0 "1904年生。卫国战争中，他先后指挥第二十七、第三十四、第六十一等集团军，参加多个方向的作战。1945年，他率突击第五集团军参加柏林战役，攻入柏林市区。柏林被攻克后，他被任命为苏联驻柏林的首任卫戍司令，负责接管这座残破城市，恢复秩序、组织供应和市政运转。1945年6月，他在柏林市内的一次交通事故中身亡，距战争结束仅一个多月。他在战役中获苏联英雄称号。他主持柏林初期军管的经历，使其成为战后初期苏军占领管理的代表性人物之一。"
 CBIO_SOV_aleksandr_gorbatov_desc:0 "1891年生于一个农民家庭，骑兵出身。1938年大清洗中，他被诬陷逮捕、受到刑讯，发配科雷马劳改营，直至1941年卫国战争爆发后才获释复出。复职后，他指挥军、集团军作战，长期统率第三集团军，参加奥廖尔战役、”巴格拉季昂“行动（收复博布鲁伊斯克）以及柏林战役。他在苏军将领中以爱惜士兵、力戒无谓伤亡而为人所记。1945年6月，他接任柏林卫戍司令，并因战功获苏联英雄称号。1973年逝世。"
 CBIO_SOV_kirill_moskalenko_desc:0 "1902年生，炮兵出身。卫国战争中，他先后指挥第三十八、第四十集团军和坦克第一集团军，参加斯大林格勒、库尔斯克会战，并率部收复基辅，尔后进军喀尔巴阡山一线，参加解放捷克斯洛伐克的作战，两次获苏联英雄称号。战后，他出任莫斯科军区司令；1953年，他是参与逮捕贝利亚行动的主要军方人物之一。1955年晋升苏联元帅，后长期担任军队高级职务。1985年逝世。"
 CBIO_SOV_dmitry_lelyushenko_desc:0 "1901年生。他在苏芬战争中表现突出，于1940年获苏联英雄称号，是较早投身装甲与机械化部队建设的指挥员。卫国战争中，他指挥第五、第三十集团军参加莫斯科会战并负伤，后长期统率近卫坦克部队。1944至1945年，他指挥近卫坦克第四集团军，参加利沃夫—桑多梅日、维斯瓦河—奥得河等战役，并以快速突击攻入柏林南部，最后驰援布拉格。他再次获苏联英雄称号，成为两次荣获该称号的将领之一。战后历任军区司令等职。1987年逝世。"
 CBIO_SOV_andrey_grechko_desc:0 "1903年生于顿河地区一个农民家庭，骑兵出身。卫国战争中，他先后指挥骑兵师、军和多个集团军，参加高加索防御、库班作战、解放乌克兰以及喀尔巴阡山方向的进攻；1944年率部参加东喀尔巴阡战役，策应斯洛伐克民族起义。1955年晋升苏联元帅。战后，他历任驻德苏军集群总司令、陆军总司令，1960年起任华沙条约组织武装力量总司令，1967年出任苏联国防部长，长期主管国防事务，是战后苏联军队的主要领导人之一。1976年逝世。"
 CBIO_SOV_rodion_malinovsky_desc:0 "二战苏军名将，斯大林格勒解围战、雅西—基什尼奥夫战役与远东对日作战的重要指挥官，1944年9月晋升苏联元帅，两次荣膺苏联英雄称号。1898年生于敖德萨贫寒家庭，第一次世界大战中从机枪手做起，后随俄国远征军赴法国作战，并在法国外籍兵团服役至战争结束。1919年回国加入红军，参加国内战争，后毕业于伏龙芝军事学院。1937至1938年化名\"马利诺\"参加西班牙内战。卫国战争中，他在斯大林格勒战役收尾阶段指挥近卫第二集团军，挫败曼施坦因\"冬季风暴\"解围企图；1943年后先后任西南、乌克兰第三、乌克兰第二方面军司令，主持解放敖德萨、雅西—基什尼奥夫包围战、布达佩斯战役与维也纳战役。1945年7月调任外贝加尔方面军司令，对日作战中担任主攻方向，所部近卫坦克第六集团军翻越大兴安岭直插关东军腹心，协同整个远东战役迅速击溃关东军，并在奉天机场俘获溥仪。战后历任远东军区司令、苏联陆军总司令，1957年继朱可夫后出任苏联国防部长。1964年十月革命招待会上，他对中国代表团提出推翻毛泽东的言论，引发中方抗议，苏方随后道歉。1967年在莫斯科病逝。"
 CBIO_SOV_vasily_chuykov_desc:0 "斯大林格勒保卫战指挥官，与中国渊源颇深。1900年生于一个农民家庭。毕业于伏龙芝军事学院东方系，在校期间专修汉语；1926年首度赴华考察，1927年毕业后又赴国民革命军部队工作。1941年2月，因熟悉中国且通晓汉语，斯大林再度委其出使，担任苏联驻华军事顾问团总顾问，至1942年2月。在华期间，他广泛收集中日情报，研判日本南进太平洋的可能性大于北上进攻苏联，及时向莫斯科报告；1941年9月第二次长沙会战中，他建议中国军队进击宜昌以解长沙之围，建议被采纳并奏效。回国后，1942年9月接掌斯大林格勒第六十二集团军，在实战中发展出\"贴近\"战术——将防线死死贴紧德军阵地，使敌方航空兵和炮兵无法在城内大规模轰炸——率部在废墟间与德军逐屋逐街争夺长达数月，直至\"天王星\"行动将敌主力围歼。此后集团军改称近卫第八集团军，他转战乌克兰、白俄罗斯，参加\"巴格拉季昂\"行动和维斯瓦河—奥得河战役，1945年柏林战役中率部攻入市区中心，德军柏林守备部队最终向其指挥所提出投降。两度荣获苏联英雄称号。战后历任驻德苏军集群总司令、陆军总司令，1955年晋升苏联元帅。1982年逝世，遵其遗愿安葬于斯大林格勒（今伏尔加格勒）马马耶夫岗，与牺牲的斯大林格勒战士长眠一处。著有《在华使命》等回忆录。"
 CBIO_SOV_aleksandr_cherepanov_desc:0 "1895年生，沙俄军队军官出身，黄埔军校首席军事顾问，与中国渊源颇深：1923年，他作为苏联派赴中国的第一批五名军事顾问之一抵达广州，孙中山亲自接见并将其委任为黄埔军校军事顾问，参与学校筹建与教学方案制订，在中国被称为\"蔡顾问\"。总顾问巴甫洛夫抵华后调整分工，他出任黄埔军校首席军事顾问。第一次东征中，他在攻打淡水城时亲冒弹雨、到城墙下向战士示范搭人梯的方法，使部队得以破城，留下广为传颂的一幕。北伐期间，他出任东路军苏联总顾问，协助何应钦制定闽粤边界及福建方向的作战计划，歼灭了孙传芳在福建的主力；加伦将军专门为此为他呈报红旗勋章。1927年四一二政变后取道上海回国。1938年，他再度赴华担任苏联驻华军事顾问团总顾问，参与制定武汉会战的作战计划，1939年回国。卫国战争中指挥集团军作战，晋升中将；1944年秋出任同盟国驻保加利亚管制委员会副主席。战后任苏中友协副主席，与中国结缘前后长达数十年。1956年再次来华，参加纪念孙中山诞辰九十周年活动，毛泽东等中央领导亲切接见了他。晚年著有《驻中国军事顾问札记》等多部回忆录。1984年逝世，终年八十八岁。"
 CBIO_SOV_filipp_oktyabrsky_desc:0 "1899年生，海军军官出身，1939年起出任黑海舰队司令。卫国战争初期，他指挥黑海舰队参加敖德萨和塞瓦斯托波尔的防御，统一指挥塞瓦斯托波尔要塞长达八个月的坚守。1942年夏该城最终失陷之际，他奉命撤离，未能将守军一并撤出，这一处置后来引起争议。此后他一度调任阿穆尔河区舰队，1944年又复任黑海舰队司令，参加解放克里米亚的作战。战后他继续在海军任职，并获苏联英雄称号。1969年逝世。他长期主持黑海舰队，是苏联南方海上方向的主要指挥员之一。"
 CBIO_SOV_sergey_gorshkov_desc:0 "1910年生，海军军官出身。卫国战争中，他先后指挥亚速海区舰队和多瑙河区舰队，并在黑海方向组织登陆与濒海支援作战，配合陆军在高加索和南乌克兰的行动。战后，他是苏联现代海军的主要缔造者：1956年起出任苏联海军总司令，任职近三十年，主持建设以导弹舰艇和核潜艇为骨干的远洋舰队，使苏联海军由近海力量发展为全球性海上力量。他还在海军战略理论方面多有论述，提出”国家海上实力“的系统主张。1988年逝世。"
 CBIO_SOV_gordey_levchenko_desc:0 "1897年生，乌克兰人，海军军官出身，曾任海军副人民委员。1941年，他受命负责克里米亚和刻赤方向的防御；刻赤失守后，他被追究责任，经军事法庭审判降级使用，转任较低职务。此后他在波罗的海方向和喀琅施塔得等地继续服役，逐步恢复职务，后再度出任海军副部长。卫国战争期间，他参与了波罗的海舰队的作战指挥。战后他继续在海军任职。1981年逝世。"
 CBIO_SOV_arseny_golovko_desc:0 "1906年生，海军军官出身。1940年，他出任北方舰队司令，是当时最年轻的舰队司令之一，并在整个卫国战争期间领导这支舰队。北方舰队的主要任务是保障北冰洋航线的安全，掩护经摩尔曼斯克、阿尔汉格尔斯克输入的盟国援助物资，并在巴伦支海与德国潜艇和水面舰艇周旋。战后，他历任海军参谋长、海军副总司令和波罗的海舰队司令等职。1962年逝世。他长期主持北方舰队，是苏联北方海上方向作战的主要指挥员。"
 CBIO_SOV_vladimir_kasatonov_desc:0 "1910年生，海军军官出身，早年主要从事潜艇与司令部工作。卫国战争期间，他在舰队司令部任职，参与作战的组织指挥。其主要建树在战后：他先后出任黑海舰队、北方舰队司令，并长期担任苏联海军第一副总司令，是推动苏联海军向核潜艇与远洋导弹舰艇转型的重要人物之一，参与了战后舰队的现代化建设，跻身海军最高将领之列。1989年逝世。"
 CBIO_SOV_stepan_krasovsky_desc:0 "1897年生，苏联空军指挥员。卫国战争中，他先后指挥空军第十七、第二集团军，在斯大林格勒、库尔斯克会战中组织航空兵的掩护与支援；其后随乌克兰第一方面军参加解放基辅、利沃夫—桑多梅日、维斯瓦河—奥得河等战役，并参加柏林战役与解放布拉格的空中作战。战后，他长期从事空军院校的教学与领导工作，主持加加林空军学院。1959年晋升空军元帅。1983年逝世。"
 CBIO_SOV_vladimir_tributs_desc:0 "1900年生，海军军官出身。1939年起出任波罗的海舰队司令，并在整个卫国战争期间领导该舰队。1941年8月，他奉命组织舰队主力由塔林向喀琅施塔得突围，途中遭德军飞机和水雷的猛烈攻击，损失大量舰船和人员，是苏联海军战争初期的一次重大损失。此后他指挥波罗的海舰队参加列宁格勒的防御，以舰炮、岸防火力和海军步兵支援陆上作战，并在战争后期参加解放波罗的海沿岸的行动。战后他转入海军院校与科研工作，著有海战史著作。1977年逝世。"
 CBIO_SOV_sergey_khudyakov_desc:0 "1902年生，亚美尼亚人，本名阿尔梅纳克·汉费良茨；国内战争中，他为纪念一位牺牲的战友而改用”谢尔盖·胡佳科夫“之名，此后终身沿用。卫国战争中，他先后担任方面军空军司令、空军参谋长，参与斯大林格勒、库尔斯克等会战中航空兵的组织指挥，1944年起任空军第十二集团军司令，并作为苏联空军代表出席雅尔塔会议，同年晋升空军元帅。1945年12月，他在战争结束后不久被捕，以间谍等罪名于1950年被处决，1954年获平反、恢复名誉。"
 CBIO_SOV_konstantin_vershinin_desc:0 "1900年生，农民家庭出身。卫国战争中，他长期指挥空军第四集团军，参加高加索防御；1943年在库班上空的大规模空战中组织航空兵夺取制空权，其后随部队转战白俄罗斯、东普鲁士等方向。战后，他两度出任苏联空军总司令（1946—1949年、1957—1969年），主持空军与国土防空的建设。1959年晋升空军主帅。1973年逝世。"
 CBIO_SOV_sergey_rudenko_desc:0 "1904年生。卫国战争中，他长期指挥空军第十六集团军，与罗科索夫斯基指挥的方面军协同作战，先后参加斯大林格勒、库尔斯克会战、”巴格拉季昂“行动以及柏林战役；柏林上空的航空作战主要由该集团军承担。战后，他历任远程航空兵司令、空军第一副总司令等职，参与战后航空兵的建设。1955年晋升空军主帅。1990年逝世。"
 CBIO_SOV_ivan_yumashev_desc:0 "1895年生，海军军官出身。1939年起出任太平洋舰队司令。1945年8月对日作战中，他指挥太平洋舰队配合陆军攻势，组织了对朝鲜北部港口、南萨哈林（库页岛南部）和千岛群岛的两栖登陆作战，夺取日军控制的沿海要地。战后，他于1947年至1951年出任海军部长。他生前为海军上将。1972年逝世。"
 CBIO_SOV_nikolay_kuznetsov_desc:0 "1904年生，海军军官出身，曾作为军事顾问参加西班牙内战。1939年，他出任海军人民委员，是当时最年轻的海军主官，着力推动舰队建设与战备。1941年6月德国进攻前夕，他下令各舰队进入战斗戒备状态，使苏联海军在开战首日几乎未损失舰船，这一决断在苏联海军史上获得很高评价。卫国战争期间，他统一领导各舰队的作战。战后，他与斯大林关系紧张，1948年经审查被降为少将，后于1951年复任海军主官；1956年又因故被解职、降衔。1988年，苏联恢复其苏联海军元帅军衔。他著有多部回忆录。1974年逝世。"
 CBIO_SOV_yakov_smushkevich_desc:0 "1902年生，苏联早期航空兵的代表性指挥员。西班牙内战期间，他以化名”杜格拉斯将军“指挥苏联援西航空兵，因功获苏联英雄称号；1939年，他又在哈拉欣河（诺门坎）对日作战中组织航空兵作战，再获苏联英雄称号，是最早两次获此称号者之一。其后他出任苏联空军总监、空军主管。1941年6月，他在大清洗的新一波打击中被捕，同年10月被处决，1954年获平反、恢复名誉。"
 CBIO_SOV_pavel_rychagov_desc:0 "1911年1月生于莫斯科郊外农村，1928年入伍，从飞行学校毕业后成为战斗机飞行员。1936年作为首批苏联志愿飞行员赴西班牙内战，化名\"帕布罗·帕兰卡尔\"，指挥I-15歼击机中队驻防马德里上空。在西班牙数月间，他亲自击落多架敌机，所部前后取得四十次空战胜利；因功于1936年12月获苏联英雄称号，并获列宁勋章，时年仅二十五岁。1938年率第二批苏联志愿航空队赴华参加抗日战争，2月组织指挥苏中机队远程奔袭台湾松山日军航空基地，重创地面机群。1939年至1940年苏芬战争中任第九集团军空军司令，1940年8月接替斯穆什克维奇出任苏联空军总监，年仅二十九岁。1941年4月初，他在最高统帅部会议上对斯大林直言：\"您是在拿棺材让我们飞。\"——指空军事故频发、飞机质量低劣——此语激怒斯大林，他随即被撤去空军总监职务。同年5月一架德国Ju-52运输机未经拦截径直降落莫斯科，空军高层遭大规模逮捕；6月24日德军入侵两天后他亦被捕，10月28日与同样身为空军少校的妻子玛丽亚·涅斯捷连科一同在古比雪夫（今萨马拉）被处决，年仅三十岁。1954年获平反昭雪。"
 CBIO_SOV_aleksandr_golovanov_desc:0 "1904年生，早年是民用航空的飞行员，以擅长远程飞行和复杂气象条件下飞行著称。卫国战争中，他受命组建并指挥远程航空兵（即战略轰炸力量），自1942年起统一指挥这支部队，多次对德国后方目标实施远程空袭，包括对柏林的轰炸。他在战争期间由中级军官迅速晋升至空军主帅。战后他逐渐失去重用，转任他职。1975年逝世。"
 CBIO_SOV_mikhail_frinovsky_desc:0 "1898年生，长期在保卫机关（契卡—国家政治保卫总局—内务人民委员部）任职。1936至1938年大清洗期间，他是叶若夫的第一副手，主管国家安全总局，是这场镇压的主要组织和执行者之一，参与签署大批处决名单、操办公开审判，对肃反扩大化负有直接责任。1938年，他被调任海军人民委员，尽管并无海军经历。随着叶若夫一派垮台，他于1939年被捕，1940年被处决，未获平反。"
 CBIO_SOV_pavel_zhigarev_desc:0 "1900年生。卫国战争爆发时，他继雷恰戈夫被捕之后出任苏联空军总监，主持开战初期的航空兵作战；1942年起调任远东，先后指挥空军第十集团军和远东方向的航空兵。1945年8月对日作战中，他统一指挥远东苏军的航空兵，支援各路地面部队进攻中国东北。战后，他于1949年至1957年出任苏联空军总司令，并晋升空军主帅。1963年逝世。"
 CBIO_SOV_pyotr_smirnov_desc:0 "1897年生，长期从事军队政治工作，1937年接任红军政治部主任，是当时军队政治系统的主要负责人之一。同年12月，苏联将海军单独设立海军人民委员部，他转任首任海军人民委员，主管海军的政治与组织事务。然而任职仅数月，他便在大清洗中于1938年被捕，1939年初被处决，后获平反、恢复名誉。"
 CBIO_SOV_aleksandr_yegorov_desc:0 "1883年生，沙俄军队军官出身。国内战争时期，他指挥南方面军重创邓尼金的白军，又在1920年苏波战争中指挥西南方面军，斯大林任该方面军军事委员。1931年起，他出任红军参谋长，1935年成为苏联首批五位元帅之一，后任国防副人民委员。1938年，他在大清洗中被捕，1939年初被处决，1956年获平反、恢复名誉。在1935年获衔的五位苏联元帅中，他与图哈切夫斯基、布留赫尔均于大清洗中遇害。"
 CBIO_SOV_vasily_blyukher_desc:0 "苏联首批五大元帅之一，曾出任中国国民革命军首席军事顾问。1890年生于雅罗斯拉夫尔省一个农民家庭，早年参加革命运动，国内战争中屡建战功，1918年成为苏维埃共和国第一位红旗勋章获得者。1924年10月，他以妻子名字谐音化名\"加伦\"秘密赴华，出任广州国民政府首席军事顾问，参与黄埔军校建设，主导东征陈炯明的战役决策；1926年再度来华，制定\"先湖广、后江浙\"的北伐总战略，亲赴前线与蒋介石同车指挥，北伐军连克长沙、武汉、南昌，\"加伦将军\"之名由此广为流传。1927年四一二政变后，他拒绝协助蒋介石，化装成外轮水手秘密回国，获授第四枚红旗勋章。回国后出任远东特别集团军司令，1929年中东路事件中指挥苏军迅速击败张学良东北军。1935年与布琼尼、伏罗希洛夫、图哈切夫斯基、叶戈罗夫同批授衔，成为苏联首批元帅之一，此后长期主持远东防务。1938年在肃反扩大化中被捕，遭严刑拷打，拒绝签署伪造供词，18天后于当年11月9日在羁押中身亡，官方始终未公布其死讯。1956年获平反昭雪。叶剑英元帅1957年访苏曾挥笔写下诗篇：\"不见加伦三十年，东征北伐费支援。我来伯力多怀旧，欲到红河认爪痕。\""
 CBIO_SOV_aleksandr_novikov_desc:0 "1900年生。卫国战争期间，他于1942年出任苏联空军总司令，主持将航空兵整编为若干空军集团军，并作为最高统帅部的航空兵代表，统一协调斯大林格勒、库尔斯克、白俄罗斯和柏林等重大战役的空中作战。他是苏联首位空军主帅，两次获苏联英雄称号。战争结束后，他在1946年的”航空案“中被捕入狱，受到刑讯，1953年斯大林去世后获释，并恢复名誉。1976年逝世。"
 CBIO_SOV_vitaly_primakov_desc:0 "1897年生于切尔尼戈夫省一个乡村教师家庭。十月革命后参加红军，1917年12月奉全俄中央执行委员会之命赴乌克兰，组建赤色哥萨克骑兵第一团，在其指挥下扩编为师和军；参加反对佩特留拉、邓尼金及波兰白军的作战，又在彼烈科普同弗兰格尔交战，三获红旗勋章。1924年5月任列宁格勒高等骑兵学校校长兼政委。1925年初奉派来华，出任驻冯玉祥国民军的苏联张家口顾问团副总顾问，在素有\"北方黄埔军校\"之称的西北陆军干部学校任教官，并为冯玉祥起草建立骑兵部队的方案。1926年1月，冯玉祥在直奉夹击下决定\"下野\"赴苏，由他陪同；5月9日两人抵达莫斯科。当年9月冯玉祥返华前，曾请求苏方派他再度出任军事总顾问，因他已另有任命未果。1927年转任驻阿富汗武官，1929年化名\"拉吉布别伊\"乔装为土耳其军官，率苏军秘密进入阿富汗，协助被推翻的阿曼努拉汗试图复位，行动最终失败；1930年转任驻日武官。回国后历任第十三步兵军军长，北高加索、列宁格勒军区副司令，并主持红军游击战学校。1936年8月14日在肃反扩大化中被捕，被诬以\"托洛茨基反苏军事组织\"罪名；1937年6月11日与图哈切夫斯基、亚基尔等八人同案受审，翌日被处决，年四十岁。1957年获平反昭雪。著有以化名\"根里·阿连\"发表的《冯玉祥与国民军——一个志愿兵的札记》，1930年初版于列宁格勒，是该时期苏联援华工作的重要回忆录。"
 CBIO_SOV_vasily_korzh_desc:0 "1899年生，白俄罗斯人。1930年代，他曾参加西班牙内战，从事游击作战方面的工作，积累了敌后斗争经验。卫国战争爆发后，他在白俄罗斯的平斯克地区组建起最早的一批游击队之一，并长期指挥当地的游击兵团，在德军后方开展破袭和作战。1944年，他因功获苏联英雄称号，军衔为少将。战后他回到白俄罗斯从事地方与农业工作。1967年逝世。"
 CBIO_SOV_sidor_kovpak_desc:0 "1887年生，乌克兰人，国内战争时期即参加过红军游击斗争。卫国战争中，他领导苏梅地区的游击兵团，以长途奔袭、深入德军后方作战著称；1943年，他率部进行著名的喀尔巴阡远征，转战乌克兰腹地，破坏德军交通和后方设施。他两次获苏联英雄称号，军衔为少将，并著有记述敌后远征的回忆录。战后他在苏联乌克兰担任地方领导职务。1967年逝世。"
 CBIO_SOV_lev_dovator_desc:0 "1903年生，白俄罗斯人，骑兵指挥员。卫国战争初期，他率骑兵部队多次深入德军后方实施袭扰，1941年在斯摩棱斯克方向的敌后奔袭中给德军造成相当损失。莫斯科会战期间，他指挥骑兵军参加防御与反击作战。1941年12月19日，他在莫斯科近郊的战斗中阵亡，被追授苏联英雄称号，时年三十八岁。"
 CBIO_SOV_pavel_rybalko_desc:0 "1894年生。卫国战争中，他是苏军主要的坦克兵指挥员之一，长期统率近卫坦克第三集团军。1943年起，他率部参加库尔斯克会战、收复基辅、利沃夫—桑多梅日和维斯瓦河—奥得河等战役，并在柏林战役中由南面突入市区，最后驰援布拉格。他两次获苏联英雄称号，1945年晋升装甲坦克兵元帅。战后他出任苏军装甲坦克和机械化兵主官。1948年逝世。"
 CBIO_SOV_anton_denikin_desc:0 "1872年生，沙俄军队将领，第一次世界大战中升任高级指挥官。国内战争时期，他出任南俄武装力量总司令，统领南方战线的白军；1919年指挥白军向莫斯科方向发动大规模进攻，一度推进至奥廖尔，随后被红军击退，余部退守南方，他将指挥权移交弗兰格尔后流亡国外。此后他长期侨居法国、美国，从事写作。第二次世界大战期间，尽管他始终反对苏维埃政权，却拒绝与纳粹德国合作，公开反对德国对苏联的入侵，并与附敌的白俄分子划清界限。1947年在美国去世，2005年其遗骸被迁葬莫斯科。"
 CBIO_SOV_pyotr_krasnov_desc:0 "1869年生，顿河哥萨克出身的沙俄军队将领，也是一位多产的作家。国内战争时期，他当选顿河哥萨克阿塔曼（首领），依托德国的支持组建顿河军，与红军作战；失败后流亡欧洲，继续从事反苏活动和写作。第二次世界大战期间，他公开投靠纳粹德国，出任德方扶植的哥萨克武装的首脑，招募哥萨克人替德军作战、对抗苏联。战争结束时，他被引渡交予苏联，1947年1月以叛国罪在莫斯科被处决。"
 CBIO_SOV_konstantin_nechayev_desc:0 "1883年生，白军军官出身。国内战争失败后流亡，1920年代他率领一支白俄雇佣武装进入中国，受雇于盘踞山东的军阀张宗昌，参与中国的军阀混战，以装甲列车和雇佣兵部队著称。此后他长期居于中国东北。日本占领东北、扶植伪满洲国期间，他与当地附敌的白俄组织相往来。1945年苏军进入东北后，他被苏方拘捕，1946年被处决。"
 CBIO_SOV_vladimir_kosmin_desc:0 "沙俄军队军官出身，内战期间在白军服役，此后撤入哈尔滨。1931年，他以少将军衔出任新成立的全俄法西斯党首任主席；罗扎耶夫斯基随后担任总书记，掌握实际领导权，科斯明退居名义职位。1932年夏，他在日方支持下组建两支各数百人的白俄武装，日本关东军随即将其并入麾下。"
 CBIO_SOV_aleksandr_rodzyanko_desc:0 "1879年生，沙俄军队骑兵军官出身，是国家杜马主席米哈伊尔·罗兹扬科的侄子。国内战争时期，他在西北方向作战，曾任西北白军的主要指挥官，1919年参与尤登尼奇所部向彼得格勒的进攻；进攻失败后，他流亡国外。此后他长期侨居美国，著有回忆录。1970年在美国去世。"
 CBIO_SOV_andrey_shkuro_desc:0 "1887年生，库班哥萨克出身的骑兵军官。国内战争时期，他在邓尼金麾下指挥哥萨克骑兵，组建以”狼“为标志的部队，作战凶悍而以劫掠闻名。白军失败后他流亡欧洲。第二次世界大战期间，他投靠纳粹德国，参与德方组织的哥萨克附敌武装，并被授予党卫军军衔，参加对游击队的镇压。战争结束时，他被引渡交予苏联，1947年1月以叛国罪在莫斯科被处决。"
 CBIO_SOV_mikhail_kalinin_desc:0 "1875年生于一个农民家庭，早年是工人和职业革命者。革命后他长期担任苏联名义上的国家元首：先后任全俄、苏联中央执行委员会主席，1938年起任最高苏维埃主席团主席，直至1946年。由于出身工农、形象朴实，他被民间称为”全苏维埃的老大爷“，常被用作工农政权的象征，但实际权力掌握在斯大林和政治局手中。作为政治局成员，他在名义上签署了包括镇压在内的诸多决议。1938年大清洗期间，他的妻子被捕并被关入劳改营，他未能加以保护。1946年逝世，加里宁格勒以其名字命名。"
 CBIO_SOV_nikita_khrushchyov_desc:0 "斯大林继任者。1894年生于一个矿工家庭，早年当过钳工，后投身革命与党务工作。1930年代他在党内迅速上升，主持莫斯科市的党组织，1938年起任乌克兰共产党第一书记；在此期间，他作为地方党首参与执行了当地的肃反镇压。卫国战争中，他以军事委员会委员的身份在多个方面军任职，参与了斯大林格勒、库尔斯克和解放乌克兰等方向的工作。斯大林去世后，他成为苏联的主要领导人，推行批判斯大林的政策。在其主政期间，中苏两党两国关系逐步走向破裂。1971年逝世。"
 CBIO_SOV_nikolay_voznesensky_desc:0 "1903年生，经济学家出身。1938年起出任国家计划委员会（国家计委）主席，主管国民经济计划。卫国战争期间，他是国防委员会成员，主持战时经济的转轨和工业向东部的疏散，对支撑战争生产发挥了重要作用，并著有《卫国战争时期的苏联经济》一书。战后，他跻身政治局，并任部长会议副主席。1949年，他在”列宁格勒案“中受牵连被捕，1950年10月被处决，1954年获平反、恢复名誉。"
 CBIO_SOV_lazar_kaganovich_desc:0 "1893年生，斯大林的亲密助手，苏联工业化与农业集体化的主要推行者。1930年代，他先后主管多个部门，以手段强硬著称，深度参与了农业集体化和大清洗，对乌克兰等地征粮造成的严重后果负有责任。他长期主管铁路交通，并主持修建莫斯科地铁，该地铁一度以其名字命名。卫国战争期间，他是国防委员会成员，负责铁路运输的组织保障。斯大林去世后，他在1957年因参与反对赫鲁晓夫的活动而被解除领导职务、逐出权力核心，此后长期赋闲。1991年逝世，终年九十七岁。"
 CBIO_SOV_genrikh_yagoda_desc:0 "1891年生，药剂师出身。1934年，他出任内务人民委员，统管国家安全和劳改系统。在任期间，他主持了大清洗初期的镇压：操办1936年针对季诺维也夫、加米涅夫的第一次莫斯科审判，并以强制劳动修建白海—波罗的海运河等工程，劳改营规模在其手中大幅扩张。1936年，他被叶若夫取代。次年他本人被捕，1938年与布哈林等同案受审，以反苏阴谋等罪名被处决。"
 CBIO_SOV_nikolay_yezhov_desc:0 "1895年生。苏联内务人民委员部首脑，是斯大林苏联肃反运动计划的主要执行者之一。1927年前后，叶若夫被调入联共（布）中央组织分配部门任职，逐步参与干部审查和组织工作。1934年， 苏联共产党（布尔什维克）第十七次代表大会叶若夫成为中央委员。两年后成为中央书记处书记、检查委员会主席，后受斯大林赏识进入内务部。从1936年到1937年在大清洗运动中，叶若夫主持下内务部逮捕了150万人，并处决了其中的半数。1940年2月4日被处决，当时6岁的养女娜塔莉亚活了下来。1998年，他的养女娜塔莉亚要求为叶若夫平反，但俄罗斯最高军事法庭未予许可。"
 CBIO_SOV_lavrenty_beriya_desc:0 "1899年生，格鲁吉亚人。1938年底，他接掌内务人民委员部，结束了叶若夫时期的大规模处决，但继续主管庞大的国家安全和劳改体系。1940年，他签署了对波兰战俘的处决方案（即卡廷事件）；卫国战争期间，他负责后方安全与反间谍工作，并主持了对车臣、克里米亚鞑靼等多个民族的强制迁徙。战争后期起，他还领导苏联的原子弹研制工程，该工程于1949年成功试爆。他官至苏联元帅，跻身最高决策层。斯大林去世后，他一度权倾一时，旋即在1953年6月被其他领导人发动的行动逮捕，同年12月被处决。"
 CBIO_SOV_vsevolod_merkulov_desc:0 "1895年生，是贝利亚的格鲁吉亚旧部和亲信。1943年，国家安全事务从内务人民委员部分出，他出任国家安全人民委员，主管对内镇压与对外反间谍，参与了包括卡廷事件在内的多项行动。战后他一度被调离安全系统。1953年，随着贝利亚集团垮台，他作为其核心成员被捕，同年12月被处决，未获平反。"
 CBIO_SOV_vyacheslav_molotov_desc:0 "1890年生，老布尔什维克，斯大林的长期助手。1930年至1941年间，他担任人民委员会主席（政府首脑），其后出任外交人民委员（外长）。1939年，他代表苏联与纳粹德国签订互不侵犯条约及其秘密议定书。卫国战争期间，他主持对外交涉，参与了与英美的结盟以及德黑兰、雅尔塔、波茨坦等盟国会议和联合国的筹建。他在谈判中以态度强硬、寸步不让著称，被冠以”石头屁股“的绰号；芬兰人则把一种燃烧瓶讥称为”莫洛托夫鸡尾酒“。他对大清洗负有责任，曾签署处决名单。斯大林去世后，他因参与反对赫鲁晓夫的活动而失势，被调离权力核心。1986年逝世，终年九十六岁。"
 CBIO_SOV_maksim_litvinov_desc:0 "1876年生。1930年起，他出任外交人民委员，在1930年代力主”集体安全“政策，主张联合英法等国共同遏制法西斯，并积极利用国际联盟的舞台。1939年5月，在苏联谋求与纳粹德国接近的背景下，他被解职，外长一职由莫洛托夫接任，随后苏德签订了互不侵犯条约。卫国战争期间，他出任苏联驻美国大使，为争取美国的援助与盟国合作奔走。此后他逐渐淡出。他在大清洗中得以幸免。1951年逝世。"
 CBIO_SOV_lev_trotsky_desc:0 "1879年生。他是十月革命的主要领导人，国内战争时期创建并指挥红军，任军事人民委员。列宁逝世后，他在党内权力斗争中败于斯大林，成为”左翼反对派“的领袖。1927年他被开除出党，1929年被驱逐出境。流亡期间，他辗转土耳其、法国、挪威，最终定居墨西哥，是斯大林及其体制最主要的批判者，撰有大量著作，并于1938年发起成立第四国际。莫斯科审判将他缺席判定为各种阴谋的总后台。他所代表的”托洛茨基主义“被苏联和各国共产党斥为反党路线。1940年8月，他在墨西哥寓所被苏联特工用冰镐袭击身亡。"
 CBIO_SOV_ivan_smirnov_desc:0 "1881年生，老布尔什维克。国内战争时期，他在东线领导对高尔察克白军的作战，因在西伯利亚战场的功绩而知名，曾被称为”西伯利亚的列宁“。革命后他担任过邮电人民委员等职。1920年代，他属于”左翼反对派“，几度被开除、悔过又再遭清算。1936年8月，他作为第一次莫斯科审判的主要被告受审，与季诺维也夫、加米涅夫等同案，被处决，后于1988年获平反。"
 CBIO_SOV_ivar_smilga_desc:0 "1892年生，拉脱维亚人，老布尔什维克。1917年他在波罗的海舰队和芬兰一带从事布尔什维克的组织工作，国内战争时期任革命军事委员会委员等政治职务。他还长期从事经济工作，曾任国家计委的领导职务。1920年代，他参加”左翼反对派“，1927年被开除出党，流放后一度悔过。1930年代他再遭逮捕，1937年被处决，后获平反。"
 CBIO_SOV_karl_radek_desc:0 "1885年生，苏联政治活动家，共产主义宣传家，以善作政治讽刺著称，大量辛辣笑话在党内以其名义流传。生于利沃夫。曾在克拉科夫大学和伯尔尼大学学习。20世纪初参加波兰社会民主党，长期从事加利西亚波兰和德国的社会民主主义运动。1917年加入俄国社会民主工党（布）。第一次世界大战期间持国际主义立场。十月革命后，曾在外交人民委员会中工作。1920年至1924年担任共产国际执行委员会书记、委员和主席团委员。1919年当选为党中央委员，任至1924年前后。是托洛茨基反对派的重要成员，1927年因此被开除出党。1929年恢复党籍。1936年再次被开除出党。1937年以“间谍罪”被判10年徒刑。死于1939年5月19日。1988年恢复名誉。"
 CBIO_SOV_yevgeny_preobrazhensky_desc:0 "1886年生，老布尔什维克，经济学家。革命后他活跃于党的理论工作，与布哈林合著《共产主义ABC》，是早期苏俄流传甚广的通俗读物。在1920年代的工业化论战中，他提出”社会主义原始积累“的主张，认为应通过从农民那里汲取资源来为工业化筹集资金。他是”左翼反对派“的重要成员，1927年被开除出党，几度悔过又再遭清算。1937年他在大清洗中被处决，后于1988年获平反。"
 CBIO_SOV_aleksandr_shlyapnikov_desc:0 "1885年生，金属工人出身，老布尔什维克，早年长期从事工人运动。1917年革命后，他出任首任劳动人民委员。1920至1921年间，他是”工人反对派“的领袖，反对党和工会的官僚化，主张由工会管理工业，这一主张在1921年党的第十次代表大会上受到列宁的批判。此后他逐渐被边缘化。1930年代他遭逮捕，1937年被处决，后于1988年获平反。"
 CBIO_SOV_nikolay_bukharin_desc:0 "1888年生，是布尔什维克党内重要的理论家，列宁在遗嘱中称他为”全党的宠儿“和党内最大的理论家。他长期主编《真理报》，担任过共产国际的领导职务，并与人合著《共产主义ABC》。1920年代，他是温和路线的主要代表，支持新经济政策，主张同农民结成联盟；他先是与斯大林联手打击托洛茨基等左派，随后在斯大林转向强制集体化时，成为”右倾反对派“的领袖。论战失败后他被迫检讨，并参与起草1936年宪法。1937年他被捕，次年作为第三次莫斯科审判的主要被告受审，被处决，后于1988年获平反。"
 CBIO_SOV_aleksey_rykov_desc:0 "1881年生，老布尔什维克。1924年列宁逝世后，他接任人民委员会主席，成为苏联政府首脑，任职至1930年。在党内斗争中，他与布哈林、托姆斯基同属”右倾反对派“，反对强制推行农业集体化。1930年他被解除政府首脑职务，由莫洛托夫接任，其后被迫检讨，并改任邮电人民委员。1937年他被捕，1938年与布哈林同案受审，被处决，后于1988年获平反。"
 CBIO_SOV_mikhail_tomsky_desc:0 "1880年生，工人出身，老布尔什维克，长期是苏联工会运动的主要领导人，担任全苏工会中央理事会主席多年。在党内，他与布哈林、李可夫同属”右倾反对派“。1929年他被解除工会领导职务，随后被迫检讨。1936年，在第一次莫斯科审判中其名字被牵连，面对即将到来的逮捕，他于同年8月开枪自杀，后于1988年获平反。"
 CBIO_SOV_grigory_sokolnikov_desc:0 "1888年生，老布尔什维克。1922年起出任财政人民委员，主持了国内战争后的货币改革，发行稳定的”切尔文“金币券，使苏联的财政与币值得以稳定，奠定了此后苏联货币制度的基础。其后他转入外交，曾出任驻英国大使。1936年他被捕，次年作为第二次莫斯科审判的被告受审，被判处徒刑。1939年，他在狱中被杀，后于1988年获平反。"
 CBIO_SOV_lev_kamenev_desc:0 "1883年生，老布尔什维克。革命后他担任莫斯科苏维埃主席等要职，并曾主持政治局会议。1917年十月起义前夕，他与季诺维也夫曾公开反对立即举行武装起义。列宁逝世后，他参加斯大林、季诺维也夫的”三人集团“，继而转入反对斯大林的”联合反对派“。他几经开除与悔过。基洛夫遇刺后他被捕，1936年8月作为第一次莫斯科审判的主要被告，与季诺维也夫同案受审，被处决，后于1988年获平反。"
 CBIO_SOV_martemyan_ryutin_desc:0 "1890年生，老布尔什维克，曾任莫斯科的党务负责人。1932年，他主持起草了一份尖锐批判斯大林的长篇文件，即”柳廷纲领“，指斥斯大林的政策并主张将其撤换，文件在党内秘密流传。同年，他因”柳廷案“被捕；据记载，斯大林曾主张将其处死，但当时未获政治局同意，他被判监禁。大清洗中他再遭审判，1937年被处决，后于1988年获平反。"
 CBIO_SOV_patriarch_sergy_desc:0 "1867年生，本名伊万·斯特拉戈罗德斯基，俄罗斯东正教神职人员。革命后教会遭到严厉压制，他自1920年代起实际主持教会事务。1927年，他发表声明，表示教会对苏维埃政权效忠，这一举动在教会内部引起严重分歧，部分教徒拒绝接受，史称”谢尔盖宣言“。卫国战争期间，苏联出于动员民众和改善对外关系的需要，转而与教会缓和：1943年9月，斯大林与教会高层会面，随后他当选为莫斯科及全俄牧首，中断多年的牧首制得以恢复。1944年5月逝世。"
 CBIO_SOV_metropolitan_anastasy_desc:0 "1873年生，俄罗斯东正教主教。革命后他随白俄流亡海外。1936年起，他出任俄罗斯境外东正教会的首脑，长期领导这一拒绝承认莫斯科牧首区、与苏维埃政权对立的流亡教会。第二次世界大战期间，他辗转于巴尔干和中欧，境外教会内部围绕对德、对苏立场存在复杂分歧。战后他迁往美国，继续主持境外教会。1965年在纽约去世。"
 CBIO_SOV_metropolitan_nikolay_desc:0 "1891年生，俄罗斯东正教主教，属莫斯科牧首区，长期任克鲁季茨基都主教。卫国战争期间，他是教会爱国动员与教会同政权和解过程中的重要人物，参与了苏联调查纳粹罪行的国家特别委员会的工作。战后，他主持教会的对外关系事务。赫鲁晓夫推行反宗教运动期间，他于1960年被解除职务，1961年去世。"
 CBIO_SOV_metropolitan_aleksy_desc:0 "1877年生，俄罗斯东正教主教。卫国战争期间，他任列宁格勒都主教，在长达数年的围困中始终留守城内，支持市民并参与教会的爱国活动。1944年谢尔盖牧首去世后，他于1945年当选为莫斯科及全俄牧首，称阿列克谢一世，此后领导俄罗斯东正教会达二十余年。1970年去世。"
 CBIO_SOV_anastasy_vonsyatsky_desc:0 "1898年生，白俄流亡者。他是流亡海外的俄国法西斯运动的主要头目，在美国创建了全俄法西斯组织，与盘踞中国东北的罗扎耶夫斯基一派并列为两大俄国法西斯势力，两派曾短暂合并又告分裂。他凭借与一位美国富家女的婚姻获得资财，资助这类活动。第二次世界大战期间，他在美国因从事亲轴心活动被联邦调查局逮捕，依间谍法被判刑入狱，1946年获释。1965年在美国去世。"
 CBIO_SOV_grigory_semyonov_desc:0 "1890年生，外贝加尔哥萨克出身。国内战争时期，他在外贝加尔一带充当白军首领，自任哥萨克阿塔曼，依靠日本的支持割据，以装甲列车和残酷镇压著称，所部暴行累累。白军失败后，他逃往中国东北。日本扶植伪满洲国期间，他长期居于东北，与日本当局合作，充当远东反苏白俄势力的招牌人物。1945年苏军进入东北后，他被俘，1946年8月以叛国等罪名在莫斯科被处决，未获平反。"
 CBIO_SOV_nikolay_ustryalov_desc:0 "1890年生，政治思想家，并非军人。国内战争期间他站在白方，失败后流亡。1920年代，他成为”路标转换派“和”国家布尔什维主义“的主要理论家，主张流亡者应当承认苏维埃政权，理由是布尔什维克正在以强力重建俄国的大国地位。他长期侨居中国哈尔滨，在中东铁路系统任职并从事教学与写作。1935年他返回苏联，1937年即在大清洗中被处决，1989年获平反。"
 CBIO_SOV_aleksandr_kazembek_desc:0 "1902年生，俄国流亡政治活动家。1920年代起，他在法国创建并领导”青年俄罗斯派“，提出”沙皇与苏维埃“的口号，主张把君主制与苏维埃制度调和起来。该运动的取向在流亡界颇具争议，也曾受到被渗透与操纵的指控。第二次世界大战后，他于1957年返回苏联，转而为莫斯科牧首区工作。1977年去世。"
 CBIO_SOV_aleksandr_prokofyev_seversky_desc:0 "1894年生，曾是俄罗斯帝国海军的飞行员，在第一次世界大战中作战负伤、失去一条腿，仍坚持飞行，成为战斗英雄。革命后他流亡美国，转而成为著名的航空事业家和制空权理论家：他创办飞机制造企业，并于1942年出版《制空权》一书，系统鼓吹战略空军的决定性作用，影响很大，该书还被改编成动画影片。1974年在美国去世。"
 CBIO_SOV_vyacheslav_tkachyov_desc:0 "1885年生，俄罗斯帝国军队的飞行员，是俄国早期军事航空的先驱，曾在第一次世界大战中主管航空力量。国内战争时期他加入白军，在弗兰格尔麾下指挥白军航空兵。白军失败后他流亡南斯拉夫。第二次世界大战后期，他被苏方拘捕并押回苏联，判处徒刑，1955年获释，回到克拉斯诺达尔生活，从事航空史的写作。1965年去世。"
 CBIO_SOV_yan_nagursky_desc:0 "1888年生，波兰裔飞行员。1914年，他驾机在北极地区飞行，搜寻失踪的极地探险队，成为最早在北极上空驾驶飞机的人，是极地航空的先驱。第一次世界大战中，他在俄罗斯帝国海军航空兵服役。战后他回到波兰，长期作为工程师过着平静的生活，外界一度以为他已去世，直到1950年代才重新为人所知。1976年在波兰去世。"
 CBIO_SOV_vasily_yanchenko_desc:0 "1894年生，第一次世界大战中俄国的战斗机飞行员，是当时俄军成绩居前的空战王牌，曾在著名飞行员卡扎科夫所在的部队作战。革命与内战之后，他流亡海外，最终定居美国，进入航空工业界工作。1959年在美国去世。"
 CBIO_SOV_igor_kurchatov_desc:0 "1903年生，核物理学家。1943年起，他出任苏联原子弹研制工程的科学领导人，被称为”苏联原子弹之父“。他主持建成了苏联第一座核反应堆（1946年），并领导研制出苏联第一颗原子弹（1949年试爆成功），其后又推动氢弹和原子能发电的研制，苏联第一座核电站于1954年投入运行。他主持的核计划与苏联的军工和重工业体系紧密结合，是冷战初期苏联打破美国核垄断的关键。他蓄着大胡子，人称”大胡子“。1960年去世。"
 CBIO_SOV_abram_ioffe_desc:0 "1880年生，物理学家，被誉为”苏联物理学之父“。他创建并长期领导列宁格勒物理技术研究所，培养出库尔恰托夫等一大批后来支撑苏联核计划和国防科研的物理学家，其门下被称为苏联物理学的摇篮。他在固体物理、半导体等领域亦有研究。在斯大林晚期的政治运动中，他于1950年前后被解除研究所领导职务。1960年去世。"
 CBIO_SOV_sergey_korolyov_desc:0 "苏联弹道导弹与航天工程的核心组织者，在世时以”总设计师“为代号，领导实现了人类首颗人造卫星与首次载人航天。1907年生，火箭与航天事业的工程师和组织者。1938年，他在大清洗中被捕，先被送往科雷马的劳改营，后转入狱中的设计局工作，战时获释。战后，他主持苏联弹道导弹的研制，领导研制出第一种洲际弹道导弹（1957年），并开创了苏联的航天事业：1957年第一颗人造卫星上天，1961年实现人类首次载人航天，均出自其领导的设计集体。出于保密，他在世时身份一直不公开，仅以”总设计师“相称。1966年去世。"
 CBIO_SOV_boris_stechkin_desc:0 "1891年生，发动机与热力学专家，是航空与喷气发动机理论的奠基人，提出了空气喷气发动机的工作理论。他长期从事航空发动机的研究。在大清洗中，他两度被捕，曾在狱中的设计局（与图波列夫等人一起）从事技术工作，后获释。战后他继续发动机研究，当选科学院院士。1969年去世。"
 CBIO_SOV_vladimir_kotelnikov_desc:0 "1908年生，无线电工程与信息理论专家。1933年，他提出了著名的采样定理（与西方奈奎斯特、香农的工作相互独立），为信号的数字化奠定了理论基础；他还创立了通信中抗干扰能力的理论。他长期从事无线电、保密通信和雷达方面的研究，是苏联无线电工程的重要奠基者，后来还主持过对行星的雷达探测，并担任苏联科学院的领导职务。2005年去世。"
