l_simp_chinese:
 CBIO_DEN_aage_falking_desc:0 "奥耶·法尔金1883年生，丹麦陆军少将。1936年起他任军械总监办公室主任，1941年接替查尔斯·亨利·赖伊出任军械总监兼陆军技术兵种长，此后长期在任。1943年8月德军发动萨法里行动后，他的职务被中断，但战后他复任军械总监，直至1951年退役。1977年，法尔金去世。"
 CBIO_DEN_aage_vedel_desc:0 "A·H·韦泽尔1894年9月1日生于哥本哈根，全名奥格·赫尔格森·韦泽尔，丹麦海军军官。1940年德国占领时他任海军参谋部副长，1941年接替雷希尼策出任海军司令兼海军部长，此后长期在任直至1958年。鉴于1941年被迫向德国交出鱼雷艇后海军士气低落，他自1942年起便着手准备应急对策，1943年春在军舰上安装了炸药。1943年8月29日德军发动萨法里行动、企图夺取丹麦舰队时，他下令各舰要么逃往中立的瑞典、要么就地自沉，勿使落入德国之手；结果约三十艘舰艇在哥本哈根的霍尔门自沉，十三艘驶抵瑞典。这一举动被盟国视为丹麦站在其一方的明证，也为他在海军内部赢得极高声望。战后他主持了丹麦海军的重建，1958年退役，并热心于地理与北极水域的考察。1981年2月9日，韦泽尔去世。"
 CBIO_DEN_aksel_larsen_desc:0 "阿克塞尔·拉森1897年8月5日生于菲英岛欧登塞近郊的一个乡村，出身木屐匠家庭。他最初参加社会民主党，1920年因不满该党在复活节危机中的立场，转投新成立的丹麦共产党。1925至1929年间他在莫斯科学习，回国后成为日渐壮大的失业者运动的活跃领袖。1932年11月，他与阿讷·蒙克-彼得森成为首批当选国会的丹麦共产党人，同年稍晚出任党主席，此后长期主政该党。占领期间，1941年6月丹麦警方开始搜捕共产党人时，他转入地下，投身非法抵抗，并参与创立跨党派抵抗组织自由丹麦。1942年11月他被捕，经长时间审讯后于1943年8月被移送德国萨克森豪森集中营，1945年经白色巴士行动获救。解放后，他曾出任解放内阁的不管部大臣。1958年他被逐出丹麦共产党，翌年成为社会主义人民党的主要创建者，并任党主席至1968年。1972年1月10日，拉森在腓特烈斯贝去世。"
 CBIO_DEN_alsing_andersen_desc:0 "阿尔辛·安德森1893年2月5日生，社会民主党政治家。1935至1940年他出任国防大臣，在斯陶宁内阁中负责丹麦军事事务。1940年7月他就任社会民主党副主席，1942年5月斯陶宁去世后代行党主席之职，直至1945年占领结束。他在占领期间维系了社民党组织的运转。1942年他还短暂出任财政大臣。1947年11月他在赫托夫内阁中短暂任内政大臣。战后他活跃于国际社会主义运动，1957至1962年出任社会党国际主席，并曾担任联合国调查1956年匈牙利事件委员会的主席。1962年12月5日，安德森在哥本哈根去世。"
 CBIO_DEN_arnold_peter_moller_desc:0 "阿诺尔·彼得·默勒1876年10月2日生于哥本哈根南郊的德拉厄，是船长彼得·梅尔斯克·默勒之子，母亲来自德拉厄的航运世家。1904年他与父亲在斯文堡共同创立斯文堡汽船公司，开启了日后发展为A·P·穆勒-马士基集团的事业。1912年他又独资创立1912年汽船公司，以获得更大的经营自由。一战期间航运业利润丰厚，他的公司跃升为丹麦第四大航运企业，两次大战之间稳步扩张，至二战爆发时已是丹麦最大的航运公司。1940年4月8日德国入侵前夕，他向远洋船队发出永久特别指令第一号，命令所有船只转听纽约办事处指挥，不得服从被占领的哥本哈根的指令。此后他的长子梅尔斯克·麦金尼·默勒在美国管理海外业务直至战争结束。他娶了美国人查斯廷·麦金尼为妻，育有二子二女。晚年他将事业拓展至航运之外，1962年获得丹麦北海石油勘探特许权，1964年与萨林共同投资零售连锁丹麦超市。1965年6月12日，默勒在哥本哈根去世，由长子继任集团董事长兼首席执行官。"
 CBIO_DEN_asger_grandjean_desc:0 "阿斯格·格朗让1889年生，全名埃米尔·瓦尔德马·阿斯格·格朗让，丹麦海军军官。1905年入海军军官学校，1909年任少尉，此后在海军舰船上历经多次远洋航行。1915年他接受海军飞行训练，1916年取得水上飞机驾驶员证书，成为丹麦最早的一批海军飞行员之一。此后他在海军航空部门长期任职，1925年升海军上校，1931年升中校级指挥官，1937年升少将级指挥官。他长期担任海军航空处长，主管丹麦的海军航空力量。1932年丹麦地理学家劳格·科赫率领的东格陵兰三年考察期间，以他的名字命名了东格陵兰的格朗让峡湾。他还长期担任海军军官体育协会主席。1948年，格朗让去世。"
 CBIO_DEN_carl_hammerich_desc:0 "卡尔·哈梅里克1888年4月25日生于奥胡斯，丹麦海军军官，1940年4月晋升海军少将，自1937年起任海军参谋长。他与挪威出身的妻子博希尔一道，在战时组织了对挪威的丹麦粮食援助。他还是「日德兰军团」运输计划的主要推手，该计划旨在德国崩溃之际把被关押在德国的斯堪的纳维亚囚犯接运回国，这一工作为1945年春「白色巴士」救援行动奠定了基础。1944年12月他被盖世太保逮捕，以人质身份关押在盖世太保总部壳牌大楼的顶层。1945年3月21日，他在英国皇家空军对壳牌大楼的轰炸中遇难。"
 CBIO_DEN_carl_jacobsen_desc:0 "卡尔·雅各布森1878年9月24日生，丹麦陆军少将。他1926年升中校、1930年升上校，1933年晋少将。1930至1932年任陆军总司令部参谋长，此后自1933年至1943年长期兼任步兵总监与陆军总司令部副司令。1945年他一度复任步兵总监，随即退役。1963年9月23日，雅各布森去世。"
 CBIO_DEN_cay_lembcke_desc:0 "凯·伦布克1885年12月15日生于哥本哈根，为将军之子，早年走军旅生涯，1907年任少尉，1918年升为近卫骠骑兵团的骑兵上尉，1923年退役。他深受贝登堡童军理念影响，1910年前后与人共同创办丹麦童子军团，并将贝登堡的童军读本改编为丹麦语版本，主张以军事化训练培养体魄强健、服从命令的青年，直到1923年因作风等分歧离开童军运动。受1930年德国纳粹党选举大胜的鼓舞，他于同年11月16日创立丹麦国家社会主义工人党，自任首任「元首」，其纲领与符号几乎照搬德国范本，但该党在丹麦始终未成气候。伦布克行事冲动、组织能力有限，未能使该党取得实质政治突破。1933年夏，弗里茨·克劳森通过党内政变夺取党魁之位，伦布克此后逐渐淡出政治。1965年1月31日，伦布克去世。"
 CBIO_DEN_charles_henry_rye_desc:0 "查尔斯·亨利·赖伊1874年7月14日生，丹麦陆军少将。1923至1930年任陆军技术兵种处长，1930年晋军械总监，此后自1930年至1941年兼任军械总监与陆军技术兵种主任，1941年退役。1969年10月2日，赖伊去世。"
 CBIO_DEN_christian_evers_desc:0 "克里斯蒂安·威廉·埃弗斯1887年10月18日生于哥本哈根，丹麦海军军官。1908年晋升海军少尉，1937年晋升海军上校。1939年5月至1945年6月，他任丹麦海军军官学校校长，同时兼任训练舰「英戈尔」号指挥官。德国占领丹麦后，该舰仍被允许在丹麦近海承担训练任务，但弹药和燃料均受严格限制。1943年8月29日德军发动萨法里行动、解除丹麦军队武装时，埃弗斯接到舰队自沉命令，试图打开海底阀使「英戈尔」号自沉；舰只在大贝尔特海峡被德军舰艇截停，行动未果，他本人随后被拘禁至同年10月。战后他继续任海军军官学校校长至1945年6月，并曾任海军军官协会主席。1966年6月1日，埃弗斯去世。"
 CBIO_DEN_christian_forslev_desc:0 "克里斯蒂安·福斯莱乌1891年1月27日生于斯内斯莱乌，家境清贫，十四岁即入陆军学员学校。他从士官考入军官学校，1914年任炮兵中尉，1918年获军事飞行员证书后赴法国深造，在高等航空与机械制造学院取得工程师文凭，并于1928年通过法语翻译考试。1926年他以上尉衔出任飞行学校校长，1931年升中校任飞行兵团长，1932年任陆军飞行部队总监兼司令，1934年晋上校。1937年他主编出版了《陆军飞行二十五年》。占领期间他为《政治报》撰写军事评论。战后他被派驻华盛顿任军事武官兼空军武官，1946年晋少将，1949至1950年兼任丹麦在北约军事委员会常设小组的联络官。1950年他晋中将，出任新组建的皇家丹麦空军首任司令，负责将陆军和海军的飞行单位合并为统一的空军，但合并进程并不顺利。1959年，福斯莱乌去世。"
 CBIO_DEN_christian_frederik_von_schalburg_desc:0 "克里斯蒂安·弗雷德里克·冯·沙尔堡1906年4月15日生于俄国西伯利亚的兹梅伊诺戈尔斯克，父亲是丹麦人、母亲出身俄国贵族。1917年前后俄国革命迫使全家逃往丹麦，家族在俄国革命中的遭遇使他形成激烈反共立场，政治上逐渐转向极右翼。他在丹麦陆军近卫团任职，1936年升任上尉级军官，与王室圈子关系密切。1938年他加入丹麦纳粹党，次年起领导该党青年组织并使之军事化，还曾志愿参加芬兰冬季战争。1940年秋他离队加入武装党卫军，1941年在维京师随德军进攻苏联，获一、二级铁十字勋章。1942年3月，他接替克吕辛出任自由军团指挥官，并使该部转向更浓的意识形态色彩，随后被投入东线的杰米扬斯克包围圈。日后成立的、对丹麦抵抗运动施行反破坏与恐怖活动的沙尔堡军团即以他命名。战后丹麦社会普遍将其视为对德合作和武装党卫军丹麦化的代表人物。1942年6月2日，他在杰米扬斯克附近亲自到前沿督战时踩中地雷、被炮弹弹片击中，阵亡于东线。"
 CBIO_DEN_christian_peder_kryssing_desc:0 "克里斯蒂安·彼泽·克吕辛1891年7月7日生于科灵，炮兵军官，在丹麦陆军服役约三十年，1937年任中校、第五炮兵部队主任。他立场保守、忠于王室，态度坚决反共，但并非纳粹党人。1941年德国进攻苏联后，丹麦纳粹党与德国当局物色一位未受政治牵连的军人统领赴东线的志愿部队，遂找上他。他自称对丹麦政治体制的信心在1940年4月9日已彻底动摇，视共产主义为欧洲的首要威胁，遂接受出任自由军团首任指挥官，军衔为党卫队一级突击队大队长。他天真地以为能使该部摆脱纳粹控制，却与军团内的纳粹军官龃龉不断，1942年2月被撤职，由冯·沙尔堡接替。此后他转入其他武装党卫军部队，1943年一度指挥奥拉宁鲍姆一带的海岸战斗群，成为武装党卫军中军衔最高的外籍军官。1944年6月他因家庭变故辞职，其两个儿子先后于1942年和1944年在东线阵亡。战后他向英军投降，1947年因加入武装党卫军被判处四年徒刑，1948年获释。1976年，克吕辛去世。"
 CBIO_DEN_christian_x_desc:0 "克里斯蒂安十世1870年9月26日生于哥本哈根附近的夏洛滕隆，为弗雷德里克八世之子，挪威国王哈康七世是其胞弟。1912年他继位为丹麦国王，并在1918至1944年间兼任冰岛国王。他性格威严、看重王权尊严，执政初期与议会屡有摩擦，1920年因解散扎勒内阁而引发复活节危机，最终接受君主在议会民主下退居象征性角色。1940年4月德国占领丹麦后，与流亡海外的挪威、荷兰君主不同，他选择留在国内，坚持每日不带护卫独自骑马巡行哥本哈根街头，成为丹麦主权与民族凝聚的象征，深受民众爱戴。1942年10月，他在骑行中坠马受伤，此后健康每况愈下。1943年8月合作政府倒台、占领当局加紧控制后，他在占领的最后阶段基本退出公开活动。1944年冰岛经公投脱离与丹麦的联系并成立共和国。1947年4月20日，克里斯蒂安十世在哥本哈根阿马林堡宫去世，由长子继位为弗雷德里克九世。"
 CBIO_DEN_christmas_moller_desc:0 "克里斯马斯·默勒1894年4月3日生于哥本哈根，全名圭多·莱奥·约翰·克里斯马斯·默勒，保守人民党政治家。1928年他出任保守人民党主席，此后长期领导该党。德国占领丹麦后，他加入联合内阁，但因态度对德不够恭顺，1940年10月被迫辞职。占领当局进一步要求他退出一切政治活动，此后他与家人于1942年4月经海路逃往瑞典，再转赴伦敦。他在伦敦最重要的角色是担任英国广播公司丹麦语广播的播音员，公开批评丹麦政府的合作政策，号召丹麦人进行破坏活动和抵抗，因此在被占领的丹麦国内获得极高声望。1943年10月，他撰文呼吁所有丹麦人帮助藏匿中的犹太同胞。1945年4月，他的独子约翰在英国陆军近卫掷弹兵团服役时阵亡。战后他在解放内阁中出任外交大臣，随后恢复保守党主席之职，但在1947年大选中失利后辞去党魁。1948年4月13日，默勒在哥本哈根去世。"
 CBIO_DEN_ebbe_gortz_desc:0 "埃贝·格茨1886年7月3日生于赫尔辛格，是一战时丹麦陆军主帅维尔赫姆·格茨之子，早年即以战术与用兵才能著称，曾赴巴黎高等军事学院深造。1937年他任总参谋长，1941年10月接替普赖尔出任陆军总司令，此后长期在任直至1951年。占领期间，他最初反对破坏活动、禁止陆军人员加入抵抗，但默许情报部门经斯德哥尔摩向英国传递情报。1943年8月29日德军以萨法里行动缴械并解散丹麦军队、将其拘禁后，他在拘押期间组织起「小总参谋部」，领导陆军的地下活动，并推动在瑞典组建丹麦旅。获释后他转入地下，暗中继续行使陆军统帅之职，与政界要人及自由委员会保持接触，1944年10月被自由委员会接受为一旦对德开战时军事与民事抵抗的最高指挥。1976年4月30日，格茨在哥本哈根去世。"
 CBIO_DEN_ejnar_warum_desc:0 "埃纳尔·沃鲁姆1890年7月7日生于奥胡斯，丹麦外交官。1909年自施内克洛斯学校毕业后，先在A·S·奥托·蒙斯特公司任会计，1915年进入外交部出口管制处。1917年他短暂赴伦敦任领事馆秘书，回国后继续攻读政治学，1920年获政治学硕士学位。1921年外交部改组时他被任命为经济司科长，1923年任驻布鲁塞尔使馆秘书，1924年调任驻东京使馆秘书至1928年。回国后他重任经济司科长，1936年升任经济政治司长，此后在该职位上任职约十五年，主管丹麦外交部的经济与贸易事务，包括整个占领时期。1971年12月20日，沃鲁姆在奥德鲁普去世。"
 CBIO_DEN_emil_strobech_desc:0 "埃米尔·G·斯特勒贝克1899年4月24日生于菲英岛海延普，是丹麦法官和警务官员。1923年获法学学位后进入司法系统，曾在罗斯基勒、兰讷斯和哥本哈根等地任职，1933年任哥本哈根警察检察官。1939年丹麦建立全国性安全警察机构SIPO时，他出任督察，负责监视极端政治组织、外国间谍活动以及可能威胁国家独立的行动。这一机构与哥本哈根警察局既有情报部门并行，反映出战前丹麦对国内安全与政治极端化的焦虑。1940年德国占领后不久，他调任科灵刑事法官。"
 CBIO_DEN_emmanuel_briand_de_crevecoeur_desc:0 "埃马纽埃尔·白里安·德·克雷弗克1882年6月18日生于奥胡斯，本姓普吕茨，1905年改从母姓，丹麦海军军官，1937年晋升海军少将。1940年3月他出任海岸舰队司令；同年4月德国占领、雷希尼策去职后，作为资历最深的海军少将，他被任命暂代海军司令兼海军部长，直至1941年7月韦泽尔接任。据评他缺乏胜任该职所需的政治见识。1941年8月起他改任海岸防御司令，直至1945年退役。他带有法国气质的军官，为人和蔼、善于交际，专长为炮术与军事体操，还撰写过多部丹麦海军史人物传记。1968年7月2日，德·克雷弗克去世。"
 CBIO_DEN_erik_leschly_desc:0 "埃里克·莱施利1880年8月27日生，丹麦陆军少将。1930至1934年任总参谋部后勤处长，1934年晋少将，此后自1934年至1943年兼任骑兵总监与哥本哈根司令。1943年8月德军发动萨法里行动、拘押丹麦军官，他的职务亦告中断。1945年他短暂复任哥本哈根司令后退役。1964年9月15日，莱施利去世。"
 CBIO_DEN_erik_moller_desc:0 "埃里克·默勒1896年1月9日生，丹麦陆军军官，炮兵出身，曾在总参谋部任科长，1943年升中校。1943年8月29日丹麦军队被德军缴械后，他担任与德国占领军最高指挥部的联络官，得以在各军官拘留地之间往来。他受陆军总司令格茨委派，推动在军官获释后把军官团凝聚在一套共同计划之下以便投入抵抗，这一努力大体获得成功。1972年4月13日，默勒去世。"
 CBIO_DEN_erik_scavenius_desc:0 "埃里克·斯卡韦纽斯1877年7月13日生于默恩岛的克林特霍尔姆，出身丹麦贵族，家族有从事外交的传统。1901年他从哥本哈根大学获经济学学位后进入外交部，1906至1908年在驻柏林使馆任秘书，由此形成了以对德关系为核心的外交理念。1909年他年仅三十二岁即出任外交大臣，此后又在扎勒第二次内阁中任外交大臣至1920年，期间主持了丹麦在一战中的中立政策及北石勒苏益格公投回归丹麦。1940年7月，他取代蒙克重新出任外交大臣，成为丹麦政府与德国占领当局之间最重要的联络人。他主张以务实合作换取丹麦的有限自主，推行「合作政策」，这一路线在丹麦国内引起深刻分裂。1942年11月电报危机后，德方坚持只接受他出任首相，布尔辞职后他在病中的国王授意下组阁，兼任首相与外交大臣。1943年8月29日丹麦政府因拒绝德方镇压要求而被解散，他的内阁名义上存续至1945年解放，但实际权力早已丧失。战后他受到议会调查委员会审查，但未被弹劾起诉。1962年11月29日，斯卡韦纽斯在根措夫特去世。"
 CBIO_DEN_erik_with_desc:0 "埃里克·维特1869年11月20日生于哥本哈根，早年曾短暂在海军当学徒，后转入陆军。1911至1918年任总参谋部情报处长，由此积累了广泛的内外人脉。他立场强烈民族主义、态度反德，1920年在南日德兰边界问题与复活节危机中都相当活跃。1931年，斯陶宁出人意料地任命他为陆军总司令。任内他持续力争加强国防以应对德国重整军备，但成效有限，1939年因年龄退役。占领期间，他以陆军旧日主帅的身份公开表态，反对丹麦军人加入自由军团、与占领丹麦的德军并肩作战。1959年3月11日，维特去世。"
 CBIO_DEN_frederik_christian_essemann_desc:0 "弗雷德里克·克里斯蒂安·埃塞曼1877年12月16日生于维堡，丹麦陆军军官。他自1899年起在步兵服役，历任团长等职，1937年升任少将并出任日德兰师师长。1940年4月德国占领丹麦时，他正统领日德兰师。1941年他转任陆军部候命，同年退役。1954年3月9日，埃塞曼去世。"
 CBIO_DEN_frederik_ix_desc:0 "弗雷德里克九世1899年3月11日生于索根弗里宫，本名克里斯蒂安·弗雷德里克，是克里斯蒂安十世的长子，1912年起为丹麦王储。他自幼钟情海军，就读皇家海军军官学校并长期在海军服役，1946年升为海军少将，素有「水手王」之名。1935年他与瑞典的英格丽公主结婚，育有三女。德国占领期间，他于1942至1943年代替因坠马而不能理事的父亲摄政。1947年4月20日，他在父亲去世后即位为丹麦国王。在其1947至1972年的统治期间，丹麦社会迅速变迁，福利国家不断扩展；1953年宪法修改，允许女性继承王位，这使他的长女得以继承大统。1972年1月14日，弗雷德里克九世去世，由长女玛格丽特二世继位，成为近六百年来丹麦首位女君主。"
 CBIO_DEN_freedom_council_desc:0 "丹麦自由委员会1943年9月16日在哥本哈根成立，是丹麦抵抗运动的中央协调机构。在此之前，各抵抗团体各自为战、缺乏统一领导；1943年8月合作政府因拒绝占领当局的最后通牒而总辞、丹麦进入军事管制后，建立统一指挥的需要变得迫切。委员会由几大地下组织的代表组成，包括丹麦共产党、自由丹麦、丹麦团结以及抵抗组织「环」，并通过英国特别行动处的联络员与流亡海外的自由丹麦人取得联系。其宗旨是以一切手段在各领域组织对德抵抗，协调破坏活动、分配盟军空投的武器、统一对民众和盟国的宣传，并筹划战后的民主重建。委员会成员长期隐姓埋名，却因言辞克制而赢得广泛信任，被视为丹麦在占领下最接近替代政府的存在，并在1944年哥本哈根总罢工中发挥了重要作用，战争末期更成为各政党不得不与之谈判的政治力量。1945年5月丹麦解放、成立解放政府后，委员会完成使命，同年7月由自由运动协商会取代。"
 CBIO_DEN_frits_clausen_desc:0 "弗里茨·克劳森1893年11月12日生于当时属普鲁士的阿本罗，父母属丹麦少数族群。第一次世界大战期间他应征入德军，1915年在东线被俄国俘虏，战后完成医学学业，1924年在南日德兰的博夫鲁普开业行医。他早年是保守党人，1931年加入丹麦国家社会主义工人党（DNSAP），1933年通过党内政变推翻更具贵族气的伦布克，自任党的「元首」，将纲领与组织仿照德国纳粹党打造。DNSAP在1939年和1943年国会选举中各获三席，克劳森于1939至1945年任国会议员。丹麦被占领后，他强烈支持德国占领并谋求借占领当局之力上台，但因德国满足于同合作政府共事、且国王反对而屡屡落空。1943年他志愿加入武装党卫军任军医，服役短暂，1944年因酗酒返回丹麦，随后被剥夺党魁职务并于同年11月被开除出党。1945年5月丹麦解放时他被捕，在受审前于1947年12月5日在哥本哈根西狱因心脏病去世。"
 CBIO_DEN_hans_a_rolsted_desc:0 "汉斯·A·罗斯德特1884年5月20日生于哥本哈根，全名汉斯·奥格·罗斯德特，丹麦陆军少将，也是军事教育家和战术理论家。1905年任炮兵中尉，此后赴法国格勒诺布尔大学进修法语，先后完成军官学校高级班、炮兵技术课程和总参谋部课程。他长期在陆军军官学校任教，教授战术、兵团指挥、战略和总参谋部勤务等课程近二十年，并撰写了多部军事教材，包括《陆军编制》《炮兵作战条件》和《两栖作战》等。1938年他任炮兵总监，1939年出任西兰师师长。1940年4月德国占领丹麦时，他正统领西兰师。1941年他接替格茨出任总参谋长，同时担任丹麦政府对德国占领军的联络官与谈判代表。1943年6月合作政策崩溃后，同年8月他在萨法里行动中被德军拘押并押送至德国。战后他任驻斯德哥尔摩和奥斯陆军事武官，1949年退役。他是丹麦军事科学学会主席、丹麦炮兵期刊的联合创办人。1966年5月24日，罗斯德特去世。"
 CBIO_DEN_hans_hedtoft_desc:0 "汉斯·赫托夫1903年4月21日生于奥胡斯，是一个十个孩子家庭中最小的，原名汉斯·赫托夫·汉森。1928年年仅二十五岁便出任社会民主党青年组织主席，1935年当选国会议员并任党秘书长，1939年接替斯陶宁任党主席。占领期间，他因对德态度过于强硬而于1941年被迫辞去一切政治职务，此后投身抵抗运动。1943年9月，他在丹麦犹太人营救行动的发动中发挥了重要作用。1945年他在解放内阁中出任社会事务大臣。1947年11月他组建少数派社民党政府出任首相，在1948年捷克斯洛伐克政变的震动下，他与财政大臣H·C·汉森共同推动丹麦加入北约，实现了丹麦外交政策从中立到集体防御的根本转向。1950年下野后，1953年9月他再度拜相，并出任北欧理事会首任主席。1955年1月29日，赫托夫在斯德哥尔摩出席北欧理事会会议时因心脏病发猝逝，由挚友兼外交大臣H·C·汉森继任首相。以他命名的客轮「汉斯·赫托夫号」1959年首航时撞上冰山沉没，是已知最后一艘因冰山而沉没的船只。"
 CBIO_DEN_hans_lunding_desc:0 "汉斯·伦丁1899年2月25日生于当时属普鲁士北石勒苏益格的斯特平，是小农之子。1916年他被征入普鲁士军队，在第二近卫枪骑兵团服役至一战结束，升至下士官。1919至1920年间他在国际石勒苏益格公投监督委员会任宪兵。1922年他加入丹麦陆军，1927年在奥胡斯的第三龙骑兵团任少尉，此后完成骑术学校和总参谋部课程。1935年起他主管陆军情报处，在北德建立了一个间谍网络，监视德军集结、军事交通和物资储备。1940年4月9日入侵前夕，他发出了预测德军将于凌晨四时进攻的最后报告。他还出色的马术运动员，1936年在柏林奥运会三项赛中获得个人铜牌。占领期间，他多次秘密前往斯德哥尔摩与英国和波兰情报人员接头。1943年8月29日萨法里行动中，他被盖世太保逮捕，关押在柏林王子阿尔布雷希特大街的盖世太保监狱近一年，盖世太保长官海因里希·缪勒告知他已被判处死刑。此后他被转移至弗洛森比尔格集中营，在那里与被捕的德国军事情报局长威廉·卡纳里斯成为隔壁囚室的邻居，两人通过敲墙密码相互通信，伦丁成为卡纳里斯被处决前最后接触的人。1945年4月盟军逼近时，他作为一百三十九名「显要囚犯」之一被党卫队从达豪转移至南蒂罗尔，最终获美军解救。战后他回到丹麦，1950年晋上校，出任丹麦首任陆海军联合情报局长，直至1963年退役。1984年4月5日，伦丁在奥胡斯去世。"
 CBIO_DEN_hjalmar_rechnitzer_desc:0 "亚尔马·雷希尼策1872年12月1日生于奥尔堡，海军军官。1923年他出任海军部长，1932年海军法通过后又兼任海军司令、晋升海军中将，其晋升是经一项专门立法促成的。他忠实但并不情愿地执行了政界对海军的大幅削减，主张以海军为主的中立防御。他坚信德国不会占领丹麦，甚至在1940年4月危机中仍不改判断。德军入侵当日，他下令首都的舰艇不得开火，并建议政府投降。此举连同他30年代的国防路线，使他战后饱受批评，尤其在海陆军内部。占领后不久，四名高级军官告知他已失去部属的信任，他遂于1940年5月请辞，结束了近半个世纪的海军生涯。1953年6月21日，雷希尼策去世。"
 CBIO_DEN_johan_von_stemann_desc:0 "约翰·冯·斯特曼1887年生，全名约翰·丹尼尔·冯·斯特曼，丹麦陆军少将。1932年起他出任国防部长办公室主任，此后长期在任直至1943年8月德军发动萨法里行动。战后他于1945至1946年间候命，1947年出任陆军弹药制造局长，直至1957年退役。1982年，冯·斯特曼去世。"
 CBIO_DEN_jorgen_jorgensen_desc:0 "约恩·约恩森1888年5月19日生于莱勒附近的科内鲁普，是农民之子，就读过瓦莱基勒民众高中和图讷农业学校，并赴苏格兰和德国短期考察农业，此后在故乡经营家族农场。他深受格伦特维民众教育理念的影响，1920年因不满自由党在复活节危机中的立场转投激进左翼党。1929年当选国会议员后，他凭借对农业和地方事务的深入了解迅速获得党内信任，1934年出任激进左翼党国会党团主席，1935年进入斯陶宁内阁任教育大臣，主持了1937年的学校改革立法。占领期间，他在1942年斯卡韦纽斯内阁中改任内政大臣，至1943年8月政府被解散。战后他长期担任党团主席至1957年，与贝特尔·达尔高共同主导该党事务，被视为激进左翼党的双领袖之一。1957年他再度出任教育大臣，推动了1958年的学校改革。他曾梦想激进左翼党与自由党合并，但克努兹·克里斯腾森的南石勒苏益格政策使这一愿望彻底破灭。1974年12月15日，约恩森在罗斯基勒去世。"
 CBIO_DEN_kaj_birksted_desc:0 "卡伊·比克斯泰德1915年3月2日生于哥本哈根，幼年随家人赴美国生活，十二岁返回丹麦。1936年他进入海军飞行学校，1937年获飞行员资格。1940年4月9日德国入侵时他在海军航空站服役，一周后与同僚查尔斯·孙比乘小船逃往瑞典，辗转赴英。在加拿大的挪威飞行学校「小挪威」受训后，他以挪威空军军官身份参战，先后在英国皇家空军第43中队和挪威第331中队服役。1942年6月他取得首次战果，击落一架福克-沃尔夫190。同年他升任第331中队中队长，战友评价他「飞行如天使，射击如威廉·退尔」。1943年8月他出任第132挪威联队联队长。1944年他被调入第11大队司令部任作战规划官，参与策划诺曼底登陆和市场花园行动的战斗机掩护方案。1945年3月他任本特沃特斯联队联队长，驾驶P-51野马执行远程护航任务。整个战争期间他累计击落十架半敌机、击伤五架，飞行超过五百个作战小时，获颁杰出服务勋章和杰出飞行十字勋章。战后他回到丹麦，1950年出任新组建的皇家丹麦空军参谋长，任职至1960年，随后转入北约工作。哥本哈根丘吉尔公园的抵抗博物馆旁竖有他的半身像。1996年1月21日，比克斯泰德去世。"
 CBIO_DEN_karl_kristian_steincke_desc:0 "卡尔·克里斯蒂安·斯泰因克1880年8月25日生于维斯金厄，学法律出身，是社会民主党的理论家和实干家。他在斯陶宁第一次内阁中任司法大臣，1929至1935年出任社会大臣，被公认为丹麦福利国家的总设计师。他在任期间推动了1930年代初的系列社会改革法案，这些法案以1933年坎斯勒街协议为框架，对丹麦社会保障体系进行了全面重组，将济贫、失业救济、健康保险和养老整合为统一的现代福利制度。他在1920年出版的著作中详细论证了社会福利改革的方向，但同时也主张对所谓社会劣等者实施绝育以防其繁衍，这一思想成为丹麦优生法律的理论基础，是其遗产中备受争议的一面。1935至1939年他再任司法大臣，1950年又在赫托夫内阁中短暂复任此职。1963年8月8日，斯泰因克去世。"
 CBIO_DEN_knud_bach_2_desc:0 "克努特·巴赫1871年9月26日生于日德兰兰讷斯地区一处世代农庄，是当地公认的能干农场主。20世纪20年代末，他倡议跨越既有的农业组织把丹麦农民联合起来，1930年11月发起成立农业者联盟并任主席。该联盟因发端于兰讷斯一带而被称为兰讷斯运动，在30年代经济危机中迅速壮大为全国性的农民抗议运动，抨击所谓体制，动辄以封锁、外汇行动和示威相施压。1935年7月，他率数万农民举行农民进军，前往阿马林堡向克里斯蒂安十世递交请愿书。占领初期，农业者联盟及其在国会的代言组织丹麦农民党一度向丹麦纳粹党靠拢，1940年还出现拥立巴赫出任农业兼首相的图谋，这使运动在1941年前后大量流失成员与影响。1944年秋，他离开联盟领导层。1945年6月，他因叛国嫌疑被捕，1947年7月被哥本哈根市法院判处五年徒刑，同年10月因脑溢血获赦。1948年10月5日，巴赫在祖宅去世。"
 CBIO_DEN_knud_bach_3_desc:0 "克努特·巴赫1871年9月26日生于日德兰兰讷斯地区一处世代农庄，是当地公认的能干农场主。20世纪20年代末，他倡议跨越既有的农业组织把丹麦农民联合起来，1930年11月发起成立农业者联盟并任主席。该联盟因发端于兰讷斯一带而被称为兰讷斯运动，在30年代经济危机中迅速壮大为全国性的农民抗议运动，抨击所谓体制，动辄以封锁、外汇行动和示威相施压。1935年7月，他率数万农民举行农民进军，前往阿马林堡向克里斯蒂安十世递交请愿书。占领初期，农业者联盟及其在国会的代言组织丹麦农民党一度向丹麦纳粹党靠拢，1940年还出现拥立巴赫出任农业兼首相的图谋，这使运动在1941年前后大量流失成员与影响。1944年秋，他离开联盟领导层。1945年6月，他因叛国嫌疑被捕，1947年7月被哥本哈根市法院判处五年徒刑，同年10月因脑溢血获赦。1948年10月5日，巴赫在祖宅去世。"
 CBIO_DEN_knud_bach_desc:0 "克努特·巴赫1871年9月26日生于日德兰兰讷斯地区一处世代农庄，是当地公认的能干农场主。20世纪20年代末，他倡议跨越既有的农业组织把丹麦农民联合起来，1930年11月发起成立农业者联盟并任主席。该联盟因发端于兰讷斯一带而被称为兰讷斯运动，在30年代经济危机中迅速壮大为全国性的农民抗议运动，抨击所谓体制，动辄以封锁、外汇行动和示威相施压。1935年7月，他率数万农民举行农民进军，前往阿马林堡向克里斯蒂安十世递交请愿书。占领初期，农业者联盟及其在国会的代言组织丹麦农民党一度向丹麦纳粹党靠拢，1940年还出现拥立巴赫出任农业兼首相的图谋，这使运动在1941年前后大量流失成员与影响。1944年秋，他离开联盟领导层。1945年6月，他因叛国嫌疑被捕，1947年7月被哥本哈根市法院判处五年徒刑，同年10月因脑溢血获赦。1948年10月5日，巴赫在祖宅去世。"
 CBIO_DEN_knud_kristensen_desc:0 "克努兹·克里斯腾森1880年10月26日生于灵克宾，务农出身，先后在腓特烈斯堡大学学院、达隆农业学校和阿斯科民众高中就读，此后在维勒和胡姆勒拜克经营农场。1920年他首次当选国会议员。1940年他在斯陶宁联合政府中出任内政大臣，1941年自由党主席托马斯·马森-米格达尔卸任后他接掌党魁。1942年斯卡韦纽斯出任首相后，他因不满合作路线而辞去阁职。1945年10月大选后，他组建了丹麦战后首届民选政府，这是一个纯自由党的少数派内阁。任内他推动了1946年国民社会保险法和住房补贴法。然而，他执着于将南石勒苏益格重新并入丹麦的主张令国会不安，1947年因不信任投票而下台。南石勒苏益格运动的失败使他与自由党渐行渐远，1953年新宪法颁布后他退出自由党，另创独立党，但该党未能赢得影响。1962年9月28日，克里斯腾森去世。"
 CBIO_DEN_paul_ipsen_desc:0 "保罗·伊普森1884年4月15日生于哥本哈根，丹麦海军军官，1937年晋升海军上校。他是水雷战方面的专家，长期在海军学校任教，并于1924至1945年间担任海军专业期刊的主编。1937至1940年他任海军基地站长，1940年任海岸防御司令，1941年起任海岸舰队司令。1943年8月29日德军发动萨法里行动、企图夺取丹麦舰队时，他作为海岸舰队司令执行了韦泽尔的命令，下令自沉停泊在霍尔门的舰艇；事后他留下一句为人传诵的话，称丹麦海军已光荣沉没。不久他因德方施压被免职。他还长年担任海军协会主席。1961年9月20日，伊普森去世。"
 CBIO_DEN_paul_ramm_desc:0 "保罗·拉姆1882年2月22日生，丹麦陆军少将。1933年任第一工兵营营长，1934年起兼任工兵总监与陆军建筑勤务主任，1938年晋少将。1943至1944年间，他出任丹麦政府驻德国占领军的联络官。1945至1946年他复任工兵总监与建筑勤务主任，1947年退役。1977年5月8日，拉姆去世。"
 CBIO_DEN_paul_sommer_desc:0 "保罗·佐默1910年10月13日生于博恩霍尔姆岛的罗讷，是教师之子。1928年中学毕业后就读于工科高等学校，1930年在斯图加特一家机械厂当实习生期间接触并倾心于德国的纳粹运动，1932年出版小册子攻击马克思主义，并一度经营一份纳粹立场的报纸。1935年他加入海军并受训为飞行员，30年代活跃于一个与丹麦纳粹党竞争的纳粹倾向组织。经海军部批准，他于1941年6月志愿加入德国空军，作为战斗机飞行员在地中海战场服役，配合隆美尔的非洲军团作战，累计取得三次空战战果，升至上尉。1943年返回丹麦后，他一度出任沙尔堡军团的副手并领导其政治分支，1944年2月起主持德国空军在丹麦组建的警备队，俗称索默军团，负责看守德国空军设施。1944年他遭抵抗组织丹麦的霍尔格伏击、身中枪伤但幸免于死。战后他被海军除名，1946年被捕，先判八年徒刑，1949年经最高法院加重为十二年，1950年获赦。1991年，索默去世。"
 CBIO_DEN_peter_horn_desc:0 "彼得·霍恩1915年10月15日生，丹麦飞行员。他加入丹麦陆军并受训为飞行员，1937年获飞行员资格证书。据部分来源，他曾在1939至1940年冬季战争期间志愿赴芬兰空军服役。1941年6月德国进攻苏联后，经丹麦国防部许可，他志愿加入德国空军，被编入第51战斗机联队第一大队，在东线驾驶战斗机作战。他在东线累计取得十一次空战战果，升至上尉，获一级和二级铁十字勋章。他在德国空军服役至战争结束。1983年11月1日，霍恩去世。"
 CBIO_DEN_peter_rochegune_munch_desc:0 "彼得·罗克古纳·蒙克1870年7月25日生于莫尔斯岛上的雷兹斯泰兹，是非婚生子，家境清寒，靠自身努力完成学业，1895年取得哥本哈根大学历史学一等学位，1900年获博士学位。他为人内向、措辞严谨，同事之间只以姓氏相称，因此被称为「P·蒙克」。他深受维戈·赫鲁普反军事主义思想的影响，认为丹麦领土防御不可能，与其维持虚幻的安全感不如与大国尤其是德国保持睦邻。1905年他参与创立激进左翼党，1909年当选国会议员并在扎勒内阁出任内政大臣。1913至1920年他任国防大臣，一战期间主管丹麦有史以来最大规模的和平时期动员，尽管他本人对领土防御并不抱信心。1929年他在斯陶宁的社民党与激进联合政府中出任外交大臣，此后十余年主导丹麦外交，致力于让希特勒承认1920年丹德边界，但最终未能成功。1940年4月9日德国入侵时，他是力主投降一方的代表人物，同年7月被斯卡韦纽斯取代。战后他承受了广泛指责，「再不许有4月9日」成为丹麦政界的共识口号，他的中立政策被全面否定，惟激进左翼党本身仍为之辩护。1948年1月12日，蒙克在哥本哈根去世。"
 CBIO_DEN_poul_sommer_desc:0 "保罗·索默1910年10月13日生于博恩霍尔姆岛的罗讷，是教师之子。1928年中学毕业后就读于工科高等学校，1930年在斯图加特一家机械厂当实习生期间接触并倾心于德国的纳粹运动，1932年出版小册子攻击马克思主义，并一度经营一份纳粹立场的报纸。1935年他加入海军并受训为飞行员，30年代活跃于一个与丹麦纳粹党竞争的纳粹倾向组织。经海军部批准，他于1941年6月志愿加入德国空军，作为战斗机飞行员在地中海战场服役，配合隆美尔的非洲军团作战，累计取得三次空战战果，升至上尉。1943年返回丹麦后，他一度出任沙尔堡军团的副手并领导其政治分支，1944年2月起主持德国空军在丹麦组建的警备队，俗称索默军团，负责看守德国空军设施。1944年他遭抵抗组织丹麦的霍尔格伏击、身中枪伤但幸免于死。战后他被海军除名，1946年被捕，先判八年徒刑，1949年经最高法院加重为十二年，1950年获赦。1991年，索默去世。"
 CBIO_DEN_prince_frederik_desc:0 "弗雷德里克王储1899年3月11日生于哥本哈根近郊的索根弗里宫，是克里斯蒂安十世与王后亚历山德琳的长子。1912年父亲即位后，他成为丹麦王储。他打破王室惯例，选择海军而非陆军，就读于皇家海军军官学校，1917年入海军服役，到1935年已升至海军中校，因对海军的热爱而有「水手王」之称，身上还有多处纹身。1935年他与瑞典的英格丽公主成婚，育有玛格丽特、贝内迪克特与安妮-玛丽三个女儿。德国占领期间，父亲于1942年10月坠马后，他自1942年起代父摄政至1943年，并对丹麦抵抗运动有所鼓励。1947年4月20日父亲去世后，他继位为弗雷德里克九世。1972年1月14日，弗雷德里克去世，由长女玛格丽特二世继位。"
 CBIO_DEN_thorvald_stauning_desc:0 "托瓦尔·斯陶宁1873年10月26日生于哥本哈根，出身贫寒，早年做雪茄分拣工并投身工会运动。1906年当选国会议员，1910年起任社会民主党主席近三十年。1924年他组建丹麦首届社会民主党政府并出任首相，内阁任命尼娜·邦为教育大臣，是世界最早的女性阁员之一。1926年下野后，1929年他再度拜相，领导社民党与激进左翼的联合政府带领丹麦渡过大萧条，1933年在其寓所促成坎斯勒街协议，奠定丹麦福利国家的基础。他以竞选口号「斯陶宁或混乱」闻名，1935年大选社民党得票率达百分之四十六，为丹麦政党史上最高。1940年4月德国占领后，他把内阁扩大为全党联合政府，推行合作政策以维系丹麦有限的自主。他主政前后近十六年，是二十世纪在任最久的丹麦首相。1942年5月3日，斯陶宁在任内于哥本哈根病逝，随后获国葬。"
 CBIO_DEN_viggo_kampman_desc:0 "维戈·坎普曼1910年7月21日生于腓特烈斯贝，出身学术家庭，1934年在哥本哈根大学取得经济学学位，是第一位在社会民主党内升至高位的学院派人士。他先在新成立的经济秘书处工作，担任财政大臣的核心顾问，1953年首次当选国会议员，同年出任财政大臣，此后在赫托夫和H·C·汉森两任首相手下长期主持财政。1960年2月H·C·汉森去世后，他继任首相和社民党领袖。任内他推动了一系列进步改革，包括1960年的残障人士康复法案和1961年的强制健康保险制度。他是丹麦战后最有才华的首相之一，但长期受双相情感障碍困扰，在低落期倾向于酗酒，时有数日不知去向之事，当时的媒体对此守口如瓶。1962年9月他因连续多次心脏病发作而辞职，由延斯·奥托·克拉格继任。1976年6月3日，坎普曼在斯托勒-托勒耶去世。"
 CBIO_DEN_vilhelm_buhl_desc:0 "威廉·布尔1881年10月16日生于腓特烈西亚，学法律出身，1908年取得法学硕士学位后从事税务工作，后成为哥本哈根市税务局长，是丹麦税制领域的权威。他是社会民主党的活跃成员，1932年当选国会议员，同年出任斯陶宁内阁的财政大臣。1942年5月3日斯陶宁去世后，他继任首相。他坚决反对丹麦被迫加入反共产国际条约，但其任期仅持续半年。1942年9月2日他发表广播讲话，呼吁国民停止破坏活动和罢工以免招致德国报复，这篇反萨博塔日讲话日后成为他政治生涯中最受争议的事件之一。同年11月，新任全权代表维尔纳·贝斯特到任后认为布尔过于不合作，布尔被迫辞职，由斯卡韦纽斯接任。1945年5月5日丹麦解放当天，他再度出任首相，领导由各政党与抵抗力量代表组成的解放内阁，主持了对战时合作者的审判，同年11月让位于克努兹·克里斯腾森。1947至1950年他在赫托夫内阁任经济协调大臣并兼司法大臣。1954年12月18日，布尔在哥本哈根去世。"
 CBIO_DEN_werner_best_desc:0 "维尔纳·贝斯特1903年7月10日生于德国达姆施塔特，是德国法学家、党卫军高级军官，身处纳粹权力核心。他早年研习法律，投身盖世太保的组建，任其法律与组织部门首脑、海德里希的副手，参与筹建党卫军别动队，并在1940至1942年间出任占领下法国的德国民政长官。1942年11月所谓电报危机之后，他被任命为第三帝国驻丹麦全权代表，主管占领下丹麦的民政事务，并被派驻在仍旧留任的国王克里斯蒂安十世身边。与多数被占国不同，丹麦一度保留国王、议会与政府，贝斯特起初试图把丹麦维持为占领下的样板。1943年8月合作政府倒台后，同年10月在其权限下发动了针对丹麦犹太人的抓捕，但行动基本失败，七千余名犹太人得以逃往瑞典，他在其中的确切作用至今仍有争议。他任职至1945年5月战争结束。战后他被引渡至丹麦，1948年被判死刑，后经改判最终获十二年监禁，1951年获释返回西德。1989年6月23日，贝斯特在米尔海姆去世。"
 CBIO_DEN_william_wain_prior_desc:0 "威廉·韦恩·普赖尔1876年7月18日生于哥本哈根，典型的总参谋部出身军官，长期从事参谋工作与军事学教学。1937年他升任少将、西兰师师长，1939年12月接替维特出任陆军总司令。占领前他力主加强陆军，却未获惧怕刺激德国的国会多数支持。1940年4月9日德国入侵当日，在阿马林堡的决定性会议上，他是唯一主张继续抵抗的人，但政府担心哥本哈根重蹈华沙覆辙而未采纳。此后他把矛头转向政治家，甚至向国王暗示军队乐见政府去职，未获国王认同；同年丹麦纳粹党曾拉拢他出任非议会政府的首相，被他拒绝。1941年，他因不满政府同意丹麦部队协同德军看守设施而辞职。1946年3月9日，普赖尔在腓特烈斯贝去世。"
 CBIO_CAN_adrien_arcand_desc:0 "阿德里安·阿坎德，出生并成长于蒙特利尔，青年时期担任新闻记者，一度组织天主教工会并出任新闻报首个工会分会主席，1929年因工会活动被解雇。同年，他创立带有反犹色彩的爱国云雀会，此后陆续创办多份极右翼报刊。1934年，他成立国家社会基督党，鼓吹反共、法国裔民族保守主义及排犹主张，并主张将加拿大犹太人迁往哈德逊湾地区。1938年，该党与草原诸省及安大略省的其他法西斯团体合并为国家统一党，阿坎德出任党魁，自称加拿大元首，公开效忠阿道夫·希特勒并与英国法西斯联盟保持通信往来。1940年5月，他因涉嫌密谋颠覆政府在蒙特利尔被捕，其政党随即遭取缔，他本人被拘押至战争结束后的1945年。战后他试图重整旗鼓，但影响力已大不如前，1967年8月1日在蒙特利尔逝世。"
 CBIO_CAN_andrew_mcnaughton_desc:0 "安德烈·麦克诺顿，出生于当时的西北地区、今萨斯喀彻温省穆索明，麦吉尔大学工程学学士及硕士毕业后留校任教。一战期间他在加拿大炮兵服役，两度负伤，因发明阴极射线测向仪等火炮定位技术屡获嘉奖，获颁优异服务勋章，战争结束时已官至准将。战后他留在正规军，1922年出任副总参谋长，1929年出任总参谋长，主持陆军机械化与民兵现代化改革；大萧条时期他关注失业问题，推动组建救济营。1935年至1944年兼任加拿大国家研究委员会主席。二战爆发后，他出任第1加拿大步兵师师长赴英，1940年至1942年历任第1加拿大军军长，1942年出任驻海外第一加拿大集团军总司令；因健康问题及与英方将领意见分歧，1943年底被解除军职调回加拿大。1944年出任国防部长，负责应对征兵危机，任内推动海外征兵但未能平息争议，两次参选联邦议员均落败，1945年8月辞去部长职务。战后他历任联合国原子能委员会主席、加拿大原子能管制局首任局长、加美防务联合委员会及国际联合委员会主席，1966年7月11日在魁北克蒙特贝洛逝世。"
 CBIO_CAN_bert_hoffmeister_desc:0 "伯特·霍夫迈斯特，出生并成长于温哥华，战前是加拿大白松公司的销售经理，1927年加入非常备现役民兵，1934年晋升上尉。1939年晋升少校，出任西福斯高地团一个连的连长，随团于当年随安德烈·麦克诺顿的第1加拿大师赴英国。1942年晋升中校，1943年7月率西福斯高地团参加西西里岛登陆作战，因战功获优异服务勋章，同年10月晋升准将，出任第2步兵旅旅长，率部参加年底的奥托纳战役。1944年3月20日，他晋升少将，出任第5加拿大装甲师师长，率部参加利里河谷进攻阿道夫·希特勒防线及哥特防线的战斗。欧洲战事结束后，他出任第6师加拿大太平洋部队师长，该部队因日本投降而解散，他于1945年9月退役。战后他投身商界，1949年出任麦克米伦·布洛德尔公司总裁，1958年至1961年任不列颠哥伦比亚省驻伦敦总代表，1999年12月4日在温哥华逝世。"
 CBIO_CAN_c_d_howe_desc:0 "C·D·豪，出生于美国马萨诸塞州沃尔瑟姆，麻省理工学院工程系毕业后于1908年移居加拿大，出任达尔豪西大学工程学教授，1916年创立豪氏公司，成为世界领先的谷物升降机设计企业。1935年他当选自由党国会议员，随即入阁出任铁路运河及海事部长，翌年两部合并为运输部，任内创办跨加拿大航空公司，即今日加拿大航空的前身。1940年他出任军需供应部长，主持二战期间加拿大工业的全面动员，设立二十八家皇家公司，将飞机年产量从数百架提升至逾万架，1943年加拿大工业产值跃居盟国第四；同年赴英途中所乘客轮遭德国潜艇击沉，他与幸存者一同划船脱险。1944年转任重建部长，主持战后经济平稳转型；1948年出任贸易与商务部长，1951年兼任国防生产部长。1956年他力推跨加拿大输气管道法案并动用终止辩论程序强行通过，招致独裁批评，1957年大选中连同其党一同落败失去议席，结束二十二年不间断的阁员生涯。1960年12月31日在蒙特利尔因心脏病逝世。"
 CBIO_CAN_charles_foulkes_desc:0 "查尔斯·福克斯，出生于英格兰斯托克顿，幼年随家人移居加拿大安大略省伦敦市，就读伦敦学院中学，1926年加入加拿大皇家团。他历任轻武器教官，1937年至1938年赴英国坎伯利参谋学院深造。第二次世界大战爆发时任第3师作战参谋，此后晋升迅速，1942年8月出任第3步兵旅旅长，1943年任第一加拿大集团军作战参谋准将，1944年1月升任少将并出任第2步兵师师长，率部参加诺曼底战役及攻占荷兰各港口的作战。1944年11月，他调任驻意大利第一加拿大军军长，后转赴荷兰。1945年5月5日，他在瓦赫宁根接受德军布拉斯科维茨将军就荷兰境内德军投降的谈判。战后他出任陆军总参谋长，1951年晋升上将并兼任加拿大首任三军参谋长委员会主席，1960年退役。1968年获颁加拿大勋章，此后在卡尔顿大学任教，1969年9月12日在渥太华逝世。"
 CBIO_CAN_chuck_crate_desc:0 "查尔斯·布兰德尔·查克·克雷特，生长于安大略省北部，1927年随家迁居多伦多一处工人阶级社区。就读约克纪念中学期间，受大萧条冲击转向激进思想，与英国法西斯联盟取得联系后加入总部设在温尼伯的加拿大法西斯联盟，出任党报雷霆主编并旋即成为党魁；1936年该党宣称拥有八千名成员，环球邮报称二十一岁的克雷特为加拿大头号法西斯分子。1940年该党因战时防务条例遭取缔，他签署声明断绝与该党关系以避免被拘押，但至1942年仍在温尼伯继续编辑雷霆，将时局归咎于犹太人、天主教会及共济会，1943年6月在阿尔伯塔省埃德蒙顿被捕，被控鼓吹非法组织政策。此后他加入加拿大皇家海军，在苏格兰基地任邮政兵及炮手，其间结识未来妻子。战后他长期从事金矿工作，出任矿业工会代表及组织者，曾为原住民矿工争取同工同酬；他协助创立耶洛奈夫原住民友谊中心、公共图书馆及地方报纸，并代理多格里布世袭酋长米歇尔·西基就原住民狩猎权案上诉至最高法院。他与语言学家查尔斯·洛弗尔合作研究加拿大英语词汇，参与编纂加拿大英语历史原则词典，晚年任教于多个小镇及黑脚族保留地，教授商业英语、文学及社会研究。1992年3月7日逝世。"
 CBIO_CAN_first_nations_council_desc:0 "代表加拿大各第一民族政治诉求的集体机构。第一民族又译第一国族，是数个加拿大境内民族的通称，法定与印第安人同义，指的是在现今加拿大境内的北美洲原住民及其子孙，但是不包括因纽特人和梅蒂人。在加拿大，原住民的全国性组织是第一民族议会。第一次世界大战和第二次世界大战中，大量第一民族成员加入加拿大军队服役。"
 CBIO_CAN_frederick_m_w_harvey_desc:0 "弗雷德里克·莫里斯·沃森·哈维，出生于爱尔兰米斯郡阿斯博伊，青年时代代表爱尔兰出战国际橄榄球赛，1908年移居加拿大阿尔伯塔省，先后任测量员及牧场工人。1916年他在梅迪辛哈特加入加拿大骑马来复枪第十三团，赴欧后转入斯特拉斯科纳勋爵骑兵团。1917年3月27日，他在法国吉扬库尔村战斗中率部冲锋，只身冲入敌军战壕击毙机枪手并缴获机枪，因此获颁维多利亚十字勋章，最初曾授予优异服务勋章，后改授此更高荣誉；1918年3月在莫勒伊森林骑兵冲锋战斗中负伤，获颁军功十字勋章及法国十字勋章。战后他留任斯特拉斯科纳骑兵团，1923年晋升上尉，1923年至1927年任皇家军事学院体育教官，1938年晋升中校并出任该团团长，1939年晋升准将。1945年，其独子在荷兰随温尼伯来复枪团作战时负伤身亡。哈维本人同年年底退役，结束三十年军旅生涯，晚年任猎马及障碍赛裁判，1958年至1966年出任斯特拉斯科纳骑兵团名誉上校。1980年8月24日在阿尔伯塔省麦克劳德堡逝世。"
 CBIO_CAN_george_croil_desc:0 "乔治·米切尔·克罗伊尔，出生于美国威斯康星州密尔沃基，苏格兰移民之后，11岁随家人移居蒙特利尔。一战爆发后他加入戈登高地团步兵，1916年转入英国皇家飞行队接受飞行训练，此后在中东战场服役，据加拿大退伍军人事务部记载曾长期担任阿拉伯的劳伦斯的专属飞行员，因功获优异飞行十字勋章。1919年他转入加拿大航空局，参与阿尔伯塔省机场建设，1924年加拿大皇家空军成立时为创始军官之一，此后历任驻英联络官、坎普波登基地指挥官等职，两度赴帝国国防学院深造。1934年，他出任加拿大皇家空军高级航空军官，实际统领该军；1938年促成该军脱离陆军独立建制，其职位随之升格为首任空军参谋长。1940年因与国防部航空部长意见不合被迫辞去参谋长职务，转任督察长直至1944年该职撤销退役。1959年4月8日在温哥华逝世。"
 CBIO_CAN_george_jones_desc:0 "乔治·欧文·约翰逊，全名与本条目名单原名略有出入，出生于安大略省伍德斯托克。一战期间他原拟加入皇家海军航空队，后转赴英国皇家飞行队服役，1917年赴法作战，先后在第84及第24中队担任战斗机飞行员，击落多架敌机及一具观测气球，因功获军功十字勋章，成为王牌飞行员。战后他留在加拿大空军系统内发展，历任温尼伯、特伦顿等基地指挥官，两次赴帝国国防学院深造，1938年出任加拿大皇家空军西部航空司令部首任指挥官。1940年出任空军人事与训练部长，主持英联邦空军训练计划的场站建设，1941年他协助与英方谈判促成加拿大空军联队建制，使加拿大军官获得海外指挥经验；1942年渥太华会议期间代理空军参谋长职务。此后历任皇家加拿大空军东部航空司令部指挥官、驻海外总司令等职，1947年以空军元帅军衔退役，晚年定居不列颠哥伦比亚省温哥华，1980年3月28日逝世。"
 CBIO_CAN_george_pearkes_desc:0 "乔治·皮克斯，出生于英格兰赫特福德郡沃特福德，1906年随兄长移民加拿大阿尔伯塔省从事农牧业，1911年加入西北骑警在育空地区服役。一战爆发后他加入加拿大远征军骑马步枪团，历经五次负伤，1917年10月在帕斯尚尔战役中身负大腿枪伤仍坚持指挥部队夺取并守住既定目标，因此获颁维多利亚十字勋章，并先后获军功十字勋章及优异服务勋章，是唯一集齐这三项英帝国最高战斗荣誉的加拿大人。战后他选择留在正规军，任职于加拿大轻步兵团及多地参谋岗位，1936年赴帝国国防学院深造。1938年至1940年任卡尔加里第十三军区指挥官，二战爆发后出任第2步兵旅旅长，1940年患脊髓膜炎几近丧命后奇迹康复，同年7月接替麦克诺顿出任第1加拿大步兵师师长。1941年一度代理指挥加拿大军，1942年调回加拿大出任太平洋司令部总司令，负责西海岸本土防务，1944年平息特雷斯军营征兵哗变事件。战后他投身政坛，当选四届联邦议员，1957年至1960年出任国防部长，1960年出任不列颠哥伦比亚省副总督至1968年，1984年5月30日在维多利亚逝世。"
 CBIO_CAN_guy_simonds_desc:0 "盖伊·西蒙兹，出生于英格兰伯里圣埃德蒙兹，父亲是英国陆军军官，1911年举家移居不列颠哥伦比亚省维多利亚。他就读渥太华阿什伯里学院，1921年至1925年就读金斯顿皇家军事学院，1926年获委任加拿大皇家炮兵。两战之间他历任炮兵教官、参谋，赴英国坎伯利参谋学院深造，因见解出众在加拿大国防季刊上发表多篇现代机械化战争论文。1939年他随第1加拿大步兵师赴英，历任作战参谋，1942年出任第1步兵旅旅长，1943年晋升少将并接连出任第2、第1步兵师师长，率部参加西西里岛及意大利战役，因功获优异服务勋章。1944年1月晋升中将，出任第2加拿大军军长，年仅四十岁即为英联邦最年轻的军级指挥官，率部参加诺曼底战役及法莱斯合围，发明袋鼠装甲运兵车。1944年9月至11月，他在克里勒因病休养期间代理指挥第一加拿大集团军，指挥斯海尔德河口战役。战后历任帝国国防学院、加拿大陆军参谋学院及国防学院院长，1951年至1955年出任总参谋长，主持陆军改组以应对朝鲜战争及北约需求，1970年获颁加拿大勋章，1974年5月15日在多伦多逝世。"
 CBIO_CAN_harold_edwards_desc:0 "哈罗德·爱德华兹，绰号格斯，出生于英格兰兰开夏郡乔利，1903年随家人移居新斯科舍省格拉斯湾，14岁辍学在煤矿当巷道通风童工，业余自学，18岁已升任矿场首席电工。1915年他凭自学成绩获英国皇家海军航空队录取，1916年获飞行员资质，赴法国任战斗机飞行员，一战期间曾被击落俘虏，两次越狱未遂后被押解至战争结束。1920年他重返加拿大加入新组建的皇家空军，参与曼尼托巴省航空测绘及达特茅斯基地建设，1936年该基地在他指挥下参与营救穆斯河金矿灾难幸存者的行动。1940年出任空军人事部长，负责英联邦空军训练计划的人事事务，1941年11月至1943年出任驻海外皇家加拿大空军总司令，力主加拿大化，推动海外皇家加拿大空军中队在加拿大指挥官统率下独立作战。因健康恶化于1943年底返回加拿大，1944年退役，1952年2月23日在美国亚利桑那州斯科茨代尔逝世。"
 CBIO_CAN_harry_crerar_desc:0 "哈里·克里勒，出生于安大略省汉密尔顿，毕业于金斯顿皇家军事学院，一战前曾在安大略水电委员会任工程师。一战期间他在加拿大炮兵服役，晋升中校，因功获优异服务勋章。战后他选择留在军中，1923年至1924年赴英国坎伯利参谋学院深造，1934年赴帝国国防学院进修，1935年出任军事行动与情报处主任，1939年短暂出任皇家军事学院院长后奉召回渥太华筹备动员计划。二战爆发后，他赴伦敦出任加拿大军事总部作战参谋准将，1940年出任陆军总参谋长，主持第一加拿大集团军的组建与训练体系搭建。1941年底赴英出任第2步兵师师长，1943年10月率第一加拿大军赴意大利，1944年3月调回英国接替安德烈·麦克诺顿指挥第一加拿大集团军，率部参加诺曼底战役、法莱斯合围及莱茵兰战役，1944年11月晋升上将，成为首位在战场上获此军衔的加拿大军官。1946年退役，此后出任加拿大驻捷克斯洛伐克、荷兰及日本外交使节，1965年4月1日在渥太华逝世。"
 CBIO_CAN_harry_dewolf_desc:0 "哈里·德沃尔夫，1903年6月26日出生于新斯科舍省贝德福德的一个船舶经纪商家庭，1918年15岁时进入设于卑诗省埃斯奎莫尔特的加拿大皇家海军学院，1921年毕业后赴英国皇家海军战列舰实习。两战之间他历任加拿大驱逐舰军官及扫雷艇艇长等职。1939年，他出任驱逐舰圣劳伦斯号舰长，协助敦刻尔克撤退并执行大西洋护航任务，1940年营救遭德国潜艇击沉的阿兰多拉星号邮轮八百余名幸存者。1943年8月，他出任部落级驱逐舰海达号舰长，率舰在英吉利海峡多次夜战中击沉德军舰艇，因指挥果敢被水兵称为强硬的哈里；1944年4月，他冒险营救海达号姊妹舰阿萨巴斯坎号的落水官兵，因此获优异服务勋章。战后，他先后指挥加拿大首艘航空母舰勇士号与庄严号，1948年晋升海军少将并出任太平洋舰队司令，1950年任海军副参谋长，1952年赴华盛顿任加拿大军事顾问。1956年晋升海军中将并出任海军参谋长，1960年7月31日退役。2000年12月18日在渥太华逝世。"
 CBIO_CAN_ht_bailliegrohman_desc:0 "哈罗德·汤姆·贝利-格罗曼，1888年1月16日出生于加拿大不列颠哥伦比亚省维多利亚市，1903年即赴英国加入皇家海军学校，此后整个海军生涯均在英国皇家海军服役，而非加拿大皇家海军。一战期间，他历任驱逐舰及扫雷舰艇长，在多佛巡逻队服役并获颁优异服务勋章。两战之间，他历任驻华英国海军使团团长、皇家海军训练舰艇长等职，1930年晋升上校。1938年至1940年，他出任朴次茅斯皇家海军训练基地及战列舰拉米利斯号舰长，后者驶往地中海舰队，其间年轻的菲利普亲王曾在该舰任海军学员。1940年调回英国后晋升少将，1941年参与英军自希腊撤退的海上组织工作，因此获颁巴斯勋章。1942年出任联合作战部队少将，参与迪耶普突袭的早期策划但未实际指挥该行动。1943年晋升中将，出任驻哈里奇旗官；1945年5月，他在基尔升起白船旗，接管解除德国海军武装的工作。1946年退役，1978年9月23日在英国逝世。"
 CBIO_CAN_ian_a_mackenzie_desc:0 "伊恩·A.·麦肯齐，出生于苏格兰阿西恩特，爱丁堡大学法学学士，因负担不起苏格兰律师执业费用，1914年移居温哥华。一战期间他随西福斯高地团第72营服役。战后从政，1920年当选不列颠哥伦比亚省议会议员，1928年短暂出任省务卿。1930年他获任命进入联邦内阁任移民及殖民部长兼印第安事务总监，同年虽在大选中保住议席但自由党整体败选，此后在野。1935年自由党重新执政后，他出任国防部长（1935年至1939年），负责战前重整军备工作，1937年布伦式机枪采购丑闻令其声誉受损；战争爆发后转任养老金及国民健康部长（1939年至1944年）。作为不列颠哥伦比亚省在内阁中的代表，他是1942年决定将日裔加拿大人强制迁离西海岸这一政策的关键推动者。1944年至1948年出任自由党下院领袖，1947年获纳入枢密院，1948年出任参议员，1949年9月2日在阿尔伯塔省班夫逝世。"
 CBIO_CAN_j_s_woodsworth_desc:0 "J·S·伍兹沃思，出生于安大略省伊托比科，早年就读卫斯理学院与牛津大学，1900年被按立为循道会牧师。他在温尼伯贫民区主持全民传道会，长期从事移民与贫困人群社会工作，并因此逐渐转向社会改革立场，1918年因反对教会支持第一次世界大战而脱离教职。1919年温尼伯大罢工期间，他因在罢工者报纸上发表言论被控煽动性诽谤罪被捕。1921年，他当选国会议员，代表温尼伯选区直至逝世，并在国会中长期领导姜汁小组，推动老年养老金等社会立法。大萧条期间，他联合各地农民、劳工与社会主义团体，于1932年发起成立合作共和联盟，出任首任领袖，1933年联盟通过纲领性文件里贾纳宣言，确立政纲。他是坚定的和平主义者，1939年加拿大宣战时是国会中唯一投票反对参战的议员，因此失去党内领导地位。1940年当选后不久中风，健康持续恶化，1942年3月21日在温哥华逝世，骨灰撒入乔治亚海峡。"
 CBIO_CAN_james_d_prentice_desc:0 "詹姆斯·道格拉斯·普伦蒂斯，绰号闲聊，1899年3月25日出生并成长于不列颠哥伦比亚省维多利亚市。因父亲反对他加入新成立的加拿大皇家海军，他于1912年转而加入英国皇家海军，1934年因大萧条时期裁员以海军中校军衔退役，返回不列颠哥伦比亚经营牧场。1939年战争爆发后，他重返现役，加入加拿大皇家海军，先后指挥护卫舰查姆布利号并出任加拿大护卫舰高级军官，在纽芬兰护航部队期间取得加拿大海军首次击沉德国潜艇的战果，因功获优异服务勋章。他随后负责制定加拿大驱逐舰反潜战术，1943年出任加拿大驱逐舰高级舰长并指挥渥太华号驱逐舰，参与诺曼底登陆护航及比斯开湾多次击沉德国潜艇的行动，两获优异服务十字勋章。战争结束时官至上校，此后短暂出任加拿大总督副官，1946年退役。1979年3月14日在不列颠哥伦比亚逝世。"
 CBIO_CAN_james_ilsley_desc:0 "詹姆斯·伊尔斯利，出生于新斯科舍省萨默塞特，先后就读阿卡迪亚大学与达尔豪西大学，获准执业律师后于1926年当选自由党国会议员。1935年出任国民税收部长，1940年5月短暂兼任邮政总长，同年7月接掌财政部长一职并主持整个二战期间的国家财政，将所得税从仅覆盖少数富裕阶层的阶级税大幅下沉为面向全民的税种，主导胜利公债发行，1941年推行工资物价管制，并以放弃私家车、改乘街车通勤的方式倡导公众节俭。尽管加税，他在1945年仍被评为内阁最受欢迎的成员。1945年至1946年间他在联邦省级重建会议上提出的财政联邦制改革方案遭安大略、魁北克拒绝，深感失望后于1946年转任司法部长，1948年退出政坛重执律师业。1949年获任命为新斯科舍省最高法院法官，1950年升任该省首席大法官，任职至1967年1月14日，直到在哈利法克斯逝世。"
 CBIO_CAN_james_stanley_scott_desc:0 "詹姆斯·斯坦利·斯科特，出生于魁北克省罗伯瓦尔，从加拿大炮兵部队调入英国皇家飞行队，1916年7月尽管座机遭敌军炮火严重损坏，仍深入敌后攻击一列火车，因功获颁军功十字勋章；所在部队后并入皇家空军，停战后他获颁空军十字勋章。战后返回加拿大，1921年晋升中校并出任加拿大空军指挥官，1922年该职改称局长后由林赛·戈登接任；1924年他晋升上校，再度出任皇家加拿大空军代理局长，1925年至1928年任正式局长，主持该军早期建制事务。此后该职一度调整，他转任其他岗位；二战爆发后他以大队长军衔重返现役，1939年出任第一无线电学校指挥官，1941年调任第二新兵接收站指挥官，1942年出任安大略省圣厄仁第十三服务飞行训练学校指挥官，负责英联邦空军训练计划下的人员训练工作。1975年7月19日在哈利法克斯逝世。"
 CBIO_CAN_john_murchie_desc:0 "约翰·卡尔·穆切，出生于新不伦瑞克省埃德蒙斯顿，1915年从金斯顿皇家军事学院获军事资格证书，同年随皇家加拿大炮兵团赴法国参战，服役至1917年。两战之间他长期留任常备军，1929年至1930年赴英国坎伯利参谋学院深造。二战爆发后，他于1939年出任国防部总参谋处参谋官，1940年任军事行动处处长，1941年任军训与参谋事务处处长，同年调赴伦敦加拿大军事总部任参谋准将，1942年升任副总参谋长。1944年11月22日，正是他向国防部长麦克诺顿汇报国内志愿征兵计划彻底失败、几乎无人自愿参加海外服役，促成了麦克诺顿当晚向内阁通报征兵危机的关键时刻。此后于1943年12月27日至1945年8月21日出任总参谋长，主持战争最后阶段及复员事务，1946年退役。1966年3月5日在渥太华逝世。"
 CBIO_CAN_kenneth_stuart_desc:0 "肯尼思·斯图尔特，出生于魁北克省三河市，圣公会牧师之子，1911年毕业于金斯顿皇家军事学院，加入加拿大皇家工兵部队。一战期间他随军赴欧服役，因战功获军功十字勋章及优异服务勋章。两战之间他历任加拿大国防季刊编辑、皇家军事学院教官、国防部军事行动与情报处处长（1938年），1939年出任皇家军事学院院长。二战爆发后他历任副总参谋长（1940年）、代总参谋长（1941年3月起）、总参谋长（1941年12月至1943年12月），主持陆军的大规模动员与扩张。1943年12月起代理第一加拿大集团军总司令，1944年3月起改任驻伦敦加拿大军事总部参谋长，任内就步兵伤亡预测提出偏乐观的估算，成为1944年征兵危机中促成海外征兵决定的重要因素之一；他本人持支持征兵立场，麦克诺顿出任国防部长后将其解职。他曾反对将日裔加拿大人强制迁离西海岸。长期疾病缠身的他于1945年11月3日在渥太华逝世，距其五十四岁生日仅数周。"
 CBIO_CAN_leo_richer_lafleche_desc:0 "利奥·里谢·拉弗莱什，出生于美国堪萨斯州康科迪亚，同年随父母迁居魁北克省索雷尔。一战期间他随皇家第22营赴欧作战，1916年6月身负重伤倒在战场，被战友冒着炮火抬回后方，因功获优异服务勋章及法国荣誉军团勋章。战后他晋升中校，出任蒙特利尔第四军区仓库指挥官，1925年协助创立加拿大退伍军人协会，1929年出任该会全国会长。1932年至1939年他出任国防部副部长兼国防委员会副主席，战争爆发前夕曾短暂出任驻巴黎武官。二战期间他历任战时服务副部长及国家电影局局长，1942年在补选中当选国会议员，击败后来出任蒙特利尔市长的让·德拉波，同年出任国家战时服务部长直至1945年。战后他出任加拿大首任驻希腊大使，此后历任驻澳大利亚高级专员及驻阿根廷、乌拉圭大使，1955年回国，1956年3月7日逝世。"
 CBIO_CAN_leonard_w_murray_desc:0 "伦纳德·W·默里，出生于新斯科舍省格兰顿，14岁进入哈利法克斯新成立的加拿大皇家海军学院，是首批21名学员之一。1913年起先后在英国装甲巡洋舰及多艘英加战舰服役，一战期间见证德国公海舰队在斯卡帕湾投降。两战之间，他长期在英国皇家海军舰艇服役并赴皇家海军参谋学院深造，曾指挥加拿大驱逐舰萨格奈号及东西两岸海军基地。1941年，他晋升准将并出任纽芬兰护航部队司令，负责组织北大西洋护航体系，被视为该部队的奠基人。1943年4月晋升少将，出任加拿大西北大西洋战区总司令，统辖该区域盟军海空力量，是二战期间唯一指挥一个盟军战区的加拿大人。1945年5月欧战胜利日，哈利法克斯发生水兵骚乱，他因未能有效约束休假水兵而受到指责，随即辞去职务并移居英国，此后从事律师工作。1971年11月25日在英国德比郡逝世。"
 CBIO_CAN_lindsay_gordon_desc:0 "詹姆斯·林赛·戈登，出生于魁北克省蒙特利尔，就读蒙特利尔中学及麦吉尔大学。一战期间他加入英国皇家海军航空队任飞行员，率机队多次出海攻击敌机并屡次协助抢救水上飞机遇险人员，因功于1918年获颁优异飞行十字勋章。战后他返回加拿大空军系统，1922年至1924年出任皇家加拿大空军首任局长，主持该军从加拿大空军更名为皇家加拿大空军的转型工作。1932年至1933年，他出任该军高级航空军官，即当时的最高职务，后由乔治·欧文·约翰逊接任。1938年，他晋升空军副元帅，此后健康每况愈下，1940年1月因病退役，同年3月3日逝世，距其退役仅数周。"
 CBIO_CAN_lloyd_samuel_breadner_desc:0 "劳埃德·塞缪尔·布莱德纳，出生于安大略省卡尔顿普莱斯，1915年加入英国皇家海军航空队，一战期间在西线担任战斗机飞行员，因率机队多次击落敌机获颁优异服务十字勋章。1919年以少校军衔退役，1920年重获委任并晋升中队长，1924年加拿大皇家空军成立后转入该军，出任坎普波登训练基地指挥官，1928年至1932年任加拿大皇家空军局长，其后指挥特伦顿基地并赴帝国国防学院深造。1940年5月，他接替乔治·克罗伊尔出任空军参谋长，主持战时该军的大规模扩张，1941年11月晋升空军元帅。1944年1月调任驻伦敦海外皇家加拿大空军总司令。1944年11月，其独子在新斯科舍空军训练事故中身亡。1945年11月退役时晋升空军上将，成为加拿大唯一获此军衔者。1952年3月14日在美国波士顿逝世。"
 CBIO_CAN_louis_st_laurent_desc:0 "路易·圣洛朗，出生于魁北克省康普顿，父亲为法裔商人，母亲为爱尔兰裔，自幼双语成长。他就读圣查尔斯学院及拉瓦尔大学，1905年取得法学学位后长期执业，成为魁北克顶尖法律界人士，两度出任加拿大律师协会会长，并两度婉拒最高法院法官任命。1941年，在自由党魁北克省核心人物欧内斯特·拉普安特病逝后，年近六旬的他应麦肯齐·金之请出任司法部长兼总检察长，翌年补选当选国会议员，二战征兵危机期间坚定支持麦肯齐·金。1946年他出任外交部长，代表加拿大出席联合国筹建会议，推动加拿大加入北约的构想。1948年他接替退休的麦肯齐·金出任自由党党魁及总理，是继洛里埃之后第二位法裔加拿大总理，1949年及1953年连续两次大选中率党获压倒性胜利，任内纽芬兰加入联邦、加拿大参与朝鲜战争及苏伊士危机斡旋。1956年他强推跨加拿大输气管道法案引发输气管道辩论风波，1957年大选意外落败，1958年辞去党魁职务退休。1973年7月25日在魁北克市因心力衰竭逝世。"
 CBIO_CAN_mackenzie_king_desc:0 "麦肯齐·金，生于安大略省贝林，即今日基奇纳市，早年就读多伦多大学、芝加哥大学与哈佛大学，攻读政治经济学。1900年出任加拿大劳工部首任副部长，1908年当选国会议员，翌年出任首任联邦劳工部长。1919年威尔弗里德·洛里埃逝世后，他当选自由党党魁，此后三度组阁，任期分别为1921年至1926年、1926年至1930年、1935年至1948年，是加拿大历史上任期最长的总理。他行事审慎、善于妥协，长期周旋于英语与法语两大族群及各派政治力量之间。1939年加拿大参战后，他推动战时工业动员与社会保障立法，包括1940年设立失业保险；因征兵问题在国内引发严重分歧，他于1942年就海外征兵举行全国公投以化解压力。1948年退休，1950年7月22日在魁北克金斯米尔逝世。"
 CBIO_CAN_newton_wesley_rowell_desc:0 "牛顿·韦斯利·洛维尔，出生于安大略省米德尔塞克斯县，1891年获准执业律师，此后成为多伦多法律界翘楚，1902年获封御用大律师。1911年至1917年出任安大略省议会自由党反对派领袖，主张禁酒改革。1917年因支持征兵与劳雷尔及联邦自由党决裂，加入博登联合政府出任枢密院院长兼内阁战争委员会副主席，同年当选国会议员，出席帝国战争内阁会议，战后出任加拿大首任卫生部长。1920年他拒绝加入梅根政府，1921年不再连任，此后专注法律事业，多次在加拿大最高法院及枢密院司法委员会出庭，1929年代理人身案上诉并获胜，确立加拿大女性可获任命为参议员的先例；他也是加拿大联合教会的创会核心人物之一。1936年获任命为安大略省首席大法官，1937年出任洛维尔-西罗瓦联邦省级关系皇家委员会主席，1938年5月因心脏病及中风失语被迫辞去两职。1941年11月22日在多伦多逝世。"
 CBIO_CAN_percival_john_montague_desc:0 "珀西瓦尔·约翰·蒙塔古，出生于安大略省当维尔，先后就读上加拿大学院、多伦多大学与奥斯古德堂法学院，1905年毕业，1907年在安大略省和马尼托巴省获得律师资格，此后在温尼伯执业。第一次世界大战期间，他休职从军，任第2加拿大师副官兼军需长，因功获颁军功十字勋章及优异服务勋章。战后重返法律界，1928年获封御用大律师，1932年出任马尼托巴省高等法院法官。第二次世界大战爆发后，他再度休职从军，赴伦敦加拿大军事总部历任副官兼军需长助理、副总监、参谋长及行政总长，1943年出任海外加拿大陆军法务总监，1945年以中将军衔退役。战后他重返马尼托巴司法界，1951年升任马尼托巴上诉法院法官，1959年退休。1966年6月11日在温尼伯逝世。"
 CBIO_CAN_percy_nelles_desc:0 "珀西·沃克·内勒斯，1892年1月7日出生于安大略省布兰特福德，1909年以渔业保护局学员身份投身未来的加拿大海军，是最早七名学员之一，1910年加拿大皇家海军成立后转入尼奥比号巡洋舰任海军学员。此后二十余年间，他辗转于加拿大皇家海军与英国皇家海军之间历练，1930年在南美巡航途中舰长猝逝后代理指挥英舰龙号巡洋舰，成为首位指挥英国主力舰艇的加拿大军官。1933年，他成为加拿大皇家海军史上首位常任上校，1934年出任海军参谋长，主持该军在大萧条时期的维系与二战爆发后的急速扩张，任内潜艇一度侵入圣劳伦斯湾，加拿大护航兵力一度占北大西洋护航总量的四成。1944年1月，因与海军部长在军官培训与管理问题上的分歧，他被调任驻伦敦海外海军武官，负责协调诺曼底登陆的加拿大海军行动。1945年1月以海军上将军衔退役，定居不列颠哥伦比亚省维多利亚，1951年6月13日在当地逝世。"
 CBIO_CAN_r_b_bennett_desc:0 "理查德·贝德福德·本内特，出生于新不伦瑞克省霍普韦尔希尔，达尔豪西大学法学毕业后于1897年移居卡尔加里执业律师，凭法律业务及多项投资成为加拿大首富之一。他早年历任西北地区及阿尔伯塔省议会议员，1911年当选联邦国会议员，1921年出任梅根内阁司法部长，1926年出任财政部长。1927年他当选保守党党魁，1930年大选中以积极应对大萧条的承诺击败麦肯齐·金，成为加拿大第十一任总理，也是首位来自阿尔伯塔的总理。执政期间，他先后推出失业救济法案等措施，后期转向仿效美国罗斯福新政的干预政策，建立加拿大广播委员会及加拿大银行，但未能扭转经济颓势，1935年遭遇大败下野，此后继续担任党魁至1938年退休移居英国。1941年，经丘吉尔提名、麦肯齐·金特批，他受封米克勒姆子爵，成为唯一获封贵族的加拿大总理；二战期间在比弗布鲁克勋爵麾下协助飞机生产事务。1947年6月26日在英国米克勒姆沐浴时突发心脏病逝世，安葬于当地，是唯一未葬于加拿大的总理。"
 CBIO_CAN_raymond_collishaw_desc:0 "雷蒙德·科利肖，出生于不列颠哥伦比亚省纳奈莫，15岁起在加拿大渔业保护局船只上工作，一战爆发后于1916年加入英国皇家海军航空队。他在法国战场屡立战功，曾率领清一色加拿大飞行员组成的黑色编队，创下皇家海军航空队单日击落六架敌机的纪录，战争结束时以60架的战绩成为该军种头号王牌，也是英联邦第二高分王牌，获颁优异服务勋章、优异飞行十字勋章等多项荣誉。战后他获英国皇家空军永久军职，1919年至1920年参加英国支援白俄军队在南俄及波斯对布尔什维克的作战。二战爆发时，他是英国皇家空军驻埃及及西部沙漠的高级指挥官，1940年指挥所部参与罗盘行动重创意大利军队，后因与上级意见分歧于1941年被解职调回英国，1942年晋升空军中将，指挥驻苏格兰第14战斗机大队。1943年7月被迫退役，此后转任民防联络官至战争结束，1945年返回加拿大从事矿业经营，1976年9月28日在西温哥华逝世。他终身效力于英国皇家空军而非加拿大皇家空军。"
 CBIO_CAN_robert_leckie_desc:0 "罗伯特·莱基，出生于苏格兰格拉斯哥，16岁移居加拿大多伦多，在叔父的渔网厂工作。一战期间加入英国皇家海军航空队，驾驶水上飞机在北海执行反潜巡逻，1917年5月击落齐柏林飞艇L22，1918年8月又击落飞艇L70，是唯一击落两艘齐柏林飞艇的飞行员，因功获优异服务勋章、优异服务十字勋章及优异飞行十字勋章。战后他短暂借调加拿大空军局任飞行业务主任，参与首次跨加拿大飞行及加拿大民航初创，此后返回英国皇家空军历任中队长、站长，1935年出任皇家空军训练主任，1938年至战争初期出任地中海皇家空军指挥官。1940年他返回加拿大主持英联邦空军训练计划，1942年转入加拿大皇家空军，1944年1月晋升空军元帅并出任空军参谋长，主持战争最后阶段及战后初期的空军事务，1947年退役。此后担任加拿大空军幼年团顾问，1975年3月31日在渥太华逝世。"
 CBIO_CAN_robert_manion_desc:0 "罗伯特·曼尼恩，出生于安大略省彭布罗克，爱尔兰天主教移民之后，先后在皇后大学及爱丁堡大学攻读医学，后在故乡定居行医。一战期间他随加拿大陆军医疗队服役，隶属第21营，因在维米岭战役中的英勇表现获颁军功十字勋章。1917年他以支持征兵的联合党议员身份当选国会议员，代表安大略省韦廉堡；战后加入保守党，历任梅根内阁士兵安置部长、邮政总长，本内特内阁铁路运河部长（1930年至1935年）。1935年大选落选后，1938年在未持有国会议席的情况下当选保守党党魁，凭天主教背景及与法裔妻子的婚姻争取魁北克支持。尽管一战时支持征兵，他在1940年大选中却以反对征兵及组建战时联合政府为纲领参选，但该党未能扩大席位且他本人再度落选，两个月后辞去党魁职务。此后出任民防处处长，1943年7月2日在渥太华因病猝逝。"
 CBIO_CAN_thomas_victor_anderson_desc:0 "托马斯·维克托·安德森，出生于渥太华，1900年毕业于金斯顿皇家军事学院，随后加入加拿大皇家工兵部队，历任中尉、上尉、少校。第一次世界大战期间，他率第3加拿大师工兵部队在西线作战，1917年在维米岭战役前夕负伤，因战功四次获通令嘉奖并获授优异服务勋章。两战之间，他历任皇家军事学院教官、国防部军训与参谋事务主任、第十军区温尼伯及第二军区多伦多指挥官，1935年出任军需总监，1936年晋升少将。1938年11月，他出任加拿大陆军总参谋长，第二次世界大战爆发后主持陆军初期动员与首批海外师的组建工作，任内受限于财政紧缩与和平时期积弱的常备军规模。1940年7月卸任总参谋长，转任中加拿大督察长至1942年，1943年退役。1972年11月8日在多伦多逝世。"
 CBIO_CAN_tim_buck_desc:0 "蒂姆·巴克，出生于英格兰贝克尔斯，早年学习机械技工手艺，1910年移民加拿大。他很快投身多伦多的激进工人运动，据其本人回忆曾参与1921年安大略圭尔夫附近加拿大共产党的秘密创建会议，此后逐步成为该党工会政策的主要制定者。1929年，他在党内清洗托洛茨基派与布哈林派之后出任总书记，此后长期忠实执行共产国际路线。1931年8月，多伦多的党部遭警方突袭，巴克与多名同僚被捕，同年11月以煽动罪被判处苦役，1932年至1934年服刑于金斯顿监狱，狱中曾遭多发子弹射入囚室的暗杀未遂。1940年该党因反对参战被查禁，他一度转入地下并流亡美国，1941年苏德战争爆发后转而支持加拿大战争努力。他六次参选联邦议员均未当选，1962年卸任总书记，此后担任名誉主席直至1973年3月11日在墨西哥库埃纳瓦卡逝世。"
 CBIO_CAN_william_kashtan_desc:0 "威廉·卡什坦，出生于蒙特利尔，1927年十八岁时加入青年共产主义者联盟，两年后转赴安大略南部从事组织工作，1930年出任该联盟总书记。1936年，他参与创立加拿大青年大会，鼎盛时期成员逾四十万人；西班牙内战爆发后他曾赴西班牙，归国后协助组建麦肯齐-帕皮诺营支援共和军。二战后他先后出任劳工进步党多伦多组织者、工业部主任、劳工书记及中央组织者，并多次代表该党参选联邦议员均未当选。1965年，在时任党主席蒂姆·巴克的反对声中，他仍在列斯利·莫里斯逝世后接任加拿大共产党总书记，此后连任二十三年直至1988年退休。他是坚定的亲莫斯科正统共产主义者，1970年公开谴责魁北克解放阵线为恐怖组织，1970年代反对西方共产党普遍转向的欧洲共产主义路线。1992年6月17日逝世。"
