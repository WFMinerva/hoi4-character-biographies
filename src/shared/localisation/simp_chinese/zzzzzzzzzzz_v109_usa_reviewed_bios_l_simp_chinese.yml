l_simp_chinese:
 CBIO_USA_franklin_delano_roosevelt_desc:0 "1882年生于纽约州海德公园,出身荷兰裔富裕望族,幼年在庄园中接受私人教育,哈佛大学毕业后入读哥伦比亚法学院,历任纽约州参议员、威尔逊政府海军部助理部长。1921年罹患脊髓灰质炎,下肢永久瘫痪,此后借助矫形器和轮椅行动。1928年当选纽约州长,1932年在大萧条最深重之际赢得总统选举,出任第三十二届总统。就职当日,全国性银行挤兑与倒闭已席卷大部分州,他在就职演说中以\"我们唯一需要恐惧的就是恐惧本身\"一语定调,随即宣布全国银行假日、稳住金融恐慌。此后以密集立法推行\"新政\",设立联邦存款保险公司、证券交易委员会、民间保育团、田纳西河谷管理局;1935年推动《社会保障法》与《国家劳动关系法》通过,在大萧条背景下深度扩张了联邦政府的经济干预边界。他先后约三十次发表广播\"炉边谈话\",绕过中间环节直接向全国民众解释政策,使总统借助广播与公众直接沟通成为此后的常规手段。1940年底以\"我们必须成为民主国家的军火库\"为主题发表炉边谈话,推动次年《租借法案》通过,向英国、中国、苏联等盟国提供大规模物资援助。1941年1月,他在国情咨文中提出言论自由、信仰自由、免于匮乏的自由、免于恐惧的自由这\"四大自由\",其理念经《大西洋宪章》延伸,成为战后国际人权话语的重要思想来源之一。1941年12月8日,在珍珠港遇袭次日,他向国会发表演讲,将袭击发生之日称为\"一个将永远活在耻辱中的日子\",国会随即几乎以全票通过对日宣战。此后他统筹美英苏大同盟,坚持\"欧洲优先\"战略,先后参与大西洋宪章会晤及开罗、德黑兰、雅尔塔等盟国最高级会议,协调对德、对日战略走向。他是美国历史上唯一一位四度当选的总统,1932、1936、1940、1944年连续胜选,执政横跨大萧条与第二次世界大战两大历史危机。在历史争议方面:1942年2月,他签署第9066号行政令,强制将约十二万名日裔美国人迁入内陆拘禁营,其中约三分之二为美国公民,既无针对个人的罪证,也无任何司法程序,这一行动在后世被广泛视为以种族为由的违宪大规模拘押,1988年联邦政府正式道歉并向幸存者发放赔偿。他对南方种族隔离制度的长期沉默,与维护南方民主党选票联盟的政治考量密切相关,新政所设立的众多联邦项目在南方各州执行时也普遍允许以种族为由差别对待受益者。1945年4月12日,他在佐治亚州温泉养病期间突发脑溢血逝世,距德国投降不足一月,未能亲见盟军最终胜利。"
 CBIO_USA_william_dudley_pelley_desc:0 "1885年生于马萨诸塞州林恩，父亲为卫理公会牧师。早年从事小说、剧本和新闻写作，曾为好莱坞撰写剧本，声称有过\"濒死\"神秘体验，由此转向神秘主义和种族政治。1933年1月30日——与希特勒就任德国总理同一天——在北卡罗来纳州阿什维尔组建\"美国银衫军\"（Silver Legion of America），成员身着银色制服、胸前绣红色\"L\"字，宣扬基督教民族主义和反犹太主义，将矛头指向新政、共产主义和所谓\"犹太金融阴谋\"，通过多份出版物持续散布亲法西斯宣传内容。1936年以\"基督党\"候选人参选总统，仅获极少数票。珍珠港事件后，他仍在其出版物中散布对罗斯福政府的煽动性内容，指控政府蓄意将美国拖入战争。1942年4月被联邦当局逮捕，1944年被联邦法院裁定多项煽动叛乱罪名成立，判处十五年有期徒刑。1950年以健康原因获假释出狱，此后转向飞碟研究和神秘主义写作，政治影响力已基本消散。1965年逝世于印第安纳州诺布尔斯维尔。"
 CBIO_USA_native_american_council_desc:0 "这一角色代表1930年代美国原住民部族的集体历史处境，并非指单一历史人物。1887年《道斯分地法》将大量部落公有土地强制拆分出售，数十年间原住民丧失大量公有土地。1934年，联邦印第安事务专员约翰·科利尔推动通过《印第安重组法》，结束土地进一步拆分，恢复部分部落自治和集体土地权利，被称为\"印第安新政\"，但各部落对相关条款的反应不一，部分部族投票否决了推行方案。二战期间，约四万余名美国原住民入伍服役，纳瓦霍族密语员在太平洋战区通讯保密中发挥独特作用。原住民在承担兵役的同时，仍普遍面临歧视性法律和保留地贫困问题。"
 CBIO_USA_carnot_wheeler_desc:0 "1882年生于马萨诸塞州，后移居蒙大拿州从事律业，历任州众议员及联邦检察官，1922年当选联邦参议员，此后连续代表蒙大拿州长期任职。1924年曾以进步党副总统候选人身份与罗伯特·拉福莱特搭档参选，获约六分之一选票后返回民主党。1930年代他与罗斯福新政关系复杂，对联邦权力扩张持有保留，是击败罗斯福1937年填充最高法院方案的关键国会力量之一。随着欧战爆发，他逐渐成为国会山最具影响力的孤立主义政治人物，1940年参与推动成立美国优先委员会，主张美国应筑牢本土防线而非卷入欧洲战争。1941年租借法案辩论期间，他在参议院发表措辞最为激烈的反对演说，将该法案斥为将国防决策权拱手交予一人、并将美国拖入战争的危险立法。珍珠港事件后，美国优先委员会随即宣告解散，孤立主义作为一种政治运动在美国国内迅速失去公信，他的政治影响力亦随之大幅消退。"
 CBIO_USA_earl_browder_desc:0 "1891年生于堪萨斯州威奇托，早年加入社会主义工人运动。俄国革命后转向共产主义，1920年代曾在亚洲从事工会组织工作。1930年代出任美国共产党总书记，主导党务，两度（1936、1940年）以共产党名义参选总统，均票数甚微。1940年以护照欺诈罪被判四年有期徒刑，1942年经罗斯福政府以战时统一战线为由减刑释放。珍珠港事件后将党调整为反法西斯统一战线立场，1944年将美国共产党解散改组为\"共产主义政治协会\"，主张战后资本主义与社会主义可共存，此主张后称\"白劳德主义\"。1945年法国共产党人杜克洛发文批评此路线为机会主义修正主义，美国共产党随即重建，白劳德于1946年被开除党籍，此后政治影响基本丧失。1973年逝世于新泽西州。"
 CBIO_USA_george_s_patton_desc:0 "1885年生于加利福尼亚州圣盖博。1912年代表美国参加斯德哥尔摩奥运会现代五项赛，列第五名。西点军校毕业后投身骑兵，一战期间转入坦克部队，参与圣米耶尔战役和默兹-阿尔贡攻势，负伤受勋。战间期大力倡导机械化战争理论，参与坦克战术教义的修订工作。1942年\"火炬行动\"中指挥西方特遣队在摩洛哥完成大规模两栖登陆。1943年北非战役中短暂整顿第二军，随后率第七集团军参与西西里岛战役，以快速推进夺取墨西拿。西西里战役期间，他先后在两家战地医院中掌掴神经衰竭的士兵，称其装病逃战，事件曝光后遭艾森豪威尔警告并被迫脱离一线指挥数月。1944年8月第三集团军在法国激活，迅速横扫布列塔尼并向东推进；同年12月德军\"凸出部战役\"发动后，他率部在约七十二小时内完成大规模旋转机动，驰援被围困的巴斯托涅。战后他公开批评去纳粹化政策，并以将纳粹党成员比附美国两党政治人物的言论引发强烈反弹，被解除第三集团军指挥权。1945年12月在德国境内因车祸重伤，同月二十一日逝世于海德堡。"
 CBIO_USA_omar_bradley_desc:0 "1893年生于密苏里州克拉克。毕业于西点军校1915届，该届日后将星云集，被称为\"繁星降临之届\"。一战期间留守国内担任教官，未赴欧洲。1943年北非战役中先作为观察员赴突尼斯前线，随后接替弗雷登道尔指挥第二军，参与突尼斯攻势尾声和西西里战役，因与士兵亲近、不事张扬的指挥风格获称\"士兵将军\"。1944年诺曼底登陆期间担任第一集团军司令，负责美军登陆段地面指挥；突破后晋升统率第十二集团军群，所辖美军最多时逾百万，为二战中最大规模的美国地面军建制。\"凸出部战役\"期间，第一集团军因战线危机被暂划归蒙哥马利指挥，此举在美英将领间引发持续争议。战后出任退伍军人事务局局长，着力改善退伍军人福利；1948年任陆军参谋长，次年出任参谋长联席会议首任主席，1950年晋升五星上将，任期横跨朝鲜战争爆发和麦克阿瑟被撤职等重大事件。1981年逝世于纽约。"
 CBIO_USA_dwight_d_eisenhower_desc:0 "1890年生于得克萨斯州丹尼森，成长于堪萨斯州阿比林。毕业于西点军校1915届，一战期间在本土训练坦克部队，未能赴欧。战间期随陆军将领福克斯·科纳在巴拿马系统研修战略，后赴菲律宾随麦克阿瑟负责组建菲律宾军队，在马尼拉工作至1939年，这段远东经历使他熟悉亚太战略方向。珍珠港事件后数周，马歇尔将其调入陆军参谋部战争计划处；1942年6月出任驻欧美军总司令，同年11月以盟军总司令身份指挥\"火炬行动\"，协调英美两国部队在北非登陆；随后主持北非、西西里战役，逐步磨合英美联合指挥关系，妥善处理巴顿、蒙哥马利等将领间的摩擦。1944年1月正式出任盟军最高统帅，总揽\"霸王行动\"策划与实施，6月6日诺曼底登陆成功，此后指挥盟军横穿法国进入德国本土，推动1945年5月德国投降。战后历任欧洲占领军总司令、陆军参谋长，1950年任北约最高统帅。1953年就任第三十四届总统，推行以核威慑为核心的对外政策，重视财政约束；卸任前公开警告军事与工业利益集团结合带来的政治风险。1969年逝世于华盛顿。"
 CBIO_USA_geoffrey_keyes_desc:0 "1888年生于新墨西哥州福特拜亚德，毕业于西点军校，骑兵军官出身。1942年\"火炬行动\"中在第七集团军架构下参与摩洛哥地区登陆作战。1943年西西里战役期间，他指挥临时军执行向巴勒莫方向的快速推进，配合巴顿整体部署。1944至1945年间在意大利战场担任第二军军长，参与意大利中北部的推进作战直至德军投降。战后出任美国驻奥地利部队司令，负责战后占领期间的盟军事务协调。1967年逝世。"
 CBIO_USA_lucian_truscott_desc:0 "1895年生于得克萨斯州查特菲尔德，骑兵军官出身。1942年赴英协助创建美国游骑兵部队，倡导高强度行军训练，要求部队以远高于常规标准的速度完成长距离行军，此训练规范后称\"特拉斯科特快步\"（Truscott Trot）。\"火炬行动\"期间作为旅级指挥官率部在摩洛哥完成两栖登陆。随后担任第三步兵师师长，参与北非和西西里战役。1944年安齐奥登陆后，2月约翰·卢卡斯因迟滞问题被解职，特拉斯科特接任第六军军长，指挥该军突破安齐奥防线并推进至罗马。1944年末接替马克·克拉克出任第五集团军司令，主导意大利战场最终推进阶段，至1945年5月意大利境内德军投降。1965年逝世。"
 CBIO_USA_mark_clark_desc:0 "1896年生于纽约州麦迪逊兵营，出身军人世家，西点军校毕业后参加一战并在法国负伤。1942年10月\"火炬行动\"前夕，他作为艾森豪威尔代表乘英国潜艇秘密登陆阿尔及利亚，与法属北非维希法军官员展开谈判，为盟军顺利登陆争取条件。随后出任第五集团军司令，指挥1943年9月萨勒诺登陆及此后意大利战场的漫长推进。卡西诺山之战历经四轮进攻，1944年2月盟军轰炸了卡西诺修道院，克拉克本人最初对轰炸持异议，认为德军尚未以修道院为阵地；轰炸后德军以废墟为掩体继续防守。1944年1月安齐奥登陆后，滩头部队在克拉克与卢卡斯的部署下停滞数月，遭德军反复进攻，丘吉尔等盟国高层对此提出批评。1944年5月安齐奥突破后，克拉克下令转向进入罗马，而未集中兵力切断向北撤退的德国第十军，致使大批德军逃脱并在更北方重组防线，这一决策是其指挥争议的核心焦点。6月4日率部进入罗马，成为首位攻入轴心国首都的盟军将领。战后任奥地利占领区美军司令，1952至1953年任联合国军总司令，签署朝鲜停战协定。1984年逝世于南卡罗来纳州查尔斯顿。"
 CBIO_USA_douglas_macarthur_desc:0 "二战名将。1880年生于阿肯色州小石城，出身军人世家，父亲为菲律宾殖民地驻军将领。1903年以第一名成绩毕业于西点军校，创下该校近三十年来最高学业纪录。一战期间随第四十二步兵师赴欧，以\"彩虹师\"师参谋长、后晋旅长身份多次亲赴前线壕沟，士兵称他\"战壕中的将军\"，累计获勋章逾二十枚。1930年出任陆军参谋长，1932年亲自督导军队驱散聚集于华盛顿的一战老兵，动用骑兵、步兵与坦克清场并焚毁帐篷区，这一行动在美国社会引发强烈批评。1935年卸任参谋长后赴菲律宾，出任联邦军事顾问，接受菲律宾政府授衔，以元帅身份统筹菲律宾军队建设。珍珠港事件后数小时内，菲律宾美国远东空军在克拉克机场遭日军轰炸，几乎全毁，麦克阿瑟对此前预警的应对迟缓后来受到历史学家的持续批评。此后他指挥巴丹半岛防御，兵力与补给均严重不足，1942年3月奉罗斯福命令撤离科雷吉多，临行前留言：\"我曾来过，我将返回。\"留下温赖特率部坚守至最终投降。此后他以澳大利亚为基地出任西南太平洋战区总司令，以跳岛战术绕过日军重兵据点、切断其补给线，逐步推进新几内亚战役和太平洋岛链作战。1944年10月，他涉水登上莱特岛海滩，向菲律宾民众宣告：\"我回来了。\"。1945年进一步解放吕宋岛。日本投降后，他以盟军占领军最高司令身份主持日本战后改造，推行含放弃战争条款的新宪法、农地改革与财阀解散，以相对低伤亡代价完成了日本非军事化转型，被部分史家视为占领史上罕见的成功案例。朝鲜战争爆发后，他指挥联合国军策划仁川登陆，以两栖奇袭切断北朝鲜军队后路，扭转了战局。然而随联合国军推进至中朝边界，中国人民志愿军于1950年10月大规模入朝，以夜间穿插、分割包围的山地战术重创联合国军多支部队，长津湖一役美国陆战一师被志愿军多面围困，在严寒中历经苦战突围，麦克阿瑟事后承认这是\"一支他完全未曾预料到的强大军队\"。他随后公开主张扩大战争规模、轰炸中国境内目标，并绕过白宫直接向国会共和党领袖发表政治声明，1951年4月被杜鲁门以不服从文官控制为由解除全部职务。返回美国后他在国会发表告别演说，以一首西点军校老歌的歌词作结：\"老兵永不死，只是逐渐凋零。\"1964年逝世于华盛顿，终年八十四岁。"
 CBIO_USA_walter_krueger_desc:0 "1881年生于普鲁士弗拉托（今波兰），出身德裔家庭，幼年随家人移居美国，以普通士兵身份入伍，后逐级晋升为军官，参加过美西战争。1941年率第三集团军参与路易斯安那大演习，指挥表现进入马歇尔视野。1943年调任太平洋战区，出任第六集团军司令，成为麦克阿瑟西南太平洋战区地面作战的主要执行者。他指挥第六集团军参与新几内亚系列战役，逐步清除日军沿岸据点，打通向菲律宾推进的走廊。1944年10月莱特岛登陆后，第六集团军承担菲律宾陆上主攻任务；1945年1月吕宋岛登陆后，率部进行历时数月的马尼拉及吕宋岛攻坚，歼灭大批日军守备力量。1967年逝世。"
 CBIO_USA_lloyd_fredendall_desc:0 "1883年生于怀俄明州夏延，西点军校毕业后长期在陆军服役。1942年\"火炬行动\"期间出任第二军军长，率部在阿尔及利亚东部完成登陆并向突尼斯方向推进。1943年2月，德军在卡塞林隘口发动进攻，第二军防线被突破，美军损失惨重，这是美国陆军在北非的最大规模战役挫折。事后评估指出，弗雷登道尔的前线指挥部建在距前沿甚远的峡谷掩体内，与各单位的通讯依赖耗时的加密电报，导致战场响应迟缓；部分指挥官亦批评其在战前越级干预具体战术部署。1943年3月艾森豪威尔以巴顿接替他指挥第二军。弗雷登道尔返回美国后晋升中将，担任训练指挥职务，未再执行海外作战指挥。1963年逝世。"
 CBIO_USA_leslie_mcnair_desc:0 "1883年生于明尼苏达州弗纳代尔，西点军校毕业，一战期间以炮兵军官赴法作战获勋。二战期间出任陆军地面军司令，主导美国陆军战时扩军的训练体系建设和师制改革，推行以三团制取代旧有四团制的\"三角形师\"编制，在有限资源下提高了师的机动效率。他同时力主以专设坦克歼击车单位应对敌方装甲，而非以坦克对抗坦克；这一理念在实战中暴露出局限，但已大规模推行并影响了整个美国陆军的编制建设。在他监督下，美国陆军完成了数十倍规模的战时训练动员。1944年7月\"眼镜蛇行动\"期间，他赴诺曼底前线亲自观察突破作战，7月25日盟军战略轰炸机在地毯轰炸中投弹偏差，炸弹落于美军阵地，麦克奈尔当场阵亡，为二战中阵亡的最高军衔美国将领。"
 CBIO_USA_jonathan_wainwright_desc:0 "1883年生于华盛顿州瓦拉瓦拉，出身军人世家，西点军校毕业后长期在菲律宾服役。日军进攻菲律宾后，温赖特在吕宋岛北部指挥北吕宋部队阻击日军南进，1942年3月麦克阿瑟奉命撤离后，他接过菲律宾美菲联军总指挥职责。同年4月9日，巴丹半岛守军在金将军指挥下向日军投降，约七万余名菲律宾和美国士兵成为战俘，随后遭受\"巴丹死亡行军\"，被迫步行至遥远的拘押营地，途中因虐待、饥渴和疾病大批死亡。温赖特坚守科雷吉多岛至1942年5月6日宣布投降，为美国历史上规模最大的美军投降事件。被俘后，日方迫使他向仍在坚持的菲律宾各地抵抗力量下达投降令，他此后被关押于包括台湾卡伦科营地在内的多处战俘营，历经三年余。1945年8月在满洲被盟军解放，9月2日出席密苏里号战舰上的日本投降签字仪式。获颁荣誉勋章，晋升上将。1953年逝世。"
 CBIO_USA_russell_hartle_desc:0 "1889年生于马里兰州楚斯维尔，1910年毕业于安纳波利斯圣约翰学院并获步兵军官委任，此后历经菲律宾殖民地驻防、墨西哥边境战争及一战动员，战间期先后完成陆军步兵学校、指挥参谋学院、陆军战争学院及海军战争学院学业，是美国军事史上首位同时毕业于陆、海军两所战争学院的军官。1930年代在陆军部战争计划处任职期间深度参与战略规划工作。1941年8月晋升少将，接掌第三十四步兵师。珍珠港事件后，依据\"磁石\"战争计划，他率第三十四师于1942年1月抵达北爱尔兰，成为美国参战后首支踏上欧洲土地的美国陆军师级部队。在北爱尔兰驻训期间，他向马歇尔推荐其副官、炮兵上尉威廉·达比负责组建美国陆军首支现代突击队，这支部队即1942年成立的第一游骑兵营，达比由此一战成名。1942年5月，他晋升第五军军长，先后在詹姆斯·钱尼和艾森豪威尔麾下主持美军在英国的集结整训事务。1943年7月，他被调返华盛顿，随后转往得克萨斯州坎普·法宁负责补充兵员训练，据信与马歇尔对其野战指挥潜力的评估有关。1946年以伤残退役，绰号\"Scrappy\"。1961年逝世于马里兰州贝塞斯达，葬于黑格斯敦玫瑰山公墓。"
 CBIO_USA_leonard_gerow_desc:0 "1888年生于弗吉尼亚州彼得斯堡，毕业于弗吉尼亚军事学院后从军，后就读陆军高级指挥学院。珍珠港事件前担任陆军战争计划处处长，负责制定美国战备方案；事件发生后不久，艾森豪威尔接替此职，杰罗转赴野战指挥。出任第五军军长后参与诺曼底登陆策划与实施，1944年6月6日第五军负责指挥美军在奥马哈海滩的登陆作战，该滩头地形险峻、德军防御密集，为诺曼底当日伤亡最为惨重的登陆区域。此后随盟军主力穿越法国，参与1944年8月巴黎方向的推进行动，巴黎解放涉及多方力量协调，非单一军级指挥所能主导。战后任陆军战争学院院长等职。1972年逝世。"
 CBIO_USA_edward_brooks_desc:0 "1893年生于新罕布什尔州康科德，1916年毕业于诺威奇大学。一战期间随第三师赴法，默兹-阿尔贡攻势中冒炮火驾驶弹药车脱离火场避免殉爆，获颁优异服役十字勋章。战间期在陆军部与马歇尔共事，1941年由中校直升准将，赴诺克斯堡主导M-7自行火炮开发。1944年3月接掌第二装甲师\"地狱之轮\"，6月9日在奥马哈海滩登陆，经诺曼底突破横扫法国至比利时，麾下七个单位获总统杰出部队嘉奖令。同年10月接掌第六军，1945年元旦德军\"北风\"攻势中指挥弹性防御，顶住全部反扑。春季反攻渡莱茵河、攻占海德堡，推进至奥地利，5月5日在因斯布鲁克接受德军第十九和第二十四集团军投降。绰号\"特德\"。1978年逝世，葬于阿灵顿国家公墓。"
 CBIO_USA_clarence_huebner_desc:0 "1888年生于堪萨斯州布什顿，以普通士兵从军，经历一战西线战役，多次获勋，战后逐级晋升为军官。1943年8月出任第一步兵师师长，率领这支已在北非和西西里积累实战经验的部队。1944年6月6日，第一步兵师在奥马哈海滩登陆，遭遇密集防御火力和复杂地形，为诺曼底登陆日伤亡最惨重的部队之一。此后随盟军向东推进，1944年10月参与攻坚亚琛——第一座被盟军占领的德国城市——经历激烈城市战。亚琛攻克后晋升统率第五军，继续参与德国境内推进作战。1972年逝世。"
 CBIO_USA_alexander_patch_desc:0 "1889年生于亚利桑那领地，西点军校毕业，一战期间赴法参战。1942年末接替范德格里夫特，出任第十四军军长，负责瓜达尔卡纳尔岛战役收尾阶段的地面指挥，至1943年2月完成对日军残余的肃清。此后调赴欧洲战区，1944年6月出任第七集团军司令。1944年8月，他率第七集团军参与\"龙骑兵行动\"，以两栖突击登陆法国南部海岸，随后向北推进穿越普罗旺斯并攻取马赛，与巴顿第三集团军会合后继续向莱茵河方向东推。1944年秋季，他的儿子在法德边境的孚日山脉前线战死。1945年帕奇率部进入德国本土作战，直至德国投降。1945年11月因肺炎病逝，年仅五十六岁，是二战中少数未能亲历战后部署整合的美国集团军指挥官之一。"
 CBIO_USA_william_simpson_desc:0 "1888年生于德克萨斯州韦瑟福德，西点军校毕业，一战期间在远征军中服役。二战出任第九集团军司令，在布拉德利第十二集团军群建制下参与盟军穿越法国、比利时的推进作战，随后渡过莱茵河进入德国本土。1945年4月，第九集团军与第一集团军协同完成对鲁尔工业区的包围，将被围德军数十万人困于合围圈内迫其投降。其指挥以稳健务实著称，与上级和友邻部队配合顺畅，但第三和第一集团军在战时叙事中的曝光度远高于第九集团军，其部队贡献在后世叙述中相对低调。1980年逝世。"
 CBIO_USA_j_lawton_collins_desc:0 "1896年生于路易斯安那州新奥尔良，西点军校毕业，一战期间未赴欧洲。珍珠港事件后，他出任第二十五步兵师师长，1942至1943年间在瓜达尔卡纳尔岛和新乔治亚岛战役中率该师参与所罗门群岛系列战役，以攻势积极、行动迅速获得\"闪电乔\"（Lightning Joe）的称号，此绰号在军中广泛流传。1943年末调赴欧洲，出任第七军军长。1944年6月诺曼底登陆期间，第七军负责犹他海滩美军登陆，其后迅速向北推进并于6月下旬攻克瑟堡港，为盟军提供了欧洲大陆的重要补给口。此后第七军参与诺曼底突破与法国横扫，经比利时推入德国境内。战后出任陆军参谋长（1949至1953年），任期横跨朝鲜战争爆发和麦克阿瑟被解职。1987年逝世。"
 CBIO_USA_courtney_hodges_desc:0 "1887年生于乔治亚州培里，早年西点军校入学考试未通过，后以普通士兵身份参军，于1909年以优异表现获委任军官资格，此后逐级晋升，至二战前已位至将级。一战期间赴法参战受勋。二战中，他先随布拉德利出任第一集团军参谋长，1944年8月布拉德利晋升指挥第十二集团军群后，霍奇斯接任第一集团军司令，随盟军横穿法国，参与解放巴黎后的向东推进。同年12月德军发动\"凸出部战役\"，第一集团军北翼受到重压，部分战线暂划归蒙哥马利指挥，霍奇斯坚守安排下稳定了阵线，最终参与围歼被包围的德军。1945年率部进入德国本土，至德国投降。1966年逝世。"
 CBIO_USA_joseph_stilwell_desc:0 "1883年生于佛罗里达州帕拉特卡，1904年毕业于西点军校。一战期间任第四军情报官，协助策划圣米耶勒攻势，获颁陆军优异服役奖章。战间期先后数度赴华，前后历时近十年，精通汉语和中国军事，1935至1939年任驻华武官，成为美国陆军对华事务的首席权威。其性格耿直刻薄，据称曾在班宁堡痛批下属，随即遭人画成从醋瓶里钻出的漫画，绰号\"醋性乔\"由此广传；麾下士兵则因他始终与士卒同甘共苦，私下称之\"老乔叔\"；他本人给蒋介石起的绰号则是\"花生米\"。珍珠港事变后，他身兼中缅印战区美军司令、蒋介石参谋长及蒙巴顿东南亚盟军副总司令三职于一身。1942年缅甸战局崩溃，他年近六旬亲率队伍徒步穿越热带丛林二十余天撤入印度，事后坦言：\"我们被人从缅甸赶了出去，吃了一场大败仗，奇耻大辱——我们必须弄清原因，打回去，夺回来。\"此后他在印度重建中国驻印军、全面推行美式训练，主持修建列多公路以重开对华陆路补给线，始终坚信\"中国士兵一旦装备充足、供给到位，天下无敌\"。他与蒋积怨日深：他指控蒋扣押租借物资用于防共而非抗日，蒋则以\"鲁莽傲慢、不服从指挥\"为由持续向华盛顿施压。1944年10月他被罗斯福下令解职，原本一人兼任的三个职位须由三名将领分别接替。此后转任第十军军长参与冲绳战役，并出席日本受降典礼。他是美国陆军史上极少数获颁步兵战斗章的将级军官之一。1946年10月12日因胃癌逝世，列多公路后以其姓名命名。"
 CBIO_USA_oscar_griswold_desc:0 "1886年生，西点军校毕业。二战中出任第十四军军长，在麦克阿瑟西南太平洋战区体系下参与所罗门群岛系列战役，指挥1943年夏的新乔治亚岛战役和其后的布干维尔岛作战，协同海军和空军逐步清除日军在中所罗门群岛的战略据点。1945年1月随麦克阿瑟登陆吕宋岛，第十四军在吕宋岛中部和北部参与持续数月的地面推进，与坚守的日军展开旷日持久的丛林攻坚，直至1945年8月日本宣布投降。1959年逝世。"
 CBIO_USA_maurice_rose_desc:0 "1899年生，生于康涅狄格州米德尔敦。出身于来自东欧的犹太移民家庭，1902年3岁时家迁丹佛，在那里长大。一战期间曾短暂入伍。二战中以装甲战术晋升，出任第三装甲师师长，率该师从法国诺曼底突破起，历经比利时、荷兰推进，直至德国本土作战。第三装甲师在欧洲战区以攻势猛烈著称，在阿登反攻和进入德国的最后推进阶段持续担任先锋角色。1945年3月30日，他随前导部队推进至德国帕德博恩附近时遭遇德国坦克，在接触中被击毙，成为二战中在欧洲战区被敌方直接击毙的最高军衔美国将领，也是二战中阵亡的官阶最高的美国犹太裔军事人员。"
 CBIO_USA_alexander_vandegrift_desc:0 "1887年生于弗吉尼亚州查洛茨维尔，海军陆战队职业军官，历经尼加拉瓜、海地等早期干涉行动。1942年8月，他指挥第一海军陆战师在瓜达尔卡纳尔岛发动美国在太平洋战场的首次大规模地面攻势登陆，占领正在修建中的机场，随即以不足准备的补给和兵力在整个秋季抵御日军的大规模反攻和火力压制，陆战队员在丛林中与日军持续争夺岛上据点长达数月，直至1942年12月移交指挥权。这一系列作战使第一海军陆战师承受了极大伤亡和疾病减员，范德格里夫特本人在艰苦条件下坚持指挥，战后获颁荣誉勋章。1943年出任海军陆战队司令，积极维护海军陆战队的独立地位，抵制战后裁撤陆战队的动议，任期内确立了海军陆战队在两栖作战和后来朝鲜战争中的战略价值。1973年逝世。"
 CBIO_USA_ernest_king_desc:0 "1878年生于俄亥俄州洛雷恩，安纳波利斯海军学院毕业，曾先后在水面舰艇、潜艇和航空兵领域服役，是海军中少见的全领域资历军官。1941年12月珍珠港事件后不久，被罗斯福任命为美国舰队总司令，1942年3月进一步兼任海军作战部长，集两职于一身，成为美国海军战时最高指挥官。他在战略资源分配上倾向于给予太平洋战场充足优先级，与英方及马歇尔的欧洲优先主张形成持续摩擦，在\"先欧后亚\"还是两线并重的问题上多次与盟国最高战略层发生正面冲突。他与尼米兹的分工大致是：金负责华盛顿层面的战略协调和资源争取，尼米兹负责太平洋前线的具体作战部署。个人风格上以强硬、苛刻和情绪急躁著称，据部分同事回忆，他是美国军队中最难共事的高级将领之一。1956年逝世。"
 CBIO_USA_chester_w_nimitz_desc:0 "1885年生于德克萨斯州弗雷德里克斯堡，安纳波利斯海军学院毕业，早期主要在潜艇部队服役，后转入水面舰艇，取得广泛的海军作战资历。1941年12月7日珍珠港遭袭后，他于12月31日接替金梅尔出任太平洋舰队总司令，在舰队实力严重受损的逆境下着手重组太平洋方向的海军作战体系。1942年6月，凭借出色的情报侦破，他在中途岛海战中以少胜多，伏击并歼灭日本联合舰队的四艘主力航母，这场胜利被认为是太平洋战争的转折点。此后他主导推进跳岛战术，绕过日军重点防守的岛屿，切断其补给线，逐步将主力推进至日本本土外围。1944年参与马里亚纳群岛战役（菲律宾海海战），同年10月统筹协调莱特湾海战，1945年指挥硫磺岛和冲绳岛攻势。1945年9月2日，他代表美国在停泊于东京湾的密苏里号舰上出席日本投降签字仪式。1966年逝世。"
 CBIO_USA_william_halsey_jr_desc:0 "1882年生于新泽西州伊丽莎白，安纳波利斯海军学院毕业，驱逐舰军官出身，1934年在年过五十时取得海军飞行执照，由此兼跨水面与航空两个领域。1941年12月7日，他率航母编队在海上执行任务，因此躲过珍珠港袭击，其麾下航母成为随后数月太平洋防御力量的核心。1942年4月，杜立特空袭编队在他舰队的大黄蜂号甲板上起飞。同年10月，他接替戈姆利出任南太平洋战区司令，以积极进攻姿态稳定了瓜达尔卡纳尔方向的海上局势。1944年6月出任第三舰队司令。同年10月莱特湾海战期间，他率第三舰队北上追击小泽治三郎率领的北方航母诱饵编队，主动脱离对圣贝纳迪诺海峡的封锁，致使栗田健男舰队主力乘虚而入，袭击美国护航航母群，局势险些酿成重大灾难，最终靠护航舰艇的拼死抵抗和栗田舰队的临阵撤退才得以化解。1944年12月和1945年6月，他率舰队先后两次遭遇强台风，因规避措施不足，分别损失驱逐舰数艘和水兵数百人；战后海军调查认定他对这两次台风损失负有指挥责任，但未予正式起诉。1959年逝世。"
 CBIO_USA_frank_jack_fletcher_desc:0 "1885年生于爱荷华州马歇尔敦，安纳波利斯海军学院毕业。1914年4月参与墨西哥韦拉克鲁斯行动，获颁荣誉勋章。二战初期担任太平洋战场航母特混舰队主要指挥官：1942年5月珊瑚海海战中，他指挥约克城和列克星敦航母编队与日本南进舰队交战，双方各有损失，日军对珊瑚海方向的推进被遏制；1942年6月中途岛海战中，他以约克城编队为第十七任务部队，与斯普鲁恩斯的第十六任务部队协同作战，担任名义最高指挥，共同击沉日本四艘主力航母。1942年8月瓜达尔卡纳尔登陆期间，在陆战队上岸约四十八小时后，他以补给燃油有限和担心航母损失为由将航母编队撤出，致使岸上部队在一段时期内失去海空支援，成为此后持续争议的决定。此后不久他被调离主力航母作战，出任北太平洋战区司令，负责阿留申群岛方向直至战争结束，未再参与太平洋南部主要海战。1973年逝世。"
 CBIO_USA_raymond_a_spruance_desc:0 "1886年生于马里兰州巴尔的摩，安纳波利斯海军学院毕业，以水面舰艇军官出身，本人并非飞行员。1942年6月，哈尔西因病住院，尼米兹临时任命他出任第十六任务部队指挥官参与中途岛海战。他在情报分析基础上选择精准时机发出攻击，企业号和大黄蜂号舰载机协同击沉日本四艘主力航母，随后下令规避夜间水面接触，被部分人士批评未能追歼残敌，但多数后世史家认为此举在当时风险条件下属于稳妥决断。此后出任太平洋舰队参谋长，1944年出任第五舰队司令。1944年6月菲律宾海海战（又称马里亚纳海战）中，他以护卫两栖舰队为首要任务，集中防御消耗日本舰载航空兵，日军三支航母航空队在此役中损失殆尽，但因未全力追击撤退的日本舰队而遭到部分批评。此后相继指挥硫磺岛和冲绳战役的海上支援。他与哈尔西轮换指挥同一支舰队：哈尔西指挥时称第三舰队，他指挥时称第五舰队，两人以此方式交替主导太平洋攻势的不同阶段。1969年逝世。"
 CBIO_USA_harold_rainsford_stark_desc:0 "1880年生于宾夕法尼亚州威尔克斯-巴里，安纳波利斯海军学院毕业，历任驱逐舰和舰队参谋职务，一战期间在大西洋参与护航任务。1939年出任海军作战部长，主持战前海军扩充计划的推进。1940年11月，他向战争部长史汀生和陆军参谋长马歇尔提交\"D计划\"备忘录（Plan Dog），明确主张若美国参战，应将德国视为首要威胁，优先确保大西洋与欧洲方向的战略资源，为盟国此后\"先欧后亚\"战略确立了早期框架。珍珠港事件后，各方调查对他的战前情报传达机制提出质疑，部分调查认为夏威夷方面未能及时收到完整警报，但正式追责并未落实到他本人。1942年3月被欧内斯特·金接替出任海军作战部长后，斯塔克转赴伦敦出任驻欧美国海军司令，负责北非、西西里和诺曼底等登陆行动的盟军海军协调事务。1972年逝世。"
 CBIO_USA_arleigh_burke_desc:0 "1901年生于科罗拉多州博尔德，安纳波利斯海军学院毕业。二战中以驱逐舰战术著称，1943至1944年间在所罗门群岛担任第二十三驱逐舰中队指挥官，多次以高速机动在夜间水面战中取得战术成果，\"三十一节伯克\"的称号由此而来，出典于一次作战电报中他以三十一节为己方最高可用航速的表述。1944年末起担任第五十八特混舰队参谋长，参与菲律宾海海战和后续快速航母攻势。战后出任海军作战部长（1955至1961年），任期长达六年，是此职位历史上任期最长者。他在任期间主导推进核动力潜艇搭载北极星潜射弹道导弹的战略计划，将海基核威慑确立为美国三位一体核力量的重要组成。今日美国海军主力导弹驱逐舰以其姓名命名为阿利·伯克级。1996年逝世。"
 CBIO_USA_charles_m_cooke_jr_desc:0 "1886年生于阿肯色州福特史密斯，1910年以全班第二名成绩毕业于安纳波利斯海军学院，同学因其才智兼备、处事冷静称之\"睿智佬\"。早年以潜艇军官为业，1920年指挥S-5号潜艇时艇体意外沉没，他组织艇员切割钢板打洞传信，三十七名被困人员全数获救。1941年2月接掌战列舰宾夕法尼亚号，珍珠港遭袭时正在港内干坞。晋升少将后出任海军作战部长欧内斯特·金的首席战略规划官，主持海军作战计划工作、推动舰队战略重心由战列舰向航母转型，先后参与卡萨布兰卡、开罗、德黑兰、雅尔塔、波茨坦诸盟国最高级会议。1944年6月6日以观察员身份在奥马哈海滩全程经历诺曼底登陆，头盔中弹碎片。终战时以海军中将军衔出任海军作战副部长，并在密苏里号甲板上亲历日本受降典礼。战后晋升上将，先后指挥第七舰队（1946–1947年）及西太平洋美国海军（1947–1948年），期间兼任中华民国领袖蒋介石的海军顾问。1948年5月退役。1970年12月24日逝世于加利福尼亚州帕洛阿尔托，葬于阿灵顿国家公墓。"
 CBIO_USA_dewitt_clinton_ramsey_desc:0 "1888年生于亚利桑那领地惠普尔营地，外祖父为亚利桑那领地总督梅耶·朱利克。1912年毕业于安纳波利斯海军学院，1917年取得飞行员资格，为全美海军第四十五位完成飞行训练的军官，绰号\"公爵\"。一战期间赴法担任海军航空站视察官，并参与盟军停战委员会工作。战间期深耕舰载航空事务，1938至1939年任萨拉托加号航母执行官，此后历任航空局作战计划处长及助理局长。1942年2月接掌萨拉托加号，全程参与瓜达尔卡纳尔战役：同年8月24日东所罗门海战中，所辖航空队击沉日军轻型航母龙骧号并重创另一支特混舰队，获颁海军十字勋章。1943年8月升任航空局局长，主导战时航空装备采购与技术研发，推动海军战略重心由战列舰向航母转型，获颁海军优异服役奖章。战后任海军作战副部长（1946–1948年），随后接掌太平洋舰队，末职为太平洋托管领地专员，1949年5月以上将军衔退役。1961年9月7日逝世于费城海军医院，葬于安纳波利斯海军学院墓地，美国海军以其姓名命名一艘护卫舰。"
 CBIO_USA_marc_mitscher_desc:0 "1887年生于威斯康辛州，安纳波利斯海军学院毕业，1916年取得海军飞行员资质，是美国海军最早一批持证飞行员之一，此后长期深耕航母与舰载航空领域。1942年初至中期担任大黄蜂号航母舰长，杜立特空袭编队即自大黄蜂号甲板起飞；同年6月中途岛海战中，他麾下的鱼雷机中队在攻击日本航母编队时几乎全数损失。1943年在所罗门群岛担任航空兵部队指挥官，在空中消耗战中取得一定战果。1944年出任第五十八特混舰队指挥官，率多支航母编队在菲律宾海海战、马里亚纳战役、莱特湾、硫磺岛和冲绳战役中持续参与攻势行动。菲律宾海海战收尾阶段，为引导在黑夜中燃油告急的返航飞行员降落，他下令点亮舰队灯光，此举在短时间内使舰队暴露于潜艇威胁之下，但成功减少了因无法归舰而坠海的飞行员伤亡。1945年冲绳战役期间，他的旗舰多次遭遇神风特攻机袭击，伤亡惨重。1947年逝世。"
 CBIO_USA_curtis_lemay_desc:0 "1906年生于俄亥俄州哥伦布，陆军航空队军官，以高强度训练和精密战术规划著称。二战欧洲战场，他从轰炸机群指挥官逐步晋升，在对德轰炸作战中发展出密集箱型编队战术，以三维立体队形提升B-17轰炸机群的防御能力和轰炸精度，并多次率队深入德国防空火力密集地带执行任务。1944年末调赴太平洋战区，先接管中国基地B-29部队，后出任马里亚纳群岛第二十一轰炸机司令部指挥官。他判断高空精确轰炸对日本城市密集木制建筑效果不佳，遂于1945年3月起大规模改用低空夜间燃烧弹轰炸。1945年3月9日至10日的东京大空袭（\"会议厅行动\"）在约一夜之内造成约八万至十万平民死亡，超过广岛原子弹投掷当日的初始死亡数字。此后他持续主导对日本多座主要城市的系统性燃烧弹轰炸，平民总伤亡估计超过三十万。对于上述行动造成的大规模平民死亡，他本人曾坦言：若美国战败，他本人将以战争罪被审判。战后出任战略空军司令部指挥官（1948至1957年），主导冷战核威慑打击体系建设。1990年逝世。"
 CBIO_USA_harold_mcclelland_desc:0 "1893年生于爱荷华州蒂芬，1916年毕业于堪萨斯州立农业学院，获理学学士学位，1917年8月获任陆军步兵少尉。此后转入航空兵，逐渐将通信技术作为毕生专业方向。1926年驻纽约期间曾执行一项特殊宣传任务：驾机以时速约一百六十公里低空掠过，向地面的贝比·鲁斯投掷棒球，为陆军航空兵争取公众关注。1930年代初组建并指挥第19轰炸机大队，其后转向通信基础设施建设——1934至1938年奉阿诺德将军之请，主导创建\"陆军航路通信系统\"，奠定美国空军全球通信网络的制度框架，被后世称为\"美国空军通信之父\"。同期曾担任阿诺德阿拉斯加飞行的通信与气象官，并在邮政飞行危机期间担任盐湖城区通信官。1941年5月以上校身份赴伦敦，出任美国陆军特别观察员组作战训练处长，珍珠港事变后以准将军衔在欧洲战区美军司令部延续同一职务。1942年7月回国入驻陆军航空兵总部，与斯坦福大学工程师弗雷德·特曼合作研究无线电频率侦听与干扰。1943年7月升任航空通信官，主持构建了当时世界上规模最大的军事通信系统，并主导雷达对抗措施的研究与推广，获颁陆军优异服役奖章。战后于1946年4月出任航路与空中通信勤务首任指挥官，1948年任军事空运勤务副司令，1950年代初曾任中央情报局通信主任。1965年11月19日逝世。"
 CBIO_USA_george_marshall_desc:0 "1880年生于宾夕法尼亚州尤宁敦，就读弗吉尼亚军事学院，非西点出身。一战期间随美国远征军赴法，历任参谋职务，以规划与协调能力渐获上级器重。1939年晋升陆军参谋长，在战争爆发前主导推进美国陆军大规模扩充与现代化改革，将一支平时序列军队在数年内建成数百万人规模的战时力量，并系统建立起征召、训练和动员体系。他以选将用人著称：艾森豪威尔、布拉德利等人均经由他的发现与提拔进入高级指挥层级。在盟国最高战略协调层，他是与英国参谋总长布鲁克、首相丘吉尔持续磨合的美方核心代表，坚持推动横渡英吉利海峡的正面进攻路线，对英方多次提出的地中海迂回方案持保留态度，最终在1944年确立了霸王行动的战略主轴。战争结束后，1945至1947年间他作为杜鲁门特使赴中国调停国共内战，历经一年余斡旋未能阻止内战全面爆发，调停无果后返回美国。1947年出任国务卿，推动以其姓名命名的欧洲复兴计划，向西欧遭受战争破坏的国家提供大规模经济援助，因此在1953年获授诺贝尔和平奖。1950至1951年兼任国防部长，经历朝鲜战争爆发初期。1959年逝世。"
 CBIO_USA_henry_arnold_desc:0 "1886年生于宾夕法尼亚州格拉德温，父亲为兼任国民警卫队军职的医生。1907年毕业于西点军校，因在校恶作剧积累罚记被拒于骑兵之外，以步兵少尉赴菲律宾。1911年4月受命跟随莱特兄弟学习飞行，取得陆军飞行员第二十九号执照，成为美国最早的军队飞行员之一。1914年在菲律宾驻防时与一等中尉马歇尔为邻，当时已私下预言\"此人将来必任参谋长\"，两人此后共事终身。他长期追随比利·米切尔，是其最重要的门生；米切尔被军法裁定后，他受株连被调往堪萨斯州，职业生涯停滞数年。1934年率十架B-10轰炸机完成往返阿拉斯加编队飞行，获颁麦凯奖。1938年接掌航空队。1941年6月陆军航空兵正式组建，他以司令身份进入参谋长联席会议及盟军联合参谋长委员会，成为史上首位参与美英最高战略决策的美国航空将领。此后他将一个仅有两万余人和八百架一线战机的组织扩张为当时世界上最强大的空中力量，主导战略轰炸计划的制定与洲际轰炸机、喷气战机的研发推进，对达不到效果的指挥官从不手软——1945年1月他因汉塞尔抵制对日燃烧弹战术将其撤换、改任李梅，随即心脏病发作。二战期间他共四度心脏病发作，属下称他是\"被这场战争夺走的将军\"。1944年12月晋升陆军五星上将；1946年2月退役；1949年5月改称空军上将，成为美国史上唯一同时持有两个军种五星军衔之人，亦是空军史上迄今唯一一位五星上将。他还是兰德公司前身\"项目兰德\"的创始人之一。绰号\"快乐汉\"，名言：\"随时保有一支现代化、自主且训练充分的空军固然不够，但没有它，国家安全便无从谈起。\"1950年1月15日逝世于加利福尼亚州索诺马，葬于阿灵顿国家公墓，被后世称为\"美国空军之父\"。"
 CBIO_USA_carl_spaatz_desc:0 "1891年生于宾夕法尼亚州博伊尔敦，西点军校毕业，一战期间以飞行员身份在法国参战并击落数架敌机，战间期积累丰富的航空指挥与管理经验。二战中先后担任第八航空队司令和驻欧美国战略空军司令，主导对德国工业设施、石油炼化体系和交通枢纽的系统性战略轰炸，在与皇家空军协调英美两国轰炸任务、分配目标优先序方面承担核心协调角色。1945年转赴太平洋战区，出任美国陆军战略空军司令，成为原子弹投放命令链的关键执行节点：1945年7月，他收到书面投弹命令，将指令下达至负责执行任务的第五○九混合大队，使广岛和长崎的两次原子弹投放得以依命令执行。战后1947年美国空军正式独立，他出任首任空军参谋长，任期一年。1974年逝世。"
 CBIO_USA_george_kenney_desc:0 "1889年生于加拿大新斯科舍省，幼年随家人移居美国，一战期间以观察员和战斗机飞行员身份在法国参战，战后留在陆军航空队。1942年7月被麦克阿瑟任命为西南太平洋战区空军司令兼第五航空队司令。他到任后迅速评估战区空军状况，重整战斗、轰炸与运输能力，并大力推广低空跳弹轰炸战术：飞机在极低空投弹，炸弹贴水面弹跳后击中目标舰船水线，绕过日军密集防空火力。1943年3月俾斯麦海海战中，他麾下飞机以此战术和低空扫射重创正在增援新几内亚的日本运输船团，大批日军增援部队在海上被歼，是这一战术的标志性战例。此后他持续为麦克阿瑟的新几内亚和菲律宾作战提供空中掩护、火力压制与补给运输支援，是麦克阿瑟体系中地面与空中协同的核心执行者之一。日本投降后出任战略空军司令部司令（1946至1948年）。1977年逝世。"
 CBIO_USA_charles_lindbergh_desc:0 "1902年生于密歇根州底特律，幼年随家人在明尼苏达州乡间长大，父亲为反对美国参加一战的联邦众议员。1927年5月，他独自驾驶\"圣路易斯精神\"号单翼飞机从纽约起飞，约三十三小时后降落巴黎，完成首次单人不间断跨大西洋飞行，一夜成为世界知名人物和美国公众心目中的飞行英雄。1930年代他多次应邀访问德国，考察德国空军建设，1938年接受戈林代表希特勒授予的德意志鹰勋章，并向美国政府提交了有关德国空军实力的评估报告——这份报告被认为在一定程度上高估了德国的空中优势，影响了英法决策层的战略判断。随着欧战临近，他成为美国国内孤立主义阵营最具影响力的公开代言人，在广播演讲和全国巡回集会中反复主张美国不应介入欧洲战争。1941年9月在爱荷华州得梅因的演讲中，他公开点名犹太人、英国政府和罗斯福政府为推动美国参战的三股主要力量，将犹太群体列为利用自身对\"媒体、电影工业和政府\"的影响力向战争方向施压者，这段言论引发广泛批评，多个组织和媒体将其定性为带有明显反犹色彩的公开表态。珍珠港事件后，他宣布收回反战立场并申请恢复军职，遭罗斯福拒绝。此后他以民间技术顾问身份为联合飞机公司工作，1944年赴太平洋战区以平民顾问身份随美国陆军和海军陆战队飞行单位测试战机性能、研究燃油效率和作战航程延伸方案，据记载实际参与了部分飞行任务。1974年逝世。"
 CBIO_USA_jimmy_doolittle_desc:0 "1896年生于加利福尼亚州阿拉米达，曾在麻省理工学院攻读航空工程学博士，是当时少有的兼具实战飞行经验与航空工程科学背景的军人。战前以特技飞行赛事纪录和仪表盲飞技术的先驱测试著称。1942年4月18日，他率十六架B-25中型轰炸机从大黄蜂号航母甲板起飞，对东京、名古屋、神户等日本城市实施空袭，这是太平洋战争中美国对日本本土的首次空中打击，心理震撼效果远超实际军事损毁，也打破了日本本土不可侵犯的舆论印象。所有飞机在任务后因燃油耗尽，飞行员被迫在中国浙江、江西一带迫降或跳伞，多数人由中国民众和地方军队冒险协助转移至安全地带。日本随即在该地区发动大规模报复行动（\"浙赣作战\"），系统清剿曾协助美国飞行员的中国村庄和地方部队，造成逾25万名中国平民死亡。此后杜立特先后指挥北非第十二航空队、地中海第十五航空队，1944至1945年出任第八航空队司令，参与对德战略轰炸。1993年逝世，享年九十六岁。"
 CBIO_USA_john_cannon_desc:0 "1892年生于犹他领地盐湖城，1914年毕业于犹他农业学院。一战以步兵军官入伍，战后于1922年完成飞行训练，与陈纳德同批毕业于埃灵顿基地。在凯利基地执掌飞行训练期间，查尔斯·林白曾是他的学员；1930年借调柯蒂斯-莱特公司，与杜立特游历欧洲二十一国推广军用飞机；主持兰道夫基地训练期间，又先后培育了范登堡、推宁、诺斯塔、李梅等日后主导美国空军的一代将领。1938至1941年任驻布宜诺斯艾利斯美军使团团长。1942年以准将率部参与火炬行动，此后历任北非训练司令部、西西里及意大利战场战术航空副司令。1944年晋升少将、任第十二航空队及地中海盟军战术航空兵司令，统筹法国南部登陆龙骑兵行动的全部空中作战，该行动后被公认为战术空中优势的教科书范例。1945年3月晋升中将，出任地中海战区盟军空中总指挥。二战期间，他比任何一位美国航空将领都更完整地走过了盟军战术航空的整个学习曲线。战后先后两度任驻欧美国空军司令，第二任期内经历1948至1949年柏林空运。1951年晋升四星上将，任战术空军司令部总司令，为美国空军史上首位获得永久四星军衔的军官。绰号\"老乔叔\"。1954年3月退役时以服役序号3A位居全军最资深；1955年1月12日因心脏病逝世于加利福尼亚州阿卡迪亚，葬于阿灵顿国家公墓，新墨西哥州坎农空军基地以其名命名。"
 CBIO_USA_claire_lee_chennault_desc:0 "1893年生于德克萨斯州商务市，陆军航空队军官，早年以战斗机机动理论和特技飞行教学著称，其强调近距空战格斗能力的战术主张与当时美国陆航强调高速重型截击机的主流方向存在分歧。1937年以健康问题退役后受宋子文和蒋介石之邀赴华，以顾问身份协助整顿和训练中国空军，在中日全面开战的背景下亲历日本航空兵在中国战场形成的持续优势。1940至1941年间，他与宋子文在美国共同推动组建由美国退役和现役飞行员构成的志愿航空队，获得罗斯福政府非公开的行政默许，最终成立美国志愿援华航空队（AVG），因其飞机机头的鲨鱼嘴涂装而被称为\"飞虎队\"。飞虎队于1941年12月珍珠港事件前后在缅甸和云南展开作战，以P-40战斗机利用地面预警网络和高低差战术对抗日本航空兵，在保卫仰光至昆明的补给线中发挥了较为突出的作用。1942年7月AVG解散，并入美国陆军航空队体系；陈纳德随之入现役，先负责中国航空特遣队，1943年第十四航空队正式成立后出任司令，在驼峰物资极度有限的条件下指挥对日空中作战。他与史迪威在战区资源分配上长期对立：史迪威认为应优先以地面军队夺回缅甸陆路，陈纳德主张将更多驼峰物资拨给空中力量以更高效地打击日本补给线，两人的争议多次上达华盛顿，形成持续的派系角力。1945年初随着美军对华战略的调整，陈纳德实际影响力下降，同年7月申请退役。此后他在内战期间短暂参与中华民国一侧的民用航空事业，1949年离开中国大陆。1958年逝世。"
 CBIO_USA_thomas_kinkaid_desc:0 "1888年生于新罕布什尔州汉诺威，安纳波利斯海军学院毕业。二战初期参与北大西洋护航任务，随后调赴太平洋，1942年在所罗门群岛海战系列中参与多次水面接触战。1943年在北太平洋指挥了阿图岛和基斯卡岛的驱逐日军行动，清除了日本在阿留申群岛的据点。此后调赴麦克阿瑟西南太平洋战区，出任第七舰队司令，这支舰队以两栖支援为主要职能，紧密配合麦克阿瑟的陆上推进。1944年10月莱特湾海战期间，第七舰队负责保卫莱特湾的两栖部队：他在苏里高海峡以旧式战列舰夜间截击日本南方分舰队，歼灭其主要兵力，被认为是战争史上最后一次传统战列舰炮击对决；与此同时，因哈尔西率第三舰队北上追击诱饵舰队，圣贝纳迪诺海峡无人把守，栗田舰队主力突入并袭击第七舰队护航航母群（\"塔菲三\"），险造成重大损失。关于封锁责任，他与哈尔西之间的通讯协调存在明显漏洞，战后双方各有指责，这一争议成为莱特湾海战史学讨论的持续焦点。1972年逝世。"
 CBIO_USA_harry_white_desc:0 "1892年生于马萨诸塞州波士顿，父母为来自立陶宛的犹太移民。在哈佛大学获经济学博士学位。1934年加入罗斯福政府财政部，1941至1945年间出任财政部货币研究司司长，是财政部长小亨利·摩根索的核心经济顾问。1944年7月，他与英国经济学家约翰·梅纳德·凯恩斯共同在新罕布什尔州布雷顿森林主导战后国际货币体系谈判，实际起草了大量技术方案，推动建立国际货币基金组织和国际复兴开发银行，确立了以美元与黄金挂钩、各国货币固定汇率为核心的\"布雷顿森林体系\"，深刻塑造了战后数十年的国际货币秩序。他还参与起草战后对德\"去工业化\"方向的\"摩根索计划\"草案，但该计划被泄露并遭公众批评后未被采纳。1946年出任美国首任国际货币基金组织执行董事。美国联邦调查局从1940年代初起积累有关他与苏联情报网络存在联系的线索；战后解密的\"维诺纳计划\"截获电报显示，代号\"法官\"和\"理查德\"的人物与他存在对应关系，部分历史学家据此认定他系苏联情报联系人。1947年他在国会调查听证中否认上述指控，1948年8月在再次作证后不久心脏病发作逝世，正式调查因此中止，其历史定性至今未有公认结论。"
 CBIO_USA_victor_perlo_desc:0 "1912年生于纽约市，经济学家，哥伦比亚大学毕业。1930年代以联邦政府雇员身份先后在农业调整局、战时生产委员会等新政机构任职，从事经济分析与政策研究工作。在情报争议方面：1945年从苏联驻美机构叛逃的伊丽莎白·本特利向联邦调查局提供了证词，将他列为一个由政府雇员构成的苏联情报联络网络（史称\"珀洛小组\"）的核心人物；战后解密的\"维诺纳计划\"截获电报中，部分内容被研究者与他的活动相对应。他从未被正式起诉，在国会反共调查中援引宪法第五修正案拒绝就相关问题作答。战后他以左翼经济学家身份继续活动，出版多部批评美国资本主义体制的著作，并于后期公开声明其美国共产党成员身份。1999年逝世。"
 CBIO_USA_whittaker_chambers_desc:0 "1901年生于宾夕法尼亚州费城，幼年迁居纽约布鲁克林，在哥伦比亚大学就读期间加入美国共产党，后离开学业。1930年代参与苏联军事情报机构在美国的地下网络活动，自述担任联络员角色，与政府部门内的情报联络人接触并传递文件。1938年他单方面切断与苏联情报网和共产党的一切联系，此后转向宗教信仰并长期保持沉默。战后他加入《时代》杂志，逐步成为资深编辑，在美国保守派知识界积累了一定影响力。1948年8月，他在众议院非美活动调查委员会（HUAC）公开作证，指控曾任国务院高级官员、时任卡内基国际和平基金会主席的阿尔杰·希斯曾是苏联情报联络人，引发全国关注。希斯当庭否认并对钱伯斯提起诽谤诉讼。钱伯斯随后公开了他秘密藏存于马里兰州农场南瓜地里的微缩胶片，内含涉及国务院的文件影像，这批被称为\"南瓜文件\"的材料成为案件的核心证据。由于法定诉讼时效已过，无法以间谍罪直接起诉，希斯最终于1950年以伪证罪被陪审团定罪，判处五年有期徒刑。关于此案的历史真相，美国学界至今仍有分歧：部分研究者认为维诺纳解密档案支持钱伯斯的指控，另一部分人则对定罪依据的完整性和解读提出质疑。1952年钱伯斯出版回忆录《见证》，详述自己从共产主义转向宗教保守主义的历程，成为美国反共文化中被广泛引用的文本。1961年逝世。"
 CBIO_USA_joseph_patterson_desc:0 "1879年生于伊利诺伊州芝加哥，出身麦考密克-帕特森报业家族，与芝加哥论坛报有家族关联。早年曾持社会主义立场，一战期间转而支持参战并亲赴前线服役。1919年在纽约创办《纽约每日新闻》，以大量图片、简洁文字和通俗化报道迅速吸引工薪阶层读者群体，数年内跻身全美发行量最大的日报之列，在工人阶级城市社区中影响广泛。1930年代初他对罗斯福新政保持相对同情的立场，但随着对欧洲战争态势的判断日趋保守，他逐步转向孤立主义，与其表兄罗伯特·麦考密克（掌管芝加哥论坛报）共同形成保守派媒体反干涉的舆论阵营，持续反对美国以任何形式介入欧洲事务。珍珠港事件后立场有所调整，但仍对战时政府保持批评视角。1946年逝世。"
 CBIO_USA_william_regnery_desc:0 "1877年生于威斯康星州希博伊根，父亲威廉自德国恩施移民美国，家族随后迁居艾奥瓦州，信仰天主教。早年深受亨利·乔治土地单税思想影响，投身多种社会改革运动，亦曾支持罗斯福新政。此后通过纺织业在伊利诺伊州积累大量财富，1936年出任芝加哥西方遮阳布公司负责人。随着欧战局势升温，他转向坚定的孤立主义立场。1940年参与联署创立美国优先委员会，并以主要金主身份资助这一以\"美国不应卷入欧洲战争\"为宗旨的民间反战运动。委员会总部设于芝加哥，巅峰时期登记成员逾八十万，以查尔斯·林德伯格为最知名公众代言人，是美国历史上规模最大的反战组织之一。1941年12月日本袭击珍珠港后，委员会随即宣布解散。其子亨利·雷格纳里于1947年创立雷格纳里出版社，陆续出版巴克利《耶鲁的上帝与人》、柯克《保守主义的精神》等著作，成为美国战后保守主义思想谱系的重要塑造者。1954年1月16日逝世。"
 CBIO_USA_harold_ickes_desc:0 "1874年生于宾夕法尼亚州弗兰克斯敦，芝加哥大学毕业，早年在芝加哥以律师和地方政治活动人士身份活跃，以共和党进步派立场参与城市改革运动。1933年被罗斯福任命为内政部长，此后在任长达十三年，是新政内阁中任期最长的阁员。他同时兼任公共工程署（PWA）署长，监督将大量联邦资金注入水坝、桥梁、学校、医院和政府建筑等公共基础设施项目，以实体工程带动就业，成为新政公共投资路线的重要执行机制之一。他在资源管理立场上倾向于维护联邦对公共土地的控制权，抵制私人企业对公共土地和矿产的商业开发。在民权倾向上他较联邦政府其他阁员相对积极：1939年他批准黑人歌手玛丽安·安德森在林肯纪念堂前举行公开演唱会，此举发生在该歌手被美国宪法堂以肤色理由拒绝提供场地之后，产生了广泛社会影响。内政部同时管辖印第安事务局，他与印第安事务专员约翰·科利尔共同推进\"印第安新政\"框架，在政策方向上支持部落土地权利的一定恢复，但具体执行层面的保障效果在不同部族中反应不一。他对纳粹德国和孤立主义持公开批评立场，在罗斯福内阁讨论中多次力主正视法西斯威胁。1952年逝世。"
 CBIO_USA_charles_coughlin_desc:0 "1891年生于加拿大安大略省汉密尔顿，罗马天主教神父，就读于多伦多大学圣巴西尔学院。1926年起在密歇根州皇家橡树市圣特蕾莎堂担任神父，随即开始在地方广播电台发表演讲，听众规模迅速扩大，至1930年代极盛时期估计每周广播受众超过三千万人，成为当时美国媒体影响力最大的宗教人物之一，\"广播神父\"之名广泛流传。1930年代初期，他以罗斯福新政的公开支持者姿态登上全国舞台，措辞激烈地抨击\"国际银行家\"和华尔街利益集团。1934年后他开始转向批评新政力度不足，创建\"社会正义全国联盟\"，推销通货扩张和白银国有化方案，并逐步与罗斯福决裂。1930年代后期他的反犹太主义内容日趋公开：他在广播中鼓吹犹太人操控国际金融和共产主义运动的阴谋论；在他创办的《社会司法》（Social Justice）杂志上大量翻印《锡安长老会议纪要》——这份文件早在1920年代已被多家欧洲媒体证实为伪造，但库格林持续以其作为反犹证据传播；他对纳粹德国的\"水晶之夜\"大规模袭击犹太人事件进行辩护，宣称是对犹太人自身行为的回应。他支持和推动\"基督前线\"（Christian Front）等亲法西斯倾向团体的组建，这些团体在纽约等城市的部分成员涉及对犹太裔居民和左翼人士的暴力行为。珍珠港事件后他仍在《社会司法》中攻击战时政策和政府领导，1942年5月美国司法部启动邮件欺诈调查程序，底特律总主教爱德华·穆尼随即以违反教规为由下令他停止广播和杂志出版，回归教区职务。此后他默默在皇家橡树市任职至1966年退休，1979年逝世，未再从事任何公开政治活动。"
 CBIO_USA_robert_taft_desc:0 "1889年生于俄亥俄州辛辛那提，父亲威廉·霍华德·塔夫脱为美国第二十七届总统，后任最高法院首席大法官。他毕业于耶鲁大学和哈佛法学院，在班级中名列前茅，回俄亥俄州执业后进入州议会，逐步进入联邦政治。1939年当选联邦参议员，此后连任至1953年逝世，在参议院任期内成为共和党保守派的旗手人物，被支持者称为\"共和党先生\"。他强调有限政府和宪法权力划分，反对罗斯福政府借助危机持续扩张联邦权力和行政权，认为大量新政立法逾越了宪政界限。在对外政策上他是战前孤立主义阵营的重要代言人，坚持反对以援助英国或任何预先承诺的方式将美国拖入欧洲战争，主张美国应守卫西半球、避免承担欧洲事务的干涉责任；他同时批评罗斯福绕过国会以行政手段推进对英援助。珍珠港事件后他支持对日宣战，但持续批评战时行政权力扩张及其对公民自由的潜在侵蚀。他在1940、1948和1952年三度竞争共和党总统候选人提名，均未能胜出，1952年在共和党全国代表大会上以微差败于艾森豪威尔，结束了他的总统候选竞争。1947年他与众议员弗雷德·哈特利合力推动通过《塔夫脱-哈特利法》，对工会权力作出系统限制，包括禁止封闭式工厂、要求工会领袖宣誓非共产党员、扩大联邦干预劳资纠纷的权力等条款，是二十世纪美国劳工政策史上的重大立法节点。1953年逝世。"
 CBIO_USA_joseph_mccarthy_desc:0 "1908年生于威斯康辛州格兰德萧特，农场家庭出身，马凯特大学法学院毕业。1939至1944年担任威斯康辛州第十司法巡回区法官。二战期间以预备役军官身份在太平洋战区服役于海军陆战队，主要承担情报联络职务；他在后来的选举宣传中对自身战斗经历有所夸大，这些说法在部分细节上受到质疑。1946年当选威斯康辛州联邦参议员，前几年任期内政治影响力有限。1950年2月在西弗吉尼亚州惠灵的演讲中，他声称持有一份共产党渗透者名单，指其成员正在国务院任职——这一数字在此后多次引用中前后不一，且始终未能以规范的证据程序加以证实——由此点燃了以其姓名命名的\"麦卡锡主义\"时代。此后数年，他通过国会调查委员会主席的席位对政府机构、军方、新闻界和学术界人士发起大规模反共指控，惯用手法是公开点名、暗示持有\"证据\"，却拒绝在可接受质询的正式法律程序中出示，导致数百人在无法对质指控者的情况下丢失职位或遭受社会压力。1954年他将攻击矛头转向陆军，陆军-麦卡锡听证会在全国电视直播中持续数周，陆军首席律师约瑟夫·韦尔奇在听证中对其行为的公开质问，使麦卡锡的公众形象受到广泛批评，支持率急速下跌。1954年12月，参议院以六十七票对二十二票通过对他的谴责决议，成为参议员被本院正式谴责的少数案例之一。被谴责后他在参议院几乎丧失全部影响力。1957年逝世。"
 CBIO_USA_john_winant_desc:0 "1889年生于纽约市，就读于圣保罗学校，后入读普林斯顿大学，一战期间曾短暂离校服役。战后在新罕布什尔州从事政治活动，以进步派共和党人立场三度当选州长（分别于1920年代中期和1930年代初至中期），任内推动劳工立法和社会救助政策改革，在共和党内属相对偏向社会改革方向的人物。1935年起赴日内瓦在国际劳工组织（ILO）任职，后晋升至局长一职，参与推进国际劳工权利标准的制度框架。1941年2月，罗斯福任命他出任美国驻英国大使，这一任命在英国舆论界受到广泛欢迎，被视为美国认真对待英国战时处境的外交信号。他在整个战争期间常驻伦敦，出现于遭空袭的社区和工厂，与丘吉尔及英国各界建立了密切关系，被认为是战时美国外交官中在英国民间留下最深印象的人物之一。1941年12月7日，他正在陪同丘吉尔时收到珍珠港被袭击的消息，参与协调了两国政府的即时应对。1946年离任返回美国后，他在政治声誉和个人财务方面均遭遇严重困境。1947年11月在新罕布什尔州自杀身亡，时年五十八岁。"
 CBIO_USA_cordell_hull_desc:0 "1871年生于田纳西州欧弗顿县，农村家庭出身，法律职业出身，在田纳西州执业后进入政界。先后在联邦众议院（1907至1921年、1923至1931年）和联邦参议院任职，以主张降低关税和推进自由贸易为其核心政策立场贯穿整个国会生涯。1933年被罗斯福任命为国务卿，此后在任长达十一年，是美国历史上任期最长的国务卿。他主导推动《互惠贸易协定法》（1934年），授权行政部门与他国谈判双边关税削减，在大萧条保护主义盛行的环境中推进贸易自由化方向。在拉丁美洲外交上，他是罗斯福\"睦邻政策\"的主要实施者，推进泛美合作体系建设和美洲国家间法律平等关系。1941年他与日本大使野村吉三郎和来栖三郎进行了长达数月的密集谈判，试图在中国撤军、印度支那撤军和三国同盟问题上达成可接受的框架，双方始终无法弥合分歧，谈判在珍珠港事件前夕正式破裂。在难民接收政策上：1939年满载九百余名欧洲犹太难民的\"圣路易斯号\"邮轮在古巴被拒入境后转驶美国海岸，国务院以移民配额和程序为由拒绝给予特别入境许可，船只最终被迫返回欧洲，其中部分乘客后来在纳粹迫害中遇难，这一事件成为历史学界批评战时美国难民政策消极立场的标志性案例之一。他积极参与推动联合国早期构想框架的形成，1944年在布雷顿森林会议和敦巴顿橡树园会议期间发挥了协调作用。1945年获诺贝尔和平奖。1955年逝世。"
 CBIO_USA_henry_morgenthau_desc:0 "1891年生于纽约市，农场主出身，与罗斯福自1910年代起即是哈德逊河谷的邻居和密友，这一长期私人关系是他进入联邦政治的重要背景。1934至1945年担任财政部长，是罗斯福内阁任期最长的阁员之一，主导新政时期大量财政运营、税收政策和公债发行。二战期间他负责战争债券的全国性销售动员，并为租借法案的财政机制提供核心支持。在犹太难民问题上，他的立场较国务院明显积极：1944年1月他向罗斯福提交了一份内部报告，详细记录国务院以移民配额和程序为由系统阻碍救援欧洲犹太难民的行为，这一举措直接促使罗斯福于当月成立\"战时难民委员会\"，该委员会此后通过多种外交和秘密渠道协助组织救援行动，估计使数以万计的人得以逃脱纳粹统治。1944年他参与起草\"摩根索计划\"，主张战后将德国彻底去工业化，拆解其重工业基础，使其无法再发动现代战争；方案泄露后遭到丘吉尔和美国国内的强烈批评，最终未被纳入盟国对德政策框架。1945年罗斯福去世后数月内他辞职。战后曾参与支持以色列建国的相关活动。1967年逝世。"
 CBIO_USA_henry_stimson_desc:0 "1867年生于纽约市，耶鲁大学和哈佛法学院毕业，在共和党政治与法律界积累了数十年资历。1911至1913年担任塔夫脱政府战争部长，参与美国在菲律宾早期行政管理体系的建设讨论。1927至1929年出任菲律宾总督，直接主导美国对菲律宾自治进程的行政推进，对菲律宾政治生态和美国远东战略利益有深入的第一手认知。1929至1933年出任胡佛政府国务卿，任内提出\"史汀生主义\"：拒绝承认日本以武力在满洲造成的既成事实，坚持以国际法律秩序原则应对侵略行为，但此立场未能形成实质约束力。1940年，已年逾七十的他被罗斯福任命为战争部长，成为超越党派的战时团结的象征，全力推进战前动员和参战后的大规模军事扩充。作为曼哈顿计划的最高政治监督者，他与格罗夫斯将军共同管理这一绝密工程，参与目标城市的政策讨论，并在1945年6月主持\"临时委员会\"专门审议原子弹的使用方式与时机；他坚持将京都排除在目标名单之外，但最终支持对城市目标实施轰炸，未将预先公开警告确立为强制前提条件。他同时作为战争部长负责在行政上落实罗斯福1942年2月签署的第9066号行政令，该令强制将约十二万名日裔美国人迁入内陆拘禁营，战争部是这一措施的主要执行机构，史汀生对此承担直接行政责任；其私人日记显示他内心对措施的普遍性持有一定保留，但这些保留未转化为对政策的正式异议。1945年9月辞职。1950年逝世。"
 CBIO_USA_donald_nelson_desc:0 "1888年生于密苏里州汉尼拔，密苏里大学毕业，战前长期在西尔斯零售集团任职，以卓越的采购与供应链管理能力晋升至公司执行副总裁层级。1942年1月，罗斯福任命他出任战时生产委员会（WPB）主席，主导将美国整体工业产能从民用生产向军工需求转型。他任期内的核心矛盾是与军方的权力边界争夺：陆海军采购部门倾向于直接掌控生产决策和资源分配，而纳尔逊坚持战时生产委员会应保留对工业动员的民间监督权，以防止军工利益完全主导整体经济结构。在原材料分配、产能优先序列和生产转型的初期推进上他取得了一定成果，但在与军方持续的行政摩擦中，战时生产委员会的实际权力逐渐被分散，1944年他在内部斗争中败退并辞职。战后他曾访问中国，参与对战后中国经济重建方向的评估，但未形成实质影响。1959年逝世。"
 CBIO_USA_william_donovan_desc:0 "1883年生于纽约州布法罗，哥伦比亚大学法学院毕业，在纽约建立律师事务所。一战期间率部赴法作战，所属部队为第六十九纽约步兵团（入战时改编为第一六五步兵团），以作战英勇多次负伤，获颁荣誉勋章及多项最高级军事荣誉，成为同期美国军官中获勋层级最高的人物之一。战间期他数次以罗斯福私人特使身份赴欧洲、北非和中东进行政治情报评估，向罗斯福提供了大量关于欧洲法西斯运动和战争前景的第一手报告，在塑造罗斯福对外政策判断上发挥了重要作用。1941年7月他主持创建情报协调局（COI），1942年6月改组为战略情报局（OSS），这是美国二战期间主要的综合情报机构，业务涵盖人力情报收集、特工渗透、心理战、游击队支援和技术分析等多条线。OSS在欧洲占领区扶植和联络抵抗网络，在北非和地中海配合盟军登陆行动，在中缅印战区参与协助史迪威体系的情报工作，并在昆明等中国城市设有站点，参与援助中国军队的情报和特种作战协作。战争结束后杜鲁门将OSS解散，统一情报机构的构想在当时遭到军事和外交部门的抵制，美国中央情报局（CIA）至1947年才依据《国家安全法》成立，被多数研究者视为多诺万理念的延续。1959年逝世。"
 CBIO_USA_robert_oppenheimer_desc:0 "1904年生于纽约市，哈佛大学以三年修完学分毕业，随后赴德国哥廷根大学取得博士学位，师从马克斯·玻恩，是当时欧洲量子力学研究最活跃的中心之一。回国后任教于加州大学伯克利分校，建立起美国最具活力的理论物理研究群体。1930年代他与多名共产党员和左翼活动人士有密切来往，其妻子和弟弟均曾是美国共产党成员，他本人参加过部分共产党外围组织活动，这些背景在此后成为他政治处境的核心隐患。1942年受邀加入曼哈顿计划，1943年被任命为洛斯阿拉莫斯实验室科学主任，在新墨西哥州沙漠中统筹费米、费曼、贝特等一批顶尖物理学家的研究推进与实验室日常运营，将数千名科学家、工程师和军事人员整合在高度保密的体系中协同工作。1945年7月16日，\"三位一体\"核试验在新墨西哥州阿拉莫戈多成功引爆；随后广岛和长崎的两次原子弹投放，他在科学和组织层面均参与了全过程。战后他出任普林斯顿高等研究院院长，并积极参与核政策讨论，主张建立国际原子能控制框架，在政府内部持续反对快速推进氢弹开发，认为无限制核军备竞赛无法提供真正的安全保障。1954年，原子能委员会在政治压力下以他1930年代的共产党关联和对氢弹开发的\"阻碍\"为由举行听证，程序受到部分当事人事后的批评，最终撤销了他的安全许可，将他排除出核政策决策圈。此举在科学界引发强烈反响，部分同事视之为政治清洗而非安全审查。他此后未再恢复政府职务，1967年逝世。"
 CBIO_USA_robert_goddard_desc:0 "1882年生于马萨诸塞州伍斯特，克拉克大学获博士学位，此后长期依托史密森学会和洛克菲勒基金会等机构的资助从事火箭推进研究。1926年3月16日，他在马萨诸塞州奥本的农场成功发射了世界上第一枚以液体燃料驱动的火箭，飞行时间约二点五秒，飞行高度约十二米，水平距离约五十六米，这是人类首次实现液体推进剂火箭的动力飞行。1920年他发表的论文曾提出火箭可用于探索大气层外空间，随即遭到《纽约时报》等媒体嘲讽；这一评论直至1969年才被正式更正。1930年代他迁往新墨西哥州罗斯韦尔，系统推进高空火箭试验，积累了与推进剂、液体燃料泵、姿态控制和结构设计相关的数百项专利。美国军方在二战期间对他的研究未予大规模制度性支持，未将其整合进任何系统性军事火箭计划。德国V-2导弹工程师是否直接借鉴了他的专利，在历史上是有争议的问题：现有证据不足以证明德国团队直接采用了他的具体设计，尽管液体燃料火箭的若干基本技术原理已在同代研究者中广泛流传。1945年逝世，未能亲见液体火箭技术在战后的大规模应用。"
 CBIO_USA_leslie_skinner_desc:0 "美国陆军军械部门工程师。二战期间，他与军械部同事爱德华·尤尔（Edward Uhl）等人合作，参与了M1火箭筒早期原型的研发与试制：这种筒形便携式发射器可以发射火箭推进反坦克榴弹，使步兵在不依赖重型装甲或炮兵支援的情况下具备一定的近距反装甲能力，此后在北非、意大利和西欧战场广泛部署，并影响了此后多国便携式反坦克武器的设计方向。M1火箭筒是陆军军械部团队集体研发的成果，非一人之力。其他战时工程经历在公开史料中记录有限，建议人工参照美国陆军军械历史档案补核详细生卒年份与完整贡献范围。"
 CBIO_USA_edward_curtis_wells_desc:0 "1910年生于加利福尼亚州汉福德，斯坦福大学工程学毕业，1931年加入波音公司。在波音任职期间，他参与了B-17\"飞行堡垒\"轰炸机和B-29\"超级空中堡垒\"轰炸机的工程设计与开发管理工作，这两型飞机分别成为美国陆军航空队在欧洲和太平洋战略轰炸行动中的核心平台。两型飞机的研发均是波音工程团队、军方需求部门与大量分包商协作的系统性工程，韦尔斯在技术管理层面承担了重要角色，具体机型的开发成就不应归于单一个人。战后他继续参与波音喷气式民用飞机的早期工程工作。1986年逝世。"
 CBIO_USA_william_francis_gibbs_desc:0 "1886年生于宾夕法尼亚州费城，哈佛大学毕业，此后通过自学掌握造船工程知识，未取得正式造船专业学位。他与兄弟合作创建造船设计事务所，逐步发展为Gibbs & Cox工程公司，二战期间成为美国规模最大的私营海事设计机构之一。战争期间，Gibbs & Cox参与了大批次海军驱逐舰和护卫舰的标准化设计工作，以及\"自由轮\"（Liberty Ship）和\"胜利轮\"（Victory Ship）等量产商船的设计协调，公司工程团队在推动舰船设计标准化、大幅缩短建造周期方面发挥了系统性作用；这些船舶项目均是以事务所和工程团队为主体的集体成果。战后他主导设计了1952年下水的\"美国号\"（SS United States）客轮，该船首航横渡大西洋用时三天十二小时，打破此前纪录，并以对消防安全的极度严格要求著称于设计界。1967年逝世。"
 CBIO_USA_andrew_mckee_desc:0 "1896年生于肯塔基州劳伦斯堡，1917年以领航科目全班第一成绩毕业于安纳波利斯海军学院，入伍数月后于USS亨廷顿号上从桅杆坠落，双腿严重受伤、被裁定不宜海上服役，随即转入技术建造方向，先后担任海军学院物理航海学教官及伯利恒钢铁前河船厂建造督察。1921年取得麻省理工学院造船学硕士学位，编入海军建造队。1926至1930年在华盛顿海军建造修理局任潜艇设计分型助理，主持USS海豚号（Dolphin）的设计工作，由此演化出二战期间美国舰队型潜艇的标准构型。1934至1938年任梅岛船厂船体督察，主持USS鲟鱼号（Sturgeon）建造时首创的全焊接耐压艇体工艺，并将其固化为量产规范。1938至1945年任朴茨茅斯海军造船厂设计总督察，1939年参与USS鱿鲛号（Squalus）沉没事故的水下救援与打捞，此后推动加托级至巴劳级的压力艇体改进，将安全潜深由加托级标称的三百英尺大幅提升至六百英尺，获颁功绩军团勋章。1945年转赴太平洋舰队，以USS麦金利山号为旗舰进驻庆良间列岛，在冲绳战役期间负责统筹受损舰艇的抢修优先级决策，获铜星勋章及第二枚功绩军团勋章。战后以准将衔接掌费城海军造船厂，1947年退役，晋升海军少将。退役后转入通用动力电船分部任研究设计工程师逾二十年，1956年获美国船舶与海洋工程师学会颁授戴维·泰勒奖章。美国海军补给舰USS麦基号（AS-41）以其命名。1976年1月24日在纽约市手术中意外逝世，享年七十九岁。"
 CBIO_USA_john_walter_christie_desc:0 "1865年生于新泽西州，机械工程师出身，早年在船用发动机和炮兵牵引设备等领域积累了工程经验，一战后将注意力转向快速坦克的设计研发。他的核心技术贡献是\"克里斯蒂悬挂\"——一种采用大型螺旋弹簧的独立轮悬挂系统，使坦克每个路轮能独立弹跳适应地形，从而在越野行驶时达到远高于当时普通坦克的速度。他以此悬挂为基础设计了一系列轮-履两用快速坦克，可拆卸履带后以路轮在公路上高速行进。他与美国陆军的关系长期恶劣，合同纠纷和知识产权争议持续不断，其设计未能在本国获得系统性军事采购。1930至1931年间，他将两辆坦克底盘以农业机械名义出口至苏联，苏联工程师在此基础上深入研究了克里斯蒂悬挂原理，将其应用于BT系列快速坦克（BT-2、BT-5、BT-7），BT系列以惊人的速度性能在苏联装甲兵中服役。BT系列积累的设计经验和操作数据进一步影响了T-34坦克的开发，T-34早期型号中使用了克里斯蒂式悬挂，并以此为基础实现了火力、防护和机动性之间的特定平衡。他的设计理念对苏联装甲体系的影响，远超过其在本国军方所获得的实际重视。1944年逝世。"
 CBIO_USA_vannevar_bush_desc:0 "1890年生于马萨诸塞州埃弗里特，塔夫茨大学和麻省理工学院联合培养获工程学博士，长期任教于MIT电气工程学院。1920年代末至1930年代初，他在MIT主持研发了\"微分分析机\"（Differential Analyzer），这是一种利用齿轮、轴和积分仪等机械部件进行模拟运算的计算装置，能够求解工程中遇到的复杂微分方程，在当时是解决大量实际计算问题的重要工具，也是后来数字计算机发展道路上的重要先驱节点。1938年他出任卡内基研究所所长，由此进入华盛顿政策圈。1940年6月他直接向罗斯福建议创建国家防务研究委员会（NDRC），以系统整合学术界科研资源服务战时需求，获批并出任主席。1941年NDRC扩充改组为科学研究与发展办公室（OSRD），他担任主任，成为美国战时科学研究的最高协调者，主持推进雷达、近炸引信、青霉素批量生产、固体火箭推进剂等一系列关键军事技术的研发和工程化。曼哈顿计划在其组织框架下启动，他参与了将原子物理研究从学术层面移交军方管理体系的早期决策，使这一工程在行政上从OSRD过渡至军方主导。1945年7月他向杜鲁门提交《科学：无尽的边疆》报告，系统论证联邦政府长期资助基础科学研究的必要性，该报告直接推动了1950年美国国家科学基金会的成立，成为战后美国联邦科学资助体系的奠基文件。1974年逝世。"
 CBIO_USA_alf_landon_desc:0 "1887年生于宾夕法尼亚州韦斯特米德尔塞克斯，幼年随家人迁居堪萨斯州，成年后在堪萨斯州从事独立石油开采，成为当地商界人士。1933年当选堪萨斯州长，以财政保守和行政务实著称，大萧条最深处仍努力维持州财政基本平衡，是当时在这一方向上坚持最久的州长之一。1936年他以共和党总统候选人身份对抗罗斯福，以批评新政过度扩张联邦行政权力和财政开支为主要竞选立场，主张以更谨慎的财政路线取代罗斯福的大规模干预政策。1936年总统选举在大萧条阴影下进行，新政在普通选民中拥有广泛支持，他以悬殊差距落败：仅赢得缅因州和佛蒙特州，获八张选举人票，罗斯福获五百二十三票，是美国历史上最大规模的总统选举胜负差之一。败选后他在共和党内保持温和保守立场，对1940年代党内孤立主义的激进版本保持距离，此后逐渐以党内温和保守传统的代表性长者形象持续参与政治评论直至晚年。他活至一百岁，1987年逝世。"
 CBIO_USA_wendell_willkie_desc:0 "1892年生于印第安纳州埃尔伍德，印第安纳大学法学院毕业，律师出身。1933年起担任联邦公用事业公司（Commonwealth and Southern Corporation）总裁，在新政推行田纳西河谷管理局（TVA）等联邦公营电力项目、与私营电力公司形成竞争关系的背景下，他成为商界批评新政政策的代表性声音，由此积累了全国知名度。1940年他在未曾出任任何公职的情况下竞争共和党总统候选人提名，以黑马姿态在代表大会上赢得提名。他的政治立场与同期共和党孤立主义主流存在明显差异：他支持向英国提供援助，反对在法西斯扩张威胁下的被动旁观，这使他在国际主义倾向的共和党人中拥有广泛支持。1940年总统选举中他获得约四千五百万张普选票，在落败候选人中得票比例相对较高，但罗斯福仍以压倒性优势赢得连任。败选后他与罗斯福的关系相对趋于合作，曾受委托以非官方身份赴英国、中东、苏联、中国等地进行战时外交访问。1943年他出版《一个世界》，主张战后建立真正的国际合作框架，批评帝国主义和殖民统治，对中东和亚洲被殖民民族的独立诉求抱持同情，展现了当时美国政治人物中罕见的全球视野。1944年10月因心脏病骤然逝世，享年五十二岁。"
 CBIO_USA_thomas_dewey_desc:0 "1902年生于密歇根州奥沃索，密歇根大学毕业，哥伦比亚大学法学院取得法律学位，随后在纽约从事律师业。1930年代出任纽约市曼哈顿区检察长，以积极起诉有组织犯罪著称：他的团队成功建立了针对卖淫、赌博和高利贷网络的案件，将多名黑手党和黑道相关人物绳之以法，以廉洁与行动力在纽约建立政治声誉。1938年当选纽约州长，任期内以行政效率和务实路线执政，成为共和党内温和国际主义路线的代表人物。1944年以共和党候选人身份对抗罗斯福第四任期竞选，获得约四十六个百分点的普选票，是共和党在二战期间最接近的总统竞争成绩。1948年再度出战，对抗声势低迷的杜鲁门，几乎所有民调和媒体分析都预测他将赢得选举，《芝加哥论坛报》在选票计算完成前提前印刷了\"杜威击败杜鲁门\"的头版，最终这一预测成为美国政治史上最广为人知的预测失误。杜鲁门靠着密集的全国巡回竞选和工会及农民选票的大规模支持意外胜选。杜威在两次竞选中均坚持支持战后国际参与和多边秩序，与塔夫脱的孤立主义路线形成党内对立。1971年逝世。"
 CBIO_USA_harry_truman_desc:0 "1884年生于密苏里州拉马尔，家庭农场背景，未完成大学学业，一战期间以炮兵军官身份赴法参战，战后回密苏里州经营服装店，事业失败，转入政界。1935年起担任密苏里州联邦参议员，在参议院以\"杜鲁门委员会\"（参议院国防合同调查特别委员会）主席身份主导对战时军工采购中浪费和腐败行为的调查，积累了全国声望。1944年以副总统候选人身份随罗斯福参选，当选后仅在任八十二天。1945年4月12日罗斯福因脑溢血突然辞世，杜鲁门在几乎未获战时核心机密简报的情况下接任总统，当日才从史汀生处得知曼哈顿计划的存在。1945年7月波茨坦会议期间他获悉\"三位一体\"核试验成功，随即在波茨坦公告中警告日本，授权执行原子弹投放计划。1945年8月6日广岛、8月9日长崎相继遭受原子弹袭击：广岛当日及此后数月因爆炸和辐射的累计死亡人数估计约十四万，长崎估计约七万至八万；这两次袭击造成的大规模平民死亡及使用核武器针对城市目标的决定，在历史学界形成了持续至今的伦理争议，批评者认为日本彼时已处于战略崩溃边缘，支持者则援引避免本土登陆将造成更大规模双方伤亡的判断。日本随后于1945年8月15日宣布接受投降。1947年3月他在国会发表演讲，宣布美国将援助抵抗共产主义扩张的国家，\"杜鲁门主义\"由此成为战后美国冷战政策的制度基础。同年马歇尔计划推出，以大规模经济援助稳定西欧民主体制。1948至1949年柏林危机期间他以大规模空运应对苏联封锁，避免正面军事对抗。1949年推动建立北大西洋公约组织。1950年6月朝鲜战争爆发，他在未经正式宣战的情况下以联合国授权派兵参战，1951年4月以不服从文官控制为由解除麦克阿瑟全部职务。1953年卸任，1972年逝世。"
 earl_browder_desc:0 "1891年生于堪萨斯州威奇托，早年加入社会主义工人运动。俄国革命后转向共产主义，1920年代曾在亚洲从事工会组织工作。1930年代出任美国共产党总书记，主导党务，两度（1936、1940年）以共产党名义参选总统，均票数甚微。1940年以护照欺诈罪被判四年有期徒刑，1942年经罗斯福政府以战时统一战线为由减刑释放。珍珠港事件后将党调整为反法西斯统一战线立场，1944年将美国共产党解散改组为\"共产主义政治协会\"，主张战后资本主义与社会主义可共存，此主张后称\"白劳德主义\"。1945年法国共产党人杜克洛发文批评此路线为机会主义修正主义，美国共产党随即重建，白劳德于1946年被开除党籍，此后政治影响基本丧失。1973年逝世于新泽西州。"
 george_patton_desc:0 "1885年生于加利福尼亚州圣盖博。1912年代表美国参加斯德哥尔摩奥运会现代五项赛，列第五名。西点军校毕业后投身骑兵，一战期间转入坦克部队，参与圣米耶尔战役和默兹-阿尔贡攻势，负伤受勋。战间期大力倡导机械化战争理论，参与坦克战术教义的修订工作。1942年\"火炬行动\"中指挥西方特遣队在摩洛哥完成大规模两栖登陆。1943年北非战役中短暂整顿第二军，随后率第七集团军参与西西里岛战役，以快速推进夺取墨西拿。西西里战役期间，他先后在两家战地医院中掌掴神经衰竭的士兵，称其装病逃战，事件曝光后遭艾森豪威尔警告并被迫脱离一线指挥数月。1944年8月第三集团军在法国激活，迅速横扫布列塔尼并向东推进；同年12月德军\"凸出部战役\"发动后，他率部在约七十二小时内完成大规模旋转机动，驰援被围困的巴斯托涅。战后他公开批评去纳粹化政策，并以将纳粹党成员比附美国两党政治人物的言论引发强烈反弹，被解除第三集团军指挥权。1945年12月在德国境内因车祸重伤，同月二十一日逝世于海德堡。"
 omar_bradley_desc:0 "1893年生于密苏里州克拉克。毕业于西点军校1915届，该届日后将星云集，被称为\"繁星降临之届\"。一战期间留守国内担任教官，未赴欧洲。1943年北非战役中先作为观察员赴突尼斯前线，随后接替弗雷登道尔指挥第二军，参与突尼斯攻势尾声和西西里战役，因与士兵亲近、不事张扬的指挥风格获称\"士兵将军\"。1944年诺曼底登陆期间担任第一集团军司令，负责美军登陆段地面指挥；突破后晋升统率第十二集团军群，所辖美军最多时逾百万，为二战中最大规模的美国地面军建制。\"凸出部战役\"期间，第一集团军因战线危机被暂划归蒙哥马利指挥，此举在美英将领间引发持续争议。战后出任退伍军人事务局局长，着力改善退伍军人福利；1948年任陆军参谋长，次年出任参谋长联席会议首任主席，1950年晋升五星上将，任期横跨朝鲜战争爆发和麦克阿瑟被撤职等重大事件。1981年逝世于纽约。"
 dwight_eisenhower_desc:0 "1890年生于得克萨斯州丹尼森，成长于堪萨斯州阿比林。毕业于西点军校1915届，一战期间在本土训练坦克部队，未能赴欧。战间期随陆军将领福克斯·科纳在巴拿马系统研修战略，后赴菲律宾随麦克阿瑟负责组建菲律宾军队，在马尼拉工作至1939年，这段远东经历使他熟悉亚太战略方向。珍珠港事件后数周，马歇尔将其调入陆军参谋部战争计划处；1942年6月出任驻欧美军总司令，同年11月以盟军总司令身份指挥\"火炬行动\"，协调英美两国部队在北非登陆；随后主持北非、西西里战役，逐步磨合英美联合指挥关系，妥善处理巴顿、蒙哥马利等将领间的摩擦。1944年1月正式出任盟军最高统帅，总揽\"霸王行动\"策划与实施，6月6日诺曼底登陆成功，此后指挥盟军横穿法国进入德国本土，推动1945年5月德国投降。战后历任欧洲占领军总司令、陆军参谋长，1950年任北约最高统帅。1953年就任第三十四届总统，推行以核威慑为核心的对外政策，重视财政约束；卸任前公开警告军事与工业利益集团结合带来的政治风险。1969年逝世于华盛顿。"
 mark_clark_desc:0 "1896年生于纽约州麦迪逊兵营，出身军人世家，西点军校毕业后参加一战并在法国负伤。1942年10月\"火炬行动\"前夕，他作为艾森豪威尔代表乘英国潜艇秘密登陆阿尔及利亚，与法属北非维希法军官员展开谈判，为盟军顺利登陆争取条件。随后出任第五集团军司令，指挥1943年9月萨勒诺登陆及此后意大利战场的漫长推进。卡西诺山之战历经四轮进攻，1944年2月盟军轰炸了卡西诺修道院，克拉克本人最初对轰炸持异议，认为德军尚未以修道院为阵地；轰炸后德军以废墟为掩体继续防守。1944年1月安齐奥登陆后，滩头部队在克拉克与卢卡斯的部署下停滞数月，遭德军反复进攻，丘吉尔等盟国高层对此提出批评。1944年5月安齐奥突破后，克拉克下令转向进入罗马，而未集中兵力切断向北撤退的德国第十军，致使大批德军逃脱并在更北方重组防线，这一决策是其指挥争议的核心焦点。6月4日率部进入罗马，成为首位攻入轴心国首都的盟军将领。战后任奥地利占领区美军司令，1952至1953年任联合国军总司令，签署朝鲜停战协定。1984年逝世于南卡罗来纳州查尔斯顿。"
 douglas_macarthur_desc:0 "二战名将。1880年生于阿肯色州小石城，出身军人世家，父亲为菲律宾殖民地驻军将领。1903年以第一名成绩毕业于西点军校，创下该校近三十年来最高学业纪录。一战期间随第四十二步兵师赴欧，以\"彩虹师\"师参谋长、后晋旅长身份多次亲赴前线壕沟，士兵称他\"战壕中的将军\"，累计获勋章逾二十枚。1930年出任陆军参谋长，1932年亲自督导军队驱散聚集于华盛顿的一战老兵，动用骑兵、步兵与坦克清场并焚毁帐篷区，这一行动在美国社会引发强烈批评。1935年卸任参谋长后赴菲律宾，出任联邦军事顾问，接受菲律宾政府授衔，以元帅身份统筹菲律宾军队建设。珍珠港事件后数小时内，菲律宾美国远东空军在克拉克机场遭日军轰炸，几乎全毁，麦克阿瑟对此前预警的应对迟缓后来受到历史学家的持续批评。此后他指挥巴丹半岛防御，兵力与补给均严重不足，1942年3月奉罗斯福命令撤离科雷吉多，临行前留言：\"我曾来过，我将返回。\"留下温赖特率部坚守至最终投降。此后他以澳大利亚为基地出任西南太平洋战区总司令，以跳岛战术绕过日军重兵据点、切断其补给线，逐步推进新几内亚战役和太平洋岛链作战。1944年10月，他涉水登上莱特岛海滩，向菲律宾民众宣告：\"我回来了。\"。1945年进一步解放吕宋岛。日本投降后，他以盟军占领军最高司令身份主持日本战后改造，推行含放弃战争条款的新宪法、农地改革与财阀解散，以相对低伤亡代价完成了日本非军事化转型，被部分史家视为占领史上罕见的成功案例。朝鲜战争爆发后，他指挥联合国军策划仁川登陆，以两栖奇袭切断北朝鲜军队后路，扭转了战局。然而随联合国军推进至中朝边界，中国人民志愿军于1950年10月大规模入朝，以夜间穿插、分割包围的山地战术重创联合国军多支部队，长津湖一役美国陆战一师被志愿军多面围困，在严寒中历经苦战突围，麦克阿瑟事后承认这是\"一支他完全未曾预料到的强大军队\"。他随后公开主张扩大战争规模、轰炸中国境内目标，并绕过白宫直接向国会共和党领袖发表政治声明，1951年4月被杜鲁门以不服从文官控制为由解除全部职务。返回美国后他在国会发表告别演说，以一首西点军校老歌的歌词作结：\"老兵永不死，只是逐渐凋零。\"1964年逝世于华盛顿，终年八十四岁。"
 walter_krueger_desc:0 "1881年生于普鲁士弗拉托（今波兰），出身德裔家庭，幼年随家人移居美国，以普通士兵身份入伍，后逐级晋升为军官，参加过美西战争。1941年率第三集团军参与路易斯安那大演习，指挥表现进入马歇尔视野。1943年调任太平洋战区，出任第六集团军司令，成为麦克阿瑟西南太平洋战区地面作战的主要执行者。他指挥第六集团军参与新几内亚系列战役，逐步清除日军沿岸据点，打通向菲律宾推进的走廊。1944年10月莱特岛登陆后，第六集团军承担菲律宾陆上主攻任务；1945年1月吕宋岛登陆后，率部进行历时数月的马尼拉及吕宋岛攻坚，歼灭大批日军守备力量。1967年逝世。"
 courtney_hodges_desc:0 "1887年生于乔治亚州培里，早年西点军校入学考试未通过，后以普通士兵身份参军，于1909年以优异表现获委任军官资格，此后逐级晋升，至二战前已位至将级。一战期间赴法参战受勋。二战中，他先随布拉德利出任第一集团军参谋长，1944年8月布拉德利晋升指挥第十二集团军群后，霍奇斯接任第一集团军司令，随盟军横穿法国，参与解放巴黎后的向东推进。同年12月德军发动\"凸出部战役\"，第一集团军北翼受到重压，部分战线暂划归蒙哥马利指挥，霍奇斯坚守安排下稳定了阵线，最终参与围歼被包围的德军。1945年率部进入德国本土，至德国投降。1966年逝世。"
 joseph_stilwell_desc:0 "1883年生于佛罗里达州帕拉特卡，1904年毕业于西点军校。一战期间任第四军情报官，协助策划圣米耶勒攻势，获颁陆军优异服役奖章。战间期先后数度赴华，前后历时近十年，精通汉语和中国军事，1935至1939年任驻华武官，成为美国陆军对华事务的首席权威。其性格耿直刻薄，据称曾在班宁堡痛批下属，随即遭人画成从醋瓶里钻出的漫画，绰号\"醋性乔\"由此广传；麾下士兵则因他始终与士卒同甘共苦，私下称之\"老乔叔\"；他本人给蒋介石起的绰号则是\"花生米\"。珍珠港事变后，他身兼中缅印战区美军司令、蒋介石参谋长及蒙巴顿东南亚盟军副总司令三职于一身。1942年缅甸战局崩溃，他年近六旬亲率队伍徒步穿越热带丛林二十余天撤入印度，事后坦言：\"我们被人从缅甸赶了出去，吃了一场大败仗，奇耻大辱——我们必须弄清原因，打回去，夺回来。\"此后他在印度重建中国驻印军、全面推行美式训练，主持修建列多公路以重开对华陆路补给线，始终坚信\"中国士兵一旦装备充足、供给到位，天下无敌\"。他与蒋积怨日深：他指控蒋扣押租借物资用于防共而非抗日，蒋则以\"鲁莽傲慢、不服从指挥\"为由持续向华盛顿施压。1944年10月他被罗斯福下令解职，原本一人兼任的三个职位须由三名将领分别接替。此后转任第十军军长参与冲绳战役，并出席日本受降典礼。他是美国陆军史上极少数获颁步兵战斗章的将级军官之一。1946年10月12日因胃癌逝世，列多公路后以其姓名命名。"
 ernest_king_desc:0 "1878年生于俄亥俄州洛雷恩，安纳波利斯海军学院毕业，曾先后在水面舰艇、潜艇和航空兵领域服役，是海军中少见的全领域资历军官。1941年12月珍珠港事件后不久，被罗斯福任命为美国舰队总司令，1942年3月进一步兼任海军作战部长，集两职于一身，成为美国海军战时最高指挥官。他在战略资源分配上倾向于给予太平洋战场充足优先级，与英方及马歇尔的欧洲优先主张形成持续摩擦，在\"先欧后亚\"还是两线并重的问题上多次与盟国最高战略层发生正面冲突。他与尼米兹的分工大致是：金负责华盛顿层面的战略协调和资源争取，尼米兹负责太平洋前线的具体作战部署。个人风格上以强硬、苛刻和情绪急躁著称，据部分同事回忆，他是美国军队中最难共事的高级将领之一。1956年逝世。"
 chester_nimitz_desc:0 "1885年生于德克萨斯州弗雷德里克斯堡，安纳波利斯海军学院毕业，早期主要在潜艇部队服役，后转入水面舰艇，取得广泛的海军作战资历。1941年12月7日珍珠港遭袭后，他于12月31日接替金梅尔出任太平洋舰队总司令，在舰队实力严重受损的逆境下着手重组太平洋方向的海军作战体系。1942年6月，凭借出色的情报侦破，他在中途岛海战中以少胜多，伏击并歼灭日本联合舰队的四艘主力航母，这场胜利被认为是太平洋战争的转折点。此后他主导推进跳岛战术，绕过日军重点防守的岛屿，切断其补给线，逐步将主力推进至日本本土外围。1944年参与马里亚纳群岛战役（菲律宾海海战），同年10月统筹协调莱特湾海战，1945年指挥硫磺岛和冲绳岛攻势。1945年9月2日，他代表美国在停泊于东京湾的密苏里号舰上出席日本投降签字仪式。1966年逝世。"
 william_halsey_desc:0 "1882年生于新泽西州伊丽莎白，安纳波利斯海军学院毕业，驱逐舰军官出身，1934年在年过五十时取得海军飞行执照，由此兼跨水面与航空两个领域。1941年12月7日，他率航母编队在海上执行任务，因此躲过珍珠港袭击，其麾下航母成为随后数月太平洋防御力量的核心。1942年4月，杜立特空袭编队在他舰队的大黄蜂号甲板上起飞。同年10月，他接替戈姆利出任南太平洋战区司令，以积极进攻姿态稳定了瓜达尔卡纳尔方向的海上局势。1944年6月出任第三舰队司令。同年10月莱特湾海战期间，他率第三舰队北上追击小泽治三郎率领的北方航母诱饵编队，主动脱离对圣贝纳迪诺海峡的封锁，致使栗田健男舰队主力乘虚而入，袭击美国护航航母群，局势险些酿成重大灾难，最终靠护航舰艇的拼死抵抗和栗田舰队的临阵撤退才得以化解。1944年12月和1945年6月，他率舰队先后两次遭遇强台风，因规避措施不足，分别损失驱逐舰数艘和水兵数百人；战后海军调查认定他对这两次台风损失负有指挥责任，但未予正式起诉。1959年逝世。"
 frank_jack_fletcher_desc:0 "1885年生于爱荷华州马歇尔敦，安纳波利斯海军学院毕业。1914年4月参与墨西哥韦拉克鲁斯行动，获颁荣誉勋章。二战初期担任太平洋战场航母特混舰队主要指挥官：1942年5月珊瑚海海战中，他指挥约克城和列克星敦航母编队与日本南进舰队交战，双方各有损失，日军对珊瑚海方向的推进被遏制；1942年6月中途岛海战中，他以约克城编队为第十七任务部队，与斯普鲁恩斯的第十六任务部队协同作战，担任名义最高指挥，共同击沉日本四艘主力航母。1942年8月瓜达尔卡纳尔登陆期间，在陆战队上岸约四十八小时后，他以补给燃油有限和担心航母损失为由将航母编队撤出，致使岸上部队在一段时期内失去海空支援，成为此后持续争议的决定。此后不久他被调离主力航母作战，出任北太平洋战区司令，负责阿留申群岛方向直至战争结束，未再参与太平洋南部主要海战。1973年逝世。"
 raymond_spruance_desc:0 "1886年生于马里兰州巴尔的摩，安纳波利斯海军学院毕业，以水面舰艇军官出身，本人并非飞行员。1942年6月，哈尔西因病住院，尼米兹临时任命他出任第十六任务部队指挥官参与中途岛海战。他在情报分析基础上选择精准时机发出攻击，企业号和大黄蜂号舰载机协同击沉日本四艘主力航母，随后下令规避夜间水面接触，被部分人士批评未能追歼残敌，但多数后世史家认为此举在当时风险条件下属于稳妥决断。此后出任太平洋舰队参谋长，1944年出任第五舰队司令。1944年6月菲律宾海海战（又称马里亚纳海战）中，他以护卫两栖舰队为首要任务，集中防御消耗日本舰载航空兵，日军三支航母航空队在此役中损失殆尽，但因未全力追击撤退的日本舰队而遭到部分批评。此后相继指挥硫磺岛和冲绳战役的海上支援。他与哈尔西轮换指挥同一支舰队：哈尔西指挥时称第三舰队，他指挥时称第五舰队，两人以此方式交替主导太平洋攻势的不同阶段。1969年逝世。"
 dewitt_clinton_ramsey_desc:0 "1888年生于亚利桑那领地惠普尔营地，外祖父为亚利桑那领地总督梅耶·朱利克。1912年毕业于安纳波利斯海军学院，1917年取得飞行员资格，为全美海军第四十五位完成飞行训练的军官，绰号\"公爵\"。一战期间赴法担任海军航空站视察官，并参与盟军停战委员会工作。战间期深耕舰载航空事务，1938至1939年任萨拉托加号航母执行官，此后历任航空局作战计划处长及助理局长。1942年2月接掌萨拉托加号，全程参与瓜达尔卡纳尔战役：同年8月24日东所罗门海战中，所辖航空队击沉日军轻型航母龙骧号并重创另一支特混舰队，获颁海军十字勋章。1943年8月升任航空局局长，主导战时航空装备采购与技术研发，推动海军战略重心由战列舰向航母转型，获颁海军优异服役奖章。战后任海军作战副部长（1946–1948年），随后接掌太平洋舰队，末职为太平洋托管领地专员，1949年5月以上将军衔退役。1961年9月7日逝世于费城海军医院，葬于安纳波利斯海军学院墓地，美国海军以其姓名命名一艘护卫舰。"
 marc_mitscher_desc:0 "1887年生于威斯康辛州，安纳波利斯海军学院毕业，1916年取得海军飞行员资质，是美国海军最早一批持证飞行员之一，此后长期深耕航母与舰载航空领域。1942年初至中期担任大黄蜂号航母舰长，杜立特空袭编队即自大黄蜂号甲板起飞；同年6月中途岛海战中，他麾下的鱼雷机中队在攻击日本航母编队时几乎全数损失。1943年在所罗门群岛担任航空兵部队指挥官，在空中消耗战中取得一定战果。1944年出任第五十八特混舰队指挥官，率多支航母编队在菲律宾海海战、马里亚纳战役、莱特湾、硫磺岛和冲绳战役中持续参与攻势行动。菲律宾海海战收尾阶段，为引导在黑夜中燃油告急的返航飞行员降落，他下令点亮舰队灯光，此举在短时间内使舰队暴露于潜艇威胁之下，但成功减少了因无法归舰而坠海的飞行员伤亡。1945年冲绳战役期间，他的旗舰多次遭遇神风特攻机袭击，伤亡惨重。1947年逝世。"
 curtis_lemay_desc:0 "1906年生于俄亥俄州哥伦布，陆军航空队军官，以高强度训练和精密战术规划著称。二战欧洲战场，他从轰炸机群指挥官逐步晋升，在对德轰炸作战中发展出密集箱型编队战术，以三维立体队形提升B-17轰炸机群的防御能力和轰炸精度，并多次率队深入德国防空火力密集地带执行任务。1944年末调赴太平洋战区，先接管中国基地B-29部队，后出任马里亚纳群岛第二十一轰炸机司令部指挥官。他判断高空精确轰炸对日本城市密集木制建筑效果不佳，遂于1945年3月起大规模改用低空夜间燃烧弹轰炸。1945年3月9日至10日的东京大空袭（\"会议厅行动\"）在约一夜之内造成约八万至十万平民死亡，超过广岛原子弹投掷当日的初始死亡数字。此后他持续主导对日本多座主要城市的系统性燃烧弹轰炸，平民总伤亡估计超过三十万。对于上述行动造成的大规模平民死亡，他本人曾坦言：若美国战败，他本人将以战争罪被审判。战后出任战略空军司令部指挥官（1948至1957年），主导冷战核威慑打击体系建设。1990年逝世。"
 harold_mcclelland_desc:0 "1893年生于爱荷华州蒂芬，1916年毕业于堪萨斯州立农业学院，获理学学士学位，1917年8月获任陆军步兵少尉。此后转入航空兵，逐渐将通信技术作为毕生专业方向。1926年驻纽约期间曾执行一项特殊宣传任务：驾机以时速约一百六十公里低空掠过，向地面的贝比·鲁斯投掷棒球，为陆军航空兵争取公众关注。1930年代初组建并指挥第19轰炸机大队，其后转向通信基础设施建设——1934至1938年奉阿诺德将军之请，主导创建\"陆军航路通信系统\"，奠定美国空军全球通信网络的制度框架，被后世称为\"美国空军通信之父\"。同期曾担任阿诺德阿拉斯加飞行的通信与气象官，并在邮政飞行危机期间担任盐湖城区通信官。1941年5月以上校身份赴伦敦，出任美国陆军特别观察员组作战训练处长，珍珠港事变后以准将军衔在欧洲战区美军司令部延续同一职务。1942年7月回国入驻陆军航空兵总部，与斯坦福大学工程师弗雷德·特曼合作研究无线电频率侦听与干扰。1943年7月升任航空通信官，主持构建了当时世界上规模最大的军事通信系统，并主导雷达对抗措施的研究与推广，获颁陆军优异服役奖章。战后于1946年4月出任航路与空中通信勤务首任指挥官，1948年任军事空运勤务副司令，1950年代初曾任中央情报局通信主任。1965年11月19日逝世。"
 george_marshall_desc:0 "1880年生于宾夕法尼亚州尤宁敦，就读弗吉尼亚军事学院，非西点出身。一战期间随美国远征军赴法，历任参谋职务，以规划与协调能力渐获上级器重。1939年晋升陆军参谋长，在战争爆发前主导推进美国陆军大规模扩充与现代化改革，将一支平时序列军队在数年内建成数百万人规模的战时力量，并系统建立起征召、训练和动员体系。他以选将用人著称：艾森豪威尔、布拉德利等人均经由他的发现与提拔进入高级指挥层级。在盟国最高战略协调层，他是与英国参谋总长布鲁克、首相丘吉尔持续磨合的美方核心代表，坚持推动横渡英吉利海峡的正面进攻路线，对英方多次提出的地中海迂回方案持保留态度，最终在1944年确立了霸王行动的战略主轴。战争结束后，1945至1947年间他作为杜鲁门特使赴中国调停国共内战，历经一年余斡旋未能阻止内战全面爆发，调停无果后返回美国。1947年出任国务卿，推动以其姓名命名的欧洲复兴计划，向西欧遭受战争破坏的国家提供大规模经济援助，因此在1953年获授诺贝尔和平奖。1950至1951年兼任国防部长，经历朝鲜战争爆发初期。1959年逝世。"
 henry_arnold_desc:0 "1886年生于宾夕法尼亚州格拉德温，父亲为兼任国民警卫队军职的医生。1907年毕业于西点军校，因在校恶作剧积累罚记被拒于骑兵之外，以步兵少尉赴菲律宾。1911年4月受命跟随莱特兄弟学习飞行，取得陆军飞行员第二十九号执照，成为美国最早的军队飞行员之一。1914年在菲律宾驻防时与一等中尉马歇尔为邻，当时已私下预言\"此人将来必任参谋长\"，两人此后共事终身。他长期追随比利·米切尔，是其最重要的门生；米切尔被军法裁定后，他受株连被调往堪萨斯州，职业生涯停滞数年。1934年率十架B-10轰炸机完成往返阿拉斯加编队飞行，获颁麦凯奖。1938年接掌航空队。1941年6月陆军航空兵正式组建，他以司令身份进入参谋长联席会议及盟军联合参谋长委员会，成为史上首位参与美英最高战略决策的美国航空将领。此后他将一个仅有两万余人和八百架一线战机的组织扩张为当时世界上最强大的空中力量，主导战略轰炸计划的制定与洲际轰炸机、喷气战机的研发推进，对达不到效果的指挥官从不手软——1945年1月他因汉塞尔抵制对日燃烧弹战术将其撤换、改任李梅，随即心脏病发作。二战期间他共四度心脏病发作，属下称他是\"被这场战争夺走的将军\"。1944年12月晋升陆军五星上将；1946年2月退役；1949年5月改称空军上将，成为美国史上唯一同时持有两个军种五星军衔之人，亦是空军史上迄今唯一一位五星上将。他还是兰德公司前身\"项目兰德\"的创始人之一。绰号\"快乐汉\"，名言：\"随时保有一支现代化、自主且训练充分的空军固然不够，但没有它，国家安全便无从谈起。\"1950年1月15日逝世于加利福尼亚州索诺马，葬于阿灵顿国家公墓，被后世称为\"美国空军之父\"。"
 carl_spaatz_desc:0 "1891年生于宾夕法尼亚州博伊尔敦，西点军校毕业，一战期间以飞行员身份在法国参战并击落数架敌机，战间期积累丰富的航空指挥与管理经验。二战中先后担任第八航空队司令和驻欧美国战略空军司令，主导对德国工业设施、石油炼化体系和交通枢纽的系统性战略轰炸，在与皇家空军协调英美两国轰炸任务、分配目标优先序方面承担核心协调角色。1945年转赴太平洋战区，出任美国陆军战略空军司令，成为原子弹投放命令链的关键执行节点：1945年7月，他收到书面投弹命令，将指令下达至负责执行任务的第五○九混合大队，使广岛和长崎的两次原子弹投放得以依命令执行。战后1947年美国空军正式独立，他出任首任空军参谋长，任期一年。1974年逝世。"
 george_kenney_desc:0 "1889年生于加拿大新斯科舍省，幼年随家人移居美国，一战期间以观察员和战斗机飞行员身份在法国参战，战后留在陆军航空队。1942年7月被麦克阿瑟任命为西南太平洋战区空军司令兼第五航空队司令。他到任后迅速评估战区空军状况，重整战斗、轰炸与运输能力，并大力推广低空跳弹轰炸战术：飞机在极低空投弹，炸弹贴水面弹跳后击中目标舰船水线，绕过日军密集防空火力。1943年3月俾斯麦海海战中，他麾下飞机以此战术和低空扫射重创正在增援新几内亚的日本运输船团，大批日军增援部队在海上被歼，是这一战术的标志性战例。此后他持续为麦克阿瑟的新几内亚和菲律宾作战提供空中掩护、火力压制与补给运输支援，是麦克阿瑟体系中地面与空中协同的核心执行者之一。日本投降后出任战略空军司令部司令（1946至1948年）。1977年逝世。"
 USA_charles_lindbergh_desc:0 "1902年生于密歇根州底特律，幼年随家人在明尼苏达州乡间长大，父亲为反对美国参加一战的联邦众议员。1927年5月，他独自驾驶\"圣路易斯精神\"号单翼飞机从纽约起飞，约三十三小时后降落巴黎，完成首次单人不间断跨大西洋飞行，一夜成为世界知名人物和美国公众心目中的飞行英雄。1930年代他多次应邀访问德国，考察德国空军建设，1938年接受戈林代表希特勒授予的德意志鹰勋章，并向美国政府提交了有关德国空军实力的评估报告——这份报告被认为在一定程度上高估了德国的空中优势，影响了英法决策层的战略判断。随着欧战临近，他成为美国国内孤立主义阵营最具影响力的公开代言人，在广播演讲和全国巡回集会中反复主张美国不应介入欧洲战争。1941年9月在爱荷华州得梅因的演讲中，他公开点名犹太人、英国政府和罗斯福政府为推动美国参战的三股主要力量，将犹太群体列为利用自身对\"媒体、电影工业和政府\"的影响力向战争方向施压者，这段言论引发广泛批评，多个组织和媒体将其定性为带有明显反犹色彩的公开表态。珍珠港事件后，他宣布收回反战立场并申请恢复军职，遭罗斯福拒绝。此后他以民间技术顾问身份为联合飞机公司工作，1944年赴太平洋战区以平民顾问身份随美国陆军和海军陆战队飞行单位测试战机性能、研究燃油效率和作战航程延伸方案，据记载实际参与了部分飞行任务。1974年逝世。"
 jimmy_doolittle_desc:0 "1896年生于加利福尼亚州阿拉米达，曾在麻省理工学院攻读航空工程学博士，是当时少有的兼具实战飞行经验与航空工程科学背景的军人。战前以特技飞行赛事纪录和仪表盲飞技术的先驱测试著称。1942年4月18日，他率十六架B-25中型轰炸机从大黄蜂号航母甲板起飞，对东京、名古屋、神户等日本城市实施空袭，这是太平洋战争中美国对日本本土的首次空中打击，心理震撼效果远超实际军事损毁，也打破了日本本土不可侵犯的舆论印象。所有飞机在任务后因燃油耗尽，飞行员被迫在中国浙江、江西一带迫降或跳伞，多数人由中国民众和地方军队冒险协助转移至安全地带。日本随即在该地区发动大规模报复行动（\"浙赣作战\"），系统清剿曾协助美国飞行员的中国村庄和地方部队，造成逾25万名中国平民死亡。此后杜立特先后指挥北非第十二航空队、地中海第十五航空队，1944至1945年出任第八航空队司令，参与对德战略轰炸。1993年逝世，享年九十六岁。"
 john_cannon_desc:0 "1892年生于犹他领地盐湖城，1914年毕业于犹他农业学院。一战以步兵军官入伍，战后于1922年完成飞行训练，与陈纳德同批毕业于埃灵顿基地。在凯利基地执掌飞行训练期间，查尔斯·林白曾是他的学员；1930年借调柯蒂斯-莱特公司，与杜立特游历欧洲二十一国推广军用飞机；主持兰道夫基地训练期间，又先后培育了范登堡、推宁、诺斯塔、李梅等日后主导美国空军的一代将领。1938至1941年任驻布宜诺斯艾利斯美军使团团长。1942年以准将率部参与火炬行动，此后历任北非训练司令部、西西里及意大利战场战术航空副司令。1944年晋升少将、任第十二航空队及地中海盟军战术航空兵司令，统筹法国南部登陆龙骑兵行动的全部空中作战，该行动后被公认为战术空中优势的教科书范例。1945年3月晋升中将，出任地中海战区盟军空中总指挥。二战期间，他比任何一位美国航空将领都更完整地走过了盟军战术航空的整个学习曲线。战后先后两度任驻欧美国空军司令，第二任期内经历1948至1949年柏林空运。1951年晋升四星上将，任战术空军司令部总司令，为美国空军史上首位获得永久四星军衔的军官。绰号\"老乔叔\"。1954年3月退役时以服役序号3A位居全军最资深；1955年1月12日因心脏病逝世于加利福尼亚州阿卡迪亚，葬于阿灵顿国家公墓，新墨西哥州坎农空军基地以其名命名。"
 claire_lee_chennault_desc:0 "1893年生于德克萨斯州商务市，陆军航空队军官，早年以战斗机机动理论和特技飞行教学著称，其强调近距空战格斗能力的战术主张与当时美国陆航强调高速重型截击机的主流方向存在分歧。1937年以健康问题退役后受宋子文和蒋介石之邀赴华，以顾问身份协助整顿和训练中国空军，在中日全面开战的背景下亲历日本航空兵在中国战场形成的持续优势。1940至1941年间，他与宋子文在美国共同推动组建由美国退役和现役飞行员构成的志愿航空队，获得罗斯福政府非公开的行政默许，最终成立美国志愿援华航空队（AVG），因其飞机机头的鲨鱼嘴涂装而被称为\"飞虎队\"。飞虎队于1941年12月珍珠港事件前后在缅甸和云南展开作战，以P-40战斗机利用地面预警网络和高低差战术对抗日本航空兵，在保卫仰光至昆明的补给线中发挥了较为突出的作用。1942年7月AVG解散，并入美国陆军航空队体系；陈纳德随之入现役，先负责中国航空特遣队，1943年第十四航空队正式成立后出任司令，在驼峰物资极度有限的条件下指挥对日空中作战。他与史迪威在战区资源分配上长期对立：史迪威认为应优先以地面军队夺回缅甸陆路，陈纳德主张将更多驼峰物资拨给空中力量以更高效地打击日本补给线，两人的争议多次上达华盛顿，形成持续的派系角力。1945年初随着美军对华战略的调整，陈纳德实际影响力下降，同年7月申请退役。此后他在内战期间短暂参与中华民国一侧的民用航空事业，1949年离开中国大陆。1958年逝世。"
 thomas_kinkaid_desc:0 "1888年生于新罕布什尔州汉诺威，安纳波利斯海军学院毕业。二战初期参与北大西洋护航任务，随后调赴太平洋，1942年在所罗门群岛海战系列中参与多次水面接触战。1943年在北太平洋指挥了阿图岛和基斯卡岛的驱逐日军行动，清除了日本在阿留申群岛的据点。此后调赴麦克阿瑟西南太平洋战区，出任第七舰队司令，这支舰队以两栖支援为主要职能，紧密配合麦克阿瑟的陆上推进。1944年10月莱特湾海战期间，第七舰队负责保卫莱特湾的两栖部队：他在苏里高海峡以旧式战列舰夜间截击日本南方分舰队，歼灭其主要兵力，被认为是战争史上最后一次传统战列舰炮击对决；与此同时，因哈尔西率第三舰队北上追击诱饵舰队，圣贝纳迪诺海峡无人把守，栗田舰队主力突入并袭击第七舰队护航航母群（\"塔菲三\"），险造成重大损失。关于封锁责任，他与哈尔西之间的通讯协调存在明显漏洞，战后双方各有指责，这一争议成为莱特湾海战史学讨论的持续焦点。1972年逝世。"
 harry_white_desc:0 "1892年生于马萨诸塞州波士顿，父母为来自立陶宛的犹太移民。在哈佛大学获经济学博士学位。1934年加入罗斯福政府财政部，1941至1945年间出任财政部货币研究司司长，是财政部长小亨利·摩根索的核心经济顾问。1944年7月，他与英国经济学家约翰·梅纳德·凯恩斯共同在新罕布什尔州布雷顿森林主导战后国际货币体系谈判，实际起草了大量技术方案，推动建立国际货币基金组织和国际复兴开发银行，确立了以美元与黄金挂钩、各国货币固定汇率为核心的\"布雷顿森林体系\"，深刻塑造了战后数十年的国际货币秩序。他还参与起草战后对德\"去工业化\"方向的\"摩根索计划\"草案，但该计划被泄露并遭公众批评后未被采纳。1946年出任美国首任国际货币基金组织执行董事。美国联邦调查局从1940年代初起积累有关他与苏联情报网络存在联系的线索；战后解密的\"维诺纳计划\"截获电报显示，代号\"法官\"和\"理查德\"的人物与他存在对应关系，部分历史学家据此认定他系苏联情报联系人。1947年他在国会调查听证中否认上述指控，1948年8月在再次作证后不久心脏病发作逝世，正式调查因此中止，其历史定性至今未有公认结论。"
 victor_perlo_desc:0 "1912年生于纽约市，经济学家，哥伦比亚大学毕业。1930年代以联邦政府雇员身份先后在农业调整局、战时生产委员会等新政机构任职，从事经济分析与政策研究工作。在情报争议方面：1945年从苏联驻美机构叛逃的伊丽莎白·本特利向联邦调查局提供了证词，将他列为一个由政府雇员构成的苏联情报联络网络（史称\"珀洛小组\"）的核心人物；战后解密的\"维诺纳计划\"截获电报中，部分内容被研究者与他的活动相对应。他从未被正式起诉，在国会反共调查中援引宪法第五修正案拒绝就相关问题作答。战后他以左翼经济学家身份继续活动，出版多部批评美国资本主义体制的著作，并于后期公开声明其美国共产党成员身份。1999年逝世。"
 whittaker_chambers_desc:0 "1901年生于宾夕法尼亚州费城，幼年迁居纽约布鲁克林，在哥伦比亚大学就读期间加入美国共产党，后离开学业。1930年代参与苏联军事情报机构在美国的地下网络活动，自述担任联络员角色，与政府部门内的情报联络人接触并传递文件。1938年他单方面切断与苏联情报网和共产党的一切联系，此后转向宗教信仰并长期保持沉默。战后他加入《时代》杂志，逐步成为资深编辑，在美国保守派知识界积累了一定影响力。1948年8月，他在众议院非美活动调查委员会（HUAC）公开作证，指控曾任国务院高级官员、时任卡内基国际和平基金会主席的阿尔杰·希斯曾是苏联情报联络人，引发全国关注。希斯当庭否认并对钱伯斯提起诽谤诉讼。钱伯斯随后公开了他秘密藏存于马里兰州农场南瓜地里的微缩胶片，内含涉及国务院的文件影像，这批被称为\"南瓜文件\"的材料成为案件的核心证据。由于法定诉讼时效已过，无法以间谍罪直接起诉，希斯最终于1950年以伪证罪被陪审团定罪，判处五年有期徒刑。关于此案的历史真相，美国学界至今仍有分歧：部分研究者认为维诺纳解密档案支持钱伯斯的指控，另一部分人则对定罪依据的完整性和解读提出质疑。1952年钱伯斯出版回忆录《见证》，详述自己从共产主义转向宗教保守主义的历程，成为美国反共文化中被广泛引用的文本。1961年逝世。"
 USA_joseph_patterson_desc:0 "1879年生于伊利诺伊州芝加哥，出身麦考密克-帕特森报业家族，与芝加哥论坛报有家族关联。早年曾持社会主义立场，一战期间转而支持参战并亲赴前线服役。1919年在纽约创办《纽约每日新闻》，以大量图片、简洁文字和通俗化报道迅速吸引工薪阶层读者群体，数年内跻身全美发行量最大的日报之列，在工人阶级城市社区中影响广泛。1930年代初他对罗斯福新政保持相对同情的立场，但随着对欧洲战争态势的判断日趋保守，他逐步转向孤立主义，与其表兄罗伯特·麦考密克（掌管芝加哥论坛报）共同形成保守派媒体反干涉的舆论阵营，持续反对美国以任何形式介入欧洲事务。珍珠港事件后立场有所调整，但仍对战时政府保持批评视角。1946年逝世。"
 USA_william_regnery_desc:0 "1877年生于威斯康星州希博伊根，父亲威廉自德国恩施移民美国，家族随后迁居艾奥瓦州，信仰天主教。早年深受亨利·乔治土地单税思想影响，投身多种社会改革运动，亦曾支持罗斯福新政。此后通过纺织业在伊利诺伊州积累大量财富，1936年出任芝加哥西方遮阳布公司负责人。随着欧战局势升温，他转向坚定的孤立主义立场。1940年参与联署创立美国优先委员会，并以主要金主身份资助这一以\"美国不应卷入欧洲战争\"为宗旨的民间反战运动。委员会总部设于芝加哥，巅峰时期登记成员逾八十万，以查尔斯·林德伯格为最知名公众代言人，是美国历史上规模最大的反战组织之一。1941年12月日本袭击珍珠港后，委员会随即宣布解散。其子亨利·雷格纳里于1947年创立雷格纳里出版社，陆续出版巴克利《耶鲁的上帝与人》、柯克《保守主义的精神》等著作，成为美国战后保守主义思想谱系的重要塑造者。1954年1月16日逝世。"
 harold_ickes_desc:0 "1874年生于宾夕法尼亚州弗兰克斯敦，芝加哥大学毕业，早年在芝加哥以律师和地方政治活动人士身份活跃，以共和党进步派立场参与城市改革运动。1933年被罗斯福任命为内政部长，此后在任长达十三年，是新政内阁中任期最长的阁员。他同时兼任公共工程署（PWA）署长，监督将大量联邦资金注入水坝、桥梁、学校、医院和政府建筑等公共基础设施项目，以实体工程带动就业，成为新政公共投资路线的重要执行机制之一。他在资源管理立场上倾向于维护联邦对公共土地的控制权，抵制私人企业对公共土地和矿产的商业开发。在民权倾向上他较联邦政府其他阁员相对积极：1939年他批准黑人歌手玛丽安·安德森在林肯纪念堂前举行公开演唱会，此举发生在该歌手被美国宪法堂以肤色理由拒绝提供场地之后，产生了广泛社会影响。内政部同时管辖印第安事务局，他与印第安事务专员约翰·科利尔共同推进\"印第安新政\"框架，在政策方向上支持部落土地权利的一定恢复，但具体执行层面的保障效果在不同部族中反应不一。他对纳粹德国和孤立主义持公开批评立场，在罗斯福内阁讨论中多次力主正视法西斯威胁。1952年逝世。"
 charles_coughlin_desc:0 "1891年生于加拿大安大略省汉密尔顿，罗马天主教神父，就读于多伦多大学圣巴西尔学院。1926年起在密歇根州皇家橡树市圣特蕾莎堂担任神父，随即开始在地方广播电台发表演讲，听众规模迅速扩大，至1930年代极盛时期估计每周广播受众超过三千万人，成为当时美国媒体影响力最大的宗教人物之一，\"广播神父\"之名广泛流传。1930年代初期，他以罗斯福新政的公开支持者姿态登上全国舞台，措辞激烈地抨击\"国际银行家\"和华尔街利益集团。1934年后他开始转向批评新政力度不足，创建\"社会正义全国联盟\"，推销通货扩张和白银国有化方案，并逐步与罗斯福决裂。1930年代后期他的反犹太主义内容日趋公开：他在广播中鼓吹犹太人操控国际金融和共产主义运动的阴谋论；在他创办的《社会司法》（Social Justice）杂志上大量翻印《锡安长老会议纪要》——这份文件早在1920年代已被多家欧洲媒体证实为伪造，但库格林持续以其作为反犹证据传播；他对纳粹德国的\"水晶之夜\"大规模袭击犹太人事件进行辩护，宣称是对犹太人自身行为的回应。他支持和推动\"基督前线\"（Christian Front）等亲法西斯倾向团体的组建，这些团体在纽约等城市的部分成员涉及对犹太裔居民和左翼人士的暴力行为。珍珠港事件后他仍在《社会司法》中攻击战时政策和政府领导，1942年5月美国司法部启动邮件欺诈调查程序，底特律总主教爱德华·穆尼随即以违反教规为由下令他停止广播和杂志出版，回归教区职务。此后他默默在皇家橡树市任职至1966年退休，1979年逝世，未再从事任何公开政治活动。"
 USA_robert_taft_desc:0 "1889年生于俄亥俄州辛辛那提，父亲威廉·霍华德·塔夫脱为美国第二十七届总统，后任最高法院首席大法官。他毕业于耶鲁大学和哈佛法学院，在班级中名列前茅，回俄亥俄州执业后进入州议会，逐步进入联邦政治。1939年当选联邦参议员，此后连任至1953年逝世，在参议院任期内成为共和党保守派的旗手人物，被支持者称为\"共和党先生\"。他强调有限政府和宪法权力划分，反对罗斯福政府借助危机持续扩张联邦权力和行政权，认为大量新政立法逾越了宪政界限。在对外政策上他是战前孤立主义阵营的重要代言人，坚持反对以援助英国或任何预先承诺的方式将美国拖入欧洲战争，主张美国应守卫西半球、避免承担欧洲事务的干涉责任；他同时批评罗斯福绕过国会以行政手段推进对英援助。珍珠港事件后他支持对日宣战，但持续批评战时行政权力扩张及其对公民自由的潜在侵蚀。他在1940、1948和1952年三度竞争共和党总统候选人提名，均未能胜出，1952年在共和党全国代表大会上以微差败于艾森豪威尔，结束了他的总统候选竞争。1947年他与众议员弗雷德·哈特利合力推动通过《塔夫脱-哈特利法》，对工会权力作出系统限制，包括禁止封闭式工厂、要求工会领袖宣誓非共产党员、扩大联邦干预劳资纠纷的权力等条款，是二十世纪美国劳工政策史上的重大立法节点。1953年逝世。"
 USA_joseph_mccarthy_desc:0 "1908年生于威斯康辛州格兰德萧特，农场家庭出身，马凯特大学法学院毕业。1939至1944年担任威斯康辛州第十司法巡回区法官。二战期间以预备役军官身份在太平洋战区服役于海军陆战队，主要承担情报联络职务；他在后来的选举宣传中对自身战斗经历有所夸大，这些说法在部分细节上受到质疑。1946年当选威斯康辛州联邦参议员，前几年任期内政治影响力有限。1950年2月在西弗吉尼亚州惠灵的演讲中，他声称持有一份共产党渗透者名单，指其成员正在国务院任职——这一数字在此后多次引用中前后不一，且始终未能以规范的证据程序加以证实——由此点燃了以其姓名命名的\"麦卡锡主义\"时代。此后数年，他通过国会调查委员会主席的席位对政府机构、军方、新闻界和学术界人士发起大规模反共指控，惯用手法是公开点名、暗示持有\"证据\"，却拒绝在可接受质询的正式法律程序中出示，导致数百人在无法对质指控者的情况下丢失职位或遭受社会压力。1954年他将攻击矛头转向陆军，陆军-麦卡锡听证会在全国电视直播中持续数周，陆军首席律师约瑟夫·韦尔奇在听证中对其行为的公开质问，使麦卡锡的公众形象受到广泛批评，支持率急速下跌。1954年12月，参议院以六十七票对二十二票通过对他的谴责决议，成为参议员被本院正式谴责的少数案例之一。被谴责后他在参议院几乎丧失全部影响力。1957年逝世。"
 USA_john_winant_desc:0 "1889年生于纽约市，就读于圣保罗学校，后入读普林斯顿大学，一战期间曾短暂离校服役。战后在新罕布什尔州从事政治活动，以进步派共和党人立场三度当选州长（分别于1920年代中期和1930年代初至中期），任内推动劳工立法和社会救助政策改革，在共和党内属相对偏向社会改革方向的人物。1935年起赴日内瓦在国际劳工组织（ILO）任职，后晋升至局长一职，参与推进国际劳工权利标准的制度框架。1941年2月，罗斯福任命他出任美国驻英国大使，这一任命在英国舆论界受到广泛欢迎，被视为美国认真对待英国战时处境的外交信号。他在整个战争期间常驻伦敦，出现于遭空袭的社区和工厂，与丘吉尔及英国各界建立了密切关系，被认为是战时美国外交官中在英国民间留下最深印象的人物之一。1941年12月7日，他正在陪同丘吉尔时收到珍珠港被袭击的消息，参与协调了两国政府的即时应对。1946年离任返回美国后，他在政治声誉和个人财务方面均遭遇严重困境。1947年11月在新罕布什尔州自杀身亡，时年五十八岁。"
 USA_cordell_hull_desc:0 "1871年生于田纳西州欧弗顿县，农村家庭出身，法律职业出身，在田纳西州执业后进入政界。先后在联邦众议院（1907至1921年、1923至1931年）和联邦参议院任职，以主张降低关税和推进自由贸易为其核心政策立场贯穿整个国会生涯。1933年被罗斯福任命为国务卿，此后在任长达十一年，是美国历史上任期最长的国务卿。他主导推动《互惠贸易协定法》（1934年），授权行政部门与他国谈判双边关税削减，在大萧条保护主义盛行的环境中推进贸易自由化方向。在拉丁美洲外交上，他是罗斯福\"睦邻政策\"的主要实施者，推进泛美合作体系建设和美洲国家间法律平等关系。1941年他与日本大使野村吉三郎和来栖三郎进行了长达数月的密集谈判，试图在中国撤军、印度支那撤军和三国同盟问题上达成可接受的框架，双方始终无法弥合分歧，谈判在珍珠港事件前夕正式破裂。在难民接收政策上：1939年满载九百余名欧洲犹太难民的\"圣路易斯号\"邮轮在古巴被拒入境后转驶美国海岸，国务院以移民配额和程序为由拒绝给予特别入境许可，船只最终被迫返回欧洲，其中部分乘客后来在纳粹迫害中遇难，这一事件成为历史学界批评战时美国难民政策消极立场的标志性案例之一。他积极参与推动联合国早期构想框架的形成，1944年在布雷顿森林会议和敦巴顿橡树园会议期间发挥了协调作用。1945年获诺贝尔和平奖。1955年逝世。"
 USA_henry_morgenthau_desc:0 "1891年生于纽约市，农场主出身，与罗斯福自1910年代起即是哈德逊河谷的邻居和密友，这一长期私人关系是他进入联邦政治的重要背景。1934至1945年担任财政部长，是罗斯福内阁任期最长的阁员之一，主导新政时期大量财政运营、税收政策和公债发行。二战期间他负责战争债券的全国性销售动员，并为租借法案的财政机制提供核心支持。在犹太难民问题上，他的立场较国务院明显积极：1944年1月他向罗斯福提交了一份内部报告，详细记录国务院以移民配额和程序为由系统阻碍救援欧洲犹太难民的行为，这一举措直接促使罗斯福于当月成立\"战时难民委员会\"，该委员会此后通过多种外交和秘密渠道协助组织救援行动，估计使数以万计的人得以逃脱纳粹统治。1944年他参与起草\"摩根索计划\"，主张战后将德国彻底去工业化，拆解其重工业基础，使其无法再发动现代战争；方案泄露后遭到丘吉尔和美国国内的强烈批评，最终未被纳入盟国对德政策框架。1945年罗斯福去世后数月内他辞职。战后曾参与支持以色列建国的相关活动。1967年逝世。"
 USA_henry_stimson_desc:0 "1867年生于纽约市，耶鲁大学和哈佛法学院毕业，在共和党政治与法律界积累了数十年资历。1911至1913年担任塔夫脱政府战争部长，参与美国在菲律宾早期行政管理体系的建设讨论。1927至1929年出任菲律宾总督，直接主导美国对菲律宾自治进程的行政推进，对菲律宾政治生态和美国远东战略利益有深入的第一手认知。1929至1933年出任胡佛政府国务卿，任内提出\"史汀生主义\"：拒绝承认日本以武力在满洲造成的既成事实，坚持以国际法律秩序原则应对侵略行为，但此立场未能形成实质约束力。1940年，已年逾七十的他被罗斯福任命为战争部长，成为超越党派的战时团结的象征，全力推进战前动员和参战后的大规模军事扩充。作为曼哈顿计划的最高政治监督者，他与格罗夫斯将军共同管理这一绝密工程，参与目标城市的政策讨论，并在1945年6月主持\"临时委员会\"专门审议原子弹的使用方式与时机；他坚持将京都排除在目标名单之外，但最终支持对城市目标实施轰炸，未将预先公开警告确立为强制前提条件。他同时作为战争部长负责在行政上落实罗斯福1942年2月签署的第9066号行政令，该令强制将约十二万名日裔美国人迁入内陆拘禁营，战争部是这一措施的主要执行机构，史汀生对此承担直接行政责任；其私人日记显示他内心对措施的普遍性持有一定保留，但这些保留未转化为对政策的正式异议。1945年9月辞职。1950年逝世。"
 USA_donald_nelson_desc:0 "1888年生于密苏里州汉尼拔，密苏里大学毕业，战前长期在西尔斯零售集团任职，以卓越的采购与供应链管理能力晋升至公司执行副总裁层级。1942年1月，罗斯福任命他出任战时生产委员会（WPB）主席，主导将美国整体工业产能从民用生产向军工需求转型。他任期内的核心矛盾是与军方的权力边界争夺：陆海军采购部门倾向于直接掌控生产决策和资源分配，而纳尔逊坚持战时生产委员会应保留对工业动员的民间监督权，以防止军工利益完全主导整体经济结构。在原材料分配、产能优先序列和生产转型的初期推进上他取得了一定成果，但在与军方持续的行政摩擦中，战时生产委员会的实际权力逐渐被分散，1944年他在内部斗争中败退并辞职。战后他曾访问中国，参与对战后中国经济重建方向的评估，但未形成实质影响。1959年逝世。"
 usa_william_donovan_desc:0 "1883年生于纽约州布法罗，哥伦比亚大学法学院毕业，在纽约建立律师事务所。一战期间率部赴法作战，所属部队为第六十九纽约步兵团（入战时改编为第一六五步兵团），以作战英勇多次负伤，获颁荣誉勋章及多项最高级军事荣誉，成为同期美国军官中获勋层级最高的人物之一。战间期他数次以罗斯福私人特使身份赴欧洲、北非和中东进行政治情报评估，向罗斯福提供了大量关于欧洲法西斯运动和战争前景的第一手报告，在塑造罗斯福对外政策判断上发挥了重要作用。1941年7月他主持创建情报协调局（COI），1942年6月改组为战略情报局（OSS），这是美国二战期间主要的综合情报机构，业务涵盖人力情报收集、特工渗透、心理战、游击队支援和技术分析等多条线。OSS在欧洲占领区扶植和联络抵抗网络，在北非和地中海配合盟军登陆行动，在中缅印战区参与协助史迪威体系的情报工作，并在昆明等中国城市设有站点，参与援助中国军队的情报和特种作战协作。战争结束后杜鲁门将OSS解散，统一情报机构的构想在当时遭到军事和外交部门的抵制，美国中央情报局（CIA）至1947年才依据《国家安全法》成立，被多数研究者视为多诺万理念的延续。1959年逝世。"
 POLITICS_ALF_LANDON_DESC:0 "1887年生于宾夕法尼亚州韦斯特米德尔塞克斯，幼年随家人迁居堪萨斯州，成年后在堪萨斯州从事独立石油开采，成为当地商界人士。1933年当选堪萨斯州长，以财政保守和行政务实著称，大萧条最深处仍努力维持州财政基本平衡，是当时在这一方向上坚持最久的州长之一。1936年他以共和党总统候选人身份对抗罗斯福，以批评新政过度扩张联邦行政权力和财政开支为主要竞选立场，主张以更谨慎的财政路线取代罗斯福的大规模干预政策。1936年总统选举在大萧条阴影下进行，新政在普通选民中拥有广泛支持，他以悬殊差距落败：仅赢得缅因州和佛蒙特州，获八张选举人票，罗斯福获五百二十三票，是美国历史上最大规模的总统选举胜负差之一。败选后他在共和党内保持温和保守立场，对1940年代党内孤立主义的激进版本保持距离，此后逐渐以党内温和保守传统的代表性长者形象持续参与政治评论直至晚年。他活至一百岁，1987年逝世。"
 POLITICS_WENDELL_WILKIE_DESC:0 "1892年生于印第安纳州埃尔伍德，印第安纳大学法学院毕业，律师出身。1933年起担任联邦公用事业公司（Commonwealth and Southern Corporation）总裁，在新政推行田纳西河谷管理局（TVA）等联邦公营电力项目、与私营电力公司形成竞争关系的背景下，他成为商界批评新政政策的代表性声音，由此积累了全国知名度。1940年他在未曾出任任何公职的情况下竞争共和党总统候选人提名，以黑马姿态在代表大会上赢得提名。他的政治立场与同期共和党孤立主义主流存在明显差异：他支持向英国提供援助，反对在法西斯扩张威胁下的被动旁观，这使他在国际主义倾向的共和党人中拥有广泛支持。1940年总统选举中他获得约四千五百万张普选票，在落败候选人中得票比例相对较高，但罗斯福仍以压倒性优势赢得连任。败选后他与罗斯福的关系相对趋于合作，曾受委托以非官方身份赴英国、中东、苏联、中国等地进行战时外交访问。1943年他出版《一个世界》，主张战后建立真正的国际合作框架，批评帝国主义和殖民统治，对中东和亚洲被殖民民族的独立诉求抱持同情，展现了当时美国政治人物中罕见的全球视野。1944年10月因心脏病骤然逝世，享年五十二岁。"
 POLITICS_WENDELL_WILLKIE_DESC:0 "1892年生于印第安纳州埃尔伍德，印第安纳大学法学院毕业，律师出身。1933年起担任联邦公用事业公司（Commonwealth and Southern Corporation）总裁，在新政推行田纳西河谷管理局（TVA）等联邦公营电力项目、与私营电力公司形成竞争关系的背景下，他成为商界批评新政政策的代表性声音，由此积累了全国知名度。1940年他在未曾出任任何公职的情况下竞争共和党总统候选人提名，以黑马姿态在代表大会上赢得提名。他的政治立场与同期共和党孤立主义主流存在明显差异：他支持向英国提供援助，反对在法西斯扩张威胁下的被动旁观，这使他在国际主义倾向的共和党人中拥有广泛支持。1940年总统选举中他获得约四千五百万张普选票，在落败候选人中得票比例相对较高，但罗斯福仍以压倒性优势赢得连任。败选后他与罗斯福的关系相对趋于合作，曾受委托以非官方身份赴英国、中东、苏联、中国等地进行战时外交访问。1943年他出版《一个世界》，主张战后建立真正的国际合作框架，批评帝国主义和殖民统治，对中东和亚洲被殖民民族的独立诉求抱持同情，展现了当时美国政治人物中罕见的全球视野。1944年10月因心脏病骤然逝世，享年五十二岁。"
 POLITICS_THOMAS_DEWEY_DESC:0 "1902年生于密歇根州奥沃索，密歇根大学毕业，哥伦比亚大学法学院取得法律学位，随后在纽约从事律师业。1930年代出任纽约市曼哈顿区检察长，以积极起诉有组织犯罪著称：他的团队成功建立了针对卖淫、赌博和高利贷网络的案件，将多名黑手党和黑道相关人物绳之以法，以廉洁与行动力在纽约建立政治声誉。1938年当选纽约州长，任期内以行政效率和务实路线执政，成为共和党内温和国际主义路线的代表人物。1944年以共和党候选人身份对抗罗斯福第四任期竞选，获得约四十六个百分点的普选票，是共和党在二战期间最接近的总统竞争成绩。1948年再度出战，对抗声势低迷的杜鲁门，几乎所有民调和媒体分析都预测他将赢得选举，《芝加哥论坛报》在选票计算完成前提前印刷了\"杜威击败杜鲁门\"的头版，最终这一预测成为美国政治史上最广为人知的预测失误。杜鲁门靠着密集的全国巡回竞选和工会及农民选票的大规模支持意外胜选。杜威在两次竞选中均坚持支持战后国际参与和多边秩序，与塔夫脱的孤立主义路线形成党内对立。1971年逝世。"
 POLITICS_DOUGLAS_MACARTHUR_DESC:0 "二战名将。1880年生于阿肯色州小石城，出身军人世家，父亲为菲律宾殖民地驻军将领。1903年以第一名成绩毕业于西点军校，创下该校近三十年来最高学业纪录。一战期间随第四十二步兵师赴欧，以\"彩虹师\"师参谋长、后晋旅长身份多次亲赴前线壕沟，士兵称他\"战壕中的将军\"，累计获勋章逾二十枚。1930年出任陆军参谋长，1932年亲自督导军队驱散聚集于华盛顿的一战老兵，动用骑兵、步兵与坦克清场并焚毁帐篷区，这一行动在美国社会引发强烈批评。1935年卸任参谋长后赴菲律宾，出任联邦军事顾问，接受菲律宾政府授衔，以元帅身份统筹菲律宾军队建设。珍珠港事件后数小时内，菲律宾美国远东空军在克拉克机场遭日军轰炸，几乎全毁，麦克阿瑟对此前预警的应对迟缓后来受到历史学家的持续批评。此后他指挥巴丹半岛防御，兵力与补给均严重不足，1942年3月奉罗斯福命令撤离科雷吉多，临行前留言：\"我曾来过，我将返回。\"留下温赖特率部坚守至最终投降。此后他以澳大利亚为基地出任西南太平洋战区总司令，以跳岛战术绕过日军重兵据点、切断其补给线，逐步推进新几内亚战役和太平洋岛链作战。1944年10月，他涉水登上莱特岛海滩，向菲律宾民众宣告：\"我回来了。\"。1945年进一步解放吕宋岛。日本投降后，他以盟军占领军最高司令身份主持日本战后改造，推行含放弃战争条款的新宪法、农地改革与财阀解散，以相对低伤亡代价完成了日本非军事化转型，被部分史家视为占领史上罕见的成功案例。朝鲜战争爆发后，他指挥联合国军策划仁川登陆，以两栖奇袭切断北朝鲜军队后路，扭转了战局。然而随联合国军推进至中朝边界，中国人民志愿军于1950年10月大规模入朝，以夜间穿插、分割包围的山地战术重创联合国军多支部队，长津湖一役美国陆战一师被志愿军多面围困，在严寒中历经苦战突围，麦克阿瑟事后承认这是\"一支他完全未曾预料到的强大军队\"。他随后公开主张扩大战争规模、轰炸中国境内目标，并绕过白宫直接向国会共和党领袖发表政治声明，1951年4月被杜鲁门以不服从文官控制为由解除全部职务。返回美国后他在国会发表告别演说，以一首西点军校老歌的歌词作结：\"老兵永不死，只是逐渐凋零。\"1964年逝世于华盛顿，终年八十四岁。"
 POLITICS_HARRY_TRUMAN_DESC:0 "1884年生于密苏里州拉马尔，家庭农场背景，未完成大学学业，一战期间以炮兵军官身份赴法参战，战后回密苏里州经营服装店，事业失败，转入政界。1935年起担任密苏里州联邦参议员，在参议院以\"杜鲁门委员会\"（参议院国防合同调查特别委员会）主席身份主导对战时军工采购中浪费和腐败行为的调查，积累了全国声望。1944年以副总统候选人身份随罗斯福参选，当选后仅在任八十二天。1945年4月12日罗斯福因脑溢血突然辞世，杜鲁门在几乎未获战时核心机密简报的情况下接任总统，当日才从史汀生处得知曼哈顿计划的存在。1945年7月波茨坦会议期间他获悉\"三位一体\"核试验成功，随即在波茨坦公告中警告日本，授权执行原子弹投放计划。1945年8月6日广岛、8月9日长崎相继遭受原子弹袭击：广岛当日及此后数月因爆炸和辐射的累计死亡人数估计约十四万，长崎估计约七万至八万；这两次袭击造成的大规模平民死亡及使用核武器针对城市目标的决定，在历史学界形成了持续至今的伦理争议，批评者认为日本彼时已处于战略崩溃边缘，支持者则援引避免本土登陆将造成更大规模双方伤亡的判断。日本随后于1945年8月15日宣布接受投降。1947年3月他在国会发表演讲，宣布美国将援助抵抗共产主义扩张的国家，\"杜鲁门主义\"由此成为战后美国冷战政策的制度基础。同年马歇尔计划推出，以大规模经济援助稳定西欧民主体制。1948至1949年柏林危机期间他以大规模空运应对苏联封锁，避免正面军事对抗。1949年推动建立北大西洋公约组织。1950年6月朝鲜战争爆发，他在未经正式宣战的情况下以联合国授权派兵参战，1951年4月以不服从文官控制为由解除麦克阿瑟全部职务。1953年卸任，1972年逝世。"
