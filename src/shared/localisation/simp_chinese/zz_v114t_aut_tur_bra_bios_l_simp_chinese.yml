 BRA_cristovao_castro_barcelos_desc:0 "克里斯托旺·德·卡斯特罗·巴塞洛斯，1883年生，1946年卒，巴西将领，职业军事生涯横跨两次世界大战。第一次世界大战期间，他赴法国圣西尔军事学院研习（1917年），并以军官身份在法国第17龙骑兵团参加一战实战，是亲历欧洲战场炮火的少数巴西军人之一。战间期，他在巴西军队中稳步晋升，历任多项要职；1935年里约热内卢州州长选举中，他以一票之差惜败于海军将领普罗托格内斯·吉马良斯，与政界缘悭一面。1944年至1946年间出任巴西陆军总参谋长，任内适逢巴西远征军远赴意大利作战，他承担后方最高军事协调职能，并辅佐完成了1945年战后的胜利返师工作。他是巴西军界早期公开倡议将首都迁往内陆更居中地点的将领之一，这一构想数十年后在库比契克总统任内得到落实，成为巴西利亚建设的远源之一。"
 BRA_cristovao_de_castro_desc:0 "克里斯托旺·德·卡斯特罗·巴塞洛斯，1883年生，1946年卒，巴西将领，职业军事生涯横跨两次世界大战。第一次世界大战期间，他赴法国圣西尔军事学院研习（1917年），并以军官身份在法国第17龙骑兵团参加一战实战，是亲历欧洲战场炮火的少数巴西军人之一。战间期，他在巴西军队中稳步晋升，历任多项要职；1935年里约热内卢州州长选举中，他以一票之差惜败于海军将领普罗托格内斯·吉马良斯，与政界缘悭一面。1944年至1946年间出任巴西陆军总参谋长，任内适逢巴西远征军远赴意大利作战，他承担后方最高军事协调职能，并辅佐完成了1945年战后的胜利返师工作。他是巴西军界早期公开倡议将首都迁往内陆更居中地点的将领之一，这一构想数十年后在库比契克总统任内得到落实，成为巴西利亚建设的远源之一。"
 BRA_domingos_bras_desc:0 "多明戈斯·布拉斯是巴西织工、工会活动家和共产党政治人物。早年在彼得罗波利斯参与纺织工人运动，1925年被捕后被送往北部边境的克利夫兰迪亚惩戒殖民地，并曾通过无政府主义报刊揭露当地囚犯处境。1930年前后回到里约热内卢后，他继续参与工人政治活动，加入巴西共产党，并在1932年至1933年间担任党的总书记。布拉斯支持由工人干部掌握党内领导权，并卷入巴西共产党早期关于组织路线和知识分子作用的争论。"
 BRA_eduardo_gomes_desc:0 "爱德华多·戈梅斯，1896年9月20日生于里约热内卢州彼得罗波利斯，1981年6月13日卒，巴西空军元帅与政治家，“中尉运动”时代最具传奇色彩的幸存者与巴西空军的奠基人之一。1921年入读军事航空学校，次年7月5日以初级军官身份参与科帕卡巴纳要塞起义；起义被镇压，大多数参与者阵亡，仅有“十八勇士”坚持沿科帕卡巴纳海滩向政府军阵地走去——戈梅斯是极少数存活者之一，身负重伤后方告获救。此后，他继续参与1924年圣保罗中尉派起义，一度入狱，1930年支持瓦加斯革命，1935年共产主义起义期间则转而参与镇压。1941年巴西空军正式成立，他是核心创建将领，后被追封为空军保护人。在政治上，他是反瓦加斯的民主联盟的代表性人物，分别于1945年（败于杜特拉）与1950年（败于瓦加斯本人）两度参选总统均告落败；1945年竞选期间，支持者在集会上分发用炼乳、黄油与可可粉制成的巧克力小球，因他持有准将军衔，这款甜点由此得名“准将糖”，延续至今成为巴西最具代表性的国民甜品。"
 BRA_eduardo_guedes_desc:0 "爱德华多·格德斯·阿尔科福拉多（1883年—1945年）是巴西陆军将领，活跃于瓦加斯时代的军政体系。1930年代末，巴西军方高层在戈伊斯·蒙泰罗、欧里科·杜特拉等人影响下逐渐进入政权核心，格德斯·阿尔科福拉多也在这一时期进入高级指挥层。1939年，戈伊斯·蒙泰罗因病离职后，格德斯·阿尔科福拉多曾接替其承担总参谋系统的重要职务。1945年逝世。"
 BRA_epaminondas_dos_santos_desc:0 "伊巴密浓达·戈梅斯·多斯桑托斯，1891年11月4日生于里约热内卢，1978年7月11日卒于同地，巴西军官与政治家，以极短暂的航空部长任期与巴西共和史上最具戏剧性的政治时刻相联系。他在军队历练多年，进入航空领域行政体系；1954年8月，瓦加斯政府笼罩在严峻的政治危机之下——围绕暗杀记者卡洛斯·拉塞达未遂案、军方施压总统辞职等事件不断发酵——他在8月18日出任航空部长，仅仅六天后（8月24日），瓦加斯自杀身亡，他随即去职，这一极短暂的部长任期成为他最显著的历史印记。此后，他投身政治，于1964年3月以补缺形式接任联邦众议员席位，但随即遭到4月军事政变后颁布的第一号机构法令冲击，被剥夺政治权利十年。"
 BRA_epaminondas_gomes_santos_desc:0 "伊巴密浓达·戈梅斯·多斯桑托斯，1891年11月4日生于里约热内卢，1978年7月11日卒于同地，巴西军官与政治家，以极短暂的航空部长任期与巴西共和史上最具戏剧性的政治时刻相联系。他在军队历练多年，进入航空领域行政体系；1954年8月，瓦加斯政府笼罩在严峻的政治危机之下——围绕暗杀记者卡洛斯·拉塞达未遂案、军方施压总统辞职等事件不断发酵——他在8月18日出任航空部长，仅仅六天后（8月24日），瓦加斯自杀身亡，他随即去职，这一极短暂的部长任期成为他最显著的历史印记。此后，他投身政治，于1964年3月以补缺形式接任联邦众议员席位，但随即遭到4月军事政变后颁布的第一号机构法令冲击，被剥夺政治权利十年。"
 BRA_euclides_zenobio_costa_desc:0 "欧克利德斯·泽诺比奥·达·科斯塔，1893年5月9日生于马托格罗索州科伦巴，1963年10月29日卒于里约热内卢，巴西陆军元帅，以在意大利战场指挥巴西远征军步兵并攻克险峻的蒙特卡斯特洛阵地而留名史册。毕业于里约热内卢军事学校，1924年曾参与平息中尉运动叛乱；1930年有限度地支持推翻华盛顿·路易斯的革命；1932年立宪革命期间，他以联邦军官身份在帕拉伊巴河谷参与平叛，因表现出色获擢升。1944年7月，他率FEB第一波编队启程赴意大利，出任步兵指挥官，参加同盟国第五集团军序列下的哥特防线攻坚战役；1945年2月21日，他在阵前亲自统一指挥，以第1步兵团强袭蒙特卡斯特洛，仅约十五分钟即攻克这处被视为几乎无法强取的制高点，打开了FEB此后连续挺进、直抵都灵（1945年5月1日）的战略通道。战后，他因政治立场保守，在军内民族主义与国际主义路线博弈中被一些FEB老兵视为“国际主义派”，立场具有争议性。1954年出任瓦加斯政府陆军部长，任内在政治危机高峰中态度模糊，目睹了瓦加斯的自杀；此后，他支持库比契克顺利就职，并于1957年以元帅军衔转入预备役。"
 BRA_euclides_zenobio_da_costa_desc:0 "欧克利德斯·泽诺比奥·达·科斯塔，1893年5月9日生于马托格罗索州科伦巴，1963年10月29日卒于里约热内卢，巴西陆军元帅，以在意大利战场指挥巴西远征军步兵并攻克险峻的蒙特卡斯特洛阵地而留名史册。毕业于里约热内卢军事学校，1924年曾参与平息中尉运动叛乱；1930年有限度地支持推翻华盛顿·路易斯的革命；1932年立宪革命期间，他以联邦军官身份在帕拉伊巴河谷参与平叛，因表现出色获擢升。1944年7月，他率FEB第一波编队启程赴意大利，出任步兵指挥官，参加同盟国第五集团军序列下的哥特防线攻坚战役；1945年2月21日，他在阵前亲自统一指挥，以第1步兵团强袭蒙特卡斯特洛，仅约十五分钟即攻克这处被视为几乎无法强取的制高点，打开了FEB此后连续挺进、直抵都灵（1945年5月1日）的战略通道。战后，他因政治立场保守，在军内民族主义与国际主义路线博弈中被一些FEB老兵视为“国际主义派”，立场具有争议性。1954年出任瓦加斯政府陆军部长，任内在政治危机高峰中态度模糊，目睹了瓦加斯的自杀；此后，他支持库比契克顺利就职，并于1957年以元帅军衔转入预备役。"
 BRA_eurico_gaspar_dutra_desc:0 "欧里科·加斯帕尔·杜特拉，1883年5月18日生于马托格罗索州库亚巴，1974年6月11日卒于里约热内卢，享年91岁，巴西陆军元帅与政治家，以瓦加斯时代最重要的军政枢纽人物之一及战后首位民主选举总统的双重身份留名史册。他早年入读军事学校，1910年获少尉军衔，历经第一共和国多个政治节点；1922年曾以效忠立场参与镇压中尉运动，1932年率部平息圣保罗立宪革命，1935年以第一军区司令身份主导镇压里约共产主义起义。1936年，他就任瓦加斯政府陆军部长（任至1945年），任内推动军队现代化并主持组建、装备和派遣巴西远征军赴意大利参加二战——尽管他本人起初持亲德中立立场，直至局势明朗后方转向支持联盟国。1945年，他参与联合其他军方将领迫使瓦加斯去职的行动；同年12月当选总统，并获流亡下野的瓦加斯本人公开背书，于1946年1月31日就职，开启巴西第四共和国。任内他颁布1946年宪法恢复民主秩序，于1947年宣布共产党非法、断绝与苏联外交关系，于1948年在美国协助下创建巴西最高战争学校，并启动杜特拉总统公路（连接里约与圣保罗）等基础设施工程；年均经济增长7.6%。1951年1月任满卸职，此后仍在幕后活动至晚年，1974年平静辞世。"
 BRA_filinto_muller_desc:0 "菲林托·斯特吕宾·穆勒，1900年7月11日生于马托格罗索州库亚巴，1973年7月11日卒于法国巴黎近郊，正为其73岁生日，巴西政治家，以新国家时代巴西历史上最声名狼藉的警察头子之一著称，同日出生同日罹难——1973年，他乘坐的巴西航空瓦里格820航班在法国着陆时因机舱失火致大多数乘客死于一氧化碳中毒，他亦在其中。他19岁入伍，参与过中尉运动，后成为瓦加斯1930年革命的坚定支持者。从1933年4月至1942年7月，他出任联邦区警察总长，任期长达九年，是新国家镇压机器的核心执行者——他的警察体系与纳粹德国盖世太保保持主动协作关系（他曾于1937年应海因里希·希姆莱之邀访问德国），强力打压共产党人与其他反对者，并于1936年9月直接主导将身怀六甲的奥尔加·贝纳里奥·普列斯特斯（#51）驱逐出境遣返纳粹德国——她后来死于集中营。他还主动阻止犹太难民进入巴西，并协调对左翼人士施以酷刑的逮捕行动。1942年，随着巴西对轴心国宣战，他因亲德立场被撤职。1945年参与创建社会民主党，其后历届担任马托格罗索州参议员（1947、1955、1962年当选），在立法院活跃至晚年。"
 BRA_floriano_de_lima_brayner_desc:0 "弗洛里亚诺·德·利马·布赖纳，1897年1月2日生于帕拉伊巴州若昂·佩索阿，1983年2月3日卒于里约热内卢，巴西陆军元帅，以第二次世界大战期间担任巴西远征军参谋长而在史册上留名，亦因战后一部充满争议的回忆录而在FEB老兵圈子中饱受诟病。他出身职业军人，毕业于雷亚伦戈军事学校，1925年曾参与追剿普列斯特斯纵队的军事行动。二战前夕，他赴美国莱文沃斯指挥与参谋学院受训；1944年1月，他以上校参谋长身份随第一步兵远征师随总司令马斯卡雷尼亚斯·德·莫赖斯将军一同出发赴那不勒斯，全程参与意大利哥特防线战役，是巴西军队在欧洲战场最重要的参谋军官之一。战后，他出任总统军事办公室主任（1955—1956年）与陆军总参谋长（1959—1961年），并担任最高军事法庭部长（1961—1967年）直至荣休晋升元帅。1968年，他出版回忆录《FEB真相》，书中对总司令马斯卡雷尼亚斯多有批评，引发强烈反弹，被大多数FEB老兵视为背叛，此后他几乎被排斥于远征军退伍军人群体之外；此后数年他陆续出版修正性著作，试图弥合这一历史裂痕。"
 BRA_floriano_lima_brayner_desc:0 "弗洛里亚诺·德·利马·布赖纳，1897年1月2日生于帕拉伊巴州若昂·佩索阿，1983年2月3日卒于里约热内卢，巴西陆军元帅，以第二次世界大战期间担任巴西远征军参谋长而在史册上留名，亦因战后一部充满争议的回忆录而在FEB老兵圈子中饱受诟病。他出身职业军人，毕业于雷亚伦戈军事学校，1925年曾参与追剿普列斯特斯纵队的军事行动。二战前夕，他赴美国莱文沃斯指挥与参谋学院受训；1944年1月，他以上校参谋长身份随第一步兵远征师随总司令马斯卡雷尼亚斯·德·莫赖斯将军一同出发赴那不勒斯，全程参与意大利哥特防线战役，是巴西军队在欧洲战场最重要的参谋军官之一。战后，他出任总统军事办公室主任（1955—1956年）与陆军总参谋长（1959—1961年），并担任最高军事法庭部长（1961—1967年）直至荣休晋升元帅。1968年，他出版回忆录《FEB真相》，书中对总司令马斯卡雷尼亚斯多有批评，引发强烈反弹，被大多数FEB老兵视为背叛，此后他几乎被排斥于远征军退伍军人群体之外；此后数年他陆续出版修正性著作，试图弥合这一历史裂痕。"
 BRA_floriano_peixoto_desc:0 "弗洛里亚诺·佩肖托·法里亚·利马，1917年11月15日生于里约热内卢，巴西海军军官、政治人物。1933年进入海军学校，后长期在海军服役，曾任累西腓水兵学徒学校指挥官、总统府军事内阁海军副主任、驻美国和加拿大使馆海军武官，并升至副海军上将。军政府时期，他转入国家能源与行政体系，1973年至1974年任巴西石油公司总裁。1975年瓜纳巴拉州与里约热内卢州合并后，他出任新里约热内卢州首任州长，任内推动州政整合、里约地铁一期工程和安格拉核电工程等项目。1979年卸任后转入私营领域，2011年7月9日在里约热内卢去世。"
 BRA_francisco_campos_desc:0 "弗朗西斯科·路易斯·达·席尔瓦·坎波斯，1891年11月18日生于米纳斯吉拉斯州多雷斯·杜因代阿，1968年11月1日卒于贝洛奥里藏特，巴西法学家、教育家与政治家，两度以法律文字为威权政体奠基，是20世纪巴西宪政史上最具争议性的法律智识人物之一。早年从政于米纳斯吉拉斯，先后担任州众议员与州教育厅长。1930年革命后出任瓦加斯临时政府首任教育与卫生部长（1930—1932年），主导建立联邦大学体系并推行教师培训改革。1932年起担任临时司法部长，深度参与新国家独裁体制的法律建构；1937年11月10日，他以司法部长身份在政变前夕正式就职，主导起草并颁布1937年巴西宪法——因其参照波兰1935年权威主义宪法，该宪法在民间被称为“波兰式宪法”，明文赋予总统绝对权力并取消议会。他此后游离于主流政治边缘，但于1964年军事政变后再度现身，协助起草政变的法律依据——第一号机构法令，由此留下了贯穿两个独裁时代的威权宪政双重印记。"
 BRA_geremia_lunardelli_desc:0 "热雷米亚·卢纳尔代利，1885年8月20日生于意大利特雷维索省曼苏埃，1962年5月9日卒于圣保罗，意大利裔巴西农业实业家，人称“咖啡之王”，是20世纪上半叶巴西乃至全球最大的咖啡生产者。他出生后约一岁即随家人移居巴西，先于圣保罗西部咖啡园以殖民工人身份劳作，后以多年积蓄买下小块土地，逐步扩张。至1920年代末，他的咖啡园已遍布圣保罗、巴拉那、马托格罗索等地，拥有约1500万至1800万棵咖啡树，并在戈亚斯与巴拉圭另有土地，是当时无可争议的全球最大单体咖啡生产者，由此获得“咖啡之王”的称号。1929年华尔街股灾引发的大萧条使咖啡价格崩溃，巴西政府大规模收购并焚毁积压的咖啡库存；但他在信用支撑与个人意志下安然度过危机，并趁价格低位扩大地产。1933年，他因对巴西农业的贡献荣获南十字星勋章；1940年正式归化巴西公民。他的传奇经历后来成为巴西电视台环球电视1996年热播连续剧《牛王》主人公格雷米亚·贝尔迪纳济的人物原型基础。"
 BRA_geremia_lunarelli_desc:0 "热雷米亚·卢纳尔代利，1885年8月20日生于意大利特雷维索省曼苏埃，1962年5月9日卒于圣保罗，意大利裔巴西农业实业家，人称“咖啡之王”，是20世纪上半叶巴西乃至全球最大的咖啡生产者。他出生后约一岁即随家人移居巴西，先于圣保罗西部咖啡园以殖民工人身份劳作，后以多年积蓄买下小块土地，逐步扩张。至1920年代末，他的咖啡园已遍布圣保罗、巴拉那、马托格罗索等地，拥有约1500万至1800万棵咖啡树，并在戈亚斯与巴拉圭另有土地，是当时无可争议的全球最大单体咖啡生产者，由此获得“咖啡之王”的称号。1929年华尔街股灾引发的大萧条使咖啡价格崩溃，巴西政府大规模收购并焚毁积压的咖啡库存；但他在信用支撑与个人意志下安然度过危机，并趁价格低位扩大地产。1933年，他因对巴西农业的贡献荣获南十字星勋章；1940年正式归化巴西公民。他的传奇经历后来成为巴西电视台环球电视1996年热播连续剧《牛王》主人公格雷米亚·贝尔迪纳济的人物原型基础。"
 BRA_getulio_vargas_desc:0 "热图利奥·多内利斯·瓦加斯，1882年4月19日生于南里奥格兰德州圣博尔亚，1954年8月24日于里约热内卢总统府自尽，巴西第14任及第17任总统，巴西20世纪最具影响力与争议的政治人物，以其跨越两个历史阶段、长达约二十年的统治深刻重塑了现代巴西的国家面貌。他出身里约格朗德南部权贵世家，早年短暂从军后转入法学，历任检察官、州众议员、联邦财政部长，1928年当选里约格朗德南州州长。1930年，在旧共和国“咖啡奶茶同盟”体制崩溃之际，他以自由联盟候选人身份参选总统，大选失利后联合军方于10月3日发动武装革命，同年11月3日以临时政府首脑身份入主里约热内卢。此后以提前选举、克制镇压1932年圣保罗立宪革命、1934年经制宪议会当选宪政总统等方式周旋于各政治力量之间，并于1935年镇压共产主义起义，借此积累政治资本；1937年11月10日，他以假造的“科恩计划”（共产政变阴谋）为借口，发动政变颁布威权宪法，宣布“新国家”，独裁统治延续至1945年。在社会经济层面，他推行劳工立法、建立最低工资制度、创立国家级工会体制、推动工业化与国有钢铁业（国家钢铁公司），赢得“穷人之父”称号。1945年10月，他在军方压力下辞职；1950年以压倒性优势再度民选当总统，继续推进国家资本主义路线，力争巴西石油主权。1954年8月，在保守军方与反对派报界的政治围攻逼至顶点之际，瓦加斯拒绝去职，以一颗射入胸膛的子弹和一封致辞慷慨的《临终遗书》结束生命，此举令支持者悲痛激愤，令反对者计划中的政治清算延迟数年。"
 BRA_gois_monteiro_desc:0 "佩德罗·奥雷利奥·德·戈伊斯·蒙泰罗，1889年12月12日生于阿拉戈阿斯州圣路易斯·杜基廷迪，1956年10月16日卒，巴西陆军将领，被视为20世纪上半叶巴西军队政治化与国家安全理念建构的最核心推手之一，其在诸多历史关键节点上的幕后操盘能力使他与公众知名度不相称地扮演着“造王者”角色。出身阿拉戈阿斯蔗糖庄园世家，入读军事学校后在军中逐步崭露头角。1922年科帕卡巴纳要塞起义时，他以效忠立场协助维护政府权威；1930年革命中，他接受瓦加斯的邀约，担任革命武装的军事总指挥，率南部革命部队向里约热内卢推进，奠定了他在新政权中的核心地位。革命胜利后进入“黑色内阁”，与瓦加斯几乎每日会面，参与最初的权力布局。1932年指挥平息圣保罗立宪革命；1934年出任陆军部长（任至1935年），任内制定了国家安全学说的初稿，深刻影响了日后的镇压框架。1937年9月，他“发现”实为伪造的“科恩计划”，该计划被瓦加斯用作政变的舆论依据，建立新国家独裁。他本人亦曾有竞选总统之志但始终未能实现。1945年重返陆军部长职位，并于同年10月底联合军方将领主导了迫使瓦加斯下台的行动。战后当选阿拉戈阿斯参议员（1947年），1951至1952年出任三军联合参谋长，其后转任最高军事法庭直至辞世。"
 BRA_gois_monterio_desc:0 "佩德罗·奥雷利奥·德·戈伊斯·蒙泰罗，1889年12月12日生于阿拉戈阿斯州圣路易斯·杜基廷迪，1956年10月16日卒，巴西陆军将领，被视为20世纪上半叶巴西军队政治化与国家安全理念建构的最核心推手之一，其在诸多历史关键节点上的幕后操盘能力使他与公众知名度不相称地扮演着“造王者”角色。出身阿拉戈阿斯蔗糖庄园世家，入读军事学校后在军中逐步崭露头角。1922年科帕卡巴纳要塞起义时，他以效忠立场协助维护政府权威；1930年革命中，他接受瓦加斯的邀约，担任革命武装的军事总指挥，率南部革命部队向里约热内卢推进，奠定了他在新政权中的核心地位。革命胜利后进入“黑色内阁”，与瓦加斯几乎每日会面，参与最初的权力布局。1932年指挥平息圣保罗立宪革命；1934年出任陆军部长（任至1935年），任内制定了国家安全学说的初稿，深刻影响了日后的镇压框架。1937年9月，他“发现”实为伪造的“科恩计划”，该计划被瓦加斯用作政变的舆论依据，建立新国家独裁。他本人亦曾有竞选总统之志但始终未能实现。1945年重返陆军部长职位，并于同年10月底联合军方将领主导了迫使瓦加斯下台的行动。战后当选阿拉戈阿斯参议员（1947年），1951至1952年出任三军联合参谋长，其后转任最高军事法庭直至辞世。"
 BRA_gustavo_barroso_desc:0 "古斯塔沃·阿道尔福·路易斯·多特·达·库尼亚·巴罗佐，1888年12月29日生于塞阿拉州福塔莱萨，1959年12月3日卒于里约热内卢，巴西作家、历史学家、法学家与政治家，兼为国家历史博物馆首任馆长、巴西文学院成员，以及巴西统合主义行动中最极端的反犹主义理论家，被历史学界普遍认定为20世纪巴西最具代表性的反犹知识人物。他早年在塞阿拉从政，担任州内政与司法秘书长、联邦众议员，并参加了1919年巴黎和会的巴西代表团。同时以“若昂·杜诺尔特”为笔名从事民俗研究写作，积累了相当文化声誉。1933年，他加入普利尼奥·萨尔加多创立的巴西统合主义行动，迅速成为其主义理论核心人物之一，并出任AIB民兵司令（1934—1936年），在AIB最高委员会留有席位。他将西班牙文版《锡安长老会议纪要》译成葡萄牙语，还著有多部公开宣扬反犹阴谋论的政治著作；尽管统合主义在官方上声称反对种族主义，他与萨尔加多在此议题上的深刻分歧多次造成运动内部裂痕。1938年“睡衣政变”失败后遭逮捕，但因证据不足获释，随即退出政治活动。晚年在瓦加斯第二届政府任驻乌拉圭（1952年）与驻秘鲁（1954年）特使。"
 BRA_henrique_aristides_guilhem_desc:0 "恩里克·阿里斯蒂德斯·吉扬，1875年生于里约热内卢，1949年1月3日卒于同地，巴西海军上将，曾长期担任巴西海军总参谋长与海军部长，是瓦加斯时代巴西海军建设最重要的主导者之一。他于1891年加入海军学校，历经数十年稳步晋升，于1934年晋升为海军中将。此后出任海军总参谋长，进而于1935年担任海军部长，任职长达十年，直至1945年瓦加斯下台。在他主管海军期间，巴西推进了重要的舰队建设：建造了卡里奥卡级布雷舰、马尔西利奥·迪亚斯级与亚马孙级驱逐舰，并完成了米纳斯吉拉斯号战列舰与胡迈塔号潜艇的现代化改造；他同时着力发展海军航空，沿海岸线铺设陆地机场、延伸海军航空邮政线路，为巴西海军在第二次世界大战期间参与南大西洋护航任务奠定了物质基础。"
 BRA_henrique_teixeira_lott_desc:0 "恩里克·巴蒂斯塔·杜夫勒斯·特谢拉·洛特（1894年—1984年）是巴西陆军元帅、政治人物，生于米纳斯吉拉斯州安东尼奥·卡洛斯。1911年入伍，1916年获军官委任，后在巴西陆军中长期任职。1920至1930年代，他经历“中尉运动”、1930年革命、1932年立宪革命、1935年共产主义起义和1938年统合主义未遂政变等政治军事动荡，始终以纪律和服从合法政府著称。第二次世界大战期间，洛特任巴西远征军后方最高协调代表。1954年后出任陆军部长，并在1955年为确保当选总统库比契克就职而发动“预防性政变”。1960年竞选总统失败，1964年军事政变后因反对推翻合法政府而逐渐退出政坛。"
 BRA_henry_ford_desc:0 "亨利·福特（1863年—1947年）是美国汽车工业家、福特汽车公司创办人，以流水线生产和T型车闻名。在巴西语境中，他最重要的历史关联是1920年代在亚马孙地区建立的福特兰迪亚项目。福特希望通过在帕拉州塔帕若斯河流域建设橡胶种植园和美国式工业城，为汽车工业取得稳定橡胶供应，并摆脱亚洲橡胶市场的制约。然而项目缺乏对热带农业、地方社会和工人生活方式的充分理解，种植园遭病虫害破坏，管理制度又引发严重不满。1945年，福特公司将项目资产售回巴西政府，福特兰迪亚项目结束。"
 BRA_ismael_da_motta_paes_desc:0 "伊斯梅尔·达·莫塔·帕埃斯，1920年6月30日生于米纳斯吉拉斯州贝洛奥里藏特，1997年2月21日卒于里约热内卢，巴西空军飞行员，巴西远征军第一战斗机大队“黄色中队”成员，是巴西参加二战意大利战场的战斗机飞行员之一。1939年入雷亚伦戈军事学校。他以呼号B6驾驶P-47执行了24次战斗任务，首次在1944年11月11日；1944年12月23日执行第24次任务、于意大利布伦纳山口低空轰炸敌方铁路线时座机被高射炮击落，跳伞后被俘，是该大队第一位被俘、最后一位获释的飞行员，在东普鲁士第一号空军战俘营度过近五个月，1945年6月7日返抵比萨，并于同月赴美接飞新P-47D运回巴西，因作战英勇获美军多枚航空奖章。战后他继续在巴西空军服役，历任飞行教官与多个航空区指挥职务，1959至1961年任第一战斗机航空大队大队长，1980年以空军少将军衔转入预备役；退役前受邀单飞幻影式战斗机，成为唯一驾驶单座幻影的巴西将官。"
 BRA_ismael_motta_paes_desc:0 "伊斯梅尔·达·莫塔·帕埃斯，1920年6月30日生于米纳斯吉拉斯州贝洛奥里藏特，1997年2月21日卒于里约热内卢，巴西空军飞行员，巴西远征军第一战斗机大队“黄色中队”成员，是巴西参加二战意大利战场的战斗机飞行员之一。1939年入雷亚伦戈军事学校。他以呼号B6驾驶P-47执行了24次战斗任务，首次在1944年11月11日；1944年12月23日执行第24次任务、于意大利布伦纳山口低空轰炸敌方铁路线时座机被高射炮击落，跳伞后被俘，是该大队第一位被俘、最后一位获释的飞行员，在东普鲁士第一号空军战俘营度过近五个月，1945年6月7日返抵比萨，并于同月赴美接飞新P-47D运回巴西，因作战英勇获美军多枚航空奖章。战后他继续在巴西空军服役，历任飞行教官与多个航空区指挥职务，1959至1961年任第一战斗机航空大队大队长，1980年以空军少将军衔转入预备役；退役前受邀单飞幻影式战斗机，成为唯一驾驶单座幻影的巴西将官。"
 BRA_joao_marques_de_reis_desc:0 "若昂·马克斯·多斯·雷斯，1890年6月23日生于巴伊亚州萨尔瓦多，1950年4月15日卒，巴西律师、大学教授与政治家，瓦加斯时代的重要行政与财经官员。他是医生兼拉丁文教授若泽·马克斯·多斯·雷斯之子，就读于巴伊亚法学院（今巴伊亚联邦大学前身），并任毕业班致辞代表。1930年革命后当选联邦制宪议员，代表巴伊亚州；1934年，在瓦加斯提议延长制宪议员任期、将制宪会议改组为普通国会时，他是二十名投票反对该动议的议员之一，与圣保罗、伯南布哥、巴伊亚各州代表团一同表达异议。此后他出任瓦加斯政府交通公共工程部长（1934—1937年），并担任巴西银行行长，是这一时期国家基础设施与金融体系运作的核心官员之一。1950年代在巴西咖啡种植北扩地带，帕拉纳州诺尔特皮奥内罗地区以其姓氏命名的“马克斯·多斯·雷斯”镇即为对他的纪念。"
 BRA_joao_marques_reis_desc:0 "若昂·马克斯·多斯·雷斯，1890年6月23日生于巴伊亚州萨尔瓦多，1950年4月15日卒，巴西律师、大学教授与政治家，瓦加斯时代的重要行政与财经官员。他是医生兼拉丁文教授若泽·马克斯·多斯·雷斯之子，就读于巴伊亚法学院（今巴伊亚联邦大学前身），并任毕业班致辞代表。1930年革命后当选联邦制宪议员，代表巴伊亚州；1934年，在瓦加斯提议延长制宪议员任期、将制宪会议改组为普通国会时，他是二十名投票反对该动议的议员之一，与圣保罗、伯南布哥、巴伊亚各州代表团一同表达异议。此后他出任瓦加斯政府交通公共工程部长（1934—1937年），并担任巴西银行行长，是这一时期国家基础设施与金融体系运作的核心官员之一。1950年代在巴西咖啡种植北扩地带，帕拉纳州诺尔特皮奥内罗地区以其姓氏命名的“马克斯·多斯·雷斯”镇即为对他的纪念。"
 BRA_joao_neves_da_fortuna_desc:0 "若昂·内维斯·达·丰托拉，1887年11月16日生于南里奥格兰德州卡舒埃拉-杜苏尔，1963年3月31日卒于里约热内卢，巴西律师、外交家、记者、政治家与文人，1930年自由联盟运动的核心策士之一，两度出任外交部长。毕业于阿雷格里港法学院（1909年），早年在故乡从政，历任州议员与南里奥格兰德州副州长。1929年，作为南里奥格兰德州代表，他与米纳斯的弗朗西斯科·坎波斯共同签订“米纳斯-南大河公约”（格洛丽亚旅馆协定），直接促成自由联盟的组建，为1930年革命奠定政治基础。他参加了1930年革命，但因与瓦加斯政见龃龉而疏离，转而声援1932年圣保罗立宪革命，失败后流亡布宜诺斯艾利斯约两年。归国后重返政坛，1943至1945年任驻葡萄牙大使，历经新国家末期。战后加入社会民主党，先后在杜特拉政府（1946年）与瓦加斯第二任期（1951—1953年）两度执掌伊塔马拉蒂宫，主张对美靠拢，曾率团出席巴黎和会（1946年）与波哥大泛美会议（1948年）。他亦是巴西文学院院士。"
 BRA_joao_neves_fontoura_desc:0 "若昂·内维斯·达·丰托拉，1887年11月16日生于南里奥格兰德州卡舒埃拉-杜苏尔，1963年3月31日卒于里约热内卢，巴西律师、外交家、记者、政治家与文人，1930年自由联盟运动的核心策士之一，两度出任外交部长。毕业于阿雷格里港法学院（1909年），早年在故乡从政，历任州议员与南里奥格兰德州副州长。1929年，作为南里奥格兰德州代表，他与米纳斯的弗朗西斯科·坎波斯共同签订“米纳斯-南大河公约”（格洛丽亚旅馆协定），直接促成自由联盟的组建，为1930年革命奠定政治基础。他参加了1930年革命，但因与瓦加斯政见龃龉而疏离，转而声援1932年圣保罗立宪革命，失败后流亡布宜诺斯艾利斯约两年。归国后重返政坛，1943至1945年任驻葡萄牙大使，历经新国家末期。战后加入社会民主党，先后在杜特拉政府（1946年）与瓦加斯第二任期（1951—1953年）两度执掌伊塔马拉蒂宫，主张对美靠拢，曾率团出席巴黎和会（1946年）与波哥大泛美会议（1948年）。他亦是巴西文学院院士。"
 BRA_jorge_dodsworth_martins_desc:0 "若热·多兹沃斯·马丁斯，1884年2月19日生于米纳斯吉拉斯州蓬蒂诺瓦，1974年2月18日卒于里约热内卢，巴西海军上将，1945至1946年间任海军部长。他1900年入海军学校，1903年毕业，早年曾任海军部长亚历山德里诺·德·阿伦卡尔的副官，并先后在总统尼洛·佩萨尼亚与文塞斯劳·布拉斯身边任侍从武官。他历任多艘军舰指挥官，先后统带驱逐舰“巴拉纳号”“皮奥伊号”“阿拉戈阿斯号”、河川炮舰“阿克里号”与浅水重炮舰“伯南布哥号”等，并曾任巡洋舰“巴伊亚号”副长；第二次世界大战期间出任巡洋舰编队司令。1941年晋准将，1945年晋中将。1945年10月瓦加斯被军方逼宫下台后，代总统若泽·利尼亚雷斯于10月30日任命他为海军部长，杜特拉就任后予以留任，直至1946年10月由西尔维奥·德·诺罗尼亚（#63）接任——他与#61吉洛贝尔、#63诺罗尼亚构成这一时期前后相继的三位海军部长。任内他创设海军后备勤务、通信局与水文航行局，重组海军军区，并设立常设性的宗教服务勤务。他自母系出身英裔多兹沃斯望族，为1937至1945年联邦区（里约）市长恩里克·多兹沃斯之堂亲。1950年转入预备役，晚年曾任巴西童子军联盟主席（1959—1962年）与巴西地理学会会长。"
 BRA_jorge_martins_desc:0 "若热·多兹沃斯·马丁斯，1884年2月19日生于米纳斯吉拉斯州蓬蒂诺瓦，1974年2月18日卒于里约热内卢，巴西海军上将，1945至1946年间任海军部长。他1900年入海军学校，1903年毕业，早年曾任海军部长亚历山德里诺·德·阿伦卡尔的副官，并先后在总统尼洛·佩萨尼亚与文塞斯劳·布拉斯身边任侍从武官。他历任多艘军舰指挥官，先后统带驱逐舰“巴拉纳号”“皮奥伊号”“阿拉戈阿斯号”、河川炮舰“阿克里号”与浅水重炮舰“伯南布哥号”等，并曾任巡洋舰“巴伊亚号”副长；第二次世界大战期间出任巡洋舰编队司令。1941年晋准将，1945年晋中将。1945年10月瓦加斯被军方逼宫下台后，代总统若泽·利尼亚雷斯于10月30日任命他为海军部长，杜特拉就任后予以留任，直至1946年10月由西尔维奥·德·诺罗尼亚（#63）接任——他与#61吉洛贝尔、#63诺罗尼亚构成这一时期前后相继的三位海军部长。任内他创设海军后备勤务、通信局与水文航行局，重组海军军区，并设立常设性的宗教服务勤务。他自母系出身英裔多兹沃斯望族，为1937至1945年联邦区（里约）市长恩里克·多兹沃斯之堂亲。1950年转入预备役，晚年曾任巴西童子军联盟主席（1959—1962年）与巴西地理学会会长。"
 BRA_jose_americo_almeida_desc:0 "若泽·阿梅里科·德·阿尔梅达，1887年1月10日生于帕拉伊巴州阿雷亚，1980年3月10日卒于若昂佩索阿，巴西作家、政治家、律师，巴西东北地域主义小说的开创者，同时是1930年代政坛的重要人物。他以1928年的长篇小说《甘蔗渣》奠定文学声名，该书被视为现代地域主义小说的里程碑。毕业于累西腓法学院（1908年），历任检察官、帕拉伊巴州总检察长，并在州长若昂·佩索阿麾下任公共安全书记。1930年他领导了北方与东北地区的革命行动，胜利后出任临时政府交通公共工程部长。1937年他被推为政府支持的总统候选人，与阿曼多·萨莱斯及统合主义领袖萨尔加多形成三方角逐，但同年11月瓦加斯发动“新国家”政变、取消大选，竞选戛然而止。1945年2月，他接受《晨邮报》记者卡洛斯·拉塞达的著名采访、公开批评独裁并呼吁重开选举，成为新国家政权走向瓦解的象征性标志之一。此后他当选参议员，参与创建民主联盟，后另组解放党并当选帕拉伊巴州长（1950年），任内创办帕拉伊巴联邦大学；1951年重任交通部长直至1954年瓦加斯自杀。晚年隐居坦鲍海滩，人称“坦鲍隐士”，1966年入选巴西文学院。"
 BRA_jose_americo_de_almeida_desc:0 "若泽·阿梅里科·德·阿尔梅达，1887年1月10日生于帕拉伊巴州阿雷亚，1980年3月10日卒于若昂佩索阿，巴西作家、政治家、律师，巴西东北地域主义小说的开创者，同时是1930年代政坛的重要人物。他以1928年的长篇小说《甘蔗渣》奠定文学声名，该书被视为现代地域主义小说的里程碑。毕业于累西腓法学院（1908年），历任检察官、帕拉伊巴州总检察长，并在州长若昂·佩索阿麾下任公共安全书记。1930年他领导了北方与东北地区的革命行动，胜利后出任临时政府交通公共工程部长。1937年他被推为政府支持的总统候选人，与阿曼多·萨莱斯及统合主义领袖萨尔加多形成三方角逐，但同年11月瓦加斯发动“新国家”政变、取消大选，竞选戛然而止。1945年2月，他接受《晨邮报》记者卡洛斯·拉塞达的著名采访、公开批评独裁并呼吁重开选举，成为新国家政权走向瓦解的象征性标志之一。此后他当选参议员，参与创建民主联盟，后另组解放党并当选帕拉伊巴州长（1950年），任内创办帕拉伊巴联邦大学；1951年重任交通部长直至1954年瓦加斯自杀。晚年隐居坦鲍海滩，人称“坦鲍隐士”，1966年入选巴西文学院。"
 BRA_jose_linhares_desc:0 "若泽·利尼亚雷斯，1886年1月28日生于塞阿拉州巴图里泰的西尼姆布庄园，1957年1月26日卒于米纳斯吉拉斯州卡尚布，巴西法学家，首位出任国家元首的塞阿拉人，以在新国家独裁末期主持还政于民、重建司法独立而留名。他就读于累西腓法学院，1908年获法学学位，此后长期从事司法工作，历任地区法官、上诉法院法官等职。1930年革命后升任联邦区上诉法院法官，1937年经瓦加斯任命为联邦最高法院大法官，1940年出任该院副院长，1945年升任院长，并因此兼掌高等选举法院，主持编订战后新选举法。1945年10月，瓦加斯被军方逼宫下台，因新国家时期既无副总统、国会亦已关闭多年，身为司法首长的利尼亚雷斯依继任顺序于10月30日出任临时总统，任期至1946年1月31日，仅约九十三日。其短暂任内致力于拆解新国家的威权架构：废除国家安全法庭，以司法人员替换各州干预长，赋予新国会制宪权，取消紧急状态，筹备并如期举行大选，最终将权力移交给民选总统欧里科·加斯帕尔·杜特拉。卸任后重返最高法院，两度出任院长直至1956年因年龄退休。"
 BRA_jose_pessoa_cavalcanti_de_albuquerque_desc:0 "若泽·佩索阿·卡瓦尔坎蒂·德·阿尔布克尔克，1885年9月12日生于帕拉伊巴州卡巴塞拉斯，1959年8月16日卒于里约热内卢，巴西陆军元帅，巴西装甲兵的先驱与“黑针军校”的倡建者。他是前总统埃皮塔西奥·佩索阿之侄，也是帕拉伊巴州州长若昂·佩索阿之弟——后者1930年遇刺直接引爆1930年革命。1903年入伍，后毕业于阿雷格里港军校。一战期间他随“阿谢使团”赴欧学习法军军事学说，在西线一个龙骑兵中队亲历实战、习得新生的坦克战术；归国后大力倡导陆军采用装甲兵，1921年参与组建巴西陆军首支坦克部队，成为该兵种开创者与主保人。1930年11月至1934年8月任雷亚伦戈军事学校校长，锐意革新军官培养，并构想以之取而代之的黑针军校（亚古拉斯内格拉斯军事学院，1944年建成），创制卡希亚斯佩剑、重塑陆军象征。1933年晋升准将。1944至1946年任军人俱乐部主席，1945年10月发表声明反对瓦加斯续任、推动其下台。1953年晋升元帅；1954年主持“新首都选址委员会”（1954—1956年），为日后巴西利亚选址奠定基础。"
 BRA_jose_pessoa_desc:0 "若泽·佩索阿·卡瓦尔坎蒂·德·阿尔布克尔克，1885年9月12日生于帕拉伊巴州卡巴塞拉斯，1959年8月16日卒于里约热内卢，巴西陆军元帅，巴西装甲兵的先驱与“黑针军校”的倡建者。他是前总统埃皮塔西奥·佩索阿之侄，也是帕拉伊巴州州长若昂·佩索阿之弟——后者1930年遇刺直接引爆1930年革命。1903年入伍，后毕业于阿雷格里港军校。一战期间他随“阿谢使团”赴欧学习法军军事学说，在西线一个龙骑兵中队亲历实战、习得新生的坦克战术；归国后大力倡导陆军采用装甲兵，1921年参与组建巴西陆军首支坦克部队，成为该兵种开创者与主保人。1930年11月至1934年8月任雷亚伦戈军事学校校长，锐意革新军官培养，并构想以之取而代之的黑针军校（亚古拉斯内格拉斯军事学院，1944年建成），创制卡希亚斯佩剑、重塑陆军象征。1933年晋升准将。1944至1946年任军人俱乐部主席，1945年10月发表声明反对瓦加斯续任、推动其下台。1953年晋升元帅；1954年主持“新首都选址委员会”（1954—1956年），为日后巴西利亚选址奠定基础。"
 BRA_lampiao_desc:0 "兰皮昂，本名维尔古利诺·费雷拉·达席尔瓦（1897年—1938年），是巴西东北部“坎加索”匪帮运动最著名的首领之一。出身伯南布哥内陆的他在1920年代至1930年代率领武装团伙活动于东北腹地，袭击城镇、绑架勒索，并多次与警察和地方武装交战。1938年，兰皮昂及其伴侣玛丽亚·博尼塔等人在塞尔希培州安吉科斯遭伏击身亡。巴西东北民间文化对他的评价长期分裂：他既被记录为暴力匪首，也被一些民间叙事塑造成反抗地方豪强和贫困秩序的传奇人物。"
 BRA_leoncio_basbaum_desc:0 "莱昂西奥·巴斯鲍姆，1907年11月6日生于伯南布哥州累西腓，1969年3月7日卒，巴西马克思主义历史学家、医生与左翼活动家，20世纪上半叶巴西共产主义知识运动最重要的参与者之一。他是来自比萨拉比亚（今摩尔多瓦与乌克兰边境地区，彼时属俄罗斯帝国）的犹太移民家庭的第六个孩子，父母在累西腓经营金匠工坊。1924年他移居里约热内卢就读医学院，1929年完成医学学位，此后便将医学事业与政治活动并行推进。早在学生时代，他即通过工会圈子接触到共产主义，并在共产主义者克里斯蒂亚诺·科尔代罗的引导下于1925年正式投身左翼运动。1927年他成为巴西共产主义青年团的主要创建者之一并出任首届秘书长，同年在党报组织中发挥积极作用，期间还曾接触普列斯特斯并参与协调工作。1931年定居圣保罗后，他在1932年革命中以政治犯身份遭拘押，此后辗转于地下政治活动与学术写作之间；1935年共产主义起义后再遭迫害。他的主要历史著作《巴西史》以马克思主义框架重构巴西历史，是巴西左翼史学的奠基文献之一；回忆录《六个时期的一生》则是重要的历史见证。1969年3月7日，他因中风辞世。"
 BRA_lindolfo_collor_desc:0 "林道夫·莱奥波尔德·博克尔·科洛尔，1890年2月4日生于南里奥格兰德州，1942年9月21日卒，巴西记者与政治家，瓦加斯临时政府首任劳工、工业与商业部长，德裔巴西人，其孙即巴西第32任总统费尔南多·科洛尔·德梅洛。他1909年取得药学学位，但随即转向新闻与文学，其后加入南里奥格兰德州政治圈。1919年开始在政党报纸主持工作，1925年进入联邦议会。1930年10月革命中，他积极投身推翻旧共和国的行动；革命成功后，他被瓦加斯任命出任新创设的劳工部，是推动早期劳工立法、建立工会合法化框架的核心人物，确立了国家对劳工关系实施监管与介入的制度基础。然而1932年，他因抗议瓦加斯推迟还政于民、继续维持威权统治而愤然辞职，此后转为坚定的反瓦加斯政治人物，直至1942年辞世。他所在的科洛尔家族政治遗产后来由其外孙费尔南多·科洛尔·德梅洛（1990—1992年任总统，后因腐败案被弹劾）延续，使“科洛尔”之名在战后巴西政治史上以另一种形式再度显名。"
 BRA_luis_carlos_prestes_desc:0 "路易斯·卡洛斯·普列斯特斯，1898年1月3日生于南里奥格兰德州阿雷格里港，1990年3月7日卒于里约热内卢，享年92岁，巴西军人与革命家，20世纪巴西左翼运动最具传奇色彩的核心人物，以“希望骑士”之名铭刻史册。他出身军人世家，毕业于工程专业，在1920年代中尉运动中声名渐起；1924年，他率部脱离政府军加入叛乱，随后与圣保罗叛军合并，在总司令米格尔·科斯塔麾下担任参谋长，带领数百名叛军战士自1924年12月起历时两年余、纵横13个州、行程约2.5万公里，史称“普列斯特斯纵队”。这支纵队虽始终未能发起广泛民众起义，却将1920年代巴西军政矛盾的内在张力呈现于全国视野，普列斯特斯本人也由此成为下层民众心中的传奇英雄。1927年纵队流亡玻利维亚后，他接触到马克思主义，并于1930年拒绝加入瓦加斯革命——他认为那不过是一场资产阶级政变。1931年他前往苏联，正式加入巴西共产党并进入共产国际执行委员会。1935年回国后出任全国解放联盟名誉主席，同年11月共产主义起义失败后于次年3月被捕，与德国犹太共产党员妻子奥尔加·贝纳里奥同遭逮捕——奥尔加随即被驱逐回纳粹德国，后死于集中营。普列斯特斯在狱中被判处16年（后加至46年），直至1945年4月获释；在狱中他已被选为PCB总书记（1943年），此后长期执掌这一职务直至1980年。获释后他短暂支持瓦加斯，又于1946年当选联邦区参议员，其后数十年在合法、半地下与流亡状态间多次切换，始终是巴西左翼的标志性人物，直至1980年被撤除总书记职务、1984年被开除党籍，晚年支持莱昂内尔·布里佐拉的竞选活动。"
 BRA_mascarenhas_de_morais_desc:0 "若昂·巴蒂斯塔·马斯卡雷尼亚斯·德·莫赖斯，1883年11月13日生于南里奥格兰德州圣加布里埃尔，1968年9月17日卒于里约热内卢，巴西陆军元帅，第二次世界大战期间巴西远征军总司令，是战后巴西军事史上最受尊崇的人物之一，亦是巴西出任役现役的最后一位元帅。他在1920年代多次政治动荡中坚守效忠既有合宪政府的立场：1922年率部对抗科帕卡巴纳要塞起义的叛乱者，1930年革命中拒绝倒向瓦加斯阵营并遭到逮捕，1932年又声援圣保罗立宪革命再度被押——这种罕见的两度被捕经历使他在政治上的超然立场颇具说服力。1935年共产主义起义爆发时，他时任雷亚伦戈军事学校校长，以坚定效忠立场参与镇压。1943年12月，他被任命为第一远征步兵师司令，随即主持组建、训练与装备工作，并率第一梯队于1944年7月2日赴那不勒斯参战，编入美国第5集团军作战序列。在意大利战场，FEB参与了哥特防线的艰苦拉锯，经四次不成功的攻击后终于在1945年2月21日夺取蒙特卡斯特洛阵地，而后在4月的最终攻势中以博洛尼亚战役奠定胜局。1945年4月29至30日，他亲自接受德国第148师及意大利蒙特罗萨、圣马科、意大利三个师的投降，一周内共俘获1.47万名敌军（含2名将领、800名军官）。1946年，巴西国会以立法方式将其晋升为元帅，此后他出任第一军区司令，1951至1954年任联合参谋长，于瓦加斯1954年自杀前后方才告老还乡，留下回忆录传世。"
 BRA_mascarenhas_morais_desc:0 "若昂·巴蒂斯塔·马斯卡雷尼亚斯·德·莫赖斯，1883年11月13日生于南里奥格兰德州圣加布里埃尔，1968年9月17日卒于里约热内卢，巴西陆军元帅，第二次世界大战期间巴西远征军总司令，是战后巴西军事史上最受尊崇的人物之一，亦是巴西出任役现役的最后一位元帅。他在1920年代多次政治动荡中坚守效忠既有合宪政府的立场：1922年率部对抗科帕卡巴纳要塞起义的叛乱者，1930年革命中拒绝倒向瓦加斯阵营并遭到逮捕，1932年又声援圣保罗立宪革命再度被押——这种罕见的两度被捕经历使他在政治上的超然立场颇具说服力。1935年共产主义起义爆发时，他时任雷亚伦戈军事学校校长，以坚定效忠立场参与镇压。1943年12月，他被任命为第一远征步兵师司令，随即主持组建、训练与装备工作，并率第一梯队于1944年7月2日赴那不勒斯参战，编入美国第5集团军作战序列。在意大利战场，FEB参与了哥特防线的艰苦拉锯，经四次不成功的攻击后终于在1945年2月21日夺取蒙特卡斯特洛阵地，而后在4月的最终攻势中以博洛尼亚战役奠定胜局。1945年4月29至30日，他亲自接受德国第148师及意大利蒙特罗萨、圣马科、意大利三个师的投降，一周内共俘获1.47万名敌军（含2名将领、800名军官）。1946年，巴西国会以立法方式将其晋升为元帅，此后他出任第一军区司令，1951至1954年任联合参谋长，于瓦加斯1954年自杀前后方才告老还乡，留下回忆录传世。"
 BRA_miguel_reale_desc:0 "米格尔·雷亚莱，1910年11月6日生于圣保罗州圣本托·杜萨普卡亚，2006年4月14日卒于圣保罗，巴西法学家、哲学家、学者、政治家与诗人，被誉为20世纪最重要的巴西法学家之一，以其“法律三维理论”——将社会事实、伦理价值与法律规范视为法律三位一体的有机统一——奠定了在拉丁美洲与欧陆法哲学界的重要地位。他1934年毕业于圣保罗大学法学院，同期积极参与巴西统合主义行动，出任AIB全国教义秘书长，是继普利尼奥·萨尔加多与古斯塔沃·巴罗佐之后的第三位核心理论人物，为统合主义的法律与政治哲学框架提供了系统论证。1938年统合主义政变失败后，他逐渐与这一运动剥离，将精力转向纯粹学术。1941年他通过竞争性考试赢得圣保罗大学法律哲学正教席，同年出版奠基性著作《法律的基础》，确立了三维理论的雏形；此后历任圣保罗州司法秘书（1947年）、圣保罗大学校长（1949—1950年及1969—1973年），1949年创建巴西哲学研究所并主持七届全国哲学大会。2002年，他作为主要起草者之一，主持完成了《巴西民法典》的全面现代化修订，该法典至今仍是巴西民法的基本法律框架，他也因此获得“现行民法典首席缔造者”的历史评价。晚年，他于1975年当选巴西文学院院士。"
 BRA_milton_de_freitas_desc:0 "米尔顿·德·弗雷塔斯·阿尔梅达，1888年1月3日生于南里奥格兰德州阿雷格里港，1962年11月29日卒于里约热内卢，巴西陆军元帅，以1932年圣保罗立宪革命中指挥政府军南部战区而留名史册。他1904年入伍，1908年以骑兵少尉身份出道，历经多次按资历与功绩的晋升。1932年，当圣保罗以“立宪革命”为名武装反抗瓦加斯时，他出任政府军南部战区总司令，统筹该方向的围剿行动。9月30日，当前任司令被调往新职时，他正式接管南部总指挥权；然而就在战事即将结束的最后阶段，他遭到麾下一批哗变士兵的枪击，身受重伤——这一戏剧性结局是圣保罗战役尾声最为人所称道的事件之一。"
 BRA_minervino_de_oliveira_desc:0 "米内尔维诺·德·奥利韦拉（1891年—1977年）是巴西工人运动活动家、共产党政治人物，生于里约热内卢。少年时代即进入工厂劳动，后成为石匠和工会组织者，参与里约工人运动。1920年代，他加入巴西共产党，并以工人农民集团名义在1928年当选当时联邦区的市政代表。1929年至1930年间，他被共产党阵营推为总统候选人，虽得票有限，却使工人、黑人和共产主义政治诉求进入全国选举舞台。1977年在里约热内卢逝世。"
 BRA_minervino_oliveira_desc:0 "米内尔维诺·德·奥利韦拉（1891年—1977年）是巴西工人运动活动家、共产党政治人物，生于里约热内卢。少年时代即进入工厂劳动，后成为石匠和工会组织者，参与里约工人运动。1920年代，他加入巴西共产党，并以工人农民集团名义在1928年当选当时联邦区的市政代表。1929年至1930年间，他被共产党阵营推为总统候选人，虽得票有限，却使工人、黑人和共产主义政治诉求进入全国选举舞台。1977年在里约热内卢逝世。"
 BRA_moreira_lima_desc:0 "洛伦索·莫雷拉·利马，绰号“凶猛律师”，1881年2月22日生于伯南布哥州伊坦贝，1940年9月5日卒于圣保罗，巴西律师与革命活动家，以随军普列斯特斯纵队全程记录并留存珍贵历史档案而成为巴西军事史学中不可替代的史料守护者。他毕业于福塔莱萨法学院，在阿克里州从事律师工作达十年，1920年移居里约热内卢后接触中尉运动，1925年加入正在形成中的普列斯特斯—科斯塔纵队，担任纵队秘书长兼第4分队指挥官（后代为指挥）；同时主编纵队革命报纸《战斗》，以纵队随军书记身份逐日记录部队的行军路线、战斗经过与内部决策，是这场历史壮举最重要的第一手见证人。1927年纵队流亡玻利维亚后，他回到巴西，参与了1930年十月革命。1935年共产主义起义发生后，他以涉嫌参与共谋之名被解除在劳工部的职务并遭逮捕；在此期间，小说家格拉西利亚诺·拉莫斯在狱中与他相识，后在回忆录中留下了对他高度评价的文字。获释后他隐匿于圣保罗，于1940年辞世。他所著的《普列斯特斯纵队：行军与战斗》至今仍是研究这段历史最权威、最翔实的一手文献。"
 BRA_nero_moura_desc:0 "内罗·莫拉，1910年1月30日生于南里奥格兰德州卡舒埃拉-杜苏尔，1994年12月17日卒于里约热内卢，巴西空军军官，巴西远征军第一战斗机大队首任指挥官，被尊为巴西战斗机航空的主保人。他早年就读阿雷格里港军校，1927年入雷亚伦戈军事学校，后转入阿丰苏斯校场军事航空学校，1930年11月成为军官候补生、次年1月晋少尉，初期在军用航空邮政服役。1932年立宪革命期间，他站在合法政府一方，在帕拉伊巴河谷执行侦察、轰炸与对地攻击任务。1941年晋航空少校，任航空部长副官。1943年12月18日新组建的第一战斗机大队成立，他受命出任首任指挥官，率部随FEB赴意大利参战；该大队近五百人、含五十名飞行员，以战吼“Senta a Púa！”闻名。1944年他先赴美受训，尔后转战意大利战场，全大队在七个多月内执行445次任务、2550架次，他本人亲飞62次战斗任务（1944年11月4日至1945年5月1日），部队因战功获美国“总统集体嘉奖”。1945年10月瓦加斯被推翻时，他因效忠瓦加斯一度被短暂拘押，同年12月以上校衔转入预备役、转投民航企业。1950年瓦加斯当选后邀其出山，1951年1月31日出任航空部长，8月晋空军准将；1954年8月因托内莱罗斯街暗杀案引发的政治危机于16日辞职。逝世后于1995年正式追封为巴西战斗机航空主保人。"
 BRA_newton_cavalcanti_desc:0 "牛顿·德·安德拉德·卡瓦尔坎蒂，1885年10月23日生于阿拉戈阿斯州帕尔梅拉·多斯·因迪奥斯，1965年11月25日卒，巴西陆军将领，在政治立场上是统合主义运动在高级军官圈中最热情、最公开的支持者，其名字与1930年代巴西右翼民族主义运动及1938年睡衣政变深度交织。他1902年入伍，以骑兵军官为基础晋升，参与1930年十月革命（站在革命阵营一侧）；革命胜利后主持联邦军体育训练中心。1935年11月共产主义起义被镇压后，他旋即晋升准将，被认为与共产主义起义的震慑效应直接相关；他在镇压庆典上公开发表反共演说，并成为军官圈内与普利尼奥·萨尔加多关系最密切的高级军官——曾出席AIB“五万绿衫”大阅兵并站在瓦加斯身旁，被记者拍下。他的统合主义倾向一度使其将官晋升遭到陆军部长阻挠，引发广泛关注。1937至1938年间，他是军方力量为数不多的统合主义倾向将领之一；1938年2月1日，他颁布针对共济会的禁止令，进一步彰显其宗教保守主义取向。1938年5月11日统合主义睡衣政变的夜晚，他在政变爆发前夕主动辞去维拉米利塔尔指挥官职务、从政变行动中撤身，事后向瓦加斯致电祝贺政变失败——这一两面性举动令他得以在政治上全身而退。此后他在军队中继续服役，于1949年短暂出任代理陆军部长（杜特拉政府），1965年辞世。"
 BRA_olga_benario_prestes_desc:0 "奥尔加·古特曼·贝纳里奥，1908年2月12日生于德国慕尼黑，1942年4月23日卒于德国伯恩堡，德国犹太裔共产主义女战士，因遭瓦加斯政府驱逐返回纳粹德国并死于集中营，其命运成为二十世纪最震撼人心的政治悲剧之一，亦是巴西共和国史上侵犯人权最为典型的案例。她出身慕尼黑上流犹太律师家庭，15岁即加入共产主义青年国际（1923年）；18岁时因参与反法西斯活动遭警方登记追踪；1928年策划并执行了其同志奥托·布劳恩从柏林莫阿比特监狱的武装越狱行动，事后与布劳恩流亡苏联，先后就读于列宁学校和茹科夫斯基军事学院，历任共产主义青年国际教官。1934年，共产国际任命她以贴身护卫身份护送普列斯特斯秘密潜返巴西；二人在漫长的流亡与潜行途中相爱，以假身份辗转抵达巴西，在里约热内卢共同筹备起义。1935年11月共产主义起义失败后，两人于1936年3月同遭逮捕；而她怀有普列斯特斯的骨肉、腹中胎儿已近七个月——这一事实并未能阻止瓦加斯政府与盖世太保协作将她驱逐出境。1936年9月，她以“危害公共秩序的有害外侨”为由被押上轮船，历经险阻返回柏林，11月27日在巴尼姆大街女子监狱中产下女儿阿妮塔·莱奥卡迪亚，孩子在14个月后由普列斯特斯的母亲接走抚养。她先后被关押于利希滕贝格（1938年）与拉文斯布吕克（1939年）集中营，在狱中坚持组织秘密活动，出版手写报刊，帮助病弱狱友获取额外食物，并秘密绘制了一份供囚犯使用的地图——今日保存于拉文斯布吕克纪念馆。1942年4月23日，她被送至伯恩堡安乐死中心的毒气室中处死，年仅34岁，身后以临终遗书向丈夫和女儿表达了最后的爱与信念。2004年由热米·蒙迦尔丹执导的同名巴西电影《奥尔加》使她的故事广为人知。"
 BRA_olimpio_falconiere_cunha_desc:0 "奥林匹奥·法尔科涅雷·达·库尼亚（1891年—1967年）是巴西陆军将领，后晋为元帅，生于圣卡塔琳娜州伊塔雅伊。1912年入读里约热内卢雷阿伦戈军事学校，后参与1922年和1924年的军人运动以及1930年革命。第二次世界大战期间，他在巴西远征军中担任高级指挥职务，参加意大利战役。战后，法尔科涅雷继续在陆军高层任职，曾指挥中央军区和第二军，1956年至1961年任最高军事法院部长。1967年在里约热内卢逝世。"
 BRA_oliveira_viana_desc:0 "弗朗西斯科·若泽·德·奥利韦拉·比亚纳，1883年6月20日生于里约热内卢州萨卡雷马，1951年3月28日卒，巴西法学家、历史学家与社会学家，瓦加斯时代最具影响力的保守主义政治思想家，以其对威权民族主义与统合主义的系统性论述，为新国家的劳工立法与国家干预主义提供了重要的理论基础，深刻塑造了20世纪上半叶巴西的政治法律话语。他毕业于里约热内卢自由法学院（今联邦大学法学院，1906年），长期从事学术研究与法律实践，深受社会学家西尔维奥·罗梅罗与思想家阿尔贝托·托雷斯的影响。他早期的代表作《巴西南部地区的人口》，1920年以种族与地理为框架分析巴西社会结构，虽其中的种族主义论述在后世受到批判，但其对巴西区域性政治权力结构的洞察在当时颇具影响。1930年革命后，他以法律顾问身份进入劳工部（1932—1940年），积极参与统合主义工会制度与劳工法庭的构建，并在此期间出版了《统合法权问题》，1938年，系统论述了国家调节劳资冲突的法律框架。他是威权主义国家概念的坚定倡导者，批判自由主义民主在巴西的适用性，为新国家的独裁措施提供了学理背书；与此同时，他也是反共主义的有力鼓吹者，并对德国“泛日耳曼主义”持批判立场，力图在法理上将巴西威权主义与欧洲种族民族主义区分开来。1937年入选巴西文学院，晚年持续出版法哲学著作至1951年辞世。"
