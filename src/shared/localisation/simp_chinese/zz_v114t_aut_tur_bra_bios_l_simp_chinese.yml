 BRA_olympio_falconiere_da_cunha_desc:0 "奥林匹奥·法尔科涅雷·达·库尼亚（1891年—1967年）是巴西陆军将领，后晋为元帅，生于圣卡塔琳娜州伊塔雅伊。1912年入读里约热内卢雷阿伦戈军事学校，后参与1922年和1924年的军人运动以及1930年革命。第二次世界大战期间，他在巴西远征军中担任高级指挥职务，参加意大利战役。战后，法尔科涅雷继续在陆军高层任职，曾指挥中央军区和第二军，1956年至1961年任最高军事法院部长。1967年在里约热内卢逝世。"
 BRA_osvaldo_aranha_desc:0 "奥斯瓦尔多·欧克利德斯·德·苏扎·阿拉尼亚，1894年2月15日生于南里奥格兰德州阿莱格雷特，1960年1月27日卒，巴西政治家、外交家与国务活动家，以其在1947年联合国大会任主席期间主持巴勒斯坦分治方案表决、为以色列国的建立铺路而在国际史上留下独特印记。他毕业于里约热内卢法学院（1916年），从政起步于家乡市长（1925年）与南里奥格兰德州立法机构；1930年他是推动瓦加斯接受武装革命路线最关键的说客之一，随后历任瓦加斯政府司法部长、财政部长等要职，1934年出任驻美大使，在这一任上他建立了与美国政界的深厚关系，并逐渐确立对联盟国立场的坚定支持。1938至1944年，他出任巴西外交部长，任内在二战初期将巴西引向亲盟国立场——1942年1月，他在里约热内卢泛美外长会议上宣布巴西与轴心国断交，随后促成巴西对德意宣战并组建远征军。1944年他因抗议瓦加斯压制政治集会而愤然辞职，继而协助创建全国民主联盟。战后出任联合国代表团团长，1947年3月任联合国大会第二届大会主席，在关键的巴勒斯坦分治方案（联大181号决议）表决中，以外交手腕将投票推迟三天，为争取到足够赞成票赢得了宝贵时间，并因此被提名诺贝尔和平奖（1948年）。随后他和解于重返政坛的瓦加斯，于1953年出任财政部长，但在1954年8月瓦加斯自杀后立即辞职告别官场，晚年以“国家元老”身份安享余年至1960年辞世。"
 BRA_pedro_alcantara_desc:0 "阿尔坎塔拉·路易斯·菲利普·玛丽亚·加斯唐·米格尔·加百列·拉斐尔·贡萨加·德·奥尔良-布拉甘萨亲王，巴西格朗帕拉亲王，1875年10月15日生于巴西彼得罗波利斯皇宫，1940年1月29日卒于同地，巴西皇室公主伊莎贝尔与奥尔良-布拉甘萨家族嫡长子，出生时是巴西帝国王位序列中仅次于其母的第二继承人；1889年共和政变后随母流亡欧洲，主要在法国与奥匈帝国度过壮年，并在奥匈军队中服役晋至上尉。1908年，他希望迎娶身为波西米亚贵族但不具王室血统的伊丽莎白·多布日任斯基女伯爵，在母亲坚持婚姻须符合对等原则的条件下，他于10月30日在法国戛纳签署了一份声明，以自己及所有后代的名义放弃对巴西王位的全部继承权——此举确立了后继者的法定序列，也埋下了日后家族分裂的根源，彼得罗波利斯支系（其子女一脉）与瓦索拉斯支系（其弟路易斯一脉）之间长达数十年的法统争议由此肇始。1920年前后他回到巴西，在彼得罗波利斯定居，以冷静超然的姿态融入共和国体制，偶尔参与皇室传统纪念活动。1940年1月29日因心肺骤停辞世，年64岁，获授国家元首级葬礼，外交部长奥斯瓦尔多·阿拉尼亚代表政府出席葬礼，其遗体安葬于彼得罗波利斯帝国圣殿（圣阿尔坎塔拉教堂）的皇族墓穴，与父祖墓冢相邻。（注：其子#56佩德罗·加斯唐日后否认了他1908年放弃声明对后代的效力，延续了保皇派内部的正统争议；其弟路易斯之子#57佩德罗·恩里克则被主流保皇派奉为正统继承人。）。"
 BRA_pedro_de_alcantara_desc:0 "阿尔坎塔拉·路易斯·菲利普·玛丽亚·加斯唐·米格尔·加百列·拉斐尔·贡萨加·德·奥尔良-布拉甘萨亲王，巴西格朗帕拉亲王，1875年10月15日生于巴西彼得罗波利斯皇宫，1940年1月29日卒于同地，巴西皇室公主伊莎贝尔与奥尔良-布拉甘萨家族嫡长子，出生时是巴西帝国王位序列中仅次于其母的第二继承人；1889年共和政变后随母流亡欧洲，主要在法国与奥匈帝国度过壮年，并在奥匈军队中服役晋至上尉。1908年，他希望迎娶身为波西米亚贵族但不具王室血统的伊丽莎白·多布日任斯基女伯爵，在母亲坚持婚姻须符合对等原则的条件下，他于10月30日在法国戛纳签署了一份声明，以自己及所有后代的名义放弃对巴西王位的全部继承权——此举确立了后继者的法定序列，也埋下了日后家族分裂的根源，彼得罗波利斯支系（其子女一脉）与瓦索拉斯支系（其弟路易斯一脉）之间长达数十年的法统争议由此肇始。1920年前后他回到巴西，在彼得罗波利斯定居，以冷静超然的姿态融入共和国体制，偶尔参与皇室传统纪念活动。1940年1月29日因心肺骤停辞世，年64岁，获授国家元首级葬礼，外交部长奥斯瓦尔多·阿拉尼亚代表政府出席葬礼，其遗体安葬于彼得罗波利斯帝国圣殿（圣阿尔坎塔拉教堂）的皇族墓穴，与父祖墓冢相邻。（注：其子#56佩德罗·加斯唐日后否认了他1908年放弃声明对后代的效力，延续了保皇派内部的正统争议；其弟路易斯之子#57佩德罗·恩里克则被主流保皇派奉为正统继承人。）。"
 BRA_pedro_gastao_desc:0 "阿尔坎塔拉·德·奥尔良-布拉甘萨，通称佩德罗·加斯唐，1913年2月19日生于法国厄市，2007年12月27日卒，巴西帝室彼得罗波利斯支系的领袖，以拒绝承认其父（#55佩德罗·德·阿尔坎塔拉）1908年放弃继承权声明的有效性而在保皇派内部引发持续数十年的法统争议。他出生于皇室流亡期间，是1908年婚姻中所生的长子；父亲于1940年辞世后，他随即宣称自己是巴西王位的合法继承人，理由是1824年《巴西帝国宪法》第117条未为王朝继承人预留个人放弃世袭权利的空间，且未经制宪议会批准的放弃声明对后代不具法律约束力——他由此以“佩德罗四世”之名自居，与同时宣布继承皇位的表亲#57佩德罗·恩里克（瓦索拉斯支系）形成直接对立。1944年，他在塞维利亚与波旁-两西西里王朝的玛丽亚·德·拉·埃斯佩兰萨公主成婚，育有六子，其中长子佩德罗·卡洛斯继承了彼得罗波利斯支系的领袖地位。在巴西政治文化语境中，彼得罗波利斯支系历来以更具共和主义倾向与社会进步色彩著称，与主流保皇派所承认的瓦索拉斯支系形成了鲜明的风格对比。他于2007年辞世，身后将支系领导权传于其子佩德罗·卡洛斯。"
 BRA_pedro_henrique_desc:0 "阿尔坎塔拉·恩里克·阿斯托尔福·菲利普·玛丽亚·加斯唐·米格尔·加百列·拉斐尔·贡萨加·德·奥尔良-布拉甘萨亲王，1909年9月13日生于法国布洛涅-比扬古，1981年7月5日卒，巴西帝室瓦索拉斯支系首脑，为主流保皇运动所承认的正统继承人，绰号“期待王子”。他是路易斯王子（#55佩德罗·德·阿尔坎塔拉之弟）与西西里王国玛丽亚·皮亚公主之子；1908年伯父放弃继承权后，其父路易斯成为瓦加斯奶奶伊莎贝尔认可的皇位继承人；1921年11月14日祖母伊莎贝尔·公主（巴西最后一位帝国直系成员）辞世，时年12岁的他即依循瓦索拉斯支系的世系继承皇室名号，获多个欧洲王朝及巴西保皇派主流团体的承认。1937年，他在法国与巴伐利亚王国末代国王路德维希三世之孙女玛丽亚·伊丽莎白公主成婚；二战爆发后为逃避纳粹压迫，他带着妻子与子女辗转逃难，1945年战后返回巴西，定居南里奥格兰德州瓦索拉斯，以务农与推广有机农业为日常生活，低调而真诚地回归祖国。在表亲#56佩德罗·加斯唐（彼得罗波利斯支系）于1946年起公开宣称其法统之前，他是国内外保皇派唯一承认的帝室继承人，之后双方的争议延续至他1981年辞世乃至于今。他坚定地维护了君主主义的传统理念，而以超然于政治纷争的品格赢得了广泛的个人尊重。"
 BRA_pereira_de_oliveira_desc:0 "若昂·佩雷拉·德·奥利韦拉是巴西陆军军官，后晋为将官。早年参加1914年至1915年的孔特斯塔多战争，因在作战中表现突出而被后来的国会材料提及。战间期，他进入巴西陆军机械化与装甲兵早期建设体系，1931年至1932年曾任突击车连指挥官，后又担任第13步兵团等部队的指挥职务。1940年代初，他仍在陆军建制内任高级指挥官，1941年至1942年曾任第8摩托化步兵旅指挥官。"
 BRA_pereira_oliveira_desc:0 "若昂·佩雷拉·德·奥利韦拉是巴西陆军军官，后晋为将官。早年参加1914年至1915年的孔特斯塔多战争，因在作战中表现突出而被后来的国会材料提及。战间期，他进入巴西陆军机械化与装甲兵早期建设体系，1931年至1932年曾任突击车连指挥官，后又担任第13步兵团等部队的指挥职务。1940年代初，他仍在陆军建制内任高级指挥官，1941年至1942年曾任第8摩托化步兵旅指挥官。"
 BRA_plinio_salgado_desc:0 "普利尼奥·萨尔加多，1895年1月22日生于圣保罗州圣本托·杜萨普卡亚，1975年12月8日卒于圣保罗，巴西政治家、作家、记者与神学家，1932年创立并领导了巴西统合主义行动，该运动是拉丁美洲历史上规模最大的法西斯风格群众政治组织。他早年是现代主义文学圈的活跃人物，曾参与1922年圣保罗现代艺术周；1930年革命后，他在受墨索里尼意大利法西斯运动影响（并获意大利大使馆部分资助）的基础上，于1932年10月7日正式发布《十月宣言》，创建了AIB——绿衫军、西格玛（Σ）符号、群众集会与准军事化编队是其外部标志，而萨尔加多本人始终公开拒绝种族主义，以此与纳粹主义区分；统合主义的社会基础涵盖意大利裔与葡萄牙裔移民、城市中低阶层及部分军官（尤以海军中为甚）。1934至1937年间AIB与共产党人在街头激烈对峙，运动规模急剧膨胀，估计成员峰值达数十至百万。1937年他宣布参加原定1938年的总统选举，同年11月支持瓦加斯新国家政变——瓦加斯许诺给他教育部长职位，但政变成功后即违约禁止一切政党，AIB随之解散。1938年3月与5月，统合主义残余武力两度起事，尤以5月11日夜袭瓜纳巴拉宫的“睡衣政变”最为激烈——瓦加斯及其女儿参与了平叛枪战；萨尔加多否认参与策划，但仍遭逮捕，随后以六年流亡葡萄牙为代价换取释放（1938—1945年），流亡期间持续寻求与巴西政权和解。1945年回国后创建大众代表党，1955年参选总统获8.28%选票，此后以联邦众议员身份在政坛活跃至1970年代，支持1964年军事政变，并在最后几届任期中加入军政府的全国革命联盟党。"
 BRA_protogenes_guimaraes_desc:0 "普罗托格内斯·佩雷拉·吉马良斯（1876年—1938年）是巴西海军上将与政治人物，生于今弗洛里亚诺波利斯。1891年进入海军学校，后在海军中逐步晋升，1923年组织巴西国内首次联合飞行之一，任海军航空总局长。1924年，他在里约热内卢组织响应圣保罗中尉运动的海军密谋，事败后遭逮捕，1928年以少将衔被迫退役。1930年革命后，普罗托格内斯获平反，1931年出任海军部长，任内推动海军区划、海军航空和舰艇现代化。1935年，他在里约热内卢州长选举中以一票优势胜出，任职至1937年新国家政变废除州选举政府。1938年在里约热内卢逝世。"
 BRA_renato_almeida_guillobel_desc:0 "雷纳托·德·阿尔梅达·吉洛贝尔，1892年10月8日生于里约热内卢，1975年9月20日卒于同地，巴西海军上将，出身海军世家，其父若泽·坎迪多·吉洛贝尔亦为海军将领。1908年入海军学校为海军见习生，1911年毕业。第一次世界大战期间，他随巡洋舰“巴伊亚号”服役，该舰一度编入协约国序列。1924年11月，他参与镇压圣保罗号战列舰起义；1932年立宪革命中站在临时政府一方作战；1934至1936年任驻阿根廷、乌拉圭、巴拉圭三国大使馆海军武官，新国家时期参与编订军人法。1951年瓦加斯重返总统职位后，任命他为海军部长（1951—1954年），任内借助巴西银行贷款推动累西腓海军基地等设施建设，并于1953年作为部长之一参与签署确立国家石油垄断、创建巴西石油公司的第2004号法律。1954年8月瓦加斯政治危机高峰中，他表态军中多数将领已反对政府；瓦加斯自杀后于8月25日去职。1955年11月洛特发动政变后，他一度出任海军参谋长，1956年短暂代理海军部长，同年因达退休年龄离开现役。"
 BRA_renato_de_almeida_guillobel_desc:0 "雷纳托·德·阿尔梅达·吉洛贝尔，1892年10月8日生于里约热内卢，1975年9月20日卒于同地，巴西海军上将，出身海军世家，其父若泽·坎迪多·吉洛贝尔亦为海军将领。1908年入海军学校为海军见习生，1911年毕业。第一次世界大战期间，他随巡洋舰“巴伊亚号”服役，该舰一度编入协约国序列。1924年11月，他参与镇压圣保罗号战列舰起义；1932年立宪革命中站在临时政府一方作战；1934至1936年任驻阿根廷、乌拉圭、巴拉圭三国大使馆海军武官，新国家时期参与编订军人法。1951年瓦加斯重返总统职位后，任命他为海军部长（1951—1954年），任内借助巴西银行贷款推动累西腓海军基地等设施建设，并于1953年作为部长之一参与签署确立国家石油垄断、创建巴西石油公司的第2004号法律。1954年8月瓦加斯政治危机高峰中，他表态军中多数将领已反对政府；瓦加斯自杀后于8月25日去职。1955年11月洛特发动政变后，他一度出任海军参谋长，1956年短暂代理海军部长，同年因达退休年龄离开现役。"
 BRA_salgado_filho_desc:0 "若阿金·佩德罗·萨尔加多·菲略，1888年7月2日生于南里奥格兰德州阿雷格里港，1950年7月30日卒于同州圣弗朗西斯科-德阿西斯，巴西律师、法官与政治家，推动巴西空军脱离陆军独立建军的关键人物，也是巴西历史上首任航空部长。他在1930年革命中支持瓦加斯，历任联邦区警察局职务、劳工工业商业部长（1932—1934年）、联邦众议员（1935—1937年）与最高军事法庭法官（1938—1941年）。1941年1月，他受命出任新设立的航空部首任部长（1941—1945年），主持统一陆军与海军的航空勤务及训练机构，促成巴西空军，1941年5月定名的诞生，并合并军用与海军航空邮政创建国家航空邮政、在阿丰苏斯校场创办航空学校；二战期间组建了赴意大利参战的第一战斗机大队与联络观测中队。1947年当选南里奥格兰德州联邦参议员，并任巴西劳工党主席。1950年7月30日，他在前往圣博尔雅拜会瓦加斯、商议大选途中，因洛克希德“北极星”客机撞山失事罹难，机上十人全部遇难。阿雷格里港萨尔加多·菲略国际机场即以其命名。"
 BRA_silvio_de_noronha_desc:0 "西尔维奥·德·诺罗尼亚，1884年5月11日生于里约热内卢，1957年6月11日卒于同地，巴西海军上将，出身海军世家：其父儒利奥·塞萨尔·德·诺罗尼亚曾于1902至1906年任海军部长，堂兄伊萨伊亚斯·德·诺罗尼亚亦曾任海军部长，并作为三人军政府成员之一在1930年参与将政权移交给瓦加斯。他在海军中长期服役，累升至上将。杜特拉政府时期（1946—1951年）出任海军部长，任内致力于各级海军教育体系的重建，其中最著名者为1949年以法令重新设立海军学院，使之落址安格拉-杜斯雷斯。里约热内卢通往海军学校方向的西尔维奥·诺罗尼亚大道即以其命名。"
 BRA_silvio_noronha_desc:0 "西尔维奥·德·诺罗尼亚，1884年5月11日生于里约热内卢，1957年6月11日卒于同地，巴西海军上将，出身海军世家：其父儒利奥·塞萨尔·德·诺罗尼亚曾于1902至1906年任海军部长，堂兄伊萨伊亚斯·德·诺罗尼亚亦曾任海军部长，并作为三人军政府成员之一在1930年参与将政权移交给瓦加斯。他在海军中长期服役，累升至上将。杜特拉政府时期（1946—1951年）出任海军部长，任内致力于各级海军教育体系的重建，其中最著名者为1949年以法令重新设立海军学院，使之落址安格拉-杜斯雷斯。里约热内卢通往海军学校方向的西尔维奥·诺罗尼亚大道即以其命名。"
 BRA_washington_luis_desc:0 "华盛顿·路易斯·佩雷拉·德·索萨，1869年10月26日生于里约热内卢州马卡埃，1957年8月4日卒于圣保罗，巴西律师、历史学家与政治家，巴西第13任总统，旧共和国（“咖啡奶茶共和国”）的末任总统。他属圣保罗共和党，虽生于里约州、却在圣保罗成就政治生涯，人称“马卡埃的圣保罗人”，历任巴塔泰斯市议员与市长、州议员、州司法与公共安全书记、圣保罗市长（1914—1919年）、圣保罗州长（1920—1924年，任内应对1924年圣保罗起义）与联邦参议员。1926年11月15日就任总统，留下“社会问题即治安问题”之名言；同年他还邀请南里奥格兰德的热图利奥·瓦加斯出任其财政部长。任内遭遇1929年大萧条重创咖啡经济；他打破米纳斯与圣保罗轮流执政的默契、力挺圣保罗人朱利奥·普列斯特斯竞选总统，加之若昂·佩索阿遇刺，共同引爆1930年革命。1930年10月24日，在任期仅剩约三周时他被军方推翻，权力先移交塔索·弗拉戈索等组成的三人军政府，再转予瓦加斯。此后他流亡欧美长达十七年，1947年归国，专注巴西史研究，为圣保罗文学院院士。"
 BRA_washington_luis_pereira_desc:0 "华盛顿·路易斯·佩雷拉·德·索萨，1869年10月26日生于里约热内卢州马卡埃，1957年8月4日卒于圣保罗，巴西律师、历史学家与政治家，巴西第13任总统，旧共和国（“咖啡奶茶共和国”）的末任总统。他属圣保罗共和党，虽生于里约州、却在圣保罗成就政治生涯，人称“马卡埃的圣保罗人”，历任巴塔泰斯市议员与市长、州议员、州司法与公共安全书记、圣保罗市长（1914—1919年）、圣保罗州长（1920—1924年，任内应对1924年圣保罗起义）与联邦参议员。1926年11月15日就任总统，留下“社会问题即治安问题”之名言；同年他还邀请南里奥格兰德的热图利奥·瓦加斯出任其财政部长。任内遭遇1929年大萧条重创咖啡经济；他打破米纳斯与圣保罗轮流执政的默契、力挺圣保罗人朱利奥·普列斯特斯竞选总统，加之若昂·佩索阿遇刺，共同引爆1930年革命。1930年10月24日，在任期仅剩约三周时他被军方推翻，权力先移交塔索·弗拉戈索等组成的三人军政府，再转予瓦加斯。此后他流亡欧美长达十七年，1947年归国，专注巴西史研究，为圣保罗文学院院士。"
 CBIO_AUS_adolf_hoch_desc:0 "阿道夫·霍赫（1910年—1992年）是奥地利建筑师，生于波希米亚温特贝格，后在维也纳接受建筑训练，曾就读于维也纳美术学院并受彼得·贝伦斯影响。1938年起，他以自由建筑师身份执业，战前参与工业建筑设计。霍赫曾与纳粹组织存在政治关联，1938年后申请加入纳粹党。第二次世界大战后，他继续在奥地利建筑界活动，参与或主持维也纳歌剧院地下通道、南蒂罗尔广场交通设施、医院与公共建筑等市政项目。1992年在维也纳逝世。"
 CBIO_AUS_adolf_scharf_desc:0 "阿道夫·谢尔夫（1890年4月20日—1965年2月28日）出生于摩拉维亚尼科尔斯堡一个贫苦工人家庭，1899年随家迁居维也纳，靠半工半读完成维也纳大学法学学业，1914年获博士学位。一战后他历任社民党籍国民议会议长秘书，1933年3月他与塞茨、鲍威尔一同促成伦纳辞去议长职务，客观上为陶尔菲斯解散议会提供口实；同年出任联邦院议员。1934年二月起义后他遭逮捕并失去公职。1938年德奥合并后他被盖世太保短暂拘押，三个月后却接手了被迫离境的犹太籍同党律师阿诺德·艾斯勒的律师事务所，战后从未归还；他本人则避免加入纳粹法律工作者协会，并与海因里希·迈尔为核心的抵抗组织保持联系，其独子赖因霍尔德应征入伍后于1941年阵亡。战后他于1945—1957年任副总理，历经三任保守派总理，恪守超党派原则；1955年随拉比、费格尔赴莫斯科谈判《国家条约》，但对中立宣言持保留态度。1957年科尔纳总统在任内逝世后，他作为社民党候选人当选总统，5月22日就职，1961年六月在维也纳主持肯尼迪与赫鲁晓夫峰会。1963年成为战后首位成功连任的总统，1965年2月28日在任内逝世，葬于维也纳中央公墓。"
 CBIO_AUS_alexander_lohr_desc:0 "亚历山大·里尔（1885年5月20日—1947年2月26日）出生于罗马尼亚塞维林堡，父亲是多瑙河汽船船长，母亲为俄裔护士，家庭信奉东正教。他在维也纳完成基础教育，因体检不合格未能如愿投身海军，转入卡绍军事实科中学及特梅什堡步兵军校，1903年起入维也纳特蕾西亚军事学院深造，一战中任工兵营排长，1920年晋少校并加入新建的奥地利联邦军，1921年已官至中校。1934年起出任奥地利空军司令直至德奥合并，期间狂热拥护希特勒并鼓动部下加入纳粹党。1938年3月15日转入德国空军任中将，1939年5月起统率第四航空队，先后主持1939年华沙轰炸及1941年4月“惩罚行动”——对贝尔格莱德的大规模空袭，造成数千平民死亡，塞尔维亚国家图书馆数百年藏书付之一炬。此后他历任德国第十二集团军司令（1942年7月）、东南战区总司令兼E集团军群司令（1943年起），主持巴尔干反游击作战，1945年5月9日在斯洛文尼亚向南斯拉夫游击队投降。南斯拉夫军事法庭以贝尔格莱德轰炸及反游击屠杀、焚村等战争罪判处其死刑，1947年2月26日在贝尔格莱德被枪决，是仅有的三位官至德军上将军衔的奥地利人之一。"
 CBIO_AUS_alfred_jansa_desc:0 "阿尔弗雷德·约翰·特奥菲尔·扬萨·冯·坦瑙（1884年7月16日—1963年12月20日）出生于加利西亚斯坦尼斯劳，父亲是奥匈帝国上校。毕业后入伍布拉迪斯拉发第72步兵团，1908—1911年入战争学院，1912年任总参谋部上尉，一战期间转战塞尔维亚、意大利、俄国战线，1915—1916年任驻保加利亚联络官。战后留任联邦军，1930年任下奥地利旅旅长，1933年出任驻柏林武官，借此深入了解德国重整军备及纳粹政权本质。1935年6月被舒施尼格召回主管国防部第三处，1936年4月起正式任联邦军总参谋长。任内他力主整军备战以御德国入侵，制定“扬萨计划”争取意大利支持，谋划在特劳恩河一线节节抵抗以待他国干预，但因经费匮乏未能充分落实。1938年2月贝希特斯加登协定第八条要求撤换他，由弗朗茨·博梅接任；舒施尼格妥协后，扬萨未获正式通知，从媒体得知此事即递交辞呈，2月16日向总统米克拉斯辞行。合并后因其力主武装抵抗，他遭盖世太保监视，幸赖墨索里尼斡旋未入集中营，但1938年9月仍被海德里希下令逐出奥地利，强制移居图林根埃尔福特。1945年后协助筹建奥地利新军，1963年12月20日在维也纳逝世。"
 CBIO_AUS_alfred_klahr_desc:0 "阿尔弗雷德·克拉尔（1904年9月16日—1944年7月）出生于维也纳一个犹太家庭，父亲萨尔曼·克拉尔任维也纳以色列宗教公会领诵员。他在维也纳大学求学期间加入共产主义青年团，1930年起移居莫斯科，任奥地利共产主义青年团驻共产国际代表，1935—1937年在国际列宁学校奥地利部任教。1937年转赴布拉格，任奥共理论刊物《道路与目标》编辑；同年3—4月他以笔名“鲁道夫”发表系列文章《论奥地利民族问题》，提出奥地利人因长期处于与德国不同的经济、政治、历史进程之中，已形成独立于德意志民族之外的奥地利民族——此说为奥共此后坚持奥地利独立、将反纳粹斗争定性为民族解放运动提供了理论基础。1938年德奥合并及捷克斯洛伐克遭吞并后，他投身反纳粹地下抵抗工作；1942年8月被捕，以化名“路德维希·洛克马尼斯”（囚号58933）关入奥斯维辛集中营，加入营内共产党人为核心的“奥斯维辛战斗群”地下组织。1944年6月15日，他在波兰地下党人布拉特科夫斯基协助下成功越狱，但出逃后不久即于同年7月在德占华沙街头遭党卫队巡逻队枪杀。"
 CBIO_AUS_alfred_ritter_von_hubicki_desc:0 "阿尔弗雷德·里特·冯·胡比基（1887年2月5日—1971年7月14日）出生于匈牙利贝雷格州弗里德里希斯多夫（今属乌克兰），军官之子。他不顾父亲属意文职，1905年中学毕业后投身军旅，入维也纳皇家第4炮兵团任见习军官，1907年任少尉，后转隶阿拉德骑炮兵部队；1911年晋一等中尉入维也纳战争学院深造总参勤务，毕业名列前茅，其间在维也纳攻读法律获博士学位。一战期间任山地兵营营长，战后留任奥地利第一共和国联邦军。合并前夕他已官至少将，统率奥军唯一的机械化部队，1938年3月15日转入德国国防军并保留原军衔，4月起在维也纳任新组建的“第4轻装师”师长，该师后改编为第九装甲师。该师参加入侵波兰，在约尔达努夫、雅罗斯瓦夫等地作战，继参与法国及荷兰战役，1940年8月晋中将。1941年4月巴尔干战役中，该师在马其顿重创塞军并攻占斯科普里，他因此获骑士铁十字勋章，1942年再获金质德意志十字勋章，同年10月晋装甲兵上将。此后他在最高统帅部统领特别单位，并任德国驻斯洛伐克军事代表团团长，1945年3月退役，1971年在维也纳逝世。"
 CBIO_AUS_alois_of_liechtenstein_desc:0 "阿洛伊斯亲王·冯·列支敦士登（阿洛伊斯·贡萨加·玛丽亚·阿道夫，1869年6月17日—1955年3月16日）生于施泰尔马克霍伦埃格城堡，系列支敦士登亲王阿尔弗雷德之子，奥匈帝国骑兵中校。1903年迎娶奥地利大公伊丽莎白·阿玛莉，婚礼前依皇帝要求放弃奥地利国籍改入列支敦士登籍。作为在位亲王弗朗茨一世的兄长，他本是法定继承人，却于1923年2月26日以年事渐高、恐难胜任为由主动放弃继承权，转由其子弗朗茨·约瑟夫（即日后的弗朗茨·约瑟夫二世亲王）承继。他是金羊毛骑士团第1177位骑士，1955年3月16日在瓦杜兹去世，享年85岁。他与伊丽莎白育有八名子女，长子即弗朗茨·约瑟夫二世。"
 CBIO_AUS_alois_schonburg_hartenstein_desc:0 "阿洛伊斯·舍恩堡-哈滕施泰因亲王（1858年11月21日—1944年9月21日）出生于巴登卡尔斯鲁厄，出身德意志显赫贵族世家，1877年加入第14龙骑兵团，1878年任中尉，曾任德皇弗朗茨·约瑟夫一世侍从副官，1899—1913年任奥地利红十字会会长，1898—1918年任帝国上议院副议长。一战爆发后他重返现役，先后指挥第11旅、第88边防旅，在利曼诺瓦-瓦帕努夫战役中负伤；1916年7月接替查理大公出任精锐第二十（雪绒花）军军长，1917年率部在伊松佐河加布里耶莱山一带顽强防守，为第十二次伊松佐战役（卡波雷托）胜利创造条件。1918年皮亚韦河攻势中再度负伤，11月11日晋升上将（帝国末代此一军衔获得者），11月16日遭伦纳新政府解除军职。战后他历任退伍军人协会及天主教贵族联盟会长，1927年获利奥波德勋章骑士十字。作为虔诚保皇派天主教徒，他1933年9月起任国务秘书，1934年3月出任陶尔菲斯内阁国防部长，因“非政治化军队”方案无法落实，三个月后即辞职，此后长期隐居家族领地，1944年9月21日逝世。"
 CBIO_AUS_anton_kienbauer_desc:0 "安东·基恩鲍尔（1881年4月25日—1957年5月13日）出生于上奥地利采尔安德普拉姆，父亲是当地客栈老板。他长期在奥地利联邦军服役，1935年1月起出任驻林茨第四师师长兼上奥地利州军事长官。德奥合并后，他与联邦军总监希尔哈夫斯基、克恩顿州军事长官巴格尔等一同未获德国国防军录用，遭强制退役，但获准保留佩戴奥地利军装的权利。战后他就1938年联邦军解体一事撰文回应，相关文字收录于奥地利官方“红白红之书”讨论之中。1957年5月13日在林茨逝世。"
 CBIO_AUS_arthur_seyss_inquart_desc:0 "阿图尔·赛斯-英夸特（1892年7月22日—1946年10月16日）出生于摩拉维亚施塔讷恩，原姓斯拉夫语“扎伊蒂希”，1907年随家迁居维也纳后改为德语化姓氏。他在维也纳大学攻读法律，一战期间在奥匈军队服役，先后于俄、罗、意战线作战并多次因战功受勋，1917年伤愈期间完成学业。战后他从事律师工作，1921年自立门户，业务颇为成功，长期主张德奥合并，起初并未加入纳粹党，但至1938年已成为奥地利纳粹党内地位最高者。1937年5月起任国务顾问，1938年2月遭希特勒胁迫的舒施尼格任命为内政部长。3月11日舒施尼格辞职后，总统米克拉斯被迫任命他为总理，仅在职两日；3月13日他签署法律将奥地利并入德国，随后出任“东方边区”总督。此后他历任驻波兰总督府副总督、荷兰占领区国家专员，在荷兰任内推行驱逐犹太人、没收财产及强迫劳动政策，约十万荷兰犹太人因此遇害，并下令枪决人质镇压抵抗运动。1945年5月5日他在汉堡被英军俘获。纽伦堡审判中，他因战争罪与危害人类罪等罪名被判处绞刑，1946年10月16日在纽伦堡监狱被处决，年五十四岁。"
 CBIO_AUS_arthur_von_pongracz_desc:0 "阿图尔·冯·蓬格拉茨（1864年6月25日—1942年1月13日）出生于奥属西里西亚与加利西亚交界的比亚瓦，1881年投身帝国军队，1904年起任侍从军官，1906—1908年任德皇弗朗茨·约瑟夫一世侍从副官，后转隶驻维也纳的“皇帝胡萨尔第一团”，1913年6月晋上校，1915年出任该团团长，一战中获佩剑利奥波德勋章、佩剑三级铁冠勋章等，战后官至少将。他同时是杰出的马术运动员，1913至1936年保持奥地利马术跳高纪录，并代表奥地利三度参加奥运会盛装舞步比赛：1924年巴黎、1928年阿姆斯特丹（团体第六）、1936年柏林（团体第四），柏林奥运会时他已年逾七旬，是奥运历史上非艺术项目第二年长的参赛选手。1942年1月13日在维也纳逝世。"
 CBIO_AUS_bruno_kreisky_desc:0 "布鲁诺·克赖斯基（1911年1月22日—1990年7月29日）出生于维也纳玛格丽特区一个中产犹太纺织商家庭，1925年15岁加入社民党青年组织，1927年不顾父母反对加入“青年社会主义工人”；1929年起在奥托·鲍威尔建议下入维也纳大学攻读法律。1935年他因参与地下“革命社会主义者”组织活动被捕入狱十八个月。1938年3月他在德奥合并前夕刚获法学博士学位，随即因犹太血统与政治立场再遭盖世太保拘押，同年8月获释但被勒令限期离境，9月辗转柏林、丹麦流亡瑞典。流亡期间，他在瑞典消费合作社运动中任经济顾问、兼做新闻工作，并任瑞典奥地利社会主义者团体负责人，与日后联邦德国总理勃兰特等人交往密切；1942年与瑞典籍犹太裔女子薇拉·菲尔特结婚，育一子一女。1946年他一度返奥，旋即赴斯德哥尔摩任奥地利使馆人员，1950年返回维也纳，获总统科尔纳任为办公室主任及政治顾问，1953年任总理府外交事务国务秘书，参与1955年《国家条约》谈判。此后历任外交部长（1959—1966）、社民党主席（1967年起），1970年出任联邦总理，成为奥地利首位犹太裔总理，在任十三年至1983年。"
 CBIO_AUS_carl_heinz_birnbacher_desc:0 "卡尔·海因茨·比恩巴赫尔（1910年5月26日—1991年12月5日）出生于克恩顿菲拉赫，父亲是前奥匈军官。由于奥地利一战后被禁止拥有海军，他于1930年10月直接投身德国国家海军任海军候补军官，先后在帆船训练舰“宁芙号”、轻巡洋舰“埃姆登号”接受训练，后任战列舰“黑森号”少尉、“舍尔海军上将号”装甲舰鱼雷军官，1935年起任弗伦斯堡-米尔维克鱼雷学校教官。二战期间他出任第一鱼雷快艇舰队司令，在挪威战役中率部参与攻占卑尔根及峡湾作战，击沉挪威鱼雷艇并击溃护航船队；其后七次出击英国舰队中六次告捷，共击沉四艘敌方驱逐舰，因战功于1940年6月17日获骑士铁十字勋章，1942年11月再获金质德意志十字勋章。战后他回乡先后做过木匠、造船工，并就读莱奥本矿业大学，1956年联邦国防军成立后申请德国国籍重新入伍，历任驱逐舰部队及快艇部队指挥官，1959年出任联邦国防军首艘（购自美国）驱逐舰舰长，1960—1962年任快艇舰队司令，晚年官至海军少将，1973—1986年任石勒苏益格-荷尔斯泰因州海事局联邦专员。晚年携妻迁回故乡菲拉赫，1991年12月5日在当地逝世。"
 CBIO_AUS_curt_von_jesser_desc:0 "柯特·冯·杰塞尔（1890年11月4日—1950年8月18日）出生于加利西亚瓦多维采，父亲是日后的奥匈帝国陆军中将莫里茨·冯·杰塞尔。1909年8月他以见习军官军衔投身奥地利军队，编入第六猎兵团，一战后留任奥地利联邦军。德奥合并后他转入德国国防军，战时晋升少将，曾任第36装甲团上校团长，1941年获金质德意志十字勋章，1942年1月18日获骑士铁十字勋章。1943年8月24日至9月6日，他短暂指挥第155预备装甲师；1944年6至8月，他率“杰塞尔战斗群”（第74保安旅）在法国乡村对马基游击队展开清剿行动。1945年他被盟军俘获，1949年获释，1950年8月18日在维也纳逝世。"
 CBIO_AUS_edmund_glaise_horstenau_desc:0 "埃德蒙·格莱塞-霍斯特瑙（1882年2月27日—1946年7月20日）出生于布劳瑙，军官之子，自幼入读特蕾西亚军事学院。历任萨尔茨堡旅参谋官，1913年任职维也纳战争档案馆，一战期间先后在步兵师、猎兵旅任参谋，1915年起任最高统帅部新闻政治顾问。战后转读历史，长期执掌奥地利战争档案馆（1925—1938年任馆长），1934年晋联邦军通讯情报局上校，并渐成遭取缔的奥地利纳粹党内第二号人物，同年起任联邦国务委员，1936—1938年任舒施尼格内阁内政部长；1938年2月贝希特斯加登会谈中，德方要求由他兼掌军权以推动两国军队合流。舒施尼格辞职后，他在赛斯-英夸特内阁任副总理仅两日，随即转入国防军，历任少将、中将至步兵上将（1943年）。1941年4月起任德国驻克罗地亚独立国全权将军，目睹乌斯塔沙对塞尔维亚人、犹太人的屠杀深感震惊，多次去信统帅部抗议未获回应，并卷入一场旨在推翻帕维利奇政权的密谋。密谋败露后他于1944年9月被解职，调任闲职军事史官，1945年5月5日被美军俘获，曾在纽伦堡审判为赛斯-英夸特出庭作证。1946年7月20日，因恐被引渡南斯拉夫，他在纽伦堡附近朗瓦塞军营自杀身亡。"
 CBIO_AUS_eduard_barger_desc:0 "爱德华·巴格尔（1882年9月6日—1962年6月12日）出生于波希米亚莱特梅里茨，父亲是当地龙骑兵团骑兵上尉。他毕业于圣珀尔滕军事实科中学，一战期间服役前线（1914—1918年）。战后留任奥地利联邦军，1933—1935年任克恩顿州安全局长，其后历任第五师师长兼施泰尔马克州军事长官，1935年12月晋少将，1936年起改任第七师师长（驻克拉根福）兼克恩顿、东蒂罗尔州军事长官。1938年德奥合并后，他即遭强制退役；由沃尔夫冈·穆夫将军主持的甄别委员会认定其“不为当地民众广泛接受”，并指出他本人也已寻求退役，故未获德国国防军录用，是少数因不获纳粹当局信任而未被吸纳入伍的奥地利将领之一。此后他未再涉足军旅，1962年6月12日在格拉茨逝世。"
 CBIO_AUS_eduard_freiherr_desc:0 "爱德华·弗莱赫尔·冯·伯姆-埃尔莫利（1856年2月12日—1941年12月9日）生于意大利安科纳，父格奥尔格·伯姆原为士官，因1849年诺瓦拉战功获军官委任，祖父摩拉维亚务农兼教堂杂役，家境贫寒。1875年入读维也纳新城军事学院，一战前已官至骑兵上将兼克拉科夫第一军军长。1914年战争爆发后任第二集团军司令，先率部参加首轮入侵塞尔维亚攻势，后转赴北线，在加利西亚阻挡俄军“压路机”攻势，所部在伦贝格战役、1914—1915年喀尔巴阡防御战、1917年解放切尔诺夫策及1918年占领乌克兰与敖德萨等战事中建树卓著。官至陆军元帅，获玛丽亚·特蕾西亚勋章指挥官十字勋章并封男爵，终身任上议院议员。帝国崩溃后定居故乡特罗保（今属捷克奥帕瓦），1919年该地划归捷克斯洛伐克，捷方按预备役一级上将待遇发养老金，1928年更授其“陆军上将”荣誉头衔（从未在捷军任职）。1938年苏台德并入纳粹德国后，他随之成为德国公民，1940年10月获希特勒授德国陆军元帅荣誉军衔，并任特罗保第38步兵团荣誉团长。1941年12月9日在维也纳逝世，获盛大国葬。"
 CBIO_AUS_egon_schonhof_desc:0 "埃贡·舍恩霍夫（1880年4月9日—1942年10月19日）出生于维也纳一个犹太裔律师家庭，1900年与父亲一同改信天主教，1898—1903年在维也纳大学习法律，1904年获博士学位。一战爆发后他投身奥匈“共同军”，因功获“荣誉勋章”并于1914年晋中校，1915年5月在俄国战线被俘，此后五年辗转西伯利亚多处劳改营，1920年获释回国。亲历十月革命使他从自由派知识分子转为坚定共产主义者，回国后加入奥地利共产党并长期任党内律师，1927年司法宫纵火案后曾为遭控叛国罪的约翰·科普莱尼希辩护。1927、1930年两度代表共产党参选国民议会均未当选，1932年任马克思主义工人学校理事，1933年起公开讲授反法西斯课程；同年共产党遭取缔，他虽向宪法法院抗议未果，1934年二月内战期间被关押沃勒斯多夫拘留营约两年。合并当日（1938年3月12日）他即遭盖世太保逮捕，先后押解至罗萨乌警局、达豪（1938年6月）、布痕瓦尔德集中营（1938年9月），营救出境的努力均告失败。1942年10月初他从布痕瓦尔德转往奥斯维辛集中营，两天后即10月19日，已因折磨而虚弱的舍恩霍夫在病房遭党卫队注射汽油杀害。"
 CBIO_AUS_elizabet_von_gutmann_desc:0 "伊丽莎白·萨罗尔塔（昵称“埃尔莎”）·冯·古特曼（1875年1月6日—1947年9月28日）生于维也纳，父亲威廉·古特曼骑士是摩拉维亚犹太裔煤炭实业家，与兄共创“古特曼兄弟”煤业公司，跃居哈布斯堡君主国煤炭业龙头，1878年获封世袭骑士。1899年皈依天主教，嫁匈牙利贵族盖佐·埃罗什男爵，1908年丧夫后投身慈善，经“士兵救助基金”结识列支敦士登弗朗茨亲王。因犹太出身、门第不相称，在位亲王约翰二世（弗朗茨胞兄）不认可此婚，二人遂1919年秘密结合，1929年约翰二世去世、弗朗茨继位后方得公开成婚。夫妇是首对关心列支敦士登民众的亲王伉俪，1929—1935年每年夏访，深入学校医院，1930年瓦杜兹小儿麻痹疫情时自费从美购药、助贫困患者住院；二人共创“弗朗茨与埃尔莎青年基金会”（今存）及“埃尔莎医疗基金会”，常着民族服饰，被尊“国母”。1933年起因犹太血统屡遭本土纳粹攻讦。合并后夫妇移居布拉格，同年7月弗朗茨一世病逝，埃尔莎流亡瑞士琉森湖畔菲茨瑙，战时助犹太难民并为红十字会募捐，终生未再踏足列支敦士登。1947年9月28日在菲茨瑙逝世，迁葬瓦杜兹主教座堂亲王墓室，至今仍尊称“好亲王妃”。"
 CBIO_AUS_emil_liebitzky_desc:0 "埃米尔·利比茨基（1892年10月5日—1961年4月12日）出生于波希米亚杜克斯，父亲是地方法院官员，原为犹太裔，婚前已改信天主教。他入读默德林技术军事学院，1913年任少尉，分发至第一要塞炮兵团；一战期间转战塞尔维亚、加利西亚、意大利、乌克兰战线，最后四个月任总参谋部军官，战后作为少数获留用的青年军官之一编入奥地利联邦军。1923年他获维也纳大学国家学博士学位，1926年晋少校，出任国防部长沃金的首席副官；1933年出任驻罗马武官，主导对意军援谈判。1939年8月30日他以上校衔遭解职，但未受政治迫害；1942年起暗中联络抵抗组织，并与战后重建奥军的相关团体保持联系。1946年初进入联邦总理府清算事务处，同年4月晋少将；1956年随国防部成立晋炮兵上将，兼总务厅长，参与谈判九个月义务兵役制及对匈边境管控，1957年底退休。他被视为坚定的反纳粹爱国者，对联邦军走上民主清白的道路贡献良多，1956年起又是奥地利军官协会创始人之一并任会长直至病逝，1961年4月12日在维也纳逝世。"
 CBIO_AUS_ernst_hammer_desc:0 "恩斯特·哈默（1884年10月20日—1957年12月2日）出生于埃格河畔法尔肯瑙，1903年以一年志愿兵身份投身奥匈军队，一战中升至上尉，在炮兵参谋部任职。战后留任奥地利联邦军，1924年晋中校，1930年晋上校，1936年10月起任军械署署长兼全国军工企业总监，同年12月晋少将。1938年合并后转入德国国防军，后任驻克斯林炮兵指挥官，1939年8月起出任新组建的第七十五步兵师师长。该师参加入侵苏联，在乌克兰乌曼战役及基辅方向作战；任内他下令“身着俄军制服的女性人员一律就地枪决”，理由是不得将其视为敌方武装部队成员——此命令直接导致苏军女战俘遭枪杀。1940年11月晋中将，1941年12月获骑士铁十字勋章。1942年9月因病离职，10月中旬起改任第190师（后第190步兵师）师长直至该部解散。1945年4月13日在鲁尔包围圈被俘，战后定居维也纳，1957年12月2日逝世。"
 CBIO_AUS_ernst_kaltenbrunner_desc:0 "恩斯特·卡尔滕布伦纳（1903年10月4日—1946年10月16日）生于上奥地利里德，父为律师。先后就读格拉茨大学化学、法律，1926年获法学博士，后在萨尔茨堡、林茨执业律师。1930年加入纳粹党，1931年加入党卫队，1933年任林茨纳粹律师联盟主席。1934年因密谋被陶尔菲斯政府囚于凯泽施泰因布鲁赫拘留营，狱中绝食抗议迫使当局释放490名党员；1935年又涉嫌叛国再度入狱并被吊销律师执照。出狱后成为非法奥地利党卫队实际领袖，频繁密赴巴伐利亚为希姆莱传情报，1937年起执掌全奥党卫队。合并中他奉戈林之命协助促成，1938年3月任赛斯-英夸特内阁公共安全国务秘书，旋晋党卫队旅队长，并参建林茨附近毛特豪森集中营，系合并后奥地利首座纳粹集中营。1943年1月接替遇刺的海德里希任帝国保安总局局长，辖盖世太保、刑警及党卫队保安处，成纳粹种族灭绝核心执行者，曾赴毛特豪森观摩处决示范，并主导1944年7月20日刺杀希特勒未遂案搜捕审讯。1945年5月于蒂罗尔阿尔卑斯山被美军俘获，纽伦堡审判中因脑出血一度缺席，终以战争罪及危害人类罪判绞刑，1946年10月16日处决纽伦堡，是受审党卫队中军衔最高者。"
 CBIO_AUS_ernst_rudiger_starhemberg_desc:0 "恩斯特·吕迪格·施塔尔亨贝格（1899年5月10日—1956年3月15日）出生于上奥地利埃费尔丁古老贵族施塔尔亨贝格家族，一战期间在意大利战线服役。1923年他曾参与希特勒发动的慕尼黑啤酒馆政变，此后逐渐与纳粹决裂，转而加入护乡团，1930年出任护乡团全国领袖，同年9月短暂出任内政部长。1932年陶尔菲斯上台后，施塔尔亨贝格受命整合右翼势力，促成1933年底“祖国阵线”成立及1934年“五月宪法”威权体制建立，本人出任副总理。1934年7月陶尔菲斯遇刺身亡后，他一度短暂代理政府首脑，但总统米克拉斯认为“护乡团内阁”时机未到，转而于7月29日任命舒施尼格为总理，施塔尔亨贝格留任副总理兼治安部长，一度为奥地利第二号实权人物。因不满舒施尼格对纳粹德国的绥靖态度，他于1936年3月被迫交出祖国阵线领导权，护乡团随之解散，5月被逐出政府。1938年德奥合并后，他逃往瑞士避祸。1940年加入法国军队，敦刻尔克撤退后转赴英国，曾短暂在英国及自由法国空军服役。1942—1955年侨居阿根廷，1955年返回奥地利，1956年3月15日在福拉尔贝格施鲁恩斯逝世。"
 CBIO_AUS_eugen_beyer_desc:0 "欧根·贝耶（1882年2月18日—1940年7月25日）出生于摩拉维亚波尔利茨，父亲是当地邮政局长。他毕业于布尔诺德语中学及当地步兵军校，1902年8月任见习军官编入第31步兵团，1903年任少尉，1907—1910年入维也纳军事学院深造，后任驻波斯尼亚巴尼亚卢卡第12山地旅总参谋官。一战期间他历任克拉科夫要塞司令部、最高统帅部、第二军、第十七步兵师等参谋职务，1917年晋总参谋部少校。战后留任奥地利联邦军，参与该军初创组建，1925年起在新设的奥地利战争学院任教并晋上校，1931年晋少将兼任该校校长，1935年9月调任驻因斯布鲁克第六师师长，1936年12月晋中将。德奥合并前夕，他调任国防部第三厅厅长并代理联邦军总监；合并后转入德国国防军并晋步兵上将，1938年4月起任驻萨尔茨堡第十八军军长，主持原奥地利部队整编入德军，成效卓著，是转入德军的奥地利军官中军衔最高者。该军1939年参加入侵波兰，沿喀尔巴阡山经普热梅希尔、桑河推进至利沃夫；1940年又参与法国战役，经阿登穿越雷泰勒、拉昂向法国腹地推进。胜利进军途中贝耶身患重病，同年6月5日被解除指挥，7月25日在萨尔茨堡病逝。"
 CBIO_AUS_franz_bohme_desc:0 "弗朗茨·弗里德里希·博梅（1885年4月15日—1947年5月29日）出生于施泰尔马克采尔特韦格，1900年投身奥匈军队，1905年任步兵中尉，一战后留任奥地利联邦军。1938年合并后转入德国国防军，先后指挥第30、第32步兵师，参与入侵波兰及1940年法国战役，同年6月获骑士铁十字勋章。1941年9月16日至12月2日，他出任德军驻塞尔维亚全权指挥官，借口报复游击队袭击，下令以“杀一抵百、伤一抵五十”的比例大规模处决人质：克拉古耶瓦茨一地枪杀近2800名平民，克拉列沃约2000人遇难，托波拉等地另有数千犹太人与共产党人被处决，他还下令“马奇瓦行动”焚毁村庄、逮捕15至60岁男性。短短两月内塞尔维亚约三万平民被杀，其中近五千名犹太男性几乎为当地全部适龄犹太男子，他本人公开宣称此举是为一战时期对塞尔维亚人的“复仇”。1941年12月卸任后，历任第十八军副司令、萨尔茨堡军区司令，1944年6月接替伦杜利克指挥第二装甲集团军，后调任预备役，1945年1月至5月任挪威武装部队总司令兼第二十山地集团军司令。战后他在挪威被俘，作为“人质审判”被告之一，于即将受审前的1947年5月29日自杀身亡。"
 CBIO_AUS_franz_koritschoner_desc:0 "弗朗茨·科里琼纳（1892年2月23日—1941年6月9日）出生于维也纳一个犹太家庭，年轻时即反对社会民主党支持一战的立场。1918年奥地利共产党甫一成立他便加入，是组织当年一月大罢工的领导人之一，罢工平息后被捕。他长期担任党中央委员（至1928年），翻译列宁著作并主编党刊《红旗报》。1926年他赴苏联在赤色职工国际工作，与领导人洛佐夫斯基过从甚密，1930年加入苏联共产党并定居苏联。1936年斯大林大清洗期间他被捕入狱，遭内务人民委员部刑讯，在苏联远北劳改营因坏血病牙齿尽落。1940年根据苏联最高法院裁决，他作为苏德条约背景下的“善意”之举被引渡至纳粹德国——这是苏联当局将数百名身处苏联的政治流亡者（其中不乏忠诚的共产党人）移交给纳粹德国的众多案例之一。1941年5月他被押解至维也纳罗萨乌警局监房，狱友形容他未及五十已形同老者，身形瘦小、几近秃顶、满口无牙。6月7日他被解往奥斯维辛集中营，两天后即6月9日遇害。1956年苏共二十大后他获“法律和政治”平反，但战后从苏联返国执掌奥共的领导人对此一背叛行径始终缄默，多年未向党内同志透露真相。"
 CBIO_AUS_franz_von_keil_desc:0 "弗朗茨·里特·冯·凯尔（1862年9月15日—1945年11月22日）出生于奥地利海军世家，父亲海因里希·里特·冯·凯尔为联邦军中将。他长期在奥匈帝国海军服役，一战末期出任皇帝卡尔一世的海军高级顾问，但因皇帝并未真正采纳谏言、海军亦已无力出海作战，此职务实为虚衔。育有一女赫尔塔（1891—1971）。1945年11月22日逝世。"
 CBIO_AUS_franz_winkler_desc:0 "弗朗茨·温克勒（1890年3月20日—1945年10月16日）出生于波希米亚兹维考，曾在波希米亚任庄园官员，后转赴蒂罗尔、施泰尔马克任公职，并任施泰尔马克州议会议员及州政府成员。1930—1934年任国民议会议员，1930—1933年任内政部长，其间1931年6月一度因抗议政府为信贷银行对外债务提供联邦担保而辞职抗议，旋即复任；1932年5月20日至1933年9月21日任副总理，同年起兼任农民同盟全国主席。任内他公开反对取缔纳粹党，宣称“不存在奥地利人，只存在在奥地利建国的德意志人”，1933年与陶尔菲斯决裂。1934年七月政变期间他暗中与纳粹党勾连图谋东山再起，举事前夕逃往捷克斯洛伐克，政变失败后未再返回奥地利，1936年被剥夺奥地利国籍。合并后他得以回国，1938年底因牵连一桩贪腐丑闻被纳粹党拒之门外，此后在维也纳因策多夫一家供暖设备厂任厂长。战争末期身患重症，他逃往施泰尔马克，寄居于社民党人、后任州长马霍尔德家中，1945年10月16日在格拉茨逝世。"
 CBIO_AUS_friedrich_mandl_desc:0 "弗里德里希·亚历山大·玛丽亚·曼德尔（小名“弗里茨”，1900年2月9日—1977年9月8日）出生于维也纳，父亚历山大为犹太裔军火实业家，母为天主教徒，婚后十年方正式成婚，他自幼负“私生子”身份阴影。24岁起执掌父创希尔滕贝格军火厂，1930年任总经理，后又拥有利希滕韦特军火厂及格林巴赫煤矿；1928年代表希尔滕贝格与德国军火商莱茵金属合资在瑞士索洛图恩设厂，借瑞士掩护德奥武器出口。他是墨索里尼崇拜者，1931年普弗里默暴动失败后转向意大利寻求军援，三十年代结交护乡团领袖施塔尔亨贝格亲王并供应武器弹药；1933年“希尔滕贝格军火案”向意、匈走私军火，震动朝野，他还与涉罗莎·卢森堡谋杀案的德国少校帕布斯特交好。同年他娶18岁演员海德薇希·基斯勒（即日后好莱坞影星海蒂·拉马尔），逼其皈依天主教，婚姻1937年告终，自传中他被描绘为极端专横的丈夫。合并后他因支持奥地利法西斯路线及犹太血统遭纳粹没收财产，及时转资产入瑞士公司保全，本人逃往瑞士，后辗转巴西、阿根廷并入籍，出任贝隆顾问，因昔日纳粹往来被美国列入黑名单多年，1955年返奥重掌希尔滕贝格工厂，1977年9月8日逝世。"
 CBIO_AUS_friedrich_materna_desc:0 "弗里德里希·马特纳（1885年6月21日—1946年11月11日）出生于摩拉维亚霍夫，一战期间在奥匈军队服役，战后留任奥地利联邦军，1921年晋中校，1929年晋上校。1934年8月起任联邦军总监参谋长，1935年6月晋少将，1936年10月起出任国防部训练处处长。德奥合并后转入德国国防军并保留军衔，1938年4月起任新组建的第四十五步兵师师长，1940年法国战役中率部强渡埃纳河、埃纳运河及絮普河防线，本人亲赴前沿恢复中断的通讯联络，因此于同年8月5日获骑士铁十字勋章。1940年10月起任第二十军军长，11月晋步兵上将，1942年12月获金质德意志十字勋章。1943年1月起任第十八军区司令（驻萨尔茨堡），同年12月调入预备役，健康状况持续恶化（心肌梗死后遗重度心脏损伤），1944年9月1日退出现役。战后翌年因中风去世。其子同名弗里德里希·马特纳后在第二共和国联邦军官至少将，长期任福拉尔贝格州军事长官。"
 CBIO_AUS_godwin_von_brumowski_desc:0 "戈德温·冯·布鲁莫夫斯基（1889年7月26日—1936年6月3日）出生于加利西亚瓦多维采一个军人世家，1910年毕业于默德林技术军事学院，任炮兵中尉。一战爆发后在俄国战线服役并获两枚英勇勋章，1915年转入航空部队，初为观察员，1916年7月起任飞行员，加入意大利战线第十二飞行连，次年1月即首开战果晋升王牌。1917年2月他受命组建并指挥奥匈首支专职战斗机中队“第41J飞行连”，同年8月11天内连续击落18架敌机，全年战绩29架。1918年初两度座机中弹起火幸运生还，6月23日奉命休长假结束作战生涯，此时已飞行439次出击，获35个官方确认战果（另8个未获确认），为奥匈头号王牌飞行员。同月他婉拒申请帝国最高荣誉“玛丽亚·特蕾西亚勋章”，称功绩当由统帅主动颁授而非自请，终生未获此勋；10月仍以上尉衔被任命统领伊松佐战线全部战斗机部队。帝国崩溃令他深受打击，战后务农未果，1930年在维也纳创办飞行学校，并为护乡团驾机服务；1934年二月内战期间他驾机执行了唯一一次空袭，轰炸社会党据守的司法宫。1936年6月3日，他在荷兰史基浦机场指导一名学员训练时因飞机失事身亡，安葬于维也纳中央公墓。"
 CBIO_AUS_gottfried_freiherr_von_banfeld_desc:0 "戈特弗里德·冯·班菲尔德（1890年2月6日—1986年9月23日）出生于科托尔湾卡斯泰尔诺沃，家族为十六世纪移居奥地利的爱尔兰裔军人世家，祖辈曾任利萨海战特格特霍夫旗舰指挥官之一。毕业于圣珀尔滕军校，15岁入阜姆海军学院，1909年通过军官考核，1912年晋海军中尉，同年于维也纳新城完成飞行训练。意大利参战后，他奉命在的里雅斯特附近建水上飞机基地并任司令至战争结束，该基地后以其名命名。1915年6月27日他首开战果，击落敌方观测气球，1916年4月将双座洛纳M型水上飞机改装为单座战机，系奥匈首款自研战机；1917年5月31日他成首位夜间击落敌机的奥匈飞行员。其战绩官方确认9架，另11架未获确认，为奥匈战绩最高海军飞行员。1916年获仅授30人的“大军功勋章”，1917年8月获最高荣誉“玛丽亚·特蕾西亚勋章”并封男爵，是该勋章史上最后一位在世获得者。战后的里雅斯特归意大利，他曾被占领当局拘押，此后未再驾机，1920年移居英国入籍，1926年改入意大利籍返的里雅斯特，接掌岳家航运公司，成为当地名人，1977年获法国荣誉军团勋章，1986年9月23日在的里雅斯特逝世，享年96岁。"
 CBIO_AUS_hans_pertner_desc:0 "汉斯·佩尔特纳（1887年10月3日—1951年7月25日）出生于维也纳，父亲是气象学教授约瑟夫·佩尔特纳。他在维也纳大学攻读物理与地理，1911年获博士学位，先任大学助教，一战期间在航空部队服役（1914—1918）。战后任商务部官员，1922年起任教育部长秘书，1932—1934年掌管艺术司及联邦剧院，1934年7月起任教育部国务秘书，1936年5月升任联邦教育部长直至1938年合并。任内他厉行威权统治意识形态管控，要求“凡有空缺教席须优先任用忠于祖国、最好兼具虔诚基督信仰的大学教师”。德奥合并后他随首批囚车被押往达豪集中营，后转毛特豪森，1941年获释后投身抵抗组织“O5”，1944年7月20日刺杀希特勒未遂案后再遭盖世太保逮捕，羁押至1945年红军解放维也纳。1945年4月17日他是人民党在维也纳苏格兰修道院的共同创始人之一，出任党务总干事；战后重掌教育部艺术司司长一职，1945—1949年任国民议会议员。1951年7月25日在巴德伊舍逝世。"
 CBIO_AUS_heimito_von_doderer_desc:0 "海米托·冯·多德勒（1896年9月5日—1966年12月23日）生于维也纳近郊魏德林高一处林务小屋，时逢建筑师父威廉主持维也纳河治理，为家中六子女中最小者；家族世代经营建筑业，曾系奥匈帝国最富裕家族之一。1915年他参军，旋于俄国战线被俘，西伯利亚战俘营经历令他萌生写作之志。返国后在维也纳大学攻读历史，1925年获博士学位。1933年他加入彼时遭禁的纳粹党，主因谋求加入帝国文学院以便出版而非意识形态认同，此后数年渐与纳粹疏远；1936年他向该院申请书中竟以“血统纯正”为由，声称能“处处感知”维也纳社会犹太人与非犹太人间的“撕裂缝隙”，此构想后演变为代表作《恶魔们》，留下不光彩思想印记。1940年他皈依天主教，同年应征入伍驻法国，始构思《斯特鲁德尔霍夫楼梯》；1942年调往库尔斯克前线，后因三叉神经痛遣返后方，先后驻维也纳新城、维也纳，战争末期辗转挪威，沦英军战俘至1945年11月获释。因纳粹党籍背景，返奥后被禁出版至1947年。1951年《斯特鲁德尔霍夫楼梯》终获出版并大获成功，奠定战后奥地利文坛地位，1956年长篇巨著《恶魔们》问世，1966年12月23日因肠癌病逝于维也纳。"
 CBIO_AUS_heinrich_maier_desc:0 "海因里希·迈尔神父（1908年—1945年3月22日）出生于维也纳，父亲是奥地利国铁官员。他先后在圣珀尔滕、莱奥本读中学，1926年入维也纳神学院，1928—1930年赴罗马攻读经院哲学并获博士学位（同窗柯尼希日后任枢机主教），1932年于维也纳圣斯蒂芬大教堂晋铎，1935年起任格斯特霍夫堂区副本堂神甫，1942年获天主教神学博士。1940年起他不顾因尼策尔枢机训诫，联络雅各布·凯泽等抵抗人士，与蒂罗尔保皇工程师卡尔多纳齐、塞姆佩里特总裁梅斯纳共创“迈尔-梅斯纳-卡尔多纳齐”小组，通过维也纳卫戍司令等渠道，向盟军提供V-2火箭、虎式坦克及梅塞施密特战机等军工生产详情，并最早揭露纳粹对犹太人的大屠杀，所获情报助力盟军精确空袭。1944年3月28日他在教堂望弥撒后于圣器室被捕，严刑逼供下仍设法掩护同伴；同年10月秘密“人民法庭”判处他叛国罪死刑。尽管已判死刑，他仍于11月被押往毛特豪森企图榨取情报，遭裸缚窗棂等酷刑而未吐露同伴。多方求情无效，1945年3月22日（维也纳解放前夕）他于维也纳地方法院被斩首，是纳粹在维也纳处决的最后一人，遗言“我为奥地利而死，无怨无悔”。"
 CBIO_AUS_johann_hiedler_desc:0 "约翰·格奥尔格·希德勒（受洗于1792年2月28日—1857年2月9日）出生于下奥地利瓦尔德菲尔特尔地区魏特拉镇施皮塔尔村，磨坊学徒出身，终生从事流动磨坊匠工作，是一名极为普通、史籍鲜有记载的乡间手艺人。1842年5月10日，他在德勒斯海姆与玛丽亚·安娜·希克尔格鲁伯成婚——后者育有一名婚外所生之子阿洛伊斯，此时已五岁，希德勒终生未公开承认其生父身份。希德勒去世近二十年后，已年届三十九、时任海关官员的阿洛伊斯于1876年6月促成本堂神父修改出生登记，由其叔父约翰·内波穆克·希德勒等三名证人具结作证，确认已故的约翰·格奥尔格为生父，阿洛伊斯遂依继父姓氏改姓，因登记笔误写作“希特勒”——此即阿道夫·希特勒之父。希德勒是否确为阿洛伊斯的生身父亲，史学界迄今未有定论：部分学者倾向认为其弟约翰·内波穆克（阿洛伊斯自幼由其抚养、并继承其大部分遗产）才是真正生父；纳粹德国出于“雅利安血统”宣传需要，于1930年代正式将约翰·格奥尔格·希德勒认定为元首的祖父，并据此编纂家谱予以公开。"
 CBIO_AUS_johann_jacob_reverta_desc:0 "约翰·雅各布·玛利亚·雷韦尔塔-萨兰德拉（1899年8月7日生于上奥地利赫尔芬贝格）出身奥地利雷韦尔塔-萨兰德拉伯爵家族，该家族原源出加泰罗尼亚及那不勒斯贵族，18世纪迁入哈布斯堡君主国，在上奥地利拥有赫尔芬贝格等产业。雷韦尔塔青年时代即与西班牙关系密切，1920年代赴西班牙活动，并同西班牙上层保守派、长枪党圈子建立联系。西班牙内战爆发后，他站在佛朗哥一方，以天主教保皇派和反共产主义者身份参与国民军阵营，曾在长枪党民兵体系内组织由身边人员和追随者组成的小部队参战。与多数经德国渠道进入秃鹰军团的奥地利志愿者不同，雷韦尔塔更多依靠其西班牙社会关系行动，是奥地利右翼、保皇派卷入西班牙内战的特殊个案。战后他延续家族海外支系，被视为雷韦尔塔-萨兰德拉家族阿根廷支的始祖。"
 CBIO_AUS_johann_koplenig_desc:0 "约翰·科普莱尼希（1891年5月15日—1968年12月13日）出生于克恩顿耶尔斯多夫一个农业雇工家庭，本人原为鞋匠。1910年加入社会民主工党，一战期间在俄国战线被俘，1915年起为战俘，十月革命期间转而支持布尔什维克，1918—1920年任下诺夫哥罗德工兵代表苏维埃委员，1920年返回奥地利。回国后他在施泰尔马克投身共产党工作，1922年当选中央委员，1924年起任总书记，1928年当选共产国际执委会委员，1935—1943年任执委会主席团成员。1934年奥共被陶尔菲斯政权取缔后，他转入地下继续活动一段时间后流亡，辗转捷克斯洛伐克、法国、苏联等地。1945年战后他返回奥地利，在伦纳临时政府中出任副总理，与谢尔夫、费格尔同列副总理。1945—1965年任奥地利共产党主席，1965年起任名誉主席直至逝世；1945—1959年任国民议会议员。1968年12月13日因癌症在维也纳逝世。他曾两度结婚，首任妻子安娜1921年去世，1929年与历史学家希尔德再婚，育有二子女。"
 CBIO_AUS_johannes_of_liechtenstein_desc:0 "约翰内斯亲王·冯·列支敦士登是奥地利保皇派（合法主义者）运动的核心领袖之一：1921年，多个分散的君主复辟团体在他领导下整合为“奥地利人帝国联盟”，此为哈布斯堡皇室正式“授权”承认的合法主义旗舰组织，与外交官弗里德里希·维斯纳、男爵汉斯·卡尔·策斯纳-施皮岑贝格共同为该联盟领导核心。1933年5月维也纳“解围土耳其人二百五十周年纪念庆典”——护乡团组织的官方庆典——他作为联盟代表出席，与护乡团总领施塔尔亨贝格、总理陶尔菲斯等同列。该联盟主张拥护卡尔一世皇太子（后由其子奥托·哈布斯堡继承皇统）复位，1932年并入更大的保皇派伞状组织“铁环”。"
 CBIO_AUS_josef_brunner_desc:0 "约瑟夫·布伦纳（1889年10月30日—1967年1月15日）出生于上奥地利施塔德尔-保拉，1910年投身奥匈军队第98步兵团，一战期间转入飞行部队，1917年完成飞行训练后任侦察军官，后任第三十六飞行连连长兼前线飞行员。战后留任奥地利联邦军，因圣日耳曼条约禁止奥地利拥有空军，他一度转回第五步兵团及步兵技术学校任职，1927年晋少校，1934年5月起执掌重新筹建的陆军第一飞行团，1937年晋中校。德奥合并后转入德国空军并保留军衔，1939年晋上校，历任轰炸机联队、第十八集团军空军联络部队司令，参与西线战役；1941年起先后任“C”集团军群（后改称北方集团军群）、南方集团军群空军联络部队司令，同年9月晋少将；1942年起任驻法国西线总司令部空军联络部队司令，1943年2月起任德累斯顿-克洛切空军战争学校校长兼飞行基地司令，同年10月起以中将军衔任职，1967年1月15日在兰巴赫逝世。"
 CBIO_AUS_josef_teufl_desc:0 "约瑟夫·托伊弗尓（1904年11月24日—1945年4月28日或29日）出生于维也纳，又称塞普·托伊弗尓，是奥地利共产党政治活动家、工人运动组织者和反法西斯抵抗者。他出身普通职工家庭，青年时代学做机械钳工，先后在林茨机车厂、施泰尔工厂和林茨烟草厂工作。1920年代末加入奥地利共产党，并在烟草厂从事工会活动，曾任工人代表。1933年奥共被奥地利法西斯政权取缔后，他以化名转入地下，出任奥共上奥地利地区负责人，参与组织1934年二月斗争后的非法传单、联络和重建工作，多次被捕、判刑或关押于拘留营。德奥合并后，托伊弗尓继续从事秘密抵抗，重建上奥地利共产党组织。1944年9月，他因叛徒告密被捕，押入毛特豪森集中营，在营内参加秘密抵抗组织。1945年4月底，奥地利纳粹头目担心这些共产党人战后参与重建，下令处决一批林茨、韦尔斯抵抗者；托伊弗尓在集中营解放前夕被杀害。"
 CBIO_AUS_julius_deutsch_desc:0 "朱利叶斯·多伊奇（1884年2月2日—1968年1月17日）出生于洛肯巴赫一个客栈主家庭，社民党政治家，1920—1933年任国民议会议员。一战后他先后任军务次官（1918年11月—1919年3月）、军务国务秘书（1919年3月—1920年10月），他主持组建“德意志奥地利人民卫队”，并由此衍生社民党准军事组织“护共团”——1922年他提议筹组，1923年正式注册成立，长期任领袖至1934年覆灭。他也是国际社会主义工人体育联合会主席，致力于将工人体育运动与反法西斯动员结合。1922年他遭一名右翼登山者公开侮辱为“叛徒”，1923年提起诉讼，被告律师援引反犹言论为其辩护，上诉法院最终判被告无罪，史称多伊奇-赖恩尔案，凸显一战后奥地利政坛潜藏的反犹暗流。1934年内战护共团战败、社民党遭禁后，他流亡捷克斯洛伐克布尔诺；1936—1939年以共和军将领身份参加西班牙内战；1939年转赴巴黎，为奥地利社会主义者海外代表机构工作；法国沦陷后，因犹太裔身份再度流亡美国，1946年返回奥地利。他一生三度结婚，1951年与女作家阿德里安娜·托马斯成婚，逝世后维也纳一处住宅区以“多伊奇庭院”纪念他。"
 CBIO_AUS_julius_raab_desc:0 "朱利斯·拉比（1891年11月29日—1964年1月8日）出生于下奥地利圣珀尔滕一个营造商家庭，曾入读维也纳科技大学，因一战爆发应征入伍，任奥匈军队工兵军官，转战俄、意战线，战后返校投身政治。1927—1934年任国民议会议员（基督社会党），并投身护乡团，1928年出任下奥地利地区领袖。1932年加入“东方边区冲锋队”，1933年加入祖国阵线，仕途渐进，1938年1月、即德奥合并前四周，由舒施尼格任命为商务部长。合并后他被逐出政坛，纳粹当局不许其重操旧业，遂转入筑路公司任职，期间庇护包括费格尔在内的受迫害者。战后他为人民党创始人之一，在费格尔内阁任商务部长，1951年接任党主席，1953年接替费格尔任联邦总理。1955年莫洛托夫提议重启谈判，拉比与费格尔、克赖斯基赴莫斯科谈判，5月15日《国家条约》签署，奥地利宣布永久中立。1956年大选人民党获46%选票，拉比连任总理，倾向与谢尔夫领导的社民党组阁；1957年他与工会领袖伯姆创立工资物价联合委员会，奠定“社会伙伴关系”基础。1961年卸任党主席与总理职务，1963年竞选总统败于谢尔夫，1964年1月8日在维也纳逝世，享年72岁。"
 CBIO_AUS_julius_yllam_desc:0 "朱利斯·亚曼（原名朱利斯·马利，“亚曼”系“马利”字母倒序而成的化名，1885年5月18日—1942年1月15日）出生于维也纳一个军官家庭，波希米亚裔。一战后投身新生共和国的志愿军，1918—1920年克恩顿保卫战期间任志愿军飞行队指挥官，率部执行大量侦察飞行，远至马尔堡（马里博尔）、莱巴赫（卢布尔雅那）一线，为前线部队提供关键情报、挽救众多士兵性命。其后任第一共和国飞行部队监察官，1934年4月1日起任格拉茨第二飞行团团长，军衔上校，1937年2月28日卸任，由维克托·赛鲍尔中校接替。1942年1月15日在克拉根福逝世，葬于该地荣誉墓园，墓碑饰以螺旋桨造型，以纪念其飞行生涯。"
 CBIO_AUS_karl_eglseer_desc:0 "卡尔·埃格尔泽（1890年7月5日—1944年6月23日）出生于上奥地利巴特伊舍，父亲是克拉根福市剧院总监。1908年他入马尔堡步兵军校，编入第87步兵团，一战中两度负伤，1914年圣诞夜重伤后被俄军俘虏。战后他留任奥地利联邦军第11高山猎兵团，历任连长、营副官等职，1927年晋少校，1930年代曾任甘瑟恩多夫第一高山猎兵师师长。1938年合并后转入德国国防军，1940年11月晋少将并出任第四高山师师长，1941年率部参加巴尔干战役后投入入侵苏联：在乌曼包围战中，他凭个人决断调动第91高山猎兵团切断苏军南撤要道，促成对苏军第六、第十二集团军共逾十万人的合围，因此于同年10月23日获骑士铁十字勋章。其间他两度负伤离职又复职，1943年转任第714步兵师师长（驻南斯拉夫），同年12月接替博梅出任第十八山地军军长，1944年3月晋山地兵上将。1944年6月23日，他与迪特尔上将等人乘坐的容克52运输机在施泰尔马克雷滕埃格附近坠毁，机上人员全部遇难。"
 CBIO_AUS_karl_polheim_desc:0 "卡尔·波尔海姆（1883年6月28日—1967年12月15日）出生并逝世于格拉茨，是奥地利日耳曼语言文学学者、格拉茨大学教授。他在格拉茨和柏林求学，1907年获哲学博士学位，1912年在格拉茨大学取得德语语言文学任教资格，1924年任编制外副教授，1929年起任德语语言文学正教授。两次大战之间，他长期活跃于大德意志民族主义团体，所属学生歌唱社团和文化组织多带有排他民族主义色彩。1938年德奥合并后，他申请加入纳粹党，1939年8月至1945年任格拉茨大学校长，成为纳粹时期格拉茨大学学术体制的重要管理者；1941年至1943年又曾在萨格勒布任海外教授。1945年纳粹德国崩溃后，波尔海姆被退休处理。其学术研究集中于文学民俗学、民间诗歌、童话和东阿尔卑斯地区民间戏剧，曾收集大量民间文学手稿，并培养了若干战后奥地利民俗学与文学研究者。"
 CBIO_AUS_karl_renner_desc:0 "卡尔·伦纳（1870年12月14日—1950年12月31日）出生于摩拉维亚下塔诺维茨一个贫苦酿酒农家，为家中第十八个孩子。他在维也纳大学攻读法律，1896年获博士学位后任帝国议会图书馆员并加入社会民主工党，1907年当选议员，与奥托·鲍威尔等人创办党刊《斗争》，提出民族“属人自治”理论，成为奥地利马克思主义代表人物之一。一战期间他主张支持帝国战争努力。1918年11月哈布斯堡帝国崩溃后，伦纳出任“德意志奥地利共和国”首任国务总理，1919年率团参加圣日耳曼条约谈判并签字，被迫接受禁止德奥合并及割让南蒂罗尔等地，1920年6月卸任总理，后兼任外交部长至同年10月。此后他在政坛影响渐弱，1931—1933年任国民议会议长，1933年3月与议长团集体辞职，客观上为陶尔菲斯解散议会提供口实。1938年德奥合并后，伦纳曾公开表态支持，并呼吁民众在公投中投赞成票，此举饱受争议；占领期间他蛰居维也纳，未参与政治。1945年4月苏军解放维也纳后，伦纳在苏方支持下组建临时政府并任总理，同年12月20日当选第二共和国首任联邦总统，被尊为“共和国之父”。1950年12月31日在维也纳德布灵逝世。"
 CBIO_AUS_kurt_schuschnigg_desc:0 "库尔特·舒施尼格（1897年12月14日—1977年11月18日）出生于蒂罗尔里瓦（今属意大利特伦托），父亲是奥地利将领。他就读费尔德基希耶稣会学校，一战期间在意大利战线被俘，至1919年9月获释，其后在因斯布鲁克大学攻读法律，1922年毕业后执业。他加入基督社会党，1927年当选国民议会议员，1930年创立天主教准军事组织“东方边区冲锋队”。1932年起任司法部长，1933年起兼任教育部长，任内曾恢复死刑，并协助陶尔菲斯于1933年解散国民议会。1934年二月起义被镇压后，他下令处决八名起义者，因而获得“工人刽子手”之名。陶尔菲斯遇刺身亡后，舒施尼格于1934年7月29日继任总理，1936年迫使副总理施塔尔亨贝格下台、解散护乡团。面对希特勒压力，他于1938年2月12日被迫赴贝希特斯加登接受城下之盟；3月9日宣布就奥地利独立举行公投，3月11日在德国最后通牒下被迫辞职。其后被纳粹监禁至1945年获美军解放。战后因曾镇压社民党人被禁止加入人民党，遂赴美，1948—1967年任圣路易斯大学政治学教授，1956年入美籍，后返奥地利，1977年11月18日在因斯布鲁克附近穆特斯逝世。"
 CBIO_AUS_leopold_figl_desc:0 "利奥波德·费格尔（1902年10月2日—1965年5月9日）出生于下奥地利图伦费尔德一农户家庭，毕业于维也纳农业大学，后投身下奥地利农民同盟，1931年任副主席，1933年任主席。陶尔菲斯建立威权体制后，他出任经济政策委员会委员，并领导天主教准军事组织“东方边区冲锋队”。他公开反对纳粹主义，1938年3月德奥合并当日即遭逮捕，4月被押往达豪集中营，曾因谈论奥地利问题遭体罚并关暗牢半年，其后辗转弗洛森比尔格、达豪两营，其间染上斑疹伤寒，1943年5月获释后任石油工程师。1944年10月因参与抵抗活动再度被捕，押至毛特豪森集中营，1945年初被押回维也纳受审，遭人民法院判处死刑，未及执行，4月6日苏军解放维也纳前夕获释，随即受命协助粮食供应。4月他重建农民同盟并入新成立的人民党，月底出任下奥地利临时邦长兼副总理。同年12月20日，在战后首次自由选举后出任联邦总理，组建三党联合政府。1953年11月辞去总理职务，转任外交部长至1959年，期间参与1955年《国家条约》谈判，并在贝尔维德雷宫阳台留下“奥地利自由了！”的著名画面。此后历任国民议会议长、下奥地利邦长，1965年5月9日逝世。"
 CBIO_AUS_leopold_waber_desc:0 "利奥波德·瓦贝尔（1875年3月17日—1945年3月12日）出生于摩拉维亚梅伦施塔特（今乌尼乔夫），父亲为中学教师。他在克雷姆西尔完成中学，1892—1899年于维也纳大学先后攻读法律及哲学（历史），1897年获法学博士，此后长期任财政官员，足迹遍及下奥地利、蒂罗尔、福拉尔贝格等地，1920年升至财政顾问。他是泛德意志民族主义运动活跃分子，1918—1919年任伦纳临时政府外交事务次长，1920年参与创立大德意志人民党。1921年当选国民议会议员，1921—1922年在基社党与大德意志人民党联合内阁中任内政部长，任内他炮制所谓“瓦贝尔式国籍认定法”，以种族理由拒绝向源自前哈布斯堡帝国东部领土的犹太移民授予奥地利国籍，公然违背圣日耳曼条约赋予原帝国臣民的国籍选择权；1922年初因总理朔伯尔未经党内磋商即与捷克斯洛伐克缔结拉纳条约愤而辞职，数月后转任塞佩尔内阁司法部长（1922—1923）。1924年11月起任副总理兼司法部长直至1926年，1926—1930年任国民议会第三议长。1945年3月12日在维也纳逝世。"
 CBIO_AUS_lothar_rendulic_desc:0 "洛塔尔·伦杜利克（1887年10月23日—1971年1月17日）生于维也纳新城一克罗地亚裔军人家庭，曾在维也纳、洛桑修法律政治学，1907年入特蕾西亚军事学院，后入奥匈军队参加一战。战后留任联邦军，1920年获维也纳大学法学博士，供职国防部；1932年加入在奥地利尚属非法的纳粹党，1933—1934年任驻巴黎、伦敦武官，后任维也纳摩托化旅长，1936年因纳粹党籍遭强制退役。合并后以上校衔重返军队，先后指挥第十四、五十二步兵师及第三十五军（参加库尔斯克会战）。1943年起任第二装甲集团军司令，负责南斯拉夫战区，对游击队袭击采取人质报复政策，致大量平民死亡；1944年初奉命突袭德弗拉尔图擒铁托未果。1944年6月改任第二十山地集团军司令兼芬兰、挪威德军总司令，拉普兰战争中下令焦土撤退，罗瓦涅米等城镇被毁。1945年历任库尔兰、北方及南方（后改称东方边区）集团军群司令，5月7日于布拉格攻势中向美军投降。纽伦堡“人质审判”中，因南斯拉夫战争罪、危害人类罪于1948年判20年监禁（拉普兰焦土指控获无罪），后减为10年，1951年获释。晚年定居泽瓦尔兴，从事写作与地方政治，逝于埃费尔丁附近。"
 CBIO_AUS_ludwig_von_eimannsberger_desc:0 "路德维希·冯·艾曼恩斯贝格尔（1878年11月19日—1945年7月31日）出生于维也纳一个因父亲阵亡受封贵族的炮兵军官世家。他毕业于军事技术学院，1899年入伍第11野战炮兵团，后入参谋学院深造，历任萨拉热窝、普热梅希尔等地参谋职务，一战期间在加利西亚、俄属波兰、南蒂罗尔及伊松佐河战线任炮兵指挥及顾问，因1917年卡波雷托战役有功获利奥波德勋章骑士级。战后他留任奥地利联邦军，1926年起任陆军部武器技术处长，1927年任处长，1929年至1930年2月任联邦军总监，为奥地利军中最高级别军官。1930年退役后，他转而潜心研究一战末期装甲战经验，提出大规模装甲集群结合步炮协同的战术理论，1934年出版代表作《坦克战》，深刻影响了古德里安1937年《注意，坦克！》一书及后来德军“闪电战”实践，但本人始终未获古德里安等人公开承认其理论先驱地位，晚年对此颇为不满。1938年合并后他以炮兵上将军衔重入德军，但因系前奥军老军官，长期未获实际任用，1940年仅获东方总司令部参谋闲职，旋即申请退役，1943年正式退出军队。1945年初他离开默德林避居因斯布鲁克附近穆特斯儿子家中，同年7月31日病逝。"
 CBIO_AUS_ludwig_von_mises_desc:0 "路德维希·海因里希·埃德勒·冯·米塞斯（1881年9月29日—1973年10月10日）生于加利西亚伦贝格（今利沃夫）一个富裕犹太家族，曾祖父1881年获封贵族。世纪之交入维也纳大学，因卡尔·门格尔《国民经济学原理》转向奥地利学派，成庞巴维克研讨班杰出学生，获法学博士，入维也纳商会任职，一战中虽反战仍应征入伍。1912年出版《货币与信用理论》奠定其地位，1913—1934年在维也纳大学任无薪教授，同时任奥地利政府首席经济顾问。1920年论证社会主义因缺乏价格机制无法理性核算经济，此说经哈耶克阐发为奥地利学派经典论断；1922年出版《社会主义》系统批判计划经济。他是反纳粹威权派总理陶尔菲斯最亲近经济顾问，后亦为流亡奥托·哈布斯堡提供咨询。1934年为避纳粹影响离奥赴日内瓦任教，1940年移居纽约，1945—1969年任纽约大学客座教授。1947年为朝圣山学社创始会员，对战后欧洲经济重建间接发挥影响。1949年出版代表作《人的行为》，阐述“人类行为学”演绎方法论，捍卫自由放任的古典自由主义。1973年10月10日在纽约逝世，享年九十二岁，次年其学生哈耶克获诺贝尔经济学奖，奥地利学派由此复兴。"
 CBIO_AUS_malke_schorr_desc:0 "马尔克·朔尔（化名赫塔·米勒，1885年12月27日—1961年10月15日）生于加利西亚利普斯科一个贫苦正统犹太家庭，兄弟姐妹十人，自八岁起做计件手工。父亲去世后，按大拉比之命家人欲将她许配出嫁，她却在订婚之日跑去看席勒的《强盗》以反抗。十七岁在伦贝格接触工人运动，翌年加入犹太社会主义组织“锡安工人”。1905年迁居维也纳，习得女帽匠手艺，在女工间传播马克思学说，屡遭解雇，始终站左翼立场，对社民党一战支持战争深感不满。1920年“锡安工人”分裂大会上，她力主加入共产国际，部分原成员随她转入德意志奥地利共产党（即奥共前身）。1925年起领导“奥地利红色救济会”，为政治受迫害工人及家属提供法律与物质援助；1930年代曾在维也纳组织声援美国“斯科茨伯勒男孩”案示威，轰动一时。1933年奥共遭禁后，救济会组织力量更显关键。纳粹时期她流亡莫斯科，一度领导国际红色救济会驻巴黎西欧局，其间一封她写的信——指控德共干部赫尔曼·舒伯特将列宁与托洛茨基相提并论——据信成舒伯特日后遭逮捕处决导火索。1945年维也纳解放后她返奥，已六十岁的她接掌奥共《人民之声报》新闻部。1961年10月15日在维也纳逝世。"
 CBIO_AUS_marianne_pollak_desc:0 "玛丽安娜·波拉克（原姓施普林格，1891年7月29日—1963年8月30日）出生于维也纳一个犹太裔小市民家庭，受训为英法语教师。1914年加入社会民主工人党，1915年与记者奥斯卡·波拉克结婚，1923—1925年随夫赴伦敦任弗里德里希·阿德勒秘书，助筹建社会主义工人国际。1926年返维也纳，1927—1934年任社民党刊物《小报》编辑，投身妇女议题及戒酒运动，1933年任社会主义作家协会理事。1934年二月内战后转入地下，充当丈夫“信使”，为政治犯组织包裹，旋即流亡瑞士，1935年转布尔诺，1936—1938年任社会主义工人国际驻布鲁塞尔秘书，1938—1940年居巴黎，法国战败后经西班牙、葡萄牙辗转抵伦敦，加入“奥地利劳工俱乐部”，1944—1945年任英奥民主协会执委。1945年11月返奥，12月当选国民议会议员（至1959年），同年起主编社民党妇女周刊《女性》，是战后首批呼吁堕胎合法化的女政治家，长期关注家庭法改革、职业妇女权益。1957—1959年任欧洲理事会顾问代表。1963年8月奥斯卡·波拉克病逝两日后，玛丽安娜因不愿与丈夫分离而自尽，二人合葬于火葬场骨灰园荣誉墓地。"
 CBIO_AUS_mauritz_von_wiktorin_desc:0 "毛里茨·冯·维克托林（1883年8月13日—1956年8月16日）出生于多瑙河畔海恩堡，1903年自军校毕业任奥匈“龙骑兵第12团”少尉，一战期间历任骑兵及参谋职务，获三级佩剑铁冠勋章。战后他留任奥地利联邦军，曾任驻柏林联络官并掌情报部门，1934—1935年任总参谋部作战处长，1935年因与德国军方未经授权的接触遭逮捕并被开除军籍。他对德奥合并态度积极，1938年3月24日（追溯生效自4月1日）重获录用，授中将衔，先后在新组建的第五集团军参谋部及第十三摩托化步兵师任职，并参与评估奥地利军官转任国防军适宜性的“穆夫委员会”。1938年11月起他执掌新组建的第二十步兵师（摩托化），率部参加1939年入侵波兰及1940年法国战役，因埃纳河至埃皮纳勒一线行动及围歼默兹河以东之敌有功，1940年8月获骑士铁十字勋章。同年11月起任第二十八军军长，参与“巴巴罗萨”行动，隶属北方集团军群，部队推进至波罗的海三国并参与围困列宁格勒。1942年4月在夏季攻势前遭撤换，调入预备役；同年5月起任驻纽伦堡第十三军区司令，1944年7月密谋案后人事调整中于11月30日退役。1956年8月16日在纽伦堡逝世。"
 CBIO_AUS_maximilian_ronge_desc:0 "马克西米利安·隆格上校（1874年11月9日—1953年9月10日）生于维也纳，系奥匈帝国军官，军官学校同窗包括日后社民党要人、第二共和国总统西奥多·科尔纳。1907年调入帝国情报局，师从局长阿尔弗雷德·雷德尔上校。1913年他主持侦办一封无人认领、内含巨款的可疑信件，循线查出雷德尔实为沙俄重金收买的双重间谍，雷德尔事发后自杀，史称“雷德尔事件”，为一战前夕震动帝国的谍报丑闻。1917—1918年隆格任情报局末任局长，其密码破译工作被史家誉为一战最成功情报战绩之一，助帝国坚持至终局；1918年情报局与国内警务合计动用三百名军官、五十名文职、四百名警探及六百名线人。1930年出版回忆录《战时及工业间谍：情报生涯十二年》。合并后他拒绝加入纳粹相关组织遭逮捕，押送达豪集中营，狱中致信新晋海军中将卡纳里斯表“效忠”，同年8月获释，此后蛰居维也纳度过战争岁月。战后71岁高龄的他协助盟军在美占区筹建新情报机构，1953年病逝，未及看到1955年奥地利情报局正式成立及国家重获独立。英国作家丹尼斯·惠特利1950年历史小说《第二印》即以他为原型反派人物。"
 CBIO_AUS_odilo_globocnik_desc:0 "奥迪洛·洛塔尔·路德维希·格洛博奇尼克（1904年4月21日—1945年5月31日）生于的里雅斯特，父为斯洛文尼亚裔，母出身匈牙利塞尔维亚-克罗地亚家庭。一战后定居克恩顿，三十年代投身纳粹运动，1934年加入彼时尚属非法的奥地利党卫队。合并后他任维也纳大区领袖，1939年初因非法外汇投机遭撤职，旋参与入侵波兰；同年11月希姆莱赦免并委以波兰卢布林区党卫队与警察头目要职。1941年10月起他奉密令组织代号“莱因哈德行动”灭绝计划，在贝乌热茨、索比堡、特雷布林卡建灭绝营，并参与卢布林附近马伊达内克集中营设立，至1943年行动结束，约150万犹太人（另有非犹太受害者）遭杀害，其劳改营亦大量奴役虐杀劳工，财物乃至金牙均遭掠夺；1942年末起他还主导扎莫希奇区波兰人驱离。1943年9月因贪污受害者财物指控调任的里雅斯特，任亚得里亚海沿岸最高党卫队与警察长官，随行带去莱因哈德行动多名骨干刽子手，主持当地圣萨巴大米场集中营并参与迫害意大利犹太人。盟军逼近后他逃入克恩顿山区，1945年5月31日于帕特尼翁附近被英军俘获，受审前咬碎氰化物胶囊自尽，当地神父拒绝其遗体葬入祝圣墓地，终葬墓园外墙旁无名墓穴。"
 CBIO_AUS_otto_bauer_desc:0 "奥托·鲍威尔（1881年9月5日—1938年7月4日）出生于维也纳一个富裕犹太工厂主家庭，1900年投身社会民主工党政治活动，与马克斯·阿德勒、鲁道夫·希法亭、卡尔·伦纳等人共同创立“未来”协会，奠定奥地利马克思主义基础。1907年，年仅26岁的他出版巨著《民族问题与社会民主》，提出以“属人自治”解决多民族帝国的民族问题，并参与编辑《工人报》《斗争》等党刊。一战期间他作为预备役军官在俄国战线作战并被俘，1917年9月返回维也纳。维克托·阿德勒1918年逝世后，鲍威尔成为社民党实际领导人，1918年11月至1919年7月出任德意志奥地利共和国外交部长，致力推动与魏玛德国合并未果，1919年3月签署秘密合并协定，后遭协约国否决。此后二十年间他始终是党内灵魂人物，1907—1934年连续担任议会议员，1926年主导制定纲领性文件《林茨纲领》。1933年陶尔菲斯建立威权统治后社民党活动受到严重压制，1934年二月起义失败后他被迫流亡，先后辗转布尔诺、巴黎，继续从事理论写作，直至1938年7月4日病逝于巴黎，距德奥合并仅四个月。"
 CBIO_AUS_otto_meixner_von_zweienstamm_desc:0 "奥托·麦克斯纳（1908年起称“冯·茨韦恩斯塔姆”，1858年2月1日—1946年10月10日）出生于加利西亚克拉科夫附近洛布祖夫，1879年与孪生兄弟胡戈一同自圣珀尔滕军校及维也纳特蕾西亚军事学院毕业任少尉，1883年转入总参谋部。他长期在国防部任职，1907年起任国土防卫部部门主管，1908年获封“冯·茨韦恩斯塔姆”贵族称号并晋陆军中将。其间他自1897年起从事军事著述，著有《给养、辎重与通讯事务研究》（1894）、五卷本《历代野战供给史》（1897—1910）等军需后勤理论著作。1913年升任驻特梅什堡第七军军长并晋步兵上将，一战爆发后所部本拟参与入侵塞尔维亚而未果，转赴俄国战线，旋因健康原因于1914年10月被解职召回维也纳，1915年起休假，1919年初正式退役。1926—1937年任维也纳新城军校校友会会长，此后任名誉会长，1946年10月10日在上奥地利蒙德湖逝世。"
 CBIO_AUS_otto_schobel_desc:0 "奥托·舒尔（1894年8月22日—1979年9月24日）出生于维也纳，1914年8月投身奥匈军队第十一皇家铁路连，一战期间长期在铁路勤务部门任职，历任技术副官等职。战后留任奥地利联邦军，曾在克恩顿铁路与索道公司任职，1921年任连长，1928年晋少校，1933年晋中校，1936年晋上校。德奥合并后转入德国国防军，起初降为中校，1939年初恢复上校军衔；战时长期从事铁路、技术后勤相关工作，后转入空军体系，1941年10月晋少将。1979年9月24日在维也纳逝世。"
 CBIO_AUS_paul_von_hegedus_desc:0 "保尔·冯·赫格德（1861年6月6日—1944年11月10日）出生于匈牙利，1879年投身奥匈军队，长期在皇家匈牙利国土防卫军（荣维德）骑兵部队服役，1913年晋上校。一战期间他于1915年6月起任第24荣维德骑兵旅旅长，1917年晋少将，1918年1月起改任第11荣维德骑兵师师长直至战争结束。帝国崩溃后他返回匈牙利，作为保皇派将领在贝拉·库恩苏维埃政权下隐匿避祸，库恩政权垮台后加入霍尔蒂的“国民军”，1919年底任第六军区司令，1920年晋中将，1921年改任驻西匈牙利第三军区司令，积极支持抵制将肖普朗地区割让予奥地利的势力。1921年10月，废帝查理一世（匈牙利称查理四世）试图复辟，赫格德是首位向其效忠的保皇派高级将领，并被任命为匈牙利王国军队总司令，率部图谋进军布达佩斯，但在布达厄尔什之战中被霍尔蒂的忠诚部队击溃，复辟失败。事后他遭匈牙利军事法庭审判，被革职、剥夺全部军衔头衔及二十年军旅生涯所获勋章，1944年11月10日逝世。"
 CBIO_AUS_richard_steidle_desc:0 "理查德·施泰德尔（1881年9月20日—1940年8月30日）出生于南蒂罗尔梅拉诺，父为符腾堡移民商人。他在因斯布鲁克大学习法律，1908年获博士学位，体检不合格未上前线，任军法书记官，战后于因斯布鲁克执业律师至1934年。1919年起任蒂罗尔人民党州议员，1918—1921、1933—1934年任州务委员，1922—1931年任联邦院议员。1920年5月受命起草蒂罗尔防卫法案并借机创立蒂罗尔护乡团，任该邦领袖至1934年；立场具争议：1919年曾入“反犹同盟”，后自称只仇视“犹太马克思主义者”，与极端反犹的施蒂里亚护乡团领袖普弗里默分道扬镳。他联络巴伐利亚、匈牙利、意大利右翼换军火资金，1927年促成全奥护乡团联合会成立并任首任领袖；1930年5月他宣读“科尔诺伊堡誓词”，誓拒议会民主、夺权重建国家，但未弥合内部分裂，年底被施塔尔亨贝格取代。仍任蒂罗尔州领袖及该邦保安局长，1933年11月兼联邦宣传专员，1934年7月调任的里雅斯特总领事，实系政治闲置，至1938年合并。合并后，曾遭他打压的纳粹党人将他逮捕押入布痕瓦尔德集中营，1940年8月死于营中，官方称“越狱身亡”。"
 CBIO_AUS_theodor_innitzer_desc:0 "西奥多·因尼策尔（1875年12月25日—1955年10月9日）生于波希米亚魏佩特（今捷克韦普尔蒂），父原为花边匠后转纺织厂工人。本堂神父助他入读考亚登文理中学，后赴维也纳深造，1902年晋铎。1910年起在维也纳大学讲新约释经，1913—1932年任新约教授，1918年任神学院院长，1928年任校长；曾任朔伯尔内阁社会福利国务部长。1932年9月教宗庇护十一世任命他为维也纳大主教，1933年3月晋枢机，是陶尔菲斯及舒施尼格威权体制坚定支持者。1938年3月15日他赴帝国饭店拜会希特勒，3月18日与奥地利主教团联署声明支持合并，盼以此换取教会自由，4月更下令全奥教堂悬挂卐字旗、鸣钟为希特勒祈祷。数月后德国便废止与教廷政教协定、查禁教会机构与天主教报刊；10月7日数千天主教青年聚集圣斯蒂芬大教堂祈祷，次日希特勒青年团与冲锋队冲击大主教宫，他被迫经地道逃入大教堂方免于难，此后他转批评纳粹，遭暴力恐吓，官邸成犹太人庇护所，所设“非雅利安裔天主教徒救济中心”挽救众多生命。战后他主持教区重建，圣斯蒂芬大教堂修复尤为晚年心血所系，新建堂区逾五十座，1955年10月9日在维也纳逝世，由柯尼希继任。"
 CBIO_AUS_theodor_korner_desc:0 "西奥多·科尔纳（1873年4月24日—1957年1月4日）出生于匈牙利新塞尼（今科马罗姆），父亲是奥匈帝国炮兵军官。他1888年入赫拉尼采军校，后以工兵专业毕业于帝国皇家技术军事学院，1894年任中尉，1904年升少校并进入总参谋部。一战期间他历任要职，1915年5月任师参谋长，协助阻挡意大利军在伊松佐河沿线的攻势。帝国崩溃后他出任新建奥地利军队总监察官，1924年以将军衔退役，加入社会党，同年当选议员，1933年12月至1934年2月任联邦院议长。他是社民党准军事组织护共团技术委员会成员，与亚历山大·艾夫勒同为该组织两位主要军事战略家，但一贯反对采取暴力行动。内战与奥地利法西斯专政建立后，科尔纳的政治生涯终结，先后遭陶尔菲斯政权及合并后纳粹当局两度监禁。1945年4月他出任维也纳市长，主持战后重建。1950年卡尔·伦纳逝世后，社会党提名他为总统候选人，他以略超51%的得票当选，成为首位由全民直选产生的联邦总统，1951年6月21日就职，1957年1月4日在任内逝世，是连续第二位卒于任上的总统。"
 CBIO_AUS_valentin_feuerstein_desc:0 "瓦伦丁·福伊尔施泰因（1885年1月18日—1970年6月8日）出生于福拉尔贝格布雷根茨，1906年8月以少尉军衔加入奥匈第2提洛尔皇家猎兵团，1910—1913年入维也纳战争学院，历任步兵师、山地步兵旅及第二十军总参谋部要职，一战末期在里瓦地段任参谋官。战后留任奥地利联邦军，1920年晋少校，1928年晋上校，1935年6月晋少将并出任第三师师长（驻圣珀尔滕）。合并后转入德国国防军，1938年4月1日起在因斯布鲁克出任新组建的第二山地师首任师长，率部参加入侵波兰，1939年获一、二级铁十字勋章；1940年指挥该师参加挪威战役，长途跋涉数百公里攻向纳尔维克，同年6月晋中将。1941年3月卸任师长后短暂赋闲，5月起出任第七十高级指挥部司令，9月晋山地兵上将，后历任第七十军军长。1943年8月起调任意大利战场，统率第五十一山地军，在卡西诺山一带与盟军鏖战，因防御战功于1944年8月12日获骑士铁十字勋章。1945年初他改任蒂罗尔地区防务总监及阿尔卑斯前线指挥官，并以布雷根茨城防司令身份试图宣布该城为非战斗区以免破坏，4月29日被俘，至1948年8月获释，1970年6月8日在因斯布鲁克逝世。"
 CBIO_AUS_viktor_kienbock_desc:0 "维克托·金伯克（1873年1月18日—1956年11月23日）出生于维也纳，毕业于苏格兰文理中学，1896年获维也纳大学法学博士，入父辈律师事务所。青年时代投身天主教工人运动，1908—1914年任商务部社会政策工人顾问委员会委员。一战中以兰德韦尔军官身份在塞尔维亚被俘，辗转移交意大利、羁押阿尔巴尼亚，1917年5月交换释放。战后代表基社党任维也纳临时市议会议员，1920年起任联邦院议员，1922年加入基社党并出任财政部长（1922—1924年、1926—1929年两任，均在塞佩尔内阁），主导终止滥发纸币的货币整顿、创设先令货币、改组奥地利国家银行并促成国际联盟贷款，1925年一度因财政争议辞职。1932年2月起任国家银行行长直至1938年合并，任内成功化解信贷银行危机及1936年“凤凰保险丑闻”。威权体制下兼任国务委员会及联邦议会成员。合并后被纳粹当局解职，仅获半薪退休金。战后72岁高龄的他重新投身公职，1945—1952年任国家银行顾问，1952年起任副行长直至逝世，期间对马歇尔计划援助分配具有重要影响。"
 CBIO_AUS_viktor_seebauer_desc:0 "维克托·赛鲍尔是奥地利第一共和国末期的联邦军航空军官，军衔中校。1937年3月1日，他接替尤利乌斯·亚曼出任驻格拉茨第二飞行团团长。奥地利在一战后长期受圣日耳曼条约限制，正规航空兵力建设十分迟缓；至1930年代重建航空部队时，驻格拉茨的第二飞行团已是其有限空中力量的重要组成部分。1938年3月德奥合并后，奥地利联邦军被并入德国武装力量，第二飞行团随之不复存在，赛鲍尔在格拉茨的任职也告结束。"
 CBIO_AUS_vinzenz_schumy_desc:0 "文森茨·舒米（1878年7月28日—1962年12月13日）出生于克恩顿盖尔河谷绍克村一个农户兼客栈家庭，系婚前所生，父母婚后追认其身份。先后就读克拉根福实科中学、苏黎世理工学院及维也纳土地文化大学，1904—1911年任弗尔克马克特农业学校校长，1917年起任克恩顿农民同盟总干事，一战后投身克恩顿保卫战，1918年起任州议会议员。1919年作为代表团成员参与圣日耳曼条约谈判；1920年公投决定下克恩顿归属奥地利期间，他以克恩顿乡土工作团首任主席身份主持宣传。1923—1927年任克恩顿州长，1924年起任全国农民同盟总主席，1929年5—9月任副总理，1929—1930年及1933年两度任内政部长（后者已属陶尔菲斯威权时期）。1932—1938年任克恩顿农业合作社联合会法律顾问。1934年农民同盟遭解散，他仍设法在克恩顿维持影响力；合并后被逐出合作社系统职务，1938—1945年在维也纳从事私营经济活动。战后他加入人民党，1945年5—9月任财产保全国务秘书，后任合作社联合总会首任总辩护人，1945—1949年任国民议会议员，1962年12月13日在维也纳逝世。"
 CBIO_AUS_wilhelm_gebauer_desc:0 "威廉·格鲍尔（1882年1月7日—1972年8月23日）出生于奥属西里西亚塔博尔（今属捷克），农户长子，特罗保中学毕业后入布尔诺军校。任少尉期间，他在博雷斯瓦夫油田骚乱中冒生命危险扑灭一场大火，获“荣誉勋章”嘉奖。一战期间他以上尉军衔在俄国战线服役并多次受勋，曾获三级铁冠骑士勋章，并曾被提名授予奥地利最高军事勋章“玛丽亚·特蕾西亚勋章”，因弗朗茨·约瑟夫皇帝驾崩而未及办理。战后他以少校军衔留任奥地利联邦军，编写了联邦军操典；1927—1928年任维也纳卫戍司令部第二旅参谋长，其后任国防部长沃金副官，1932年起出任驻圣珀尔滕第三旅（后第三师）旅长直至1937年，据载他在奥地利法西斯专政时期还曾兼任祖国阵线政府情报负责人。1937年3月18日晋升陆军中将并获“阁下”荣衔，同月底退役。1938年德奥合并后，他拒绝了德国国防军重新征召的提议，此后在维也纳安度晚年，是奥地利末代在世的陆军中将，1972年8月23日逝世，葬于希钦格公墓。"
 CBIO_AUS_wilhelm_miklas_desc:0 "威廉·米克拉斯（1872年10月15日—1956年3月20日）出生于下奥地利克雷姆斯一个邮政职员家庭，在维也纳大学攻读历史与地理，1905—1922年任霍恩联邦中学校长。1907年作为基督社会党人当选帝国议会议员，1911年连任，反对德意志民族主义，对确立红白红国旗起到重要作用。1919年起任伦纳政府国务秘书，1923—1928年任国民议会议长，1928年12月10日当选联邦总统。任内他对政府的违宪行径态度消极：1933年3月议长团集体辞职后，他未阻止陶尔菲斯借机停摆议会、实行紧急法令统治；1934年内战及威权体制建立期间，他同样保持沉默，仅在私下记录中表示不满。1934年7月纳粹分子发动政变刺杀陶尔菲斯期间，米克拉斯本人在前往克恩顿途中险遭劫持，后获救；他还拒绝赦免刺杀陶尔菲斯的凶手。1938年2月舒施尼格被迫赴贝希特斯加登后，米克拉斯起初拒绝任命赛斯-英夸特为总理，但在德军压境、墨索里尼表态不干涉后，于3月11日深夜被迫屈服，任命赛斯-英夸特组阁，次日德军开入奥地利。此后他被软禁，退出政坛，1956年3月20日在维也纳逝世。"
 CBIO_AUS_wilhelm_zehner_desc:0 "威廉·泽纳（1883年9月2日—1938年4月11日）生于特兰西瓦尼亚比斯特里茨，1898年入步兵军校，1903年任少尉。一战期间历任军需官，1916年秋调一线作战，任营副官及营长。战后留任联邦军，1920年晋少校，1929年晋上校，1933年任上奥地利旅旅长并晋少将。1934年7月陶尔菲斯任他为国防部国务秘书；同月纳粹“七月政变”中坐镇总理府广场平叛，因而被柏林列入黑名单。1934年11月晋步兵上将，后被视为“联邦军之父”，因主持军队现代化贡献卓著，但与力主武装抗德的总参谋长扬萨关系紧张，常以预算掣肘其方案。1938年贝希特斯加登协定后危局加深，他仍主张公开抗德。3月11日随内阁辞职，临行前下达军旅生涯最沉重的命令——德军入境时奥军一律东撤、不得开枪。合并后被强制退役并缴械；4月10日深夜，两名盖世太保闯入寓所，将其拖下床推入客厅，枪声随即响起，其妻赶到时丈夫已倒地，行凶者据称试图将手枪塞入死者手中伪造现场，其妻与女佣被迫签署“因精神错乱自杀”证词。官方法医鉴定及警方记录均判定自杀，1951年审判因证据不足未能定罪，死因长期众说纷纭，种种迹象指向盖世太保谋杀。安葬于维也纳德布灵公墓。"
 CBIO_BRA_afranio_de_mello_franco_desc:0 "阿弗拉尼奥·德·梅洛·佛朗哥，1870年2月25日生于米纳斯吉拉斯州帕拉卡图，1943年1月1日卒于里约热内卢，巴西法学家、政治家兼职业外交官，旧共和国至瓦加斯时代对外政策的重要塑造者之一。早年毕业于圣保罗法学院，初入外交界，历任驻乌拉圭与驻比利时使馆秘书；1902年转战政坛，自1906年起多届担任联邦众议员，代表米纳斯吉拉斯州长达二十余年。1924至1926年间以全权代表身份出席日内瓦国际联盟，并被选任海牙常设国际法院法官。1929年在“咖啡奶茶同盟”体制瓦解之际转而支持热图利奥·瓦加斯，参与自由联盟运动的幕后斡旋；1930年革命胜利后，出任瓦加斯临时政府首任外交部长（1930—1933年），主持伊塔马拉蒂宫，以多边谈判立场主导南美地区事务，期间深度介入查科战争调停工作。其子阿方苏·阿里诺斯·德·梅洛·佛朗哥后来成为著名宪法学家与外交部长，父子二人共同构成20世纪巴西最具代表性的法政世家之一。"
 CBIO_BRA_afranio_mello_franco_desc:0 "阿弗拉尼奥·德·梅洛·佛朗哥，1870年2月25日生于米纳斯吉拉斯州帕拉卡图，1943年1月1日卒于里约热内卢，巴西法学家、政治家兼职业外交官，旧共和国至瓦加斯时代对外政策的重要塑造者之一。早年毕业于圣保罗法学院，初入外交界，历任驻乌拉圭与驻比利时使馆秘书；1902年转战政坛，自1906年起多届担任联邦众议员，代表米纳斯吉拉斯州长达二十余年。1924至1926年间以全权代表身份出席日内瓦国际联盟，并被选任海牙常设国际法院法官。1929年在“咖啡奶茶同盟”体制瓦解之际转而支持热图利奥·瓦加斯，参与自由联盟运动的幕后斡旋；1930年革命胜利后，出任瓦加斯临时政府首任外交部长（1930—1933年），主持伊塔马拉蒂宫，以多边谈判立场主导南美地区事务，期间深度介入查科战争调停工作。其子阿方苏·阿里诺斯·德·梅洛·佛朗哥后来成为著名宪法学家与外交部长，父子二人共同构成20世纪巴西最具代表性的法政世家之一。"
 CBIO_BRA_agliberto_vieira_desc:0 "阿格利贝托·维埃拉·德阿泽维多是巴西陆军军官，军衔上尉，活跃于1930年代的左翼军事运动。1935年11月共产主义起义期间，他与苏格拉底·贡萨尔维斯·达席尔瓦等人领导了里约热内卢阿丰索斯机场军事航空学校的兵变，一度控制学校并向附近的第一航空团发动行动。起义失败后，瓦加斯政府对参与军官进行严厉清算，阿格利贝托被列入1935年12月31日第558号法令，遭褫夺军衔和军人资格。此后，他还因军事航空学校事件和政治罪名进入巴西军事司法档案。"
 CBIO_BRA_alfred_agache_desc:0 "阿尔弗雷德·阿加什，1875年2月24日生于法国都尔，1959年5月4日卒，法国建筑师与城市规划师，法国城市规划师学会创始成员之一，以在巴西的大规模城市规划实践留名南美现代城市史。他就读巴黎美术学院，将社会学方法系统引入城市设计，成为同时代“社会学城市主义”最重要的理论倡导者之一。1927年，应里约热内卢市长安东尼奥·普拉多·儒尼奥尔之邀赴巴，主持制定里约热内卢城市总体规划；方案于1930年提交，史称“阿加什规划”，涵盖城市分区、市中心重建与港口入口改造，是彼时拉丁美洲规模最宏大的现代城市规划尝试之一。1930年革命使该规划的全面推进受阻，多数内容因资金庞大而未能落实，但其规划理念对巴西后续城市建设讨论影响深远。此后他陆续参与累西腓、阿雷格里港与库里提巴的城市规划项目，在巴西城市规划界留下延续数十年的遗产。阿加什始终持法国国籍，是以真实工作经历在巴西现代史上留下显著痕迹的少数外籍专家之一。"
 CBIO_BRA_alvaro_alberto_da_motta_e_silva_desc:0 "阿尔瓦罗·阿尔贝托·达·莫塔-席尔瓦，1889年4月22日生于里约热内卢，1976年1月31日卒，巴西海军中将兼科学家，巴西核能事业的奠基人，在外交与科研两个领域均留有重要遗产。早年就读海军学校，深入化学与核物理研究，1916年起于海军学校讲授化学与爆炸物，1939年将核物理正式纳入教学体系，在巴西军事教育界率先播下核科学种子。1935至1937年及1949至1951年两度担任巴西科学院院长。二战结束后，他代表巴西出席纽约联合国原子能委员会：1946年以强硬立场反对美国主导的“巴鲁克计划”——该计划意图将全球铀、钍资源控制权集于美国之手——并于同年经全票推举出任联合国原子能委员会主席，在核技术国际谈判中担任调解人至1947年。1951年，在瓦加斯支持下主导创建国家研究委员会，任首任主席，致力于核原料出口管制与本国技术自主研发，推动以“补偿性技术交换”原则争取西德离心机技术。1954年瓦加斯自杀后，亲美路线接管政府，阿尔瓦罗·阿尔贝托遭指控管理失当并被迫辞职。安格拉核电站综合体至今以其命名，巴西首艘在建核潜艇亦将冠以“阿尔瓦罗·阿尔贝托”之名。"
 CBIO_BRA_alvaro_alberto_motta_silva_desc:0 "阿尔瓦罗·阿尔贝托·达·莫塔-席尔瓦，1889年4月22日生于里约热内卢，1976年1月31日卒，巴西海军中将兼科学家，巴西核能事业的奠基人，在外交与科研两个领域均留有重要遗产。早年就读海军学校，深入化学与核物理研究，1916年起于海军学校讲授化学与爆炸物，1939年将核物理正式纳入教学体系，在巴西军事教育界率先播下核科学种子。1935至1937年及1949至1951年两度担任巴西科学院院长。二战结束后，他代表巴西出席纽约联合国原子能委员会：1946年以强硬立场反对美国主导的“巴鲁克计划”——该计划意图将全球铀、钍资源控制权集于美国之手——并于同年经全票推举出任联合国原子能委员会主席，在核技术国际谈判中担任调解人至1947年。1951年，在瓦加斯支持下主导创建国家研究委员会，任首任主席，致力于核原料出口管制与本国技术自主研发，推动以“补偿性技术交换”原则争取西德离心机技术。1954年瓦加斯自杀后，亲美路线接管政府，阿尔瓦罗·阿尔贝托遭指控管理失当并被迫辞职。安格拉核电站综合体至今以其命名，巴西首艘在建核潜艇亦将冠以“阿尔瓦罗·阿尔贝托”之名。"
 CBIO_BRA_alvaro_de_castro_desc:0 "阿尔瓦罗·菲乌萨·德·卡斯特罗（1889年—1971年）是巴西陆军将领，后晋为元帅。其军旅生涯跨越巴西第一共和国、瓦加斯时代和第二次世界大战时期，长期在陆军系统任职。第二次世界大战期间，他列入巴西高级将领序列；战后继续在陆军高层任职，曾出任陆军总参谋长等职。1971年逝世。"
 CBIO_BRA_anisio_teixeira_desc:0 "阿尼西奥·斯皮诺拉·特谢拉，1900年7月12日生于巴伊亚州卡埃泰，1971年3月卒于里约热内卢，巴西20世纪最重要的教育改革家，“新学校运动”最具影响力的倡导者，终其一生致力于建立公立、免费、世俗的全民教育体系，数度遭受威权政权迫害。他出身地主家庭，早年在巴伊亚接受耶稣会教育，1922年获法学学位；1927年赴美，在哥伦比亚大学师范学院钻研约翰·杜威的实用主义教育哲学，此后将杜威思想系统引入巴西教育改革实践。1931年出任里约热内卢联邦区教育局长，次年联署《教育新先驱宣言》，呼吁建立以民主与科学为基础的国家教育体系。1935年与逐渐保守化的瓦加斯政权产生冲突，被迫辞职，其创办的联邦区大学随后遭新国家政权取缔。战后重返教育主流，任国家教育研究所所长（1952—1964年），深度参与巴西利亚大学的创建规划，并于1963年出任该校首任校长。1964年军事政变后再度遭到迫害，被驱逐出职位。1971年，其遗体在里约热内卢一幢建筑的电梯井中被发现，死因至今成谜，疑与政治迫害有关。2024年被巴西正式追封为全国公立学校守护人。"
 CBIO_BRA_apolonio_carvalho_desc:0 "阿波洛尼奥·平托·德·卡瓦略，1912年2月9日生于马托格罗索州，2005年9月23日卒，巴西军官出身的社会主义活动家，20世纪巴西左翼运动中历经跨国革命战场最为传奇的人物之一。出身军人家庭，18岁入雷亚伦戈军校成为职业军官，同期逐渐接近共产主义思想。1935年加入民族解放联盟，参与同年11月的共产主义起义，此后被剥夺军籍。离开巴西后，他赴西班牙，以“国际旅”志愿兵身份在共和国一方参加西班牙内战；共和国覆亡后滞留法国，纳粹占领期间投身法国抵抗运动，一路晋升至法国陆军上校，因卓越战功荣获法国荣誉军团勋章，被法国视为抗德英雄。1946年返回巴西，重新加入巴西共产党，但1964年军事政变后再度被迫转入地下；1970年遭逮捕并遭受酷刑，后被列入与40名政治犯一并换回被劫持的西德大使冯·霍伦贝恩的交换名单，流亡法国。1979年大赦后返国，1980年参与创建劳工党并曾担任副主席，晚年仍持续进行政治写作与公开发声。"
 CBIO_BRA_apolonio_de_carvalho_desc:0 "阿波洛尼奥·平托·德·卡瓦略，1912年2月9日生于马托格罗索州，2005年9月23日卒，巴西军官出身的社会主义活动家，20世纪巴西左翼运动中历经跨国革命战场最为传奇的人物之一。出身军人家庭，18岁入雷亚伦戈军校成为职业军官，同期逐渐接近共产主义思想。1935年加入民族解放联盟，参与同年11月的共产主义起义，此后被剥夺军籍。离开巴西后，他赴西班牙，以“国际旅”志愿兵身份在共和国一方参加西班牙内战；共和国覆亡后滞留法国，纳粹占领期间投身法国抵抗运动，一路晋升至法国陆军上校，因卓越战功荣获法国荣誉军团勋章，被法国视为抗德英雄。1946年返回巴西，重新加入巴西共产党，但1964年军事政变后再度被迫转入地下；1970年遭逮捕并遭受酷刑，后被列入与40名政治犯一并换回被劫持的西德大使冯·霍伦贝恩的交换名单，流亡法国。1979年大赦后返国，1980年参与创建劳工党并曾担任副主席，晚年仍持续进行政治写作与公开发声。"
 CBIO_BRA_arlindo_veiga_dos_santos_desc:0 "阿林多·维加·卡布拉尔·多斯桑托斯，1902年2月12日生于圣保罗州伊图，1978年卒，非裔巴西作家、诗人、记者与政治活动家，在黑人民权运动与保皇主义复辟这两条看似相悖的路线上同时留下印记，是20世纪上半叶巴西最具矛盾性的政治知识分子之一。幼年接受耶稣会教育，1925年毕业于圣保罗哲学与文学学院，此后以教职和新闻为业，并在天主教保守主义圈子中积累影响力。1931年9月16日，他作为创始人之一出任首届主席，领导创立巴西黑人阵线，这一组织迅速成为后废奴时代规模最大的非裔巴西人政治组织，在教育、社会救助与反歧视行动等多条战线展开工作。然而他的政治立场颇为复杂：他将黑人民权斗争与天主教民族主义和君主制复辟理念相结合，致力于将非裔巴西人纳入其“新祖国行动”的保皇主义框架；与此同时，他还参与与普利尼奥·萨尔加多共同创建统合主义研究核心（政治研究学会），此举使他与黑人阵线内部的进步派产生深刻裂痕，并于1934年辞去主席职务。1956年当选圣保罗历史地理研究所会员，此后仍持续著述。"
 CBIO_BRA_arlindo_veiga_santos_desc:0 "阿林多·维加·卡布拉尔·多斯桑托斯，1902年2月12日生于圣保罗州伊图，1978年卒，非裔巴西作家、诗人、记者与政治活动家，在黑人民权运动与保皇主义复辟这两条看似相悖的路线上同时留下印记，是20世纪上半叶巴西最具矛盾性的政治知识分子之一。幼年接受耶稣会教育，1925年毕业于圣保罗哲学与文学学院，此后以教职和新闻为业，并在天主教保守主义圈子中积累影响力。1931年9月16日，他作为创始人之一出任首届主席，领导创立巴西黑人阵线，这一组织迅速成为后废奴时代规模最大的非裔巴西人政治组织，在教育、社会救助与反歧视行动等多条战线展开工作。然而他的政治立场颇为复杂：他将黑人民权斗争与天主教民族主义和君主制复辟理念相结合，致力于将非裔巴西人纳入其“新祖国行动”的保皇主义框架；与此同时，他还参与与普利尼奥·萨尔加多共同创建统合主义研究核心（政治研究学会），此举使他与黑人阵线内部的进步派产生深刻裂痕，并于1934年辞去主席职务。1956年当选圣保罗历史地理研究所会员，此后仍持续著述。"
 CBIO_BRA_armando_de_sales_oliveira_desc:0 "阿曼多·萨莱斯·奥利韦拉，1887年12月24日生于圣保罗，1945年5月17日卒于同地，巴西土木工程师、报业人及政治家，旧共和国体制瓦解后崛起于圣保罗精英阶层的自由主义代表人物之一。毕业于圣保罗理工学院，后通过婚姻与《圣保罗州报》创办人家族结为姻亲并接手管理该报，以其作为政治运动的重要舆论平台。参与1932年圣保罗立宪革命后，1933年受瓦加斯任命为圣保罗联邦干预长，1935年经制宪议会选举正式出任州长；任内主持创建圣保罗大学，从欧美延揽知名学者赴巴执教，为巴西现代高等教育体系建立奠定重要基础。1936年底辞去州长职务，宣布角逐原定1938年1月举行的总统选举，以自由主义旗帜代表立宪党出征，与政府属意的若泽·阿梅里科·德·阿尔梅达及统合主义领袖萨尔加多形成三方格局。然而1937年11月瓦加斯发动政变宣布“新国家”，选举就此取消；他随即遭软禁，次年流亡法国，后辗转美国与阿根廷，期间持续发表声明抨击独裁统治。1945年大赦后返国，虽参与民主联盟创建工作，但健康已大幅恶化，同年5月即告辞世。"
 CBIO_BRA_armando_sales_oliveira_desc:0 "阿曼多·萨莱斯·奥利韦拉，1887年12月24日生于圣保罗，1945年5月17日卒于同地，巴西土木工程师、报业人及政治家，旧共和国体制瓦解后崛起于圣保罗精英阶层的自由主义代表人物之一。毕业于圣保罗理工学院，后通过婚姻与《圣保罗州报》创办人家族结为姻亲并接手管理该报，以其作为政治运动的重要舆论平台。参与1932年圣保罗立宪革命后，1933年受瓦加斯任命为圣保罗联邦干预长，1935年经制宪议会选举正式出任州长；任内主持创建圣保罗大学，从欧美延揽知名学者赴巴执教，为巴西现代高等教育体系建立奠定重要基础。1936年底辞去州长职务，宣布角逐原定1938年1月举行的总统选举，以自由主义旗帜代表立宪党出征，与政府属意的若泽·阿梅里科·德·阿尔梅达及统合主义领袖萨尔加多形成三方格局。然而1937年11月瓦加斯发动政变宣布“新国家”，选举就此取消；他随即遭软禁，次年流亡法国，后辗转美国与阿根廷，期间持续发表声明抨击独裁统治。1945年大赦后返国，虽参与民主联盟创建工作，但健康已大幅恶化，同年5月即告辞世。"
 CBIO_BRA_artur_costa_e_silva_desc:0 "阿图尔·达·科斯塔·席尔瓦（1899年—1969年）是巴西陆军元帅，生于南里奥格兰德州塔夸里。青年时代入阿雷格里港军校，后升入雷亚伦戈军事学校深造。1922年，他以少尉身份参与科帕卡巴纳要塞起义，此后被关押六个月。1930年，他支持热图利奥·瓦加斯领导的自由联盟革命，进入新政权的军事体系。第二次世界大战期间，科斯塔·席尔瓦随巴西远征军赴意大利作战，参加哥特防线一带行动。1945年瓦加斯政权倒台时，他又与军方高层共同参与迫使瓦加斯交权的行动。战后继续在陆军中晋升，后成为1964年军事政变后的军政府重要人物，并于1967年至1969年任巴西总统。"
 CBIO_BRA_artur_da_costa_e_silva_desc:0 "阿图尔·达·科斯塔·席尔瓦（1899年—1969年）是巴西陆军元帅，生于南里奥格兰德州塔夸里。青年时代入阿雷格里港军校，后升入雷亚伦戈军事学校深造。1922年，他以少尉身份参与科帕卡巴纳要塞起义，此后被关押六个月。1930年，他支持热图利奥·瓦加斯领导的自由联盟革命，进入新政权的军事体系。第二次世界大战期间，科斯塔·席尔瓦随巴西远征军赴意大利作战，参加哥特防线一带行动。1945年瓦加斯政权倒台时，他又与军方高层共同参与迫使瓦加斯交权的行动。战后继续在陆军中晋升，后成为1964年军事政变后的军政府重要人物，并于1967年至1969年任巴西总统。"
 CBIO_BRA_augusto_fragoso_desc:0 "奥古斯托·塔索·弗拉戈索，1869年8月28日生于马拉尼昂州圣路易斯，1945年9月20日卒于里约热内卢，巴西历史上独特的“非政治性将领”，马拉尼昂州有史以来第一位出任国家最高领导人的人物。他于1889年11月15日参与推翻帝制、建立共和国的行动，亦与年轻的坎迪多·龙东并肩在那一历史夜晚确认了海军的支持立场。此后数十年间，他在军中埋头专业，于1922至1929年间出任陆军总参谋长，任内推动义务兵制建设与军队现代化。1930年，旧共和国走向瓦解，本无政治野心的他起初拒绝参与武装革命，但当全国武装对峙局势日趋失控，他以现役最高资历长官身份接受同僚请托，于10月24日与梅纳·巴雷托将军、诺罗尼亚海军上将共同组建三人过渡军政府，迫使旧共和国末任总统华盛顿·路易斯离职，随即于11月3日将权力移交给热图利奥·瓦加斯，自身退出政治舞台。此后他出任最高军事法庭法官（1933—1938年），并以史学家身份著成五卷本《巴拉圭战争史》（1934年），是巴西军事史研究的奠基之作之一。"
 CBIO_BRA_augusto_rademaker_desc:0 "奥古斯托·哈曼·拉德马克·格吕内瓦尔德（1905年—1985年）是巴西海军上将，生于里约热内卢，具有德国与丹麦血统。1927年入役巴西海军，此后长期在舰队和海军指挥系统任职。第二次世界大战及战后时期，他逐步升入海军高层，曾任大西洋防御区中央司令部长官等职。1964年军事政变中，拉德马克以海军代表身份参与军方行动，随后出任海军部长，先后辅佐卡斯特洛·布兰科与科斯塔·席尔瓦两届军政府。1969年8月至10月，他与廖·塔瓦雷斯、马尔西奥·梅洛组成三人军政府，短暂行使国家最高权力。"
 CBIO_BRA_augusto_tasso_fragoso_desc:0 "奥古斯托·塔索·弗拉戈索，1869年8月28日生于马拉尼昂州圣路易斯，1945年9月20日卒于里约热内卢，巴西历史上独特的“非政治性将领”，马拉尼昂州有史以来第一位出任国家最高领导人的人物。他于1889年11月15日参与推翻帝制、建立共和国的行动，亦与年轻的坎迪多·龙东并肩在那一历史夜晚确认了海军的支持立场。此后数十年间，他在军中埋头专业，于1922至1929年间出任陆军总参谋长，任内推动义务兵制建设与军队现代化。1930年，旧共和国走向瓦解，本无政治野心的他起初拒绝参与武装革命，但当全国武装对峙局势日趋失控，他以现役最高资历长官身份接受同僚请托，于10月24日与梅纳·巴雷托将军、诺罗尼亚海军上将共同组建三人过渡军政府，迫使旧共和国末任总统华盛顿·路易斯离职，随即于11月3日将权力移交给热图利奥·瓦加斯，自身退出政治舞台。此后他出任最高军事法庭法官（1933—1938年），并以史学家身份著成五卷本《巴拉圭战争史》（1934年），是巴西军事史研究的奠基之作之一。"
 CBIO_BRA_benedito_valadares_desc:0 "贝内迪托·瓦拉达雷斯·里贝罗，1892年12月4日生于米纳斯吉拉斯州帕拉·德·米纳斯，1973年3月2日卒于里约热内卢，巴西历史上在职时间最长的州行政长官之一，以对热图利奥·瓦加斯近乎绝对的政治忠诚而著称。他早年从事新闻业并投身基层政务；1930年革命后，因在圣保罗立宪革命中辅佐联邦军方立下功勋，以名不见经传的联邦众议员身份获得瓦加斯青睐，于1933年12月出任米纳斯吉拉斯联邦干预长，此举令各方大感意外，引发民间“他是谁？”的流传。他在任长达十二年（1933—1945年），贯穿立宪时代与新国家独裁两个时期，始终是瓦加斯在巴西最重要一州的核心政治支柱。任内他提拔了若泽利诺·库比契克出任贝洛奥里藏特市长（1940年），并发掘了坦克雷多·内维斯等未来政治家的才能。1937年，他代表瓦加斯遍访各州，协调铺垫新国家政变的政治环境。1945年瓦加斯下台后，他参与创建社会民主党并出任首届主席，继续在战后政治中扮演重要角色。今日巴西地名“州长瓦拉达雷斯市”即以其命名。"
 CBIO_BRA_benedito_valadres_desc:0 "贝内迪托·瓦拉达雷斯·里贝罗，1892年12月4日生于米纳斯吉拉斯州帕拉·德·米纳斯，1973年3月2日卒于里约热内卢，巴西历史上在职时间最长的州行政长官之一，以对热图利奥·瓦加斯近乎绝对的政治忠诚而著称。他早年从事新闻业并投身基层政务；1930年革命后，因在圣保罗立宪革命中辅佐联邦军方立下功勋，以名不见经传的联邦众议员身份获得瓦加斯青睐，于1933年12月出任米纳斯吉拉斯联邦干预长，此举令各方大感意外，引发民间“他是谁？”的流传。他在任长达十二年（1933—1945年），贯穿立宪时代与新国家独裁两个时期，始终是瓦加斯在巴西最重要一州的核心政治支柱。任内他提拔了若泽利诺·库比契克出任贝洛奥里藏特市长（1940年），并发掘了坦克雷多·内维斯等未来政治家的才能。1937年，他代表瓦加斯遍访各州，协调铺垫新国家政变的政治环境。1945年瓦加斯下台后，他参与创建社会民主党并出任首届主席，继续在战后政治中扮演重要角色。今日巴西地名“州长瓦拉达雷斯市”即以其命名。"
 CBIO_BRA_candido_mariano_desc:0 "坎迪多·马里亚诺·达·席尔瓦·龙东，1865年5月5日生于马托格罗索州米莫苏，1958年1月19日卒于里约热内卢，享年92岁，巴西陆军元帅、探险家与土著民族权利捍卫者，其一生几乎横跨整个共和时代，是20世纪巴西最受崇仰的国家英雄之一。他出身微寒，父母均于童年前后相继去世，由亲戚抚养成人，后凭顽强意志进入军事学校；1889年11月15日共和政变当夜，他以学员身份参与推翻帝制的行动，与塔索·弗拉戈索共同确认了海军立场。此后数十年，他率领“龙东委员会”深入亚马孙腹地铺设电报线路，发现多条未知河流与数十个未经接触的土著部落；其原则是“必要时宁可死亡，绝不杀人”，即便曾被毒箭所伤亦拒绝报复。1913至1914年，他与前美国总统西奥多·罗斯福共同领导亚马孙探险，深入“疑惑之河”（今罗斯福河），罗斯福险些丧命，全赖龙东出手相救。他创建并长期主持印第安人保护局，后演变为FUNAI，倡导以和平方式将土著人纳入现代巴西，而非强制同化或驱逐。1934至1938年，他主持斡旋哥伦比亚与秘鲁之间的莱蒂西亚领土争端。1955年90岁生日当天，国会立法晋升他为元帅；1957年，他获纽约探险家俱乐部提名角逐诺贝尔和平奖。巴西西北部的朗多尼亚州以其姓氏命名。"
 CBIO_BRA_candido_rondon_desc:0 "坎迪多·马里亚诺·达·席尔瓦·龙东，1865年5月5日生于马托格罗索州米莫苏，1958年1月19日卒于里约热内卢，享年92岁，巴西陆军元帅、探险家与土著民族权利捍卫者，其一生几乎横跨整个共和时代，是20世纪巴西最受崇仰的国家英雄之一。他出身微寒，父母均于童年前后相继去世，由亲戚抚养成人，后凭顽强意志进入军事学校；1889年11月15日共和政变当夜，他以学员身份参与推翻帝制的行动，与塔索·弗拉戈索共同确认了海军立场。此后数十年，他率领“龙东委员会”深入亚马孙腹地铺设电报线路，发现多条未知河流与数十个未经接触的土著部落；其原则是“必要时宁可死亡，绝不杀人”，即便曾被毒箭所伤亦拒绝报复。1913至1914年，他与前美国总统西奥多·罗斯福共同领导亚马孙探险，深入“疑惑之河”（今罗斯福河），罗斯福险些丧命，全赖龙东出手相救。他创建并长期主持印第安人保护局，后演变为FUNAI，倡导以和平方式将土著人纳入现代巴西，而非强制同化或驱逐。1934至1938年，他主持斡旋哥伦比亚与秘鲁之间的莱蒂西亚领土争端。1955年90岁生日当天，国会立法晋升他为元帅；1957年，他获纽约探险家俱乐部提名角逐诺贝尔和平奖。巴西西北部的朗多尼亚州以其姓氏命名。"
 CBIO_BRA_cristovao_castro_barcelos_desc:0 "克里斯托旺·德·卡斯特罗·巴塞洛斯，1883年生，1946年卒，巴西将领，职业军事生涯横跨两次世界大战。第一次世界大战期间，他赴法国圣西尔军事学院研习（1917年），并以军官身份在法国第17龙骑兵团参加一战实战，是亲历欧洲战场炮火的少数巴西军人之一。战间期，他在巴西军队中稳步晋升，历任多项要职；1935年里约热内卢州州长选举中，他以一票之差惜败于海军将领普罗托格内斯·吉马良斯，与政界缘悭一面。1944年至1946年间出任巴西陆军总参谋长，任内适逢巴西远征军远赴意大利作战，他承担后方最高军事协调职能，并辅佐完成了1945年战后的胜利返师工作。他是巴西军界早期公开倡议将首都迁往内陆更居中地点的将领之一，这一构想数十年后在库比契克总统任内得到落实，成为巴西利亚建设的远源之一。"
 CBIO_BRA_cristovao_de_castro_desc:0 "克里斯托旺·德·卡斯特罗·巴塞洛斯，1883年生，1946年卒，巴西将领，职业军事生涯横跨两次世界大战。第一次世界大战期间，他赴法国圣西尔军事学院研习（1917年），并以军官身份在法国第17龙骑兵团参加一战实战，是亲历欧洲战场炮火的少数巴西军人之一。战间期，他在巴西军队中稳步晋升，历任多项要职；1935年里约热内卢州州长选举中，他以一票之差惜败于海军将领普罗托格内斯·吉马良斯，与政界缘悭一面。1944年至1946年间出任巴西陆军总参谋长，任内适逢巴西远征军远赴意大利作战，他承担后方最高军事协调职能，并辅佐完成了1945年战后的胜利返师工作。他是巴西军界早期公开倡议将首都迁往内陆更居中地点的将领之一，这一构想数十年后在库比契克总统任内得到落实，成为巴西利亚建设的远源之一。"
 CBIO_BRA_domingos_bras_desc:0 "多明戈斯·布拉斯是巴西织工、工会活动家和共产党政治人物。早年在彼得罗波利斯参与纺织工人运动，1925年被捕后被送往北部边境的克利夫兰迪亚惩戒殖民地，并曾通过无政府主义报刊揭露当地囚犯处境。1930年前后回到里约热内卢后，他继续参与工人政治活动，加入巴西共产党，并在1932年至1933年间担任党的总书记。布拉斯支持由工人干部掌握党内领导权，并卷入巴西共产党早期关于组织路线和知识分子作用的争论。"
 CBIO_BRA_eduardo_gomes_desc:0 "爱德华多·戈梅斯，1896年9月20日生于里约热内卢州彼得罗波利斯，1981年6月13日卒，巴西空军元帅与政治家，“中尉运动”时代最具传奇色彩的幸存者与巴西空军的奠基人之一。1921年入读军事航空学校，次年7月5日以初级军官身份参与科帕卡巴纳要塞起义；起义被镇压，大多数参与者阵亡，仅有“十八勇士”坚持沿科帕卡巴纳海滩向政府军阵地走去——戈梅斯是极少数存活者之一，身负重伤后方告获救。此后，他继续参与1924年圣保罗中尉派起义，一度入狱，1930年支持瓦加斯革命，1935年共产主义起义期间则转而参与镇压。1941年巴西空军正式成立，他是核心创建将领，后被追封为空军保护人。在政治上，他是反瓦加斯的民主联盟的代表性人物，分别于1945年（败于杜特拉）与1950年（败于瓦加斯本人）两度参选总统均告落败；1945年竞选期间，支持者在集会上分发用炼乳、黄油与可可粉制成的巧克力小球，因他持有准将军衔，这款甜点由此得名“准将糖”，延续至今成为巴西最具代表性的国民甜品。"
 CBIO_BRA_eduardo_guedes_desc:0 "爱德华多·格德斯·阿尔科福拉多（1883年—1945年）是巴西陆军将领，活跃于瓦加斯时代的军政体系。1930年代末，巴西军方高层在戈伊斯·蒙泰罗、欧里科·杜特拉等人影响下逐渐进入政权核心，格德斯·阿尔科福拉多也在这一时期进入高级指挥层。1939年，戈伊斯·蒙泰罗因病离职后，格德斯·阿尔科福拉多曾接替其承担总参谋系统的重要职务。1945年逝世。"
 CBIO_BRA_epaminondas_dos_santos_desc:0 "伊巴密浓达·戈梅斯·多斯桑托斯，1891年11月4日生于里约热内卢，1978年7月11日卒于同地，巴西军官与政治家，以极短暂的航空部长任期与巴西共和史上最具戏剧性的政治时刻相联系。他在军队历练多年，进入航空领域行政体系；1954年8月，瓦加斯政府笼罩在严峻的政治危机之下——围绕暗杀记者卡洛斯·拉塞达未遂案、军方施压总统辞职等事件不断发酵——他在8月18日出任航空部长，仅仅六天后（8月24日），瓦加斯自杀身亡，他随即去职，这一极短暂的部长任期成为他最显著的历史印记。此后，他投身政治，于1964年3月以补缺形式接任联邦众议员席位，但随即遭到4月军事政变后颁布的第一号机构法令冲击，被剥夺政治权利十年。"
 CBIO_BRA_epaminondas_gomes_santos_desc:0 "伊巴密浓达·戈梅斯·多斯桑托斯，1891年11月4日生于里约热内卢，1978年7月11日卒于同地，巴西军官与政治家，以极短暂的航空部长任期与巴西共和史上最具戏剧性的政治时刻相联系。他在军队历练多年，进入航空领域行政体系；1954年8月，瓦加斯政府笼罩在严峻的政治危机之下——围绕暗杀记者卡洛斯·拉塞达未遂案、军方施压总统辞职等事件不断发酵——他在8月18日出任航空部长，仅仅六天后（8月24日），瓦加斯自杀身亡，他随即去职，这一极短暂的部长任期成为他最显著的历史印记。此后，他投身政治，于1964年3月以补缺形式接任联邦众议员席位，但随即遭到4月军事政变后颁布的第一号机构法令冲击，被剥夺政治权利十年。"
 CBIO_BRA_euclides_zenobio_costa_desc:0 "欧克利德斯·泽诺比奥·达·科斯塔，1893年5月9日生于马托格罗索州科伦巴，1963年10月29日卒于里约热内卢，巴西陆军元帅，以在意大利战场指挥巴西远征军步兵并攻克险峻的蒙特卡斯特洛阵地而留名史册。毕业于里约热内卢军事学校，1924年曾参与平息中尉运动叛乱；1930年有限度地支持推翻华盛顿·路易斯的革命；1932年立宪革命期间，他以联邦军官身份在帕拉伊巴河谷参与平叛，因表现出色获擢升。1944年7月，他率FEB第一波编队启程赴意大利，出任步兵指挥官，参加同盟国第五集团军序列下的哥特防线攻坚战役；1945年2月21日，他在阵前亲自统一指挥，以第1步兵团强袭蒙特卡斯特洛，仅约十五分钟即攻克这处被视为几乎无法强取的制高点，打开了FEB此后连续挺进、直抵都灵（1945年5月1日）的战略通道。战后，他因政治立场保守，在军内民族主义与国际主义路线博弈中被一些FEB老兵视为“国际主义派”，立场具有争议性。1954年出任瓦加斯政府陆军部长，任内在政治危机高峰中态度模糊，目睹了瓦加斯的自杀；此后，他支持库比契克顺利就职，并于1957年以元帅军衔转入预备役。"
 CBIO_BRA_euclides_zenobio_da_costa_desc:0 "欧克利德斯·泽诺比奥·达·科斯塔，1893年5月9日生于马托格罗索州科伦巴，1963年10月29日卒于里约热内卢，巴西陆军元帅，以在意大利战场指挥巴西远征军步兵并攻克险峻的蒙特卡斯特洛阵地而留名史册。毕业于里约热内卢军事学校，1924年曾参与平息中尉运动叛乱；1930年有限度地支持推翻华盛顿·路易斯的革命；1932年立宪革命期间，他以联邦军官身份在帕拉伊巴河谷参与平叛，因表现出色获擢升。1944年7月，他率FEB第一波编队启程赴意大利，出任步兵指挥官，参加同盟国第五集团军序列下的哥特防线攻坚战役；1945年2月21日，他在阵前亲自统一指挥，以第1步兵团强袭蒙特卡斯特洛，仅约十五分钟即攻克这处被视为几乎无法强取的制高点，打开了FEB此后连续挺进、直抵都灵（1945年5月1日）的战略通道。战后，他因政治立场保守，在军内民族主义与国际主义路线博弈中被一些FEB老兵视为“国际主义派”，立场具有争议性。1954年出任瓦加斯政府陆军部长，任内在政治危机高峰中态度模糊，目睹了瓦加斯的自杀；此后，他支持库比契克顺利就职，并于1957年以元帅军衔转入预备役。"
 CBIO_BRA_eurico_gaspar_dutra_desc:0 "欧里科·加斯帕尔·杜特拉，1883年5月18日生于马托格罗索州库亚巴，1974年6月11日卒于里约热内卢，享年91岁，巴西陆军元帅与政治家，以瓦加斯时代最重要的军政枢纽人物之一及战后首位民主选举总统的双重身份留名史册。他早年入读军事学校，1910年获少尉军衔，历经第一共和国多个政治节点；1922年曾以效忠立场参与镇压中尉运动，1932年率部平息圣保罗立宪革命，1935年以第一军区司令身份主导镇压里约共产主义起义。1936年，他就任瓦加斯政府陆军部长（任至1945年），任内推动军队现代化并主持组建、装备和派遣巴西远征军赴意大利参加二战——尽管他本人起初持亲德中立立场，直至局势明朗后方转向支持联盟国。1945年，他参与联合其他军方将领迫使瓦加斯去职的行动；同年12月当选总统，并获流亡下野的瓦加斯本人公开背书，于1946年1月31日就职，开启巴西第四共和国。任内他颁布1946年宪法恢复民主秩序，于1947年宣布共产党非法、断绝与苏联外交关系，于1948年在美国协助下创建巴西最高战争学校，并启动杜特拉总统公路（连接里约与圣保罗）等基础设施工程；年均经济增长7.6%。1951年1月任满卸职，此后仍在幕后活动至晚年，1974年平静辞世。"
 CBIO_BRA_filinto_muller_desc:0 "菲林托·斯特吕宾·穆勒，1900年7月11日生于马托格罗索州库亚巴，1973年7月11日卒于法国巴黎近郊，正为其73岁生日，巴西政治家，以新国家时代巴西历史上最声名狼藉的警察头子之一著称，同日出生同日罹难——1973年，他乘坐的巴西航空瓦里格820航班在法国着陆时因机舱失火致大多数乘客死于一氧化碳中毒，他亦在其中。他19岁入伍，参与过中尉运动，后成为瓦加斯1930年革命的坚定支持者。从1933年4月至1942年7月，他出任联邦区警察总长，任期长达九年，是新国家镇压机器的核心执行者——他的警察体系与纳粹德国盖世太保保持主动协作关系（他曾于1937年应海因里希·希姆莱之邀访问德国），强力打压共产党人与其他反对者，并于1936年9月直接主导将身怀六甲的奥尔加·贝纳里奥·普列斯特斯（#51）驱逐出境遣返纳粹德国——她后来死于集中营。他还主动阻止犹太难民进入巴西，并协调对左翼人士施以酷刑的逮捕行动。1942年，随着巴西对轴心国宣战，他因亲德立场被撤职。1945年参与创建社会民主党，其后历届担任马托格罗索州参议员（1947、1955、1962年当选），在立法院活跃至晚年。"
 CBIO_BRA_floriano_de_lima_brayner_desc:0 "弗洛里亚诺·德·利马·布赖纳，1897年1月2日生于帕拉伊巴州若昂·佩索阿，1983年2月3日卒于里约热内卢，巴西陆军元帅，以第二次世界大战期间担任巴西远征军参谋长而在史册上留名，亦因战后一部充满争议的回忆录而在FEB老兵圈子中饱受诟病。他出身职业军人，毕业于雷亚伦戈军事学校，1925年曾参与追剿普列斯特斯纵队的军事行动。二战前夕，他赴美国莱文沃斯指挥与参谋学院受训；1944年1月，他以上校参谋长身份随第一步兵远征师随总司令马斯卡雷尼亚斯·德·莫赖斯将军一同出发赴那不勒斯，全程参与意大利哥特防线战役，是巴西军队在欧洲战场最重要的参谋军官之一。战后，他出任总统军事办公室主任（1955—1956年）与陆军总参谋长（1959—1961年），并担任最高军事法庭部长（1961—1967年）直至荣休晋升元帅。1968年，他出版回忆录《FEB真相》，书中对总司令马斯卡雷尼亚斯多有批评，引发强烈反弹，被大多数FEB老兵视为背叛，此后他几乎被排斥于远征军退伍军人群体之外；此后数年他陆续出版修正性著作，试图弥合这一历史裂痕。"
 CBIO_BRA_floriano_lima_brayner_desc:0 "弗洛里亚诺·德·利马·布赖纳，1897年1月2日生于帕拉伊巴州若昂·佩索阿，1983年2月3日卒于里约热内卢，巴西陆军元帅，以第二次世界大战期间担任巴西远征军参谋长而在史册上留名，亦因战后一部充满争议的回忆录而在FEB老兵圈子中饱受诟病。他出身职业军人，毕业于雷亚伦戈军事学校，1925年曾参与追剿普列斯特斯纵队的军事行动。二战前夕，他赴美国莱文沃斯指挥与参谋学院受训；1944年1月，他以上校参谋长身份随第一步兵远征师随总司令马斯卡雷尼亚斯·德·莫赖斯将军一同出发赴那不勒斯，全程参与意大利哥特防线战役，是巴西军队在欧洲战场最重要的参谋军官之一。战后，他出任总统军事办公室主任（1955—1956年）与陆军总参谋长（1959—1961年），并担任最高军事法庭部长（1961—1967年）直至荣休晋升元帅。1968年，他出版回忆录《FEB真相》，书中对总司令马斯卡雷尼亚斯多有批评，引发强烈反弹，被大多数FEB老兵视为背叛，此后他几乎被排斥于远征军退伍军人群体之外；此后数年他陆续出版修正性著作，试图弥合这一历史裂痕。"
 CBIO_BRA_floriano_peixoto_desc:0 "弗洛里亚诺·佩肖托·法里亚·利马，1917年11月15日生于里约热内卢，巴西海军军官、政治人物。1933年进入海军学校，后长期在海军服役，曾任累西腓水兵学徒学校指挥官、总统府军事内阁海军副主任、驻美国和加拿大使馆海军武官，并升至副海军上将。军政府时期，他转入国家能源与行政体系，1973年至1974年任巴西石油公司总裁。1975年瓜纳巴拉州与里约热内卢州合并后，他出任新里约热内卢州首任州长，任内推动州政整合、里约地铁一期工程和安格拉核电工程等项目。1979年卸任后转入私营领域，2011年7月9日在里约热内卢去世。"
 CBIO_BRA_francisco_campos_desc:0 "弗朗西斯科·路易斯·达·席尔瓦·坎波斯，1891年11月18日生于米纳斯吉拉斯州多雷斯·杜因代阿，1968年11月1日卒于贝洛奥里藏特，巴西法学家、教育家与政治家，两度以法律文字为威权政体奠基，是20世纪巴西宪政史上最具争议性的法律智识人物之一。早年从政于米纳斯吉拉斯，先后担任州众议员与州教育厅长。1930年革命后出任瓦加斯临时政府首任教育与卫生部长（1930—1932年），主导建立联邦大学体系并推行教师培训改革。1932年起担任临时司法部长，深度参与新国家独裁体制的法律建构；1937年11月10日，他以司法部长身份在政变前夕正式就职，主导起草并颁布1937年巴西宪法——因其参照波兰1935年权威主义宪法，该宪法在民间被称为“波兰式宪法”，明文赋予总统绝对权力并取消议会。他此后游离于主流政治边缘，但于1964年军事政变后再度现身，协助起草政变的法律依据——第一号机构法令，由此留下了贯穿两个独裁时代的威权宪政双重印记。"
 CBIO_BRA_geremia_lunardelli_desc:0 "热雷米亚·卢纳尔代利，1885年8月20日生于意大利特雷维索省曼苏埃，1962年5月9日卒于圣保罗，意大利裔巴西农业实业家，人称“咖啡之王”，是20世纪上半叶巴西乃至全球最大的咖啡生产者。他出生后约一岁即随家人移居巴西，先于圣保罗西部咖啡园以殖民工人身份劳作，后以多年积蓄买下小块土地，逐步扩张。至1920年代末，他的咖啡园已遍布圣保罗、巴拉那、马托格罗索等地，拥有约1500万至1800万棵咖啡树，并在戈亚斯与巴拉圭另有土地，是当时无可争议的全球最大单体咖啡生产者，由此获得“咖啡之王”的称号。1929年华尔街股灾引发的大萧条使咖啡价格崩溃，巴西政府大规模收购并焚毁积压的咖啡库存；但他在信用支撑与个人意志下安然度过危机，并趁价格低位扩大地产。1933年，他因对巴西农业的贡献荣获南十字星勋章；1940年正式归化巴西公民。他的传奇经历后来成为巴西电视台环球电视1996年热播连续剧《牛王》主人公格雷米亚·贝尔迪纳济的人物原型基础。"
 CBIO_BRA_geremia_lunarelli_desc:0 "热雷米亚·卢纳尔代利，1885年8月20日生于意大利特雷维索省曼苏埃，1962年5月9日卒于圣保罗，意大利裔巴西农业实业家，人称“咖啡之王”，是20世纪上半叶巴西乃至全球最大的咖啡生产者。他出生后约一岁即随家人移居巴西，先于圣保罗西部咖啡园以殖民工人身份劳作，后以多年积蓄买下小块土地，逐步扩张。至1920年代末，他的咖啡园已遍布圣保罗、巴拉那、马托格罗索等地，拥有约1500万至1800万棵咖啡树，并在戈亚斯与巴拉圭另有土地，是当时无可争议的全球最大单体咖啡生产者，由此获得“咖啡之王”的称号。1929年华尔街股灾引发的大萧条使咖啡价格崩溃，巴西政府大规模收购并焚毁积压的咖啡库存；但他在信用支撑与个人意志下安然度过危机，并趁价格低位扩大地产。1933年，他因对巴西农业的贡献荣获南十字星勋章；1940年正式归化巴西公民。他的传奇经历后来成为巴西电视台环球电视1996年热播连续剧《牛王》主人公格雷米亚·贝尔迪纳济的人物原型基础。"
 CBIO_BRA_getulio_vargas_desc:0 "热图利奥·多内利斯·瓦加斯，1882年4月19日生于南里奥格兰德州圣博尔亚，1954年8月24日于里约热内卢总统府自尽，巴西第14任及第17任总统，巴西20世纪最具影响力与争议的政治人物，以其跨越两个历史阶段、长达约二十年的统治深刻重塑了现代巴西的国家面貌。他出身里约格朗德南部权贵世家，早年短暂从军后转入法学，历任检察官、州众议员、联邦财政部长，1928年当选里约格朗德南州州长。1930年，在旧共和国“咖啡奶茶同盟”体制崩溃之际，他以自由联盟候选人身份参选总统，大选失利后联合军方于10月3日发动武装革命，同年11月3日以临时政府首脑身份入主里约热内卢。此后以提前选举、克制镇压1932年圣保罗立宪革命、1934年经制宪议会当选宪政总统等方式周旋于各政治力量之间，并于1935年镇压共产主义起义，借此积累政治资本；1937年11月10日，他以假造的“科恩计划”（共产政变阴谋）为借口，发动政变颁布威权宪法，宣布“新国家”，独裁统治延续至1945年。在社会经济层面，他推行劳工立法、建立最低工资制度、创立国家级工会体制、推动工业化与国有钢铁业（国家钢铁公司），赢得“穷人之父”称号。1945年10月，他在军方压力下辞职；1950年以压倒性优势再度民选当总统，继续推进国家资本主义路线，力争巴西石油主权。1954年8月，在保守军方与反对派报界的政治围攻逼至顶点之际，瓦加斯拒绝去职，以一颗射入胸膛的子弹和一封致辞慷慨的《临终遗书》结束生命，此举令支持者悲痛激愤，令反对者计划中的政治清算延迟数年。"
 CBIO_BRA_gois_monteiro_desc:0 "佩德罗·奥雷利奥·德·戈伊斯·蒙泰罗，1889年12月12日生于阿拉戈阿斯州圣路易斯·杜基廷迪，1956年10月16日卒，巴西陆军将领，被视为20世纪上半叶巴西军队政治化与国家安全理念建构的最核心推手之一，其在诸多历史关键节点上的幕后操盘能力使他与公众知名度不相称地扮演着“造王者”角色。出身阿拉戈阿斯蔗糖庄园世家，入读军事学校后在军中逐步崭露头角。1922年科帕卡巴纳要塞起义时，他以效忠立场协助维护政府权威；1930年革命中，他接受瓦加斯的邀约，担任革命武装的军事总指挥，率南部革命部队向里约热内卢推进，奠定了他在新政权中的核心地位。革命胜利后进入“黑色内阁”，与瓦加斯几乎每日会面，参与最初的权力布局。1932年指挥平息圣保罗立宪革命；1934年出任陆军部长（任至1935年），任内制定了国家安全学说的初稿，深刻影响了日后的镇压框架。1937年9月，他“发现”实为伪造的“科恩计划”，该计划被瓦加斯用作政变的舆论依据，建立新国家独裁。他本人亦曾有竞选总统之志但始终未能实现。1945年重返陆军部长职位，并于同年10月底联合军方将领主导了迫使瓦加斯下台的行动。战后当选阿拉戈阿斯参议员（1947年），1951至1952年出任三军联合参谋长，其后转任最高军事法庭直至辞世。"
 CBIO_BRA_gois_monterio_desc:0 "佩德罗·奥雷利奥·德·戈伊斯·蒙泰罗，1889年12月12日生于阿拉戈阿斯州圣路易斯·杜基廷迪，1956年10月16日卒，巴西陆军将领，被视为20世纪上半叶巴西军队政治化与国家安全理念建构的最核心推手之一，其在诸多历史关键节点上的幕后操盘能力使他与公众知名度不相称地扮演着“造王者”角色。出身阿拉戈阿斯蔗糖庄园世家，入读军事学校后在军中逐步崭露头角。1922年科帕卡巴纳要塞起义时，他以效忠立场协助维护政府权威；1930年革命中，他接受瓦加斯的邀约，担任革命武装的军事总指挥，率南部革命部队向里约热内卢推进，奠定了他在新政权中的核心地位。革命胜利后进入“黑色内阁”，与瓦加斯几乎每日会面，参与最初的权力布局。1932年指挥平息圣保罗立宪革命；1934年出任陆军部长（任至1935年），任内制定了国家安全学说的初稿，深刻影响了日后的镇压框架。1937年9月，他“发现”实为伪造的“科恩计划”，该计划被瓦加斯用作政变的舆论依据，建立新国家独裁。他本人亦曾有竞选总统之志但始终未能实现。1945年重返陆军部长职位，并于同年10月底联合军方将领主导了迫使瓦加斯下台的行动。战后当选阿拉戈阿斯参议员（1947年），1951至1952年出任三军联合参谋长，其后转任最高军事法庭直至辞世。"
 CBIO_BRA_gustavo_barroso_desc:0 "古斯塔沃·阿道尔福·路易斯·多特·达·库尼亚·巴罗佐，1888年12月29日生于塞阿拉州福塔莱萨，1959年12月3日卒于里约热内卢，巴西作家、历史学家、法学家与政治家，兼为国家历史博物馆首任馆长、巴西文学院成员，以及巴西统合主义行动中最极端的反犹主义理论家，被历史学界普遍认定为20世纪巴西最具代表性的反犹知识人物。他早年在塞阿拉从政，担任州内政与司法秘书长、联邦众议员，并参加了1919年巴黎和会的巴西代表团。同时以“若昂·杜诺尔特”为笔名从事民俗研究写作，积累了相当文化声誉。1933年，他加入普利尼奥·萨尔加多创立的巴西统合主义行动，迅速成为其主义理论核心人物之一，并出任AIB民兵司令（1934—1936年），在AIB最高委员会留有席位。他将西班牙文版《锡安长老会议纪要》译成葡萄牙语，还著有多部公开宣扬反犹阴谋论的政治著作；尽管统合主义在官方上声称反对种族主义，他与萨尔加多在此议题上的深刻分歧多次造成运动内部裂痕。1938年“睡衣政变”失败后遭逮捕，但因证据不足获释，随即退出政治活动。晚年在瓦加斯第二届政府任驻乌拉圭（1952年）与驻秘鲁（1954年）特使。"
 CBIO_BRA_henrique_aristides_guilhem_desc:0 "恩里克·阿里斯蒂德斯·吉扬，1875年生于里约热内卢，1949年1月3日卒于同地，巴西海军上将，曾长期担任巴西海军总参谋长与海军部长，是瓦加斯时代巴西海军建设最重要的主导者之一。他于1891年加入海军学校，历经数十年稳步晋升，于1934年晋升为海军中将。此后出任海军总参谋长，进而于1935年担任海军部长，任职长达十年，直至1945年瓦加斯下台。在他主管海军期间，巴西推进了重要的舰队建设：建造了卡里奥卡级布雷舰、马尔西利奥·迪亚斯级与亚马孙级驱逐舰，并完成了米纳斯吉拉斯号战列舰与胡迈塔号潜艇的现代化改造；他同时着力发展海军航空，沿海岸线铺设陆地机场、延伸海军航空邮政线路，为巴西海军在第二次世界大战期间参与南大西洋护航任务奠定了物质基础。"
 CBIO_BRA_henrique_teixeira_lott_desc:0 "恩里克·巴蒂斯塔·杜夫勒斯·特谢拉·洛特（1894年—1984年）是巴西陆军元帅、政治人物，生于米纳斯吉拉斯州安东尼奥·卡洛斯。1911年入伍，1916年获军官委任，后在巴西陆军中长期任职。1920至1930年代，他经历“中尉运动”、1930年革命、1932年立宪革命、1935年共产主义起义和1938年统合主义未遂政变等政治军事动荡，始终以纪律和服从合法政府著称。第二次世界大战期间，洛特任巴西远征军后方最高协调代表。1954年后出任陆军部长，并在1955年为确保当选总统库比契克就职而发动“预防性政变”。1960年竞选总统失败，1964年军事政变后因反对推翻合法政府而逐渐退出政坛。"
 CBIO_BRA_henry_ford_desc:0 "亨利·福特（1863年—1947年）是美国汽车工业家、福特汽车公司创办人，以流水线生产和T型车闻名。在巴西语境中，他最重要的历史关联是1920年代在亚马孙地区建立的福特兰迪亚项目。福特希望通过在帕拉州塔帕若斯河流域建设橡胶种植园和美国式工业城，为汽车工业取得稳定橡胶供应，并摆脱亚洲橡胶市场的制约。然而项目缺乏对热带农业、地方社会和工人生活方式的充分理解，种植园遭病虫害破坏，管理制度又引发严重不满。1945年，福特公司将项目资产售回巴西政府，福特兰迪亚项目结束。"
 CBIO_BRA_ismael_da_motta_paes_desc:0 "伊斯梅尔·达·莫塔·帕埃斯，1920年6月30日生于米纳斯吉拉斯州贝洛奥里藏特，1997年2月21日卒于里约热内卢，巴西空军飞行员，巴西远征军第一战斗机大队“黄色中队”成员，是巴西参加二战意大利战场的战斗机飞行员之一。1939年入雷亚伦戈军事学校。他以呼号B6驾驶P-47执行了24次战斗任务，首次在1944年11月11日；1944年12月23日执行第24次任务、于意大利布伦纳山口低空轰炸敌方铁路线时座机被高射炮击落，跳伞后被俘，是该大队第一位被俘、最后一位获释的飞行员，在东普鲁士第一号空军战俘营度过近五个月，1945年6月7日返抵比萨，并于同月赴美接飞新P-47D运回巴西，因作战英勇获美军多枚航空奖章。战后他继续在巴西空军服役，历任飞行教官与多个航空区指挥职务，1959至1961年任第一战斗机航空大队大队长，1980年以空军少将军衔转入预备役；退役前受邀单飞幻影式战斗机，成为唯一驾驶单座幻影的巴西将官。"
 CBIO_BRA_ismael_motta_paes_desc:0 "伊斯梅尔·达·莫塔·帕埃斯，1920年6月30日生于米纳斯吉拉斯州贝洛奥里藏特，1997年2月21日卒于里约热内卢，巴西空军飞行员，巴西远征军第一战斗机大队“黄色中队”成员，是巴西参加二战意大利战场的战斗机飞行员之一。1939年入雷亚伦戈军事学校。他以呼号B6驾驶P-47执行了24次战斗任务，首次在1944年11月11日；1944年12月23日执行第24次任务、于意大利布伦纳山口低空轰炸敌方铁路线时座机被高射炮击落，跳伞后被俘，是该大队第一位被俘、最后一位获释的飞行员，在东普鲁士第一号空军战俘营度过近五个月，1945年6月7日返抵比萨，并于同月赴美接飞新P-47D运回巴西，因作战英勇获美军多枚航空奖章。战后他继续在巴西空军服役，历任飞行教官与多个航空区指挥职务，1959至1961年任第一战斗机航空大队大队长，1980年以空军少将军衔转入预备役；退役前受邀单飞幻影式战斗机，成为唯一驾驶单座幻影的巴西将官。"
 CBIO_BRA_joao_marques_de_reis_desc:0 "若昂·马克斯·多斯·雷斯，1890年6月23日生于巴伊亚州萨尔瓦多，1950年4月15日卒，巴西律师、大学教授与政治家，瓦加斯时代的重要行政与财经官员。他是医生兼拉丁文教授若泽·马克斯·多斯·雷斯之子，就读于巴伊亚法学院（今巴伊亚联邦大学前身），并任毕业班致辞代表。1930年革命后当选联邦制宪议员，代表巴伊亚州；1934年，在瓦加斯提议延长制宪议员任期、将制宪会议改组为普通国会时，他是二十名投票反对该动议的议员之一，与圣保罗、伯南布哥、巴伊亚各州代表团一同表达异议。此后他出任瓦加斯政府交通公共工程部长（1934—1937年），并担任巴西银行行长，是这一时期国家基础设施与金融体系运作的核心官员之一。1950年代在巴西咖啡种植北扩地带，帕拉纳州诺尔特皮奥内罗地区以其姓氏命名的“马克斯·多斯·雷斯”镇即为对他的纪念。"
 CBIO_BRA_joao_marques_reis_desc:0 "若昂·马克斯·多斯·雷斯，1890年6月23日生于巴伊亚州萨尔瓦多，1950年4月15日卒，巴西律师、大学教授与政治家，瓦加斯时代的重要行政与财经官员。他是医生兼拉丁文教授若泽·马克斯·多斯·雷斯之子，就读于巴伊亚法学院（今巴伊亚联邦大学前身），并任毕业班致辞代表。1930年革命后当选联邦制宪议员，代表巴伊亚州；1934年，在瓦加斯提议延长制宪议员任期、将制宪会议改组为普通国会时，他是二十名投票反对该动议的议员之一，与圣保罗、伯南布哥、巴伊亚各州代表团一同表达异议。此后他出任瓦加斯政府交通公共工程部长（1934—1937年），并担任巴西银行行长，是这一时期国家基础设施与金融体系运作的核心官员之一。1950年代在巴西咖啡种植北扩地带，帕拉纳州诺尔特皮奥内罗地区以其姓氏命名的“马克斯·多斯·雷斯”镇即为对他的纪念。"
 CBIO_BRA_joao_neves_da_fortuna_desc:0 "若昂·内维斯·达·丰托拉，1887年11月16日生于南里奥格兰德州卡舒埃拉-杜苏尔，1963年3月31日卒于里约热内卢，巴西律师、外交家、记者、政治家与文人，1930年自由联盟运动的核心策士之一，两度出任外交部长。毕业于阿雷格里港法学院（1909年），早年在故乡从政，历任州议员与南里奥格兰德州副州长。1929年，作为南里奥格兰德州代表，他与米纳斯的弗朗西斯科·坎波斯共同签订“米纳斯-南大河公约”（格洛丽亚旅馆协定），直接促成自由联盟的组建，为1930年革命奠定政治基础。他参加了1930年革命，但因与瓦加斯政见龃龉而疏离，转而声援1932年圣保罗立宪革命，失败后流亡布宜诺斯艾利斯约两年。归国后重返政坛，1943至1945年任驻葡萄牙大使，历经新国家末期。战后加入社会民主党，先后在杜特拉政府（1946年）与瓦加斯第二任期（1951—1953年）两度执掌伊塔马拉蒂宫，主张对美靠拢，曾率团出席巴黎和会（1946年）与波哥大泛美会议（1948年）。他亦是巴西文学院院士。"
 CBIO_BRA_joao_neves_fontoura_desc:0 "若昂·内维斯·达·丰托拉，1887年11月16日生于南里奥格兰德州卡舒埃拉-杜苏尔，1963年3月31日卒于里约热内卢，巴西律师、外交家、记者、政治家与文人，1930年自由联盟运动的核心策士之一，两度出任外交部长。毕业于阿雷格里港法学院（1909年），早年在故乡从政，历任州议员与南里奥格兰德州副州长。1929年，作为南里奥格兰德州代表，他与米纳斯的弗朗西斯科·坎波斯共同签订“米纳斯-南大河公约”（格洛丽亚旅馆协定），直接促成自由联盟的组建，为1930年革命奠定政治基础。他参加了1930年革命，但因与瓦加斯政见龃龉而疏离，转而声援1932年圣保罗立宪革命，失败后流亡布宜诺斯艾利斯约两年。归国后重返政坛，1943至1945年任驻葡萄牙大使，历经新国家末期。战后加入社会民主党，先后在杜特拉政府（1946年）与瓦加斯第二任期（1951—1953年）两度执掌伊塔马拉蒂宫，主张对美靠拢，曾率团出席巴黎和会（1946年）与波哥大泛美会议（1948年）。他亦是巴西文学院院士。"
 CBIO_BRA_jorge_dodsworth_martins_desc:0 "若热·多兹沃斯·马丁斯，1884年2月19日生于米纳斯吉拉斯州蓬蒂诺瓦，1974年2月18日卒于里约热内卢，巴西海军上将，1945至1946年间任海军部长。他1900年入海军学校，1903年毕业，早年曾任海军部长亚历山德里诺·德·阿伦卡尔的副官，并先后在总统尼洛·佩萨尼亚与文塞斯劳·布拉斯身边任侍从武官。他历任多艘军舰指挥官，先后统带驱逐舰“巴拉纳号”“皮奥伊号”“阿拉戈阿斯号”、河川炮舰“阿克里号”与浅水重炮舰“伯南布哥号”等，并曾任巡洋舰“巴伊亚号”副长；第二次世界大战期间出任巡洋舰编队司令。1941年晋准将，1945年晋中将。1945年10月瓦加斯被军方逼宫下台后，代总统若泽·利尼亚雷斯于10月30日任命他为海军部长，杜特拉就任后予以留任，直至1946年10月由西尔维奥·德·诺罗尼亚（#63）接任——他与#61吉洛贝尔、#63诺罗尼亚构成这一时期前后相继的三位海军部长。任内他创设海军后备勤务、通信局与水文航行局，重组海军军区，并设立常设性的宗教服务勤务。他自母系出身英裔多兹沃斯望族，为1937至1945年联邦区（里约）市长恩里克·多兹沃斯之堂亲。1950年转入预备役，晚年曾任巴西童子军联盟主席（1959—1962年）与巴西地理学会会长。"
 CBIO_BRA_jorge_martins_desc:0 "若热·多兹沃斯·马丁斯，1884年2月19日生于米纳斯吉拉斯州蓬蒂诺瓦，1974年2月18日卒于里约热内卢，巴西海军上将，1945至1946年间任海军部长。他1900年入海军学校，1903年毕业，早年曾任海军部长亚历山德里诺·德·阿伦卡尔的副官，并先后在总统尼洛·佩萨尼亚与文塞斯劳·布拉斯身边任侍从武官。他历任多艘军舰指挥官，先后统带驱逐舰“巴拉纳号”“皮奥伊号”“阿拉戈阿斯号”、河川炮舰“阿克里号”与浅水重炮舰“伯南布哥号”等，并曾任巡洋舰“巴伊亚号”副长；第二次世界大战期间出任巡洋舰编队司令。1941年晋准将，1945年晋中将。1945年10月瓦加斯被军方逼宫下台后，代总统若泽·利尼亚雷斯于10月30日任命他为海军部长，杜特拉就任后予以留任，直至1946年10月由西尔维奥·德·诺罗尼亚（#63）接任——他与#61吉洛贝尔、#63诺罗尼亚构成这一时期前后相继的三位海军部长。任内他创设海军后备勤务、通信局与水文航行局，重组海军军区，并设立常设性的宗教服务勤务。他自母系出身英裔多兹沃斯望族，为1937至1945年联邦区（里约）市长恩里克·多兹沃斯之堂亲。1950年转入预备役，晚年曾任巴西童子军联盟主席（1959—1962年）与巴西地理学会会长。"
 CBIO_BRA_jose_americo_almeida_desc:0 "若泽·阿梅里科·德·阿尔梅达，1887年1月10日生于帕拉伊巴州阿雷亚，1980年3月10日卒于若昂佩索阿，巴西作家、政治家、律师，巴西东北地域主义小说的开创者，同时是1930年代政坛的重要人物。他以1928年的长篇小说《甘蔗渣》奠定文学声名，该书被视为现代地域主义小说的里程碑。毕业于累西腓法学院（1908年），历任检察官、帕拉伊巴州总检察长，并在州长若昂·佩索阿麾下任公共安全书记。1930年他领导了北方与东北地区的革命行动，胜利后出任临时政府交通公共工程部长。1937年他被推为政府支持的总统候选人，与阿曼多·萨莱斯及统合主义领袖萨尔加多形成三方角逐，但同年11月瓦加斯发动“新国家”政变、取消大选，竞选戛然而止。1945年2月，他接受《晨邮报》记者卡洛斯·拉塞达的著名采访、公开批评独裁并呼吁重开选举，成为新国家政权走向瓦解的象征性标志之一。此后他当选参议员，参与创建民主联盟，后另组解放党并当选帕拉伊巴州长（1950年），任内创办帕拉伊巴联邦大学；1951年重任交通部长直至1954年瓦加斯自杀。晚年隐居坦鲍海滩，人称“坦鲍隐士”，1966年入选巴西文学院。"
 CBIO_BRA_jose_americo_de_almeida_desc:0 "若泽·阿梅里科·德·阿尔梅达，1887年1月10日生于帕拉伊巴州阿雷亚，1980年3月10日卒于若昂佩索阿，巴西作家、政治家、律师，巴西东北地域主义小说的开创者，同时是1930年代政坛的重要人物。他以1928年的长篇小说《甘蔗渣》奠定文学声名，该书被视为现代地域主义小说的里程碑。毕业于累西腓法学院（1908年），历任检察官、帕拉伊巴州总检察长，并在州长若昂·佩索阿麾下任公共安全书记。1930年他领导了北方与东北地区的革命行动，胜利后出任临时政府交通公共工程部长。1937年他被推为政府支持的总统候选人，与阿曼多·萨莱斯及统合主义领袖萨尔加多形成三方角逐，但同年11月瓦加斯发动“新国家”政变、取消大选，竞选戛然而止。1945年2月，他接受《晨邮报》记者卡洛斯·拉塞达的著名采访、公开批评独裁并呼吁重开选举，成为新国家政权走向瓦解的象征性标志之一。此后他当选参议员，参与创建民主联盟，后另组解放党并当选帕拉伊巴州长（1950年），任内创办帕拉伊巴联邦大学；1951年重任交通部长直至1954年瓦加斯自杀。晚年隐居坦鲍海滩，人称“坦鲍隐士”，1966年入选巴西文学院。"
 CBIO_BRA_jose_linhares_desc:0 "若泽·利尼亚雷斯，1886年1月28日生于塞阿拉州巴图里泰的西尼姆布庄园，1957年1月26日卒于米纳斯吉拉斯州卡尚布，巴西法学家，首位出任国家元首的塞阿拉人，以在新国家独裁末期主持还政于民、重建司法独立而留名。他就读于累西腓法学院，1908年获法学学位，此后长期从事司法工作，历任地区法官、上诉法院法官等职。1930年革命后升任联邦区上诉法院法官，1937年经瓦加斯任命为联邦最高法院大法官，1940年出任该院副院长，1945年升任院长，并因此兼掌高等选举法院，主持编订战后新选举法。1945年10月，瓦加斯被军方逼宫下台，因新国家时期既无副总统、国会亦已关闭多年，身为司法首长的利尼亚雷斯依继任顺序于10月30日出任临时总统，任期至1946年1月31日，仅约九十三日。其短暂任内致力于拆解新国家的威权架构：废除国家安全法庭，以司法人员替换各州干预长，赋予新国会制宪权，取消紧急状态，筹备并如期举行大选，最终将权力移交给民选总统欧里科·加斯帕尔·杜特拉。卸任后重返最高法院，两度出任院长直至1956年因年龄退休。"
 CBIO_BRA_jose_pessoa_cavalcanti_de_albuquerque_desc:0 "若泽·佩索阿·卡瓦尔坎蒂·德·阿尔布克尔克，1885年9月12日生于帕拉伊巴州卡巴塞拉斯，1959年8月16日卒于里约热内卢，巴西陆军元帅，巴西装甲兵的先驱与“黑针军校”的倡建者。他是前总统埃皮塔西奥·佩索阿之侄，也是帕拉伊巴州州长若昂·佩索阿之弟——后者1930年遇刺直接引爆1930年革命。1903年入伍，后毕业于阿雷格里港军校。一战期间他随“阿谢使团”赴欧学习法军军事学说，在西线一个龙骑兵中队亲历实战、习得新生的坦克战术；归国后大力倡导陆军采用装甲兵，1921年参与组建巴西陆军首支坦克部队，成为该兵种开创者与主保人。1930年11月至1934年8月任雷亚伦戈军事学校校长，锐意革新军官培养，并构想以之取而代之的黑针军校（亚古拉斯内格拉斯军事学院，1944年建成），创制卡希亚斯佩剑、重塑陆军象征。1933年晋升准将。1944至1946年任军人俱乐部主席，1945年10月发表声明反对瓦加斯续任、推动其下台。1953年晋升元帅；1954年主持“新首都选址委员会”（1954—1956年），为日后巴西利亚选址奠定基础。"
 CBIO_BRA_jose_pessoa_desc:0 "若泽·佩索阿·卡瓦尔坎蒂·德·阿尔布克尔克，1885年9月12日生于帕拉伊巴州卡巴塞拉斯，1959年8月16日卒于里约热内卢，巴西陆军元帅，巴西装甲兵的先驱与“黑针军校”的倡建者。他是前总统埃皮塔西奥·佩索阿之侄，也是帕拉伊巴州州长若昂·佩索阿之弟——后者1930年遇刺直接引爆1930年革命。1903年入伍，后毕业于阿雷格里港军校。一战期间他随“阿谢使团”赴欧学习法军军事学说，在西线一个龙骑兵中队亲历实战、习得新生的坦克战术；归国后大力倡导陆军采用装甲兵，1921年参与组建巴西陆军首支坦克部队，成为该兵种开创者与主保人。1930年11月至1934年8月任雷亚伦戈军事学校校长，锐意革新军官培养，并构想以之取而代之的黑针军校（亚古拉斯内格拉斯军事学院，1944年建成），创制卡希亚斯佩剑、重塑陆军象征。1933年晋升准将。1944至1946年任军人俱乐部主席，1945年10月发表声明反对瓦加斯续任、推动其下台。1953年晋升元帅；1954年主持“新首都选址委员会”（1954—1956年），为日后巴西利亚选址奠定基础。"
 CBIO_BRA_lampiao_desc:0 "兰皮昂，本名维尔古利诺·费雷拉·达席尔瓦（1897年—1938年），是巴西东北部“坎加索”匪帮运动最著名的首领之一。出身伯南布哥内陆的他在1920年代至1930年代率领武装团伙活动于东北腹地，袭击城镇、绑架勒索，并多次与警察和地方武装交战。1938年，兰皮昂及其伴侣玛丽亚·博尼塔等人在塞尔希培州安吉科斯遭伏击身亡。巴西东北民间文化对他的评价长期分裂：他既被记录为暴力匪首，也被一些民间叙事塑造成反抗地方豪强和贫困秩序的传奇人物。"
 CBIO_BRA_leoncio_basbaum_desc:0 "莱昂西奥·巴斯鲍姆，1907年11月6日生于伯南布哥州累西腓，1969年3月7日卒，巴西马克思主义历史学家、医生与左翼活动家，20世纪上半叶巴西共产主义知识运动最重要的参与者之一。他是来自比萨拉比亚（今摩尔多瓦与乌克兰边境地区，彼时属俄罗斯帝国）的犹太移民家庭的第六个孩子，父母在累西腓经营金匠工坊。1924年他移居里约热内卢就读医学院，1929年完成医学学位，此后便将医学事业与政治活动并行推进。早在学生时代，他即通过工会圈子接触到共产主义，并在共产主义者克里斯蒂亚诺·科尔代罗的引导下于1925年正式投身左翼运动。1927年他成为巴西共产主义青年团的主要创建者之一并出任首届秘书长，同年在党报组织中发挥积极作用，期间还曾接触普列斯特斯并参与协调工作。1931年定居圣保罗后，他在1932年革命中以政治犯身份遭拘押，此后辗转于地下政治活动与学术写作之间；1935年共产主义起义后再遭迫害。他的主要历史著作《巴西史》以马克思主义框架重构巴西历史，是巴西左翼史学的奠基文献之一；回忆录《六个时期的一生》则是重要的历史见证。1969年3月7日，他因中风辞世。"
 CBIO_BRA_lindolfo_collor_desc:0 "林道夫·莱奥波尔德·博克尔·科洛尔，1890年2月4日生于南里奥格兰德州，1942年9月21日卒，巴西记者与政治家，瓦加斯临时政府首任劳工、工业与商业部长，德裔巴西人，其孙即巴西第32任总统费尔南多·科洛尔·德梅洛。他1909年取得药学学位，但随即转向新闻与文学，其后加入南里奥格兰德州政治圈。1919年开始在政党报纸主持工作，1925年进入联邦议会。1930年10月革命中，他积极投身推翻旧共和国的行动；革命成功后，他被瓦加斯任命出任新创设的劳工部，是推动早期劳工立法、建立工会合法化框架的核心人物，确立了国家对劳工关系实施监管与介入的制度基础。然而1932年，他因抗议瓦加斯推迟还政于民、继续维持威权统治而愤然辞职，此后转为坚定的反瓦加斯政治人物，直至1942年辞世。他所在的科洛尔家族政治遗产后来由其外孙费尔南多·科洛尔·德梅洛（1990—1992年任总统，后因腐败案被弹劾）延续，使“科洛尔”之名在战后巴西政治史上以另一种形式再度显名。"
 CBIO_BRA_luis_carlos_prestes_desc:0 "路易斯·卡洛斯·普列斯特斯，1898年1月3日生于南里奥格兰德州阿雷格里港，1990年3月7日卒于里约热内卢，享年92岁，巴西军人与革命家，20世纪巴西左翼运动最具传奇色彩的核心人物，以“希望骑士”之名铭刻史册。他出身军人世家，毕业于工程专业，在1920年代中尉运动中声名渐起；1924年，他率部脱离政府军加入叛乱，随后与圣保罗叛军合并，在总司令米格尔·科斯塔麾下担任参谋长，带领数百名叛军战士自1924年12月起历时两年余、纵横13个州、行程约2.5万公里，史称“普列斯特斯纵队”。这支纵队虽始终未能发起广泛民众起义，却将1920年代巴西军政矛盾的内在张力呈现于全国视野，普列斯特斯本人也由此成为下层民众心中的传奇英雄。1927年纵队流亡玻利维亚后，他接触到马克思主义，并于1930年拒绝加入瓦加斯革命——他认为那不过是一场资产阶级政变。1931年他前往苏联，正式加入巴西共产党并进入共产国际执行委员会。1935年回国后出任全国解放联盟名誉主席，同年11月共产主义起义失败后于次年3月被捕，与德国犹太共产党员妻子奥尔加·贝纳里奥同遭逮捕——奥尔加随即被驱逐回纳粹德国，后死于集中营。普列斯特斯在狱中被判处16年（后加至46年），直至1945年4月获释；在狱中他已被选为PCB总书记（1943年），此后长期执掌这一职务直至1980年。获释后他短暂支持瓦加斯，又于1946年当选联邦区参议员，其后数十年在合法、半地下与流亡状态间多次切换，始终是巴西左翼的标志性人物，直至1980年被撤除总书记职务、1984年被开除党籍，晚年支持莱昂内尔·布里佐拉的竞选活动。"
 CBIO_BRA_mascarenhas_de_morais_desc:0 "若昂·巴蒂斯塔·马斯卡雷尼亚斯·德·莫赖斯，1883年11月13日生于南里奥格兰德州圣加布里埃尔，1968年9月17日卒于里约热内卢，巴西陆军元帅，第二次世界大战期间巴西远征军总司令，是战后巴西军事史上最受尊崇的人物之一，亦是巴西出任役现役的最后一位元帅。他在1920年代多次政治动荡中坚守效忠既有合宪政府的立场：1922年率部对抗科帕卡巴纳要塞起义的叛乱者，1930年革命中拒绝倒向瓦加斯阵营并遭到逮捕，1932年又声援圣保罗立宪革命再度被押——这种罕见的两度被捕经历使他在政治上的超然立场颇具说服力。1935年共产主义起义爆发时，他时任雷亚伦戈军事学校校长，以坚定效忠立场参与镇压。1943年12月，他被任命为第一远征步兵师司令，随即主持组建、训练与装备工作，并率第一梯队于1944年7月2日赴那不勒斯参战，编入美国第5集团军作战序列。在意大利战场，FEB参与了哥特防线的艰苦拉锯，经四次不成功的攻击后终于在1945年2月21日夺取蒙特卡斯特洛阵地，而后在4月的最终攻势中以博洛尼亚战役奠定胜局。1945年4月29至30日，他亲自接受德国第148师及意大利蒙特罗萨、圣马科、意大利三个师的投降，一周内共俘获1.47万名敌军（含2名将领、800名军官）。1946年，巴西国会以立法方式将其晋升为元帅，此后他出任第一军区司令，1951至1954年任联合参谋长，于瓦加斯1954年自杀前后方才告老还乡，留下回忆录传世。"
 CBIO_BRA_mascarenhas_morais_desc:0 "若昂·巴蒂斯塔·马斯卡雷尼亚斯·德·莫赖斯，1883年11月13日生于南里奥格兰德州圣加布里埃尔，1968年9月17日卒于里约热内卢，巴西陆军元帅，第二次世界大战期间巴西远征军总司令，是战后巴西军事史上最受尊崇的人物之一，亦是巴西出任役现役的最后一位元帅。他在1920年代多次政治动荡中坚守效忠既有合宪政府的立场：1922年率部对抗科帕卡巴纳要塞起义的叛乱者，1930年革命中拒绝倒向瓦加斯阵营并遭到逮捕，1932年又声援圣保罗立宪革命再度被押——这种罕见的两度被捕经历使他在政治上的超然立场颇具说服力。1935年共产主义起义爆发时，他时任雷亚伦戈军事学校校长，以坚定效忠立场参与镇压。1943年12月，他被任命为第一远征步兵师司令，随即主持组建、训练与装备工作，并率第一梯队于1944年7月2日赴那不勒斯参战，编入美国第5集团军作战序列。在意大利战场，FEB参与了哥特防线的艰苦拉锯，经四次不成功的攻击后终于在1945年2月21日夺取蒙特卡斯特洛阵地，而后在4月的最终攻势中以博洛尼亚战役奠定胜局。1945年4月29至30日，他亲自接受德国第148师及意大利蒙特罗萨、圣马科、意大利三个师的投降，一周内共俘获1.47万名敌军（含2名将领、800名军官）。1946年，巴西国会以立法方式将其晋升为元帅，此后他出任第一军区司令，1951至1954年任联合参谋长，于瓦加斯1954年自杀前后方才告老还乡，留下回忆录传世。"
 CBIO_BRA_miguel_reale_desc:0 "米格尔·雷亚莱，1910年11月6日生于圣保罗州圣本托·杜萨普卡亚，2006年4月14日卒于圣保罗，巴西法学家、哲学家、学者、政治家与诗人，被誉为20世纪最重要的巴西法学家之一，以其“法律三维理论”——将社会事实、伦理价值与法律规范视为法律三位一体的有机统一——奠定了在拉丁美洲与欧陆法哲学界的重要地位。他1934年毕业于圣保罗大学法学院，同期积极参与巴西统合主义行动，出任AIB全国教义秘书长，是继普利尼奥·萨尔加多与古斯塔沃·巴罗佐之后的第三位核心理论人物，为统合主义的法律与政治哲学框架提供了系统论证。1938年统合主义政变失败后，他逐渐与这一运动剥离，将精力转向纯粹学术。1941年他通过竞争性考试赢得圣保罗大学法律哲学正教席，同年出版奠基性著作《法律的基础》，确立了三维理论的雏形；此后历任圣保罗州司法秘书（1947年）、圣保罗大学校长（1949—1950年及1969—1973年），1949年创建巴西哲学研究所并主持七届全国哲学大会。2002年，他作为主要起草者之一，主持完成了《巴西民法典》的全面现代化修订，该法典至今仍是巴西民法的基本法律框架，他也因此获得“现行民法典首席缔造者”的历史评价。晚年，他于1975年当选巴西文学院院士。"
 CBIO_BRA_milton_de_freitas_desc:0 "米尔顿·德·弗雷塔斯·阿尔梅达，1888年1月3日生于南里奥格兰德州阿雷格里港，1962年11月29日卒于里约热内卢，巴西陆军元帅，以1932年圣保罗立宪革命中指挥政府军南部战区而留名史册。他1904年入伍，1908年以骑兵少尉身份出道，历经多次按资历与功绩的晋升。1932年，当圣保罗以“立宪革命”为名武装反抗瓦加斯时，他出任政府军南部战区总司令，统筹该方向的围剿行动。9月30日，当前任司令被调往新职时，他正式接管南部总指挥权；然而就在战事即将结束的最后阶段，他遭到麾下一批哗变士兵的枪击，身受重伤——这一戏剧性结局是圣保罗战役尾声最为人所称道的事件之一。"
 CBIO_BRA_minervino_de_oliveira_desc:0 "米内尔维诺·德·奥利韦拉（1891年—1977年）是巴西工人运动活动家、共产党政治人物，生于里约热内卢。少年时代即进入工厂劳动，后成为石匠和工会组织者，参与里约工人运动。1920年代，他加入巴西共产党，并以工人农民集团名义在1928年当选当时联邦区的市政代表。1929年至1930年间，他被共产党阵营推为总统候选人，虽得票有限，却使工人、黑人和共产主义政治诉求进入全国选举舞台。1977年在里约热内卢逝世。"
 CBIO_BRA_minervino_oliveira_desc:0 "米内尔维诺·德·奥利韦拉（1891年—1977年）是巴西工人运动活动家、共产党政治人物，生于里约热内卢。少年时代即进入工厂劳动，后成为石匠和工会组织者，参与里约工人运动。1920年代，他加入巴西共产党，并以工人农民集团名义在1928年当选当时联邦区的市政代表。1929年至1930年间，他被共产党阵营推为总统候选人，虽得票有限，却使工人、黑人和共产主义政治诉求进入全国选举舞台。1977年在里约热内卢逝世。"
 CBIO_BRA_moreira_lima_desc:0 "洛伦索·莫雷拉·利马，绰号“凶猛律师”，1881年2月22日生于伯南布哥州伊坦贝，1940年9月5日卒于圣保罗，巴西律师与革命活动家，以随军普列斯特斯纵队全程记录并留存珍贵历史档案而成为巴西军事史学中不可替代的史料守护者。他毕业于福塔莱萨法学院，在阿克里州从事律师工作达十年，1920年移居里约热内卢后接触中尉运动，1925年加入正在形成中的普列斯特斯—科斯塔纵队，担任纵队秘书长兼第4分队指挥官（后代为指挥）；同时主编纵队革命报纸《战斗》，以纵队随军书记身份逐日记录部队的行军路线、战斗经过与内部决策，是这场历史壮举最重要的第一手见证人。1927年纵队流亡玻利维亚后，他回到巴西，参与了1930年十月革命。1935年共产主义起义发生后，他以涉嫌参与共谋之名被解除在劳工部的职务并遭逮捕；在此期间，小说家格拉西利亚诺·拉莫斯在狱中与他相识，后在回忆录中留下了对他高度评价的文字。获释后他隐匿于圣保罗，于1940年辞世。他所著的《普列斯特斯纵队：行军与战斗》至今仍是研究这段历史最权威、最翔实的一手文献。"
 CBIO_BRA_nero_moura_desc:0 "内罗·莫拉，1910年1月30日生于南里奥格兰德州卡舒埃拉-杜苏尔，1994年12月17日卒于里约热内卢，巴西空军军官，巴西远征军第一战斗机大队首任指挥官，被尊为巴西战斗机航空的主保人。他早年就读阿雷格里港军校，1927年入雷亚伦戈军事学校，后转入阿丰苏斯校场军事航空学校，1930年11月成为军官候补生、次年1月晋少尉，初期在军用航空邮政服役。1932年立宪革命期间，他站在合法政府一方，在帕拉伊巴河谷执行侦察、轰炸与对地攻击任务。1941年晋航空少校，任航空部长副官。1943年12月18日新组建的第一战斗机大队成立，他受命出任首任指挥官，率部随FEB赴意大利参战；该大队近五百人、含五十名飞行员，以战吼“Senta a Púa！”闻名。1944年他先赴美受训，尔后转战意大利战场，全大队在七个多月内执行445次任务、2550架次，他本人亲飞62次战斗任务（1944年11月4日至1945年5月1日），部队因战功获美国“总统集体嘉奖”。1945年10月瓦加斯被推翻时，他因效忠瓦加斯一度被短暂拘押，同年12月以上校衔转入预备役、转投民航企业。1950年瓦加斯当选后邀其出山，1951年1月31日出任航空部长，8月晋空军准将；1954年8月因托内莱罗斯街暗杀案引发的政治危机于16日辞职。逝世后于1995年正式追封为巴西战斗机航空主保人。"
 CBIO_BRA_newton_cavalcanti_desc:0 "牛顿·德·安德拉德·卡瓦尔坎蒂，1885年10月23日生于阿拉戈阿斯州帕尔梅拉·多斯·因迪奥斯，1965年11月25日卒，巴西陆军将领，在政治立场上是统合主义运动在高级军官圈中最热情、最公开的支持者，其名字与1930年代巴西右翼民族主义运动及1938年睡衣政变深度交织。他1902年入伍，以骑兵军官为基础晋升，参与1930年十月革命（站在革命阵营一侧）；革命胜利后主持联邦军体育训练中心。1935年11月共产主义起义被镇压后，他旋即晋升准将，被认为与共产主义起义的震慑效应直接相关；他在镇压庆典上公开发表反共演说，并成为军官圈内与普利尼奥·萨尔加多关系最密切的高级军官——曾出席AIB“五万绿衫”大阅兵并站在瓦加斯身旁，被记者拍下。他的统合主义倾向一度使其将官晋升遭到陆军部长阻挠，引发广泛关注。1937至1938年间，他是军方力量为数不多的统合主义倾向将领之一；1938年2月1日，他颁布针对共济会的禁止令，进一步彰显其宗教保守主义取向。1938年5月11日统合主义睡衣政变的夜晚，他在政变爆发前夕主动辞去维拉米利塔尔指挥官职务、从政变行动中撤身，事后向瓦加斯致电祝贺政变失败——这一两面性举动令他得以在政治上全身而退。此后他在军队中继续服役，于1949年短暂出任代理陆军部长（杜特拉政府），1965年辞世。"
 CBIO_BRA_olga_benario_prestes_desc:0 "奥尔加·古特曼·贝纳里奥，1908年2月12日生于德国慕尼黑，1942年4月23日卒于德国伯恩堡，德国犹太裔共产主义女战士，因遭瓦加斯政府驱逐返回纳粹德国并死于集中营，其命运成为二十世纪最震撼人心的政治悲剧之一，亦是巴西共和国史上侵犯人权最为典型的案例。她出身慕尼黑上流犹太律师家庭，15岁即加入共产主义青年国际（1923年）；18岁时因参与反法西斯活动遭警方登记追踪；1928年策划并执行了其同志奥托·布劳恩从柏林莫阿比特监狱的武装越狱行动，事后与布劳恩流亡苏联，先后就读于列宁学校和茹科夫斯基军事学院，历任共产主义青年国际教官。1934年，共产国际任命她以贴身护卫身份护送普列斯特斯秘密潜返巴西；二人在漫长的流亡与潜行途中相爱，以假身份辗转抵达巴西，在里约热内卢共同筹备起义。1935年11月共产主义起义失败后，两人于1936年3月同遭逮捕；而她怀有普列斯特斯的骨肉、腹中胎儿已近七个月——这一事实并未能阻止瓦加斯政府与盖世太保协作将她驱逐出境。1936年9月，她以“危害公共秩序的有害外侨”为由被押上轮船，历经险阻返回柏林，11月27日在巴尼姆大街女子监狱中产下女儿阿妮塔·莱奥卡迪亚，孩子在14个月后由普列斯特斯的母亲接走抚养。她先后被关押于利希滕贝格（1938年）与拉文斯布吕克（1939年）集中营，在狱中坚持组织秘密活动，出版手写报刊，帮助病弱狱友获取额外食物，并秘密绘制了一份供囚犯使用的地图——今日保存于拉文斯布吕克纪念馆。1942年4月23日，她被送至伯恩堡安乐死中心的毒气室中处死，年仅34岁，身后以临终遗书向丈夫和女儿表达了最后的爱与信念。2004年由热米·蒙迦尔丹执导的同名巴西电影《奥尔加》使她的故事广为人知。"
 CBIO_BRA_olimpio_falconiere_cunha_desc:0 "奥林匹奥·法尔科涅雷·达·库尼亚（1891年—1967年）是巴西陆军将领，后晋为元帅，生于圣卡塔琳娜州伊塔雅伊。1912年入读里约热内卢雷阿伦戈军事学校，后参与1922年和1924年的军人运动以及1930年革命。第二次世界大战期间，他在巴西远征军中担任高级指挥职务，参加意大利战役。战后，法尔科涅雷继续在陆军高层任职，曾指挥中央军区和第二军，1956年至1961年任最高军事法院部长。1967年在里约热内卢逝世。"
 CBIO_BRA_oliveira_viana_desc:0 "弗朗西斯科·若泽·德·奥利韦拉·比亚纳，1883年6月20日生于里约热内卢州萨卡雷马，1951年3月28日卒，巴西法学家、历史学家与社会学家，瓦加斯时代最具影响力的保守主义政治思想家，以其对威权民族主义与统合主义的系统性论述，为新国家的劳工立法与国家干预主义提供了重要的理论基础，深刻塑造了20世纪上半叶巴西的政治法律话语。他毕业于里约热内卢自由法学院（今联邦大学法学院，1906年），长期从事学术研究与法律实践，深受社会学家西尔维奥·罗梅罗与思想家阿尔贝托·托雷斯的影响。他早期的代表作《巴西南部地区的人口》，1920年以种族与地理为框架分析巴西社会结构，虽其中的种族主义论述在后世受到批判，但其对巴西区域性政治权力结构的洞察在当时颇具影响。1930年革命后，他以法律顾问身份进入劳工部（1932—1940年），积极参与统合主义工会制度与劳工法庭的构建，并在此期间出版了《统合法权问题》，1938年，系统论述了国家调节劳资冲突的法律框架。他是威权主义国家概念的坚定倡导者，批判自由主义民主在巴西的适用性，为新国家的独裁措施提供了学理背书；与此同时，他也是反共主义的有力鼓吹者，并对德国“泛日耳曼主义”持批判立场，力图在法理上将巴西威权主义与欧洲种族民族主义区分开来。1937年入选巴西文学院，晚年持续出版法哲学著作至1951年辞世。"
