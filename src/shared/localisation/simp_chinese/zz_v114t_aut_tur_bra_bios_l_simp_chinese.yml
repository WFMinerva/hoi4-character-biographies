 CBIO_BRA_olympio_falconiere_da_cunha_desc:0 "奥林匹奥·法尔科涅雷·达·库尼亚（1891年—1967年）是巴西陆军将领，后晋为元帅，生于圣卡塔琳娜州伊塔雅伊。1912年入读里约热内卢雷阿伦戈军事学校，后参与1922年和1924年的军人运动以及1930年革命。第二次世界大战期间，他在巴西远征军中担任高级指挥职务，参加意大利战役。战后，法尔科涅雷继续在陆军高层任职，曾指挥中央军区和第二军，1956年至1961年任最高军事法院部长。1967年在里约热内卢逝世。"
 CBIO_BRA_osvaldo_aranha_desc:0 "奥斯瓦尔多·欧克利德斯·德·苏扎·阿拉尼亚，1894年2月15日生于南里奥格兰德州阿莱格雷特，1960年1月27日卒，巴西政治家、外交家与国务活动家，以其在1947年联合国大会任主席期间主持巴勒斯坦分治方案表决、为以色列国的建立铺路而在国际史上留下独特印记。他毕业于里约热内卢法学院（1916年），从政起步于家乡市长（1925年）与南里奥格兰德州立法机构；1930年他是推动瓦加斯接受武装革命路线最关键的说客之一，随后历任瓦加斯政府司法部长、财政部长等要职，1934年出任驻美大使，在这一任上他建立了与美国政界的深厚关系，并逐渐确立对联盟国立场的坚定支持。1938至1944年，他出任巴西外交部长，任内在二战初期将巴西引向亲盟国立场——1942年1月，他在里约热内卢泛美外长会议上宣布巴西与轴心国断交，随后促成巴西对德意宣战并组建远征军。1944年他因抗议瓦加斯压制政治集会而愤然辞职，继而协助创建全国民主联盟。战后出任联合国代表团团长，1947年3月任联合国大会第二届大会主席，在关键的巴勒斯坦分治方案（联大181号决议）表决中，以外交手腕将投票推迟三天，为争取到足够赞成票赢得了宝贵时间，并因此被提名诺贝尔和平奖（1948年）。随后他和解于重返政坛的瓦加斯，于1953年出任财政部长，但在1954年8月瓦加斯自杀后立即辞职告别官场，晚年以“国家元老”身份安享余年至1960年辞世。"
 CBIO_BRA_pedro_alcantara_desc:0 "阿尔坎塔拉·路易斯·菲利普·玛丽亚·加斯唐·米格尔·加百列·拉斐尔·贡萨加·德·奥尔良-布拉甘萨亲王，巴西格朗帕拉亲王，1875年10月15日生于巴西彼得罗波利斯皇宫，1940年1月29日卒于同地，巴西皇室公主伊莎贝尔与奥尔良-布拉甘萨家族嫡长子，出生时是巴西帝国王位序列中仅次于其母的第二继承人；1889年共和政变后随母流亡欧洲，主要在法国与奥匈帝国度过壮年，并在奥匈军队中服役晋至上尉。1908年，他希望迎娶身为波西米亚贵族但不具王室血统的伊丽莎白·多布日任斯基女伯爵，在母亲坚持婚姻须符合对等原则的条件下，他于10月30日在法国戛纳签署了一份声明，以自己及所有后代的名义放弃对巴西王位的全部继承权——此举确立了后继者的法定序列，也埋下了日后家族分裂的根源，彼得罗波利斯支系（其子女一脉）与瓦索拉斯支系（其弟路易斯一脉）之间长达数十年的法统争议由此肇始。1920年前后他回到巴西，在彼得罗波利斯定居，以冷静超然的姿态融入共和国体制，偶尔参与皇室传统纪念活动。1940年1月29日因心肺骤停辞世，年64岁，获授国家元首级葬礼，外交部长奥斯瓦尔多·阿拉尼亚代表政府出席葬礼，其遗体安葬于彼得罗波利斯帝国圣殿（圣阿尔坎塔拉教堂）的皇族墓穴，与父祖墓冢相邻。（注：其子#56佩德罗·加斯唐日后否认了他1908年放弃声明对后代的效力，延续了保皇派内部的正统争议；其弟路易斯之子#57佩德罗·恩里克则被主流保皇派奉为正统继承人。）。"
 CBIO_BRA_pedro_de_alcantara_desc:0 "阿尔坎塔拉·路易斯·菲利普·玛丽亚·加斯唐·米格尔·加百列·拉斐尔·贡萨加·德·奥尔良-布拉甘萨亲王，巴西格朗帕拉亲王，1875年10月15日生于巴西彼得罗波利斯皇宫，1940年1月29日卒于同地，巴西皇室公主伊莎贝尔与奥尔良-布拉甘萨家族嫡长子，出生时是巴西帝国王位序列中仅次于其母的第二继承人；1889年共和政变后随母流亡欧洲，主要在法国与奥匈帝国度过壮年，并在奥匈军队中服役晋至上尉。1908年，他希望迎娶身为波西米亚贵族但不具王室血统的伊丽莎白·多布日任斯基女伯爵，在母亲坚持婚姻须符合对等原则的条件下，他于10月30日在法国戛纳签署了一份声明，以自己及所有后代的名义放弃对巴西王位的全部继承权——此举确立了后继者的法定序列，也埋下了日后家族分裂的根源，彼得罗波利斯支系（其子女一脉）与瓦索拉斯支系（其弟路易斯一脉）之间长达数十年的法统争议由此肇始。1920年前后他回到巴西，在彼得罗波利斯定居，以冷静超然的姿态融入共和国体制，偶尔参与皇室传统纪念活动。1940年1月29日因心肺骤停辞世，年64岁，获授国家元首级葬礼，外交部长奥斯瓦尔多·阿拉尼亚代表政府出席葬礼，其遗体安葬于彼得罗波利斯帝国圣殿（圣阿尔坎塔拉教堂）的皇族墓穴，与父祖墓冢相邻。（注：其子#56佩德罗·加斯唐日后否认了他1908年放弃声明对后代的效力，延续了保皇派内部的正统争议；其弟路易斯之子#57佩德罗·恩里克则被主流保皇派奉为正统继承人。）。"
 CBIO_BRA_pedro_gastao_desc:0 "阿尔坎塔拉·德·奥尔良-布拉甘萨，通称佩德罗·加斯唐，1913年2月19日生于法国厄市，2007年12月27日卒，巴西帝室彼得罗波利斯支系的领袖，以拒绝承认其父（#55佩德罗·德·阿尔坎塔拉）1908年放弃继承权声明的有效性而在保皇派内部引发持续数十年的法统争议。他出生于皇室流亡期间，是1908年婚姻中所生的长子；父亲于1940年辞世后，他随即宣称自己是巴西王位的合法继承人，理由是1824年《巴西帝国宪法》第117条未为王朝继承人预留个人放弃世袭权利的空间，且未经制宪议会批准的放弃声明对后代不具法律约束力——他由此以“佩德罗四世”之名自居，与同时宣布继承皇位的表亲#57佩德罗·恩里克（瓦索拉斯支系）形成直接对立。1944年，他在塞维利亚与波旁-两西西里王朝的玛丽亚·德·拉·埃斯佩兰萨公主成婚，育有六子，其中长子佩德罗·卡洛斯继承了彼得罗波利斯支系的领袖地位。在巴西政治文化语境中，彼得罗波利斯支系历来以更具共和主义倾向与社会进步色彩著称，与主流保皇派所承认的瓦索拉斯支系形成了鲜明的风格对比。他于2007年辞世，身后将支系领导权传于其子佩德罗·卡洛斯。"
 CBIO_BRA_pedro_henrique_desc:0 "阿尔坎塔拉·恩里克·阿斯托尔福·菲利普·玛丽亚·加斯唐·米格尔·加百列·拉斐尔·贡萨加·德·奥尔良-布拉甘萨亲王，1909年9月13日生于法国布洛涅-比扬古，1981年7月5日卒，巴西帝室瓦索拉斯支系首脑，为主流保皇运动所承认的正统继承人，绰号“期待王子”。他是路易斯王子（#55佩德罗·德·阿尔坎塔拉之弟）与西西里王国玛丽亚·皮亚公主之子；1908年伯父放弃继承权后，其父路易斯成为瓦加斯奶奶伊莎贝尔认可的皇位继承人；1921年11月14日祖母伊莎贝尔·公主（巴西最后一位帝国直系成员）辞世，时年12岁的他即依循瓦索拉斯支系的世系继承皇室名号，获多个欧洲王朝及巴西保皇派主流团体的承认。1937年，他在法国与巴伐利亚王国末代国王路德维希三世之孙女玛丽亚·伊丽莎白公主成婚；二战爆发后为逃避纳粹压迫，他带着妻子与子女辗转逃难，1945年战后返回巴西，定居南里奥格兰德州瓦索拉斯，以务农与推广有机农业为日常生活，低调而真诚地回归祖国。在表亲#56佩德罗·加斯唐（彼得罗波利斯支系）于1946年起公开宣称其法统之前，他是国内外保皇派唯一承认的帝室继承人，之后双方的争议延续至他1981年辞世乃至于今。他坚定地维护了君主主义的传统理念，而以超然于政治纷争的品格赢得了广泛的个人尊重。"
 CBIO_BRA_pereira_de_oliveira_desc:0 "若昂·佩雷拉·德·奥利韦拉是巴西陆军军官，后晋为将官。早年参加1914年至1915年的孔特斯塔多战争，因在作战中表现突出而被后来的国会材料提及。战间期，他进入巴西陆军机械化与装甲兵早期建设体系，1931年至1932年曾任突击车连指挥官，后又担任第13步兵团等部队的指挥职务。1940年代初，他仍在陆军建制内任高级指挥官，1941年至1942年曾任第8摩托化步兵旅指挥官。"
 CBIO_BRA_pereira_oliveira_desc:0 "若昂·佩雷拉·德·奥利韦拉是巴西陆军军官，后晋为将官。早年参加1914年至1915年的孔特斯塔多战争，因在作战中表现突出而被后来的国会材料提及。战间期，他进入巴西陆军机械化与装甲兵早期建设体系，1931年至1932年曾任突击车连指挥官，后又担任第13步兵团等部队的指挥职务。1940年代初，他仍在陆军建制内任高级指挥官，1941年至1942年曾任第8摩托化步兵旅指挥官。"
 CBIO_BRA_plinio_salgado_desc:0 "普利尼奥·萨尔加多，1895年1月22日生于圣保罗州圣本托·杜萨普卡亚，1975年12月8日卒于圣保罗，巴西政治家、作家、记者与神学家，1932年创立并领导了巴西统合主义行动，该运动是拉丁美洲历史上规模最大的法西斯风格群众政治组织。他早年是现代主义文学圈的活跃人物，曾参与1922年圣保罗现代艺术周；1930年革命后，他在受墨索里尼意大利法西斯运动影响（并获意大利大使馆部分资助）的基础上，于1932年10月7日正式发布《十月宣言》，创建了AIB——绿衫军、西格玛（Σ）符号、群众集会与准军事化编队是其外部标志，而萨尔加多本人始终公开拒绝种族主义，以此与纳粹主义区分；统合主义的社会基础涵盖意大利裔与葡萄牙裔移民、城市中低阶层及部分军官（尤以海军中为甚）。1934至1937年间AIB与共产党人在街头激烈对峙，运动规模急剧膨胀，估计成员峰值达数十至百万。1937年他宣布参加原定1938年的总统选举，同年11月支持瓦加斯新国家政变——瓦加斯许诺给他教育部长职位，但政变成功后即违约禁止一切政党，AIB随之解散。1938年3月与5月，统合主义残余武力两度起事，尤以5月11日夜袭瓜纳巴拉宫的“睡衣政变”最为激烈——瓦加斯及其女儿参与了平叛枪战；萨尔加多否认参与策划，但仍遭逮捕，随后以六年流亡葡萄牙为代价换取释放（1938—1945年），流亡期间持续寻求与巴西政权和解。1945年回国后创建大众代表党，1955年参选总统获8.28%选票，此后以联邦众议员身份在政坛活跃至1970年代，支持1964年军事政变，并在最后几届任期中加入军政府的全国革命联盟党。"
 CBIO_BRA_protogenes_guimaraes_desc:0 "普罗托格内斯·佩雷拉·吉马良斯（1876年—1938年）是巴西海军上将与政治人物，生于今弗洛里亚诺波利斯。1891年进入海军学校，后在海军中逐步晋升，1923年组织巴西国内首次联合飞行之一，任海军航空总局长。1924年，他在里约热内卢组织响应圣保罗中尉运动的海军密谋，事败后遭逮捕，1928年以少将衔被迫退役。1930年革命后，普罗托格内斯获平反，1931年出任海军部长，任内推动海军区划、海军航空和舰艇现代化。1935年，他在里约热内卢州长选举中以一票优势胜出，任职至1937年新国家政变废除州选举政府。1938年在里约热内卢逝世。"
 CBIO_BRA_renato_almeida_guillobel_desc:0 "雷纳托·德·阿尔梅达·吉洛贝尔，1892年10月8日生于里约热内卢，1975年9月20日卒于同地，巴西海军上将，出身海军世家，其父若泽·坎迪多·吉洛贝尔亦为海军将领。1908年入海军学校为海军见习生，1911年毕业。第一次世界大战期间，他随巡洋舰“巴伊亚号”服役，该舰一度编入协约国序列。1924年11月，他参与镇压圣保罗号战列舰起义；1932年立宪革命中站在临时政府一方作战；1934至1936年任驻阿根廷、乌拉圭、巴拉圭三国大使馆海军武官，新国家时期参与编订军人法。1951年瓦加斯重返总统职位后，任命他为海军部长（1951—1954年），任内借助巴西银行贷款推动累西腓海军基地等设施建设，并于1953年作为部长之一参与签署确立国家石油垄断、创建巴西石油公司的第2004号法律。1954年8月瓦加斯政治危机高峰中，他表态军中多数将领已反对政府；瓦加斯自杀后于8月25日去职。1955年11月洛特发动政变后，他一度出任海军参谋长，1956年短暂代理海军部长，同年因达退休年龄离开现役。"
 CBIO_BRA_renato_de_almeida_guillobel_desc:0 "雷纳托·德·阿尔梅达·吉洛贝尔，1892年10月8日生于里约热内卢，1975年9月20日卒于同地，巴西海军上将，出身海军世家，其父若泽·坎迪多·吉洛贝尔亦为海军将领。1908年入海军学校为海军见习生，1911年毕业。第一次世界大战期间，他随巡洋舰“巴伊亚号”服役，该舰一度编入协约国序列。1924年11月，他参与镇压圣保罗号战列舰起义；1932年立宪革命中站在临时政府一方作战；1934至1936年任驻阿根廷、乌拉圭、巴拉圭三国大使馆海军武官，新国家时期参与编订军人法。1951年瓦加斯重返总统职位后，任命他为海军部长（1951—1954年），任内借助巴西银行贷款推动累西腓海军基地等设施建设，并于1953年作为部长之一参与签署确立国家石油垄断、创建巴西石油公司的第2004号法律。1954年8月瓦加斯政治危机高峰中，他表态军中多数将领已反对政府；瓦加斯自杀后于8月25日去职。1955年11月洛特发动政变后，他一度出任海军参谋长，1956年短暂代理海军部长，同年因达退休年龄离开现役。"
 CBIO_BRA_salgado_filho_desc:0 "若阿金·佩德罗·萨尔加多·菲略，1888年7月2日生于南里奥格兰德州阿雷格里港，1950年7月30日卒于同州圣弗朗西斯科-德阿西斯，巴西律师、法官与政治家，推动巴西空军脱离陆军独立建军的关键人物，也是巴西历史上首任航空部长。他在1930年革命中支持瓦加斯，历任联邦区警察局职务、劳工工业商业部长（1932—1934年）、联邦众议员（1935—1937年）与最高军事法庭法官（1938—1941年）。1941年1月，他受命出任新设立的航空部首任部长（1941—1945年），主持统一陆军与海军的航空勤务及训练机构，促成巴西空军，1941年5月定名的诞生，并合并军用与海军航空邮政创建国家航空邮政、在阿丰苏斯校场创办航空学校；二战期间组建了赴意大利参战的第一战斗机大队与联络观测中队。1947年当选南里奥格兰德州联邦参议员，并任巴西劳工党主席。1950年7月30日，他在前往圣博尔雅拜会瓦加斯、商议大选途中，因洛克希德“北极星”客机撞山失事罹难，机上十人全部遇难。阿雷格里港萨尔加多·菲略国际机场即以其命名。"
 CBIO_BRA_silvio_de_noronha_desc:0 "西尔维奥·德·诺罗尼亚，1884年5月11日生于里约热内卢，1957年6月11日卒于同地，巴西海军上将，出身海军世家：其父儒利奥·塞萨尔·德·诺罗尼亚曾于1902至1906年任海军部长，堂兄伊萨伊亚斯·德·诺罗尼亚亦曾任海军部长，并作为三人军政府成员之一在1930年参与将政权移交给瓦加斯。他在海军中长期服役，累升至上将。杜特拉政府时期（1946—1951年）出任海军部长，任内致力于各级海军教育体系的重建，其中最著名者为1949年以法令重新设立海军学院，使之落址安格拉-杜斯雷斯。里约热内卢通往海军学校方向的西尔维奥·诺罗尼亚大道即以其命名。"
 CBIO_BRA_silvio_noronha_desc:0 "西尔维奥·德·诺罗尼亚，1884年5月11日生于里约热内卢，1957年6月11日卒于同地，巴西海军上将，出身海军世家：其父儒利奥·塞萨尔·德·诺罗尼亚曾于1902至1906年任海军部长，堂兄伊萨伊亚斯·德·诺罗尼亚亦曾任海军部长，并作为三人军政府成员之一在1930年参与将政权移交给瓦加斯。他在海军中长期服役，累升至上将。杜特拉政府时期（1946—1951年）出任海军部长，任内致力于各级海军教育体系的重建，其中最著名者为1949年以法令重新设立海军学院，使之落址安格拉-杜斯雷斯。里约热内卢通往海军学校方向的西尔维奥·诺罗尼亚大道即以其命名。"
 CBIO_BRA_washington_luis_desc:0 "华盛顿·路易斯·佩雷拉·德·索萨，1869年10月26日生于里约热内卢州马卡埃，1957年8月4日卒于圣保罗，巴西律师、历史学家与政治家，巴西第13任总统，旧共和国（“咖啡奶茶共和国”）的末任总统。他属圣保罗共和党，虽生于里约州、却在圣保罗成就政治生涯，人称“马卡埃的圣保罗人”，历任巴塔泰斯市议员与市长、州议员、州司法与公共安全书记、圣保罗市长（1914—1919年）、圣保罗州长（1920—1924年，任内应对1924年圣保罗起义）与联邦参议员。1926年11月15日就任总统，留下“社会问题即治安问题”之名言；同年他还邀请南里奥格兰德的热图利奥·瓦加斯出任其财政部长。任内遭遇1929年大萧条重创咖啡经济；他打破米纳斯与圣保罗轮流执政的默契、力挺圣保罗人朱利奥·普列斯特斯竞选总统，加之若昂·佩索阿遇刺，共同引爆1930年革命。1930年10月24日，在任期仅剩约三周时他被军方推翻，权力先移交塔索·弗拉戈索等组成的三人军政府，再转予瓦加斯。此后他流亡欧美长达十七年，1947年归国，专注巴西史研究，为圣保罗文学院院士。"
 CBIO_BRA_washington_luis_pereira_desc:0 "华盛顿·路易斯·佩雷拉·德·索萨，1869年10月26日生于里约热内卢州马卡埃，1957年8月4日卒于圣保罗，巴西律师、历史学家与政治家，巴西第13任总统，旧共和国（“咖啡奶茶共和国”）的末任总统。他属圣保罗共和党，虽生于里约州、却在圣保罗成就政治生涯，人称“马卡埃的圣保罗人”，历任巴塔泰斯市议员与市长、州议员、州司法与公共安全书记、圣保罗市长（1914—1919年）、圣保罗州长（1920—1924年，任内应对1924年圣保罗起义）与联邦参议员。1926年11月15日就任总统，留下“社会问题即治安问题”之名言；同年他还邀请南里奥格兰德的热图利奥·瓦加斯出任其财政部长。任内遭遇1929年大萧条重创咖啡经济；他打破米纳斯与圣保罗轮流执政的默契、力挺圣保罗人朱利奥·普列斯特斯竞选总统，加之若昂·佩索阿遇刺，共同引爆1930年革命。1930年10月24日，在任期仅剩约三周时他被军方推翻，权力先移交塔索·弗拉戈索等组成的三人军政府，再转予瓦加斯。此后他流亡欧美长达十七年，1947年归国，专注巴西史研究，为圣保罗文学院院士。"
 CBIO_GER_hans_von_luck_desc:0 "汉斯-乌尔里希·弗赖赫尔·冯·勒克·翁德·维滕（1911年—1997年）通称汉斯·冯·勒克，是德国装甲兵军官，军衔至上校。他生于弗伦斯堡一个普鲁士军人世家，父亲曾服役于帝国海军。1929年入国防军，1931—1932年在德累斯顿步兵学校接受隆美尔主持的军官训练。二战中，他先后在第七装甲师、第二十一装甲师服役，参加波兰战役、法国战役、巴巴罗萨行动和北非战场。诺曼底战役中，他以战斗群指挥官身份参与抵抗英军“古德伍德”行动。1945年被苏军俘虏，在高加索一带战俘营关押五年，1950年获释返回西德。战后写成回忆录《装甲指挥官》，1997年在汉堡逝世。"
 CBIO_GER_wilhelm_ritter_von_thoma_desc:0 "威廉·约瑟夫·里特尔·冯·托马（1891年—1948年）生于巴伐利亚达豪，是德国国防军装甲兵上将。“里特尔”是他因一战中作战英勇获巴伐利亚军事马克斯·约瑟夫勋章而获授的骑士头衔。1912年入巴伐利亚陆军，一战中转战西线、东线及塞尔维亚战场，多次负伤。战后留任国防军，钻研摩托化与装甲战术。西班牙内战期间，他任秃鹰军团地面装甲分队指挥官，支援佛朗哥军队。二战中，他先后参加波兰、法国和东线作战，后赴北非任非洲装甲集团军副司令。1942年阿拉曼战役中被英军俘虏，战后获释，1948年逝世。"
 CBIO_ITA_ferdinando_umberto_filippo_adalberto_desc:0 "斐迪南·翁贝托·菲利普·阿达尔贝托（1884年—1963年）通称萨伏伊的斐迪南多、第三代热那亚公爵，是意大利王室萨伏伊家族成员、意大利皇家海军上将。他生于都灵，是第二代热那亚公爵托马索亲王与巴伐利亚的伊莎贝拉公主之长子，系国王维托里奥·埃马努埃莱三世的堂弟。1904年获“乌迪内亲王”封号。一战中，他以上校军衔指挥侦察巡洋舰“斯帕尔维耶罗”号，并获英勇勋章。1917年率意大利战时使团访问美国。1931年父亲去世后继承热那亚公爵爵位，海军生涯后期晋上将，任上亚得里亚海舰队司令。1946年意大利公投废除君主制后，萨伏伊王朝统治结束。1963年在博尔迪盖拉逝世。"
 CBIO_TUR_abdulmejid_ii_desc:0 "阿卜杜勒迈西德二世（1868年—1944年）生于伊斯坦布尔多尔玛巴赫切宫，是苏丹阿卜杜勒阿齐兹之子、末代奥斯曼哈里发，也是唯一由土耳其大国民议会选举产生的哈里发。他自幼受私人教育，擅长绘画、文学与音乐，曾任奥斯曼艺术家协会主席。1918年表兄穆罕默德六世继位后，他被立为皇储。1922年11月苏丹制废除后，大国民议会选举他为哈里发，但其宗教地位因脱离世俗政权而广受质疑。1924年3月，土耳其废除哈里发制并驱逐奥斯曼皇室，他被迫离境，后定居巴黎。1944年在巴黎逝世，遗体最终安葬于麦地那。"
 CBIO_TUR_abdurrahman_gurman_desc:0 "阿卜杜勒拉赫曼·纳菲兹·居尔曼（约1882年—1966年2月6日，生年一说1887年）生于博德鲁姆，是奥斯曼军队军官、土耳其陆军将领，曾任土耳其第五任总参谋长。他自军事学院、总参谋学院毕业，参加过巴尔干战争——其间参与1912—1913年的斯库台（伊什科达）防御，一战中转战高加索战线，并曾作为努里帕夏（基利吉尔）的参谋长在北非“非洲集群司令部”任职。后加入凯末尔领导的民族运动，投身独立战争。共和国成立后历任军中多职，1949年继萨利赫·奥穆尔塔克之后出任总参谋长（1949—1950）。1950年民主党执政后，他因被疑涉政变嫌疑而与一批高级军官一同被勒令退役。退役后曾出任土耳其驻韩国及巴列维伊朗大使，至1959年卸任，1961年当选制宪会议议员。他通晓德语、法语，著有数部军事著作，包括关于巴尔干战争斯库台防御、一战北非土军及独立战争的专著。1966年2月6日在伊斯坦布尔逝世，葬于土耳其国家公墓。"
 CBIO_TUR_adnan_menderes_desc:0 "阿德南·曼德列斯（全名阿里·阿德南·埃尔特金·曼德列斯，1899年—1961年9月17日）生于艾登省科恰勒村，出身克里米亚鞑靼裔富裕地主家庭，幼年父母早逝。毕业于伊兹密尔美国学院，独立战争期间参战获勋章，后毕业于安卡拉大学法学院。1930年组织自由共和党艾登支部，该党解散后获凯末尔邀请加入共和人民党，1931年当选艾登议员。1945年因反对国有化政策遭开除党籍，同年联署要求政治自由的“四人备忘录”。1946年与拜亚尔等共创民主党，1950年5月该党在土耳其首次自由大选中获胜，曼德列斯出任总理并两度连任（1954、1957），1955年起兼外交部长。任内经济一度年增长近9%，加入北约并参加朝鲜战争，恢复阿拉伯语宣礼；1955年伊斯坦布尔反希腊骚乱中数千希腊族商铺教堂遭毁，事后证实系当局策划的挑衅。1959年其专机在伦敦近郊坠毁，他幸免于难。1960年5月军事政变爆发，曼德列斯连同拜亚尔等被捕，押至亚西亚达岛受审判处死刑，服安眠药自杀未遂后，不顾肯尼迪、伊丽莎白二世等求情，于9月17日在伊姆拉勒岛被绞死，外长佐尔卢、财长波拉特坎同案被处决。1990年获国会平反昭雪。"
 CBIO_TUR_ahmet_ali_celikten_desc:0 "艾哈迈德·阿里·切利克滕（1883年—1969年6月24日），本名伊兹密尔人阿利奥卢·艾哈迈德，生于奥斯曼帝国伊兹密尔，是非洲裔土耳其飞行员，被视为航空史上最早的黑人军事飞行员之一（一说为第一人）。其母系祖母是被奴隶贩子从博尔努（今尼日利亚一带）掳至伊斯坦布尔奴隶市场贩卖的奴隶，父母均有非洲-土耳其混血背景。他原想当海员，1904年入海军技术学校，1908年以中尉毕业，后进入1914年成立的耶希尔柯伊海军航空学校受训，加入奥斯曼空军。1916年11月11日，他成为航空史上最早的黑人军事飞行员之一；1917年2月晋上尉，年底被派往柏林进修飞行，其代号为“钢铁黑鹰”。一战期间其弟阵亡，他本人娶了来自普雷韦扎的移民哈蒂杰为妻。一战后他投身土耳其独立战争，志愿在科尼亚军用航空基地服役，1922年曾奉派赴黑海港口阿马斯拉协助转运飞机。他常被与为法国效力的非裔美国人尤金·布拉德相比——布拉德常被误称为首位黑人军事飞行员，而切利克滕获得飞行资格更早。他于1949年以空军上校军衔退役，并感召了家中众多成员投身飞行事业。1969年6月24日逝世。"
 CBIO_TUR_ahmet_fevzi_pasha_desc:0 "艾哈迈德·费齐帕夏生于迪兹杰，出身乌比赫“比格”家族，父亲名雅库布，须与元帅费夫齐·恰克马克（即“小费齐帕夏”）相区别。他于1913年自奥斯曼军事学院毕业，任奥斯曼第三集团军第九军军长。一战中参与1915年加里波利防御。他曾因反对在严冬向俄军发动进攻而被贝哈埃丁·沙基尔解除军长职务——只要费齐帕夏仍任军长，沙基尔便始终无法将第九军纳入统一进步委员会的掌控。奥斯曼战败、帝国遭占领瓜分后，他加入凯末尔的民族运动，投身独立战争。在效忠奥斯曼政府的“纪律部队”于安扎武尔叛乱中被切尔克斯·埃特姆部击溃后，他受命前往南马尔马拉的曼亚斯、格嫩一带为民族军招募切尔克斯人，但成效甚微，事后曾向卡齐姆·厄扎尔普坦言当地民众正等待时机再度举事。他一度被任命接替阿里·福阿德帕夏出任第二十军军长，却在拉乌夫贝伊与贝基尔·萨米贝伊的劝阻下拒绝就任。1947年在伊斯坦布尔逝世。"
 CBIO_TUR_ali_fuat_cebesoy_desc:0 "阿里·福阿德·杰贝索伊（1882年9月23日—1968年1月10日）生于伊斯坦布尔，与凯末尔、卡拉贝基尔、奥克亚尔同窗于奥斯曼军校，1905年总参谋学院毕业。一战中历任第八军参谋长、第二十五师师长，参加苏伊士运河攻势与加里波利战役，后转战高加索、巴勒斯坦，1917年晋将。停战后联络凯末尔，1919年6月与凯末尔、拉乌夫·奥尔巴伊、雷费特·贝莱共同签署《阿马西亚通告》，随即在安纳托利亚西部组织抵抗希腊占领的武装。锡瓦斯代表大会后任全国民族军总司令，其部进驻安卡拉促成凯末尔择此城为运动中心。1921年因西线受挫、与伊诺努不睦而改任驻莫斯科大使，亲自与列宁、斯大林谈判，签订《莫斯科条约》，为独立战争争取大量苏联军援。1924年与卡拉贝基尔等共创进步共和党并任总书记，该党1925年因谢赫赛义德起义牵连被取缔，1926年因伊兹密尔刺杀案受审获判无罪，退役后远离政坛四年。1931年复出，代表科尼亚、埃斯基谢希尔当选议员至1950年，历任公共工程部长、交通部长、大国民议会议长。1968年1月10日逝世，葬于独立战争首枪打响处的盖伊韦车站附近清真寺，1980年政变后迁葬安卡拉国家公墓。"
 CBIO_TUR_ali_ihsan_sabis_desc:0 "阿里·伊珊·萨比斯（1882年8月30日—1957年12月9日）生于伊斯坦布尔，奥斯曼末期将领，1904年以总参谋学院第一名毕业。一战期间历任第九军、第四军军长，1915—1918年间出任第六集团军司令，转战高加索与美索不达米亚战线，在库特地区对英军作战屡有斩获。1918年他奉命率部进入伊朗，围攻安德拉尼克所部亚美尼亚武装，其间对亚美尼亚平民犯下严重暴行:作为第五十一师师长期间该师所属亚美尼亚籍官兵遭就地处决，任第四集团军司令期间又以断粮饥饿手段致数以万计亚美尼亚人死亡；进驻伊朗大不里士后，他向亚美尼亚代表团公开承认在霍伊一带不分老幼大肆屠杀，并向亚美尼亚教会代表声称已使五十万亚美尼亚人罹难，并下令屠戮马库的亚美尼亚人。一战结束前夕，其第六集团军残部在沙尔卡特之战中败于英印联军，摩苏尔随后落入英军之手。战后他在伊斯坦布尔被捕，流放马耳他，1921年获释返国投身独立战争，出任第一集团军司令，但在杜姆卢平纳决战前夕即退役。二战期间他曾任亲纳粹刊物《土耳其邮报》负责人，因致信威胁日趋反德的总统伊诺努而遭军事法庭审判，服刑十五个月。1957年12月9日逝世。"
 CBIO_TUR_celal_bayar_desc:0 "马哈茂特·杰拉勒丁（杰拉勒）·拜亚尔（1883年5月16日—1986年8月22日）生于布尔萨附近格姆利克，父亲是保加利亚移民的伊斯兰教法学者。早年在银行任职，1907年加入青年土耳其党，建立伊兹密尔、布尔萨分部。一战末期组织抵抗占领的地下武装，遭苏丹政府通缉，后加入民族运动，1921—1924年历任经济部长、重建定居部长。1924年创立土耳其首家国家银行“实业银行”并任行长至1932年，1932—1937年再任经济部长，主导国家工业化。1937年获凯末尔任命为总理，1938年凯末尔逝世后留任至1939年初，因经济政见与新总统伊诺努不合辞职。1945年脱离执政党，1946年与曼德列斯等共创民主党，开启多党制时代。1950年5月大选获胜，拜亚尔当选第三任总统，是首位非军方背景总统，1954、1957年两度连任，共任十年，任内加入北约、参加朝鲜战争。1960年军事政变，拜亚尔与曼德列斯被捕受审，1961年判死刑后因高龄减为终身监禁，幸免于处决命运。1964年获释，1966年获大赦，1974年恢复政治权利但未再涉足政坛。1986年8月22日逝世，享年103岁，是现代史上最长寿的国家元首之一。"
 CBIO_TUR_cemil_cahit_toydemir_desc:0 "杰米尔·贾希特·托伊代米尔（1883年—1956年7月15日）生于伊斯坦布尔，出身切尔克斯（乌比赫）裔家庭。1902年自奥斯曼军事学院毕业，历经意土战争、巴尔干战争，一战中转战高加索战线，指挥团、师级部队。穆德罗斯停战后加入民族运动，1919年9月出席锡瓦斯代表大会，跻身支持凯末尔的北高加索青年军官核心圈；同年7月抵萨姆松任第五高加索师师长，1922年独立战争收官阶段任第十师师长。1939年任宪兵总司令，1943年起任第一集团军司令，1946年6月退役。1943年夏，他奉伊诺努总统之命率土耳其军事代表团对纳粹德国进行官方访问，时值库尔斯克会战前夕，先后考察大西洋壁垒与东线战场，与土耳其军官一同察看虎I坦克，并与曼施坦因会面；访问中会见希特勒、凯特尔、约德尔等人。返国后他向伊诺努提交报告，判断德国终将战败。1946年8月至1947年9月出任国防部长，并以伊斯坦布尔选区代表身份当选大国民议会议员（1946—1950）。1956年7月15日在伊斯坦布尔逝世，葬于土耳其国家公墓。"
 CBIO_TUR_durrushehvar_desc:0 "杜露塞瓦尔苏丹（全名哈蒂杰·哈伊里耶·阿伊舍·杜露塞瓦尔，1914年1月26日—2006年2月7日）生于伊斯坦布尔于斯屈达尔恰姆勒贾宫，末代哈里发阿卜杜勒迈西德二世的独生女。1924年哈里发制废除后随家族流亡巴黎，曾是波斯王储（后为巴列维国王）与埃及国王法鲁克的求婚对象。1931年其父为她安排嫁与海得拉巴第七代尼扎姆（时称“世界首富”）长子阿扎姆贾赫，堂姐尼鲁费尔同时许配尼扎姆次子莫阿扎姆贾赫，两对婚礼于法国尼斯举行；同年12月经威尼斯启程赴印度途中，据传曾与同船的甘地相遇。抵海得拉巴后获封“杜尔达娜贝古姆”及“贝拉尔公主”称号，1933、1939年先后诞下二子，长子穆卡拉姆贾赫后被祖父尼扎姆越过其父指定为王位继承人。她通晓土耳其、法、英、乌尔都四语，在海得拉巴大力倡导女性教育与医疗，推动废除深闺制，创办女子学院、医院及妇产机构，并主持开通海得拉巴贝古姆佩特机场，是首位为机场剪彩的女性。约1954年与阿扎姆贾赫离婚，此后移居伦敦。1944年其父逝世，土耳其政府拒绝其归葬伊斯坦布尔，她因此终生拒绝在土耳其下葬。2006年2月7日在伦敦逝世，葬于布鲁克伍德公墓。"
 CBIO_TUR_durrushehvar_i_desc:0 "杜露塞瓦尔苏丹（全名哈蒂杰·哈伊里耶·阿伊舍·杜露塞瓦尔，1914年1月26日—2006年2月7日）生于伊斯坦布尔于斯屈达尔恰姆勒贾宫，末代哈里发阿卜杜勒迈西德二世的独生女。1924年哈里发制废除后随家族流亡巴黎，曾是波斯王储（后为巴列维国王）与埃及国王法鲁克的求婚对象。1931年其父为她安排嫁与海得拉巴第七代尼扎姆（时称“世界首富”）长子阿扎姆贾赫，堂姐尼鲁费尔同时许配尼扎姆次子莫阿扎姆贾赫，两对婚礼于法国尼斯举行；同年12月经威尼斯启程赴印度途中，据传曾与同船的甘地相遇。抵海得拉巴后获封“杜尔达娜贝古姆”及“贝拉尔公主”称号，1933、1939年先后诞下二子，长子穆卡拉姆贾赫后被祖父尼扎姆越过其父指定为王位继承人。她通晓土耳其、法、英、乌尔都四语，在海得拉巴大力倡导女性教育与医疗，推动废除深闺制，创办女子学院、医院及妇产机构，并主持开通海得拉巴贝古姆佩特机场，是首位为机场剪彩的女性。约1954年与阿扎姆贾赫离婚，此后移居伦敦。1944年其父逝世，土耳其政府拒绝其归葬伊斯坦布尔，她因此终生拒绝在土耳其下葬。2006年2月7日在伦敦逝世，葬于布鲁克伍德公墓。"
 CBIO_TUR_elyesa_bazna_desc:0 "埃利耶萨·巴兹纳（约1904年7月28日—1970年12月21日），代号“西塞罗”，是二战期间为纳粹德国效力的著名间谍。他是科索沃出身的阿尔巴尼亚裔，幼年随家迁居伊斯坦布尔并入土耳其籍；早年经历驳杂，曾从军、做过锁匠、司机，甚至当过职业歌剧演唱者。1943年，他受雇为英国驻安卡拉大使休·纳奇布尔-休格森的贴身男仆。利用大使将机密文件带回住所的习惯，他凭锁匠技艺复制了文件箱与保险柜的钥匙，拍摄大量英方绝密文件（涉及盟军战略、兵力部署及土耳其参战问题），自1943年10月起经德国武官莫伊齐施出售给德方，由德国大使冯·巴本赐其代号“西塞罗”，史称“西塞罗事件”。其情报价值极高，一度可能危及诺曼底登陆计划，但因德国高层（尤其里宾特洛甫）怀疑他是双面间谍而大多未予采用，德方支付的报酬亦大半是伪钞。1944年初，因德方一名女秘书叛逃、英方警觉，他停止活动并辞去男仆之职。战后他试图用所得开办旅馆，却发现钞票系伪造，还因使用假钞短暂入狱。晚年他在慕尼黑当守夜人，向西德申请抚恤金被拒，1962年出版回忆录《我是西塞罗》。1970年12月21日，他穷困潦倒地病逝于慕尼黑。"
 CBIO_TUR_fahrettin_altay_desc:0 "法瑞丁·阿勒泰（1880年1月12日—1974年10月25日）生于斯库台（今阿尔巴尼亚什科德拉），父亲为来自伊兹密尔的步兵中校伊斯麦尔贝伊。1897年以第一名考入伊斯坦布尔军事学院，1900年毕业，1902年自总参谋学院结业。巴尔干战争中任恰塔尔贾骑兵旅指挥官，抵御保加利亚军；一战中任第三军参谋长，转战恰纳卡莱（加里波利）战线，首次与穆斯塔法·凯末尔结识，后赴罗马尼亚、巴勒斯坦战线，战争结束时在科尼亚任第十二军军长。独立战争期间任第五骑兵军军长，这是他一生最为人称道的战功所在：1922年8月杜姆卢平纳战役中，第五骑兵军绕至希腊军队后方，切断其补给与通讯，助力俘获希军总司令特里库皮斯将军；9月9日，他麾下骑兵成为最先开进伊兹密尔的土耳其部队，结束希腊三年占领。1926年晋上将，1927年恰克马克外出期间曾代理总参谋长。其姓氏“阿勒泰”（意为枣红色的马驹）由阿塔图尔克所赐；1933—1935年参与勘定阿富汗与伊朗边界。1945年退役，1946—1950年任共和人民党布尔杜尔选区议员，此后退出政坛，著有多部独立战争骑兵作战史。1974年在伊斯坦布尔逝世。土耳其国产“阿勒泰”主战坦克即以他命名。"
 CBIO_TUR_fakhri_pasha_desc:0 "法赫里帕夏，即奥梅尔·法赫雷丁·土尔康，1868年—1948年11月22日，生于鲁斯丘克（今保加利亚鲁塞），幼年随家迁居伊斯坦布尔。1888年自军事学院毕业（骑兵少尉），1891年总参谋学院结业，早年在第四集团军东部边境服役。他参加过意土战争与巴尔干战争，巴尔干战争中任驻加里波利第三十一师师长，并与恩维尔一同收复埃迪尔内（阿德里安堡）。1914年任驻摩苏尔第十二军军长，同年11月晋少将，后任驻阿勒颇第四集团军副司令。一战中，因麦加谢里夫侯赛因酝酿起义，他奉杰马勒帕夏之命于1916年5月赴汉志守卫麦地那，7月17日起任汉志远征军司令。面对阿拉伯起义军与英军的围攻，他以寡敌众坚守圣城，并全力保护希贾兹铁路免遭破坏（铁路沿线曾遭劳伦斯等组织的频繁袭击）；1917年5月，他将麦地那的圣物与珍贵手稿运往伊斯坦布尔妥善保存。因坚韧防御，英、阿方面称他为“沙漠之虎”“沙漠雄狮”。1918年10月《穆德罗斯停战协定》签订后，他拒绝投降撤离，战后仍让奥斯曼旗在麦地那飘扬七十二天，苏丹将其免职亦不从；1919年1月10日，他终因粮尽力竭被自己的部下挟持，交予埃米尔阿卜杜拉。此后他先后被押往开罗、马耳他，1921年获释返国，同年大国民议会任命他为驻喀布尔大使，成功争取了阿富汗对独立战争的支持。1926年归国后任军事法庭委员会委员、主席，1936年以少将军衔退役。1948年11月22日逝世，葬于阿希扬公墓。"
 CBIO_TUR_ferdinando_umberto_desc:0 "斐迪南·翁贝托·菲利普·阿达尔贝托（1884年—1963年）通称萨伏伊的斐迪南多、第三代热那亚公爵，是意大利王室萨伏伊家族成员、意大利皇家海军上将。他生于都灵，是第二代热那亚公爵托马索亲王与巴伐利亚的伊莎贝拉公主之长子，系国王维托里奥·埃马努埃莱三世的堂弟。1904年获“乌迪内亲王”封号。一战中，他以上校军衔指挥侦察巡洋舰“斯帕尔维耶罗”号，并获英勇勋章。1917年率意大利战时使团访问美国。1931年父亲去世后继承热那亚公爵爵位，海军生涯后期晋上将，任上亚得里亚海舰队司令。1946年意大利公投废除君主制后，萨伏伊王朝统治结束。1963年在博尔迪盖拉逝世。"
 CBIO_TUR_fethi_okyar_desc:0 "费特希·奥克亚尔（全名阿里·费特希·奥克亚尔，1880年4月29日—1943年5月7日）生于马其顿普里莱普（今北马其顿），土耳其外交家、政治家，土耳其第二任总理。早年与凯末尔同窗于莫纳斯提尔军校，1907年加入统一进步委员会并劝说凯末尔加入，参与1908年青年土耳其党革命宣言起草，加入推翻苏丹阿卜杜勒哈米德二世的“行动军”。1909—1911年任驻巴黎武官。一战后被监禁两年并流放马耳他，1921年获释加入民族运动，任安卡拉政府内政部长。1923年8月至共和国成立后任总理，11月当选大国民议会第二任议长；1924年11月再度出任总理，1925年因谢赫赛义德起义需强硬政策而由伊诺努接替，后任驻巴黎大使。1930年8月奉凯末尔之命创立自由共和党，任党魁，该党迅速吸引大量反凯末尔改革的保守与少数族裔支持者，引发动荡，同年11月经凯末尔劝说自行解散。此后再任驻巴黎、伦敦大使，1934年获赐姓“奥克亚尔”，促成英土关系缓和，参与《蒙特勒公约》谈判。凯末尔逝世后，伊诺努推行和解政策，他于1939年回国复出，任萨伊达姆内阁司法部长至1941年。1942年退休，1943年5月7日在伊斯坦布尔逝世。"
 CBIO_TUR_fevzi_cakmak_desc:0 "穆斯塔法·费夫齐·恰克马克（1876年1月12日—1950年4月10日）生于伊斯坦布尔锡汉吉尔，父亲为炮兵军官。1896年军事学院步兵中尉毕业，后入总参谋学院深造，参与意土战争、第一次巴尔干战争。一战期间历任达达尼尔第五军军长、高加索第二军军长等职，1918年12月任奥斯曼总参谋长。1920年4月加入安纳托利亚民族运动，任国防部长兼副总理，旧奥斯曼军事法庭因此缺席判处其死刑。库塔希亚-阿尔滕塔什战役失利后他接管军队稳住溃退，1921年8月辞去国防部长改任总参谋长部长，旋即指挥萨卡里亚河战役击败希腊军队；1922年7月辞去总理职务（此前曾短暂任总理），与凯末尔共同策划指挥杜姆卢平纳战役大胜，同年8月经凯末尔推荐晋元帅，是共和国历史上仅有的两位元帅之一。1923年起续任首任总参谋长直至1944年退役，任职逾二十年，期间于1925年指挥镇压谢赫赛义德起义。1938年凯末尔逝世后曾是总统候选人，让位于伊诺努。1946年作为独立候选人加入民主党当选议员，后因不满转投保守派民族党出任名誉主席。精通法、英、德、俄、波斯、阿拉伯等多种语言。1950年4月10日在伊斯坦布尔家中逝世，葬于埃于普公墓。"
 CBIO_TUR_halide_edib_adivar_desc:0 "哈莉黛·埃迪布·阿迪瓦尔（1884年6月11日—1964年1月9日）生于伊斯坦布尔上层家庭，父亲曾任苏丹阿卜杜勒哈米德二世的秘书，是土耳其小说家、教师，也是民族主义与女性主义知识分子、土耳其妇女解放的先驱。她是首位毕业于伊斯坦布尔美国女子学院的穆斯林女性，1908年起以笔名为《塔宁报》撰稿；1910年因首任丈夫娶第二房而离婚，1917年改嫁医生兼政治家阿德南·阿迪瓦尔，“阿迪瓦尔”姓氏由阿塔图尔克于1934年所赐。她创办妇女权利团体、参与“土耳其炉”，著有泛突厥色彩的《新图兰》（1912）。一战中她任贝鲁特、大马士革、阿勒颇的学校督察，并管理安托拉（今黎巴嫩）一所孤儿院，院中亚美尼亚大屠杀的孤儿被施以强制土耳其化同化；她在回忆录中称本意是救人、并不认同此举，但历史学者对此说法存在争议。独立战争中她以雄辩的演说（如苏丹艾哈迈德广场集会）闻名，协助向安纳托利亚偷运武器，与尤努斯·纳迪共创阿纳多卢通讯社，1920年随夫赴安卡拉投身民族运动，曾遭奥斯曼当局缺席判处死刑，并在前线获军衔、被视为战争英雄。代表作《火衫》（1922）是土耳其文学史上第一部战争小说。其夫参与进步共和党、该党1925年被取缔后，夫妇被控叛国，1926—1939年流亡欧美，曾在哥伦比亚大学客座并应甘地之邀赴印度。1939年归国后任伊斯坦布尔大学英国文学教授，1950年当选伊兹密尔选区议员，1954年辞职。1964年1月9日逝世，一生著有二十余部小说，被誉为“土耳其的圣女贞德”。"
 CBIO_TUR_halil_kut_desc:0 "哈里里·库特，又称哈里里帕夏（1881年—1957年），生于伊斯坦布尔，是奥斯曼末期军事将领、战争大臣恩维尔帕夏之叔，也是军火实业家努里·基利吉尔之叔。1905年自军事学院毕业，在马其顿第三集团军服役期间加入统一进步委员会，后参加意土战争与巴尔干战争。一战期间，他先后在高加索和伊拉克战线任职，1915年底接替努雷丁帕夏指挥驻伊拉克奥斯曼军。1916年库特阿马拉围城战中，他迫使被困英印军投降，因此获“库特阿马拉英雄”称号，1934年取姓“库特”。在亚美尼亚大屠杀期间，他对针对亚美尼亚及亚述平民的暴行负有重大责任。战后被英军逮捕并流放马耳他，1920年越狱赴莫斯科，曾充当布尔什维克与凯末尔民族运动之间的中间人。1957年逝世。"
 CBIO_TUR_hans_von_luck_desc:0 "汉斯-乌尔里希·弗赖赫尔·冯·勒克·翁德·维滕（1911年—1997年）通称汉斯·冯·勒克，是德国装甲兵军官，军衔至上校。他生于弗伦斯堡一个普鲁士军人世家，父亲曾服役于帝国海军。1929年入国防军，1931—1932年在德累斯顿步兵学校接受隆美尔主持的军官训练。二战中，他先后在第七装甲师、第二十一装甲师服役，参加波兰战役、法国战役、巴巴罗萨行动和北非战场。诺曼底战役中，他以战斗群指挥官身份参与抵抗英军“古德伍德”行动。1945年被苏军俘虏，在高加索一带战俘营关押五年，1950年获释返回西德。战后写成回忆录《装甲指挥官》，1997年在汉堡逝世。"
 CBIO_TUR_hasan_saka_desc:0 "哈桑·许斯努·萨卡（1885年—1960年7月29日）生于特拉布宗，是土耳其政治家、经济学家与外交官。1908年自帝国行政学校毕业，入会计法院任职，1909年由奥斯曼政府派往法国，在巴黎政治学院攻读外交。他当选末届奥斯曼议会特拉布宗议员，1921年1月28日当选大国民议会特拉布宗议员，同年任财政部长，并作为土耳其代表团成员出席洛桑会议。1944年9月任外交部长，1945年率土耳其代表团出席奠定联合国基础的旧金山会议。1947年9月接替佩克尔出任总理，其间正值土耳其向多党制过渡，他致力于改善党派关系、推动民主化，任内确立了“秘密投票、公开计票”原则；1948年6月辞职后又受命组阁，连任至1949年1月，因经济与政治困局辞去总理职务，由居纳尔塔纳继任。此后任共和人民党议会党团副主席，1954年退出政坛。1960年7月29日在伊斯坦布尔逝世，葬于津吉尔利库尤公墓。"
 CBIO_TUR_hayrullah_fisek_desc:0 "哈伊鲁拉·菲塞克（1885年6月3日—1975年7月13日）出生于卡尔坎德伦（今北马其顿泰托沃），系阿尔巴尼亚与土耳其混血家族后裔，“菲塞克”家族姓氏可追溯至18世纪末先祖苏莱曼阿加。1901年入奥斯曼军事学院，1904年以全班第七名毕业任步兵少尉，1906年参谋学院毕业获“优等上尉”军衔。独立战争期间，他参与萨卡里亚河战役任临时军参谋长，后历任第十四军、科贾埃利集团军、第三军参谋长，军衔升至参谋中校，亦参与巴勒克埃西尔、索马、班德尔马等地战斗；1921年9月萨卡里亚河战役期间，他曾与恰克马克、厄扎尔普、凯末尔、伊诺努一同在波拉特勒前线观察哨现场。此后晋升少将，出任国防部副国务秘书，1945年退役。其子努斯雷特·菲塞克后任卫生部副国务秘书及著名公共卫生学者，另一子希克里·菲塞克为国际法教授。哈伊鲁拉·菲塞克本人虽非历史聚光灯下的核心人物，却始终活跃于独立战争及共和国建国一线，是凯末尔身边重要的幕僚型将领之一。1975年7月13日逝世。"
 CBIO_TUR_hazi_aslanov_desc:0 "哈兹·阿哈德奥卢·阿斯兰诺夫（1910年—1945年）是阿塞拜疆塔利什族出身的苏联装甲兵少将，两次荣获“苏联英雄”称号。他生于伦科兰砖厂工人家庭，1923年丧父后辍学，后入巴库外高加索军事预备学校，转入列宁格勒骑兵学校并修读装甲兵课程。1931年起任骑兵排长，1933年转入坦克兵，1939年随苏军入侵波兰，后参加苏芬冬季战争。苏德战争爆发后，他历任摩托运输营长、坦克营长，在绍斯特卡等地战斗中负伤仍坚持指挥。1942年任第五十五坦克旅副旅长、旅长，参加斯大林格勒战役，在维尔赫涅库姆斯克重创曼施坦因集团军的解围尝试。1942年12月获颁首枚“苏联英雄”勋章。1945年1月在拉脱维亚普里耶库莱附近侦察时重伤牺牲。"
 CBIO_TUR_hilmi_uran_desc:0 "希勒米·乌兰（约1886年—1957年10月21日）生于博德鲁姆，是土耳其政治家、政府部长。他毕业于政治学院，奥斯曼末期曾任伊兹密尔省门内门、切什梅两地的县长，并以门特谢（穆拉）选区代表身份进入奥斯曼议会。共和国成立后，他于1927—1950年任阿达纳省塞伊汉选区议员，先后出任公共工程部长（1930—1933）、司法部长（1938—1939）及内政部长（1943—1946）。他是共和人民党的活跃成员，并曾任该党总书记。1957年10月21日逝世。"
 CBIO_TUR_ismet_inonu_desc:0 "穆斯塔法·伊斯麦特·伊诺努（1884年9月24日—1973年12月25日）生于伊兹密尔，1903年炮兵学校毕业，后入伊斯坦布尔总参谋学院。一战中先后任加里波利战线参谋长、东线第二集团军指挥官，1917年高加索战场与凯末尔重逢并结为终身挚友。独立战争期间，他于1920年10月任西部前线司令，1921年两次在伊诺努地区击退希腊军队（其姓氏即源于此），萨卡里亚河战役后晋中将。1922—1924年任新生陆军首任总参谋长，并作为安卡拉政府首席代表出席穆丹亚停战谈判及洛桑会议。1923年10月30日出任土耳其首任总理，此后在凯末尔总统任内三度组阁，1934年获“伊诺努”姓氏。1937年因经济政策分歧辞职，由拜亚尔接任。1938年11月凯末尔逝世后当选第二任总统，获“国家领袖”称号；任内强力镇压谢赫赛义德起义、推行独立法庭死刑判决、压制反对党，二战中维持武装中立直至1945年才正式加入盟军，1939年并入哈塔伊。1946年推动多党制，1950年大选败给民主党后和平交权，任反对党领袖十年；1960年政变后再度组阁。1973年12月25日在安卡拉因心脏病逝世，葬于阿尼特卡比尔陵园。"
 CBIO_TUR_izzettin_calislar_desc:0 "伊扎丁·恰勒什拉尔（1882年—1951年8月20日）出生于雅尼纳省雅尼亚（今希腊约阿尼纳），1903年加入奥斯曼军队，因在加里波利战役中的表现崭露头角。一战后加入凯末尔领导的民族运动，投身独立战争，先后指挥第六十一师等多支部队，参与第二次伊诺努战役、萨卡里亚河战役及收复伊兹密尔的最后决战，是凯末尔主义军事运动的重要将领之一。战后转入政界，当选大国民议会议员，先后代表艾登、穆拉、巴勒克埃西尔等选区，始终是凯末尔改革事业的坚定支持者。他著有多部关于独立战争各战役的军事著作，包括《第二次伊诺努战役中的第六十一师》《萨卡里亚河会战中的第一集团军》《从萨卡里亚到伊兹密尔的第一军》等，为后世研究独立战争留下重要史料。1951年8月20日在伊斯坦布尔逝世，葬于土耳其国家公墓。"
 CBIO_TUR_kamil_tolon_desc:0 "卡米尔·厄兹代米尔·托隆（1912年2月29日—1978年7月23日）生于伊斯坦布尔贝伊莱尔贝伊，是土耳其实业家、发明家，以在土耳其首次制造出电动机而知名，并非军事人物。他本想成为工程师，但因当时缺少工科院校而转入安卡拉大学法学院，1935年毕业，曾短暂任邮电局稽查员。后迁居布尔萨，1937年创办“托隆机械”，生产各类机械。1944年应征入伍，期间继续为军队研制发明；退役后转产联合收割机、水泵、洗衣机、洗碗机等。1958年布尔萨大火烧毁其作坊，他在红新月会帐篷中坚持生产，并自1959年起亲自设计建造新工厂，1960年投产后销路大增，门店遍及全国六十余省。他是正义党创始成员之一，1963—1965年任布尔萨工商会主席，对土耳其首个有组织工业区的建立起到关键作用。1935年姓氏法颁布时他取姓“托隆乔克”（意为“极有才干”），1944年简化为“托隆”。1978年在瑞士日内瓦因栓塞逝世，被视为土耳其工业化的重要推动者之一。"
 CBIO_TUR_kazim_karabekir_desc:0 "穆萨·卡齐姆·卡拉贝基尔（1882年7月23日—1948年1月26日）生于伊斯坦布尔，父亲是奥斯曼将领。1902年战争学院毕业，一战中曾任德国将领冯·德尔·戈尔茨参谋长，1916年率第十八军从英军手中攻占库特阿马拉。奥斯曼战败后，他拒绝苏丹缴械投降的命令，向东安纳托利亚民众分发武器，并在埃尔祖鲁姆代表大会前夕派骑兵旅保护初抵当地的凯末尔。1920年6月任新成立的东部战线司令，同年9月起对亚美尼亚发动军事行动，攻占萨勒卡默什、卡尔斯，进抵亚历山德罗波尔，土军此役亦对当地平民施以包括屠杀在内的暴行，数万人丧生；同年12月与亚美尼亚签约迫其割地。1923年获大国民议会最高荣誉“独立勋章”，1924年10月退役从政，因与凯末尔在哈里发制废除步调上存在分歧，同年11月与杰贝索伊等人创立反对党“进步共和党”，该党被指与1925年谢赫赛义德起义有牵连，遭政府取缔，本人被捕，后经凯末尔干预无罪开释，但二人自此绝交。此后近十五年他在监视下闲居伊斯坦布尔撰写回忆录，著作一度被收缴焚毁。1938年凯末尔逝世后，挚友伊诺努为他平反，1939年重返议会，1946年当选议长，1948年1月26日在任内心脏病逝世。"
 CBIO_TUR_kazim_orbay_desc:0 "穆罕默德·卡齐姆·奥尔巴伊（1887年3月11日—1964年6月3日）生于士麦那（今伊兹密尔），1904年皇家陆军工程学校毕业任炮兵中尉，1907年参谋学院毕业。一战中任奥斯曼战争部首席副官，是恩维尔帕夏的亲信（后娶其妹梅迪哈为妻），1915年作为奥斯曼代表随“尼德迈尔-亨蒂希远征团”出使阿富汗，向阿富汗埃米尔呈递苏丹“圣战”宣言。独立战争期间历任东部战线、高加索地区指挥职务，1922年8月杜姆卢平纳决战中率部俘获希腊两名师长、75名军官、约两千士兵，并将俘虏指挥官带至凯末尔帕夏面前，亲历凯末尔对待俘虏的宽厚态度。同年晋准将，任第三高加索师师长。1926年晋中将任副总参谋长，1928—1929年出任阿富汗王国总参谋长，1935年晋上将，1937—1938年指挥镇压代尔西姆叛乱，该行动后于1953年遭议会请愿委员会调查。1944年1月接替恰克马克出任第三任总参谋长，1946年7月因其子哈什梅特涉入一桩谋杀政治丑闻而辞职，1950年正式退役。1960年政变后于1961年当选参议员并任议会议长。1964年6月3日因胃癌在安卡拉逝世，葬于土耳其国家公墓。"
 CBIO_TUR_kazim_ozalp_desc:0 "卡齐姆·菲克里·厄扎尔普（1882年2月17日—1968年6月6日）生于科普吕卢（今北马其顿韦莱斯），出身阿尔巴尼亚裔家庭，是独立战争的重要人物之一。1902年自奥斯曼军事学院毕业，1905年总参谋学院结业，曾卷入1909年三十一日事件，巴尔干战争中任奥斯曼军指挥官，1917年晋上校。伊兹密尔遭希腊占领后，他是组织抵抗力量的军事指挥官之一，独立战争期间转战多条战线，1921年因萨卡里亚河战役战功晋将。作为巴勒克埃西尔选区议员，他于1921—1925年及1935—1939年两度出任国防部长，1924—1935年长期担任大国民议会议长，是凯末尔推行改革的重要支柱之一（1924年他与伊诺努、恰克马克一同认可了废除哈里发制）。1950年当选凡省议员，1954年退出政坛。他著有回忆录《民族斗争》，坊间曾传其为贝克塔什教团成员（或因其反对关闭教团道堂）。1968年6月6日在安卡拉逝世，遗体迁葬于土耳其国家公墓。"
 CBIO_TUR_mehmet_ali_ulgen_desc:0 "穆罕默德·阿里·乌尔根（1887年—1952年7月23日）生于伊斯坦布尔，是一名土耳其海军上将，曾任土耳其海军首任司令（1949年7月1日—1950年）。他约1905年自海军学校毕业任少尉入海军，先后在多艘炮舰、战舰上任炮术军官并接受海上训练。1925年晋海军中校，1936年晋海军少将，1945年晋海军中将，1948年晋海军上将。其间他历任海军部处长、舰队司令、马尔马拉海军基地司令、科贾埃利筑垒地域司令及战斗舰队司令等职，1948年后并任国防部次长。1949年7月出任新设的土耳其海军司令部首任司令，一年后由萨德克·阿尔丁坎接任，旋即自愿退役。1952年7月23日在伊斯坦布尔逝世。"
 CBIO_TUR_mehmet_emin_yurdakul_desc:0 "梅赫梅特·埃明·尤尔达库尔（1869年5月13日—1944年1月14日）生于伊斯坦布尔，父亲是渔民，是土耳其民族主义作家、诗人与政治人物，被尊为土耳其的“民族诗人”，也是泛突厥主义的思想代表之一，其诗文对界定“祖国”一词影响深远。因家境困难，他未能正式完成学业，早年即进入奥斯曼行政机构任职。1891年出版《美德与高贵》，1892年在伊斯坦布尔结识思想家哲马尔丁·阿富汗尼并受其影响。1898年前后出版诗集《土耳其语诗篇》。1907年加入统一进步委员会，1908年后历任奥斯曼数省省长，并自1911年起活跃于“土耳其人协会”“土耳其炉”等泛突厥团体。他坚持使用质朴纯净的土耳其语、采用民间音节格律，其爱国与英雄主题的诗作在一战期间广为流传。1913年他当选代表摩苏尔的奥斯曼议员；共和国成立后任大国民议会议员，支持采用新土耳其字母。1944年1月14日逝世，葬于津吉尔利库尤公墓。"
 CBIO_TUR_mehmet_esat_pasha_desc:0 "穆罕默德·艾萨特帕夏（姓氏法后改称穆罕默德·艾萨特·比尔卡特，1862年10月18日—1952年11月2日）生于雅尼纳（今希腊约阿尼纳），出身当地穆斯林家庭（一说阿尔巴尼亚裔），父亲曾任该城市长，其弟韦希卜帕夏亦为名将。1887年以全班第一自伊斯坦布尔军事学院毕业，1890年总参谋学院结业后赴德国（斯特拉斯堡、柏林）受训四年，归国后曾任改革奥斯曼军队的德国将领冯·德尔·戈尔茨的副官。1897年希土战争任军参谋长，后执教军事学院，1902年晋将。巴尔干战争中任雅尼纳军军长，率部据守雅尼纳近七个月，1913年比扎尼会战后被迫投降，在希腊战俘营关押至年底；此役令他获“帕夏”尊号与英雄声望。1913年12月起任加里波利第三军军长。一战加里波利战役中，世人多聚焦于第五集团军德国司令利曼·冯·赞德斯及其部下穆斯塔法·凯末尔，但真正在战前筹划奥斯曼防御、统领北部战线的正是艾萨特本人。1915年9月晋中将，11月接替戈尔茨任第一集团军司令，此后历任第五、第三集团军司令。穆德罗斯停战后任名义上的第二集团军督察，1919年11月退役；1920年曾任萨利赫·胡卢西帕夏内阁的海军部长，后加入凯末尔的民族运动。1934年依姓氏法取姓“比尔卡特”，晚年撰有六卷本《恰纳卡莱回忆录》等未刊著作。1952年11月2日逝世。"
 CBIO_TUR_mehmet_fahri_engin_desc:0 "穆罕默德·法赫里·恩金（1888年—1970年11月6日）生于伊斯坦布尔，是奥斯曼海军出身的土耳其海军将领与政治家。他毕业于海军学校，并在英国朴茨茅斯海军学校深造，后任土耳其舰队司令（约1928—1930年）及海军军事学院院长，并曾任海事银行顾问。他以共和人民党党员身份当选萨姆松选区议员（第五届补选及第六、七届），并出任运输（交通）部长（1941年11月—1943年3月）。他已婚，育有二子。1970年11月6日逝世。"
 CBIO_TUR_mehmet_gunaltay_desc:0 "穆罕默德·谢姆塞廷·居纳尔塔纳（1883年7月17日—1961年10月19日）生于马穆雷图阿齐兹省的凯马利耶（埃因），父亲是经学院教师，是土耳其历史学家与政治家，1949—1950年任土耳其总理。他受过经学院与世俗双重教育，毕业于维法高中、师范学院，并在瑞士洛桑大学攻读物理。回国后任中学教师，其间结识泛突厥主义思想家齐亚·格卡尔普，受其影响转而研究土耳其历史。1914年起任伊斯坦布尔大学文学院“突厥与伊斯兰民族史”教授。1915年当选奥斯曼议员，独立战争期间加入“安纳托利亚与鲁梅利权利保护协会”。共和国成立后，他长期任锡瓦斯选区议员（1923—1950，共和人民党）。1949年1月哈桑·萨卡辞职后，他受伊诺努委任组阁，任总理至1950年5月民主党执政为止，是土耳其单一政党时代的末任总理；任内他重开安卡拉大学神学院，并推动确立秘密投票制。他自1941年起任土耳其历史学会会长直至去世。1961年10月19日在伊斯坦布尔逝世。"
 CBIO_TUR_mehmet_nuri_yamut_desc:0 "穆罕默德·努里·雅穆特帕夏（1890年—1961年6月5日）生于萨洛尼卡（今希腊塞萨洛尼基），是一名炮兵出身的土耳其将领。他经历巴尔干战争，一战中以参谋身份随第十一师参与加里波利战役并负伤，获战争奖章；独立战争中获独立勋章与银质作战功绩勋章。1943年任驻加里波利地区第二军军长期间，他变卖自己在伊斯坦布尔的房产，出资在阿尔奇泰佩为1915年阵亡的奥斯曼士兵修建了“努里·雅穆特烈士纪念碑”。1945年晋上将，1949年成为新设的土耳其陆军（陆军部队司令部）首任司令；这也是奥斯曼军队转型为现代正规军以来的首任陆军部队总司令。1950年6月起任总参谋长，任内主导了土耳其向朝鲜战场派兵及加入北约的进程，至1954年4月退役。退役后他加入执政的民主党，以伊斯坦布尔选区代表身份当选大国民议会议员（第十、十一届）。1960年军事政变后，他与阿里·福阿德·杰贝索伊、塔赫辛·亚泽哲等人一同被捕入狱。1961年6月5日在伊斯坦布尔逝世。"
 CBIO_TUR_mehmet_recep_peker_desc:0 "穆罕默德·雷杰普·佩克尔（1889年2月5日—1950年4月1日）生于伊斯坦布尔，父系出自高加索达吉斯坦移民。军事学院毕业后参与也门、利比亚战役及巴尔干战争，一战中转战色雷斯、高加索战场，1919年以总参谋学院第一名毕业。1920年2月以骑兵中队长身份投身安纳托利亚独立战争，同年4月23日大国民议会开幕当日即被任命为议会秘书长，任职三年有余，期间兼总参谋部第二处处长。1924年起历任财政部长、内政部长、国防部长、公共工程部长，1928年当选共和人民党总书记，主导推行“革命史”课程及“共和主义思想”教育，支持妇女解放及拉丁字母改革。1936年赴意大利考察法西斯制度后，曾建议在大国民议会内仿效设立“法西斯大议会”，此议获总理伊诺努初步认可，却被凯末尔本人否决，凯末尔随即将其解除总书记职务。1942年8月任萨拉吉奥卢内阁内政部长，1946年8月7日成为土耳其多党制时代首任总理，任内坚持国家主义、威权一党体制立场，反对民主化深入推行，与民主党领袖曼德列斯在议会激烈交锋后于1947年9月辞职。1948年退出政坛，1950年4月1日逝世，葬于伊斯坦布尔埃迪尔内卡普烈士公墓。"
 CBIO_TUR_mehmet_salih_omurtak_desc:0 "穆罕默德·萨利赫·奥穆尔塔克（1889年—1954年6月23日）生于萨洛尼卡（今希腊塞萨洛尼基），是土耳其第四任总参谋长。1907年自奥斯曼军事学院毕业任少尉，1910年总参谋学院结业后任参谋军官，在奥斯曼军队多个司令部任职。1920年1月22日抵达安卡拉，加入民族运动，在独立战争期间及战后指挥过多支部队，其中包括第六十一师。1926年晋少将，1930年晋中将，1940年起以上将军衔任第一集团军司令。1946年8月1日，在卡齐姆·奥尔巴伊辞职后，他出任总参谋长，任职至1949年6月8日，此后任最高军事咨询委员会委员，直至1950年7月6日退役。1954年6月23日在安卡拉逝世，遗体后迁葬于土耳其国家公墓。"
 CBIO_TUR_memduh_tagmac_desc:0 "梅姆杜赫·塔马奇（1904年—1978年3月30日）生于埃尔祖鲁姆，是土耳其陆军将领、第十四任总参谋长。他曾任土耳其第一集团军司令（1966—1968）、陆军（陆军部队）司令（1968—1969），后升任总参谋长。其历史地位主要与1971年“军事备忘录”（土耳其语“3月12日备忘录”）相关：当时土耳其社会动荡，左右翼暴力与街头冲突频发，1971年3月12日，作为总参谋长的塔马奇代表军方向总理苏莱曼·德米雷尔递交了一份措辞强硬、实为最后通牒的备忘录，要求组建强有力的政府以平息“无政府状态、骨肉相残及社会经济动荡”、推行宪法所设想的改革，并威胁若要求不获满足，军队将“履行其宪法职责”自行接管政权。德米雷尔随即辞职，老政治家、反对党领袖伊诺努则严词谴责军方干政。这是继1960年政变之后土耳其第二次军事干政，史称“备忘录政变”（以备忘录代替坦克）。值得注意的是，塔马奇本人据信反对军队直接干政，这份备忘录在一定程度上是为抢先压制当时一批激进青年军官策划的政变。此次干政被视为土耳其“军事监护”以新形式介入政治的开端。1978年3月30日逝世。"
 CBIO_TUR_mumtaz_okmen_desc:0 "穆姆塔兹·厄克门（全名奥梅尔·穆姆塔兹·厄克门，1895年—1961年5月28日）是土耳其律师、文官与政治家，共和人民党人。他毕业于伊斯坦布尔大学法学院，曾任法院书记、助理法官与律师，并在农业银行任职、任该行董事会副主席。自1935年2月起，他连续四届（第五至八届议会）当选安卡拉选区议员，至1950年。其间他在萨伊达姆内阁任商业部长（1940年11月—1942年7月），在第二届萨拉若卢内阁短暂出任司法部长（1946年），并在佩克尔内阁继续任司法部长、兼任新设立的副总理一职（1946年9月—1947年9月），是土耳其首任副总理。他已婚，育有二子。1961年5月28日逝世。"
 CBIO_TUR_mustafa_kemal_ataturk_desc:0 "穆斯塔法·凯末尔·阿塔图尔克（1881年5月19日—1938年11月10日）生于萨洛尼卡（今希腊塞萨洛尼基），父亲阿里·里扎、母亲祖贝伊德。“凯末尔”是其军校时获称号，意为“完美者”。1908年加入青年土耳其党统一进步委员会，1911—1912年意土战争中坚守德尔纳。一战中他于1915年指挥第十九师在加里波利战役中正确预判盟军登陆地点，成功阻击协约国军队而声名大噪，此后转战高加索、巴勒斯坦战线。1918年10月奥斯曼投降，1919年5月19日抵达萨姆松，组织“保卫国家权利运动”，主持埃尔祖鲁姆、锡瓦斯代表大会，1920年4月23日于安卡拉成立大国民议会。1921年萨卡里亚河战役阻挡希腊攻势，1922年8月杜姆卢平纳战役大胜并逐出希腊军；同年11月苏丹制被废除。1923年7月《洛桑条约》确立现代疆界，10月29日共和国成立，凯末尔当选首任总统，此后推行世俗化改革：废哈里发制、改拉丁字母、推动女性权利与服饰改革，思想体系称“凯末尔主义”。独立战争期间土军亦曾驱逐乃至屠戮安纳托利亚基督徒，此事至今存争议。1934年获“阿塔图尔克”姓氏。1938年11月10日因肝硬化逝世，伊诺努继任总统。"
 CBIO_TUR_mustafa_muglali_desc:0 "穆斯塔法·穆拉勒（1882年—1951年12月11日）是奥斯曼军队军官、土耳其陆军将领，参加过一战与独立战争。1925年谢赫赛义德起义期间，他作为第三集团军将领参与迪亚巴克尔防御。此后历任第一军代理军长（1931年）、伊斯坦布尔卫戍司令（1939年）、第十军军长（1940年），1942年8月晋升上将并入选最高军事委员会，1943年2月起任第三集团军司令兼督察。任内发生了使其声名蒙污的“穆拉勒事件”（又称“33颗子弹事件”“塞佛溪屠杀”）：1943年7月，凡省厄扎尔普一带四十余名库尔德及库雷孙尼村民因被指控牲畜走私遭拘押，法院仅羁押少数人、释放其余，但穆拉勒抵达厄扎尔普后下令将其中33人（一说32人）押至塞佛溪枪决，仅一人生还（后死于伊朗）。此事一度被掩盖，1948年经民主党议员在大国民议会提出后才展开调查。1950年总参谋部军事法庭判处穆拉勒死刑，后因其年事已高减为20年监禁，但军事最高法院撤销原判；新审尚未开庭，他已于1951年12月11日在安卡拉居尔哈内军医院逝世。该屠杀后被诗人艾哈迈德·阿里夫写入著名诗作《33颗子弹》，至今仍是土耳其历史中一桩未获彻底清算的争议事件。"
 CBIO_TUR_muzaffer_goksenin_desc:0 "穆扎费尔·格克塞宁（1899年—1965年1月31日）生于马纳斯特尔（今北马其顿比托拉），是土耳其军人与外交官，土耳其空军第二任司令。1916年，年仅十六岁的他从库莱利军事高中应召入伍、任骑兵少尉；1917年随第二十六师骑兵参加巴勒斯坦战役，1918年10月在大马士革附近被英军俘虏，至1920年获释。此后他加入民族军，在独立战争西线作战，并是法赫雷丁·阿尔泰（名单 14）麾下骑兵部队中最早进入伊兹密尔的“九名军官”之一。其后他转入航空兵、赴法国受训，1933年自军事学院毕业为参谋军官。1944年晋准将，历任空军旅、师指挥官及空军次长等职，1948年晋中将。1950年6月接替泽基·多安出任空军代理司令（后晋上将），成为空军第二任司令，任内推动空军现代化、实现由活塞式飞机向喷气式飞机的过渡。1953年因与国防部长意见不合而退役。其后他转入外交界，曾任伊兹密尔省长及驻巴格达、巴基斯坦大使。他通晓法语、英语，获颁独立勋章。1965年1月31日在伊斯坦布尔逝世。"
 CBIO_TUR_nazim_hikmet_desc:0 "纳齐姆·希克梅特（1902年1月15日—1963年6月3日）生于萨洛尼卡（今希腊塞萨洛尼基）的一个奥斯曼官员家庭，是20世纪土耳其文学最重要的人物之一，被誉为土耳其第一位现代诗人、自由体诗的开创者。少年时就读于加拉塔萨雷高中。1921年他秘密赴安纳托利亚，曾受凯末尔接见；同年起赴莫斯科求学，受马雅可夫斯基等苏联未来派影响，摒弃音节格律、转向自由体诗。1924年作为马克思主义者归国，为左翼刊物撰稿并从事共产主义宣传，遭判刑后逃回苏联；1928年大赦返国，十年间出版多部诗集，并以校对、记者、翻译、编剧等为生。1938年他被控“煽动军人叛乱”受审、判处长期监禁，前后在土耳其监狱约十七年，多在布尔萨狱中度过；其间毕加索、聂鲁达、萨特等国际名流曾发起声援。1950年获释后仍受当局监视，遂于1951年经罗马尼亚流亡苏联，旋被剥夺土耳其国籍。此后他长居苏联及社会主义国家，活跃于欧洲左翼和平运动。其作品长期在土耳其遭禁，身后方获广泛出版，他被奉为人民诗人与土耳其左翼的英雄，代表作有狱中写就、约两万行的长诗《我的祖国的人类风景》。2009年土耳其恢复了他的国籍。1963年6月3日他在莫斯科病逝。"
 CBIO_TUR_nazmi_solok_desc:0 "侯赛因·纳兹米·索洛克（1876年—1956年1月1日）生于巴勒克埃西尔，是奥斯曼军队军官、土耳其陆军中将（并非空军将领）。1898年自军事学院毕业任少尉，1907年晋上尉，巴尔干战争中任第三师副师长。一战期间他在美索不达米亚战场指挥营、团级部队（如第四十四团、第三团），1916年2月晋中校，1918年被英军俘虏。1920年6月，他逃出战俘营、辗转抵达安纳托利亚加入民族运动，先后指挥第五十七师、第五十六师、第一与第二骑兵师及门德雷斯集群，在西线抵御希腊军队进攻；1920年12月兼任科尼亚副省长，1921年6月起任第六师师长。其作战多集中于后方机动与侧翼掩护，虽非正面决战的主角，却为独立战争的整体战局提供了重要支撑，获颁独立勋章。后晋升至中将军衔，退役后于1956年1月1日逝世，葬于土耳其国家公墓。"
 CBIO_TUR_nejdet_sancar_desc:0 "艾哈迈德·内杰代特·桑恰尔（1910年5月1日—1975年2月22日）生于伊斯坦布尔，是土耳其文学教师，泛突厥主义（图兰主义）思想的代表人物之一，著名极端民族主义作家尼哈尔·阿特瑟兹之弟。其家族祖籍居米什哈内，父亲为奥斯曼海军军官。与无神论倾向的兄长不同，他是虔诚的穆斯林，十分看重宗教。他毕业于伊斯坦布尔男子高中，后获突厥学学位；因姓氏法颁布时他正服兵役、与家人无法联络，故与兄长取了不同的姓氏。他长期为民族主义刊物撰稿，并活跃于“土耳其反共协会”“土耳其炉”等组织。1944—1945年，他与阿特瑟兹、阿尔帕斯兰·图尔克什等人一同卷入“种族主义-图兰主义审判”——此案被视为当局对反对伊诺努政策的民族主义阵营的反制——其间他遭受酷刑，但最终被判无罪，相关指控于1947年撤销。他著有《突厥之爱》《我们种族的英雄们》《历史上的土意战争》《致阿弗辛的信》《与伊诺努的清算》五部著作。1975年2月22日，他在修订《历史上的土意战争》增订版时逝世。"
 CBIO_TUR_nihal_atsiz_desc:0 "侯赛因·尼哈尔·阿特瑟兹（1905年—1975年）生于伊斯坦布尔，父亲为奥斯曼海军军官，是土耳其极端民族主义作家、小说家与诗人，泛突厥主义、图兰主义思想的重要理论家，自称种族主义者，其思想被称为“阿特瑟兹主义”；民族主义作家内杰代特·桑恰尔是其胞弟。“阿特瑟兹”姓意为“无名者”。他著述众多，1931年创办土耳其首份泛突厥刊物《阿特瑟兹杂志》，晚年又主办《厄图肯》等刊物。他强烈反对伊诺努政府，尤其抨击其对苏联的妥协与对共产主义的容忍。1944年因公开指控萨巴哈廷·阿里通共而引发诉讼，继而卷入“种族主义-图兰主义审判”，与图尔克什、泽基·瓦利迪·托甘等人一同受审。1973年又因撰文攻击库尔德分离主义而获刑。1975年逝世。"
 CBIO_TUR_nuri_demirag_desc:0 "努里·德米拉（本名穆许尔达尔扎德·努里，1886年5月7日—1957年11月13日）生于锡瓦斯迪夫里伊，是共和国初期著名实业家与政治人物，土耳其最早的百万富翁之一。父亲奥梅尔贝伊出身当地名门穆许尔达尔扎德家族；父亲早逝，他幼年家境清贫，早年做过教师与银行职员。1922年他创办卷烟纸厂（品牌“土耳其的胜利”）由此致富，1920年代后期起投资修建土耳其铁路网，承建萨姆松—锡瓦斯—埃尔祖鲁姆、阿菲永—迪纳尔等线，成为土耳其首位大型铁路承包商；1934年姓氏法颁布时，阿塔图尔克因其铁路贡献赐姓“德米拉”（意为“铁网”）。1936年他在伊斯坦布尔贝希克塔什创办土耳其首家私营飞机制造厂，生产Nu D.36双座教练机与Nu D.38双发客机，并制造出土耳其首具国产降落伞；还在耶希尔柯伊购地兴建机场与“天空学校”——土耳其首家私营飞行学校，培养约290名飞行员。1941年8月，首架完全国产的飞机由伊斯坦布尔飞抵其家乡迪夫里伊。但土耳其航空协会于1939年取消订单，令他在航空业的巨额投入受挫，工厂后被国有化（贝希克塔什旧址今为伊斯坦布尔海军博物馆）。1945年，他创立共和国多党制过渡时期的首个反对党“民族发展党”；1954年以独立候选人身份借民主党名单当选锡瓦斯议员。1957年11月13日在伊斯坦布尔逝世。"
 CBIO_TUR_nuri_killigil_desc:0 "努里·基利吉尔，又称努里帕夏（1889年，一说1890年—1949年3月2日），生于伊斯坦布尔，是奥斯曼军队将领、奥斯曼战争大臣恩维尔帕夏之弟。机枪步兵出身，1915年2月奉命赴利比亚，组织“特殊组织”力量配合当地势力对抗意、英军，1917年起任“非洲集群司令部”指挥官，获授荣誉少将、荣誉中将。1918年应恩维尔之召返回，受命组建并指挥“高加索伊斯兰军”，5月抵甘贾，7月10日正式建军，9月15日率部从布尔什维克与亚美尼亚武装手中攻占巴库；占领期间巴库发生针对亚美尼亚平民的大屠杀，约三万人罹难，基利吉尔对此负有指挥责任。战后他被英军逮捕、押于巴统候审战争罪，1919年8月在支持者伏击押解卫兵后越狱逃往埃尔祖鲁姆，并参加1920年土亚战争中的东线军。两战之间他曾旅居德国，1938年返土，在伊斯坦布尔苏特吕杰开办军火工厂，生产枪支、弹药、防毒面具等；作为泛突厥主义者，二战期间他曾与纳粹德国驻安卡拉大使接触以争取支持，并参与组建党卫军“突厥斯坦军团”，1948年阿以战争期间向多个阿拉伯国家秘密供应武器。1949年3月2日，其苏特吕杰军火工厂发生大爆炸，他与另外二十余名工人当场罹难；因遗体残缺，当时未举行正式葬礼，直至2016年才补办。"
 CBIO_TUR_rauf_orbay_desc:0 "侯赛因·拉乌夫·奥尔巴伊（1881年7月27日—1964年7月16日）生于伊斯坦布尔，阿布哈兹裔，父亲穆扎费尔帕夏曾任海军中将。1899年自海军学校毕业入海军，巴尔干战争期间任巡洋舰“哈米迪耶”号舰长，以大胆袭扰希腊、保加利亚航运而声名大噪，人称“哈米迪耶英雄”。一战中任海军参谋长，参与加里波利海防，并出席布列斯特-立托夫斯克和谈；他还曾在凯末尔与恩维尔、杰马勒交恶险遭军法审判时出手相助。1918年10月任艾哈迈德·伊泽特帕夏内阁海军部长，代表奥斯曼帝国签署《穆德罗斯停战协定》。随后赴安纳托利亚投身民族运动，出席埃尔祖鲁姆、锡瓦斯代表大会（任后者副主席）；伊斯坦布尔被占后遭英军逮捕，在马耳他拘押约一年，1921年3月经战俘交换获释。1922年7月12日至1923年8月4日任安卡拉政府总理，任内苏丹制被废除；因在《洛桑条约》签署授权问题上与伊诺努产生裂痕而辞职。1924年与卡拉贝基尔等共创反对党进步共和党，1926年被控涉刺杀阿塔图尔克案、缺席判处十年监禁，时他正在国外就医，终未服刑，亦拒绝1933年大赦，1935年方归国。1939年当选卡斯塔莫努独立议员获平反，二战期间出任驻伦敦大使（1942年），1944年辞职。1964年7月16日在伊斯坦布尔逝世。"
 CBIO_TUR_recep_peker_desc:0 "穆罕默德·雷杰普·佩克尔（1889年2月5日—1950年4月1日）生于伊斯坦布尔，父系出自高加索达吉斯坦移民。军事学院毕业后参与也门、利比亚战役及巴尔干战争，一战中转战色雷斯、高加索战场，1919年以总参谋学院第一名毕业。1920年2月以骑兵中队长身份投身安纳托利亚独立战争，同年4月23日大国民议会开幕当日即被任命为议会秘书长，任职三年有余，期间兼总参谋部第二处处长。1924年起历任财政部长、内政部长、国防部长、公共工程部长，1928年当选共和人民党总书记，主导推行“革命史”课程及“共和主义思想”教育，支持妇女解放及拉丁字母改革。1936年赴意大利考察法西斯制度后，曾建议在大国民议会内仿效设立“法西斯大议会”，此议获总理伊诺努初步认可，却被凯末尔本人否决，凯末尔随即将其解除总书记职务。1942年8月任萨拉吉奥卢内阁内政部长，1946年8月7日成为土耳其多党制时代首任总理，任内坚持国家主义、威权一党体制立场，反对民主化深入推行，与民主党领袖曼德列斯在议会激烈交锋后于1947年9月辞职。1948年退出政坛，1950年4月1日逝世，葬于伊斯坦布尔埃迪尔内卡普烈士公墓。"
 CBIO_TUR_refet_pasha_desc:0 "雷费特帕夏，本名易卜拉欣·雷费特·贝莱（1881年—1963年），“帕夏”为奥斯曼军衔头衔而非姓氏。他生于萨洛尼卡的土耳其家庭，姓氏“贝莱”取自祖籍保加利亚拜拉的先祖。自奥斯曼军事学院毕业后，他加入统一进步委员会，参加意土战争与巴尔干战争。一战中，他在克雷斯·冯·克雷森施泰因麾下作战，经历罗马尼亚战役、巴勒斯坦战线和第二次加沙之战。1919年伊兹密尔遭希腊登陆后，雷费特赴安纳托利亚投身民族运动，参与《阿马西亚通告》的拟订，并出席埃尔祖鲁姆、阿拉谢希尔、锡瓦斯代表大会。独立战争时期，他任艾登民族军司令，并历任安卡拉政府部长及西线、南线指挥官。1924年与卡拉贝基尔等人创建进步共和党，后因伊兹密尔刺杀案受审并获无罪。1963年在伊斯坦布尔逝世。"
 CBIO_TUR_refik_saydam_desc:0 "雷菲克·萨伊达姆（全名易卜拉欣·雷菲克·萨伊达姆，1881年9月8日—1942年7月8日）生于伊斯坦布尔，医生出身，土耳其第四任总理（1939—1942）。1899年入军医学校，1905年以军医上尉毕业，后赴柏林深造。巴尔干战争期间在前线防治霍乱，一战中任战争部卫生司副司长，创立细菌学研究所，研制出广泛应用的斑疹伤寒疫苗。1919年5月19日他作为第九军卫生督察随凯末尔同船登陆萨姆松，是独立战争发起人之一，1920年4月23日当选大国民议会贝亚泽特（后改伊斯坦布尔）议员。此后历任卫生与社会救济部长达十四五年（数任间断），创建卫生研究所与卫生学校（1928），并自1925年起兼任红新月会会长十四年。1938年凯末尔逝世后任内政部长兼共和人民党总书记。1939年1月25日由伊诺努任命为总理，任内主持哈塔伊归并（1939年7月）、颁布《国家保护法》（1940）应对二战物资压力，力求维持中立。终身未婚，逝世前一年将全部家产捐予达鲁萨法卡学会与红新月会。1942年7月8日凌晨在伊斯坦布尔佩拉宫酒店工作途中因心脏病突发逝世，葬于安卡拉杰贝吉公墓。"
 CBIO_TUR_riza_nur_desc:0 "里扎·努尔（1879年8月30日—1942年9月8日）生于锡诺普，土耳其外科医生、政治家、作家。1901年毕业于军医学校，任格利哈奈军医院外科医生，1907年回校任教。曾任末届奥斯曼议会议员，是反统一进步委员会的“自由协商党”创建人之一。独立战争期间历任国民教育部长、三度出任卫生与社会救济部长、外交部长，并作为1921年莫斯科条约的土方签约代表之一。在1922—1923年洛桑会议上任伊诺努的副代表，主管少数民族议题分会，坚持反对承认库尔德人、波斯尼亚人、切尔克斯人为洛桑条约意义上的少数民族，并在本都希腊人、亚美尼亚人议题上态度强硬，与希腊代表韦尼泽洛斯多次激烈交锋。共和国成立后逐渐边缘化，1926年伊兹密尔刺杀凯末尔案爆发后出走海外，先后侨居巴黎、亚历山大里亚，主编《突厥学评论》，撰文严厉批评凯末尔及其酗酒传闻，与凯末尔政权关系彻底破裂。凯末尔逝世后回国，1942年创办泛突厥主义刊物《天山》。代表作十四卷本《土耳其史》（1924—1926），身后出版的自传因猛烈抨击凯末尔与革命而长期遭禁。1942年9月8日在伊斯坦布尔逝世。"
 CBIO_TUR_sabiha_gokcen_desc:0 "萨比哈·戈克恩（1913年3月22日—2001年3月22日）生于布尔萨，世界首位女性战斗机飞行员。她幼年父母双亡，1925年凯末尔访问布尔萨时收她为养女，是其多名养子女之一。1934年姓氏法颁布，获赐姓“戈克恩”（意为“属于天空”），当时她尚未涉足航空。1935年入凯末尔创办的土耳其鸟飞行学校，初学跳伞滑翔，后转习驾驶，赴苏联克里米亚受训。1936年入埃斯基谢希尔军事航空学校，1937年完成战斗机与轰炸机训练，23岁取得世界首位女性战斗机飞行员资格，并参与镇压德尔西姆起义的军事行动，获土耳其航空协会首枚荣誉勋章。1938年她驾机独飞巡访雅典、索非亚、贝尔格莱德等巴尔干诸国都城，获南斯拉夫“白鹰”勋章；同年起任土耳其鸟飞行学校总教官至1954年，培养四名女飞行员。1940年结婚，1943年丧夫，1964年正式退出飞行，一生飞行约八千小时，参与三十二次军事行动，1996年获选为美国空军“二十位最伟大飞行员”海报中唯一女性。2004年一篇关于其亚美尼亚血统的报道引发争议，撰文记者后遇刺身亡，二者关联存疑。2001年她在以她命名的伊斯坦布尔国际机场开航两个月后，于88岁生日当天因心脏衰竭逝世。"
 CBIO_TUR_sadik_altincan_desc:0 "穆罕默德·萨德克·阿尔丁坎（1898年—1963年2月16日）生于伊斯坦布尔，是一名土耳其海军上将，亦活跃于多党制转型时期。他经历一战，后在土耳其海军长期服役，1950年6月接替穆罕默德·阿里·乌尔根出任土耳其海军司令，任职至1957年，是该司令部第二任司令。退役后涉足政界，当选大国民议会议员（其党籍各方记载不一）。马尔马拉海亚瑟岛（今“自由与民主岛”）上设有以他命名的图书馆。1963年2月16日逝世。"
 CBIO_TUR_said_i_nursi_desc:0 "赛义德·努尔西（原名赛义德·奥库尔，1877年—1960年3月23日）生于比特利斯省努尔斯村，库尔德裔伊斯兰学者，土耳其现代最具影响力的宗教思想运动“光明派”（努尔运动）创始人，因学识渊博获尊号“贝迪乌扎曼”（意为“时代奇才”）。出身贫寒农家，自幼天资过人，十四岁即修完传统经学院课程，后兼修数理化等现代科学，主张宗教学校应教授现代科学、世俗学校应教授宗教学。一战期间组织志愿军在凡城一带抵抗俄军与亚美尼亚武装，负伤被俘，囚于俄国科斯特罗马两年，十月革命后越狱辗转柏林返回伊斯坦布尔。战后曾公开驳斥英方胁迫颁布的反民族运动教令。1922年应邀赴安卡拉，因其设想的伊斯兰共和国理念与凯末尔的世俗化路线相左，未久留即返回凡城，退出政治。1925年谢赫赛义德起义中，他拒绝起义领袖的合作请求，主张穆斯林不应自相残杀，但仍遭当局怀疑流放，辗转伊斯帕尔塔、巴尔拉等地，在巴尔拉软禁期间写成《光明书》三分之二篇幅，该书阐释古兰经义理逾六千页，被信徒秘密手抄流传。此后屡遭审判与监禁，1949年获释后政治环境趋缓，1950年代公开支持民主党。其思想后衍生出居伦运动等多个分支。1960年3月23日在乌尔法逝世。"
 CBIO_TUR_said_nursi_desc:0 "赛义德·努尔西（原名赛义德·奥库尔，1877年—1960年3月23日）生于比特利斯省努尔斯村，库尔德裔伊斯兰学者，土耳其现代最具影响力的宗教思想运动“光明派”（努尔运动）创始人，因学识渊博获尊号“贝迪乌扎曼”（意为“时代奇才”）。出身贫寒农家，自幼天资过人，十四岁即修完传统经学院课程，后兼修数理化等现代科学，主张宗教学校应教授现代科学、世俗学校应教授宗教学。一战期间组织志愿军在凡城一带抵抗俄军与亚美尼亚武装，负伤被俘，囚于俄国科斯特罗马两年，十月革命后越狱辗转柏林返回伊斯坦布尔。战后曾公开驳斥英方胁迫颁布的反民族运动教令。1922年应邀赴安卡拉，因其设想的伊斯兰共和国理念与凯末尔的世俗化路线相左，未久留即返回凡城，退出政治。1925年谢赫赛义德起义中，他拒绝起义领袖的合作请求，主张穆斯林不应自相残杀，但仍遭当局怀疑流放，辗转伊斯帕尔塔、巴尔拉等地，在巴尔拉软禁期间写成《光明书》三分之二篇幅，该书阐释古兰经义理逾六千页，被信徒秘密手抄流传。此后屡遭审判与监禁，1949年获释后政治环境趋缓，1950年代公开支持民主党。其思想后衍生出居伦运动等多个分支。1960年3月23日在乌尔法逝世。"
 CBIO_TUR_salih_omurtak_desc:0 "穆罕默德·萨利赫·奥穆尔塔克（1889年—1954年6月23日）生于萨洛尼卡（今希腊塞萨洛尼基），是土耳其第四任总参谋长。1907年自奥斯曼军事学院毕业任少尉，1910年总参谋学院结业后任参谋军官，在奥斯曼军队多个司令部任职。1920年1月22日抵达安卡拉，加入民族运动，在独立战争期间及战后指挥过多支部队，其中包括第六十一师。1926年晋少将，1930年晋中将，1940年起以上将军衔任第一集团军司令。1946年8月1日，在卡齐姆·奥尔巴伊辞职后，他出任总参谋长，任职至1949年6月8日，此后任最高军事咨询委员会委员，直至1950年7月6日退役。1954年6月23日在安卡拉逝世，遗体后迁葬于土耳其国家公墓。"
 CBIO_TUR_sefik_husnu_desc:0 "谢菲克·许斯努·德伊梅尔（约1887年—1959年4月8日）出生于萨洛尼卡，1910年自军医学校毕业，医学中尉军衔，精通德语、法语。1912年在伊斯坦布尔参与创立民族主义组织“土耳其炉”，后转向社会主义，1919年9月创立“土耳其工人农民社会党”，该党最初支持凯末尔运动。1920年9月该党代表出席在巴库召开的土耳其共产党第一次代表大会，土共由此成立，许斯努后成为该党第三任总书记，是土耳其共产主义运动史上影响最深远的人物之一。1923年4月他提出当时土耳其存在凯末尔主义、保皇反动、社会主义三种政治倾向，主张凯末尔政府与社会主义者“携手合作”对抗反动势力，奠定土共此后长期奉行的与凯末尔政权阶级合作路线。1933年德国国会纵火案后，他在德国一度被捕审讯，并与共产国际渊源遭到调查；其后流亡莫斯科两年，返回土耳其前向当局承诺不再从事非法政治活动，但始终未放弃共产主义信念。返国后恢复行医执照，二战期间一度被征召任军医，旋因政治原因被解除军职。土耳其共产党自1925年遭取缔后长期转入地下，许斯努在党内核心地位持续至晚年。1959年4月8日在马尼萨逝世。"
 CBIO_TUR_sevket_sureyya_aydemir_desc:0 "谢夫凯特·叙雷亚·艾德迈尔（1897年—1976年3月25日）生于埃迪尔内，土耳其作家、经济学家、历史学家，左翼凯末尔主义思想刊物《卡德罗》的创始人与核心理论家之一。父亲为园丁，母亲教其识字。十一岁加入统一进步委员会，巴尔干战争中失去母亲与一兄长。一战中志愿从军，在高加索战线负伤。1919—1920年在阿塞拜疆任教师，后转赴巴统接触土耳其共产党，赴莫斯科东方劳动者共产主义大学攻读经济学，加入苏联共产党与土耳其共产党，代表土共出席巴库东方民族代表大会。回国后为《光明》杂志撰稿，该刊1925年被取缔，他因文中观点被安卡拉独立法庭判处十年监禁，服刑约一年半后获释。此后转任安卡拉商业中学校长（1928—1937）等公职。1932—1934年与韦达特·内迪姆·托尔等人创办《卡德罗》杂志，提出融合马克思主义与凯末尔主义的国家主义发展理论，代表作《革命与卡德罗》（1932）。晚年著有自传《寻水的人》（1959），三卷本凯末尔传记《独人》（1963—1965）、伊诺努传记《第二人》、恩维尔帕夏传记等。1976年3月25日在安卡拉逝世。"
 CBIO_TUR_sukru_okan_desc:0 "穆罕默德·许克吕·奥坎（1880年—1957年），土耳其海军将领、政治人物，生于黑海沿岸的蒂雷博卢。奥坎毕业于奥斯曼海军学校，早年长期服役于海军，曾任鱼雷艇、巡洋舰及潜艇相关职务，并赴欧洲学习潜艇技术。共和国建立后，他参与土耳其海军的重建，曾任潜艇部队指挥官、战斗舰队代理司令和舰队司令，后晋至少将、中将。1945年退役后，他以共和人民党成员身份进入土耳其大国民议会，任第七、八届科贾埃利议员。1957年在伊斯坦布尔逝世。"
 CBIO_TUR_sukru_saracoglu_desc:0 "许克吕·萨拉吉奥卢（全名穆罕默德·许克吕·萨拉吉奥卢，1887年6月17日—1953年12月27日）生于厄德米什，土耳其第五任总理（1942—1946）。1909年毕业于行政学校，后赴日内瓦攻读政治经济学。希腊占领厄德米什后，他参加民族军在库萨达瑟、艾登一带抵抗，战后任厄德米什市长，1923年当选大国民议会艾登议员。历任国民教育部长（1924—1925）、希土人口交换委员会主席、财政部长（1927—1930）、司法部长（1933—1938）、外交部长（1938—1942）。任外交部长期间，他与英法签订互助条约（1939），促成哈塔伊归并土耳其，并于1941年与德国签订《土德友好条约》。1942年7月萨伊达姆病逝后接任总理，推行二战时期“财产税”与农产品税以应对经济困局，并通过土地改革法；对外维持中立，直至1945年2月对轴心国宣战。1946年大选后辞职，转任大国民议会议长（1948—1950），1950年竞选失利后退出政坛。曾长期兼任足球俱乐部费内巴切主席（1934—1950），该队主场以其名命名。1953年12月27日在伊斯坦布尔逝世，葬于津吉尔利库尤公墓。"
 CBIO_TUR_wilhelm_ritter_von_thoma_desc:0 "威廉·约瑟夫·里特尔·冯·托马（1891年—1948年）生于巴伐利亚达豪，是德国国防军装甲兵上将。“里特尔”是他因一战中作战英勇获巴伐利亚军事马克斯·约瑟夫勋章而获授的骑士头衔。1912年入巴伐利亚陆军，一战中转战西线、东线及塞尔维亚战场，多次负伤。战后留任国防军，钻研摩托化与装甲战术。西班牙内战期间，他任秃鹰军团地面装甲分队指挥官，支援佛朗哥军队。二战中，他先后参加波兰、法国和东线作战，后赴北非任非洲装甲集团军副司令。1942年阿拉曼战役中被英军俘虏，战后获释，1948年逝世。"
 CBIO_TUR_zeki_dogan_desc:0 "梅赫梅特·泽基·多安（1895年—1961年3月17日）生于伊斯坦布尔，是土耳其军人，土耳其空军首任司令。1913年入军校，一战爆发后于1914年以骑兵少尉投身军旅，在多支骑兵部队任排长；1918年9月在西奈战线第四集团军麾下被英军俘虏，押于埃及战俘营，1919年获释返回伊斯坦布尔。1919年他赴安纳托利亚加入民族军、投身独立战争，大攻势期间率第十四骑兵团成为最早进入伊兹密尔的土军指挥官之一（并在伊兹密尔降下希腊国旗）。1924年转入航空兵，受飞行训练，历任空军营、团、旅指挥官及国防部空军次长等职。1940年晋准将，1942年晋少将，1944年1月27日被任命为新组建的独立军种——土耳其空军的首任司令；任内于1945年晋中将、1948年晋上将。1950年6月卸任，转任最高军事委员会委员，1951年10月退役。他通晓英语，获颁包括独立勋章在内的多枚勋章，被视为土耳其民族英雄。1961年3月17日在安卡拉逝世。"
 CBIO_TUR_zeki_velidi_togan_desc:0 "艾哈迈德·泽基·瓦利迪·托甘（1890年12月10日—1970年7月26日）生于乌法省（今俄罗斯巴什科尔托斯坦）的一个村庄，是巴什基尔裔历史学家、突厥学家，巴什基尔民族解放运动的领袖。早年在喀山求学、任教。1917年俄国革命后，他投身巴什基尔自治运动，当选巴什基尔代表；1918—1919年其武装先后追随杜托夫、高尔察克对抗布尔什维克，后因苏俄许诺巴什基尔自治而转投布尔什维克，1919年2月至1920年6月任巴什基尔革命委员会主席。因感到布尔什维克违背承诺，他转赴中亚，成为突厥斯坦“巴斯马奇”反苏运动的领袖（曾与恩维尔帕夏并肩），并任“突厥斯坦民族联盟”主席（1920—1923）。1923年他流亡国外，后定居土耳其，任伊斯坦布尔大学突厥史教授；其间赴维也纳取得博士学位，又在波恩、哥廷根任教，1939年返伊斯坦布尔大学执教至终。他著述逾四百种，是突厥古代史研究的奠基者之一。1944年他与尼哈尔·阿特瑟兹（名单 37）等人同列“种族主义-图兰主义审判”被告。苏联将“瓦利多夫主义”斥为反动的巴什基尔民族主义，曾牵连大批穆斯林知识分子。1970年7月26日在伊斯坦布尔逝世。"
 GER_hans_von_luck_desc:0 "汉斯-乌尔里希·弗赖赫尔·冯·勒克·翁德·维滕（1911年—1997年）通称汉斯·冯·勒克，是德国装甲兵军官，军衔至上校。他生于弗伦斯堡一个普鲁士军人世家，父亲曾服役于帝国海军。1929年入国防军，1931—1932年在德累斯顿步兵学校接受隆美尔主持的军官训练。二战中，他先后在第七装甲师、第二十一装甲师服役，参加波兰战役、法国战役、巴巴罗萨行动和北非战场。诺曼底战役中，他以战斗群指挥官身份参与抵抗英军“古德伍德”行动。1945年被苏军俘虏，在高加索一带战俘营关押五年，1950年获释返回西德。战后写成回忆录《装甲指挥官》，1997年在汉堡逝世。"
 GER_wilhelm_ritter_von_thoma_desc:0 "威廉·约瑟夫·里特尔·冯·托马（1891年—1948年）生于巴伐利亚达豪，是德国国防军装甲兵上将。“里特尔”是他因一战中作战英勇获巴伐利亚军事马克斯·约瑟夫勋章而获授的骑士头衔。1912年入巴伐利亚陆军，一战中转战西线、东线及塞尔维亚战场，多次负伤。战后留任国防军，钻研摩托化与装甲战术。西班牙内战期间，他任秃鹰军团地面装甲分队指挥官，支援佛朗哥军队。二战中，他先后参加波兰、法国和东线作战，后赴北非任非洲装甲集团军副司令。1942年阿拉曼战役中被英军俘虏，战后获释，1948年逝世。"
 ITA_ferdinando_umberto_filippo_adalberto_desc:0 "斐迪南·翁贝托·菲利普·阿达尔贝托（1884年—1963年）通称萨伏伊的斐迪南多、第三代热那亚公爵，是意大利王室萨伏伊家族成员、意大利皇家海军上将。他生于都灵，是第二代热那亚公爵托马索亲王与巴伐利亚的伊莎贝拉公主之长子，系国王维托里奥·埃马努埃莱三世的堂弟。1904年获“乌迪内亲王”封号。一战中，他以上校军衔指挥侦察巡洋舰“斯帕尔维耶罗”号，并获英勇勋章。1917年率意大利战时使团访问美国。1931年父亲去世后继承热那亚公爵爵位，海军生涯后期晋上将，任上亚得里亚海舰队司令。1946年意大利公投废除君主制后，萨伏伊王朝统治结束。1963年在博尔迪盖拉逝世。"
 TUR_abdulmejid_ii_desc:0 "阿卜杜勒迈西德二世（1868年—1944年）生于伊斯坦布尔多尔玛巴赫切宫，是苏丹阿卜杜勒阿齐兹之子、末代奥斯曼哈里发，也是唯一由土耳其大国民议会选举产生的哈里发。他自幼受私人教育，擅长绘画、文学与音乐，曾任奥斯曼艺术家协会主席。1918年表兄穆罕默德六世继位后，他被立为皇储。1922年11月苏丹制废除后，大国民议会选举他为哈里发，但其宗教地位因脱离世俗政权而广受质疑。1924年3月，土耳其废除哈里发制并驱逐奥斯曼皇室，他被迫离境，后定居巴黎。1944年在巴黎逝世，遗体最终安葬于麦地那。"
 TUR_abdurrahman_gurman_desc:0 "阿卜杜勒拉赫曼·纳菲兹·居尔曼（约1882年—1966年2月6日，生年一说1887年）生于博德鲁姆，是奥斯曼军队军官、土耳其陆军将领，曾任土耳其第五任总参谋长。他自军事学院、总参谋学院毕业，参加过巴尔干战争——其间参与1912—1913年的斯库台（伊什科达）防御，一战中转战高加索战线，并曾作为努里帕夏（基利吉尔）的参谋长在北非“非洲集群司令部”任职。后加入凯末尔领导的民族运动，投身独立战争。共和国成立后历任军中多职，1949年继萨利赫·奥穆尔塔克之后出任总参谋长（1949—1950）。1950年民主党执政后，他因被疑涉政变嫌疑而与一批高级军官一同被勒令退役。退役后曾出任土耳其驻韩国及巴列维伊朗大使，至1959年卸任，1961年当选制宪会议议员。他通晓德语、法语，著有数部军事著作，包括关于巴尔干战争斯库台防御、一战北非土军及独立战争的专著。1966年2月6日在伊斯坦布尔逝世，葬于土耳其国家公墓。"
 TUR_adnan_menderes_desc:0 "阿德南·曼德列斯（全名阿里·阿德南·埃尔特金·曼德列斯，1899年—1961年9月17日）生于艾登省科恰勒村，出身克里米亚鞑靼裔富裕地主家庭，幼年父母早逝。毕业于伊兹密尔美国学院，独立战争期间参战获勋章，后毕业于安卡拉大学法学院。1930年组织自由共和党艾登支部，该党解散后获凯末尔邀请加入共和人民党，1931年当选艾登议员。1945年因反对国有化政策遭开除党籍，同年联署要求政治自由的“四人备忘录”。1946年与拜亚尔等共创民主党，1950年5月该党在土耳其首次自由大选中获胜，曼德列斯出任总理并两度连任（1954、1957），1955年起兼外交部长。任内经济一度年增长近9%，加入北约并参加朝鲜战争，恢复阿拉伯语宣礼；1955年伊斯坦布尔反希腊骚乱中数千希腊族商铺教堂遭毁，事后证实系当局策划的挑衅。1959年其专机在伦敦近郊坠毁，他幸免于难。1960年5月军事政变爆发，曼德列斯连同拜亚尔等被捕，押至亚西亚达岛受审判处死刑，服安眠药自杀未遂后，不顾肯尼迪、伊丽莎白二世等求情，于9月17日在伊姆拉勒岛被绞死，外长佐尔卢、财长波拉特坎同案被处决。1990年获国会平反昭雪。"
 TUR_ahmet_ali_celikten_desc:0 "艾哈迈德·阿里·切利克滕（1883年—1969年6月24日），本名伊兹密尔人阿利奥卢·艾哈迈德，生于奥斯曼帝国伊兹密尔，是非洲裔土耳其飞行员，被视为航空史上最早的黑人军事飞行员之一（一说为第一人）。其母系祖母是被奴隶贩子从博尔努（今尼日利亚一带）掳至伊斯坦布尔奴隶市场贩卖的奴隶，父母均有非洲-土耳其混血背景。他原想当海员，1904年入海军技术学校，1908年以中尉毕业，后进入1914年成立的耶希尔柯伊海军航空学校受训，加入奥斯曼空军。1916年11月11日，他成为航空史上最早的黑人军事飞行员之一；1917年2月晋上尉，年底被派往柏林进修飞行，其代号为“钢铁黑鹰”。一战期间其弟阵亡，他本人娶了来自普雷韦扎的移民哈蒂杰为妻。一战后他投身土耳其独立战争，志愿在科尼亚军用航空基地服役，1922年曾奉派赴黑海港口阿马斯拉协助转运飞机。他常被与为法国效力的非裔美国人尤金·布拉德相比——布拉德常被误称为首位黑人军事飞行员，而切利克滕获得飞行资格更早。他于1949年以空军上校军衔退役，并感召了家中众多成员投身飞行事业。1969年6月24日逝世。"
 TUR_ahmet_fevzi_pasha_desc:0 "艾哈迈德·费齐帕夏生于迪兹杰，出身乌比赫“比格”家族，父亲名雅库布，须与元帅费夫齐·恰克马克（即“小费齐帕夏”）相区别。他于1913年自奥斯曼军事学院毕业，任奥斯曼第三集团军第九军军长。一战中参与1915年加里波利防御。他曾因反对在严冬向俄军发动进攻而被贝哈埃丁·沙基尔解除军长职务——只要费齐帕夏仍任军长，沙基尔便始终无法将第九军纳入统一进步委员会的掌控。奥斯曼战败、帝国遭占领瓜分后，他加入凯末尔的民族运动，投身独立战争。在效忠奥斯曼政府的“纪律部队”于安扎武尔叛乱中被切尔克斯·埃特姆部击溃后，他受命前往南马尔马拉的曼亚斯、格嫩一带为民族军招募切尔克斯人，但成效甚微，事后曾向卡齐姆·厄扎尔普坦言当地民众正等待时机再度举事。他一度被任命接替阿里·福阿德帕夏出任第二十军军长，却在拉乌夫贝伊与贝基尔·萨米贝伊的劝阻下拒绝就任。1947年在伊斯坦布尔逝世。"
 TUR_ali_fuat_cebesoy_desc:0 "阿里·福阿德·杰贝索伊（1882年9月23日—1968年1月10日）生于伊斯坦布尔，与凯末尔、卡拉贝基尔、奥克亚尔同窗于奥斯曼军校，1905年总参谋学院毕业。一战中历任第八军参谋长、第二十五师师长，参加苏伊士运河攻势与加里波利战役，后转战高加索、巴勒斯坦，1917年晋将。停战后联络凯末尔，1919年6月与凯末尔、拉乌夫·奥尔巴伊、雷费特·贝莱共同签署《阿马西亚通告》，随即在安纳托利亚西部组织抵抗希腊占领的武装。锡瓦斯代表大会后任全国民族军总司令，其部进驻安卡拉促成凯末尔择此城为运动中心。1921年因西线受挫、与伊诺努不睦而改任驻莫斯科大使，亲自与列宁、斯大林谈判，签订《莫斯科条约》，为独立战争争取大量苏联军援。1924年与卡拉贝基尔等共创进步共和党并任总书记，该党1925年因谢赫赛义德起义牵连被取缔，1926年因伊兹密尔刺杀案受审获判无罪，退役后远离政坛四年。1931年复出，代表科尼亚、埃斯基谢希尔当选议员至1950年，历任公共工程部长、交通部长、大国民议会议长。1968年1月10日逝世，葬于独立战争首枪打响处的盖伊韦车站附近清真寺，1980年政变后迁葬安卡拉国家公墓。"
 TUR_ali_ihsan_sabis_desc:0 "阿里·伊珊·萨比斯（1882年8月30日—1957年12月9日）生于伊斯坦布尔，奥斯曼末期将领，1904年以总参谋学院第一名毕业。一战期间历任第九军、第四军军长，1915—1918年间出任第六集团军司令，转战高加索与美索不达米亚战线，在库特地区对英军作战屡有斩获。1918年他奉命率部进入伊朗，围攻安德拉尼克所部亚美尼亚武装，其间对亚美尼亚平民犯下严重暴行:作为第五十一师师长期间该师所属亚美尼亚籍官兵遭就地处决，任第四集团军司令期间又以断粮饥饿手段致数以万计亚美尼亚人死亡；进驻伊朗大不里士后，他向亚美尼亚代表团公开承认在霍伊一带不分老幼大肆屠杀，并向亚美尼亚教会代表声称已使五十万亚美尼亚人罹难，并下令屠戮马库的亚美尼亚人。一战结束前夕，其第六集团军残部在沙尔卡特之战中败于英印联军，摩苏尔随后落入英军之手。战后他在伊斯坦布尔被捕，流放马耳他，1921年获释返国投身独立战争，出任第一集团军司令，但在杜姆卢平纳决战前夕即退役。二战期间他曾任亲纳粹刊物《土耳其邮报》负责人，因致信威胁日趋反德的总统伊诺努而遭军事法庭审判，服刑十五个月。1957年12月9日逝世。"
 TUR_celal_bayar_desc:0 "马哈茂特·杰拉勒丁（杰拉勒）·拜亚尔（1883年5月16日—1986年8月22日）生于布尔萨附近格姆利克，父亲是保加利亚移民的伊斯兰教法学者。早年在银行任职，1907年加入青年土耳其党，建立伊兹密尔、布尔萨分部。一战末期组织抵抗占领的地下武装，遭苏丹政府通缉，后加入民族运动，1921—1924年历任经济部长、重建定居部长。1924年创立土耳其首家国家银行“实业银行”并任行长至1932年，1932—1937年再任经济部长，主导国家工业化。1937年获凯末尔任命为总理，1938年凯末尔逝世后留任至1939年初，因经济政见与新总统伊诺努不合辞职。1945年脱离执政党，1946年与曼德列斯等共创民主党，开启多党制时代。1950年5月大选获胜，拜亚尔当选第三任总统，是首位非军方背景总统，1954、1957年两度连任，共任十年，任内加入北约、参加朝鲜战争。1960年军事政变，拜亚尔与曼德列斯被捕受审，1961年判死刑后因高龄减为终身监禁，幸免于处决命运。1964年获释，1966年获大赦，1974年恢复政治权利但未再涉足政坛。1986年8月22日逝世，享年103岁，是现代史上最长寿的国家元首之一。"
 TUR_cemil_cahit_toydemir_desc:0 "杰米尔·贾希特·托伊代米尔（1883年—1956年7月15日）生于伊斯坦布尔，出身切尔克斯（乌比赫）裔家庭。1902年自奥斯曼军事学院毕业，历经意土战争、巴尔干战争，一战中转战高加索战线，指挥团、师级部队。穆德罗斯停战后加入民族运动，1919年9月出席锡瓦斯代表大会，跻身支持凯末尔的北高加索青年军官核心圈；同年7月抵萨姆松任第五高加索师师长，1922年独立战争收官阶段任第十师师长。1939年任宪兵总司令，1943年起任第一集团军司令，1946年6月退役。1943年夏，他奉伊诺努总统之命率土耳其军事代表团对纳粹德国进行官方访问，时值库尔斯克会战前夕，先后考察大西洋壁垒与东线战场，与土耳其军官一同察看虎I坦克，并与曼施坦因会面；访问中会见希特勒、凯特尔、约德尔等人。返国后他向伊诺努提交报告，判断德国终将战败。1946年8月至1947年9月出任国防部长，并以伊斯坦布尔选区代表身份当选大国民议会议员（1946—1950）。1956年7月15日在伊斯坦布尔逝世，葬于土耳其国家公墓。"
 TUR_durrushehvar_desc:0 "杜露塞瓦尔苏丹（全名哈蒂杰·哈伊里耶·阿伊舍·杜露塞瓦尔，1914年1月26日—2006年2月7日）生于伊斯坦布尔于斯屈达尔恰姆勒贾宫，末代哈里发阿卜杜勒迈西德二世的独生女。1924年哈里发制废除后随家族流亡巴黎，曾是波斯王储（后为巴列维国王）与埃及国王法鲁克的求婚对象。1931年其父为她安排嫁与海得拉巴第七代尼扎姆（时称“世界首富”）长子阿扎姆贾赫，堂姐尼鲁费尔同时许配尼扎姆次子莫阿扎姆贾赫，两对婚礼于法国尼斯举行；同年12月经威尼斯启程赴印度途中，据传曾与同船的甘地相遇。抵海得拉巴后获封“杜尔达娜贝古姆”及“贝拉尔公主”称号，1933、1939年先后诞下二子，长子穆卡拉姆贾赫后被祖父尼扎姆越过其父指定为王位继承人。她通晓土耳其、法、英、乌尔都四语，在海得拉巴大力倡导女性教育与医疗，推动废除深闺制，创办女子学院、医院及妇产机构，并主持开通海得拉巴贝古姆佩特机场，是首位为机场剪彩的女性。约1954年与阿扎姆贾赫离婚，此后移居伦敦。1944年其父逝世，土耳其政府拒绝其归葬伊斯坦布尔，她因此终生拒绝在土耳其下葬。2006年2月7日在伦敦逝世，葬于布鲁克伍德公墓。"
 TUR_durrushehvar_i_desc:0 "杜露塞瓦尔苏丹（全名哈蒂杰·哈伊里耶·阿伊舍·杜露塞瓦尔，1914年1月26日—2006年2月7日）生于伊斯坦布尔于斯屈达尔恰姆勒贾宫，末代哈里发阿卜杜勒迈西德二世的独生女。1924年哈里发制废除后随家族流亡巴黎，曾是波斯王储（后为巴列维国王）与埃及国王法鲁克的求婚对象。1931年其父为她安排嫁与海得拉巴第七代尼扎姆（时称“世界首富”）长子阿扎姆贾赫，堂姐尼鲁费尔同时许配尼扎姆次子莫阿扎姆贾赫，两对婚礼于法国尼斯举行；同年12月经威尼斯启程赴印度途中，据传曾与同船的甘地相遇。抵海得拉巴后获封“杜尔达娜贝古姆”及“贝拉尔公主”称号，1933、1939年先后诞下二子，长子穆卡拉姆贾赫后被祖父尼扎姆越过其父指定为王位继承人。她通晓土耳其、法、英、乌尔都四语，在海得拉巴大力倡导女性教育与医疗，推动废除深闺制，创办女子学院、医院及妇产机构，并主持开通海得拉巴贝古姆佩特机场，是首位为机场剪彩的女性。约1954年与阿扎姆贾赫离婚，此后移居伦敦。1944年其父逝世，土耳其政府拒绝其归葬伊斯坦布尔，她因此终生拒绝在土耳其下葬。2006年2月7日在伦敦逝世，葬于布鲁克伍德公墓。"
 TUR_elyesa_bazna_desc:0 "埃利耶萨·巴兹纳（约1904年7月28日—1970年12月21日），代号“西塞罗”，是二战期间为纳粹德国效力的著名间谍。他是科索沃出身的阿尔巴尼亚裔，幼年随家迁居伊斯坦布尔并入土耳其籍；早年经历驳杂，曾从军、做过锁匠、司机，甚至当过职业歌剧演唱者。1943年，他受雇为英国驻安卡拉大使休·纳奇布尔-休格森的贴身男仆。利用大使将机密文件带回住所的习惯，他凭锁匠技艺复制了文件箱与保险柜的钥匙，拍摄大量英方绝密文件（涉及盟军战略、兵力部署及土耳其参战问题），自1943年10月起经德国武官莫伊齐施出售给德方，由德国大使冯·巴本赐其代号“西塞罗”，史称“西塞罗事件”。其情报价值极高，一度可能危及诺曼底登陆计划，但因德国高层（尤其里宾特洛甫）怀疑他是双面间谍而大多未予采用，德方支付的报酬亦大半是伪钞。1944年初，因德方一名女秘书叛逃、英方警觉，他停止活动并辞去男仆之职。战后他试图用所得开办旅馆，却发现钞票系伪造，还因使用假钞短暂入狱。晚年他在慕尼黑当守夜人，向西德申请抚恤金被拒，1962年出版回忆录《我是西塞罗》。1970年12月21日，他穷困潦倒地病逝于慕尼黑。"
 TUR_fahrettin_altay_desc:0 "法瑞丁·阿勒泰（1880年1月12日—1974年10月25日）生于斯库台（今阿尔巴尼亚什科德拉），父亲为来自伊兹密尔的步兵中校伊斯麦尔贝伊。1897年以第一名考入伊斯坦布尔军事学院，1900年毕业，1902年自总参谋学院结业。巴尔干战争中任恰塔尔贾骑兵旅指挥官，抵御保加利亚军；一战中任第三军参谋长，转战恰纳卡莱（加里波利）战线，首次与穆斯塔法·凯末尔结识，后赴罗马尼亚、巴勒斯坦战线，战争结束时在科尼亚任第十二军军长。独立战争期间任第五骑兵军军长，这是他一生最为人称道的战功所在：1922年8月杜姆卢平纳战役中，第五骑兵军绕至希腊军队后方，切断其补给与通讯，助力俘获希军总司令特里库皮斯将军；9月9日，他麾下骑兵成为最先开进伊兹密尔的土耳其部队，结束希腊三年占领。1926年晋上将，1927年恰克马克外出期间曾代理总参谋长。其姓氏“阿勒泰”（意为枣红色的马驹）由阿塔图尔克所赐；1933—1935年参与勘定阿富汗与伊朗边界。1945年退役，1946—1950年任共和人民党布尔杜尔选区议员，此后退出政坛，著有多部独立战争骑兵作战史。1974年在伊斯坦布尔逝世。土耳其国产“阿勒泰”主战坦克即以他命名。"
 TUR_fakhri_pasha_desc:0 "法赫里帕夏，即奥梅尔·法赫雷丁·土尔康，1868年—1948年11月22日，生于鲁斯丘克（今保加利亚鲁塞），幼年随家迁居伊斯坦布尔。1888年自军事学院毕业（骑兵少尉），1891年总参谋学院结业，早年在第四集团军东部边境服役。他参加过意土战争与巴尔干战争，巴尔干战争中任驻加里波利第三十一师师长，并与恩维尔一同收复埃迪尔内（阿德里安堡）。1914年任驻摩苏尔第十二军军长，同年11月晋少将，后任驻阿勒颇第四集团军副司令。一战中，因麦加谢里夫侯赛因酝酿起义，他奉杰马勒帕夏之命于1916年5月赴汉志守卫麦地那，7月17日起任汉志远征军司令。面对阿拉伯起义军与英军的围攻，他以寡敌众坚守圣城，并全力保护希贾兹铁路免遭破坏（铁路沿线曾遭劳伦斯等组织的频繁袭击）；1917年5月，他将麦地那的圣物与珍贵手稿运往伊斯坦布尔妥善保存。因坚韧防御，英、阿方面称他为“沙漠之虎”“沙漠雄狮”。1918年10月《穆德罗斯停战协定》签订后，他拒绝投降撤离，战后仍让奥斯曼旗在麦地那飘扬七十二天，苏丹将其免职亦不从；1919年1月10日，他终因粮尽力竭被自己的部下挟持，交予埃米尔阿卜杜拉。此后他先后被押往开罗、马耳他，1921年获释返国，同年大国民议会任命他为驻喀布尔大使，成功争取了阿富汗对独立战争的支持。1926年归国后任军事法庭委员会委员、主席，1936年以少将军衔退役。1948年11月22日逝世，葬于阿希扬公墓。"
 TUR_ferdinando_umberto_desc:0 "斐迪南·翁贝托·菲利普·阿达尔贝托（1884年—1963年）通称萨伏伊的斐迪南多、第三代热那亚公爵，是意大利王室萨伏伊家族成员、意大利皇家海军上将。他生于都灵，是第二代热那亚公爵托马索亲王与巴伐利亚的伊莎贝拉公主之长子，系国王维托里奥·埃马努埃莱三世的堂弟。1904年获“乌迪内亲王”封号。一战中，他以上校军衔指挥侦察巡洋舰“斯帕尔维耶罗”号，并获英勇勋章。1917年率意大利战时使团访问美国。1931年父亲去世后继承热那亚公爵爵位，海军生涯后期晋上将，任上亚得里亚海舰队司令。1946年意大利公投废除君主制后，萨伏伊王朝统治结束。1963年在博尔迪盖拉逝世。"
 TUR_fethi_okyar_desc:0 "费特希·奥克亚尔（全名阿里·费特希·奥克亚尔，1880年4月29日—1943年5月7日）生于马其顿普里莱普（今北马其顿），土耳其外交家、政治家，土耳其第二任总理。早年与凯末尔同窗于莫纳斯提尔军校，1907年加入统一进步委员会并劝说凯末尔加入，参与1908年青年土耳其党革命宣言起草，加入推翻苏丹阿卜杜勒哈米德二世的“行动军”。1909—1911年任驻巴黎武官。一战后被监禁两年并流放马耳他，1921年获释加入民族运动，任安卡拉政府内政部长。1923年8月至共和国成立后任总理，11月当选大国民议会第二任议长；1924年11月再度出任总理，1925年因谢赫赛义德起义需强硬政策而由伊诺努接替，后任驻巴黎大使。1930年8月奉凯末尔之命创立自由共和党，任党魁，该党迅速吸引大量反凯末尔改革的保守与少数族裔支持者，引发动荡，同年11月经凯末尔劝说自行解散。此后再任驻巴黎、伦敦大使，1934年获赐姓“奥克亚尔”，促成英土关系缓和，参与《蒙特勒公约》谈判。凯末尔逝世后，伊诺努推行和解政策，他于1939年回国复出，任萨伊达姆内阁司法部长至1941年。1942年退休，1943年5月7日在伊斯坦布尔逝世。"
 TUR_fevzi_cakmak_desc:0 "穆斯塔法·费夫齐·恰克马克（1876年1月12日—1950年4月10日）生于伊斯坦布尔锡汉吉尔，父亲为炮兵军官。1896年军事学院步兵中尉毕业，后入总参谋学院深造，参与意土战争、第一次巴尔干战争。一战期间历任达达尼尔第五军军长、高加索第二军军长等职，1918年12月任奥斯曼总参谋长。1920年4月加入安纳托利亚民族运动，任国防部长兼副总理，旧奥斯曼军事法庭因此缺席判处其死刑。库塔希亚-阿尔滕塔什战役失利后他接管军队稳住溃退，1921年8月辞去国防部长改任总参谋长部长，旋即指挥萨卡里亚河战役击败希腊军队；1922年7月辞去总理职务（此前曾短暂任总理），与凯末尔共同策划指挥杜姆卢平纳战役大胜，同年8月经凯末尔推荐晋元帅，是共和国历史上仅有的两位元帅之一。1923年起续任首任总参谋长直至1944年退役，任职逾二十年，期间于1925年指挥镇压谢赫赛义德起义。1938年凯末尔逝世后曾是总统候选人，让位于伊诺努。1946年作为独立候选人加入民主党当选议员，后因不满转投保守派民族党出任名誉主席。精通法、英、德、俄、波斯、阿拉伯等多种语言。1950年4月10日在伊斯坦布尔家中逝世，葬于埃于普公墓。"
 TUR_halide_edib_adivar_desc:0 "哈莉黛·埃迪布·阿迪瓦尔（1884年6月11日—1964年1月9日）生于伊斯坦布尔上层家庭，父亲曾任苏丹阿卜杜勒哈米德二世的秘书，是土耳其小说家、教师，也是民族主义与女性主义知识分子、土耳其妇女解放的先驱。她是首位毕业于伊斯坦布尔美国女子学院的穆斯林女性，1908年起以笔名为《塔宁报》撰稿；1910年因首任丈夫娶第二房而离婚，1917年改嫁医生兼政治家阿德南·阿迪瓦尔，“阿迪瓦尔”姓氏由阿塔图尔克于1934年所赐。她创办妇女权利团体、参与“土耳其炉”，著有泛突厥色彩的《新图兰》（1912）。一战中她任贝鲁特、大马士革、阿勒颇的学校督察，并管理安托拉（今黎巴嫩）一所孤儿院，院中亚美尼亚大屠杀的孤儿被施以强制土耳其化同化；她在回忆录中称本意是救人、并不认同此举，但历史学者对此说法存在争议。独立战争中她以雄辩的演说（如苏丹艾哈迈德广场集会）闻名，协助向安纳托利亚偷运武器，与尤努斯·纳迪共创阿纳多卢通讯社，1920年随夫赴安卡拉投身民族运动，曾遭奥斯曼当局缺席判处死刑，并在前线获军衔、被视为战争英雄。代表作《火衫》（1922）是土耳其文学史上第一部战争小说。其夫参与进步共和党、该党1925年被取缔后，夫妇被控叛国，1926—1939年流亡欧美，曾在哥伦比亚大学客座并应甘地之邀赴印度。1939年归国后任伊斯坦布尔大学英国文学教授，1950年当选伊兹密尔选区议员，1954年辞职。1964年1月9日逝世，一生著有二十余部小说，被誉为“土耳其的圣女贞德”。"
 TUR_halil_kut_desc:0 "哈里里·库特，又称哈里里帕夏（1881年—1957年），生于伊斯坦布尔，是奥斯曼末期军事将领、战争大臣恩维尔帕夏之叔，也是军火实业家努里·基利吉尔之叔。1905年自军事学院毕业，在马其顿第三集团军服役期间加入统一进步委员会，后参加意土战争与巴尔干战争。一战期间，他先后在高加索和伊拉克战线任职，1915年底接替努雷丁帕夏指挥驻伊拉克奥斯曼军。1916年库特阿马拉围城战中，他迫使被困英印军投降，因此获“库特阿马拉英雄”称号，1934年取姓“库特”。在亚美尼亚大屠杀期间，他对针对亚美尼亚及亚述平民的暴行负有重大责任。战后被英军逮捕并流放马耳他，1920年越狱赴莫斯科，曾充当布尔什维克与凯末尔民族运动之间的中间人。1957年逝世。"
 TUR_hans_von_luck_desc:0 "汉斯-乌尔里希·弗赖赫尔·冯·勒克·翁德·维滕（1911年—1997年）通称汉斯·冯·勒克，是德国装甲兵军官，军衔至上校。他生于弗伦斯堡一个普鲁士军人世家，父亲曾服役于帝国海军。1929年入国防军，1931—1932年在德累斯顿步兵学校接受隆美尔主持的军官训练。二战中，他先后在第七装甲师、第二十一装甲师服役，参加波兰战役、法国战役、巴巴罗萨行动和北非战场。诺曼底战役中，他以战斗群指挥官身份参与抵抗英军“古德伍德”行动。1945年被苏军俘虏，在高加索一带战俘营关押五年，1950年获释返回西德。战后写成回忆录《装甲指挥官》，1997年在汉堡逝世。"
 TUR_hasan_saka_desc:0 "哈桑·许斯努·萨卡（1885年—1960年7月29日）生于特拉布宗，是土耳其政治家、经济学家与外交官。1908年自帝国行政学校毕业，入会计法院任职，1909年由奥斯曼政府派往法国，在巴黎政治学院攻读外交。他当选末届奥斯曼议会特拉布宗议员，1921年1月28日当选大国民议会特拉布宗议员，同年任财政部长，并作为土耳其代表团成员出席洛桑会议。1944年9月任外交部长，1945年率土耳其代表团出席奠定联合国基础的旧金山会议。1947年9月接替佩克尔出任总理，其间正值土耳其向多党制过渡，他致力于改善党派关系、推动民主化，任内确立了“秘密投票、公开计票”原则；1948年6月辞职后又受命组阁，连任至1949年1月，因经济与政治困局辞去总理职务，由居纳尔塔纳继任。此后任共和人民党议会党团副主席，1954年退出政坛。1960年7月29日在伊斯坦布尔逝世，葬于津吉尔利库尤公墓。"
 TUR_hayrullah_fisek_desc:0 "哈伊鲁拉·菲塞克（1885年6月3日—1975年7月13日）出生于卡尔坎德伦（今北马其顿泰托沃），系阿尔巴尼亚与土耳其混血家族后裔，“菲塞克”家族姓氏可追溯至18世纪末先祖苏莱曼阿加。1901年入奥斯曼军事学院，1904年以全班第七名毕业任步兵少尉，1906年参谋学院毕业获“优等上尉”军衔。独立战争期间，他参与萨卡里亚河战役任临时军参谋长，后历任第十四军、科贾埃利集团军、第三军参谋长，军衔升至参谋中校，亦参与巴勒克埃西尔、索马、班德尔马等地战斗；1921年9月萨卡里亚河战役期间，他曾与恰克马克、厄扎尔普、凯末尔、伊诺努一同在波拉特勒前线观察哨现场。此后晋升少将，出任国防部副国务秘书，1945年退役。其子努斯雷特·菲塞克后任卫生部副国务秘书及著名公共卫生学者，另一子希克里·菲塞克为国际法教授。哈伊鲁拉·菲塞克本人虽非历史聚光灯下的核心人物，却始终活跃于独立战争及共和国建国一线，是凯末尔身边重要的幕僚型将领之一。1975年7月13日逝世。"
 TUR_hazi_aslanov_desc:0 "哈兹·阿哈德奥卢·阿斯兰诺夫（1910年—1945年）是阿塞拜疆塔利什族出身的苏联装甲兵少将，两次荣获“苏联英雄”称号。他生于伦科兰砖厂工人家庭，1923年丧父后辍学，后入巴库外高加索军事预备学校，转入列宁格勒骑兵学校并修读装甲兵课程。1931年起任骑兵排长，1933年转入坦克兵，1939年随苏军入侵波兰，后参加苏芬冬季战争。苏德战争爆发后，他历任摩托运输营长、坦克营长，在绍斯特卡等地战斗中负伤仍坚持指挥。1942年任第五十五坦克旅副旅长、旅长，参加斯大林格勒战役，在维尔赫涅库姆斯克重创曼施坦因集团军的解围尝试。1942年12月获颁首枚“苏联英雄”勋章。1945年1月在拉脱维亚普里耶库莱附近侦察时重伤牺牲。"
 TUR_hilmi_uran_desc:0 "希勒米·乌兰（约1886年—1957年10月21日）生于博德鲁姆，是土耳其政治家、政府部长。他毕业于政治学院，奥斯曼末期曾任伊兹密尔省门内门、切什梅两地的县长，并以门特谢（穆拉）选区代表身份进入奥斯曼议会。共和国成立后，他于1927—1950年任阿达纳省塞伊汉选区议员，先后出任公共工程部长（1930—1933）、司法部长（1938—1939）及内政部长（1943—1946）。他是共和人民党的活跃成员，并曾任该党总书记。1957年10月21日逝世。"
 TUR_ismet_inonu_desc:0 "穆斯塔法·伊斯麦特·伊诺努（1884年9月24日—1973年12月25日）生于伊兹密尔，1903年炮兵学校毕业，后入伊斯坦布尔总参谋学院。一战中先后任加里波利战线参谋长、东线第二集团军指挥官，1917年高加索战场与凯末尔重逢并结为终身挚友。独立战争期间，他于1920年10月任西部前线司令，1921年两次在伊诺努地区击退希腊军队（其姓氏即源于此），萨卡里亚河战役后晋中将。1922—1924年任新生陆军首任总参谋长，并作为安卡拉政府首席代表出席穆丹亚停战谈判及洛桑会议。1923年10月30日出任土耳其首任总理，此后在凯末尔总统任内三度组阁，1934年获“伊诺努”姓氏。1937年因经济政策分歧辞职，由拜亚尔接任。1938年11月凯末尔逝世后当选第二任总统，获“国家领袖”称号；任内强力镇压谢赫赛义德起义、推行独立法庭死刑判决、压制反对党，二战中维持武装中立直至1945年才正式加入盟军，1939年并入哈塔伊。1946年推动多党制，1950年大选败给民主党后和平交权，任反对党领袖十年；1960年政变后再度组阁。1973年12月25日在安卡拉因心脏病逝世，葬于阿尼特卡比尔陵园。"
 TUR_izzettin_calislar_desc:0 "伊扎丁·恰勒什拉尔（1882年—1951年8月20日）出生于雅尼纳省雅尼亚（今希腊约阿尼纳），1903年加入奥斯曼军队，因在加里波利战役中的表现崭露头角。一战后加入凯末尔领导的民族运动，投身独立战争，先后指挥第六十一师等多支部队，参与第二次伊诺努战役、萨卡里亚河战役及收复伊兹密尔的最后决战，是凯末尔主义军事运动的重要将领之一。战后转入政界，当选大国民议会议员，先后代表艾登、穆拉、巴勒克埃西尔等选区，始终是凯末尔改革事业的坚定支持者。他著有多部关于独立战争各战役的军事著作，包括《第二次伊诺努战役中的第六十一师》《萨卡里亚河会战中的第一集团军》《从萨卡里亚到伊兹密尔的第一军》等，为后世研究独立战争留下重要史料。1951年8月20日在伊斯坦布尔逝世，葬于土耳其国家公墓。"
 TUR_kamil_tolon_desc:0 "卡米尔·厄兹代米尔·托隆（1912年2月29日—1978年7月23日）生于伊斯坦布尔贝伊莱尔贝伊，是土耳其实业家、发明家，以在土耳其首次制造出电动机而知名，并非军事人物。他本想成为工程师，但因当时缺少工科院校而转入安卡拉大学法学院，1935年毕业，曾短暂任邮电局稽查员。后迁居布尔萨，1937年创办“托隆机械”，生产各类机械。1944年应征入伍，期间继续为军队研制发明；退役后转产联合收割机、水泵、洗衣机、洗碗机等。1958年布尔萨大火烧毁其作坊，他在红新月会帐篷中坚持生产，并自1959年起亲自设计建造新工厂，1960年投产后销路大增，门店遍及全国六十余省。他是正义党创始成员之一，1963—1965年任布尔萨工商会主席，对土耳其首个有组织工业区的建立起到关键作用。1935年姓氏法颁布时他取姓“托隆乔克”（意为“极有才干”），1944年简化为“托隆”。1978年在瑞士日内瓦因栓塞逝世，被视为土耳其工业化的重要推动者之一。"
 TUR_kazim_karabekir_desc:0 "穆萨·卡齐姆·卡拉贝基尔（1882年7月23日—1948年1月26日）生于伊斯坦布尔，父亲是奥斯曼将领。1902年战争学院毕业，一战中曾任德国将领冯·德尔·戈尔茨参谋长，1916年率第十八军从英军手中攻占库特阿马拉。奥斯曼战败后，他拒绝苏丹缴械投降的命令，向东安纳托利亚民众分发武器，并在埃尔祖鲁姆代表大会前夕派骑兵旅保护初抵当地的凯末尔。1920年6月任新成立的东部战线司令，同年9月起对亚美尼亚发动军事行动，攻占萨勒卡默什、卡尔斯，进抵亚历山德罗波尔，土军此役亦对当地平民施以包括屠杀在内的暴行，数万人丧生；同年12月与亚美尼亚签约迫其割地。1923年获大国民议会最高荣誉“独立勋章”，1924年10月退役从政，因与凯末尔在哈里发制废除步调上存在分歧，同年11月与杰贝索伊等人创立反对党“进步共和党”，该党被指与1925年谢赫赛义德起义有牵连，遭政府取缔，本人被捕，后经凯末尔干预无罪开释，但二人自此绝交。此后近十五年他在监视下闲居伊斯坦布尔撰写回忆录，著作一度被收缴焚毁。1938年凯末尔逝世后，挚友伊诺努为他平反，1939年重返议会，1946年当选议长，1948年1月26日在任内心脏病逝世。"
 TUR_kazim_orbay_desc:0 "穆罕默德·卡齐姆·奥尔巴伊（1887年3月11日—1964年6月3日）生于士麦那（今伊兹密尔），1904年皇家陆军工程学校毕业任炮兵中尉，1907年参谋学院毕业。一战中任奥斯曼战争部首席副官，是恩维尔帕夏的亲信（后娶其妹梅迪哈为妻），1915年作为奥斯曼代表随“尼德迈尔-亨蒂希远征团”出使阿富汗，向阿富汗埃米尔呈递苏丹“圣战”宣言。独立战争期间历任东部战线、高加索地区指挥职务，1922年8月杜姆卢平纳决战中率部俘获希腊两名师长、75名军官、约两千士兵，并将俘虏指挥官带至凯末尔帕夏面前，亲历凯末尔对待俘虏的宽厚态度。同年晋准将，任第三高加索师师长。1926年晋中将任副总参谋长，1928—1929年出任阿富汗王国总参谋长，1935年晋上将，1937—1938年指挥镇压代尔西姆叛乱，该行动后于1953年遭议会请愿委员会调查。1944年1月接替恰克马克出任第三任总参谋长，1946年7月因其子哈什梅特涉入一桩谋杀政治丑闻而辞职，1950年正式退役。1960年政变后于1961年当选参议员并任议会议长。1964年6月3日因胃癌在安卡拉逝世，葬于土耳其国家公墓。"
 TUR_kazim_ozalp_desc:0 "卡齐姆·菲克里·厄扎尔普（1882年2月17日—1968年6月6日）生于科普吕卢（今北马其顿韦莱斯），出身阿尔巴尼亚裔家庭，是独立战争的重要人物之一。1902年自奥斯曼军事学院毕业，1905年总参谋学院结业，曾卷入1909年三十一日事件，巴尔干战争中任奥斯曼军指挥官，1917年晋上校。伊兹密尔遭希腊占领后，他是组织抵抗力量的军事指挥官之一，独立战争期间转战多条战线，1921年因萨卡里亚河战役战功晋将。作为巴勒克埃西尔选区议员，他于1921—1925年及1935—1939年两度出任国防部长，1924—1935年长期担任大国民议会议长，是凯末尔推行改革的重要支柱之一（1924年他与伊诺努、恰克马克一同认可了废除哈里发制）。1950年当选凡省议员，1954年退出政坛。他著有回忆录《民族斗争》，坊间曾传其为贝克塔什教团成员（或因其反对关闭教团道堂）。1968年6月6日在安卡拉逝世，遗体迁葬于土耳其国家公墓。"
 TUR_mehmet_ali_ulgen_desc:0 "穆罕默德·阿里·乌尔根（1887年—1952年7月23日）生于伊斯坦布尔，是一名土耳其海军上将，曾任土耳其海军首任司令（1949年7月1日—1950年）。他约1905年自海军学校毕业任少尉入海军，先后在多艘炮舰、战舰上任炮术军官并接受海上训练。1925年晋海军中校，1936年晋海军少将，1945年晋海军中将，1948年晋海军上将。其间他历任海军部处长、舰队司令、马尔马拉海军基地司令、科贾埃利筑垒地域司令及战斗舰队司令等职，1948年后并任国防部次长。1949年7月出任新设的土耳其海军司令部首任司令，一年后由萨德克·阿尔丁坎接任，旋即自愿退役。1952年7月23日在伊斯坦布尔逝世。"
 TUR_mehmet_emin_yurdakul_desc:0 "梅赫梅特·埃明·尤尔达库尔（1869年5月13日—1944年1月14日）生于伊斯坦布尔，父亲是渔民，是土耳其民族主义作家、诗人与政治人物，被尊为土耳其的“民族诗人”，也是泛突厥主义的思想代表之一，其诗文对界定“祖国”一词影响深远。因家境困难，他未能正式完成学业，早年即进入奥斯曼行政机构任职。1891年出版《美德与高贵》，1892年在伊斯坦布尔结识思想家哲马尔丁·阿富汗尼并受其影响。1898年前后出版诗集《土耳其语诗篇》。1907年加入统一进步委员会，1908年后历任奥斯曼数省省长，并自1911年起活跃于“土耳其人协会”“土耳其炉”等泛突厥团体。他坚持使用质朴纯净的土耳其语、采用民间音节格律，其爱国与英雄主题的诗作在一战期间广为流传。1913年他当选代表摩苏尔的奥斯曼议员；共和国成立后任大国民议会议员，支持采用新土耳其字母。1944年1月14日逝世，葬于津吉尔利库尤公墓。"
 TUR_mehmet_esat_pasha_desc:0 "穆罕默德·艾萨特帕夏（姓氏法后改称穆罕默德·艾萨特·比尔卡特，1862年10月18日—1952年11月2日）生于雅尼纳（今希腊约阿尼纳），出身当地穆斯林家庭（一说阿尔巴尼亚裔），父亲曾任该城市长，其弟韦希卜帕夏亦为名将。1887年以全班第一自伊斯坦布尔军事学院毕业，1890年总参谋学院结业后赴德国（斯特拉斯堡、柏林）受训四年，归国后曾任改革奥斯曼军队的德国将领冯·德尔·戈尔茨的副官。1897年希土战争任军参谋长，后执教军事学院，1902年晋将。巴尔干战争中任雅尼纳军军长，率部据守雅尼纳近七个月，1913年比扎尼会战后被迫投降，在希腊战俘营关押至年底；此役令他获“帕夏”尊号与英雄声望。1913年12月起任加里波利第三军军长。一战加里波利战役中，世人多聚焦于第五集团军德国司令利曼·冯·赞德斯及其部下穆斯塔法·凯末尔，但真正在战前筹划奥斯曼防御、统领北部战线的正是艾萨特本人。1915年9月晋中将，11月接替戈尔茨任第一集团军司令，此后历任第五、第三集团军司令。穆德罗斯停战后任名义上的第二集团军督察，1919年11月退役；1920年曾任萨利赫·胡卢西帕夏内阁的海军部长，后加入凯末尔的民族运动。1934年依姓氏法取姓“比尔卡特”，晚年撰有六卷本《恰纳卡莱回忆录》等未刊著作。1952年11月2日逝世。"
 TUR_mehmet_fahri_engin_desc:0 "穆罕默德·法赫里·恩金（1888年—1970年11月6日）生于伊斯坦布尔，是奥斯曼海军出身的土耳其海军将领与政治家。他毕业于海军学校，并在英国朴茨茅斯海军学校深造，后任土耳其舰队司令（约1928—1930年）及海军军事学院院长，并曾任海事银行顾问。他以共和人民党党员身份当选萨姆松选区议员（第五届补选及第六、七届），并出任运输（交通）部长（1941年11月—1943年3月）。他已婚，育有二子。1970年11月6日逝世。"
 TUR_mehmet_gunaltay_desc:0 "穆罕默德·谢姆塞廷·居纳尔塔纳（1883年7月17日—1961年10月19日）生于马穆雷图阿齐兹省的凯马利耶（埃因），父亲是经学院教师，是土耳其历史学家与政治家，1949—1950年任土耳其总理。他受过经学院与世俗双重教育，毕业于维法高中、师范学院，并在瑞士洛桑大学攻读物理。回国后任中学教师，其间结识泛突厥主义思想家齐亚·格卡尔普，受其影响转而研究土耳其历史。1914年起任伊斯坦布尔大学文学院“突厥与伊斯兰民族史”教授。1915年当选奥斯曼议员，独立战争期间加入“安纳托利亚与鲁梅利权利保护协会”。共和国成立后，他长期任锡瓦斯选区议员（1923—1950，共和人民党）。1949年1月哈桑·萨卡辞职后，他受伊诺努委任组阁，任总理至1950年5月民主党执政为止，是土耳其单一政党时代的末任总理；任内他重开安卡拉大学神学院，并推动确立秘密投票制。他自1941年起任土耳其历史学会会长直至去世。1961年10月19日在伊斯坦布尔逝世。"
 TUR_mehmet_nuri_yamut_desc:0 "穆罕默德·努里·雅穆特帕夏（1890年—1961年6月5日）生于萨洛尼卡（今希腊塞萨洛尼基），是一名炮兵出身的土耳其将领。他经历巴尔干战争，一战中以参谋身份随第十一师参与加里波利战役并负伤，获战争奖章；独立战争中获独立勋章与银质作战功绩勋章。1943年任驻加里波利地区第二军军长期间，他变卖自己在伊斯坦布尔的房产，出资在阿尔奇泰佩为1915年阵亡的奥斯曼士兵修建了“努里·雅穆特烈士纪念碑”。1945年晋上将，1949年成为新设的土耳其陆军（陆军部队司令部）首任司令；这也是奥斯曼军队转型为现代正规军以来的首任陆军部队总司令。1950年6月起任总参谋长，任内主导了土耳其向朝鲜战场派兵及加入北约的进程，至1954年4月退役。退役后他加入执政的民主党，以伊斯坦布尔选区代表身份当选大国民议会议员（第十、十一届）。1960年军事政变后，他与阿里·福阿德·杰贝索伊、塔赫辛·亚泽哲等人一同被捕入狱。1961年6月5日在伊斯坦布尔逝世。"
 TUR_mehmet_recep_peker_desc:0 "穆罕默德·雷杰普·佩克尔（1889年2月5日—1950年4月1日）生于伊斯坦布尔，父系出自高加索达吉斯坦移民。军事学院毕业后参与也门、利比亚战役及巴尔干战争，一战中转战色雷斯、高加索战场，1919年以总参谋学院第一名毕业。1920年2月以骑兵中队长身份投身安纳托利亚独立战争，同年4月23日大国民议会开幕当日即被任命为议会秘书长，任职三年有余，期间兼总参谋部第二处处长。1924年起历任财政部长、内政部长、国防部长、公共工程部长，1928年当选共和人民党总书记，主导推行“革命史”课程及“共和主义思想”教育，支持妇女解放及拉丁字母改革。1936年赴意大利考察法西斯制度后，曾建议在大国民议会内仿效设立“法西斯大议会”，此议获总理伊诺努初步认可，却被凯末尔本人否决，凯末尔随即将其解除总书记职务。1942年8月任萨拉吉奥卢内阁内政部长，1946年8月7日成为土耳其多党制时代首任总理，任内坚持国家主义、威权一党体制立场，反对民主化深入推行，与民主党领袖曼德列斯在议会激烈交锋后于1947年9月辞职。1948年退出政坛，1950年4月1日逝世，葬于伊斯坦布尔埃迪尔内卡普烈士公墓。"
 TUR_mehmet_salih_omurtak_desc:0 "穆罕默德·萨利赫·奥穆尔塔克（1889年—1954年6月23日）生于萨洛尼卡（今希腊塞萨洛尼基），是土耳其第四任总参谋长。1907年自奥斯曼军事学院毕业任少尉，1910年总参谋学院结业后任参谋军官，在奥斯曼军队多个司令部任职。1920年1月22日抵达安卡拉，加入民族运动，在独立战争期间及战后指挥过多支部队，其中包括第六十一师。1926年晋少将，1930年晋中将，1940年起以上将军衔任第一集团军司令。1946年8月1日，在卡齐姆·奥尔巴伊辞职后，他出任总参谋长，任职至1949年6月8日，此后任最高军事咨询委员会委员，直至1950年7月6日退役。1954年6月23日在安卡拉逝世，遗体后迁葬于土耳其国家公墓。"
 TUR_memduh_tagmac_desc:0 "梅姆杜赫·塔马奇（1904年—1978年3月30日）生于埃尔祖鲁姆，是土耳其陆军将领、第十四任总参谋长。他曾任土耳其第一集团军司令（1966—1968）、陆军（陆军部队）司令（1968—1969），后升任总参谋长。其历史地位主要与1971年“军事备忘录”（土耳其语“3月12日备忘录”）相关：当时土耳其社会动荡，左右翼暴力与街头冲突频发，1971年3月12日，作为总参谋长的塔马奇代表军方向总理苏莱曼·德米雷尔递交了一份措辞强硬、实为最后通牒的备忘录，要求组建强有力的政府以平息“无政府状态、骨肉相残及社会经济动荡”、推行宪法所设想的改革，并威胁若要求不获满足，军队将“履行其宪法职责”自行接管政权。德米雷尔随即辞职，老政治家、反对党领袖伊诺努则严词谴责军方干政。这是继1960年政变之后土耳其第二次军事干政，史称“备忘录政变”（以备忘录代替坦克）。值得注意的是，塔马奇本人据信反对军队直接干政，这份备忘录在一定程度上是为抢先压制当时一批激进青年军官策划的政变。此次干政被视为土耳其“军事监护”以新形式介入政治的开端。1978年3月30日逝世。"
 TUR_mumtaz_okmen_desc:0 "穆姆塔兹·厄克门（全名奥梅尔·穆姆塔兹·厄克门，1895年—1961年5月28日）是土耳其律师、文官与政治家，共和人民党人。他毕业于伊斯坦布尔大学法学院，曾任法院书记、助理法官与律师，并在农业银行任职、任该行董事会副主席。自1935年2月起，他连续四届（第五至八届议会）当选安卡拉选区议员，至1950年。其间他在萨伊达姆内阁任商业部长（1940年11月—1942年7月），在第二届萨拉若卢内阁短暂出任司法部长（1946年），并在佩克尔内阁继续任司法部长、兼任新设立的副总理一职（1946年9月—1947年9月），是土耳其首任副总理。他已婚，育有二子。1961年5月28日逝世。"
 TUR_mustafa_kemal_ataturk_desc:0 "穆斯塔法·凯末尔·阿塔图尔克（1881年5月19日—1938年11月10日）生于萨洛尼卡（今希腊塞萨洛尼基），父亲阿里·里扎、母亲祖贝伊德。“凯末尔”是其军校时获称号，意为“完美者”。1908年加入青年土耳其党统一进步委员会，1911—1912年意土战争中坚守德尔纳。一战中他于1915年指挥第十九师在加里波利战役中正确预判盟军登陆地点，成功阻击协约国军队而声名大噪，此后转战高加索、巴勒斯坦战线。1918年10月奥斯曼投降，1919年5月19日抵达萨姆松，组织“保卫国家权利运动”，主持埃尔祖鲁姆、锡瓦斯代表大会，1920年4月23日于安卡拉成立大国民议会。1921年萨卡里亚河战役阻挡希腊攻势，1922年8月杜姆卢平纳战役大胜并逐出希腊军；同年11月苏丹制被废除。1923年7月《洛桑条约》确立现代疆界，10月29日共和国成立，凯末尔当选首任总统，此后推行世俗化改革：废哈里发制、改拉丁字母、推动女性权利与服饰改革，思想体系称“凯末尔主义”。独立战争期间土军亦曾驱逐乃至屠戮安纳托利亚基督徒，此事至今存争议。1934年获“阿塔图尔克”姓氏。1938年11月10日因肝硬化逝世，伊诺努继任总统。"
 TUR_mustafa_muglali_desc:0 "穆斯塔法·穆拉勒（1882年—1951年12月11日）是奥斯曼军队军官、土耳其陆军将领，参加过一战与独立战争。1925年谢赫赛义德起义期间，他作为第三集团军将领参与迪亚巴克尔防御。此后历任第一军代理军长（1931年）、伊斯坦布尔卫戍司令（1939年）、第十军军长（1940年），1942年8月晋升上将并入选最高军事委员会，1943年2月起任第三集团军司令兼督察。任内发生了使其声名蒙污的“穆拉勒事件”（又称“33颗子弹事件”“塞佛溪屠杀”）：1943年7月，凡省厄扎尔普一带四十余名库尔德及库雷孙尼村民因被指控牲畜走私遭拘押，法院仅羁押少数人、释放其余，但穆拉勒抵达厄扎尔普后下令将其中33人（一说32人）押至塞佛溪枪决，仅一人生还（后死于伊朗）。此事一度被掩盖，1948年经民主党议员在大国民议会提出后才展开调查。1950年总参谋部军事法庭判处穆拉勒死刑，后因其年事已高减为20年监禁，但军事最高法院撤销原判；新审尚未开庭，他已于1951年12月11日在安卡拉居尔哈内军医院逝世。该屠杀后被诗人艾哈迈德·阿里夫写入著名诗作《33颗子弹》，至今仍是土耳其历史中一桩未获彻底清算的争议事件。"
 TUR_muzaffer_goksenin_desc:0 "穆扎费尔·格克塞宁（1899年—1965年1月31日）生于马纳斯特尔（今北马其顿比托拉），是土耳其军人与外交官，土耳其空军第二任司令。1916年，年仅十六岁的他从库莱利军事高中应召入伍、任骑兵少尉；1917年随第二十六师骑兵参加巴勒斯坦战役，1918年10月在大马士革附近被英军俘虏，至1920年获释。此后他加入民族军，在独立战争西线作战，并是法赫雷丁·阿尔泰（名单 14）麾下骑兵部队中最早进入伊兹密尔的“九名军官”之一。其后他转入航空兵、赴法国受训，1933年自军事学院毕业为参谋军官。1944年晋准将，历任空军旅、师指挥官及空军次长等职，1948年晋中将。1950年6月接替泽基·多安出任空军代理司令（后晋上将），成为空军第二任司令，任内推动空军现代化、实现由活塞式飞机向喷气式飞机的过渡。1953年因与国防部长意见不合而退役。其后他转入外交界，曾任伊兹密尔省长及驻巴格达、巴基斯坦大使。他通晓法语、英语，获颁独立勋章。1965年1月31日在伊斯坦布尔逝世。"
 TUR_nazim_hikmet_desc:0 "纳齐姆·希克梅特（1902年1月15日—1963年6月3日）生于萨洛尼卡（今希腊塞萨洛尼基）的一个奥斯曼官员家庭，是20世纪土耳其文学最重要的人物之一，被誉为土耳其第一位现代诗人、自由体诗的开创者。少年时就读于加拉塔萨雷高中。1921年他秘密赴安纳托利亚，曾受凯末尔接见；同年起赴莫斯科求学，受马雅可夫斯基等苏联未来派影响，摒弃音节格律、转向自由体诗。1924年作为马克思主义者归国，为左翼刊物撰稿并从事共产主义宣传，遭判刑后逃回苏联；1928年大赦返国，十年间出版多部诗集，并以校对、记者、翻译、编剧等为生。1938年他被控“煽动军人叛乱”受审、判处长期监禁，前后在土耳其监狱约十七年，多在布尔萨狱中度过；其间毕加索、聂鲁达、萨特等国际名流曾发起声援。1950年获释后仍受当局监视，遂于1951年经罗马尼亚流亡苏联，旋被剥夺土耳其国籍。此后他长居苏联及社会主义国家，活跃于欧洲左翼和平运动。其作品长期在土耳其遭禁，身后方获广泛出版，他被奉为人民诗人与土耳其左翼的英雄，代表作有狱中写就、约两万行的长诗《我的祖国的人类风景》。2009年土耳其恢复了他的国籍。1963年6月3日他在莫斯科病逝。"
 TUR_nazmi_solok_desc:0 "侯赛因·纳兹米·索洛克（1876年—1956年1月1日）生于巴勒克埃西尔，是奥斯曼军队军官、土耳其陆军中将（并非空军将领）。1898年自军事学院毕业任少尉，1907年晋上尉，巴尔干战争中任第三师副师长。一战期间他在美索不达米亚战场指挥营、团级部队（如第四十四团、第三团），1916年2月晋中校，1918年被英军俘虏。1920年6月，他逃出战俘营、辗转抵达安纳托利亚加入民族运动，先后指挥第五十七师、第五十六师、第一与第二骑兵师及门德雷斯集群，在西线抵御希腊军队进攻；1920年12月兼任科尼亚副省长，1921年6月起任第六师师长。其作战多集中于后方机动与侧翼掩护，虽非正面决战的主角，却为独立战争的整体战局提供了重要支撑，获颁独立勋章。后晋升至中将军衔，退役后于1956年1月1日逝世，葬于土耳其国家公墓。"
 TUR_nejdet_sancar_desc:0 "艾哈迈德·内杰代特·桑恰尔（1910年5月1日—1975年2月22日）生于伊斯坦布尔，是土耳其文学教师，泛突厥主义（图兰主义）思想的代表人物之一，著名极端民族主义作家尼哈尔·阿特瑟兹之弟。其家族祖籍居米什哈内，父亲为奥斯曼海军军官。与无神论倾向的兄长不同，他是虔诚的穆斯林，十分看重宗教。他毕业于伊斯坦布尔男子高中，后获突厥学学位；因姓氏法颁布时他正服兵役、与家人无法联络，故与兄长取了不同的姓氏。他长期为民族主义刊物撰稿，并活跃于“土耳其反共协会”“土耳其炉”等组织。1944—1945年，他与阿特瑟兹、阿尔帕斯兰·图尔克什等人一同卷入“种族主义-图兰主义审判”——此案被视为当局对反对伊诺努政策的民族主义阵营的反制——其间他遭受酷刑，但最终被判无罪，相关指控于1947年撤销。他著有《突厥之爱》《我们种族的英雄们》《历史上的土意战争》《致阿弗辛的信》《与伊诺努的清算》五部著作。1975年2月22日，他在修订《历史上的土意战争》增订版时逝世。"
 TUR_nihal_atsiz_desc:0 "侯赛因·尼哈尔·阿特瑟兹（1905年—1975年）生于伊斯坦布尔，父亲为奥斯曼海军军官，是土耳其极端民族主义作家、小说家与诗人，泛突厥主义、图兰主义思想的重要理论家，自称种族主义者，其思想被称为“阿特瑟兹主义”；民族主义作家内杰代特·桑恰尔是其胞弟。“阿特瑟兹”姓意为“无名者”。他著述众多，1931年创办土耳其首份泛突厥刊物《阿特瑟兹杂志》，晚年又主办《厄图肯》等刊物。他强烈反对伊诺努政府，尤其抨击其对苏联的妥协与对共产主义的容忍。1944年因公开指控萨巴哈廷·阿里通共而引发诉讼，继而卷入“种族主义-图兰主义审判”，与图尔克什、泽基·瓦利迪·托甘等人一同受审。1973年又因撰文攻击库尔德分离主义而获刑。1975年逝世。"
 TUR_nuri_demirag_desc:0 "努里·德米拉（本名穆许尔达尔扎德·努里，1886年5月7日—1957年11月13日）生于锡瓦斯迪夫里伊，是共和国初期著名实业家与政治人物，土耳其最早的百万富翁之一。父亲奥梅尔贝伊出身当地名门穆许尔达尔扎德家族；父亲早逝，他幼年家境清贫，早年做过教师与银行职员。1922年他创办卷烟纸厂（品牌“土耳其的胜利”）由此致富，1920年代后期起投资修建土耳其铁路网，承建萨姆松—锡瓦斯—埃尔祖鲁姆、阿菲永—迪纳尔等线，成为土耳其首位大型铁路承包商；1934年姓氏法颁布时，阿塔图尔克因其铁路贡献赐姓“德米拉”（意为“铁网”）。1936年他在伊斯坦布尔贝希克塔什创办土耳其首家私营飞机制造厂，生产Nu D.36双座教练机与Nu D.38双发客机，并制造出土耳其首具国产降落伞；还在耶希尔柯伊购地兴建机场与“天空学校”——土耳其首家私营飞行学校，培养约290名飞行员。1941年8月，首架完全国产的飞机由伊斯坦布尔飞抵其家乡迪夫里伊。但土耳其航空协会于1939年取消订单，令他在航空业的巨额投入受挫，工厂后被国有化（贝希克塔什旧址今为伊斯坦布尔海军博物馆）。1945年，他创立共和国多党制过渡时期的首个反对党“民族发展党”；1954年以独立候选人身份借民主党名单当选锡瓦斯议员。1957年11月13日在伊斯坦布尔逝世。"
 TUR_nuri_killigil_desc:0 "努里·基利吉尔，又称努里帕夏（1889年，一说1890年—1949年3月2日），生于伊斯坦布尔，是奥斯曼军队将领、奥斯曼战争大臣恩维尔帕夏之弟。机枪步兵出身，1915年2月奉命赴利比亚，组织“特殊组织”力量配合当地势力对抗意、英军，1917年起任“非洲集群司令部”指挥官，获授荣誉少将、荣誉中将。1918年应恩维尔之召返回，受命组建并指挥“高加索伊斯兰军”，5月抵甘贾，7月10日正式建军，9月15日率部从布尔什维克与亚美尼亚武装手中攻占巴库；占领期间巴库发生针对亚美尼亚平民的大屠杀，约三万人罹难，基利吉尔对此负有指挥责任。战后他被英军逮捕、押于巴统候审战争罪，1919年8月在支持者伏击押解卫兵后越狱逃往埃尔祖鲁姆，并参加1920年土亚战争中的东线军。两战之间他曾旅居德国，1938年返土，在伊斯坦布尔苏特吕杰开办军火工厂，生产枪支、弹药、防毒面具等；作为泛突厥主义者，二战期间他曾与纳粹德国驻安卡拉大使接触以争取支持，并参与组建党卫军“突厥斯坦军团”，1948年阿以战争期间向多个阿拉伯国家秘密供应武器。1949年3月2日，其苏特吕杰军火工厂发生大爆炸，他与另外二十余名工人当场罹难；因遗体残缺，当时未举行正式葬礼，直至2016年才补办。"
 TUR_rauf_orbay_desc:0 "侯赛因·拉乌夫·奥尔巴伊（1881年7月27日—1964年7月16日）生于伊斯坦布尔，阿布哈兹裔，父亲穆扎费尔帕夏曾任海军中将。1899年自海军学校毕业入海军，巴尔干战争期间任巡洋舰“哈米迪耶”号舰长，以大胆袭扰希腊、保加利亚航运而声名大噪，人称“哈米迪耶英雄”。一战中任海军参谋长，参与加里波利海防，并出席布列斯特-立托夫斯克和谈；他还曾在凯末尔与恩维尔、杰马勒交恶险遭军法审判时出手相助。1918年10月任艾哈迈德·伊泽特帕夏内阁海军部长，代表奥斯曼帝国签署《穆德罗斯停战协定》。随后赴安纳托利亚投身民族运动，出席埃尔祖鲁姆、锡瓦斯代表大会（任后者副主席）；伊斯坦布尔被占后遭英军逮捕，在马耳他拘押约一年，1921年3月经战俘交换获释。1922年7月12日至1923年8月4日任安卡拉政府总理，任内苏丹制被废除；因在《洛桑条约》签署授权问题上与伊诺努产生裂痕而辞职。1924年与卡拉贝基尔等共创反对党进步共和党，1926年被控涉刺杀阿塔图尔克案、缺席判处十年监禁，时他正在国外就医，终未服刑，亦拒绝1933年大赦，1935年方归国。1939年当选卡斯塔莫努独立议员获平反，二战期间出任驻伦敦大使（1942年），1944年辞职。1964年7月16日在伊斯坦布尔逝世。"
 TUR_recep_peker_desc:0 "穆罕默德·雷杰普·佩克尔（1889年2月5日—1950年4月1日）生于伊斯坦布尔，父系出自高加索达吉斯坦移民。军事学院毕业后参与也门、利比亚战役及巴尔干战争，一战中转战色雷斯、高加索战场，1919年以总参谋学院第一名毕业。1920年2月以骑兵中队长身份投身安纳托利亚独立战争，同年4月23日大国民议会开幕当日即被任命为议会秘书长，任职三年有余，期间兼总参谋部第二处处长。1924年起历任财政部长、内政部长、国防部长、公共工程部长，1928年当选共和人民党总书记，主导推行“革命史”课程及“共和主义思想”教育，支持妇女解放及拉丁字母改革。1936年赴意大利考察法西斯制度后，曾建议在大国民议会内仿效设立“法西斯大议会”，此议获总理伊诺努初步认可，却被凯末尔本人否决，凯末尔随即将其解除总书记职务。1942年8月任萨拉吉奥卢内阁内政部长，1946年8月7日成为土耳其多党制时代首任总理，任内坚持国家主义、威权一党体制立场，反对民主化深入推行，与民主党领袖曼德列斯在议会激烈交锋后于1947年9月辞职。1948年退出政坛，1950年4月1日逝世，葬于伊斯坦布尔埃迪尔内卡普烈士公墓。"
 TUR_refet_pasha_desc:0 "雷费特帕夏，本名易卜拉欣·雷费特·贝莱（1881年—1963年），“帕夏”为奥斯曼军衔头衔而非姓氏。他生于萨洛尼卡的土耳其家庭，姓氏“贝莱”取自祖籍保加利亚拜拉的先祖。自奥斯曼军事学院毕业后，他加入统一进步委员会，参加意土战争与巴尔干战争。一战中，他在克雷斯·冯·克雷森施泰因麾下作战，经历罗马尼亚战役、巴勒斯坦战线和第二次加沙之战。1919年伊兹密尔遭希腊登陆后，雷费特赴安纳托利亚投身民族运动，参与《阿马西亚通告》的拟订，并出席埃尔祖鲁姆、阿拉谢希尔、锡瓦斯代表大会。独立战争时期，他任艾登民族军司令，并历任安卡拉政府部长及西线、南线指挥官。1924年与卡拉贝基尔等人创建进步共和党，后因伊兹密尔刺杀案受审并获无罪。1963年在伊斯坦布尔逝世。"
 TUR_refik_saydam_desc:0 "雷菲克·萨伊达姆（全名易卜拉欣·雷菲克·萨伊达姆，1881年9月8日—1942年7月8日）生于伊斯坦布尔，医生出身，土耳其第四任总理（1939—1942）。1899年入军医学校，1905年以军医上尉毕业，后赴柏林深造。巴尔干战争期间在前线防治霍乱，一战中任战争部卫生司副司长，创立细菌学研究所，研制出广泛应用的斑疹伤寒疫苗。1919年5月19日他作为第九军卫生督察随凯末尔同船登陆萨姆松，是独立战争发起人之一，1920年4月23日当选大国民议会贝亚泽特（后改伊斯坦布尔）议员。此后历任卫生与社会救济部长达十四五年（数任间断），创建卫生研究所与卫生学校（1928），并自1925年起兼任红新月会会长十四年。1938年凯末尔逝世后任内政部长兼共和人民党总书记。1939年1月25日由伊诺努任命为总理，任内主持哈塔伊归并（1939年7月）、颁布《国家保护法》（1940）应对二战物资压力，力求维持中立。终身未婚，逝世前一年将全部家产捐予达鲁萨法卡学会与红新月会。1942年7月8日凌晨在伊斯坦布尔佩拉宫酒店工作途中因心脏病突发逝世，葬于安卡拉杰贝吉公墓。"
 TUR_riza_nur_desc:0 "里扎·努尔（1879年8月30日—1942年9月8日）生于锡诺普，土耳其外科医生、政治家、作家。1901年毕业于军医学校，任格利哈奈军医院外科医生，1907年回校任教。曾任末届奥斯曼议会议员，是反统一进步委员会的“自由协商党”创建人之一。独立战争期间历任国民教育部长、三度出任卫生与社会救济部长、外交部长，并作为1921年莫斯科条约的土方签约代表之一。在1922—1923年洛桑会议上任伊诺努的副代表，主管少数民族议题分会，坚持反对承认库尔德人、波斯尼亚人、切尔克斯人为洛桑条约意义上的少数民族，并在本都希腊人、亚美尼亚人议题上态度强硬，与希腊代表韦尼泽洛斯多次激烈交锋。共和国成立后逐渐边缘化，1926年伊兹密尔刺杀凯末尔案爆发后出走海外，先后侨居巴黎、亚历山大里亚，主编《突厥学评论》，撰文严厉批评凯末尔及其酗酒传闻，与凯末尔政权关系彻底破裂。凯末尔逝世后回国，1942年创办泛突厥主义刊物《天山》。代表作十四卷本《土耳其史》（1924—1926），身后出版的自传因猛烈抨击凯末尔与革命而长期遭禁。1942年9月8日在伊斯坦布尔逝世。"
 TUR_sabiha_gokcen_desc:0 "萨比哈·戈克恩（1913年3月22日—2001年3月22日）生于布尔萨，世界首位女性战斗机飞行员。她幼年父母双亡，1925年凯末尔访问布尔萨时收她为养女，是其多名养子女之一。1934年姓氏法颁布，获赐姓“戈克恩”（意为“属于天空”），当时她尚未涉足航空。1935年入凯末尔创办的土耳其鸟飞行学校，初学跳伞滑翔，后转习驾驶，赴苏联克里米亚受训。1936年入埃斯基谢希尔军事航空学校，1937年完成战斗机与轰炸机训练，23岁取得世界首位女性战斗机飞行员资格，并参与镇压德尔西姆起义的军事行动，获土耳其航空协会首枚荣誉勋章。1938年她驾机独飞巡访雅典、索非亚、贝尔格莱德等巴尔干诸国都城，获南斯拉夫“白鹰”勋章；同年起任土耳其鸟飞行学校总教官至1954年，培养四名女飞行员。1940年结婚，1943年丧夫，1964年正式退出飞行，一生飞行约八千小时，参与三十二次军事行动，1996年获选为美国空军“二十位最伟大飞行员”海报中唯一女性。2004年一篇关于其亚美尼亚血统的报道引发争议，撰文记者后遇刺身亡，二者关联存疑。2001年她在以她命名的伊斯坦布尔国际机场开航两个月后，于88岁生日当天因心脏衰竭逝世。"
 TUR_sadik_altincan_desc:0 "穆罕默德·萨德克·阿尔丁坎（1898年—1963年2月16日）生于伊斯坦布尔，是一名土耳其海军上将，亦活跃于多党制转型时期。他经历一战，后在土耳其海军长期服役，1950年6月接替穆罕默德·阿里·乌尔根出任土耳其海军司令，任职至1957年，是该司令部第二任司令。退役后涉足政界，当选大国民议会议员（其党籍各方记载不一）。马尔马拉海亚瑟岛（今“自由与民主岛”）上设有以他命名的图书馆。1963年2月16日逝世。"
 TUR_said_i_nursi_desc:0 "赛义德·努尔西（原名赛义德·奥库尔，1877年—1960年3月23日）生于比特利斯省努尔斯村，库尔德裔伊斯兰学者，土耳其现代最具影响力的宗教思想运动“光明派”（努尔运动）创始人，因学识渊博获尊号“贝迪乌扎曼”（意为“时代奇才”）。出身贫寒农家，自幼天资过人，十四岁即修完传统经学院课程，后兼修数理化等现代科学，主张宗教学校应教授现代科学、世俗学校应教授宗教学。一战期间组织志愿军在凡城一带抵抗俄军与亚美尼亚武装，负伤被俘，囚于俄国科斯特罗马两年，十月革命后越狱辗转柏林返回伊斯坦布尔。战后曾公开驳斥英方胁迫颁布的反民族运动教令。1922年应邀赴安卡拉，因其设想的伊斯兰共和国理念与凯末尔的世俗化路线相左，未久留即返回凡城，退出政治。1925年谢赫赛义德起义中，他拒绝起义领袖的合作请求，主张穆斯林不应自相残杀，但仍遭当局怀疑流放，辗转伊斯帕尔塔、巴尔拉等地，在巴尔拉软禁期间写成《光明书》三分之二篇幅，该书阐释古兰经义理逾六千页，被信徒秘密手抄流传。此后屡遭审判与监禁，1949年获释后政治环境趋缓，1950年代公开支持民主党。其思想后衍生出居伦运动等多个分支。1960年3月23日在乌尔法逝世。"
 TUR_said_nursi_desc:0 "赛义德·努尔西（原名赛义德·奥库尔，1877年—1960年3月23日）生于比特利斯省努尔斯村，库尔德裔伊斯兰学者，土耳其现代最具影响力的宗教思想运动“光明派”（努尔运动）创始人，因学识渊博获尊号“贝迪乌扎曼”（意为“时代奇才”）。出身贫寒农家，自幼天资过人，十四岁即修完传统经学院课程，后兼修数理化等现代科学，主张宗教学校应教授现代科学、世俗学校应教授宗教学。一战期间组织志愿军在凡城一带抵抗俄军与亚美尼亚武装，负伤被俘，囚于俄国科斯特罗马两年，十月革命后越狱辗转柏林返回伊斯坦布尔。战后曾公开驳斥英方胁迫颁布的反民族运动教令。1922年应邀赴安卡拉，因其设想的伊斯兰共和国理念与凯末尔的世俗化路线相左，未久留即返回凡城，退出政治。1925年谢赫赛义德起义中，他拒绝起义领袖的合作请求，主张穆斯林不应自相残杀，但仍遭当局怀疑流放，辗转伊斯帕尔塔、巴尔拉等地，在巴尔拉软禁期间写成《光明书》三分之二篇幅，该书阐释古兰经义理逾六千页，被信徒秘密手抄流传。此后屡遭审判与监禁，1949年获释后政治环境趋缓，1950年代公开支持民主党。其思想后衍生出居伦运动等多个分支。1960年3月23日在乌尔法逝世。"
 TUR_salih_omurtak_desc:0 "穆罕默德·萨利赫·奥穆尔塔克（1889年—1954年6月23日）生于萨洛尼卡（今希腊塞萨洛尼基），是土耳其第四任总参谋长。1907年自奥斯曼军事学院毕业任少尉，1910年总参谋学院结业后任参谋军官，在奥斯曼军队多个司令部任职。1920年1月22日抵达安卡拉，加入民族运动，在独立战争期间及战后指挥过多支部队，其中包括第六十一师。1926年晋少将，1930年晋中将，1940年起以上将军衔任第一集团军司令。1946年8月1日，在卡齐姆·奥尔巴伊辞职后，他出任总参谋长，任职至1949年6月8日，此后任最高军事咨询委员会委员，直至1950年7月6日退役。1954年6月23日在安卡拉逝世，遗体后迁葬于土耳其国家公墓。"
 TUR_sefik_husnu_desc:0 "谢菲克·许斯努·德伊梅尔（约1887年—1959年4月8日）出生于萨洛尼卡，1910年自军医学校毕业，医学中尉军衔，精通德语、法语。1912年在伊斯坦布尔参与创立民族主义组织“土耳其炉”，后转向社会主义，1919年9月创立“土耳其工人农民社会党”，该党最初支持凯末尔运动。1920年9月该党代表出席在巴库召开的土耳其共产党第一次代表大会，土共由此成立，许斯努后成为该党第三任总书记，是土耳其共产主义运动史上影响最深远的人物之一。1923年4月他提出当时土耳其存在凯末尔主义、保皇反动、社会主义三种政治倾向，主张凯末尔政府与社会主义者“携手合作”对抗反动势力，奠定土共此后长期奉行的与凯末尔政权阶级合作路线。1933年德国国会纵火案后，他在德国一度被捕审讯，并与共产国际渊源遭到调查；其后流亡莫斯科两年，返回土耳其前向当局承诺不再从事非法政治活动，但始终未放弃共产主义信念。返国后恢复行医执照，二战期间一度被征召任军医，旋因政治原因被解除军职。土耳其共产党自1925年遭取缔后长期转入地下，许斯努在党内核心地位持续至晚年。1959年4月8日在马尼萨逝世。"
 TUR_sevket_sureyya_aydemir_desc:0 "谢夫凯特·叙雷亚·艾德迈尔（1897年—1976年3月25日）生于埃迪尔内，土耳其作家、经济学家、历史学家，左翼凯末尔主义思想刊物《卡德罗》的创始人与核心理论家之一。父亲为园丁，母亲教其识字。十一岁加入统一进步委员会，巴尔干战争中失去母亲与一兄长。一战中志愿从军，在高加索战线负伤。1919—1920年在阿塞拜疆任教师，后转赴巴统接触土耳其共产党，赴莫斯科东方劳动者共产主义大学攻读经济学，加入苏联共产党与土耳其共产党，代表土共出席巴库东方民族代表大会。回国后为《光明》杂志撰稿，该刊1925年被取缔，他因文中观点被安卡拉独立法庭判处十年监禁，服刑约一年半后获释。此后转任安卡拉商业中学校长（1928—1937）等公职。1932—1934年与韦达特·内迪姆·托尔等人创办《卡德罗》杂志，提出融合马克思主义与凯末尔主义的国家主义发展理论，代表作《革命与卡德罗》（1932）。晚年著有自传《寻水的人》（1959），三卷本凯末尔传记《独人》（1963—1965）、伊诺努传记《第二人》、恩维尔帕夏传记等。1976年3月25日在安卡拉逝世。"
 TUR_sukru_okan_desc:0 "穆罕默德·许克吕·奥坎（1880年—1957年），土耳其海军将领、政治人物，生于黑海沿岸的蒂雷博卢。奥坎毕业于奥斯曼海军学校，早年长期服役于海军，曾任鱼雷艇、巡洋舰及潜艇相关职务，并赴欧洲学习潜艇技术。共和国建立后，他参与土耳其海军的重建，曾任潜艇部队指挥官、战斗舰队代理司令和舰队司令，后晋至少将、中将。1945年退役后，他以共和人民党成员身份进入土耳其大国民议会，任第七、八届科贾埃利议员。1957年在伊斯坦布尔逝世。"
 TUR_sukru_saracoglu_desc:0 "许克吕·萨拉吉奥卢（全名穆罕默德·许克吕·萨拉吉奥卢，1887年6月17日—1953年12月27日）生于厄德米什，土耳其第五任总理（1942—1946）。1909年毕业于行政学校，后赴日内瓦攻读政治经济学。希腊占领厄德米什后，他参加民族军在库萨达瑟、艾登一带抵抗，战后任厄德米什市长，1923年当选大国民议会艾登议员。历任国民教育部长（1924—1925）、希土人口交换委员会主席、财政部长（1927—1930）、司法部长（1933—1938）、外交部长（1938—1942）。任外交部长期间，他与英法签订互助条约（1939），促成哈塔伊归并土耳其，并于1941年与德国签订《土德友好条约》。1942年7月萨伊达姆病逝后接任总理，推行二战时期“财产税”与农产品税以应对经济困局，并通过土地改革法；对外维持中立，直至1945年2月对轴心国宣战。1946年大选后辞职，转任大国民议会议长（1948—1950），1950年竞选失利后退出政坛。曾长期兼任足球俱乐部费内巴切主席（1934—1950），该队主场以其名命名。1953年12月27日在伊斯坦布尔逝世，葬于津吉尔利库尤公墓。"
 TUR_wilhelm_ritter_von_thoma_desc:0 "威廉·约瑟夫·里特尔·冯·托马（1891年—1948年）生于巴伐利亚达豪，是德国国防军装甲兵上将。“里特尔”是他因一战中作战英勇获巴伐利亚军事马克斯·约瑟夫勋章而获授的骑士头衔。1912年入巴伐利亚陆军，一战中转战西线、东线及塞尔维亚战场，多次负伤。战后留任国防军，钻研摩托化与装甲战术。西班牙内战期间，他任秃鹰军团地面装甲分队指挥官，支援佛朗哥军队。二战中，他先后参加波兰、法国和东线作战，后赴北非任非洲装甲集团军副司令。1942年阿拉曼战役中被英军俘虏，战后获释，1948年逝世。"
 TUR_zeki_dogan_desc:0 "梅赫梅特·泽基·多安（1895年—1961年3月17日）生于伊斯坦布尔，是土耳其军人，土耳其空军首任司令。1913年入军校，一战爆发后于1914年以骑兵少尉投身军旅，在多支骑兵部队任排长；1918年9月在西奈战线第四集团军麾下被英军俘虏，押于埃及战俘营，1919年获释返回伊斯坦布尔。1919年他赴安纳托利亚加入民族军、投身独立战争，大攻势期间率第十四骑兵团成为最早进入伊兹密尔的土军指挥官之一（并在伊兹密尔降下希腊国旗）。1924年转入航空兵，受飞行训练，历任空军营、团、旅指挥官及国防部空军次长等职。1940年晋准将，1942年晋少将，1944年1月27日被任命为新组建的独立军种——土耳其空军的首任司令；任内于1945年晋中将、1948年晋上将。1950年6月卸任，转任最高军事委员会委员，1951年10月退役。他通晓英语，获颁包括独立勋章在内的多枚勋章，被视为土耳其民族英雄。1961年3月17日在安卡拉逝世。"
 TUR_zeki_velidi_togan_desc:0 "艾哈迈德·泽基·瓦利迪·托甘（1890年12月10日—1970年7月26日）生于乌法省（今俄罗斯巴什科尔托斯坦）的一个村庄，是巴什基尔裔历史学家、突厥学家，巴什基尔民族解放运动的领袖。早年在喀山求学、任教。1917年俄国革命后，他投身巴什基尔自治运动，当选巴什基尔代表；1918—1919年其武装先后追随杜托夫、高尔察克对抗布尔什维克，后因苏俄许诺巴什基尔自治而转投布尔什维克，1919年2月至1920年6月任巴什基尔革命委员会主席。因感到布尔什维克违背承诺，他转赴中亚，成为突厥斯坦“巴斯马奇”反苏运动的领袖（曾与恩维尔帕夏并肩），并任“突厥斯坦民族联盟”主席（1920—1923）。1923年他流亡国外，后定居土耳其，任伊斯坦布尔大学突厥史教授；其间赴维也纳取得博士学位，又在波恩、哥廷根任教，1939年返伊斯坦布尔大学执教至终。他著述逾四百种，是突厥古代史研究的奠基者之一。1944年他与尼哈尔·阿特瑟兹（名单 37）等人同列“种族主义-图兰主义审判”被告。苏联将“瓦利多夫主义”斥为反动的巴什基尔民族主义，曾牵连大批穆斯林知识分子。1970年7月26日在伊斯坦布尔逝世。"
 BRA_nero_fiuza_de_castro_desc:0 "阿尔瓦罗·菲乌萨·德·卡斯特罗，1889年10月19日生于里约热内卢，巴西陆军军官。1930年代起在陆军教育和后勤体系中任职，曾任里约热内卢兵工厂指挥官、战争部办公厅主任和雷亚伦戈军事学校校长。第二次世界大战期间，他先后任第七军区代理司令、军事补给主任，并参与巴西与美国联合防务委员会相关工作，长期关注陆军技术、装备和生产事务。战后，他任陆军技术与生产局负责人，1948年至1955年任陆军总参谋长，是战后巴西军队高层中的重要保守派将领之一。1954年瓦加斯危机和1955年洛特运动前后，他在军方政治斗争中立场鲜明，退役后仍具影响。1971年10月12日去世。"
 CBIO_BRA_nero_fiuza_de_castro_desc:0 "阿尔瓦罗·菲乌萨·德·卡斯特罗，1889年10月19日生于里约热内卢，巴西陆军军官。1930年代起在陆军教育和后勤体系中任职，曾任里约热内卢兵工厂指挥官、战争部办公厅主任和雷亚伦戈军事学校校长。第二次世界大战期间，他先后任第七军区代理司令、军事补给主任，并参与巴西与美国联合防务委员会相关工作，长期关注陆军技术、装备和生产事务。战后，他任陆军技术与生产局负责人，1948年至1955年任陆军总参谋长，是战后巴西军队高层中的重要保守派将领之一。1954年瓦加斯危机和1955年洛特运动前后，他在军方政治斗争中立场鲜明，退役后仍具影响。1971年10月12日去世。"
