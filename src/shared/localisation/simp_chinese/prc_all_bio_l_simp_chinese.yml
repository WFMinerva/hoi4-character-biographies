l_simp_chinese:
 PRC_mao_zedong_desc:0 "毛泽东，1893年生，湖南湘潭人，字润之。青年时期在湖南第一师范求学，曾任北京大学图书馆助理员，接触新文化运动和马克思主义思潮。1921年参与中国共产党创建，随后长期在湖南组织工人和农民运动。大革命失败后，他领导秋收起义，将部队带上井冈山，逐步形成以农村根据地、武装斗争和土地革命为中心的革命道路。中央苏区时期，他曾参与红军和苏维埃政权建设，陷入激烈的党内路线斗争。第五次反“围剿”失败后，中央红军被迫长征；遵义会议后，毛泽东重新进入军事指挥核心。到陕北后，他在瓦窑堡会议、西安事变和抗日民族统一战线形成过程中，逐渐成为中共中央实际上的核心人物。"
 PRC_zhang_guotao_desc:0 "张国焘，1897年生，江西萍乡人，中共一大代表之一。早年参加北京学生运动和中共创建活动，曾在党内担任重要领导职务。土地革命战争时期，他进入鄂豫皖根据地，依托红四方面军形成一套相对独立的党政军系统。红四方面军一度兵力强盛，在川陕根据地形成较大影响。长征途中，张国焘与中央红军会合后，在红军行动方向、中央组织权威和战略部署上与中共中央发生尖锐分歧。"
 PRC_guotao_and_mao_desc:0 "在这条替代历史路线中，张国焘与毛泽东没有彻底分裂，而是在共同的党政架构下维持了一种脆弱合作。两人分别代表党内不同的组织基础、军事力量和革命路线：毛泽东依靠中央领导地位与根据地实践掌握主导权，张国焘则凭借其早期党内资历和红四方面军系统保有影响。这个联合领导并不意味着双方消除了分歧，而是把路线斗争暂时压在权力妥协之下；一旦战争、军队整编或党内人事平衡发生变化，这种“勉强合作的两架马车”便可能重新走向公开冲突。"
 PRC_wang_ming_desc:0 "王明，1904年生，安徽金寨人，原名陈绍禹。早年赴苏联莫斯科中山大学学习，接受共产国际体系下的政治训练，是中共留苏干部中的代表人物。20世纪30年代初，他以共产国际路线的主要传达者身份在党内迅速上升，其政治影响与“左”倾路线密切相关。中央苏区时期，王明长期在苏联和共产国际机关活动，并未直接指挥苏区战争，但他所代表的苏联路线对中共中央决策产生过重要影响。抗日战争全面爆发前后，王明回到中国，主张更强调统一战线和与国民党合作。他在党内既有国际背景和理论权威，也与延安形成中的实际领导核心存在路线差异。"
 PRC_bo_gu_desc:0 "博古，原名秦邦宪，1907年生，江苏无锡人。早年参加学生运动，后赴苏联莫斯科中山大学学习。回国后，他进入中共中央领导机关，成为留苏干部在党内的重要代表。中央苏区后期，博古在中共中央负有重要领导责任，并与李德等人参与第五次反围剿的战略指挥。由于军事决策失误，造成反围剿失败，中央苏区被迫进行长征。遵义会议后，博古的领导地位下降，但仍留在中央机关工作。到陕北后，他主要转入宣传、报刊和党务工作。"
 PRC_zhang_wentian_desc:0 "张闻天，1900年生，江苏南汇人，又名洛甫。早年在南京、上海等地求学，后赴苏联学习和工作，熟悉马克思主义理论和党内宣传工作。回国后，他进入中共中央机关，曾参与中央文件起草和理论宣传。长征途中，张闻天参加遵义会议，并在会议后接替博古负中央总的责任，成为中共中央领导层的重要人物。与一线军事将领不同，张闻天更多承担中央政治决策、理论阐释和组织协调工作。到陕北后，他参与瓦窑堡会议等重大决策，在抗日民族统一战线形成和延安时期党内政策调整中具有重要地位。"
 PRC_kwong_hu_desc:0 "该角色在 PRC 文件中作为自由主义路线的替代领袖出现，未见与中共1930至1940年代核心人物的稳定对应。其功能属于非史实政治路线的领导人占位，用于承接游戏中的意识形态分支。"
 PRC_luo_zhao_desc:0 "该角色在 PRC 文件中作为法西斯意识形态路线的替代领袖出现，未见与中共1930至1940年代真实人物的稳定对应。其功能属于替代路线下的机制角色，而非史实中共干部。"
 PRC_liang_ma_desc:0 "该角色在 PRC 文件中作为寡头政治路线的替代领袖出现，未见与中共历史人物的稳定对应。其功能属于非常规政治路线占位，不扩展真实履历。"
 PRC_zhou_enlai_desc:0 "周恩来，1898年生，江苏淮安人，字翔宇。早年就读南开，后赴日本、法国等地求学，在旅欧期间参加共产主义小组活动。第一次国共合作时期，他曾任黄埔军校政治部主任，参与军校政治工作和革命军建设。大革命失败后，周恩来参与领导南昌起义，随后在中共中央和红军系统中长期负责军事、组织、情报和统战工作。中央苏区时期，他担任中央革命军事委员会副主席等职；长征初期曾与博古、李德共同承担军事领导责任，遵义会议后支持调整军事指挥。到1936年前后，周恩来成为中共处理国共关系、军事联络和统一战线事务的关键人物。西安事变中，他作为中共代表赴西安谈判，为停止内战、共同抗日起到重要作用。"
 PRC_xie_juezai_desc:0 "谢觉哉，1884年生，湖南宁乡人。早年从事教育和地方社会活动，参加过同盟会，后加入中国共产党。与许多年轻红军干部不同，谢觉哉进入革命队伍时年纪较长，文化和政务经验较深。中央苏区和长征时期，他主要承担文书、司法、内务和政权建设方面的工作。到陕北后，陕甘宁边区需要建立较稳定的行政、司法、财政和民政制度，谢觉哉在边区政府机关中发挥重要作用。"
 PRC_lin_boqu_desc:0 "林伯渠，1886年生，湖南临澧人。早年参加同盟会和辛亥革命，曾长期在国民党系统内活动，后加入中国共产党。大革命失败后，他转入中共革命队伍，在苏区和长征过程中从事财政、总供给、行政和统一战线工作。林伯渠资历深、阅历广，熟悉旧式政治、财政运作和地方行政。到陕北后，他参与陕甘宁边区政府建设，负责根据地财政、民政和政权事务。对于一个资源贫瘠、长期被封锁的边区来说，如何筹粮、征税、安置难民、维持机关运转，正是林伯渠这类老成政务干部的用武之地。"
 PRC_liu_shaoqi_desc:0 "刘少奇，1898年生，湖南宁乡人。早年赴苏俄东方劳动者共产主义大学学习，回国后长期从事工人运动和党的组织工作。大革命时期，他在安源、上海、武汉等地参与工会运动和工人组织建设；白色恐怖时期，又多次在国民党统治区从事地下工作。土地革命战争时期，刘少奇主要活动于白区和华北，熟悉秘密交通、组织恢复、群众动员和干部纪律建设。与长期在红军中作战的军事干部不同，他更擅长党务、工运和组织整顿。到抗战前夕，中共需要在敌后和国统区重建组织网络，刘少奇的地下工作经验使他成为党内处理白区工作、群众工作和组织路线的重要人物。"
 PRC_dong_biwu_desc:0 "董必武，1886年生，湖北黄安人。早年参加同盟会和辛亥革命，曾从事教育和法律工作。1921年，他作为武汉共产主义小组代表出席中共一大，是中国共产党创建时期的重要人物。大革命时期，董必武在国共合作和地方党务工作中活动，后进入苏区和中共中央系统。中央苏区时期，他参与政权、财政和司法工作，长征后随中央到达陕北。"
 PRC_deng_zihiu_desc:0 "邓子恢，1896年生，福建龙岩人，名绍箕，字子恢。早年在福建从事教育、青年运动和农民运动，后加入中国共产党。土地革命兴起后，他长期活动于闽西地区，参与组织农民协会、地方武装和苏维埃政权。闽西土地革命中，邓子恢重视调查农村实际情况，推动分田、筹粮、财政和基层政权建设，使闽西成为中央苏区的重要组成部分。与一线野战将领不同，邓子恢更擅长处理农民、土地、财政和根据地治理问题。中央红军主力长征后，南方苏区环境急剧恶化，地方政权和群众组织遭到破坏，邓子恢仍在闽西、赣南等地坚持工作。"
 PRC_li_zhen_desc:0 "李贞，1908年生，湖南浏阳人。早年出身贫苦农家，曾有童养媳经历。大革命时期，她开始参加妇女运动和地方革命活动，1927年加入中国共产党，并在秋收起义前后投入武装斗争。土地革命战争时期，李贞长期在湘赣、湘鄂川黔等根据地从事妇女工作、组织工作和红军政治工作。红六军团西征和红二、红六军团会合后，她在部队政治机关任职，负责组织、干部和妇女动员。长征途中，李贞随红二方面军转战西南。"
 PRC_li_lisan_desc:0 "李立三，1899年生，湖南醴陵人。早年赴法国勤工俭学，回国后投身工人运动。曾任上海总工会委员长，在安源路矿工人大罢工、五卅运动等工运中发挥重要作用。大革命时期，他是中共早期工人运动的重要领导人之一。1930年前后，李立三在中共中央领导层中提出以城市暴动推动革命高潮的路线，后来因形势判断失误受到批评并离开国内。在苏联期间，他与共产国际和中共驻外系统继续保持联系。"
 PRC_wang_shiwei_desc:0 "王实味，1906年生，河南潢川人。早年进入北京大学学习，后参加革命文化活动，曾从事翻译、编辑和文学工作。到延安后，他进入中央研究院等机构工作，参与文化和理论方面的活动。王实味熟悉外国文学和思想理论，文字锋利，在延安知识分子群体中具有一定影响。1942年前后，他因撰写文章批评延安机关生活和等级现象而引发巨大风波，被卷入整风运动和审干运动。"
 PRC_ren_bishi_desc:0 "任弼时，1904年生，湖南汨罗人。早年赴苏联学习，回国后长期负责青年团、组织和红军政治工作。土地革命战争时期，他曾在中央苏区和湘鄂川黔根据地活动，并与贺龙、关向应等人共同领导红二方面军系统。长征期间，任弼时随红二、红六军团转战湘西、贵州、云南、甘孜等地，经历与红四方面军会合以及三大主力会师。到陕北后，他进入中共中央核心领导层，承担组织、干部和军队政治工作。"
 PRC_wang_jiaxiang_desc:0 "王稼祥，1906年生，安徽泾县人。早年赴苏联学习，回国后进入中央苏区工作，曾任红军总政治部主任等职。中央苏区后期，他参与红军政治工作和中央领导层事务。长征途中，王稼祥在遵义会议前后支持改变原有军事领导方式，对毛泽东重新进入军事指挥核心起到重要作用。由于负伤和长期转战，他的身体状况受到很大影响，但仍在中央机关中承担政治、宣传和对外联络工作。到陕北后，王稼祥成为连接中共中央与共产国际关系的重要人物之一。"
 PRC_mao_zemin_desc:0 "毛泽民，1896年生，湖南湘潭人，毛泽东之弟。早年在长沙、安源等地参加工人运动和革命活动，后进入中共财政经济系统。中央苏区时期，他长期负责金融、贸易和财政工作，曾参与中华苏维埃共和国国家银行建设，在极端困难条件下维持苏区经济运转。红军长征后，毛泽民继续承担财政经济和后方事务。1930年代后期，他赴新疆工作，参与当地财政和统战事务。"
 PRC_wu_han_desc:0 "吴晗，1909年生，浙江义乌人，原名吴春晗，字辰伯。早年就读于杭州之江大学，后转入上海中国公学，师从胡适。1931年考入清华大学历史系，1934年毕业后留校任教，长期专攻明史，是民国时期成长起来的青年历史学者。20世纪30年代，吴晗主要活动于学术界和教育界。抗战爆发后，他辗转昆明，先后任云南大学、西南联合大学教授，在大后方知识分子救亡和民主运动中逐渐活跃，加入中国民主同盟，并与中共统战工作建立密切联系。"
 PRC_xu_teli_desc:0 "徐特立，1877年生，湖南长沙人。早年长期从事教育工作，是毛泽东、田汉等人的老师。辛亥革命后，他继续投身教育和社会活动，年近五十时加入中国共产党。大革命失败后，徐特立没有退出革命，而是参加南昌起义，后进入苏区和红军系统。长征途中，他随中央红军转战，成为红军队伍中极具象征意义的老教育家。到达陕北后，长期参与教育工作。"
 PRC_kang_sheng_desc:0 "康生，1898年生，山东诸城人，原名张宗可。早年参加学生运动和工人运动，后加入中国共产党。大革命失败后，他长期在上海等地从事地下工作，熟悉秘密组织、情报联络和干部安全。1930年代，康生赴苏联，在共产国际和中共驻共产国际代表团系统中活动，接触苏联党内斗争和安全机关工作方式。抗战前后回到延安后，负责社会部、情报、保卫和干部审查等工作。"
 PRC_lin_bojiu_desc:0 "该角色在文件中被标注为非真实人物，使用通用政治顾问头像。其功能是为 PRC 提供顾问槽位和工业组织相关特质，不对应可确认的历史干部。"
 PRC_he_yuandang_desc:0 "该角色在文件中被标注为非真实人物，使用通用政治顾问头像。其功能是为 PRC 提供战时工业类顾问，不对应可确认的历史干部。"
 PRC_cai_chang_desc:0 "蔡畅，1900年生，湖南湘乡人。早年赴法国勤工俭学，在旅欧期间参加革命活动，后加入中国共产党。回国后，她长期从事妇女运动、组织工作和群众工作。土地革命战争时期，蔡畅进入中央苏区，参与妇女干部培养、群众组织和根据地社会动员。长征后到达陕北，她继续在妇女工作和统一战线中任职。"
 PRC_wu_yuzhang_desc:0 "吴玉章，1878年生，四川荣县人。早年参加同盟会和辛亥革命，曾长期从事教育、报刊和社会活动。后来他加入中国共产党，成为党内资历极深的老革命。大革命失败后，吴玉章继续参加革命工作，并长期在教育、宣传和统战领域活动。到延安后，他参与干部教育和文化建设，负责学校、教材、文字改革等工作。"
 PRC_bo_yibo_desc:0 "1908年2月12日生于山西定襄，2007年1月15日卒于北京。中共早期在华北最重要的地下干部之一，1925年入党，长期以秘密党员身份在阎锡山统治区域活动，以组织严密、善于在白色恐怖下维系党的活动著称。1936年前后推动山西牺牲救国同盟会（牺盟会）成立，为中共渗透晋系军政体系开辟了关键渠道，后发展为新军力量，成为华北抗日根据地的重要组成部分。新中国成立后长期主持财经工作，历任政务院财经委副主任、国家建委主任，是党内务实经济路线的代表性人物。"
 PRC_pavel_mif_desc:0 "帕维尔·米夫，1901年生，苏联共产国际干部苏联共产国际干部，曾任莫斯科中山大学校长。20世纪20年代，大批中国革命青年赴苏联学习，莫斯科中山大学成为中共留苏干部的重要培养场所，王明、博古等人都与这一系统有密切关系。米夫长期参与共产国际对华工作，20世纪30年代，作为共产国际代表来华，直接干预中共党内事务，在1931年六届四中全会上一手扶植王明集团上台，对此后中共的“左”倾教条主义路线产生重大影响。"
 PRC_zhu_de_desc:0 "1886年12月1日生于四川仪陇一个贫苦佃农家庭，1976年7月6日卒于北京。早年以科举路径求学，后辗转入云南陆军讲武堂，1911年辛亥革命中参与昆明起义，在蔡锷麾下崭露头角。此后十年，他历任滇军旅长、团长，官至旅长。1920年，他在上海寻访陈独秀，希望加入中国共产党，竟遭婉拒——陈独秀认为一个有鸦片瘾的旧式军官无法成为革命者。他随即出走欧洲，1922年在柏林经周恩来介绍加入中国共产党，同年入哥廷根大学进修，戒除鸦片，彻底转型。此后赴苏联接受军事训练，归国后参与北伐。1927年8月1日，他以第三军军官教育团团长身份参与南昌起义，此日后被定为中国人民解放军建军节。起义军南下失败后，他率残部辗转转战，1928年4月将约两千人的部队带上井冈山与毛泽东会师，合编为工农红军第四军——毛泽东任党代表、朱德任军长，\"朱毛\"由此并称，成为中国共产主义革命史上最具传奇色彩的军政搭档。在井冈山时期，他与毛泽东共同总结出\"敌进我退、敌驻我扰、敌疲我打、敌退我追\"的游击十六字诀，奠定了红军以弱胜强的战术基础，此后历次\"围剿\"均以此为骨干应对国民党优势兵力。长征期间，他随中央红军出发，后因张国焘分裂事件被迫随红四方面军行动逾一年，始终坚持中央路线，拒绝认同张国焘另立中央的行为。抗日战争期间，他出任国民革命军第八路军（后改称第十八集团军）总指挥，在华北协调三个师的游击与正规作战。1940年主持指挥百团大战，逾百个团同时向日军华北交通线发动大规模攻击，打击铁路、公路和煤矿设施，声势浩大。国共内战中以人民解放军总司令身份统辌全局，与毛泽东共同运筹三大战役（辽沈、淮海、平津），指挥全面战略胜利。1955年被授予中华人民共和国元帅军衔，1959年起任全国人民代表大会常务委员会委员长。"
 PRC_su_yu_desc:0 "粟裕，1907年生，湖南会同人。早年参加叶挺领导的国民革命军第二十四师，后参加南昌起义和湘南起义，并随朱德、陈毅上井冈山。中央苏区时期，粟裕长期在红军基层和中高级指挥岗位上作战，从连排、营团逐步成长为能够独立带兵的将领。中央红军主力长征后，他留在南方，随方志敏率领的红军北上抗日先遣队（红十军团）北上，部队在皖南怀玉山失利后，粟裕率突围余部转战浙南坚持游击战。"
 PRC_otto_braun_desc:0 "奥托·布劳恩，1900年生于德国慕尼黑附近，中文名李德。早年参加德国共产党，后进入苏联伏龙芝军事学院学习，接受苏式正规军事教育。20世纪30年代初，他受共产国际派遣来到中国，以军事顾问身份进入中共中央和中央革命军事委员会系统。中央苏区后期，李德与博古等人参与第五次反“围剿”的军事指挥，主张以阵地战、堡垒对堡垒和正规防御应对国民党军的围攻。随着中央苏区形势恶化，红军被迫长征，李德继续随中央红军行动。遵义会议后，他的军事指挥权被削弱，红军开始改变此前僵硬的作战方式。"
 PRC_ma_jin_desc:0 "该角色在文件备注中被说明为非 DLC 版本中的占位人物，并与真实军事人物没有稳定对应。其功能是填补陆军部长槽位，不作中共历史干部履历扩展。"
 PRC_ziao_jingguang_desc:0 "萧劲光，1903年生，湖南长沙人。早年参加学生运动，后赴苏联学习，接受过较系统的政治和军事训练。大革命时期，他曾在国民革命军和中共军事系统中任职，参与北伐和革命军队建设。土地革命战争时期，萧劲光进入中央苏区，先后从事红军学校、军区和前线部队工作，既接触正规军事教育，也熟悉根据地战争的实际困难。第五次反围剿期间，任闽赣军区司令员，因执行短促突击战术、未能守住黎川，在左倾路线下受到错误处分，平反后继续在红军中任职。抗战后期和新中国成立后，他又被委以创建海军的重任，成为人民海军早期建设的核心人物之一。"
 PRC_gao_qiu_desc:0 "该角色使用通用海军顾问头像，未见与 PRC 史实海军或陆军干部的稳定对应。其功能是为无特定 DLC 情况提供海军部长槽位，不作真实履历扩展。"
 PRC_luo_shunchu_desc:0 "罗舜初，1914年生，福建上杭人。早年参加闽西革命斗争，后进入红军。土地革命战争时期，他在中央苏区和闽西地区长期活动，经历根据地建设、反“围剿”和红军转战。中央红军主力长征后，福建、赣南等地留下的武装被迫转入游击战争。罗舜初在这一时期继续参加地方武装和游击斗争，逐渐成长为能够独立指挥作战的年轻干部。"
 PRC_fang_zeyi_desc:0 "1912年生于安徽无为。早年参加革命队伍，后进入军事航空领域接受训练，是国民政府空军中较年轻一代技术型军官的代表。"
 PRC_chang_qiankun_desc:0 "常乾坤，1904年生，山西垣曲人。早年赴苏联学习，进入航空学校接受飞行和航空技术训练，是中共早期少数受过系统航空教育的人物之一。回国前后，他长期与中共军事和航空工作保持联系。早期红军作战主要依靠步兵、缴获武器和简陋通信，航空人才极其稀缺。抗战胜利后，常乾坤成为人民空军建设的关键人物。"
 PRC_liu_yalou_desc:0 "刘亚楼，1910年生，福建武平人。早年参加闽西革命斗争，进入红军后在中央苏区部队中任职。土地革命战争时期，他从基层干部逐步成长，参加中央苏区反“围剿”和长征。红军到达陕北后，刘亚楼继续在红一方面军系统中担任指挥和参谋工作。与一些资历更老的军团级将领相比，刘亚楼在1936年前后仍属中青年干部，但已经经历过苏区战争、长征和陕北整编。后来他赴苏联学习军事，并在东北和空军建设中承担重要任务。"
 PRC_liu_yuti_desc:0 "刘玉堤，1923年生，河北沧县人。抗日战争爆发后，他参加革命，后来进入航空系统，在人民空军中成长为著名飞行员。抗美援朝时期，刘玉堤以空战战绩闻名，是人民空军早期喷气式战斗机飞行员中的代表人物。"
 PRC_xu_xiangqian_desc:0 "徐向前，1901年生，山西五台人。早年考入黄埔军校一期，参加国民革命军和北伐战争。大革命失败后，他进入中共领导的武装斗争，后来到鄂豫皖根据地任职。土地革命战争时期，徐向前长期指挥红四方面军作战，在鄂豫皖和川陕根据地多次与国民党军周旋，逐渐成为红四方面军最重要的军事指挥员之一。红四方面军兵力强盛、作战经验丰富，徐向前在其中承担前线统兵和战役指挥。长征途中，他经历红一、红四方面军会合后的北上南下分歧，以及后来的西路军失败，是红军中少数拥有大兵团指挥经验的高级将领。"
 PRC_nie_rongzhen_desc:0 "聂荣臻，1899年生，四川江津人。早年赴法国勤工俭学，后入苏联学习军事，回国后参加黄埔军校政治工作和北伐战争。南昌起义后，他进入红军系统，长期负责政治工作和军事指挥。中央苏区时期，聂荣臻在红一军团任政治委员，与林彪搭档多年，参与历次反“围剿”和长征。长征途中，他既要维持部队政治纪律，又要配合前线作战和艰难行军。到陕北后，聂荣臻已是红一方面军系统中经验丰富的军政干部。"
 PRC_chen_geng_desc:0 "陈赓，1903年生，湖南湘乡人。早年入黄埔军校第一期学习，是黄埔早期学生中的重要人物。大革命时期，他曾参加东征、北伐和中共地下军事工作。南昌起义后，陈赓进入红军系统，长期从事情报、特科、军事指挥和干部训练。中央苏区时期，他曾在红军学校和一线部队任职，既懂秘密工作，也能带兵作战。长征途中，陈赓率部参加多次突围和阻击，作战机动灵活，善于在复杂局势中保存力量。到陕北后，他已经是红军中少数兼具黄埔背景、情报经验和野战指挥能力的将领。"
 PRC_zuo_quan_desc:0 "左权，1905年生，湖南醴陵人。早年考入黄埔军校，后赴苏联学习军事，曾在伏龙芝军事学院深造。回国后，他进入中央苏区红军系统，长期从事军事参谋和前线指挥工作。左权受过较系统的军事教育，熟悉战役组织、参谋作业和部队训练，在红军高级干部中属于理论素养较强的一类。长征期间，参与指挥强渡大渡河、攻打腊子口等战斗。到达陕北后，率部参加了直罗镇战役和红军东征。1936年，他担任红一军团代理军团长，率部西征并参与指挥山城堡战役。"
 PRC_ye_jianying_desc:0 "叶剑英，1897年生，广东梅县人。早年入云南讲武堂学习，曾在粤军中任职，参加过护法运动和北伐战争。第一次国共合作时期，他在黄埔军校和国民革命军中从事军事工作。1927年后，叶剑英逐渐转向中共革命阵营，参加广州起义，后来进入中央苏区和红军系统。长征途中，他长期在红军总部和参谋机关工作，熟悉各方面军之间的军事联络与指挥协调。红一、红四方面军会合后，围绕北上、南下发生重大分歧，叶剑英在关键时刻向中央报告情况，使中央红军避免陷入更危险的局面。到陕北后，他成为中共中央和红军总部中重要的参谋型将领。"
 PRC_liang_shen_desc:0 "该角色在文件中被标注为无法确认人物，使用通用空军相关头像。其功能是为高层军事顾问槽位提供航空训练特质，不对应已确认的 PRC 历史干部。"
 PRC_deng_ye_peng_desc:0 "该角色在文件中被标注为无法确认人物，使用通用海军相关头像。其功能是为高层军事顾问槽位提供两栖作战特质，不对应已确认的 PRC 历史干部。"
 PRC_yang_zhicheng_desc:0 "杨至成，1903年生，侗族，贵州三穗人。早年入黔军，后参加国民革命军。1927年，加入中共领导的武装斗争，参加湘南起义并随朱德、陈毅部上井冈山。红军早期长期处于缺粮、缺弹、缺医药的环境中，杨至成逐渐承担供给、后勤和军需工作。中央苏区时期，他参与红军总供给部和军需系统建设，为部队筹措粮食、被服、弹药和运输。"
 PRC_li_xiannian_desc:0 "李先念，1909年生，湖北黄安人。早年参加黄麻起义，随后进入鄂豫皖根据地和红四方面军。土地革命战争时期，他长期在红军中任职，经历鄂豫皖反围剿、川陕根据地建设和长征。红四方面军时期，李先念从基层干部逐步成长为能够独立带兵的年轻指挥员。长征后期和西路军行动中，他经历了极其艰难的失败和突围。1936年前后，李先念仍属于红四方面军系统中的年轻骨干。"
 PRC_chu_qing_desc:0 "楚青，1923年生，江苏扬州人。原名詹永珠，参加革命后改名为楚青。于1938年在皖南参加新四军，进入新四军教导总队第八队、新四军军部速记训练班学习，1939年3月加入了中国共产党。1941年与一师师长粟裕在新四军司令部结为终身伴侣。抗日战争爆发后，楚青在军队机关、文书、宣传和资料工作中逐步成长，长期承担机要、记录和机关事务等工作。"
 PRC_yang_shangkun_desc:0 "杨尚昆，1907年生，四川潼南人。早年赴苏联莫斯科中山大学学习，回国后进入中共中央机关和红军政治系统。中央苏区时期，他长期在中共中央和军队政治机关工作，参与文件、组织、宣传和政治动员。长征途中，杨尚昆随中央红军转战，担任政治机关职务，经历了红军领导层调整和到达陕北后的整编。"
 PRC_liu_bocheng_desc:0 "刘伯承，1892年生，四川开县人。早年投身川军，参加护国、护法等战争，作战中负伤失去右眼，因此有“独目将军”之称。后来他赴苏联学习军事，接受较系统的军事理论训练。大革命失败后，刘伯承参加南昌起义，任参谋团参谋长，从事军事参谋、训练和指挥工作。中央苏区时期，他参与红军学校和军事机关建设，长征途中多次参与作战部署和行军组织。到陕北后，刘伯承既有旧军队实战经验，又熟悉正规军事教育，在红军高级将领中以善于用兵、重视战术和训练著称。"
 PRC_hsia_tian_desc:0 "该角色在文件中被标注为可能因音译问题无法确认，使用通用航空理论家头像。其功能是提供空战理论家槽位，不作真实人物履历扩展。"
 PRC_zhang_wei_desc:0 "该角色在文件备注中被说明为当代海军人物，并非1930至1940年代 PRC 历史角色。其功能是无特定 DLC 情况下的海军理论家槽位，不纳入史实时间线展开。"
 PRC_peng_dehuai_desc:0 "彭德怀，1898年生，湖南湘潭人，原名彭得华。早年家境贫寒，曾入湘军当兵，长期在旧军队中摸爬滚打。1928年，他在湖南平江发动起义，后率部上井冈山，与朱毛红军会师，组建红五军，成为红军早期重要军事力量之一。中央苏区时期，彭德怀率红三军团参加历次反“围剿”，作风刚烈，善于在艰苦条件下组织突击和阻击。长征途中，他多次承担掩护、开路和急行军任务，在湘江、遵义、娄山关、腊子口等转战中保持部队战斗力。到陕北后，彭德怀已是红军中最能打硬仗的高级指挥员之一。"
 PRC_lin_biao_desc:0 "林彪，1907年生，湖北黄冈人。早年入黄埔军校第四期学习，参加北伐战争，后随部队参加南昌起义并进入红军。井冈山时期，他很快在部队中崭露头角，作战谨慎而善于捕捉战机。中央苏区时期，林彪长期指挥红一军团，在多次反“围剿”中积累了大兵团运动战经验。长征途中，他率部参加突破封锁线、强渡乌江、四渡赤水等作战，是中央红军最重要的前线指挥员之一。到达陕北时，林彪年纪不大，却已经是红军中资历很深的军团级将领。"
 PRC_he_long_desc:0 "贺龙，1896年生，湖南桑植人。早年在湘西一带活动，以“两把菜刀闹革命”的故事闻名，后逐渐形成自己的地方武装力量。大革命时期，他参加北伐，任国民革命军高级将领。1927年南昌起义中，贺龙率部参加起义，任起义军总指挥。随后转入湘鄂西、湘鄂川黔一带坚持武装斗争。土地革命战争时期，他与周逸群、关向应、任弼时等人共同建设根据地，长期指挥红二军团、红二方面军系统。长征中，贺龙率部转战西南，与红四方面军会合后继续北上，最终实现三大主力会师。"
 PRC_zhang_zongxun_desc:0 "张宗逊，1908年生，陕西渭南人。早年考入黄埔军校，后参加秋收起义，随毛泽东上井冈山。红军早期，他长期在一线部队任职，经历井冈山斗争、中央苏区反“围剿”和长征。与一些长期从事机关工作的干部不同，张宗逊主要是在连续作战中成长起来的指挥员。到达陕北后，他参与保卫陕甘宁根据地和红军整编工作，在红一方面军中积累了大量指挥经验。"
 PRC_ulanhu_desc:0 "乌兰夫，1906年生，蒙古族，绥远土默特旗人，原名云泽，乌兰夫是蒙古语名（意为红色的儿子）。青年时期在北平蒙藏学校求学，接触李大钊、赵世炎、邓中夏等人影响下的革命思想，后加入中国共产党，并赴莫斯科中山大学学习。回国后，他长期在绥远、内蒙古一带从事蒙古族群众工作、党务工作和军运工作。与陕北、苏区出身的红军干部不同，乌兰夫的主要战场在草原、旗县和边疆民族地区，他熟悉蒙旗社会结构、地方上层关系、青年学生和地方武装。1936年前后，他参与策动百灵庙暴动，推动绥远地区部分蒙古族武装转向抗日立场。"
 PRC_luo_ruiqing_desc:0 "罗瑞卿，1906年生，四川南充人。早年考入黄埔军校武汉分校，后加入中国共产党并参加红军。土地革命战争时期，他长期在红军中从事政治保卫、干部管理和部队政治工作。中央苏区时期，罗瑞卿参与红军保卫机关和政治机关工作，长征中随中央红军转战，经历突围、行军和到达陕北后的整编。到1936年前后，罗瑞卿已成为红军政治保卫和军队管理系统中的重要干部。"
 PRC_zhang_dingcheng_desc:0 "张鼎丞，1898年生，福建永定人。早年在家乡从事教育和农民运动，1927年加入中国共产党。大革命失败后，福建西部的革命力量受到严重打击，张鼎丞仍在龙岩、上杭、永定一带组织农民武装，参与领导永定暴动和闽西土地革命。闽西根据地形成后，他长期负责地方苏维埃政权、农民武装和土地政策，是闽西革命根据地的主要创建者之一。中央苏区时期，张鼎丞在地方党政系统和军事动员中承担重要工作，既要组织群众、筹粮筹款，也要配合红军作战和地方武装建设。中央红军主力长征后，南方根据地陷入分散游击和严密围剿之中，张鼎丞继续在福建、赣南等地坚持斗争。"
 PRC_lu_sheng_desc:0 "卢胜，1911年生，广东乐会人，原名卢家扬，曾用名李胜。早年父母双亡，少年时期便参加农民协会和地方武装。1928年前后，琼崖革命武装遭到围剿，他离开海南到新加坡谋生，曾为制胶工人和外轮海员，在新加坡海员工会活动中接触革命组织。1932年被新加坡当局驱逐回国后加入中国共产党，并被派往闽南从事军事斗争。1933年，他参加闽南红军第三团，逐步从基层干部成长为独立营、支队负责人。中央红军主力长征后，闽南地区留下的红军和游击队面临严酷清剿，卢胜率部开辟云霄、平和、诏安一带游击根据地。1936年前后，他仍在闽粤边坚持武装斗争，是南方游击战争中作战经验丰富的年轻指战员。"
 PRC_zhang_yunyi_desc:0 "张云逸，1892年生，广东文昌人。早年参加同盟会和辛亥革命，长期在旧军队和国民革命军中活动，拥有较丰富的军事资历。大革命时期，他参加北伐战争，后逐渐转入中共领导的武装斗争。1929年，张云逸参与百色起义，协助创建红七军和右江革命根据地。随后，他率部转战广西、广东、江西等地，进入中央苏区和红军系统。张云逸出身旧军队，却能适应红军根据地战争，在军事指挥、地方武装建设和统一战线中都有经验。到抗战前夕，他是中共军队中较早拥有正规军履历和南方斗争经验的高级将领之一。"
 PRC_xiao_ke_desc:0 "萧克，1907年生，湖南嘉禾人。早年参加国民革命军，后参加南昌起义和湘南起义，并进入井冈山红军。土地革命战争时期，他长期在湘赣、湘鄂川黔等地作战，逐步成为红六军团和红二方面军系统的重要指挥员。1934年，红六军团西征，与贺龙领导的红三军会合，为后来红二、红六军团协同作战奠定基础。长征中，萧克随红二方面军转战西南，是红二方面军中年轻而有经验的将领，熟悉山地游击、长途机动和地方根据地作战。"
 PRC_ye_ting_desc:0 "叶挺，1896年生，广东惠阳人。早年就读保定陆军军官学校，后入粤军任职。第一次国共合作时期，他率领国民革命军第四军独立团参加北伐，以作战勇猛著称，所在部队被称为“铁军”。1927年，叶挺参加南昌起义和广州起义，随后因革命受挫而长期流亡海外。抗日战争爆发后，他以无党派身份出任新四军军长，成为抗日武装力量当中的重要旗帜。"
 PRC_luo_ronghuan_desc:0 "罗荣桓，1902年生，湖南衡山人。早年参加学生运动和农民运动，1927年参加秋收起义，随后随部队上井冈山。红军早期，罗荣桓长期从事政治工作，在部队党组织建设、纪律教育和群众关系方面积累了经验。中央苏区时期，他在红军中担任政治委员等职，参与反“围剿”和长征。与一些以战术指挥见长的将领不同，罗荣桓更擅长把部队组织、政治动员和群众工作结合起来。"
 PRC_cheng_zihua_desc:0 "程子华，1905年生，山西运城人。早年考入黄埔军校武汉分校，后参加广州起义并进入红军。土地革命战争时期，他先后在中央苏区、鄂豫皖和红二十五军系统中任职，长期从事前线指挥和部队建设。红二十五军长征时，程子华参与率部从鄂豫皖根据地出发，转战豫陕、陕南，最终进入陕北，成为较早到达陕北的一支红军力量。他熟悉华北、华中和西北多地的军事环境，也经历过孤军远征和根据地重建。擅长敌后机动、整合地方武装和开辟新根据地。"
 PRC_zhang_qinqiu_desc:0 "张琴秋，1904年生，浙江桐乡人。早年赴苏联学习，回国后进入中共组织和红军系统工作。土地革命战争时期，她在鄂豫皖和川陕根据地长期任职，曾担任红四方面军总政治部主任、地方党委和妇女工作领导职务。川陕根据地时期，红四方面军建立妇女独立团、妇女独立师，张琴秋曾担任师长，组织大批女战士参加运输、救护、宣传和作战。长征途中，她率部翻雪山、过草地，在红四方面军内部政治斗争和艰苦行军中坚持工作。"
 PRC_qian_sanqiang_desc:0 "1913年生，浙江绍兴人，核物理学家。曾赴法国居里实验室学习和研究，回国后参与中国原子能事业建设。其科学贡献主要属于建国后国防科技体系，与游戏后期核研究方向关系密切。"
 PRC_he_zehui_desc:0 "1914年生，江苏苏州人，核物理学家。曾在德国和法国从事物理研究，回国后参与原子核科学和高能物理建设。其角色体现建国后科学共同体和核技术基础研究的发展。"
 PRC_qian_xuesan_desc:0 "1911年生，浙江杭州人，航空航天和工程控制领域科学家。曾在美国加州理工等机构工作，回国后参与导弹、火箭和航天工程体系建设。其贡献主要属于建国后国防科技与工程组织。"
 PRC_wang_shusheng_desc:0 "王树声，1905年生，湖北麻城人。早年参加黄麻起义，进入鄂豫皖革命根据地。土地革命战争时期，他长期在红四方面军系统作战，从基层指挥员逐步成长为高级将领。鄂豫皖根据地和川陕根据地的战斗环境艰苦，红四方面军既要面对大规模围剿，也要进行远距离转移和山区作战。王树声熟悉红四方面军的部队传统、干部系统和前线指挥方式。长征中，他随红四方面军转战川西、甘南等地，经历会师和内部路线分歧，是红四方面军中从地方武装和根据地战争中成长起来的实战派将领。"
 PRC_su_zhenhua_desc:0 "苏振华，1912年生，湖南平江人。少年时期参加革命，进入红军后长期从事基层政治工作和部队指挥。土地革命战争时期，他在湘鄂赣、中央苏区和红军部队中历练，经历了反“围剿”和长征。到达陕北后，他继续在部队中承担政治工作和指挥任务。"
 PRC_mao_zedong_commander_desc:0 "毛泽东，1893年生，湖南湘潭人，字润之。青年时期在湖南第一师范求学，曾任北京大学图书馆助理员，接触新文化运动和马克思主义思潮。1921年参与中国共产党创建，随后长期在湖南组织工人和农民运动。大革命失败后，他领导秋收起义，将部队带上井冈山，逐步形成以农村根据地、武装斗争和土地革命为中心的革命道路。中央苏区时期，他曾参与红军和苏维埃政权建设，陷入激烈的党内路线斗争。第五次反“围剿”失败后，中央红军被迫长征；遵义会议后，毛泽东重新进入军事指挥核心。到陕北后，他在瓦窑堡会议、西安事变和抗日民族统一战线形成过程中，逐渐成为中共中央实际上的核心人物。"
 PRC_mao_zedong_leader_desc:0 "毛泽东，1893年生，湖南湘潭人，字润之。青年时期在湖南第一师范求学，曾任北京大学图书馆助理员，接触新文化运动和马克思主义思潮。1921年参与中国共产党创建，随后长期在湖南组织工人和农民运动。大革命失败后，他领导秋收起义，将部队带上井冈山，逐步形成以农村根据地、武装斗争和土地革命为中心的革命道路。中央苏区时期，他曾参与红军和苏维埃政权建设，陷入激烈的党内路线斗争。第五次反“围剿”失败后，中央红军被迫长征；遵义会议后，毛泽东重新进入军事指挥核心。到陕北后，他在瓦窑堡会议、西安事变和抗日民族统一战线形成过程中，逐渐成为中共中央实际上的核心人物。"
 PRC_zhang_wentian_leader_desc:0 "张闻天，1900年生，江苏南汇人，又名洛甫。早年在南京、上海等地求学，后赴苏联学习和工作，熟悉马克思主义理论和党内宣传工作。回国后，他进入中共中央机关，曾参与中央文件起草和理论宣传。长征途中，张闻天参加遵义会议，并在会议后接替博古负中央总的责任，成为中共中央领导层的重要人物。与一线军事将领不同，张闻天更多承担中央政治决策、理论阐释和组织协调工作。到陕北后，他参与瓦窑堡会议等重大决策，在抗日民族统一战线形成和延安时期党内政策调整中具有重要地位。"
 PRC_kwong_hu_leader_desc:0 "该角色在 PRC 文件中作为自由主义路线的替代领袖出现，未见与中共1930至1940年代核心人物的稳定对应。其功能属于非史实政治路线的领导人占位，用于承接游戏中的意识形态分支。"
 PRC_luo_zhao_leader_desc:0 "该角色在 PRC 文件中作为法西斯意识形态路线的替代领袖出现，未见与中共1930至1940年代真实人物的稳定对应。其功能属于替代路线下的机制角色，而非史实中共干部。"
 PRC_liang_ma_leader_desc:0 "该角色在 PRC 文件中作为寡头政治路线的替代领袖出现，未见与中共历史人物的稳定对应。其功能属于非常规政治路线占位，不扩展真实履历。"
 PRC_deng_zihiu_commander_desc:0 "邓子恢，1896年生，福建龙岩人，名绍箕，字子恢。早年在福建从事教育、青年运动和农民运动，后加入中国共产党。土地革命兴起后，他长期活动于闽西地区，参与组织农民协会、地方武装和苏维埃政权。闽西土地革命中，邓子恢重视调查农村实际情况，推动分田、筹粮、财政和基层政权建设，使闽西成为中央苏区的重要组成部分。与一线野战将领不同，邓子恢更擅长处理农民、土地、财政和根据地治理问题。中央红军主力长征后，南方苏区环境急剧恶化，地方政权和群众组织遭到破坏，邓子恢仍在闽西、赣南等地坚持工作。"
 PRC_zhu_de_commander_desc:0 "朱德，1886年生，四川仪陇人。早年入云南讲武堂学习，曾在滇军中任职，参加过辛亥革命和护国战争，是旧军队中资历很深的职业军人。后赴欧洲学习并加入中国共产党。1927年南昌起义后，朱德率余部转战湘南、赣南，最终与毛泽东领导的秋收起义部队在井冈山会师，成为红军早期创建过程中的核心军事领导人之一。中央苏区时期，他长期担任红军总司令，参与根据地反“围剿”和红军正规化建设。长征途中，朱德经历中央红军与红四方面军会合、南下北上争论等复杂局面，仍保持红军总司令的地位。到陕北后，他成为红军系统中最具威望的军事元老之一。"
 PRC_otto_braun_commander_desc:0 "奥托·布劳恩，1900年生于德国慕尼黑附近，中文名李德。早年参加德国共产党，后进入苏联伏龙芝军事学院学习，接受苏式正规军事教育。20世纪30年代初，他受共产国际派遣来到中国，以军事顾问身份进入中共中央和中央革命军事委员会系统。中央苏区后期，李德与博古等人参与第五次反“围剿”的军事指挥，主张以阵地战、堡垒对堡垒和正规防御应对国民党军的围攻。随着中央苏区形势恶化，红军被迫长征，李德继续随中央红军行动。遵义会议后，他的军事指挥权被削弱，红军开始改变此前僵硬的作战方式。"
 PRC_ziao_jingguang_commander_desc:0 "萧劲光，1903年生，湖南长沙人。早年参加学生运动，后赴苏联学习，接受过较系统的政治和军事训练。大革命时期，他曾在国民革命军和中共军事系统中任职，参与北伐和革命军队建设。土地革命战争时期，萧劲光进入中央苏区，先后从事红军学校、军区和前线部队工作，既接触正规军事教育，也熟悉根据地战争的实际困难。第五次反围剿期间，任闽赣军区司令员，因执行短促突击战术、未能守住黎川，在左倾路线下受到错误处分，平反后继续在红军中任职。抗战后期和新中国成立后，他又被委以创建海军的重任，成为人民海军早期建设的核心人物之一。"
 PRC_chen_geng_commander_desc:0 "陈赓，1903年生，湖南湘乡人。早年入黄埔军校第一期学习，是黄埔早期学生中的重要人物。大革命时期，他曾参加东征、北伐和中共地下军事工作。南昌起义后，陈赓进入红军系统，长期从事情报、特科、军事指挥和干部训练。中央苏区时期，他曾在红军学校和一线部队任职，既懂秘密工作，也能带兵作战。长征途中，陈赓率部参加多次突围和阻击，作战机动灵活，善于在复杂局势中保存力量。到陕北后，他已经是红军中少数兼具黄埔背景、情报经验和野战指挥能力的将领。"
 PRC_zuo_quan_commander_desc:0 "左权，1905年生，湖南醴陵人。早年考入黄埔军校，后赴苏联学习军事，曾在伏龙芝军事学院深造。回国后，他进入中央苏区红军系统，长期从事军事参谋和前线指挥工作。左权受过较系统的军事教育，熟悉战役组织、参谋作业和部队训练，在红军高级干部中属于理论素养较强的一类。长征期间，参与指挥强渡大渡河、攻打腊子口等战斗。到达陕北后，率部参加了直罗镇战役和红军东征。1936年，他担任红一军团代理军团长，率部西征并参与指挥山城堡战役。"
 PRC_ye_jianying_commander_desc:0 "叶剑英，1897年生，广东梅县人。早年入云南讲武堂学习，曾在粤军中任职，参加过护法运动和北伐战争。第一次国共合作时期，他在黄埔军校和国民革命军中从事军事工作。1927年后，叶剑英逐渐转向中共革命阵营，参加广州起义，后来进入中央苏区和红军系统。长征途中，他长期在红军总部和参谋机关工作，熟悉各方面军之间的军事联络与指挥协调。红一、红四方面军会合后，围绕北上、南下发生重大分歧，叶剑英在关键时刻向中央报告情况，使中央红军避免陷入更危险的局面。到陕北后，他成为中共中央和红军总部中重要的参谋型将领。"
 PRC_liu_bocheng_commander_desc:0 "刘伯承，1892年生，四川开县人。早年投身川军，参加护国、护法等战争，作战中负伤失去右眼，因此有“独目将军”之称。后来他赴苏联学习军事，接受较系统的军事理论训练。大革命失败后，刘伯承参加南昌起义，任参谋团参谋长，从事军事参谋、训练和指挥工作。中央苏区时期，他参与红军学校和军事机关建设，长征途中多次参与作战部署和行军组织。到陕北后，刘伯承既有旧军队实战经验，又熟悉正规军事教育，在红军高级将领中以善于用兵、重视战术和训练著称。"
 PRC_peng_dehuai_commander_desc:0 "彭德怀，1898年生，湖南湘潭人，原名彭得华。早年家境贫寒，曾入湘军当兵，长期在旧军队中摸爬滚打。1928年，他在湖南平江发动起义，后率部上井冈山，与朱毛红军会师，组建红五军，成为红军早期重要军事力量之一。中央苏区时期，彭德怀率红三军团参加历次反“围剿”，作风刚烈，善于在艰苦条件下组织突击和阻击。长征途中，他多次承担掩护、开路和急行军任务，在湘江、遵义、娄山关、腊子口等转战中保持部队战斗力。到陕北后，彭德怀已是红军中最能打硬仗的高级指挥员之一。"
 PRC_he_long_commander_desc:0 "贺龙，1896年生，湖南桑植人。早年在湘西一带活动，以“两把菜刀闹革命”的故事闻名，后逐渐形成自己的地方武装力量。大革命时期，他参加北伐，任国民革命军高级将领。1927年南昌起义中，贺龙率部参加起义，任起义军总指挥。随后转入湘鄂西、湘鄂川黔一带坚持武装斗争。土地革命战争时期，他与周逸群、关向应、任弼时等人共同建设根据地，长期指挥红二军团、红二方面军系统。长征中，贺龙率部转战西南，与红四方面军会合后继续北上，最终实现三大主力会师。"
 PRC_ulanhu_commander_desc:0 "乌兰夫，1906年生，蒙古族，绥远土默特旗人，原名云泽，乌兰夫是蒙古语名（意为红色的儿子）。青年时期在北平蒙藏学校求学，接触李大钊、赵世炎、邓中夏等人影响下的革命思想，后加入中国共产党，并赴莫斯科中山大学学习。回国后，他长期在绥远、内蒙古一带从事蒙古族群众工作、党务工作和军运工作。与陕北、苏区出身的红军干部不同，乌兰夫的主要战场在草原、旗县和边疆民族地区，他熟悉蒙旗社会结构、地方上层关系、青年学生和地方武装。1936年前后，他参与策动百灵庙暴动，推动绥远地区部分蒙古族武装转向抗日立场。"
 PRC_zhang_dingcheng_commander_desc:0 "张鼎丞，1898年生，福建永定人。早年在家乡从事教育和农民运动，1927年加入中国共产党。大革命失败后，福建西部的革命力量受到严重打击，张鼎丞仍在龙岩、上杭、永定一带组织农民武装，参与领导永定暴动和闽西土地革命。闽西根据地形成后，他长期负责地方苏维埃政权、农民武装和土地政策，是闽西革命根据地的主要创建者之一。中央苏区时期，张鼎丞在地方党政系统和军事动员中承担重要工作，既要组织群众、筹粮筹款，也要配合红军作战和地方武装建设。中央红军主力长征后，南方根据地陷入分散游击和严密围剿之中，张鼎丞继续在福建、赣南等地坚持斗争。"
 PRC_lu_sheng_commander_desc:0 "卢胜，1911年生，广东乐会人，原名卢家扬，曾用名李胜。早年父母双亡，少年时期便参加农民协会和地方武装。1928年前后，琼崖革命武装遭到围剿，他离开海南到新加坡谋生，曾为制胶工人和外轮海员，在新加坡海员工会活动中接触革命组织。1932年被新加坡当局驱逐回国后加入中国共产党，并被派往闽南从事军事斗争。1933年，他参加闽南红军第三团，逐步从基层干部成长为独立营、支队负责人。中央红军主力长征后，闽南地区留下的红军和游击队面临严酷清剿，卢胜率部开辟云霄、平和、诏安一带游击根据地。1936年前后，他仍在闽粤边坚持武装斗争，是南方游击战争中作战经验丰富的年轻指战员。"
 PRC_zhang_yunyi_commander_desc:0 "张云逸，1892年生，广东文昌人。早年参加同盟会和辛亥革命，长期在旧军队和国民革命军中活动，拥有较丰富的军事资历。大革命时期，他参加北伐战争，后逐渐转入中共领导的武装斗争。1929年，张云逸参与百色起义，协助创建红七军和右江革命根据地。随后，他率部转战广西、广东、江西等地，进入中央苏区和红军系统。张云逸出身旧军队，却能适应红军根据地战争，在军事指挥、地方武装建设和统一战线中都有经验。到抗战前夕，他是中共军队中较早拥有正规军履历和南方斗争经验的高级将领之一。"
 PRC_cheng_zihua_commander_desc:0 "程子华，1905年生，山西运城人。早年考入黄埔军校武汉分校，后参加广州起义并进入红军。土地革命战争时期，他先后在中央苏区、鄂豫皖和红二十五军系统中任职，长期从事前线指挥和部队建设。红二十五军长征时，程子华参与率部从鄂豫皖根据地出发，转战豫陕、陕南，最终进入陕北，成为较早到达陕北的一支红军力量。他熟悉华北、华中和西北多地的军事环境，也经历过孤军远征和根据地重建。擅长敌后机动、整合地方武装和开辟新根据地。"
 PRC_qian_sanqiang_scientist_desc:0 "1913年生，浙江绍兴人，核物理学家。曾赴法国居里实验室学习和研究，回国后参与中国原子能事业建设。其科学贡献主要属于建国后国防科技体系，与游戏后期核研究方向关系密切。"
 PRC_he_zehui_scientist_desc:0 "1914年生，江苏苏州人，核物理学家。曾在德国和法国从事物理研究，回国后参与原子核科学和高能物理建设。其角色体现建国后科学共同体和核技术基础研究的发展。"
 PRC_qian_xuesan_scientist_desc:0 "1911年生，浙江杭州人，航空航天和工程控制领域科学家。曾在美国加州理工等机构工作，回国后参与导弹、火箭和航天工程体系建设。其贡献主要属于建国后国防科技与工程组织。"
 PRC_wang_shusheng_scientist_desc:0 "王树声，1905年生，湖北麻城人。早年参加黄麻起义，进入鄂豫皖革命根据地。土地革命战争时期，他长期在红四方面军系统作战，从基层指挥员逐步成长为高级将领。鄂豫皖根据地和川陕根据地的战斗环境艰苦，红四方面军既要面对大规模围剿，也要进行远距离转移和山区作战。王树声熟悉红四方面军的部队传统、干部系统和前线指挥方式。长征中，他随红四方面军转战川西、甘南等地，经历会师和内部路线分歧，是红四方面军中从地方武装和根据地战争中成长起来的实战派将领。"
 PRC_rao_shoukun_admiral_desc:0 "饶守坤，1915年生，江西德兴人。少年时期参加革命，进入红军后在赣东北和闽浙赣地区活动。中央红军主力长征后，留下的红军和游击队陷入艰苦环境，饶守坤随部在山区坚持斗争。"
 PRC_su_zhenhua_admiral_desc:0 "苏振华，1912年生，湖南平江人。少年时期参加革命，进入红军后长期从事基层政治工作和部队指挥。土地革命战争时期，他在湘鄂赣、中央苏区和红军部队中历练，经历了反“围剿”和长征。到达陕北后，他继续在部队中承担政治工作和指挥任务。"
 PRC_mao_zedong_theorist_desc:0 "1893年生，湖南湘潭人。早年参与中共建党和农民运动，1927年后转向农村武装斗争，先后经历井冈山根据地、中央苏区、长征和延安时期。1930年代中后期，他在党内军事政治路线中的影响持续上升，围绕根据地、游击战、统一战线和持久战形成一套组织战争的思路。"
 PRC_zhang_guotao_theorist_desc:0 "1897年生，江西萍乡人，中共一大代表之一。土地革命战争时期长期活动于鄂豫皖根据地和红四方面军系统，1935年一、四方面军会合后在战略方向、组织权威和红军去向问题上与中央发生冲突。其经历反映了中共早期高层权力结构、根据地系统差异和长征后领导秩序重组。"
