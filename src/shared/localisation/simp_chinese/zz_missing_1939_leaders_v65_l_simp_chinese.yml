 CBIO_ROM_carol_ii_desc:0 "1893年10月15日生于锡纳亚、1953年4月4日卒于葡萄牙埃斯托里尔，罗马尼亚国王，1930年至1940年在位。早年因婚恋丑闻与王室矛盾放弃继承权，后在国内政治力量支持下返回罗马尼亚并登基。卡罗尔二世试图在自由派、军方、铁卫团和王室亲信之间维持平衡，逐步形成以国王本人和宫廷集团为核心的统治体系。1938年，他废止政党政治、建立王室独裁，打压铁卫团并强化个人权威。然而欧洲局势急剧恶化，罗马尼亚在苏联、匈牙利、保加利亚和德国压力下接连遭受领土损失。1940年国内威信崩溃后，卡罗尔被迫退位，将王位交给米哈伊一世，自己流亡海外。"
