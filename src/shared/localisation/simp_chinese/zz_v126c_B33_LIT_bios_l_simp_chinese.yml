l_simp_chinese:
 CBIO_LIT_antanas_smetona_desc:0 "安塔纳斯·斯梅托纳，1874年8月10日生于乌克梅尔盖地区乌茹列尼斯村的农家。他早年从事律师与新闻工作，主编多份立陶宛民族主义报刊，是立陶宛民族主义思潮的主要理论家。第一次世界大战期间他领导立陶宛战争难民救济组织，1917年当选立陶宛委员会主席，1918年2月16日在立陶宛独立法案上签字。1919年4月4日，他当选立陶宛共和国首任总统，任至1920年。1926年12月，他是推翻格里纽斯政府的军事政变的领导者之一，重新出任总统，并任命沃尔德马拉斯为总理。此后他逐步集权，1928年颁布扩大总统权力的新宪法，1929年排挤沃尔德马拉斯，被尊为国家领袖，长期实行威权统治，压制反对派。1940年6月苏联发出最后通牒时，他主张武装抵抗，但多数政府与军队领导人不赞成，遂将总统职权交予总理梅尔基斯，于6月15日携家人流亡德国，转赴瑞士。1941年他辗转抵达美国，1942年定居克利夫兰。1944年1月9日，他在克利夫兰儿子住所的一场火灾中去世。"
 CBIO_LIT_augustinas_voldemaras_desc:0 "奥古斯丁纳斯·沃尔德马拉斯，1883年4月16日生于今伊格纳利纳地区的迪斯纳村。他是史学教授，通晓多种语言，早年在圣彼得堡及欧洲求学任教。1918年11月11日，他出任立陶宛首任总理，兼外交与国防部长，其后任外交部长至1920年，代表立陶宛出席巴黎和会与国际联盟。1926年他重返政坛，与斯梅托纳共同支持年底的军事政变，再度出任总理兼外交部长。他仿效意大利法西斯的黑衫党，组建准军事组织铁狼社，用以压制反对派。1929年他在考纳斯遇刺未遂，同年9月被斯梅托纳解职并排挤出权力核心。此后他多次图谋恢复权位，1934年因策动铁狼社政变被判十二年徒刑，1938年获赦后流亡法国。1940年立陶宛被苏联占领后，他在返回途中于边境被捕，押往苏联。1942年，他在苏联狱中去世。"
 CBIO_LIT_kazys_grinius_desc:0 "卡济斯·格里纽斯，1866年12月17日生于马里扬泊列附近的塞莱莫斯布达村农家。他在莫斯科攻读医学，成为医生，同时投身立陶宛民族运动，因反抗沙皇统治多次被捕，是立陶宛民主党与立陶宛人民农民联盟的创建者之一。第一次世界大战期间他在北高加索行医并照料立陶宛难民，1918年其妻女在当地遭布尔什维克武装杀害。立陶宛独立后，他于1920年至1922年出任第五任总理，任内签订苏立和平条约。1926年6月7日，他当选第三任总统，同年12月17日在斯梅托纳领导的军事政变中被推翻，此后回到考纳斯继续行医。纳粹占领时期，他因反对殖民立陶宛、抗议屠杀犹太人而被逐出考纳斯，后世因其在大屠杀中救助犹太人而追授其国际义人称号。1944年他流亡西方，1947年移居美国。1950年6月4日，他在芝加哥去世。"
 CBIO_LIT_leonas_bistras_desc:0 "莱奥纳斯·比斯特拉斯，1890年10月20日生于今拉脱维亚利耶帕亚的一个工人家庭。他先后在日内瓦、弗赖堡等地求学，1921年在弗赖堡大学获哲学博士学位，此后在考纳斯大学任教，一生以博士头衔自豪，署名常冠以博士。作为立陶宛基督教民主党的重要人物，他是战间期最活跃的政治家之一。1922年他当选第一届议会议员并任议长，1925年至1926年出任总理，还先后掌管教育、国防、外交等部，两度担任议会议长。他的政府曾着手同苏联谈判互不侵犯条约，该约后由斯莱热维丘斯政府于1926年签署。1926年政变后议会民主终结，他领导基督教民主党，不顾迫害公开反对威权总统斯梅托纳。立陶宛被苏联吞并后，他遭逮捕并未经审判即被流放，先后被押往哈萨克斯坦与西伯利亚，1950年再度被捕，直到斯大林去世后才获准返乡。晚年他在考纳斯靠民众捐助度日，1971年10月17日，在八十一岁生日前三天于考纳斯去世。"
 CBIO_LIT_mykolas_slezevicius_desc:0 "米科拉斯·斯莱热维丘斯，1882年2月21日生于今拉塞伊尼艾地区的德雷姆布利艾村。他在敖德萨大学攻读法律，1907年毕业后回国当律师，并长期从事报刊编辑，先后主编数份立陶宛报纸。他加入立陶宛民主党，后与人另组人民社会主义民主党，即通称的人民党。他三度出任立陶宛总理，任期分别为1918年底至1919年3月、1919年4月至10月，以及1926年。在1918年至1919年立国之初的危局中，他一面争取德国配合、一面动员立陶宛武装，抵御逼近的布尔什维克军队，被认为为国家奠定了根基。1926年第三度组阁时他兼任外交与司法部长，其政府签署了苏立互不侵犯条约，推行的改革却遭天主教会、军官与议会反对派抵制，最终在同年12月的军事政变中被推翻。1922年至1936年，他任人民党主席。1939年11月11日，他在考纳斯去世。"
 CBIO_LIT_ernestas_galvanauskas_desc:0 "埃内斯塔斯·加尔瓦瑙斯卡斯，1882年11月20日生于比尔扎伊地区的济佐尼斯村。他在比利时列日攻读采矿与电气工程，是立陶宛农民联盟的创建者之一。他参与1905年革命，被捕后从帕内韦日斯监狱逃脱并流亡国外。1919年，他作为立陶宛代表团成员出席巴黎和会。此后他两度出任总理，任期为1919年10月至1920年、1922年至1924年，并多次兼任外交、财政等职。他是1923年1月克莱佩达起义的主要推动者，事后又率团谈判克莱佩达公约，使该地区并入立陶宛。因被极端民族主义者怀疑他与其法国籍妻子亲波兰，其住所曾遭炸弹袭击，他本人也被炸伤。1924年至1927年他出任驻英国公使，1926年政变后辞职，转往克莱佩达办学任教。1939年至1940年他任财政部长。苏联占领后他出走，1941年被纳粹逮捕流放。战后他一度领导立陶宛解放最高委员会，1947年移居马达加斯加，1963年迁居法国。1967年7月24日，他在法国艾克斯莱班去世。"
 CBIO_LIT_vytautas_petrulis_desc:0 "维托塔斯·佩特鲁利斯，1890年2月3日生于比尔扎伊县瓦巴尔宁卡斯附近的卡特利什凯村。他是会计出身的政治家，属立陶宛基督教民主党的核心人物之一。1918年他成为立陶宛委员会成员，此后在多届内阁中担任财政部长或财政工商部长。因立陶宛货币立特在他任财政部长期间发行，他被称为立特之父。1925年2月至9月，他出任立陶宛总理兼财政部长，1925年至1926年任议会议长。1940年立陶宛被苏联占领后，他于7月11日被捕，关入考纳斯监狱，随后被判处死刑。1941年12月3日，他被内务人民委员部杀害于科米地区乌赫塔附近。"
 CBIO_LIT_aleksandras_stulginskis_desc:0 "亚历山德拉斯·斯图尔金斯基斯，1885年2月26日生于陶拉格地区卡尔蒂内奈的库塔利艾村，是一个人口众多的农家中最小的孩子。他曾学习神学，后改赴德国哈雷学习农学，1913年毕业回国务农并撰写农艺文章。他是立陶宛基督教民主党的创建者之一及其中央委员会负责人，1918年2月16日在立陶宛独立法案上签字。他主张建立民主共和国，反对君主制。1920年他出任立宪议会议长，随后成为立陶宛第二任总统，任至1926年。1926年12月的军事政变中，他一度短暂代理总统数小时。他还推动了1924年农业学院的创办。1941年6月14日，他与妻子被苏联内务人民委员部逮捕并流放西伯利亚，1952年被判处二十五年徒刑，斯大林去世后于1956年获释；他拒绝移居国外，选择返回苏维埃立陶宛。1969年9月22日，他在考纳斯去世，是立陶宛独立法案签署人中最后一位辞世者。"
 CBIO_LIT_zigmas_angarietis_desc:0 "齐格玛斯·安加里提斯，本名齐格蒙塔斯·安塔纳斯·阿列克萨，1882年6月13日生于苏瓦乌基地区奥贝卢皮艾村一个殷实的地主家庭，其兄后来出任独立立陶宛的农业部长。他早年在华沙兽医学院求学，因参与反沙皇活动被捕退学，从此投身革命。他1906年加入立陶宛社会民主党，因被流放到安加拉河一带，遂以安加里提斯为笔名，此名后来成为其姓氏。二月革命后他前往彼得格勒，与米切维丘斯-卡普苏卡斯共谋在立陶宛发动革命。1918年底他回国，参与创建立陶宛共产党，并出任昙花一现的立陶宛苏维埃社会主义共和国及立陶宛-白俄罗斯苏维埃社会主义共和国的内务人民委员。苏维埃政权覆灭后，他退往俄国，此后长居斯摩棱斯克与莫斯科，仍主持立陶宛共产党的地下工作，是该党驻共产国际的代表，并任国际监察委员会书记，一生撰写上百部马列著作。1938年大清洗中，他在莫斯科被捕。1940年5月22日，他在莫斯科狱中被处决。"
 CBIO_LIT_antanas_snieckus_desc:0 "安塔纳斯·斯涅什库斯，1903年1月7日生于沙基艾附近的布布列利艾村。第一次世界大战期间他随家人避居俄国，亲历1917年革命，1920年已是布尔什维克党员，同年因反政府活动被捕。他后来逃往莫斯科，成为共产国际的联络人，获安加里提斯与米切维丘斯-卡普苏卡斯信任，1926年被派回立陶宛，领导被取缔的地下立陶宛共产党。他多次被捕入狱，1933年经交换获释。1940年苏联占领立陶宛后，他于6月18日出狱，出任国家安全部门负责人，以党的名义传达苏方代表捷卡诺佐夫的指令，在人民议会选举前制造恐怖气氛。1940年8月起，他任立陶宛共产党第一书记，成为苏维埃立陶宛的实际最高领导人，直至去世。1941年6月，他发起对立陶宛人的首次大规模流放，甚至将自己的兄弟一家流放西伯利亚，其兄死于当地。战后他主持农业集体化并镇压立陶宛抵抗运动。他执政长达三十余年，晚年施政渐显民族色彩。1974年1月22日，他在德鲁斯基宁凯去世。"
 CBIO_LIT_feliksas_baltusis_desc:0 "费利克萨斯·巴尔图西斯-泽马伊蒂斯，1897年11月30日生于泰尔希艾附近的阿皮迪迈村。他是原俄罗斯帝国军队中少数在二月革命与十月革命后转投红军的立陶宛军官之一，参加过第一次世界大战、俄国内战、1923年汉堡起义与第二次世界大战，官至红军少将。1935年至1940年，他在莫斯科的伏龙芝军事学院任教。1940年立陶宛并入苏联期间，他一度出任立陶宛军队司令，同年获军事科学副博士学位。此后他先后在苏联总参谋部军事学院任高级教官，1942年至1943年指挥红军第十六立陶宛步兵师，战争后期主持苏联最高统帅部进修班。他是少数在伏龙芝军事学院与总参谋部军事学院任教的立陶宛人。1957年6月1日，他在莫斯科去世。"
 CBIO_LIT_mecislovas_gedvilas_desc:0 "梅奇斯洛瓦斯·格德维拉斯，1901年10月19日生于考纳斯省的布拜村。1904年，他家因违反立陶宛出版禁令被流放俄国，他后来在圣彼得堡工学院就读，回国后在帕兰加当中学教员，又长期主持泰尔希艾的国家病患基金。他倾向左翼，主编过数份批评斯梅托纳威权政权的报纸，为此屡遭短期监禁，1934年加入立陶宛共产党。1940年苏联发出最后通牒后，他在人民政府中出任内务部长，并当选人民议会第一副主席，协助将立陶宛改组为苏维埃社会主义共和国。1940年8月至1956年1月，他任立陶宛人民委员会（后改称部长会议）主席，相当于总理，任内主持立陶宛的苏维埃化，并签署包括大规模流放在内的迫害令。因与第一书记斯涅什库斯不和，他于1957年被降为教育部长，至1973年退休，任内以兴建学校、推行十一年制中学著称。1981年2月15日，他在维尔纽斯去世。"
 CBIO_LIT_antanas_venclova_desc:0 "安塔纳斯·文茨洛瓦，1906年1月7日生于苏瓦乌基地区的特雷姆皮尼艾村。他在考纳斯的维陶塔斯大帝大学修习立陶宛语、俄语与法语。1936年他访问苏联，对苏联制度与文化深为倾倒。战前他任教并主编亲共刊物第三阵线。1940年苏联占领立陶宛后，他出任立陶宛苏维埃社会主义共和国教育人民委员，当选人民议会代表，并作为代表团成员前往莫斯科，请求将立陶宛并入苏联。1941年德国入侵苏联后，他随红军东撤，滞留苏俄，1944年返回立陶宛。他创作了立陶宛苏维埃社会主义共和国国歌的歌词，并将苏联国歌译为立陶宛文，还翻译了普希金的叶甫盖尼·奥涅金。1947年他获斯大林奖，1954年至1959年任立陶宛作家协会主席，1965年获立陶宛苏维埃社会主义共和国人民作家称号。他的儿子、诗人托马斯·文茨洛瓦后来成为著名异见人士。1971年6月28日，他在维尔纽斯去世。"
 CBIO_LIT_vincas_mickevicius_kapsukas_desc:0 "文卡斯·米切维丘斯，以笔名卡普苏卡斯闻名，1880年4月7日生于维尔卡维什基斯地区一个殷实的立陶宛农家。他早年积极投身立陶宛民族复兴运动，为多份立陶宛刊物撰稿、编辑，并加入立陶宛社会民主党。随着思想由民族主义转向社会主义、再转向共产主义，他成为立陶宛共产党的创建者与领袖之一，主编第一份布尔什维克立陶宛报纸真理报。1918年至1919年，他领导昙花一现的立陶宛苏维埃社会主义共和国及立陶宛-白俄罗斯苏维埃社会主义共和国，任人民委员会主席。这些政权覆灭后，他前往苏俄，继续领导立陶宛共产党人并为共产国际工作，1923年起在共产国际执行委员会任职。1921年底起，他定居莫斯科。他还是立陶宛第一位马克思主义文学批评家。1935年2月17日，他因肺结核并发症在莫斯科的一家医院去世。"
 CBIO_LIT_stasys_rastikis_desc:0 "斯塔西斯·拉什蒂基斯，1896年9月13日生于库尔谢奈，后随家迁往久克什塔斯。第一次世界大战期间他在俄罗斯帝国军队中服役，主要参加高加索战事。1918年回国后，他加入新建的立陶宛军队，投身立陶宛-苏俄战争，两度负伤，第二次重伤后被红军俘虏，被囚约二十个月，1921年方获释。1926年12月政变后，其妻的伯父斯梅托纳掌权，他的军旅生涯随之顺遂。他曾赴德国深造，1934年出任总参谋长兼武装力量司令，主持军队改革。1938年他出任国防部长，日益卷入政治，并参与谈判苏立互助条约。因与总理梅尔基斯不和，他于1940年4月辞职。1940年6月苏联发出最后通牒后，他一度被考虑出任亲苏人民政府的总理，但因惧怕内务人民委员部逮捕而逃往纳粹德国。1941年德国入侵苏联后他返回立陶宛，在昙花一现的临时政府中任国防部长，至8月5日。此后他在立陶宛战争博物馆整理军队档案，战争末期退往德国，1949年移居美国，在蒙特雷的国防语言学院教授俄语与立陶宛语，著有四卷回忆录。1985年5月3日，他在美国因心肌梗死去世。"
 CBIO_LIT_edvardas_adamkavicius_desc:0 "艾德瓦达斯·亚当卡维丘斯，1888年3月31日生于泰尔希艾县的皮凯利艾。他早年在圣彼得堡求学，1914年毕业于弗拉基米尔军校，第一次世界大战期间在俄罗斯帝国军队服役，官至参谋上尉。1918年他回国，志愿加入立陶宛军队，1919年一度代理总参谋长，此后指挥营与第七步兵团，参加了立陶宛对红军、别尔蒙特部队与波兰军队的独立战争。他逐级晋升，1937年2月16日获授师级将军军衔，1940年退役。立陶宛被苏联占领后，他流亡德国，1949年移居美国。他是后来立陶宛总统瓦尔达斯·阿达姆库斯的叔父。1957年5月10日，他在美国马萨诸塞州伍斯特去世。"
 CBIO_LIT_kazys_skuchas_desc:0 "卡济斯·斯库查斯，1894年3月3日生于马里扬泊列地区的毛鲁奇艾村。他曾就读师范学校并短期任教，1915年被征入俄罗斯帝国军队，在罗马尼亚前线作战。1918年回国后，他志愿加入立陶宛军队，最初在道加伊组建警察力量，逐级晋升，1928年任第二步兵师师长兼考纳斯卫戍司令。1934年至1938年，他任驻苏联武官，回国后晋升准将，不久退役。此后他先后在切尔纽斯与梅尔基斯内阁中出任内务部长，是独立立陶宛最后一任内务部长。1940年苏联发出最后通牒前，他成为反立陶宛宣传的主要攻击对象，被指控迫害两名苏军士兵。苏联占领立陶宛后，总统斯梅托纳嘱他离境，他却在边境被梅尔基斯派出的警察逮捕，交予苏方，先关考纳斯监狱，再押往莫斯科布特尔卡监狱。经过一场作秀式审判，他被判死刑。1941年7月30日，他在布特尔卡监狱被内务人民委员部处决，终年四十七岁。"
 CBIO_LIT_stasys_pundzevichius_desc:0 "斯塔西斯·庞德泽维丘斯，1893年9月2日生于斯卡皮什基斯附近的莱比什基艾村。第一次世界大战期间他被征入俄罗斯帝国军队。他后来加入立陶宛军队，历任要职，先后担任立陶宛空军司令与总参谋长，并多次临时代理武装力量司令。1939年3月起，他出任立陶宛武装力量总参谋长，是独立立陶宛最后一任总参谋长。1940年拉什蒂基斯卸任司令时，他本是继任人选之一，却让位于后来被证明亲苏的维特考斯卡斯。苏联占领立陶宛后，他一度任立陶宛人民军总参谋长，1940年9月被任命为红军一个步兵师师长，同年12月被以政治消极为由解职。他积极参与立陶宛活动阵线的地下活动，是1941年六月起义的组织者之一，并获临时政府任命为武装力量司令。德国占领期间，他参与反纳粹抵抗，协助阻止德国组建立陶宛党卫军军团。1944年他前往德国，1949年移居美国，以园丁为业。1980年10月20日，他在美国纽约州去世。"
 CBIO_LIT_kazys_musteikis_desc:0 "卡济斯·穆斯泰基斯，1894年11月22日生于斯图奇艾村。第一次世界大战期间他在俄罗斯帝国军队服役，在奥地利前线负伤。1918年回国后，他志愿加入立陶宛军队，曾任航空部门副职，1932年在布鲁塞尔军事学院毕业后转入总参谋部，1937年晋升准将。1938年至1940年，他出任立陶宛国防部长。1939年9月波兰战役与第二次世界大战爆发之际，他主张立陶宛保持中立，反对希特勒要立陶宛出兵夺取维尔纽斯的提议。1940年6月14日夜苏联发出最后通牒后，在考纳斯举行的立陶宛政府末次会议上，他力主拒绝通牒、进行军事抵抗。6月15日，他命令马里扬泊列的第九步兵团掩护总统斯梅托纳出境并对苏军作象征性抵抗，该团开拔后在维尔卡维什基斯被拦下。当天他随斯梅托纳流亡德国。他后来返回立陶宛，1944年再度出走，1949年移居美国。1977年6月6日，他在芝加哥去世。"
 CBIO_LIT_jonas_cernius_desc:0 "约纳斯·切尔纽斯，1898年1月6日生于库皮什基斯。1918年立陶宛宣布独立时，他志愿参军，投身独立战争，是考纳斯军事学校最早的毕业生之一。此后他赴布鲁塞尔与巴黎进修军事工程。回国后他晋升中校，出任军事技术部门负责人，1934年升上校，1935年晋升准将并出任总参谋长。1939年3月28日至11月21日，他出任立陶宛总理，主持第二十届内阁。卸任总理后，他晋升少将，出任第一师师长。立陶宛被苏联吞并后，他在红军第二十四步兵军中服役，直至1941年纳粹德国入侵。他后来流亡海外。1977年7月3日，他在美国洛杉矶去世。"
 CBIO_LIT_antanas_gustaitis_desc:0 "安塔纳斯·古斯塔伊蒂斯，1898年3月26日生于马里扬泊列地区亚瓦拉瓦斯的奥贝利内村。他早年在彼得格勒的工程学院与炮兵学校求学，1919年加入立陶宛军队，1920年从军事航空学校毕业，同年参加立陶宛-波兰战争。此后他训练飞行员并主管训练中队。1925年至1928年，他在巴黎进修航空工程。他设计并主持生产了立陶宛自制的安博系列飞机，涵盖教练机、侦察机与轻型轰炸机等九种机型；安博一名取自他与妻子布罗内的名字，民间则戏解为安塔纳斯想上天。1934年他出任立陶宛空军司令，1937年晋升准将，重组军事航空，编成歼击、轰炸与侦察各群，并建立飞行员与地勤的培训体系。立陶宛被苏联占领、军队解散后，他改任维陶塔斯大帝大学讲师。1941年他因惧怕被捕试图逃往德国，3月4日在越境时被捕，押往莫斯科。1941年10月16日，他在莫斯科被枪决。"
 CBIO_LIT_wilhelm_karl_desc:0 "明道加斯二世，本名威廉·卡尔·冯·乌拉赫，1864年3月3日生于摩纳哥，是德意志符腾堡王室旁支乌拉赫家族的公爵。他是乌拉赫第一代公爵威廉与摩纳哥的弗洛雷斯蒂娜公主之子，早年从军，第一次世界大战时任德国陆军中将，指挥第二十六步兵师。他信奉天主教，又不属于德皇所在的霍亨索伦家族，因而在1918年被立陶宛委员会看中：同年6月4日委员会决定邀他为独立立陶宛国王，7月11日正式推举他即位，取王号明道加斯二世。按与委员会的约定，他须移居立陶宛并学习立陶宛语。然而德国当局旋即宣布这次推举无效，同年11月邀请被撤回，他实际上从未加冕、从未真正统治。此后他仍任乌拉赫家族族长。1928年3月24日，他在意大利拉帕洛去世。"
 CBIO_LIT_karl_gero_desc:0 "明道加斯三世，本名卡尔·格罗·冯·乌拉赫，1899年8月19日生于符腾堡王国的利希滕施泰因城堡，是明道加斯二世（威廉·卡尔·冯·乌拉赫）与巴伐利亚的阿玛莉公爵夫人之次子。他1917年从斯图加特的卡尔中学毕业，随即以中尉身份参加第一次世界大战，1918年负重伤。战后他改学建筑，在慕尼黑做建筑师。1928年父亲去世后，因其兄威廉执意与平民女子结婚而放弃继承权，他遂成为乌拉赫第三代公爵。1940年6月20日，他与瓦尔德堡-蔡尔-特劳希堡的加布里埃尔女伯爵结婚，婚后无子女。1981年8月15日于利希滕施泰因城堡去世。"
 CBIO_LIT_vladas_karvelis_desc:0 "弗拉达斯·卡尔韦利斯，1901年4月11日生于希奥利艾。他先在希奥利艾读中学，第一次世界大战期间避居俄国沃罗涅日，战后返乡完成学业。1919年2月他志愿加入立陶宛军队，同年7月从考纳斯军事学校毕业，随即投身立陶宛独立战争，与红军及波兰军队作战。他后来赴布拉格深造，1929年毕业于捷克斯洛伐克总参谋学院，此后长期在军队总参谋部任职，历任高等军官进修班督察，1938年晋升准将。1939年1月至1940年6月，他出任沃鲁塔大帝高等军事学校校长。苏联占领立陶宛后，他先任军队总参谋长助理，1940年6月至8月任第二步兵师师长兼考纳斯卫戍司令，随后转入红军序列，同年12月获少将军衔。1941年至1942年，他先后在莫斯科红军总参谋学院进修并在伏龙芝军事学院任教，此后指挥红军第十六立陶宛步兵师，参加苏德战争。战后他长期担任维尔纽斯大学军事系主任，直至1961年退役，并撰写多部关于立陶宛军队史与该师战史的著作。1980年3月28日，他在维尔纽斯去世。"
 CBIO_LIT_juozas_ambrazevicius_desc:0 "尤奥扎斯·安布拉泽维丘斯，1903年12月9日生于马里扬泊列地区特拉基什基艾村。他在考纳斯的立陶宛大学与德国波恩大学攻读文学，1927年起在考纳斯讲授立陶宛文学与民俗学，参与多个文学与学术团体，并在民族主义日报《立陶宛报》与天主教日报《二十世纪》编辑部任职，常以笔名塞尔武斯撰稿。1941年6月苏德战争爆发、立陶宛六月起义发动后，因原定总理什基尔帕受困柏林，他出任立陶宛临时政府代总理兼教育部长，任内政府颁布了针对犹太人的歧视性法令，并批准在考纳斯设立犹太人隔离区。临时政府于同年8月5日被德国当局解散。此后他转入地下刊物《走向自由》的编辑工作，并参与立陶宛最高解放委员会的反纳粹抵抗活动，1944年6月该会成员遭德国逮捕后，他于7月随撤退的德军离开维尔纽斯，先赴德国，1948年移居美国，改用笔名尤奥扎斯·布拉扎伊蒂斯，在纽约主编天主教日报《工人报》，并继续参与立陶宛解放运动。1974年11月28日，他在美国新泽西州南奥兰治去世。"
 CBIO_LIT_vladas_jurgutis_desc:0 "弗拉达斯·尤尔古蒂斯，1885年11月17日生于帕兰加附近的约斯考代村。1902年他从帕兰加初级中学毕业，进入考纳斯神学院，1906年毕业后转赴圣彼得堡罗马天主教神哲学院深造，1910年获硕士学位，随后在慕尼黑大学攻读经济学至1913年。他先后在斯韦克什纳与利耶帕亚任神父，第一次世界大战期间避居俄国，在萨拉托夫与阿斯特拉罕任牧师。回国后他在考纳斯神学院任教至1922年，同时投身政治，当选立宪议会议员并主持财政预算委员会，虽积极参政但终身未正式脱离神职。1922年1月至9月，他在加尔瓦瑙斯卡斯内阁中出任外交部长，随后辞职出任立陶宛银行首任行长，主持立特货币的发行与初期政策，任至1929年，因此非正式地被尊为立特之父。1925年起他在立陶宛大学任教，1940年转入维尔纽斯大学。1941年至1943年，他出任立陶宛科学院院长，同年与多位知名人士一同被纳粹当局逮捕，押往施图特霍夫集中营。1945年他获释返回立陶宛，此后退出公共生活。1966年1月9日，他在维尔纽斯去世。"
 CBIO_LIT_vladas_mironas_desc:0 "弗拉达斯·马诺内斯，1880年6月22日生于罗基什基斯地区切达萨伊附近的库奥迪什基艾村。他在密陶中学求学，同窗中有后来的总统斯梅托纳，两人自此结为挚友。1897年他转入维尔纽斯神学院，1904年被祝圣为神父，此后投身立陶宛民族文化活动，参与出版立陶宛语教材，并联署请求维尔纽斯教区准许以立陶宛语举行弥撒。1905年他出席维尔纽斯大议会，1917年参加维尔纽斯会议，当选立陶宛委员会副主席，1918年2月16日在独立法案上签字。1926年他当选第三届议会议员，1929年至1939年出任立陶宛军队总随军司铎。1938年3月，他受邀出任总理，其内阁未推行重大改革。1939年3月，因德国最后通牒致使梅梅尔地区割让，他去职，由切尔纽斯接任，此后淡出政坛。苏联占领后，他于1940年9月被内务人民委员部逮捕，1941年6月德国入侵苏联之际获立陶宛行动阵线营救释放。他拒绝随军西撤，选择留在立陶宛，1944年8月再度被苏方逮捕，被迫充当内务人民委员部线人，但态度消极、隐瞒情报。1947年1月，他第三次被捕，被判处七年徒刑，押往俄国弗拉基米尔监狱服刑。1953年2月18日，他在弗拉基米尔监狱中去世。"
 CBIO_LIT_vytautas_alantas_desc:0 "维陶塔斯·阿兰塔斯，原名维陶塔斯·本雅米纳斯·雅克舍维丘斯，1902年6月18日生。他赴法国求学，1929年毕业于蒙彼利埃大学。凭借法语专长，1930年至1934年他主管立陶宛埃尔塔通讯社法文部，1934年至1939年出任官方报纸《立陶宛回声报》总编辑，1937年正式改姓为阿兰塔斯，先后获颁维陶塔斯大帝勋章与三星勋章。他是二十世纪三十年代末立陶宛民族主义联盟内部激进青年派掌舵人的领袖之一，主张国家应彻底奉行极权民族主义，思想同情国家社会主义，被视为战间期立陶宛极权民族主义的主要理论家之一。1940年苏联占领立陶宛后，他出走德国，妻儿则留在立陶宛，于1941年六月大流放中被押往西伯利亚。在德国，他受邀主持立陶宛行动阵线文化委员会，属该阵线激进右翼，支持组建立陶宛国家社会主义党，其出任临时政府教育部文化委员会负责人的提名遭立陶宛民族主义者党阻挠，转而出任维尔纽斯戏剧院院长，任内创作三部剧作，其中两部得以上演。战后他移居美国，专事文学创作，一生著有七部短篇小说集、六部长篇小说、十五部剧作及多部非虚构著作，晚年著有探讨立陶宛民族存续与反苏抵抗的文集。1990年4月24日，他去世。"
 CBIO_LIT_adolfas_ramanauskas_desc:0 "阿道法斯·拉马瑙斯卡斯，化名瓦纳加斯，1918年3月6日生于美国康涅狄格州新不列颠的立陶宛移民家庭，1921年随父母返回立陶宛，定居鲁达米纳附近的比耶莱纳伊村务农。他1930年毕业于加利尼艾小学，1937年毕业于拉兹迪加伊中学，此后就读克莱佩达师范学院，因梅梅尔地区被割让给德国，学院迁往帕涅韦日斯。同年他考入考纳斯军校，1940年以少尉军衔毕业，是苏联占领前该校最后一届毕业生，随后前往德鲁斯基宁凯附近的克里沃尼斯任教。1941年6月苏德战争爆发之际，他在德鲁斯基宁凯组织地方自卫队，保护当地居民与物资，同年7月中旬因德军解散该队而离任，此后移居阿利图斯任教，隐瞒军事背景以避免被德方征召。1944年苏联再度占领立陶宛后，他于1945年春加入立陶宛游击队，化名瓦纳加斯，在苏瓦尔基亚与祖基亚地区组织抵抗，历任排长、达伊纳瓦军区司令，1948年出任立陶宛南部军区司令，1949年当选立陶宛自由战士联盟主席团成员及副主席，参与签署二月十六日宣言。1952年后他隐姓埋名潜伏，1956年10月被特工出卖被捕，遭受严刑逼供，1957年11月29日在维尔纽斯被处决。"
 CBIO_LIT_antanas_kaskelis_desc:0 "安塔纳斯·卡斯克利斯，1879年3月31日生于林库瓦附近的凯梅奈庄园。1897年他毕业于俄国商船学校，此后在商船队服役，1904年转入俄罗斯帝国军队，1905年从喀琅施塔得海军准尉课程毕业，参加日俄战争太平洋方向作战。1907年他毕业于符拉迪沃斯托克亚历山大远洋航海学校，获船长资格。第一次世界大战期间他再度被征召，在阿尔汉格尔斯克港服役，先后指挥扫雷舰及扫雷舰队。战后回到立陶宛，1919年11月志愿加入立陶宛军队，此前曾任希奥利艾火车站站长。1927年至1935年，他先后担任缉私布雷艇M59及总统斯梅托纳号海防舰舰长，1928年晋升少校。1935年立陶宛组建海军后，他继续执掌总统斯梅托纳号，将其改为训练舰，编写海员训练大纲，设计海军制服与旗帜，1936年获颁维陶塔斯大帝五级勋章，1939年12月以海军上尉军衔退役。苏联占领立陶宛后，他在帕兰加被内务人民委员部逮捕，囚禁至1941年，后经交换获释，与妻女移居德国。1944年6月12日，他在德国希韦尔拜因去世。"
 CBIO_LIT_juozas_barzda_bradauskas_desc:0 "尤奥扎·巴尔兹达-布拉道斯卡斯，1896年1月13日生于巴布泰地区马尼什基艾村。他在考纳斯男子中学求学，第一次世界大战期间于1916年6月被征入俄罗斯帝国军队，同年11月毕业于彼得格勒第三准尉学校，1917年在拉脱维亚前线作战，1918年被德军俘虏。1919年他志愿加入立陶宛军队，历任维尔卡维什基斯县、卡尔瓦里亚、维尔巴利斯与基巴尔泰的军事司令，1919年至1926年任连长、营长助理。1922年他毕业于高等军官进修班，1924年赴法国枫丹白露进修军用汽车课程，1929年毕业于立陶宛大学技术系。1926年至1927年他任技术团营长兼团军事法庭庭长，1928年至1930年间断出任军事技术总部部长，1938年晋升准将。苏联占领立陶宛后，自1940年7月8日起他出任所谓立陶宛人民军的军事装备部长。德占时期他转入经济企业工作，并任教于维陶塔斯大帝大学。1947年10月，他被内务人民委员部以通敌罪名逮捕，1948年被判刑押往奥尔沙监狱，其后关押于诺里尔斯克，最终转押至伊尔库茨克州古拉格。1953年8月20日，他在该地去世。"
 CBIO_LIT_albinas_cepas_desc:0 "阿尔比纳斯·采帕斯，1939年前姓采帕乌斯卡斯，1898年12月20日生于乌日文蒂斯附近的米努皮艾村。1918年他成为立陶宛军队志愿兵，1919年毕业于考纳斯军事学校，此后历经1925年高等军官进修班、1931年高级部队长官课程、1934年总参谋部课程深造。1936年至1940年，他出任第五步兵团团长。苏联扶植的人民政府于1940年6月25日任命他为国防副部长，同时晋升准将。苏联正式吞并立陶宛后，自1940年12月起他转入红军序列，出任第二十九领土步兵军第一百七十九师师长，晋升少将。1941年6月，他与多名立陶宛军官一同被派往莫斯科高级指挥员进修班深造，因而躲过了随后针对留在立陶宛军官的大清洗。苏德战争期间，他在莫斯科军事学院任教。1945年至1951年，他先后主持立陶宛体育学院与立陶宛农业学院的军事训练教研室。1963年7月17日，他在帕兰加去世。"
 CBIO_LIT_jonas_staugaitis_desc:0 "乔纳斯·斯陶加蒂斯，1868年5月20日生于苏瓦乌基地区奥缅季什基艾村。他在华沙大学攻读医学，毕业后成为医生。1919年他当选议会议员，代表立陶宛人民农民联盟。1926年6月2日，他当选议会议长。同年12月军事政变发生前后，因总统格里纽斯与总理斯莱热维丘斯相继去职，身为议会议长的他依宪成为代理总统，短暂身兼立陶宛国家元首，政变尘埃落定后即主动放弃该职务，转由斯梅托纳执掌大权。此后他退出中枢政治，继续行医并参与地方公共事务。1952年1月18日，他在考纳斯去世，安葬于考纳斯彼得拉舒奈公墓。"
