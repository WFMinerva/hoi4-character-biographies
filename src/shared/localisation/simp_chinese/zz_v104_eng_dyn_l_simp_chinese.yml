 POLITICS_EDWARD_EDWARD_DESC:0 "1894年生于里士满白厅府邸，英国国王，1936年1月即位，同年12月退位，在位不足一年。他以威尔士亲王身份出访自治领与殖民地多年，以亲民、时髦的公众形象积累了极高的民望。即位后他执意迎娶两度离异的美国公民沃利斯·辛普森，内阁、英格兰教会与自治领政府均明确表示无法接受，首相鲍德温告知国王政府不会为此婚事提供任何支持。经过数周协商，爱德华八世拒绝放弃婚事，于1936年12月10日宣告退位，成为英国历史上极少数主动逊位的君主，退位后受封温莎公爵。其后争议主要集中于他对纳粹德国的同情态度：1937年他偕公爵夫人访问德国，与希特勒会面，留下与纳粹高层公开往来的影像记录，令英国政府持续保持警惕。二战爆发后，为使其远离欧洲政局，政府将他派任巴哈马总督，任内政绩平平，对当地劳工纠纷与种族问题的处置也受到批评。战后他长期定居法国，基本退出公共生活，1972年去世。"
 POLITICS_PALME_DUTT_DESC:0 "1896年生于剑桥，父亲是孟加拉裔医生，母亲是瑞典人，英国共产党最重要的理论家之一，长期被视为该党的首席思想家。这一印度与北欧混合的背景深刻影响了他的政治视野；他在牛津求学期间因反对第一次世界大战、拒服兵役而入狱并被开除。1920年英国共产党成立时他即是发起者之一，1921年创办《劳工月刊》，担任主编长达半个世纪。杜特是英国共产党与共产国际之间的关键纽带，对苏联和斯大林路线高度忠诚，因而被称为“斯大林在英国的喉舌”；他长期负责共产国际对印度共产党的指导工作，其著作以反帝国主义视角剖析资本主义与殖民体系，《今日印度》《法西斯主义与社会革命》等书影响了一代马克思主义者，也影响了印度的民族解放与左翼运动。1939年，正是他依照莫斯科的“帝国主义战争”路线，迫使主张支持对德作战的波立特暂时去职，自己一度出任总书记直至1941年，1974年去世。"
 POLITICS_WINSTON_CHURCHILL_DESC:0 "二战五大战时领袖之一，绰号“英国斗牛犬”。1874年生于牛津郡布伦海姆宫，出身马尔博罗公爵家族，父为保守党政治家伦道夫·丘吉尔勋爵，母珍妮·杰罗姆是美国人，全名温斯顿·伦纳德·斯宾塞-丘吉尔。早年从军并任战地记者，参加过印度西北边境、苏丹恩图曼之战和布尔战争，在南非被俘后越狱脱险、一举成名。1900年进入下议院，此后数十年间两度往返于保守党与自由党之间，历任海军大臣、军需大臣、殖民地大臣、财政大臣等要职。第一次世界大战期间，他主推达达尼尔／加里波利登陆，惨败后一度去职、亲赴西线带兵。1930年代他长期被排除在政府核心之外，史称其“旷野岁月”，却持续警告德国重整军备的威胁，激烈反对张伯伦的绥靖政策。1940年5月德军西线进攻之际，他出任首相兼国防大臣，就职后首次在下议院宣告“我能奉献的唯有热血、辛劳、眼泪与汗水”，誓言“不惜一切代价争取胜利”。他领导英国度过法国沦陷、不列颠空战和大西洋海战：敦刻尔克撤退后他誓言“我们将在海滩作战……我们绝不投降”（1940年6月4日）；法国崩溃之际，他号召国人挺身担责，“使千年之后人们仍会说：这是他们最光辉的时刻”（6月18日）；不列颠空战中他向皇家空军飞行员致敬——“从未有这么多人，对这么少人，亏欠这么多”（8月20日）。他与罗斯福密电往来时自署“前海军人士”，最终与美国、苏联结成同盟，其演说与斗牛犬般的强硬姿态成为英国坚持作战的重要象征。丘吉尔同样是坚定的帝国主义者，长期反对印度自治，对印度独立运动持敌视态度；1943年孟加拉饥荒造成数百万人死亡，其战时内阁在粮食调配上的决策至今争议极大，他也是战略轰炸德国城市政策的支持者。1942年阿拉曼大捷后，他以“这不是结束，甚至不是结束的开始，但或许是开始的结束”为这场转折定调。1945年大选保守党意外败北、他黯然下野，次年于美国富尔顿发表“铁幕”演说，揭开冷战序幕；1951年再度组阁，1953年受封嘉德骑士、成为“温斯顿爵士”，同年以所著二战史与历史著作荣获诺贝尔文学奖，1955年因健康原因辞职。私下里他嗜雪茄、惯以两指比出“V”字胜利手势，闲暇时在故居查特韦尔庄园作画、亲手砌砖筑墙；1963年获美国国会授予荣誉公民身份，为史上第一人，1965年逝世，获国葬殊荣。"
 POLITICS_EDWARD_HALIFAX_DESC:0 "1881年生于德文郡，出身约克郡贵族世家，英国保守党政治家、外交家，绥靖政策时期的重要人物。他曾任印度副王（总督，1926–1931），任内处理与甘地领导的印度独立运动之间的复杂关系，既有镇压也有谈判，签署过著名的《甘地—艾尔文协定》。1938年起出任外交大臣，是张伯伦对德外交的主要执行者之一，曾亲赴德国与希特勒、戈林等人会谈。1940年5月张伯伦下台时，被普遍视为继任首相的有力人选，论资历甚至比丘吉尔更被看好，但他最终选择退让，由丘吉尔组阁；战时内阁初期，他曾主张探讨与德国谈判的可能，与丘吉尔的强硬立场存在分歧。此后他出任驻美国大使（1941–1946），在争取美国援助和协调英美关系方面发挥了重要作用，1959年去世。"
 POLITICS_NEVILLE_CHAMBERLAIN_DESC:0 "1869年生于伯明翰，出身著名政治世家，1937至1940年的英国首相，绥靖政策最具代表性的执行者。他早年从事市政与实业，曾任卫生大臣和财政大臣，在社会改革与公共卫生立法上颇有建树。1937年继鲍德温出任首相后，他将主要精力投向对德、对意外交，力图通过让步避免新的欧洲大战。1938年9月，他与希特勒、墨索里尼、达拉第签署慕尼黑协定，同意将捷克斯洛伐克的苏台德地区割让给德国，返回伦敦后宣称带来了和平；然而仅数月后德国即吞并捷克斯洛伐克全境，绥靖政策破产。1939年9月德国入侵波兰，张伯伦政府被迫对德宣战；在加紧重整军备的同时，他的战争领导很快遭到质疑。1940年5月挪威战役失利后，他在下议院失去支持，辞去首相职务，由丘吉尔接任，同年因病去世。"
 POLITICS_HARRY_POLLITT_DESC:0 "1890年生于兰开夏郡，出身工人家庭，做过锅炉工，英国共产党的主要领导人，长期担任总书记。他早年即投身工会和工人运动，是英国共产党1920年成立时的重要人物之一，凭借出色的组织能力和群众鼓动才能，成为该党最具代表性的工人领袖，与理论家拉贾尼·帕姆·杜特形成“实干家与理论家”的搭档。波立特对苏联和共产国际总体忠诚，但英国共产党内部路线存在分歧：1939年，他主张支持英国对德作战，与共产国际当时按《苏德互不侵犯条约》定下的“帝国主义战争”路线相冲突，在党内压力下被迫暂时辞去总书记职务；直到1941年德国入侵苏联、共产国际立场逆转后，他才复任。此后他长期领导英国共产党，1956年苏联介入匈牙利引发党内剧烈动荡，他辞去总书记，改任主席，1960年在自澳大利亚返航途中于海上去世。"
 POLITICS_GEORGE_VI_DESC:0 "1895年 12月生于诺福克郡桑德灵厄姆，乔治五世与玛丽王后的次子，本名阿尔伯特，家中昵称“伯蒂”，英国国王，1936年 12月即位，在位至 1952年。他早年从皇家海军起步，1916年以炮塔军官身份在战列舰科林伍德号上参加日德兰海战，是少数亲历一线作战的现代英国君主。1920年受封约克公爵，1923年与伊丽莎白·鲍斯-莱昂成婚，育有伊丽莎白与玛格丽特两位公主。他自幼患严重口吃，公开讲话长期是沉重负担，自 1926年起在澳大利亚言语治疗师莱昂内尔·罗格的长期帮助下方逐步改善。他本非王位预定继承人，因兄长爱德华八世执意迎娶辛普森夫人而退位、遂仓促登基；为强调与其父的连续性、安抚退位危机后动荡的人心，他舍本名而取“乔治六世”为王号，1937年 5月加冕。第二次世界大战期间，他与王后坚持留在伦敦，1940年白金汉宫数度遭德军空袭、其身处宫中时亦未能幸免，仍拒绝撤离；他亲赴受炸街区、军营、北非战场与诺曼底前线视察，并于 1940年设立乔治十字勋章和乔治勋章以表彰平民英勇，与首相丘吉尔每周会晤，成为英国坚持抗战的重要精神象征。作为末代印度皇帝，他在位期间正值大英帝国向英联邦转型、并加速去殖民化的关键阶段：1947年印度与巴基斯坦独立，1948年 6月他正式放弃“印度皇帝”称号，1949年伦敦宣言确立现代英联邦后，他成为首位“英联邦元首”。晚年健康每况愈下，1951年因肺部恶疾接受手术，1952年 2月 6日在桑德灵厄姆睡梦中辞世，由身在肯尼亚的女儿伊丽莎白二世继位。"
 CBIO_ENG_elizabeth_ii_desc:0 "1926年4月生于伦敦梅费尔，约克公爵（即后来的乔治六世）与公爵夫人之长女，全名伊丽莎白·亚历山德拉·玛丽，家中昵称“莉莉贝特”。她本非王位的预定继承人，1936年12月伯父爱德华八世退位、父亲仓促继位后，她以十岁之龄成为王位推定继承人。第二次世界大战期间，她与妹妹玛格丽特并未如外界建议的那样被送往加拿大避难，而是留在温莎城堡；1940年10月，年仅十四岁的她首次通过BBC《儿童时光》节目发表广播讲话，向因战火疏散离家的英国儿童致以慰问与鼓励。1945年战争末期，她加入英国陆军的辅助本土服务队（ATS），接受军用卡车驾驶与机械维修训练，成为王室中第一位以全职现役身份在武装部队服役的女性。同年5月8日欧战胜利日，她与妹妹一道隐去身份、混入伦敦街头欢庆的人群。1947年她与希腊王子菲利普（爱丁堡公爵）成婚；同年4月随父母访问南非期间，她在二十一岁生日时于开普敦发表著名的广播誓言，向全英联邦庄严宣告：“无论我的一生是长是短，都将献身于为诸位、为我们共同所属的整个帝国大家庭服务。”1952年2月，乔治六世病逝时她正在肯尼亚访问，遂在异邦即位为伊丽莎白二世，次年6月加冕。在长达七十年的统治中，她见证并主持了大英帝国向英联邦的彻底转型与全球去殖民化进程，作为英联邦元首维系着这一松散联合体的纽带，是英国历史上在位时间最长的君主。2022年9月她在巴尔莫勒尔堡辞世，由长子查尔斯三世继位。"
