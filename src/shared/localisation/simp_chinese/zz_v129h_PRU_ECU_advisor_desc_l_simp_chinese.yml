l_simp_chinese:
 ECU_benigno_andrade_flores_desc:0 "贝尼尼奥·安德拉德·弗洛雷斯1892年生，是厄瓜多尔职业军人，曾在安东尼奥·蓬斯代理政府中担任战争与海军部长。1935年9月，何塞·马里亚·韦拉斯科·伊瓦拉被军方推翻后，安德拉德参与短暂掌权的军事执政机构，并主持权力过渡，随后将国家领导权移交公共工程部长费德里科·派斯。此后他逐渐退出中枢政治，1972年6月22日去世。"
 ECU_carlos_arosemena_tola_desc:0 "卡洛斯·阿罗塞梅纳·托拉1888年4月12日生于瓜亚基尔，曾赴美国学习，回国后长期从事银行业和慈善事业。1947年韦拉斯科·伊瓦拉被推翻、卡洛斯·曼切诺短暂掌权后，国会选举阿罗塞梅纳为副总统，他随即依宪继任总统。任内厄瓜多尔与苏联断交，参与签署《美洲国家组织宪章》，并召开大哥伦比亚经济会议。1948年，他推动货币制度改革，将中央银行置于新设货币委员会管理之下。同年8月任期结束，1952年2月20日在瓜亚基尔去世。"
 ECU_carlos_arroyo_del_rio_desc:0 "卡洛斯·阿罗约·德尔里奥1893年11月27日生于瓜亚基尔，是律师和自由激进党政治家。1939年总统莫斯克拉去世后，他曾短暂代理总统，1940年正式当选。其任内厄瓜多尔与秘鲁边境冲突升级，1941年爆发战争。厄瓜多尔战败后，于1942年签署《里约议定书》，接受对争议边界的重新划定。阿罗约政府因战争失利、政治压制和经济困难逐渐失去支持。1944年5月，反政府起义爆发，他被迫辞职并流亡哥伦比亚。此后返回厄瓜多尔，1969年10月31日在瓜亚基尔去世。"
 ECU_cosme_renella_barbatto_desc:0 "科姆·雷内拉·巴尔巴托1890年生于意大利那不勒斯，幼年随家人移居瓜亚基尔。1912年，他在瓜亚斯射击与航空俱乐部资助下赴意大利都灵接受飞行训练并取得飞行员资格，随后又赴法国深造。1913年，他将飞机运回厄瓜多尔并开展公开飞行活动，成为厄瓜多尔早期航空事业的代表人物。第一次世界大战期间，雷内拉返回意大利，在意大利航空部队服役。战后他曾赴委内瑞拉从事飞行教学，1924年回国后继续参与厄瓜多尔军民航空建设，后来晋升航空中校。1937年，他在基多因腹膜炎去世。"
 ECU_federico_paez_chiriboaga_desc:0 "费德里科·派斯·奇里沃加1877年6月4日生于基多，早年赴法国和比利时学习工程，回国后曾任参议员和公共工程部长。1935年韦拉斯科·伊瓦拉下台后，他被军方推举为最高执政者。派斯执政初期推行带有社会改良色彩的政策，1936年11月平定兵变后则明显转向高压统治，关闭中央大学，并将部分政治反对者流放至加拉帕戈斯群岛。1937年，他试图借制宪会议巩固统治，同年10月被国防部长阿尔贝托·恩里克斯·加洛发动政变推翻。此后派斯流亡哥斯达黎加，晚年返回厄瓜多尔，1974年2月9日在基多去世。"
 ECU_gilberto_enriquez_gallo_desc:0 "吉尔贝托·恩里克斯·加洛全名吉尔·阿尔贝托·恩里克斯·加洛，1894年7月24日生于科托帕希省。早年从军，1935年出任费德里科·派斯政府的国防部长。1937年10月，他发动政变推翻派斯，出任最高执政者。其短暂任期内颁布1938年劳动法典，并推动警察、货币和社会政策改革，同时与外国矿业公司就利润和国家权益发生争议。执政约九个月后，他于1938年8月将权力移交制宪议会。1948年，恩里克斯曾代表左翼联盟参加总统选举但未获胜，1962年7月13日在基多去世。"
 ECU_hugo_endara_penaherrera_desc:0 "塞萨尔·恩达拉·佩纳赫雷拉，1916年生于马查奇，是厄瓜多尔海军军官。1936年进入海军学校，1938年晋升军官。1941年厄秘战争期间，他在“阿卜东·卡尔德隆”号炮艇担任二副，并在洪贝利海战中负责舰艉火炮。1944年“五月革命”期间，他一度代理瓜亚基尔海军指挥事务。此后历任多艘军舰舰长，1949年至1952年担任海军总司令，任内推动海军条令、医疗与组织建设。2000年12月23日去世。"
 ECU_juan_bayardo_tobar_desc:0 "胡安·巴亚尔多·托巴尔全名维克多·曼努埃尔·巴亚尔多·托巴尔·阿尔布哈，1911年生于伊瓦拉附近的圣安东尼奥。1929年投身军旅，1936年取得军事飞行员资格。1942年，他出任陆军航空监察局负责人，并借助美国军事合作扩充教练机和飞行训练力量。1943年12月31日，陆军航空机构改组为独立的航空总司令部，巴亚尔多成为首任总司令。1952年，他再次出任该职，翌年转任驻美国使馆空军武官，并协助安排厄瓜多尔飞行学员赴美受训。"
 ECU_juan_ramon_castro_desc:0 "拉蒙·卡斯特罗·吉洪1915年生于埃斯梅拉尔达斯，是厄瓜多尔海军军官，曾在智利和美国接受军事教育，并历任海军武官、海军随员及海军总司令。1963年7月，他与陆军、空军将领发动政变，推翻总统卡洛斯·胡利奥·阿罗塞梅纳·蒙罗伊，出任军事执政团主席和事实上的国家元首。军政府推行土地改革、调整对外关系，同时以政治镇压和新闻管制引发争议。1966年3月，执政团因内部矛盾和国内压力交出政权。卡斯特罗此后逐渐退出政治，1984年11月1日去世。"
 ECU_julio_salem_gallegos_desc:0 "朱利奥·特奥多罗·萨莱姆·加莱戈斯1900年生于里奥班巴，是黎巴嫩裔厄瓜多尔地主和自由激进党政治家。1934年当选国会议员，后来担任公共工程部长。1944年5月，反对卡洛斯·阿罗约·德尔里奥政府的“五月革命”爆发后，萨莱姆于5月29日至31日短暂主持国家政务，随后将权力移交何塞·马里亚·韦拉斯科·伊瓦拉。晚年他撰写回忆录，1968年9月3日在基多去世。"
 ECU_luis_cabrera_sevilla_desc:0 "路易斯·卡夫雷拉·塞维利亚1915年生于安巴托，是厄瓜多尔职业军人。1963年7月，他与海军上校拉蒙·卡斯特罗·吉洪、陆军上校马科斯·甘达拉·恩里克斯和空军中校吉列尔莫·弗雷莱·波索共同发动政变，推翻卡洛斯·胡利奥·阿罗塞梅纳·蒙罗伊政府，组成军事执政团。执政期间，卡夫雷拉晋升陆军将领。军政府推行土地改革并废除部分传统劳役关系，同时实施新闻管制和政治镇压。1966年，军事执政团在国内压力下交出政权，卡夫雷拉随后逐渐淡出公共生活。"
 ECU_ramon_castro_jijon_desc:0 "拉蒙·卡斯特罗·吉洪1915年生于埃斯梅拉尔达斯，是厄瓜多尔海军军官，曾在智利和美国接受军事教育，并历任海军武官、海军随员及海军总司令。1963年7月，他与陆军、空军将领发动政变，推翻总统卡洛斯·胡利奥·阿罗塞梅纳·蒙罗伊，出任军事执政团主席和事实上的国家元首。军政府推行土地改革、调整对外关系，同时以政治镇压和新闻管制引发争议。1966年3月，执政团因内部矛盾和国内压力交出政权。卡斯特罗此后逐渐退出政治，1984年11月1日去世。"
 ECU_ramon_moran_valverde_desc:0 "拉蒙·莫兰·瓦尔韦德全名拉斐尔·莫兰·瓦尔韦德，1904年生于瓜亚基尔，父亲是阿尔法罗派军官。1924年考入海军学校，后来在多艘舰艇上服役。1941年7月厄秘战争期间，他指挥“阿卜东·卡尔德隆”号炮艇参加洪贝利海战，与秘鲁海军舰艇交火后安全脱离，成为厄瓜多尔海军纪念的重要战例。战后他因作战表现获得晋升，后来被厄瓜多尔方面追授民族英雄称号。1958年5月2日，他在瓜亚基尔去世。"
 PRU_alberto_lopez_flores_desc:0 "洛佩斯·弗洛雷斯是秘鲁陆军上校。1948年10月，曼努埃尔·奥德利亚发动军事政变，推翻布斯塔曼特政府并组建军政府；洛佩斯随后出任公共卫生与社会救助部长，成为军政府内阁成员之一。"
 PRU_alberto_roque_saldias_desc:0 "萨尔迪亚斯1892年5月5日生于委内瑞拉巴伦西亚，幼年随家人返回秘鲁。1908年进入秘鲁海军学校，1912年毕业。1915年，他随秘鲁海军人员赴法国接收军舰。此后长期在海军服役，并先后在贝纳维德斯、布斯塔曼特和奥德利亚政府中担任要职，两度出任部长会议主席，还多次担任海军部长、卫生部长及财政与商务部长。任海军部长期间，他推动创建海军战争学院、国营造船体系、海军医疗设施、潜艇基地和卡亚俄干船坞，对秘鲁海军现代化和本国造船工业建设产生重要影响。1974年5月17日，他在贝拉维斯塔海军医疗中心去世。"
 PRU_armando_reveredo_iglesias_desc:0 "雷沃雷多1896年6月17日生于卡哈马卡省孔图马萨，外祖父为前总统米格尔·伊格莱西亚斯。他于圣马科斯大学攻读医学，1920年转赴马德里大学完成学业并取得外科医生资格。1925年回国后加入军事航空医疗系统，1929年正式编入秘鲁航空兵团，兼具军医与飞行员双重身份。1935年12月13日他完成利马至波哥大的首次不着陆飞行，开创以飞机作外交纽带的先例，获哥伦比亚政府颁授博亚卡十字勋章。1937年他又完成利马至布宜诺斯艾利斯的直飞壮举。在布斯塔曼特政府中，他历任航空部长（1947–1948）、外交部长兼部长会议主席（1948）。此后长期担任秘鲁福塞特航空公司运营总监，1978年6月25日在利马去世，卡亚俄空军基地以其命名。"
 PRU_eloy_g_ureta_desc:0 "乌雷塔1892年12月12日生于奇克拉约，1913年毕业于乔里约斯军事学院，后赴意大利、法国深造军事。1941年厄瓜多尔-秘鲁战争爆发，他晋升准将出任北方军团总司令，7月30日指挥步兵在装甲车支援下攻入厄瓜多尔阿雷尼利亚斯城，为秘鲁陆军首次实战使用装甲兵器。1944年退役后历任省长与陆军总监察长。1945年他代表爱国独立军团参选总统，败于布斯塔曼特。1946年国会授予其大元帅荣誉军衔，表彰其战功，他也是秘鲁军事史上最后一位获此殊荣者。1949至1955年出任驻西班牙大使，1965年10月10日在马德里去世，遗体运回利马安葬。"
 PRU_felipe_tudela_desc:0 "图德拉1915年9月3日生于利马米拉弗洛雷斯区，出身秘鲁政治世家，父亲弗朗西斯科·图德拉曾任秘鲁总理。他在圣马科斯国立大学攻读法律并成为宪法学教授，1937至1939年赴哈佛大学攻读硕士学位。归国后进入外交界，出任秘鲁驻西班牙大使馆三等秘书。1951至1953年他出任秘鲁驻巴西大使。1959年图德拉当选圣伊西德罗区区长，此后四度连任至1962年，任内创建瓦亚马尔卡遗址博物馆，并长期担任秘鲁族谱研究所成员。图德拉晚年因家产纠纷卷入长期法律诉讼，2017年11月4日在利马去世，享年一百零二岁。"
 PRU_jose_bustamante_y_rivero_desc:0 "布斯塔曼特1894年1月15日生于阿雷基帕，法学家、外交官和政治家。早年任大学教授，并于1930年参与起草反对莱吉亚政权的政治宣言，后来历任秘鲁驻玻利维亚和乌拉圭外交代表。1945年，他代表全国民主阵线当选总统，执政初期恢复新闻自由并释放政治犯，但政府很快因经济困难、阿普拉党与军方冲突而陷入危机。1947年，秘鲁宣布对沿海二百海里海域主张主权。1948年10月，战争部长曼努埃尔·奥德利亚发动政变将其推翻，布斯塔曼特流亡海外。1960年，他当选海牙国际法院法官，1967至1970年任院长，后来还参与调停萨尔瓦多与洪都拉斯之间的争端。1980年，他获任终身参议员，1989年1月11日在利马去世。"
 PRU_luis_ramirez_ortiz_desc:0 "拉米雷斯·奥尔蒂斯是秘鲁陆军上校。1948年10月27日，曼努埃尔·奥德利亚发动政变推翻布斯塔曼特政府并组建军政府，拉米雷斯·奥尔蒂斯随后出任财政与商务部长，与其他军人内阁成员共同主持国家行政。"
 PRU_manuel_odria_amoretti_desc:0 "奥德利亚1897年11月26日生于塔尔马，1915年考入乔里约斯军事学院。1941年厄瓜多尔—秘鲁战争中，他作为军官参与萨鲁米亚一带作战，由此声名上升。1947年，奥德利亚出任布斯塔曼特政府的政府与警察部长，后因如何处置阿普拉党问题与总统发生分歧并辞职。1948年10月，他发动军事政变，自任临时总统，解散议会并建立军人政权。1950年，他在缺乏有效竞争的选举中当选总统，执政期间推行公共工程和社会福利政策，同时严厉压制阿普拉党及其他反对力量。1956年，奥德利亚结束任期并恢复部分政治活动空间。1962年他再次参加总统选举，随后支持军方阻止选举结果生效。1974年2月18日，他在利马去世。"
 PRU_oscar_benavides_larrea_desc:0 "贝纳维德斯1876年3月15日生于利马，毕业于由法国军事使团执教的军事学院。1914年他发动秘鲁史上首次建制性军事政变推翻比林格斯特，任临时总统至1915年。此后历任驻西班牙、意大利公使，1921年遭莱吉亚总统逮捕流放，途中夺船改道逃亡。1933年桑切斯·塞罗遇刺后，他继任总统完成余期，签署新宪法并取缔阿普拉党与共产党，1934年与哥伦比亚缔结和平协议。1936年大选因阿普拉党候选人可能获胜而被宣布作废，其任期延长三年，推行公路与港口建设。1939年移交权力后获授大元帅军衔，1945年7月2日在利马去世。"
 PRU_oscar_miro_quesada_desc:0 "米罗·克萨达1884年7月30日生于利马，笔名“拉斯科”，出身拥有《商报》的秘鲁报业家族。他毕业于圣马科斯国立大学，取得人文学科和法学博士学位，青年时期即开始在《商报》撰写科普与评论文章，内容涉及心理学、哲学和现代物理学。此后他在圣马科斯大学任教，并参与犯罪学和人类学研究。1940年，他出版介绍相对论与量子理论的著作，长期致力于向西班牙语读者普及现代科学思想。米罗·克萨达还曾加入多个学术机构，是秘鲁二十世纪重要的新闻工作者、教育者和科普作者。1981年在利马去世。"
 PRU_paul_de_beaudiez_desc:0 "布尔迪兹是秘鲁早期军事航空人员。1920年1月5日，为庆祝新宪法颁布，秘鲁军方组织飞机编队飞越利马。布尔迪兹与沙布里耶中尉驾驶一架考德隆G.3双翼机从贝拉维斯塔机场起飞，飞机在低空转弯爬升时失速坠毁，两人均在事故中死亡。这次事故成为秘鲁军事航空草创时期的重要伤亡事件之一。利马圣伊西德罗区后来有街道以布尔迪兹命名。"
 PRU_rafael_escardo_desc:0 "埃斯卡多1883年生于皮斯科，毕业于利马农业学校，取得农业工程师学位。他长期活跃于秘鲁实业界，曾任多家农业、水泥和电影企业董事，并担任秘鲁工程师协会及农牧业协会主席。埃斯卡多还曾主持利马公共福利会，参与社会救济事务管理。1937年，在奥斯卡·贝纳维德斯总统任内，他出任公共卫生、劳工与社会救助部长，负责秘鲁公共卫生行政事务。因公共服务贡献，他获授秘鲁太阳勋章。"
