 GER_konstantin_von_neurath_desc:0 "1873年生于符腾堡一个贵族外交世家，纳粹德国前期的外交部长。他是职业外交官出身，曾任驻意大利、驻英国大使，1932年起在巴本、施莱歇尔内阁出任外交部长，希特勒上台后留任，以其保守、体面的形象为纳粹早期的扩张外交提供了门面，经手了德国退出国际联盟、《英德海军协定》和重占莱茵兰等事。1937年他加入纳粹党并获授党卫军荣誉军衔。因对希特勒冒进的战争时间表有所保留，1938年他被里宾特洛甫取代，转任无实权的虚衔职务。1939年3月，他被任命为波希米亚和摩拉维亚保护长官，在任内推行新闻审查、取缔政党和工会、按纽伦堡法迫害捷克犹太人，并镇压1939年秋的捷克学生抗议——大学被关闭，约一千二百名学生被送进集中营，九名学生领袖被处决。即便如此，希特勒仍嫌他治理过于温和，1941年9月剥夺其实权、改由海德里希实际掌权，他的保护长官头衔到1943年才正式卸任。战后他在纽伦堡受审，以四项罪名被判处十五年监禁，1954年因健康原因获释，1956年去世。"
