 # 65. 约翰·克雷斯 / AST_john_crace
 CBIO_AST_john_crace_desc:0 "全名约翰·格雷戈里·克雷斯，1887年2月6日生于新南威尔士州冈加林（今属澳大利亚首都领地），1968年5月11日卒，享年81岁。澳大利亚裔英国皇家海军上将，以1942年5月珊瑚海海战中率澳美联合支援编队（第44任务部队）抵御日本主力舰队而留名战史。就读于帕拉马塔国王学校后赴英完成教育，1902年以学员身份加入皇家海军，取得鱼雷军官资格，一战期间在\"澳大利亚号\"战列巡洋舰服役。两战之间多次往返澳大利亚与英国任职，1939年9月奉命接掌澳大利亚舰队，对舰队状态深感忧虑，一度欲辞职，终战时继续留任。1942年日本参战后升任盟军澳新部队海军总司令，率\"澳大利亚号\"和\"芝加哥号\"等澳美巡洋舰组成支援编队参加珊瑚海海战（1942年5月4至8日）：5月7日日本飞机猛烈轰炸下，克雷斯命令舰队采取持续机动和密集防空炮火予以对抗，尽管未获任何空中掩护，编队仍成功遏制了日本运兵船舰队的推进——此举以独立支援编队之力保护了莫尔斯比港，战略意义深远。此后被法恩科姆接替，1942年返英，1944年晋海军上将，战后退役，1968年去世。"
