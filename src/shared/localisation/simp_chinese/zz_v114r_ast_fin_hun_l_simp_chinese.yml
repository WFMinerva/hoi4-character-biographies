 # 33. 马蒂·阿尔尼奥 / FIN_matti_aarnio
 CBIO_FIN_matti_aarnio_desc:0 "马蒂·阿尔马斯·阿尔尼奥（1901年2月24日—1984年12月16日）人称\"Motti-Matti\"（口袋马蒂），是芬兰军官、口袋围歼战法的专家。内战中他在萨翁林纳一带为白卫队作战，后参加爱沙尼亚、拉脱维亚独立战争与奥涅奇远征。冬季战争中他以少校身份指挥第4耶格尔营，在拉多加湖以北的列梅蒂围歼被困苏军；为肃清各个口袋，他一度统辖多达八个营，惯以夜间近战逐个歼灭，因而得名。继续战争中他先后指挥步兵第9团与第56团，参与收复拉多加-卡累利阿。1945年他因牵涉\"藏械案\"被国家警察通缉，遂经瑞典辗转逃往美国与委内瑞拉，并在加拉加斯协助同为流亡者的特尔尼偷渡赴美；1952年局势平稳后返芬，转入保险业。"
