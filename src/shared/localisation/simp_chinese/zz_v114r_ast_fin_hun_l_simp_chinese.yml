 # 43. 劳伊克·拉斯洛 / HUN_laszlo_rajk
 CBIO_HUN_laszlo_rajk_desc:0 "劳伊克·拉斯洛（1909年3月8日—1949年10月15日），匈牙利共产党政治家，生于塞克利乌德瓦尔赫伊（今罗马尼亚）特兰西瓦尼亚撒克逊裔家庭。青年时期加入共产党，因政治活动被布达佩斯大学开除，随后以建筑工人为业。1936年赴西班牙参加内战，任国际纵队拉科西营政委，战后被拘押于法国，1941年返回匈牙利后在地下党中枢任秘书，1944年遭德军逮捕关押，1945年苏军解放后立即投身政权建设。1946年3月起出任内政部长，他主导组建国家保卫局，以压制左右翼异见人士、推行\"萨拉米战术\"、建立共产党一党专政为核心任务，同时出任共产党中央委员会书记。1948年8月改任外交部长，翌年5月被拉科西以\"铁托主义间谍\"罪名逮捕；经折磨与心理摧残后，他在公开审判中认罪，1949年9月被判处死刑，同年10月15日被处决。1955年获平反，其1956年10月6日隆重举行的遗体重葬仪式汇聚二十余万市民，成为此后革命爆发的重要导火索。"
