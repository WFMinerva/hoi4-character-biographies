 # 71. 詹姆斯·坎南 / AST_james_cannan
 CBIO_AST_james_cannan_desc:0 "全名詹姆斯·哈罗德·坎南，1882年8月29日生于昆士兰州汤斯维尔，1976年5月23日卒，享年93岁。陆军少将，一战时期澳大利亚步兵旅长，二战时期四等军需总监，以二战结束时作为一战中最后一位仍在世的澳大利亚将军而留名史册。父为布里斯班银行经理，受教育于布里斯班中央男子州立学校和布里斯班文法学校后进入保险业，1914年以中校身份率第15营在两战之间保持民兵服役。1915年4月25日深夜，坎南率第15营登上安扎克湾，随即被部署在奎因哨——安扎克防线中最险要的暴露阵地之一，坎南亲任哨长。同年8月萨里拜尔战役中，第15营遭受重创，7名军官阵亡，其中包括坎南的兄长大卫·坎南少校。坎南本人因病被撤出安扎克，在海外医疗机构休养后于1916年1月重返指挥，率部转战法国，先后参加波济耶尔战役、穆凯农场战役，后以旅长身份指挥第11步兵旅参加梅西讷战役、布鲁德森德战役和1918年\"百日攻势\"。1926年进入保险业，1932年成为澳大利亚保险公司悉尼分公司总经理，直至1946年。二战中1940年奉召复出，先任行政总监察，后任四等军需总监，赴各战区视察和规划后勤支援，以极大的责任感完成工作，然所获认可与其贡献远不相称。1946年以少将退役，此后继续活跃于保险和退伍军人事务，1976年以93岁高龄辞世，是那一代澳大利亚将军中最后的见证者。"
