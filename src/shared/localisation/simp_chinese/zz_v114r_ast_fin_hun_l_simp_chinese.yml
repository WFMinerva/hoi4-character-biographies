 # 71. 阿尔沃·图奥米宁 / FIN_arvo_tuominen
 CBIO_FIN_arvo_tuominen_desc:0 "阿尔沃·\"波伊卡\"·图奥米宁（1894年9月5日—1981年5月27日）生于海梅恩屈勒一个木匠家庭，绰号\"波伊卡\"（芬兰语\"男孩\"，因其童颜所得）。他早年在坦佩雷当木匠学徒，加入社会民主党并主编《人民报》。1918年内战中他站在红方，被白军短暂拘押后释放。其后他受库西宁影响转向共产主义，参加共产国际第三次大会并见到列宁。他因从事地下活动两度入狱。1932年出狱后赴莫斯科，入列宁学校学习，1934年出任芬兰共产党总书记，兼任共产国际执委会主席团委员。他亲历了斯大林大清洗的恐怖。1938年他设法离开莫斯科前往斯德哥尔摩。1939年11月冬季战争前夕，莫斯科召他回去——据他所述是为了让他出任苏联扶植的泰里约基傀儡政府首脑，但他断然拒绝，声称\"芬兰工人必须保卫芬兰\"，并命令芬共地下组织不得协助红军。库西宁遂代替他出任该职。此后他与苏联彻底决裂，发表反共小册子。1956年他回到芬兰，出版三卷回忆录《克里姆林的钟声》等，成为畅销书，深刻影响了芬兰人对苏联与共产主义的认知。"
