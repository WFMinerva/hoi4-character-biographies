 # 19. 塔韦蒂·拉蒂凯宁 / FIN_taavetti_laatikainen
 CBIO_FIN_taavetti_laatikainen_desc:0 "塔韦蒂·拉蒂凯宁（1886年7月27日—1954年4月15日）生于豪基沃里，是芬兰步兵上将、耶格尔运动成员，因治军严而公允，在预备军官学校得\"帕帕\"（老爹）之名。他1916年赴德入普鲁士皇家第27耶格尔营，1918年回国参加内战（白军），战前曾长期主持预备军官学校。冬季战争中他指挥第1师在卡累利阿地峡作战，战争末期升任军长。继续战争中，他率第二军于1941年攻入卡累利阿地峡、切断拉多加湖以北苏军的陆上联系，10月获颁曼纳海姆十字勋章二级，并升中将，其后长期指挥马塞尔卡集群。1944年3月，他转任第四军军长，在卡累利阿地峡迎击苏军的维堡-彼得罗扎沃茨克攻势，参与了决定性的塔利-伊汉塔拉之战。战后他历任师长、军长与步兵总监，1948年以步兵上将军衔退役。"
