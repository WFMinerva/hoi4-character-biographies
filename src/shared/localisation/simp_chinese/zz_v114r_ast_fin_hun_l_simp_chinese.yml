 # 36. 乔治·麦金诺尔蒂 / AST_george_mackinolty
 CBIO_AST_george_mackinolty_desc:0 "全名乔治·约翰·威廉·麦金诺尔蒂，1895年3月24日生于维多利亚州朗加塔，1951年2月24日卒于维多利亚州拉维顿皇家澳大利亚空军基地医院，享年55岁，死于突发癌症。皇家澳大利亚空军后勤事务航空准将，澳大利亚空军历史学家艾伦·斯蒂芬斯称其为\"皇家澳大利亚空军史上最重要的后勤军官\"。马车车身匠出身，1914年8月随即参战，以机械工身份加入澳大利亚飞行团，同年赴美索不达米亚随皇家飞行队第30中队参战，经历库特包围战，1916年10月嘉奖一次。一战后加入1921年新组建的皇家澳大利亚空军，此后二十余年持续担任空军装备和后勤核心岗位，历任运输与装备处长、装备处长。1937年获OBE勋章。二战爆发后升为供应与装备事务航空准将，1942年6月升代理空军准将，1948年晋空军少将，全程统筹皇家澳大利亚空军在太平洋战役中的器材、零件和供应链运转。1951年1月骤患癌症，2月24日在医院去世，未及看到晋升正式生效，获空军葬礼，是澳大利亚飞行团1914年原始成员中最后一位仍在服役者。"
