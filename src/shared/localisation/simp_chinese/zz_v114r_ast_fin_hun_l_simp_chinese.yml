 # 24. 莱斯利·莫斯黑德 / AST_leslie_morshead
 CBIO_AST_leslie_morshead_desc:0 "全名莱斯利·詹姆斯·莫斯黑德，1889年9月18日生于维多利亚州巴拉腊特，1959年9月26日卒，享年70岁。昆士兰教师出身，一战以私兵身份入伍第2步兵营，历经加里波利、西奈和西线各场战役，以少校退役；两战之间在东方汽船公司经商，并维持民兵旅长身份。1941年2月出任第9师师长，部下暗称其\"明苟无情\"，因其深思时眯眼摩颏的习惯与漫画《飞侠哥顿》中的反派如出一辙。同年4月10日托布鲁克遭隆美尔非洲军团包围，莫斯黑德奉命守城两个月，实际以积极防御——每夜出击、密集反扑——将攻势彻底遏住，坚守231天至1941年11月27日英第8集团军解围，守军由此获\"托布鲁克老鼠\"荣誉绰号，本人获KBE爵位并晋中将。1942年10月第二次阿拉曼战役（10月23日至11月11日）中，第9师在北翼实施关键突破，协助蒙哥马利实现沙漠大捷。1943年回国任第2军军长，主导新几内亚芬什哈芬和马当战役；1945年率第1军指挥婆罗洲战役，战后经商，1959年去世。"
