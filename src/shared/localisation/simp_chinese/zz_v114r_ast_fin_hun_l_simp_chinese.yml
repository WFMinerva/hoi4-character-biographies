 # 54. 斯坦利·戈布尔 / AST_stanley_goble
 CBIO_AST_stanley_goble_desc:0 "全名斯坦利·詹姆斯·戈布尔，1891年8月21日生于维多利亚州克罗伊登，1948年7月24日因高血压脑血管病卒于维多利亚州海德尔堡，享年56岁。皇家澳大利亚空军副元帅，三度出任空军参谋长，以与理查德·威廉姆斯的长期轮替与竞争著称。因早年体检不合格曾无法加入澳大利亚帝国远征军，后改道投入皇家海军航空服务队，一战在西线击落10架成为王牌飞行员，获DSO和DSC勋章。1921年协助组建独立皇家澳大利亚空军。1924年与艾弗·麦金太尔驾驶单引擎费尔里IIID水上飞机，历时44天完成澳大利亚首次环澳航行（全程约13600公里），总理布鲁斯称其为\"航空史上最了不起的成就之一\"；两人获颁英国皇家航空俱乐部不列颠尼亚奖杯和CBE勋章。与刻板专制的威廉姆斯形成鲜明对比，戈布尔性格轻松开朗，却在参谋长职位上始终处于威廉姆斯阴影之下，本人亦曾抱怨威廉姆斯\"将空军视为自己的私产\"。二战前夕任参谋长期间力主建立自主的空中远征力量、抵制帝国航空训练计划对本土防御力量的稀释，因此与孟席斯政府产生尖锐分歧；孟席斯决意引进英国军官执掌空军，1940年1月戈布尔辞职，\"悻然而去\"。战争余年驻守加拿大出任空军联络官，1946年退役，1948年去世。"
