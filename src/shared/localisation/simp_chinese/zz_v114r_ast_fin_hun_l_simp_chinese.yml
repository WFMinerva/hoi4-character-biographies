 # 54. 延德劳希克·哲尔吉 / HUN_gyorgy_jendrassik
 CBIO_HUN_gyorgy_jendrassik_desc:0 "延德劳希克·哲尔吉（1898年5月13日—1954年2月8日），匈牙利物理学家与机械工程师，出生于布达佩斯，先后就读于布达佩斯约瑟夫工业大学及柏林大学，曾旁听爱因斯坦与普朗克的课程，1922年获机械工程文凭。1927年起加入冈茨股份公司，由工程师起步逐步晋升，主导开发了享誉国际的\"延德劳希克发动机\"系列——这款高速四冲程柴油机以预燃室燃烧室与弹簧驱动燃料泵为核心创新，广泛用于铁路机车及多瑙河航运，并在多国取得世界专利。1936年自立研究公司，1937年成功运行一台百马力试验性燃气涡轮；此后设计的CS-1涡桨发动机原型于1940年首次台架运转，成为世界上第一台运行的涡桨发动机，具有里程碑意义。1939年任总工厂副总裁，1942年被任命为全厂总裁（兼任至1945年）。1943年当选匈牙利科学院通讯院士，然因战乱未能发表就职演讲。布达佩斯围城战期间研发工作被迫中断；战后无法继续燃气涡轮研究，遂移居伦敦，在英国继续从事工程工作，直至1954年2月8日辞世。"
