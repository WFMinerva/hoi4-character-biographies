 # 68. 谢雷迪·尤斯蒂尼安·哲尔吉 / HUN_jusztinian_seredi
 CBIO_HUN_jusztinian_seredi_desc:0 "谢雷迪·尤斯蒂尼安·哲尔吉（1884年4月23日—1945年3月29日），匈牙利天主教枢机主教与埃斯泰尔戈姆大主教，全名哲尔吉·谢雷迪，出生于蒂亚科夫采（今斯洛伐克），俗名原为格奥尔格·萨勒特尔，1901年加入本笃修会后改取修道名。在罗马圣安塞尔莫高等学院系统研究教会法典，与彼得罗·加斯帕里枢机主教共同主编九卷本《天主教法典法源汇编》（1926—1939年），由此跻身国际最杰出的教会法学家之列。1927年11月教皇庇护十一世任命他为埃斯泰尔戈姆大主教兼匈牙利枢机主教，1928年1月正式就职，成为匈牙利天主教会最高领导人。任内在议会上院就席，1938年他出席了庇护十二世（时任枢机主教帕切利）共同主持的布达佩斯国际圣体大会。战时他立场复杂：1934年公开声明天主教神父不得支持纳粹主义，却又参与投票支持1938年反犹太法律；1939年波兰难民大量涌入匈牙利时，他积极动员教会机构提供救助，协助数千名波兰犹太儿童藏匿与庇护。1944年4月公开谴责德占当局对犹太人的迫害与驱逐，但未能发布全国性牧函。布达佩斯围城战期间于1945年3月29日在埃斯泰尔戈姆辞世，继任者为后来饱受共产党迫害的闵森迪枢机主教。"
