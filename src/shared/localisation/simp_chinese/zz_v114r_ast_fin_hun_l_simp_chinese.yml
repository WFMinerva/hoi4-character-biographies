 # 57. 拉科西·贝洛 / HUN_bela_rakosi
 CBIO_HUN_bela_rakosi_desc:0 "拉科西·贝洛（1841年—卒年不详），匈牙利医师，生于奥恰德（今匈牙利），出身改名为\"拉科西\"的克雷姆斯纳家族——其父于1867年将家族姓氏由克雷姆斯纳统一改为拉科西，子女随之更名。他是匈牙利著名作家珍诺·拉科西和维克托尔·拉科西的兄弟，属同一文化家族而非与共产党领袖马加什·拉科西（原姓罗森菲尔德）有所关联。拉科西·贝洛在维也纳大学攻读医学，1864年获博士学位，先后出任杰尔吉俄森特米克洛什县医生、瓦茨州立医师及布达佩斯警察医官，长期参与匈牙利皇家医学会活动，并曾在多份学术期刊发表传染病与精神病学相关论文。"
