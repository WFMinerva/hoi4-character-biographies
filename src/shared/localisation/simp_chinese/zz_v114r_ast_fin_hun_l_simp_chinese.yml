 # 32. 阿尔内·西赫沃 / FIN_aarne_sihvo
 CBIO_FIN_aarne_sihvo_desc:0 "阿尔内·西赫沃（1889年11月22日—1963年6月12日）生于维罗拉赫蒂一个教师家庭，是芬兰将领与政治人物。他原在赫尔辛基大学攻读医学，后赴德国受训成为耶格尔。内战中，他指挥白军的卡累利阿前线（萨伊马湖与拉多加湖之间），因年轻、出身猎手且操芬兰语，一度被视为曼纳海姆的替代人选。然而他不满军中亲德倾向，加之倾向共和制，于1918年离开军队。其后他于1926至1933年出任国防军总司令；1932年门察拉暴动中，他作为总司令坚决反对叛乱者。二战期间总司令为曼纳海姆，西赫沃则在战后1946至1953年再度出任国防军总司令。"
