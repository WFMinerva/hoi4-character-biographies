 # 15. 埃尔基·拉帕纳 / FIN_erkki_raappana
 CBIO_FIN_erkki_raappana_desc:0 "埃尔基·约翰内斯·拉帕纳（1893年6月2日—1962年9月14日）生于奥卢约基，是以荒野森林作战见长的芬兰少将，有\"森林将军\"之称。他1916至1918年在普鲁士皇家第27耶格尔营服役，1918年参加内战（白军）。冬季战争中他指挥北卡累利阿集群。继续战争期间，他长期统率独立作战的第14师，1941年率部深入推进至鲁卡耶尔维（鲁戈泽罗）。1944年，他指挥\"拉帕纳集群\"在伊洛曼齐之战中，于密林里合围并击溃苏军两个师——这是芬苏间最后一场大规模战役，也是芬军的一场决定性防御胜利。他是第三位曼纳海姆十字勋章获得者（1941年8月）。战后他曾任军需总监，但其升任更高职务的提名屡因苏联方面的反对受阻，1952年以少将军衔退役。"
