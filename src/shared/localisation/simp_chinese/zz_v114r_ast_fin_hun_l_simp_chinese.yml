 # 66. 约翰·拉瓦拉克 / AST_john_lavarack
 CBIO_AST_john_lavarack_desc:0 "全名约翰·达德利·拉瓦拉克，1885年12月19日生于昆士兰州布里斯班袋鼠角，1957年12月4日卒，享年71岁。澳大利亚陆军中将兼首任澳大利亚本土出生的昆士兰总督（1946—1957年）。布里斯班文法学校毕业，1905年入皇家澳大利亚炮兵，一战中在巴尔干战役和法国西线积累参谋经验。两战之间历任参谋和指挥职务，1933年任邓楚恩皇家军事学院院长，1935年升少将出任陆军参谋总长，任内持续警告澳大利亚过度依赖新加坡战略、忽视本土陆军建设，多次与政府和文官体系产生尖锐摩擦。二战中接掌第7师，前往北非，1941年4月奉中东最高司令韦维尔命令组织并统筹托布鲁克防御，分析防御要点后选择坚守外层红线防线，随即部署莫斯黑德的第9师扼守工事，并向韦维尔报告\"四个月的给养、高昂的士气和坚固的工事\"支撑长期抵抗完全可行，从而奠定托布鲁克守城战的战略基础。随后率第7师和英印法联合部队指挥叙利亚-黎巴嫩战役，以流畅的多国协调捷报于1941年7月12日赢得停战。晋中将后任第1军军长。太平洋战争爆发后赴爪哇，1942年初奉命返澳任澳大利亚部队代理总司令，待布莱梅就任后转任第一澳大利亚集团军司令，负责防守昆士兰和新南威尔士。1944年赴华盛顿任军事使团团长，代表澳大利亚出席联合参谋长委员会，并参加1945年旧金山联合国成立大会军事顾问工作。1946年10月就任昆士兰首任澳大利亚本土出生总督，任至1957年因病去世。"
