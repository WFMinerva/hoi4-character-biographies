 # 73. 高尔鲍伊·尚多尔 / HUN_sandor_garbai
 CBIO_HUN_sandor_garbai_desc:0 "高尔鲍伊·尚多尔（1879年3月27日—1947年11月7日），匈牙利社会民主党政治家，生于基什孔哈拉什，出身新教工人家庭，早年以泥瓦匠为业，1901年加入匈牙利社会民主党，迅速成为工人运动的有力演说家，历任建筑工人工会要职，并主持全国工人保险基金。1919年3月，他支持社民党与共产党合并，由此在匈牙利苏维埃共和国中出任革命管理委员会主席，身兼国家元首与总理之职。然而实际权力始终掌握在外交人民委员库恩·贝拉手中——正因有他这位社民党人担任名义首脑，党卫军开玩笑称\"他们让盖尔鲍伊来，是为了在安息日有人签署死刑令\"。苏维埃共和国133天后覆灭，他被罗马尼亚军队逮捕，随后出逃布拉迪斯拉发，辗转流亡维也纳，与家人开设餐厅却告破产，在贫困中挣扎多年。1934年奥地利右翼祖国阵线执政后再度出走，定居布拉迪斯拉发，1938年再迁巴黎；德军占领法国期间未参加抵抗运动亦未遭迫害，战后申请返回匈牙利遭拒，1947年11月7日在巴黎辞世。"
