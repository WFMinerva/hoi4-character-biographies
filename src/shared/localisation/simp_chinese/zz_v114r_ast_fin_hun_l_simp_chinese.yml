 # 79. 弗雷德·帕特森 / AST_fred_paterson
 CBIO_AST_fred_paterson_desc:0 "全名弗雷德里克·伍尔诺·帕特森，1897年6月13日生于昆士兰州格拉斯顿，1977年10月7日卒，享年80岁。律师、政治家、工会活动家，澳大利亚历史上唯一一位当选澳大利亚任何一级议会的澳大利亚共产党成员。猪农家庭出身，受教育于格拉斯顿州立学校，以第二名成绩赢得奖学金赴罗克汉普顿文法学校就读，后学习法律。长期活跃于工会运动和澳大利亚共产党基层组织，深根于昆士兰北部的矿工和码头工人群体。1944年代表澳大利亚共产党参加昆士兰州议会选举，在鲍文选区以对手均未预料的方式当选——成为澳大利亚议会史上唯一一位共产党议员。担任州议员期间以工人权益、原住民权利和反征兵立场为政治重心，尽管孤掌难鸣，仍以坚定和朴素的个人风格赢得选民的持续信任。1950年昆士兰引入优先计票制度后，在随之而来的选举中因竞争格局改变而落选，此后终身从事基层法律援助和工会顾问工作，再未重返议会，1977年去世。"
