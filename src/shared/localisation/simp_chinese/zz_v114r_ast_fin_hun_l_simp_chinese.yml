 POLITICS_FIN_EYOLF_MATTSSON_DESC:0 "埃约夫·格奥尔格·马特松（1897年3月22日—1965年5月25日）同样不是芬兰白军将领，而是奥兰岛瑞典语裔出身的红方、苏军将领，有\"红色将军\"之称。他出身奥兰岛一个富裕的瑞典语家庭，父亲为银行经理，曾在赫尔辛基工学院就读，1917年转向激进，内战时投身红方，并曾为革命者打开芬兰银行金库（战后被白方以抢劫银行罪缺席起诉）。1918年他流亡苏俄、加入俄共，在东卡累利阿以营长身份作战并获红旗勋章。他是最早入读伏龙芝军事学院者之一，1920年代任卡累利阿耶格尔营（后扩为旅）指挥官，1931年晋旅级将领，后任师长，并曾任伏龙芝学院战术主任教官。斯大林大清洗中，他于1936至1937年被捕，死刑改判十年劳改，二战期间一直在西伯利亚、哈萨克的劳改营中度过。1957年获平反，1965年病逝于苏联的克拉斯诺卡姆斯克。"

 # 18. 埃里克·海因里克斯 / FIN_erik_heinrichs
 CBIO_FIN_erik_heinrichs_desc:0 "阿克塞尔·埃里克·海因里克斯（1890年7月21日—1965年11月16日）生于赫尔辛基，出身瑞典语裔家庭，是芬兰步兵上将，也是曼纳海姆最为倚重的部属之一。他曾习史与物理、当过报人，后加入耶格尔运动，在普鲁士皇家第27耶格尔营服役；内战中任营长，参加坦佩雷、维堡等战役。冬季战争中他指挥第三军，继而出任地峡军团司令；1940年起任总参谋长。继续战争初期，他指挥卡累利阿集团军（1941—1942）向东卡累利阿推进，其后再任总参谋长直至1944年。1944年3月，他成为第二位获颁曼纳海姆十字勋章一级者。1944年底曼纳海姆出任总统后，他接任国防军总司令（1944—1945），主持复员与对德的拉普兰战争，后因\"藏械案\"相关的政治压力辞职。1948年他作为军事专家参加了赴莫斯科商签《芬苏友好合作互助条约》的代表团。"
