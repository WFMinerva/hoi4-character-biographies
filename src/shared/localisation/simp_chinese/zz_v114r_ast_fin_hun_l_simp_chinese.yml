 # 24. 托伊沃·安蒂凯宁 / FIN_toivo_antikainen
 CBIO_FIN_toivo_antikainen_desc:0 "托伊沃·安蒂凯宁（1898年6月8日—1941年10月4日）并非芬兰白军将领，而是芬兰出身的共产党人与苏联红军军官，流亡芬兰共产党的创建人与领导人之一。他生于赫尔辛基一个工人家庭，内战中曾在红方行政机构任职，赤色一方败北后于1918年流亡苏俄，并在莫斯科参与创建流亡芬共。他毕业于彼得格勒红色军官学校，在俄国内战中于东卡累利阿与芬兰白军作战，1922年1月指挥一支由芬兰赤色分子组成的部队在基马湖之战中以滑雪奇袭击败白军，获红旗勋章。其后他在共产国际与列宁学校任职，并多次潜回芬兰从事地下活动。1934年11月，他在赫尔辛基共产党人莱伊诺的住所被捕，以预备叛国及（依间接证据）杀害一名被俘白军军官罪受审，此案引起国际关注。冬季战争后，他获释并被遣送苏联，1941年10月在阿尔汉格尔斯克附近于蹊跷情形下身亡。"
