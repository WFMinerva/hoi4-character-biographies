 # 63. 瓦里奥·波尔瓦里 / FIN_valio_porvari
 CBIO_FIN_valio_porvari_desc:0 "瓦里奥·瓦尔弗里德·波尔瓦里（1913年11月10日—1993年4月2日）生于西波拉，是芬兰空军战斗机王牌飞行员。1936年入伍，在第26战斗机中队第3分队服役，并在该单位度过了整个二战。冬季战争期间他驾驶布里斯托尔斗牛犬双翼机作战，1940年初击落一架苏军I-16战斗机，取得首个战果。继续战争开战第一天（1941年6月25日），苏军轰炸约罗伊宁机场，他驾驶菲亚特G.50战斗机紧急升空迎击，在一次空战中即击落三架又合击一架SB轰炸机，一举成为王牌。继续战争期间他累计击落五架半（含合击），另有一架未确认与三架受损。他获颁自由十字勋章一级与四级。1947年5月退伍后转务农。"
