 # 12. 凡尼·卢科宁 / FIN_fanni_luukkonen
 CBIO_FIN_fanni_luukkonen_desc:0 "凡尼·玛丽·卢科宁（1882年3月13日—1947年10月27日）是芬兰妇女志愿辅助组织\"洛塔·斯韦尔德\"的长期领袖。需说明的是，她并非军事指挥官：该组织从事看护、防空警戒、后勤补给与文书等非战斗辅助工作，成员名义上不持武器。卢科宁出身教师，1882年生，成长于奥卢。内战后她加入洛塔组织，1929年当选主席。在她领导下，组织从约六万人发展到二战末的二十余万人，成为芬兰乃至当时世界上最大的女性组织。1940年，她成为首位获曼纳海姆授予自由十字勋章一级的女性。1943年她曾赴德，获希特勒授予德意志雄鹰勋章，是唯一获此勋章的非德籍女性。1944年依对苏停战条款，洛塔组织被解散。战后她遭非议、被视为不受欢迎者，1947年因心脏病在赫尔辛基逝世。"
