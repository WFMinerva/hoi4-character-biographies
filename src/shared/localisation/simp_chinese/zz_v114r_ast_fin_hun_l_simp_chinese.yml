 # 47. 卡达尔·亚诺什 / HUN_janos_kadar
 CBIO_HUN_janos_kadar_desc:0 "卡达尔·亚诺什（1912年5月26日—1989年7月6日），匈牙利共产党领袖，原名切尔马内克·亚诺什，出生于阜姆（今克罗地亚里耶卡），私生子，自幼贫苦。1931年加入匈牙利共产党，成为战前地下党的核心组织者。战后历任内政部长（1948—1950年），参与推行拉科西的斯大林主义政策；1951年却遭拉科西清洗，以莫须有间谍罪被判终身监禁，1954年获释平反，1956年7月拉科西下台后重返政治核心，任党中央书记。同年十月革命爆发，他先任纳吉内阁国务部长，却于11月1日秘赴莫斯科，与苏联商定以苏军镇压革命，随即宣布成立\"革命工农政府\"，组织镇压并于1958年秘密处决纳吉。此后他领导匈牙利长达三十二年，以\"古拉什共产主义\"为名推行渐进经济自由化，允许有限私营经济与对西方贸易往来，在东方集团中独树一帜；政治上仍维持一党威权，但逐渐松动文化管制，形成独特的\"软性独裁\"模式。1988年因健康衰退退休，1989年7月6日病逝，同日匈牙利最高法院宣告纳吉无罪，历史的讽刺意味令人唏嘘。"
