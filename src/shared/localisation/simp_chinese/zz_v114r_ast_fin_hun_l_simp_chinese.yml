 # 64. 盖伊·罗伊尔 / AST_guy_royle
 CBIO_AST_guy_royle_desc:0 "全名盖伊·查尔斯·塞西尔·罗伊尔，1885年8月17日生，1954年1月4日卒，享年68岁。英国皇家海军上将，二战期间以借调英国军官身份出任澳大利亚皇家海军第一海军委员（1941—1946年）。1900年以见习军官身份加入英国皇家海军，参加日德兰海战时担任\"马尔伯勒号\"战列舰炮术军官。两战之间历任多个要职，1924年出任驻日海军武官（与科尔文同期），1930年指挥皇家海军炮术学校\"卓越号\"，1933年指挥航空母舰\"光荣号\"。二战初期任第五海务大臣兼海军航空部队总监，1941年转任澳大利亚皇家海军第一海军委员，监督战时舰队扩充，1941年获KCB爵位，1942年晋升海军上将。在任期间澳大利亚皇家海军在北非、地中海、太平洋各战区协同盟军作战，经历\"悉尼号\"沉没（1941年11月）、萨沃岛海战（1942年8月）和珊瑚海海战等重大战事。1946年退役返英，此后在英国上议院担任礼仪职务，1954年去世。"
 AST_guy_royle_desc:0 "全名盖伊·查尔斯·塞西尔·罗伊尔，1885年8月17日生，1954年1月4日卒，享年68岁。英国皇家海军上将，二战期间以借调英国军官身份出任澳大利亚皇家海军第一海军委员（1941—1946年）。1900年以见习军官身份加入英国皇家海军，参加日德兰海战时担任\"马尔伯勒号\"战列舰炮术军官。两战之间历任多个要职，1924年出任驻日海军武官（与科尔文同期），1930年指挥皇家海军炮术学校\"卓越号\"，1933年指挥航空母舰\"光荣号\"。二战初期任第五海务大臣兼海军航空部队总监，1941年转任澳大利亚皇家海军第一海军委员，监督战时舰队扩充，1941年获KCB爵位，1942年晋升海军上将。在任期间澳大利亚皇家海军在北非、地中海、太平洋各战区协同盟军作战，经历\"悉尼号\"沉没（1941年11月）、萨沃岛海战（1942年8月）和珊瑚海海战等重大战事。1946年退役返英，此后在英国上议院担任礼仪职务，1954年去世。"
