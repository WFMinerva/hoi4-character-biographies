 # 30. 阿克塞尔·艾罗 / FIN_aksel_airo
 CBIO_FIN_aksel_airo_desc:0 "阿克塞尔·弗雷德里克·艾罗（1898年2月14日—1985年5月9日）生于图尔库，是芬兰中将、冬季战争与继续战争的首席作战筹划者，实为曼纳海姆麾下芬军的\"二号人物\"。内战中他在白军炮兵服役、参加维堡一带的战斗，战后被保送至法国圣西尔军校及高等军事学院深造，1923年以上尉衔毕业——这一履历在当时芬军军官中颇为罕见。冬季战争伊始，曼纳海姆任命他为军需总长，他长期坐镇米凯利大本营，主管作战计划的拟定与呈递，鲜少亲赴前线，曾自谓\"元帅指挥战争，而我指挥战斗\"。1944年11月他获颁曼纳海姆十字勋章。继续战争结束后，他因牵涉\"藏械案\"被受共产党影响的国家警察逮捕，未经判决而被关押近三年（1945—1948年），后经巴锡基维总统下令释放；因对此事缄口不言，他得了\"沉默的将军\"之号。晚年他曾任国民联合党的国会议员。"
