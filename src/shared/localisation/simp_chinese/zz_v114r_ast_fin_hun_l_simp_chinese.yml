 # 67. 蒂尔迪·佐尔坦 / HUN_zoltan_tildy
 CBIO_HUN_zoltan_tildy_desc:0 "蒂尔迪·佐尔坦（1889年11月18日—1961年8月3日），匈牙利政治家，出生于洛绍茨（今斯洛伐克卢切内茨），受训为加尔文宗牧师，曾赴爱尔兰贝尔法斯特神学院深造。1929年加入独立小农党，1933年及1936、1939年连续当选议员，二战期间坚持反战立场，德军占领后转入地下。1945年战后大选中小农党以57%高票获胜，蒂尔迪于同年11月15日出任总理；1946年2月1日匈牙利共和国宣布成立，他当选为首任总统，成为战后匈牙利短暂民主时期的核心象征人物。然而在共产党以\"萨拉米战术\"逐步蚕食各民主党派的压力下，他于1948年7月被迫辞去总统职务——名义上是因女婿遭腐败指控，实为无力抗拒共产党的政治清洗。此后被软禁于布达佩斯长达数年，直至1956年5月1日获释。1956年十月革命期间以国务部长身份重返纳吉内阁；革命镇压后再度被捕，1958年以纳吉同案被告身份判处六年有期徒刑，1959年4月因年老体衰获特赦释放，此后隐居直至1961年8月3日在布达佩斯辞世。"
