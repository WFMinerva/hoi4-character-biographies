 # 70. 西德尼·罗厄尔 / AST_sydney_rowell
 CBIO_AST_sydney_rowell_desc:0 "全名西德尼·费尔贝恩·罗厄尔，1894年12月15日生于南澳大利亚州洛克利斯，1975年4月12日卒，享年80岁。以科科达小径战役中被解除指挥权的争议经历为人所知，但此后官至陆军参谋总长，其职业生涯的终章有效证明了1942年解职的非凡性。父亲曾任联邦参议员，是南澳大利亚种果人。1911年以首批学员身份进入邓楚恩皇家军事学院，1914年毕业后赴加里波利服役，因感染伤寒1916年初返澳。两战之间历任参谋和指挥职务，升级迅速。1939年出任第6师参谋长，参加希腊战役和叙利亚-黎巴嫩战役，积累了与中东战区各级参谋协作的丰富经验。1942年8月奉布莱梅之命接掌新几内亚部队，主持科科达小径阻击战的初期反攻协调，以有限兵力和匮乏补给坚持稳步阻击日军。然而罗厄尔不愿配合麦克阿瑟总部的\"实时汇报\"要求，仅按约定时间通报事实进展，引发麦克阿瑟对其作战意志的误判。布莱梅在麦克阿瑟压力下于1942年9月将其撤换，以赫林接任。然而后来的历史学家普遍认为罗厄尔在科科达小径的指挥实属稳健，其被解职是美澳联合指挥体制摩擦的牺牲品，而非指挥失当所致。战后获完全平反，历任要职，1950年4月出任陆军参谋总长，1954年12月卸任，以少将晋升中将退役，1975年去世。"
