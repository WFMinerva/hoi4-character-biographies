 # 62. 毛戈什·德热 / HUN_dezso_magos
 CBIO_HUN_dezso_magos_desc:0 "毛戈什·德热（1884年3月1日—1944年6月10日），匈牙利犹太裔建筑师，本名蒙克·德热，出生于包洛什久尔马特（今匈牙利）。1913年以建筑师学位毕业，随后为诺格拉德县地区建设作出重要贡献，代表作品包括该地区萨勒爵会的首座教堂、市政厅、医院扩建工程、女性精神病病房、赌场、警察局、宪兵队营房及财政宫等，并设计了跨伊波利河的步行桥与地区旗帜标志。1920年代加入工程师协会，两战期间还承接匈牙利国防军军事设施建设项目，以此建立起与霍尔蒂体制官员的个人关系。1930年代皈依天主教，其教父巴罗什·帕尔系诺格拉德县首席长官，战时曾出面为他提供庇护，使其得以佩戴黄星却不被关入隔离区。尽管如此，1944年德军占领后他仍遭驱逐，于同年6月10日在阿索德附近随被驱逐的犹太社区行进途中自尽。"
