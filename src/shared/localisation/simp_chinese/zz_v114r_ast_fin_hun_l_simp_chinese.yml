 # 56. 恩斯特·冯·博恩 / FIN_ernst_von_born
 CBIO_FIN_ernst_von_born_desc:0 "恩斯特·维克托·洛伦茨·冯·博恩男爵（1885年8月24日—1956年7月7日）生于佩尔纳，出身瑞典语裔贵族，是芬兰律师、地主与政治家，瑞典族人民党长期的核心人物。他早年习法于赫尔辛基大学，内战中参加白卫队。1919年起连续当选国会议员，直至1954年。1934至1945年及1955至1956年两度出任党主席。他曾三次入阁：1931至1932年任内政部长，在拉普阿运动猖獗之际坚决维护法治秩序；1939至1941年再任内政部长，任期横跨冬季战争与临时和平；1944年任司法部长。继续战争后期，他属主和派，是1943年8月向总统吕蒂递交的\"三十三人请愿书\"签名者之一。1944年9月总理哈克吉尔在莫斯科中风后，作为内阁年长者的冯·博恩临时代理总理两周。他亦是芬兰瑞典语文化的捍卫者，长期出任瑞典人议会主席与多个农业组织的要职，1954年获赫尔辛基大学名誉法学博士。"
