 POLITICS_FIN_ARVO_TUOMINEN_DESC:0 "阿尔沃·\"波伊卡\"·图奥米宁（1894年9月5日—1981年5月27日）生于海梅恩屈勒一个木匠家庭，绰号\"波伊卡\"（芬兰语\"男孩\"，因其童颜所得）。他早年在坦佩雷当木匠学徒，加入社会民主党并主编《人民报》。1918年内战中他站在红方，被白军短暂拘押后释放。其后他受库西宁影响转向共产主义，参加共产国际第三次大会并见到列宁。他因从事地下活动两度入狱。1932年出狱后赴莫斯科，入列宁学校学习，1934年出任芬兰共产党总书记，兼任共产国际执委会主席团委员。他亲历了斯大林大清洗的恐怖。1938年他设法离开莫斯科前往斯德哥尔摩。1939年11月冬季战争前夕，莫斯科召他回去——据他所述是为了让他出任苏联扶植的泰里约基傀儡政府首脑，但他断然拒绝，声称\"芬兰工人必须保卫芬兰\"，并命令芬共地下组织不得协助红军。库西宁遂代替他出任该职。此后他与苏联彻底决裂，发表反共小册子。1956年他回到芬兰，出版三卷回忆录《克里姆林的钟声》等，成为畅销书，深刻影响了芬兰人对苏联与共产主义的认知。"

 # 72. 阿尔波·马蒂宁 / FIN_alpo_marttinen
 CBIO_FIN_alpo_marttinen_desc:0 "阿尔波·库莱沃·马蒂宁（1908年11月4日—1975年12月20日）生于阿拉托尔尼奥，出身铁路职工家庭，两位兄长均为军人并先后阵亡。他1927年入伍，1939年获总参军官资格。冬季战争中，他以上尉军衔出任西拉斯沃所率第9师的参谋长，参加苏穆萨尔米、拉特路与库赫莫之战。继续战争期间，他先后指挥第61步兵团与第三军的参谋部，1943年在斯维尔前线负伤，1944年晋上校。战后他成为\"藏械案\"的核心人物之一——1944年停战后，一批芬兰军官秘密将大量轻武器分散藏匿于全国各地，以备苏联占领时发动游击战。1945年事发，马蒂宁在前部属哈里·耶尔夫帮助下逃往瑞典，翌年携家赴美。1951年获美国国籍后入美国陆军，先任冬季战争专家，后为总参军官，曾在西德与韩国任职，退休前三年驻伊朗担任军事顾问。随他流亡美国的二十一名芬兰军官后来被称为\"马蒂宁的人\"。"
