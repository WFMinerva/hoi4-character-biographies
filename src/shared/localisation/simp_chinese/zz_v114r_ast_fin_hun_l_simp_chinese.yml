 # 76. 阿德拉·潘克赫斯特·沃尔什 / AST_adela_walsh
 CBIO_AST_adela_walsh_desc:0 "全名阿德拉·康斯坦夏·玛丽·沃尔什（娘家姓潘克赫斯特），1885年6月19日生于英格兰曼彻斯特乔尔顿于梅德洛克，1961年5月23日卒于澳大利亚，享年75岁。英国参政权运动领袖埃米琳·潘克赫斯特最小的女儿，以政治信仰跨越从激进妇女参政权运动、反战和平主义、共产主义到右翼民族主义的巨大弧线而著称于澳大利亚历史。英国时期积极参与妇女参政联合会的激进行动，多次系狱，因与母亲克里斯托贝尔在运动方向上产生分歧，1914年携带母亲给予的20英镑和一封介绍信单身移居澳大利亚，从此与家人天各一方。抵澳后加入维达·戈德斯坦的妇女政治协会，以雄辩的演讲才能投身反战和反兵役运动。1917年8月率约1.5万名女性从国库花园游行至议会大厦，抗议生活物资价格飞涨；遭捕后拒绝接受总理休斯提出的\"不再公开演讲即可获释\"的条件，服完数月刑期。1917年9月被捕前夕与工会领袖汤姆·沃尔什结婚。1920年夫妻二人共同出席创建澳大利亚共产党的大会，担任初期领导职务，然两年内因对共产国际指令的失望而淡出。1927年另起炉灶，创办反共的澳大利亚帝国女性协会。1941年与珀西·斯蒂芬森共同参与创建极右翼民族主义团体\"澳大利亚优先运动\"，因倡导对日和平、拒绝支持英帝国参战立场，1942年被澳大利亚政府以\"可能为日本人提供协助\"的嫌疑拘押并关押至战争结束。丈夫1943年去世，此后渐渐淡出公众视野，1960年皈依天主教，1961年去世。"
