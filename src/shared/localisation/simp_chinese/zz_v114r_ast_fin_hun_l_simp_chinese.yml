 # 51. 奥托·布鲁辛 / FIN_otto_brusiin
 CBIO_FIN_otto_brusiin_desc:0 "奥托·布鲁辛（1906年6月2日—1973年10月31日）生于赫尔辛基，是芬兰法学家与法哲学家。他早年就读赫尔辛基大学法学专业，1938年以博士论文《法官在无规范时的裁量》奠定了芬兰现代法理学的基础。二战期间他在民卫队总部法律部门任职。1945年4月至1946年1月，他出任战后国家治安警察首任主管——正值该机构受共产党影响极深的时期，但他任职不久即去职。其后他重返学术界，1949年起在赫尔辛基大学执教，1955年任法学副教授，1961年转任图尔库大学法学教授。他的学术关怀以法律史与罗马法为中心，深受哲学人类学与法律社会学的影响，主张法律规范只有在其所产生的社会中才能得到理解。1957年他当选国际法哲学与社会哲学学会首任副会长。其女卡丽娜·苏翁尼奥日后出任芬兰教育部长（1982—1986年）。"
