 # 41. 劳利·提艾尼 / FIN_lauri_tiainen
 CBIO_FIN_lauri_tiainen_desc:0 "劳利·塔韦蒂·提艾尼（1891年2月15日—1958年9月18日）生于兰塔萨尔米，是二战时期的芬兰上校。他1915年加入耶格尔运动，在普鲁士皇家第27耶格尔营受训作战，化名\"Pfadfinder\"（探路者）。1917年他曾带领一小队志愿者搭乘运械船 S/S Equity 抵达瓦萨，为白军输送武器。内战后，他历任营长、军校教官、团长与萨翁旅旅长，1933年出任卡累利阿军区司令。冬季战争中，他指挥第12师在拉多加-卡累利阿的科拉河前线作战，但于1940年1月底因病离职，由安特罗·斯文松接替。其后他在后方部队任职，1945年退役。"
