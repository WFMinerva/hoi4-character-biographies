 # 34. 鲁本·拉古斯 / FIN_ruben_lagus
 CBIO_FIN_ruben_lagus_desc:0 "恩斯特·鲁本·拉古斯（1896年10月12日—1959年7月15日）是芬兰少将、耶格尔运动成员，被称为\"芬兰的隆美尔\"，在发展芬兰装甲兵中居于核心地位。他早年随兄长赴德，在普鲁士皇家第27耶格尔营服役，内战中任营长。冬季战争期间他任地峡军团的军需主任；战后受命组建第1（装甲）耶格尔旅——芬兰首支具规模的装甲部队。继续战争中，他率部成为最早越过旧国界的芬军，在奥涅奇/图洛斯河方向取得突破，一路挺进至斯维尔河，并参与攻占彼得罗扎沃茨克。1941年7月22日，他成为首位获颁曼纳海姆十字勋章者。1942至1944年他指挥芬兰装甲师，参加塔利-伊汉塔拉决战；拉普兰战争中又率\"拉古斯集群\"驱逐德军。"
