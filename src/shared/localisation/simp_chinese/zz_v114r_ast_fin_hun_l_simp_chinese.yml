 # 13. 劳里·特尔尼 / FIN_lauri_torni
 CBIO_FIN_lauri_torni_desc:0 "劳里·阿兰·特尔尼（1919年5月28日—1965年10月18日）生于维堡，后以\"拉里·索恩\"之名为美国效力，是一位先后为三个国家作战的军人。他1938年入芬兰军队，在冬季战争与继续战争中作战，官至上尉；1941年曾赴维也纳接受七周武装党卫军训练。继续战争期间，他指挥深入敌后的\"特尔尼支队\"，战功卓著，获颁芬兰最高荣誉曼纳海姆十字勋章；其部属中包括日后的芬兰总统科伊维斯托。二战末他向英军投降，后逃回芬兰，因曾加入德军而以叛国罪受审、被判刑，1948年获巴锡基维特赦。其后他辗转流亡，1950年偷渡赴美，1954年依《洛奇—菲尔宾法》加入美国陆军，服役于特种部队。越战期间，他于1965年10月在老挝执行秘密任务时直升机坠毁身亡，追授少校。其遗骸1999年寻获，2003年安葬于阿灵顿国家公墓——他是已知唯一安葬于此的前武装党卫军成员。其复杂经历在芬兰至今仍有争议。"
