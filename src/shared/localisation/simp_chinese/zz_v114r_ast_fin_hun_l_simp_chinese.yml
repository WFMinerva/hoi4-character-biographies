 # 7. 瓦西里·维希瓦尼·冯·哈布斯堡 / HUN_vasyl_vyshyvanyi
 CBIO_HUN_vasyl_vyshyvanyi_desc:0 "瓦西里·维希瓦尼·冯·哈布斯堡（1895年2月10日—1948年8月18日），原名威廉·弗兰茨大公，哈布斯堡-洛林家族成员，生于洛希尼岛（今克罗地亚）。父亲卡尔·斯蒂芬大公原计划令其扮演波兰君主候选人，他却在一战中主动选择了乌克兰事业：在东线与乌克兰西奇步枪兵并肩作战，士兵们赠予他传统刺绣衬衫（维希万卡），他要求部下以乌克兰名\"瓦西里\"称呼他，由此得名\"维希瓦尼\"（刺绣者之意）。曾指挥\"大公威廉战斗群\"在南乌克兰作战，以保护平民、尊重农民土地权利著称，深得当地民众爱戴。一战后以化名流亡于维也纳、西班牙、巴黎之间，矢志推动独立乌克兰建立并以自身为候选君主，终生未能实现。1947年在维也纳被苏联反间谍机构\"斯梅尔什\"逮捕，以协助乌克兰民族主义分子为名押至基辅卢基扬诺夫卡监狱，被判处25年古拉格苦役。未及转送劳改营，即于1948年8月18日因肺结核恶化死于狱中医院，以哈布斯堡大公之身长眠于异国囹圄。"
