 # 9. 托马斯·布莱梅 / AST_thomas_blamey
 CBIO_AST_thomas_blamey_desc:0 "全名托马斯·亚伯特·布莱梅，1884年1月24日生于新南威尔士州达尔比，1951年5月27日卒于墨尔本。澳大利亚历史上唯一晋升至陆军元帅军衔的军人。早年任小学教师，1906年入澳大利亚皇家军事学院，后赴英国坎伯利参谋学院深造。一战期间在加里波利登陆和西线担任第一澳大利亚军团参谋职务，参与策划1918年8月8日阿米昂战役等重大攻势，以出色参谋才能获多枚嘉奖。战后出任维多利亚警察局长（1925—1936年），因私生活丑闻（1931年妓院事件）引发争议。二战爆发后重返军旅，1940年出任澳大利亚帝国远征军总司令，参加北非战役。1941年托布鲁克围城战期间与其属下的莫斯黑德第9师共守城池，希腊和克里特岛撤退行动中负责协调撤退。1942年3月回国后任澳大利亚陆军总司令，接受美国将领麦克阿瑟指挥，但两人关系持续紧张——布莱梅坚持澳军自主指挥权，麦克阿瑟则倾向直接掌控。新几内亚战役期间，1942年9月撤换科科达战线指挥官罗厄尔，引发争议，但最终科科达危机在其监督下化解。1943年后主导新几内亚丛林攻势，参与拉包尔孤立和博干维尔战役。1950年获封陆军元帅，1951年去世。"
