 # 55. 弗兰斯·海尔米宁 / FIN_frans_helminen
 CBIO_FIN_frans_helminen_desc:0 "弗兰斯·爱德华·海尔米宁（1894年2月6日—1957年9月21日）生于瓦尔凯阿萨里（今属俄罗斯），是芬兰中将。他青年时在维堡长大，1912年入大学，一战爆发后转入军旅，在沙俄骑兵军官学校受训，1915年毕业后在东线参战。芬兰独立后他入芬兰正规军，历任炮兵连长、营长、团长，1929年以首名成绩毕业于陆军大学，获总参军官资格，并于1929至1932年在陆军大学执教炮兵战术。1937至1938年他出任防空炮兵团团长，其后调任空军司令部防空部队总监。冬季战争中他任空军司令部的防空部队司令，负责全国防空作战；临时和平期间指挥防空旅。继续战争期间他继续主管防空。战后他于1945年出任防空炮兵司令，1946年7月至1952年11月任空军司令，其间曾出席1946至1947年的巴黎和约谈判。他的司令任期恰逢芬兰空军最困难的和平年代——巴黎和约的限制叠加装备与训练的严重不足，空军实力持续滑坡。1952年他转任国防司令部防空总监，1954年退役。"
