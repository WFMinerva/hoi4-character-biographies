 # 27. 松鲍特海伊·费伦茨 / HUN_ferenc_szombathelyi
 CBIO_HUN_ferenc_szombathelyi_desc:0 "松鲍特海伊·费伦茨（1887年5月17日—1946年11月4日），匈牙利总参谋长，原名费伦茨·克瑙斯，德意志族背景，出生于匈牙利境内。1902年入读奥匈军校，历经一战，1926年起在路多维卡军事学院执教。1941年9月，霍尔蒂任命他接替过度亲德的韦特·亨里克，出任总参谋长，任期延续至1944年4月德军占领匈牙利为止。与前任相比，他对苏德战争前景持相对审慎态度，曾多次拖延德国要求扩大出兵的压力，却也在1942年4月将第2集团军送上东线。早在1942年1月，他授权费凯泰哈尔米-采伊德纳率军在巴奇卡实施\"清剿\"，演变为新萨德大屠杀；历史学界对其在此事件中应承担的责任多有争议。1944年3月德占后遭德国软禁，被箭十字党逮捕后流转各处，最终经美军移交。战后被引渡至南斯拉夫，以新萨德屠杀相关罪行接受审判，1946年11月4日在彼得罗瓦拉丁被枪决。"
