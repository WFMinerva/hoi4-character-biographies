 # 37. 乌尔霍·凯科宁 / FIN_urho_kekkonen
 CBIO_FIN_urho_kekkonen_desc:0 "乌尔霍·卡列瓦·凯科宁（1900年9月3日—1986年8月31日）生于皮耶拉韦西一个林业工头家庭，1936年取得法学博士。他出身民族主义青年运动，曾加入学院派卡累利阿学会，但因不满该会支持1932年门察拉暴动而与百余名温和派一同退出，并于1930至1932年主持芬兰语联盟。1931至1933年旅德期间，他目睹希特勒崛起，转而警惕极右势力，1934年著《民主的自卫》。1933年他加入农业联盟，1936年当选议员；任司法部长（1936—1937年）期间，他试图以法律手段取缔极右的爱国人民运动，即所谓\"凯科宁的把戏\"，但被最高法院判为违法而中止。其后他任内政部长（1937—1939年）。冬季战争与继续战争期间他均不在内阁之列，并于1940年3月投票反对莫斯科和约。日后（1956—1982年）他将成为芬兰任期最长的总统。"
