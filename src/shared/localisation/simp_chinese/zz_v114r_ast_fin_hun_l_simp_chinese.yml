 # 59. 曼迪·汉努拉 / FIN_mandi_hannula
 CBIO_FIN_mandi_hannula_desc:0 "阿曼达（曼迪）·汉努拉（1880年3月25日—1952年1月9日）生于胡伊蒂宁，是芬兰女教师与国家进步党政治家。她先后于1919至1930年、1936至1945年两度出任国会议员。作为进步党人，她的政治立场属自由派中间偏左，关注教育与社会事务。在议员任职之外，她也是家庭杂志《家园之火》的撰稿人。"
