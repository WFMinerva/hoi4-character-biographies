 # 26. 雷金纳德·桑德斯 / AST_reginald_saunders
 CBIO_AST_reginald_saunders_desc:0 "全名雷金纳德·沃尔特·桑德斯，1920年8月7日生于维多利亚州普尔宁附近弗拉明汉原住民保留地，1990年3月2日因冠心病卒于堪培拉，享年69岁，骨灰撒于贡迪马拉族世代之地孔达湖。澳大利亚陆军史上第一位获任军官的原住民族裔，家族从军传统深厚：父亲克里斯参加一战，舅舅威廉·罗林斯以第29步兵营下士在法国获军事勋章。14岁辍学做锯木工，1940年4月入伍，随第2/7步兵营赴北非、希腊和克里特岛参战；克里特岛撤退中藏匿于当地村民家近一年，后乘英国潜艇脱险。1942年赴新几内亚，弟弟哈里同期在科科达战线阵亡，桑德斯本人在马普里克附近膝部中弹入院。凭借在战场上自发接掌指挥的出色表现，其营长提名他参加军官选拔。1944年11月26日受委少尉，成为澳军史上首位原住民军官；总司令布莱梅坚持按正常程序审批，以彰显无种族区别原则。1950年朝鲜战争爆发后再度入伍，1951年升大尉指挥第3营C连参加甲旺战役，所属营获美国总统部队嘉奖。1954年退役，1969年任土著事务部联络官，1971年获MBE勋章，1985年任澳大利亚战争纪念馆委员，1990年去世。"
