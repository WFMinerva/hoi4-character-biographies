 # 62. 班·奇夫利 / AST_ben_chifley
 CBIO_AST_ben_chifley_desc:0 "全名约瑟夫·本尼迪克特·奇夫利，1885年9月22日生于新南威尔士州巴瑟斯特，1951年6月13日因心脏病猝发卒于堪培拉市区医院途中的救护车上，享年65岁。澳大利亚第十六任总理（1945—1949年），工党领袖（1945—1951年），被后人视为工党历史上最伟大的总理之一，其\"山丘上的灯光\"演讲成为工党精神的不朽宣言。爱尔兰裔天主教家庭出身，父为铁匠。5岁随家庭经济困难被送往祖父农场生活，13岁返回巴瑟斯特上中学，中途辍学入铁路工作。1914年成为新南威尔士州最年轻的一等蒸汽机司机，同年与伊丽莎白·麦肯齐结婚。积极参与铁路工会活动，1917年因参加罢工被开除，后获复职。1928年在三度角逐议席后终于进入联邦众议院，1931年出任斯卡林政府国防大臣。同年大选失去议席，随后花九年时间调研货币与银行制度，坚定了国有化银行的信念。1940年重返议会，1941年柯廷政府上台后出任财政大臣，此后七年持续掌管国家财政。战时严格统管经济，1942年兼任战后重建大臣。柯廷1945年7月5日去世，奇夫利同月13日接任总理，随即在原子弹投下和日本投降的历史时刻执掌国家。战后主导大规模社会建设：推动斯诺山水力发电计划、建立全民医疗体系框架、设立澳大利亚国立大学、建立移民计划并组建澳大利亚安全情报局（1949年）。1948至1949年尝试将私营银行国有化，引发宪法诉讼并成为1949年败选的主因。此后任反对党领袖至1951年去世，工党此后22年未能重返执政。"
