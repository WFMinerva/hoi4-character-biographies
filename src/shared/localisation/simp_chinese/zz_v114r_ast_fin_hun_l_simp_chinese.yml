 # 29. 埃里克·费尔特 / AST_eric_feldt
 CBIO_AST_eric_feldt_desc:0 "全名埃里克·奥古斯塔斯·费尔特，1899年1月3日生于昆士兰卡德韦尔，1968年3月12日因心肌梗塞卒于布里斯班新农区，骨灰撒于巴布亚新几内亚马当附近的海岸观察员纪念灯塔旁海面。瑞典移民后裔，1913年以奖学金入澳大利亚皇家海军学院，一战期间赴英在\"加拿大号\"等舰服役，1920年晋少尉，1922年因厌倦海军生涯退出正规军，转任新几内亚托管地公务员，在岛链间深耕十余年。1939年9月重入海军，受海军情报长官朗委派主持莫尔斯比港情报站，随即以舟艇、飞机和徒步走遍巴布亚、新几内亚、所罗门群岛和新赫布里底群岛，将散布各处的种植园主、矿工和行政官员纳入情报网络，借儿童故事书公牛\"斐迪南\"——那头宁坐树下闻花不愿打架的公牛——命名组织代号，提醒观察员本职是潜伏侦察而非公开战斗。1942年4月观察员正式纳入皇家澳大利亚海军志愿后备役，使其获得军人身份与抚恤权利。日军入侵索罗门群岛后，观察网持续向盟军预警日机出动，美国海军上将哈尔西盛赞\"我每晚都要跪下感谢上帝赐给我费尔特指挥官\"。1943年3月巡视瓜岛期间心脏病发，此后退居布里斯班坐镇指挥。1944年获OBE勋章，1946年出版回忆录《海岸观察员》，1968年去世。"
