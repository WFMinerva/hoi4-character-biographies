 # 59. 施沃伊·卡尔曼 / HUN_shvoy_kalman
 CBIO_HUN_shvoy_kalman_desc:0 "施沃伊·卡尔曼（1881年9月26日—1971年4月12日），匈牙利陆军中将与政治家，出生于考波什瓦尔，毕业于路多维卡军事学院，一战以参谋军官身份服役，两战期间多次出任地方军区司令及国防部高层职务，以反德立场在军内独树一帜。1935至1938年担任费耶尔县（塞克什白堡地区）代表，以保守亲英派身份活跃于议会，多次公开批评向纳粹德国靠拢的外交路线。战后在共产党执政初期以\"战争罪嫌疑人\"名义遭短暂审查，但因其反德记录清晰而获释，此后以回忆录形式留下了珍贵的战间期匈牙利军事史料，1971年4月12日辞世。"
