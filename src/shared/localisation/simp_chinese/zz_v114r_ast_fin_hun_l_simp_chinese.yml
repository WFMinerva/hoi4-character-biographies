 # 42. 克莱尔·史蒂文森 / AST_clare_stevenson
 CBIO_AST_clare_stevenson_desc:0 "全名克莱尔·格兰特·史蒂文森，1903年7月18日生于维多利亚州旺加拉塔，1988年10月22日卒，享年85岁。皇家澳大利亚空军女子辅助队首任主任，被2001年的回顾性评价誉为\"澳大利亚空军史上最重要的女性\"。受教育于维多利亚州后在悉尼大学取得学位，此后长期担任贝利内衣公司高管，具有丰富的组织管理经验。1941年3月25日WAAAF在女性强烈游说和解放更多男性地勤人员赴前线的双重需求下正式成立，是澳大利亚军事史上首个女性制服化军种。史蒂文森于当年6月接任首任主任，此时队员不足200人；至1944年底，队员已逾18000人，占皇家澳大利亚空军全部地面人员的三分之一以上。她在极度不平等的条件下主持建队——女性薪资仅为同等男性的三分之二，遭受来自国防部长和若干高级空军将领的公开反对——以专业训练、严格选拔军官和坚决维护女兵待遇的方式逐步树立了组织威信。她持续就医疗保障和薪资平等据理力争，力图将WAAAF成员转化为真正的军人而非\"制服平民\"。1946年3月离役后返回贝利公司担任高管至1960年退休，此后长期从事成人教育和社会福利工作，参与创建今日新南威尔士照护者协会，1988年去世。"
