 # 75. 赫伯特·V·伊瓦特 / AST_herbert_v_evatt
 CBIO_AST_herbert_v_evatt_desc:0 "全名赫伯特·维尔·伊瓦特，1894年4月30日生于新南威尔士州东梅特兰，1965年11月2日卒，享年71岁。法学博士出身的政治家，20世纪澳大利亚最具影响力的公共知识分子之一。就读悉尼大学以极优异成绩取得文学学士（1915年）、文学硕士（1917年）、法学学士（1918年）和法学博士（1924年）。1925至1930年出任新南威尔士州议会议员，1930年受斯卡林政府任命出任高等法院大法官——年仅36岁，迄今为止最年轻的高等法院法官。以进步倾向的判决著称，1940年辞去法官职务重回政界，赢得亨特联邦选区。1941年柯廷执政后同时出任司法总长和外交部长（1941—1949年）。战时数度赴华盛顿和伦敦力争澳大利亚在太平洋的资源分配权；1944年与新西兰签署《澳新协定》，倡导澳大利亚主导太平洋地区事务；1945年代表澳大利亚参加旧金山联合国成立会议，坚持将\"弱小国家也应在安理会决策中有效发声\"的诉求写入宪章；1948至1949年任联合国大会主席，参与起草《世界人权宣言》，对多项核心条款据理力争，是澳大利亚在二战后国际秩序构建中最积极的推动者。奇夫利1951年去世后接任工党领袖，主导了1954至1958年三次大选的落败；1955年揭发所谓彼得罗夫间谍丑闻与工党内共产主义渗透问题，引发工党历史上最严重的分裂（天主教\"民主劳工党\"脱党），种下此后十余年工党在野的远因。1960年接受新南威尔士首席大法官职务，1965年去世。"
