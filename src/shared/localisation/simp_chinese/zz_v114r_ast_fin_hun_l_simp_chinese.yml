 # 46. 古斯塔夫·马格努松 / FIN_gustaf_magnusson
 CBIO_FIN_gustaf_magnusson_desc:0 "古斯塔夫·埃里克·\"埃卡\"·马格努松（1902年12月8日—1993年12月27日）生于于利托尔尼奥，是芬兰战斗机王牌与曼纳海姆十字骑士（第129号）。内战中他为白方志愿兵。他在1930年代赴法国（1933年）与德国（1938年）研习战斗机战术，与理查德·洛伦茨同被视为\"芬兰战斗机战术之父\"，二人将先进经验与训练方法融入本国空军。他出任传奇的第24战斗机中队队长，使之成为芬兰空军战绩最高的中队，麾下名将云集，包括王牌伊尔马里·尤蒂莱宁与汉斯·温德；他本人出击158架次、击落5.5架。1943年起他改任第3飞行团团长，直至继续战争结束。"
