 # 58. 杰弗里·斯特里特 / AST_geoffrey_street
 CBIO_AST_geoffrey_street_desc:0 "全名杰弗里·奥斯汀·斯特里特，1894年1月21日生于悉尼乌拉拉，1940年8月13日殒命于堪培拉机场附近空难，享年46岁，葬于维多利亚州利斯莫尔。法律世家出身，一战期间以私兵身份入伍澳大利亚帝国远征军，参加加里波利战役并受伤，随后在法国转战获军事十字勋章，以少校结束战争。战后返利斯莫尔养羊，热爱板球，藏有近600本板球典籍。1924年当选汉普顿郡议员，1934年在孟席斯支持下赢得科兰加米特选区联合澳大利亚党议席。1938年出任国防大臣，主持战前扩军备战，推动国家登记法通过。1939年随孟席斯拆分国防部，斯特里特出任陆军大臣，以马不停蹄的高强度视察遍访全国陆海空军基地，以亲力亲为和平易待人深获官兵爱戴，媒体记录了他连续数月的日程表——奔走与伏案交替，间以晨间三英里晨跑，周末与子女溜冰滑雪。1940年8月13日与空军大臣费尔贝恩、参议员格利特和陆军参谋总长怀特同乘皇家澳大利亚空军哈德逊飞机，从墨尔本飞赴堪培拉出席重要内阁会议；飞机在进近机场时坠毁，机上10人无一生还。斯坦利·哈斯卢克后来写道：\"这几位人物中任何一个的离去都将是沉重打击，三人同日罹难，撕裂了政府的整个骨架。\"此次空难直接削弱孟席斯政府的施政能力，加速了其1941年垮台。"
