 # 12. 亚尼·古斯塔夫 / HUN_gusztav_jany
 CBIO_HUN_gusztav_jany_desc:0 "亚尼·古斯塔夫（1883年10月21日—1947年11月26日），匈牙利陆军上将，原名古斯塔夫·豪钦格尔，出生于匈牙利拉伊卡，德裔血统。一战中以步兵军官历经加利西亚战场，战间期在匈牙利皇家国防军中逐步晋升。1942年4月，他受命指挥被派往东线的匈牙利第2集团军——约20万兵力，在装备落后、缺乏反坦克武器的情况下于顿河弯曲部死守漫长防线。1943年1月，苏军\"奥斯特罗戈日斯克—罗苏希\"攻势撕碎了整条防线，德国援军未至，匈牙利第2集团军在零下三十度的极寒中溃灭，伤亡与被俘者合计逾十五万人，是匈牙利史上最惨烈的单次军事失败。灾难发生后，亚尼发布命令痛斥败退士兵\"丧失了荣誉\"，引发国内强烈谴责，霍尔蒂随即要求他撤回这一声明。战后，他以战争罪被人民法庭判处死刑，1947年11月26日在布达佩斯被枪决；1993年，匈牙利最高法院对其作出死后平反，认定他是政治审判的受害者。"
