 # 42. 劳里·马尔姆伯格 / FIN_lauri_malmberg
 CBIO_FIN_lauri_malmberg_desc:0 "卡尔洛·劳里·托瓦尔德·马尔姆伯格（1888年5月8日—1948年3月14日）生于赫尔辛基，是芬兰中将。他早年为耶格尔，内战中指挥白军耶格尔炮兵，参加坦佩雷、维堡等役（据载曾下令处决六名被疑赤卫队员），战后任炮兵学校校长与第1炮兵团团长。1921年\"白卫队风波\"后，总统斯托尔贝里弃曼纳海姆而任命他统领白卫队，并将其直属总统；自此他长期担任民卫队总监，直至1944年该组织依停战条款作为\"反苏组织\"被解散。他另于1924至1925年出任国防部长，1925年一度代理国防军总司令。"
