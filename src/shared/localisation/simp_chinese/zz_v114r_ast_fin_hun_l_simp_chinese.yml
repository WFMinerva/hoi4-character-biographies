 # 44. 卡尼奥·卡尔曼 / HUN_kalman_kanya
 CBIO_HUN_kalman_kanya_desc:0 "卡尼奥·卡尔曼（1869年11月7日—1945年2月28日），匈牙利外交家与外交部长，生于匈牙利，以奥匈外交官身份起步，早年驻节君士坦丁堡，1913年出任奥匈帝国驻墨西哥公使，后转任驻柏林公使。1925至1933年在柏林任职期间积累了与德国政界的深厚联系；1933年出任匈牙利外交部长，直至1938年11月。任内他奉行在大国之间周旋的务实路线，一方面深化与意大利的关系以制衡德国，另一方面维持与小协约国的有限接触，争取国际社会对匈牙利领土诉求的默认。1938年随伊姆雷迪总理赴贝希特斯加登与希特勒会谈，推动获取南斯拉夫及捷克斯洛伐克失地的外交斡旋；同年11月，因德意调停喀尔巴阡-乌克兰入侵计划未能按预期推进，遭德国施压后被迫辞职。此后淡出政坛，1945年2月28日在战乱中辞世。"
