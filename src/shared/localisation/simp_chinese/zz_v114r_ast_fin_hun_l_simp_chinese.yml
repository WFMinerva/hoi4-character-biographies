 # 26. 沃尔德马尔·黑格隆德 / FIN_woldemar_hagglund
 CBIO_FIN_woldemar_hagglund_desc:0 "约翰·沃尔德马尔·黑格隆德（1893年8月10日—1963年2月12日）是瑞典语裔的芬兰将领，早年为耶格尔运动志愿者，内战中在卡累利阿前线任参谋职。冬季战争爆发后，他于1939年12月4日接替海斯卡宁出任第四军军长，防区在拉多加湖以北；其部队退守科拉河后，在此打了一场持续到停战的科拉河防御战，\"科拉挺得住\"遂成芬兰人传颂的口号。继续战争中，他指挥第七军参加进攻拉多加-卡累利阿与东卡累利阿，攻占彼得罗扎沃茨克，惯用\"口袋\"合围战法，1942年晋中将。他是第四位获颁曼纳海姆十字勋章二级者。1943至1944年，他任最高统帅的总监察官，并主持调查战俘营的委员会。其幼子古斯塔夫·黑格隆德日后官至国防军总司令。"
