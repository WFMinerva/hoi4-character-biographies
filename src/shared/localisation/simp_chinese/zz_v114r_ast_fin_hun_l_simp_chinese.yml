 # 33. 詹姆斯·麦克马纳斯 / AST_james_mcmanus
 CBIO_AST_james_mcmanus_desc:0 "全名詹姆斯·卡塔尔·博伊德·麦克马纳斯，1891年3月11日生于维多利亚州埃丘卡，1972年卒，生前绰号\"汤姆\"。皇家澳大利亚海军指挥官，兼任澳大利亚海岸观察员网络最后一任战时指挥官。早年随父移居新南威尔士州中性湾，受舅父的远洋航行经历熏染，对海洋始终充满热情。一战中在皇家澳大利亚海军服役，两战之间仍保持海军参与。二战中任职海军情报部门，先后驻扎于海军若干基地。1943年3月费尔特指挥官在巡视瓜达尔卡纳尔时心脏病发被迫解职后，麦克马纳斯接掌\"斐迪南\"海岸观察员网络，被情报长官朗称为\"最有经验的人\"。据费尔特回忆录描述，麦克马纳斯身形小巧精干、髮色灰白，以耐心、外交手腕和对岛民的关切赢得网络成员的信赖，接掌时机恰在\"克雷特号\"执行\"杰威克行动\"（奇袭新加坡港）前数月。在其领导下，海岸观察员网络持续运作至战争结束，守护了盟军在西南太平洋作战的情报优势。"
