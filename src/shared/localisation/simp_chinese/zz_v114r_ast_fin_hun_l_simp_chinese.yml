 # 75. 卡罗伊·米哈伊 / HUN_mihaly_karolyi
 CBIO_HUN_mihaly_karolyi_desc:0 "卡罗伊·米哈伊（1875年3月4日—1955年3月19日），匈牙利伯爵、政治家，生于科特（今匈牙利），出身古老天主教贵族望族。早年以保守派进入议会，随后逐步左转，成为战前匈牙利最积极鼓吹和平主义、土地改革与非马扎尔族裔权利平等的贵族改革家，以此赢得广泛民意。1918年10月一战败局已定，\"波斯菊革命\"爆发，卡尔四世任命他为总理；11月16日宣布匈牙利民主共和国成立，他随即出任首任总统，一时寄望以威尔逊十四点原则争取协约国善意、保全领土。然而边境各邻国的军事蚕食、协约国对他的冷淡与粗暴，令他的期望彻底落空；1919年3月协约国再度发出苛刻领土要求照会，他将政权移交社会民主党，旋即被共产主义者接管并宣布苏维埃共和国成立，他本人遭库恩政权短暂拘押后出逃巴黎。流亡期间家产被没收，在贫困中坚持左翼政治写作；1946年返回匈牙利，1947至1949年任驻法大使，1949年拉伊克审判爆发后愤而辞职。此后定居法国，撰写两卷回忆录，1955年3月19日在法国旺斯辞世。"
