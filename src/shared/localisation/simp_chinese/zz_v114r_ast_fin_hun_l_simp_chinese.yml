 # 14. 勒德尔·维尔莫什 / HUN_vilmos_roder
 CBIO_HUN_vilmos_roder_desc:0 "勒德尔·维尔莫什（1881年1月11日—1969年12月13日），匈牙利军事将领与政治家，一战期间以军团参谋长身份服役。两战期间，他于1930至1934年间主导推动匈牙利陆军现代化建军计划，却因计划细节与总理根伯什·久洛意见相左而被迫提前退役。1936年，新任总理道拉尼·卡尔曼将其延揽出任国防部长，任期延至1938年。担任国防部长期间，他积极参与\"杰尔计划\"（1938年）的制定——这是匈牙利战间期最重要的军备扩充计划，计划以十亿彭格的巨额投资在五年内大幅扩充陆空军实力，为匈牙利此后参与二战奠定了军事物质基础。同年内阁改组，他随内阁成员一并辞职，此后淡出军政舞台，以九十一岁高龄于1969年12月13日辞世。"
