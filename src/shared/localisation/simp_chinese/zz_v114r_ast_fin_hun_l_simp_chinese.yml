 # 32. 维克托·克拉奇利 / AST_victor_crutchley
 CBIO_AST_victor_crutchley_desc:0 "全名维克托·亚历山大·查尔斯·克拉奇利，1893年11月2日生于伦敦切尔西，1986年1月24日卒于多塞特郡内特尔康比，享年92岁，英国皇家海军上将，是二战期间最后谢世的英国海军将领之一。一战中在比利时奥斯坦德突袭行动（1918年5月9—10日）中，指挥官阵亡后挺身接替\"文迪克蒂夫号\"指挥，并在弹雨中组织人员撤离沉船，凭此壮举获维多利亚十字勋章——彼时以选举方式决定授勋人选，克拉奇利系最后一批以此方式获VC者之一。二战中先任\"战斗勇士号\"战列舰舰长，参加第二次纳尔维克海战。1942年升任美澳联合任务部队第62分队指挥官，以\"澳大利亚号\"为旗舰，负责守卫瓜达尔卡纳尔岛登陆编队。1942年8月9日萨沃岛海战：克拉奇利奉召参加特纳海军少将的会议，将旗舰暂时驶离；当晚日本3组巡洋舰突袭，在短短一小时内击沉或重创盟军4艘重型巡洋舰，包括\"堪培拉号\"，盟方损失惨重。萨沃岛海战成为美国海军史上最惨烈的海战失利之一，克拉奇利遭美国媒体猛烈批评，但后续调查认为责任并不在他一人。此后他继续指挥澳美联合舰队参加麦克阿瑟的系列两栖作战，1944年6月将指挥权移交约翰·科林斯，1944年9月返英，1945年晋升中将，任直布罗陀地区海军司令至1947年退役，1949年晋海军上将。"
