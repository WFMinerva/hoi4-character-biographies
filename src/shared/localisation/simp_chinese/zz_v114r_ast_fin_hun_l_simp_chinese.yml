 # 38. 伊尔马里·基安托 / FIN_ilmari_kianto
 CBIO_FIN_ilmari_kianto_desc:0 "伊尔马里·基安托（1874年5月7日—1970年4月27日）生于普尔基拉一个牧师家庭，是芬兰多产作家，一生著书六十余部。他青年时曾在莫斯科求学并任俄语教师。其代表作《红线》（1909年）以1907年首次议会大选为背景，描写卡伊努穷苦山民的境遇；另一部《破衫滩的约瑟普》（1924年）写一名酿造私酒的贫农。他是卡累利阿民族扩张主义者与反共者，内战中站在白方，写有诗集《杀上去！》；他也曾以《自由信仰者的诗篇》表达对教会的反叛。战时他在自家门口留下一张俄文字条，恳请勿劫掠其宅，此举被判为通敌，他因此被处六个月苦役并褫夺公民权；战后他获得平反，1957年获赫尔辛基大学荣誉博士学位。"
