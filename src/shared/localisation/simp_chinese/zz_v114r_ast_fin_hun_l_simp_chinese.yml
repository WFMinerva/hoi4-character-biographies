 # 45. 卡斯特纳·雷瑟 / HUN_reszo_kastner
 CBIO_HUN_reszo_kastner_desc:0 "卡斯特纳·雷瑟（1906年—1957年3月15日），全名雷瑟·卡斯特纳，匈牙利裔犹太律师与记者，出生于科洛日瓦尔（今罗马尼亚克卢日-纳波卡），工作语言匈牙利语，犹太复国主义者。战前长期为锡安主义报纸《乌伊·科莱特》撰稿，战争爆发后协助建立布达佩斯救援援助委员会，专门帮助来自德国、奥地利、波兰的犹太难民越境入匈。1944年3月19日德军占领匈牙利后，他转而直接与党卫军上校阿道夫·艾希曼周旋谈判，以黄金、外汇和金刚石为代价，换取约1684名匈牙利犹太人获准乘专列离开，史称\"卡斯特纳列车\"；列车于1944年6月30日从布达佩斯出发，途经卑尔根-贝尔森滞留数月后，全体乘客于当年8月及12月分批抵达瑞士。战后卡斯特纳移居以色列，任工贸部发言人；1953年遭人以纳粹合谋者罪名在小册子中公开指控，由此引发以色列政府提起的一场著名诽谤诉讼，以色列地区法院一度认定他\"出卖灵魂于魔鬼\"，他未能等到以色列最高法院于1958年推翻此判决，即于1957年3月15日在特拉维夫遭极端分子枪击身亡。"
 HUN_reszo_kastner_desc:0 "卡斯特纳·雷瑟（1906年—1957年3月15日），全名雷瑟·卡斯特纳，匈牙利裔犹太律师与记者，出生于科洛日瓦尔（今罗马尼亚克卢日-纳波卡），工作语言匈牙利语，犹太复国主义者。战前长期为锡安主义报纸《乌伊·科莱特》撰稿，战争爆发后协助建立布达佩斯救援援助委员会，专门帮助来自德国、奥地利、波兰的犹太难民越境入匈。1944年3月19日德军占领匈牙利后，他转而直接与党卫军上校阿道夫·艾希曼周旋谈判，以黄金、外汇和金刚石为代价，换取约1684名匈牙利犹太人获准乘专列离开，史称\"卡斯特纳列车\"；列车于1944年6月30日从布达佩斯出发，途经卑尔根-贝尔森滞留数月后，全体乘客于当年8月及12月分批抵达瑞士。战后卡斯特纳移居以色列，任工贸部发言人；1953年遭人以纳粹合谋者罪名在小册子中公开指控，由此引发以色列政府提起的一场著名诽谤诉讼，以色列地区法院一度认定他\"出卖灵魂于魔鬼\"，他未能等到以色列最高法院于1958年推翻此判决，即于1957年3月15日在特拉维夫遭极端分子枪击身亡。"
