 # 60. 桑德拉·莱赫蒂宁 / FIN_sandra_lehtinen
 CBIO_FIN_sandra_lehtinen_desc:0 "亚历山德拉（桑德拉）·莱赫蒂宁（1873年1月10日—1954年9月5日）生于帕里卡拉，是芬兰工人运动先驱与早期女议员。她出身底层，做过女仆与裁缝，1903年起为社会民主党做组织者与宣讲人。1905年她参与组织了总罢工委员会。1907年芬兰首次议会选举中，她在北海梅省当选议员，是首批十九名女议员之一，连任至1910年。离开议会后她任社会民主党妇女联盟秘书（1916—1918年）。内战结束后，她与丈夫尤西·莱赫蒂宁移居苏俄，在布伊镇主管一所儿童之家；三年后返回芬兰，投身社会主义工人党，并在食品工人工会与工人禁酒联合会从事组织工作。1929年她因政治活动被捕入狱。她的女儿因凯里·莱赫蒂宁日后为芬兰共产党要员，曾任泰里约基政府的教育部长。"
