 # 5. 尤霍·库斯蒂·巴锡基维 / FIN_juho_kusti_paasikivi
 CBIO_FIN_juho_kusti_paasikivi_desc:0 "尤霍·库斯蒂·巴锡基维（1870年11月27日—1956年12月14日）是芬兰政治家与外交家，第七任总统（1946—1956）。他本名约翰·古斯塔夫·赫尔斯滕，出身寒微，1885年将姓名芬兰化。早年攻读法律与历史，获法学博士，先后为老芬兰党与民族联合党的领袖人物。他曾任参议员、议员与芬兰银行行长，1918年短暂出任独立后首届政府总理，主张君主制并亲德；1920年率团签订塔尔图和约，与苏俄议定边界。1936至1939年出任驻瑞典公使，1939年秋受召领导对苏谈判，但未能避免冬季战争。1944年11月，他再度出任总理，确保履行对苏停战条件；1946年接替曼纳海姆出任总统。他奉行务实的对苏外交，即后世所称\"巴锡基维路线\"——在坚守芬兰独立的同时避免与苏联冲突，这一方针成为战后芬兰外交的基石。1955年他促成苏联归还波卡拉租借地。"
