 # 2. 厄尔·佩奇 / AST_earle_page
 CBIO_AST_earle_page_desc:0 "全名厄尔·克里斯马斯·格拉夫顿·佩奇，1880年8月8日生于新南威尔士州格拉夫顿，1961年12月20日卒于悉尼。外科医生出身，15岁以奖学金入悉尼大学，21岁取得医学学位，1903年返格拉夫顿开设私人医院并引进当时新南威尔士最早一批X光设备。一战期间赴埃及、英国和法国军事医院短暂服役。1919年以独立候选人身份当选科伯选区联邦众议员，连续代表科伯选区出席十五届大选，在任近42年，为澳大利亚同一选区连任时间最长的联邦议员之一。1920年参与创建乡村党并于1921年出任领袖，力主将乡村党维持为独立政治力量，拒绝与国家党或联合澳大利亚党合并。1923至1929年在布鲁斯-佩奇联合政府中出任财政大臣兼副总理，力推农村发展、水利电气化和联邦道路援助计划，参与主导首都堪培拉的建设。1939年4月7日莱恩斯猝死后以看守总理身份执政20天，任内痛批即将接任的孟席斯品格，宣称拒绝与之共事，随后被迫辞去党领袖职务。1941至1942年出任澳大利亚驻英战时内阁常驻部长，参与太平洋战争委员会工作。1949至1956年在孟席斯战后政府中出任卫生大臣，主导建立国家医疗保险体系。1961年大选中因年届81岁落选科伯，同日去世。"
