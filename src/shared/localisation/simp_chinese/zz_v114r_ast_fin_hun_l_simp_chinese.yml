 # 54. 库莱沃·曼纳 / FIN_kullervo_manner
 CBIO_FIN_kullervo_manner_desc:0 "库莱沃·阿喀琉斯·曼纳（1880年10月12日—1939年1月15日）生于科凯迈基一个牧师家庭，是芬兰社会民主党人、1918年\"红色芬兰\"的领导者。他早年从事新闻工作，1906年在波尔沃创办《工人报》并任主编，曾因刊文冒犯沙皇被判入狱六个月。1910年和1917年他两度当选国会议员（社民党，新地省），1917年任国会议长与社民党主席。1918年1月28日内战爆发，他被推为芬兰人民委员会主席，领导红方政权；4月又兼任红卫队总司令。白军胜利后他流亡苏俄，参与创建流亡芬兰共产党，1920年代出任党主席并在共产国际执委会任职。1930年代，他与伴侣汉娜·马尔姆试图反思1918年革命失败的原因，矛头指向库西宁等人，遭到党内清算；1934年5月被免去大部分职务。1935年他在莫斯科寓所被发现藏有武器与布哈林等人的著作，被捕判处十年劳改，送入乌赫塔-佩乔拉劳改营；马尔姆则于1937年在索洛韦茨基溺水自尽。曼纳于1939年1月15日死于营中，官方死因为结核病。1957年获苏联平反。"
