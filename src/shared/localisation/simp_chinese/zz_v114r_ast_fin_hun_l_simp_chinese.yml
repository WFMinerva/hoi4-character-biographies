 # 18. 格温·梅雷迪思 / AST_gwynydd_meredith
 CBIO_AST_gwynydd_meredith_desc:0 "全名格温·查尔斯·德弗拉尔·梅雷迪思，1893年3月6日生于新南威尔士州，1965年7月7日卒。一战在西线参战并受训为炮兵军官，战间期在民兵部队服务。二战中以少将身份于1942至1943年间任新南威尔士线区（后勤通信线区）司令，负责新几内亚战役的后方补给和运输组织工作。在麦克阿瑟南太平洋作战区内，后勤保障是制约澳军推进的关键因素，梅雷迪思在组织莫尔斯比港至科科达战区的运输链方面发挥了重要行政职能。资料相对有限，战后命运不详。"
