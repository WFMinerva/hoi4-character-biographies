 # 35. 鲍伊诺齐·约瑟夫 / HUN_jozsef_bajnoczy
 CBIO_HUN_jozsef_bajnoczy_desc:0 "鲍伊诺齐·约瑟夫（1888年2月27日—1977年6月12日），匈牙利陆军上将，出生于西尼尔瓦拉利亚（今罗马尼亚锡尼乌）。毕业于路多维卡军事学院，后入读维也纳热雷什军事学院（1914年），一战中以各级军官职务服役。战间期历任步兵指挥及军事教育职位，1937年晋升少将，1939至1941年任第六军军长。1941年11月至1944年4月，以副总参谋长身份长期协助总参谋长松鲍特海伊·费伦茨，是高级军事决策的核心参与者，1943至1944年间兼任国防部副部长。1944年3月德军占领匈牙利前夕，他参与了卡莱总理内阁最后的夜间紧急会议，知晓德军入侵即将到来的情报，与其他将领一同评估但最终否定了武装抵抗的可能性。战后经审查确认其退休，此后以非政治性姿态度过余生，1977年6月12日在皮利什马罗特辞世，是这批人物中寿命最长者之一。"
