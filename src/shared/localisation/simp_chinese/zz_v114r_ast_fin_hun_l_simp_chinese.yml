 # 10. 韦特·亨里克 / HUN_henrik_werth
 CBIO_HUN_henrik_werth_desc:0 "韦特·亨里克（1881年12月26日—1952年5月28日），德裔匈牙利总参谋长，出生于雷绍哈萨（今塞尔维亚克尼察宁），德意志族背景。1897年入读维也纳奥匈军事学校，一战中升至中校；战后一度为匈牙利苏维埃红军服务，随即转入匈牙利皇家国防军，历任参谋要职，1936年强制退役，1938年奉调复出担任总参谋长。立场极端亲德，1941年4月私下与德军统帅部秘密商定允许国防军借道匈牙利攻打南斯拉夫——此举未经文官政府授权，被认为直接触发了时任总理泰莱基·帕尔于同年4月3日以死抗议。此后他力推匈牙利全力参与\"巴巴罗萨行动\"，甚至越权向德方传递匈牙利军事信息，引发霍尔蒂及文官政府的强烈不满，1941年9月被解除职务，由相对温和的松鲍特海伊·费伦茨接替。战争结束后被苏军俘获，在苏联战俘营中度过余生，1952年5月28日在羁押中去世。"
