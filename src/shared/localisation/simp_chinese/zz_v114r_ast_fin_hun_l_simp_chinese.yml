 # 61. 珀西瓦尔·麦克尼尔 / AST_percival_mcneil
 CBIO_AST_percival_mcneil_desc:0 "全名珀西瓦尔·埃德温·麦克尼尔，1883年9月25日生于维多利亚州北墨尔本，1951年4月17日因心脏衰竭和冠状动脉硬化卒于考尔菲尔德遣返总医院，享年67岁。澳大利亚皇家海军首位在本土出生的将旗级军官（1934年晋升海军工程少将），以毕生贡献于海军工程和舰船建造著称。早年在商船队习得工程技术，并赴苏格兰约翰·布朗公司从事造船实习，1911年11月以28岁之龄加入皇家澳大利亚海军，即任\"雅拉号\"鱼雷艇驱逐舰工程副官。此后历任多艘驱逐舰工程军官，长期在海军工程领域积累专业实绩。1931年起长期出任海军工程总监，推动澳大利亚在大萧条及战前时期的舰船引进和建造规划。1934年晋升工程海军少将——首位在澳大利亚本土出生即晋升将旗级别的皇家澳大利亚海军军官。1940年7月正式出任第三海军委员兼海军建造总监，在二战期间统筹澳大利亚的军舰建造与修缮工作，监督巴瑟斯特级护卫舰、河流级护卫舰和部族级驱逐舰等主要舰种从蓝图到量产的全过程。其1941年1月向战时内阁提交的《商船建造报告》，直接促成同年5月开始的大规模标准化商船建造计划。1943年9月届龄退役后，任军需部商船建造处处长（1943—1948年），持续为澳大利亚造船工业服务至1951年去世。"
