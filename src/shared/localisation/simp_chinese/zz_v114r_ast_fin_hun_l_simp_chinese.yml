 # 2. 奥托·冯·哈布斯堡 / HUN_otto_von_habsburg
 CBIO_HUN_otto_von_habsburg_desc:0 "奥托·冯·哈布斯堡（1912年11月20日—2011年7月4日），末代奥匈帝国皇储，末代皇帝卡尔一世与皇后齐塔之长子，生于下奥地利赖歇瑙。1918年帝国崩解后随家族流亡，1922年父皇在马德拉流亡地驾崩，年仅九岁的他即成为哈布斯堡皇位觊觎者，匈牙利王位合法性亦随之寄托于他。成年后以旗帜鲜明的反纳粹立场著称，纳粹德国曾明令一旦捕获即行处决。二战期间旅居美国，游说罗斯福政府建立奥地利流亡政府并协助迫害者出逃；战后放弃武力复辟之念，转而投身欧洲一体化事业，历任国际泛欧联盟主席（1973—2004年）及欧洲议会议员（1979—1999年）。1989年与匈牙利当局共同发起\"泛欧野餐\"，成为铁幕裂解的重要触媒，欧盟委员会主席赞他\"为欧洲一体化做出了核心贡献\"。终生觊觎奥匈两国王位而未能复辟，2011年7月4日在德国波金安然辞世，遗体葬于维也纳皇家地下墓室，心脏依哈布斯堡家族传统安葬于匈牙利帕农哈尔姆修道院。"
