 # 41. 克莱夫·考德威尔 / AST_clive_caldwell
 CBIO_AST_clive_caldwell_desc:0 "全名克莱夫·罗伯逊·考德威尔，约1910年7月28日生于悉尼刘易舍姆（生年存争议，本人曾以朋友之助伪改出生证明以克服入伍年龄限制，一说1911年），1994年8月5日卒，享年84岁。澳大利亚二战全军最高战果王牌飞行员，以\"杀手\"绰号闻名——那是他最厌恶的称谓。战前在新南威尔士皇家航空俱乐部自学飞行，1940年5月以商业经纪人身份入伍，完成帝国航空训练计划全课程后赴北非，先后驾驶P-40战鹰和小猫战斗机。以独创的\"影子射击法\"——向自机阴影瞄准以校准提前量——迅速积累战果，多次在受伤或寡众悬殊时仍坚持攻击。1941年12月5日单日击落5架德国斯图卡，创\"一日王牌\"纪录并获杰出飞行十字勋章加饰。离开北非时以20.5架战果成为沙漠战场最高得分盟军飞行员，并受颁波兰勇武十字勋章。1942年回国后指挥驻达尔文第1战斗机联队，率喷火式战斗机抵御日机侵犯，再积战果。1944年任第80战斗机联队翼指挥官，然部队被用于日益单调的地面攻击任务。1945年4月他与7名同僚集体请辞以抗议飞行员被滥用，引发\"莫罗台哗变\"事件，随后遭军事法庭以私自以军需品换取美军物资定罪，有效军旅生涯就此终结。以28.5架官方击落战果收战，为二战澳大利亚全军最高。战后从商，低调生活，1994年去世。"
