 # 69. 赖梅尼-施内勒尔·拉约什 / HUN_lajos_remenyi_schneller
 CBIO_HUN_lajos_remenyi_schneller_desc:0 "赖梅尼-施内勒尔·拉约什（1892年6月5日—1946年11月27日），匈牙利保守派政治家与财政官员，出生于布达佩斯，受训为法学家，两战期间在财政系统任职多年，以金融技术官僚著称。1938至1944年任内阁财政部长，历经伊姆雷迪、泰莱基、巴尔多希、卡莱各届政府，是战时财政政策的持续执行者。1944年3月德军占领后，他在斯托尧伊傀儡内阁中转任经济统筹要职，被迫将匈牙利财政与经济全面纳入德国战争机器的轨道，协助组织向德国的战时物资输出与资金拨付。战后以战争罪及危害人类罪由人民法庭审判，1946年11月27日在布达佩斯被枪决，成为战后匈牙利清算战时经济合作者系列审判中的典型案例。"
