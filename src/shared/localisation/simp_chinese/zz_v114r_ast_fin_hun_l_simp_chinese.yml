 # 29. 沃勒什·亚诺什 / HUN_janos_voros
 CBIO_HUN_janos_voros_desc:0 "沃勒什·亚诺什（1891年3月25日—1968年7月23日），匈牙利军事将领，一战中战斗于东线及意大利战场。1944年3月19日德军占领匈牙利当日，他被任命为总参谋长——这一时间节点深刻影响了他此后的政治立场。随着苏军向匈牙利东部边境推进，他选择投向苏联一方，参加了1944年底在德布勒岑成立的匈牙利临时国民政府，担任代表团成员之一在莫斯科签署了匈牙利停战协定，并在贝洛·米克洛什领导的临时政府中出任国防部长，为战后秩序重建做出贡献。1946年按本人申请退役。1949年58岁生日前后，被军事调查机构以间谍罪逮捕，1950年遭军事法庭判处终身监禁。1956年革命期间获释，此后在困苦中度过余生，1968年7月23日在巴拉顿菲赖德辞世。"
