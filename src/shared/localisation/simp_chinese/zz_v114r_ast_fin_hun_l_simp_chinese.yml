 # 14. 卡尔·奥列希 / FIN_karl_oesch
 CBIO_FIN_karl_oesch_desc:0 "卡尔·伦纳特·奥列希（1892年8月8日—1978年3月28日）生于皮哈耶尔维，父母为瑞士移民，他本人惯用名伦纳特，1920年前持芬兰-瑞士双重国籍。他早年加入耶格尔运动，1918年回国参加内战（白军），其后在军中迅速擢升，1930至1940年任总参谋长，主持了使芬军得以在冬战中应战的改革。冬季战争末期，他临危受命指挥海岸集群，稳住了苏军强渡维堡湾后的危局。继续战争中，他指挥第四军于1941年收复维堡，并在波尔兰皮之战中合围苏军三个师、俘虏九千余人，创下芬军战史上最大的胜绩。1944年苏军发动维堡-彼得罗扎沃茨克攻势时，他出任地峡部队总指挥，统辖约占芬军三分之二的兵力；尽管维堡失守，他仍以塔利-伊汉塔拉、维堡湾、武奥萨尔米等防御战稳住战线，并于6月26日获颁曼纳海姆十字勋章。战后，他因继续战争期间签署的一项关于处置苏军战俘的命令，被判战争罪入狱，数年后获释。"
