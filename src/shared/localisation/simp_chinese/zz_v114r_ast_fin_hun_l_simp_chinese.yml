 # 13. 凯梅里-纳吉·伊姆雷 / HUN_imre_kemeri_nagy
 CBIO_HUN_imre_kemeri_nagy_desc:0 "凯梅里-纳吉·伊姆雷（生年不详—1942年4月13日），匈牙利军事将领，以指挥匈牙利志愿军参与芬兰冬季战争而著称。1939年苏联入侵芬兰后，匈牙利政府允许约350名志愿者赴芬参战，由时任中尉的凯梅里-纳吉出任\"匈牙利独立志愿营\"营长；同年底战斗开始，芬兰元帅曼纳海姆亲赴拉普阿与匈牙利营会见，对志愿者的到来表示感谢，并将凯梅里-纳吉晋升为上尉。芬兰冬季战争于1940年3月结束后，匈牙利营乘船返回，于5月抵达布达佩斯。1941年，凯梅里-纳吉随匈牙利军队参与苏德战争，在东线与苏联游击队交战时负伤，1942年4月13日伤重不治，去世时据称身在华沙，为匈牙利在冬季战争中最具代表性的参与者之一。"
 HUN_imre_kemeri_nagy_desc:0 "凯梅里-纳吉·伊姆雷（生年不详—1942年4月13日），匈牙利军事将领，以指挥匈牙利志愿军参与芬兰冬季战争而著称。1939年苏联入侵芬兰后，匈牙利政府允许约350名志愿者赴芬参战，由时任中尉的凯梅里-纳吉出任\"匈牙利独立志愿营\"营长；同年底战斗开始，芬兰元帅曼纳海姆亲赴拉普阿与匈牙利营会见，对志愿者的到来表示感谢，并将凯梅里-纳吉晋升为上尉。芬兰冬季战争于1940年3月结束后，匈牙利营乘船返回，于5月抵达布达佩斯。1941年，凯梅里-纳吉随匈牙利军队参与苏德战争，在东线与苏联游击队交战时负伤，1942年4月13日伤重不治，去世时据称身在华沙，为匈牙利在冬季战争中最具代表性的参与者之一。"
