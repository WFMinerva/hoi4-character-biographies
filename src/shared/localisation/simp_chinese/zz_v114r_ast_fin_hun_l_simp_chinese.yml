 # 52. 安提·哈克吉尔 / FIN_antti_hackzell
 CBIO_FIN_antti_hackzell_desc:0 "安提·韦尔内·哈克吉尔（原名安德斯·哈克吉尔，1881年9月20日—1946年1月14日）生于米凯利，是芬兰国民联合党政治家、外交官与律师，1944年出任总理，领导了芬兰历史上任期最短的内阁之一。他早年习法并取得哲学学士学位，内战中曾任白军副官。1918至1920年任维堡省省长，1922至1927年出任驻苏联公使，其后转入商界，1930年起先后任芬兰雇主联合会副总裁与总裁。1932至1936年他在基维梅基内阁出任外交部长。1944年夏，在继续战争后期芬兰急需退出战争之际，他受命组阁，其内阁的唯一使命便是与苏联缔结停战协定。8月底他获得了与莫斯科的谈判渠道，9月2日内阁同意停火，停火于9月4日生效。他随即赴莫斯科谈判，但9月14日在谈判中突发严重中风，再未恢复，外交部长恩克尔代为完成了谈判。9月21日他的内阁卸任，1946年1月他在赫尔辛基逝世。"
