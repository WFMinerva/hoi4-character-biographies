 # 46. 塞德里克·希克斯 / AST_cederic_hicks
 CBIO_AST_cederic_hicks_desc:0 "全名塞德里克·斯坦顿·希克斯，1892年6月2日生于新西兰莫斯吉尔，1976年2月7日卒于南澳大利亚格伦奥斯蒙德，享年83岁。生理学与药理学教授，澳大利亚陆军炊事兵团的创始人，因从根本上改革军队饮食制度而名留史册。就读奥塔哥男子高中和奥塔哥大学（理学学士1914年、医学学士1923年），1923年获贝特医学研究奖学金赴英国剑桥三一学院深造取得博士学位，并在德国、瑞士和美国从事研究。1926年受聘阿德莱德大学出任人体生理学与药理学教授，任职逾三十年。二战爆发后以军事顾问身份介入陆军饮食事务，力排官僚阻力，主张将军队配给基准从货币标准改为营养标准，推动专业厨师的培训和军队厨务管理的系统化。经过数年坚持不懈的努力，1943年3月12日澳大利亚陆军炊事兵团正式成立，希克斯出任首任总监，兵团最终扩展至17000名军官和士兵。他同时开发了针对热带丛林巡逻、空投补给等特殊任务场景的专用口粮包，大幅减少食物浪费并改善了前线官兵健康状况。战后以顾问身份继续协助军队改进饮食管理至1952年。晚年关注结核病防治、土壤保育和粮食生产，1976年去世，获授爵士称号。"
 AST_cederic_hicks_desc:0 "全名塞德里克·斯坦顿·希克斯，1892年6月2日生于新西兰莫斯吉尔，1976年2月7日卒于南澳大利亚格伦奥斯蒙德，享年83岁。生理学与药理学教授，澳大利亚陆军炊事兵团的创始人，因从根本上改革军队饮食制度而名留史册。就读奥塔哥男子高中和奥塔哥大学（理学学士1914年、医学学士1923年），1923年获贝特医学研究奖学金赴英国剑桥三一学院深造取得博士学位，并在德国、瑞士和美国从事研究。1926年受聘阿德莱德大学出任人体生理学与药理学教授，任职逾三十年。二战爆发后以军事顾问身份介入陆军饮食事务，力排官僚阻力，主张将军队配给基准从货币标准改为营养标准，推动专业厨师的培训和军队厨务管理的系统化。经过数年坚持不懈的努力，1943年3月12日澳大利亚陆军炊事兵团正式成立，希克斯出任首任总监，兵团最终扩展至17000名军官和士兵。他同时开发了针对热带丛林巡逻、空投补给等特殊任务场景的专用口粮包，大幅减少食物浪费并改善了前线官兵健康状况。战后以顾问身份继续协助军队改进饮食管理至1952年。晚年关注结核病防治、土壤保育和粮食生产，1976年去世，获授爵士称号。"
