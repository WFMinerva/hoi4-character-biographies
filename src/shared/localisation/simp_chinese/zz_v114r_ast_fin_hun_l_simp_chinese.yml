 # 40. 伦纳特·贝尔纳多特亲王 / HUN_lennart_bernadotte
 CBIO_HUN_lennart_bernadotte_desc:0 "伦纳特·贝尔纳多特（1909年5月8日—2004年12月21日），瑞典王室成员，出生于斯德哥尔摩王宫，为瑞典国王古斯塔夫五世之孙、王子威廉与俄罗斯大公女玛利亚·帕芙洛夫娜之子。生而为斯马兰公爵，1932年因与平民卡琳·尼斯范特结婚，依瑞典王位继承法丧失王族称号及继承权，此后以伦纳特·贝尔纳多特先生身份行世，1951年获卢森堡大公国授予维斯博格伯爵头衔。婚后他接手祖母留给他的德国波登湖美瑙岛庄园，将其经营为以花卉景观著称的旅游胜地，同时从事摄影与电影拍摄。2004年12月21日在美瑙岛辞世。"
