 # 39. 亚瑟·德拉克福德 / AST_arthur_drakeford
 CBIO_AST_arthur_drakeford_desc:0 "全名亚瑟·塞缪尔·德拉克福德，1878年4月26日生于墨尔本菲茨罗伊，1957年6月9日卒于墨尔本月亮坑家中，享年79岁。铁路机车司机出身，长期工会领袖，澳大利亚联邦机车驾驶员工会联合会全国主席（1929—1948年）。1927年当选维多利亚议会埃森顿选区议员，1932年因反对大萧条时期的财政紧缩计划\"总理方案\"落选。1934年当选联邦马里比尔农选区众议员，此后连续代表该选区至1955年。1941年10月随柯廷劳工党政府上台，出任空军大臣兼民航大臣，在任八年——整个二战及战后重建期间。在任内他明智地将具体战略决策留给专业军官，专注于资源协调、预算和人力分配，以关心空军士兵的切身利益赢得军心。他的最持久成就在于战后民航领域：1945年推动建立澳大利亚国际航空公司以打破私营垄断，1946至1947年主导政府收购澳航实现国有化，并亲历1947年首届国际民用航空组织大会担任主席。1946年短暂兼任海军大臣。1957年在家中去世。"
