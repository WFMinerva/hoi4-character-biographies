 # 74. 卡尔五世·威廉 / HUN_carl_wilhelm
 CBIO_HUN_carl_wilhelm_desc:0 "威廉·卡尔王子（1884年6月17日—1965年5月5日），瑞典王室成员，生于斯德哥尔摩，为瑞典国王古斯塔夫五世次子，又称卡尔·威廉亲王。早年受海军教育，曾任瑞典外交使节，并因旅行、探险和写作而知名。一战后，他多次前往非洲和亚洲旅行，出版见闻著作，也参与电影与文化活动。1923年与俄罗斯大公女玛利亚·帕芙洛夫娜离婚，此后较少介入王室政治事务，维持相对低调的公共生活。就史实而言，他与匈牙利政治并无明确直接联系；若置于两战之间中欧君主制方案的背景中，只能视为外国王室候选人想象的一部分。1965年5月5日在斯德哥尔摩辞世。"
