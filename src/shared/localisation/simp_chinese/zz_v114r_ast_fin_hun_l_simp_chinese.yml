 # 11. 乔陶伊·拉约什·德·恰塔伊 / HUN_lajos_csatay
 CBIO_HUN_lajos_csatay_desc:0 "乔陶伊·拉约什·德·恰塔伊（1886年8月1日—1944年10月16日），匈牙利军事将领与政治家，出生于奥拉德（今罗马尼亚），原名拉约什·图岑塔勒尔，后改为更具匈牙利特色的姓名。一战以炮兵军官和军参谋长身份服役，战间期历任混合旅指挥官及多项要职。1942年任匈牙利第3集团军司令，1943年6月，卡莱总理任命他为国防部长，这一职位他一直担任至1944年10月。就任初期倾向支持德国及继续参战，此后随着战局逆转而逐步转变立场；在拉卡托什政府（1944年8月—10月）任期内，他配合摄政霍尔蒂推动与盟军的秘密谈判，力图使匈牙利脱离战争。1944年10月15日霍尔蒂停战宣言失败，箭十字党政变得手，乔陶伊于同日被盖世太保逮捕；翌日，1944年10月16日，他与妻子在羁押中双双自杀，以死保全气节。"
