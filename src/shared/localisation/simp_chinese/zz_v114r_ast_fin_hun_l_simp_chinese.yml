 # 50. 弗农·斯图尔迪 / AST_vernon_sturdee
 CBIO_AST_vernon_sturdee_desc:0 "全名弗农·阿什顿·霍巴特·斯图尔迪，1890年4月16日生于维多利亚州弗兰克斯顿，1966年5月25日卒，享年76岁。陆军工兵出身，曾两度出任参谋总长，并亲历日本在西南太平洋的历史性投降。1908年入民兵，1915年4月25日以第5野战连指挥官身份参加加里波利原始登陆，随后在西线指挥第8野战连和第4先锋营，1918年调入英国远征军总部担任参谋，积累了高层指挥经验。两战之间晋升迟缓，1935年方才从战时中校重获晋升。1940年7月1日主动降级为少将以接任新编第8师师长；仅六周后，1940年8月13日怀特在堪培拉空难罹难，斯图尔迪紧急升任参谋总长，职责为监督中东和远东澳大利亚帝国远征军的训练与行政（但非战术指挥）。1942年力主建议政府将从中东回撤的澳军直接运返澳大利亚本土防守太平洋而非转道缅甸，这一建议对澳大利亚战略意义重大。其后出任驻美军事使团团长，代表澳大利亚出席联合参谋长委员会。1944至1945年作为第一澳大利亚集团军司令，在新几内亚埃塔佩、新不列颠和博干维尔岛指挥对日孤立行动。1945年9月6日在停泊于拉包尔的英国航母\"荣耀号\"甲板上接受日本第八战区军司令今村均大将和海军司令草鹿任一中将的正式投降，日方所交军刀与斯图尔迪自佩的父亲遗刀一并赠存澳大利亚战争纪念馆。1966年去世。"
 AST_vernon_sturdee_desc:0 "全名弗农·阿什顿·霍巴特·斯图尔迪，1890年4月16日生于维多利亚州弗兰克斯顿，1966年5月25日卒，享年76岁。陆军工兵出身，曾两度出任参谋总长，并亲历日本在西南太平洋的历史性投降。1908年入民兵，1915年4月25日以第5野战连指挥官身份参加加里波利原始登陆，随后在西线指挥第8野战连和第4先锋营，1918年调入英国远征军总部担任参谋，积累了高层指挥经验。两战之间晋升迟缓，1935年方才从战时中校重获晋升。1940年7月1日主动降级为少将以接任新编第8师师长；仅六周后，1940年8月13日怀特在堪培拉空难罹难，斯图尔迪紧急升任参谋总长，职责为监督中东和远东澳大利亚帝国远征军的训练与行政（但非战术指挥）。1942年力主建议政府将从中东回撤的澳军直接运返澳大利亚本土防守太平洋而非转道缅甸，这一建议对澳大利亚战略意义重大。其后出任驻美军事使团团长，代表澳大利亚出席联合参谋长委员会。1944至1945年作为第一澳大利亚集团军司令，在新几内亚埃塔佩、新不列颠和博干维尔岛指挥对日孤立行动。1945年9月6日在停泊于拉包尔的英国航母\"荣耀号\"甲板上接受日本第八战区军司令今村均大将和海军司令草鹿任一中将的正式投降，日方所交军刀与斯图尔迪自佩的父亲遗刀一并赠存澳大利亚战争纪念馆。1966年去世。"
