 # 73. 詹姆斯·费尔贝恩 / AST_james_fairbairn
 CBIO_AST_james_fairbairn_desc:0 "全名詹姆斯·瓦伦丁·费尔贝恩，1897年7月28日生于英格兰苏塞克斯郡瓦德赫斯特（父母均为澳大利亚人），1940年8月13日殒命于堪培拉机场附近空难，享年43岁，葬于维多利亚州斯金普顿。牧场主兼飞行员出身的政治家，二战初期澳大利亚第一任空军大臣，以挚爱飞行而著称。幼年随父母定居维多利亚州西部地区，18岁返英参军，加入皇家飞行队，在法国执行侦察护送任务时遭德机击落，重伤被俘，在德国战俘营度过逾一年，肘关节永久受损。战后回澳接管家族牧业。1932至1933年短暂出任维多利亚州议员，1933年赢得弗林德斯联邦选区；凭借飞行技术和航空知识成为联邦议会公认的航空政策权威。1939年4月孟席斯组阁，任民用航空大臣和行政院副主席，随即参与英联邦航空训练计划在加拿大的筹建工作；1939年11月13日在加拿大由总督卡纳文伯爵亲自宣誓就任空军大臣——成为历史上第一位在海外宣誓就职的澳大利亚大臣。1940年3月任命为第二届孟席斯内阁空军大臣兼民用航空大臣，同年7月亲驾自己的龙蜻蜓飞机环澳一周巡视各皇家澳大利亚空军基地。1940年8月13日，他邀请陆军大臣斯特里特、政务次官格利特和陆军参谋总长怀特同乘一架皇家澳大利亚空军哈德逊飞机飞赴堪培拉，出席讨论日本威胁的紧急内阁会议；飞机在进近堪培拉机场时坠毁，机上10人全部遇难。堪培拉机场东区基地日后以其姓名命名，是为费尔贝恩空军基地，正式命名于1953年。"
