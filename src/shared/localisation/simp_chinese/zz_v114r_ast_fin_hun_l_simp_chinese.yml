 # 67. 罗伯特·孟席斯 / AST_robert_menzies；ENG_robert_menzies
 CBIO_ENG_robert_menzies_desc:0 "全名罗伯特·戈登·孟席斯，1894年12月20日生于维多利亚州杰帕里特，1978年5月15日卒于墨尔本，享年83岁。澳大利亚第十二任总理，也是澳大利亚历史上任职最长的总理（两度执政：1939—1941年，1949—1966年，合计逾18年）。苏格兰后裔，父为铁路画工，三叔和父亲均曾出任州议会议员。就读墨尔本大学，以优异成绩取得法律学位，很快以口才和辩才成为维多利亚顶尖律师，29岁晋升御用大律师。1928年进入维多利亚州议会，1934年当选联邦众议员代表科伊选区，任职至1966年。1939年4月莱恩斯猝然离世，孟席斯当选联合澳大利亚党领袖出任总理，引领澳大利亚进入二战，1939年9月3日对德宣战，随即全力推动扩军备战。首届任期（1939—1941年）因政局不稳和党内分裂于1941年8月辞职，由法登继任。反对党任期间组建了新政党\"自由党\"（1944年），整合保守政治力量。1949年11月大选以压倒性优势击败奇夫利工党政府，开启长达16年的执政盛世：任内见证澳大利亚战后经济腾飞，推动移民计划和社会中产化，参与朝鲜战争并在东南亚条约组织框架下深化对美同盟。1963年获封苏格兰帽蓟骑士团爵位，是历史上唯一获此封赐的澳大利亚人。1966年主动辞职，以83岁高龄于1978年在墨尔本去世，留下澳大利亚政坛最漫长的个人政治遗产。"
