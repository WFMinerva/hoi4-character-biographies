 # 23. 拉茨·耶内 / HUN_jeno_ratz
 CBIO_HUN_jeno_ratz_desc:0 "拉茨·耶内（1882年9月20日—1952年1月21日），匈牙利军事将领与政治家，出生于纳吉贝奇克雷克（今塞尔维亚兹雷扬宁）。一战以步兵军官身份服役，战后加入国家军，1936年10月出任匈牙利皇家国防军总参谋长。1938年，总理伊姆雷迪·贝洛任命他为国防部长，任期较短。此后转任众议院代表，1944年3月德军占领匈牙利后，在斯托尧伊政府中出任不设部门部长兼副总理，配合德国路线推行各项政策。战后被人民法庭以战争罪判处死刑，后因年龄和健康状况改判终身监禁，在布达佩斯监狱中度过余生，1952年1月21日在狱中辞世。"
