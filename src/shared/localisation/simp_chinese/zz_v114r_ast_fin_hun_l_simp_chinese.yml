 # 53. 希利亚·里皮宁 / FIN_hilja_riipinen
 CBIO_FIN_hilja_riipinen_desc:0 "希利亚·伊丽莎贝特·里皮宁（1883年10月30日—1966年1月18日，原姓米克林，后曾用梅察波尔库）生于拉普阿，是芬兰教师、洛塔组织活动家与极右政治人物，IKL议会党团中唯一的女性。她长期任教于拉普阿共学校并担任校长，1920年起在当地洛塔·斯韦尔德组织中崭露头角，曾任洛塔中央理事与报纸编辑，但因政治立场过于激进而与洛塔领袖卢科宁产生冲突，1936年被撤去理事与编辑职务。1930年她以国民联合党名义当选国会议员，投身拉普阿运动；1933年爱国人民运动成立为政党后，她转入该党党团，先后在1933年和1936年大选中当选，是IKL历届议员中唯一的女性。她以偏激的反共演说闻名——1934年因侮辱议长被停止议员资格一周，法格霍尔姆称她为\"我见过的最狂热的政治家\"。她公开仰慕希特勒与墨索里尼，直至1945年仍主张与德国并肩作战。1939年大选落选后她退出政坛。"
