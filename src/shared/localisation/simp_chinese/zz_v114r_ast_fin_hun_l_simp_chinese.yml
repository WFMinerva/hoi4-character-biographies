 # 70. 赫尔曼·波科尔尼 / HUN_hermann_pokorny
 CBIO_HUN_hermann_pokorny_desc:0 "赫尔曼·波科尔尼（1882年4月7日—1960年2月18日），奥匈帝国密码学家，出生于克罗梅日什（今捷克），德语家庭，父亲为当地邮政局长，其堂弟为波兰密码局长弗兰奇谢克·波科尔尼。1900年加入奥匈军队，一战期间以少校军衔主持奥匈总参谋部俄国密码局，系统破译了俄军1914至1917年无线电广播中的加密军事电报，对中欧同盟军多次胜利贡献显著；因此功绩荣获玛丽亚·特蕾莎军事勋章——这是奥匈最高军事荣誉，共有28名将军级军官与2名其他军官获此殊荣，他是其中一位非将军级受勋者。帝国崩解后，他以德语母语者的身份既不愿入捷克斯洛伐克籍（因德裔背景不受欢迎）也不愿入奥地利籍（因生于摩拉维亚而被拒），遂于1918年加入匈牙利军队，以匈牙利公民身份开始新生活。1925年晋升上校，1935年以少将衔退役。二战期间未被征召入伍，仍以平民身份在布达佩斯居住。1945年苏军占领布达佩斯后，他主动投身战后重建，于1945至1949年间在匈牙利外交部任职，此后以将军名义最终退休，1960年2月18日在布达佩斯辞世。"
