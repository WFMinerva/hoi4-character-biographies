 # 60. 普尔格伊·毛格多尔瑙 / HUN_magdolna_purgly
 CBIO_HUN_magdolna_purgly_desc:0 "普尔格伊·毛格多尔瑙（1881年—1959年），全名毛格多尔瑙·普尔格伊·德·约沙斯赫伊，匈牙利摄政霍尔蒂·米克洛什之妻，即\"摄政夫人\"，出身特兰西瓦尼亚撒克逊裔地主家庭。1901年7月22日与时任海军军官的霍尔蒂在匈牙利结婚，此后长达四十余年始终是摄政府社交与礼仪生活的核心人物。她以贤淑、低调而广受称誉，在外交接待场合陪伴霍尔蒂出席各类正式活动；战时她亦参与慈善救助工作，协助照料伤兵与难民。1944年10月德军\"装甲拳头行动\"后，她随霍尔蒂一同被押往巴伐利亚，以软禁方式被关押于希尔施贝格城堡，直至1945年5月由美军解救。战后随丈夫流亡葡萄牙埃斯托里尔，在那里陪伴霍尔蒂度过最后岁月。霍尔蒂1957年辞世后，她继续留居埃斯托里尔，于1959年辞世，长眠于葡萄牙。"
