 # 57. 杰克·裴丁顿 / AST_jack_piddington
 CBIO_AST_jack_piddington_desc:0 "全名约翰·霍巴特·裴丁顿，1910年11月6日生于新南威尔士州瓦格瓦格，1997年7月16日卒，享年86岁。射电物理学家，二战中以科学成就对澳大利亚和盟军在太平洋战场的胜利作出显著贡献，战后成为国际知名的天文学家。就读悉尼大学，先后取得理学学士（1932年）、工程学学士（1934年）、理学硕士（1936年）和剑桥大学博士学位（1938年）。二战期间在射电物理研究所工作，承担若干直接为战争服务的工程任务：设计出澳大利亚首套精准的海岸炮兵测距设备，并研制出简便轻型的对空警戒雷达，后者被迅速部署于达尔文等澳大利亚北部防御要地，大幅提升了对日机预警效率，随后被美澳军队在太平洋\"跳岛战术\"系列战役中广泛运用。战后长期任职于联邦科学与工业研究组织，1966至1975年任国家测量实验室首席研究科学家，研究领域涵盖电离层、太阳和银河射电天文学及等离子体理论，1958年获戴维·赛姆研究奖，1963年当选澳大利亚科学院院士，1997年去世。"
