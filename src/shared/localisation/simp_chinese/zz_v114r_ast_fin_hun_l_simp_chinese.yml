 # 21. 扬基·科恰尔德 / HUN_kocsard_janky
 CBIO_HUN_kocsard_janky_desc:0 "扬基·科恰尔德（1868年2月11日—1954年10月20日），匈牙利骑兵将领，生于特兰西瓦尼亚德瓦（今罗马尼亚），出身军人世家。毕业于维也纳新城军事学院，以骑兵军官起步，一战中屡历东西两线及意大利战场，凭卢茨克战役的英勇指挥获颁玛丽亚·特蕾莎军事勋章（1922年正式授予）。1919年被罗马尼亚军队俘虏，获释后加入霍尔蒂的国家军，1922年出任匈牙利皇家国防军总参谋长，1925年兼任总司令，将参谋长与总司令两大要职集于一身，为霍尔蒂摄政所深度信任。1930年，霍尔蒂事先未与他商量便任命政治野心勃勃的根伯什·久洛为少将及国防部长，扬基视此为对其权威的公然冒犯，随即愤而请辞，就此退出军政核心。此后在布达佩斯寓所中安静度过近二十年，1951年被共产党当局强制迁往德布勒岑，1954年10月20日在当地辞世，享年八十六岁。"
