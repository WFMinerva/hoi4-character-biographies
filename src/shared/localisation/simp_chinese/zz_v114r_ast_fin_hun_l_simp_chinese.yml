 # 8. 罗德·赫尔 / AST_rod_hull
 CBIO_AST_rod_hull_desc:0 "彩蛋人物，非史实，是对1932年“鸸鹋战争”的影射。历史上，澳大利亚政府于1932年11月在西澳大利亚坎平比地区出动皇家澳大利亚炮兵部队，持刘易斯机枪围剿破坏农田的鸸鹋群，结果因鸸鹋行动分散、体格顽健、难以集中射杀，行动效果极差并遭媒体嘲讽，被后人称作“鸸鹋战争”。“罗德·赫尔”之名借用了英国喜剧演员罗德·赫尔（1935年—1999年），其著名表演搭档正是手偶鸸鹋“埃姆”。"
