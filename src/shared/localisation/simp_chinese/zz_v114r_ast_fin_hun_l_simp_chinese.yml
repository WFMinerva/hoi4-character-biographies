 # 6. 约瑟夫·莱恩斯 / AST_joseph_lyons
 CBIO_AST_joseph_lyons_desc:0 "全名约瑟夫·阿洛伊修斯·莱恩斯，1879年9月15日生于塔斯马尼亚斯坦利，1939年4月7日猝死于悉尼，成为澳大利亚首位在任去世的总理。双亲均为爱尔兰移民后裔，家境贫寒，9岁起即靠打零工补贴家用。由姨母资助重返学校，以优异成绩进入教师学院，成为小学教师。1909年以工党身份当选塔斯马尼亚议会威尔莫特选区议员，历任教育大臣、财政大臣，1923至1928年出任塔斯马尼亚总理——也是首位工党塔斯马尼亚总理。1929年进入联邦议会，在斯卡林政府中出任邮政大臣。大萧条期间反对政府赤字开支立场，与主流工党产生尖锐分歧，1931年1月与同僚退党，同年领衔与其他反对派政党合并组成联合澳大利亚党，当年大选中大获全胜。1932年1月成为澳大利亚第十任总理，任内三度赢得联邦大选（1934年、1937年），任期七年，以稳健财政立场和平易近人的家庭形象深受选民喜爱——莱恩斯夫妇十二名子女构成的大家庭令全国民众对其充满好感。1930年代中期推动扩军应对日本威胁。妻子埃妮德·莱恩斯后来成为澳大利亚首位女性众议员（1943年）和首位女性内阁成员（1949年）。1939年4月5日从墨尔本前往悉尼途中心脏病发，4月7日耶稣受难日在悉尼去世，终年59岁，遗产仅344英镑。"
