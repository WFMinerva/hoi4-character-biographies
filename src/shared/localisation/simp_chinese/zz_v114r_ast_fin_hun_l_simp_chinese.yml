 # 13. 伊万·多尔蒂 / AST_ivan_dougherty
 CBIO_AST_ivan_dougherty_desc:0 "全名伊万·诺埃尔·多尔蒂，1907年4月6日生于新南威尔士州利德维尔，1998年3月4日卒，终年90岁。教师出身，就读马奇高中和悉尼师范学院，1928年起在马里克维尔初级技术学校任教，同时修读悉尼大学经济学学士学位。1926年在悉尼大学军团获委，以非正规军官身份服役。二战爆发后主动降级，1939年10月以少校身份加入第二澳大利亚帝国远征军，在指挥官乔治·伍滕（本名单#10）手下任第2/2步兵营副指挥。北非战役期间在德尔纳战斗中表现突出——率部强渡宽达500米的瓦迪德尔纳峡谷，歼敌俘敌逾百——随即升任第2/4营营长，参加托布鲁克和德尔纳战役，获杰出服役勋章。1941年参加希腊和克里特岛战役撤退。1942年回国后任北领地第23旅旅长，1942年10月赴新几内亚接管久经激战的第21步兵旅，指挥部队在戈纳等日军据点的残酷攻坚中取得胜利，但伤亡极为惨重，多尔蒂本人也染上疟疾入院。此后随第7师参加纳扎布空降、莱城攻夺和马科普战役等新几内亚攻势，1945年在北婆罗洲巴厘巴板完成最后一战。战后曾短暂参选自由党落选，返回教师职业并转任督学，1952年晋升少将并指挥第2师。1954至1974年任悉尼大学评议员，1958至1966年任副校长，1976年获荣誉法学博士。新南威尔士大学艾文·多尔蒂画廊以其名命名。"
 AST_ivan_dougherty_desc:0 "全名伊万·诺埃尔·多尔蒂，1907年4月6日生于新南威尔士州利德维尔，1998年3月4日卒，终年90岁。教师出身，就读马奇高中和悉尼师范学院，1928年起在马里克维尔初级技术学校任教，同时修读悉尼大学经济学学士学位。1926年在悉尼大学军团获委，以非正规军官身份服役。二战爆发后主动降级，1939年10月以少校身份加入第二澳大利亚帝国远征军，在指挥官乔治·伍滕（本名单#10）手下任第2/2步兵营副指挥。北非战役期间在德尔纳战斗中表现突出——率部强渡宽达500米的瓦迪德尔纳峡谷，歼敌俘敌逾百——随即升任第2/4营营长，参加托布鲁克和德尔纳战役，获杰出服役勋章。1941年参加希腊和克里特岛战役撤退。1942年回国后任北领地第23旅旅长，1942年10月赴新几内亚接管久经激战的第21步兵旅，指挥部队在戈纳等日军据点的残酷攻坚中取得胜利，但伤亡极为惨重，多尔蒂本人也染上疟疾入院。此后随第7师参加纳扎布空降、莱城攻夺和马科普战役等新几内亚攻势，1945年在北婆罗洲巴厘巴板完成最后一战。战后曾短暂参选自由党落选，返回教师职业并转任督学，1952年晋升少将并指挥第2师。1954至1974年任悉尼大学评议员，1958至1966年任副校长，1976年获荣誉法学博士。新南威尔士大学艾文·多尔蒂画廊以其名命名。"
