 # 47. 哈拉尔·欧奎斯特 / FIN_harald_ohquist
 CBIO_FIN_harald_ohquist_desc:0 "哈拉尔·欧奎斯特（1891年3月1日—1971年2月10日）生于赫尔辛基，是作家约翰内斯·欧奎斯特之子、二战时期的芬兰中将。他早年为耶格尔，内战中指挥白军一个营参加维堡之役（其部队牵涉攻城后对当地俄裔居民的杀戮）。1930年他晋少将，1933年任地峡集团军司令。冬季战争中，他出任卡累利阿地峡的第二军军长，在松马一带与维堡防御战中作战，并于1939年12月在维堡近郊发动一次大胆却失败的合围。他与曼纳海姆关系冷淡，战后未获重任。继续战争初期他任驻纳粹德国柏林的联络官，1942至1944年指挥地峡的一个军级集群，后任军事训练总监；1949年他出版了一部冬战回忆录。"
