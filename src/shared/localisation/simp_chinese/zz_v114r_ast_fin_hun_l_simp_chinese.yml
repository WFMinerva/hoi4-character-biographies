 # 77. 鲁道夫·霍尔斯蒂 / FIN_rudolf_holsti
 CBIO_FIN_rudolf_holsti_desc:0 "埃诺·鲁道夫·沃尔德马尔·霍尔斯蒂（1881年10月8日—1945年8月3日）生于于韦斯屈莱，是芬兰记者、政治学者与外交家，国家进步党人，两度出任外交部长。他早年从事报业，曾在海门林纳、拉赫蒂与赫尔辛基多家报纸任职。1913至1918年任国会议员（青年芬兰党/国家进步党），政治上坚定的共和派，反对1918年的君主制运动。1919至1922年他首度出任外交部长，在巴黎和会上为新生的芬兰共和国争取到国际承认。此后他出任驻爱沙尼亚公使（1923—1927年）及芬兰驻国际联盟的代表，活跃于国际外交舞台。1936至1938年他再度出任外交部长，其间对纳粹德国持公开批评态度，立场亲英亲西方。冬季战争中，他代表芬兰向国际联盟提出控诉。晚年他移居美国，在斯坦福大学任教，与胡佛总统保持通信。1945年8月他在帕洛阿尔托医院因疝气手术后逝世。其子卡列维与奥拉维·霍尔斯蒂均为知名政治学家。"
