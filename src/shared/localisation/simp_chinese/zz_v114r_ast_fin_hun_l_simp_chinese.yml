 # 50. 埃罗·拉豪拉 / FIN_eero_rahola
 CBIO_FIN_eero_rahola_desc:0 "埃罗·阿克塞尔·拉豪拉（1897年1月15日—1975年5月22日）生于门塔，是芬兰海军少将。内战中他属白方、参加赫尔辛基之役，其后又参加爱沙尼亚独立战争。1919至1921年他作为芬兰军官驻意大利，曾在意舰上服役并入读意大利海军学院，1925年毕业。归国后他历任海军要职：1933至1936年任海军总参谋长，1936至1940年（含冬季战争）任岸防舰队司令，1940至1945年（含继续战争）任舰队司令，1943年晋海军少将。1941年岸防舰\"伊尔马里宁\"号沉没——芬兰海军单次最大损失——时他幸存。1945年退役后，他于1945至1964年长期出任海事总署署长。"
