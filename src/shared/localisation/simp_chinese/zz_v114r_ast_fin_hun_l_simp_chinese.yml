 # 37. 赫尔曼·戈林 / HUN_hermann_goring
 CBIO_HUN_hermann_goring_desc:0 "赫尔曼·威廉·戈林（1893年1月12日—1946年10月15日），德国纳粹党核心人物，一战王牌飞行员，后成为纳粹德国空军总司令、普鲁士总理、帝国航空部长和希特勒指定继承人之一。1930年代他负责扩张德国空军，推动四年计划，并深度参与纳粹国家的军事化与掠夺经济。二战期间，戈林在对外侵略、占领区经济掠夺、强制劳工和迫害犹太人政策中负有重大责任；其空军在战争后期逐渐失去制空权，他本人也因奢靡、腐败和指挥失误遭到批评。1945年被盟军俘获，纽伦堡审判中被判犯有战争罪和反人类罪，处以绞刑，行刑前服毒自尽。"
