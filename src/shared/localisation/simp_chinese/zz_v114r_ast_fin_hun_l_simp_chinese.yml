 # 37. 亚历山大·鲁德·米尔斯 / AST_alexander_rud_mills
 CBIO_AST_alexander_rud_mills_desc:0 "全名亚历山大·鲁德·米尔斯，1885年7月15日生于塔斯马尼亚州福思，1964年4月8日因冠心病卒于维多利亚州博克斯希尔医院，葬于蕨树谷公墓，享年78岁。律师出身，澳大利亚20世纪最早的日耳曼新异教（奥丁教）倡导者，亦是明显的反犹主义者和法西斯同情者。墨尔本大学法学院毕业（1916年）后从事律师业。1931至1934年赴欧，在英国参加奥斯瓦尔德·莫斯利的英国法西斯联盟和阿诺德·利斯的帝国法西斯联盟，接触到北欧异教复兴思潮，此后在意识形态上向种族主义神秘主义大幅转向。1934年返澳后以笔名\"塔斯曼·福斯\"出版著作，1936年在墨尔本创立\"英格尔钦奥丁教会\"，推广以白人民族优越论为核心的奥丁信仰，并创办短命报纸《国家社会主义者》和《角》。1939年出版《奥丁宗教：超越犹太基督教》。1941年加入斯蒂芬森等人的澳大利亚第一运动。1942年5月因军事情报部门认定其为纳粹同情者和安全威胁，被押往南澳大利亚拉夫代伊拘留营，同年12月获释，从未被正式起诉，事后司法审查认定无具体犯罪行为。他的奥丁主义写作此后在北欧异教复兴圈中产生深远影响，1964年去世。"
