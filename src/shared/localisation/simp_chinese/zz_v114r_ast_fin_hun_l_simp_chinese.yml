 # 50. 基拉伊·帕尔 / HUN_pal_kiraly
 CBIO_HUN_pal_kiraly_desc:0 "基拉伊·帕尔（1880年5月16日—1953年9月6日，一说1964年），匈牙利机械工程师与武器设计师，出生于布达佩斯，1902年以机械工程文凭毕业于布达佩斯工业大学，后担任助教，一战以奥匈炮兵上尉衔参战。《特里亚农条约》禁止匈牙利在国内发展武器，他遂赴瑞士，1921至1924年间在SIG纽豪森工厂工作，期间与戈特哈德·恩德共同设计了SIG KE7轻机枪系列。1928年匈牙利恢复允许武器研发后返国，加入达努维亚公司，为匈牙利皇家国防军设计\"延迟枪机后坐式\"自动武器；其代表作是1939年式达努维亚冲锋枪，后改进为1943年式，成为二战期间匈牙利军队标准配备。苏军入侵匈牙利前夕他再度出走瑞士，战后移居多米尼加共和国，受聘于圣克里斯托巴尔兵工厂，设计了克里斯托巴尔卡宾枪系列，是其\"延迟枪机\"专利技术在中美洲的延续应用。1962年为最后一款设计申请专利，约于1953至1964年间在多米尼加共和国圣多明各辞世（各方资料略有出入）。"
