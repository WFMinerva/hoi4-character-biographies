 # 44. 卡尔·奥古斯特·法格霍尔姆 / FIN_karl_august_fagerholm
 CBIO_FIN_karl_august_fagerholm_desc:0 "卡尔·奥古斯特·法格霍尔姆（1901年12月31日—1984年5月22日）生于希温托，是瑞典语裔的芬兰社会民主党政治家，出身工人家庭、早年当过理发师。他投身工会与工人报刊事业，曾任《工人报》主编，1930年起任国会议员，是北欧合作与社会政策的积极推动者。两次大战之间他长期负责社民党的北欧事务；战时任社会事务部长，曾因难民被关入劳改营、以及犹太难民被遣交盖世太保等事一度提出辞呈。1945年起他长期担任国会议长。战后他三度出任总理（1948—1950年、1956—1957年、1958年），并在1956年总统选举中以一票之差败于凯科宁。"
