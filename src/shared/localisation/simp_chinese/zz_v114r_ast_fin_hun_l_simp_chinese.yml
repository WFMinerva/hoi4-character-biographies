 # 4. 萨卡希奇·阿尔帕德 / HUN_arpad_szakasits
 CBIO_HUN_arpad_szakasits_desc:0 "萨卡希奇·阿尔帕德（1888年12月6日—1965年5月3日），匈牙利社会民主党领袖，生于布达佩斯，出身工人家庭，早年以石匠为业，后投身工会运动，历任建筑工人工会副主席、主席。1939年出任社会民主党总书记，二战期间在极端压力下坚持合法反对路线。战后进入联合政府，先后出任国务部长和副总理。起初他反对社民党并入共产党，但在拉科西的重压下最终接受合并，出任新成立的匈牙利劳动人民党主席。1948年8月3日接替被迫下台的蒂尔迪·佐尔坦，就任匈牙利共和国总统，成为战后第一位共产党籍国家元首；1949年8月宪法改革后转任总统委员会主席，直至1950年4月。同年拉科西将其以莫须有的战争罪、间谍罪、颠覆罪名逮捕，判处终身监禁。1956年革命期间获释平反，此后至辞世始终为匈牙利社会主义工人党中央委员，1965年5月3日在布达佩斯去世。"
