 # 74. 雷诺·哈拉马 / FIN_reino_hallamaa
 CBIO_FIN_reino_hallamaa_desc:0 "雷诺·亨里克·哈拉马（1899年11月12日—1979年8月11日）生于坦佩雷，是芬兰上校、芬兰无线电情报（信号侦察）体系的创建者与长期主管。他早年为铁路电报员，1918年内战中加入白军任通信兵。战后转入海军当通信员，在苏尔萨里岛的前沙俄电台开始监听苏联海军通信。1927年他被调入国防司令部情报处（以\"统计办公室\"为掩护），奉命从零建立信号情报机构。他走遍德、奥、瑞士、波兰等国考察密码学与监听技术，招募数学家与俄语翻译，建立监听站。1934年首次破解苏联红海军密码，此后又陆续破译多国外交密码。1937年他出版芬兰首部密码学专著。冬季战争前夕（1939年11月29日），他的部门截获并破译了苏联下达进攻芬兰的命令。二战期间他始终主管信号侦察。1944年9月他参与策划\"北极星行动\"，将芬兰信号情报的档案、设备与约七百五十名人员秘密转移至瑞典，以免落入苏联之手。"
