 # 51. 弗洛伦丝·V·麦肯齐 / AST_florence_v._mckenzie
 CBIO_AST_florence_v._mckenzie_desc:0 "原名弗洛伦丝·维奥莱特·格兰维尔，幼年随继父改姓华莱士，1924年嫁工程师塞西尔·麦肯齐后以\"麦肯齐太太\"人尽皆知。1890年9月28日生于墨尔本，1982年5月23日卒，享年91岁。澳大利亚首位取得电气工程学文凭的女性（悉尼技术学院，1923年），首位持有业余无线电操作执照的女性（1922年），首位获认证的女性无线电报员（1924年），也是无线学会首位女性成员。1922年在悉尼皇家拱廊开设无线电商行，同年创办《无线电周刊》，1934年创立女性电气协会。1939年她预见战争将至，在克拉伦斯街自费租房创办女子紧急信号队，以摩尔斯电码、旗语和国际信号码义务培训妇女，目标是以受训女性取代男性通信岗位，为男性腾出战斗职位。1941年4月她突破反对阻力，成功说服海军部接受14名WESC女性报务员入役——这14人成为澳大利亚皇家海军女子服务队的创始成员，是澳大利亚首支女性制服化海军服务机构。此后持续为海军、陆军、空军和美军提供培训，战争结束前共训练约12000名男性和3000名女性，约三分之一投身军旅。1950年获OBE勋章，1955年关闭学校，1982年安然去世，以\"Mrs Mac\"留存于数千名学员记忆中。"
