 # 77. 雅各布·沃扎 / AST_jacob_vouza
 CBIO_AST_jacob_vouza_desc:0 "全名雅各布·查尔斯·沃扎，约1892年生于所罗门群岛瓜达尔卡纳尔岛塔辛博科，1984年3月15日卒，享年约92岁，葬于其所罗门群岛军装。英属所罗门群岛土著警察军官，二战中协助美国海军陆战队守卫瓜达尔卡纳尔岛，以不屈于敌方酷刑的英雄事迹享誉太平洋战区。1916年加入所罗门群岛保护地武装警察队，在马莱塔岛主持武装警察工作多年，1941年以中士长军衔退役——此时距日军入侵仅数月。1942年日军占领瓜达尔卡纳尔后立即志愿复役，在英国官员马丁·克莱门斯少校指挥下担任美军的本地侦察员。1942年8月7日美国海军陆战队第1师登陆后，沃扎成为其首席侦察员。8月20日执行潜入任务时遭市一川支队日军俘获，身上查出美军赠予的一面美国国旗，日军指挥官随即对其施以逼供，沃扎始终守口如瓶；日军用刺刀在其胸部和咽部刺以7刀，将其绑在树上弃置等死。沃扎以牙齿咬断绑绳，带着重伤爬行数公里穿越丛林抵达美军防线，在接受任何治疗之前先向美军发出警告：市一川部队约250至500名日军即将于几分钟内发起攻击——这十分钟的宝贵预警使第1海军陆战队第2营得以加固伊卢河口防线，随后的坦纳鲁战役以美军完胜告终。住院12天后重返前线，随卡尔森突击队执行30天深入敌后奇袭。战后荣获美国银星勋章（由范德格里夫特将军亲授）、荣誉军团勋章，并被授予美国海军陆战队荣誉中士长军衔；英国政府授予乔治勋章和警察长服务奖章，1957年获MBE，1979年获伊丽莎白二世授封KBE爵位——是所罗门群岛历史上获此殊荣的第一人。战后历任区长和瓜达尔卡纳尔理事会主席，1968年赴美访问。去世时仍身着海军陆战队制服、门前飘扬着一面美国国旗——那正是他当年被日军发现的那面。"
