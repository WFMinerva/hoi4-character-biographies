 # 58. 拜特伦·伊什特万 / HUN_istvan_bethlen
 CBIO_HUN_istvan_bethlen_desc:0 "拜特伦·伊什特万（1874年10月8日—1946年10月5日），匈牙利总理，生于特兰西瓦尼亚吉尔盖尼奥（今罗马尼亚盖尔吉尼亚），出身特兰西瓦尼亚古老贵族家庭，受过法律教育。1921年4月出任总理，至1931年8月任职长达十年，是两战期间任期最长的匈牙利政府首脑，政治史地位举足轻重。他建立了高度巩固的保守主义威权体制，史称\"拜特伦体制\"：通过操控选区、限制新闻自由、实行公开投票等手段确保执政党始终掌握议会多数；同时以务实主义稳住经济，以国际联盟贷款（1924年）使匈牙利走出战后通胀泥潭，实现了一段时期的相对繁荣。外交上力推修订《特里亚农条约》、收复失地，但刻意保持与列强的均衡距离，避免过分依赖任何一方。1929年全球经济危机爆发后，他无力应对社会经济压力，1931年辞职。此后虽仍为保守派精英领袖，却逐步对极右化路线产生抵触；1944年德军占领后遭逮捕，被苏联带走关押。1946年10月5日在莫斯科监狱中死去，终究未能亲见战后匈牙利的新秩序建立。"
