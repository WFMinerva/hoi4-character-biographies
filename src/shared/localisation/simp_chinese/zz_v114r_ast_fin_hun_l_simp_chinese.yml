 POLITICS_FIN_PAAVO_TALVELA_DESC:0 "帕沃·尤霍·塔尔韦拉（1897年2月19日—1973年9月30日）是芬兰步兵上将、耶格尔运动成员，以进攻型指挥风格著称。他早年在普鲁士皇家第27耶格尔营服役，参加内战（白军），战后投身亲缘战争，曾任奥涅奇（奥卢涅茨）远征军司令。两战之间，他参与创建学院派卡累利阿学会，并卷入拉普阿运动，1930年为其筹组了\"农民进军\"。冬季战争中，他临危请缨，指挥\"塔尔韦拉集群\"在托尔瓦耶尔维之战中取得芬军开战以来的首场重大胜利，并因此成为史上第二位获颁曼纳海姆十字勋章者。继续战争初期，他指挥第六军在拉多加-卡累利阿方向进攻。1942至1944年，他出任芬兰驻德军最高统帅部的代表，早在1940年底便曾在柏林会晤哈尔德与戈林。他长于独立指挥进攻，性情高傲而执拗。1944年9月他离开军队，战后一度旅居巴西，1966年退役时晋步兵上将。"

 # 22. 帕沃·苏西泰瓦尔 / FIN_paavo_susitaival
 CBIO_FIN_paavo_susitaival_desc:0 "帕沃·苏西泰瓦尔（1896年2月9日—1993年12月27日）是芬兰军官、作家与政治人物，也是两战之间民族主义运动的活跃分子。他早年因为第27耶格尔营走私志愿者而知名，一战期间为躲避沙俄密探，将姓氏改为\"苏西泰瓦尔\"（意为\"狼之路\"）。内战中他属白军。他曾以次要角色参与门察拉暴动，并因此入狱。1939年，他代表极右政党\"爱国人民运动\"当选国会议员；冬季战争爆发时，他是仅有的三位主动申请上前线的议员之一，以中校身份指挥\"苏西支队\"在苏穆萨尔米作战，继续战争中亦任多个指挥职。尽管富有领导力与个人魅力，但其桀骜苛刻的性格以及与曼纳海姆等人的不和，使他终其军旅未能再获晋升。战后他退役，在拉彭兰塔以作家为业，享年97岁；当地有街道以他命名。他曾以\"三场战争、两次叛乱、四度入狱\"自况一生。"
