 # 27. 维尔约·埃纳尔·图翁波 / FIN_wiljo_einar_tuompo
 CBIO_FIN_wiljo_einar_tuompo_desc:0 "维尔约（维尔霍）·埃纳尔·图翁波（1893年9月23日—1957年11月25日）生于波尔奈宁，是芬兰中将。他早年在普鲁士皇家第27耶格尔营服役，1918年回国参加内战（白军），参与攻取维堡。两战之间，他于1935至1939年、1940至1941年两度出任边防军司令。冬季战争中，他任北芬兰集群司令，统辖拉普兰集群与北卡累利阿集群等部。继续战争期间（1941—1944年），他在米凯利的大本营出任司令部参谋长，是曼纳海姆身边的要员，1941年晋中将。他于1945年退役，曾赴瑞典与家人团聚，1948年返芬时被受共产党影响的国家警察拘留盘问五日，因查无理由而获释。"
