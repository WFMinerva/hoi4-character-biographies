 # 51. 塞尔·约瑟夫 / HUN_jozsef_szell
 CBIO_HUN_jozsef_szell_desc:0 "塞尔·约瑟夫（1880年10月14日—1956年8月27日），匈牙利政治家，出身古老贵族家庭，为前总理卡尔曼·塞尔之侄。1937至1938年担任匈牙利内政部长，任期介于凯赖斯泰什-菲舍尔的两段任期之间。他的政治立场较为温和保守，与霍尔蒂体制的主流精英阶层相近，但任职时间较短，史迹留存不丰。1956年8月27日辞世，享年七十五岁。"
