 # 65. 盖勒·艾尔诺 / HUN_erno_gero
 CBIO_HUN_erno_gero_desc:0 "盖勒·艾尔诺（1898年7月8日—1980年3月12日），原名辛格·艾尔诺，匈牙利共产党领袖，出生于特尔贝盖茨（今斯洛伐克特雷布绍夫采），犹太家庭。1918年加入匈牙利共产党，库恩·贝拉政权覆灭后流亡苏联；此后以共产国际特工身份在多国活动，西班牙内战期间参与指导加泰罗尼亚共产主义力量，有组织清洗\"托洛茨基分子\"的记录，被称为\"巴塞罗那屠夫\"。1944年随苏联红军返匈，迅速跻身权力核心，历任交通部长（1945年）、财政部长（1948年），推动激进工业化，留下了要把匈牙利建成\"铁与钢之国\"的强硬主张。1956年7月拉科西被迫下台后，他继任匈牙利劳动人民党第一书记，却因与拉科西毫无二致的强硬路线而无法平息社会积怨。1956年10月23日，他在广播中以强硬言辞斥责抗议者，直接点燃了革命怒火；10月25日被苏联施压迫使辞职，由卡达尔接掌党务，随即流亡苏联。1960年返回匈牙利，1962年被开除党籍；晚年以翻译为业，默默居住于布达佩斯，直至1980年3月12日辞世。"
