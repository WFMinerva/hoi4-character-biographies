 # 4. 奥托·维勒·库西宁 / FIN_otto_wille_kuusinen
 CBIO_FIN_otto_wille_kuusinen_desc:0 "奥托·维勒·库西宁（1881年10月4日—1964年5月17日）是芬兰裔苏联政治家、文学史家与诗人，生于劳卡村一个裁缝家庭。他早年领导芬兰社会民主党（1911—1917年任主席），1918年成为芬兰社会主义工人共和国的领导人之一；内战中红方失败后，他逃往苏俄，参与创建芬兰共产党，并长期担任共产国际的要职。1939年冬季战争爆发时，他被推为苏联扶植的傀儡政权\"芬兰民主共和国\"（泰里约基政府）首脑，与莫洛托夫签署互助条约；但战事不顺，该政权随和约解散。此后他出任卡累利阿-芬兰苏维埃社会主义共和国最高苏维埃主席团主席（1940—1956），并跻身苏共最高领导层，1957至1964年任苏共中央书记。他是唯一安葬于莫斯科克里姆林宫红墙下的芬兰人。其女赫尔塔·库西宁亦为芬兰著名共产党人。"
