 # 43. 卡尔·哈拉尔德·维克 / FIN_karl_harald_wiik
 CBIO_FIN_karl_harald_wiik_desc:0 "卡尔·哈拉尔德·维克（1883年4月13日—1946年6月26日）是瑞典语裔的芬兰记者与社会民主党左翼理论家。他长期是党内左翼的代表人物，1926至1936年任社民党书记，反对坦纳偏改良、与非社会主义者结盟的路线，担心此举会把激进工人推向库西宁的地下共产党。1940年，他与另外五名社民党议员因鼓吹公民自由、主张对苏修好而被开除出党，组成短命的社会主义议会党团；该派成员在继续战争期间（1941—1944年）以叛国罪入狱。1944年停战获释后，维克成为芬兰人民民主联盟的创建者与领导人之一，旋即又因公开宣扬社会主义而与共产党发生龃龉。"
