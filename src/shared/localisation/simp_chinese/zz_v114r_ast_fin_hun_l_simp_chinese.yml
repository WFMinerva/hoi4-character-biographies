 # 60. 比利·休斯 / AST_billy_hughes
 CBIO_AST_billy_hughes_desc:0 "全名威廉·莫里斯·休斯，1862年9月25日生于英国伦敦，1952年10月28日卒于悉尼，享年90岁。澳大利亚历史上任职最长的联邦议员（1901至1952年，逾51年），代表六个不同政党、领导五个政党、被三个政党开除或辞党，却始终未曾失去议席，以此独一无二的政治韧性著称。威尔士工人家庭出身，移澳后做过教师、码头工人、厨师和书记员，后以工会律师起家，1901年当选工党联邦众议员。1915至1923年任第七任总理，是一战期间澳大利亚最重要也最具争议的领导人：两次力推海外征兵公投（1916年10月、1917年12月），均以反对票告败，本人因此被工党开除，随即改组国民党继续执政，任期长达八年。1919年在凡尔赛和会上据理力争，为澳大利亚争得前德属新几内亚的委任统治权，并以强硬立场令威尔逊总统怒斥其\"汪洋中的毒蛇\"。1923年迫于乡村党领袖佩奇宣布拒绝与其共事的压力辞职，此后历经多党更迭，1931年加入联合澳大利亚党，持续活跃于议会。1930年代多次发出对日本帝国主义的预警，1940至1941年任海军大臣期间，麦肯齐太太正是向他游说接纳女性通信员入伍——初期遭其断然拒绝，后被优秀测试成绩所折服，最终促成女子皇家澳大利亚海军服务队成立。1952年以90岁高龄在任上（时任文教大臣）去世，是迄今唯一一位以现任国会议员身份在世超过50年的澳大利亚联邦政治人物。"
