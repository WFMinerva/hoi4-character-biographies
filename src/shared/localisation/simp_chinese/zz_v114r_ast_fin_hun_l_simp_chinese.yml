 # 9. 费凯泰哈尔米-采伊德纳·费伦茨 / HUN_ferenc_feketehalmyczeydner
 CBIO_HUN_ferenc_feketehalmyczeydner_desc:0 "费凯泰哈尔米-采伊德纳·费伦茨（1890年11月22日—1946年11月5日），德裔匈牙利军事将领，出生于匈牙利皮什基（今罗马尼亚），原名弗兰茨·采德纳，两战间改用匈牙利化姓氏。一战以炮兵与参谋军官身份服役，战后历任军事学院战术教官、国防部多个要职，至1941年晋升中将，出任第五军军长。1942年1月，他在匈牙利占领的巴奇卡地区（今塞尔维亚）策划并执行大规模\"肃清行动\"：先在扎布利亚村灭村，随后于1月21—23日在新萨德发动大屠杀，三天内杀害约800名犹太人与塞尔维亚人，整个行动共造成逾3808名平民罹难，死者遗体被抛入冰封的多瑙河。此事件激起匈牙利国内强烈抗议。1943年12月以战争罪被判处15年，随即与同案犯潜逃维也纳，纳粹德国拒绝引渡并将其接纳入武装党卫军。1944年箭十字党上台后返回匈牙利任国防部副部长，1945年向美军投降，被引渡南斯拉夫，1946年11月5日在扎布利亚被绞决，与新萨德大屠杀的受害者同在一片土地上画下了历史的句号。"
