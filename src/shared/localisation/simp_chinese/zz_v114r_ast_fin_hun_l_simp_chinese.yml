 # 64. 米纳·西兰佩 / FIN_miina_sillanpaa
 CBIO_FIN_miina_sillanpaa_desc:0 "米纳·西兰佩（原名维尔赫尔米娜·里克蒂格，1866年6月4日—1952年4月3日）生于约基奥伊宁一个贫苦农家，是芬兰工人运动先驱、社会民主党政治家与记者，芬兰首位女性内阁部长。她十二岁起在福尔萨棉纺厂做工，后辗转到波尔沃与赫尔辛基当女佣，将名字改为\"米纳·西兰佩\"（意为\"桥旁人\"）。1898年起她投身家庭佣工权益运动，1901年出任佣人协会理事。1907年芬兰首次议会选举中，她当选为首批十九名女议员之一，此后分四个时段担任国会议员，累计任期长达三十八年，至今仍保持芬兰女议员的最高纪录。1926至1927年，她在坦纳内阁出任社会事务部副部长，成为芬兰第一位女性阁员。她也是多份工人妇女刊物的主编，并致力于建立单亲母子庇护所。2016年，芬兰政府将10月1日定为纪念她的法定升旗日。"
