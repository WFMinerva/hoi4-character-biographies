 # 20. 尤霍·海斯卡宁 / FIN_juho_heiskanen
 CBIO_FIN_juho_heiskanen_desc:0 "尤霍·亨里克·海斯卡宁（1889年12月18日—1950年12月11日）生于皮耶利森苏，是芬兰少将。他1915年加入耶格尔运动，在普鲁士皇家第27耶格尔营服役；1916年在于韦斯屈莱被宪兵逮捕、押往彼得格勒，翌年十月革命期间获释返芬。内战中他属白军，战前在最高统帅部任副总监并负责筑垒工程。冬季战争爆发之初，他出任第四军军长（防区在拉多加湖以北），但因战局不利，于1939年12月4日被总司令曼纳海姆解职，由沃尔德马尔·黑格隆德接任；其后他改任维堡卫戍司令。继续战争期间，他在军事训练总监之下任特别任务军官。"
