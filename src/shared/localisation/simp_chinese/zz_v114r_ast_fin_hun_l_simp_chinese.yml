 # 11. 亚瑟·艾伦 / AST_arthur_allen
 CBIO_AST_arthur_allen_desc:0 "全名亚瑟·塞缪尔·艾伦，绰号\"圆滚滚\"，1894年3月10日生于悉尼赫斯特维尔，1959年1月25日因高血压脑血管病卒于悉尼协和医院。会计师和陆军少将。一战期间以审计员身份赴欧，历经加利波利前线增援、波西埃尔、梅西纳、马恩河和兴登堡防线等血战，荣获杰出服役勋章和法国战争十字勋章，以中校军衔指挥第48营结束战争。战后继续担任民兵军官，并在悉尼经营会计事务所。1939年10月出任第6师第16旅旅长，赴北非参加巴迪亚和托布鲁克战役，表现出色，继而参加希腊撤退行动，1941年6月升任第7师师长，指挥部队对黎巴嫩和叙利亚维希法国驻军的作战，1942年1月获准将军衔。太平洋战争爆发后1942年3月回国，8月赴莫尔斯比港接管科科达战线指挥，率第7师成功在约里拜瓦阻截日军并转入反攻。然而麦克阿瑟和布莱梅以追击速度过慢为由——多数史家认为此批评极为不公，无视欧文斯坦利山脉的丛林地形和补给困难——于10月29日解除艾伦指挥权。1944年10月布莱梅曾建议授予艾伦骑士指挥勋章，但始终未获任命。1945年4月退役，1959年去世，享有军礼葬礼。"
