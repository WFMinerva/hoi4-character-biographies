 # 64. 泰莱基·帕尔 / HUN_pal_teleki
 CBIO_HUN_pal_teleki_desc:0 "泰莱基·帕尔（1879年11月1日—1941年4月3日），匈牙利总理与地理学家，生于布达佩斯，出身古老特兰西瓦尼亚贵族家庭。以地理学家声名卓著，著有多部关于亚洲及匈牙利地理的重要著作，并以制作1919年\"民族地图\"——展示匈牙利民族分布以供巴黎和会参考——而广为人知。1920至1921年首度出任总理，任内主持通过《特里亚农条约》后的国家重建工作，推动了第一部反犹太法（1920年）。1939年2月再度出任总理，任内外交处境愈发艰难：1940年11月他签署加入轴心国《三国公约》，但同时秘密向波兰流亡政府提供庇护与援助通道，允许数十万波兰难民经匈牙利出逃。1941年3月，德国要求匈牙利允许国防军借道匈牙利领土发动对南斯拉夫的入侵，以换取昔日盟友南斯拉夫的领土——这与匈牙利刚刚签订的《永久友好条约》（匈南友好条约，1940年12月）直接抵触。他多方斡旋未果，认为默许此举将是对国家荣誉与国际信义不可挽回的背叛，于1941年4月3日夜里在总理官邸以手枪自杀，在遗书中向摄政霍尔蒂写道匈牙利将成为\"背信弃义的民族\"。他的死在匈牙利历史上被铭记为以死抗议、以一人之殉维护国家道德声誉的最高象征之一。"
 HUN_pal_teleki_desc:0 "泰莱基·帕尔（1879年11月1日—1941年4月3日），匈牙利总理与地理学家，生于布达佩斯，出身古老特兰西瓦尼亚贵族家庭。以地理学家声名卓著，著有多部关于亚洲及匈牙利地理的重要著作，并以制作1919年\"民族地图\"——展示匈牙利民族分布以供巴黎和会参考——而广为人知。1920至1921年首度出任总理，任内主持通过《特里亚农条约》后的国家重建工作，推动了第一部反犹太法（1920年）。1939年2月再度出任总理，任内外交处境愈发艰难：1940年11月他签署加入轴心国《三国公约》，但同时秘密向波兰流亡政府提供庇护与援助通道，允许数十万波兰难民经匈牙利出逃。1941年3月，德国要求匈牙利允许国防军借道匈牙利领土发动对南斯拉夫的入侵，以换取昔日盟友南斯拉夫的领土——这与匈牙利刚刚签订的《永久友好条约》（匈南友好条约，1940年12月）直接抵触。他多方斡旋未果，认为默许此举将是对国家荣誉与国际信义不可挽回的背叛，于1941年4月3日夜里在总理官邸以手枪自杀，在遗书中向摄政霍尔蒂写道匈牙利将成为\"背信弃义的民族\"。他的死在匈牙利历史上被铭记为以死抗议、以一人之殉维护国家道德声誉的最高象征之一。"
