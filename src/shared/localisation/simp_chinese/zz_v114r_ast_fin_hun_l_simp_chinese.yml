 # 49. 埃斯科·列基 / FIN_esko_riekki
 CBIO_FIN_esko_riekki_desc:0 "埃斯科·列基（1891年4月29日—1973年10月30日）生于奥卢一个富裕商人家庭，是芬兰的耶格尔招募者、国民联合党人与侦查中央警察首脑。一战期间他在芬兰组织偷运志愿者赴德，1916年被俄方逮捕、囚于彼得格勒的施帕列尔纳亚监狱，与日后拉普阿运动领袖科索拉同囚一室。1918年他任耶格尔上尉瓦勒纽斯所率维埃纳远征的情报主管，战后任托尔尼奥警察局长。1923年起（年仅32岁）他出任侦查中央警察末任暨任期最久的首脑，将其打造为高效的反共秘密警察，被称作\"白色芬兰的看门狗\"；对来自极右拉普阿运动的威胁他则态度暧昧。1937至1938年 EK 改组为国家警察后，他在内政部长凯科宁任内被迫去职，转任《新苏奥米报》总经理；战时他是芬兰党卫军志愿营的关键组织者之一。"
