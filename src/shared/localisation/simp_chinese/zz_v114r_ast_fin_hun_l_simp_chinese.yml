 # 25. 汉努·汉努克塞拉 / FIN_hannu_hannuksela
 CBIO_FIN_hannu_hannuksela_desc:0 "汉努·埃萨·汉努克塞拉（1893年12月12日—1942年5月12日）是芬兰少将，炮兵出身。他生于伊尔马约基一个牧师家庭，1916年加入耶格尔运动，在普鲁士皇家第27耶格尔营中专攻炮兵；内战中服役于耶格尔炮兵，参加坦佩雷、维堡等战役。两战之间，他先后任炮兵营长、炮兵团长，并于1924至1926年就读芬兰军事学院。冬季战争中，他指挥第13师在拉多加-卡累利阿的鲁赫蒂纳安迈基一带作战，对推进的苏军发动反击。继续战争初期，他指挥第19师隶属卡累利阿集团军第七军，向索尔塔瓦拉方向进攻。1942年2月他改任第2师师长，同年5月在司令部因心脏病猝然辞世。"
 FIN_hannu_hannuksela_desc:0 "汉努·埃萨·汉努克塞拉（1893年12月12日—1942年5月12日）是芬兰少将，炮兵出身。他生于伊尔马约基一个牧师家庭，1916年加入耶格尔运动，在普鲁士皇家第27耶格尔营中专攻炮兵；内战中服役于耶格尔炮兵，参加坦佩雷、维堡等战役。两战之间，他先后任炮兵营长、炮兵团长，并于1924至1926年就读芬兰军事学院。冬季战争中，他指挥第13师在拉多加-卡累利阿的鲁赫蒂纳安迈基一带作战，对推进的苏军发动反击。继续战争初期，他指挥第19师隶属卡累利阿集团军第七军，向索尔塔瓦拉方向进攻。1942年2月他改任第2师师长，同年5月在司令部因心脏病猝然辞世。"
