 # 68. 莫里斯·布莱克本 / AST_maurice_blackburn
 CBIO_AST_maurice_blackburn_desc:0 "全名莫里斯·麦克雷·布莱克本，1880年11月19日生于维多利亚州英格尔伍德，1944年3月31日因脑瘤卒于普拉伦，享年63岁，葬于博克斯希尔公墓。律师兼社会主义政治家，以终身捍卫工人权益和公民自由著称，其创立的\"布莱克本律师行\"至今仍是澳大利亚进步法律力量的象征。在墨尔本文法学校受教育，1909年毕业于墨尔本大学艺术和法律，随即开始法律实践，同年加入维多利亚社会党编辑党报《社会主义者》。1914年参加一战反战运动，反对海外征兵制，与劳工党主流立场多次抵触。1914至1943年间历任维多利亚州议会和联邦众议院议员（历经多次席位和选区变动），是澳大利亚联邦议会史上最重要的劳工左翼声音之一。法律实践中取得数项里程碑判决：确立了40小时工作周、原住民工人和女性同等工资的先例。1935年为捷克反法西斯作家埃贡·基什抵制驱逐出境的高等法院案件提供辩护。因先后加入\"反战与反法西斯运动\"（1935年）和\"澳中友好协会\"（1941年），两度被劳工党开除，以无党籍独立人士继续议政，1943年败选，隔年即因病去世，未及亲见战争终结。总理柯廷在悼词中称其为\"联邦人民伟大的公仆之一\"。"
