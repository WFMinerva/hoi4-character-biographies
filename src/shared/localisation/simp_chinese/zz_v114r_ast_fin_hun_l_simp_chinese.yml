 # 2. 佩尔·埃温德·斯温胡武德 / FIN_pehr_evind_svinhufvud
 CBIO_FIN_pehr_evind_svinhufvud_desc:0 "佩尔·埃温德·斯温胡武德（1861年12月15日—1944年2月29日）生于塞克斯迈基，出身芬兰瑞典语裔贵族，是芬兰独立的元勋之一，第三任总统（1931—1937）。他早年为律师与法官，在俄国推行\"俄罗斯化\"期间坚持维护芬兰的法律权利，1914至1917年被流放至西伯利亚。1917年回国后出任参议院主席，成为独立芬兰首任政府首脑，并向议会提出独立宣言；内战期间领导白方政府，曼纳海姆则统率军队。战后他短暂出任摄政，1918年底让位于曼纳海姆。1930年他在拉普阿运动推动下出任总理，次年当选总统。任内他既镇压共产主义势力，也平息了1932年极右翼的门察拉暴动，维护了议会制度。他以强硬反共著称，亦因平实作风得\"乌科-佩卡\"（佩卡老伯）之称，享有民间声望。1937年卸任后退居私人生活，1944年在卢马基逝世。"
