 # 5. 理查德·迪克森 / AST_richard_dixon
 CBIO_AST_richard_dixon_desc:0 "原名克利夫顿·雷金纳德·沃克，1905年5月26日生于新南威尔士州福布斯，1976年3月7日因高血压心血管疾病卒于班克斯敦。铁路工人出身，14岁辍学，先后在自行车行、邮局和新南威尔士政府铁路及电车局做工。1925年在劳动运动中觉醒，1929年7月加入澳大利亚共产党，同年成为党悉尼分支书记和澳大利亚铁路工会分支书记。1929年12月作为迈尔斯-夏基阵营成员当选中央执行委员会，历任至1974年。1931年1月赴莫斯科列宁国际学校就读，1932年夏在集体农庄工作，1933年3月返澳时改名\"理查德·迪克森\"以躲避安全部门监控，随即被列为\"危险革命分子\"。1937年升任党副总书记，1948年当选全国主席，任职至1972年，在党内影响力长达四十余年。1945年公开批评\"白澳政策\"为与希特勒种族理论如出一辙的种族主义。1951年和1953年两度以共产党候选人身份竞选参议院均告落选；1954年彼得罗夫皇家委员会调查期间作为党的代理出席。1960年代支持CPA走向独立路线，1968年谴责苏联入侵捷克斯洛伐克。1976年在班克斯敦去世。"
 AST_richard_dixon_desc:0 "原名克利夫顿·雷金纳德·沃克，1905年5月26日生于新南威尔士州福布斯，1976年3月7日因高血压心血管疾病卒于班克斯敦。铁路工人出身，14岁辍学，先后在自行车行、邮局和新南威尔士政府铁路及电车局做工。1925年在劳动运动中觉醒，1929年7月加入澳大利亚共产党，同年成为党悉尼分支书记和澳大利亚铁路工会分支书记。1929年12月作为迈尔斯-夏基阵营成员当选中央执行委员会，历任至1974年。1931年1月赴莫斯科列宁国际学校就读，1932年夏在集体农庄工作，1933年3月返澳时改名\"理查德·迪克森\"以躲避安全部门监控，随即被列为\"危险革命分子\"。1937年升任党副总书记，1948年当选全国主席，任职至1972年，在党内影响力长达四十余年。1945年公开批评\"白澳政策\"为与希特勒种族理论如出一辙的种族主义。1951年和1953年两度以共产党候选人身份竞选参议院均告落选；1954年彼得罗夫皇家委员会调查期间作为党的代理出席。1960年代支持CPA走向独立路线，1968年谴责苏联入侵捷克斯洛伐克。1976年在班克斯敦去世。"
