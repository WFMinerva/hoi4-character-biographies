 # 55. 杰克·兰 / AST_jack_lang
 CBIO_AST_jack_lang_desc:0 "全名约翰·托马斯·兰，1876年12月21日生于悉尼，1975年9月27日以98岁高龄在悉尼去世，绰号\"大个子\"，是澳大利亚历史上最富传奇色彩的州级政治人物。14岁辍学，做过报童、车夫和书记员，后以房地产经纪人起家进入政界。1913年当选新南威尔士州议会，1923至1939年任劳工党州领袖，两度出任新南威尔士总理：第一任期（1925—1927年）引入儿童补贴制度和寡妇养老金，争取到44小时工作周和免费中学教育；第二任期（1930—1932年）适逢大萧条最深处，公然反对联邦政府主导的财政紧缩\"总理方案\"，推出\"兰计划\"——停止向英国债权人支付利息，以储备金黄金定价重新谈判——被保守媒体称为\"财政革命者\"。1932年3月19日悉尼海港大桥通车典礼，被新卫士运动成员弗朗西斯·德·格鲁特骑马抢先割断彩带，未能完成剪彩仪式；同年5月13日因其财政行动触犯联邦法律，新南威尔士总督菲利普·盖姆以\"违法行为\"将其解职——这是澳大利亚历史上第一次解职州总理，为日后1975年联邦层面的宪政危机埋下先例。此后兰被劳工党于1943年开除党籍，另组兰工党，政治影响力逐渐消退，1946年落选告别议会，1975年去世。"
