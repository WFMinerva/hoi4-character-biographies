 # 8. 约瑟夫·奥古斯特·冯·哈布斯堡 / HUN_joseph_august_von_habsburg
 CBIO_HUN_joseph_august_von_habsburg_desc:0 "约瑟夫·奥古斯特·冯·哈布斯堡（1872年8月9日—1962年7月6日），哈布斯堡-洛林家族匈牙利支脉成员，生于匈牙利阿尔乔特庄园，祖父为历任匈牙利摄政超过五十年的约瑟夫大公，家族与匈牙利渊源极深。一战期间驰骋加利西亚、喀尔巴阡、意大利、巴尔干诸战场，因战功卓著深受匈牙利士兵爱戴，1918年10月24日晋升陆军元帅，成为奥匈帝国历史上最后一位获此衔者。1918年10月27日，末代皇帝卡尔任命他为匈牙利\"国王全权代表\"；翌年苏维埃共和国覆灭后的1919年8月，他短暂出任匈牙利国家元首，任命弗里德里希·伊什特万为总理，旋因协约国拒绝接受哈布斯堡成员领导匈牙利，被迫于1919年8月23日辞职。此后留居匈牙利，出任议会上院议员及匈牙利科学院院长（1936—1944年），一度被视为霍尔蒂之后摄政职位的候选人之一。1944年德军占领匈牙利后流亡美国，战后定居西德，1962年7月6日在巴伐利亚雨城附近去世。"
