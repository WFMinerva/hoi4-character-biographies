 # 47. 多萝西·坦尼 / AST_dorothy_tangney
 CBIO_AST_dorothy_tangney_desc:0 "全名多萝西·玛格丽特·坦尼，1907年3月13日生于西澳大利亚州北珀斯，1985年6月3日卒于珀斯温布利，享年78岁。爱尔兰裔天主教劳工家庭出身，父为机车司机，家境贫寒。以奖学金完成圣约瑟夫学院学业，15岁取得毕业证后边任教边修读西澳大学，1927年取得文学学士，1932年取得教育学文凭。长期活跃于教师工会和澳大利亚劳工党，1931年任维多利亚劳工党主席，1936年和1939年两度以劳工党身份挑战西澳奈德兰兹选区（传统保守党铁票仓）均告落选，以失败积累参政经验。1943年联邦大选劳工党大胜，坦尼以候补席位身份意外进入参议院，与同日当选众议员的埃妮德·莱恩斯共同成为联邦议会历史上首批女性议员；坦尼宣誓比莱恩斯早6分钟，由此成为史上首位女性参议员。此后连续四届蝉联（1946、1951、1955、1961年），代表西澳劳工党在参议院服务长达25年，是历任女性议员中最长记录的保持者，直至1999年方被超越。在任期间积极推动联邦介入社会保障、住房、教育和全民医疗，参与23个委员会并主导13个，以广博热情和亲民风格著称。1960年代两度临时主持参议院，成为首位主持联邦议院的女性。1967年因党内候选人票选机制改变被降至第三位（通常不可当选之位）后落选，1968年任期届满卸任，同年获颁DBE爵位。1985年去世。"
