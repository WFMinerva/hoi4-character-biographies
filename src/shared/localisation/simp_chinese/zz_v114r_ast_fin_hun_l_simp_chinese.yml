 # 63. 理查德·威廉姆斯 / AST_richard_williams
 CBIO_AST_richard_williams_desc:0 "全名理查德·威廉姆斯，1890年8月3日生于南澳大利亚州姆塔矿区，1980年2月7日卒于墨尔本，享年89岁。澳大利亚皇家空军\"奠基之父\"，澳大利亚军队第一位接受飞行训练的军官（1914年8月19日），三度出任空军参谋长，在职时间总计13年，为历任之冠，其贡献奠定了皇家澳大利亚空军作为独立军种的制度根基。工人阶级家庭出身，早年在矿业城镇做银行职员，1909年入民兵，1914年加入澳大利亚飞行军团参加一战，在巴勒斯坦和西奈战役中指挥第1中队，1917年曾冒险深入敌后营救遭击落飞行员，荣获杰出服役勋章，1918年晋升中校指挥皇家飞行队一个联队（含三个英国中队）。1921年3月31日主导创建皇家澳大利亚空军，出任首任参谋长，随后数十年以个人意志和制度坚守抵抗陆军和海军吞并空军的持续压力，赢得\"皇家澳大利亚空军之父\"美誉。1939年因飞行安全报告遭不公正处置被迫离职，二战中虽被任命为空军元帅（皇家澳大利亚空军首位达此军衔），却始终被排拒于总参谋长职位之外——先被孟席斯以英国人伯内特取代，再被柯廷以乔治·琼斯取代，愤慨之情终身未消。1941年赴英建立皇家澳大利亚空军海外总部，为驻欧澳大利亚飞行员争取国籍权益。1946年被迫提前退役，此后担任澳大利亚民用航空总监近十年，1955年获封爵士，1980年去世。"
