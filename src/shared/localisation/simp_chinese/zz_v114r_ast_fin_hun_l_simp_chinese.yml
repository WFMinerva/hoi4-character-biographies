 # 18. 德克莱瓦·佐尔坦 / HUN_zoltan_decleva
 CBIO_HUN_zoltan_decleva_desc:0 "德克莱瓦·佐尔坦（1887年7月30日—1950年7月17日），匈牙利陆军上将，出生于今斯洛伐克多尔内塞梅罗夫采（旧属匈牙利下奥地利省），毕业于佩奇军事学院，1906年任步兵少尉。一战中在战场上历经四十二个月，战间期历任第一混合旅参谋长、国防部训练局长、陆军副总参谋长等要职，1938年晋升为将军。1940年出任第1军军长，参与西匈牙利回归后的相关行动及特兰西瓦尼亚\"解放\"行动。1941年4月在德军发动巴尔干战役时，他指挥第一军参与对南斯拉夫的入侵行动。同年5月至10月担任参谋长副职，11月改任陆军副总司令。1941年11月至1942年12月，他出任匈牙利第3集团军司令，部队主要在被占领的南斯拉夫领土上执行占领任务。1943年2月1日退役，此后以平民身份度过余生，1950年7月17日在布达佩斯去世。"
