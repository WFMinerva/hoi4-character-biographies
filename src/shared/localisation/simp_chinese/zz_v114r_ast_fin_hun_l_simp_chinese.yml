 # 43. 兰斯·夏基 / AST_lance_sharkey
 CBIO_AST_lance_sharkey_desc:0 "全名劳伦斯·路易斯·夏基，1898年8月19日生于新南威尔士州卡戈附近的沃里溪农场，1967年5月13日因冠心病猝死于悉尼，享年68岁，遗体火化。澳大利亚共产党历史上任期最长、影响最深的领导人，正统斯大林主义者。爱尔兰裔天主教家庭出身，父母均从农，14岁辍学做马车匠学徒，后做农场工人，受流浪工人影响接触反兵役主义。战后移居悉尼做电梯员，1922年入党，投身工会运动。1929年底与迈尔斯联手推翻卡瓦纳格旧领导，赢得党代会控制权，1931至1948年任党主席。1935年赴莫斯科出席共产国际大会并当选执行委员会委员，令原以为迈尔斯更有资格的澳大利亚同僚大为意外。1940年孟席斯政府宣布CPA为非法后转入地下，1941年德苏战争爆发后重出公开。1948年取代迈尔斯出任总书记，主政至1965年。1949年3月接受记者采访时声称\"若苏联军队追击侵略者入澳，澳大利亚工人将欢迎他们\"，随即以煽动性言论罪遭起诉，高等法院维持定罪，被判三年徒刑，实际服刑13个月后出狱。1956年成功驾驭赫鲁晓夫否定斯大林的冲击，令澳共受到的震动小于多数国家兄弟党。1961年在莫斯科开会时因多数意见倒向苏联而放弃对中共立场的同情。1965年因健康原因辞职让位，1967年去世，身后留下一个忠实但支持者日渐凋零的党。"
