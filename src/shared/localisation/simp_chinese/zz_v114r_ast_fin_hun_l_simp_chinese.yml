 # 45. 埃里克·L·劳埃德 / AST_eric_l._lloyd
 CBIO_AST_eric_l._lloyd_desc:0 "全名埃里克·埃德温·朗菲尔德·劳埃德，1890年9月13日生于新南威尔士州马里克维尔，1957年7月18日卒，享年66岁。军事情报官员，澳大利亚战时安全情报机构的奠基人。父为爱尔兰裔银行员，幼年随家迁爱尔兰，就读都柏林圣安德鲁学院，后归返澳大利亚。一战中服役并获军事十字勋章。两战之间从事政府公职，历任财政部和贸易部职务。1935至1940年出任澳大利亚首任驻日贸易委员，常驻东京，持续深入观察日本军国主义扩张进程，积累了极为珍贵的日本情报经验，并于1940年太平洋局势急剧恶化前顺利撤离。1941年受命出任联邦安全调查局首任局长，成为战时澳大利亚国内安全情报工作的最高协调者，主持对德日间谍渗透、国内颠覆活动和敌国侨民的监控工作。1945年安全局改组为联邦调查局，劳埃德继续任首任局长至1952年退休，前后主持澳大利亚安全情报系统长达11年，为1949年成立的澳大利亚安全情报组织奠定了组织架构和职能体系。1957年去世。"
