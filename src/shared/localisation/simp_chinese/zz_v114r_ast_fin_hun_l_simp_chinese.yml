 # AST
 # 1. 亚历山大·霍尔-鲁斯文 / AST_alexander_hore_ruthven
 CBIO_AST_alexander_hore_ruthven_desc:0 "全名亚历山大·戈尔·阿克赖特·霍尔-鲁斯文，第一代高里伯爵，1872年7月6日生于英格兰伯克郡温莎，1955年5月2日卒于格洛斯特郡希普顿莫恩。苏格兰贵族后裔，先后就读于温彻斯特公学和伊顿公学，因视力问题辍学后赴格拉斯哥茶叶商行和印度茶园谋生，1892年因感染疟疾返英后从军。1898年9月22日在苏丹格达里夫战役中冲入马赫迪军枪林弹雨之中，数次放下伤员开枪压制敌人，将一名负伤的埃及军官拖至安全地带，凭此壮举荣获维多利亚十字勋章，系首位获此殊荣的民兵军官，1899年5月由维多利亚女王亲手授勋。此后历经索马里兰战役，一战中在加里波利严重负伤，复出后转战西线，因指挥比利时伊普尔附近战役表现卓越两度获杰出服役勋章，以准将军衔结束军旅生涯，1919至1920年间指挥英国驻德占领军。1928年出任南澳大利亚总督，大萧条期间以冷静和超党派姿态支撑莱昂内尔·希尔政府度过财政危机，深获英国殖民地事务部赞誉。1935年转任新南威尔士总督，仅一年余即由总理莱恩斯举荐升任澳大利亚第十任总督（1936年1月23日就职），任期长达九年，为历任总督之最。在任期间经历莱恩斯1939年猝然离世、法登政府不信任票倒台等宪政危机，监督五位总理（莱恩斯、佩奇、孟席斯、法登、柯廷）相继执政。独子帕特里克1942年12月24日在利比亚执行突击行动时阵亡，年仅29岁，父子均在战火中服役。1944年9月卸任返英，出任温莎城堡副督察，1945年受封高里伯爵。"
