 # 36. 鲍尔陶·卡罗伊 / HUN_karoly_bartha
 CBIO_HUN_karoly_bartha_desc:0 "鲍尔陶·卡罗伊（1884年6月18日—1964年11月22日），匈牙利军事将领与政治家，生于达尔诺克法尔瓦，席克尔贵族后裔。一战中在布达佩斯及的里雅斯特担任多个高级指挥职务，战后参与对抗捷克斯洛伐克和罗马尼亚军队的战斗，随后加入霍尔蒂国家军。1938年，伊姆雷迪总理任命他为国防部长，他历经伊姆雷迪、泰莱基、巴尔多西、卡莱四届政府始终担任此职，直至1942年9月。他在职期间的重大事件贯穿匈牙利参战史的关键节点：第一次（1938年）和第二次（1940年）维也纳裁决、占领巴奇卡及木拉维登克（1941年）、卡沙轰炸事件触发对苏宣战，以及新萨德大屠杀前的整体军事氛围，史学界认为他对亲德路线负有相当责任。1942年卡莱政府以改革需要为由将其免职。战后人民法庭认定他需为参战承担责任，军事法院将其降级并开除军籍，他随即流亡委内瑞拉，在那里担任铁路建设工程师。1964年回访林茨期间，于1964年11月22日突然辞世。"
