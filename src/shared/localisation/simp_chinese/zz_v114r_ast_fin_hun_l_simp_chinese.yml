 # 52. 小霍尔蒂·米克洛什 / HUN_miklos_horthy_jr
 CBIO_HUN_miklos_horthy_jr_desc:0 "小霍尔蒂·米克洛什（1907年2月14日—1993年3月28日），匈牙利摄政霍尔蒂·米克洛什之次子，生于布达佩斯。常被混淆的\"1942年东线坠机身亡\"经历实为其长兄霍尔蒂·伊什特万（1904年12月9日—1942年8月20日）的经历——伊什特万曾任副摄政（1942年），以预备飞行员身份亲赴东线，1942年8月20日在苏联战线驾驶匈牙利\"海雅\"战斗机时坠机身亡，其是否遭人谋害至今仍有争议。伊什特万之死令摄政深受打击，由此加速了霍尔蒂与纳粹德国的裂痕。小霍尔蒂·米克洛什本人则曾任驻巴西公使（1940—1942年），兄长去世后返国，在父亲试图与盟军媾和的外交努力中担任秘密联络角色。1944年10月15日\"装甲拳头行动\"发动当日，他正与苏联代表进行停战谈判，随即被德军党卫队指挥官斯科尔兹内率部绑架，以人质身份被押往达豪集中营，逼迫摄政就范移交政权于箭十字党。战后与父亲流亡葡萄牙埃斯托里尔，在那里安度余生，1993年3月28日辞世，是霍尔蒂四名子女中唯一一位比父亲更长寿者。"
