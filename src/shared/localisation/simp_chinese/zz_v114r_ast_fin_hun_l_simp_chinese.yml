 # 23. 库尔特·马尔蒂·瓦勒纽斯 / FIN_kurt_martti_wallenius
 CBIO_FIN_kurt_martti_wallenius_desc:0 "库尔特·马尔蒂·瓦勒纽斯（1893年7月25日—1984年5月3日）生于库奥皮奥，是芬兰少将，曾任总参谋长。他早年在普鲁士皇家第27耶格尔营服役，内战中属白军，在拉普兰一带作战，对北方边地极为熟悉。1930年他晋少将，但同年因牵涉绑架前总统斯托尔贝里一案被迫退役（曾受审、后获改判）。1930年代他投身右翼活动，任拉普阿运动秘书长，并领导了1932年的门察拉暴动，因协从叛国罪入狱一年余。冬季战争中，曼纳海姆任命他为拉普兰集群司令，所部虽寡却在萨拉、佩察莫一带击退苏军。1940年2月，他被调往维堡湾西岸应对强渡冰面的苏军，但因地形陌生、局势危殆，加之有酗酒之传闻，仅任职三天即被撤职、由奥列希接替，并被除名。继续战争中他未能再获任命，退隐于罗瓦涅米一带写作。"
