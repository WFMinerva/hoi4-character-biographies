 # 78. 雷克斯·英加梅尔斯 / AST_rex_ingamells
 CBIO_AST_rex_ingamells_desc:0 "全名雷金纳德·查尔斯·英加梅尔斯，1913年1月19日生于南澳大利亚州奥罗鲁，1955年12月30日因汽车事故卒于维多利亚州狄布拉附近，享年42岁，葬于阿德莱德佩恩汉公墓。澳大利亚诗人，\"金迪沃罗巴克运动\"的创始人，二战时期澳大利亚民族文化自主意识最具影响力的倡导者。父亲是循道宗牧师，幼年随父工作需要辗转多个南澳乡镇小学，后就读阿德莱德阿尔弗雷德王子学院，1934年取得阿德莱德大学文学学士。1930年代初赴澳大利亚中部旅行，深受原住民文化感召，由此萌发创立文化运动的构想。1935年出版第一部诗集《桉树顶》。1938年发表纲领性文章《条件文化》，创立金迪沃罗巴克运动——\"Jindyworobak\"取自原住民语词，意为\"相联\"——主张澳大利亚作家应抛弃对英国文化的盲目模仿，回归本土环境和原住民精神，以开创真正的澳大利亚文学传统。自1938年起主编年度金迪沃罗巴克诗歌选集至1953年（共15期），并以个人财力和精力资助出版逾44卷诗集和文学评论，是澳大利亚文学史上最重要的独立出版实践之一。1941年短暂参与斯蒂芬森的\"澳大利亚优先运动\"。史诗《大南方之地》（1951年）荣获格雷斯·利文诗歌奖和澳大利亚文学协会金奖。1955年圣诞节次日车祸意外身亡，年仅42岁，身后留下妻子和三子。"
