 # 3. 埃里克·坎贝尔 / AST_eric_campbell
 CBIO_AST_eric_campbell_desc:0 "1893年4月11日生于新南威尔士州扬，1970年9月2日因癌症卒于堪培拉。律师出身，家学渊源。一战中随澳大利亚帝国远征军赴法国和佛兰德斯，随第7野战炮兵旅转战马恩河和兴登堡防线，1917年11月被毒气所伤，1918年两度受嘉奖，1919年1月获杰出服役勋章，以少校军衔退役。1930年代大萧条肆虐、杰克·兰工党政府执政新南威尔士之际，坎贝尔忧虑共产主义威胁与\"机器政治\"乱象，于1931年2月18日在帝国军人俱乐部会议上创建\"新卫士运动\"，以效忠王室和大英帝国为旗帜，将组织建成军事化准军事团体。该运动巅峰时期宣称拥有逾五万名成员，以新南威尔士为主。最著名事件发生于1932年3月19日悉尼海港大桥通车典礼：新卫士成员弗朗西斯·德·格鲁特骑马抢先割断彩带，令兰无缘剪彩。1933年坎贝尔赴欧，先在伦敦与英国法西斯联盟领袖莫斯利会面，继而前往柏林和罗马考察，自称\"从头到脚都是法西斯主义者\"，回国后为运动引入法西斯礼敬和仪式，导致成员加速流失。同年将运动残部组建为\"中心运动\"，1935年州选举中落选，运动就此瓦解。1941年返乡扬城执业，1949至1950年任伯兰贡郡议会主席，晚年迁居雅斯和堪培拉，1970年去世。"
