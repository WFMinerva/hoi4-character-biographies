 # 58. 拉尔夫·托宁亨 / FIN_ralf_torngren
 CBIO_FIN_ralf_torngren_desc:0 "拉尔夫·约翰·古斯塔夫·托宁亨（1899年3月1日—1961年5月16日）生于奥卢，是瑞典语裔的芬兰政治家，瑞典族人民党主席（1945—1955）与战后总理。他在奥博学院攻读法律，取得法学士和法学博士学位。他长期任该党国会议员，先后出任社会事务部长、财政部长与外交部长，参与多届内阁。1931至1948年他兼任奥博学院基金会总裁，并在该院教授经济学。1954年5月至10月他出任总理，组建了包含农业联盟与社会民主党的联合政府。1956年总统选举中，他作为瑞典族人民党候选人获得二十张选举人票。他活跃于地方政治，在图尔库拥有广泛影响。"
