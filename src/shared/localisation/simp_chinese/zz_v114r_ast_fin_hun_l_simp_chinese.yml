 # 25. 赫伯特·劳埃德 / AST_herbert_lloyd
 CBIO_AST_herbert_lloyd_desc:0 "全名赫伯特·威廉·劳埃德，1883年11月18日生于维多利亚州南雅拉，1957年8月10日卒于悉尼科登德康复医院，享年73岁。炮兵军官兼议员，公务员起家，1906年入澳大利亚野战炮兵，1914年8月以大尉身份随第1野战炮兵旅赴埃及。一战中逐步升任多个炮兵旅指挥官，在1918年4月利斯战役中率第12炮兵旅力挡德军攻势，同年11月升准将临时军衔，获CB勋章及四次嘉奖。战后任陆军总部要职，1920年安排威尔士亲王访澳礼仪，获皇家维多利亚骑士级勋章。1925年转投真空石油公司，1929年当选帕拉马塔选区国家党议员。1931年出任埃里克·坎贝尔领导的新卫士运动副指挥官，与该右翼准军事组织关系留下历史争议。1940年重入军界，升少将接掌第2师，主要任务为防守西澳大利亚；1943年9月调任悉尼第1师师长，1945年5月出任第二集团军司令，然因年届61岁未能获得主动作战指挥机会，1946年2月退役，此后担任多家公司董事，1957年去世。"
