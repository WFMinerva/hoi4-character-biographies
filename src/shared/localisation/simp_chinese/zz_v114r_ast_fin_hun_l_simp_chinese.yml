 # 53. 拉格纳·科尔文 / AST_ragnar_colvin
 CBIO_AST_ragnar_colvin_desc:0 "全名拉格纳·穆斯格雷夫·科尔文，1882年5月7日生，1954年2月22日卒，享年71岁。英国皇家海军上将，二战爆发时担任澳大利亚皇家海军总参谋长（1937—1941年），是迄今在此职位上任期最长的非澳大利亚本土军官之一。家族渊源显赫：祖父为1857年印度大起义期间英属印度西北省副总督约翰·拉塞尔·科尔文，亲属中多有英帝国名臣。参加日德兰海战，此后历任巡洋舰舰长及参谋职务。1924至1926年出任英国驻日本海军武官，亲历日本海军快速扩张的关键时期。1927年任朴次茅斯海军战术学校校长。1937年受命出任澳大利亚皇家海军总参谋长，主持二战初期澳大利亚海军的战时扩充，监督多艘巡洋舰和驱逐舰陆续服役，参与澳英美荷联合防务规划。1940年因健康原因状态欠佳，1941年辞职返英，此后在伦敦出任澳大利亚高级专员处海军顾问（1942—1944年），1954年去世。其子约翰·科尔文（1922—2003年）曾任英国驻蒙古大使兼情报人员，孙马克·科尔文（1952—2012年）为澳大利亚知名战地记者。"
