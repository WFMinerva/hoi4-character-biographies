 # 73. 雨果·奥斯特曼 / FIN_hugo_osterman
 CBIO_FIN_hugo_osterman_desc:0 "雨果·维克托·奥斯特曼（1892年9月5日—1975年2月17日）生于赫尔辛基，是芬兰中将、耶格尔运动成员。他早年赴德在普鲁士皇家第27耶格尔营受训，1918年回国参加内战（白军），战后在军中快速晋升。1930年任国防部副部长，1933至1939年出任国防军总司令，任内推动了芬军的职业化改革、军官教育与装备现代化。冬季战争爆发后，他被任命为卡累利阿地峡军团司令，统辖六个师约二十八万人对抗约二十万苏军。他主持了曼纳海姆防线的防御作战，初期顶住了苏军的猛攻，但1940年2月苏军突破防线后，他于2月19日被免职，由海因里克斯接替。此后他出任军事训练总监，在继续战争期间（至1944年）负责全军训练与步兵监察。1944年2月至7月，他短暂出任芬兰驻德军最高统帅部联络官。"
