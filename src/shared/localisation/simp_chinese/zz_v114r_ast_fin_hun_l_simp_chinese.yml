 # 44. 埃辛顿·刘易斯 / AST_essington_lewis
 CBIO_AST_essington_lewis_desc:0 "全名埃辛顿·刘易斯，1881年1月13日生于南澳大利亚州布拉，1961年10月2日卒，享年80岁。澳大利亚最重要的工业领袖，二战战时工业动员的灵魂人物，以\"钢铁大师\"著称。父亲是牧场主兼政界人士，以父亲所拥有的北领地埃辛顿港牧场为其命名。就读阿德莱德圣彼得学院和南澳矿业学校，1904年加入必和必拓公司，在各地矿山和钢铁厂历练后迅速升任高层管理职位，1926年出任常务董事，将BHP发展为澳大利亚规模最大的工业综合企业。1930年代赴德国和日本考察期间对两国急速军事化深感忧虑，回国后坚持向政府建言加强战备，并亲赴美国考察工业动员体制。1940年出任军需品总统筹，1941年同时兼任航空器生产总统筹，统领澳大利亚全国军工生产的规划与协调，覆盖弹药、舰艇、飞机和军事装备制造。他以工业家的眼光和铁腕意志构建了战时工业体系，被评为澳大利亚1943年度荣誉同伴勋章得主，表彰其对军工动员的卓越贡献。1950年接任BHP董事会主席直至1961年去世，长达半个世纪的工作生涯中始终以澳大利亚工业发展为己任。"
