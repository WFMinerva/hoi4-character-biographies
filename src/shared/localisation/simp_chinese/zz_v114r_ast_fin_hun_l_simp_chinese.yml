 # 15. 弗兰克·贝里曼 / AST_frank_berryman
 CBIO_AST_frank_berryman_desc:0 "全名弗兰克·霍顿·贝里曼，1894年4月18日生于维多利亚州巴拉腊特，1981年5月28日卒。澳大利亚陆军中将，二战中布莱梅麾下最重要的参谋官员之一，一战中已崭露头角参加加里波利和西线战役。两战之间从事职业军官工作，先后就读坎伯利参谋学院和帝国防务学院。二战中历任重要参谋职务：1942年任第1澳军团参谋长，从科科达危机至新几内亚全面攻势期间始终担任关键参谋角色。1943年接替赫林担任第二战区部队参谋长，调停赫林与萨维奇之间的摩擦，出具调查报告认定萨维奇无过。1944年升任第2澳军团军长，监督博干维尔岛和波拿佩战役。以出色的组织协调能力和对麦克阿瑟美军体系的熟悉见称。战后继续留军服务直至1950年代，以中将军衔退役。"
