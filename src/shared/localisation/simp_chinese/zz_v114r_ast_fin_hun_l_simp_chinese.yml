 # 38. 根伯什·久洛 / HUN_gyula_gombos_de_jakfa
 CBIO_HUN_gyula_gombos_de_jakfa_desc:0 "根伯什·久洛（1886年12月26日—1936年10月6日），匈牙利总理与法西斯化推手，生于墨尔加，出身路德宗德裔匈牙利家庭。以奥匈军官起步，一战期间成为激进民族主义和反哈布斯堡主义的代言人。1919年库恩·贝拉苏维埃政权崩溃后，他在塞格德组建反共民兵团体，与霍尔蒂并肩以\"白色恐怖\"清洗共产党余孽，由此成为霍尔蒂体制的重要基石。1929年晋升少将，出任国防部长，同年起组织军方反对卡尔四世复辟尝试。1932年10月1日出任总理，成为匈牙利正式实行法西斯路线的起点：他是第一位到访希特勒的外国政府首脑，积极推动与纳粹德国和意大利的政治军事同盟，试图将匈牙利政治体制改造为独裁模式，却因议会保守派阻力而成效有限。他还力主扩军备战，为后来的领土修正主义行动奠定了物质基础。1936年10月6日死于慕尼黑，病因为肾脏和睾丸癌，终年四十九岁，国葬于基雷佩希墓地，数十万民众送行。"
