 POLITICS_HUN_GYORGY_JENDRASSIK_DESC:0 "延德劳希克·哲尔吉（1898年5月13日—1954年2月8日），匈牙利物理学家与机械工程师，出生于布达佩斯，先后就读于布达佩斯约瑟夫工业大学及柏林大学，曾旁听爱因斯坦与普朗克的课程，1922年获机械工程文凭。1927年起加入冈茨股份公司，由工程师起步逐步晋升，主导开发了享誉国际的\"延德劳希克发动机\"系列——这款高速四冲程柴油机以预燃室燃烧室与弹簧驱动燃料泵为核心创新，广泛用于铁路机车及多瑙河航运，并在多国取得世界专利。1936年自立研究公司，1937年成功运行一台百马力试验性燃气涡轮；此后设计的CS-1涡桨发动机原型于1940年首次台架运转，成为世界上第一台运行的涡桨发动机，具有里程碑意义。1939年任总工厂副总裁，1942年被任命为全厂总裁（兼任至1945年）。1943年当选匈牙利科学院通讯院士，然因战乱未能发表就职演讲。布达佩斯围城战期间研发工作被迫中断；战后无法继续燃气涡轮研究，遂移居伦敦，在英国继续从事工程工作，直至1954年2月8日辞世。"

 # 55. 弗里德里希·伊什特万 / HUN_istvan_friedrich
 CBIO_HUN_istvan_friedrich_desc:0 "弗里德里希·伊什特万（1883年7月1日—1951年11月25日），匈牙利政治家、工厂主与足球活动家，出生于马拉茨卡（今斯洛伐克马拉茨基），德裔家庭。布达佩斯工业大学毕业后经营机械工厂，早年参与米哈伊·卡罗伊革命运动，出任战争部国务秘书；随即因局势右转而与卡罗伊决裂，转而联络反革命力量。1919年8月库恩·贝拉苏维埃政权覆灭后，他联合右翼\"白宫战友联合会\"，协助约瑟夫·奥古斯特大公入布达佩斯，随即于1919年8月15日就任总理——这是霍尔蒂出现之前的过渡政府。他在任期间（1919年8月—11月）恰逢罗马尼亚军队占领布达佩斯、白色恐怖肇始之际，政局极度动荡；协约国拒绝承认哈布斯堡人士领导匈牙利，约瑟夫大公被迫辞职后，他被迫于1919年11月24日去职，由卡罗伊·胡萨尔接任。此后在议会中以保守派独立人士身份多年活跃，却始终被边缘化于霍尔蒂政治核心之外，后专注经营工业企业，1951年11月25日在布达佩斯辞世。"
