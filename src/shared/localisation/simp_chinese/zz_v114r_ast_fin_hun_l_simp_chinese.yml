 # 19. 爱德华·米尔福德 / AST_edward_milford
 CBIO_AST_edward_milford_desc:0 "全名爱德华·詹姆斯·米尔福德，1894年7月3日生于新南威尔士州高斯福德，1972年1月14日卒于悉尼，终年77岁。炮兵军官，一战参加加里波利和西线。两战之间持续服役于民兵部队。二战中先任炮兵旅长，1942年升任澳大利亚本土防御和基地指挥职务，后以少将身份出任第3军军长（1944—1945年），主要职责在于澳大利亚本土的训练、组织和行政管理，为在太平洋战场前线作战的一线部队提供后盾支撑。所指挥的军级编制实际上属于训练和行政单位而非全建制战斗部队。战后返回平民生活，1972年在悉尼去世。"
