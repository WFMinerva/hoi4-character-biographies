 # 22. 艾伦·瓦齐 / AST_alan_vasey
 CBIO_AST_alan_vasey_desc:0 "全名乔治·艾伦·瓦齐，1895年3月29日生于维多利亚州马尔文东区，1945年3月5日殉职——所乘皇家澳大利亚空军哈德逊飞机A16-118从阿彻菲尔德机场起飞，因气旋天气在凯恩斯以北麦钱斯海滩外400米处坠海，机上无人生还，葬于凯恩斯公墓。就读韦斯利公学时与罗伯特·孟席斯、爱德华·米尔福德同窗，1913年入邓楚恩皇家军事学院，1915年提前毕业。一战赴法任第3师第11步兵旅旅级参谋，历经梅西纳和帕斯尚尔战役，获杰出服役勋章。两战之间长达二十年以少校停滞，1939年二战爆发后受布莱梅重用。1941年3月率第19步兵旅参加希腊和克里特战役，坚持至最后一批撤离，获杰出服役勋章加饰。1942年升任少将，相继任第6师、第7师师长，主导科科达小径反攻与戈纳、萨纳南达日军据点攻坚，以粗口直言却情真意切的风格深获部下爱戴，布莱梅称其为\"我心目中理想的战斗指挥官\"。1943年主导纳扎布空降和莱城攻夺，1944年6月因多神经炎病倒撤回国内。1945年初再获命令接掌第6师，3月5日飞赴赴任途中坠机遇难，成为二战澳军阵亡的第四位最高级别军官。"
