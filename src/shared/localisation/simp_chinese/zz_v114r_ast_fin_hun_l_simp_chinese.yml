 # 20. 戈龙迪-诺瓦克·埃莱梅尔 / HUN_elemer_gorondy_novak
 CBIO_HUN_elemer_gorondy_novak_desc:0 "戈龙迪-诺瓦克·埃莱梅尔（1885年2月23日—1954年5月14日），匈牙利将领，生于布达佩斯，一战以军事将领身份服役，其间曾短暂效力于匈牙利苏维埃红军，随后投向霍尔蒂的反革命国家军。1919年后长期在匈牙利皇家国防军中服役，1934年11月晋升为将军，1935至1937年任第2骑兵旅旅长，1938年5月晋升中将，出任\"快速部队监察官\"，负责统筹机械化和骑兵部队训练。1940年起出任匈牙利第3集团军司令，1941年4月参与对南斯拉夫的入侵行动，此役匈牙利收回了巴奇卡和其他部分前领土。1942年2月1日退役，此后以枢密顾问身份留在匈牙利，直至战后局势稳定。战后移居阿根廷，在那里度过余生，1954年5月14日在阿根廷去世。"
