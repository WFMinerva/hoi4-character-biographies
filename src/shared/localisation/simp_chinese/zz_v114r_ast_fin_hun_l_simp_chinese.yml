 # 17. 斯坦利·萨维奇 / AST_stanley_savige
 CBIO_AST_stanley_savige_desc:0 "全名斯坦利·乔治·萨维奇，1894年6月26日生于维多利亚州莱姆斯通克里克，1954年5月6日卒于墨尔本，终年59岁。一战期间在加里波利、西奈、巴勒斯坦和美索不达米亚参战，1918年亚述难民大撤退中组织保护逾七万名从土耳其军队追杀中逃脱的亚述基督徒，此举使其在中东历史上留名。战后从事商业，同时保持民兵军官身份。二战中先任旅长参加希腊和克里特岛战役，1942年升任第3师师长。1943年在萨拉毛亚战役中指挥第3师对抗日军，因指挥协调问题与上级赫林产生摩擦，贝里曼调查后认定萨维奇无过。1945年在博干维尔岛率第2军指挥对日军的孤立战役。以对部下的人文关怀和对士兵福利的关注著称。战后积极参与老兵福利工作，1954年在墨尔本因心脏病早逝，未及享受退休生活。"
