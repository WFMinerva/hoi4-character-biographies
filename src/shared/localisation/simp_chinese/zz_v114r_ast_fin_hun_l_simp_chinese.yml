 # 65. 约翰·阿拉尤里 / FIN_johan_arajuuri
 CBIO_FIN_johan_arajuuri_desc:0 "约翰·维克托·阿拉尤里（1894年6月23日—逝世日期不详）是芬兰少将。他早年为军官，曾参加内战（白军），后在芬兰国防军中逐步晋升。冬季战争与继续战争期间他历任多个指挥职，获颁自由十字勋章一级与二级。有关他的可查公开资料极为有限。"
