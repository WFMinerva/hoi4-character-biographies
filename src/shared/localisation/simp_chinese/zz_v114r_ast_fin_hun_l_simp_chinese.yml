 # 76. 韦伊内·瓦尔韦 / FIN_vaino_valve
 CBIO_FIN_vaino_valve_desc:0 "韦伊内·拉赫亚·理查德·瓦尔韦（1895年12月28日—1995年3月11日）生于拉彭兰塔，是芬兰将军、长期的海军司令，也是普鲁士皇家第27耶格尔营最后一位在世成员。他早年学电气工程，1916年秘密越过冰封的夸尔肯海峡赴德参加耶格尔运动，在东线里加湾一带参战。1918年回国参加内战后，在炮兵学校起步；1924年出任海岸炮兵司令，29岁即晋上校，晋升速度为同批耶格尔之冠。1927年海军与海岸炮兵合并后，他统辖全部海防力量。1933年他被任命为海军司令，晋少将，此后连续在此职上任至1946年，历经冬季战争、继续战争与拉普兰战争。继续战争期间他组织了与德国海军的协同作战。1944至1945年他兼任国防部长。1946年以中将军衔退役后转入银行界。1992年——他九十七岁时——被晋授上将军衔。1995年逝世，享年九十九岁。"
