 # 33. 韦赖什·拉约什 / HUN_lajos_veress
 CBIO_HUN_lajos_veress_desc:0 "韦赖什·拉约什（1889年10月4日—1976年3月29日），匈牙利将领，生于特兰西瓦尼亚塞珀森特哲尔吉（今罗马尼亚斯芬图格奥尔基），席克尔贵族后裔。1910年毕业于路多维卡军事学院，1933至1935年任骑兵师参谋长，1935至1938年任驻维也纳武官，后历任第15步兵旅及第2骑兵旅旅长。二战中指挥装甲第1师战斗于顿河前线，1942至1944年任第9军军长，1944年4月1日升任第2集团军司令。他是霍尔蒂1944年10月停战计划的重要内线，被提名为摄政府代理人备用，负责在紧急情况下接掌权力；然而当日停战公告失败后，他立即遭德军逮捕，囚于箭十字党控制的军事法庭，被判15年有期徒刑。其后成功越狱，1947年1月再度被共产党当局逮捕，以阴谋罪被判处死刑，后改判终身监禁。1956年革命期间获释，同年11月3日出走匈牙利，流亡英国，1958年起担任\"世界匈牙利自由战士联合会\"主席，长期代表流亡社区发声。1976年3月29日在伦敦辞世，葬于美国西弗吉尼亚伯克利斯普林斯。"
