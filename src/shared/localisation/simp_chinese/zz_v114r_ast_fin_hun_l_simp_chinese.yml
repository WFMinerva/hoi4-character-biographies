 # 6. 霍尔蒂·米克洛什 / HUN_miklos_horthy
 CBIO_HUN_miklos_horthy_desc:0 "霍尔蒂·米克洛什（1868年6月18日—1957年2月9日），匈牙利摄政，生于肯代雷什，出身新教贵族家庭。早年投身奥匈海军，1917年5月率\"诺瓦拉\"号在奥特朗托海峡海战中突破盟军封锁、带伤指挥，晋升为海军少将及舰队总司令。帝国崩解后，他以反共旗号组建国家军推翻库恩·贝拉的苏维埃政权，1920年3月1日由议会推选为摄政，由此开创了历史上罕见的\"无王之王国\"——身为海军上将的他，统治的却是一个失去全部出海口的内陆国家，这一悖论被后世频繁援引。以修订《特里亚农条约》、收复失地为核心外交目标，逐步靠拢纳粹德国，1940年11月加入轴心国三国公约，1941年对南斯拉夫及苏联宣战。1944年3月德军发动\"玛格丽特行动\"占领匈牙利，同年10月15日他宣布停战，随即遭德国\"装甲拳头行动\"废黜，被迫将权力移交箭十字党并以\"保护性拘留\"名义被押至巴伐利亚。战后盟国未对其提起战争罪诉讼，1945年获释后流亡葡萄牙，1957年2月9日在埃斯托里尔辞世，1993年遗骸迁回肯代雷什故土安葬。"
