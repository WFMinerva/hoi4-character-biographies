 # 29. 阿克塞利·安泰拉 / FIN_akseli_anttila
 CBIO_FIN_akseli_anttila_desc:0 "阿克塞利·安泰拉（1897年3月26日—1953年3月11日）并非芬兰白军将领，而是芬兰出身的苏联红军少将与共产党人。他生于鲁奥韦西一个农户家庭，内战中为赤卫队作战，在坦佩雷之战后被白军俘虏，越狱后于1919年流亡苏俄，加入流亡芬共并入读布尔什维克军事院校，参加过俄国内战与镇压喀琅施塔得起义。1930至1933年他就读伏龙芝军事学院，1936至1939年作为军事顾问参加西班牙内战。冬季战争爆发时，他出任由苏联组建的\"芬兰人民军\"司令，并被任命为苏联扶植的傀儡政权\"芬兰民主共和国\"（即以库西宁为首的泰里约基政府）的国防部长，1940年晋少将。其后他历经苏德战场的西方面军与卡累利阿方面军，1944年并参加了攻克柏林之役。1945年因健康退役，1953年病逝于莫斯科。"
 FIN_akseli_anttila_desc:0 "阿克塞利·安泰拉（1897年3月26日—1953年3月11日）并非芬兰白军将领，而是芬兰出身的苏联红军少将与共产党人。他生于鲁奥韦西一个农户家庭，内战中为赤卫队作战，在坦佩雷之战后被白军俘虏，越狱后于1919年流亡苏俄，加入流亡芬共并入读布尔什维克军事院校，参加过俄国内战与镇压喀琅施塔得起义。1930至1933年他就读伏龙芝军事学院，1936至1939年作为军事顾问参加西班牙内战。冬季战争爆发时，他出任由苏联组建的\"芬兰人民军\"司令，并被任命为苏联扶植的傀儡政权\"芬兰民主共和国\"（即以库西宁为首的泰里约基政府）的国防部长，1940年晋少将。其后他历经苏德战场的西方面军与卡累利阿方面军，1944年并参加了攻克柏林之役。1945年因健康退役，1953年病逝于莫斯科。"
