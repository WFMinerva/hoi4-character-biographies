 # 59. 查尔斯·伯内特 / AST_charles_burnett
 CBIO_AST_charles_burnett_desc:0 "全名查尔斯·斯图尔特·伯内特，1882年4月3日生于美国明尼苏达州布朗斯瓦利，1945年4月9日因冠心病卒于英国皇家空军哈尔顿玛丽公主医院，享年63岁。英国皇家空军上将，二战期间以借调英国军官身份出任皇家澳大利亚空军参谋长（1940年2月至1942年5月），是担任该职位的首位也是唯一一位英国军官。苏格兰后裔，曾在南非战争以步兵服役，1904年入西非边境军，1914年取得飞行资格后转入皇家飞行队，参加巴勒斯坦战役。两战之间在英国和伊拉克历任指挥职务，1936年任训练司令部首任总司令，主导二战前夕英国皇家空军的大规模扩充。1940年初孟席斯认为澳大利亚本土军官缺乏足够经验，经英澳两国政府协商后任命伯内特接掌皇家澳大利亚空军，令此前一直轮值该职的戈布尔立即辞职，同时令理查德·威廉姆斯深感被冷落。任内在空军内部引发强烈反对，但确实推动了帝国航空训练计划的全面落实（澳大利亚空军员额从3489人增至7.9万人），同时协助创立女子辅助空军和空军卫生服务。太平洋战争爆发后因本土防御力量不足的批评、与空军大臣德拉克福德持续摩擦，以及提议废除澳大利亚航空委员会引发众怒，1942年5月被乔治·琼斯取代，返英后从事空军学员队管理工作至1945年去世。"
