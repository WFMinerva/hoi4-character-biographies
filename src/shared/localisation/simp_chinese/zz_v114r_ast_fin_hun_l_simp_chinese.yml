 # 30. 约瑟夫·伯内特 / AST_joseph_burnett
 CBIO_AST_joseph_burnett_desc:0 "全名约瑟夫·伯内特，1899年12月26日生于新南威尔士州辛格尔顿，1941年11月19日随\"悉尼号\"轻型巡洋舰沉没于西澳大利亚杰拉尔顿以北海面，与644名官兵同日罹难，无一生还，终年41岁。1912年入澳大利亚皇家海军学院，一战期间赴英皇家海军服役，其后七年仍留英深造，1920年晋少尉，1922年取得炮术军官资格，以板球、橄榄球和网球兼擅著称。1932年晋中校，1938年12月晋上校，1939年9月战争爆发时出任海军参谋副长。1941年5月14日接任\"悉尼号\"舰长，该舰已在地中海战役中积下显赫战绩。同年11月19日下午，\"悉尼号\"在护送运兵船\"泽兰迪亚号\"返回弗里曼特尔途中，发现伪装成荷兰货轮的德国武装海盗舰\"科尔莫兰号\"，随即展开盘问。据德方幸存者供词，\"悉尼号\"逼近至极近距离，\"科尔莫兰号\"随即开炮鱼雷齐发，双方同归于尽。此役阵亡人数占澳大利亚皇家海军二战全部伤亡总数的约三分之一，沉舰之谜引发战后数轮调查，直至2008年两舰残骸相继被发现方才部分解明；官方调查结论认定伯内特接近行为\"难以解释，但非渎职\"。"
