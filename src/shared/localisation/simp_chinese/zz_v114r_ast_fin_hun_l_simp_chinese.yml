 # 69. 阿克·亨里克·格茨 / FIN_ake_henrik_gartz
 CBIO_FIN_ake_henrik_gartz_desc:0 "奥克·亨里克·格茨（1888年6月9日—1974年11月29日）生于赫尔辛基一个官员家庭，是芬兰实业家、法律人与无党派政治家，政治上亲近瑞典族人民党。他先后取得哲学学士（1909年）和法学士（1914年）学位，1916年起进入法律界，后转入林业集团。1921年他出任赛尔拉赫尤斯公司首席法律顾问与董事，1931年转任阿尔斯特伦集团副总裁，日后升任总裁与芬兰雇主联合会理事长。1944至1946年他在巴锡基维内阁出任工商部长，1950至1951年在凯科宁内阁出任外交部长。卸任后他出任芬兰驻伯尔尼公使、驻布加勒斯特与莫斯科大使（1953—1955年），1955年退休。"
