 # 48. 埃利亚斯·西莫约基 / FIN_elias_simojoki
 CBIO_FIN_elias_simojoki_desc:0 "劳利·埃利亚斯·西莫约基（1899年1月28日—1940年1月25日）生于劳蒂奥一个牧师家庭，是芬兰极右运动的领袖人物之一。青年时他曾参加独立斗争与东卡累利阿的游击活动，1922年与他人共同创立学院派卡累利阿学会，任主席、秘书，鼓吹将一切芬兰族裔统合为\"大芬兰\"，并发表极端排俄的煽动性演说。1925年他受按立为牧师。他投身爱国人民运动，1933年起统领其受过战斗训练、效法德意法西斯青年团的青年组织\"蓝黑团\"（1936年被取缔）及后来的\"黑衫队\"；1933至1939年任 IKL 议员。冬季战争中他自愿任随军牧师，1940年1月在因皮拉赫蒂的科伊里诺亚冰面上为一匹重伤的战马补枪时，被苏军机枪击中阵亡。"
