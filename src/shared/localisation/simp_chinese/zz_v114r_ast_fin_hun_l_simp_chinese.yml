 # 78. 齐奇·亚诺什 / HUN_janos_zichy
 CBIO_HUN_janos_zichy_desc:0 "齐奇·亚诺什（1868年2月21日—1944年12月11日），匈牙利保守派贵族与天主教政治家，生于贝拉，齐奇伯爵家族成员，父亲纳尔多尔·齐奇伯爵为奥匈时期著名政治家。受过法律教育，早年投身政界，是霍尔蒂时代议会中坚定的保守君主主义者与天主教代表，多次出任议会要职，以维护传统宗教价值与贵族宪政秩序著称。他曾任宗教与公共教育事务领域相关职务，是两战期间匈牙利保守天主教政治的象征性人物之一。1944年12月11日在布达佩斯围城战时辞世。"
