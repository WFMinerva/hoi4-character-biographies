 # 31. 阿尔内·尤蒂莱宁 / FIN_aarne_juutilainen
 CBIO_FIN_aarne_juutilainen_desc:0 "阿尔内·爱德华·尤蒂莱宁（1904年10月18日—1976年10月28日）是芬兰陆军上尉，绰号\"摩洛哥的恐怖\"。他生于索尔塔瓦拉，是王牌飞行员伊尔马里·尤蒂莱宁之兄。1930年他赴法加入外籍军团，在摩洛哥的阿特拉斯山区与柏柏尔反抗军作战，整整服役五年，获军团十字勋章与法国国籍，1935年返芬。冬季战争中，他在科拉河前线指挥步兵第34团的一个连——人称\"摩洛哥连\"，由神枪手与滑雪好手组成。面对优势苏军，他抗命不退、死守阵地，团长泰提宁后来称他\"塑造了科拉精神\"；著名狙击手西莫·海于海即在其连中服役。他三度负伤，并失去右手一指。继续战争与拉普兰战争中他续任多个步兵指挥职。他生性桀骜刚烈，战后难以适应平静生活，晚景潦倒，1976年在赫尔辛基的疗养院辞世。"
