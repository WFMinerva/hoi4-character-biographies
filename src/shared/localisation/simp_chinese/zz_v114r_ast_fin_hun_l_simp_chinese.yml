 # 52. 彼得·杰弗里 / AST_peter_jeffrey
 CBIO_AST_peter_jeffrey_desc:0 "全名彼得·杰弗里，1913年7月6日生于新南威尔士州滕特菲尔德，1997年4月6日卒，享年83岁。皇家澳大利亚空军飞行员和指挥官，北非战场王牌飞行员。就读坦伯兰学院和悉尼克兰布鲁克学院，短暂做养牛农工后于1934年加入皇家澳大利亚空军预备役，1939年转正规军。1940年7月赴北非，随第3中队在格洛斯特双翼战斗机上挑战德意空军，随后改换飓风式战斗机。1941年2月以中校身份接掌第3中队，以进取凶猛的战斗风格获杰出飞行十字勋章，11月成为王牌飞行员。1942年1月回国，3月4日成为第75（战斗机）中队首任指挥官，在短短9天内将一批新晋飞行员训练为作战中队后移交，率部飞赴莫尔斯比港参加新几内亚早期防御行动。1943至1944年指挥第1战斗机联队守卫澳大利亚北部，率喷火式战斗机在达尔文迎击日机，并在塔宁巴尔群岛等地执行远程攻击任务。1956年退役，此后从事牧场经营和股票经纪，1997年去世。"
