 # 3. 卡尔·G·曼纳海姆 / FIN_carl_mannerheim
 CBIO_FIN_carl_mannerheim_desc:0 "卡尔·古斯塔夫·埃米尔·曼纳海姆（1867年6月4日—1951年1月27日）是芬兰军事统帅与政治家，生于阿斯凯宁的洛希萨里庄园，出身瑞典语裔贵族。他早年在俄罗斯帝国军队服役，参加过日俄战争与第一次世界大战，1906至1908年曾奉命横越中亚进行军事考察，至1917年升至中将。芬兰独立后，他在1918年内战中出任白卫军总司令，战后于1918至1919年任摄政，代行国家元首职权。1931年起他出任国防委员会主席，主持在卡累利阿地峡修筑日后以其命名的\"曼纳海姆防线\"；1933年获晋元帅，1942年其75岁生日时又获授\"芬兰元帅\"荣衔。冬季战争（1939—1940）与继续战争（1941—1944）期间，他始终担任芬军总司令。1944年8月，他在吕蒂辞职后出任总统，随即与苏联签订停战协定，使芬兰摆脱与德国的协定束缚而退出战争，并在其后的拉普兰战争中对德作战。1946年因健康卸任，1951年在瑞士洛桑逝世。在其身后举行的一次民意调查中，他被选为\"史上最伟大的芬兰人\"。"
 FIN_carl_mannerheim_desc:0 "卡尔·古斯塔夫·埃米尔·曼纳海姆（1867年6月4日—1951年1月27日）是芬兰军事统帅与政治家，生于阿斯凯宁的洛希萨里庄园，出身瑞典语裔贵族。他早年在俄罗斯帝国军队服役，参加过日俄战争与第一次世界大战，1906至1908年曾奉命横越中亚进行军事考察，至1917年升至中将。芬兰独立后，他在1918年内战中出任白卫军总司令，战后于1918至1919年任摄政，代行国家元首职权。1931年起他出任国防委员会主席，主持在卡累利阿地峡修筑日后以其命名的\"曼纳海姆防线\"；1933年获晋元帅，1942年其75岁生日时又获授\"芬兰元帅\"荣衔。冬季战争（1939—1940）与继续战争（1941—1944）期间，他始终担任芬军总司令。1944年8月，他在吕蒂辞职后出任总统，随即与苏联签订停战协定，使芬兰摆脱与德国的协定束缚而退出战争，并在其后的拉普兰战争中对德作战。1946年因健康卸任，1951年在瑞士洛桑逝世。在其身后举行的一次民意调查中，他被选为\"史上最伟大的芬兰人\"。"
