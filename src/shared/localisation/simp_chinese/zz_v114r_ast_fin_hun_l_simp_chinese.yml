 # 14. 埃德蒙·赫林 / AST_edmund_herring
 CBIO_AST_edmund_herring_desc:0 "全名埃德蒙·弗朗西斯·赫林，绰号\"内德\"，1892年9月2日生于维多利亚州马利伯勒，1982年1月5日卒于墨尔本坎伯维尔，终年89岁。律师、陆军中将和维多利亚州首席法官，集军人与法学家于一身。就读墨尔本教堂英格兰文法学校（学年第一名），1912年以维多利亚州罗德斯奖学金赴牛津新学院就读，一战爆发后投笔从戎，加入英国王爱德华骑兵团，后转皇家野战炮兵第99旅参加法国和马其顿战役，获杰出服役勋章和军事十字勋章。战后完成牛津学业并取得律师资格，1936年获御用大律师头衔。1939年前已升至澳大利亚民兵部队上校。二战中率第6师炮兵旅参加北非和希腊战役，1941年8月升少将接管第6师，此后在叙利亚驻防。1942年3月任北领地部队司令，达尔文遭轰炸一个月后接手该地，以铁腕整顿守备，引入澳大利亚帝国远征军骨干军官替换旧有编制。同年10月接替罗厄尔出任新几内亚部队司令和第一澳大利亚军团军长，统筹协调科科达小径反攻和巴纳、戈纳、萨纳南达的日军据点攻坚，斡旋澳美两军指挥摩擦，1943年主导莱城和芬什哈芬战役。1944年2月出任维多利亚最高法院首席法官，开始另一段长达二十年的法律生涯；同时担任维多利亚副总督直至1972年——任期长达27年为历届之最。后以名命名雅拉河中赫林岛。1982年国葬于圣保罗大教堂。"
