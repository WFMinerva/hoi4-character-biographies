 # 24. 拜赖格菲·卡罗伊 / HUN_karoly_beregfy
 CBIO_HUN_karoly_beregfy_desc:0 "拜赖格菲·卡罗伊（1888年2月12日—1946年3月12日），匈牙利军事将领，出生于切尔文卡（今塞尔维亚克尔文卡），原名卡罗伊·贝尔格尔，德裔匈牙利人。一战中身负重伤，战后短暂服务于匈牙利苏维埃红军，继而转入皇家国防军。1939至1941年担任皇家军事学院院长，二战中先后指挥第六军、第三集团军和第一集团军。1944年4月第一集团军在苏军攻势下遭受重创，调查委员会认定其负有直接责任，遂将其解除野战指挥职务。他是坚定的箭十字党同情者，碍于军规才未能公开入党。1944年10月15日政变得手后，萨拉希立即任命他为国防部长兼总参谋长，他随即宣布匈牙利全境进入战区状态，将一切可动用的人力与物资悉数纳入战争机器。1945年4月30日被美军俘获，拒绝认罪，人民法庭以战争罪判处绞刑，1946年3月12日与萨拉希、瓦伊纳、格拉同日在布达佩斯被绞决。"
