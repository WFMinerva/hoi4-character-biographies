 # 46. 卡达尔·久洛 / HUN_gyula_kadar
 CBIO_HUN_gyula_kadar_desc:0 "卡达尔·久洛（1898年12月16日—1982年3月14日），匈牙利军事情报官员，出生于匈牙利，1912至1916年就读于绍普朗皇家匈牙利军事高中，后入读卢多维卡国防学院。1918年8月以少尉衔毕业，历经1919年革命动乱后加入霍尔蒂的国家军，1933年起在卢多维卡学院执教步兵战术。1943年8月出任匈牙利陆军军事情报局局长，任内接受卡莱政府指令，秘密协助英方在匈牙利组建英军空降作战的情报支援网络，并多次向上司预警德军入侵即将到来；他亦与反纳粹政治活动家包括拜乔希-日林斯基保持秘密联络，积极参与霍尔蒂停战脱离战争的筹备计划。1944年4月17日被盖世太保逮捕，经国防部长乔陶伊和小霍尔蒂出面斡旋方获移交匈牙利当局，军事法庭于1944年6月1日将其释放；箭十字党政变后再度被捕，经历拘押、战俘营辗转，最终以九十三岁高龄于1982年3月14日辞世，是本批人物中寿命最长者之一。"
