 # 31. 约翰·科林斯 / AST_john_collins
 CBIO_AST_john_collins_desc:0 "全名约翰·奥古斯丁·科林斯，1899年1月7日生于塔斯马尼亚州德洛雷恩，1989年9月3日卒，享年90岁。1913年以首批入学生身份进入皇家澳大利亚海军学院，是澳大利亚皇家海军第一批在国内培养而晋升将旗级别的军官之一，也是首位担任海军参谋长的本土培养军官。二战初期指挥\"悉尼号\"轻型巡洋舰参加地中海战役，1940年7月18日在希腊近海斯帕达角海战中率\"悉尼号\"击沉意大利巡洋舰\"卡列奥尼号\"，海军上将坎宁汉盛赞科林斯\"以攻击精神和果断指挥以弱胜强\"，科林斯由此成为澳大利亚的战争英雄。1941年6月转赴新加坡任英国远东海军助理参谋长。1943年赴英接收英国赠予的巡洋舰\"什罗普郡号\"，指挥其参加布干维尔、好望角格劳斯特战役等太平洋战役。1944年6月升任澳大利亚舰队司令，以\"澳大利亚号\"为旗舰。同年10月21日莱特湾战役前夕，\"澳大利亚号\"遭受史上第一次神风特攻队袭击，科林斯身受重伤，1945年7月方才重返指挥岗位，并亲历东京湾日本投降仪式。1948年出任海军参谋长，任期至1955年，任内推动皇家澳大利亚海军引入航空母舰、参与朝鲜战争和马来亚紧急状态。1989年去世。"
