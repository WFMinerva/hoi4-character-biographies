 # 26. 普罗瑙伊·帕尔 / HUN_pal_pronay
 CBIO_HUN_pal_pronay_desc:0 "普罗瑙伊·帕尔（1874年11月2日—约1947或1948年），匈牙利军事长官与准军事力量指挥官，出身北匈牙利罗姆哈尼的古老贵族家庭。军事生涯早期升迁迟缓，部分原因在于他对下属的暴虐态度。1919年夏，库恩·贝拉苏维埃共和国覆灭后，他组建了第一支白色卫队部队，随霍尔蒂国家军横扫匈牙利各地，实施持续两年的\"白色恐怖\"，针对共产党员、社会民主人士、农民与犹太人施以拷打、折磨与杀戮，其部队的残忍程度在同类军官中无出其右，史学界公认他是白色恐怖中最凶残的执行者。1920年，他的部下被指与一名布达佩斯警察遇害案有关，1921年他以勒索罪及侮辱议会罪受审，部队随即被强制解散，本人被斥为普通罪犯。此后多次试图东山再起却屡遭挫折。二战结束前后，他被苏联支持的当局逮捕，推测于1947年或1948年死于拘押期间，确切时间与情形至今不明。"
