 # 32. 绍尼·胡戈 / HUN_hugo_sonyi
 CBIO_HUN_hugo_sonyi_desc:0 "绍尼·胡戈（1883年3月2日—1958年6月7日），匈牙利陆军上将，出生于下奥地利沃尔克斯多夫，原名胡戈·索拉茨，1934年改用现姓。1897年入读布达佩斯军事学校，毕业后以奥匈军官身份历经第一次世界大战的塞尔维亚、意大利、阿尔巴尼亚及马其顿战场。匈牙利苏维埃共和国期间任第29旅旅长，参与对捷克军队的胜利战役，随后加入霍尔蒂国家军，逐步晋升。1929年被任命为布达佩斯城市指挥官，1934年出任第7混合旅旅长，1936年9月至1940年3月担任匈牙利皇家国防军总司令——这一职务在当时将总司令与总参谋长分设。他亦是1935至1939年议会上院成员及枢密顾问。战后流亡西德，保存了大量匈牙利流亡社区档案；1953年，他在流亡地主持重建了被共产党当局于1946年强制废除的匈牙利骑士勋章（维切兹骑士团）体系，以维系侨民社区的荣誉传统。1958年6月7日在拉廷根辞世，其文件资料现存于美国胡佛研究所档案馆。"
