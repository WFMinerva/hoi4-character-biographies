 # 56. 戴阿克·费伦茨 / HUN_francois_deak
 CBIO_HUN_francois_deak_desc:0 "戴阿克·费伦茨（1803年10月17日—1876年1月28日），匈牙利政治家，出身扎拉县舍尔涅斯（今匈牙利）小贵族家庭，素有\"祖国的圣贤\"之称。早年以律师起步，1832年入选国会，后成为1848—1849年革命中的重要温和派领袖，坚决反对与哈布斯堡决裂、另立共和国。革命镇压后一度隐居，自称\"沉默的抵制者\"，以拒绝合作的方式表达对奥地利专制的抗议。1861年重返政坛，此后数年以无与伦比的法律智慧与政治耐心主导奥匈关系谈判，最终于1867年达成\"奥匈妥协\"，创建奥匈帝国二元君主制，使匈牙利在帝国框架内获得高度内政自治。妥协方案由其政治遗嘱般的《复活节文章》（1865年）正式奠基，被历史学界公认为匈牙利近代史上最具决定性意义的政治文件之一。本人终身未婚，生活简朴，以廉洁著称，被霍尔蒂时代和后世均奉为民族政治智慧的象征。1876年1月28日在布达佩斯辞世，其遗像至今印于匈牙利货币及各类公共纪念场所。"
