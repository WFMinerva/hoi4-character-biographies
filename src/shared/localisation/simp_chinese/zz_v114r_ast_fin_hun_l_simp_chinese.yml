 # 45. 卡洛·索默托 / FIN_kaarlo_somerto
 CBIO_FIN_kaarlo_somerto_desc:0 "卡洛·维尔霍·索默托（1895年4月23日—1965年12月6日）生于基韦纳帕，是芬兰炮兵上校，战时的团长与情报主管。他毕业于军官学校（1920年）与陆军大学（1930年），早年在重野炮团任职、任炮兵连长，后在第2师司令部与军部任参谋及训练职。1938至1939年——即冬季战争前夕——他被派驻莫斯科任武官。临时和平期间他指挥第2旅炮兵营；继续战争爆发后任第3野战炮兵团团长（1941—1942年），1942至1944年出任大本营情报处处长。战后他于1945至1946年任赫尔辛基军区司令。"
