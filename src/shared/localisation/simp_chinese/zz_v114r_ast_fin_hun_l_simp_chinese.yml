 # 7. 约翰·柯廷 / AST_john_curtin
 CBIO_AST_john_curtin_desc:0 "1885年1月8日生于维多利亚州克雷斯威克，1945年7月5日卒于堪培拉总理官邸，终年60岁，成为澳大利亚第二位在任去世的总理。爱尔兰裔工人阶级家庭出身，父为警察，13岁辍学后辗转以多种体力劳动为生，同时靠自学在公共图书馆夜读政治经济学著作。受工运人士影响加入工党，曾出任维多利亚木材工人工会秘书，1916年迁居珀斯出任《西澳工人报》编辑。一战期间坚决反对海外征兵，率领\"否\"字营活动，1917年被短暂拘押。1928年当选弗里曼特尔众议员，1931年随政党大选失利落选，1934年重返议会，1935年当选工党领袖。1941年10月7日法登政府失去两名独立议员支持，联合政府倒台，柯廷宣誓出任第十四任总理，时澳大利亚主力部队仍在北非战线。1941年12月7日日本偷袭珍珠港，太平洋战争爆发；1942年2月15日新加坡沦陷，大批澳军被俘；2月19日日军轰炸达尔文，澳大利亚本土首遭攻击。柯廷作出战略转向：公开宣布澳大利亚转向美国而非英国，将麦克阿瑟将军置于澳军指挥之上，并力排丘吉尔反对将驻中东澳军撤回本土防守新几内亚。科科达小径战役（1942年7—11月）期间持续承压，最终澳军成功阻击日军。1943年大选以近三分之二席位大胜。战时繁重工作损耗健康，1944年11月心脏病发，1945年4月再度病倒，未能亲眼看到1945年8月日本投降，于7月5日——日本投降前六周——在官邸去世。"
