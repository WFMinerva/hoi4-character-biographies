 # 16. 安塔尔·弗赖赫尔·冯·勒哈尔 / HUN_antal_freiherr
 CBIO_HUN_antal_freiherr_desc:0 "安塔尔·弗赖赫尔·冯·勒哈尔（1876年2月21日—1962年11月12日），哈布斯堡帝国军事将领，奥地利籍匈牙利裔，生于绍普朗（今匈牙利），为著名轻歌剧作曲家弗兰茨·莱哈尔之弟。以优等成绩毕业于维也纳军校，历经加利西亚及意大利战场，1914年因乔德尔战役中指挥英勇而获颁玛丽亚·特蕾莎军事勋章骑士级，依勋章章程由此获封男爵，称\"弗赖赫尔·冯·勒哈尔\"。一战后坚定效忠哈布斯堡王室，留在匈牙利领导反共力量，1919年出任西匈牙利军事指挥官，晋升为少将。1921年，末代国王卡尔四世试图重返匈牙利复辟时，他率部相迎，复辟失败后被霍尔蒂政府列为叛徒，被迫出逃，辗转藏匿于兄长弗兰茨在德国的友人家中。此后在兄长的安排下，担任柏林某音乐版权协会职务，1933年纳粹上台后因保皇立场受到迫害，转居奥地利维也纳。德奥合并后被盖世太保监控，二战中基本处于软禁状态；弗兰茨于1948年辞世后，他专事打理其遗产与音乐版权，直至1962年11月12日在维也纳辞世。"
