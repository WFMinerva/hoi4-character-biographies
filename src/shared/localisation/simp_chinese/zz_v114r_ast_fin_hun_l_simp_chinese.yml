 # 23. 艾文·麦凯 / AST_iven_mackay
 CBIO_AST_iven_mackay_desc:0 "全名艾文·吉法德·麦凯，1882年4月7日生于新南威尔士州格拉夫顿，1966年9月30日卒于悉尼东林德菲尔德家中，享年84岁。物理学家出身的军人，悉尼大学文学学士，留校执教物理至1914年，同时于1913年以少尉身份加入民兵。一战随第4步兵营参加加里波利隆派战役（1915年8月），以肉搏近战著称，西线历经波西埃尔、比罗托、海泽布鲁克和1918年8月阿米昂战役，以第1步兵旅旅长结束战争并获杰出服役勋章。战后在剑桥随卢瑟福进修物理，返澳后任克兰布鲁克学校校长，部下昵称其\"柴普斯先生\"。1940年任第6师师长赴北非，1941年1月巴迪亚战役俘意军逾3.6万人，随后相继攻克托布鲁克、德尔纳和班加西，获KBE爵位，后参加希腊惨败与克里特岛撤退。1942年出任第二集团军司令兼新几内亚部队司令，8月重掌新几内亚部队，但在芬什哈芬战役期间因与麦克阿瑟参谋部决策摩擦遭布莱梅批评，11月将指挥权移交莫斯黑德。1944年转任澳大利亚驻印度高级专员，1948年任满返澳，1952年获悉尼大学荣誉法学博士，1966年去世。"
