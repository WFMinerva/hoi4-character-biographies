 # 17. 埃约夫·马特松 / FIN_eyolf_mattsson
 CBIO_FIN_eyolf_mattsson_desc:0 "埃约夫·格奥尔格·马特松（1897年3月22日—1965年5月25日）同样不是芬兰白军将领，而是奥兰岛瑞典语裔出身的红方、苏军将领，有\"红色将军\"之称。他出身奥兰岛一个富裕的瑞典语家庭，父亲为银行经理，曾在赫尔辛基工学院就读，1917年转向激进，内战时投身红方，并曾为革命者打开芬兰银行金库（战后被白方以抢劫银行罪缺席起诉）。1918年他流亡苏俄、加入俄共，在东卡累利阿以营长身份作战并获红旗勋章。他是最早入读伏龙芝军事学院者之一，1920年代任卡累利阿耶格尔营（后扩为旅）指挥官，1931年晋旅级将领，后任师长，并曾任伏龙芝学院战术主任教官。斯大林大清洗中，他于1936至1937年被捕，死刑改判十年劳改，二战期间一直在西伯利亚、哈萨克的劳改营中度过。1957年获平反，1965年病逝于苏联的克拉斯诺卡姆斯克。"
