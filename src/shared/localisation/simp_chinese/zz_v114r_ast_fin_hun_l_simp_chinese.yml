 # 12. 亨利·温特 / AST_henry_wynter
 CBIO_AST_henry_wynter_desc:0 "全名亨利·道格拉斯·温特，1886年6月5日生于昆士兰金金，1945年2月7日因尿毒症和高血压在维多利亚海德尔堡军医院去世，终年58岁。澳大利亚陆军官方史学家加文·朗称其为\"本代澳军中最清晰深邃的思想者\"。蔗糖农场主之子，就读马利伯勒文法学校，1907年以民兵军官受委，1911年转入正规军。一战中作为第11步兵旅旅部少校赴欧，历任第4师副参谋长、第一澳新军团军团部助理副参谋长，因参谋工作四度受嘉奖并获杰出服役勋章和圣迈克尔及圣乔治勋章。战后在坎伯利参谋学院（1921—1922年）和帝国防务学院（1930年）深造，两战之间主持编制《联邦战争手册》，规划全国战时动员方案。1926至1927年间多次在战略刊物上批评政府过度依赖新加坡基地策略、忽视陆军和皇家澳大利亚空军建设，言论触怒当权者，遭降级调往昆士兰。1938年起主持陆军指挥参谋学校。二战爆发后先后任北部指挥部司令（昆士兰）、第9师师长（任内因病交还指挥权），之后升中将担任土地司令部后勤参谋长，直接辅佐总司令布莱梅，监督战时全国陆军行政运作。1944年9月因高血压被迫退役，1945年2月在医院去世，葬于斯普林维尔战争公墓。"
