 # 48. 布鲁德内尔·怀特 / AST_brudenell_white
 CBIO_AST_brudenell_white_desc:0 "全名赛里尔·布鲁德内尔·宾厄姆·怀特，1876年9月23日生于维多利亚州圣阿纳德，1940年8月13日殒命于堪培拉机场附近空难，享年63岁，葬于布安戈尔。澳大利亚陆军大将，一战澳新军团参谋架构的核心缔造者，约翰·莫纳什称其为\"迄今澳大利亚培养出的最卓越军人\"。加里波利登陆后以第一澳新军团参谋长身份主持了1915年12月成功撤退的复杂策划——一夜之间将数万人从土耳其枪口下无声撤离，创造了一战最成功的撤退行动。此后随第5集团军参谋长职务转战西线，参与策划1918年系列总攻。极度低调，刻意将功勋让予他人，对日后塑造莫纳什历史形象贡献良多。1920至1923年任陆军参谋总长，力图在大幅削减军费的压力下保全军队核心架构。退休后历任联邦公务员委员会主席，监督各部从墨尔本迁往堪培拉新首都。1940年3月二战形势吃紧，以63岁高龄被重新召回晋升大将，复任参谋总长，率先力推布莱梅出任第二澳大利亚帝国远征军总司令。1940年8月13日，怀特与陆军大臣斯特里特、空军大臣费尔贝恩、助理部长格利特等乘皇家澳大利亚空军飞机由墨尔本飞往堪培拉开会，飞机在进近机场时坠毁，机上10人无一生还，是澳大利亚一次损失最重的政治和军事领导层空难。此后由斯图尔迪接任参谋总长。"
