 # 39. 伊姆雷迪·贝洛 / HUN_bela_imredy
 CBIO_HUN_bela_imredy_desc:0 "伊姆雷迪·贝洛（1891年12月29日—1946年2月28日），匈牙利总理，生于布达佩斯，天主教徒，受训为法学家后转入财政系统，1928年出任匈牙利国家银行行长，以务实稳健的金融家形象著称。1932年在根伯什内阁担任财政部长，1938年5月被霍尔蒂委任为总理。就任之初颇具亲英姿态，曾试图维系与西方的联系，但随即在政治压力下逐步右转：他推动通过了严苛的第二次《反犹太法》，限制犹太人在经济与职业领域的活动，并大幅收紧新闻自由。1939年2月，政敌公开其一位曾祖父为犹太裔的史料，令这位推行反犹政策的总理陷入荒诞困境，被迫于1939年2月13日辞职。辞职后创立\"匈牙利更新运动\"，转向更为极端的亲德法西斯路线。1944年德国占领后，在斯托尧伊内阁担任经济统筹部长，将匈牙利经济全面配合纳粹战争机器。战后被人民法庭以战争罪和反人类罪判处死刑，1946年2月28日在布达佩斯被枪决。"
