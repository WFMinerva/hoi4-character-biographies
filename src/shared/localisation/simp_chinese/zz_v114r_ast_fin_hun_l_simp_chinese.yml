 # 21. 肯尼斯·伊瑟 / AST_kenneth_eather
 CBIO_AST_kenneth_eather_desc:0 "1901年7月6日生于新南威尔士州悉尼，1993年5月9日卒于莫斯曼护理院，享年91岁，是澳大利亚第二次世界大战最后一位在世的陆军少将，辞世时以军礼葬于悉尼圣安德鲁斯大教堂，逾千名老兵沿途列队致哀。14岁辍学改以牙科技工谋生，兼任市政军官，1939年入伍第二澳大利亚帝国远征军。1941年1月参加巴迪亚战役，以营长身份攻坚立功，获杰出服役勋章。1942年7月随第7师第25步兵旅赴科科达战线，以旅长身份在伊米塔岭组织防御，整合民兵营与中东返澳精锐，以撤退消耗战拉长日军补给线的战术，将日军向莫尔斯比港推进的最南端彻底遏止，所部收获\"法拉普\"绰号形容其敏捷。1943年参加纳扎布空降和莱城攻夺战，率部抢先进城，获美军杰出服役十字勋章。1944年在婆罗洲巴厘巴板登陆战中以旅长身份将日军层层逐退，获CB勋章。1945年7月升任少将，接掌第11师，主持拉包尔地区逾十万日本战俘的管理与战犯审判，1946年率澳大利亚分队参加伦敦胜利大游行后退役。"
