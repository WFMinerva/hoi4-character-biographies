 # 25. 斯托尧伊·德迈 / HUN_dome_sztojay
 CBIO_HUN_dome_sztojay_desc:0 "斯托尧伊·德迈（1883年1月5日—1946年8月22日），匈牙利军人与外交官，塞尔维亚裔，原名迪米特里耶·斯托亚科维奇，出生于韦尔谢茨（今塞尔维亚弗尔沙茨）。以奥匈军官起步，一战后专事反间谍工作，1927年将姓名匈牙利化为\"斯托尧伊\"，同年起任柏林武官直至1933年，1935年起出任匈牙利驻德大使达九年之久。任内与纳粹德国高层建立深厚私人关系，被视为最顺手的亲德工具。1944年3月德军\"玛格丽特行动\"占领匈牙利后，霍尔蒂在德方压力下任命他为总理，任期1944年3月23日至8月29日。任内他将箭十字党合法化，大幅扩充驻东线兵力，更配合纳粹将约四十三万七千名匈牙利犹太人驱逐至奥斯维辛；虽同时试图在某些细节上周旋，但其对大屠杀的推动作用无可回避。1944年8月以健康恶化为由被免职，被拉卡托什取代。随后出逃，1945年被美军俘获，引渡回国受审，1946年8月22日在布达佩斯以战争罪被枪决。"
