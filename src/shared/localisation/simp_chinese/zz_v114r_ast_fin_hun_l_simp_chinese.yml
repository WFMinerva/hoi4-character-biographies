 # 3. 拉科西·马加什 / HUN_matyas_rakosi
 CBIO_HUN_matyas_rakosi_desc:0 "拉科西·马加什（1892年3月9日—1971年2月5日），原名马加什·罗森菲尔德，出生于巴奇博德罗格县阿达镇（今塞尔维亚），来自匈牙利犹太商人家庭。一战期间以奥匈士兵身份在东线被俄军俘虏，由此转变为共产主义者。1919年以库恩·贝拉苏维埃共和国高级委员身份负责贸易与安全工作，共和国覆灭后流亡苏联。1924年奉命潜回匈牙利重建党组织，翌年被捕，先后被判处八年半及终身监禁，在狱中度过逾十五年，成为国际共产主义运动的著名\"烈士\"。1940年以交换1849年革命军旗为代价获苏方接回莫斯科。1945年随苏联红军返抵匈牙利，出任共产党总书记，以\"萨拉米战术\"逐步瓦解各反对党，至1948年完成共产党对匈牙利的全面掌控，公开自称\"斯大林最得意的学生\"。执政期间发动大规模政治清洗，35万名官员与知识分子遭迫害，数千人被杀或死于囹圄。1956年苏共批判斯大林主义后被迫下台，流亡苏联，同年匈牙利爆发革命。1962年被开除党籍，1971年2月5日在戈尔基（今下诺夫哥罗德）死于流亡。"
