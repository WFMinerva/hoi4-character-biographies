 # 34. P·R·斯蒂芬森 / AST_percy_stephensen
 CBIO_AST_percy_stephensen_desc:0 "全名珀西·雷金纳德·斯蒂芬森，1901年11月20日生于昆士兰州马里伯勒，1965年5月28日卒，享年63岁。作家、出版商与政治活动家，早年以\"墨渍\"绰号著称，政治轨迹从极左到极右大跨度转向，是澳大利亚1930年代文化民族主义与战时极端主义的核心人物。就读昆士兰大学时加入共产党，1925年以罗德斯学者身份赴牛津修读哲学、政治与经济，与A·J·P·泰勒、格雷厄姆·格林同届，并深度介入1926年英国大罢工。1927年毕业后在伦敦创办\"幻想琴\"出版社，出版劳伦斯《查泰来夫人的情人》秘密版本。1932年返澳，历经多家出版社起落，1936年出版《澳大利亚文化基础》，引发印迪沃罗拜克诗歌运动，论证澳大利亚有必要建立独立于英国的本土文化认同。同年与商人威廉·迈尔斯创办月刊《公论报》，渐趋反英、反民主和反犹太主义立场。1941年10月正式创建\"澳大利亚第一运动\"。1942年3月随同运动成员集体被拘，押于塔图拉拘留营，至战后方出，始终坚称自身无辜。1965年去世，留下约70部以自身名义或幽灵写作的著作。"
