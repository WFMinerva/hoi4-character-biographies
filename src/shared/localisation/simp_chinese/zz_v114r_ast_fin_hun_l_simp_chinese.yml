 # 36. 朗纳·哈科拉 / FIN_ragnar_hakola
 CBIO_FIN_ragnar_hakola_desc:0 "朗纳·阿尔方斯·哈科拉（1896年10月11日—1975年11月20日）是芬兰海军准将，曾历任多个海军要职。他于1919至1923年就读法国海军军事学校，1930年又入英国皇家海军炮术与通信学校。自1918年起他即在海军任职，1930至1933年任海军军事学校校长，1933至1938年任岸防舰\"维纳莫宁\"号舰长。1938至1941年间，他出任海军参谋长，任内经历了冬季战争。继续战争期间（自1941年起），他改任图尔库海军基地司令，1944年退出现役，1940年晋海军准将。"
