 # 17. 弗朗茨·安东·巴施 / HUN_franz_anton_bach
 CBIO_HUN_franz_anton_bach_desc:0 "弗朗茨·安东·巴施（1901年7月13日—1946年4月27日），匈牙利德裔政治活动家，生于苏黎世，毕业于布达佩斯大学并获博士学位，早年师从较为温和的民族主义活动家雅科布·布莱尔，1920年代开始系统推广匈牙利德意志族群文化认同。1930年代起转向极端纳粹主义路线，1938年创立\"匈牙利德意志民族联盟\"，担任主席并自封\"民族集团领袖\"，以纳粹德国的财政支持将联盟组织化、军事化。在他的主导下，VDU于1942至1943年两次征兵期间为德国武装党卫军输送了逾四万名匈牙利籍德意志裔公民，严重损害了匈牙利的兵源主权。1944年底，德军溃退前夕他出逃至德国境内，1945年被美军俘获后引渡回匈牙利。1946年以战争罪由人民法庭判处死刑，1946年4月27日在布达佩斯被枪决。"
