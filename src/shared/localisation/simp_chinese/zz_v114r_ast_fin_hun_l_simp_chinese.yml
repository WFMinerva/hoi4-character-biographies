 # 49. 哈里·拉斯洛 / HUN_laszlo_hary
 CBIO_HUN_laszlo_hary_desc:0 "哈里·拉斯洛（1890年8月11日—1953年2月13日，一说1952年），匈牙利皇家国防军少将与首任空军司令，生于杰默雷（今匈牙利）。一战中以野战飞行员身份服役，记录显示执行了逾八十次空中格斗任务并多次深入敌后，因战功卓著荣获利波特勋章。战后的1922年成为匈牙利定期飞行员培训的奠基人之一，与瓦尔德马尔·科内塞共同主持早期飞行训练，后升任匈牙利航空协会主席。1925年与希勒·阿尔弗雷德共同创下飞行高度纪录。1933年出任塞克什白堡飞行区司令，1936至1937年任第一飞行团团长，1938年6月28日起被委以飞行师长暨航空司令职责，正式出任匈牙利皇家国防军航空司令兼航空事务总署署长，任期至1940年12月24日。任满后应摄政之请转入后备役，自1941年起担任霍尔蒂·米克洛什国家飞行基金会主席并主持军队以外的飞行训练工作，1943年2月起以名誉少将衔留任顾问；战时持续为摄政近身顾问圈成员。1945年2月以自行改装的福克-沃尔夫Fw 58c飞机载家眷飞往意大利卡塞塔，任务详情不明。1946年与1947年先后两度返回匈牙利，1949年6月被共产党当局以莫须有罪名逮捕，在未经任何司法程序的情况下关押于基什塔尔恰集中营直至死亡，1952年2月13日在营中病逝。"
