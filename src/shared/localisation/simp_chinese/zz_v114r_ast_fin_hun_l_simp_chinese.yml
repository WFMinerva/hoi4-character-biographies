 # 48. 哈迪·卡尔曼 / HUN_kalman_hardy
 CBIO_HUN_kalman_hardy_desc:0 "哈迪·卡尔曼（1892年5月5日—1980年6月21日），全名哈迪·卡尔曼·拉斯洛博士，匈牙利海军军官、军事作家与语言教育者，生于佩奇，1914年以奥匈帝国普拉海军学院毕业生身份授衔。历经一战全程，以海军上尉军衔见证帝国崩解。1920至1928年间出任摄政霍尔蒂的侍从副官，1923年在帕兹马尼彼得大学取得法学博士学位，是霍尔蒂家族的姻亲。1932至1934年以匈牙利代表团成员身份赴日内瓦参与国际裁军会议；1935年起出任驻柏林武官，后兼任驻海牙与斯德哥尔摩武官，柏林为常驻地。1940年至1941年8月间任总参谋长侍从副官；1942年4月晋升海军上校，出任匈牙利多瑙河舰队司令，1944年1月晋升海军少将。因参与霍尔蒂1944年秘密停战计划而遭盖世太保于1944年底逮捕，索普罗尼亚达军事法庭以叛国罪判处死刑，但随即获赦免，后被押往德国；1945年5月5日获释，并作为专家证人出席纽伦堡审判。1951年移居美国，先后在乔治城大学等多所大学执教德语与匈牙利语，直至1972年退休。著有回忆录《从亚德里亚海到美洲》，1980年6月21日在美国南卡罗来纳州哥伦比亚（阿灵顿）辞世。"
