 # 9. 里斯托·吕蒂 / FIN_risto_ryti
 CBIO_FIN_risto_ryti_desc:0 "里斯托·海基·吕蒂（1889年2月3日—1956年10月25日）生于胡伊蒂宁，是法律与经济专家出身的政治家，第五任总统（1940—1944）。他早年习法，曾负笈牛津，属国家进步党；1921至1924年任财政部长，1923至1944年长期出任芬兰银行行长，以稳健的货币政策与广泛的国际金融人脉著称，亦是亲英派，1934年因促进英芬关系获英王封爵。冬季战争爆发时，他于1939年底出任总理，主导对苏媾和。1940年12月卡利奥去世后，他继任总统，并于1943年由议会循特别程序连任。继续战争后期，为换取德国军援以遏阻苏军在维堡方向的攻势，他于1944年6月以个人名义致信希特勒，承诺芬兰不单独媾和，史称\"吕蒂—里宾特洛甫协定\"；同年8月他辞去总统职务，使继任的曼纳海姆得以不受该协定约束而与苏联议和。战后他作为战争责任审判的首要被告，以破坏和平罪被判十年苦役，1949年因健康恶化获巴锡基维特赦，此后未再涉政。"
