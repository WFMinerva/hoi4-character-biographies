 # 10. 韦埃内·坦纳 / FIN_vaino_tanner
 CBIO_FIN_vaino_tanner_desc:0 "韦埃内·阿尔弗雷德·坦纳（1881年3月12日—1966年4月19日）生于赫尔辛基，1895年前姓托马松，是芬兰社会民主党的领袖人物，也是芬兰合作社运动的先驱。他出身铁路工人家庭，习商兼修法律，1911年取得法学学位，曾长期经营合作社事业。1918年内战中他保持中立、未予参与；战后他致力于重建社民党，引导工人运动由激进转向议会道路，1918至1926年及1957至1963年两度出任党主席。他于1926至1927年出任总理，组成芬兰首届左翼政府，并多次担任财政部长。冬季战争期间他出任外交部长，曾与巴锡基维同赴莫斯科谈判，其立场对凝聚\"冬战精神\"、团结全国起到重要作用。继续战争期间他先后任贸易工业部长与财政部长。战后他在战争责任审判中被判五年半监禁，1949年获特赦。他对战后亲苏的\"巴锡基维—凯科宁路线\"持批评态度，并曾长期出任国际合作社联盟主席（1927—1945）。"
 FIN_vaino_tanner_desc:0 "韦埃内·阿尔弗雷德·坦纳（1881年3月12日—1966年4月19日）生于赫尔辛基，1895年前姓托马松，是芬兰社会民主党的领袖人物，也是芬兰合作社运动的先驱。他出身铁路工人家庭，习商兼修法律，1911年取得法学学位，曾长期经营合作社事业。1918年内战中他保持中立、未予参与；战后他致力于重建社民党，引导工人运动由激进转向议会道路，1918至1926年及1957至1963年两度出任党主席。他于1926至1927年出任总理，组成芬兰首届左翼政府，并多次担任财政部长。冬季战争期间他出任外交部长，曾与巴锡基维同赴莫斯科谈判，其立场对凝聚\"冬战精神\"、团结全国起到重要作用。继续战争期间他先后任贸易工业部长与财政部长。战后他在战争责任审判中被判五年半监禁，1949年获特赦。他对战后亲苏的\"巴锡基维—凯科宁路线\"持批评态度，并曾长期出任国际合作社联盟主席（1927—1945）。"
