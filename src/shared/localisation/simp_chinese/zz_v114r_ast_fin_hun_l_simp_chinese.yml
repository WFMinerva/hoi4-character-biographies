 # 30. 米克洛什·贝洛 / HUN_bela_miklos
 CBIO_HUN_bela_miklos_desc:0 "米克洛什·贝洛（1890年6月11日—1948年11月21日），匈牙利陆军上将，生于布达佩斯，出身特兰西瓦尼亚席克尔原始贵族家庭。历经一战后，于战间期在霍尔蒂军事内阁任职（1929—1933年）并逐步晋升。1944年8月1日，他出任匈牙利第1集团军司令，此时战局已明显不利于轴心国。1944年10月15日霍尔蒂宣布停战失败当日，他断然决定投向苏联，率少数随员穿越战线向苏军投降，在广播中呼吁下属部队跟随，响应者寥寥。苏联将他视为合法的替代领导人，协助在德布勒岑成立匈牙利临时国民政府；1944年12月22日，临时议会正式选举他出任代总理，此后他领导这一战时临时政府直至1945年11月15日大选。任期内停止了对犹太人的驱逐，建立人民法庭，着手清算战争罪行，也无力阻止苏联将数十万匈牙利人遣送苦役。1947年议会选举时，他所在的政党遭共产党打压，议席被强制取消，随后退出政坛，1948年11月21日辞世。"
