 # 39. 凯苏·米丽娅米·吕德贝里 / FIN_kaisu_mirjami_rydberg
 CBIO_FIN_kaisu_mirjami_rydberg_desc:0 "卡琳·阿伊诺·米丽娅米（凯苏·米丽娅米）·吕德贝里（1905年4月27日—1959年8月31日）生于门察拉，是芬兰的共产党/左翼女记者、作家与政治人物，曾用\"卡琳·阿尔姆\"等笔名。她起初投身社会民主党，后转向共产党阵营，并参加了1936年成立的左翼作家团体\"楔子\"。1939年她递补成为国会议员，旋即加入由社民党分裂出的社会主义议会党团；该党团其后遭压制，她任议员至1941年。战后她加入芬兰人民民主联盟，并于1945至1948年再度当选国会议员。"
