 # 66. 纳吉·伊姆赖 / HUN_imre_nagy
 CBIO_HUN_imre_nagy_desc:0 "纳吉·伊姆赖（1896年6月7日—1958年6月16日），匈牙利共产党政治家与1956年革命领袖，生于考波什瓦尔，出身贫苦农家。一战中在俄国战线被俘，由此转变为共产主义者，参加红军与布尔什维克革命；1920年代返匈从事地下党工作，1930年代在莫斯科从事农业科学研究，二战结束前随苏军返国。1944至1945年任农业部长，主导战后土地改革；后相继出任内政部长及农业领域要职，以相对温和的农业政策著称。1953年出任总理，推行\"新方针\"路线，放宽新闻管制、削减重工业投资，此后因与拉科西系路线相左，1955年4月被解除职务并开除党籍；1956年10月重新入党。同年10月革命爆发，民众强烈呼吁他重掌权柄，10月23日他再度出任总理，大胆承诺多党民主、废除秘密警察、宣布退出华沙条约并向西方寻求援助——这一系列举措激怒苏联领导层。11月4日苏军大规模入侵匈牙利，他与内阁成员避入南斯拉夫大使馆；被卡达尔以书面保证安全通行诱出后随即遭苏联特工逮捕，押往罗马尼亚秘密关押。1958年经秘密审判以叛国罪被判处死刑，拒绝申请赦免，1958年6月16日在布达佩斯被秘密处决。1989年6月16日，在其被处决整整三十一年后，他与狱友被隆重公开改葬，数十万民众送行，此举标志着匈牙利共产主义体制历史上最后的道义崩塌，同日卡达尔亦在布达佩斯辞世。"
