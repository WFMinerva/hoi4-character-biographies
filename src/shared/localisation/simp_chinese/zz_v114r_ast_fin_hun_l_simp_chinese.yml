 # 4. 杰克·迈尔斯 / AST_jack_miles
 CBIO_AST_jack_miles_desc:0 "全名约翰·布兰韦尔·迈尔斯，绰号\"杰克\"，1888年9月5日生于苏格兰罗克斯堡郡威尔顿，1969年5月17日卒于悉尼纳伦伯恩。石匠出身，在爱丁堡受教育后在英格兰北部学艺，在达勒姆郡肯赛特从业时加入独立工党。1911年10月9日娶伊丽莎白·简·布莱克，1913年3月偕妻移民昆士兰布里斯班，1918年加入昆士兰社会主义联盟。澳大利亚共产党1920年成立后即入布里斯班分支，先后代表全澳肉类工业雇员工会和昆士兰石匠公会出席劳工委员会，在党内影响力日增。1929年底与贝尔特·莫克森和兰斯·夏基联手，在共产国际\"第三时期\"方针下以反对\"社会法西斯主义\"和脱离工党路线赢得党代会控制权，被选入中央委员会。1931年迁居悉尼出任党总书记，以铁腕贯彻\"布尔什维克化\"路线，对所有抗命成员毫不留情予以开除，以绝对纪律主导党务至1948年。1934至1935年赴苏联访问。1940年党在反战政策下遭禁，迈尔斯化名\"A·梅森\"转入地下继续发声。苏联参战后重新公开活动，但实权逐步转移至夏基，1948年夏基正式接任总书记。安全情报机构报告1953年称其为\"澳大利亚共产主义的元老\"，终身未曾改变信仰，1969年去世，无宗教仪式火化。"
