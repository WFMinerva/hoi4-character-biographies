 # 77. 梅克伦堡-什未林的弗里德里希·弗朗茨 / HUN_franz_friedrich
 CBIO_HUN_franz_friedrich_desc:0 "梅克伦堡-什未林的弗里德里希·弗朗茨（1910年4月9日—2001年7月31日），德国贵族，生于什未林，为末代梅克伦堡-什未林大公弗里德里希·弗朗茨四世之子。德意志帝国崩溃后，家族失去统治权。2001年7月31日辞世。"
