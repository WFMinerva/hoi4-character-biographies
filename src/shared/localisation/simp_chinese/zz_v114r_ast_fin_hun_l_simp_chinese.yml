 # 35. 乔治·琼斯 / AST_george_jones；CAN_george_jones
 CBIO_AST_george_jones_desc:0 "全名乔治·琼斯，1896年10月18日生于维多利亚州拉什沃思，1992年8月24日卒，享年95岁。皇家澳大利亚空军空军元帅，以农家子弟出身、从一战私兵一路升至最高军职的传奇经历著称。14岁辍学做汽车技工，1914年以私兵身份入伍，1915年参加加里波利战役，翌年转入澳大利亚飞行团接受飞行训练，1917年赴法国担任战斗机飞行员，以7个击落战果成为王牌，获杰出飞行十字勋章。两战之间长期从事飞行教官和参谋职务，1940年主持澳大利亚部分的帝国航空训练计划，监督飞行学校的快速扩建和数千名飞行员的培训。1942年5月5日被任命为空军参谋长，超越多位资历更深的军官——当时舆论称其为\"最黑马的黑马\"，有传言其被选中或为误读组织架构图之故，他本人承认被\"震惊\"。其任内最重要的矛盾是与名义上的下属、澳大利亚皇家空军战区司令博斯托克长达数年的权力争端，严重影响了太平洋战区的空中协调。1942至1952年任职，是历任参谋长中任期最长者，任内主导澳大利亚空军参与朝鲜战争和马来亚紧急状态。1992年去世。"
