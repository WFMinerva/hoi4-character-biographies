 # 40. 亚瑟·法登 / AST_arthur_fadden
 CBIO_AST_arthur_fadden_desc:0 "全名亚瑟·威廉·法登，1894年4月13日生于昆士兰州英格汉，1973年4月21日卒于布里斯班，享年79岁。会计师出身，15岁辍学以甘蔗工起步，历任马凯市政书记员和镇长（1916年），1918年起在汤斯维尔开设会计事务所。1932年当选昆士兰州议员，1935年落选，1936年以补选赢得达令唐斯联邦众议员席位，此后代表乡村党（后改为国家党）在联邦议会服务长达22年。以跨党派协调能力和豁朗风趣著称，人称\"阿蒂\"。1940年出任孟席斯政府财政大臣，1941年1月至5月因孟席斯赴英出差代行总理职务达4个月。1941年3月当选乡村党领袖，此后执掌该职17年。1941年8月29日孟席斯辞职后，法登以小党领袖身份当选联合党团领袖，出任第13任总理，但仅40天后——同年10月7日——两名独立议员转向反对联合政府预算，议案以36对33票告负，法登辞职，柯廷上台。此后他在野领导反对党两年，1943年大败后将领袖职位让回孟席斯。1949年孟席斯重执政权，法登再任财政大臣兼副总理（1949—1958年），历史上共提交11份预算，创澳大利亚纪录；任内最著名的是1951年\"恐怖预算\"——大幅加税以应对朝鲜战争开支和通货膨胀。1958年12月以政治高位退休，1973年去世。"
