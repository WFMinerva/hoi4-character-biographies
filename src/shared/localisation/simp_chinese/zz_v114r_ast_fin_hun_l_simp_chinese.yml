 # 7. 维尔霍·安纳拉 / FIN_vilho_annala
 CBIO_FIN_vilho_annala_desc:0 "维尔霍·安纳拉（1888年1月17日—1960年7月28日）生于拉普阿，是芬兰公务员、经济学者与极右翼政治家。他早年就读于赫尔辛基大学，曾主编学生会报，后任职于统计局并参与保守派报纸《新芬兰报》的编务，1932年获博士学位，成为芬兰高级文官之一。同年他参与拉普阿运动，并与赫尔曼·古梅鲁斯等人创建极右政党\"爱国人民运动\"，其思想深受意大利法西斯统合主义影响。该党名义领袖为科索拉，但实权多由安纳拉及其副手萨尔米亚拉掌握；1936年起他正式出任党团主席。他在1933至1945年间任议员，并于1941至1943年在兰格尔内阁出任交通部长。IKL随继续战争结束后，于1944年依《莫斯科停战协定》被取缔，安纳拉遂退出政坛，1951至1957年转任赫尔辛基大学国民经济学教授。"
