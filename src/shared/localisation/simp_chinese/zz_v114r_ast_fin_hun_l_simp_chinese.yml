 # 74. 诺曼·马金 / AST_norman_makin
 CBIO_AST_norman_makin_desc:0 "全名诺曼·约翰·奥斯瓦尔德·马金，1889年3月31日生于新南威尔士州彼得舍姆，1982年7月20日卒，享年93岁。工党政治家和外交官，以成为首任联合国安理会主席而留名国际外交史。父为英格兰移民，在布罗肯希尔矿区做工人，马金13岁辍学做店员，在多个城市以自学为主，加入工程师协会成为工会活动家，1911年定居阿德莱德。1919年首次当选众议员。1929至1932年在斯卡林政府中以最年轻的年龄（39岁）出任众议院议长。二战期间在柯廷内阁担任最关键的工业生产职务：海军大臣（1941—1946年）、军需大臣（1941—1946年）、飞机制造大臣（1945—1946年），主持澳大利亚战时海军和军工生产，为太平洋战役提供物资支撑。1946年1月奉奇夫利之命率澳大利亚代表团出席联合国第一届大会。依据安理会成员国按字母顺序轮值主席的临时规则，澳大利亚排在首位，马金于1946年1月17日至2月16日出任首届联合国安全理事会主席，主持理事会首次历史性会议，处理伊朗危机、印度尼西亚独立运动和英军驻希腊等初期国际议题，并参与选举安理会首任秘书长。此后任澳大利亚驻美大使（1946—1951年），1954年重返联邦议会，1963年退休，享年93岁。"
