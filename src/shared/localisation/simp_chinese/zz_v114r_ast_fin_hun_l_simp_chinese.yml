 # 41. 凯伦·约瑟夫 / HUN_jozsef_kelen
 CBIO_HUN_jozsef_kelen_desc:0 "凯伦·约瑟夫（1892年1月12日—1938年3月19日），原名克莱因·约瑟夫，匈牙利机械工程师与共产主义政治家，出生于纳吉博奇科（今乌克兰韦利基比奇基夫），家庭信奉犹太教，为共产党人奥托·科尔文之兄。一战后迅速投身左翼运动，1918年11月24日，匈牙利共产党制宪会议在其布达佩斯寓所召开，他由此成为该党创始成员之一，并参与创办《红色新闻》周报。1919年匈牙利苏维埃共和国成立后，先任社会生产人民委员会副委员，同年4月升任人民委员，同时出任国家经济委员会委员，掌握重要经济权力。苏维埃政权覆灭后遭逮捕，经人民委员案件审判被判处终身监禁；1922年借苏匈战俘交换协议出走苏联，此后长期在莫斯科从事共产国际工作。1938年3月19日在莫斯科遭斯大林大清洗处决，其弟奥托·科尔文早于1919年即被处决，兄弟二人均殉于各自所信仰的革命事业。"
