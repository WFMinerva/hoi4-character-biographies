 # 28. 维尔霍·彼得·涅诺宁 / FIN_vilho_petter_nenonen
 CBIO_FIN_vilho_petter_nenonen_desc:0 "维尔霍·彼得·涅诺宁（1883年3月6日—1960年2月17日）生于库奥皮奥，被誉为\"芬兰炮兵之父\"。他先后就读哈米纳武备学堂与圣彼得堡的米哈伊洛夫炮兵学校及炮兵学院，一战期间在沙俄军队中服役于炮兵。内战爆发后，他回到芬兰，受命组建曼纳海姆白军的炮兵；战后曾于1923至1924年出任国防部长。继续战争中，他是曼纳海姆的核心幕僚之一，1941年晋炮兵上将——这一军衔史上仅他一人获得。身为炮兵总监，他大力发展芬军炮兵的训练、装备与战法，其于1943年定型的射击校正盘在1944年塔利-伊汉塔拉防御战中发挥了决定性作用，他所推导的弹道计算公式至今仍为各国炮兵沿用。1945年他获颁曼纳海姆十字勋章。"
