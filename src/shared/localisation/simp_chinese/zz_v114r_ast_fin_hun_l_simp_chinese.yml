 # 5. 萨拉希·费伦茨 / HUN_ferenc_szalasi
 CBIO_HUN_ferenc_szalasi_desc:0 "萨拉希·费伦茨（1897年1月6日—1946年3月12日），箭十字党领袖，生于卡沙（今斯洛伐克科希策），来自亚美尼亚、德意志、匈牙利、斯拉夫混合血统的军人家庭。以职业军官起步，1935年创立\"民族意志党\"（即箭十字党前身），以\"匈牙利主义\"为旗帜，鼓吹反犹、反共、民族至上主义，数度被霍尔蒂政府投入狱中。1939年大选中箭十字党赢得30个议席，成为议会第二大党。1944年10月15日，霍尔蒂停战宣言失败、德国发动\"装甲拳头行动\"后，萨拉希被德国扶植上台，自封\"国家领袖\"兼总理，统治仅163天。执政期间与德军配合迫害和驱逐犹太人，布达佩斯一城即有约3.8万名犹太人遭杀害，另有8万人被强制押送奥地利劳役。1945年5月被美军俘获于奥地利，引渡回国受人民法庭公开审判；史学家记录他在审判中发表大量充斥偏执幻想的陈词，令旁观者触目惊心。以战争罪及叛国罪被判处死刑，1946年3月12日在布达佩斯被绞决。"
