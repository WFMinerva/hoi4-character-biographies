 # 66. 维尔霍·海拉宁 / FIN_vilho_helanen
 CBIO_FIN_vilho_helanen_desc:0 "维尔霍·韦科·佩维约·海拉宁（1899年11月24日—1952年6月8日）生于奥卢，是芬兰学者、作家、公务员与极端民族主义活动家。他在赫尔辛基大学取得硕士与博士学位，1919年曾志愿参加爱沙尼亚独立战争。1920年代他加入学院派卡累利阿学会，三度出任主席（1927—1928、1934—1935、1935—1944年），在其领导下该学会由模糊的民族热情转向明确反对议会民主制，并与极右势力日益接近。他是爱国人民运动的重要影响者与IKL领袖西莫约基的挚友，但本人并未正式加入IKL，而是公开支持希特勒与国家社会主义。1940年他创立\"觉醒芬兰\"运动，以延续冬战精神为名推动统合主义纲领。二战后期他升至高级文官，战后因在芬兰转换阵营后继续与纳粹合作、参与亲德地下抵抗运动，1948年被捕，1950年以叛国罪被判六年监禁，1951年获赦。出狱后他为苏奥米电影公司工作并撰写侦探小说，1952年在法兰克福出差期间心脏病发去世。"
