 # 63. 毛焦罗希·尚多尔 / HUN_sandor_magyarossy
 CBIO_HUN_sandor_magyarossy_desc:0 "毛焦罗希·尚多尔（1891年10月13日—1972年8月17日），匈牙利皇家国防军上将，出生于贝切伊（今塞尔维亚，旧属匈牙利巴奇博德罗格县），死于美国俄亥俄州克利夫兰。职业军事生涯履历清晰：1931至1934年任第一混合旅副参谋长，1934至1936年任总参谋长副官，1936至1937年任第一混合旅参谋长，1937至1939年任总参作战一处处长，1939至1940年任第二边境卫队旅指挥官，1940至1941年任总参训练第二组组长，1941至1943年任国防部航空司局局长，1943至1944年任航空部队总监兼代理地面部队司局长。晋升记录：1940年6月1日晋少将，1942年9月29日晋中将，1944年10月15日晋上将。1944年10月退役，同年11月5日紧急召回，以驻德匈牙利全权高专身份短暂任职至1945年1月28日。战后流亡美国，1972年8月17日在克利夫兰辞世。"
