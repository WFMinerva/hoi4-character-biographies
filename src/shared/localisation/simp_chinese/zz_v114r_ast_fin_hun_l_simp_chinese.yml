 # 75. 雷诺·阿拉-库柳 / FIN_reino_ala_kulju
 CBIO_FIN_reino_ala_kulju_desc:0 "雷诺·阿拉-库柳（1898年4月25日—1983年8月5日）生于库奥尔塔内，是芬兰路德宗牧师、中学教师与政治人物。他早年参加1918年内战（白军），曾在坦佩雷之役中负伤，并于1919年参加爱沙尼亚独立战争。1918年入赫尔辛基大学，取得哲学硕士学位，1929年受按立为牧师。他是学院派卡累利阿学会副主席，1932至1936年任爱国人民运动总书记，1933至1939年以IKL名义任国会议员。IKL于1944年被取缔后，他转入教育界，1952年起再以国民联合党身份重返议会，任至1966年。他长期在塞伊奈约基任教并担任校长。"
 FIN_reino_ala_kulju_desc:0 "雷诺·阿拉-库柳（1898年4月25日—1983年8月5日）生于库奥尔塔内，是芬兰路德宗牧师、中学教师与政治人物。他早年参加1918年内战（白军），曾在坦佩雷之役中负伤，并于1919年参加爱沙尼亚独立战争。1918年入赫尔辛基大学，取得哲学硕士学位，1929年受按立为牧师。他是学院派卡累利阿学会副主席，1932至1936年任爱国人民运动总书记，1933至1939年以IKL名义任国会议员。IKL于1944年被取缔后，他转入教育界，1952年起再以国民联合党身份重返议会，任至1966年。他长期在塞伊奈约基任教并担任校长。"
