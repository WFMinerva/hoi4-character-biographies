 # 40. 加尔·伦德奎斯特 / FIN_jarl_lundqvist
 CBIO_FIN_jarl_lundqvist_desc:0 "加尔·弗里蒂奥夫·伦德奎斯特（1896年8月15日—1965年9月23日）生于赫尔辛基，是瑞典语裔的芬兰中将。1932年9月至1945年6月，他长期担任芬兰空军司令，任期贯穿冬季战争与继续战争，是该职在任最久者之一；两战之间芬兰空军的建设与战时空中作战均在其主持之下。二战结束后，他于1945至1946年出任国防军总司令。他在空军建设方针与战机采购上的若干决断，历来为史学界所争议与检讨。"
