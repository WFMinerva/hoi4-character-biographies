 # HUN
 # 1. 塞切尼·伊什特万 / HUN_istvan_szechenyi
 CBIO_HUN_istvan_szechenyi_desc:0 "塞切尼·伊什特万（1791年9月21日—1860年4月8日），匈牙利政治家、改革家与作家，出身古老贵族家庭，生于维也纳，父亲费伦茨伯爵创立了匈牙利国家博物馆与国家图书馆。青年时以奥地利军官身份参与拿破仑战争，游历英法后深感母国之落后，遂立志推动现代化改革。1825年匈牙利议会上，他率先以匈牙利语发言，捐出全年庄园收入六万弗罗林，促成匈牙利科学院建立；旋于1827年创立国家赌场作为贵族政治对话平台。随后出版《信贷》（1830）、《光明》（1831）、《阶段》（1833）等政论著作，批判贵族保守主义，呼吁放弃封建特权以引领国家现代化。他力主在哈布斯堡框架内以渐进路线推动改革，与主张激进独立的科苏特·拉约什形成持续论争，科苏特却也正是称他为\"最伟大的匈牙利人\"者。最重要遗产是主导建设连接布达与佩斯的塞切尼链桥（1849年竣工），并首次规定贵族与平民同等缴纳过桥费，打破封建免税特权。1848年革命期间担任公共工程与交通大臣，旋因局势走向激进而精神崩溃，此后在维也纳郊外多布林疗养院度过余生，1860年4月8日辞世，身后被誉为匈牙利民族精神之核心象征。"
