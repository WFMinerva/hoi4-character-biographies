 # 62. 欧拉维·阿霍 / FIN_olavi_arho
 CBIO_FIN_olavi_arho_desc:0 "尤科·欧拉维·卡尔洛·阿霍（1908年12月14日—1950年2月27日）生于坦佩雷，是芬兰海军少校（战后追晋海军中校），也是芬兰海军首位曼纳海姆十字勋章获得者（第104号骑士）。他1927年高中毕业后加入海军，1931年获军官资格，专长于水雷战。二战期间，他先后指挥布雷舰\"鲁奥钦萨尔米\"号与多艘舰艇，在波罗的海的布雷与扫雷作战中表现卓越。1944年9月芬苏停战后，他奉命率领以其名字命名的\"阿霍支队\"，由五十艘帆船与五十艘摩托艇组成、配芬兰水手，在爱沙尼亚奥斯穆萨尔岛附近为苏军的蒙松群岛登陆作战运送兵员。其后他转入海岸警卫队。1949年7月晋海军中校，九个月后因结核病在图尔库去世，年仅四十一岁。"
