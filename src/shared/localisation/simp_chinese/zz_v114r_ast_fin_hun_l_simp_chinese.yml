 # 61. 格拉茨·古斯塔夫 / HUN_gusztav_gratz
 CBIO_HUN_gusztav_gratz_desc:0 "格拉茨·古斯塔夫（1875年3月30日—1946年11月21日），匈牙利政治家、外交官与历史学家，生于格尔尼茨巴尼亚（今斯洛伐克格尔尼察），德意志裔新教牧师家庭。法学博士毕业后转入新闻业，曾为《佩斯特·劳伊德》等多份德匈报章撰稿；1906年起任议会议员，代表特兰西瓦尼亚撒克逊德意志族裔选区。一战期间在帝国外贸部门担任要职，参与布列斯特-立托夫斯克及布加勒斯特条约经济谈判，由此积累了深厚的外交资历。帝国崩解后先任驻维也纳大使（1919—1921年），随后于1921年1月出任匈牙利外交部长，任期至同年4月，此后因支持末代国王卡尔两度复辟而遭霍尔蒂政府边缘化。此后转向学术与欧洲一体化倡议，1926年以匈牙利境内德意志少数民族代表重返议会，并担任多个倡导奥匈继承国经济合作的智库组织领袖，留下了研究两战间匈牙利政治史的重要著作。1946年11月21日在布达佩斯辞世，其回忆录《目睹三个时代》为后人提供了宝贵的一手史料。"
