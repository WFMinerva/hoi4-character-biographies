 # 28. 欣迪·伊万 / HUN_ivan_hindy
 CBIO_HUN_ivan_hindy_desc:0 "欣迪·伊万（1890年6月28日—1946年8月29日），匈牙利陆军上将，生于布达佩斯。经历一战及战间期军旅生涯后，在第二次世界大战中逐步升至高级指挥职位。1944年10月16日箭十字党政变当日，他被任命为匈牙利第一军军长。随着苏联与罗马尼亚军队于1944年12月26日完成对布达佩斯的合围，欣迪自同年12月29日起同时出任匈牙利布达佩斯驻防部队司令，与德军将领卡尔·普费费尔-维尔登布鲁赫共同指挥五十天的殊死守城战。城市化为废墟、守军伤亡殆尽之际，欣迪参与了最后的突围尝试，于1945年2月11日在逃出城堡区地道时被苏军俘获，较布达佩斯最终陷落早两天。战后被移交匈牙利当局，以战争罪受审，1946年8月29日在布达佩斯被枪决。"
