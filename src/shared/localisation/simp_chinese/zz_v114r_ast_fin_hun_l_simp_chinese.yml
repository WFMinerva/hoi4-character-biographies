 # 15. 哲尔菲-本杰尔·尚多尔 / HUN_sandor_gyorffy_bengyel
 CBIO_HUN_sandor_gyorffy_bengyel_desc:0 "哲尔菲-本杰尔·尚多尔（1886年2月15日—1942年6月14日），匈牙利将领与政治家，生于布达佩斯，出身平民家庭，毕业于绍普朗军事学校和路多维卡军事学院，1905年授予少尉军衔。一战中以参谋军官身份服役于多个军团司令部，1917年转入国防部工作。匈牙利苏维埃共和国时期曾短暂服务于红军，随后转向霍尔蒂的反革命队伍，1921年参与\"布达厄尔什战役\"，为摄政方效力。战间期历任国防部要职，1941年2月至9月担任国防部国务秘书。1941年9月16日，他以供应事务不设部门部长（即食品供应部长）的身份进入巴尔多希及随后的卡莱内阁，负责统筹战时物资调配与食品供应，为二战时期匈牙利后勤保障的关键人物之一。1942年6月14日于布达佩斯任内病逝，其子小哲尔菲-本杰尔·哲尔吉此后数月亦于东线阵亡。"
