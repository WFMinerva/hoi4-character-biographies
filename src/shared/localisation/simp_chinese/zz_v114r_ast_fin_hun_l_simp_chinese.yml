 # 16. 埃米尔·瓦得里 / FIN_emil_vaateri
 CBIO_FIN_emil_vaateri_desc:0 "埃米尔·托比安波卡·瓦得里（1900年1月29日—1941年7月12日）并非芬兰白军将领，而是芬兰内战中的红方、其后的苏军军官与情报人员。瓦得里生于拉彭兰塔，原为工人（面包师）。内战时他属拉彭兰塔赤卫队滑雪连，战败后流亡苏俄，入红色军官学校，曾在契卡任职、参加\"肥猪暴动\"（并因之负伤、获红旗勋章），1930年代初以化名\"埃纳里·叙里亚宁\"潜回芬兰东部从事间谍活动。冬季战争中他以苏军身份任营长，继续战争中任由芬兰人组成的苏军第52步兵团团长，军衔上尉。1941年7月，芬军越境推进时，他在卡累利阿一处森林小路上与芬军巡逻队遭遇，在交火中（据信）阵亡；苏方记录将其失踪日期记为7月14日。其生平于2023年由记者哈尔米宁著成传记。"
