 # 8. 艾莫·阿尔托宁 / FIN_aimo_aaltonen
 CBIO_FIN_aimo_aaltonen_desc:0 "艾莫·安舍尔姆·阿尔托宁（1906年12月10日—1987年9月21日）生于帕尔加斯，是芬兰建筑工人、木匠出身的共产党政治家。他自幼务工，十几岁即当木匠，青年时参加工人体育组织并接触左翼思想，后成为共产党人。1930年他赴苏联，在列宁格勒的西方少数民族共产主义大学学习至1933年；回国不久即以煽动罪名被捕，入狱十年。1944年芬苏《莫斯科停战协定》签订、芬兰共产党合法化后，他获释，并出任芬共主席（1944—1945年，及1948—1966年），是该党长期的斯大林派领导人。1945至1947年他兼任国家治安警察副长官，1945至1962年作为芬兰人民民主联盟成员任议员。1966年党主席一职由阿尔内·萨里宁接任。"
