 # 57. 托尔斯蒂·韦尔科拉 / FIN_torsti_verkkola
 CBIO_FIN_torsti_verkkola_desc:0 "托尔斯蒂·拉法埃尔·韦尔科拉（1909年5月22日—1977年6月11日）生于拉赫蒂一个火车司机家庭，原姓温斯特伦，1935年将姓氏芬兰化。他是芬兰航空工程师、飞机设计师与教授。1935年获赫尔辛基工学院工程师学位后，他进入国家飞机制作厂工作，1935至1937年赴柏林夏洛滕堡工学院深造，回国后升任制造厂设计部主管。二战期间他主持设计了VL Pyörremyrsky（\"旋风\"）战斗机——一款本土设计的单座战斗机，但战争在首飞前即告结束，仅完成一架原型机。1945年他获任赫尔辛基工学院机械工程学教授。战后因受共产党控制的国家警察威胁被捕，他于1946年携妻出走美国，在威斯康星大学任客座教授（1946—1951年）。其后他返回芬兰，1954至1972年任赫尔辛基工学院内燃机工程学教授，1968至1970年兼任院长。"
