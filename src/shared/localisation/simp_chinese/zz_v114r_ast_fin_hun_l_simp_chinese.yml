 # 20. 约翰·诺思科特 / AST_john_northcott
 CBIO_AST_john_northcott_desc:0 "全名约翰·芬德利·诺思科特，1890年11月6日生于新南威尔士州奥克利，1966年8月4日卒。陆军中将，一战期间参加加里波利和西线战役，以参谋才能受到重视。两战之间在澳大利亚陆军中担任多个参谋和指挥职务，曾赴坎伯利参谋学院深造。二战中于1941至1942年间任澳大利亚陆军参谋长，协调美澳联合作战框架的建立，参与麦克阿瑟指挥体系的对接工作。后来担任新南威尔士总督（1946—1947年），成为少数经历从军事到政治顶层岗位转变的澳大利亚将领之一。1966年去世。"
 AST_john_northcott_desc:0 "全名约翰·芬德利·诺思科特，1890年11月6日生于新南威尔士州奥克利，1966年8月4日卒。陆军中将，一战期间参加加里波利和西线战役，以参谋才能受到重视。两战之间在澳大利亚陆军中担任多个参谋和指挥职务，曾赴坎伯利参谋学院深造。二战中于1941至1942年间任澳大利亚陆军参谋长，协调美澳联合作战框架的建立，参与麦克阿瑟指挥体系的对接工作。后来担任新南威尔士总督（1946—1947年），成为少数经历从军事到政治顶层岗位转变的澳大利亚将领之一。1966年去世。"
