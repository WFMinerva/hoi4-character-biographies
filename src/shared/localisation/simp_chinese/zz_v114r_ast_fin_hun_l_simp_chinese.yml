 # 28. 哈罗德·法恩科姆 / AST_harold_farncomb
 CBIO_AST_harold_farncomb_desc:0 "全名哈罗德·布鲁斯·法恩科姆，1899年2月28日生于新南威尔士州北悉尼，1971年2月12日因心力衰竭卒于达令赫斯特圣文森特医院，享年72岁，骨灰于同年3月2日在其最后服役旗舰\"悉尼号\"甲板撒入西澳海域。1913年以首批入学生身份进入澳大利亚皇家海军学院，毕业成绩名列前茅，是澳大利亚皇家海军首位晋升将旗级别的本土出生军官，柯林斯级潜艇\"法恩科姆号\"以其命名。一战赴英在\"皇家君权号\"战列舰服役。1937年成为皇家海军学院首位晋升上校的毕业生。以\"弗里尔斯弗兰克\"绰号著称，二战中先任\"珀斯号\"巡洋舰舰长，1940年改任\"堪培拉号\"，在塞舌尔以东追获德国武装补给船，事后被批评行事过分谨慎；有史家认为此批评间接影响了同僚伯内特在\"悉尼号\"上过度接近敌舰的决策。\"悉尼号\"沉没后，法恩科姆主持了对\"科尔莫兰号\"德国幸存者的审讯，以敏锐洞察获取大量情报。此后任\"澳大利亚号\"舰长，参加珊瑚海、菲律宾等太平洋多场战役。1951年退役后改学法律，取得律师执照，1971年去世。"
