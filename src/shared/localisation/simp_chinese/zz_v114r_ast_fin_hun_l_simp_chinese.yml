 # 38. 亚瑟·卡尔维尔 / AST_arthur_calwell
 CBIO_AST_arthur_calwell_desc:0 "全名亚瑟·奥古斯塔斯·卡尔维尔，1896年8月28日生于维多利亚州西墨尔本，1973年7月8日卒，享年76岁。爱尔兰裔天主教家庭出身，父亲为维多利亚警官。缺乏大学教育资源，靠自学成为维多利亚公共服务部职员，1931年出任维多利亚劳工党主席，1940年当选联邦墨尔本选区众议员，任职至1972年，连续代表该选区32年。二战中1943年出任信息部长，以铁腕战时新闻审查著称，对持异见的澳大利亚主流媒体毫不留情，人称\"科基·卡尔维尔\"。1945年柯廷去世后奇夫利继任，卡尔维尔成为澳大利亚首任移民部长（1945—1949年），以\"繁殖否则灭亡\"为口号推行大规模战后移民计划：大批英国和欧洲大陆、尤其是东南欧难民和流离失所者得以赴澳定居，奠定今日多元澳大利亚的基础。然而他同时严格执行\"白澳政策\"，向大量战时抵澳的马来、印度支那和华裔难民发出驱逐令，此举留下历史争议。1960年接任反对党领袖，1966年以70岁高龄在大选中以超过三分之二席位失败，翌年辞去领导职务，1973年去世。"
