 # 6. 屈厄斯蒂·卡利奥 / FIN_kyosti_kallio
 CBIO_FIN_kyosti_kallio_desc:0 "屈厄斯蒂·卡利奥（1873年4月10日—1940年12月19日）生于于利维耶斯卡，本名古斯塔夫·卡利奥康加斯，是农业联盟的重要领袖，第四任总统（1937—1940）。他出身农家，是芬兰唯一未受高等学历教育的总统；早年师从农业联盟思想家阿尔基奥，1906年加入该党后渐成要角。他曾多次出任农业部长，四度担任总理、六度出任议会议长，并推动了1922年以其姓氏命名的土地改革法案。1937年当选总统后，他奉行议会制总统的克制作风。冬季战争期间，他将军队统帅权交予曼纳海姆，自身则起精神领袖的作用；他抵触割地，却最终被迫于1940年签署《莫斯科和约》，签字时曾援引《圣经》经文表达悲愤。同年8月他中风，右臂瘫痪。11月卸任，成为芬兰首位辞职的总统；12月19日，他在赫尔辛基中央车站送别仪式后突发心脏病去世，是唯一在任内逝世的芬兰总统。他笃信路德宗虔敬派，终身不饮酒。"
