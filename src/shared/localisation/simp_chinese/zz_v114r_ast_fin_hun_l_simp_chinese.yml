 # FIN
 # 1. 于尔约·莱伊诺 / FIN_yrjo_leino
 CBIO_FIN_yrjo_leino_desc:0 "于尔约·卡尔洛·莱伊诺（1897年1月28日—1961年6月28日）是芬兰共产党籍政治家，生于赫尔辛基，父亲为制革工人。他因从事共产主义活动两度入狱，二战期间长期转入地下，在此期间结识日后的妻子赫尔塔·库西宁（共产党领袖奥托·维勒·库西宁之女）。1944年芬苏停战、芬兰共产党合法化后，他于1945年当选芬兰人民民主联盟议员，并先后出任社会事务部长（1944—1945）与内政部长（1945—1948），任职三届内阁。由共产党人掌控内政部及国家治安机构的这段时期，后世称为芬兰的\"危险年代\"。1945年他将十九名芬兰公民及难民护照持有者移交苏联，史称\"莱伊诺的囚犯\"事件；1948年议会因此通过对他的不信任案，总统巴锡基维遂将其免去内政部长职务。此后他淡出公众视野，1958年出版回忆录。"
