 # 69. 莱顿·布雷斯格德尔 / AST_leighton_bracegirdle
 CBIO_AST_leighton_bracegirdle_desc:0 "全名莱顿·西摩·布雷斯格德尔，1881年5月31日生于新南威尔士州巴尔梅恩，1970年3月23日卒，享年88岁。澳大利亚皇家海军少将，四任总督府军事秘书，以其横跨两次世界大战与漫长战后时代的服务历程著称。1898年加入新南威尔士海军志愿队，参加1900年义和团起义（随新南威尔士分队赴华）和1901至1902年布尔战争（以骑兵身份在南非被狙击手击落落马），此后继续以海军民兵与文职双重身份参与社会事务。1911年加入皇家澳大利亚海军，一战中指挥第1皇家澳大利亚海军架桥队参加加里波利苏夫拉湾登陆（1915年8月），在弹雨中架设登陆码头和浮桥，受嘉奖两次并获杰出服役勋章，而后随队在西奈沙漠为英军铁路建设提供海岸补给。战间期历任阿德莱德和悉尼海军区司令。1931年出任总督军事兼行政秘书，此后连续为四位总督任职——艾萨克斯爵士、高里勋爵、格洛斯特公爵和威廉·麦凯尔，跨越大萧条、二战和战后重建各个历史时期，以端庄持重的官僚风格和对礼制运转的精熟把握，深受历届总督信任。1945年以海军少将军衔退役，1947年卸去总督秘书职务后受封KCVO爵位，此后为艾辛顿·刘易斯出任BHP兼职联络官多年，1970年去世。"
