 # 71. 道拉尼·卡尔曼 / HUN_kalman_daranyi
 CBIO_HUN_kalman_daranyi_desc:0 "道拉尼·卡尔曼（1886年3月22日—1939年11月1日），匈牙利总理，生于布达佩斯，出身地方行政世家，其伯父伊格纳茨·道拉尼曾任奥匈时期农业部长。1909年法学毕业后投身地方行政，一战后参与镇压库恩·贝拉苏维埃政权，1927年以执政党成员当选议员，1935年出任根伯什内阁农业部长。1936年10月根伯什病逝，霍尔蒂任命他为总理，至1938年5月。任初以回归拜特伦式温和保守主义为宗旨，1937年4月以禁止\"民族意志党\"及投入监狱萨拉希为世人注目；然而1938年德奥合并后，他迅速右转，秘密接触极右翼势力、扶植纳粹同情者入阁，引发保守派不满；霍尔蒂随即以此为由迫使其于1938年5月11日辞职，由伊姆雷迪接任。任内\"杰尔计划\"（1938年）经他正式公布——这一耗资十亿彭格的军备扩充与现代化方案，由伊姆雷迪拟定，为匈牙利参战奠定物质基础。辞职后转任众议院议长，直至同年11月1日突然病逝，年仅五十三岁。"
