 # 72. 詹姆斯·斯卡林 / AST_james_scullin
 CBIO_AST_james_scullin_desc:0 "全名詹姆斯·亨利·斯卡林，1876年9月18日生于维多利亚州特拉瓦拉，1953年1月28日卒于墨尔本，享年76岁。澳大利亚第九任总理（1929—1932年），澳大利亚历史上第一位天主教总理，第一位爱尔兰裔总理，也是第一位在澳大利亚本土出生的工党总理。来自虔诚的爱尔兰天主教移民家庭，父为铁路板工，14岁辍学后打各种零工，在巴拉腊特公共图书馆广泛自学并积极参加南街演讲比赛协会，磨砺出扎实的辩论功底。1903年加入工党，1910年赢得科兰加米特选区入主联邦众议院，迅速以全面辩才著称；1913年落选后出任工党报纸《巴拉腊特晚报》主编至1922年，并成为1916年反兵役运动的领军人物。1922年以亚拉选区重返联邦议会，1928年当选工党领袖。1929年10月大选获压倒性胜利，就职后两天华尔街股市崩盘，大萧条随即席卷澳大利亚，此后两年宛如一场噩梦：党内三路分裂（莱昂斯保守翼、兰激进翼、联邦正统派），参议院全程对立，一国之长在宪制框架内几乎无所作为。他坚持以\"赤字财政\"应对萧条的主张被同侪否决、被历史所证明正确——约翰·梅纳德·凯恩斯后来称其\"总理计划\"挽救了澳大利亚的经济结构。1931年大选惨败，此后仍任反对党领袖至1935年，留任议员至1949年。1953年在墨尔本家中辞世，后人铭记他是在最糟糕的历史时刻领导了最不幸的政府的一位正直政治家。"
