 # 10. 乔治·伍滕 / AST_george_wootten
 CBIO_AST_george_wootten_desc:0 "全名乔治·弗雷德里克·伍滕，1893年6月1日生于新南威尔士州雷德弗恩，1970年3月4日卒于澳大利亚。律师出身，一战中以志愿兵身份参战，在加里波利和西线作战，荣获军事十字勋章。两次大战之间从事法律事务。二战中先在第9师下辖旅担任旅长，北非战役期间参加托布鲁克守城和第二次阿拉曼战役——阿拉曼战役1942年10月23日至11月11日是扭转北非战局的关键一役，伍滕所部旅在突破轴心防线中表现突出。1943年初随第9师回国后，转任第18旅旅长参加新几内亚战役，此后升任第9师师长。在马当、芬什哈芬和拉埃等新几内亚战役中指挥澳军丛林作战。战后返回法律界。"
