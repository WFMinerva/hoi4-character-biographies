 # 56. 杰克·比斯利 / AST_jack_beasley
 CBIO_AST_jack_beasley_desc:0 "全名约翰·艾伯特·比斯利，1895年11月9日生于维多利亚州维里比，1949年9月2日突发疾病猝死于悉尼圣文森特医院，享年53岁。工会领袖出身的劳工党政治家，因1931年率兰工党议员在议会投票推翻斯卡林劳工政府而获得\"刺客杰克\"的绰号，从此伴随终身。习得电气工程技术后移居悉尼，历任新南威尔士劳工委员会主席（1922—1928年）和电气工会主席，1928年当选西悉尼联邦众议员。政治生涯中两度随杰克·兰脱离正统劳工党：1931年率兰工党议员推倒斯卡林政府，1940年再度另立\"非共劳工党\"。1941年2月说服兰系议员重归柯廷麾下，柯廷上台后获任供应与开发大臣，成为战时澳大利亚最重要的经济协调部长，统筹军事采购和工业生产动员，主持盟军供应委员会和澳大利亚食品委员会，以高效务实著称。1944年据其部门报告所述，当年仅服装合同一项即包括8800万件平民服装和2600万套军服。1946年大选失去议席，此后担任驻英国高级专员，参加伊丽莎白公主婚礼，1949年在任上骤然离世。"
