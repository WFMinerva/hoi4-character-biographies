 # 53. 帕尔菲·菲德尔伯爵 / HUN_fidel_palffy
 CBIO_HUN_fidel_palffy_desc:0 "帕尔菲·菲德尔伯爵（1895年5月6日—1946年3月2日），全名菲德尔·帕尔菲·阿布·埃尔道德伯爵，匈牙利贵族与极端纳粹主义活动家，出生于波若尼森杰尔吉（今斯洛伐克斯瓦蒂尤尔）。一战后因大萧条家道中落，1933年自创\"匈牙利国家社会主义党\"，随后与其他极右派系合并并主导联合党，但始终未能取得与箭十字党抗衡的政治影响力。困境之下转而投靠德国，成为帝国保安总局线人，并长期充当党卫军高级官员威廉·霍特尔在布达佩斯的核心联络人，由此令党卫军一度视其为接管匈牙利的候选人之一。1944年德军占领后，他出任维斯·曼弗雷德军工集团监管委员，并于箭十字党1944年10月掌权后进入萨拉希政府担任农业部长。1945年战败后被人民法庭以战争罪名判处死刑，1946年3月2日在布达佩斯被绞决。"
