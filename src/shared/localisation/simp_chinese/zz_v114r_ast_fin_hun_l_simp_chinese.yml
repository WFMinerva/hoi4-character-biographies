 # 22. 拉卡托什·盖佐 / HUN_geza_lakatos
 CBIO_HUN_geza_lakatos_desc:0 "拉卡托什·盖佐（1890年4月30日—1967年5月21日），匈牙利陆军上将，生于布达佩斯，毕业于路多维卡军事学院，1928至1934年担任驻布拉格武官。1943年8月接替亚尼·古斯塔夫出任第2集团军司令，次年4月一度执掌第1集团军。1944年8月，拉卡托什支持者与摄政霍尔蒂联手，仅凭一辆坦克推翻了德国扶植的斯托尧伊政府，拉卡托什随即于8月29日出任总理，成为匈牙利最后一任合宪总理。他的军政府立即叫停对匈牙利犹太人的驱逐，并命令宪兵以武力阻止一切驱逐行动，同时重启与盟军的秘密停战谈判。1944年10月15日，霍尔蒂宣布停战失败，德国发动\"装甲拳头行动\"，拉卡托什被迫当日辞职并遭德军拘押。战后获释，被共产党当局没收财产、取消军人养老金，以绘制书籍插图和手绘丝巾维生。1965年，在女儿邀请下获准移居澳大利亚阿德莱德，在那里撰写了珍贵回忆录《我所目睹的：匈牙利悲剧》，1967年5月21日在阿德莱德辞世。"
