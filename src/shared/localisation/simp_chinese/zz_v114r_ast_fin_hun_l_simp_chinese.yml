 # 68. 艾莫·拉赫蒂 / FIN_aimo_lahti
 CBIO_FIN_aimo_lahti_desc:0 "艾莫·约翰内斯·拉赫蒂（1896年4月28日—1970年4月19日）生于维亚拉（今阿卡），是芬兰自学成才的轻武器设计师，一生设计了约五十种武器，对芬兰国防有决定性贡献。他六年级辍学，十三岁在玻璃厂打工时用五马克买下第一支步枪，自此痴迷于枪械机理。1921年他以军械士身份入伍，1922年在研究缴获的伯格曼MP18后着手自行设计冲锋枪，最终发展出Suomi KP/-31——公认二战最优秀的冲锋枪之一，其七十一发弹鼓启发了苏联PPSh-41的设计。他还设计了拉赫蒂-萨洛兰塔M/26轻机枪、拉赫蒂L-35手枪、20毫米拉赫蒂L-39反坦克枪以及多种防空机枪与机炮。1932年他被任命为国防部轻武器总工程师。继续战争结束后，盟国管制委员会禁止他继续从事武器设计。他退休后享受少将级退休金。"
