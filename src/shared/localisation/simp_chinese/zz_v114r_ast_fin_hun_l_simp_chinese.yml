 # 49. 弗兰克·福德 / AST_frank_forde
 CBIO_AST_frank_forde_desc:0 "全名弗朗西斯·迈克尔·福德，1890年7月18日生于昆士兰州米歇尔，1983年1月28日卒于布里斯班，享年92岁，获国葬。澳大利亚史上任期最短的总理，以忠诚、平易和中庸著称。爱尔兰移民后裔，父为铁路工人，就读图文巴基督兄弟学院后成为教师兼电报员，1914年迁居罗克汉普顿深度参与劳工党和工人教育活动。1917年以工党候选人赢得昆士兰议会罗克汉普顿选区补选入政，1922年进入联邦众议院代表卡普里科尼亚，此后服务该选区24年。1931年在斯卡林政府中任商贸大臣。1935年以一票之差惜败于柯廷，屈居副手14年，始终忠心辅佐。1941年柯廷执政后出任副总理兼陆军大臣（1941—1946年），统领澳大利亚战时陆军运作，以温和手腕处理各方矛盾，参与战时内阁和顾问战争委员会。1945年4月赴旧金山出席联合国成立会议，并于6月26日代表澳大利亚在联合国宪章上签字，留下重要的历史记录。同年7月5日柯廷去世，翌日福德宣誓接任第15任总理——仅执政8天，是澳大利亚史上任期最短的总理。7月13日劳工党党团选出奇夫利为新领袖即告卸任，福德以成熟风度接受败选，未有任何怨言。1946年大选失座，此后出任澳大利亚驻加拿大高级专员（1946—1953年），1955年短暂重返昆士兰议会，成为唯一一位卸任联邦总理后进入州议会的人。1983年去世。"
