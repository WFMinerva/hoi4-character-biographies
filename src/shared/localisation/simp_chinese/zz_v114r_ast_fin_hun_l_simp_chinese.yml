 # 19. 德热·拉斯洛 / HUN_dezso_laszlo
 CBIO_HUN_dezso_laszlo_desc:0 "德热·拉斯洛（1894年7月23日—1949年6月8日），匈牙利陆军上将，出生于洛瓦什帕托纳，1911年从军。一战中以少尉军衔战斗于塞尔维亚及意大利战场，曾被意军俘虏，直至1918年停战方才获释。战间期历任参谋部要职，1941至1943年出任路多维卡军事学院院长，衔级中将。1944年10月箭十字党政变得手后，萨拉希任命他为匈牙利第1集团军司令，同年11月晋升为陆军上将。他以此职位指挥残余匈牙利军队在布达佩斯围城战中抵抗苏军，直至1945年4月被美军俘获。战后被引渡回匈牙利，首次受审被判处十五年有期徒刑；随后人民共和国以新证据为由提起重审，于1949年以战争罪改判死刑，1949年6月8日在布达佩斯被枪决。"
