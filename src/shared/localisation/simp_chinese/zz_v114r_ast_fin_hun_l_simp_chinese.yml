 # 78. 沃尔夫冈·冯·黑森亲王 / FIN_prince_wolfgang_von_hesse
 CBIO_FIN_prince_wolfgang_von_hesse_desc:0 "沃尔夫冈·莫里茨·冯·黑森亲王（1896年11月6日—1989年7月12日）生于奥芬巴赫的伦彭海姆城堡，是黑森-卡塞尔的弗里德里希·卡尔亲王与普鲁士公主玛格丽特之子，其母为德皇威廉二世的妹妹，也是维多利亚女王在世时出生的最后一位曾孙。他与长兄菲利普为双胞胎。一战中他在麦肯森元帅麾下任军官。1918年10月9日，其父被芬兰议会选为芬兰国王，沃尔夫冈被指定为王位继承人；但德意志帝国在11月革命中崩塌，弗里德里希·卡尔于12月14日放弃王位，芬兰君主制方案随即流产。沃尔夫冈1924年与巴登的玛丽·亚历山德拉公主结婚，无子嗣，后收养侄子卡尔·阿道夫亲王。1933年至1945年任上陶努斯县县长，1989年逝世于法兰克福。"
