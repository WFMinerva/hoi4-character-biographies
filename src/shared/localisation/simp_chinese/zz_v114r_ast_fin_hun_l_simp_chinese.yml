 # 27. 霍勒斯·罗伯逊 / AST_horace_robertson
 CBIO_AST_horace_robertson_desc:0 "全名霍勒斯·克莱门特·休·罗伯逊，1894年10月29日生，1960年4月28日卒，享年65岁。职业军人，邓楚恩皇家军事学院首批毕业生之一，也是同届中最早晋升少将和中将的军官之一。一战随第10轻骑兵团在加里波利参加尼克战役（1915年8月7日）——澳新骑兵团密集冲锋遭土耳其机枪阵地正面扫射，该团几乎全军覆灭，是加里波利最惨烈的一役——随后转战西奈和巴勒斯坦战役。二战中任职多个指挥职务，1942年曾有提案推荐其出任陆军总司令，最终未能落实。战后出任英联邦驻日占领军司令，主持盟军对日占领期间的秩序维持和行政管理。1950年朝鲜战争爆发后，罗伯逊积极响应麦克阿瑟请求，向澳大利亚政府斡旋，派遣护卫舰\"绍尔哈文号\"和皇家澳大利亚空军第77中队参战，并奠定英联邦朝鲜战力的组织框架；因此贡献，于英王生日荣典中获KBE爵位。1960年去世。"
