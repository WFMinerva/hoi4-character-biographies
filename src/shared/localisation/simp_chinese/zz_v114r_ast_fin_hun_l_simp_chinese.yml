 # 31. 纳吉·维尔莫什·德·纳吉巴宗 / HUN_vilmos_nagy
 CBIO_HUN_vilmos_nagy_desc:0 "纳吉·维尔莫什·德·纳吉巴宗（1884年5月30日—1976年6月21日），匈牙利将领、军事理论家与历史学家，出生于特兰西瓦尼亚帕拉伊德（今罗马尼亚），席克尔贵族后裔。毕业于路多维卡军事学院（1905年），后就读于维也纳战争学院。一战中在奥匈总参谋部服役，战间期历任多个旅指挥职务及高级参谋职位，1940年率第1集团军进驻第二次维也纳裁决后归还的特兰西瓦尼亚北部。1941年3月意外被强制退役，1942年9月霍尔蒂亲自邀请他出任国防部长。任期内他力排极右派阻挠，积极改善犹太劳役营的待遇：亲赴东线视察，惩处虐待者，为服役劳工争取与普通士兵同等权益，命令释放老弱病残及资助其家庭，甚至为国内劳役营派驻拉比。此举遭极右翼议员施压抗议，1943年6月被迫辞职。1944年德军占领后遭箭十字党逮捕，被押送至毛特豪森集中营，战后获释。1947年出版回忆录《致命的岁月》，详述战时困境。1965年，以色列雅德·瓦谢姆研究所将他列为\"国际义人\"，成为第一位获此荣誉的匈牙利人，1976年6月21日以九十二岁高龄在皮利什马罗特辞世。"
 HUN_vilmos_nagy_desc:0 "纳吉·维尔莫什·德·纳吉巴宗（1884年5月30日—1976年6月21日），匈牙利将领、军事理论家与历史学家，出生于特兰西瓦尼亚帕拉伊德（今罗马尼亚），席克尔贵族后裔。毕业于路多维卡军事学院（1905年），后就读于维也纳战争学院。一战中在奥匈总参谋部服役，战间期历任多个旅指挥职务及高级参谋职位，1940年率第1集团军进驻第二次维也纳裁决后归还的特兰西瓦尼亚北部。1941年3月意外被强制退役，1942年9月霍尔蒂亲自邀请他出任国防部长。任期内他力排极右派阻挠，积极改善犹太劳役营的待遇：亲赴东线视察，惩处虐待者，为服役劳工争取与普通士兵同等权益，命令释放老弱病残及资助其家庭，甚至为国内劳役营派驻拉比。此举遭极右翼议员施压抗议，1943年6月被迫辞职。1944年德军占领后遭箭十字党逮捕，被押送至毛特豪森集中营，战后获释。1947年出版回忆录《致命的岁月》，详述战时困境。1965年，以色列雅德·瓦谢姆研究所将他列为\"国际义人\"，成为第一位获此荣誉的匈牙利人，1976年6月21日以九十二岁高龄在皮利什马罗特辞世。"
