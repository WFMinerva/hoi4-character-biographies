 # 11. 亚尔马·西拉斯沃 / FIN_hjalmar_siilasvuo
 CBIO_FIN_hjalmar_siilasvuo_desc:0 "亚尔马·弗里多尔夫·西拉斯沃（1892年3月18日—1947年1月11日）生于赫尔辛基，本姓斯特伦贝里，是芬兰中将、曼纳海姆十字勋章获得者。他早年加入耶格尔运动，1915年赴德，在普鲁士皇家第27耶格尔营于一战东线对俄作战；1918年回国参加内战，属白军。冬季战争中，他率部在苏穆萨尔米地区作战，所部扩编为第9师，围歼了苏军第163师，并在拉特公路之战中重创前来增援的苏军第44师，阻止苏军第9集团军突向奥卢、将芬兰拦腰切断，由此成名。其后他晋升将官。继续战争期间他指挥第三军，1941年在北方配合德军作战，1944年转战卡累利阿地峡。芬德反目后的拉普兰战争中，他率芬军驱逐境内德军。1944年12月获颁曼纳海姆十字勋章。其子恩西奥·西拉斯沃后亦为芬兰将领。"
