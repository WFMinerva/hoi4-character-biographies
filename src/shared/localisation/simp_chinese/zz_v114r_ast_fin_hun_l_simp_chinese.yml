 # 61. 欧拉维·萨尔科 / FIN_olavi_sarko
 CBIO_FIN_olavi_sarko_desc:0 "欧拉维·伊萨基·萨尔科是芬兰空军上校。他早年为空军飞行员，1928年曾驾驶芬兰航空公司的容克斯F.13水上飞机前往斯瓦尔巴群岛，参加对意大利探险家诺比莱飞艇遇险船员的救援行动。冬季战争中，他以少校军衔指挥第46轰炸机中队，该中队装备布伦海姆轰炸机。继续战争期间，他先后任第4飞行团团长与空军司令部航空技术勤务总监。1944年9月芬苏停战后，他被任命为北芬兰空军指挥官；10月芬军对德发动拉普兰战争，他奉命组建并指挥以其名字命名的\"萨尔科飞行集群\"，该集群由第2飞行团的战斗机中队与第4飞行团的轰炸机中队组成，对撤退中的德军实施轰炸、扫射与侦察。飞行集群于1944年12月撤编。"
