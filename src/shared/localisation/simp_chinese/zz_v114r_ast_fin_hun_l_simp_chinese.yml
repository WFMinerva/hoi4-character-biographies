 # 70. 阿尔内·萨里宁 / FIN_aarne_saarinen
 CBIO_FIN_aarne_saarinen_desc:0 "阿尔内·阿尔马斯·萨里宁（1913年12月5日—2004年4月13日）生于德格尔比（英厄），是芬兰共产党改革派主席（1966—1982年）与工会领袖。他出身石匠家庭，1934年加入工会，冬季战争与继续战争期间均在芬军服役。战后他投身建筑工人运动，1954至1966年任共产党主导的建筑业工会主席。1966年他在党代会上接替斯大林派的阿尔托宁出任芬共主席，此后十六年间致力于将该党引向温和改良路线。他是东欧阵营以外最具影响力的共产党领袖之一，被视为\"欧洲共产主义\"的代表人物——1968年他公开谴责苏联入侵捷克斯洛伐克，1970年代抵制斯大林主义极端派辛尼萨洛扩大苏联影响的企图。他曾坦言\"苏联把社会主义毁了\"。"
