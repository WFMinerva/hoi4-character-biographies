 # 67. 艾莫·卡扬德 / FIN_aimo_cajander
 CBIO_FIN_aimo_cajander_desc:0 "艾莫·卡尔洛·卡扬德（1879年4月4日—1943年1月21日）生于乌西卡乌蓬基，是芬兰植物学家、林学教授与国家进步党政治家，三度出任总理。他1903年以林型学说的博士论文蜚声学界，1911至1934年任赫尔辛基大学林学教授，1934至1943年任芬兰国有林务局局长。1922年和1924年，总统斯托尔贝里两度请无政党背景的他出面组阁，两届内阁均为大选前的看守政府。1927年他加入国家进步党，1929年当选国会议员，1933年起出任党主席。1937年卡利奥当选总统后，卡扬德组建了由社民党与农业联盟两大党参加的多数政府。他是理想主义者，直到1939年8月仍不相信苏联会进攻芬兰，军备因此不足。冬季战争中，芬军动员兵被发给一条腰带、一枚帽徽、一支步枪，其余自备，此等窘相被讥为\"卡扬德模范装\"。他于1943年逝世。"
