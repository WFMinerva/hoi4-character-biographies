 # 34. 鲁斯考伊·叶内·奥斯卡 / HUN_jeno_oszkar_ruszkay
 CBIO_HUN_jeno_oszkar_ruszkay_desc:0 "鲁斯考伊·叶内（1887年1月1日—1946年6月22日），匈牙利将领与箭十字党军事头目，原名延诺·兰岑贝格尔，生于布达佩斯，德裔背景。军旅生涯起步于奥匈帝国军队，两战期间在霍尔蒂匈牙利皇家国防军中晋升，成为箭十字运动在军内的主要代理人。箭十字党1944年10月掌权后，他以匈牙利军职同时转入武装党卫军体系，在匈牙利裔德意志族招募大批人员入伍的过程中扮演核心角色。1945年1月被任命为所有匈牙利武装党卫军单位的总监，同年2月接掌在西里西亚诺伊哈默尔新组建的\"武装党卫军陆军军团\"，以武装党卫军大将衔指挥该单位对抗苏军。1945年5月战败后被盟军俘获，引渡回匈牙利受人民法庭审判，以战争罪被判处死刑，1946年6月22日在布达佩斯被处决。"
 HUN_jeno_oszkar_ruszkay_desc:0 "鲁斯考伊·叶内（1887年1月1日—1946年6月22日），匈牙利将领与箭十字党军事头目，原名延诺·兰岑贝格尔，生于布达佩斯，德裔背景。军旅生涯起步于奥匈帝国军队，两战期间在霍尔蒂匈牙利皇家国防军中晋升，成为箭十字运动在军内的主要代理人。箭十字党1944年10月掌权后，他以匈牙利军职同时转入武装党卫军体系，在匈牙利裔德意志族招募大批人员入伍的过程中扮演核心角色。1945年1月被任命为所有匈牙利武装党卫军单位的总监，同年2月接掌在西里西亚诺伊哈默尔新组建的\"武装党卫军陆军军团\"，以武装党卫军大将衔指挥该单位对抗苏军。1945年5月战败后被盟军俘获，引渡回匈牙利受人民法庭审判，以战争罪被判处死刑，1946年6月22日在布达佩斯被处决。"
