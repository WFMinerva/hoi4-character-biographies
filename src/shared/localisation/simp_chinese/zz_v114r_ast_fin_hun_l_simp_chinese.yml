 # 76. 库恩·贝拉 / HUN_bela_kun
 CBIO_HUN_bela_kun_desc:0 "库恩·贝拉（1886年2月20日—1938年8月29日），原名贝拉·科恩，匈牙利共产革命家，出生于锡拉吉切赫（今罗马尼亚），犹太家庭，父亲为村镇公证人。法学肄业后转型为记者与社民党活动家；一战以奥匈士兵身份赴东线，1916年被俄军俘虏，在战俘营中转化为布尔什维克，结识列宁，在俄国内战中投身红军。1918年11月携苏联支持返回匈牙利，创立匈牙利共产党，以煽动性宣传迅速扩大影响，1919年2月遭卡罗伊政府逮捕后仍在狱中遥控指挥。1919年3月维克斯照会引发民族主义爆发，社民党绝望谈判将政权合并拱手相让，3月21日库恩出狱组成苏维埃政府，以外交人民委员身份实掌全权，开始国有化运动与\"红色恐怖\"，史载约三百至六百人死于无序处决。苏维埃共和国历时133天，8月1日因罗马尼亚军队压境而覆灭，他逃往维也纳，后辗转至莫斯科，出任共产国际克里米亚革命委员会主席，策划并执行了内战后针对白军俘虏与平民的大规模处决。此后在共产国际任职多年，力图重组匈牙利地下党，屡遭挫折，声誉渐衰。1938年斯大林大清洗期间以\"托洛茨基主义阴谋\"罪名被捕，同年8月29日在莫斯科科穆纳尔卡被处决；苏联直至1989年才正式承认处决时间，1956年已对其政治平反。"
