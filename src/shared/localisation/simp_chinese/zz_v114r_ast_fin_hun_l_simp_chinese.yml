 # 72. 霍尔蒂·伊什特万 / HUN_istvan_horthy
 CBIO_HUN_istvan_horthy_desc:0 "霍尔蒂·伊什特万（1904年12月9日—1942年8月20日），匈牙利副摄政，生于普拉（今克罗地亚），为摄政霍尔蒂·米克洛什之长子。机械工程师出身，1928年毕业后赴美国在福特底特律工厂工作一年，回国后进入马瓦格机车工厂担任工程师及设计组骨干，参与研发多项重要机车型号，1934至1938年任公司主任，1938年升任总经理，1940年出任匈牙利国家铁路总裁。他以公开批评纳粹主义及对犹太劳役营遭受虐待的人道关切而著称，从基辅致父亲的信函中留有对劳役营惨状的沉痛记述。1942年1月由议会选举为副摄政，一时被称为\"小摄政\"，深获民望，被视为霍尔蒂体制理想的温和继承者。同年他主动要求赴东线服役，以预备军官身份驾驶匈牙利\"海雅\"战斗机参与任务，执行第二十五次出击时于1942年8月20日在伊洛夫斯科耶附近起飞后迅速拉升失速，飞机坠毁，当场阵亡。其死因是否纯属事故至今仍有争议，然其辞世对摄政府士气与霍尔蒂对德政策均造成深远影响。"
