 # 16. 戈登·贝内特 / AST_gordon_bennett
 CBIO_AST_gordon_bennett_desc:0 "全名亨利·戈登·贝内特，1887年4月16日生于维多利亚州科尔多伊，1962年8月1日卒于悉尼，终年75岁。一战王牌将领，二战最具争议的澳军指挥官。一战中在加里波利和西线战役屡立战功，年仅29岁升准将，成为一战中最年轻的澳军旅长之一，战争结束时已获杰出服役勋章和多枚嘉奖。两战之间以商人和民兵军官双重身份活跃，常与正规军高层产生摩擦。1941年出任马来亚澳大利亚第8师师长，负责马来半岛西海岸的防御。1942年1月日军从半岛南下，澳军节节败退；2月8日日军渡过柔佛海峡登陆新加坡岛后，2月10日贝内特决定独自乘船逃往澳大利亚，将部下约13000名官兵留在即将投降的新加坡——这些澳军成为日本战俘，在日本战俘营中死伤惨重。贝内特以带回第一手信息为由为自己辩护，但遭受广泛谴责，战后司法调查认定其弃守行为\"无法以任何标准证明为正当\"。1942年提交的调查报告虽被政府压下，1945年方才公开，至今仍是澳大利亚军事史上争议最大的事件之一。贝内特余生在公众的批评和同僚的回避中度过，1962年去世。"
