 # 35. 斯万特·松德曼 / FIN_svante_sundman
 CBIO_FIN_svante_sundman_desc:0 "斯万特·奥古斯特·松德曼（1895年5月12日—1969年2月13日）生于赫尔辛基，是瑞典语裔的芬兰海军军官与官员。他于1920至1922年就读海军军事学校，曾任拉多加湖区舰队长及海军军事学校校长，1936年出任海军参谋长。二战期间他统领海军（任海军司令至1946年），1943年晋海军少将。他同时于1938至1944年任海事局长，战后1944至1965年主管商工部海事部门。1948至1953年间，他出任战争赔偿工业代表团主席并领导赔偿事务机构SOTEVA，并在二战后推动了破冰船队的现代化。"
