 # 42. 凯赖斯泰什-菲舍尔·费伦茨 / HUN_ferenc_fischer
 CBIO_HUN_ferenc_fischer_desc:0 "凯赖斯泰什-菲舍尔·费伦茨（1881年2月18日—1948年3月3日），匈牙利法学家与政治家，生于佩奇，德裔背景。法律专业出身，先后出任巴兰尼亚县（1921—1931年）及绍莫吉县（1925—1931年）地方行政长官，1931年起首度担任内政部长，任期至1935年；1938年再度出任内政部长，直至1944年3月德军占领匈牙利为止，是霍尔蒂时代任期最长的内政部长之一。任内以强硬但相对均衡的手段同时压制左右翼极端运动，是摄政府保守秩序的重要支柱；1941年4月3日泰莱基总理自杀身亡当日，他以内政部长身份短暂代理总理职务，1942年3月7日巴尔多希被迫辞职后亦再度短暂代理，直至卡莱继任。德军占领后以\"保护性拘留\"名义被盖世太保逮捕，与其弟劳约什一同关押于达豪集中营，战后获释流亡西方。1948年3月3日在维也纳因肺癌辞世，享年六十七岁。"
