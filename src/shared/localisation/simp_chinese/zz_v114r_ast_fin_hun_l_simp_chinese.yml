 # 21. 帕沃·塔尔韦拉 / FIN_paavo_talvela
 CBIO_FIN_paavo_talvela_desc:0 "帕沃·尤霍·塔尔韦拉（1897年2月19日—1973年9月30日）是芬兰步兵上将、耶格尔运动成员，以进攻型指挥风格著称。他早年在普鲁士皇家第27耶格尔营服役，参加内战（白军），战后投身亲缘战争，曾任奥涅奇（奥卢涅茨）远征军司令。两战之间，他参与创建学院派卡累利阿学会，并卷入拉普阿运动，1930年为其筹组了\"农民进军\"。冬季战争中，他临危请缨，指挥\"塔尔韦拉集群\"在托尔瓦耶尔维之战中取得芬军开战以来的首场重大胜利，并因此成为史上第二位获颁曼纳海姆十字勋章者。继续战争初期，他指挥第六军在拉多加-卡累利阿方向进攻。1942至1944年，他出任芬兰驻德军最高统帅部的代表，早在1940年底便曾在柏林会晤哈尔德与戈林。他长于独立指挥进攻，性情高傲而执拗。1944年9月他离开军队，战后一度旅居巴西，1966年退役时晋步兵上将。"
