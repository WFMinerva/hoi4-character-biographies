 CBIO_HOI120_abbas_daryanavard_desc:0 "阿巴斯·达里亚纳瓦尔德是伊朗南部的海员和海军军官，早年随父亲出海，曾航行至东非。回到布什尔后，他先后在「穆扎法里」号和「波斯波利斯」号等船上任职。礼萨·沙阿时期，他参与勘定穆萨湾通往沙普尔港的航道和航标，随后在沙普尔港负责海务。他也创作宗教悼歌，其中一些作品在波斯湾沿岸及印度的什叶派社群中流传。"
 CBIO_HOI120_abdollah_zelli_desc:0 "阿卜杜拉·泽利是伊朗巴列维时期的海军军官。20世纪30年代，伊朗在波斯湾建立常备海军，泽利曾在该国早期炮舰“巴布尔”号上任职。英国同期海军报告多次记载他在波斯湾的活动。1949年，他已是伊朗海军司令、海军少将。同年英国在霍拉姆沙赫尔向伊朗移交“德比港”号和“弗莱”号两艘军舰，由他代表伊朗海军接收。"
 CBIO_HOI120_abdolreza_afkhami_desc:0 "阿卜杜勒-礼萨·阿夫哈米1885年生于德黑兰，曾在奥地利的军事学校求学。1911年加入伊朗宪兵部队，至1921年已晋升上校。1931年参与伊朗与土耳其的边界委员会，1934年随礼萨·沙阿访问土耳其。1936年，他以准将军衔任总参谋部第二局局长。第二次世界大战期间，他调任驻克尔曼的第七师师长，晋升少将，1944年9月卸任该师指挥职务。"
 CBIO_HOI120_adalbert_rogulja_desc:0 "阿达尔贝特·罗古加是第二次世界大战时期克罗地亚独立国的航空军官，曾任萨拉热窝附近赖洛瓦茨机场的指挥官。1943年下半年，弗拉迪米尔·克伦离任后，罗古加以航空兵上校军衔接掌空军。任内，克罗地亚独立国的空军仍在轴心国一方作战。1944年，克伦复职，罗古加结束这段空军指挥任期。"
 CBIO_HOI120_adolf_hitler_desc:0 "1889年生于奥地利布劳瑙，海关官员之子，纳粹党党魁、第三帝国领导人。青年时在维也纳两度报考美术学院落榜，潦倒度日，逐渐形成反犹与泛德意志民族主义思想。一战中他在西线任传令兵，获一、二级铁十字勋章。战后投身慕尼黑右翼政治，1921年出任纳粹党主席，1923年发动啤酒馆暴动失败入狱，狱中写就《我的奋斗》，阐述其种族主义与“生存空间”扩张纲领。借助大萧条，纳粹党迅速壮大，1932年成为国会第一大党。1933年1月他被任命为总理，旋即借国会纵火案与《授权法》终结魏玛宪政，取缔他党与工会，建立一党专政；1934年“长刀之夜”清洗政敌，兴登堡死后合并总统与总理职权，自称元首。政权以盖世太保、党卫军、集中营与宣传机器为支柱，1935年《纽伦堡法》剥夺德国犹太人的公民权和其他权利，1938年制造“水晶之夜”。对外他撕毁凡尔赛和约、重整军备、进军莱茵兰，与意、日结盟；1938年承认伪满洲国，召回在华军事顾问团，结束对华军事合作。同年兼并奥地利、取得苏台德，1939年3月占领波希米亚与摩拉维亚，8月签订《苏德互不侵犯条约》后于9月1日入侵波兰，引发第二次世界大战欧洲战事。1941年发动“巴巴罗萨”入侵苏联，年底对美宣战。战争期间在他的领导下，纳粹德国及其合作者系统屠杀约六百万犹太人，另有大量罗姆人、残障者、苏联战俘与平民遇难。战局恶化后他屡拒撤退、强令死守，1944年七月密谋刺杀失败后展开血腥清洗。1945年4月苏军攻入柏林，30日他在总理府地下掩体与前一日完婚的爱娃·布劳恩一同自杀，遗体被焚，数日后德国无条件投降。"
 CBIO_HOI120_agatao_lanca_desc:0 "阿尔曼多·佩雷拉·德卡斯特罗·阿加唐·兰萨，1894年8月19日生于葡萄牙拜昂，海军军官和共和派政治人物。他曾任议员和里斯本民政总督。1926年军事政变后，他参与反对军事独裁。1927年2月，他在里斯本率一支由水兵等人员组成的队伍参加共和派起事，失败后被捕，并被流放至安哥拉。此后他仍参加反对独裁的活动，1928年参与“城堡起事”，后来流亡西班牙。1965年5月，他去世。"
 CBIO_HOI120_agnar_eldberg_kofoed_hansen_desc:0 "阿格纳尔·埃尔德贝格·科弗德-汉森（1915—1982）出生于雷克雅未克，在丹麦接受飞行训练，曾在丹麦与挪威的民航公司任飞行员。1937年，他参与创立阿克雷里航空公司并成为首任主管，后来参与勘察冰岛各地的飞机降落地点。1940年起，他担任雷克雅未克警察局长，战后转任机场管理职务，1951年开始主管冰岛民航事务。"
 CBIO_HOI120_aleksei_antonov_desc:0 "阿列克谢·因诺肯季耶维奇·安东诺夫（1896—1962）出生于格罗德诺，是苏联参谋军官。他参加过第一次世界大战和俄国内战，后来在伏龙芝军事学院学习及任教。德苏战争期间，他先后在南方面军、北高加索方面军和苏军总参谋部任职，参与统筹多个方面军的行动。1945年，他出任苏军总参谋长，并参加雅尔塔和波茨坦会议。战后，他还曾出任华沙条约组织联合武装力量首任参谋长。"
 CBIO_HOI120_alexander_akulich_desc:0 "亚历山大·康斯坦丁诺维奇·阿库里奇（1888—1961）出生于今白俄罗斯戈梅利州一带。第一次世界大战中曾在俄军服役，1918年加入红军，在俄国内战期间从事指挥和参谋工作。两次大战之间，他先后任步兵师、步兵军指挥官，并在红军机械化机构及军事院校任职。1940年，他获授中将军衔。德苏战争期间，他曾在沃尔霍夫方面军指挥第46步兵师，后调入国防人民委员部机关工作，1946年退役。"
 CBIO_HOI120_alexandrina_cantacuzino_desc:0 "亚历山德里娜·坎塔库济诺（1876—1944）出身罗马尼亚贵族家庭，曾在巴黎求学。第一次世界大战期间，她主持布加勒斯特第113医院，在妇女团体开办的女子学校里收治伤员。战后，她参与创建罗马尼亚全国妇女理事会，推动妇女取得选举权，并在1923年倡议波兰、捷克斯洛伐克、南斯拉夫、希腊和罗马尼亚的妇女团体结盟。1929年，她另组罗马尼亚妇女团体。她在为妇女争取参政的同时也宣扬民族主义、优生学和反犹主义。"
 CBIO_HOI120_alfonso_desc:0 "阿方索十三世（1886—1941）是西班牙国王阿方索十二世的遗腹子，出生即继承王位，由母亲玛丽亚·克里斯蒂娜摄政。1902年，他在议会宣誓亲政。摩洛哥战争的失利加剧了西班牙国内的政治危机，1923年他支持米格尔·普里莫·德里维拉建立军事独裁政权，也把王室的命运与这一政权联系在一起。1931年4月，共和派在多个城市的市政选举中获胜，第二共和国宣告成立，阿方索离开西班牙。1941年，他将西班牙王位的继承权让给儿子胡安，同年在罗马去世。"
 CBIO_HOI120_ali_soheili_desc:0 "阿里·苏海利是伊朗外交官和政治人物。第二次世界大战期间，他曾任外交大臣，并于1942年和1943年两度出任首相。1943年德黑兰会议期间，他与伊朗国王先后同美国、英国和苏联三国领导人会谈。三国随后发表《关于伊朗的宣言》，确认维护伊朗的独立、主权与领土完整，并承诺在战时条件允许的范围内继续给予经济援助。苏海利战后曾任伊朗驻英国大使。"
 CBIO_HOI120_aloyse_glodt_desc:0 "阿洛伊斯·格洛特在卢森堡罗埃瑟地区的消防队任职。1940年德国占领卢森堡后，队伍的社团活动受到限制，多名年长队员被要求退役。格洛特接任队长，战时队伍补充了水带等器材。卢森堡解放后，队伍逐步恢复活动。1948年，格洛特迁往克劳特姆，结束了在当地消防队的任期。"
 CBIO_HOI120_alva_myrdal_desc:0 "阿尔瓦·米达尔，1902年生于乌普萨拉，瑞典社会政策研究者与外交官。1934年，她与贡纳尔·米达尔合著《人口问题的危机》，把生育、育儿和住房条件带入瑞典的公共讨论。此后她研究学前教育，参与培训幼儿教师。战后，她先后在联合国和教科文组织负责社会事务，随后出任瑞典驻印度大使。1962年，她当选议员，并代表瑞典参加日内瓦裁军谈判。她因推动核裁军与和平事业，于1982年与阿方索·加西亚·罗夫莱斯分享诺贝尔和平奖，1986年去世。"
 CBIO_HOI120_angel_aurelio_gonzalez_desc:0 "安赫尔·奥雷利奥·冈萨雷斯是古巴海军军官。1933年古巴士官起义之后，原是士官的冈萨雷斯出任海军参谋长。到1936年初，他已是海军中校，并对外宣布海军飞行员安东尼奥·梅嫩德斯·佩拉埃斯获准驾驶海军飞机从古巴飞往西班牙。1937年，他以海军负责人的身份支持古巴和多米尼加的飞行员筹备纪念哥伦布的泛美飞行。"
 CBIO_HOI120_anibal_vallejo_sosa_desc:0 "阿尼瓦尔·巴列霍·索萨（1891—1938）是多米尼加军用航空的早期飞行员。1930年，他奉派赴古巴学习飞行，次年在哈瓦那附近的哥伦比亚军营毕业。1932年，他出任隶属多米尼加陆军的航空队首任指挥官，参与采购早期训练飞机。1934年，他因被指参与反对特鲁希略政府的密谋，被军事法庭判处监禁。获释后，他在边境城镇雷斯陶拉西翁任道路督察，1938年在那里遇害。"
 CBIO_HOI120_anthony_lawlor_desc:0 "安东尼·劳勒（1898—1989）是爱尔兰陆军军官。1939年欧洲战争爆发前后，爱尔兰着手组织海上巡逻和海岸监视，他以上校军衔负责海事与海岸监视勤务及海事志愿后备队。前者承担沿岸观察和巡逻，后者协助主要港口查验船只。1941年，劳勒与同伴创办爱尔兰海事研究所，推动公众了解航运和海防。该所后来的馆藏成为爱尔兰国家海事博物馆的基础。"
 CBIO_HOI120_antonio_menendez_pelaez_desc:0 "安东尼奥·梅嫩德斯·佩拉埃斯出生于西班牙阿斯图里亚斯，后来在古巴海军航空队担任飞行员。1936年1月，他驾驶「九月四日」号飞机从古巴卡马圭出发，单人跨越大西洋，于2月抵达西班牙塞维利亚，获西班牙授予一级军事功绩十字章。1937年，他参加纪念哥伦布的泛美飞行，年底在哥伦比亚卡利附近的空难中遇难。"
 CBIO_HOI120_asghar_khan_desc:0 "穆罕默德·阿斯哈汗（1921—2018）出生于查谟和克什米尔，1940年加入英属印度空军，二战期间曾在缅甸战场执行飞行任务。印巴分治后，他转入巴基斯坦空军，负责位于里萨尔普尔的空军学校。1957年，他以36岁之龄成为首位担任巴基斯坦空军总司令的巴基斯坦人。1965年离开空军后，他曾主持巴基斯坦国际航空公司，后来进入政界。"
 CBIO_HOI120_ast_ivan_dougherty_desc:0 "伊万·多尔蒂（1907—1998）是澳大利亚教师和陆军军官。他在任教期间参加民兵，第二次世界大战爆发后加入第二澳大利亚帝国军，先后在北非、希腊和克里特岛作战。1942年10月，他在新几内亚接掌第二十一步兵旅，指挥该旅参加戈纳等地的战斗。1945年，他随部队登陆婆罗洲东岸的巴厘巴板。战后他重返教育界，同时在澳大利亚陆军预备部队任职，晋升少将。1954年至1974年，他担任悉尼大学评议员，其间曾任八年副校监。"
 CBIO_HOI120_axel_ljungdahl_desc:0 "阿克塞尔·永达尔，1897年8月7日生于隆德。1918年成为陆军军官，1921年接受飞行训练，1936年转入瑞典空军。他的军事生涯跨过了瑞典陆军航空向独立空军的发展阶段。1954年，他出任空军司令，在冷战初期主持空军事务，任至1960年并晋升上将。退役后，他出版飞行军官回忆录，并从事宗教史研究。1995年，他去世。"
 CBIO_HOI120_baber_rana_desc:0 "巴贝尔·沙姆谢尔·姜格·巴哈杜尔·拉纳是尼泊尔首相钱德拉·沙姆谢尔之子，也是拉纳家族的军官。1915年，尼泊尔派部队前往英属印度协助战时防务，巴贝尔被任命为这支部队的总监察官，派驻德里陆军司令部。此后他仍在王国军中担任要职。1948年莫汉·沙姆谢尔掌权前后，尼泊尔宫廷影像档案已将巴贝尔记为陆军总司令。"
 CBIO_HOI120_baghirov_desc:0 "米尔·贾法尔·巴吉罗夫是苏维埃阿塞拜疆的党务官员，早年在阿塞拜疆的安全机关任职。1933年，他出任阿塞拜疆共产党中央委员会第一书记，在斯大林时期长期掌权。大清洗期间，他推动当地大规模政治镇压，党政人员、知识界人士和其他居民遭逮捕、流放或处决。1953年斯大林去世后，巴吉罗夫被撤职，随后被捕。1956年，他在巴库受审，被判处死刑并遭处决。"
 CBIO_HOI120_bapa_yeshe_desc:0 "巴巴益西来自康区巴塘，早年出家。1950年代后期，他参加四水六岗武装，1959年参与护送达赖喇嘛前往印度。此后，他成为尼泊尔木斯塘一带藏人武装的早期负责人。1974年，巴巴益西向尼泊尔当局交出武器，后来定居加德满都。"
 CBIO_HOI120_ben_bella_desc:0 "艾哈迈德·本·贝拉是阿尔及利亚独立运动领导人之一。第二次世界大战期间，他曾在法国军队服役。战后投入反殖民运动，参与创建民族解放阵线。1956年，他与其他民族解放阵线领导人乘坐的飞机被法国当局截获并改航，随后遭囚禁，直至1962年法国与阿尔及利亚方面达成《埃维昂协议》后获释。阿尔及利亚独立后，他出任总理，1963年成为首任总统。1965年，国防部长胡阿里·布迈丁发动政变，将他赶下台。"
 CBIO_HOI120_berger_desc:0 "白尔瑞是法国军官，曾任高级军官训练机构负责人。1939年，经中国驻外使节杨杰与法国政府交涉，他出任来华法国军事顾问团团长。同年5月，他率团抵达重庆，担任国民政府军事委员会法国总顾问。他考察中国军队的组织和作战情况，并致函蒋介石，建议推行征兵、明确各级指挥责任、调整指挥所位置和改善后备部队。1939年10月，行政院院长孔祥熙向国民政府呈请给白尔瑞等顾问授予云麾勋章。"
 CBIO_HOI120_birdwood_desc:0 "威廉·里德尔·伯德伍德，1865年9月13日生于英属印度，曾在英国桑赫斯特皇家军事学院学习。第一次世界大战开始后，他指挥澳大利亚及新西兰部队，率澳新军团参加加里波利战役，后负责该部撤离。1916年起，他在西线指挥第一澳新军团，后来接掌澳大利亚军团，1918年转任英国第五集团军司令。1925年，他晋升陆军元帅并出任英属印度陆军总司令，1930年退役，1951年在英国去世。"
 CBIO_HOI120_bjorn_bjornsson_desc:0 "比约恩·斯温松·比约恩松是冰岛共和国首任总统斯温·比约恩松的长子。第二次世界大战期间，他加入纳粹德国的武装党卫队，曾在东线担任战地记者，后来在德军占领下的哥本哈根参与面向丹麦的宣传工作。他的父亲于1944年当选总统时，比约恩仍在为德国方面工作。"
 CBIO_HOI120_bjorn_olafsson_desc:0 "比约恩·奥拉夫松（1895—1974）出生于阿克拉内斯，青年时在雷克雅未克邮局工作，1918年起从事批发和工业经营。二战期间，他参与处理外汇储备和进口限制，1942年至1944年任财政与贸易部长。1948年，他代表独立党当选雷克雅未克选区议员，战后再掌财政与贸易，后来兼管教育。"
 CBIO_HOI120_bjorn_thordharson_desc:0 "比约恩·索尔达松（1879—1963）在哥本哈根学习法律，曾任冰岛最高法院书记官，1929年起在雷克雅未克担任地方司法官。1942年12月，冰岛组建由非议员出任部长的内阁，他获任总理，兼管卫生和教会事务。1944年6月，冰岛在他任内结束与丹麦的君主共主关系，成立共和国。同年10月，他卸任总理。"
 CBIO_HOI120_bonyu_pironkov_desc:0 "博玉·斯托耶夫·比伦科夫（1897—1944）生于保加利亚普罗夫迪夫地区的巴贝克村。1917年，他从索非亚军事学校毕业，随后在炮兵部队服役。1941年起，他指挥第六师属炮兵团。1944年9月保加利亚转而对德作战，他受命指挥第五步兵师，同年11月在斯蒂普一带与德军交战时负重伤，于17日去世。他身后获追晋中将，并获授勇敢勋章。"
 CBIO_HOI120_boris_davidovich_berman_desc:0 "鲍里斯·达维多维奇·贝尔曼（1901—1939）出生于外贝加尔地区，是苏联国家安全机关官员。1921年，他进入安全机关，曾在苏联驻德国代表机构任职，后调入内务人民委员部国家安全总局。1937至1938年，他任白俄罗斯苏维埃社会主义共和国的内务人民委员，在大清洗期间主管当地的镇压工作。1938年，他被调回苏联中央机关，同年遭逮捕，1939年被处决。"
 CBIO_HOI120_bourguiba_desc:0 "哈比卜·布尔吉巴生于突尼斯莫纳斯提尔，曾在法国学习法律。1934年，他参与创立新宪政党，争取结束法国对突尼斯的保护国统治，曾多次被捕和流放。1955年，他回到突尼斯，翌年法国承认突尼斯独立后出任首相。1957年制宪会议废除君主制，他出任共和国临时总统。执政期间，突尼斯通过个人身份法改革婚姻与家庭制度，并扩大教育。1987年，总理本·阿里以其健康状况不宜继续执政为由接任总统。"
 CBIO_HOI120_bra_filinto_muller_desc:0 "菲林托·穆勒（1900—1973）生于巴西马托格罗索州库亚巴，早年从军，参加过反对旧共和国政府的军人起事。瓦加斯执政后，他于1933年出任联邦区警察总长。在他任内，政治警察搜捕反对派并对政治犯施以酷刑。1936年，被羁押在巴西的德国犹太裔共产党人奥尔加·贝纳里奥被遣送纳粹德国，后来遇害。随着巴西政府逐步靠向盟国，穆勒失去支持，于1942年7月离开警察总长职位。1945年他参与创建社会民主党，后来多次代表马托格罗索州出任参议员。1973年，他在法国的一次空难中身亡。"
 CBIO_HOI120_bra_jorge_dodsworth_martins_desc:0 "若热·多兹沃思·马丁斯（1884—1974）是巴西海军将领，生于米纳斯吉拉斯州蓬蒂诺瓦。早年他在巴西海军学校学习，此后历任多艘军舰舰长，在第二次世界大战期间指挥过巡洋舰编队。1945年10月底，瓦加斯下台，代总统若泽·利尼亚雷斯任命马丁斯为海军部长。次年杜特拉接任总统，留用马丁斯主持海军事务。1946年，西尔维奥·德·诺罗尼亚接替其职位。"
 CBIO_HOI120_bra_pedro_alcantara_desc:0 "佩德罗·德·阿尔坎塔拉（1875—1940）生于巴西彼得罗波利斯，是伊莎贝尔公主与欧伯爵加斯唐的长子。1889年巴西帝国覆亡，他随家人流亡欧洲。1908年，他为迎娶波希米亚贵族伊丽莎白·多布日任斯基，签署声明，放弃本人及后代对巴西王位的继承权。其弟路易斯由此成为母亲认可的继承人。佩德罗后来返回巴西，在彼得罗波利斯去世。他的儿子佩德罗·加斯唐认为父亲的声明不能约束后代，路易斯的儿子佩德罗·恩里克则继承了另一支的王位主张，两支在保皇派中各有支持者。"
 CBIO_HOI120_bra_pedro_gastao_desc:0 "佩德罗·加斯唐（1913—2007）是巴西皇室伊莎贝尔公主的孙子，父亲是佩德罗·德·阿尔坎塔拉。巴西建立共和国后，皇室家族流亡欧洲，加斯唐出生于法国。父亲在1908年婚前签署声明，放弃本人及后代的王位继承权，但加斯唐后来主张父亲的决定不能约束子女，成为彼得罗波利斯一支拥戴的王位候选人。其堂兄佩德罗·恩里克则代表叔父路易斯一系，两支的追随者长期争论其家族的继承顺序。加斯唐在巴西生活多年，2007年去世。"
 CBIO_HOI120_bratianu_desc:0 "迪努·布勒蒂亚努（1866—1950）出身于罗马尼亚自由派政治世家，曾在布加勒斯特和巴黎学习工程。进入议会后，他多次担任议员。1933年底，首相扬·杜卡遭铁卫团成员刺杀，迪努随后接掌国家自由党。第二次世界大战期间，他与尤柳·马纽合作，支持国王米哈伊推翻安东内斯库政权。1944年8月以后，他先后在瑟讷泰斯库和勒代斯库政府中任职，负责过战时生产。战后他遭到软禁，1950年5月被送往锡盖特监狱，同年8月死于狱中。"
 CBIO_HOI120_brill_desc:0 "阿图尔·布里尔是但泽自由市的社会民主党政治家，曾在但泽议会担任议员，并领导当地社会民主党。20世纪30年代初，他在议会讨论自由市的财政、经济和对外关系，也参加党内关于纳粹势力扩张的讨论。纳粹党控制自由市政府后，社会民主党的公开活动逐步受到压制。1936年，但泽当局取缔社会民主党。布里尔于同年底被捕。"
 CBIO_HOI120_carlos_jouanne_de_la_motte_desc:0 "卡洛斯·茹安·德拉莫特是智利海军中将，1879年4月9日生于瓦尔帕莱索。1893年进入海军学校，1918年指挥巡洋舰赴比格尔海峡进行水文测量。1920年任驻英国海军武官，为初创的智利海军航空兵延聘教官。1924年智利政局动荡时，他在路易斯·阿尔塔米拉诺领导的军政府中担任海军次长。1932年3月，他复职出任海军总监，并于同年10月退役。1945年3月15日，他在比尼亚德尔马去世。"
 CBIO_HOI120_carmel_desc:0 "卡梅尔·罗萨·巴塞尔巴（1912—2006）生于巴塞罗那，是加泰罗尼亚记者和社会主义活动家，曾用化名“罗克”。他十二岁丧父，开始做海关代理工作，1930年参加工农联盟。1935年，他参与工农联盟与共产主义左翼的合并，由此成立了马克思主义统一工人党。西班牙内战末期，他于1939年2月流亡法国，曾被拘禁，后来因协助抵抗纳粹占领的活动而入狱。1940年，他在图卢兹与旧日的同党安东尼娅·阿德罗埃尔重逢，两人此后相伴终生。他在流亡期间继续参与工会和加泰罗尼亚政治组织，1977年与阿德罗埃尔返回加泰罗尼亚。2006年，两人同获圣乔治十字勋章。"
 CBIO_HOI120_carrero_blanco_desc:0 "路易斯·卡雷罗·布兰科，1904年3月4日生于西班牙桑托尼亚。1918年进入海军学校，后来担任潜艇军官和海军战争学院教员。1936年内战爆发时，他在马德里，经外国使馆庇护离开共和派控制区，1937年转入佛朗哥一方的海军，后任巡洋舰分队参谋长。1941年，他出任政府主席府副秘书长，1951年职务升格为部长级。1967年，他出任政府副主席，1973年6月受佛朗哥任命担任政府主席，继续维护独裁体制。1973年12月20日，巴斯克分离主义组织“埃塔”在马德里将他暗杀。"
 CBIO_HOI120_casares_desc:0 "圣地亚哥·卡萨雷斯·基罗加，1884年生于拉科鲁尼亚，是律师和西班牙共和派政治家。第二共和国成立前，他组织加利西亚的共和派力量。1931年进入临时政府，先后主管海军和内政。1936年5月，他出任部长会议主席，并兼任陆军部长。7月军事叛乱爆发后，他辞去首相职务。共和国战败后他流亡法国，于1950年在巴黎去世。"
 CBIO_HOI120_castelao_desc:0 "阿方索·达尼埃尔·罗德里格斯·卡斯特劳，1886年生于加利西亚里安绍，学过医学，后来以绘画、讽刺漫画和文学作品知名。第二共和国时期，他当选国会议员，参与创建加利西亚主义党，并推动加利西亚自治法案。西班牙内战期间，他以画作和公开活动支持共和国。流亡阿根廷后，他在布宜诺斯艾利斯出版《永远在加利西亚》，1944年在蒙得维的亚参与成立加利西亚委员会并任主席，1950年在布宜诺斯艾利斯去世。"
 CBIO_HOI120_catroux_desc:0 "乔治·卡特鲁（1877—1969）是法国陆军将领。1939年，他受命出任法属印度支那总督。当时中国沿海受到日军封锁，从越南北部通往中国的陆路仍在运输物资。1940年，日本要求关闭边境并派员监督，卡特鲁在这场交涉中被法国政府撤换。同年他投向自由法国，接受戴高乐的领导，随后担任自由法国驻黎凡特总代表。1943年，他在驻阿尔及尔的吉罗与驻伦敦的戴高乐之间联络。战后，卡特鲁于1945年至1948年任法国驻苏联大使。"
 CBIO_HOI120_chaghoe_namgyal_dorje_desc:0 "夏格·朗吉多杰来自康区，曾担任地方行政职务。据他本人回忆，他在1950年代与中国当局共事约四年。四水六岗成员多尼翁后来回忆，朗吉多杰在冲突期间曾赴印度，参与联络嘉乐顿珠。1959年，国际法律家委员会公布了朗吉多杰在印度就康区局势所作的陈述。"
 CBIO_HOI120_chama_samphe_desc:0 "嘉玛桑佩（1914—1974）生于四川理化，即今理塘。20世纪50年代末，他参加四水六岗武装组织，担任副司令。1959年，他随一批藏人代表从印度赴台湾，随后与家人在台湾定居。抵台后，他继续参与当地与藏人事务有关的活动，曾受蒋介石接见，也到访过马祖守备部队。"
 CBIO_HOI120_charles_de_champs_desc:0 "夏尔·德·尚，1873年10月10日生于斯德哥尔摩，1893年成为瑞典海军军官。他曾任驻东京、北京和伦敦的海军武官，第一次世界大战期间主持海军参谋部的通信工作。战后他督察潜艇部队，先后负责卡尔斯克鲁纳和东海岸的海军指挥，1934年晋升海军中将。1936年，他出任海军参谋长并代理海军司令，次年在常设司令职位设立后成为首任海军司令。他推动审查舰队的舰种和更新需求，于1939年卸任，1959年在斯德哥尔摩去世。"
 CBIO_HOI120_chl_carlos_huayquinir_desc:0 "卡洛斯·瓦伊基尼尔·赖因（1913—1978）是智利马普切族新闻工作者。1939年，他为圣地亚哥的马普切人社团加尔瓦里诺协会创办的《阿劳卡尼亚阵线》撰稿，后来主持该报及继刊《阿劳卡尼亚先驱报》。他曾任协会司库和主席，以报刊讨论马普切人的土地、教育与权利，并批评社会中针对马普切人的歧视。"
 CBIO_HOI120_christiaan_du_toit_desc:0 "克里斯蒂安·卢多尔夫·德韦特·杜·托伊特是南非联邦国防军军官。第二次世界大战期间，他在北非服役，经历从加扎拉到阿拉曼一线的战事。1950年，他接替伦纳德·拜尔斯担任南非联邦国防军总参谋长，任至1956年。战后，他在军事学刊发表回忆，记述北非战场和南非国防制度的变化。"
 CBIO_HOI120_claes_lindstrom_desc:0 "克拉斯·林德斯特伦，1876年10月8日生于维斯比，瑞典海军军官。早年他在海军军械部门和海军学校任职，1910年至1912年曾在德国海军服役。第一次世界大战后期，他担任驻柏林和哥本哈根的海军武官，回国后执掌海军参谋部作战处。1922年至1923年，他指挥“菲尔吉亚”号装甲巡洋舰环航南美洲。此后他担任海军高等学校校长，1937年起指挥东海岸海军区，在二战爆发后的头几年负责瑞典东岸的海上防务，1942年结束现役并晋升海军中将。"
 CBIO_HOI120_constantin_argetoianu_desc:0 "康斯坦丁·阿尔杰托阿亚努（1871—1955）生于克拉约瓦，早年从事外交，后进入政界。第一次世界大战末期，他出任司法部长，战间期数度入阁，执掌过内政、财政和农业等部门。1939年9月，欧洲战争爆发不久，他在卡罗尔二世治下组阁，当年11月卸任。1940年夏，他又短暂担任外交部长。1944年赴瑞士后，他于1946年返回罗马尼亚，尝试重新组织政党。1950年他被捕，未经审判即遭长期拘禁，五年后死于锡盖特监狱。"
 CBIO_HOI120_constantin_atanasescu_desc:0 "康斯坦丁·阿塔纳塞斯库是罗马尼亚骑兵军官，战间期曾指挥骑兵团。1937年至1940年，他担任骑兵总监，参与讨论军队机械化。1938年9月，他在陆军最高委员会指出，罗马尼亚一时无力让部队全部改用机动车辆，军队仍须保有马匹。1944年秋，国王撤销了原先按年龄将他编入预备役的命令，追认他自1942年起晋为军级将官，随后批准他自当年9月起退出现役。"
 CBIO_HOI120_constantin_constantinescu_claps_desc:0 "康斯坦丁·康斯坦丁内斯库-克拉普斯（1884—1961）生于布泽乌县，先学炮兵与工兵，后毕业于高等军事学校。1941年罗马尼亚对苏开战时，他指挥第十一军，参加比萨拉比亚和敖德萨的战事。翌年，他率第四集团军驻守斯大林格勒以南，所部在苏军反攻中遭受重创。战后，他因1941年敖德萨四名苏联游击队员被处死一案受审，1954年被判十五年苦役，后获判无罪，于1955年获释，晚年住在巴克乌。"
 CBIO_HOI120_constantin_pantazi_desc:0 "康斯坦丁·潘塔济（1888—1958）生于克勒拉希，毕业于布加勒斯特军官学校和骑兵专科学校，参加过1913年的巴尔干战争和第一次世界大战。1940年，他进入扬·安东内斯库的政府，主管陆军事务。1942年1月至1944年8月，他在罗马尼亚与德国共同对苏作战期间担任战争部长。米哈伊国王发动政变当天，他在王宫被捕。1946年，布加勒斯特人民法庭以战争罪判处他死刑，国王依政府建议减为终身监禁。他最终死于勒姆尼库瑟拉特监狱。"
 CBIO_HOI120_constantin_prezan_desc:0 "康斯坦丁·普雷赞（1861—1943）出生于罗马尼亚南部，曾在法国枫丹白露学习炮兵与工兵技术。回国后，他在布加勒斯特的骑兵学校教授筑城学，后来负责首都要塞。1916年罗马尼亚参加第一次世界大战，他指挥第四集团军进入特兰西瓦尼亚，同年12月出任大本营参谋长，负责筹划次年的战事。战后他主持陆军总参谋部，1920年转入预备役。1930年卡罗尔二世授予他元帅军衔。他晚年曾任参议员，1943年去世。"
 CBIO_HOI120_cyril_kuchta_desc:0 "齐里尔·库赫塔（1913—1995）生于上斯皮什地区，毕业于捷克斯洛伐克赫拉尼采军事学院。斯洛伐克国成立后，他在该国陆军服役，1941年以坦克排长身份赴东线。1944年，他参与筹备斯洛伐克民族起义，并担任联络军官。8月27日，他率部扣押一支德国军事使团，次日下令将被扣人员枪杀。起义期间，他曾随代表团赴苏联请求援助。战后他在捷克斯洛伐克军队指挥装甲部队，1954年晋升上校，退役后在斯洛伐克民族起义博物馆工作。"
 CBIO_HOI120_danesh_desc:0 "哈吉·穆罕默德·达内什，1900年生于迪纳杰布尔，是孟加拉农民运动组织者和政治家，早年受过历史和法律教育。1938年起，他在北孟加拉组织农民争取减轻负担，后来成为佃农争取收成三分之二的运动领导人之一。1952年，他成立民主党，并于1954年作为联合阵线候选人当选东孟加拉省议员。此后曾在民族人民党任职。1971年，他支持孟加拉国独立战争，1986年在达卡去世。"
 CBIO_HOI120_dario_callejas_rojas_desc:0 "达里奥·卡列哈斯·罗哈斯是智利空军军官，早年就读于拉塞雷纳男子中学。第二次世界大战期间，他曾任驻墨西哥航空武官，也担任过智利航空学校副校长，负责航空军官训练。1947年，智利总统向参议院提请将他晋升为空军大队指挥官。战后，他还曾担任智利航空次长。"
 CBIO_HOI120_david_lopez_henriquez_desc:0 "戴维·洛佩斯·恩里克斯是委内瑞拉陆军军官，早年在哥伦比亚波哥大的军事学校受训，出身步兵。1920年，委内瑞拉在马拉凯创办军事航空学校，他以上校军衔出任首任校长。学校当时隶属陆军，初期由法国教官协助训练飞行员和机务人员。1936年，洛佩斯·恩里克斯任驻圣克里斯托瓦尔的第一军区司令。"
 CBIO_HOI120_derakhshani_desc:0 "阿里·阿克巴尔·德拉克沙尼是伊朗陆军准将，早年在吉兰和洛雷斯坦服役。1945年，获苏联支持的阿塞拜疆民主党在伊朗西北部建立自治政权时，他指挥大不里士驻军。同年12月，大不里士的军营向自治政权投降。他随后在德黑兰受军法审判，入狱后获赦。1978年，他被伊朗安全机关拘捕，在拘押期间死亡。他留下的回忆录记述了从早年服役到阿塞拜疆危机的军旅经历。"
 CBIO_HOI120_domingo_rosillo_del_toro_desc:0 "多明戈·罗西略·德尔托罗是古巴早期飞行员，1878年生于阿尔及利亚奥兰，年轻时来到古巴。1912年，他在法国受训并取得飞行执照。1913年5月17日，他驾驶单翼飞机从美国基韦斯特飞抵哈瓦那，率先完成这段横跨佛罗里达海峡的航程，同时携带了从基韦斯特寄往哈瓦那的信函。1938年，他参加这次飞行的二十五周年纪念活动。1957年11月28日去世。"
 CBIO_HOI120_doriot_desc:0 "雅克·多里奥（1898—1945）出身工人家庭，青年时期参加法国共产主义运动，1924年当选国会议员，后来担任巴黎北郊圣但尼市长。他主张共产党与社会党联合抵制极右翼，因与党领导层冲突，于1934年被开除党籍。1936年他创建法国人民党，从昔日的共产党议员转为法国法西斯运动的领袖。德军占领法国后，他鼓吹同德国合作，参加为德国作战的法国志愿军团，赴东线对苏作战。1945年2月，他在德国乘车途中遭飞机扫射身亡。"
 CBIO_HOI120_duhamel_desc:0 "莫里斯·迪阿梅尔本名莫里斯·布尔若，1884年生，是布列塔尼作曲家、民歌搜集者和自治运动活动者。1909年前后，他开始搜集布列塔尼的传统曲调，后来出版相关曲集。1920年代末，他参与创建布列塔尼自治党，加入党的领导机构并为报刊撰稿。1930年代初，他退出自治党，参与组建布列塔尼联邦主义联盟。1939年，他出版《布列塔尼人民史》第一卷，翌年去世。"
 CBIO_HOI120_durruti_desc:0 "布埃纳文图拉·杜鲁蒂，1896年7月14日生于西班牙莱昂，早年是金属工人，1917年罢工失败后曾流亡法国。回国后，他加入全国劳工联盟，参与组建无政府主义团体。1936年西班牙内战爆发后，他参与巴塞罗那的防卫，并率由志愿者组成的杜鲁蒂纵队开赴阿拉贡战线。他支持当地农地集体化。11月，他转赴马德里协防，在马德里中枪，11月20日去世。"
 CBIO_HOI120_edgar_angeli_desc:0 "埃德加·安盖利出生于卡尔洛瓦茨，早年在奥匈帝国海军服役，第一次世界大战后加入南斯拉夫王国海军。1941年，克罗地亚独立国组建海军时，他出任副指挥官。1943年，他接任海军指挥官，获海军少将军衔。1944年，他因病申请退役。战后在南斯拉夫举行的审判中，他被判处死刑。"
 CBIO_HOI120_edholm_desc:0 "埃里克·古斯塔夫·阿夫·埃德霍尔姆，1878年11月6日生于斯德哥尔摩，瑞典陆军军官。1899年进入斯韦阿近卫团，1902年至1904年在陆军高等军事学校学习。巴尔干战争期间，他曾以武官身份随希腊和黑山军队活动。此后他担任第四陆军师参谋长、南曼兰团团长和东部旅旅长。1936年晋升少将，1937年至1942年指挥第三陆军师，1944年获预备役中将军衔。"
 CBIO_HOI120_edouard_roy_desc:0 "G·爱德华·鲁瓦是海地军官。第二次世界大战期间，他以上尉军衔指挥海地航空队。1944年末，他率海地代表团参加芝加哥国际民用航空会议，并作为海地代表参加会议执行委员会。会议商定了战后国际民航合作的基本规则。鲁瓦代表海地签署《国际民用航空公约》，该公约后来成为国际民用航空组织开展工作的法律基础。"
 CBIO_HOI120_eduardo_mondlane_desc:0 "爱德华多·希万博·蒙德拉内1920年生于葡属东非南部的加扎地区，出身聪加人家庭。他早年在莫桑比克和南非求学，后赴美国，1953年毕业于奥柏林学院。此后，他在联合国托管事务部门从事研究，并曾在雪城大学任教。1962年，几支独立运动在达累斯萨拉姆联合成立莫桑比克解放阵线，他当选首任主席。同年11月，他以该阵线代表的身份在联合国大会第四委员会陈述莫桑比克独立诉求。1969年2月3日，他在达累斯萨拉姆遭邮件炸弹袭击身亡。"
 CBIO_HOI120_eduardo_montero_rojas_desc:0 "爱德华多·蒙特罗·罗哈斯是秘鲁空军军官。1937年入读豪尔赫·查韦斯中央航空学校，1941年以本届第一名毕业，同年参加秘鲁与厄瓜多尔的战争。1950年代，他任第23航空中队队长，并成为秘鲁早期受训的喷气式轰炸机飞行员之一。1957年晋升空军上校。1968年出任卫生部长，后任秘鲁武装部队联合司令部主席。"
 CBIO_HOI120_einar_arnorsson_desc:0 "埃纳尔·阿诺尔松（1880—1955）是冰岛法学家，曾任冰岛大学法学教授和校长。冰岛仍受丹麦统治期间，他于1915年至1917年出任冰岛事务部长，随后参加有关冰岛主权与丹麦关系的委员会。1932年出任最高法院法官，1942年至1944年担任司法与教育部长，随后返回最高法院。他整理出版过冰岛议会史料和法律文献。"
 CBIO_HOI120_einar_olgeirsson_desc:0 "埃纳尔·奥吉尔松（1902—1993）出生于阿克雷里，曾在柏林学习语言和文学，回国后参加工人运动。1937年，他作为共产党候选人当选冰岛议员，1939年开始领导统一人民党—社会党。1941年，驻冰岛英军逮捕他并将其送往伦敦，同年夏天释放。1944年，他参加冰岛与丹麦分离相关的委员会，战后继续担任议员和党主席。"
 CBIO_HOI120_el_ouali_desc:0 "瓦利·穆斯塔法·赛义德是西撒哈拉独立运动的组织者，曾在摩洛哥拉巴特学习政治学。1973年，他参与创立波利萨里奥阵线，争取结束西班牙对西撒哈拉的殖民统治，后任该组织总书记。西班牙撤离后，波利萨里奥阵线于1976年宣布成立阿拉伯撒哈拉民主共和国，并与主张控制该地区的摩洛哥和毛里塔尼亚交战。同年6月，赛义德在对毛里塔尼亚首都努瓦克肖特的袭击中身亡。"
 CBIO_HOI120_elena_desc:0 "埃莱娜（1896—1982）生于雅典，是希腊国王康斯坦丁一世的女儿。1921年，她与罗马尼亚王储卡罗尔成婚，同年生下米哈伊。1940年9月，卡罗尔二世退位，米哈伊再度登基，她从佛罗伦萨返回罗马尼亚。战争期间，她向安东内斯库当局交涉，为被驱逐到德涅斯特河以东的犹太人争取救济。1943年至1944年间，她帮助幸存者返回罗马尼亚，其中包括失去父母的儿童。米哈伊退位后，她于1948年离开罗马尼亚，晚年在瑞士去世。1993年，以色列犹太大屠杀纪念馆追授她“国际义人”称号。"
 CBIO_HOI120_emil_bodnaras_desc:0 "埃米尔·波德纳拉斯（1904—1976）受训于蒂米什瓦拉炮兵军官学校。1932年，他离开罗马尼亚军队前往苏联，回国后被捕，1942年出狱。此后他参加罗马尼亚共产党的地下领导工作。1944年8月23日，米哈伊国王下令逮捕扬·安东内斯库后，波德纳拉斯与珀特勒什卡努一同前往王宫。1947年底，他开始掌管军队，先后以战争部长、国防部长和武装力量部长的名义任职至1955年。后来他曾任部长会议副主席和国务委员会副主席。"
 CBIO_HOI120_enrique_carreras_rolas_desc:0 "恩里克·卡雷拉斯·罗拉斯（1922—2014）生于古巴马坦萨斯。1941年，他应征入伍，1944年完成飞行训练。二战期间，他曾参加古巴北岸的海上巡逻。1957年，西恩富戈斯发生反对巴蒂斯塔的起义，他因拒绝轰炸当地海军基地而被判刑。1959年获释后，他加入古巴革命武装部队，并于1961年参加猪湾战斗。此后他继续从事飞行和飞行员训练，官至少将。"
 CBIO_HOI120_ernest_urdarianu_desc:0 "埃内斯特·乌尔德里亚努（1897—1985）出生于斯拉蒂纳的军人家庭，早年为骑兵军官。第一次世界大战期间，他担任步兵师副官，1922年调入王室护卫团。卡罗尔二世在位时，他从王宫侍从长升任王室大臣。要求觐见、晋升或就地方官员提出申诉的人，常通过他向国王递交请求。1940年卡罗尔二世退位，他随前国王和埃莱娜·卢佩斯库出走。此后他一直跟随两人流亡，晚年在葡萄牙度过。"
 CBIO_HOI120_eskandari_desc:0 "苏莱曼·米尔扎·伊斯坎达里出身伊朗卡扎尔王族。1908年，他的兄长在穆罕默德·阿里沙炮轰议会时受伤身亡。苏莱曼此后活跃于立宪运动，曾在议会代表民主党。1921年回国后，他参与建立社会党，并在第五届议会领导社会党党团。1923年，他获任教育部长。礼萨沙在位期间，他一度被排除在政坛之外。1941年礼萨沙退位后，他主持创建图德党并出任首任主席。他曾与驻伊苏军接触，也曾反对接纳女性入党。1944年1月7日，他在伊朗去世。"
 CBIO_HOI120_essa_desc:0 "卡齐·穆罕默德·伊萨，1914年生，是来自俾路支斯坦皮欣的律师和政治活动家。他在俾路支斯坦组织穆斯林联盟，进入全印穆斯林联盟工作委员会。1940年，他代表俾路支斯坦参加讨论拉合尔决议的大会，此后为建立巴基斯坦开展政治活动。巴基斯坦独立后，他进入外交界，1952年至1953年担任驻巴西大使，并曾参加巴基斯坦赴联合国的代表团。1976年去世。"
 CBIO_HOI120_esteban_elena_desc:0 "埃斯特万·埃莱纳是乌拉圭企业家和政治人物，曾管理蒙得维的亚的有轨电车企业，后来主持国家铁路与电车机构。他也曾任乌拉圭抵押银行和国家冷藏屠宰公司的负责人。1938年，阿尔弗雷多·巴尔多米尔就任总统后，埃莱纳出任主管畜牧与农业的部长。他还曾任参议员，在议会参与农业政策和油料作物定价的辩论。"
 CBIO_HOI120_eugen_cristescu_desc:0 "欧金·克里斯泰斯库（1895—1950）出身于罗马尼亚治安警察系统，在内政部任职多年。1940年11月，扬·安东内斯库任命他执掌特别情报局，该机构直接隶属政府首脑。1941年6月雅西发生反犹大屠杀，他所领导的情报局与罗军大本营情报部门参与组织迫害。战后受讯时，他试图把责任归于德国方面。1946年，布加勒斯特人民法庭判处他死刑，米哈伊国王随后依政府建议减为终身监禁。1950年，他死于沃克雷什蒂监狱。"
 CBIO_HOI120_eugen_rosca_desc:0 "欧根·罗什卡（1884—1950）生于多瑙河港口加拉茨，1906年从布加勒斯特的军校毕业后在多瑙河舰队服役。战间期，他指挥过“默勒舍什蒂”号驱逐舰。1924年，他率三艘炮舰驶离康斯坦察，访问伊斯坦布尔等港口，并在返航途中与保加利亚海军互访。此后他担任海上舰队参谋长。1940年，他晋升海军中将，接掌罗马尼亚皇家海军。1941年罗马尼亚对苏开战时仍在任，1942年卸任。"
 CBIO_HOI120_eugene_bridoux_desc:0 "欧仁·布里杜（1888—1955）是法国陆军军官，毕业于圣西尔军校，参加过第一次世界大战。1938年，他晋升准将，任索米尔骑兵学校校长。1939年9月，他接掌第41步兵师，次年在法国战役中被俘。1941年获释后，他进入维希政权驻德占区代表机构任秘书长，1942年任负责陆军事务的国务秘书，1943年改任国防事务副国务秘书。战后他逃往西班牙，1948年被法国高等法院缺席判处死刑，1955年在西班牙去世。"
 CBIO_HOI120_eysteinn_jonsson_desc:0 "埃斯泰因·荣松（1906—1993）出生于久皮沃格尔，青年时做过海员，进入冰岛政府后曾任雷克雅未克税务长官。1934年出任财政部长，1939年改掌贸易事务，直到1942年离任。战后他先后掌管教育和财政，长期代表进步党在冰岛议会任职。"
 CBIO_HOI120_fedor_dobysh_desc:0 "费奥多尔·伊万诺维奇·多贝什（1906—1980）出生于莫吉廖夫省科哈诺沃村，早年在第聂伯河水电站工程工作。1928年入伍，最初在步兵部队服役，1930年代转入航空兵。1937至1938年，他以苏联志愿航空人员身份在中国参加抗日作战，后来又参加了苏芬战争。德苏战争期间，他先后指挥轰炸航空兵团和近卫轰炸航空兵师。战后，他继续在空军任职，1960年至1972年指挥苏联第50火箭集团军。"
 CBIO_HOI120_fedor_dragojlov_desc:0 "费多尔·德拉戈伊洛夫（1881—1961）出生于潘切沃，在维也纳接受军事教育，第一次世界大战期间在奥匈军队任参谋军官。奥匈帝国解体后，他退役回到潘切沃，曾管理当地一家啤酒厂。1941年，他在克罗地亚独立国军队任职，同年8月出任国民卫队总参谋部作战部门主管，后来晋升将军。1945年他离开萨格勒布，战后在流亡刊物撰写有关克罗地亚独立国军队的文章，1961年在布宜诺斯艾利斯去世。"
 CBIO_HOI120_folke_hogberg_desc:0 "福尔克·赫格贝里，1884年3月20日生于赫尔辛堡，1905年完成军官训练。早年在瑞典陆军服役，曾领导军事学院，后来担任博登要塞司令。1937年他晋升少将，日后担任总参谋军官团长，在斯科夫德担任军区司令。1949年他晋升中将。从军之余，他研究北欧中世纪艺术与建筑，曾出版有关教堂建筑的著作。1972年6月8日，他去世。"
 CBIO_HOI120_forster_desc:0 "阿尔贝特·福斯特，1902年生于德国菲尔特。1930年起，他担任纳粹党但泽大区领导人，在但泽自由市打压政治反对派，参与迫害犹太居民和波兰居民。1939年德国入侵波兰后，他掌管新设的但泽—西普鲁士帝国大区。其管辖区发生了对波兰平民和犹太人的大规模杀害、驱逐及强制同化。战后他被英军俘获，随后移交波兰。波兰最高国家法庭于1948年判处他死刑，1952年2月28日在华沙执行。"
 CBIO_HOI120_francisco_m_velez_desc:0 "弗朗西斯科·M. 贝莱斯是阿根廷陆军军官。1919年，他以陆军中校身份在巴拉那市的公共图书馆演讲，回顾阿根廷陆军的发展，并讨论军队如何服从国家政府的政治领导。此后他撰写军事史著作，1938年出版两卷本《留给后世》，回顾曾两任总统的胡利奥·阿根蒂诺·罗卡的军事生涯。"
 CBIO_HOI120_francois_schammel_desc:0 "弗朗索瓦·沙梅尔是卢森堡商人。德国占领期间，他参加抵抗运动，后来出任卢森堡抵抗运动联盟主席。1945年，他以这一身份进入国家救济机构的理事会和管理委员会。1946年，他又加入抵抗勋章委员会，参与战后表彰抵抗者的评议工作。"
 CBIO_HOI120_frank_desc:0 "卡尔·赫尔曼·弗兰克，1898年生于卡尔斯巴德，早年参与苏台德德意志人政治运动，后进入纳粹政权。1939年德国占领捷克地区后，他出任波希米亚和摩拉维亚保护国国务秘书，并在当地掌握党卫队与警察权力。1942年海德里希遇刺后，他在纳粹对利迪策村的屠杀和报复中起主要作用。1943年，他升任负责保护国事务的德国国务部长。战后移交捷克斯洛伐克，1946年在布拉格受审并被处决。"
 CBIO_HOI120_frank_feliz_miranda_desc:0 "弗兰克·安德烈斯·费利斯·米兰达是多米尼加早期的军用飞行员。1931年，他在古巴完成飞行训练，次年担任多米尼加陆军航空队副指挥官。1936年，他被任命为陆军航空分队指挥官。1937年，他代表多米尼加参加纪念哥伦布的泛美飞行。1942年，他任战争与海军事务国务秘书的军事及航空副官。1950年，他以上校军衔出任航空队参谋长。"
 CBIO_HOI120_fuco_desc:0 "富科·戈麦斯，1895年生于加利西亚贝塞雷亚，年少时移居古巴，后来成为记者、作家和加利西亚独立运动的活动者。他在哈瓦那参加加利西亚移民组织，1921年创建加利西亚分离主义革命委员会，倡议加利西亚独立。1927年，他在哈瓦那出版《加利西亚语书写法》，持续研究加利西亚语的拼写与语法。他长期主持双语刊物《加利西亚祖国》，通过文章和通信宣传加利西亚的语言与政治主张。1972年在古巴去世。"
 CBIO_HOI120_fujimoto_desc:0 "查尔斯·藤本是美国夏威夷领地的日裔政治活动者，曾担任当地共产党主席。1950年，美国众议院非美活动委员会传唤他作证。1951年，他与妻子艾琳等七人因涉嫌违反《史密斯法》被起诉，此案后来被称作「夏威夷七人案」。联邦地区法院作出有罪判决后，被告提出上诉。1958年，美国联邦第九巡回上诉法院撤销了原判。"
 CBIO_HOI120_gafencu_desc:0 "格里戈雷·加芬库（1892—1957）在巴黎取得法学博士学位，第一次世界大战期间在罗马尼亚航空兵的侦察中队服役。战后他从事新闻工作，1937年创办《时报》。1938年12月至1940年6月，他担任外交部长，随后以罗马尼亚公使身份赴莫斯科任职，直至1941年6月罗苏开战。同年他流亡瑞士，撰文主张罗马尼亚脱离轴心国。战后他定居巴黎，参与罗马尼亚流亡者的政治活动，并以亲历的外交谈判为题写下回忆。1957年在巴黎去世。"
 CBIO_HOI120_garabeyov_desc:0 "加拉·加拉别约夫是阿塞拜疆医生、报刊作者和政治家。俄罗斯帝国晚期，他在高加索从医并参与公共事务。阿塞拜疆民主共和国时期，他担任议员，领导伊蒂哈德党。苏维埃政权建立后，他继续从事医疗工作，1920年代末迁居中亚，后来在撒马尔罕任职。1937年，他被捕并判处十年监禁，押往科雷马。获释后，他回到中亚，1953年在撒马尔罕去世，身后获平反。"
 CBIO_HOI120_gefflot_desc:0 "扬-莫尔旺·热弗洛是法国战后布列塔尼地方运动的活动者。1969年，他担任在雷恩登记的布列塔尼解放阵线协会主席，并主持月刊《革命的布列塔尼》。1971年，他为《怎么办？》的民族少数群体专题撰写关于布列塔尼运动的文章，并参加了围绕法国国内地区关系与少数群体处境的讨论。布列塔尼的现代德鲁伊团体克雷登·盖尔蒂克也留下他的活动记录，称他曾以阿布·阿尔托诺维奥斯为名担任团体负责人。"
 CBIO_HOI120_geng_gui_desc:0 "耿贵在1930年代活跃于青海西宁。1935年，西宁县工会改组，他在各分会代表参加的选举中当选理事。翌年，青海省会组织城内保安团，耿贵与张国荣、孙金丰、李蕃等人一同被推举担任团长。"
 CBIO_HOI120_georgescu_desc:0 "格里戈雷·乔治斯库（1886—1952）生于克拉约瓦，毕业于罗马尼亚炮兵、工兵与海军军官学校。第一次世界大战后，他在布加勒斯特训练工兵军官。1928年，他编写军用通信教材，后来参与从英国采购短波电台，供罗马尼亚通信部队使用。1930年代末，他指挥第十九步兵师。1941年1月，他在安东内斯库政府中出任公共工程与交通部长，数月后返回军中。战后，他因在战时政府任职而受到审判。1952年，他死于锡盖特监狱，家人两年后才得知其死讯。"
 CBIO_HOI120_georgy_holostyakov_desc:0 "格奥尔吉·尼基季奇·霍洛斯贾科夫（1902—1983）出生于巴拉诺维奇，参加过俄国内战，1921年加入苏联海军，后任太平洋舰队潜艇部队指挥官。1938年他被捕，1940年获释并恢复军职。德苏战争期间，他指挥新罗西斯克海军基地，参与黑海沿岸的防御与登陆作战。1944年末起，他指挥多瑙河区舰队，1945年晋升海军中将。战后他还曾指挥里海区舰队和太平洋方向的第7舰队。"
 CBIO_HOI120_gheorghe_alexianu_desc:0 "格奥尔基·阿列克西亚努是罗马尼亚法学教授，战前在切尔讷乌齐讲授比较宪法。1941年8月，扬·安东内斯库任命他为德涅斯特河与南布格河之间罗马尼亚占领区的总督。他下令把仍留在敖德萨的犹太居民驱逐到乡间，也颁令规定被遣送到占领区的罗姆人如何受到拘禁和强迫劳动。饥饿、严寒和疾病夺去了大量被驱逐者的生命。1946年，布加勒斯特人民法庭审判安东内斯库政权的主要官员。阿列克西亚努被判处死刑，6月1日在日拉瓦被处决。"
 CBIO_HOI120_gheorghe_pintilie_desc:0 "格奥尔基·平蒂列（1902—1985）曾以潘捷列伊·博德纳连科等名字活动，战前为苏联情报机关工作，因间谍活动在罗马尼亚服刑。1948年，共产党政府成立人民安全总局，他被授予中将军衔，出任首任局长。在他任内，秘密警察参与镇压反对者，并在监狱内建立收集情报的制度。他下令并协调狱中情报工作，对皮特什蒂监狱以酷刑迫使囚犯相互告发的所谓“再教育”负有直接责任。后来他在内政部继续担任副部长等职。"
 CBIO_HOI120_gisli_sigurbjornsson_desc:0 "吉斯利·西于比约恩松（1907—1994）是冰岛商人和养老机构管理者，早年经营邮票买卖。1933年，他参与发起冰岛民族主义运动并担任主席。该运动受到德国纳粹主义影响。同年，他与吉斯利·比亚纳松赴冰岛西部和北部，为该运动举行宣传集会。1934年，他接掌父亲创办的格伦德养老院，长期主持院务；1952年，格伦德又接办赫韦拉盖尔济的奥斯养老院。1994年1月7日，他去世，在此之前一直担任格伦德的负责人。"
 CBIO_HOI120_gorkin_desc:0 "胡利安·戈尔金本名胡利安·戈麦斯·加西亚，1901年生于西班牙瓦伦西亚地区。早年参加社会主义青年运动，后加入共产党并在法国流亡，一度为共产国际工作。与共产国际决裂后，他参加工农集团，参与组建马克思主义统一工人党。西班牙内战期间，他担任该党报纸《战斗报》的政治主编。1937年党组织遭镇压后，他被捕并在翌年受审。战后流亡墨西哥，从事出版和写作。此后移居法国，持续参与反佛朗哥活动，1987年在巴黎去世。"
 CBIO_HOI120_gosta_ehrensvard_desc:0 "古斯塔·欧联斯瓦德，1885年2月10日生于瑞典斯科訥，出身海军军官家庭。1904年，结束海军学校训练的他进入舰队，后来在海军学校任教，并在海军参谋部先后掌管通信和作战事务。1932年至1933年，他指挥海防舰“维多利亚王后”号，1937年出任海军参谋长，翌年晋升海军少将。1939年，他接掌海岸舰队，在二战初期指挥部署于瑞典近海的主力舰队。1942年他调任南部海军区司令，驻卡尔斯克鲁纳，1950年离任并晋升海军中将，1973年去世。"
 CBIO_HOI120_gudmundsson_desc:0 "哈拉尔杜尔·古德蒙松，1892年生于冰岛古武达卢尔，早年从事教学、新闻和银行工作，曾任社会民主党的《人民报》主编。1927年当选冰岛议会议员，1934年至1938年任产业与交通部长。他曾主持两院联席会议，后来负责国家社会保险机构，并于1954年至1956年出任社会民主党主席。1957年出任驻挪威大使，此后兼任驻捷克斯洛伐克和波兰大使。1971年去世。"
 CBIO_HOI120_guillermo_padilla_manrique_desc:0 "吉列尔莫·帕迪利亚·曼里克是哥伦比亚军官。1931年，他进入波哥大军官学校，1936年晋升中尉。1942年，他被派往亚马孙边境的塔拉帕卡，次年进入总参谋部。战后，他晋升上校，曾在哥伦比亚国家警察任职。1954年，他出任哥伦比亚奥林匹克委员会主席，任内哥伦比亚重返奥运赛场，参加了1956年墨尔本奥运会。退役后他定居美国，1986年在路易维尔去世。"
 CBIO_HOI120_guise_desc:0 "让·德·奥尔良（1874—1940）生于巴黎，是沙特尔公爵的儿子。法国的王族流放法限制他在本国服役，他在丹麦接受军事训练，婚后以吉斯公爵为号，与妻子到摩洛哥拉腊什经营农庄。第一次世界大战期间，他把在法国的城堡交给红十字会作医院，自己参与转送伤兵，后来还受法国政府委派前往保加利亚。1926年，他成为奥尔良派拥戴的法国王位继承人，支持者称他为让三世。1940年他在拉腊什去世，独子亨利接替了他在王室家族中的位置。"
 CBIO_HOI120_gusti_desc:0 "迪米特里耶·古斯蒂（1880—1955）生于雅西，在莱比锡取得哲学博士学位，后来到布加勒斯特大学教授社会学。从1925年起，他带学生、医生、地理学家和民俗学者走访罗马尼亚各地的村庄。1932年至1933年，他担任公共教育、宗教与艺术部长。1936年，他和调查队在布加勒斯特创办露天乡村博物馆，请当地工匠把调查中选出的农舍和木教堂拆运到首都，按原貌重新搭建。1944年至1946年，他担任罗马尼亚科学院院长。1955年在布加勒斯特去世。"
 CBIO_HOI120_gyato_wangdu_desc:0 "甲多旺堆是20世纪中叶藏人武装组织四水六岗的成员。20世纪60年代，他在尼泊尔北部的木斯塘活动，后来成为当地这支武装的指挥官。1974年，尼泊尔政府要求驻扎木斯塘的武装人员缴械。甲多旺堆与尼方交涉，试图使缴械后的人员能留在当地生活。同年，他在向印度边境撤离途中被尼泊尔军队打死。"
 CBIO_HOI120_haraldur_gudhmundsson_desc:0 "哈拉迪尔·格维兹门松（1892—1971）早年教书，后任报社编辑和银行分行经理。1927年当选冰岛议员，1934年出任产业与交通部长。1938年离开内阁后，他执掌冰岛国家社会保险机构，战后曾任社会民主党主席，1957年出任驻挪威大使，后来兼任驻捷克斯洛伐克和波兰大使。"
 CBIO_HOI120_harutyunyan_desc:0 "格里戈尔·哈鲁秋尼扬，1900年生，是苏维埃亚美尼亚的党务官员。1937年，他在大清洗期间出任亚美尼亚共产党中央委员会第一书记，第二次世界大战期间仍担任该职。1945年，他向莫斯科争取准许海外亚美尼亚人迁入苏维埃亚美尼亚。同年11月，苏联政府批准了迁返计划。1953年斯大林去世后，他失去亚美尼亚党组织的领导职务。1957年去世。"
 CBIO_HOI120_hassan_desc:0 "哈桑·里达·塞努西，1928年生，是利比亚国王伊德里斯一世的侄子。1956年，伊德里斯以王室敕令指定他为利比亚联合王国王储。1969年，伊德里斯出国就医，哈桑留在国内摄政。9月，以卡扎菲为首的军官发动政变，废除君主制，哈桑的继承权随之终止。他后来获准前往英国就医，于1992年4月28日在伦敦去世。"
 CBIO_HOI120_helge_stromback_desc:0 "黑尔格·斯特伦巴克，1889年7月26日生于代尔斯博，1909年进入瑞典海军任少尉。两次世界大战之间，他在海军参谋部和国防参谋部任职，也曾在军事院校讲授军事课程。1939年升任海军上校。第二次世界大战期间，他自1942年起担任海军参谋长，参与领导瑞典的海上战备工作。1945年，他升任海军中将并接掌海军，任至1953年退休。1960年3月20日，他在斯德哥尔摩布罗马的家中去世。"
 CBIO_HOI120_herman_eriksson_desc:0 "赫尔曼·埃里克松，1892年生，瑞典社会民主党政治人物。1938年进入佩尔·阿尔宾·汉松政府，任不管部大臣。第二次世界大战爆发后，他接掌新设的国民经济部，负责战时供应事务。1941年至1944年任贸易大臣，主管战争时期的对外贸易。此后转入外交部门，1945年至1948年出任瑞典驻华盛顿使节，1949年去世。"
 CBIO_HOI120_hosseinpour_desc:0 "阿萨杜拉·侯赛因普尔是伊朗陆军军官，早年在波斯哥萨克部队服役，后来在伊朗陆军任职。1956年3月，德黑兰《消息报》刊登他的讣告，称他为退役陆军上校。"
 CBIO_HOI120_hussein_fawzi_desc:0 "候赛因·法齐是伊拉克王国陆军军官。1935年，辛贾尔的雅兹迪社群因抵制征兵与政府发生冲突，法齐指挥政府军前往镇压。20世纪30年代末，他出任陆军总参谋长。1940年初内阁改组时，他与第一师师长阿明·欧迈里主张由摄政决定组阁人选。努里·赛义德辞职后，支持努里的四名上校动员所部，法齐也集结兵力。对峙以四名上校占据上风告终。"
 CBIO_HOI120_ibrahim_kamal_al_ghandanfari_desc:0 "易卜拉欣·卡迈勒·加丹法里是伊拉克王国的政治人物。1937年，他担任财政部长，并与驻伊美国外交官讨论伊拉克椰枣出口和关税问题。1944年7月，他以伊拉克参议员身份参加布雷顿森林会议，并出现在伊拉克代表团签署会议最后文件的名单中。"
 CBIO_HOI120_idris_desc:0 "伊德里斯·塞努西是北非塞努西教团的领袖，曾任昔兰尼加埃米尔，长期在埃及流亡。第二次世界大战期间，他与英国合作，支持对意大利作战。意大利失去利比亚之后，联合国推动前意属利比亚各地区建立独立国家。1951年12月，伊德里斯以首任国王的身份宣布利比亚联合王国独立。1969年9月，在他身处国外时，以穆阿迈尔·卡扎菲为首的军官发动政变，废除君主制。伊德里斯此后流亡埃及。"
 CBIO_HOI120_inculet_desc:0 "扬·C·约努库列特（1884—1940）来自比萨拉比亚，在圣彼得堡大学学习数学和物理，毕业后在当地学校教授数学。1917年俄国革命期间，他回到基希讷乌，当选比萨拉比亚议会议长。次年，议会表决与罗马尼亚合并，他投了赞成票。此后他在布加勒斯特历届政府中主管过比萨拉比亚事务和卫生事务。1933年至1936年任内政部长，随后出任副首相。1940年，他在布加勒斯特去世。"
 CBIO_HOI120_iorga_desc:0 "尼古拉·约尔加（1871—1940）生于博托沙尼，长期在布加勒斯特大学教授历史。他整理出版罗马尼亚历史文献，也研究拜占庭帝国和东南欧各国。1910年，他与亚历山德鲁·C·库扎共同创建民族主义民主党，该党公开宣扬反犹主张。他支持卡罗尔二世复位，1931年至1932年担任首相兼教育部长，1938年成为国王顾问。铁卫团将其领袖科德里亚努的入狱归咎于约尔加。1940年11月，铁卫团成员将他劫走并杀害。"
 CBIO_HOI120_iosif_chisinevschi_desc:0 "约瑟夫·基希涅夫斯基原姓罗伊特曼，1905年生于伯尔兹。他年轻时参加共产主义青年运动，曾因政治活动入狱，后赴莫斯科的共产国际列宁学校学习。1930年代，他在罗马尼亚共产党布加勒斯特组织和中央宣传部门任职。1941年他再次被捕，直到1944年8月才获释。战后他进入罗马尼亚工人党政治局，分管宣传与文化，兼任部长会议副主席。1952年他支持清洗安娜·波克尔等人，1957年自己也失去政治局和中央书记处的职位。"
 CBIO_HOI120_iosif_iacobici_desc:0 "约瑟夫·雅科比奇（1884—1952）曾在维也纳高等军事学校就读，后在罗马尼亚陆军担任指挥职务。1941年1月，他出任扬·安东内斯库政府的战争部长，同年9月转任总参谋长，并指挥第四集团军。罗马尼亚军队占领敖德萨后，城内的罗军司令部在10月22日遭爆炸袭击。雅科比奇奉安东内斯库之命实施报复，当夜电告政府，军方已下令在广场上绞死犹太人及被指为共产党人的居民。战后他因战争罪被判刑，1952年死于艾乌德监狱。"
 CBIO_HOI120_iosif_ryzhikov_desc:0 "伊奥西夫·伊万诺维奇·雷日科夫（1893—1979）出生于莫吉廖夫省的拉采沃村，参加过第一次世界大战。1923年起，他在白俄罗斯从事经济管理和党务工作，战前曾主管林业和建筑材料工业。德国入侵苏联后，他参与组织白俄罗斯的游击队，曾任白俄罗斯游击运动总部副职。1942年，他作为中央游击运动总部代表，在斯大林格勒方向组织卡尔梅克地区的游击活动。1943年，他出任加里宁州游击运动总部负责人。"
 CBIO_HOI120_irandokht_qajar_desc:0 "伊朗多赫特·卡扎尔是伊朗卡扎尔王朝末代君主艾哈迈德沙阿与巴德尔·穆卢克的女儿。1925年，卡扎尔王朝失去王位，礼萨沙阿建立巴列维王朝。伊朗多赫特成年后与阿巴斯·法鲁基成婚，育有一子艾哈迈德。夫妇分开后，她带幼年儿子赴欧洲生活。艾哈迈德在欧洲长大，后来返回伊朗并从事电影创作。"
 CBIO_HOI120_irq_muhammad_ali_jawad_desc:0 "穆罕默德·阿里·贾瓦德是伊拉克王国早期空军军官，后来出任空军司令。1936年巴克尔·西德基发动政变时，贾瓦德指挥的空军参与其中。任内，伊拉克空军制订了扩充计划。1937年8月11日，他与西德基在摩苏尔遇刺身亡，空军的训练和扩编一度中断，其职务由阿克拉姆·穆什塔克接任。"
 CBIO_HOI120_isleifur_hognason_desc:0 "伊斯莱维尔·赫格纳松（1895—1967）曾在哥本哈根学习商业，回国后在韦斯特曼纳群岛主持合作社及工人合作社。他参与地方议会，并曾编辑《新日》等刊物。1937年进入冰岛议会，任至1942年，先后隶属共产党与统一人民党—社会党。1943年，他转任雷克雅未克及周边地区合作社的管理职务。"
 CBIO_HOI120_iuliu_hatieganu_desc:0 "尤柳·哈吉耶加努（1885—1959）是特兰西瓦尼亚的内科医生，1910年在克卢日取得医学博士学位。第一次世界大战期间，他主管当地军医院的内科病房。1919年，他受命筹办用罗马尼亚语授课的医学院，担任首任院长，并主持首堂罗马尼亚语医学课。1931年他曾短期出任负责特兰西瓦尼亚事务的部长。第二次世界大战期间，克卢日大学迁往锡比乌，他于1941年至1944年再任校长。战后他继续从事内科临床工作，直到1959年去世。"
 CBIO_HOI120_ivan_pstygo_desc:0 "伊万·伊万诺维奇·普斯特戈（1918—2009）出生于乌法省，1940年从军用飞行学校毕业。德国入侵苏联时，他在西南方向的部队服役，后来驾驶伊尔-2攻击机，指挥过航空中队和强击航空兵团。他在战争最后阶段参加了柏林方向的作战。战后，普斯特戈继续在空军任职，曾主管作战训练，1975年获航空兵元帅军衔，后来领导苏联武装力量的飞行安全监察工作。"
 CBIO_HOI120_ivan_yakubovsky_desc:0 "伊万·伊格纳季耶维奇·雅库鲍夫斯基（1912—1976）出生于今白俄罗斯莫吉廖夫州戈尔基地区，早年在农家劳动，1932年入伍，后来转入装甲兵。第二次世界大战期间，他曾率第91坦克旅参加进攻基辅等战役，后任坦克军副军长。战后，他曾任驻德苏军总司令。1967年，他获授苏联元帅军衔，并于同年出任华沙条约组织联合武装力量总司令，任职至1976年去世。"
 CBIO_HOI120_jaime_desc:0 "海梅·德·波旁（1908—1975）是西班牙国王阿方索十三世和维多利亚·欧亨尼娅王后的次子，幼年因病接受手术后失聪。西班牙王室流亡后，他于1933年应父亲要求放弃西班牙王位继承权，后来获得塞戈维亚公爵头衔。父亲在1941年去世后，他成为波旁家族男系的长支代表，获得法国正统派王党人士拥戴。他后来对自己当年放弃西班牙王位继承权的决定提出异议，1969年接受侄子胡安·卡洛斯成为西班牙未来的国王。1975年，海梅在瑞士圣加仑去世。"
 CBIO_HOI120_jakob_moller_desc:0 "雅各布·默勒早年在冰岛国家银行任职，后在雷克雅未克从事报业，并多次当选冰岛议员。他曾监管银行及储蓄机构，1937年参与主持新成立的雷克雅未克医疗保险机构。1939年进入内阁掌管财政，1942年一度兼管司法和社会事务。1945年起任驻丹麦大使，后来兼任驻芬兰大使。"
 CBIO_HOI120_james_mitchell_baker_desc:0 "詹姆斯·米切尔-贝克（1878—1956）生于苏格兰斯特灵。1899年入伍后，他参加南非战争，随后转入德兰士瓦军务系统。1908年，他代表南非参加伦敦奥运会马拉松。第一次世界大战期间，他先后在西南非洲、埃及和法国服役。1933年退役，第二次世界大战爆发后重新任职。1942年南非议会记录他以准将军衔担任军需总监；1947年晋升中将，次年退役。"
 CBIO_HOI120_jamil_al_rawi_desc:0 "贾米尔·艾哈迈德·阿卜杜拉·拉维是伊拉克军官和外交官，早年在奥斯曼军队服役，第一次世界大战期间加入汉志的阿拉伯起义，后成为汉志国王阿里的侍从武官。回到伊拉克后，他于1928年当选众议员，1930年出任交通及公共工程部长，次年担任国防部长，参与伊拉克皇家空军的创建。此后他在基尔库克和库特担任地方行政长官。第二次世界大战期间，他先后任驻吉达代办、驻耶路撒冷总领事和驻吉达公使，战后回国主管公共工程事务。"
 CBIO_HOI120_janjua_desc:0 "伊夫蒂哈尔·汗·詹朱阿是巴基斯坦陆军少将。1971年印巴战争期间，他指挥第二十三步兵师，在查姆布一带与印度军队作战。查姆布被巴方部队占领后，他乘直升机前往会见部属。直升机在降落时起火坠毁，他伤重身亡。后来，巴方把查姆布称为伊夫蒂哈尔阿巴德，以纪念他在战时的指挥经历。"
 CBIO_HOI120_javier_desc:0 "哈维尔·德·波旁-帕尔马（1889—1977）出身帕尔马公爵家族。1936年西班牙内战爆发前夕，他与莫拉、桑胡尔霍等将领接洽，同意卡洛斯派民兵参加反共和国的军事起事。同年，卡洛斯派的王位候选人阿方索·卡洛斯去世，由哈维尔担任这一运动的摄政。第二次世界大战期间，他遭德国当局逮捕，曾被囚于达豪集中营。战后，卡洛斯派内部对是否应与佛朗哥政权合作意见不一。1952年，哈维尔在巴塞罗那公开提出自己的王位主张，此后仍以王位候选人的身份领导这一运动。"
 CBIO_HOI120_jerzy_rutkowski_desc:0 "耶日·鲁特科夫斯基（1914—1989）生于基辅，曾在华沙大学学习法律。战前他参与波兰民族激进派活动，领导与长枪派合作的青年波兰联盟，并编辑其机关刊物。1939年德军入侵波兰时，他以排长身份参战，被俘后逃往华沙。1940年，他开始组织地下印刷，后来领导波兰家乡军的秘密军事出版机构。1944年华沙起义期间，他继续主持地下出版。起义失败后被关入战俘营，1945年秋返回波兰，先在波兰红十字会工作，后管理工商企业。"
 CBIO_HOI120_jesus_garza_siller_desc:0 "赫苏斯·加尔萨·西列尔（1882—1958）生于墨西哥蒙特雷，早年受过师范和法律教育。1913年，他加入墨西哥革命中的立宪派部队，成为卢西奥·布兰科的参谋长。1916年，卡兰萨任命他主管学校军事教育。此后他曾任海军监察职务，并于1937至1945年在墨西哥军事学院任教，翻译过多部法语军事著作。他官至师级将军，1958年在墨西哥城去世。"
 CBIO_HOI120_johann_saemundsson_desc:0 "约翰·塞门松（1905—1955）出生于斯奈山半岛，毕业于冰岛大学医学系，后在瑞典和丹麦进修。他于1937年出任社会保险机构的首席医师，参与制定1946年社会保险法中的医疗条款。1942年12月至1943年4月，他担任冰岛社会事务部长。1948年，他开始在冰岛大学教授内科学，并任冰岛国家医院内科主任。"
 CBIO_HOI120_jonas_savimbi_desc:0 "若纳斯·萨文比1934年生于葡属安哥拉的穆尼扬戈，父亲洛特是铁路雇员，也在新教教会传道。萨文比青年时曾赴葡萄牙和瑞士求学，1966年参与创建争取安哥拉彻底独立全国联盟，并当选主席。1975年1月，他作为该组织领导人参加同葡萄牙政府及另外两支安哥拉独立运动的谈判，签署《阿尔沃协定》。独立前后，安哥拉各武装派别爆发内战。1992年大选后战事再起。2002年2月22日，萨文比在莫希科省与政府军交战时身亡。"
 CBIO_HOI120_jose_maria_gutierrez_lea_plaza_desc:0 "何塞·玛丽亚·古铁雷斯·莱亚·普拉萨是玻利维亚律师、外交官和政府官员，早年曾在驻秘鲁、智利使团任职。查科战争末期与战后，特哈达·索尔萨诺政府任用他主管公共教育和农业，1935年9月的任命令记录了这项职务。在教育部长任内，他参加最高体育教育委员会的工作，协助推动玻利维亚奥委会取得正式承认。他也曾代理外交事务。"
 CBIO_HOI120_jose_pezet_desc:0 "何塞·佩泽特·阿罗塞梅纳是巴拿马政治人物，主持了制定1941年宪法的议会。1941年10月，阿努尔福·阿里亚斯离境后，巴拿马最高法院认定总统职位空缺。作为当时的第一顺位代理人，佩泽特未到任。法院转而召第二顺位代理人埃内斯托·哈恩·瓜迪亚就职，后者当天辞职，最终由里卡多·阿道弗·德拉瓜迪亚接掌政府。"
 CBIO_HOI120_josef_depre_desc:0 "约瑟夫·德普尔出身于多瑙施瓦本人家庭，曾是南斯拉夫王国军骑兵军官。据家人回忆，他在战乱中曾被铁托领导的游击队拘押，后来经奥地利移居美国。他在伊利诺伊州奥克劳恩定居，于2016年5月31日去世，享年96岁。"
 CBIO_HOI120_joseph_cowie_nichols_desc:0 "约瑟夫·考伊·尼科尔斯（1859—1954）生于塔斯马尼亚，幼年随家人移居新西兰奥塔哥。他曾在英国和新西兰军队服役，长期指挥奥塔哥骑马步枪部队。1903年，新西兰政府公报刊载了他由少校晋升中校的任命。第一次世界大战期间，他负责奥塔哥军区。他也是北奥塔哥库里赫卡庄园的业主，与妻子出资兴建当地的圣安德鲁教堂。"
 CBIO_HOI120_jovanovic_desc:0 "日沃拉德·约万诺维奇，1914年生于塞尔维亚瓦列沃，常用名日基察。1937年，他前往西班牙，加入志愿支持共和国的国际纵队，曾任迪米特洛夫营一支连队的政治委员。西班牙共和国战败后，他在法国被拘禁，后来返回南斯拉夫。德国占领塞尔维亚后，他参加共产党领导的游击抵抗。1941年7月，他参与贝拉茨尔克瓦村发生的武装事件。1942年3月13日，他在拉达诺夫齐村与切特尼克部队交战时身亡。"
 CBIO_HOI120_julian_montellano_desc:0 "胡利安·蒙特利亚诺·卡拉斯科（1900—1989）是玻利维亚律师和政治人物，曾任议员及国民会议主席。1944年9月，他以国民会议主席身份短期代理总统职务。1945年11月，国民会议宣布由他担任副总统，他于同月6日宣誓就职，在瓜尔韦托·比利亚罗埃尔政府任内担任该职。任职期间，他仍参与法律讨论，1946年就玻利维亚民法典草案在教育部礼堂发表演讲。"
 CBIO_HOI120_kajaznuni_desc:0 "霍夫汉内斯·卡贾兹努尼，1868年生，是亚美尼亚建筑师和政治家。1918年，外高加索联邦瓦解后，他参与同奥斯曼帝国的谈判，随后出任亚美尼亚第一共和国首任总理。辞去总理职务后，他曾赴国外，后来返回苏维埃亚美尼亚，从事建筑和教学。1937年，他在斯大林时期的大清洗中被捕。他于1938年去世，1955年获平反。"
 CBIO_HOI120_kanayan_desc:0 "德拉斯塔马特·卡纳扬通称德罗，生于俄罗斯帝国伊格德尔，是亚美尼亚革命联盟成员和军事指挥官。第一次世界大战期间，他在俄军高加索战线的亚美尼亚志愿部队任职。1918年，他在巴什阿帕兰指挥亚美尼亚部队抵抗奥斯曼军队，后来在亚美尼亚第一共和国担任军事部长。共和国覆亡后，他流亡海外。第二次世界大战期间，他与纳粹德国合作，参与在德军体系下组织亚美尼亚军团。1956年3月，他在美国波士顿去世。"
 CBIO_HOI120_kawananakoa_desc:0 "戴维·卡拉卡瓦·卡瓦纳纳科阿，1904年生于檀香山，是夏威夷卡瓦纳纳科阿家族成员，也被称为科克。父亲是戴维·卡瓦纳纳科阿亲王，母亲是阿比盖尔·坎贝尔·卡瓦纳纳科阿。他出生时，夏威夷已成为美国领地。一份1920年代刊印的夏威夷人物册保存了他的肖像。1953年，他在檀香山去世，安葬于夏威夷王家陵园的卡拉卡瓦墓室。"
 CBIO_HOI120_khama_desc:0 "切克迪·卡马，1905年生于贝专纳保护国塞罗韦，是恩瓜托人的首领卡马三世之子。1926年，他开始为尚未成年的侄子塞雷茨·卡马摄政。在英国保护国制度下，他争取维持当地政治权力，并反对把保护国并入南非。1948年，塞雷茨与英国女子露丝·威廉斯成婚，继承与婚姻争议使切克迪与侄子的关系一度破裂，也引来英国当局干预。此后双方逐渐和解。切克迪于1959年去世。"
 CBIO_HOI120_kiran_rana_desc:0 "基兰·沙姆谢尔·拉纳是尼泊尔陆军军官和外交官。第二次世界大战期间，他以少将军衔担任尼泊尔驻英属印度东部司令部的联络官。1945年，英国授予他大英帝国勋章军事类荣誉爵级司令勋衔。战后，他出任尼泊尔陆军总司令，后来转任外交职务。1975年，他在担任驻英国大使期间兼任驻芬兰大使，成为尼泊尔与芬兰建交后的首任尼泊尔驻芬兰大使。"
 CBIO_HOI120_knud_desc:0 "克努特（1900—1976）是丹麦国王克里斯蒂安十世的次子。他与兄长弗雷德里克一同在海军军官学校受训，服役期间曾随渔业巡逻舰到过冰岛、格陵兰和法罗群岛。德国占领丹麦期间，他于1941年至1943年指挥哥本哈根以南的孔格隆堡，丹麦解放后又回到该堡任职。1947年兄长即位为弗雷德里克九世，克努特成为王位第一顺位继承人。1953年，丹麦经公民投票修改继承法，国王的长女玛格丽特取得优先继承权。克努特继续在海军任职，1965年获授海军上将军衔。"
 CBIO_HOI120_koenig_desc:0 "马里-皮埃尔·柯尼希（1898—1970）是法国陆军将领，生于卡昂。1940年6月，他随一批外籍军团军官渡海赴英，加入自由法国。1942年，他指挥自由法国第一旅在利比亚的比尔哈凯姆坚守约两周，牵制了隆美尔指挥的德意军队。6月10日至11日夜间，柯尼希率部穿过雷区和敌军阵地，带出了大部分守军。1944年，他奉命统率法国内地军，负责协调抵抗力量与盟军的行动。战后，他曾任国防部长，1984年被追授法国元帅。"
 CBIO_HOI120_kork_desc:0 "奥古斯特·科尔克，1887年生于今爱沙尼亚塔尔图一带，受训于俄罗斯帝国的军校和军事学院，第一次世界大战期间升至中校。1918年加入红军，俄国内战期间指挥第六集团军参与克里米亚战役。此后先后指挥多个军区，1929年至1935年任莫斯科军区司令，1935年出任伏龙芝军事学院院长。1937年大清洗期间，他与多名苏联高级军官同案被判死刑，6月12日被枪决。1957年获平反。"
 CBIO_HOI120_kuhn_desc:0 "弗里茨·库恩，1896年生于德国，第一次世界大战中曾在德军服役。1928年移居美国，1934年取得美国国籍。他在20世纪30年代领导亲纳粹的德裔美国人联盟，组织集会，散布反犹宣传。1939年，联盟在纽约麦迪逊广场花园举行大型集会。同年，库恩因盗窃和伪造财务记录被定罪。1943年，他在服刑期间被撤销美国国籍。1945年被遣送德国，1951年去世。"
 CBIO_HOI120_la_rocque_desc:0 "弗朗索瓦·德·拉罗克（1885—1946）是法国军官，退役后领导退伍军人组织火十字团。他以民族主义和反对马克思主义号召支持者。1936年，法国政府解散火十字团等团体，拉罗克转而创建法国社会党，把原有运动组织为政党。德军占领法国期间，他领导“克兰”情报网，向英国方面提供情报。1943年他被德国当局逮捕，随后遭到拘禁，1945年，他获美军解救，回国后又被法国当局拘禁，次年在巴黎去世。"
 CBIO_HOI120_latsis_desc:0 "马丁·拉齐斯本名亚尼斯·苏德拉布斯，1888年生于俄罗斯帝国利沃尼亚省，是拉脱维亚裔布尔什维克。1917年，他参加彼得格勒的赤卫队组织工作。俄国内战期间，他在全俄肃反委员会任职，曾主持红军第五集团军军事法庭，1919年又任乌克兰肃反委员会负责人。他参与推动并实施红色恐怖。1937年大清洗期间被捕，次年在莫斯科被处决。"
 CBIO_HOI120_lazar_edeleanu_desc:0 "拉扎尔·埃德莱亚努（1861—1941）生于布加勒斯特，1887年在柏林取得化学博士学位。回国后，他在布加勒斯特大学从事有机化学研究，并先后主持矿务部门和地质研究所的实验室。罗马尼亚石油业兴起之际，他出任普洛耶什蒂维加炼油厂厂长。1908年，他在厂内采用液态二氧化硫分离石油馏分中的芳香烃。这种炼制方法后来以他的姓氏命名，并在其他国家的炼油工业中得到应用。"
 CBIO_HOI120_lucien_lacaze_desc:0 "吕西安·拉卡兹（1860—1955）出生于法国瓦兹省皮埃尔丰，童年在留尼汪岛度过，1879年进入法国海军学校。第一次世界大战期间，他曾指挥地中海舰队的一个分队，并参与组织向东方战线运送远征军。1915年10月，他出任海军部长，1917年离任后任土伦海区长官。他后来还担任海军委员会副主席，1922年以海军将官身份退役。1936年，他当选法兰西学院院士，1955年3月23日去世。"
 CBIO_HOI120_luis_fernandez_rodriguez_desc:0 "路易斯·费尔南德斯·罗德里格斯是哥斯达黎加律师、法官和外交官，1889年生。1913年，他取得法学学位，执业后出任法官。1922年起，他在最高法院任职。1936年，他进入莱昂·科尔特斯内阁担任内政部长，任内曾代理外交事务，并主持完成哥斯达黎加与美国商约的文本。1940年，他出任驻美国公使，并代表哥斯达黎加参加泛美联盟理事会。"
 CBIO_HOI120_magnus_jonsson_desc:0 "马格努斯·荣松（1887—1958）出生于冰岛西部，曾在美国北达科他州和冰岛西峡湾担任牧师，回国后在冰岛大学任教。1942年，他出任产业与贸易部长并于当年离任。战后，他曾任冰岛国家银行理事会主席，并在1947年至1953年主持财政委员会。"
 CBIO_HOI120_majkowski_desc:0 "亚历山大·马伊科夫斯基，1876年生于科希切日纳，是波兰卡舒比地区的医生、作家和编辑。完成医学教育后，他回到波美拉尼亚行医，并创办以卡舒比语言文化为主题的《狮鹫》杂志。1912年，他参与创立青年卡舒比人协会，并担任主席。此后，他继续参与卡舒比的文化活动和写作。1938年去世，其卡舒比语长篇小说《雷穆斯的生平与冒险》同年出版。"
 CBIO_HOI120_maksim_antonyuk_desc:0 "马克西姆·安东诺维奇·安东纽克（1895—1961）出生于格罗德诺省马齐村，第一次世界大战期间在俄军服役，随后加入红军并参加内战。20世纪20年代，他曾指挥第4突厥斯坦步兵师，后来在伏龙芝军事学院教授战术。1940年晋升中将，德苏战争爆发前任红军步兵副总监。1941年，他曾在列宁格勒方向指挥第48集团军，后来从事军事院校及部队训练工作，并任第二波罗的海方面军司令助理。"
 CBIO_HOI120_manuel_arroyo_arevalo_desc:0 "曼努埃尔·阿罗约·阿雷瓦洛是危地马拉政治人物和外交官。1920年，他在埃斯特拉达·卡夫雷拉政权末期担任公共教育部长。卡洛斯·埃雷拉执政初期，他支持创建危地马拉美术学院，这所学院后来发展为国立造型艺术学校。1930年代初，阿罗约出任危地马拉驻墨西哥使节，曾就入境审查同本国外交部和领事系统联络。"
 CBIO_HOI120_manuel_t_aponte_desc:0 "曼努埃尔·T·阿蓬特是巴拉圭海军军官。1925年，他赴阿根廷进修，先后就读于海军领航学校和海军军官学校。查科战争前，他在亚松森出任海军负责人。1932年巴拉圭动员时，他指挥海军承担向卡萨多港一带运送部队和物资的任务。1936年2月，他在军方宣布解除欧塞维奥·阿亚拉总统职务的公告上署名。"
 CBIO_HOI120_marchal_desc:0 "莫尔旺·马尔沙尔本名莫里斯·马尔沙尔，1900年生于维特雷，是法国布列塔尼的建筑师和地方运动活动者。他在雷恩学习建筑，青年时代参与布列塔尼地方主义团体，并于1923年设计后来广为使用的黑白布列塔尼旗。1927年，他参与创建布列塔尼自治党。自治党分裂后，他转向联邦主义，参与组织布列塔尼联邦主义联盟。他先后在雷恩和拉瓦勒从事建筑工作。德军占领法国期间，他曾与德国占领当局合作。法国解放后，雷恩的民事法庭判处他十五年褫夺公民权。1963年在巴黎去世。"
 CBIO_HOI120_marius_viple_desc:0 "马里于斯·维普勒出生于法国多姆山省沙普德博福尔的面包师家庭，早年从事新闻工作，在让·饶勒斯主持的《人道报》任职。第一次世界大战期间，他先后在朱尔·盖得、阿尔贝·托马和亚历山大·里博的办公室工作。战后，他随托马到日内瓦的国际劳工局任职，后来出任该局副总干事。他长期参加多姆山省的社会党活动，1947年当选共和国委员会委员，代表居住在欧洲和非洲的法国公民，次年再次当选并代表海外法国公民。1949年10月31日，他因病去世。"
 CBIO_HOI120_martin_karp_desc:0 "马丁·卡普是卢森堡的商业教育工作者。1918年的地方资料已经记载他在卢森堡任教。到1930年代，他教授商业学，并担任商业与工业职员协会会计课程的督导。1937年，他与企业和行业人士一道列入政府部门任命的考试评审委员会，评定会计课程学员的结业成绩。"
 CBIO_HOI120_maud_desc:0 "莫德·夏洛特·玛丽·维多利亚，1869年11月26日生于伦敦，是英国国王爱德华七世与亚历山德拉王后的女儿、维多利亚女王的孙女。1896年，她与丹麦王子卡尔结婚。1905年挪威与瑞典结束联合后，卡尔经挪威议会选为国王，称哈康七世，莫德随之成为挪威王后。两人的独子亚历山大获名奥拉夫，后来继承挪威王位。1914年，莫德推动设立救济基金，帮助受第一次世界大战影响的民众。1938年11月20日，她在伦敦去世，安葬于奥斯陆阿克什胡斯城堡的王室陵寝。"
 CBIO_HOI120_max_auschnitt_desc:0 "马克斯·奥斯尼特生于多瑙河港口加拉茨的犹太实业家家庭，在维也纳学习商业后进入罗马尼亚冶金业。1929年，他进入雷希察钢铁公司的管理层，也曾当选参议员。公司承接国家订单，使他与卡罗尔二世的宫廷往来密切。1939年失去国王支持后，他遭逮捕并被判入狱。1942年他获准离开监狱，在原先经营的企业劳动，1944年案件重审后获判无罪。此后他移居美国，1957年去世。"
 CBIO_HOI120_medrano_desc:0 "爱德华多·梅德拉诺·里瓦斯，1897年生于马德里，曾在塞哥维亚炮兵学院受训，也是工程师。第二共和国时期，他参加工团主义党。西班牙内战爆发后，他率由炮兵和民兵组成的纵队赴阿拉贡，在韦斯卡一带作战，后来指挥共和国军第三十三师。战后他被关押在巴塞罗那，经军事法庭判处死刑，于1941年2月13日被枪决。"
 CBIO_HOI120_mendes_reis_desc:0 "若泽·门德斯·多斯雷斯是葡萄牙陆军步兵上校。葡萄牙第一共和国时期，他担任过参议员。1920年1月，他一度获陆军部长任命，该届内阁在获任命当日解散。1926年军事政变后，他参加反对军事独裁的活动。1927年2月7日，里斯本发生反政府起事，他是领导者之一。起事失败后，他被特别军事法庭定罪并遭放逐。"
 CBIO_HOI120_mera_desc:0 "西普里亚诺·梅拉·桑斯，1897年生于马德里，是建筑工人和全国劳工联盟的工会活动家。西班牙内战期间，他先指挥民兵参加马德里防御，后任共和国军第十四师师长，在瓜达拉哈拉战役中作战，之后升任第四军军长。1939年3月，他支持塞吉斯蒙多·卡萨多推翻内格林政府。共和国战败后，他流亡北非，后被送回西班牙受审，获释后转居法国，1975年在那里去世。"
 CBIO_HOI120_mex_hector_meixueiro_desc:0 "赫克托·麦克薛罗·亚历山德雷斯1900年出生于墨西哥瓦哈卡州。他青年时加入海军，曾指挥多艘舰艇，1938年在海军参谋机关任职。1940年，他出任国防部门联络官，1941年任海军代理主管，1942年出任海军参谋长。战后他历任海军学校负责人和海军参谋长，1958年短期担任海军部长。"
 CBIO_HOI120_mihai_antonescu_desc:0 "米海伊·安东内斯库（1904—1946）是罗马尼亚律师，曾教授法律。1940年扬·安东内斯库掌权后，他出任司法部长，随后担任副首相兼外交部长。1941年罗马尼亚对苏作战之初，他在内阁会议上主张将犹太人逐出比萨拉比亚和布科维纳，参与制定将犹太居民驱逐到德涅斯特河以东的政策。1944年8月，米哈伊国王在布加勒斯特发动政变，米海伊与元帅一道被捕。战后，布加勒斯特人民法庭判处他死刑。1946年6月1日，他与扬·安东内斯库等人在日拉瓦被处决。"
 CBIO_HOI120_mihail_manoilescu_desc:0 "米哈伊尔·马诺莱斯库（1891—1950）生于泰库奇，原是工程师，后来任罗马尼亚工业与商业部长及国家银行行长。1929年，他用法文出版关于国际贸易的著作，主张以关税保护本国工业。1930年代，他又提倡按行业组织国家的法团主义。1940年8月，他以外交部长身份代表罗马尼亚签署第二次维也纳仲裁文件。在德国和意大利施压下，罗马尼亚将特兰西瓦尼亚北部割让给匈牙利。1948年他被捕，1950年死于锡盖特监狱。"
 CBIO_HOI120_mihail_moruzov_desc:0 "米哈伊尔·莫鲁佐夫（1887—1940）生于图尔恰地区的俄裔旧礼仪派家庭，父亲是神父，他从小就会俄语和保加利亚语。第一次世界大战期间，他在多瑙河三角洲组建了一支为罗马尼亚大本营工作的情报机构。战间期，他为总参谋部组建由文职人员参与的秘密情报部门。到了卡罗尔二世统治后期，该部门在实际运作中更加听命于王宫。1940年9月，国王退位前后他被撤职并遭逮捕。11月26日至27日夜间，铁卫团成员在日拉瓦监狱将他枪杀。"
 CBIO_HOI120_mihail_ralea_desc:0 "米哈伊尔·拉莱亚（1896—1964）生于胡希，在雅西学习法律与文学，1923年以研究社会主义学说中革命观念的论文在巴黎获得博士学位。回国后，他教授社会学和心理学，主持《罗马尼亚生活》杂志，并参加国家农民党。卡罗尔二世在位后期，他担任劳工部长。第二次世界大战结束后，他出任艺术部长，参加巴黎和会的罗马尼亚代表团，又于1946年至1948年任驻华盛顿公使。晚年他继续研究社会心理，也曾代表罗马尼亚参与联合国教科文组织的工作。"
 CBIO_HOI120_mihalache_desc:0 "扬·米哈拉凯（1882—1963）生于罗马尼亚农家，曾任乡村教师，在第一次世界大战中服役。1918年，他和一批教师、农民及教士在布加勒斯特创立农民党。1926年，该党与尤柳·马纽领导的罗马尼亚民族党合并为国家农民党。米哈拉凯历任农业部长、内政部长，1933年至1937年担任党主席。1947年，他准备赴西方争取对反对派的支持，在特默德乌机场与数名同僚一道被捕。同年被判终身监禁。1963年，他死于勒姆尼库瑟拉特监狱。"
 CBIO_HOI120_miron_cristea_desc:0 "米隆·克里斯蒂亚（1868—1939）出生于特兰西瓦尼亚，曾在锡比乌学习神学。1918年，他以主教身份参加阿尔巴尤利亚国民大会，并随代表团向费迪南一世呈递与罗马尼亚合并的决议。1925年，他成为罗马尼亚东正教会首任宗主教，后来在米哈伊一世年幼时出任摄政。1938年，卡罗尔二世建立国王独裁，由克里斯蒂亚出任首相。他公开发表反犹言论，其政府继续实施前任政府针对犹太人公民资格的审查。1939年，他在首相任内去世。"
 CBIO_HOI120_mohammed_v_desc:0 "穆罕默德五世原名穆罕默德·本·优素福，1927年继位为摩洛哥苏丹。当时摩洛哥大部分领土受法国保护国当局统治。他与民族主义运动逐步合作，推动结束保护国制度。1953年，法国当局废黜他，将其先后流放至科西嘉和马达加斯加。1955年他返回摩洛哥，恢复苏丹地位。1956年法国承认摩洛哥独立，翌年他改用国王称号。1961年去世，其子哈桑二世继位。"
 CBIO_HOI120_mordrel_desc:0 "奥利耶·莫德雷尔，1901年生，是法国布列塔尼民族主义活动者和建筑师。1927年，他参与创建布列塔尼自治党，1931年又参与组建布列塔尼民族党。他在刊物上宣扬激进民族主义及种族主义主张。第二次世界大战期间，他寻求纳粹德国支持布列塔尼分离运动，1940年参与组织布列塔尼民族委员会，并曾掌握布列塔尼民族党的领导权。同年12月，他离开布列塔尼前往德国，党内领导地位也告结束。1985年去世。"
 CBIO_HOI120_muhammad_nawruz_desc:0 "穆罕默德·诺罗兹是阿富汗官员，出身洛加尔的卡兰加尔。早年在王室担任文书，后来参与创立喀布尔文学协会并担任首任秘书。1942年，他出任内政部长，1940年代中期转任财政部长。他也曾担任阿富汗驻苏联大使，1957年任国民议会副议长。"
 CBIO_HOI120_muhibuddin_desc:0 "穆罕默德·塔希尔·穆希卜丁于1936年登上戈瓦王位，成为苏拉威西南部戈瓦王国的第35任统治者，也以卡拉恩·邦托农波的称号为人所知。就任之年，他在松古米纳萨修建巴拉隆波阿宫，作为王室居所和行政中心。他任内还在戈瓦推动创办伊斯兰学校。1946年，他去世，王位由其子穆罕默德·阿卜杜勒·卡迪尔·艾迪丁继承。巴拉隆波阿宫后来改为博物馆，保存戈瓦王室文物及历代统治者的图像。"
 CBIO_HOI120_nadaw_abba_wallo_desc:0 "纳达乌·阿巴·沃洛是埃塞俄比亚官员，出身绍阿，曾任西部伊卢巴博尔省总督。1919年，他奉扎乌迪图女皇和摄政塔法里之命，率代表团出访英国和美国。1923年9月28日，他在日内瓦代表埃塞俄比亚出席国际联盟大会，并在本国获准加入后发言。次年，他随摄政塔法里出访欧洲。纳达乌获封拉斯，1929年去世。"
 CBIO_HOI120_nae_ionescu_desc:0 "内伊·约内斯库（1890—1940）出生于布勒伊拉，曾在德国研习数学基础与逻辑。第一次世界大战后，他回到布加勒斯特大学任教，一面讲授逻辑与认识论，一面主持《言论报》，对两次大战之间的一代罗马尼亚作家产生影响。1930年代，他转而支持极右翼的铁卫团。1934年，犹太裔作家米哈伊尔·塞巴斯蒂安请这位老师为小说《两千年来》作序，约内斯库却在序中宣扬反犹观点。塞巴斯蒂安将序言随书刊出，引发公开争论。"
 CBIO_HOI120_nagumo_common_revision_desc:0 "南云忠一（1887—1944）生于日本山形，毕业于海军兵学校，早年主要在水雷部队任职。1939年晋升海军中将，1941年4月出任第一航空舰队司令长官，同年12月指挥机动部队袭击珍珠港。1942年6月4日的中途岛海战中，赤城、加贺和苍龙号航空母舰在上午遭重创。飞龙号在下午遭重创，次日沉没。此后，南云历任第三舰队和第一舰队司令长官。1944年3月，他出任中部太平洋方面舰队司令长官，兼第十四航空舰队司令长官。6月美军登陆塞班岛，南云于同年7月在岛上自尽。"
 CBIO_HOI120_napoleon_desc:0 "路易·拿破仑（1914—1997）生于布鲁塞尔，是拿破仑一世的弟弟、威斯特伐利亚国王热罗姆的曾孙。法国的流放法限制曾经统治法国的王朝继承人在本国服役。第二次世界大战期间，他以路易·布朗沙尔的名字加入法国外籍军团，后来又以路易·莫尼耶的化名参加抵抗运动。1942年，他在越过西班牙边境时被捕。1944年8月，他在与德军交战时身负重伤。法国解放后，戴高乐特许他继续在法国军队服役。他是波拿巴家族的代表，终生未曾称帝。"
 CBIO_HOI120_nichifor_crainic_desc:0 "尼基福·克莱尼克（1889—1972）原名扬·多布雷，生于布尔布卡塔。他学习神学与哲学，在基希讷乌和布加勒斯特任教，并长期主持文学杂志《思想》。他把罗马尼亚民族认同与东正教信仰相联系，在文章和讲坛上公开宣扬反犹主义。他曾当选议员，1940年进入政府主管宣传，1941年又在扬·安东内斯库政府担任宣传部长。战后他于1947年被捕，在艾乌德监狱服刑，1962年获释。"
 CBIO_HOI120_nicodim_munteanu_desc:0 "尼科迪姆·蒙泰亚努（1864—1948）受洗时名为尼古拉，在雅西和基辅学习神学，入修道院时取名尼科迪姆。他曾任胡希主教，后主持尼亚姆茨修道院，又于1935年当选摩尔达维亚都主教。在任期间，他恢复修道院的印刷设施，推动神学著作出版，也亲自参与《圣经》的罗马尼亚语翻译。1939年米隆·克里斯蒂亚去世后，他当选罗马尼亚东正教会第二任宗主教。1948年，他死于任内，安葬在布加勒斯特宗主教座堂。"
 CBIO_HOI120_nicolae_ceausescu_desc:0 "尼古拉·齐奥塞斯库（1918—1989）生于斯科尔尼切什蒂，年轻时参加地下共产主义运动，二战期间先后被关押在卡兰塞贝什和特尔古日乌，1944年8月获释。战后他进入党和军队领导层，1965年接掌罗马尼亚共产党。1971年，他出访中国和朝鲜等国，回国后要求加强党对文化和教育的控制。1974年他出任共和国总统。到1980年代，政府以配给限制基本食品供应，秘密警察持续监控和打压异议者。1989年12月革命爆发，他与妻子埃列娜逃离首都，在特尔戈维什泰附近被捕，经特别军事法庭仓促审判后于12月25日被处决。"
 CBIO_HOI120_nicolae_ciuperca_desc:0 "尼古拉·丘佩尔克（1882—1950）出生于勒姆尼库瑟拉特，是罗马尼亚陆军参谋军官。第一次世界大战期间，他参与筹划1917年夏季的战事。战间期，他历任步兵师长、军长和战争部长。1941年夏，他率第四集团军参与进攻苏联，并在8月指挥敖德萨围城战。部队伤亡持续增加，他向大本营报告前线士兵已经疲惫不堪。他与上级在如何继续作战上发生分歧，9月被撤换。战后他被捕，1950年在布加勒斯特沃克雷什蒂监狱医院去世。"
 CBIO_HOI120_nikola_markov_totev_desc:0 "尼古拉·马尔科夫·托特夫（1888—1974）生于大特尔诺沃，父亲马尔科·托特夫是当地律师。他在保加利亚陆军服役，曾指挥第四步兵师，后来出任步兵总监，军衔为陆军中将。1941年，他转入预备役。"
 CBIO_HOI120_nikola_steinfl_desc:0 "尼古拉·斯坦福（1889—1945）是南斯拉夫王国和克罗地亚独立国的海军军官。1929年的捷克斯洛伐克授勋档案记录他当时已是南斯拉夫海军中校。第二次世界大战期间，他在克罗地亚独立国军队服役，后获海军中将军衔。1944年8月，他接替安特·沃基奇负责武装力量事务。克罗地亚独立国在1945年瓦解后，斯坦福在南斯拉夫受审并被判处死刑。"
 CBIO_HOI120_nzl_h_d_mcgregor_desc:0 "赫克托·道格拉斯·麦格雷戈1910年生于新西兰怀罗瓦，1928年前往英国加入皇家空军。1938年，他在埃及接掌第33中队。1940年他回到英国，曾在敦刻尔克上空被击落，脱险后率第213中队参加不列颠空战。此后他在地中海战区担任空军参谋，参与意大利停战后的空军接收事务。1964年以空军中将军衔退役。"
 CBIO_HOI120_odena_desc:0 "莉娜·奥德纳本名保利娜·奥德纳·加西亚，1911年生于巴塞罗那，是西班牙共产主义青年活动家。她参加了1934年10月的起义。人民阵线竞选期间，她曾随多洛雷斯·伊巴露丽参加集会。西班牙内战开始时，她在安达卢西亚参加共和国一方的民兵活动，并为《工人世界报》报道战事。1936年9月14日，她在格拉纳达附近遭遇敌方检查站，死于当地。她的形象随后出现在战时宣传品和画作中。"
 CBIO_HOI120_olaf_j_thorlacius_desc:0 "奥拉夫·J·索尔拉休斯（1869—1953）在哥本哈根和雷克雅未克接受医学训练。1897年至1928年，他在冰岛东部的贝吕峡湾地区行医，1903年至1908年任冰岛议员。1928年迁居雷克雅未克后，他负责监督结核病疗养院和结核病防治工作，1931年至1939年还承担药品经营与药房的监管事务。"
 CBIO_HOI120_olafur_petursson_desc:0 "奥拉维尔·彼德松是二战期间与纳粹德国合作的冰岛人。德国占领挪威期间，他向占领当局告发了参加抵抗活动的冰岛人莱弗尔·米勒，后者被关押在萨克森豪森集中营。战后，彼德松在挪威获刑，后来被移交冰岛。1949年，他就《人民意志报》对其战时行为的报道提起名誉诉讼，案件于翌年被冰岛最高法院发回重审。"
 CBIO_HOI120_olgeirsson_desc:0 "埃纳尔·奥尔盖尔松，1902年生于冰岛阿克雷里，曾任教师、工会负责人和报刊编辑。1937年，他当选冰岛议会议员。自1939年起，他担任人民统一党—社会党主席，并长期领导该党议会党团。1941年，他被驻冰岛英军扣押并送往伦敦，当年夏天获释。战后，他继续参与冰岛议会政治，1956年至1959年任议会下院议长，1967年卸任议员。1993年去世。"
 CBIO_HOI120_ormazabal_desc:0 "拉蒙·奥尔马萨瓦尔·蒂费，1910年生于伊伦，是巴斯克共产主义活动家。1935年巴斯克共产党成立后，他在比斯开活动。西班牙内战爆发时，他参加比斯开防卫委员会，并主持党刊《红色巴斯克》。共和派战败后，他曾被捕，后来流亡美洲，在海外参与党的重建。1962年，他因参与巴斯克地区罢工活动再次入狱。获释后，他在法国主持巴斯克共产党工作，1982年在毕尔巴鄂去世。"
 CBIO_HOI120_palvadre_desc:0 "雅各布·帕尔瓦德雷，1889年4月27日生于今爱沙尼亚桑加斯特，早年当过教师和记者。第一次世界大战期间他在俄罗斯帝国军队服役，1917年当选所在团的士兵委员会主席。俄国内战期间，他加入红军，1919年出任爱沙尼亚步枪师师长。1920年因病退役，随后在彼得格勒大学学习历史，1928年起在列宁格勒大学任教。1936年，他在苏联的政治镇压中遇害。"
 CBIO_HOI120_paraianu_desc:0 "巴尔布·珀勒亚努（1884—1946）生于罗马尼亚戈尔日县，先后在克拉约瓦和布加勒斯特的军校受训，毕业后任步兵军官。第一次世界大战期间，他在德军占领区帮助被俘的罗马尼亚军人脱身。1917年，他被德军判处死刑，在福克沙尼逃出监狱，随后归队。战间期他升任准将。1934年至1938年，他担任罗马尼亚宪兵总监，任内建立铁路宪兵部队，并为宪兵军官组织战时勤务训练。战后，他与数名宪兵同僚一同被捕，1946年去世。"
 CBIO_HOI120_paris_desc:0 "亨利·德·奥尔良（1908—1999）是吉斯公爵让的独子，以巴黎伯爵的头衔为人所知。他童年在摩洛哥生活，后来随家人流亡比利时。第二次世界大战爆发后，他加入法国外籍军团。1940年父亲去世，亨利成为奥尔良派的王位候选人，支持者称他为亨利六世。1950年法国废除王族流放法，他得以回国定居。他与戴高乐长期通信，终其一生都未登上王位。1974年，他把家族的一部分历史财产交给自己创立的圣路易基金会保存。"
 CBIO_HOI120_pavel_murashev_desc:0 "帕维尔·伊万诺维奇·穆拉绍夫出生于特维尔省梅德诺耶村，曾参加俄国内战。1931年起，他在党组织从事宣传工作，后来先后担任阿尔汉格尔斯克两个区的党委第一书记。1937年11月，他代理联共（布）科米州委第一书记，至1938年6月去职。同月，他因被指参加反革命组织而遭逮捕，后死于劳改营。1956年6月，他获平反。"
 CBIO_HOI120_pedro_henrique_desc:0 "佩德罗·恩里克·德·奥尔良-布拉干萨（1909—1981）生于巴黎近郊的布洛涅，当时巴西皇室正在法国流亡。他的父亲是路易斯亲王，祖母伊莎贝尔公主是巴西皇帝佩德罗二世的女儿。父亲于1920年去世，次年祖母去世，年仅十二岁的佩德罗·恩里克成为皇室瓦索拉斯一支的继承人。1922年，他随家人到巴西参加独立百年纪念。此后他在巴黎求学，1937年与巴伐利亚公主玛丽亚·伊丽莎白结婚。第二次世界大战结束后，夫妇二人于1945年携子女移居巴西。他一直是这一支保皇派拥戴的王位候选人。"
 CBIO_HOI120_per_ahmad_ahmadi_desc:0 "艾哈迈德·艾哈迈迪是礼萨沙阿统治时期德黑兰卡斯尔监狱的护士，人称“艾哈迈迪医生”。他参与杀害狱中的政治犯，死者包括曾任宫廷大臣的阿卜杜勒·侯赛因·泰穆尔塔什。1941年礼萨沙阿退位，艾哈迈迪逃往伊拉克，藏身巴格达。泰穆尔塔什的女儿伊朗多赫特追查到他的下落，促成伊拉克将他引渡回伊朗。他在德黑兰受审，1944年被处决。"
 CBIO_HOI120_per_sylvan_desc:0 "佩尔·西尔万，1875年4月23日生于马尔默，瑞典炮兵军官。1895年任少尉，后在炮兵与工兵高等学校任教并领导该校，著有野战炮兵射击手册。两次世界大战之间，他主持过炮兵参谋工作，指挥过斯莫兰陆军炮兵团和南部陆军师。1937年瑞典调整国防指挥体系时，他晋升中将，成为首任陆军司令，任至1940年退休。"
 CBIO_HOI120_petre_barbureanu_desc:0 "佩特雷·伯尔布内阿努（1881—1979）毕业于阜姆海军学校，1902年进入罗马尼亚海军。战间期，他曾主持海军兵工厂，也曾在康斯坦察负责海员教育。1937年，他以海军少将身份出任海军司令，次年晋升中将。他参与创建加拉茨军用造船厂，1939年，罗马尼亚自行建造的“穆尔杰斯库海军上将”号布雷舰在那里下水。1940年他卸任海军司令，1945年又出任主管海军的国务次长，同年晋升海军上将。"
 CBIO_HOI120_petre_gheorghe_desc:0 "佩特雷·格奥尔基是保加利亚裔的罗马尼亚共产党活动家。1940年前，他在多瑙河下游的党组织活动，曾负责向共产国际传递罗马尼亚共产党领导层的消息。后来他担任布加勒斯特党组织书记。1941年德国进攻苏联后，他与党的负责人斯特凡·福里什就应否同其他党派合作反对安东内斯库发生分歧。年底，中央要求将他开除出党，他也致信中央说明自己的立场。此后他被罗马尼亚当局以为苏联从事间谍活动的罪名逮捕，1943年遭处决。"
 CBIO_HOI120_philip_gordon_lee_desc:0 "菲利普·戈登·李在第二次世界大战期间服役于英国皇家海军志愿预备役。1942年，他以临时海军少尉军衔随摩托炮艇在多佛尔海峡作战，获颁杰出服务十字勋章。1943年，他已任临时海军中尉，因随轻型近岸舰艇在敌方沿海与优势兵力交战，获得第一枚勋扣。1944年，他因参与阻止德军向勒阿弗尔补给及从当地撤军，获颁第二枚勋扣。"
 CBIO_HOI120_pierre_le_gloan_desc:0 "皮耶尔·勒·格洛昂（1913—1943）出生于法国布列塔尼，1932年取得军用飞行执照，服役于法国战斗机部队。1940年法国战役期间，他随第6战斗机联队作战。停战后，他随部队留在维希政权控制的地区，1941年在叙利亚战役中与英军战斗。北非的法国部队转而与盟军协同作战后，他在阿尔及利亚执行沿岸巡逻任务。1943年9月11日，他驾驶P-39战斗机时因事故遇难。"
 CBIO_HOI120_plenikowski_desc:0 "安东·普莱尼科夫斯基，1899年生于但泽附近的索波特，早年曾任教师。1926年加入社会民主党，次年转入德国共产党，后来在但泽自由市议会领导共产党党团。1937年，他流亡瑞典，战后于1946年返回德国，加入德国统一社会党。他随后在该党负责国家行政事务，也曾在民主德国人民议院任职，并担任部长会议主席团办公室主任。1971年在东柏林去世。"
 CBIO_HOI120_poindexter_desc:0 "约瑟夫·博伊德·波因德克斯特是美国法官和行政官员，1934年出任夏威夷领地总督。就任后，他负责领地行政事务，同时兼任领地国民警卫队总司令。1941年12月7日，日本袭击珍珠港，波因德克斯特宣布夏威夷进入军事管制，多项行政权力交由军方行使。他于1942年8月卸任，后来曾在美国国会调查珍珠港事件时作证。"
 CBIO_HOI120_pomare_desc:0 "泰里努伊·波马雷是塔希提王室成员，被承认为末代国王波马雷五世与王后马劳的女儿。她在塔希提由法国管理的时期长大。1937年，她从帕皮提赴法国，计划参观巴黎国际博览会。1953年，她以塔希提王女的身份致函法国总统樊尚·奥里奥尔，援引家族与法国之间的历史关系，要求保留当地的自治地位。"
 CBIO_HOI120_radescu_desc:0 "尼古拉·勒代斯库是罗马尼亚陆军将领。1944年罗马尼亚转向对德作战后，他出任总参谋长。同年12月，国王米哈伊一世任命他为首相。此时苏军已驻扎罗马尼亚，围绕政府组成的斗争日趋激烈。1945年初，苏联代表维辛斯基向国王施压，要求由彼得鲁·格罗查组阁。勒代斯库去职，格罗查政府于3月6日就任。1946年他离开罗马尼亚，辗转抵达美国，后在流亡者组织罗马尼亚全国委员会担任主席。1953年，他在纽约去世。"
 CBIO_HOI120_radu_baldescu_desc:0 "拉杜·巴尔代斯库（1888—1953）生于罗马尼亚南部的奥尔特县。第一次世界大战期间，他曾在第一步兵师参谋部任职。战后，他在锡比乌教授军事史，以罗马尼亚军队在上次大战的经历为题，编写供军官学员使用的教材。第二次世界大战中，他指挥第十八步兵师，参加克里米亚的战事和1942年的塞瓦斯托波尔围城战。1945年，他又先后指挥第五军和第六军。转入预备役后，他被捕入狱，1953年死于日拉瓦。"
 CBIO_HOI120_radu_irimescu_desc:0 "拉杜·伊里梅斯库（1890—1975）早年受海军军官训练，在德国基尔进修。第一次世界大战期间，他由海军转入航空兵，战后在美国哥伦比亚大学学习工程。1932年起，他在罗马尼亚国防部主管航空事务，主持拟订为期五年的航空设施建设计划。经费和行政手续使多项工程延期。1937年他出任航空与海军部长，次年转任罗马尼亚驻美国公使，在华盛顿任职至1940年。"
 CBIO_HOI120_rastrollo_desc:0 "路易斯·拉斯特罗略·冈萨雷斯，1908年生于富恩特德尔阿尔科，是教师和工会活动家，拥有法律学位。1935年，他担任马克思主义统一工人党加利西亚组织总书记，并在圣地亚哥-德孔波斯特拉主持当地的教员工会。1936年7月军方发动叛乱后，他参加当地保卫共和国的委员会，后遭逮捕。军事法庭以叛国罪判处他死刑，同年12月他在博伊萨卡公墓被枪决。"
 CBIO_HOI120_rasulzade_desc:0 "马梅德·阿明·拉苏尔扎德，1884年生于巴库附近的诺夫哈内，是阿塞拜疆记者和政治家。早年曾到伊朗参与立宪运动并办报，回到巴库后成为穆萨瓦特党的领导人。1918年，他当选阿塞拜疆国民委员会主席，同年5月28日，委员会宣布阿塞拜疆独立。苏俄红军进入阿塞拜疆后，他被捕，获释后辗转流亡，继续组织阿塞拜疆政治流亡者和出版刊物。1955年3月6日在安卡拉去世。"
 CBIO_HOI120_razmara_desc:0 "哈吉·阿里·拉兹马拉是伊朗陆军中将。早年赴法国圣西尔军校学习，回国后在伊朗陆军任职，曾主持军事地理工作。1946年任总参谋长期间，伊朗军队进入伊朗西北部的阿塞拜疆地区，中央政府恢复了对该地区的控制。1950年6月，他出任首相，主张推进行政改革，反对立即将石油工业全面国有化。1951年3月7日，他在德黑兰出席追悼仪式时遭哈利勒·塔赫马塞比枪杀。伊朗议会在当月通过石油国有化原则，随后于4月通过实施办法，摩萨台也于4月出任首相。"
 CBIO_HOI120_rene_bousquet_desc:0 "勒内·布斯凯，1909年生于蒙托邦，是法国行政官员。1940年任马恩省省长。1942年4月，皮埃尔·赖伐尔重新组阁后，他出任维希政权警察总秘书，与德国占领当局商定警务合作，并参与决定由法国警察逮捕和移交犹太人。法国警察在1942年7月的巴黎冬季自行车馆大搜捕中拘捕大批犹太居民，其中包括儿童。1943年末，布斯凯离职。战后他曾受审，随后进入印度支那银行。其战时责任后来再次受司法调查，1993年他在新案开庭前遇害。"
 CBIO_HOI120_rene_von_graffenried_desc:0 "勒内·冯·格拉芬里德（1886—1955）是瑞士律师和陆军军官，曾任伯尔尼律师协会主席。1937年，他获任瑞士陆军师级指挥官，接掌第三师。1939年欧洲战争爆发后，第三师参加瑞士的战时总动员，他仍担任师长，次年离任。他也曾担任瑞士滑雪协会主席，1955年在伯尔尼去世。"
 CBIO_HOI120_richard_peirse_desc:0 "理查德·埃德蒙·查尔斯·皮尔斯（1892—1970）早年在英国皇家海军航空队飞行，第一次世界大战后继续在皇家空军服役。1940年，他接掌英国轰炸机司令部。1942年调任印度空军司令，负责英国皇家空军在印度和缅甸方向的行动，1943年转任东南亚盟军空军总司令。1945年，他以空军上将军衔退役。"
 CBIO_HOI120_richard_veermaa_desc:0 "里哈德·费尔马（1901—1942）原姓弗雷曼，生于爱沙尼亚沃鲁县。他曾参加爱沙尼亚独立战争，随后从政，担任第三届国会议员，并在内政部和警察机关任职。1938年5月，总统康斯坦丁·佩茨任命他为内政部长。1939年10月，爱沙尼亚签订允许苏联驻军的条约，政府改组，他随之离任。1940年苏联占领爱沙尼亚后，他被逮捕并押往彼尔姆地区的劳改营，1942年2月19日死于狱中。"
 CBIO_HOI120_risco_desc:0 "比森特·马丁内斯·里斯科，1884年生于奥伦塞，是加利西亚作家和民俗研究者。他参与加利西亚语运动，合办《我们》杂志，曾主管加利西亚研究学会的民族志与民俗部门。1930年赴德国学习民族志，政治立场逐渐转向保守天主教。1936年加利西亚主义党加入人民阵线后，他退出该党，转入加利西亚主义右翼。内战后期，他在报刊上撰文支持佛朗哥阵营。此后继续写作和研究，1963年在奥伦塞去世。"
 CBIO_HOI120_saadawi_desc:0 "巴希尔·萨达维是利比亚独立运动的活动者，曾在海外参与组织利比亚政治流亡者。第二次世界大战结束后，他活跃于的黎波里塔尼亚政坛，领导国民大会党。他主张各地区共同建立统一的利比亚国家，反对把独立后的国家建成联邦制。1951年利比亚独立后，国民大会党参加了1952年首次全国选举。选举之后，政党遭取缔，萨达维被驱逐出境，晚年赴黎巴嫩，1957年在贝鲁特去世。"
 CBIO_HOI120_saf_leonard_beyers_desc:0 "伦纳德·拜尔斯是南非联邦国防军军官。二战期间，他担任军队行政主管，曾代理总参谋长，负责战时人员与行政事务。1949年，他接替范赖内费尔德正式出任总参谋长。任职约十个月后，因与国防部长伊拉斯谟在军队管理和人事任命上发生冲突，拜尔斯于1950年辞职。"
 CBIO_HOI120_saladzius_desc:0 "普拉纳斯·萨拉久斯，1893年2月27日生于立陶宛维茹奥诺斯，早年曾任教师。第一次世界大战期间应征加入俄罗斯帝国陆军。1919年进入立陶宛陆军，参加独立战争，后来在军事学校任教，并担任考纳斯市及县的军事指挥官。1934年晋升上校，1935年出任立陶宛步枪手联盟司令，推动改组与军事训练。1940年苏军占领立陶宛后，他先被免职、后遭关押，翌年获释。战后移居美国，1965年卒于纽约州罗切斯特。"
 CBIO_HOI120_sanjurjo_desc:0 "何塞·桑胡尔霍，1872年生于潘普洛纳，曾随西班牙军队在古巴和摩洛哥作战，里夫战争期间担任高级指挥职务。西班牙第二共和国成立时，他担任国民警卫队总监，曾承诺该部服从新政府。1932年8月，他在塞维利亚领导反共和国政府的军事叛乱，失败后被捕，死刑改为监禁。获释后移居葡萄牙。1936年7月军方起事后，他准备返国接掌起事部队，7月20日，载他的飞机在葡萄牙埃斯托里尔起飞时坠毁，他在事故中身亡。"
 CBIO_HOI120_sawat_phutianands_desc:0 "萨瓦·普提阿南（1904—1973）生于吞武里，1922年进入暹罗海军军官学校，1937年又在海军进修。他曾赴意大利接收泰国订购的舰艇，回国后先后指挥春武里号、尖竹汶号和素叻他尼号等舰。战后，他出任海军军官学校校长，随后任泰国湾巡逻舰队指挥官及海军福利部门负责人。1962年10月至1964年9月，他担任泰国皇家海军总司令。"
 CBIO_HOI120_seamus_o_muiris_desc:0 "谢默斯·奥穆里斯原名詹姆斯·莫里斯，早年在英国皇家海军服役，参加过1916年的日德兰海战。爱尔兰独立战争期间，他辞去英国海军军职。第二次世界大战爆发前后，爱尔兰政府请他出任海军事务顾问，他随后指挥战时海事部队，负责沿岸巡逻和水雷处置等任务。战后他退役，仍参加爱尔兰海事研究所的活动，1953年去世。"
 CBIO_HOI120_shalapatov_desc:0 "阿塔纳斯·沙拉帕托夫是保加利亚海军军官。20世纪20年代，他在海军学校担任学员连长，参加舰员训练，也曾指挥“斯特罗吉”号鱼雷艇。第二次世界大战结束前后，他一度主持海军学校。1946年至1947年，他担任保加利亚海军指挥官。这段任期处于保加利亚海军的战后整编期。"
 CBIO_HOI120_sia_kukrit_pramoj_desc:0 "克立·巴莫（1911—1995）出身暹罗王族，在牛津大学学习哲学、政治与经济。1933年回到曼谷后，他曾在政府和暹罗商业银行任职。1950年，他创办《暹罗国报》，长期从事新闻写作，并以小说《四朝代》描绘泰国王室与社会的变迁。1975年，他出任泰国总理，任内泰国与中华人民共和国建立外交关系。"
 CBIO_HOI120_sia_vanich_pananont_desc:0 "瓦尼·巴纳暖出身泰国春武里府米商家庭，曾在海军学校学习，后来经商并经营燃料贸易。1932年，他参与了结束君主专制的政变，随后在国防部和陆军任燃料事务主管。1939年转任商业行政职务。1941年底，他进入披汶政府，参与泰日联合委员会并经管财政和商业事务。1944年被拘押，同年5月21日死于羁押期间。"
 CBIO_HOI120_sima_desc:0 "霍里亚·西马早年担任中学教师，1927年加入罗马尼亚的法西斯组织铁卫团。科德里亚努死后，西马成为该组织的领袖。1940年9月，他与扬·安东内斯库组成政府，担任副首相。铁卫团在执政期间强占犹太人的商店和财产，殴打并杀害犹太居民。1941年1月，西马率铁卫团叛乱，其成员在布加勒斯特屠杀犹太平民。军队镇压叛乱后，他逃往德国。1944年罗马尼亚转向对德作战，德国又扶植他在维也纳组织流亡政府。战后，他定居西班牙，继续领导流亡的铁卫团成员。"
 CBIO_HOI120_skuli_gudhmundsson_desc:0 "斯库利·格维兹门松（1900—1969）早年经商务农，1934年起主持赫瓦姆斯坦吉的合作社。1937年代表进步党进入冰岛议会，次年出任产业部长并兼管卫生事务，1939年离任。1954年，他曾在财政部长因病休职期间代理其职务，直至1969年仍任议员。"
 CBIO_HOI120_skvortsov_desc:0 "尼古拉·斯克沃尔佐夫，1899年生，是苏联党政官员。1938年至1945年，他担任哈萨克共产党中央委员会第一书记。其任内，当地党组织在文化领域清查和撤除被列为政治禁书的作品。第二次世界大战结束前后，他调任莫斯科，1945年任苏联经济作物人民委员，后来又担任国营农场部长，继续从事农业行政工作。1974年在莫斯科去世。"
 CBIO_HOI120_slavko_stancer_desc:0 "斯拉夫克·斯坦瑟（1872—1945）出生于卡尔洛瓦茨，在奥匈帝国军队服役，官至上校。1941年，乌斯塔沙建立克罗地亚独立国后，他获任陆军总指挥并取得步兵上将军衔。他还曾任萨格勒布卫戍长官、武装力量总监察官，为高级军事法庭成员。1945年，他在奥地利被俘并被引渡，后在萨格勒布被判处死刑。1945年6月16日，他在判决执行前去世。"
 CBIO_HOI120_sofoulis_desc:0 "塞米斯托克利斯·索富利斯生于萨摩斯岛，早年从事考古研究，曾在雅典大学任教。他在尚处自治时期的萨摩斯参政，后进入希腊全国政坛，数次当选议长，1924年首次担任首相。1936年，他接替韦尼泽洛斯出任自由党领袖。第二次世界大战结束后，他再度组阁，1947年在希腊内战中出任联合政府首相，任至1949年6月24日在职去世。"
 CBIO_HOI120_spa_fransisco_moreno_fernandez_desc:0 "弗朗西斯科·莫雷诺·费尔南德斯（1883—1945）生于西班牙加的斯省圣费尔南多，是海军军官萨尔瓦多·莫雷诺的兄长。他在费罗尔海军学校受训，1935年任马德里海军战争学院院长。1936年7月，他在费罗尔参加反共和国的军事叛乱。忠于共和国的军官安东尼奥·阿扎罗拉遭到软禁后，莫雷诺接管了当地兵工厂。内战中他出任国民军舰队司令，指挥海上封锁行动。战后他先后在卡塔赫纳和费罗尔担任海军职务，1945年在费罗尔去世。"
 CBIO_HOI120_spa_mauricio_de_sivatte_desc:0 "毛里西奥·德·茜瓦特（1901—1980）生于加泰罗尼亚阿雷尼斯-德马尔，是西班牙卡洛斯派在当地的组织者。内战和战后初期，他领导加泰罗尼亚的传统主义者，主张保持卡洛斯派自身的组织与王位继承立场。由于与党领导人法尔·孔戴的分歧，他在1949年被撤去地区负责人职务。1958年，他与追随者在蒙特塞拉特集会，成立埃斯特利亚国家卡洛斯派摄政委员会。1980年，他在巴塞罗那去世。"
 CBIO_HOI120_spa_rafael_garcia_valino_desc:0 "拉斐尔·加西亚·巴利尼奥（1898—1972）生于西班牙托莱多，是陆军步兵军官，早年在摩洛哥服役。1936年西班牙内战爆发时，他加入反共和国的国民军，在北方和阿拉贡作战。后来他指挥马埃斯特拉斯戈军团，参加埃布罗河战役及其后的加泰罗尼亚攻势。战后他出任陆军参谋长。1951年，他以陆军中将身份获任西班牙驻摩洛哥高级专员，任期延续到1956年西属保护国结束。1972年他在马德里去世。"
 CBIO_HOI120_spa_raimundo_fernandez_cuesta_desc:0 "雷蒙多·费尔南德斯·库斯塔（1896—1992）是西班牙律师、长枪党组织者。1933年，他与何塞·安东尼奥·普里莫·德里维拉等人创建长枪党。1934年，长枪党与民族工团主义进攻委员会合并，他成为新党的秘书长。内战期间，他在共和国控制区被捕，1937年通过交换囚犯获释，随后担任佛朗哥统一后的长枪党组织秘书长和农业部长。第二次世界大战期间，他先后出任西班牙驻巴西和意大利大使。1945年至1951年，他任司法部长，任内又重新担任执政党秘书长。佛朗哥去世后，他参与重组长枪党，1983年卸下党主席职务，1985年退出政治活动。"
 CBIO_HOI120_spa_ramon_serrano_suner_desc:0 "拉蒙·塞拉诺·苏涅尔（1901—2003）生于西班牙卡塔赫纳，是律师，第二共和国时期曾任国会议员。他的妻子与佛朗哥的妻子是姐妹。内战开始后，他在马德里被捕，逃脱后经法国抵达萨拉曼卡，进入佛朗哥的政治核心。1938年他出任内政部长，任内掌管新闻和宣传事务。1940年10月，他改任外交部长，并参加佛朗哥与希特勒在昂代的会谈。他推动西班牙同德国和意大利接近，1942年9月离开内阁，此后重新从事律师工作。"
 CBIO_HOI120_spa_salvador_moreno_fernandez_desc:0 "萨尔瓦多·莫雷诺·费尔南德斯（1886—1966）生于西班牙费罗尔，与兄长弗朗西斯科同为海军军官。1936年7月，他在费罗尔加入反共和国的军事叛乱，夺取正在船坞中修理的“塞尔韦拉海军上将”号巡洋舰，随后指挥该舰出海。内战结束后，他于1939年至1945年担任佛朗哥政府海军部长，1942年晋升海军中将。卸任后，他曾任舰队司令，1950年晋升海军上将，1951年至1957年再次主持海军部。1966年他在马德里去世。"
 CBIO_HOI120_spa_tomas_dominguez_arevalo_desc:0 "托马斯·多明戈斯·阿雷瓦洛（1882—1952）生于马德里，出身与纳瓦拉关系密切的贵族家庭，继承罗德斯诺伯爵头衔。他长期从事卡洛斯派政治活动，曾任国会议员。1936年军事起事前夕，他参与协调纳瓦拉卡洛斯派与莫拉将军的关系，促使当地民兵加入反共和国一方。1937年，佛朗哥下令把长枪党与传统主义组织合并，罗德斯诺支持合并，与法尔·孔戴的立场分歧加深。他自1938年至1939年担任佛朗哥政府司法部长。1952年，他在纳瓦拉的比利亚弗兰卡去世。"
 CBIO_HOI120_spr_antonia_adroher_i_pascual_desc:0 "安东尼娅·阿德罗埃尔·帕斯夸尔（1913—2007）生于赫罗纳，是加泰罗尼亚教师。她在本地师范学校求学，参与组织教育工人工会，后来加入马克思主义统一工人党。1936年10月，她出任赫罗纳市政委员会文化与宣传委员，成为该市首位女性市政委员。1939年1月，她流亡法国，在图卢兹与党内旧识卡梅尔·罗萨·巴塞尔巴重逢，两人此后共同生活。迁居巴黎后，她曾主持当地的加泰罗尼亚之家，继续从事文化和政治活动。1977年两人返回加泰罗尼亚，2001年合著回忆录，2006年同获圣乔治十字勋章。2007年9月15日，阿德罗埃尔在法国巴纽尔斯去世。"
 CBIO_HOI120_spr_antonio_azarola_y_gresillon_desc:0 "安东尼奥·阿扎罗拉·格雷西隆（1874—1936）生于西班牙纳瓦拉的塔法利亚，早年进入费罗尔海军学校，1932年晋升海军少将。1935年12月至1936年2月，他在波特拉·巴利亚达雷斯的共和国内阁中担任海军部长，随后回到费罗尔担任兵工厂指挥官。1936年7月，当地驻军响应叛乱，他向共和国海军部长表明效忠政府，拒绝加入叛军。掌控基地的叛军将他拘押并交付军事审判。8月4日，他在费罗尔的多洛雷斯兵营被枪决。"
 CBIO_HOI120_stefan_johann_stefansson_desc:0 "斯特凡·约翰·斯特凡松（1894—1980）毕业于冰岛大学法律系，曾在雷克雅未克开办律师事务所。1939年任社会事务部长并掌管外交事务，1941年正式兼任外交部长。1947年，他出任冰岛总理兼社会事务部长，任至1949年。此后，他曾作为冰岛驻丹麦大使兼理对爱尔兰和土耳其的外交事务。"
 CBIO_HOI120_stefan_voitec_desc:0 "斯特凡·沃伊捷克（1900—1984）生于多瑙河畔的科拉比亚，青年时参加社会主义运动，1920年代曾编辑《社会主义者报》。他活跃于罗马尼亚社会民主党，曾与党内坚持独立路线的蒂特尔·彼得雷斯库密切合作。1944年安东内斯库政权倒台后，他出任教育部长。随着共产党掌握政权，他支持社会民主党与共产党合并，并参与1948年组建罗马尼亚工人党的过程。此后他数度担任部长和部长会议副主席，1961年出任大国民议会主席。"
 CBIO_HOI120_stefanov_desc:0 "鲍里斯·斯特凡诺夫（1883—1969）生于保加利亚科特尔。1913年南多布罗加划归罗马尼亚后，他在罗马尼亚从事社会主义运动，曾因共产党活动被关入多夫塔纳监狱。1933年获释后，他前往苏联。1934年底，共产国际任命他为罗马尼亚共产党总书记。次年，设在布拉格的党中央全会确认了这一任命。他在国外领导这个已遭罗马尼亚政府取缔的政党。1939年德军占领捷克地区后，他返回苏联，1940年卸任，1945年回到保加利亚。"
 CBIO_HOI120_stepinac_desc:0 "阿洛茨杰·斯蒂芬纳克，1898年5月8日出生于克拉希奇附近的布雷扎里奇，1937年出任萨格勒布天主教总主教。1941年乌斯塔沙建立克罗地亚独立国后，他起初支持克罗地亚建国。此后他曾致函当局反对迫害，为部分面临驱逐的人交涉，并在布道中谴责种族歧视与暴力。战后他拒绝将克罗地亚天主教会与罗马教廷分离。1946年，南斯拉夫当局以与乌斯塔沙政权合作等罪名审判他，判处其十六年监禁。1951年，他被转往克拉希奇软禁，次年获教宗庇护十二世任命为枢机。1960年2月10日，他在软禁期间去世。"
 CBIO_HOI120_stirbey_desc:0 "巴尔布·斯蒂尔贝伊（1872—1946）出身于瓦拉几亚王公家族，经营农业和实业。1913年，他受命管理罗马尼亚王室地产，第一次世界大战期间担任王室的政治顾问。1927年6月，他曾短暂出任首相，主持过渡内阁。1944年春，他受托赴开罗，与盟国代表商谈罗马尼亚退出对苏战争的条件。米哈伊国王推翻安东内斯库后，新政府授权他继续参与停战谈判。同年9月，他作为罗马尼亚代表之一，在莫斯科签署了与苏联、英国和美国的停战协定。"
 CBIO_HOI120_subasic_desc:0 "伊凡·萨巴斯奇，1892年5月28日出生于武科瓦戈里察，克罗地亚律师和政治家。第一次世界大战中，他曾在奥匈军队服役，被俄军俘虏后加入南斯拉夫志愿部队，参加萨洛尼卡战线的作战。战后他在萨格勒布学习法律，后加入克罗地亚农民党，1935年和1938年两度当选议员。1939年《茨韦特科维奇—马切克协定》设立克罗地亚自治省，他出任省长。1941年南斯拉夫遭轴心国入侵后，他随政府流亡，1944年出任南斯拉夫王国流亡政府首相，并与约瑟普·布罗兹·铁托谈判达成协议，为联合临时政府的成立铺路。1945年3月，他在新政府中担任外交部长，同年10月因对协议的执行不满而辞职。1955年3月22日，他在萨格勒布去世。"
 CBIO_HOI120_subbier_appadurai_ayer_desc:0 "苏比尔·阿帕杜莱·艾耶尔是印度新闻工作者，二战期间在东南亚追随苏巴斯·钱德拉·鲍斯。1943年10月，自由印度临时政府在日本占领下的新加坡成立，他出任宣传部长，负责该政府对外发布消息和宣传。战后，他整理了与鲍斯共事的经历，1951年在孟买出版回忆录，记录鲍斯在东南亚的活动及自由印度临时政府的运作。"
 CBIO_HOI120_subhasvasti_desc:0 "索蓬斯瓦斯蒂亲王，1900年8月23日生，暹罗王室成员和陆军军官，曾在国王拉玛七世身边担任侍卫。拉玛七世退位后，他居住在英国。第二次世界大战期间，他加入自由泰运动，在英国接受训练。1945年4月，他以“阿伦”为代号回到泰国，与摄政比里·帕侬荣会面，协助自由泰运动联络盟军并组织抵抗日军的力量。1967年4月22日去世。"
 CBIO_HOI120_sulaiman_bin_himyar_desc:0 "苏莱曼·拉米全名苏莱曼·本·希米亚尔·拉米，是阿曼内陆巴尼里亚姆部族的首领，长期以塔努夫为据点。1930年代末，关于马斯喀特苏丹与内陆领袖交涉的通信已经提到他。战后，石油勘探权成为内陆领袖与苏丹争议的一部分，苏莱曼于1950年寻求外界承认杰贝勒阿赫达尔地区独立，未获成功。1950年代中后期，他支持阿曼内陆的伊玛目政权，与马斯喀特苏丹对立。"
 CBIO_HOI120_swe_ebba_palmstierna_desc:0 "埃巴·玛加丽塔·帕尔姆谢纳（1877—1966），原姓卡尔海姆-许伦舍尔德，是瑞典争取妇女政治权利运动的参加者。20世纪初，她在妇女选举权团体组织的集会上演讲，参与动员女性参与地方公共事务。1913年，她在卡尔斯塔德的青年集会上谈及妇女与禁酒运动。她与外交官埃里克·帕尔姆谢纳结婚，现存通信记录了她与同时代社会活动人士的往来。"
 CBIO_HOI120_swe_konrad_hallgren_desc:0 "康拉德·哈尔格伦（1891—1962）是瑞典早期法西斯运动的组织者。1926年，瑞典法西斯斗争组织成立后，他成为主要负责人，与斯文·乌洛夫·林德霍尔姆等人组织活动，通过刊物传播反共及法西斯主张。该团体后来转向公开的国家社会主义。哈尔格伦参与的这一支与其他派别发展成瑞典战间期的极右翼政党。"
 CBIO_HOI120_swe_sven_hedengren_desc:0 "斯文·赫登格伦（1897—1972）是瑞典陆军军官。1920年代，他与哈尔格伦等人共同领导瑞典早期法西斯组织，后与林德霍尔姆领导的国家社会主义运动保持联系。二战期间，他以上尉军衔赴芬兰担任志愿军军官。战后，瑞典政府在审核其晋升资格时调查了他的政治活动，该案后来载入政府关于极右翼监控的调查报告。"
 CBIO_HOI120_tenpa_jamyang_desc:0 "丹巴绛央（1888—1944）是20世纪上半叶西藏地方政府的僧官。1933年起，他担任藏军总司令，与另一位总司令共同负责藏军事务。任内，藏军总部着手用藏语替换原先沿用的英语操练口令，并试行采用藏式服装裁制的军服。两人曾让卫兵穿上试制军服，请摄政热振选择式样。丹巴绛央后来担任噶伦，1944年去世。"
 CBIO_HOI120_teodomiro_varela_de_andrade_desc:0 "特奥多米罗·巴雷拉·德安德拉德是乌拉圭政论作者，青年时期曾参加蒙得维的亚的无政府主义社团活动，后来转向右翼团体主义。1930年代，他与阿道尔福·阿戈里奥等人参与乌拉圭修正主义行动组织，并负责编辑《团体》杂志。1938年，他出版政论，主张在议会政治代表之外加入由各行业团体派出的代表。这一主张受到当时欧洲和巴西团体主义政治的影响。"
 CBIO_HOI120_ter_poorten_common_revision_desc:0 "海因·特尔·波尔滕（1887—1968）生于荷属东印度爪哇的茂物，1908年从布雷达皇家军事学院毕业，进入荷属东印度皇家陆军炮兵部队。1911年，他在法国取得飞行执照，后来参与建立荷属东印度的军事航空力量。1916年试飞失事使他身受重伤，他随后转回炮兵与参谋岗位。1939年7月任该军总参谋长，1941年10月在前任司令贝伦斯霍特因飞机失事身亡后接任总司令。1942年初，他担任美英荷澳联合司令部的陆军指挥官。日军攻入爪哇后，他于3月8日接受日军的投降要求，次日在卡利贾蒂签署降书并通过电台通报。此后他被日军关押，战后获释回到荷兰，1968年在海牙去世。"
 CBIO_HOI120_thomas_leech_desc:0 "托马斯·戴维·詹姆斯·利奇（1902—1973）是澳大利亚工程师，曾在悉尼大学教授土木工程和空气动力学。1940年，他赴新西兰担任奥克兰大学学院工程学教授，并参与新西兰科学与工业研究部门的战时项目。1950年，他返回澳大利亚，主管雪山水电工程管理局的科学服务部门，负责建立研究实验室，组织水利工程的模型试验与相关研究。"
 CBIO_HOI120_tiso_common_revision_desc:0 "约瑟夫·蒂索（1887—1947）生于比奇查，是斯洛伐克天主教神父和政治人物。1927至1929年，他出任捷克斯洛伐克公共卫生与体育部长，1938年任斯洛伐克自治政府总理。1939年3月，蒂索与希特勒会晤后，斯洛伐克议会在德国施压下宣布独立。他出任总理，同年10月当选总统，领导依附纳粹德国的斯洛伐克共和国。其政权颁行反犹太法令，1942年将约五万七千名犹太人驱逐至德占波兰，蒂索公开为迫害政策辩护。1944年斯洛伐克民族起义爆发后，德军进驻斯洛伐克，自9月起又驱逐约一万二千六百名犹太人。1945年，蒂索逃往奥地利和德国，后被美军拘押并移交捷克斯洛伐克。布拉迪斯拉发的国民法院判处他死刑，1947年4月18日执行。"
 CBIO_HOI120_titulescu_desc:0 "尼古拉·蒂图列斯库（1882—1941）早年教授法律，后当选议员。1920年，他代表罗马尼亚签署了与匈牙利的《特里亚农条约》。在日内瓦担任罗马尼亚代表期间，他参与国际裁军谈判，1930年和1931年连续两次当选国际联盟大会主席。他先后于1927年至1928年、1932年至1936年担任外交部长。为维护罗马尼亚的边界，他在1934年代表本国签署《巴尔干协约》。1936年卸任后旅居国外，1941年在法国戛纳去世。"
 CBIO_HOI120_tomas_martinez_desc:0 "托马斯·马丁内斯是阿根廷陆军军官，1875年生于科尔多瓦。1927年，其陆军准将晋升获批。1930年乌里武鲁领导的政变后，马丁内斯任陆军总监察长。1931年，他代表临时总统率政府代表团出席里奥夸尔托的圣马丁纪念碑揭幕式。1946年3月，报纸报道了他去世的消息。"
 CBIO_HOI120_tuka_common_revision_desc:0 "沃伊捷赫·图卡（1880—1946）生于什佳夫尼茨凯巴涅，曾在佩奇和布拉迪斯拉发教授法律。捷克斯洛伐克成立后，他加入斯洛伐克人民党，成为党内激进派人物。1929年，他因叛国和间谍罪被判处十五年徒刑。斯洛伐克获得自治后，他重返政坛。1939年10月任斯洛伐克总理，1940年夏萨尔茨堡会谈后兼任外交部长，推动斯洛伐克进一步依附纳粹德国。其政府于1941年颁布反犹太法令。1942年，斯洛伐克当局将约五万七千名犹太人驱逐至德国占领下的波兰，绝大多数人随后遭到杀害。1944年9月，图卡退出政府。战后，他被布拉迪斯拉发的国民法院判处死刑，1946年8月20日被处决。"
 CBIO_HOI120_urrengoetxea_desc:0 "路易斯·乌伦戈埃切亚是西班牙比斯开地方政治家，早年领导毕尔巴鄂的巴斯克青年组织。1914年至1916年，他担任阿莫雷别塔市长，是当地首位来自巴斯克民族主义党的市长。他任内开始在地方公告和公示中同时使用西班牙语和巴斯克语。离开市政府后，他于1917年至1919年在比斯开省议会任职。"
 CBIO_HOI120_vacietis_desc:0 "尤库姆斯·瓦采季斯，1873年11月23日生于今拉脱维亚。第一次世界大战时，他在俄罗斯帝国陆军服役，曾指挥第五泽姆加莱拉脱维亚步枪团。十月革命后，他担任苏俄红军拉脱维亚步枪师师长，1918年至1919年出任苏俄武装力量总司令，其间兼任苏维埃拉脱维亚军队总司令。离任后，他在军事院校任教。大清洗期间，他遭逮捕，1938年7月28日在莫斯科附近被枪决。"
 CBIO_HOI120_valentin_drozd_desc:0 "瓦连金·彼得罗维奇·德罗兹德（1906—1943）出生于莫吉廖夫省布达-科舍廖沃，1928年毕业于伏龙芝海军学校。他在西班牙内战中服役，1937年回国后指挥波罗的海舰队的驱逐舰旅，1938年出任北方舰队司令。1941年，他重新在波罗的海舰队任职并指挥该舰队的舰艇编队，参加汉科守军撤离和列宁格勒防御。1943年冬，他从喀琅施塔得乘车返回列宁格勒途中，车辆坠入冰面裂口，他因此遇难。"
 CBIO_HOI120_valentino_riroroko_tuki_desc:0 "瓦伦蒂诺·里罗罗科·图基于1932年生于拉帕努伊，是当地统治者西梅翁·里罗·凯因加的孙子。青年时期，他曾与亲友乘小艇离岛，抵达库克群岛，后来在智利大陆生活，从事手工艺和民俗表演。1974年，他回到拉帕努伊。2011年，拉帕努伊议会推举他为传统领袖。他以此身份向智利法院起诉，要求解除1888年拉帕努伊与智利签订的协议，瓦尔帕莱索上诉法院于2014年维持驳回诉请的判决。"
 CBIO_HOI120_vallabhbhai_patel_desc:0 "瓦拉巴伊·帕特尔（1875—1950）出生于古吉拉特，在英国学习法律，回国后在艾哈迈达巴德执业并参加印度国民大会党的独立运动。1928年，他领导巴尔多利农民反对提高地税，获称「萨达尔」。1931年，他主持国大党卡拉奇大会。印度独立后，他任首任副总理兼内政部长，与国务部秘书门农等人推动多个土邦并入印度联邦，1950年12月在孟买去世。"
 CBIO_HOI120_vasile_atanasiu_desc:0 "瓦西里·阿塔纳休（1886—1964）生于特尔戈维什泰，受过炮兵军官训练。第一次世界大战期间，他先后带领炮兵连和炮兵营，后进入罗马尼亚军队大本营。战间期，他在总参谋部任职，并在炮兵训练机构主管教学。1941年罗马尼亚对苏开战时，他指挥第三军，后来负责陆军炮兵事务。罗马尼亚转向同盟国后，他于1945年2月接掌第一集团军，指挥部队在捷克斯洛伐克作战至战争结束。1948年，他离开现役。"
 CBIO_HOI120_vasile_luca_desc:0 "瓦西里·卢卡（1898—1963）早年参加罗马尼亚共产主义运动，战间期在地下党中央任职。第二次世界大战期间，他曾任苏维埃乌克兰最高苏维埃代表，并在苏联境内组建的罗马尼亚“图多尔·弗拉迪米雷斯库”师服役。1947年11月，他出任罗马尼亚财政部长，后来兼任部长会议副主席。1952年党内清洗期间，他失去职务，被指控破坏国家经济。法院判处他死刑，随后减为终身苦役。他在狱中多次致信昔日同僚请求赦免，1963年死于艾乌德监狱。"
 CBIO_HOI120_vasili_levonen_desc:0 "瓦西里·列沃宁出生于东卡累利阿通夸一带，在俄文登记中使用瓦西里·西多罗夫一名，人们也称他为「乌基·韦伊内默伊宁」。他年轻时自学读写，后来做过往返东卡累利阿与芬兰的行商。1921年秋，东卡累利阿爆发反对苏维埃俄国管辖的起义，列沃宁是推动者之一，曾代表当地组织参与卡累利阿驻外代表团。起义失败后，他与妻子越境进入芬兰，此后定居沃卡蒂，1942年在那里去世。"
 CBIO_HOI120_vasily_sokolovsky_desc:0 "瓦西里·达尼洛维奇·索科洛夫斯基（1897—1968）出生于别洛斯托克附近的科兹利基村。1918年加入红军并参加俄国内战，随后长期从事参谋工作。德国入侵苏联后，他曾任西方面军参谋长，参与莫斯科方向的防御和反攻，1943年出任西方面军司令。1944年，他调任乌克兰第一方面军参谋长，后任白俄罗斯第一方面军副司令并参加柏林战役。战后，他曾任驻德苏军总司令和苏军总参谋长，1946年获苏联元帅军衔。"
 CBIO_HOI120_victor_schmidt_desc:0 "维克托·施密特1882年生于布拉索夫，早年在奥匈海军服役。第一次世界大战末期，他在多瑙河舰队指挥扫雷部队。1919年，他进入罗马尼亚海军，先后担任海上舰队参谋长、驱逐舰队司令和海军学校负责人。1936年底，他接掌黑海沿岸的海军部队。次年晋升海军少将，率“玛丽亚王后”号驱逐舰赴英国参加乔治六世加冕庆典。1939年10月，他转入预备役。"
 CBIO_HOI120_victor_slavescu_desc:0 "维克托·斯拉韦斯库（1891—1977）是罗马尼亚经济学家、自由党议员。他在布加勒斯特的经济学院任教，研究银行和信贷问题，也把学术生涯中的一部分时间用于政府事务。1934年至1935年，他担任财政部长。欧洲战争爆发前后，他又负责军备采购，在经费和国外供货受限的条件下为罗马尼亚军队筹措装备。1950年，他遭逮捕并被送往锡盖特监狱，拘禁期限经行政决定延长。1955年他获释，1977年在布加勒斯特去世。"
 CBIO_HOI120_victor_vinas_roman_desc:0 "维克托·埃尔比·比尼亚斯·罗曼是多米尼加陆军军官。1962年，他由陆军上校晋升准将，并在出任武装部队国务秘书期间以少将军衔履职。1963年9月，在推翻总统胡安·博什的政变中，他是参与夺权的高级军官之一。此后他继续担任武装部队国务秘书，1965年初仍以此职出席国家仪式并主持国家警察总监的就职仪式。"
 CBIO_HOI120_videla_cobo_desc:0 "豪尔赫·魏地拉·托博，1898年生，智利海军军官。1917年从智利海军学校毕业，后来指挥过“魏地拉”号和“里克尔梅”号驱逐舰，并曾执掌驱逐舰队。1943年，他出任智利战列舰“拉托雷海军上将”号舰长，次年转任海军学校校长。战后他先后主管海域与商船事务和海军事务保障，并于1952年出任驻华盛顿海军代表团负责人。他官至海军少将，1955年退役，1981年去世。"
 CBIO_HOI120_vilhjalmur_thor_desc:0 "维尔希奥米尔·索尔（1899—1972）早年在阿克雷里从事合作社工作，1940年进入冰岛国家银行管理层。1942年，他出任比约恩·索尔达松内阁的外交与产业部长，1944年离任后回到银行业。1946年至1954年，他主持冰岛合作社联盟。1961年冰岛中央银行按新法成立时，他获任该行行长。"
 CBIO_HOI120_vilko_begic_desc:0 "维勒库·贝基奇1874年出生于查兹马，曾任奥匈帝国军队军需上校。第一次世界大战后，他从事报刊工作，因反对南斯拉夫王国政权多次被捕，并曾与克罗地亚农民党领袖弗拉德科·马切克共事。1941年克罗地亚独立国成立后，他担任国民卫队部国务秘书，1943年任该部副部长，并进入乌斯塔沙领导机构。1944年获中将军衔，1945年4月晋升上将，此后的下落缺少可靠记载。"
 CBIO_HOI120_virgil_madgearu_desc:0 "维吉尔·马德盖鲁（1887—1940）出生于加拉茨的商人家庭，曾在莱比锡大学求学。回国后，他在布加勒斯特的高等商业与工业学院教授经济学，研究工人保险、农民合作社和罗马尼亚的农业经济。他先后担任农民党和国家农民党总书记，也在数届内阁里执掌工商、农业和财政事务。政治活动之外，他参与创办经济与社会研究刊物，并推动设立研究经济形势的机构。1940年11月27日，铁卫团成员在斯纳戈夫森林将他杀害。"
 CBIO_HOI120_vitkauskas_desc:0 "温察斯·维特考斯卡斯，1890年10月4日生于乌日巴利艾，曾在俄罗斯帝国陆军服役，1919年加入立陶宛军队并参加独立战争。1939年，他指挥第一步兵师和进入维尔纽斯的部队，1940年升任立陶宛军队司令。苏联发出最后通牒时，他反对武装抵抗。苏军占领后，他出任人民政府的国防部长，随后指挥编入苏联红军的第二十九领土步枪军，官至中将。此后曾在莫斯科总参谋部军事学院任教，1965年3月3日卒于考纳斯。"
 CBIO_HOI120_vladimir_kren_desc:0 "弗拉迪米尔·克伦（1903—1948）出生于瓦什卡，原为南斯拉夫王国空军飞行员。1941年4月，轴心国入侵南斯拉夫前夕，他驾机飞往奥地利格拉茨。乌斯塔沙建立克罗地亚独立国后，他负责组建该国空军并任指挥官。1943年他离任，1944年重新掌管空军。战后，他因任内多项罪行在萨格勒布受审，判决涉及针对平民的杀戮、轰炸居民点和强制迁移。1948年，他被判处死刑并遭处决。"
 CBIO_HOI120_vladimir_laxa_desc:0 "弗拉迪米尔·拉克萨（1870—1945）出生于锡萨克，毕业于奥匈帝国特蕾西亚军事学院。第一次世界大战前，他曾任奥匈驻索菲亚武官，战时在意大利战线指挥步兵旅，1917年晋升少将。1941年克罗地亚独立国建立后，他先后出任陆军副指挥官、指挥官和国民卫队总参谋长，曾负责镇压黑塞哥维那东部的塞族起事。1942年他被撤职，次年退役。1945年5月，盟军将他引渡给南斯拉夫当局。他在萨格勒布被判处死刑，于同年6月23日去世。"
 CBIO_HOI120_voloshyn_common_revision_desc:0 "奥古斯丁·沃洛申（1874—1945）生于喀尔巴阡地区的凯莱钦村，是希腊礼天主教神父、教育家和政治人物。他长期在乌日霍罗德从事师范教育，也曾当选捷克斯洛伐克国会议员。1938年10月，他出任喀尔巴阡地区自治政府总理。1939年3月14日，匈牙利军队开始越境进攻，沃洛申在当天宣布喀尔巴阡乌克兰独立。次日，议会确认独立并选举他为总统。匈牙利军队攻入胡斯特后，他经罗马尼亚辗转赴布拉格，在乌克兰自由大学任教。1945年5月，他在布拉格被苏联方面拘捕，后被押往莫斯科，同年7月死于布蒂尔卡监狱。"
 CBIO_HOI120_wallis_desc:0 "沃利斯·辛普森原姓沃菲尔德，1896年生于美国。她结识当时的威尔士亲王爱德华，两人后来计划结婚。1936年，已成为国王的爱德华八世坚持迎娶曾离婚的辛普森，引发宪政危机，同年12月退位。两人于1937年在法国成婚，辛普森成为温莎公爵夫人。第二次世界大战期间，温莎公爵出任巴哈马总督，她随同前往。战后，两人长期定居法国。她于1986年在巴黎去世。"
 CBIO_HOI120_wavell_common_revision_desc:0 "阿奇博尔德·韦维尔（1883—1950）是英国陆军元帅，毕业于桑德赫斯特皇家军事学院，参加过第二次布尔战争和第一次世界大战，并于1915年在伊普尔负伤。1939年出任中东战区总司令，1940年底指挥英军在北非对意军反攻。1941年转任印度总司令，次年一度统辖在东南亚作战的美、英、荷、澳联合司令部。英国政府于1943年6月宣布由他接任印度总督，他在同年10月就任，任初正值孟加拉饥荒。1945年6月，他公开提出改组总督行政参事会的方案，并在西姆拉与印度各方政界领袖协商，会议未能达成协议。1947年3月，他将总督职务交给路易斯·蒙巴顿，1950年去世。"
 CBIO_HOI120_werner_gerlach_desc:0 "维尔纳·耶拉克（1891—1963）是德国病理学家，曾在巴塞尔和耶拿任教。他加入党卫队，在耶拿任医学院院长期间，曾受党卫队委托解剖布痕瓦尔德集中营的死者。二战初期，他担任德国驻冰岛总领事，1940年英军登陆冰岛后被扣押。战争结束时，他又被美方拘押，获释后在德国继续从事病理检验。"
 CBIO_HOI120_zawde_gobena_desc:0 "扎沃德·戈贝纳是埃塞俄比亚军官。青年时代，他与后来即位的塔法里·马康南等人在亚的斯亚贝巴一同学习，后来获得菲塔乌拉里称号。1916年，伊亚苏被废黜，沃洛统治者米卡埃尔率军南下。戈贝纳随拉斯·卢尔·萨加德率领的部队出迎，同年10月17日在托拉马斯克一带的战斗中阵亡。"
 CBIO_HOI120_zhang_xiliang_desc:0 "张希良是民国时期在新疆任职的军官，曾任骑兵第十二师师长，部队驻防喀什、和田一带。该师由新疆原有骑兵团扩编。伊宁事变期间，战事波及南疆。1945年9月，他就蒲犁一带的战况发电，电报内容由朱绍良、郭寄峤转报蒋介石。"
 CBIO_HOI120_zhansugurov_desc:0 "伊利亚斯·詹苏古罗夫，1894年生，是哈萨克诗人和作家。他从事新闻、文学创作与翻译，作品常写到草原社会和哈萨克民间文化。1934年至1936年，他担任哈萨克作家协会首任主席。长诗《库拉格尔》取材于民间歌手阿坎和他的赛马，是其代表作之一。1937年大清洗期间，詹苏古罗夫被捕，翌年遭枪决。"
 CBIO_HOI120_zia_desc:0 "穆罕默德·齐亚·哈克是巴基斯坦军官，1976年出任陆军参谋长。1977年3月，巴基斯坦大选结果引发政府与反对派对峙。7月，他率军发动政变，罢黜总理佐勒菲卡尔·阿里·布托，实行军事管制，次年就任总统。执政期间，他推动法律制度的伊斯兰化。苏联出兵阿富汗后，巴基斯坦成为美国等国援助阿富汗抵抗组织的重要通道。1988年8月17日，他在一次飞机坠毁中身亡。"
