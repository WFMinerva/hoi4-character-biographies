 CBIO_GRE_vasilios_tsarpalis_desc:0 "瓦西利奥斯·察尔帕利斯，一八八九年生，希腊军事航空军官，后晋升空军少将。小亚细亚战争期间，他已在前线航空部队任职。一九二一年春，希腊陆军航空第二飞行中队从士麦那附近调往乌沙克，配属南方师群作战，部队装备布雷盖与斯帕德飞机，由时任上尉的察尔帕利斯接任中队长，负责整顿中队并补充飞行员与观察员。此后他继续留在希腊军事航空系统内任职。一九四〇年十月希意战争爆发后，希腊空军以数量和装备均处劣势的力量支援阿尔巴尼亚战线。同年十二月九日，察尔帕利斯接替帕纳约蒂斯·加齐斯，出任希腊空军总参谋长，负责战时空军指挥与机关运转。其任期正处在希腊抵抗意大利进攻后、德国即将介入巴尔干战局的关键阶段。一九四一年四月六日德军入侵希腊，他的总参谋长任期也随之结束。战后他仍活跃于航空领域，曾任希腊民航公司顾问。一九六五年去世。"
