l_simp_chinese:
 CHI_chu_chia_jen_desc:0 "1900年生，浙江嘉兴人，航空工程师。早年留学美国学习航空，回国后长期在中国的飞机制造与设计部门工作。抗战时期，他参与后方的飞机制造与维修，是中国自主航空工业起步阶段的技术骨干之一。他尤以直升机研制见长，后来主持设计了中国最早的共轴双旋翼直升机，是中国直升机技术的开拓者。"
 CHI_soong_ching_ling_desc:0 "1893年生，原籍广东文昌，生于上海，孙中山夫人。早年留学美国，1915年与孙中山结合并投身革命。孙中山逝世后，她坚持联俄、联共、扶助农工的政策主张，成为国民党左派的代表人物。1927年宁汉分裂后，她公开反对蒋介石与汪精卫，一度旅居莫斯科、柏林。回国后发起中国民权保障同盟，营救政治犯，抨击内战与压制。抗战时期，她在香港组织保卫中国同盟，为前线和敌后根据地争取国际援助与医药物资。作为宋氏三姐妹之一，她与执掌中央的蒋介石、宋美龄关系复杂，长期处于国民政府体制的对立面，却具有无可替代的政治象征地位。"
 CHI_wang_ganchang_desc:0 "1907年生，江苏常熟人，核物理学家。早年留学德国柏林大学，师从迈特纳从事核物理研究，1930年代回国，任教于山东大学、浙江大学等校，是中国最早一批受过系统训练的核物理学者之一。抗战期间，他随浙江大学西迁，在艰苦条件下坚持教学与研究，培养了一批物理人才，并在中微子探测、宇宙线等领域提出过有影响的设想。"
 CHI_wong_tsu_desc:0 "1893年生，福建闽侯人，航空工程先驱。早年赴英、美求学，毕业于美国麻省理工学院航空工程专业，曾受聘为波音公司首任总工程师，主持设计了波音早期的水上飞机。回国后，他长期在海军马尾飞机工程处等机构从事飞机设计与制造，培养了一批中国早期航空技术人才，被视为中国近代航空工业的奠基人之一。"
 CHI_xu_tingyao_desc:0 "1892年生，安徽无为人。黄埔系将领，1933年长城抗战中率第十七军在古北口一线对日苦战。此役使他深感中国军队装备与机械化的落后，此后成为国军机械化与装甲兵建设的主要推动者，主持组建陆军交辎学校、机械化学校，培养装甲与摩托化人才，并赴欧美考察坦克部队。1936年前后，他代表着中央军内部一条追求技术化、机械化改革的路线。在以步兵为主、装备落后的国军体系中，徐庭瑶所经营的装甲兵种虽规模有限，却是中国早期机械化作战力量的源头。"
 CHI_zhang_lan_desc:0 "1872年生，四川南充人，教育家、立宪派出身的社会活动家。清末参与四川保路运动，民国后长期从事教育，曾任成都高等学校校长，在川省士绅与知识界中威望甚高。1930年代以后，他逐渐成为国共两大势力之外'第三种力量'的代表，主张民主、宪政与和平。抗战期间，他参与发起中国民主政团同盟（后改组为中国民主同盟）并长期担任领导，呼吁团结抗战、反对一党专政。作为无兵无地的旧式名儒型政治家，张澜的分量不在军政实力，而在其所象征的民主党派与中间力量。"
 CHI_zheng_qi_desc:0 "1892年生，四川隆昌人，中国青年党的主要创始人与领袖之一。1923年，他与李璜等人在巴黎组建青年党，奉行国家主义，既反对国民党一党专政，也坚决反对共产党。回国后长期主持青年党党务与言论，使其成为国共两大党之外较有组织的政党力量。抗战时期，青年党参加国民参政会，主张一致对外，同时争取民主与多党政治。"
 GSM_ma_yuanxiang_desc:0 "回族将领，西北马家军系统出身，1930年代随马仲英部进入新疆。在马仲英的国民军第三十六师麾下参与哈密事变后的新疆战事，转战南北疆。马仲英退入苏联后，他随残部继续在南疆活动。马元祥的部队在甘、新之间往来征战，是搅动新疆局势的重要武装力量之一。"
 HBC_wu_peifu_desc:0 "1874年生，山东蓬莱人，秀才出身，直系军阀首领，人称'玉帅'。1920年代前期，他一度掌握北洋政府实权，控制华北、华中广大地区，是直系最具实力的统帅。第二次直奉战争中因部下倒戈而失势，北伐战争中其势力被彻底击溃，此后退出军政舞台。1936年，吴佩孚以失势旧军阀的身份寓居北平，仍保有相当声望。日本侵华后，他拒绝出任日伪政权首脑，1939年病逝。"
 KHM_khoya_niyaz_desc:0 "维吾尔族首领，1931年哈密暴动的主要发动者之一，是1930年代新疆动乱中举足轻重的人物。哈密事变后，他率维吾尔武装与省军及马仲英势力周旋。1933年他被推举为南疆名义上的领袖，但旋即与之疏离。转而与新省主席盛世才合作，出任新疆省政府副主席等职。1937年前后，在盛世才的大清洗中，他被指控阴谋而遭逮捕处决。"
 KHM_ma_shaowu_desc:0 "回族官员，民国时期新疆南部的重要地方长官。1924年，他奉杨增新之命袭取喀什，擒杀割据当地的回族军阀马福兴，因功升任和田道尹，统辖叶城至敦煌一带。此后长期任喀什行政长，是杨增新、金树仁体系下镇守南疆的实力人物。1933年前后新疆大乱，马绍武率部抵御马仲英势力与各地起事武装，终在动荡中遇害。"
 KHM_ma_zhancang_desc:0 "回族军事首领，新疆焉耆一带的回民武装头目。1933年新疆大乱期间，他与维吾尔武装首领铁木耳联手，攻占轮台、库车、拜城、库尔勒、阿克苏等南疆城镇，是马仲英势力之外搅动南疆的重要回民武装之一。"
 KHM_mahmut_muhiti_desc:0 "维吾尔族将领，1930年代盛世才统治下新疆南部的主要军事人物。长期统领驻喀什的维吾尔族部队，名义上服从迪化省政府，实则在南疆保有相当的自主势力，是省方与维吾尔上层之间脆弱平衡的关键一环。1937年，他因不满盛世才日益亲苏与高压统治而出走境外，其部随即在南疆发动反盛起事，成为盛世才借机大规模清洗、苏军直接介入新疆的导火索之一。"
 KHM_muhammad_amin_bughra_desc:0 "维吾尔族民族主义者，1930年代和田起事的主要领导人之一。1933年，他与兄弟等在和田发动起义，主张建立独立的伊斯兰国家。该政权瓦解后，他流亡境外，长期从事维吾尔民族主义活动，立场坚决反苏、反共。后来他一度与国民政府合作，晚年继续在海外推动其政治主张。"
 KHM_peter_fleming_desc:0 "英国旅行作家与《泰晤士报》记者，著名间谍小说家伊恩·弗莱明之兄。1935年前后，他穿越中国西北，由内地经青海、新疆抵印度，记录了动乱中的新疆与中亚见闻，著有游记《鞑靼来鸿》。作为一名外来的观察者与冒险旅行者，弗莱明并非新疆政局中的实际角色，而是经由其旅行与著述，将1930年代封闭、混乱的新疆呈现于西方读者面前。"
 MEN_kyoiji_tomonaga_desc:0 "1892年生，日本陆军将领。1930年代曾在关东军任参谋，参与策划侵华与对满蒙的军事行动，是日本少壮派军官的代表之一。其性格强硬、行事专断，在日本陆军内部颇具争议。在东北，富永恭次把持关东军，推动对华扩张。其后他在太平洋战争中续任高级指挥，因擅自撤离菲律宾战场而备受批评。"
 MEN_nakajima_kesago_desc:0 "1881年生，日本陆军将领。1937年侵华战争中，他指挥第十六师团参加进攻南京的作战，该部在南京大屠杀中负有重大责任，中岛本人因此成为南京大屠杀相关的关键军事指挥官之一。"
 MON_khorloogiin_choibalsan_desc:0 "1895年生，外蒙古东部人，蒙古人民革命党领袖，1921年参加蒙古人民革命。20世纪30年代，他在苏联支持下逐步清除党内对手，成为蒙古人民共和国的最高领导人，集党政军大权于一身，被授元帅军衔。他全面追随斯大林，1937年至1939年间在蒙古推行大规模清洗，处决大批僧侣、旧贵族与党内异己。"
 MON_lee_shou_hsin_desc:0 "1892年生，内蒙古卓索图盟土默特旗人，蒙古族。早年为东北军骑兵军官，九一八事变后投靠日本，成为日本在内蒙古扶植蒙古武装的主要军事代理人。他与德王长期合作，1936年前后参与组建察哈尔盟公署、蒙古军政府等亲日政权，统领蒙古伪军，是蒙疆地区最重要的蒙古族军事首领，其部队配合日军进行扩张与'治安'，与中央军及晋绥军对抗。"
 SIC_liu_wenhui_desc:0 "1895年生，四川大邑人，川军将领，刘湘的族叔。在四川军阀长期混战中，他一度控制成都与川西大部，势力鼎盛。1932年至1933年，他与侄子刘湘爆发'二刘大战'，战败后退守川边，转而经营西康，出任西康省主席，以雅安为中心统辖康藏交界的广大地区。1936年，刘文辉名义服从南京，实际据康自重，依靠地方部队、税收与汉藏上层关系维持半独立局面。他长于在中央、川系、西藏与地方势力之间周旋，是西南边地最具代表性的实力派之一。"
 SIK_sheng_shiqi_desc:0 "辽宁开原人，新疆边防督办盛世才的四弟。早年就读于日本士官学校骑兵科，1930年代到新疆投奔盛世才，任督署卫队团长，后赴莫斯科苏联红军大学深造。学成回疆后，他出任新疆机械化旅旅长，统领当时新疆唯一的机械化部队，在以骑兵、步兵为主的省军中地位特殊。盛世骐思想倾向苏联与中共，对其兄的专断屡有不满。1942年3月，他在迪化中枪身亡，盛世才借此案大肆株连，逮捕处死大批军政人员。其死成为新疆政局由亲苏转向重庆的转折点之一。"
 TIB_lungshar_desc:0 "1881年生，西藏贵族官员，近代西藏少有的改革派人物。他早年曾随团赴英国考察，对西方制度有所了解，主张限制贵族与寺院的特权、推行类似议会的改革。十三世达赖喇嘛圆寂后的权力重组中，他试图扩大权力、推动变革，结果于1934年被保守势力以谋逆罪逮捕，并处以挖去双眼的酷刑，其子拉鲁·才旺多吉后亦为噶厦要员。"
 YUN_liu_wenhui_desc:0 "1895年生，四川大邑人，川军将领，刘湘的族叔。在四川军阀长期混战中，他一度控制成都与川西大部，势力鼎盛。1932年至1933年，他与侄子刘湘爆发'二刘大战'，战败后退守川边，转而经营西康，出任西康省主席，以雅安为中心统辖康藏交界的广大地区。1936年，刘文辉名义服从南京，实际据康自重，依靠地方部队、税收与汉藏上层关系维持半独立局面。他长于在中央、川系、西藏与地方势力之间周旋，是西南边地最具代表性的实力派之一。"
