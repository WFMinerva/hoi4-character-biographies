l_simp_chinese:
  # B02_CZE_捷克斯洛伐克：用户人工审核最终文本回写。
  # 仅写入人物小传正文；已清理 Markdown/审稿格式、中文日期空格，并保留西文姓名与组织名空格。
 CBIO_CZE_jaroslav_krejchi_desc:0 "1892年6月27日生于摩拉维亚克热梅内茨，1956年5月18日死于狱中，捷克裔法学家，纳粹合作者。1915年毕业于布拉格查理大学法学院，此后长期在文官系统任职，自1930年代起兼任布尔诺马萨里克大学宪法法学讲师，1938年升任正教授。1938年12月12日出任第二共和国贝兰政府司法部长兼宪法法院院长，至1939年3月3日；保护国建立后，他又历任各届保护国政府司法部长，并一度代掌农业部。1941年9月，总理阿洛伊斯·埃利亚什因秘密联络流亡政府遭海德里希逮捕（翌年6月处决），克雷伊奇随即被委以总理职位，正式就任于1942年1月19日。在他主持下，傀儡政府配合纳粹当局推行劳动力动员，驱使捷克工人大批赴德服役；政府亦颁行各类行政法规，为占领机器的日常运转提供行政支撑。1945年1月19日去职，由理查德·比内特接任。战后以通敌罪被判处25年监禁，1956年5月18日死于狱中。其子、同名社会学家（1916—2014）与父亲的合作路线截然相反，积极参与抗德地下运动，战后任教于英国兰卡斯特大学。"
 CBIO_CZE_karel_vaclav_petrik_desc:0 "1885年8月16日生于波希米亚内兹迪采（今捷克），1957年7月8日卒，捷克裔将领。一战爆发时正旅居俄国基辅，于1914年8月30日加入捷克志愿兵团，历经东线多处战役，1918年升任第9捷克步兵团团长并晋衔上校。战后历任第5师师长及布拉格土地军区副司令达十余年；1938年慕尼黑危机期间指挥亚什至特普利采一线边境防御，1940年1月1日被编入退役。德国占领期间秘密参与抵抗运动，1948年后一度遭共产当局短暂羁押。"
 CBIO_CZE_klement_gottwald_desc:0 "1896年11月23日生于摩拉维亚杰迪采（今属维什科夫市，另说胡什蒂采-赫罗尔蒂采），1953年3月14日卒于布拉格，捷克共产革命家。出身贫苦，12岁赴维也纳学木匠，在社会民主党青年运动中走向左翼；一战期间服役奥匈军（1915—1918），战末脱逃。1921年参与创建捷克斯洛伐克共产党，任布拉迪斯拉发党报编辑；1925年进入党中央委员会，1929年第五次党代会上与“卡尔林小子”团队一同当选总书记，推行布尔什维克化并入主国会。1935年起任共产国际书记，主导反法西斯人民阵线路线。1938年11月KSČ遭取缔后流亡莫斯科，1943年与贝奈什商定战后联合政府框架。1945年5月回国出任副总理；1946年3月当选党主席，同年5月大选中率KSČ以约38%得票成为第一大党，7月3日就任总理。1948年2月25日迫使总统贝奈什接受共产党主导新政府（“二月事件”），6月14日正式出任捷克斯洛伐克首位共产党总统。任内推行国有化与农业集体化，发动斯大林式政治清洗，1952年12月将党总书记斯兰斯基等人送上绞架。1953年3月9日赴莫斯科出席斯大林葬礼，归途染疾，3月14日在斯大林身后九天去世。"
 CBIO_CZE_zdenek_fierlinger_desc:0 "1891年7月11日生于摩拉维亚奥洛穆茨，1976年5月2日卒，捷克裔外交官与政治家。一战期间参加捷克斯洛伐克军团（曾参与兹博罗夫战役），战后入驻外交部，历任驻荷兰、罗马尼亚、美国、瑞士、奥地利使节，1924年加入社会民主党。1937—1945年出任驻苏联大使，1943年代表流亡政府签署捷苏友好互助条约；1945年4月—1946年7月出任总理，任内秘密签署向苏联供应雅希莫夫铀矿协议。因其亲苏立场，1948年后他协助推动社会民主党并入共产党，本人转为KSČ党员，1954—1964年出任国民议会议长。"
 CBIO_CZE_zdenko_hudecek_desc:0 "1887年6月22日生于波希米亚泰雷津（旧奥匈要塞城），1974年9月28日卒于雅布伦科夫，捷克裔奥匈帝国海军军官。毕业于阜姆（今里耶卡）帝国皇家海军学院，1910年起任职奥匈舰队多型战舰。一战期间以潜艇指挥官著称，共击沉11艘协约国商船及2艘军舰、总吨位44,743总注册吨，位居奥匈潜艇王牌第二。战后意大利以战争罪名要求引渡，被捷克斯洛伐克政府拒绝。1918年12月加入捷克斯洛伐克海军部队，至1921年海军解散后退役，转任捷克斯洛伐克多瑙河公司货轮船长，直至终老。"
 CBIO_CZE_lev_prchala_desc:0 "1892年3月23日生于西里西亚奥斯特拉瓦，1963年6月11日卒于奥地利费尔德巴赫，捷克裔将领。一战参加捷克斯洛伐克军团，战功卓著，两战之间历任多职，最终晋升陆军上将。1938年9月慕尼黑危机期间指挥布尔诺第四军团；1939年1月出任卡尔帕提亚路塞尼亚自治政府部长，德国占领后被迫退役。1939年5月秘密携家出逃波兰，组建捷克斯洛伐克军团，9月遭苏军逮捕后获释，经罗马尼亚辗转于1940年抵英。与贝奈什流亡政府矛盾尖锐，另组反共流亡团体；战后被褫夺上将军衔，此后流亡至终。"
 CBIO_CZE_bohumir_smeral_desc:0 "1880年10月25日生于摩拉维亚特热比奇，1941年5月8日卒于莫斯科，捷克政治家、工人运动领袖。青年时投身社会民主运动，一战前后成为捷克斯洛伐克社会民主党核心领导人，主持对党的左翼建设，建国后长期任国会议员，推动劳工立法。1921年，他是推动社民党激进左翼分裂、另建捷克斯洛伐克共产党的最重要人物之一，出任党领导人，并进入共产国际执行委员会，此后多年以共产国际工作人员身份活跃于东欧左翼政治，被视为莫斯科与KSČ之间的关键协调人。1930年代随着纳粹威胁加剧，他积极倡导国内反法西斯统一战线。1938年9月慕尼黑协定签署、KSČ境内组织遭取缔后，什梅拉尔流亡苏联，未能亲见故土光复，1941年5月8日在莫斯科去世。"
 CBIO_CZE_bohumil_lausman_desc:0 "1903年8月30日生于波希米亚容贝尔克，1963年5月9日卒于布拉格鲁济尼耶监狱，捷克社会民主党人。银行职员出身，1935—1939年任国会议员，1938年兼任劳动国家党总书记。1939年12月流亡英国，1940—1945年任伦敦国务会议成员，并于1944年参与斯洛伐克民族起义。战后历任工业部长（1945—1947），1947年11月当选社民党主席。1948年2月危机中摇摆不定，接受哥特瓦尔德内阁副总理职，客观上助长了共产党夺权。其后再度出走，1953年12月23日被国家安全局特工从萨尔茨堡流亡寓所强行绑架遣返，此后在政治羁押中以不明原因死去。"
 CBIO_CZE_karel_kuttelwascher_desc:0 "1916年9月23日生于波希米亚圣克日斯（今哈夫利切夫布罗德地区），1959年8月17日卒，捷克裔飞行王牌。1934年加入捷克斯洛伐克空军；德国占领后辗转经波兰、法国抵英，1941年10月加入英国皇家空军第1中队。1942年专攻夜间袭扰任务，驾驶飓风式战斗机于德占法国上空三个月内击落15架，全战确认击落18架，获两度杰出飞行十字勋章，为捷克裔RAF飞行员最高战绩、亦是皇家空军效率最高的夜间袭扰王牌之一。1959年因心脏病去世，2000年被捷克共和国追授准将军衔。"
 CBIO_CZE_kamil_krofta_desc:0 "1876年7月17日生于皮尔森，1945年8月16日卒，捷克历史学家与外交官。查理大学历史系毕业，1901年起供职国家档案馆，1911年起任大学奥地利史及捷克史教授。外交方面，1920年出任首位驻梵蒂冈使节（促成两国建立正式外交关系），此后历任驻维也纳（1922—1925）、驻柏林（1925—1927）公使。1927年起任外交部总统处长，为外长贝奈什核心顾问；1936年2月29日升任外交部长，至1938年10月4日慕尼黑危机后辞职。保护国期间投身抵抗运动，1944年被捕，辗转关押于潘克拉茨及特里斯因，1945年获救后不久因狱中所受迫害而去世。"
 CBIO_CZE_karel_janousek_desc:0 "1893年10月30日生于摩拉维亚普热罗夫，1971年10月27日卒于布拉格，捷克空军将领、迄今唯一荣获英国空军元帅衔的捷克斯洛伐克人。一战参加捷克军团，1926年转入空军取得飞行执照，1939年获自然科学博士学位。1940年6月抵英，主持建立RAF捷克斯洛伐克空军督察部，统辖310、311、312、313四个中队逾3,000名航空员，由英王乔治六世授予英浴勋章，1945年5月17日晋升空军元帅。1948年政变后遭迫害，初判18年并被褫夺军衔、博士学位及全部勋章，刑期后递加至无期，1955年减为25年，1960年获总统大赦出狱；1971年去世，其妻及多名家属死于纳粹关押。"
 CBIO_CZE_karel_domin_desc:0 "1882年5月4日生于波希米亚库特纳霍拉，1953年6月10日卒于布拉格，捷克裔植物学家。1906年毕业于布拉格查理大学植物系，1916年起任植物学正教授，在大学创立植物学研究所，专攻植物地理学与分类学。1909—1910年赴澳大利亚昆士兰考察，1911—1913年发表系列澳洲植物分类论文；他发展的“多明等级”（衡量特定面积内植物种数的标准量表）在国际上广为使用。1933—1934年出任查理大学校长，参与捷克德两所大学之间因古典校徽归属而引发的“校徽事件”争执。纳粹占领期间遭受学术迫害。"
 CBIO_CZE_karel_pavala_desc:0 "生卒年不详，捷克斯洛伐克河川舰队军官。捷克斯洛伐克海军规模有限，1921年起其水上部队编为隶属陆军第4工兵团的“水上营”，以多瑙河—布拉迪斯拉发一线防务为主。帕瓦拉在这支多瑙河河川舰队中任职，并见于记载为旗舰级河川巡逻舰（监视舰）“马萨里克总统号”的指挥官——该舰1932年正式服役，是两战之间捷克斯洛伐克最大的战斗舰艇，长约50米、排水量约214吨，装备四门66毫米炮，常率队出航演训；慕尼黑协定后失去防御价值，德国占领后被编入德军多瑙河区舰队并改名Bechelaren。帕瓦拉是捷克斯洛伐克有限的多瑙河防务体系中的实际指挥人物之一。"
 CBIO_CZE_karel_englis_desc:0 "1880年8月17日生于西里西亚赫拉比涅（奥帕瓦区），1961年6月13日卒于同地，捷克裔经济学家与政治家，目的论经济理论创始人。1904年毕业于布拉格查理大学法学院；1910年起在布尔诺任教，1919年参与创建马萨里克大学并出任首任校长。1918—1925年任国会议员，六度出任财政部长（主要任期1920—1931年），对战后货币改革及财政现代化贡献重大；1934—1938年任捷克斯洛伐克国家银行行长。1947—1948年出任查理大学末届自由选举校长，1948年政变后被迫辞去全部职务，1952年被驱逐出布拉格，此后在故乡赫拉比涅终老。"
 CBIO_CZE_karel_prochazka_desc:0 "1890年5月28日生于波斯尼亚萨拉热窝（时属奥匈帝国），卒年不详，捷克斯洛伐克空军将领。两战之间长期在空军部队任职：1928年12月晋中校，先后任第1航空团第2大队队长、第6航空团副团长，1930至1931年在布拉格进修指挥官课程，1931至1933年任第5航空团团长，1933年晋上校；其后调任布拉迪斯拉发地域航空司令（1933—1934），并赴布拉格高级指挥官课程深造。1936年12月22日晋准将，自1934年底起出任航空旅旅长直至1939年5月，是第一共和国后期空军指挥体系中的重要人物。德国占领后，他于1939年7月在保护国“政府军”体系中出任第二督察部主任，1944年改任联合督察部主任，1944年10月至1945年2月一度出任保护国陆军联合参谋长。需注意此人系空军将领，与战后同名的情报系统人物并非一人。"
 CBIO_CZE_karel_husarek_desc:0 "1893年1月31日生于摩拉维亚切霍维采（今普罗斯捷约夫区），1972年卒，捷克裔工兵将领。一战期间在奥匈炮兵服役，1916年被俘后加入捷克军团参与西伯利亚作战。战后历任炮兵要职，1924年赴巴黎高等战争学院深造，1933年晋升准将并出任第16旅旅长。1937年辞任总参谋部陆军作战局长，转而专力主持捷克斯洛伐克边境防御工事建设，拟定详细的“胡萨雷克防御计划”（1937年11月）；1938年慕尼黑危机期间坚决反对接受协定。"
 CBIO_CZE_karel_schwarzenberg_desc:0 "1911年7月5日生于南波希米亚奇梅利采，1986年4月9日卒于维也纳，捷克裔贵族、历史学家与抵抗运动战士。父亲在一战塞尔维亚战线阵亡，他以施瓦岑贝格家族捷克支系继承人身份承袭家业。就读布拉格理工学院（林学）及查理大学（师从史学家约瑟夫·佩卡日，专攻历史与纹章学）。1930年代，其天主教保守主义与民族主义立场使他短暂参与法西斯运动“旗帜运动”，主张混合君主制与法西斯理念——此段历史与他后来的立场截然相反。1938年慕尼黑危机成为其思想转折点：他彻底放弃早年的反犹与法西斯立场，此后终生支持捷克独立及建立犹太国。1938年和1939年，他联合捷克贵族向贝奈什总统和哈查总统递交宣言，表明历史贵族阶层誓死拥护捷克领土完整；他拒绝以德意志根源申领第三帝国公民身份。1942年帝国保护者海德里希指控施瓦岑贝格家族从事敌对活动与间谍罪，接管其家族产业；他随即在奇梅利采秘密参与抵抗运动，战后以反法西斯战士身份获得认可。1948年共产党政变后家族产业再度被没收，他流亡维也纳担任档案研究员，1986年4月9日在当地去世。其子卡雷尔七世（1937—2023）后出任捷克外交部长。"
 CBIO_CZE_ludvik_krejci_desc:0 "1890年8月17日生于摩拉维亚图尔扬（今布尔诺市区），1972年2月9日卒于乌斯季纳德奥利奇，捷克裔陆军上将。一战期间在奥匈军多条战线服役，1917年5月在俄国前线被俘，随即加入捷克斯洛伐克军团。战后历任要职，1928年晋升师级将军，1933年12月应马萨里克总统要求出任武装力量总参谋长，1934年3月晋升陆军上将。任内力主现代化建军，主导建设边境要塞防线，与贝奈什总统密切协作；1938年9月坚决反对慕尼黑协定，并被任命为动员军队总司令。1939年3月在德方压力下被迫离职。占领期间留守国内，1941年10月遭盖世太保逮捕，关押于特里斯因，1942年7月获释。战后1947年退役，1950年被降级至普通士兵，1990年死后恢复军衔。"
 CBIO_CZE_ludvik_svoboda_desc:0 "1895年11月25日生于摩拉维亚霍兹纳廷，1979年9月20日卒于布拉格，捷克裔将领与政治家，两次世界大战中的民族英雄。一战期间服役奥匈军，后参加捷克斯洛伐克军团，经历兹博罗夫与巴赫马奇战役。1939年德国占领后加入地下组织“国家防卫”，随后出走苏联组建捷克斯洛伐克军事单位。二战期间率第1捷克斯洛伐克军团参与索科洛沃战役（1943年3月）及杜克拉山口战役（1944年秋），1945年8月晋升陆军上将。1945—1950年出任国防部长，1948年政变时拒绝出兵镇压，1950年遭苏联施压免去军职，1951至1952年间一度被捕，其后赋闲；1950年代中期经赫鲁晓夫过问复出，任哥特瓦尔德军事学院院长，1959年退役。1968年布拉格之春期间当选总统，华约入侵后屈从“正常化”路线，1975年被迫离职，1979年去世。"
 CBIO_CZE_ludwig_czech_desc:0 "1870年2月14日生于奥匈帝国伦贝格（今乌克兰利沃夫），1942年8月20日卒于泰雷津集中营，苏台德德意志裔犹太律师与政治家。在维也纳研习法律后于布尔诺执业，1897—1901年主编党报《人民之友》。捷克斯洛伐克建国后出任德意志社会民主工人党副主席（1919年）及主席（1921年起），长期领导“积极主义”派系，力主与共和国合作而非对抗。历任社会救济部长（1929—1934年）、公共工程部长（1934—1935年）及公共卫生部长（1935—1938年），三届入阁使他成为苏台德德意志人在捷克斯洛伐克民主政体内参政的最重要代表。慕尼黑后DSAP解散，他遭驱逐至泰雷津，1942年8月20日在集中营去世，官方记录死因为肺炎与心力衰竭。"
 CBIO_CZE_gustav_husak_desc:0 "1913年1月10日生于布拉迪斯拉发都布拉夫卡（时属奥匈帝国），1991年11月18日卒于布拉迪斯拉发，斯洛伐克裔律师与共产主义政治家。1929年加入共青团，1933年在科缅斯基大学法学院就读期间正式加入KSČ，1937年取得法学学位并以律师身份从事非法地下活动。1939年蒂索政权建立后多次因政治罪入狱（1940—1943年），出狱后参与组建斯洛伐克民族委员会，并出任1944年斯洛伐克民族起义重要领导人之一。战后历任斯洛伐克党政要职，1951年遭斯大林式清洗入狱，1963年平反，此后主导“正常化”时期，1969—1987年任KSČ第一书记，1975—1989年任总统。"
 CBIO_CZE_emil_hacha_desc:0 "1872年7月12日生于南波希米亚特尔霍维斯维内，1945年6月27日卒于布拉格潘克拉茨监狱，捷克裔法学家与合作主义政客。1896年取得布拉格大学法学博士学位后供职于波希米亚地方委员会；一战期间在维也纳最高行政法院任职，战后转至布拉格同院任法官（1918年）及副院长（1919年），1925年由马萨里克任命为院长，成为国内最资深法学权威之一，亦精通英国普通法，兼事英语文学翻译。慕尼黑协定签署、贝奈什被迫辞职后，他以无党籍保守天主教背景于1938年11月30日就任第二共和国总统。1939年3月14日深夜被召赴柏林，在哥林威胁轰炸布拉格的恐吓下一度心脏病发、被强制注射救治，于3月15日凌晨签署同意德国占领的文件；随即以“国家总统”之名充任保护国傀儡元首。任内他签署仿纳粹纽伦堡法律的反犹法令，并配合解散议会。1941年9月海德里希接任后，哈查彻底失去实质权力，不过充当保护国橡皮图章，身心日益衰竭。战后以战争罪嫌被捕，1945年6月27日死于潘克拉茨监狱，免于正式审判。"
 CBIO_CZE_emil_franke_desc:0 "1880年4月3日生于波希米亚大布热兹诺，1939年12月1日卒于布拉格，捷克裔学者与政治家，哲学博士。先后在布拉格、维也纳、柏林研习法律和哲学，1903年起任布拉格大学图书馆员，从事比较语文学与印度学研究，1907年译出意大利哲学家克罗齐《美学》。1918年加入捷克民族社会党，同年起连任国会议员。两战之间历任供应部长、铁路部长、公共工程部长、社会救济部长、邮政与电报部长等多届政府要职，先后效力于图萨尔、什韦赫拉、乌德日扎尔、马利佩特尔、霍贾五位总理，被誉为捷克斯洛伐克“部长纪录保持者”；1939年12月因胃病与黄疸去世，未及目睹独立终结后的局面。"
 CBIO_CZE_emil_linhart_desc:0 "1889年2月16日生于摩拉维亚洛乌恰尼（今奥洛穆茨区），1959年12月10日卒于布拉格，捷克裔师级将军。一战期间在奥匈军服役并被俘，后加入捷克斯洛伐克军团，1918年10月起指挥第9步枪团一个营参加西伯利亚作战，翌年升任该团副团长。回国后历任第4步兵团副团长及团长（1921—1926），1923年晋上校。1926年调任米洛维采步兵学校校长，1928年晋准将，1931年出任第12步兵师师长，1934年1月晋师级将军。1935年10月起任驻布拉格第一军军长。1938年9月慕尼黑危机全国动员时出任第11边境防区司令，负责西北波希米亚克拉什泰雷茨—莫斯特—比利纳一线主防御阵地，正面宽约114公里；危机平息后返任第一军军长。1939年12月1日被强制退役。"
 CBIO_CZE_emil_kolben_desc:0 "1862年11月1日生于波希米亚斯特兰契采，1943年7月3日卒于泰雷津集中营，捷克裔犹太工程师与实业家。毕业于布拉格德意志理工大学后赴美，先后供职于爱迪生机器厂及爱迪生通用电气公司并出任首席工程师。1896年返国，在布拉格维肖查内区创办“科尔本公司”电工厂；1921年与他厂合并，1927年进一步组建ČKD（捷克摩拉维亚-科尔本-达涅克），成为捷克斯洛伐克最大重工企业，员工逾15,000人，涵盖电气、机车、工业设备等领域。1939年3月16日德国占领当日即被解除ČKD董事职务，1943年6月9日遭驱逐至泰雷津集中营，同年7月3日卒于其中。"
 CBIO_CZE_emanuel_moravec_desc:0 "1893年4月17日生于布拉格，1945年5月5日开枪自杀，捷克裔陆军上校与纳粹合作政客，史称“捷克奎斯林”。一战期间在奥匈军服役，1915年被俘后加入捷克斯洛伐克军团，随后参加俄国内战白军阵营。两战之间任军事学院讲师，1933年晋升上校，1930年代以强硬的反纳粹军事评论著称，是慕尼黑危机前最力主武装抵抗德国的捷克斯洛伐克军事声音之一。慕尼黑协定摧毁了他的信念，他随即转向占领者。1942年1月在海德里希支持下出任保护国教育与民众启蒙部部长，公然宣称“捷克人不需要大学”、拒绝重开高校，强制推行德语教育并主持亲德广播宣传，是纳粹对捷克族群推行意识形态同化的最重要工具之一。1945年5月5日布拉格起义爆发当日自杀身亡。"
 CBIO_CZE_dominik_cipera_desc:0 "1893年8月3日生于布拉格，1963年9月3日卒于加拿大特伦顿，捷克裔工商管理者与政治家。娶托马什·巴塔侄女后进入兹林的巴塔公司，历任会计主任、全权代理及实际总经理；1932年兼任兹林市长，同年在托马什·巴塔去世后成为集团最高负责人之一。1938年12月1日就任贝兰政府公共工程部长，力推布拉格—布尔诺高速公路建设（首段1939年1月动工），历任保护国埃利亚什政府部长至1942年1月。保护国期间在管理岗位上暗中支援摩拉维亚—斯洛伐克边境抵抗活动。战后以合作主义罪名被起诉，1947年获判无罪；1948年流亡加拿大，续为巴塔集团效力至终。"
 CBIO_CZE_antonin_hasal_desc:0 "1893年1月7日生于内日博尔（今拉科夫尼克区），1960年4月22日卒于美国华盛顿，捷克裔将领与政治家。一战前旅居俄国时加入捷克志愿兵团，历经东线及西伯利亚作战，1934年晋升师级将军。1938年慕尼黑危机期间指挥第14边境防御地带。德国占领后参与地下组织“国家防卫”，1940年3月出走英国，以化名“尼日博尔斯基”出任贝奈什总统军事内阁主任（1940—1944年），负责协调总统与海外捷克军事力量的联络；1944年秋赴苏联并抵达斯洛伐克起义区域任解放区司令。战后于1945年4月—1946年7月任运输与技术部长，1948年政变后流亡美国至终。"
 CBIO_CZE_antonin_pavlik_desc:0 "1888年12月6日生于波希米亚洛夫奇采（恰斯拉夫附近），1943年6月13日死于科林盖世太保羁押处，捷克裔准将（死后追晋师级将军）。帕尔杜比采实科中学毕业后以一年志愿兵入奥匈第7步兵团。一战赴塞尔维亚前线，1914年11月2日被俘，1915年5月在尼什加入塞尔维亚军志愿者，随塞军转战保加利亚与萨洛尼卡前线。1918年4月转入法国捷克斯洛伐克军团第21步枪团，任排长、连长。回国后参加1919年切申及斯洛伐克对匈作战，历任第48步兵团团长（1919年起），1921年晋上校。两战之间他是捷克斯洛伐克装甲兵建设的核心人物之一。1938年秋动员时任第34边境防区司令，司令部设约瑟福夫；危机后改任第13步兵师师长。1939年5月退役。占领期投身国家防卫地下组织，任科林地区司令。1940年春首次被捕，1941—1942年受审后获释。1943年5月21日再度被捕，移押科林盖世太保，遭七天酷刑逼供始终未出卖同志。6月12日深夜挣脱束缚试图逃脱，在搏斗中被枪杀。"
 CBIO_CZE_antonin_hampl_desc:0 "1875年4月12日生于雅罗梅日，1942年5月17日卒于柏林，捷克斯洛伐克社会民主党主席（1924—1938），工运领袖出身，自1910年起长期领导金属工人工会，将其发展为捷克斯洛伐克最强大的工会组织。一战结束后参与建国，任公共工程部长（1919—1920），此后连续担任国会议员至1939年。他始终坚守民主路线，力拒共产党左翼对社民党的渗透与分裂。纳粹占领后秘密投身抵抗运动，在第二地下网络与傀儡政府总理埃利亚什之间充当联络人。1941年5月再度被盖世太保逮捕，与其他社民党前领导人一同押解至布拉格潘克拉茨监狱，随后转移至柏林莫阿比特监狱。1942年5月17日死于审讯中的折磨，死讯被纳粹当局刻意封锁。"
 CBIO_CZE_andrej_hlinka_desc:0 "1864年9月27日生于上匈牙利切尔诺瓦（今鲁若姆贝罗克），1938年8月16日卒于鲁若姆贝罗克，斯洛伐克裔天主教神父与民族主义政治家。1889年晋铎，1905年出任鲁若姆贝罗克教区神父，积极投身斯洛伐克民众的社会、教育事业。1906年因支持斯洛伐克候选人参选匈牙利议会而遭判入狱，同年爆发“切尔诺瓦惨案”——匈牙利当局向抗议奉献礼的民众开枪，引发国际舆论关注。在狱中他主持将旧约圣经译成斯洛伐克语。1913年参与创建斯洛伐克人民党并任党主席，1918年签署马丁宣言、支持与捷克人联合建国，但随即对布拉格的中央集权感到失望，终生以匹兹堡协定为据，要求斯洛伐克享有立法自治。1930年代其党逐渐靠拢威权理念，并与汉莱因的苏台德德意志党展开合作；晚年他更多是党的精神象征而非日常决策者。1938年6月5日在布拉迪斯拉发作最后一次公开演讲，8月16日去世。他身后数月，蒂索等人将其党引向亲纳粹的克莱里科法西斯“斯洛伐克国”，并以他的名义命名“赫林卡卫队”。"
 CBIO_CZE_simon_drgac_desc:0 "1892年8月11日生于摩拉维亚穆捷尼采，1980年卒，捷克裔陆军将领。一战期间参加捷克斯洛伐克军团意大利战线；两战之间历任要职，1929—1931年出任驻巴黎武官。慕尼黑协定后任宣传部副部长。1939年9月1日被盖世太保逮捕，辗转经历达豪、布痕瓦尔德、弗洛森比格等集中营，1945年4月24日获释。战后加入KSČ，重建军事学院；1948年6月起任捷克斯洛伐克武装力量总参谋长，晋陆军将军。1952年被诬陷为斯兰斯基案共犯，判处24年，1958年获释，后获平反。"
 CBIO_CZE_pavel_reiman_desc:0 "1902年10月12日生于布尔诺，1976年11月1日卒于布拉格，德意志犹太家庭出身，捷克裔日耳曼学家与共产主义政治家。1929年以“卡尔林小子”成员身份随哥特瓦尔德、斯兰斯基等人进入KSČ领导层，任共产国际执委会候补委员（至1931年）。因所谓“古特曼-雷曼右倾偏差”遭批判而赴莫斯科，1936年回国参与德国流亡者反法西斯文化活动，战时投身地下KSČ。战后任KSČ对外部主任（至1948年）；1952年被迫出席斯兰斯基审判作证（未受起诉），此后遭排挤，转作党史与日耳曼文学研究；1968年批判苏联入侵，1970年被开除出党。"
 CBIO_CZE_konrad_henlein_desc:0 "1898年5月6日生于马费尔斯多夫（今利贝雷茨弗拉蒂斯拉维采），1945年5月10日于美军羁押中在皮尔森自杀，苏台德德意志裔捷克斯洛伐克公民。一战后任体操教练，1933年10月1日创建苏台德德意志本乡前线，大选中获15.2%票率成为捷克斯洛伐克最强单党。他秘密接受柏林指令，故意提出不可满足的要求（“我们必须提出无法被满足的要求”）以制造危机；1938年3月28日密会希特勒，9月组织武装暴乱，慕尼黑后加入纳粹党与党卫军，任苏台德地区帝国专员。1939年5月1日起担任苏台德大区区长，主导将大批人口驱逐至灭绝营。"
 CBIO_CZE_vladimir_prikryl_desc:0 "1895年8月3日生于摩拉维亚霍尔尼斯图丹基，1968年4月13日卒于皮尔森，捷克裔旅级将军（本名约瑟夫，改信东正教后改名弗拉迪米尔）。一战期间参加捷克斯洛伐克军团并历经西伯利亚远征；1940年经法国抵英，1943年辗转经非洲赴苏联（途中所乘运输舰被德机击沉，获英国驱逐舰救起），1944年1月起指挥第二捷克斯洛伐克独立伞兵旅，参加基辅解放及喀尔巴阡山战役。1944年10月率旅降落斯洛伐克参加民族起义，起义失败后继续山区游击。1949年5月被捕，1953年获总统特赦，1964年司法平反。"
 CBIO_CZE_vladimir_mandl_desc:0 "1899年3月20日生于皮尔森，1941年1月8日卒，捷克裔法学家，布拉格理工大学副教授。专研私法与技术法律问题，1928年出版捷克语首部航空法专著，获捷克斯洛伐克司法部国家奖。1932年自费出版德文专著《宇宙法：宇宙航行问题》，成为法学史上最早专论太空法的著作，早于斯普特尼克卫星发射整整25年，被誉为“太空法之父”，同年亦获得捷克斯洛伐克火箭专利。1933年起执教布拉格理工大学，1939年11月高校被纳粹关闭后被迫中断学术生涯，1941年1月卒，年仅41岁。"
 CBIO_CZE_frantisek_havel_desc:0 "1883年8月23日生于西里西亚楚克曼特尔（今兹拉特霍里），1958年4月20日卒于布拉格，捷克裔准将，工兵出身。毕业于布拉格捷克理工大学，1909年取得工程师学位。一战赴俄国前线，1915年被俘后加入捷克斯洛伐克军团。1918年6月1日指挥军团在梅霍瓦山战役中击败布尔什维克部队。回国后长期在陆军工兵系统任职，1931年起任国防部工兵处处长，主管捷克斯洛伐克边境要塞防御工事建设。1934年率军事代表团考察法国马奇诺防线，其考察成果直接影响了捷克斯洛伐克边境筑垒的设计方案。1939年6月1日退出现役。二战期间参加国内抗德地下抵抗活动。"
 CBIO_CZE_frantisek_placak_desc:0 "1886年8月26日生于摩拉维亚蒂洛维采（罗日诺夫附近），卒年不详，捷克裔工程师与军工管理者，曾在奥匈炮兵服役。毕业于布尔诺高等工业学校机械科，通晓德、俄、波等语言；1907年入奥匈军要塞炮兵，官至中尉，1908年起在第一布尔诺机械厂任设计工程师。约1910年赴当时属俄国的华沙，主持谢弗-布登贝格公司的车间与技术处。一战期间他先后在彼尔姆兵工厂、伊热夫斯克兵工厂及彼得格勒炮弹厂主持生产合理化改造；1917年当选俄国捷克斯洛伐克国民议会分会委员，同年加入捷克斯洛伐克军团，任军团汽车排长，随军经西伯利亚、海参崴一线作战，1918年底起组建并主管军团的汽车勤务，是捷克斯洛伐克军事汽车化的早期骨干。1920年以上尉军衔回国，服役于汽车营，1921年转入预备役。此后转入军工管理，进入斯柯达体系，1930年起参与斯洛伐克杜布尼察新厂筹建与管理，后任斯柯达布拉格斯米霍夫厂负责人。其经历集中于军工、机械与火炮制造，是捷克斯洛伐克军事工业体系中的技术管理人物。"
 CBIO_CZE_frantisek_moravec_desc:0 "1895年7月23日生于恰斯拉夫，1966年7月26日卒于华盛顿特区，捷克裔军事情报局长，获授英国CBE勋章。1930年进入军事情报部门，1937年出任局长；1939年3月14日深夜率“莫拉韦茨十一人”携档案飞抵伦敦，1940—1945年任流亡政府情报长官，维系与国内三王抵抗网络的秘密电台联络，并参与策划刺杀海德里希的“人猿行动”。1945年回国，1948年政变后流亡美国，任国防部情报顾问至终。"
 CBIO_CZE_frantisek_hrabcik_desc:0 "1894年11月30日生于摩拉维亚霍多拉内（奥洛穆茨附近），1967年7月28日卒，捷克裔师级将军，捷克斯洛伐克军团老兵。战后历任捷克斯洛伐克军队要职：1925—1926年任布拉格军区参谋长，1929—1932年任布拉格战争学院院长，1935—1936年任第六军军长。1938年9月—10月慕尼黑危机期间出任赴法军事使团团长，参与捷克斯洛伐克争取法国军事援助的最后外交努力，使团回国不久国家即告沦陷。"
 CBIO_CZE_frantisek_chvalkovsky_desc:0 "1885年7月30日生于布拉格近郊伊洛维耶乌布拉迪，1945年2月25日遭盟军战机扫射击毙于柏林近郊公路，捷克裔外交官，捷克斯洛伐克外交部长。1920年入外交部；历任驻德国（1927—1932年）、意大利（1932—1938年）大使。1938年10月4日就任第二共和国外交部长，试图以让步维持独立，严重低估希特勒野心；参与第一次维也纳仲裁谈判，并于1939年3月15日随哈查赴柏林签署保护国协议。外交部关闭后以保护国驻德公使留任柏林（1939年7月13日任命），1945年2月25日死于盟军空袭。"
 CBIO_CZE_frantisek_machnik_desc:0 "1886年4月30日生于摩拉维亚内布热霍维采（斯特拉科尼采区），1967年11月21日卒于日达尼采，捷克裔政治家，农民党（捷克斯洛伐克共和党）议员。曾任教于赫鲁金和克拉托维，1925年起三度当选国民议会议员，兼任军事委员会副主席。1935年6月4日起出任国防部长，历经马利佩特尔第三届及霍贾二三届政府，主持捷克斯洛伐克军队大规模现代化改革与边境永备工事建设，与总参谋长克雷吉密切协作；至1938年9月22日慕尼黑危机顶峰时去职。1948年后遭共产党当局清算，1952年以捏造叛国罪被判五年，1953年特赦，晚年健康受损，1989年后始获公众重新认可。"
 CBIO_AUS_ernst_fischer_desc:0 "1899年7月3日生于科莫陶（今霍穆托夫，波希米亚），1972年7月31日卒于多伊奇费施特里茨，波希米亚裔奥地利记者、作家与共产主义政治家。原为社民党人，1934年奥地利内战失败后加入KPÖ，随即流亡捷克斯洛伐克（1934—1938年），为共产国际从事编辑宣传工作。1938年赴莫斯科，度过大清洗年代，受格奥尔基·季米特洛夫庇护幸免于难。战后1945年4月至12月出任伦纳临时政府教育与文化国务秘书，推行宗教课选修化等改革。1959年出版马克思主义美学名著《艺术的必要性》，在西方左翼知识界引发广泛影响。1969年因公开谴责苏联入侵捷克斯洛伐克（斥之为“坦克共产主义”）而被KPÖ开除出党。"
 CBIO_CZE_jan_sramek_desc:0 "1870年8月11日生于摩拉维亚格里戈夫，1956年4月22日卒于布拉格，捷克天主教教士（国内侍从），捷克斯洛伐克人民党首任主席。1919年主持将多个天主教政治团体合并创建ČSL，此后长期把持党政要职，多次入阁。1940年7月21日至1945年4月5日以流亡政府总理身份领导伦敦流亡当局，使ČSL成为抵抗运动重要支柱。1948年2月共产党政变后被迫辞去党主席；出逃未遂被捕，此后遭共产党当局软禁与监控，1956年4月22日在拘禁状态下去世。"
 CBIO_CZE_jan_ruckl_desc:0 "1900年生，1938年卒，捷克斯洛伐克水晶玻璃实业家、天主教政治活动家，尼日博尔Rückl水晶玻璃厂家族核心成员。吕克尔家族自17至18世纪即从事波希米亚玻璃制造业，1903年安东宁·吕克尔在尼日博尔建成新厂，两战之间鼎盛时雇佣千余名工人，产品销往比利时、英国、印度及大马士革，1935年在巴黎玻璃展览会上获大奖。扬·伊日认同第一共和国民主路线，1935年总统选举中协助贝奈什争取斯洛伐克党派支持，1930年代发表政论同时批判纳粹主义与共产主义，捍卫议会民主原则。1938年因白血病早逝，未及目睹家族企业1945年被贝奈什法令国有化的命运。"
 CBIO_CZE_jan_krcmar_desc:0 "1877年7月27日生于布拉格，1950年5月31日卒于布拉格，捷克法学家，查理大学民法正教授，国际私法领域最重要的捷克专家。1901年以“皇帝恩典”特等荣誉毕业于布拉格法学院，后赴莱比锡深造。1919年后以外交部法律顾问身份参与凡尔赛条约谈判，处理财产权及少数民族相关条款。两度出任教育与国民启蒙部长（1926年3—10月；1934年2月—1936年1月），期间兼参与新捷克斯洛伐克民法典起草。1948年后应个人请求从大学退休，晚年仍参与民法典中间草案修订工作，1950年去世。"
 CBIO_CZE_jan_dostalek_desc:0 "1883年4月28日生于谢季韦茨，1955年3月21日卒于布拉格，捷克裔政治家，捷克斯洛伐克人民党议员，建筑工程出身。在布拉格工业高等学校学习测量，又就读于维也纳艺术学院。1904年起供职于布拉格市政府，历任制图员、测量员，最终升至建设局长，在职达三十余年。两战之间历任捷克斯洛伐克工业部长及公共工程部长，并长期担任国民议会议员。1948年政变后遭共产党当局政治迫害，被捕入狱，1955年去世。"
 CBIO_CZE_jan_antonin_bata_desc:0 "1898年3月7日生于乌赫尔斯克赫拉迪什捷，1965年8月23日卒于圣保罗（巴西），托马什·巴塔的同父异母兄弟，被誉为“鞋王”。1932年托马什飞机失事后接掌巴塔集团，大萧条期间逆势扩张，将员工从16,000人增至38,000余人、企业从25家扩展至70家，遍布逾30国。1939年德占后流亡美国，1941年因曾尝试与纳粹当局谈判以保全公司而被盟国列入黑名单，最终定居巴西，创建巴塔伊波朗等多座工业城镇。其间秘密资助流亡政府并协助斯洛伐克民族起义。战后1947年缺席被判15年（实为充公资产的政治手段），2007年获法庭正式平反。"
 CBIO_CZE_jan_golian_desc:0 "1906年1月26日生于多姆博瓦尔（今匈牙利，父母均为斯洛伐克裔），1945年卒，斯洛伐克旅级将军，斯洛伐克民族起义军事组织者与总指挥。1944年1月起任斯洛伐克地面部队总参谋长，驻班斯卡比斯特里察，与伦敦流亡政府秘密联络并建立地下军事总部（1944年4月27日）。1944年8月29日晚8时发出暗号“开始疏散”，宣告SNP爆发；9月晋升旅级将军，统率逾60,000人作战。10月7日将指挥权移交维斯特将军；10月27日下令转入游击战；11月3日在波赫罗恩斯基布科韦茨遭德军特别部队俘虏，被押往弗洛森比格集中营，1945年被处决。"
 CBIO_CZE_jan_syrovy_desc:0 "1888年生于摩拉维亚特热比奇，1970年卒，捷克斯洛伐克陆军上将，慕尼黑危机时期的总理。一战期间于捷克斯洛伐克军团作战，1917年兹博罗夫战役中失去右眼，得“独眼将军”之称；战争末期统率军团沿西伯利亚大铁路且战且行。两战之间历任总参谋长（1926—1933）与陆军总监（1933—1938）。1938年9月贝奈斯总统任命他为救国政府总理兼国防部长；他下令全国总动员，却终因英法弃捷而被迫接受慕尼黑协定，广播宣告“我们被抛弃了，只剩孤军”。贝奈斯辞职后一度代行总统职权，至同年12月卸任总理；1939年3月德军占领时下令不予抵抗。战后1945年被捕，1947年以“通敌”罪判二十年，自认问心无愧，1970年去世。"
 CBIO_CZE_radola_gajda_desc:0 "1892年2月14日生于科托尔（今属黑山，时为奥匈帝国），本名鲁道夫·盖特尔，1948年4月15日卒于布拉格（白血病），捷克军人与极右翼政治家。其父为驻科托尔奥匈军官，其母为黑山贵族，幼年随家迁至摩拉维亚基约夫。一战期间在奥匈军服役，1915年9月被俘后立即改换阵营加入黑山军队，以药剂师身份冒充军医；黑山军队崩溃后辗转逃往俄国，1917年1月以上尉军衔加入捷克斯洛伐克军团。内战期间迅速崛起：1918年7月率部攻克伊尔库茨克，打通西伯利亚大铁路，在贝加尔湖海战中击溃红军水上力量，年仅二十六岁即晋升少将，成为高尔察克白军阵营中的明星将领。回国后任军队副总参谋长，1926年“盖达事件”中被指控阴谋叛乱及泄露军事机密，遭军事法庭定罪并被逐出军队。此后转入极右翼政治：同年参与创建“国家法西斯团体”，1927年1月2日就任党魁，以墨索里尼的意大利法西斯党为样板。1929年NOF赢得数个国会席位；1933年1月21日深夜布尔诺日德尼采区约八十名党徒发动武装政变，翌日被镇压，盖达随即被捕并以煽动罪判处六个月监禁。1935年他本人赢得一个议席，维持至1939年；同期NOF持强烈反德立场，慕尼黑协定签署后他悉数退还法英两国授予的勋章以示抗议。1939年3月多次拥立他为国家元首的政变尝试均告失败，数日后剩余捷克领土遭德国占领。占领期间他远离公众，偶尔协助抵抗运动。1947年战后审判以捏造罪名判两年（与羁押期相抵），出狱后不久于1948年4月15日因白血病去世。"
 CBIO_CZE_stanislav_bukovsky_desc:0 "1889年5月2日生于摩拉维亚维什科夫一户磨坊家庭，1942年8月14日在奥斯维辛集中营毒气室遇难，捷克裔医师与体育领袖。1913年毕业于布拉格查理大学医学院，一战期间在意大利前线腿部重伤，转任布拉格军医。自青年起投身索科尔体操运动，1921年进入捷克斯洛伐克索科尔总会领导层，创建医学研究部；1922年起任公共雇员医疗基金会首席医师，1931年当选总会副会长，1932年继舍纳之后出任会长，并兼斯拉夫索科尔联盟会长。1938年10月4日，他以无党籍身份入西罗维看守政府，受命主管教育与国民启蒙部，至同年12月1日卸任。德国占领后索科尔遭取缔；1941年10月8日纳粹对索科尔骨干发动“索科尔行动”大搜捕，布科夫斯基被捕，先囚于特雷津小要塞盖世太保监狱，1942年1月15日与其他被捕者一同被押往奥斯维辛，同年8月14日被处决于毒气室，时年五十三岁，囚号25660。"
 CBIO_CZE_stefan_osusky_desc:0 "1889年3月31日生于上匈牙利布雷佐瓦（今斯洛伐克布雷佐瓦波德布拉德洛姆），1973年9月27日卒于美国弗吉尼亚州赫恩登，斯洛伐克裔律师、外交官与政治家。少年时因斯洛伐克民族情感被布拉迪斯拉发路德派中学开除，1906年赴美研习神学、哲学、自然科学与法律。一战期间在巴黎与日内瓦为捷克斯洛伐克民族委员会从事宣传，1918年4月以斯洛伐克代表身份出席罗马被压迫民族大会。建国后入外交界，1919至1920年任和会代表团秘书长，并代表捷克斯洛伐克签署《特里亚农条约》；1920年起任国际联盟监督委员会主席达十四年。1921年起出任驻法国公使，长期经营捷法同盟这一安全基石，直至1940年法国陷落。1939年3月德国吞并后，他拒绝向德方交出巴黎使馆并维持其运作，着手组织海外抵抗，1939年10月2日与法国总理达拉第签署在法重建捷克斯洛伐克军队的协定；其后虽于1939年11月加入贝奈斯的民族委员会、1940年7月任流亡政府部长，但与贝奈斯关系日益恶化。1945年赴美任科尔盖特大学教授，二月事变后参与自由捷克斯洛伐克委员会，终老异乡。"
 CBIO_CZE_melichar_frantisek_desc:0 "1889年8月31日生于南波希米亚姆拉达沃日采一户铁匠家庭，1975年6月23日卒于劳尼，捷克裔师级将军、一战军团老兵。早年在布拉格读夜间商业学校，1914年在塞尔维亚任银行职员并入塞籍，一战中转战保加利亚、突尼斯、希腊、俄国诸前线；1918年5月脱离塞军，随捷克志愿者辗转法国、意大利军团。回国后参加1919年斯洛伐克之战，旋赴贝尔格莱德出任驻塞尔维亚-克罗地亚-斯洛文尼亚王国武官，1923年晋上校。1925年应本人请求回国，历任第28步兵团副团长、第9步兵团团长等职，1931年晋准将。1938年9月慕尼黑危机动员期间负责北波希米亚一线防御。1939年退役；德占期间虽受警方监视，仍于1941年投身抵抗，1943年遭盖世太保逮捕入狱，幸存至战后。晚年专事撰写梅利哈尔铁匠家族史与故乡拉季博日训山镇史，是少数在共产党时期获正式军葬的军团老兵之一。"
 CBIO_CZE_vojtyech_luzha_desc:0 "1891年3月26日生于摩拉维亚乌赫尔斯基布罗德，1944年10月2日在普日比斯拉夫附近赫日什捷村战死，捷克裔陆军将领、一战军团老兵、捷克斯洛伐克抵抗运动核心人物。一战被俘后先入塞尔维亚志愿师，1917年1月转入捷克斯洛伐克军团，参加兹博罗夫战役并随军在西伯利亚对布尔什维克作战。回国后历任要职，1929年晋师级将军，曾任布拉格高等军事学院院长及布尔诺地区军事司令。1938年9月动员时统率守卫北摩拉维亚的第二军团，坚决反对慕尼黑投降，一度谋划以军事政变推翻西罗维政府。德国占领后投身地下“国家防卫”组织，与保护国总理埃利亚什保持联络，1941年9月转入地下。1942年底重整残部建立抵抗组织“三人委员会”并任其军事领袖，被公认为国内抵抗的最高军事代表，着手筹划武装起义。1944年9月其组织遭盖世太保渗透瓦解，他在步行转移途中于赫日什捷村小客栈遭当地宪兵盘查，拔枪抵抗、当场牺牲，是二战中唯一持枪战死的捷克斯洛伐克将军；其子拉多米尔为父复仇。身后追晋一级上将。"
 CBIO_CZE_edvard_benesh_desc:0 "1884年5月28日生于波希米亚科兹拉尼一户农家，1948年9月3日卒于塞济莫沃乌斯季，捷克裔政治家、外交家，捷克斯洛伐克的共同缔造者。先后在布拉格、巴黎、第戎求学，1908年获法学博士。一战期间随马萨里克流亡，与马萨里克、什捷凡尼克在巴黎组建捷克斯洛伐克民族委员会，奠定建国基础。1918年起任首任外交部长，连任至1935年，期间一度兼任总理（1921至1922），主导组建“小协约国”，六度出任国际联盟理事会主席，是集体安全的主要倡导者。1935年继马萨里克出任总统。1938年9月慕尼黑协定将苏台德割让，他在英法逼迫下接受，旋于10月5日被迫辞职流亡海外。德国占领后他重整旗鼓，在伦敦领导流亡政府、组织国内抵抗，并签署后来引发争议的《贝奈斯法令》，为战后剥夺并驱逐苏台德德意志人及匈牙利人提供依据；1943年12月赴莫斯科与斯大林签订友好互助条约。1945年5月回国复任总统。然而他过于倚重苏联、低估国内共产党，1948年2月危机中未能动员反共力量，被迫接受哥特瓦尔德主导的内阁；同年6月拒签新宪法辞职，9月3日在病痛交加中去世。其一生两度缔造、又两度目睹国家被极权吞噬，身后评价聚讼至今。"
 CBIO_CZE_vaclav_kopecky_desc:0 "1897年8月27日生于科斯莫诺西附近，1961年8月5日卒于布拉格（肺栓塞），捷克裔政治家、记者，哥特瓦尔德时代捷克斯洛伐克共产党的首席意识形态家。出身小商之家，曾在布拉格查理大学法学院就读未竟。原为社会民主党人，1921年KSČ创建时即加入，是布拉格卡尔林地下党支部成员，1929年第五次党代会上与哥特瓦尔德、斯兰斯基等同列党中央，史称“卡尔林小子”。两战之间长期任党报编辑与国会议员，1940至1941年任共产国际代表，二战在莫斯科度过；1944年公开接受将苏台德德意志人逐出的方针，并发表反犹言论，称自认是德意志人或匈牙利人的犹太人应同受驱逐处置。战后历任新闻部长（1945至1953）与文化部长（1953至1954），主持沿用占领时期手法的出版审查；他以反犹言论著称，攻击犹太人的“世界主义”与犹太复国主义，并是斯兰斯基审判的主要操盘者之一。死后享国葬。"
 CBIO_CZE_milan_hodza_desc:0 "1878年2月1日生于上匈牙利苏恰内（今斯洛伐克），1944年6月27日卒于美国佛罗里达州克利尔沃特，斯洛伐克裔政治家、记者，捷克斯洛伐克农民党领袖，首位斯洛伐克籍捷克斯洛伐克总理。早年为斯洛伐克国民党机关报撰稿，1905至1910年任匈牙利国会议员，倡导斯洛伐克与捷克合作；1910年后成为王储斐迪南大公“贝尔韦代雷集团”的核心成员，曾献策将匈牙利王国改组为联邦以安抚非马扎尔民族，遭匈牙利政界强烈抵制。一战期间参与筹建捷克斯洛伐克，1918年签署《马丁宣言》，使斯洛伐克并入新国家。建国后长期领导斯洛伐克农民党，历任统一法律与行政部长、农业部长、教育部长、外交部长等职，1921年起兼任布拉迪斯拉发夸美纽斯大学近代史教授，并创办多份斯洛伐克报刊。1935年继马萨里克退休后出任总理（同年12月一度代行总统职权），全力推动捷克斯洛伐克与奥地利、罗马尼亚、匈牙利、南斯拉夫的中欧经济一体化构想，惜未成功。1938年9月慕尼黑协定后辞职流亡，先后转徙瑞士、法国（另组斯洛伐克民族委员会，与贝奈斯流亡集团长期对立）、英国，1941年移居美国，著《中欧联邦》（1942），1944年卒于流亡中。2002年遗骸归葬斯洛伐克马丁民族公墓。"
 CBIO_CZE_mikulas_dolezal_desc:0 "1889年12月6日生于佩尔赫日莫夫附近弗拉塞尼采一户小农家庭，1941年10月1日在布拉格鲁济尼耶被处决，捷克裔师级将军、一战军团老兵、“国家防卫”中央领导成员。曾在布拉格捷克高等工业学校攻读机械工程，1913年入奥匈蒂罗尔皇家猎兵团；一战在喀尔巴阡山被俘后，1916年5月先入塞尔维亚志愿师参加多布鲁甲之战，1917年1月转入捷克斯洛伐克军团第8步枪团，转战乌克兰、乌拉尔与西伯利亚，曾任第3师通信勤务长，为全军团制定通信勤务章程。回国后历任要职，1935年9月继卢扎之后出任布拉格高等军事学院院长，兼军事科学研究所秘书长及《军事评论》主编，1938年初晋师级将军，并任驻南斯拉夫军事使团团长、后任第六军军长。德国占领后投身“国家防卫”中央领导，先为大布拉格地区司令的副手，后任该组织第二代中央领导人霍莫拉的副手，负责扩建地下指挥网。1941年8月4日被盖世太保逮捕，10月1日在首次戒严中被枪决，时年五十二岁。"
 CBIO_CZE_milada_horakova_desc:0 "1901年12月25日生于布拉格（本姓克拉洛娃），1950年6月27日在布拉格潘克拉茨监狱被绞死，捷克裔律师、女权活动家与民主政治家。1926年毕业于查理大学法学院，入布拉格市政府社会福利部门任职，长期投身妇女平权运动，1929年加入捷克国家社会党（与纳粹毫无关联、立场坚决反纳粹）。1938年慕尼黑协定后救助苏台德难民，德国占领期间参加抵抗组织“我们忠贞不渝”，1940年被盖世太保逮捕，备受酷刑而不屈，1944年被纳粹判处死刑后改判八年苦役，1945年获美军解放。战后重返国家社会党，1946年当选国会议员；1948年二月共产党政变后愤而辞去议席，仍在体制外坚持民主理念。1949年9月27日被捕，次年5月31日起遭受苏联顾问操纵的公开审判，被诬以阴谋叛国，6月8日判处死刑。尽管爱因斯坦、丘吉尔、埃莉诺·罗斯福等国际名流纷纷请命，仍未能挽回，6月27日清晨她从容就义。其判决1968年获撤销，1989年后彻底平反，6月27日被定为捷克“共产政权受难者纪念日”。"
 CBIO_CZE_josef_cerny_desc:0 "1885年2月28日生于东波希米亚内波利西一户农家，1971年12月7日卒于纽约，捷克裔政治家、律师，捷克斯洛伐克农民党（共和党）国会议员与内政部长。在布拉格、维也纳攻读法律，后为布拉格知名律师，早年即投身农民运动。1921年娶农民党领袖安东宁·什维赫拉之女海伦娜为妻，跻身党内新生代核心。1918年起任国会议员，1920、1925、1929、1935年连选连任，直至1939年议会解散。1934年2月起出任内政部长，历经马利佩特尔第二、三届政府及霍贾三届政府，至1938年9月，奉行“铁腕”政策维护内部稳定，对汉莱因等苏台德德意志分离活动既坚决又审慎，1935年大选前曾建议取缔汉莱因的苏台德德意志党未果；其主管的内政部顶住柏林压力，对德国民主派流亡者仍宽容收容、给予庇护。1938年12月并入新成立的民族统一党。德占后流亡海外，在美国参与重建流亡农民党，并加入1949年成立的自由捷克斯洛伐克委员会及“受奴役民族组织”，1971年客死纽约。"
 CBIO_CZE_josef_kalfus_desc:0 "1880年6月25日生于波希米亚热莱兹尼布罗德，1955年6月12日卒于利贝雷茨，捷克裔法学博士、财政专家。1920年起任职财政部，1936年3月28日出任捷克斯洛伐克财政部长，此后历经数届政府，并在保护国时期续任至1945年5月5日，其间获颁保护国“圣瓦茨拉夫雄鹰”勋章。作为保护国政府成员，他在表面上配合占领当局的财政运作与对德经济整合；但与此同时，他奉贝奈斯总统之命，秘密将财政资源转移至中立国以资助海外抵抗，1939年3月销毁重要文件、同年6月协助兵工厂总经理奥特拉塔出逃，并长期暗助地下组织“政治中心”，直至1941年10月联络人遭捕。他还在内政部长比内特暗助下协助保全索科尔经费、掩护扎莱卡-哈伊斯基一家。1946年他作为保护国政府成员被送交国家法院审判，被判有罪但免于科刑；1948年后全部财产遭没收，1955年去世。"
 CBIO_CZE_josef_guttman_desc:0 "1902年生，1956年（一说1958年）卒于美国，捷克裔犹太记者、政治家，捷克斯洛伐克共产党早期领导人之一。1929年第五次党代会上与哥特瓦尔德、斯兰斯基、什韦尔马、柯别茨基、雷曼同列党中央，史称“卡尔林小子”，并任党机关报《红色权利报》总编辑。1933年，他公开批评共产国际在德国法西斯威胁面前的路线（即客观上助希特勒上台的政策），严重违反党纪，被扣上“托洛茨基主义”帽子，遭撤职并开除出党，成为著名的反斯大林左翼异见者。1938年底离开捷克斯洛伐克，辗转瑞典，1941年抵纽约，此后长期以彼得·迈尔等化名为美国犹太人委员会等机构撰稿，成为苏联集团事务的重要分析者与极权主义的批判者。1968年其名誉在国内获得平反。"
 CBIO_CZE_josef_frantisek_desc:0 "1914年10月7日生于摩拉维亚奥塔斯拉维采一户木匠家庭，1940年10月8日因飞机失事坠亡于英国伊维尔附近，捷克裔战斗机王牌飞行员。原为锁匠学徒，1934年加入捷克斯洛伐克空军，受训于普罗斯捷约夫，性情桀骜、屡因违纪受罚，却显露出非凡飞行天赋。1939年3月德国占领后逃往波兰，加入波兰空军并参加九月抗德作战；波兰沦陷后经罗马尼亚、巴尔干、叙利亚辗转赴法，又在法军中作战；法国败降后赴英，1940年8月2日编入英国皇家空军第303（波兰）中队，驾驶飓风式战斗机。自9月2日首胜起，他在短短四周内确认击落17架德机，成为不列颠空战中战绩最高的非英籍盟军王牌。因其惯于脱离编队“单骑猎杀”，长官索性让他单独巡逻。1940年10月8日，他在巡逻返航途中坠机身亡（疑因身心俱疲），身后追授英国杰出飞行奖章及横杠，2015年获追授捷克白狮勋章一级。"
 CBIO_CZE_josef_votruba_desc:0 "1879年11月8日生于波伊泽里地区的德布日（姆拉达博莱斯拉夫附近），1959年10月7日卒于布拉格，捷克裔陆军一级上将。1896年入维也纳地方防卫军军校，后毕业于维也纳军事学院，一战中以奥匈参谋军官身份转战俄国、巴尔干、伊斯特里亚与皮亚韦河前线。1918年11月在维也纳向捷克斯洛伐克全权代表报到、加入新军，1919年参加斯洛伐克对匈作战。两战之间历任第3师参谋长、步兵团长、旅长等职，1937年1月晋一级上将，主张积极防御战术。1938年9月动员时统率“什捷凡尼克”第三军团，兼斯洛伐克与喀尔巴阡乌克兰地区司令，下辖七个师，司令部设于克雷姆尼察；10月起短暂指挥南摩拉维亚第四军团，旋因糖尿病恶化请退，1939年1月退役。战后因其德裔妻子1942年曾申请德国国籍而受调查（查明实为给重病丈夫多领食品配给），1946年5月恢复军衔；1948年后被共产党降为列兵、剥夺抚恤并逐出布拉格，1959年去世。"
 CBIO_CZE_josef_vana_desc:0 "1893年1月19日生于乌斯特拉申，1976年4月6日卒于捷克布罗德，捷克裔师级将军。1912至1914年就读布拉格哲学院，1915年应征赴俄国前线，同年2月被俘，在战俘营中加入塞尔维亚志愿军，辗转转入捷克斯洛伐克军团。回国后赴法国进修，1930年晋准将并调入国防部，1932至1934年任国防部步兵处长。1935至1939年任驻赫拉德茨-克拉洛韦的第二军军长；1938年9月动员时统率第二军，负责北波希米亚边境防御。割地后迁居布拉格，沦陷期间一直留居该地，并参加1945年5月的布拉格起义。"
 CBIO_CZE_josef_rozsevac_desc:0 "1901年11月1日生于霍日采附近的比尔斯科（波希米亚），1946年6月27日在布拉格潘克拉茨监狱被绞死，捷克裔记者、政治家，捷克法西斯组织“旗帜”的首领。曾入大学攻读医学未竟。1936年加入1930年创立的民族主义组织“旗帜”，并取笔名“扬·里斯”，以此名出版反犹著作《犹太共济会——人类的祸根》（1938）等。慕尼黑协定后“旗帜”被取缔、他一度入狱，1939年3月德占前夕获释并出任“旗帜”首领，力图建成群众性法西斯组织，并推动该组织从早年的反德沙文主义转向与纳粹及盖世太保合作；1939至1940年间屡次举行声讨马萨里克、贝奈斯等第一共和国政要的大会。但占领当局转而扶植其竞争对手埃马努埃尔·莫拉韦茨一派，加之“旗帜”不断攻击莫拉韦茨，该组织于1942年底被解散，其首领以“优待犯”身份被押往达豪集中营，战争末期转押蒂罗尔，1945年5月获释。战后他与三名同伙被判死刑，1946年6月27日绞死于潘克拉茨。"
 CBIO_CZE_robert_rychtrmoc_desc:0 "1875年4月9日生于匈牙利采格莱德一户奥匈军人家庭，1946年1月21日在布拉格潘克拉茨监狱被处决，捷克裔师级将军、合作主义政客。1895年毕业于布拉格军校入伍，一战中长期任意大利前线参谋军官，1916年被调入维也纳总参谋部、组织对内防谍，1918年5月晋总参谋部上校。捷克斯洛伐克建国后，他是少数转入新军的前奥匈高级军官之一，两战之间晋至师级将军，1934年退役。1938年动员时一度复出，负责从克拉利基到因德日赫城堡一线的筑垒。慕尼黑后他迁居布拉格，本可安度余生，却卷入保护国政治：先加入退役宪兵将领布拉哈1940年组建的合作组织“捷克战士联盟”，1943年8月起接任该联盟第二任也是末任首领，使其经济稳定并发行亲德刊物《战友情》，又出任保护国唯一合法政治组织“国民团结”主席。1944年3月联盟大会上他支持组建为德军效力的捷克部队，4月25日向莫拉韦茨递交备忘录，建议动员十五个役龄、多达六十万捷克男子，并起用关押在集中营的军官“将功补过”。1945年5月9日被捕，与布拉哈等一同受国家法院审判，1946年1月21日被绞死（其请求以军人身份枪决遭拒），贝奈斯驳回了对他的特赦申请。"
 CBIO_CZE_hugo_vavrecka_desc:0 "1880年2月22日生于西里西亚奥斯特拉瓦，1952年8月9日卒于布尔诺，捷克裔记者、经济学家、外交官与政治家，瓦茨拉夫·哈维尔与伊万·哈维尔兄弟的外祖父。1904年毕业于布尔诺德意志工业大学（电机与机械工程），后任《人民报》经济版编辑；一战在的里雅斯特服役奥匈海军，并加入马菲亚地下组织。建国后入外交界，历任驻汉堡总领事（1920—1922）、驻匈牙利公使（1922—1926）、驻奥地利公使（1926—1932）。1932年因不满德奥接近而退出外交界，应托马什·巴塔之邀赴兹林，旋于巴塔同年坠机身亡后与扬·安东宁·巴塔、奇佩拉同任集团三人董事会成员。1938年9月起在霍贾、西罗维政府中任宣传部长（不管部长）至同年12月1日，斡旋慕尼黑后国家的处境。占领期间他借巴塔企业暗助抵抗：送犹太籍经理出国脱险、资助游击队与斯洛伐克民族起义、为扬·韦里赫赴美购票。战后巴塔被国有化、他遭撤职并以通敌嫌疑受审，1947年获判无罪；1948年政变后被重新起诉，同年12月22日以捏造证据判三年苦役、没收全部财产，经哥特瓦尔德干预得免入狱，1952年在布尔诺病逝。"
 CBIO_CZE_sergej_ingr_desc:0 "1894年9月2日生于摩拉维亚弗尔科什（其父为村长），1956年6月17日卒于巴黎，捷克裔陆军一级上将，捷克斯洛伐克流亡政府国防部长。一战中在东线被俘后加入塞尔维亚志愿师，于敖德萨皈依东正教并改名“谢尔盖”，继而转入捷克斯洛伐克军团，参加兹博罗夫战役，后辗转法国、意大利军团；1918年12月起参加对匈与波捷战事。两战之间历任要职，1934年晋准将，1938年为师级将军、第三军军长。德国占领后参与创建地下“国家防卫”并受派赴法，在巴黎设立军事办公室、于阿格德组建捷克斯洛伐克军队并任司令，1940年率一万余名志愿者参加法国战役。流亡政府迁伦敦后出任国防部长，统辖东西两线的捷克斯洛伐克军团，与受苏联影响的斯沃博达关系紧张。1944年下半年在共产党压力下卸去部长职，转任武装力量总司令。1945年7月晋一级上将并退役，旋任驻荷兰大使；二月事变后辞职流亡，1949年创建自由捷克斯洛伐克委员会，组织反共活动并为西方建立流亡情报网，1956年猝逝于巴黎。"
 CBIO_CZE_sergej_vojcechovsky_desc:0 "1883年10月16日（俄历）生于维捷布斯克一户波兰裔俄罗斯贵族军人家庭，1951年4月7日卒于西伯利亚泰舍特奥泽尔拉格（古拉格劳改营），俄裔捷克斯洛伐克陆军上将。1904年毕业于圣彼得堡康斯坦丁炮兵学校，1912年毕业于尼古拉耶夫总参谋部军事学院。一战中任俄军参谋军官，1917年9月调任捷克斯洛伐克步枪师参谋长，参加巴赫马奇战役。俄国内战期间迅速崛起：1918年6月攻克车里雅宾斯克、7月攻取叶卡捷琳堡，打通西伯利亚大铁路，同年10月晋少将；后转入高尔察克白军指挥乌法军，1920年率部撤至克里米亚加入弗兰格尔部队，经君士坦丁堡流亡捷克斯洛伐克。1921年5月入捷军服役，1922年获公民权，此后历任旅长、师长，1927年任布尔诺军区司令，1929年12月晋陆军上将，1935年起任布拉格军区司令。1938年9月慕尼黑危机期间统率第一军团，坚决反对投降，致信国防部长警告“轻言放弃对未来不利”；因此1939年4月被德方施压解职。随即与因格尔、比利等将领共建地下抵抗组织“国家防卫”，充任秘密“战争部长”，整个占领期间在盖世太保监视下坚持工作。1945年5月12日在布拉格被苏军反间谍机构“锄奸部”逮捕并强行押往莫斯科，9月以“反苏活动”罪判十年劳改，捷克斯洛伐克政府未作任何抗议。1951年4月7日死于奥泽尔拉格医院，官方记录死因为“肺结核及年迈衰竭”。1996年获俄罗斯总检察院平反，1997年追授白狮勋章。"
 CBIO_CZE_bedrich_homola_desc:0 "1887年6月2日生于波希米亚贝莱奇（今利特尼附近）一户农家，1943年1月5日在柏林普勒岑湖监狱被处决，捷克裔陆军上将（追晋），抗纳粹地下组织“国家防卫”第三任总指挥，代号“阿塔曼”。1907年毕业于布拉格高等建筑工业学校，随后任建筑技术员及布拉格市政府职员。一战中赴俄国前线，1915年9月被俘，1916年2月加入捷克斯洛伐克军团第6“哈纳”步枪团，历经巴赫马奇等战役，后随军团辗转西伯利亚。回国后入伍为正式军官，1929年2月晋准将，1934年3月起任布拉格第1师师长，1935年10月调任驻斯洛伐克第七军军长。1939年3月9至11日，他奉政府令在斯洛伐克缴械赫林卡卫队并拘押其领导人，史称“霍莫拉政变”；3月14日斯洛伐克独立后他徒步翻越贝斯基德山脉返回摩拉维亚。德占后他立即投身建设“国家防卫”，先任大布拉格地区司令；1940年2月前任领导被捕后接任全波希米亚与摩拉维亚总指挥，推动各派抵抗力量联合为统一领导机构。1941年12月31日因叛徒出卖在布拉格被盖世太保逮捕，备受酷刑不屈；1942年9月移送德累斯顿、旋转柏林，以叛国罪判处死刑，1943年1月5日晚在普勒岑湖被处决。1946年追晋陆军上将，1998年追授白狮勋章。"
 CBIO_CZE_ferdinand_peroutka_desc:0 "1895年2月6日生于布拉格，1978年4月20日卒于纽约，捷克裔记者、作家与政论家，第一共和国最具影响力的公共知识分子之一。1913年从事新闻工作，战后任《论坛报》主编；1924年获马萨里克总统资助创办政论周刊《今日》，该刊汇聚恰佩克、耶森斯卡等名家，成为捷克民主文化的旗舰。他以独立犀利的评论著称，既批共产党亦批国家民主党右翼，所著《建设国家》四卷本是第一共和国政治史的经典文献。1939年发表文章呼吁捷克人抵制法西斯修辞，旋被捕入达豪、转布痕瓦尔德集中营，纳粹以自由为条件要求他主编合作报刊，遭他拒绝，遂在营中度过整个战争。1945年获释后主编《自由新闻报》，1945至1946年以国家社会党身份任临时国民议会议员。1948年二月政变后徒步翻越边境流亡巴伐利亚。1951年5月出任自由欧洲电台捷克斯洛伐克部首任主任，首次播音即宣称“这是自由捷克斯洛伐克的声音”，主持该部至1961年，被美国支持者誉为“捷克斯洛伐克先生”。此后继续以自由撰稿人身份发表评论，1968年对布拉格之春抱持乐观，华约入侵后深感痛惜。1978年4月20日在纽约去世，1995年起捷克设立以他命名的新闻奖。"
 CBIO_CZE_ferdinand_catlos_desc:0 "1895年10月生于上匈牙利利普托夫斯基彼得（今斯洛伐克），1972年卒于马丁，具体日期各源不一，斯洛伐克裔将领与政治家，本名乔特洛什·南多尔。一战在奥匈军俄国前线被俘，1917年加入捷克斯洛伐克军团第7“塔特拉”步枪团，战后留在捷克斯洛伐克军中。1939年3月斯洛伐克独立后被任命为一级将军及国防部长，主持将原捷军斯洛伐克部队整编为独立军队。1939年9月1日以“贝尔诺拉克”野战军总指挥身份参加对波兰的入侵，斯军伤亡较轻但占领了波兰部分领土；1941年又将约45,000人派往东线参与巴巴罗萨行动。1944年初他与马拉尔将军秘密起草“察特洛斯备忘录”，拟发动军事政变推翻蒂索、建立亲苏军政府，8月4日派专机赴莫斯科递交方案，但代表直到9月2日起义已全面爆发才见到接头人。8月29日起义当晚他被软禁于蒂索总统府，9月13日被苏联内务部特工带走押赴苏联。战后以战争罪受审判刑约三年，出狱后在马丁任普通文书员终老。"
 CBIO_CZE_louis_eugene_faucher_desc:0 "1874年10月8日生于法国德塞夫尔省一户木匠家庭，1964年3月30日卒，法国陆军中将，捷克斯洛伐克荣誉陆军上将。1896年任少尉，先后就读于枫丹白露应用炮兵学校和巴黎高等军事学院。一战在第二十军和总参谋部作战处服役。1919年随法国军事使团抵布拉格，任使团参谋长，参加1919年对匈斯洛伐克战争；1926年接任使团团长，直至1938年。在布拉格的近二十年间，他深度参与捷克斯洛伐克军队建设，与捷方将领结下深厚战友情谊。1938年9月英法向布拉格发出最后通牒后，福谢愤而向巴黎辞去法军职务，将全部人身交予捷克斯洛伐克军队调遣。离开布拉格时，他在车站检阅仪仗队时含泪亲吻捷军军旗，捷方军官无不动容。1939年战争爆发后他被重新任命为法国驻捷克斯洛伐克军事使团团长，协助在南法阿格德组建第一捷克斯洛伐克师，募得逾万名官兵。法国陷落后他投身秘密军，任西南大区（波尔多）抵抗运动负责人；1944年初被盖世太保逮捕，押入菲森-普朗湖劳役营，战争末期获释。战后重返布拉格试图复兴法捷友谊，1948年政变后方撤离。1964年去世。"
 CBIO_CZE_richard_tesarzhik_desc:0 "1915年12月3日生于布拉格一户商人家庭（母亲为歌剧演员），1967年3月27日因心脏病卒于乌斯季纳德拉贝姆，捷克裔少将、苏联英雄称号获得者，捷克斯洛伐克最著名的坦克指挥官之一。少年在普日布拉姆长大，学过橱窗装潢，1937年10月入伍于贝劳恩步兵团。1939年8月越境入波兰加入捷克斯洛伐克军团，波兰沦陷后滞留于沃伦。1943年3月以步兵排长身份参加索科洛沃战役，近战中格杀德军军官并缴获情报。同年8月转入坦克兵，指挥T-70轻型坦克连参加基辅解放战役，11月5日从西南方向突击摧毁多处德军炮兵阵地，为步兵打开通道，因此荣获苏联英雄金星勋章，为获此殊荣的捷克斯洛伐克军人之一。1944年秋率部参加杜克拉山口战役，攻击694高地时所乘坦克被反坦克火箭弹击中起火，跳车后重伤失去左眼；伤愈后以上尉军衔参加1945年俄斯特拉瓦战役。战后在莫斯科坦克学院深造，回国后历任装甲兵要职。1953年因丢失机密文件被短暂拘押，1956年晋少将。1959年赴莫斯科总参学院进修，因纪律问题被召回，1960年被开除出党并退役。此后从事民用工作，1967年因心脏病去世，葬于普日布拉姆。"
 CBIO_CZE_albrecht_franz_desc:0 "阿尔布雷希特·弗朗茨·冯·哈布斯堡-洛林（1897年7月24日—1955年7月23日），奥地利大公，哈布斯堡-洛林家族特申支成员，弗里德里希大公之子。生于维也纳，出身奥匈帝国最高贵族阶层，名义上拥有匈牙利与波希米亚王族头衔，并为特申公爵继承人。一战和帝国解体后，哈布斯堡家族在中欧的政治地位急剧下降；两战之间，君主主义者仍可能将这类旧王朝成员视为恢复君主制的象征人选。其本人主要活动于家族、婚姻与财产事务，未能在捷克斯洛伐克政治中形成现实权力。1955年卒于阿根廷布宜诺斯艾利斯。"
 CBIO_CZE_alois_tucny_desc:0 "1881年6月4日生于摩拉维亚弗伦什塔特（拉德霍什特山下），1940年4月10日卒于布拉格，捷克斯洛伐克政治家、工会领袖，捷克斯洛伐克民族社会党国会议员。早年学排字工出身，长期在摩拉维亚活动；1912年起任与民族社会党相关的捷克斯洛伐克工人公会中央书记，直至1939年。1918至1920年任革命国民议会议员，1920年起当选国民议会议员，历经1925、1929、1935各届连任，直至1939年议会解散，1925年起任本党议会党团主席；1938年12月并入新组建的民族统一党党团。他多次入阁：1921至1922年在贝奈什政府任公共工程部长，1922至1924年在什韦赫拉第一届政府任邮政与电报部长，1925至1926年在什韦赫拉第二届政府任公共卫生与体育部长；1936年1月再度出任邮政与电报部长，历经霍贾各届政府，至1938年9月慕尼黑危机时去职。1940年4月在被占领的布拉格去世，未及目睹战争结局。"
 CBIO_CZE_alois_elias_desc:0 "1890年9月29日生于布拉格，1942年6月19日在布拉格科比利西靶场被处决，捷克裔师级将军，保护国总理兼地下抵抗领袖，二战中唯一被纳粹处决的占领区政府首脑。1911年毕业于布拉格捷克理工大学测量专业，一战中随布拉格第28步兵团赴加利西亚前线，1914年8月28日即被俘，1917年加入捷克斯洛伐克军团。两战之间历任总参第一处处长（1924—1929）等要职，1929年晋准将，1936年晋师级将军并出任驻特伦钦第五军军长。1939年4月27日受哈查总统之邀出任保护国第一届正式政府总理，抱着“借位保国”的信念就职。在任期间，他一面维持傀儡行政的运转，一面秘密联络伦敦流亡政府，协助前军人出逃赴英参军、签发假证件、向贝奈斯传递情报，并加入“国家防卫”组织。他曾向帝国保护者纽赖特呈交一千名犹太杰出人士名单请求豁免反犹法令，被悉数驳回。1941年9月他甚至策划用毒三明治毒杀七名最活跃的亲纳粹捷克记者，部分得逞。1941年9月27日，海德里希就任代理保护者当日即下令逮捕埃利亚什，以叛国罪判处死刑，刑期暂缓执行。1942年5月27日海德里希遇刺后，纳粹实施大规模报复，6月19日将埃利亚什枪决于科比利西靶场。2006年5月7日捷克以国葬规格将其安葬于布拉格维特科夫国家纪念碑。"
 CBIO_CZE_alois_vicherek_desc:0 "1892年6月20日生于彼得日瓦尔德，1956年1月中旬卒于布拉格，捷克裔空军将领，工程学学位持有者。一战中在奥匈军服役，1916年7月在布鲁西洛夫攻势中被俘，后加入捷克斯洛伐克军团。两战之间在捷克斯洛伐克空军历任要职，1937年1月1日与加努瑟克同日晋准将，1940年5月1日晋师级将军。1939年德占后以化名“约瑟夫·斯莱扎克”参与抵抗，后辗转赴法国出任流亡空军指挥官。法国沦陷后赴英，因军衔资历本应主管流亡空军，但英方优先任用了先期抵英的加努瑟克，维雷克在伦敦长期闲置，仅担任流亡红十字会主席等荣誉职。1945年5月1日赴苏联，5月29日出任捷克斯洛伐克空军司令。战后他接受共产党体制，在空军体系中续任高层职务直至去世。"
 CBIO_CZE_jaroslav_slechta_desc:0 "1898年3月14日生于布拉格，1989年10月25日卒于布拉格，享年91岁，捷克航空与直升机设计师、飞行员，机械工程师。一战后在布拉格展览场航空俱乐部与航空兵工厂起步，后进入由哈伊恩、贝奈什领衔的布拉格公司航空部，设计多型成功滑翔机，其中“布拉格”号1932年成为捷克斯洛伐克首架飞行逾一小时的滑翔机。1934年哈、贝二人离去后，他升任该厂主设计师，主持设计了著名轻型运动机 Praga E-114“Air Baby”（1934年8月首飞），该机商业上大获成功，远销法国、伊朗、罗马尼亚，并在曼彻斯特以“Hillson Praga”之名特许生产；另设计 E-210 运输机、E-51 侦察轻轰炸机等。二战期间（1942—1943）被迫赴德国哈雷为德方研制直升机，暗中钻研旋翼周期变距控制。战后他在国有化的 Aero 公司领导原布拉格设计组，主持研制 Praga XE-II——捷克斯洛伐克自制的第一架直升机（1950年9月首次自由飞行），并被誉为首型量产直升机Aero HC-2“Heli Baby”（1958年）之父，1956年获劳动勋章。"
 CBIO_CZE_jaroslav_kejla_desc:0 "1892年7月27日生于波希米亚卢布纳，1977年8月18日卒于布拉格，捷克斯洛伐克空军将领、工程师、俄国军团老兵。一战期间在俄国加入捷克斯洛伐克军团，战后进入捷克斯洛伐克军队，长期从事军事航空的技术与军械保障工作。1936年与卡雷尔·加努瑟克等人同批晋升为空军将官，军衔方向为“空军技术军械勤务将官”，即主管航空装备、武器与器材的技术系统，而非一线飞行指挥。其公开履历记载较为零散，但生卒、出身与军衔方向均可确认。"
 CBIO_CZE_jaroslav_fajfr_desc:0 "1883年3月5日生于波希米亚洛乌尼，1974年8月8日卒于布拉格，捷克裔师级将军，捷克斯洛伐克空军事实上的首任总指挥。1905年入布拉格捷克高等工业学校修习几何与测量学，1913年毕业后任测量师并参加索科尔活动。一战随奥匈第28野战炮兵团赴俄国前线，后被俘加入捷克斯洛伐克军团，经历西伯利亚远征。回国后历任炮兵要职，1923年晋准将并出任第1野战炮兵旅旅长。1927年起任国防部第三处（航空处）处长，以师级将军衔执掌捷克斯洛伐克全部军事航空事务长达十二年，是空军体系的实际总指挥。1938年9月秘密前往莫斯科与苏军总参谋长沙波什尼科夫及空军司令洛克季奥诺夫商讨航空援助；9月27日在布尔诺与斯穆什科维奇会面，后者提出可调700架飞机驰援，惜因慕尼黑协定作罢。德占后协助飞行员出逃赴英。1945年5月起义期间任起义军空军指挥官。1949年以捏造间谍罪被捕，囚于米罗夫监狱，1954年获特赦。"
 CBIO_CZE_rudolf_mlcoch_desc:0 "1880年4月17日生于摩拉维亚特热布钦（德文名亨内贝克，今属奥洛穆茨地区），1948年4月8日卒于奥洛穆茨，捷克裔企业家、记者、第一共和国政治家，工商党创始人之一。出身篮筐匠师家庭，随父学篮筐手艺，曾就读梅尔尼克专门学校，并赴布拉格、维也纳历练，后在普罗斯捷约夫开办篮筐作坊。1904年起主编《工商通报》，1919年在奥洛穆茨创办本党机关报《捷克斯洛伐克日报》并任社长兼总编，1933至1941年任《摩拉维亚日报》总编。他历任国家工商委员会委员、奥洛穆茨工商会会长等职。建国后他是工商党在革命国民议会中的唯一议员，1920至1939年连任国民议会议员（1935年该党赢得17席），1935至1937年任众议院副议长；1938年12月并入民族统一党党团。其入阁经历包括：1925至1926年在切尔尼政府任公共工程部长，1929至1932年在乌德日扎尔政府任铁道部长，1937至1938年继纳伊曼之后在霍贾政府任工业、商业与手工业部长。"
 CBIO_CZE_rudolf_viest_desc:0 "1890年9月24日生于上匈牙利雷武察（今斯洛伐克），1945年卒于弗洛森比格集中营（确切日期不详），斯洛伐克裔师级将军，两战之间捷克斯洛伐克军队中唯一的斯洛伐克籍将军，斯洛伐克民族起义最高指挥官。父为手工匠人，自幼就读于雷武察路德派小学及中学，1905年随家迁居布达佩斯。一战在奥匈军服役，后加入捷克斯洛伐克军团参加俄国内战。战后留在军中，1928年晋上校，1933年晋准将，1938年晋师级将军。斯洛伐克独立后他签署反对分裂的请愿书，但未遭迫害，接受察特洛斯邀请出任斯洛伐克军队总监察长，暗中与伦敦流亡政府保持联络并加入“国家防卫”。1939年流亡匈牙利，后赴法国任流亡第一捷克斯洛伐克师师长（1940年1月），法国沦陷后赴英。1942至1944年任流亡政府国防部长。1944年10月6至7日夜间飞回斯洛伐克，接替戈利安出任第一捷克斯洛伐克军总指挥，统率约36,000名官兵抗击德军大举围剿。10月27日班斯卡比斯特里察陷落，他于10月27至28日夜下令转入游击战，宣告“争取自由的斗争不会结束，将在山中继续”。11月3日在波赫罗恩斯基布科韦茨被德军俘获，与戈利安一同押赴柏林、后转弗洛森比格集中营，1945年被处决（相关记录缺失，亦有说法认为他们可能被移交苏联后身亡）。身后追晋陆军上将，获斯洛伐克民族起义勋章一级等多项荣誉。"
 CBIO_CZE_rudolf_bechyne_desc:0 "1881年4月6日生于尼姆布尔克，1948年1月1日卒于布拉格，捷克裔社会民主党政治家与记者。出身机械钳工，1905年加入捷克社会民主党，从此终生不渝。先后在布尔诺《平等报》、普罗斯捷约夫《人民之声报》任编辑。1911年当选奥地利帝国议会议员，一战中因反战言论于1915年被捕、以叛国罪指控后发配前线，归来后健康受损。1917年在社民党内与哈布尔曼、汉普尔等人一道反对什梅拉尔的亲奥路线，力推民族独立。1918年以社民党代表身份参加国民委员会，亲历捷克斯洛伐克建国。建国后他是执政联盟“五人组”中的社民党首席代表，1918至1939年连续当选国会议员，历任教育部长（1922—1924）、铁路部长（1925—1926、1932—1938）、供应部长（1929—1932）。他坚持民主改良路线，既抵制共产党分裂又反对右翼法西斯化。1938年参与与伦西曼使团的谈判，慕尼黑后力守民主立场。1939年7月经波兰流亡英国，1940至1941年任伦敦国务会议首任主席，此后为会议成员至战争结束，同时主编流亡刊物《新自由》，对贝奈斯的政策时有批评。1945年回国后已不再参与政治活动，1948年1月1日在布拉格去世。"
 CBIO_CZE_bozena_machacova_dostalova_desc:0 "1903年9月25日生于波希米亚德意志布罗德（今哈夫利切夫布罗德），1973年5月20日卒于布拉格，捷克裔共产主义政治家，捷克斯洛伐克任职时间最长的女性内阁部长。出身工人家庭，已婚育有两个孩子。1923年加入捷克斯洛伐克共产党，迅速成长为红色工会骨干。1932年迁居布拉格，任共产党妇女刊物《播种者》编辑并从事工会工作。1935年在议会选举中当选国民议会议员。战后继续活跃于KSČ，历次党代会均当选中央委员。1954年12月12日起出任采购部长，1956年6月16日改任消费工业部长，此职一直担任至1968年4月8日，横跨希罗基与莱纳尔特两届政府以及切尔尼克第一届政府。1968年8月华约入侵时，总统斯沃博达和总理切尔尼克均被扣押于莫斯科，她作为在场最高级别政府成员，受国民议会委托主持政府会议，事实上代行政府首脑职责。1973年在布拉格去世。"
 AUS_ernst_fischer_desc:0 "1899年7月3日生于科莫陶（今霍穆托夫，波希米亚），1972年7月31日卒于多伊奇费施特里茨，波希米亚裔奥地利记者、作家与共产主义政治家。原为社民党人，1934年奥地利内战失败后加入KPÖ，随即流亡捷克斯洛伐克（1934—1938年），为共产国际从事编辑宣传工作。1938年赴莫斯科，度过大清洗年代，受格奥尔基·季米特洛夫庇护幸免于难。战后1945年4月至12月出任伦纳临时政府教育与文化国务秘书，推行宗教课选修化等改革。1959年出版马克思主义美学名著《艺术的必要性》，在西方左翼知识界引发广泛影响。1969年因公开谴责苏联入侵捷克斯洛伐克（斥之为“坦克共产主义”）而被KPÖ开除出党。"
 CZE_albrecht_franz_desc:0 "阿尔布雷希特·弗朗茨·冯·哈布斯堡-洛林（1897年7月24日—1955年7月23日），奥地利大公，哈布斯堡-洛林家族特申支成员，弗里德里希大公之子。生于维也纳，出身奥匈帝国最高贵族阶层，名义上拥有匈牙利与波希米亚王族头衔，并为特申公爵继承人。一战和帝国解体后，哈布斯堡家族在中欧的政治地位急剧下降；两战之间，君主主义者仍可能将这类旧王朝成员视为恢复君主制的象征人选。其本人主要活动于家族、婚姻与财产事务，未能在捷克斯洛伐克政治中形成现实权力。1955年卒于阿根廷布宜诺斯艾利斯。"
 CZE_alois_elias_desc:0 "1890年9月29日生于布拉格，1942年6月19日在布拉格科比利西靶场被处决，捷克裔师级将军，保护国总理兼地下抵抗领袖，二战中唯一被纳粹处决的占领区政府首脑。1911年毕业于布拉格捷克理工大学测量专业，一战中随布拉格第28步兵团赴加利西亚前线，1914年8月28日即被俘，1917年加入捷克斯洛伐克军团。两战之间历任总参第一处处长（1924—1929）等要职，1929年晋准将，1936年晋师级将军并出任驻特伦钦第五军军长。1939年4月27日受哈查总统之邀出任保护国第一届正式政府总理，抱着“借位保国”的信念就职。在任期间，他一面维持傀儡行政的运转，一面秘密联络伦敦流亡政府，协助前军人出逃赴英参军、签发假证件、向贝奈斯传递情报，并加入“国家防卫”组织。他曾向帝国保护者纽赖特呈交一千名犹太杰出人士名单请求豁免反犹法令，被悉数驳回。1941年9月他甚至策划用毒三明治毒杀七名最活跃的亲纳粹捷克记者，部分得逞。1941年9月27日，海德里希就任代理保护者当日即下令逮捕埃利亚什，以叛国罪判处死刑，刑期暂缓执行。1942年5月27日海德里希遇刺后，纳粹实施大规模报复，6月19日将埃利亚什枪决于科比利西靶场。2006年5月7日捷克以国葬规格将其安葬于布拉格维特科夫国家纪念碑。"
 CZE_alois_tucny_desc:0 "1881年6月4日生于摩拉维亚弗伦什塔特（拉德霍什特山下），1940年4月10日卒于布拉格，捷克斯洛伐克政治家、工会领袖，捷克斯洛伐克民族社会党国会议员。早年学排字工出身，长期在摩拉维亚活动；1912年起任与民族社会党相关的捷克斯洛伐克工人公会中央书记，直至1939年。1918至1920年任革命国民议会议员，1920年起当选国民议会议员，历经1925、1929、1935各届连任，直至1939年议会解散，1925年起任本党议会党团主席；1938年12月并入新组建的民族统一党党团。他多次入阁：1921至1922年在贝奈什政府任公共工程部长，1922至1924年在什韦赫拉第一届政府任邮政与电报部长，1925至1926年在什韦赫拉第二届政府任公共卫生与体育部长；1936年1月再度出任邮政与电报部长，历经霍贾各届政府，至1938年9月慕尼黑危机时去职。1940年4月在被占领的布拉格去世，未及目睹战争结局。"
 CZE_alois_vicherek_advisor_idea_reform_desc:0 "1892年6月20日生于彼得日瓦尔德，1956年1月中旬卒于布拉格，捷克裔空军将领，工程学学位持有者。一战中在奥匈军服役，1916年7月在布鲁西洛夫攻势中被俘，后加入捷克斯洛伐克军团。两战之间在捷克斯洛伐克空军历任要职，1937年1月1日与加努瑟克同日晋准将，1940年5月1日晋师级将军。1939年德占后以化名“约瑟夫·斯莱扎克”参与抵抗，后辗转赴法国出任流亡空军指挥官。法国沦陷后赴英，因军衔资历本应主管流亡空军，但英方优先任用了先期抵英的加努瑟克，维雷克在伦敦长期闲置，仅担任流亡红十字会主席等荣誉职。1945年5月1日赴苏联，5月29日出任捷克斯洛伐克空军司令。战后他接受共产党体制，在空军体系中续任高层职务直至去世。"
 CZE_alois_vicherek_desc:0 "1892年6月20日生于彼得日瓦尔德，1956年1月中旬卒于布拉格，捷克裔空军将领，工程学学位持有者。一战中在奥匈军服役，1916年7月在布鲁西洛夫攻势中被俘，后加入捷克斯洛伐克军团。两战之间在捷克斯洛伐克空军历任要职，1937年1月1日与加努瑟克同日晋准将，1940年5月1日晋师级将军。1939年德占后以化名“约瑟夫·斯莱扎克”参与抵抗，后辗转赴法国出任流亡空军指挥官。法国沦陷后赴英，因军衔资历本应主管流亡空军，但英方优先任用了先期抵英的加努瑟克，维雷克在伦敦长期闲置，仅担任流亡红十字会主席等荣誉职。1945年5月1日赴苏联，5月29日出任捷克斯洛伐克空军司令。战后他接受共产党体制，在空军体系中续任高层职务直至去世。"
 CZE_andrej_hlinka_desc:0 "1864年9月27日生于上匈牙利切尔诺瓦（今鲁若姆贝罗克），1938年8月16日卒于鲁若姆贝罗克，斯洛伐克裔天主教神父与民族主义政治家。1889年晋铎，1905年出任鲁若姆贝罗克教区神父，积极投身斯洛伐克民众的社会、教育事业。1906年因支持斯洛伐克候选人参选匈牙利议会而遭判入狱，同年爆发“切尔诺瓦惨案”——匈牙利当局向抗议奉献礼的民众开枪，引发国际舆论关注。在狱中他主持将旧约圣经译成斯洛伐克语。1913年参与创建斯洛伐克人民党并任党主席，1918年签署马丁宣言、支持与捷克人联合建国，但随即对布拉格的中央集权感到失望，终生以匹兹堡协定为据，要求斯洛伐克享有立法自治。1930年代其党逐渐靠拢威权理念，并与汉莱因的苏台德德意志党展开合作；晚年他更多是党的精神象征而非日常决策者。1938年6月5日在布拉迪斯拉发作最后一次公开演讲，8月16日去世。他身后数月，蒂索等人将其党引向亲纳粹的克莱里科法西斯“斯洛伐克国”，并以他的名义命名“赫林卡卫队”。"
 CZE_antonin_hampl_desc:0 "1875年4月12日生于雅罗梅日，1942年5月17日卒于柏林，捷克斯洛伐克社会民主党主席（1924—1938），工运领袖出身，自1910年起长期领导金属工人工会，将其发展为捷克斯洛伐克最强大的工会组织。一战结束后参与建国，任公共工程部长（1919—1920），此后连续担任国会议员至1939年。他始终坚守民主路线，力拒共产党左翼对社民党的渗透与分裂。纳粹占领后秘密投身抵抗运动，在第二地下网络与傀儡政府总理埃利亚什之间充当联络人。1941年5月再度被盖世太保逮捕，与其他社民党前领导人一同押解至布拉格潘克拉茨监狱，随后转移至柏林莫阿比特监狱。1942年5月17日死于审讯中的折磨，死讯被纳粹当局刻意封锁。"
 CZE_antonin_hasal_desc:0 "1893年1月7日生于内日博尔（今拉科夫尼克区），1960年4月22日卒于美国华盛顿，捷克裔将领与政治家。一战前旅居俄国时加入捷克志愿兵团，历经东线及西伯利亚作战，1934年晋升师级将军。1938年慕尼黑危机期间指挥第14边境防御地带。德国占领后参与地下组织“国家防卫”，1940年3月出走英国，以化名“尼日博尔斯基”出任贝奈什总统军事内阁主任（1940—1944年），负责协调总统与海外捷克军事力量的联络；1944年秋赴苏联并抵达斯洛伐克起义区域任解放区司令。战后于1945年4月—1946年7月任运输与技术部长，1948年政变后流亡美国至终。"
 CZE_antonin_pavlik_desc:0 "1888年12月6日生于波希米亚洛夫奇采（恰斯拉夫附近），1943年6月13日死于科林盖世太保羁押处，捷克裔准将（死后追晋师级将军）。帕尔杜比采实科中学毕业后以一年志愿兵入奥匈第7步兵团。一战赴塞尔维亚前线，1914年11月2日被俘，1915年5月在尼什加入塞尔维亚军志愿者，随塞军转战保加利亚与萨洛尼卡前线。1918年4月转入法国捷克斯洛伐克军团第21步枪团，任排长、连长。回国后参加1919年切申及斯洛伐克对匈作战，历任第48步兵团团长（1919年起），1921年晋上校。两战之间他是捷克斯洛伐克装甲兵建设的核心人物之一。1938年秋动员时任第34边境防区司令，司令部设约瑟福夫；危机后改任第13步兵师师长。1939年5月退役。占领期投身国家防卫地下组织，任科林地区司令。1940年春首次被捕，1941—1942年受审后获释。1943年5月21日再度被捕，移押科林盖世太保，遭七天酷刑逼供始终未出卖同志。6月12日深夜挣脱束缚试图逃脱，在搏斗中被枪杀。"
 CZE_bedrich_homola_desc:0 "1887年6月2日生于波希米亚贝莱奇（今利特尼附近）一户农家，1943年1月5日在柏林普勒岑湖监狱被处决，捷克裔陆军上将（追晋），抗纳粹地下组织“国家防卫”第三任总指挥，代号“阿塔曼”。1907年毕业于布拉格高等建筑工业学校，随后任建筑技术员及布拉格市政府职员。一战中赴俄国前线，1915年9月被俘，1916年2月加入捷克斯洛伐克军团第6“哈纳”步枪团，历经巴赫马奇等战役，后随军团辗转西伯利亚。回国后入伍为正式军官，1929年2月晋准将，1934年3月起任布拉格第1师师长，1935年10月调任驻斯洛伐克第七军军长。1939年3月9至11日，他奉政府令在斯洛伐克缴械赫林卡卫队并拘押其领导人，史称“霍莫拉政变”；3月14日斯洛伐克独立后他徒步翻越贝斯基德山脉返回摩拉维亚。德占后他立即投身建设“国家防卫”，先任大布拉格地区司令；1940年2月前任领导被捕后接任全波希米亚与摩拉维亚总指挥，推动各派抵抗力量联合为统一领导机构。1941年12月31日因叛徒出卖在布拉格被盖世太保逮捕，备受酷刑不屈；1942年9月移送德累斯顿、旋转柏林，以叛国罪判处死刑，1943年1月5日晚在普勒岑湖被处决。1946年追晋陆军上将，1998年追授白狮勋章。"
 CZE_bohumil_lausman_desc:0 "1903年8月30日生于波希米亚容贝尔克，1963年5月9日卒于布拉格鲁济尼耶监狱，捷克社会民主党人。银行职员出身，1935—1939年任国会议员，1938年兼任劳动国家党总书记。1939年12月流亡英国，1940—1945年任伦敦国务会议成员，并于1944年参与斯洛伐克民族起义。战后历任工业部长（1945—1947），1947年11月当选社民党主席。1948年2月危机中摇摆不定，接受哥特瓦尔德内阁副总理职，客观上助长了共产党夺权。其后再度出走，1953年12月23日被国家安全局特工从萨尔茨堡流亡寓所强行绑架遣返，此后在政治羁押中以不明原因死去。"
 CZE_bohumir_smeral_desc:0 "1880年10月25日生于摩拉维亚特热比奇，1941年5月8日卒于莫斯科，捷克政治家、工人运动领袖。青年时投身社会民主运动，一战前后成为捷克斯洛伐克社会民主党核心领导人，主持对党的左翼建设，建国后长期任国会议员，推动劳工立法。1921年，他是推动社民党激进左翼分裂、另建捷克斯洛伐克共产党的最重要人物之一，出任党领导人，并进入共产国际执行委员会，此后多年以共产国际工作人员身份活跃于东欧左翼政治，被视为莫斯科与KSČ之间的关键协调人。1930年代随着纳粹威胁加剧，他积极倡导国内反法西斯统一战线。1938年9月慕尼黑协定签署、KSČ境内组织遭取缔后，什梅拉尔流亡苏联，未能亲见故土光复，1941年5月8日在莫斯科去世。"
 CZE_bozena_machacova_dostalova_desc:0 "1903年9月25日生于波希米亚德意志布罗德（今哈夫利切夫布罗德），1973年5月20日卒于布拉格，捷克裔共产主义政治家，捷克斯洛伐克任职时间最长的女性内阁部长。出身工人家庭，已婚育有两个孩子。1923年加入捷克斯洛伐克共产党，迅速成长为红色工会骨干。1932年迁居布拉格，任共产党妇女刊物《播种者》编辑并从事工会工作。1935年在议会选举中当选国民议会议员。战后继续活跃于KSČ，历次党代会均当选中央委员。1954年12月12日起出任采购部长，1956年6月16日改任消费工业部长，此职一直担任至1968年4月8日，横跨希罗基与莱纳尔特两届政府以及切尔尼克第一届政府。1968年8月华约入侵时，总统斯沃博达和总理切尔尼克均被扣押于莫斯科，她作为在场最高级别政府成员，受国民议会委托主持政府会议，事实上代行政府首脑职责。1973年在布拉格去世。"
 CZE_dominik_cipera_desc:0 "1893年8月3日生于布拉格，1963年9月3日卒于加拿大特伦顿，捷克裔工商管理者与政治家。娶托马什·巴塔侄女后进入兹林的巴塔公司，历任会计主任、全权代理及实际总经理；1932年兼任兹林市长，同年在托马什·巴塔去世后成为集团最高负责人之一。1938年12月1日就任贝兰政府公共工程部长，力推布拉格—布尔诺高速公路建设（首段1939年1月动工），历任保护国埃利亚什政府部长至1942年1月。保护国期间在管理岗位上暗中支援摩拉维亚—斯洛伐克边境抵抗活动。战后以合作主义罪名被起诉，1947年获判无罪；1948年流亡加拿大，续为巴塔集团效力至终。"
 CZE_edvard_benesh_desc:0 "1884年5月28日生于波希米亚科兹拉尼一户农家，1948年9月3日卒于塞济莫沃乌斯季，捷克裔政治家、外交家，捷克斯洛伐克的共同缔造者。先后在布拉格、巴黎、第戎求学，1908年获法学博士。一战期间随马萨里克流亡，与马萨里克、什捷凡尼克在巴黎组建捷克斯洛伐克民族委员会，奠定建国基础。1918年起任首任外交部长，连任至1935年，期间一度兼任总理（1921至1922），主导组建“小协约国”，六度出任国际联盟理事会主席，是集体安全的主要倡导者。1935年继马萨里克出任总统。1938年9月慕尼黑协定将苏台德割让，他在英法逼迫下接受，旋于10月5日被迫辞职流亡海外。德国占领后他重整旗鼓，在伦敦领导流亡政府、组织国内抵抗，并签署后来引发争议的《贝奈斯法令》，为战后剥夺并驱逐苏台德德意志人及匈牙利人提供依据；1943年12月赴莫斯科与斯大林签订友好互助条约。1945年5月回国复任总统。然而他过于倚重苏联、低估国内共产党，1948年2月危机中未能动员反共力量，被迫接受哥特瓦尔德主导的内阁；同年6月拒签新宪法辞职，9月3日在病痛交加中去世。其一生两度缔造、又两度目睹国家被极权吞噬，身后评价聚讼至今。"
 CZE_edvard_benesh_idea_desc:0 "1884年5月28日生于波希米亚科兹拉尼一户农家，1948年9月3日卒于塞济莫沃乌斯季，捷克裔政治家、外交家，捷克斯洛伐克的共同缔造者。先后在布拉格、巴黎、第戎求学，1908年获法学博士。一战期间随马萨里克流亡，与马萨里克、什捷凡尼克在巴黎组建捷克斯洛伐克民族委员会，奠定建国基础。1918年起任首任外交部长，连任至1935年，期间一度兼任总理（1921至1922），主导组建“小协约国”，六度出任国际联盟理事会主席，是集体安全的主要倡导者。1935年继马萨里克出任总统。1938年9月慕尼黑协定将苏台德割让，他在英法逼迫下接受，旋于10月5日被迫辞职流亡海外。德国占领后他重整旗鼓，在伦敦领导流亡政府、组织国内抵抗，并签署后来引发争议的《贝奈斯法令》，为战后剥夺并驱逐苏台德德意志人及匈牙利人提供依据；1943年12月赴莫斯科与斯大林签订友好互助条约。1945年5月回国复任总统。然而他过于倚重苏联、低估国内共产党，1948年2月危机中未能动员反共力量，被迫接受哥特瓦尔德主导的内阁；同年6月拒签新宪法辞职，9月3日在病痛交加中去世。其一生两度缔造、又两度目睹国家被极权吞噬，身后评价聚讼至今。"
 CZE_emanuel_moravec_desc:0 "1893年4月17日生于布拉格，1945年5月5日开枪自杀，捷克裔陆军上校与纳粹合作政客，史称“捷克奎斯林”。一战期间在奥匈军服役，1915年被俘后加入捷克斯洛伐克军团，随后参加俄国内战白军阵营。两战之间任军事学院讲师，1933年晋升上校，1930年代以强硬的反纳粹军事评论著称，是慕尼黑危机前最力主武装抵抗德国的捷克斯洛伐克军事声音之一。慕尼黑协定摧毁了他的信念，他随即转向占领者。1942年1月在海德里希支持下出任保护国教育与民众启蒙部部长，公然宣称“捷克人不需要大学”、拒绝重开高校，强制推行德语教育并主持亲德广播宣传，是纳粹对捷克族群推行意识形态同化的最重要工具之一。1945年5月5日布拉格起义爆发当日自杀身亡。"
 CZE_emil_franke_desc:0 "1880年4月3日生于波希米亚大布热兹诺，1939年12月1日卒于布拉格，捷克裔学者与政治家，哲学博士。先后在布拉格、维也纳、柏林研习法律和哲学，1903年起任布拉格大学图书馆员，从事比较语文学与印度学研究，1907年译出意大利哲学家克罗齐《美学》。1918年加入捷克民族社会党，同年起连任国会议员。两战之间历任供应部长、铁路部长、公共工程部长、社会救济部长、邮政与电报部长等多届政府要职，先后效力于图萨尔、什韦赫拉、乌德日扎尔、马利佩特尔、霍贾五位总理，被誉为捷克斯洛伐克“部长纪录保持者”；1939年12月因胃病与黄疸去世，未及目睹独立终结后的局面。"
 CZE_emil_hacha_desc:0 "1872年7月12日生于南波希米亚特尔霍维斯维内，1945年6月27日卒于布拉格潘克拉茨监狱，捷克裔法学家与合作主义政客。1896年取得布拉格大学法学博士学位后供职于波希米亚地方委员会；一战期间在维也纳最高行政法院任职，战后转至布拉格同院任法官（1918年）及副院长（1919年），1925年由马萨里克任命为院长，成为国内最资深法学权威之一，亦精通英国普通法，兼事英语文学翻译。慕尼黑协定签署、贝奈什被迫辞职后，他以无党籍保守天主教背景于1938年11月30日就任第二共和国总统。1939年3月14日深夜被召赴柏林，在哥林威胁轰炸布拉格的恐吓下一度心脏病发、被强制注射救治，于3月15日凌晨签署同意德国占领的文件；随即以“国家总统”之名充任保护国傀儡元首。任内他签署仿纳粹纽伦堡法律的反犹法令，并配合解散议会。1941年9月海德里希接任后，哈查彻底失去实质权力，不过充当保护国橡皮图章，身心日益衰竭。战后以战争罪嫌被捕，1945年6月27日死于潘克拉茨监狱，免于正式审判。"
 CZE_emil_kolben_desc:0 "1862年11月1日生于波希米亚斯特兰契采，1943年7月3日卒于泰雷津集中营，捷克裔犹太工程师与实业家。毕业于布拉格德意志理工大学后赴美，先后供职于爱迪生机器厂及爱迪生通用电气公司并出任首席工程师。1896年返国，在布拉格维肖查内区创办“科尔本公司”电工厂；1921年与他厂合并，1927年进一步组建ČKD（捷克摩拉维亚-科尔本-达涅克），成为捷克斯洛伐克最大重工企业，员工逾15,000人，涵盖电气、机车、工业设备等领域。1939年3月16日德国占领当日即被解除ČKD董事职务，1943年6月9日遭驱逐至泰雷津集中营，同年7月3日卒于其中。"
 CZE_emil_kolben_dod_desc:0 "1862年11月1日生于波希米亚斯特兰契采，1943年7月3日卒于泰雷津集中营，捷克裔犹太工程师与实业家。毕业于布拉格德意志理工大学后赴美，先后供职于爱迪生机器厂及爱迪生通用电气公司并出任首席工程师。1896年返国，在布拉格维肖查内区创办“科尔本公司”电工厂；1921年与他厂合并，1927年进一步组建ČKD（捷克摩拉维亚-科尔本-达涅克），成为捷克斯洛伐克最大重工企业，员工逾15,000人，涵盖电气、机车、工业设备等领域。1939年3月16日德国占领当日即被解除ČKD董事职务，1943年6月9日遭驱逐至泰雷津集中营，同年7月3日卒于其中。"
 CZE_emil_linhart_desc:0 "1889年2月16日生于摩拉维亚洛乌恰尼（今奥洛穆茨区），1959年12月10日卒于布拉格，捷克裔师级将军。一战期间在奥匈军服役并被俘，后加入捷克斯洛伐克军团，1918年10月起指挥第9步枪团一个营参加西伯利亚作战，翌年升任该团副团长。回国后历任第4步兵团副团长及团长（1921—1926），1923年晋上校。1926年调任米洛维采步兵学校校长，1928年晋准将，1931年出任第12步兵师师长，1934年1月晋师级将军。1935年10月起任驻布拉格第一军军长。1938年9月慕尼黑危机全国动员时出任第11边境防区司令，负责西北波希米亚克拉什泰雷茨—莫斯特—比利纳一线主防御阵地，正面宽约114公里；危机平息后返任第一军军长。1939年12月1日被强制退役。"
 CZE_ferdinand_catlos_desc:0 "1895年10月生于上匈牙利利普托夫斯基彼得（今斯洛伐克），1972年卒于马丁，具体日期各源不一，斯洛伐克裔将领与政治家，本名乔特洛什·南多尔。一战在奥匈军俄国前线被俘，1917年加入捷克斯洛伐克军团第7“塔特拉”步枪团，战后留在捷克斯洛伐克军中。1939年3月斯洛伐克独立后被任命为一级将军及国防部长，主持将原捷军斯洛伐克部队整编为独立军队。1939年9月1日以“贝尔诺拉克”野战军总指挥身份参加对波兰的入侵，斯军伤亡较轻但占领了波兰部分领土；1941年又将约45,000人派往东线参与巴巴罗萨行动。1944年初他与马拉尔将军秘密起草“察特洛斯备忘录”，拟发动军事政变推翻蒂索、建立亲苏军政府，8月4日派专机赴莫斯科递交方案，但代表直到9月2日起义已全面爆发才见到接头人。8月29日起义当晚他被软禁于蒂索总统府，9月13日被苏联内务部特工带走押赴苏联。战后以战争罪受审判刑约三年，出狱后在马丁任普通文书员终老。"
 CZE_ferdinand_peroutka_desc:0 "1895年2月6日生于布拉格，1978年4月20日卒于纽约，捷克裔记者、作家与政论家，第一共和国最具影响力的公共知识分子之一。1913年从事新闻工作，战后任《论坛报》主编；1924年获马萨里克总统资助创办政论周刊《今日》，该刊汇聚恰佩克、耶森斯卡等名家，成为捷克民主文化的旗舰。他以独立犀利的评论著称，既批共产党亦批国家民主党右翼，所著《建设国家》四卷本是第一共和国政治史的经典文献。1939年发表文章呼吁捷克人抵制法西斯修辞，旋被捕入达豪、转布痕瓦尔德集中营，纳粹以自由为条件要求他主编合作报刊，遭他拒绝，遂在营中度过整个战争。1945年获释后主编《自由新闻报》，1945至1946年以国家社会党身份任临时国民议会议员。1948年二月政变后徒步翻越边境流亡巴伐利亚。1951年5月出任自由欧洲电台捷克斯洛伐克部首任主任，首次播音即宣称“这是自由捷克斯洛伐克的声音”，主持该部至1961年，被美国支持者誉为“捷克斯洛伐克先生”。此后继续以自由撰稿人身份发表评论，1968年对布拉格之春抱持乐观，华约入侵后深感痛惜。1978年4月20日在纽约去世，1995年起捷克设立以他命名的新闻奖。"
 CZE_frantisek_chvalkovsky_desc:0 "1885年7月30日生于布拉格近郊伊洛维耶乌布拉迪，1945年2月25日遭盟军战机扫射击毙于柏林近郊公路，捷克裔外交官，捷克斯洛伐克外交部长。1920年入外交部；历任驻德国（1927—1932年）、意大利（1932—1938年）大使。1938年10月4日就任第二共和国外交部长，试图以让步维持独立，严重低估希特勒野心；参与第一次维也纳仲裁谈判，并于1939年3月15日随哈查赴柏林签署保护国协议。外交部关闭后以保护国驻德公使留任柏林（1939年7月13日任命），1945年2月25日死于盟军空袭。"
 CZE_frantisek_havel_desc:0 "1883年8月23日生于西里西亚楚克曼特尔（今兹拉特霍里），1958年4月20日卒于布拉格，捷克裔准将，工兵出身。毕业于布拉格捷克理工大学，1909年取得工程师学位。一战赴俄国前线，1915年被俘后加入捷克斯洛伐克军团。1918年6月1日指挥军团在梅霍瓦山战役中击败布尔什维克部队。回国后长期在陆军工兵系统任职，1931年起任国防部工兵处处长，主管捷克斯洛伐克边境要塞防御工事建设。1934年率军事代表团考察法国马奇诺防线，其考察成果直接影响了捷克斯洛伐克边境筑垒的设计方案。1939年6月1日退出现役。二战期间参加国内抗德地下抵抗活动。"
 CZE_frantisek_hrabcik_desc:0 "1894年11月30日生于摩拉维亚霍多拉内（奥洛穆茨附近），1967年7月28日卒，捷克裔师级将军，捷克斯洛伐克军团老兵。战后历任捷克斯洛伐克军队要职：1925—1926年任布拉格军区参谋长，1929—1932年任布拉格战争学院院长，1935—1936年任第六军军长。1938年9月—10月慕尼黑危机期间出任赴法军事使团团长，参与捷克斯洛伐克争取法国军事援助的最后外交努力，使团回国不久国家即告沦陷。"
 CZE_frantisek_machnik_desc:0 "1886年4月30日生于摩拉维亚内布热霍维采（斯特拉科尼采区），1967年11月21日卒于日达尼采，捷克裔政治家，农民党（捷克斯洛伐克共和党）议员。曾任教于赫鲁金和克拉托维，1925年起三度当选国民议会议员，兼任军事委员会副主席。1935年6月4日起出任国防部长，历经马利佩特尔第三届及霍贾二三届政府，主持捷克斯洛伐克军队大规模现代化改革与边境永备工事建设，与总参谋长克雷吉密切协作；至1938年9月22日慕尼黑危机顶峰时去职。1948年后遭共产党当局清算，1952年以捏造叛国罪被判五年，1953年特赦，晚年健康受损，1989年后始获公众重新认可。"
 CZE_frantisek_machnik_dod_desc:0 "1886年4月30日生于摩拉维亚内布热霍维采（斯特拉科尼采区），1967年11月21日卒于日达尼采，捷克裔政治家，农民党（捷克斯洛伐克共和党）议员。曾任教于赫鲁金和克拉托维，1925年起三度当选国民议会议员，兼任军事委员会副主席。1935年6月4日起出任国防部长，历经马利佩特尔第三届及霍贾二三届政府，主持捷克斯洛伐克军队大规模现代化改革与边境永备工事建设，与总参谋长克雷吉密切协作；至1938年9月22日慕尼黑危机顶峰时去职。1948年后遭共产党当局清算，1952年以捏造叛国罪被判五年，1953年特赦，晚年健康受损，1989年后始获公众重新认可。"
 CZE_frantisek_moravec_desc:0 "1895年7月23日生于恰斯拉夫，1966年7月26日卒于华盛顿特区，捷克裔军事情报局长，获授英国CBE勋章。1930年进入军事情报部门，1937年出任局长；1939年3月14日深夜率“莫拉韦茨十一人”携档案飞抵伦敦，1940—1945年任流亡政府情报长官，维系与国内三王抵抗网络的秘密电台联络，并参与策划刺杀海德里希的“人猿行动”。1945年回国，1948年政变后流亡美国，任国防部情报顾问至终。"
 CZE_frantisek_moravec_mun_desc:0 "1895年7月23日生于恰斯拉夫，1966年7月26日卒于华盛顿特区，捷克裔军事情报局长，获授英国CBE勋章。1930年进入军事情报部门，1937年出任局长；1939年3月14日深夜率“莫拉韦茨十一人”携档案飞抵伦敦，1940—1945年任流亡政府情报长官，维系与国内三王抵抗网络的秘密电台联络，并参与策划刺杀海德里希的“人猿行动”。1945年回国，1948年政变后流亡美国，任国防部情报顾问至终。"
 CZE_frantisek_moravec_mun_no_lar_desc:0 "1895年7月23日生于恰斯拉夫，1966年7月26日卒于华盛顿特区，捷克裔军事情报局长，获授英国CBE勋章。1930年进入军事情报部门，1937年出任局长；1939年3月14日深夜率“莫拉韦茨十一人”携档案飞抵伦敦，1940—1945年任流亡政府情报长官，维系与国内三王抵抗网络的秘密电台联络，并参与策划刺杀海德里希的“人猿行动”。1945年回国，1948年政变后流亡美国，任国防部情报顾问至终。"
 CZE_frantisek_moravec_no_mun_desc:0 "1895年7月23日生于恰斯拉夫，1966年7月26日卒于华盛顿特区，捷克裔军事情报局长，获授英国CBE勋章。1930年进入军事情报部门，1937年出任局长；1939年3月14日深夜率“莫拉韦茨十一人”携档案飞抵伦敦，1940—1945年任流亡政府情报长官，维系与国内三王抵抗网络的秘密电台联络，并参与策划刺杀海德里希的“人猿行动”。1945年回国，1948年政变后流亡美国，任国防部情报顾问至终。"
 CZE_frantisek_placak_desc:0 "1886年8月26日生于摩拉维亚蒂洛维采（罗日诺夫附近），卒年不详，捷克裔工程师与军工管理者，曾在奥匈炮兵服役。毕业于布尔诺高等工业学校机械科，通晓德、俄、波等语言；1907年入奥匈军要塞炮兵，官至中尉，1908年起在第一布尔诺机械厂任设计工程师。约1910年赴当时属俄国的华沙，主持谢弗-布登贝格公司的车间与技术处。一战期间他先后在彼尔姆兵工厂、伊热夫斯克兵工厂及彼得格勒炮弹厂主持生产合理化改造；1917年当选俄国捷克斯洛伐克国民议会分会委员，同年加入捷克斯洛伐克军团，任军团汽车排长，随军经西伯利亚、海参崴一线作战，1918年底起组建并主管军团的汽车勤务，是捷克斯洛伐克军事汽车化的早期骨干。1920年以上尉军衔回国，服役于汽车营，1921年转入预备役。此后转入军工管理，进入斯柯达体系，1930年起参与斯洛伐克杜布尼察新厂筹建与管理，后任斯柯达布拉格斯米霍夫厂负责人。其经历集中于军工、机械与火炮制造，是捷克斯洛伐克军事工业体系中的技术管理人物。"
 CZE_gustav_husak_desc:0 "1913年1月10日生于布拉迪斯拉发都布拉夫卡（时属奥匈帝国），1991年11月18日卒于布拉迪斯拉发，斯洛伐克裔律师与共产主义政治家。1929年加入共青团，1933年在科缅斯基大学法学院就读期间正式加入KSČ，1937年取得法学学位并以律师身份从事非法地下活动。1939年蒂索政权建立后多次因政治罪入狱（1940—1943年），出狱后参与组建斯洛伐克民族委员会，并出任1944年斯洛伐克民族起义重要领导人之一。战后历任斯洛伐克党政要职，1951年遭斯大林式清洗入狱，1963年平反，此后主导“正常化”时期，1969—1987年任KSČ第一书记，1975—1989年任总统。"
 CZE_hugo_vavrecka_desc:0 "1880年2月22日生于西里西亚奥斯特拉瓦，1952年8月9日卒于布尔诺，捷克裔记者、经济学家、外交官与政治家，瓦茨拉夫·哈维尔与伊万·哈维尔兄弟的外祖父。1904年毕业于布尔诺德意志工业大学（电机与机械工程），后任《人民报》经济版编辑；一战在的里雅斯特服役奥匈海军，并加入马菲亚地下组织。建国后入外交界，历任驻汉堡总领事（1920—1922）、驻匈牙利公使（1922—1926）、驻奥地利公使（1926—1932）。1932年因不满德奥接近而退出外交界，应托马什·巴塔之邀赴兹林，旋于巴塔同年坠机身亡后与扬·安东宁·巴塔、奇佩拉同任集团三人董事会成员。1938年9月起在霍贾、西罗维政府中任宣传部长（不管部长）至同年12月1日，斡旋慕尼黑后国家的处境。占领期间他借巴塔企业暗助抵抗：送犹太籍经理出国脱险、资助游击队与斯洛伐克民族起义、为扬·韦里赫赴美购票。战后巴塔被国有化、他遭撤职并以通敌嫌疑受审，1947年获判无罪；1948年政变后被重新起诉，同年12月22日以捏造证据判三年苦役、没收全部财产，经哥特瓦尔德干预得免入狱，1952年在布尔诺病逝。"
 CZE_jan_antonin_bata_desc:0 "1898年3月7日生于乌赫尔斯克赫拉迪什捷，1965年8月23日卒于圣保罗（巴西），托马什·巴塔的同父异母兄弟，被誉为“鞋王”。1932年托马什飞机失事后接掌巴塔集团，大萧条期间逆势扩张，将员工从16,000人增至38,000余人、企业从25家扩展至70家，遍布逾30国。1939年德占后流亡美国，1941年因曾尝试与纳粹当局谈判以保全公司而被盟国列入黑名单，最终定居巴西，创建巴塔伊波朗等多座工业城镇。其间秘密资助流亡政府并协助斯洛伐克民族起义。战后1947年缺席被判15年（实为充公资产的政治手段），2007年获法庭正式平反。"
 CZE_jan_dostalek_desc:0 "1883年4月28日生于谢季韦茨，1955年3月21日卒于布拉格，捷克裔政治家，捷克斯洛伐克人民党议员，建筑工程出身。在布拉格工业高等学校学习测量，又就读于维也纳艺术学院。1904年起供职于布拉格市政府，历任制图员、测量员，最终升至建设局长，在职达三十余年。两战之间历任捷克斯洛伐克工业部长及公共工程部长，并长期担任国民议会议员。1948年政变后遭共产党当局政治迫害，被捕入狱，1955年去世。"
 CZE_jan_golian_desc:0 "1906年1月26日生于多姆博瓦尔（今匈牙利，父母均为斯洛伐克裔），1945年卒，斯洛伐克旅级将军，斯洛伐克民族起义军事组织者与总指挥。1944年1月起任斯洛伐克地面部队总参谋长，驻班斯卡比斯特里察，与伦敦流亡政府秘密联络并建立地下军事总部（1944年4月27日）。1944年8月29日晚8时发出暗号“开始疏散”，宣告SNP爆发；9月晋升旅级将军，统率逾60,000人作战。10月7日将指挥权移交维斯特将军；10月27日下令转入游击战；11月3日在波赫罗恩斯基布科韦茨遭德军特别部队俘虏，被押往弗洛森比格集中营，1945年被处决。"
 CZE_jan_krcmar_desc:0 "1877年7月27日生于布拉格，1950年5月31日卒于布拉格，捷克法学家，查理大学民法正教授，国际私法领域最重要的捷克专家。1901年以“皇帝恩典”特等荣誉毕业于布拉格法学院，后赴莱比锡深造。1919年后以外交部法律顾问身份参与凡尔赛条约谈判，处理财产权及少数民族相关条款。两度出任教育与国民启蒙部长（1926年3—10月；1934年2月—1936年1月），期间兼参与新捷克斯洛伐克民法典起草。1948年后应个人请求从大学退休，晚年仍参与民法典中间草案修订工作，1950年去世。"
 CZE_jan_ruckl_desc:0 "1900年生，1938年卒，捷克斯洛伐克水晶玻璃实业家、天主教政治活动家，尼日博尔Rückl水晶玻璃厂家族核心成员。吕克尔家族自17至18世纪即从事波希米亚玻璃制造业，1903年安东宁·吕克尔在尼日博尔建成新厂，两战之间鼎盛时雇佣千余名工人，产品销往比利时、英国、印度及大马士革，1935年在巴黎玻璃展览会上获大奖。扬·伊日认同第一共和国民主路线，1935年总统选举中协助贝奈什争取斯洛伐克党派支持，1930年代发表政论同时批判纳粹主义与共产主义，捍卫议会民主原则。1938年因白血病早逝，未及目睹家族企业1945年被贝奈什法令国有化的命运。"
 CZE_jan_sramek_desc:0 "1870年8月11日生于摩拉维亚格里戈夫，1956年4月22日卒于布拉格，捷克天主教教士（国内侍从），捷克斯洛伐克人民党首任主席。1919年主持将多个天主教政治团体合并创建ČSL，此后长期把持党政要职，多次入阁。1940年7月21日至1945年4月5日以流亡政府总理身份领导伦敦流亡当局，使ČSL成为抵抗运动重要支柱。1948年2月共产党政变后被迫辞去党主席；出逃未遂被捕，此后遭共产党当局软禁与监控，1956年4月22日在拘禁状态下去世。"
 CZE_jan_syrovy_desc:0 "1888年生于摩拉维亚特热比奇，1970年卒，捷克斯洛伐克陆军上将，慕尼黑危机时期的总理。一战期间于捷克斯洛伐克军团作战，1917年兹博罗夫战役中失去右眼，得“独眼将军”之称；战争末期统率军团沿西伯利亚大铁路且战且行。两战之间历任总参谋长（1926—1933）与陆军总监（1933—1938）。1938年9月贝奈斯总统任命他为救国政府总理兼国防部长；他下令全国总动员，却终因英法弃捷而被迫接受慕尼黑协定，广播宣告“我们被抛弃了，只剩孤军”。贝奈斯辞职后一度代行总统职权，至同年12月卸任总理；1939年3月德军占领时下令不予抵抗。战后1945年被捕，1947年以“通敌”罪判二十年，自认问心无愧，1970年去世。"
 CZE_jaroslav_fajfr_desc:0 "1883年3月5日生于波希米亚洛乌尼，1974年8月8日卒于布拉格，捷克裔师级将军，捷克斯洛伐克空军事实上的首任总指挥。1905年入布拉格捷克高等工业学校修习几何与测量学，1913年毕业后任测量师并参加索科尔活动。一战随奥匈第28野战炮兵团赴俄国前线，后被俘加入捷克斯洛伐克军团，经历西伯利亚远征。回国后历任炮兵要职，1923年晋准将并出任第1野战炮兵旅旅长。1927年起任国防部第三处（航空处）处长，以师级将军衔执掌捷克斯洛伐克全部军事航空事务长达十二年，是空军体系的实际总指挥。1938年9月秘密前往莫斯科与苏军总参谋长沙波什尼科夫及空军司令洛克季奥诺夫商讨航空援助；9月27日在布尔诺与斯穆什科维奇会面，后者提出可调700架飞机驰援，惜因慕尼黑协定作罢。德占后协助飞行员出逃赴英。1945年5月起义期间任起义军空军指挥官。1949年以捏造间谍罪被捕，囚于米罗夫监狱，1954年获特赦。"
 CZE_jaroslav_kejla_desc:0 "1892年7月27日生于波希米亚卢布纳，1977年8月18日卒于布拉格，捷克斯洛伐克空军将领、工程师、俄国军团老兵。一战期间在俄国加入捷克斯洛伐克军团，战后进入捷克斯洛伐克军队，长期从事军事航空的技术与军械保障工作。1936年与卡雷尔·加努瑟克等人同批晋升为空军将官，军衔方向为“空军技术军械勤务将官”，即主管航空装备、武器与器材的技术系统，而非一线飞行指挥。其公开履历记载较为零散，但生卒、出身与军衔方向均可确认。"
 CZE_jaroslav_kejla_idea_desc:0 "1892年7月27日生于波希米亚卢布纳，1977年8月18日卒于布拉格，捷克斯洛伐克空军将领、工程师、俄国军团老兵。一战期间在俄国加入捷克斯洛伐克军团，战后进入捷克斯洛伐克军队，长期从事军事航空的技术与军械保障工作。1936年与卡雷尔·加努瑟克等人同批晋升为空军将官，军衔方向为“空军技术军械勤务将官”，即主管航空装备、武器与器材的技术系统，而非一线飞行指挥。其公开履历记载较为零散，但生卒、出身与军衔方向均可确认。"
 CZE_jaroslav_krejchi_desc:0 "1892年6月27日生于摩拉维亚克热梅内茨，1956年5月18日死于狱中，捷克裔法学家，纳粹合作者。1915年毕业于布拉格查理大学法学院，此后长期在文官系统任职，自1930年代起兼任布尔诺马萨里克大学宪法法学讲师，1938年升任正教授。1938年12月12日出任第二共和国贝兰政府司法部长兼宪法法院院长，至1939年3月3日；保护国建立后，他又历任各届保护国政府司法部长，并一度代掌农业部。1941年9月，总理阿洛伊斯·埃利亚什因秘密联络流亡政府遭海德里希逮捕（翌年6月处决），克雷伊奇随即被委以总理职位，正式就任于1942年1月19日。在他主持下，傀儡政府配合纳粹当局推行劳动力动员，驱使捷克工人大批赴德服役；政府亦颁行各类行政法规，为占领机器的日常运转提供行政支撑。1945年1月19日去职，由理查德·比内特接任。战后以通敌罪被判处25年监禁，1956年5月18日死于狱中。其子、同名社会学家（1916—2014）与父亲的合作路线截然相反，积极参与抗德地下运动，战后任教于英国兰卡斯特大学。"
 CZE_jaroslav_slechta_desc:0 "1898年3月14日生于布拉格，1989年10月25日卒于布拉格，享年91岁，捷克航空与直升机设计师、飞行员，机械工程师。一战后在布拉格展览场航空俱乐部与航空兵工厂起步，后进入由哈伊恩、贝奈什领衔的布拉格公司航空部，设计多型成功滑翔机，其中“布拉格”号1932年成为捷克斯洛伐克首架飞行逾一小时的滑翔机。1934年哈、贝二人离去后，他升任该厂主设计师，主持设计了著名轻型运动机 Praga E-114“Air Baby”（1934年8月首飞），该机商业上大获成功，远销法国、伊朗、罗马尼亚，并在曼彻斯特以“Hillson Praga”之名特许生产；另设计 E-210 运输机、E-51 侦察轻轰炸机等。二战期间（1942—1943）被迫赴德国哈雷为德方研制直升机，暗中钻研旋翼周期变距控制。战后他在国有化的 Aero 公司领导原布拉格设计组，主持研制 Praga XE-II——捷克斯洛伐克自制的第一架直升机（1950年9月首次自由飞行），并被誉为首型量产直升机Aero HC-2“Heli Baby”（1958年）之父，1956年获劳动勋章。"
 CZE_josef_cerny_desc:0 "1885年2月28日生于东波希米亚内波利西一户农家，1971年12月7日卒于纽约，捷克裔政治家、律师，捷克斯洛伐克农民党（共和党）国会议员与内政部长。在布拉格、维也纳攻读法律，后为布拉格知名律师，早年即投身农民运动。1921年娶农民党领袖安东宁·什维赫拉之女海伦娜为妻，跻身党内新生代核心。1918年起任国会议员，1920、1925、1929、1935年连选连任，直至1939年议会解散。1934年2月起出任内政部长，历经马利佩特尔第二、三届政府及霍贾三届政府，至1938年9月，奉行“铁腕”政策维护内部稳定，对汉莱因等苏台德德意志分离活动既坚决又审慎，1935年大选前曾建议取缔汉莱因的苏台德德意志党未果；其主管的内政部顶住柏林压力，对德国民主派流亡者仍宽容收容、给予庇护。1938年12月并入新成立的民族统一党。德占后流亡海外，在美国参与重建流亡农民党，并加入1949年成立的自由捷克斯洛伐克委员会及“受奴役民族组织”，1971年客死纽约。"
 CZE_josef_frantisek_desc:0 "1914年10月7日生于摩拉维亚奥塔斯拉维采一户木匠家庭，1940年10月8日因飞机失事坠亡于英国伊维尔附近，捷克裔战斗机王牌飞行员。原为锁匠学徒，1934年加入捷克斯洛伐克空军，受训于普罗斯捷约夫，性情桀骜、屡因违纪受罚，却显露出非凡飞行天赋。1939年3月德国占领后逃往波兰，加入波兰空军并参加九月抗德作战；波兰沦陷后经罗马尼亚、巴尔干、叙利亚辗转赴法，又在法军中作战；法国败降后赴英，1940年8月2日编入英国皇家空军第303（波兰）中队，驾驶飓风式战斗机。自9月2日首胜起，他在短短四周内确认击落17架德机，成为不列颠空战中战绩最高的非英籍盟军王牌。因其惯于脱离编队“单骑猎杀”，长官索性让他单独巡逻。1940年10月8日，他在巡逻返航途中坠机身亡（疑因身心俱疲），身后追授英国杰出飞行奖章及横杠，2015年获追授捷克白狮勋章一级。"
 CZE_josef_guttman_desc:0 "1902年生，1956年（一说1958年）卒于美国，捷克裔犹太记者、政治家，捷克斯洛伐克共产党早期领导人之一。1929年第五次党代会上与哥特瓦尔德、斯兰斯基、什韦尔马、柯别茨基、雷曼同列党中央，史称“卡尔林小子”，并任党机关报《红色权利报》总编辑。1933年，他公开批评共产国际在德国法西斯威胁面前的路线（即客观上助希特勒上台的政策），严重违反党纪，被扣上“托洛茨基主义”帽子，遭撤职并开除出党，成为著名的反斯大林左翼异见者。1938年底离开捷克斯洛伐克，辗转瑞典，1941年抵纽约，此后长期以彼得·迈尔等化名为美国犹太人委员会等机构撰稿，成为苏联集团事务的重要分析者与极权主义的批判者。1968年其名誉在国内获得平反。"
 CZE_josef_kalfus_desc:0 "1880年6月25日生于波希米亚热莱兹尼布罗德，1955年6月12日卒于利贝雷茨，捷克裔法学博士、财政专家。1920年起任职财政部，1936年3月28日出任捷克斯洛伐克财政部长，此后历经数届政府，并在保护国时期续任至1945年5月5日，其间获颁保护国“圣瓦茨拉夫雄鹰”勋章。作为保护国政府成员，他在表面上配合占领当局的财政运作与对德经济整合；但与此同时，他奉贝奈斯总统之命，秘密将财政资源转移至中立国以资助海外抵抗，1939年3月销毁重要文件、同年6月协助兵工厂总经理奥特拉塔出逃，并长期暗助地下组织“政治中心”，直至1941年10月联络人遭捕。他还在内政部长比内特暗助下协助保全索科尔经费、掩护扎莱卡-哈伊斯基一家。1946年他作为保护国政府成员被送交国家法院审判，被判有罪但免于科刑；1948年后全部财产遭没收，1955年去世。"
 CZE_josef_rozsevac_desc:0 "1901年11月1日生于霍日采附近的比尔斯科（波希米亚），1946年6月27日在布拉格潘克拉茨监狱被绞死，捷克裔记者、政治家，捷克法西斯组织“旗帜”的首领。曾入大学攻读医学未竟。1936年加入1930年创立的民族主义组织“旗帜”，并取笔名“扬·里斯”，以此名出版反犹著作《犹太共济会——人类的祸根》（1938）等。慕尼黑协定后“旗帜”被取缔、他一度入狱，1939年3月德占前夕获释并出任“旗帜”首领，力图建成群众性法西斯组织，并推动该组织从早年的反德沙文主义转向与纳粹及盖世太保合作；1939至1940年间屡次举行声讨马萨里克、贝奈斯等第一共和国政要的大会。但占领当局转而扶植其竞争对手埃马努埃尔·莫拉韦茨一派，加之“旗帜”不断攻击莫拉韦茨，该组织于1942年底被解散，其首领以“优待犯”身份被押往达豪集中营，战争末期转押蒂罗尔，1945年5月获释。战后他与三名同伙被判死刑，1946年6月27日绞死于潘克拉茨。"
 CZE_josef_shnejdarek_desc:0 "1875年4月2日生于摩拉维亚纳帕耶德拉一户磨坊家庭，1945年5月13日卒于卡萨布兰卡（术后离世），捷克裔陆军一级上将、传奇军人。早年入奥匈军，后远赴法国外籍军团服役多年，转战北非屡次负伤并入法籍。一战在西线马恩、索姆、贵妇小径诸役作战，战场晋升上尉，获荣誉军团勋章；1917年转任捷克斯洛伐克军团联络官，协助组建军团。1919年1月以法国公民身份回国，受命指挥切欣（特申）地区部队，1月23日对波军发起进攻、引爆波捷战争，进逼斯科乔夫时被协约国叫停。2月晋上校，5月31日转任第2步兵师师长，在中斯洛伐克对抗匈牙利苏维埃共和国，化退却为反攻，6月13日攻取兹沃伦一带，为捷方制胜立功。其后历任第9、第7、第11步兵师师长，1930年11月晋一级上将，先后任科希策（1925至1932）与布拉迪斯拉发（1932至1935）地区军事司令，并在佩特尔扎尔卡修筑捷克斯洛伐克最早的混凝土碉堡，1935年退役。1939年斯洛伐克独立后流亡法国，1940年重返流亡军队，法国沦陷后赴北非，1945年卒于卡萨布兰卡。著有自传《我的经历》（1939）。"
 CZE_josef_snejdarek_desc:0 "1875年4月2日生于摩拉维亚纳帕耶德拉一户磨坊家庭，1945年5月13日卒于卡萨布兰卡（术后离世），捷克裔陆军一级上将、传奇军人。早年入奥匈军，后远赴法国外籍军团服役多年，转战北非屡次负伤并入法籍。一战在西线马恩、索姆、贵妇小径诸役作战，战场晋升上尉，获荣誉军团勋章；1917年转任捷克斯洛伐克军团联络官，协助组建军团。1919年1月以法国公民身份回国，受命指挥切欣（特申）地区部队，1月23日对波军发起进攻、引爆波捷战争，进逼斯科乔夫时被协约国叫停。2月晋上校，5月31日转任第2步兵师师长，在中斯洛伐克对抗匈牙利苏维埃共和国，化退却为反攻，6月13日攻取兹沃伦一带，为捷方制胜立功。其后历任第9、第7、第11步兵师师长，1930年11月晋一级上将，先后任科希策（1925至1932）与布拉迪斯拉发（1932至1935）地区军事司令，并在佩特尔扎尔卡修筑捷克斯洛伐克最早的混凝土碉堡，1935年退役。1939年斯洛伐克独立后流亡法国，1940年重返流亡军队，法国沦陷后赴北非，1945年卒于卡萨布兰卡。著有自传《我的经历》（1939）。"
 CZE_josef_vana_desc:0 "1893年1月19日生于乌斯特拉申，1976年4月6日卒于捷克布罗德，捷克裔师级将军。1912至1914年就读布拉格哲学院，1915年应征赴俄国前线，同年2月被俘，在战俘营中加入塞尔维亚志愿军，辗转转入捷克斯洛伐克军团。回国后赴法国进修，1930年晋准将并调入国防部，1932至1934年任国防部步兵处长。1935至1939年任驻赫拉德茨-克拉洛韦的第二军军长；1938年9月动员时统率第二军，负责北波希米亚边境防御。割地后迁居布拉格，沦陷期间一直留居该地，并参加1945年5月的布拉格起义。"
 CZE_josef_votruba_desc:0 "1879年11月8日生于波伊泽里地区的德布日（姆拉达博莱斯拉夫附近），1959年10月7日卒于布拉格，捷克裔陆军一级上将。1896年入维也纳地方防卫军军校，后毕业于维也纳军事学院，一战中以奥匈参谋军官身份转战俄国、巴尔干、伊斯特里亚与皮亚韦河前线。1918年11月在维也纳向捷克斯洛伐克全权代表报到、加入新军，1919年参加斯洛伐克对匈作战。两战之间历任第3师参谋长、步兵团长、旅长等职，1937年1月晋一级上将，主张积极防御战术。1938年9月动员时统率“什捷凡尼克”第三军团，兼斯洛伐克与喀尔巴阡乌克兰地区司令，下辖七个师，司令部设于克雷姆尼察；10月起短暂指挥南摩拉维亚第四军团，旋因糖尿病恶化请退，1939年1月退役。战后因其德裔妻子1942年曾申请德国国籍而受调查（查明实为给重病丈夫多领食品配给），1946年5月恢复军衔；1948年后被共产党降为列兵、剥夺抚恤并逐出布拉格，1959年去世。"
 CZE_kamil_krofta_desc:0 "1876年7月17日生于皮尔森，1945年8月16日卒，捷克历史学家与外交官。查理大学历史系毕业，1901年起供职国家档案馆，1911年起任大学奥地利史及捷克史教授。外交方面，1920年出任首位驻梵蒂冈使节（促成两国建立正式外交关系），此后历任驻维也纳（1922—1925）、驻柏林（1925—1927）公使。1927年起任外交部总统处长，为外长贝奈什核心顾问；1936年2月29日升任外交部长，至1938年10月4日慕尼黑危机后辞职。保护国期间投身抵抗运动，1944年被捕，辗转关押于潘克拉茨及特里斯因，1945年获救后不久因狱中所受迫害而去世。"
 CZE_karel_domin_desc:0 "1882年5月4日生于波希米亚库特纳霍拉，1953年6月10日卒于布拉格，捷克裔植物学家。1906年毕业于布拉格查理大学植物系，1916年起任植物学正教授，在大学创立植物学研究所，专攻植物地理学与分类学。1909—1910年赴澳大利亚昆士兰考察，1911—1913年发表系列澳洲植物分类论文；他发展的“多明等级”（衡量特定面积内植物种数的标准量表）在国际上广为使用。1933—1934年出任查理大学校长，参与捷克德两所大学之间因古典校徽归属而引发的“校徽事件”争执。纳粹占领期间遭受学术迫害。"
 CZE_karel_englis_desc:0 "1880年8月17日生于西里西亚赫拉比涅（奥帕瓦区），1961年6月13日卒于同地，捷克裔经济学家与政治家，目的论经济理论创始人。1904年毕业于布拉格查理大学法学院；1910年起在布尔诺任教，1919年参与创建马萨里克大学并出任首任校长。1918—1925年任国会议员，六度出任财政部长（主要任期1920—1931年），对战后货币改革及财政现代化贡献重大；1934—1938年任捷克斯洛伐克国家银行行长。1947—1948年出任查理大学末届自由选举校长，1948年政变后被迫辞去全部职务，1952年被驱逐出布拉格，此后在故乡赫拉比涅终老。"
 CZE_karel_husarek_chief_desc:0 "1893年1月31日生于摩拉维亚切霍维采（今普罗斯捷约夫区），1972年卒，捷克裔工兵将领。一战期间在奥匈炮兵服役，1916年被俘后加入捷克军团参与西伯利亚作战。战后历任炮兵要职，1924年赴巴黎高等战争学院深造，1933年晋升准将并出任第16旅旅长。1937年辞任总参谋部陆军作战局长，转而专力主持捷克斯洛伐克边境防御工事建设，拟定详细的“胡萨雷克防御计划”（1937年11月）；1938年慕尼黑危机期间坚决反对接受协定。"
 CZE_karel_husarek_desc:0 "1893年1月31日生于摩拉维亚切霍维采（今普罗斯捷约夫区），1972年卒，捷克裔工兵将领。一战期间在奥匈炮兵服役，1916年被俘后加入捷克军团参与西伯利亚作战。战后历任炮兵要职，1924年赴巴黎高等战争学院深造，1933年晋升准将并出任第16旅旅长。1937年辞任总参谋部陆军作战局长，转而专力主持捷克斯洛伐克边境防御工事建设，拟定详细的“胡萨雷克防御计划”（1937年11月）；1938年慕尼黑危机期间坚决反对接受协定。"
 CZE_karel_janousek_desc:0 "1893年10月30日生于摩拉维亚普热罗夫，1971年10月27日卒于布拉格，捷克空军将领、迄今唯一荣获英国空军元帅衔的捷克斯洛伐克人。一战参加捷克军团，1926年转入空军取得飞行执照，1939年获自然科学博士学位。1940年6月抵英，主持建立RAF捷克斯洛伐克空军督察部，统辖310、311、312、313四个中队逾3,000名航空员，由英王乔治六世授予英浴勋章，1945年5月17日晋升空军元帅。1948年政变后遭迫害，初判18年并被褫夺军衔、博士学位及全部勋章，刑期后递加至无期，1955年减为25年，1960年获总统大赦出狱；1971年去世，其妻及多名家属死于纳粹关押。"
 CZE_karel_kuttelwascher_desc:0 "1916年9月23日生于波希米亚圣克日斯（今哈夫利切夫布罗德地区），1959年8月17日卒，捷克裔飞行王牌。1934年加入捷克斯洛伐克空军；德国占领后辗转经波兰、法国抵英，1941年10月加入英国皇家空军第1中队。1942年专攻夜间袭扰任务，驾驶飓风式战斗机于德占法国上空三个月内击落15架，全战确认击落18架，获两度杰出飞行十字勋章，为捷克裔RAF飞行员最高战绩、亦是皇家空军效率最高的夜间袭扰王牌之一。1959年因心脏病去世，2000年被捷克共和国追授准将军衔。"
 CZE_karel_pavala_desc:0 "生卒年不详，捷克斯洛伐克河川舰队军官。捷克斯洛伐克海军规模有限，1921年起其水上部队编为隶属陆军第4工兵团的“水上营”，以多瑙河—布拉迪斯拉发一线防务为主。帕瓦拉在这支多瑙河河川舰队中任职，并见于记载为旗舰级河川巡逻舰（监视舰）“马萨里克总统号”的指挥官——该舰1932年正式服役，是两战之间捷克斯洛伐克最大的战斗舰艇，长约50米、排水量约214吨，装备四门66毫米炮，常率队出航演训；慕尼黑协定后失去防御价值，德国占领后被编入德军多瑙河区舰队并改名Bechelaren。帕瓦拉是捷克斯洛伐克有限的多瑙河防务体系中的实际指挥人物之一。"
 CZE_karel_prochazka_desc:0 "1890年5月28日生于波斯尼亚萨拉热窝（时属奥匈帝国），卒年不详，捷克斯洛伐克空军将领。两战之间长期在空军部队任职：1928年12月晋中校，先后任第1航空团第2大队队长、第6航空团副团长，1930至1931年在布拉格进修指挥官课程，1931至1933年任第5航空团团长，1933年晋上校；其后调任布拉迪斯拉发地域航空司令（1933—1934），并赴布拉格高级指挥官课程深造。1936年12月22日晋准将，自1934年底起出任航空旅旅长直至1939年5月，是第一共和国后期空军指挥体系中的重要人物。德国占领后，他于1939年7月在保护国“政府军”体系中出任第二督察部主任，1944年改任联合督察部主任，1944年10月至1945年2月一度出任保护国陆军联合参谋长。需注意此人系空军将领，与战后同名的情报系统人物并非一人。"
 CZE_karel_schwarzenberg_desc:0 "1911年7月5日生于南波希米亚奇梅利采，1986年4月9日卒于维也纳，捷克裔贵族、历史学家与抵抗运动战士。父亲在一战塞尔维亚战线阵亡，他以施瓦岑贝格家族捷克支系继承人身份承袭家业。就读布拉格理工学院（林学）及查理大学（师从史学家约瑟夫·佩卡日，专攻历史与纹章学）。1930年代，其天主教保守主义与民族主义立场使他短暂参与法西斯运动“旗帜运动”，主张混合君主制与法西斯理念——此段历史与他后来的立场截然相反。1938年慕尼黑危机成为其思想转折点：他彻底放弃早年的反犹与法西斯立场，此后终生支持捷克独立及建立犹太国。1938年和1939年，他联合捷克贵族向贝奈什总统和哈查总统递交宣言，表明历史贵族阶层誓死拥护捷克领土完整；他拒绝以德意志根源申领第三帝国公民身份。1942年帝国保护者海德里希指控施瓦岑贝格家族从事敌对活动与间谍罪，接管其家族产业；他随即在奇梅利采秘密参与抵抗运动，战后以反法西斯战士身份获得认可。1948年共产党政变后家族产业再度被没收，他流亡维也纳担任档案研究员，1986年4月9日在当地去世。其子卡雷尔七世（1937—2023）后出任捷克外交部长。"
 CZE_karel_vaclav_petrik_desc:0 "1885年8月16日生于波希米亚内兹迪采（今捷克），1957年7月8日卒，捷克裔将领。一战爆发时正旅居俄国基辅，于1914年8月30日加入捷克志愿兵团，历经东线多处战役，1918年升任第9捷克步兵团团长并晋衔上校。战后历任第5师师长及布拉格土地军区副司令达十余年；1938年慕尼黑危机期间指挥亚什至特普利采一线边境防御，1940年1月1日被编入退役。德国占领期间秘密参与抵抗运动，1948年后一度遭共产当局短暂羁押。"
 CZE_klement_gottwald_desc:0 "1896年11月23日生于摩拉维亚杰迪采（今属维什科夫市，另说胡什蒂采-赫罗尔蒂采），1953年3月14日卒于布拉格，捷克共产革命家。出身贫苦，12岁赴维也纳学木匠，在社会民主党青年运动中走向左翼；一战期间服役奥匈军（1915—1918），战末脱逃。1921年参与创建捷克斯洛伐克共产党，任布拉迪斯拉发党报编辑；1925年进入党中央委员会，1929年第五次党代会上与“卡尔林小子”团队一同当选总书记，推行布尔什维克化并入主国会。1935年起任共产国际书记，主导反法西斯人民阵线路线。1938年11月KSČ遭取缔后流亡莫斯科，1943年与贝奈什商定战后联合政府框架。1945年5月回国出任副总理；1946年3月当选党主席，同年5月大选中率KSČ以约38%得票成为第一大党，7月3日就任总理。1948年2月25日迫使总统贝奈什接受共产党主导新政府（“二月事件”），6月14日正式出任捷克斯洛伐克首位共产党总统。任内推行国有化与农业集体化，发动斯大林式政治清洗，1952年12月将党总书记斯兰斯基等人送上绞架。1953年3月9日赴莫斯科出席斯大林葬礼，归途染疾，3月14日在斯大林身后九天去世。"
 CZE_konrad_henlein_desc:0 "1898年5月6日生于马费尔斯多夫（今利贝雷茨弗拉蒂斯拉维采），1945年5月10日于美军羁押中在皮尔森自杀，苏台德德意志裔捷克斯洛伐克公民。一战后任体操教练，1933年10月1日创建苏台德德意志本乡前线，大选中获15.2%票率成为捷克斯洛伐克最强单党。他秘密接受柏林指令，故意提出不可满足的要求（“我们必须提出无法被满足的要求”）以制造危机；1938年3月28日密会希特勒，9月组织武装暴乱，慕尼黑后加入纳粹党与党卫军，任苏台德地区帝国专员。1939年5月1日起担任苏台德大区区长，主导将大批人口驱逐至灭绝营。"
 CZE_lev_prchala_desc:0 "1892年3月23日生于西里西亚奥斯特拉瓦，1963年6月11日卒于奥地利费尔德巴赫，捷克裔将领。一战参加捷克斯洛伐克军团，战功卓著，两战之间历任多职，最终晋升陆军上将。1938年9月慕尼黑危机期间指挥布尔诺第四军团；1939年1月出任卡尔帕提亚路塞尼亚自治政府部长，德国占领后被迫退役。1939年5月秘密携家出逃波兰，组建捷克斯洛伐克军团，9月遭苏军逮捕后获释，经罗马尼亚辗转于1940年抵英。与贝奈什流亡政府矛盾尖锐，另组反共流亡团体；战后被褫夺上将军衔，此后流亡至终。"
 CZE_louis_eugene_faucher_desc:0 "1874年10月8日生于法国德塞夫尔省一户木匠家庭，1964年3月30日卒，法国陆军中将，捷克斯洛伐克荣誉陆军上将。1896年任少尉，先后就读于枫丹白露应用炮兵学校和巴黎高等军事学院。一战在第二十军和总参谋部作战处服役。1919年随法国军事使团抵布拉格，任使团参谋长，参加1919年对匈斯洛伐克战争；1926年接任使团团长，直至1938年。在布拉格的近二十年间，他深度参与捷克斯洛伐克军队建设，与捷方将领结下深厚战友情谊。1938年9月英法向布拉格发出最后通牒后，福谢愤而向巴黎辞去法军职务，将全部人身交予捷克斯洛伐克军队调遣。离开布拉格时，他在车站检阅仪仗队时含泪亲吻捷军军旗，捷方军官无不动容。1939年战争爆发后他被重新任命为法国驻捷克斯洛伐克军事使团团长，协助在南法阿格德组建第一捷克斯洛伐克师，募得逾万名官兵。法国陷落后他投身秘密军，任西南大区（波尔多）抵抗运动负责人；1944年初被盖世太保逮捕，押入菲森-普朗湖劳役营，战争末期获释。战后重返布拉格试图复兴法捷友谊，1948年政变后方撤离。1964年去世。"
 CZE_louis_eugene_faucher_high_command_desc:0 "1874年10月8日生于法国德塞夫尔省一户木匠家庭，1964年3月30日卒，法国陆军中将，捷克斯洛伐克荣誉陆军上将。1896年任少尉，先后就读于枫丹白露应用炮兵学校和巴黎高等军事学院。一战在第二十军和总参谋部作战处服役。1919年随法国军事使团抵布拉格，任使团参谋长，参加1919年对匈斯洛伐克战争；1926年接任使团团长，直至1938年。在布拉格的近二十年间，他深度参与捷克斯洛伐克军队建设，与捷方将领结下深厚战友情谊。1938年9月英法向布拉格发出最后通牒后，福谢愤而向巴黎辞去法军职务，将全部人身交予捷克斯洛伐克军队调遣。离开布拉格时，他在车站检阅仪仗队时含泪亲吻捷军军旗，捷方军官无不动容。1939年战争爆发后他被重新任命为法国驻捷克斯洛伐克军事使团团长，协助在南法阿格德组建第一捷克斯洛伐克师，募得逾万名官兵。法国陷落后他投身秘密军，任西南大区（波尔多）抵抗运动负责人；1944年初被盖世太保逮捕，押入菲森-普朗湖劳役营，战争末期获释。战后重返布拉格试图复兴法捷友谊，1948年政变后方撤离。1964年去世。"
 CZE_ludvik_krejci_desc:0 "1890年8月17日生于摩拉维亚图尔扬（今布尔诺市区），1972年2月9日卒于乌斯季纳德奥利奇，捷克裔陆军上将。一战期间在奥匈军多条战线服役，1917年5月在俄国前线被俘，随即加入捷克斯洛伐克军团。战后历任要职，1928年晋升师级将军，1933年12月应马萨里克总统要求出任武装力量总参谋长，1934年3月晋升陆军上将。任内力主现代化建军，主导建设边境要塞防线，与贝奈什总统密切协作；1938年9月坚决反对慕尼黑协定，并被任命为动员军队总司令。1939年3月在德方压力下被迫离职。占领期间留守国内，1941年10月遭盖世太保逮捕，关押于特里斯因，1942年7月获释。战后1947年退役，1950年被降级至普通士兵，1990年死后恢复军衔。"
 CZE_ludvik_svoboda_desc:0 "1895年11月25日生于摩拉维亚霍兹纳廷，1979年9月20日卒于布拉格，捷克裔将领与政治家，两次世界大战中的民族英雄。一战期间服役奥匈军，后参加捷克斯洛伐克军团，经历兹博罗夫与巴赫马奇战役。1939年德国占领后加入地下组织“国家防卫”，随后出走苏联组建捷克斯洛伐克军事单位。二战期间率第1捷克斯洛伐克军团参与索科洛沃战役（1943年3月）及杜克拉山口战役（1944年秋），1945年8月晋升陆军上将。1945—1950年出任国防部长，1948年政变时拒绝出兵镇压，1950年遭苏联施压免去军职，1951至1952年间一度被捕，其后赋闲；1950年代中期经赫鲁晓夫过问复出，任哥特瓦尔德军事学院院长，1959年退役。1968年布拉格之春期间当选总统，华约入侵后屈从“正常化”路线，1975年被迫离职，1979年去世。"
 CZE_ludwig_czech_desc:0 "1870年2月14日生于奥匈帝国伦贝格（今乌克兰利沃夫），1942年8月20日卒于泰雷津集中营，苏台德德意志裔犹太律师与政治家。在维也纳研习法律后于布尔诺执业，1897—1901年主编党报《人民之友》。捷克斯洛伐克建国后出任德意志社会民主工人党副主席（1919年）及主席（1921年起），长期领导“积极主义”派系，力主与共和国合作而非对抗。历任社会救济部长（1929—1934年）、公共工程部长（1934—1935年）及公共卫生部长（1935—1938年），三届入阁使他成为苏台德德意志人在捷克斯洛伐克民主政体内参政的最重要代表。慕尼黑后DSAP解散，他遭驱逐至泰雷津，1942年8月20日在集中营去世，官方记录死因为肺炎与心力衰竭。"
 CZE_melichar_frantisek_desc:0 "1889年8月31日生于南波希米亚姆拉达沃日采一户铁匠家庭，1975年6月23日卒于劳尼，捷克裔师级将军、一战军团老兵。早年在布拉格读夜间商业学校，1914年在塞尔维亚任银行职员并入塞籍，一战中转战保加利亚、突尼斯、希腊、俄国诸前线；1918年5月脱离塞军，随捷克志愿者辗转法国、意大利军团。回国后参加1919年斯洛伐克之战，旋赴贝尔格莱德出任驻塞尔维亚-克罗地亚-斯洛文尼亚王国武官，1923年晋上校。1925年应本人请求回国，历任第28步兵团副团长、第9步兵团团长等职，1931年晋准将。1938年9月慕尼黑危机动员期间负责北波希米亚一线防御。1939年退役；德占期间虽受警方监视，仍于1941年投身抵抗，1943年遭盖世太保逮捕入狱，幸存至战后。晚年专事撰写梅利哈尔铁匠家族史与故乡拉季博日训山镇史，是少数在共产党时期获正式军葬的军团老兵之一。"
 CZE_mikulas_dolezal_desc:0 "1889年12月6日生于佩尔赫日莫夫附近弗拉塞尼采一户小农家庭，1941年10月1日在布拉格鲁济尼耶被处决，捷克裔师级将军、一战军团老兵、“国家防卫”中央领导成员。曾在布拉格捷克高等工业学校攻读机械工程，1913年入奥匈蒂罗尔皇家猎兵团；一战在喀尔巴阡山被俘后，1916年5月先入塞尔维亚志愿师参加多布鲁甲之战，1917年1月转入捷克斯洛伐克军团第8步枪团，转战乌克兰、乌拉尔与西伯利亚，曾任第3师通信勤务长，为全军团制定通信勤务章程。回国后历任要职，1935年9月继卢扎之后出任布拉格高等军事学院院长，兼军事科学研究所秘书长及《军事评论》主编，1938年初晋师级将军，并任驻南斯拉夫军事使团团长、后任第六军军长。德国占领后投身“国家防卫”中央领导，先为大布拉格地区司令的副手，后任该组织第二代中央领导人霍莫拉的副手，负责扩建地下指挥网。1941年8月4日被盖世太保逮捕，10月1日在首次戒严中被枪决，时年五十二岁。"
 CZE_milada_horakova_desc:0 "1901年12月25日生于布拉格（本姓克拉洛娃），1950年6月27日在布拉格潘克拉茨监狱被绞死，捷克裔律师、女权活动家与民主政治家。1926年毕业于查理大学法学院，入布拉格市政府社会福利部门任职，长期投身妇女平权运动，1929年加入捷克国家社会党（与纳粹毫无关联、立场坚决反纳粹）。1938年慕尼黑协定后救助苏台德难民，德国占领期间参加抵抗组织“我们忠贞不渝”，1940年被盖世太保逮捕，备受酷刑而不屈，1944年被纳粹判处死刑后改判八年苦役，1945年获美军解放。战后重返国家社会党，1946年当选国会议员；1948年二月共产党政变后愤而辞去议席，仍在体制外坚持民主理念。1949年9月27日被捕，次年5月31日起遭受苏联顾问操纵的公开审判，被诬以阴谋叛国，6月8日判处死刑。尽管爱因斯坦、丘吉尔、埃莉诺·罗斯福等国际名流纷纷请命，仍未能挽回，6月27日清晨她从容就义。其判决1968年获撤销，1989年后彻底平反，6月27日被定为捷克“共产政权受难者纪念日”。"
 CZE_milan_hodza_desc:0 "1878年2月1日生于上匈牙利苏恰内（今斯洛伐克），1944年6月27日卒于美国佛罗里达州克利尔沃特，斯洛伐克裔政治家、记者，捷克斯洛伐克农民党领袖，首位斯洛伐克籍捷克斯洛伐克总理。早年为斯洛伐克国民党机关报撰稿，1905至1910年任匈牙利国会议员，倡导斯洛伐克与捷克合作；1910年后成为王储斐迪南大公“贝尔韦代雷集团”的核心成员，曾献策将匈牙利王国改组为联邦以安抚非马扎尔民族，遭匈牙利政界强烈抵制。一战期间参与筹建捷克斯洛伐克，1918年签署《马丁宣言》，使斯洛伐克并入新国家。建国后长期领导斯洛伐克农民党，历任统一法律与行政部长、农业部长、教育部长、外交部长等职，1921年起兼任布拉迪斯拉发夸美纽斯大学近代史教授，并创办多份斯洛伐克报刊。1935年继马萨里克退休后出任总理（同年12月一度代行总统职权），全力推动捷克斯洛伐克与奥地利、罗马尼亚、匈牙利、南斯拉夫的中欧经济一体化构想，惜未成功。1938年9月慕尼黑协定后辞职流亡，先后转徙瑞士、法国（另组斯洛伐克民族委员会，与贝奈斯流亡集团长期对立）、英国，1941年移居美国，著《中欧联邦》（1942），1944年卒于流亡中。2002年遗骸归葬斯洛伐克马丁民族公墓。"
 CZE_pavel_reiman_desc:0 "1902年10月12日生于布尔诺，1976年11月1日卒于布拉格，德意志犹太家庭出身，捷克裔日耳曼学家与共产主义政治家。1929年以“卡尔林小子”成员身份随哥特瓦尔德、斯兰斯基等人进入KSČ领导层，任共产国际执委会候补委员（至1931年）。因所谓“古特曼-雷曼右倾偏差”遭批判而赴莫斯科，1936年回国参与德国流亡者反法西斯文化活动，战时投身地下KSČ。战后任KSČ对外部主任（至1948年）；1952年被迫出席斯兰斯基审判作证（未受起诉），此后遭排挤，转作党史与日耳曼文学研究；1968年批判苏联入侵，1970年被开除出党。"
 CZE_radola_gajda_desc:0 "1892年2月14日生于科托尔（今属黑山，时为奥匈帝国），本名鲁道夫·盖特尔，1948年4月15日卒于布拉格（白血病），捷克军人与极右翼政治家。其父为驻科托尔奥匈军官，其母为黑山贵族，幼年随家迁至摩拉维亚基约夫。一战期间在奥匈军服役，1915年9月被俘后立即改换阵营加入黑山军队，以药剂师身份冒充军医；黑山军队崩溃后辗转逃往俄国，1917年1月以上尉军衔加入捷克斯洛伐克军团。内战期间迅速崛起：1918年7月率部攻克伊尔库茨克，打通西伯利亚大铁路，在贝加尔湖海战中击溃红军水上力量，年仅二十六岁即晋升少将，成为高尔察克白军阵营中的明星将领。回国后任军队副总参谋长，1926年“盖达事件”中被指控阴谋叛乱及泄露军事机密，遭军事法庭定罪并被逐出军队。此后转入极右翼政治：同年参与创建“国家法西斯团体”，1927年1月2日就任党魁，以墨索里尼的意大利法西斯党为样板。1929年NOF赢得数个国会席位；1933年1月21日深夜布尔诺日德尼采区约八十名党徒发动武装政变，翌日被镇压，盖达随即被捕并以煽动罪判处六个月监禁。1935年他本人赢得一个议席，维持至1939年；同期NOF持强烈反德立场，慕尼黑协定签署后他悉数退还法英两国授予的勋章以示抗议。1939年3月多次拥立他为国家元首的政变尝试均告失败，数日后剩余捷克领土遭德国占领。占领期间他远离公众，偶尔协助抵抗运动。1947年战后审判以捏造罪名判两年（与羁押期相抵），出狱后不久于1948年4月15日因白血病去世。"
 CZE_richard_tesarzhik_desc:0 "1915年12月3日生于布拉格一户商人家庭（母亲为歌剧演员），1967年3月27日因心脏病卒于乌斯季纳德拉贝姆，捷克裔少将、苏联英雄称号获得者，捷克斯洛伐克最著名的坦克指挥官之一。少年在普日布拉姆长大，学过橱窗装潢，1937年10月入伍于贝劳恩步兵团。1939年8月越境入波兰加入捷克斯洛伐克军团，波兰沦陷后滞留于沃伦。1943年3月以步兵排长身份参加索科洛沃战役，近战中格杀德军军官并缴获情报。同年8月转入坦克兵，指挥T-70轻型坦克连参加基辅解放战役，11月5日从西南方向突击摧毁多处德军炮兵阵地，为步兵打开通道，因此荣获苏联英雄金星勋章，为获此殊荣的捷克斯洛伐克军人之一。1944年秋率部参加杜克拉山口战役，攻击694高地时所乘坦克被反坦克火箭弹击中起火，跳车后重伤失去左眼；伤愈后以上尉军衔参加1945年俄斯特拉瓦战役。战后在莫斯科坦克学院深造，回国后历任装甲兵要职。1953年因丢失机密文件被短暂拘押，1956年晋少将。1959年赴莫斯科总参学院进修，因纪律问题被召回，1960年被开除出党并退役。此后从事民用工作，1967年因心脏病去世，葬于普日布拉姆。"
 CZE_robert_rychtrmoc_desc:0 "1875年4月9日生于匈牙利采格莱德一户奥匈军人家庭，1946年1月21日在布拉格潘克拉茨监狱被处决，捷克裔师级将军、合作主义政客。1895年毕业于布拉格军校入伍，一战中长期任意大利前线参谋军官，1916年被调入维也纳总参谋部、组织对内防谍，1918年5月晋总参谋部上校。捷克斯洛伐克建国后，他是少数转入新军的前奥匈高级军官之一，两战之间晋至师级将军，1934年退役。1938年动员时一度复出，负责从克拉利基到因德日赫城堡一线的筑垒。慕尼黑后他迁居布拉格，本可安度余生，却卷入保护国政治：先加入退役宪兵将领布拉哈1940年组建的合作组织“捷克战士联盟”，1943年8月起接任该联盟第二任也是末任首领，使其经济稳定并发行亲德刊物《战友情》，又出任保护国唯一合法政治组织“国民团结”主席。1944年3月联盟大会上他支持组建为德军效力的捷克部队，4月25日向莫拉韦茨递交备忘录，建议动员十五个役龄、多达六十万捷克男子，并起用关押在集中营的军官“将功补过”。1945年5月9日被捕，与布拉哈等一同受国家法院审判，1946年1月21日被绞死（其请求以军人身份枪决遭拒），贝奈斯驳回了对他的特赦申请。"
 CZE_rudolf_bechyne_desc:0 "1881年4月6日生于尼姆布尔克，1948年1月1日卒于布拉格，捷克裔社会民主党政治家与记者。出身机械钳工，1905年加入捷克社会民主党，从此终生不渝。先后在布尔诺《平等报》、普罗斯捷约夫《人民之声报》任编辑。1911年当选奥地利帝国议会议员，一战中因反战言论于1915年被捕、以叛国罪指控后发配前线，归来后健康受损。1917年在社民党内与哈布尔曼、汉普尔等人一道反对什梅拉尔的亲奥路线，力推民族独立。1918年以社民党代表身份参加国民委员会，亲历捷克斯洛伐克建国。建国后他是执政联盟“五人组”中的社民党首席代表，1918至1939年连续当选国会议员，历任教育部长（1922—1924）、铁路部长（1925—1926、1932—1938）、供应部长（1929—1932）。他坚持民主改良路线，既抵制共产党分裂又反对右翼法西斯化。1938年参与与伦西曼使团的谈判，慕尼黑后力守民主立场。1939年7月经波兰流亡英国，1940至1941年任伦敦国务会议首任主席，此后为会议成员至战争结束，同时主编流亡刊物《新自由》，对贝奈斯的政策时有批评。1945年回国后已不再参与政治活动，1948年1月1日在布拉格去世。"
 CZE_rudolf_mlcoch_desc:0 "1880年4月17日生于摩拉维亚特热布钦（德文名亨内贝克，今属奥洛穆茨地区），1948年4月8日卒于奥洛穆茨，捷克裔企业家、记者、第一共和国政治家，工商党创始人之一。出身篮筐匠师家庭，随父学篮筐手艺，曾就读梅尔尼克专门学校，并赴布拉格、维也纳历练，后在普罗斯捷约夫开办篮筐作坊。1904年起主编《工商通报》，1919年在奥洛穆茨创办本党机关报《捷克斯洛伐克日报》并任社长兼总编，1933至1941年任《摩拉维亚日报》总编。他历任国家工商委员会委员、奥洛穆茨工商会会长等职。建国后他是工商党在革命国民议会中的唯一议员，1920至1939年连任国民议会议员（1935年该党赢得17席），1935至1937年任众议院副议长；1938年12月并入民族统一党党团。其入阁经历包括：1925至1926年在切尔尼政府任公共工程部长，1929至1932年在乌德日扎尔政府任铁道部长，1937至1938年继纳伊曼之后在霍贾政府任工业、商业与手工业部长。"
 CZE_rudolf_viest_desc:0 "1890年9月24日生于上匈牙利雷武察（今斯洛伐克），1945年卒于弗洛森比格集中营（确切日期不详），斯洛伐克裔师级将军，两战之间捷克斯洛伐克军队中唯一的斯洛伐克籍将军，斯洛伐克民族起义最高指挥官。父为手工匠人，自幼就读于雷武察路德派小学及中学，1905年随家迁居布达佩斯。一战在奥匈军服役，后加入捷克斯洛伐克军团参加俄国内战。战后留在军中，1928年晋上校，1933年晋准将，1938年晋师级将军。斯洛伐克独立后他签署反对分裂的请愿书，但未遭迫害，接受察特洛斯邀请出任斯洛伐克军队总监察长，暗中与伦敦流亡政府保持联络并加入“国家防卫”。1939年流亡匈牙利，后赴法国任流亡第一捷克斯洛伐克师师长（1940年1月），法国沦陷后赴英。1942至1944年任流亡政府国防部长。1944年10月6至7日夜间飞回斯洛伐克，接替戈利安出任第一捷克斯洛伐克军总指挥，统率约36,000名官兵抗击德军大举围剿。10月27日班斯卡比斯特里察陷落，他于10月27至28日夜下令转入游击战，宣告“争取自由的斗争不会结束，将在山中继续”。11月3日在波赫罗恩斯基布科韦茨被德军俘获，与戈利安一同押赴柏林、后转弗洛森比格集中营，1945年被处决（相关记录缺失，亦有说法认为他们可能被移交苏联后身亡）。身后追晋陆军上将，获斯洛伐克民族起义勋章一级等多项荣誉。"
 CZE_sergej_ingr_desc:0 "1894年9月2日生于摩拉维亚弗尔科什（其父为村长），1956年6月17日卒于巴黎，捷克裔陆军一级上将，捷克斯洛伐克流亡政府国防部长。一战中在东线被俘后加入塞尔维亚志愿师，于敖德萨皈依东正教并改名“谢尔盖”，继而转入捷克斯洛伐克军团，参加兹博罗夫战役，后辗转法国、意大利军团；1918年12月起参加对匈与波捷战事。两战之间历任要职，1934年晋准将，1938年为师级将军、第三军军长。德国占领后参与创建地下“国家防卫”并受派赴法，在巴黎设立军事办公室、于阿格德组建捷克斯洛伐克军队并任司令，1940年率一万余名志愿者参加法国战役。流亡政府迁伦敦后出任国防部长，统辖东西两线的捷克斯洛伐克军团，与受苏联影响的斯沃博达关系紧张。1944年下半年在共产党压力下卸去部长职，转任武装力量总司令。1945年7月晋一级上将并退役，旋任驻荷兰大使；二月事变后辞职流亡，1949年创建自由捷克斯洛伐克委员会，组织反共活动并为西方建立流亡情报网，1956年猝逝于巴黎。"
 CZE_sergej_vojcechovsky_desc:0 "1883年10月16日（俄历）生于维捷布斯克一户波兰裔俄罗斯贵族军人家庭，1951年4月7日卒于西伯利亚泰舍特奥泽尔拉格（古拉格劳改营），俄裔捷克斯洛伐克陆军上将。1904年毕业于圣彼得堡康斯坦丁炮兵学校，1912年毕业于尼古拉耶夫总参谋部军事学院。一战中任俄军参谋军官，1917年9月调任捷克斯洛伐克步枪师参谋长，参加巴赫马奇战役。俄国内战期间迅速崛起：1918年6月攻克车里雅宾斯克、7月攻取叶卡捷琳堡，打通西伯利亚大铁路，同年10月晋少将；后转入高尔察克白军指挥乌法军，1920年率部撤至克里米亚加入弗兰格尔部队，经君士坦丁堡流亡捷克斯洛伐克。1921年5月入捷军服役，1922年获公民权，此后历任旅长、师长，1927年任布尔诺军区司令，1929年12月晋陆军上将，1935年起任布拉格军区司令。1938年9月慕尼黑危机期间统率第一军团，坚决反对投降，致信国防部长警告“轻言放弃对未来不利”；因此1939年4月被德方施压解职。随即与因格尔、比利等将领共建地下抵抗组织“国家防卫”，充任秘密“战争部长”，整个占领期间在盖世太保监视下坚持工作。1945年5月12日在布拉格被苏军反间谍机构“锄奸部”逮捕并强行押往莫斯科，9月以“反苏活动”罪判十年劳改，捷克斯洛伐克政府未作任何抗议。1951年4月7日死于奥泽尔拉格医院，官方记录死因为“肺结核及年迈衰竭”。1996年获俄罗斯总检察院平反，1997年追授白狮勋章。"
 CZE_simon_drgac_desc:0 "1892年8月11日生于摩拉维亚穆捷尼采，1980年卒，捷克裔陆军将领。一战期间参加捷克斯洛伐克军团意大利战线；两战之间历任要职，1929—1931年出任驻巴黎武官。慕尼黑协定后任宣传部副部长。1939年9月1日被盖世太保逮捕，辗转经历达豪、布痕瓦尔德、弗洛森比格等集中营，1945年4月24日获释。战后加入KSČ，重建军事学院；1948年6月起任捷克斯洛伐克武装力量总参谋长，晋陆军将军。1952年被诬陷为斯兰斯基案共犯，判处24年，1958年获释，后获平反。"
 CZE_stanislav_bukovsky_desc:0 "1889年5月2日生于摩拉维亚维什科夫一户磨坊家庭，1942年8月14日在奥斯维辛集中营毒气室遇难，捷克裔医师与体育领袖。1913年毕业于布拉格查理大学医学院，一战期间在意大利前线腿部重伤，转任布拉格军医。自青年起投身索科尔体操运动，1921年进入捷克斯洛伐克索科尔总会领导层，创建医学研究部；1922年起任公共雇员医疗基金会首席医师，1931年当选总会副会长，1932年继舍纳之后出任会长，并兼斯拉夫索科尔联盟会长。1938年10月4日，他以无党籍身份入西罗维看守政府，受命主管教育与国民启蒙部，至同年12月1日卸任。德国占领后索科尔遭取缔；1941年10月8日纳粹对索科尔骨干发动“索科尔行动”大搜捕，布科夫斯基被捕，先囚于特雷津小要塞盖世太保监狱，1942年1月15日与其他被捕者一同被押往奥斯维辛，同年8月14日被处决于毒气室，时年五十三岁，囚号25660。"
 CZE_stefan_osusky_desc:0 "1889年3月31日生于上匈牙利布雷佐瓦（今斯洛伐克布雷佐瓦波德布拉德洛姆），1973年9月27日卒于美国弗吉尼亚州赫恩登，斯洛伐克裔律师、外交官与政治家。少年时因斯洛伐克民族情感被布拉迪斯拉发路德派中学开除，1906年赴美研习神学、哲学、自然科学与法律。一战期间在巴黎与日内瓦为捷克斯洛伐克民族委员会从事宣传，1918年4月以斯洛伐克代表身份出席罗马被压迫民族大会。建国后入外交界，1919至1920年任和会代表团秘书长，并代表捷克斯洛伐克签署《特里亚农条约》；1920年起任国际联盟监督委员会主席达十四年。1921年起出任驻法国公使，长期经营捷法同盟这一安全基石，直至1940年法国陷落。1939年3月德国吞并后，他拒绝向德方交出巴黎使馆并维持其运作，着手组织海外抵抗，1939年10月2日与法国总理达拉第签署在法重建捷克斯洛伐克军队的协定；其后虽于1939年11月加入贝奈斯的民族委员会、1940年7月任流亡政府部长，但与贝奈斯关系日益恶化。1945年赴美任科尔盖特大学教授，二月事变后参与自由捷克斯洛伐克委员会，终老异乡。"
 CZE_vaclav_kopecky_desc:0 "1897年8月27日生于科斯莫诺西附近，1961年8月5日卒于布拉格（肺栓塞），捷克裔政治家、记者，哥特瓦尔德时代捷克斯洛伐克共产党的首席意识形态家。出身小商之家，曾在布拉格查理大学法学院就读未竟。原为社会民主党人，1921年KSČ创建时即加入，是布拉格卡尔林地下党支部成员，1929年第五次党代会上与哥特瓦尔德、斯兰斯基等同列党中央，史称“卡尔林小子”。两战之间长期任党报编辑与国会议员，1940至1941年任共产国际代表，二战在莫斯科度过；1944年公开接受将苏台德德意志人逐出的方针，并发表反犹言论，称自认是德意志人或匈牙利人的犹太人应同受驱逐处置。战后历任新闻部长（1945至1953）与文化部长（1953至1954），主持沿用占领时期手法的出版审查；他以反犹言论著称，攻击犹太人的“世界主义”与犹太复国主义，并是斯兰斯基审判的主要操盘者之一。死后享国葬。"
 CZE_vladimir_mandl_desc:0 "1899年3月20日生于皮尔森，1941年1月8日卒，捷克裔法学家，布拉格理工大学副教授。专研私法与技术法律问题，1928年出版捷克语首部航空法专著，获捷克斯洛伐克司法部国家奖。1932年自费出版德文专著《宇宙法：宇宙航行问题》，成为法学史上最早专论太空法的著作，早于斯普特尼克卫星发射整整25年，被誉为“太空法之父”，同年亦获得捷克斯洛伐克火箭专利。1933年起执教布拉格理工大学，1939年11月高校被纳粹关闭后被迫中断学术生涯，1941年1月卒，年仅41岁。"
 CZE_vladimir_prikryl_desc:0 "1895年8月3日生于摩拉维亚霍尔尼斯图丹基，1968年4月13日卒于皮尔森，捷克裔旅级将军（本名约瑟夫，改信东正教后改名弗拉迪米尔）。一战期间参加捷克斯洛伐克军团并历经西伯利亚远征；1940年经法国抵英，1943年辗转经非洲赴苏联（途中所乘运输舰被德机击沉，获英国驱逐舰救起），1944年1月起指挥第二捷克斯洛伐克独立伞兵旅，参加基辅解放及喀尔巴阡山战役。1944年10月率旅降落斯洛伐克参加民族起义，起义失败后继续山区游击。1949年5月被捕，1953年获总统特赦，1964年司法平反。"
 CZE_vojtyech_luzha_desc:0 "1891年3月26日生于摩拉维亚乌赫尔斯基布罗德，1944年10月2日在普日比斯拉夫附近赫日什捷村战死，捷克裔陆军将领、一战军团老兵、捷克斯洛伐克抵抗运动核心人物。一战被俘后先入塞尔维亚志愿师，1917年1月转入捷克斯洛伐克军团，参加兹博罗夫战役并随军在西伯利亚对布尔什维克作战。回国后历任要职，1929年晋师级将军，曾任布拉格高等军事学院院长及布尔诺地区军事司令。1938年9月动员时统率守卫北摩拉维亚的第二军团，坚决反对慕尼黑投降，一度谋划以军事政变推翻西罗维政府。德国占领后投身地下“国家防卫”组织，与保护国总理埃利亚什保持联络，1941年9月转入地下。1942年底重整残部建立抵抗组织“三人委员会”并任其军事领袖，被公认为国内抵抗的最高军事代表，着手筹划武装起义。1944年9月其组织遭盖世太保渗透瓦解，他在步行转移途中于赫日什捷村小客栈遭当地宪兵盘查，拔枪抵抗、当场牺牲，是二战中唯一持枪战死的捷克斯洛伐克将军；其子拉多米尔为父复仇。身后追晋一级上将。"
 CZE_zdenek_fierlinger_desc:0 "1891年7月11日生于摩拉维亚奥洛穆茨，1976年5月2日卒，捷克裔外交官与政治家。一战期间参加捷克斯洛伐克军团（曾参与兹博罗夫战役），战后入驻外交部，历任驻荷兰、罗马尼亚、美国、瑞士、奥地利使节，1924年加入社会民主党。1937—1945年出任驻苏联大使，1943年代表流亡政府签署捷苏友好互助条约；1945年4月—1946年7月出任总理，任内秘密签署向苏联供应雅希莫夫铀矿协议。因其亲苏立场，1948年后他协助推动社会民主党并入共产党，本人转为KSČ党员，1954—1964年出任国民议会议长。"
 CZE_zdenek_fierlinger_dod_desc:0 "1891年7月11日生于摩拉维亚奥洛穆茨，1976年5月2日卒，捷克裔外交官与政治家。一战期间参加捷克斯洛伐克军团（曾参与兹博罗夫战役），战后入驻外交部，历任驻荷兰、罗马尼亚、美国、瑞士、奥地利使节，1924年加入社会民主党。1937—1945年出任驻苏联大使，1943年代表流亡政府签署捷苏友好互助条约；1945年4月—1946年7月出任总理，任内秘密签署向苏联供应雅希莫夫铀矿协议。因其亲苏立场，1948年后他协助推动社会民主党并入共产党，本人转为KSČ党员，1954—1964年出任国民议会议长。"
 CZE_zdenko_hudecek_desc:0 "1887年6月22日生于波希米亚泰雷津（旧奥匈要塞城），1974年9月28日卒于雅布伦科夫，捷克裔奥匈帝国海军军官。毕业于阜姆（今里耶卡）帝国皇家海军学院，1910年起任职奥匈舰队多型战舰。一战期间以潜艇指挥官著称，共击沉11艘协约国商船及2艘军舰、总吨位44,743总注册吨，位居奥匈潜艇王牌第二。战后意大利以战争罪名要求引渡，被捷克斯洛伐克政府拒绝。1918年12月加入捷克斯洛伐克海军部队，至1921年海军解散后退役，转任捷克斯洛伐克多瑙河公司货轮船长，直至终老。"
 CZE_zdenko_hudecek_high_command_desc:0 "1887年6月22日生于波希米亚泰雷津（旧奥匈要塞城），1974年9月28日卒于雅布伦科夫，捷克裔奥匈帝国海军军官。毕业于阜姆（今里耶卡）帝国皇家海军学院，1910年起任职奥匈舰队多型战舰。一战期间以潜艇指挥官著称，共击沉11艘协约国商船及2艘军舰、总吨位44,743总注册吨，位居奥匈潜艇王牌第二。战后意大利以战争罪名要求引渡，被捷克斯洛伐克政府拒绝。1918年12月加入捷克斯洛伐克海军部队，至1921年海军解散后退役，转任捷克斯洛伐克多瑙河公司货轮船长，直至终老。"
 CZE_zdenko_hudecek_high_command_mun_desc:0 "1887年6月22日生于波希米亚泰雷津（旧奥匈要塞城），1974年9月28日卒于雅布伦科夫，捷克裔奥匈帝国海军军官。毕业于阜姆（今里耶卡）帝国皇家海军学院，1910年起任职奥匈舰队多型战舰。一战期间以潜艇指挥官著称，共击沉11艘协约国商船及2艘军舰、总吨位44,743总注册吨，位居奥匈潜艇王牌第二。战后意大利以战争罪名要求引渡，被捷克斯洛伐克政府拒绝。1918年12月加入捷克斯洛伐克海军部队，至1921年海军解散后退役，转任捷克斯洛伐克多瑙河公司货轮船长，直至终老。"
 CZE_zdenko_hudecek_navy_chief_desc:0 "1887年6月22日生于波希米亚泰雷津（旧奥匈要塞城），1974年9月28日卒于雅布伦科夫，捷克裔奥匈帝国海军军官。毕业于阜姆（今里耶卡）帝国皇家海军学院，1910年起任职奥匈舰队多型战舰。一战期间以潜艇指挥官著称，共击沉11艘协约国商船及2艘军舰、总吨位44,743总注册吨，位居奥匈潜艇王牌第二。战后意大利以战争罪名要求引渡，被捷克斯洛伐克政府拒绝。1918年12月加入捷克斯洛伐克海军部队，至1921年海军解散后退役，转任捷克斯洛伐克多瑙河公司货轮船长，直至终老。"
