 CZE_augustin_voloshyn_desc:0 "1874年生，喀尔巴阡—乌克兰（外喀尔巴阡）的神父与民族主义者。1939年捷克斯洛伐克解体之际，他宣布喀尔巴阡—乌克兰独立并任领袖，旋即被匈牙利吞并。二战末他被苏方逮捕，1945年死于莫斯科狱中。"
 CZE_jozef_tiso_desc:0 "1887年生，斯洛伐克天主教神父与政治家，赫林卡身后斯洛伐克人民党的领袖。1939年他在德国支持下宣布斯洛伐克独立、出任傀儡\"斯洛伐克国\"的总统，配合纳粹、纵容遣送犹太人。战后被审判，1947年被处决。"
 CZE_vojtech_tuka_desc:0 "1880年生，斯洛伐克民族主义政治家，斯洛伐克人民党激进派的代表、亲纳粹。二战中他在傀儡的斯洛伐克国出任总理兼外长，是推动驱逐犹太人的主谋之一，战后被处决（1946）。"
