 CBIO_GER_august_von_mackensen_desc:0 "1849年生于萨克森，德意志帝国陆军元帅，一战中最具代表性的野战指挥官之一。他先后在东线、塞尔维亚和罗马尼亚战场指挥集团军，以强调进攻突破的战役风格著称，数度率部突破敌军防线，在同时代德国军官中积累了极高威望。战后他退出现役，以元帅礼服出现在各类君主派、退伍军人和保守民族主义集会场合，成为魏玛时代旧帝国军人荣誉与普鲁士传统的活化象征。纳粹上台后，他虽保留民族保守立场，对政权的某些做法心存保留，但仍被政权利用为旧军事权威的形象背书。1945年去世，年届九十五。"
 CBIO_GER_ernst_thalmann_desc:0 "1886年生，汉堡工人出身，德国共产党（KPD）的主要领导人之一。第一次世界大战后，他投身左翼工人运动，1925年起出任德共主席，长期奉行激进的阶级斗争路线，并在共产国际体系内与苏联保持紧密联系。1925年和1932年，他两度作为共产党候选人参加德国总统选举，同时反对纳粹和保守派右翼。希特勒上台后，台尔曼于1933年3月被捕，此后被长期单独关押、未经审判达约十一年之久。1944年8月18日，他在布痕瓦尔德集中营被杀害。"
