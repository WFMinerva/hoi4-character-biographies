l_simp_chinese:
 GER_helmuth_wilberg_desc:0 "1880年生于柏林，德国空军将领（航空兵上将），德国空中作战理论的重要奠基人之一。他是一战时期德国最早的一批军事飞行员，战后在魏玛防卫军中长期秘密从事航空建设工作。按纳粹的种族标准，他因母亲为犹太人而属“混血儿”，本应被排除出军队，但戈林为留住这位人才，运作希特勒签发证明将其“雅利安化”。1935年前后，他主持编写德国空军的核心作战条令《空中作战指挥》，强调技术、战术、后勤与突然性而非空泛教条；1937年他组建“W特别参谋部”，专门收集分析秃鹰军团在西班牙内战中的实战经验。1938年他晋升航空兵上将。波兰战役动员时他被重新起用，出任航空兵训练主管。1941年11月20日，他在前往恩斯特·乌德特葬礼途中于德累斯顿附近坠机身亡。"
 gunther_lutjens_desc:0 "1889年生，德国海军上将，以俾斯麦号战列舰最后一次出击的指挥官载入史册。战间期及二战初期，他多次率水面舰艇编队在大西洋执行破交任务，1941年1至3月指挥沙恩霍斯特号与格奈森瑙号在大西洋击沉和俘获数十艘盟国船只。1941年5月，他指挥俾斯麦号与欧根亲王号组成的编队出击大西洋，在丹麦海峡海战中击沉英国海军旗舰胡德号，随后遭英国海军大规模追击。俾斯麦号被鱼雷击伤转向受限，5月27日在大西洋中部被英国舰队集中炮火击沉，他随舰沉没，时年五十一岁。"
 albert_kesselring_desc:0 "“微笑的阿尔贝特”1885年生，德国空军元帅，是二战德军中少数在不同军种和战区均担任过最高指挥职务的将领。波兰战役和法国战役中他指挥第二航空队。不列颠之战期间，他指挥对英格兰南部的空中攻势。1941年底转赴地中海战区，出任南方战区总司令，协调德意军队在北非和地中海的作战。1943年盟军登陆西西里和意大利本土后，他主持意大利半岛的防御，以古斯塔夫防线、哥特防线等一系列阵地消耗战将盟军拖滞近两年，被视为防御战的代表性指挥官。1945年3月接任西线总司令。战后以在意大利下令处决平民的战争罪被判处死刑，后改为无期徒刑，1952年因健康原因获释，1960年去世。"
 GER_hanns_kerrl_desc:0 "1887年生于法勒斯莱本一个新教家庭，纳粹政客。一战中任少尉，1923年加入纳粹党，后官至冲锋队高级集团领袖。他曾任普鲁士邦议会议长，纳粹上台后出任普鲁士司法部长（1933至1934年），任内在普鲁士禁止犹太人公证人办理公务文书、禁止犹太律师执业。1935年7月起，他出任新设的帝国教会事务部长，奉命在“教会斗争”中压服各新教教会、并将基督教与纳粹意识形态强行调和，曾迫使大批新教牧师向希特勒宣誓效忠。他在柏林的住宅是一处从犹太业主手中被强制“雅利安化”（强迫低价出售）而来的房产。1941年12月14日，他在任上去世。"
 GER_hans_oster_desc:0 "1887年生于德累斯顿一个新教牧师家庭，德国陆军少将，阿勃维尔局长卡纳里斯的副手，军事抵抗运动的核心人物之一。他起初也曾欢迎纳粹政权，但在1934年“长刀之夜”的屠杀后转为坚定的反对者，并成为1938年九月密谋（拟在希特勒进攻捷克斯洛伐克时发动政变）的中心人物。战争期间，他曾多次（达二十余次）将德国进攻荷兰等国的确切日期暗中通报给荷兰方面，还利用阿勃维尔的渠道为犹太人提供伪造证件、帮助他们逃脱——在他看来，这些都是为了击败纳粹。1944年七月密谋案后他被逮捕，经党卫军特别法庭定罪，于1945年4月9日在弗洛森比格集中营与卡纳里斯、朋霍费尔一同被绞死。"
 GER_hermann_duncker_desc:0 "1874年生，德国马克思主义理论家、教育家。他早年加入社民党，长期担任工人教育和马克思主义培训课程的巡回讲师，并曾与罗莎·卢森堡一同在党校任教。他是斯巴达克同盟和德国共产党的创建者之一，并当选德共首届中央委员会委员。作为党内著名的“教师”，他主持各级党校，1925年参与创办柏林马克思主义工人学校；因属主张与社民党结成统一战线的温和“中间派”，1929年后被激进化的党领导层边缘化。纳粹上台后，他于1933年被捕、关押约一年后获释，1936年起流亡丹麦、英国、法国，1941年辗转抵达美国。1947年他返回东德，加入统一社会党，并长期担任贝尔瑙的工会高等学校校长，直至1960年去世。"
 martin_bormann_desc:0 "1900年生，纳粹党总理府主任、希特勒的私人秘书。他长期把持着通往希特勒的渠道与信息流，是幕后权势极大的人物，并在反教会、反犹太的激进政策中推波助澜，官至帝国领袖、党卫军高级集团领袖。1945年5月1日夜至2日，他在试图逃出元首地堡后下落不明。纽伦堡国际军事法庭对他进行缺席审判，判处死刑。此后数十年间他的下落众说纷纭，一度盛传逃往南美。1972年，柏林发现的一具遗骸经1998年DNA鉴定确认为鲍曼本人——他实际上于1945年5月2日夜在柏林莱尔特车站附近身亡（应为自杀）。"
 GER_josef_kammhuber_desc:0 "1896年生，德国空军将领（航空兵上将），德国夜间防空体系的创建者。一战中他是工兵军官，两战之间转入航空，曾赴苏联利佩茨克秘密飞行学校受训，后在空军参谋系统任职。1940年7月，他受命整合此前分属各自指挥链的高射炮、探照灯与雷达部队，组建起专门的夜间战斗机指挥机构（第十二航空军），并建立了一套以雷达引导拦截为核心的纵深防空网——英方称之为“卡姆胡贝尔防线”，由一连串相互衔接的“四柱床”区域组成，初期对英国皇家空军的夜间轰炸造成不小损失，后因英方掌握其规律并采取干扰手段而效力下降。1943年，他因与米尔希冲突被解除夜战指挥权，调往挪威的第五航空队。战后他一度被美方关押，1948年无罪获释，又曾赴阿根廷协助训练空军。1956年起他加入联邦德国国防军，出任西德空军首任总监，1962年退役，1986年在波恩去世。"
 erhard_milch_desc:0 "1892年生于威廉港，德国空军元帅、戈林的副手，德国空军组织建设的主要缔造者，战后被定罪的战争罪犯。一战中他是炮兵与航空兵军官，战后任民航企业德国汉莎航空的负责人。1933年5月，他出任新设的帝国航空部国务秘书，作为戈林副手全面主持德国空军的组织、训练与飞机生产，是1930年代德国空军实际上的建军者。1935年，关于其生父为犹太药剂师的传闻流出后，戈林出面干预，安排其母亲出具声明、改称其生父另有其人，使他得以“雅利安化”过关。二战中他于1940年晋升元帅，长期主管航空装备与飞机生产，自1941年起推行大规模量产，并大量使用外籍劳工和战俘从事强制劳动，条件极其恶劣。1944年6月，他因卷入一桩试图迫使戈林去职的行动而失势，此后在施佩尔手下任职至战争结束。1947年纽伦堡后续审判中的“米尔希案”以使用奴隶劳工和参与人体实验的罪责，判处他终身监禁，后减为十五年，1954年获释，1972年在杜塞尔多夫去世。"
 GER_robert_knauss_desc:0 "1892年生于斯图加特，德国空军将领（航空兵上将），空中力量理论家。一战中他任空中观察员而非飞行员，战后取得经济学与宪法学博士学位，并进入德国汉莎航空任高级职务。1932年，他以“赫尔德斯少校”为笔名发表小说《1936年的空战》，虚构一场英法之间的未来战争，描写战略轰炸与对巴黎的恐怖空袭。1933年，他作为汉莎航空董事提交了一份关于空中作战的备忘录，提出“风险空军”构想：主张秘密快速组建约四百架四发重型轰炸机的机队，以战略威慑迫使法国、波兰不敢轻举妄动，这一思路成为德国空军早期建设的重要理论依据之一。1935年他以少校身份加入空军，曾指挥教导联队并率部参加波兰战役。1940年10月起，他出任设于柏林加托夫的空军作战学院院长，1944年晋升航空兵上将。战后他参与了1950年为联邦德国重新武装拟订方案的“希默罗德小组”，1955年在瑞士去世。"
 GER_walter_ulbricht_desc:0 "1893年生于莱比锡，工人出身，德国共产党的职业干部、坚定的斯大林主义者。魏玛时期他曾任德共国会议员。纳粹上台后，他流亡国外，先到巴黎、后转莫斯科，在大清洗中幸存，成为共产国际的干部。1945年，他随“乌布利希小组”从莫斯科返回德国，逐步成为统一社会党（SED）和德意志民主共和国（东德）的主导人物。作为党的领导人、并自1960年起任国务委员会主席，他主持了东德的苏联化改造，并在1961年下令修建柏林墙。1971年，他被昂纳克排挤、交出党的领导权，1973年去世。"
 konstantin_von_neurath_desc:0 "1873年生于符腾堡一个贵族外交世家，纳粹德国前期的外交部长。他是职业外交官出身，曾任驻意大利、驻英国大使，1932年起在巴本、施莱歇尔内阁出任外交部长，希特勒上台后留任，以其保守、体面的形象为纳粹早期的扩张外交提供了门面，经手了德国退出国际联盟、《英德海军协定》和重占莱茵兰等事。1937年他加入纳粹党并获授党卫军荣誉军衔。因对希特勒冒进的战争时间表有所保留，1938年他被里宾特洛甫取代，转任无实权的虚衔职务。1939年3月，他被任命为波希米亚和摩拉维亚保护长官，在任内推行新闻审查、取缔政党和工会、按纽伦堡法迫害捷克犹太人，并镇压1939年秋的捷克学生抗议——大学被关闭，约一千二百名学生被送进集中营，九名学生领袖被处决。即便如此，希特勒仍嫌他治理过于温和，1941年9月剥夺其实权、改由海德里希实际掌权，他的保护长官头衔到1943年才正式卸任。战后他在纽伦堡受审，以四项罪名被判处十五年监禁，1954年因健康原因获释，1956年去世。"
 GER_ludwig_erhard_desc:0 "1897年生于巴伐利亚的菲尔特，德国经济学家、政治家。他在一战中负重伤，后转攻经济学、取得博士学位，并在纽伦堡一家市场研究机构任职。他拒绝加入纳粹党，1942年因撰写一份关于战后自由经济的论文而被免职。战后，他被盟国占领当局委以经济重建之任，主导了1948年的货币改革（引入德国马克）和价格管制的废除，由此开启了西德的“经济奇迹”，并成为“社会市场经济”理念的主要倡导者。1949至1963年，他在阿登纳政府长期出任经济部长，后又任副总理，并于1963年接替阿登纳出任联邦德国第二任总理，至1966年卸任。1977年在波恩去世。"
 GER_dietrich_bonhoeffer_desc:0 "1906年生于布雷斯劳，德国信义宗牧师、神学家，“认信教会”的领袖之一，坚决反对被纳粹同化的“德意志基督徒”教派，也是最早公开反对纳粹迫害犹太人的人士之一；他在狱中写下的书信与神学著作后来广为流传。他通过妹夫多纳尼所在的军事情报局（Abwehr）加入抵抗运动，借职务之便在国外建立联系，并帮助一批犹太人逃往瑞士。1943年4月他被捕，先后关押于多处监狱和集中营。1945年4月9日，即集中营被解放前数日，他在弗洛森比格集中营与卡纳里斯、奥斯特等人一同被处以绞刑。"
 GER_paul_von_lettow_vorbeck_desc:0 "绰号“非洲之狮”（Löwe von Afrika）。1870年生，德国陆军将领，以一战东非游击战著称。1914至1918年间，他率领一支由德国军官和非洲本土士兵（阿斯卡里）组成的小部队，在德属东非（今坦桑尼亚）一带与数倍于己的英国及协约国军队周旋长达四年，以游击战术牵制大量敌军，直至1918年11月德国本土停战后方才放下武器，是整个一战中未被战场击败的极少数德国指挥官之一。战后他在魏玛共和国短暂涉足政界，以军人荣誉和殖民地帝国主义的象征形象活跃于保守派圈子。纳粹时期他因政治立场与政权保持距离，其堂侄汉斯-于尔根·冯·布鲁门塔尔后来参与了七月密谋。1964年去世，终年九十三岁。"
 GER_otto_strasser_desc:0 "1897年生于巴伐利亚，德国国家社会主义工人党早期成员，其兄格雷戈尔·施特拉塞同为党内北方派要员。奥托主张“左翼国家社会主义”，强调反资本主义的社会革命内容，与希特勒在党的路线和政治结盟问题上存在根本分歧。1930年他被迫退出纳粹党，另组“黑色阵线”，坚持对抗希特勒路线。1934年长刀之夜后他流亡海外，辗转奥地利、捷克、葡萄牙、法国、西班牙，最终在战争期间抵达加拿大，是德国流亡政治界中持续活跃的反希特勒声音之一。战后他于1955年返回西德，但其政治影响力已大为消退，1974年在慕尼黑去世。"
 otto_ciliax_desc:0 "1891年生，德国海军上将。1942年2月，他指挥沙恩霍斯特号、格奈森瑙号和欧根亲王号组成的编队，从法国布雷斯特港经英吉利海峡高速突围返回德国本土，史称“海峡冲刺”。编队在英国海岸线附近大白天通过多佛尔海峡，英国海空军多次拦截均未能阻止，此举令英国朝野震动。此后他出任挪威海军司令等职，负责北方海上防御。1964年去世。"
 alfred_saalwachter_desc:0 "1883年生，德国海军上将。二战初期，他出任德国海军西方集群司令，负责北海和法国大西洋沿岸方向的海军作战，辖区涵盖法国港口占领后的大西洋岸基设施。1943年他转任挪威海军司令，负责北挪威方向的海上防御，掩护铁矿石航运线。1945年战争结束后被盟军俘虏，以在占领区对人质实施报复处决的战争罪行受审，1946年被挪威法庭判处死刑，同年执行。"
 GER_bernhard_bastlein_desc:0 "1894年生于汉堡，德国共产党人、抵抗运动领袖。他早年是精密机械工，一战后由独立社民党转入德共，1921年当选汉堡州议会议员（其间一度在莫斯科的德共党校工作）。纳粹上台后，他自1933年起几乎一直被关押，却仍成为共产党抵抗运动最重要的领导人之一——汉堡“贝斯特莱因-雅各布-阿布斯哈根”网络的负责人。1944年初，他借一次空袭之机从狱中逃脱，随后在柏林与扎夫科夫、雅各布一道领导“扎夫科夫-雅各布-贝斯特莱因组织”。1944年5月30日他再度被捕，遭受酷刑，同年9月18日在勃兰登堡-格尔登被处决。"
 GER_werner_von_blomberg_desc:0 "1878年生，德国陆军将领。魏玛末期，他出任国防部长，是纳粹政权建立初期军队向希特勒靠拢的关键人物，主动推动国防军向“第三帝国武装力量”转型，被视为希特勒的亲密支持者。1936年晋升帝国战争部长兼武装力量总司令，是首批晋升德国国防军元帅的将领之一。1938年初，他与一名有案底女子结婚，消息曝光后被希特勒以有损军官荣誉为由解职，史称“布隆贝格事件”；此案与同期的弗里奇案一同成为希特勒借机清洗保守派军官、全面掌控军队的契机。被免职后他退出公职，二战期间未再担任要职，1946年在纽伦堡审判期间病死于羁押中。"
 manstein_desc:0 "1887年生，德国国防军元帅，被许多军事史家视为二战德军最具战略才能的将领。法国战役中，他提出以装甲集群穿越阿登山地实施突破的“镰割计划”，被采纳后一举击溃法军，奠定西欧战役的决定性胜果。巴巴罗萨行动中，他率第五十六装甲军在波罗的海方向快速推进，随后南调参与克里木战役，1942年攻克塞瓦斯托波尔后晋升元帅。斯大林格勒战役期间，他指挥“顿河集团军群”发动“冬季风暴”解围行动，最终未能突破苏军合围圈。1943年2至3月，他在德军全线后撤的不利局面下组织反击，收复哈尔科夫，被视为其最出色的防御反攻之一。库尔斯克会战后德军持续后撤，他与希特勒在战略问题上冲突日深，1944年3月被解除南方集团军群司令职务，此后未再参战。战后以战争罪受审，1950年被判处十八年有期徒刑，1953年因健康原因获释，1973年在西德去世。"
 GER_franz_seldte_desc:0 "1882年生于马格德堡，民族主义政客。他在一战中失去左臂，1918年底与人共同创建了“钢盔团”（前线士兵联盟）——魏玛时期最大的一战老兵准军事组织，鼓动反对《凡尔赛条约》和共和国。1933年初，他率钢盔团转而支持希特勒上台，1月30日加入希特勒内阁出任帝国劳工部长，任职至1945年；同年他加入纳粹党，并将钢盔团并入冲锋队，等于把它交给了希特勒。整个第三帝国时期他都为纳粹政权效力。战争结束时他被俘，1947年4月1日在巴伐利亚的菲尔特死于美军医院，未及在纽伦堡受审。"
 GER_wilhelm_canaris_desc:0 "1887年生于阿普勒贝克（今属多特蒙德），德国海军上将。他是职业海军军官，一战中当过潜艇艇长和情报军官。1935至1944年间，他出任德国军事情报机构“阿勃维尔”（Abwehr）局长。他逐渐对希特勒的侵略政策和纳粹的极端意识形态感到幻灭，遂利用职务之便，把阿勃维尔变成抵抗运动的掩护与枢纽——向盟方泄露情报、帮助犹太人逃亡、庇护反纳粹密谋者，尽管他本人反对刺杀希特勒、并始终维持着效忠的表面姿态。1944年2月，他被解除局长职务。七月密谋案后他受到牵连，被盖世太保逮捕关押；其秘密日记被发现后，他被党卫军特别法庭定罪。1945年4月9日，即欧洲战事结束前数周，他在弗洛森比格集中营与奥斯特、神学家朋霍费尔等人一同被绞死。"
 heinrich_himmler_desc:0 "1900年生于慕尼黑，中学教师之子，一战末期以军校学员身份入伍却未见战事。战后他学习农艺，参加1923年啤酒馆暴动，随后加入纳粹党与党卫队。1929年出任党卫队全国领袖时，该组织仅有约280名成员；在他主导下，党卫队从希特勒的私人护卫扩张为融安全警察、情报、武装部队与种族灭绝机器于一体的庞大帝国，至1943年武装党卫军与总党卫军合计逾80万人。1933年他主持建立达豪集中营，随后将系统扩张至全欧；1936年兼任德国警察总长，将盖世太保与刑事警察悉数并入党卫军体系，成为第三帝国最强大的安全机构掌舵人；1943年8月再兼任帝国内政部长，权力触角延伸至整个内政系统。他是大屠杀的首席执行者：1941年“巴巴罗萨”行动发动后，他指挥东线特别行动队（Einsatzgruppen）对苏联占领区犹太人实施大规模枪决，至1943年春已造成约180万人死亡；1942年1月万湖会议以制度化方式协调“最终解决”，此后奥斯维辛-比克瑙、特雷布林卡、索比堡等灭绝营在其监管下系统运作，毒气室与焚化炉将灭绝效率推向工业化规模。1943年10月4日，他在波森向党卫军高级将领发表秘密演讲，以留存至今的录音直接谈及“灭绝犹太人”，称此为“我们历史上从未书写、永远不会书写的光荣一页”，是纳粹领导层对种族灭绝政策最明确的自白性文献之一。1944年他还兼任后备军总司令，在七月密谋案后主持清洗；同年率军参与东线防御，却在军事指挥上一败涂地。战争最后阶段，他擅自通过瑞典红十字会向西方盟国试探停战，被希特勒视为背叛，在遗嘱中将其开除出党。德国投降后，他乔装成普通士兵企图出逃，于1945年5月21日被英军俘获，5月23日在审讯途中咬破预藏的氰化物胶囊自杀，终年44岁，未及受审。"
 ernst_thalmann_desc:0 "1886年生，汉堡工人出身，德国共产党（KPD）的主要领导人之一。第一次世界大战后，他投身左翼工人运动，1925年起出任德共主席，长期奉行激进的阶级斗争路线，并在共产国际体系内与苏联保持紧密联系。1925年和1932年，他两度作为共产党候选人参加德国总统选举，同时反对纳粹和保守派右翼。希特勒上台后，台尔曼于1933年3月被捕，此后被长期单独关押、未经审判达约十一年之久。1944年8月18日，他在布痕瓦尔德集中营被杀害。"
 erich_bey_desc:0 "1898年生，德国海军少将，二战中德国驱逐舰部队的主要指挥官。1940年4月纳尔维克海战中，他率驱逐舰群与占优势的英国舰队周旋，获骑士十字勋章，随后接任驱逐舰部队司令。1942年2月“瑟伯鲁斯行动”（海峡冲刺）中，他指挥驱逐舰为沙恩霍斯特号等舰组成的布雷斯特编队护航。1943年3月晋升海军少将。同年12月25日至26日，他率沙恩霍斯特号战列舰及五艘驱逐舰从阿尔塔峡湾出击，执行拦截开往摩尔曼斯克的盟军JW 55B护航队的“东方行动”——这是邓尼茨任内德国水面舰队唯一一次重大出击。在随后的北角海战中，英国本土舰队设下陷阱，沙恩霍斯特号雷达被击毁，最终被击沉，全舰一千九百余人仅三十六人生还，贝伊随舰沉没。"
 GER_theodor_heuss_desc:0 "1884年生，德国自由派政治家、作家，属于左翼自由主义的德意志民主党，曾任国会议员，并是希特勒的早期批评者，1932年出版了对纳粹的分析著作。然而在1933年3月，迫于党纪，他投票赞成了授予希特勒独裁权力的《授权法》——这一决定他在战后还须向调查委员会作出解释。他的著作被查禁焚毁，纳粹时期他退出公共生活，虽与自由派圈子和抵抗运动有所往来，但并非积极的抵抗者。战后他参与创建自由民主党（FDP），并参与起草《基本法》。1949年，他当选联邦德国首任总统，1954年连任，任职至1959年，以超党派、注重文化的方式塑造了总统这一职位。1963年去世。"
 joseph_goebbels_desc:0 "1897年生于莱特，获海德堡大学文学博士学位。1924年加入纳粹党，1926年起任柏林大区长官。1933年起出任国民教育与宣传部长，对新闻、广播、电影、戏剧和文化实行全面管控，是纳粹宣传机器和希特勒崇拜的总设计师，主导了1933年的焚书行动。作为狂热的反犹分子，他是1938年11月“水晶之夜”反犹迫害的主要策划者之一。1943年斯大林格勒败局后，他在柏林体育宫发表演说，鼓动德国进行“总体战”。他始终对希特勒保持狂热忠诚，被希特勒在政治遗嘱中指定为继任总理。1945年5月1日，他与妻子玛格达在元首地堡中用氰化物毒杀了六名子女，随后双双自杀。"
 GER_otto_ruhle_desc:0 "1874年生，德国马克思主义作家、教育家、国会议员，委员会共产主义（议会共产主义）的主要理论家。他1912年起任社民党国会议员；1915年，他与卡尔·李卜克内西一道，成为最早在国会投票反对战争拨款的议员。他是斯巴达克同盟和德国共产党的创建者之一，但1919年即退出，转而参与组建德国共产主义工人党（KAPD），后又发展出一套既反政党、也反工会的委员会共产主义主张。他批判苏联是国家资本主义、布尔什维主义是一种压制性的体制。1933年逃离纳粹德国后，他流亡墨西哥，并于1937年参加了调查莫斯科审判指控的杜威委员会。1943年6月24日，他在墨西哥城去世。"
 GER_adolf_friedrich_von_mecklenburg_desc:0 "1873年生于什未林，梅克伦堡-什未林公爵，德国的非洲探险家、殖民官员。1907至1908年，他率领一支科学考察队穿越中部非洲、自东向西横贯非洲大陆，并因此获颁地理学奖章。1912至1914年，他出任德属西非托戈兰的末任总督。一战结束之际的1918年秋，他曾被提议出任德国在波罗的海占领区扶植的短命傀儡国“波罗的联合公国”的君主，但随着德国战败，此事未能成真。后来他长期投身体育事务，自1926年起任国际奥委会委员，并于1949至1951年出任（西德）德国国家奥林匹克委员会首任主席。1969年在奥伊廷去世。"
 GER_august_thalheimer_desc:0 "1884年生，德国共产党理论家。他出身社民党，是斯巴达克同盟和德国共产党的创建者之一，并在1920年代初与海因里希·布兰德勒同任德共主席，被视为党的主要理论家；1923年德共仓促发动、却以失败告终的“德国十月”起义，两人也因此负责。此后他被开除出党，1929年与布兰德勒一道创建“德国共产党反对派”（KPO），形成一支反对斯大林化路线的共产主义异见派别。纳粹上台后他流亡法国，曾被拘押，后辗转逃往古巴。1948年在哈瓦那去世。"
 werner_von_fritsch_high_command_desc:0 "1880年生，德国陆军上将，魏玛末期至纳粹初期的陆军总司令。他是职业军人出身的保守派将领，对纳粹党干预军队内务持保留态度，与希特勒的关系并不融洽。1938年初，他与布隆贝格同时卷入政治风波：党卫军伪造证据，诬陷他有同性恋行为，史称“弗里奇事件”。希特勒借此将他解除陆军总司令职务，由布劳希奇接任；随后的军事荣誉法庭虽判定指控不实，但他未能复职。波兰战役爆发后，他以炮兵团长身份重回前线，于1939年9月22日在华沙郊外战斗中阵亡，是二战中阵亡的最高级别德国将领之一。"
 werner_von_fritsch_army_chief_desc:0 "1880年生，德国陆军上将，魏玛末期至纳粹初期的陆军总司令。他是职业军人出身的保守派将领，对纳粹党干预军队内务持保留态度，与希特勒的关系并不融洽。1938年初，他与布隆贝格同时卷入政治风波：党卫军伪造证据，诬陷他有同性恋行为，史称“弗里奇事件”。希特勒借此将他解除陆军总司令职务，由布劳希奇接任；随后的军事荣誉法庭虽判定指控不实，但他未能复职。波兰战役爆发后，他以炮兵团长身份重回前线，于1939年9月22日在华沙郊外战斗中阵亡，是二战中阵亡的最高级别德国将领之一。"
 kurt_schumacher_desc:0 "1895年生于西普鲁士的库尔姆，德国社会民主党政治家。他在一战中失去右臂，魏玛时期任社民党国会议员，是坚定的反纳粹者。纳粹上台后，他于1933年被捕、遭毒打，此后约十年间辗转关押于多座集中营，身体被严重摧残，一条腿后来也被截除。1943年他重病获释，1944年“七二〇”事件后又被再度逮捕。战后，他成为重建西德社民党的核心人物、自1946年起任党主席，是西德战后民主制度的奠基者之一；他既坚决反纳粹，也是激烈的反共产主义者，并出任联邦议院首任反对党领袖，与阿登纳针锋相对。1952年在波恩去世。"
 walther_funk_desc:0 "1890年生于东普鲁士，德国经济学家、财经记者出身的纳粹官员。1931年加入纳粹党后，他在戈培尔的宣传部任职，1938年接替沙赫特出任经济部长，1939年又接任帝国银行行长，主管战时经济动员与对犹太人财产的剥夺。作为帝国银行行长，他与希姆莱达成安排，将党卫军从集中营遇害者身上掠夺来的黄金、首饰、眼镜、戒指乃至从尸体上拔下的金牙存入帝国银行，熔铸成金条供纳粹国家和党卫军使用。纽伦堡国际军事法庭以破坏和平罪、战争罪和反人类罪三项罪名判处他终身监禁。他被关押于施潘道监狱，1957年因健康原因获释，1960年去世。"
 GER_julius_leber_desc:0 "1891年生于阿尔萨斯的比斯海姆，德国社会民主党（SPD）政治家、记者。他在一战中负伤、官至中尉，战后编辑《吕贝克人民信使报》，1924年起任社民党国会议员，专长军事政策，直到1933年纳粹解散国会。纳粹上台后，他多次被捕、被关进集中营直到1937年，出狱后继续从事社民党的地下活动。他是社会民主派抵抗运动的领袖之一，与克莱绍集团和“七二〇”密谋者有联系，并被内定为政变后政府的内政部长人选。1944年7月初，即政变前数日，他因一场被盖世太保渗透的会议而被捕；他遭受酷刑却没有出卖同伴。经人民法院审判，他于1945年1月5日在柏林普勒岑湖监狱被处决。"
 GER_hermann_erhardt_desc:0 "1881年生，一战时的德国海军军官，魏玛初期著名的反共和派自由军团（Freikorps）首领。他组建的“埃尔哈特海军旅”在1918至1919年的革命中镇压各地的共产主义起义，并成为1920年企图推翻共和国的卡普政变的主力之一。该旅被强制解散后，他用其残部组建了秘密组织“领事组织”（Organisation Consul），策划了包括外交部长拉特瑙在内的一系列政治暗杀。他厌恶希特勒、拒绝支持1923年的啤酒馆暴动；1934年“长刀之夜”清洗中他成为目标，及时出逃，此后在奥地利以务农为生、不再涉足政治和军事，1971年去世。"
 heinz_guderian_desc:0 "“快速海因茨”古德里安。1888年生，德国国防军上将，装甲战理论与实践的核心推动者。他在两次大战之间系统研究机械化作战，著有《注意，坦克！》，力主装甲部队应集中使用而非分散配属步兵，成为德国装甲兵建设的主要理论奠基人。法国战役中，他指挥第十九装甲军穿越阿登，突破马斯河，以惊人速度直抵英吉利海峡，将英法联军拦腰截断。巴巴罗萨行动中，他率第二装甲集群参加明斯克、斯摩棱斯克合围及基辅会战，向莫斯科方向推进；1941年12月因擅自下令撤退被希特勒解职。1943年起出任装甲兵总监，主持东线装甲部队的整补重建。1944年7月密谋案后被任命为陆军总参谋长，在德军全面崩溃的局面下多次与希特勒爆发冲突，1945年3月再度被解职。战后撰写回忆录《一个士兵的回忆》，未受实质追诉，1954年在西德去世。"
 erwin_rommel_desc:0 "1891年生，德国国防军元帅，以北非战役的指挥闻名，被称为“沙漠之狐”。一战中他在步兵战术上表现出色，获功勋勋章。法国战役中，他指挥第七装甲师以高速突破著称。1941年2月，他率德意非洲军团抵达利比亚，随后发动一系列进攻，多次击退英军，将战线推至埃及边境，在双方装备和兵力均不对等的条件下一度逼近亚历山大港。1942年6月攻克托布鲁克后晋升元帅。同年10至11月阿拉曼战役中被蒙哥马利击败，此后持续撤退，1943年3月因病离开北非。随后他调任西线，负责大西洋壁垒的防御建设，主张将装甲预备队前置于海岸线附近。1944年7月20日刺杀希特勒事件后，他因与密谋圈有所接触受到牵连，被迫于1944年10月15日在家中服毒自杀，官方对外宣称其战伤不治，以国葬礼仪安葬。"
 kurt_student_desc:0 "1890年生，德国空军上将，德国空降兵的创建者与主要指挥官。他主持组建并发展德国伞兵部队，1940年荷兰战役中率空降部队夺取鹿特丹桥梁，在西欧战役中发挥关键作用。1941年5月，他指挥第十一航空军实施克里特岛空降作战，虽最终攻克该岛，但伞兵损失极为惨重，希特勒此后拒绝再批准大规模空降行动。此后他长期指挥驻意大利和西线的伞兵部队参与地面防御作战。1945年被盟军俘虏，战后以克里特岛作战中对平民的报复处决行为受审，一度被判刑，后因手续问题获释，1978年在西德去世。"
 gerd_von_rundstedt_desc:0 "“最后的普鲁士人”伦德施泰特。1875年生于萨克森阿申斯莱本，出身普鲁士贵族家庭，史家查尔斯·梅森杰以“最后的普鲁士人”为他立传。1892年入伍，一战历任参谋职务，战间期逐级晋升，1938年在贝克等将领联署备忘录反对希特勒激进政策后主动请退。战争前夕他被召回，此后四年三度被解职、三度复出。1939年波兰战役中他指挥南方集团军群；1940年法国战役中，他的A集团军群实施阿登突破，并在敦刻尔克附近首先下令装甲部队停止前进，最终使三十余万英法联军得以撤走。1940年7月晋升帝国国防军元帅。1941年巴巴罗萨行动中，他统率南方集团军群击溃布琼尼所部，主导了史上规模最大的合围战——基辅会战，俘获逾六十万苏军；同年11月因发动侵苏以来的首次德军撤退、违抗希特勒死守命令，被解职。1942年起长期出任西线总司令，主持大西洋壁垒防御。1942年他还签发命令将被俘盟军伞兵和突击队员移交盖世太保而非作为战俘处理，此即后来纽伦堡对他提起战争罪指控的主要依据之一。1944年盟军诺曼底登陆后，他在与凯特尔的通话中说出那句著名的话：“媾和，你们这些蠢货！还能怎么办？”随即第二度被解职；七月密谋后希特勒反而信任他，委其主持国防军荣誉法庭，负责将涉案军官移出军籍，为随后的死刑铺路。同年晚些时候第三度复出，名义上主持阿登反攻，实则毫无主导权。1945年3月第三度被解职。战后以战争罪被英方起诉，因年迈体衰1948年获释，从未受审。艾森豪威尔与蒙哥马利均评价他是他们在西线所对阵的最出色的德国将领；李德尔·哈特则称“伦德施泰特骨子里是个绅士，他的天然尊严和良好举止令即使与他观点迥异的人也心存敬重”。1953年在汉诺威去世，终年七十七岁。"
 GER_hermann_goring_desc:0 "1893年生于罗森海姆，纳粹德国仅次于希特勒的二号人物，德国空军总司令、帝国元帅。一战中他是著名战斗机飞行员，曾出任“红男爵”里希特霍芬战斗机联队的末任联队长，获功勋勋章。战后他早年即追随希特勒，参加1923年慕尼黑啤酒馆暴动并在街头冲突中负伤。纳粹上台后他权势迅速膨胀：出任普鲁士邦总理兼内政部长期间，他创建盖世太保并设立最早的一批集中营，又先后出任国会议长、空军总司令、四年计划全权负责人，几乎掌控了德国的军备与战时经济命脉。1935年起他全力扩建德国空军；1940年希特勒为他专设帝国元帅军衔，使其位居全体德军将领之上，并指定他为接班人。1941年7月，他签署书面授权，令海德里希着手筹划对欧洲犹太人的“最终解决”，是大屠杀决策链上的关键一环。他还主导了对占领区艺术品的大规模劫掠，并长期受吗啡毒瘾困扰。随着空军在不列颠之战受挫、又未能兑现以空运为斯大林格勒被围德军补给的承诺，他的威信日渐衰落。1945年4月，他致电希特勒提出由自己接掌国家领导权，希特勒震怒，下令解除其一切职务并将其逮捕。德国投降后他向美军投降，在纽伦堡国际军事法庭受审，以阴谋罪、破坏和平罪、战争罪和反人类罪四项罪名被判处绞刑。1946年10月，他在行刑前夜服氰化物自杀。"
 GER_rolf_carls_desc:0 "1885年生于罗斯托克，德国海军大将，战间期至二战中期德国海军的高级统帅之一。他早年作为年轻军官在德国东亚巡洋舰队服役，一战主要在黑海方向作战，后转任教官及潜艇、教练舰艇指挥。魏玛时期他长期在海军参谋系统任职，1930年起出任海军指挥部参谋长，成为雷德尔最信任的助手之一。1936至1938年间他出任舰队总司令，是德国战前海军作战计划的主要拟订者之一；1938年夏，他在一份评估希特勒扩张政策的绝密备忘录中预言，这样的国策将使德国同时与法国、苏联及大批海外国家开战。西班牙内战期间他曾率德国舰艇编队赴西班牙海域支援佛朗哥一方。二战爆发后，他向雷德尔建议占领挪威，是“威悉演习”行动（入侵丹麦和挪威）海军计划的关键推动者，并因此获骑士十字勋章。此后他长期出任海军东方集群（后改称北方集群）司令，在波罗的海方向指挥舰队，配合对苏作战。1943年初雷德尔辞职时，他与邓尼茨同为继任人选，但希特勒选择了更年轻的邓尼茨，他随即被荣誉退役，转任施托马恩地区代理行政长官。1945年4月，他在英国皇家空军对巴特奥尔德斯洛的大空袭中身亡。"
 GER_alfred_hugenberg_desc:0 "1865年生于汉诺威，德国实业家、报业巨头、民族主义政客。他曾任克虏伯公司董事会主席，自1916年起逐步建立起一个庞大的媒体帝国，掌握德国相当大一部分报纸、一家通讯社和欧洲最大的电影公司乌发（UFA）。1928年起，他出任右翼的德意志国家人民党（DNVP）党魁，把该党推向坚决反共和、反《凡尔赛条约》的立场。他借自己的媒体为希特勒和纳粹党大造声势，并通过1929年反“扬格计划”公投和1931年的哈茨堡阵线与纳粹结盟，为希特勒上台铺平了道路。1933年1月30日，他进入希特勒首届内阁出任经济兼粮食与农业部长，本想借机驾驭、利用希特勒，结果数月之内即遭架空。同年6月他辞去部长职务，DNVP随即解散；此后他虽以“客籍”身份留在国会至1945年，却再无任何影响力，媒体帝国也被逐步剥夺。战后他被英方拘押，去纳粹化程序最终将其定性为“无罪/非纳粹”。1951年去世。"
 hugo_sperrle_desc:0 "1885年生于路德维希堡，德国空军元帅。一战中他由炮兵转入航空兵，战后历经自由军团与防卫军，1920年代曾主管设在苏联利佩茨克的德国秘密飞行学校。1935年他加入新建的德国空军。1936年11月至1937年10月，他出任秃鹰军团首任司令，以里希特霍芬为参谋长，指挥德国航空部队介入西班牙内战、支援佛朗哥一方；其麾下部队实施了1937年对格尔尼卡的轰炸。1938年起他出任第三航空队司令，并被希特勒用于对外恫吓——1938年2月与奥地利总理许士尼格会谈时即奉命到场施压。二战中，他率第三航空队参加法国战役、不列颠之战及对英国的持续轰炸，1940年晋升元帅，此后长期担任西线德国空军的最高指挥官，以在巴黎生活奢靡著称。至1944年诺曼底登陆时，他所辖兵力已所剩无几，同年8月被解职。战后他作为被告出席纽伦堡的“高级司令部审判”，最终被判无罪，1953年在慕尼黑去世。"
 GER_reinhard_heydrich_desc:0 "1904年生于哈雷，党卫军高级集团领袖，1939年起任帝国保安总局（RSHA）局长，统辖保安处、盖世太保和刑事警察，是大屠杀的主要设计者之一。1942年1月，他主持了万湖会议，统筹协调“最终解决方案”的实施；在被占波兰修建灭绝营、系统屠杀犹太人的“莱因哈德行动”即以他的名字命名。1941年9月起，他兼任波希米亚和摩拉维亚代理保护长官，以极端残暴的手段镇压、处决当地民众。1942年5月，他在布拉格遭受过英方训练的捷克斯洛伐克特工伏击（“类人猿行动”），重伤后于6月4日死去。纳粹为报复，制造了利迪策村大屠杀，将全村夷为平地。"
 GER_nikolaus_von_falkenhorst_desc:0 "1885年生于布雷斯劳，德国陆军大将、战争罪犯，出身西里西亚军人世家，早年将斯拉夫语族的本姓改为德意志化的“法尔肯霍斯特”。一战及战间期历任参谋与指挥职务，1939年率第二十一军参加波兰战役。1940年2月，希特勒在数小时内交给他入侵丹麦和挪威（“威悉演习”行动）的任务，据载他临时买了一本挪威旅游指南来拟定计划；行动取得成功，但德国海军损失惨重。此后他长期出任挪威德军总司令，主持占领事务，其军事当局对挪威民众的态度相对克制，他还因抵制帝国驻挪威专员特博文的激进政策而于1944年12月被解职。但他转发并多次重申希特勒的“突击队命令”，要求将被俘盟军突击队员处死或交党卫军保安处处决，数名英国和挪威战俘因此被杀。战后他由英国-挪威联合军事法庭审判，被判死刑，后改为二十年监禁，1953年因健康原因获释，1968年去世。"
 rudolf_hess_desc:0 "1894年生于埃及亚历山大港，纳粹党早期成员。他参加了1923年的啤酒馆暴动，与希特勒一同被囚于兰茨贝格监狱，并协助整理《我的奋斗》。1933年起出任副元首，主管纳粹党务，在官方序列中位居希特勒和戈林之后。1941年5月10日，他独自驾驶一架梅塞施密特Bf 110飞往苏格兰，企图自行与英国谈判媾和，结果被俘，纳粹方面则对外宣称他精神失常。整个战争期间他被英国关押。在纽伦堡国际军事法庭，他以阴谋罪和破坏和平罪两项被定罪，判处终身监禁。他被关押于施潘道监狱；1966年施佩尔和席拉赫获释后，他成为该监狱唯一的囚犯，独自关押二十余年。1987年，他在狱中身亡（被认定为自缢），终年93岁。"
 GER_alfred_becker_desc:0 "1899年生于克雷费尔德，德国陆军炮兵军官兼工程师，以将缴获装备改装为自行火炮闻名。一战中他是炮兵军官，获两级铁十字勋章，战后取得机械工程博士学位并经营机械企业。1940年法国战役后，他利用缴获的英、法车辆，把榴弹炮架上轻型坦克底盘，自制出可机动的自行火炮，深得陆军最高统帅部赏识。希特勒遂下令大规模改装，并以他的名字组建“贝克尔建造队”，设在巴黎附近的霍奇基斯工厂，将大量缴获的法国坦克底盘和半履带车改造成坦克歼击车（如“黄鼠狼I”）、自行榴弹炮、火箭发射车和装甲输送车，先后产出约一千八百辆，其中大部分用于装备重建的第21装甲师。他本人指挥该师的第200突击炮营，在诺曼底作战，1944年12月在阿尔萨斯被俘。战后他获释，重操机械与纺织机械制造旧业，1981年去世。"
 GER_carl_friedrich_goerdeler_desc:0 "1884年生于施奈德米尔，德国保守派行政官员、经济学家，长期担任莱比锡市长（1930至1937年）。任内他反对纳粹的反犹政策，因拒绝拆除犹太作曲家门德尔松的塑像、并对重整军备和种族法律不满，于1937年辞去市长职务。此后他成为德国文官抵抗运动的核心人物，为推翻希特勒后的政府草拟方案，并被定为1944年“七二〇”政变成功后的新总理人选。在外交取向上，他主张维持德国与中国的传统合作、反对里宾特洛甫1938年转向日本的政策，并通过驻华军事顾问福尔肯豪森与中国方面保持联系。“七二〇”密谋失败后他遭通缉，于1944年8月被捕；在审讯中他供出了大量同谋者，导致许多人被捕和处决。1944年9月他被人民法院判处死刑，1945年2月2日被绞死。"
 wolfram_von_richthofen_desc:0 "1895年生，德国空军元帅，“红男爵”曼弗雷德·冯·里希特霍芬的堂弟。一战中他在堂兄的飞行联队服役，击落数架敌机。1936至1937年间，他以“秃鹰军团”参谋长身份参加西班牙内战，组织指挥了1937年4月对格尔尼卡的轰炸，该行动造成大批平民伤亡，引发国际社会强烈谴责，并因毕加索同名画作而永久留存于历史记忆。二战中他先后指挥第八航空军、第四航空队，参加波兰战役、法国战役、不列颠之战、巴巴罗萨、斯大林格勒等重大作战，以近距离支援地面部队的俯冲轰炸战术著称。1944年因脑瘤丧失工作能力，1945年在奥地利去世，终年四十九岁。"
 GER_leni_riefenstahl_desc:0 "1902年生，德国女演员、舞者出身的电影导演。1930年代，她为纳粹政权拍摄了两部具有里程碑意义的宣传片——记录1934年纽伦堡党代会的《意志的胜利》（1935）和记录1936年柏林奥运会的《奥林匹亚》（1938），以开创性的拍摄手法美化纳粹，被公认为影史上最具技术成就也最具煽动力的宣传作品，她本人也与希特勒关系密切。在拍摄故事片《低地》（1940至1944年摄制、1954年公映）期间，她起用了从集中营借来的罗姆和辛提人作群众演员，其中不少人在拍摄结束后被送往奥斯威辛遇害；她对此长期否认、坚称他们都幸存，直到2002年其制片公司撤回相关说法后，一桩诉讼才了结。战后她被法国占领当局逮捕，经四次去纳粹化审理，最终被定性为“追随者”（Mitläufer），从未被判犯有战争罪。此后她转而从事摄影（拍摄苏丹努巴人）和水下摄影。2003年，她因癌症在德国波金去世，享年101岁。"
 joachim_von_ribbentrop_desc:0 "1893年生于韦塞尔，纳粹德国外交部长，被纽伦堡法庭处以绞刑。他早年经商，靠经营葡萄酒（并迎娶汉克尔起泡酒家族之女）致富，“冯”的贵族头衔则得自一位有爵位亲属的过继。1932年加入纳粹党后，他迅速成为希特勒的外交顾问，1936至1938年出任驻英大使，1938年起接替纽赖特出任外交部长。任内他经手了纳粹德国一系列对外条约：与日本的反共产国际协定、与意大利的钢铁同盟，以及最重要的1939年8月《苏德互不侵犯条约》——该约的秘密附加议定书将东欧划分为德、苏势力范围，为德国入侵波兰、引爆第二次世界大战扫清了障碍。战争期间，他的外交部积极配合向附庸国和占领区施压，参与对犹太人的驱逐迫害。德国战败后他被俘，在纽伦堡国际军事法庭受审，以阴谋罪、破坏和平罪、战争罪和反人类罪四项罪名被判处死刑。1946年10月16日，他是首名被执行绞刑的纽伦堡死刑犯。"
 GER_wilhelm_von_gayl_desc:0 "1879年生于柯尼斯堡，德国法学家、德意志国家人民党（DNVP）政治家。他早年任东普鲁士垦殖公司经理，一战中先后任前线军官和东线德军占领当局（Ober Ost）的内政主管，并曾任驻立陶宛北部的行政长官。1932年6月，他出任弗朗茨·冯·巴本“男爵内阁”的内政部长。他是同年7月“普鲁士政变”的主要策划者之一——以总统紧急法令推翻社民党主导的普鲁士邦政府；他还鼓吹以卡尔·施米特的“国家紧急状态”理论为依据、推行削弱议会的威权“新国家”方案，企图把德国改造成总统独裁体制。不过，他坚决反对与希特勒的纳粹党合作。随着巴本内阁在1932年底垮台，他也随之去职，此后在政坛再无影响。1945年11月7日去世。"
 GER_walter_dornberger_desc:0 "1895年生于吉森，德国陆军炮兵军官兼工程师（中将），纳粹德国火箭计划的军方负责人。一战中他是炮兵军官，曾被美军俘虏。两战之间他主持陆军的液体火箭研发，在佩内明德陆军研究中心领导V-2（A-4）火箭计划，冯·布劳恩任其手下的技术总负责人，1942年10月首次成功试射。V-2火箭后来在诺德豪森地下的米特尔维克工厂大规模生产，所用劳工来自米特尔堡-多拉集中营——约六万名囚犯在此服苦役，死于生产过程的人数远超被该火箭炸死的人数。战争结束时他与冯·布劳恩一同投降，因V-2生产中使用奴工问题被英方羁押审查约两年，随后经美国“回形针行动”被带往美国、基本免于追诉，长期在美国空军和贝尔飞机公司从事导弹与航天研究。1980年在西德去世。"
 viktor_schutze_desc:0 "1906年生于弗伦斯堡，德国海军潜艇王牌，骑士十字勋章带橡叶饰获得者。他1925年起在鱼雷艇服役，1935年转入新建的潜艇部队。二战爆发时他指挥U-25号，1940年7月起改任新锐的IXB型U-103号艇长，在北大西洋和西非海域执行巡逻，是开战初期最成功的U艇指挥官之一；其个人战绩约为击沉三十五艘盟军船只、共约十八万吨。1941年8月，他退出一线，转任第二潜艇区舰队司令。1943年3月起，他出任潜艇训练区舰队司令，负责波罗的海方向全部U艇训练事务，直至战争结束。战后他在英国战俘营羁押至1946年3月，1950年在美因河畔法兰克福去世。"
 hjalmar_schacht_desc:0 "1877年生，德国银行家、经济学家，纳粹德国重整军备的财政设计师。他长期出任帝国银行行长，1934至1937年间兼任经济部长。作为纳粹的早期支持者，他曾推动兴登堡任命希特勒为总理，并以帝国银行为工具、通过“梅福票据”等手段为德国秘密重整军备筹措资金、组织战时经济。但他逐渐反对希特勒不顾经济承受力的扩军与战争路线，与纳粹高层冲突日深，1939年辞去帝国银行行长，1943年被免去部长虚职。1944年七月密谋案后，他因被怀疑与密谋者有牵连而被捕，关押于集中营直至战争结束。纽伦堡国际军事法庭审理后将其无罪释放（苏方对此持异议）。战后他重新经营银行业务，并为多个国家提供经济咨询，1970年去世。"
 GER_andreas_hermes_desc:0 "1878年生于科隆，德国农业专家、中央党（Zentrum）政治家。魏玛时期，他先后出任帝国粮食与农业部长、财政部长，是当时农业政策的核心人物。纳粹上台后，他于1933年被捕，随后流亡哥伦比亚直到1936年。回国后，他加入了以天主教工人运动为基础的“科隆圈”，并与格德勒等抵抗者建立联系；格德勒在其内阁名单中把他列为政变后政府的农业部长人选。1944年“七二〇”事件后他被捕，1945年1月被人民法院判处死刑；但他的妻子设法一再拖延行刑，直到苏军攻入柏林，他得以幸存。战后，他成为苏占区基督教民主联盟（CDU）的创始人和首任主席（后迫于压力转赴西德），并长期担任德国农民协会主席。1964年去世。"
 walther_von_brauchitsch_desc:0 "1881年生，德国国防军元帅，1938至1941年间出任陆军总司令。他接替弗里奇出任总司令时，正值希特勒借“弗里奇事件”完成对陆军领导层的清洗之际，此后他在统帅部与希特勒之间长期扮演缓冲角色。波兰战役、法国战役和巴巴罗萨行动的陆军作战均在其任内发动。1941年莫斯科会战德军攻势受阻、冬季危机爆发，他向希特勒提出收缩战线建议遭拒，随即以健康原因辞职，由希特勒亲自兼任陆军总司令。此后他再未复出，1948年在英国羁押期间病死，未受正式审判。"
 GER_hans_luther_desc:0 "1879年生于柏林，德国无党派的政治家、技术官僚。他早年是法学家和市政官员，曾任埃森市长，1923年出任财政部长，协助遏制了当年的恶性通货膨胀。1925至1926年间，他两度出任魏玛德国总理，其政府促成了《洛迦诺公约》、为德国加入国际联盟铺平道路。1930年起他接替沙赫特出任帝国银行行长；1933年3月，面对希特勒要求帝国银行为重整军备提供巨额资金，他以银行的法定独立性为由拒绝，随即辞职，由沙赫特接任。此后他出任驻美国大使（1933至1937年），任内曾对外宣扬希特勒的“和平意图”，1937年退出公职，纳粹时期及战后均赋闲在野。1962年在杜塞尔多夫去世。"
 GER_wilhelm_zaisser_desc:0 "1893年生于盖尔森基兴附近的罗特豪森，德国共产党人。他早年当过小学教师，一战时任军官，战后加入德共，曾参与鲁尔红军的武装行动。1927年至1930年，他受共产国际和苏联红军情报机构派遣前往中国，与海因茨·诺伊曼等人一道，成为1927年广州起义的组织者之一。西班牙内战期间，他化名“戈麦斯将军”，指挥第十三国际纵队，并一度统辖驻阿尔瓦塞特的国际纵队基地。纳粹时期他长居苏联，并取得苏联国籍。1947年回到德国后，他在东德安全机构中迅速崛起，于1950年出任东德首任国家安全部长——即斯塔西的创建者，将其建成仿苏联模式的庞大秘密警察机构。1953年六一七事件后，他被指“反党”而遭撤职清洗，并被开除出党。1958年在东柏林去世。"

