 GND_yu_hanmou_desc:0 "1896年3月3日生于广东高明，1981年11月22日卒于台北。粤系将领，保定军校出身，北伐后逐步升任广东省军事领导职务。1936年两广事变后，受蒋介石委任逐步接替陈济棠主政广东，由此确立其在华南的核心军事地位。抗战期间率部参加淞沪会战后方策应与多次粤北会战，是主持广东对日防守的主要将领，坚持至1938年10月广州陷落后才率残部退入山区，维系游击抗战体系。1949年率部撤台，晚年历任要职，1981年辞世。"
 GXC_yu_hanmou_desc:0 "1896年3月3日生于广东高明，1981年11月22日卒于台北。粤系将领，保定军校出身，北伐后逐步升任广东省军事领导职务。1936年两广事变后，受蒋介石委任逐步接替陈济棠主政广东，由此确立其在华南的核心军事地位。抗战期间率部参加淞沪会战后方策应与多次粤北会战，是主持广东对日防守的主要将领，坚持至1938年10月广州陷落后才率残部退入山区，维系游击抗战体系。1949年率部撤台，晚年历任要职，1981年辞世。"
 POLITICS_CAROL_II_DESC:0 "国王卡罗尔二世，1893年10月15日生于锡纳亚佩雷什城堡，斐迪南一世之子，1930年即位。1921年迎娶希腊公主埃琳娜，育有儿子米哈伊，即罗马尼亚末代国王米哈伊一世。因与埃琳娜·卢佩斯库的婚外情，他于1925年放弃王位继承权，流亡法国，王位由幼子米哈伊继承。1927年斐迪南一世去世后，米哈伊在摄政会议辅政下即位。1930年，卡罗尔趁国内政局动荡秘密回国，经政变废黜摄政会议与米哈伊，重新登基，任内推动经济发展、维持与法国的同盟，但私生活与用人始终备受争议。1938年2月，他以对抗铁卫团为由建立王室独裁，解散各政党，同年12月又成立国家复兴阵线自任领袖；任内戈加内阁颁布排犹法令。1940年，罗马尼亚在苏联、匈牙利与保加利亚的压力下接连丧失比萨拉比亚、北布科维纳、北特兰西瓦尼亚与南多布罗加，他的威信随之崩溃。9月4日，他任命扬·安东内斯库为首相；两天后，军队拒绝执行命令，他被迫退位，携情妇卢佩斯库出走，途经蒂米什瓦拉时遭遇铁卫团刺杀未遂。战后他被西方盟国禁止回国，1947年在巴西与卢佩斯库正式结婚。1953年4月4日，他在葡萄牙埃什托里尔去世，其子米哈伊一世拒绝出席葬礼。"
