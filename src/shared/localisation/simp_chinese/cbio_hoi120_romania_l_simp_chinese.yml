 CBIO_ROM_lucretiu_patrascanu_desc:0 "卢克雷奇乌·珀特勒什卡努（1900—1954）生于巴克乌，在布加勒斯特学习法律，后赴莱比锡研究罗马尼亚的土地改革。1921年加入罗马尼亚共产党。1944年8月，他参与推翻安东内斯库政权，随后率罗马尼亚代表团赴莫斯科谈判停战。出任司法部长后，他也在布加勒斯特大学讲授经济学。1948年，他在党内权力斗争中被捕。经多年关押，他于1954年被判处死刑并遭处决。1968年，罗马尼亚共产党为他平反。"
 CBIO_ROM_ana_pauker_desc:0 "安娜·波克尔（1893—1960）年轻时在布加勒斯特一所犹太学校教授希伯来语，后来加入罗马尼亚共产党。1935年，她在罗马尼亚被捕，随后被判十年徒刑。1941年，她在一次换囚中获释，前往莫斯科，担任罗马尼亚共产党驻共产国际代表。1944年回国后，她进入罗共中央书记处，参与共产党取得政权的过程。1947年11月出任外交部长。1952年，她在党内斗争中失去职务，次年被捕，获释后曾从事翻译工作，1960年在布加勒斯特去世。"
 ROM_lucretiu_patrascanu_desc:0 "$CBIO_ROM_lucretiu_patrascanu_desc$"
