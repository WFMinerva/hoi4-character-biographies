l_simp_chinese:
 CBIO_AFG_mohammed_zahir_shah_desc:0 "穆罕默德·查希尔·沙阿一九一四年生于喀布尔，出身巴拉克宰部落穆罕默德扎伊家族，是纳迪尔沙阿之子。早年就读喀布尔哈比比亚中学，后赴法国留学，归国后曾任副国防大臣、教育大臣。一九三三年十一月父亲遇刺身亡后，十九岁的他即位为阿富汗国王，即位初期由叔父哈希姆汗、沙阿·马哈茂德汗相继出任首相摄政。一九六三年他免去表兄达乌德汗的首相职务，一九六四年颁布新宪法，建立君主立宪制，推行自由选举与议会政治，并扩大与美苏两大阵营的外交关系，任内阿富汗维持了近四十年相对和平的局面。一九七三年七月，他在意大利就医期间，达乌德汗发动政变废黜君主制，建立共和国；同年八月，他自罗马发表逊位声明，此后侨居意大利二十九年。二零零二年他返回阿富汗，主持支尔格大会，此后被尊为国父。二零零七年七月二十三日在喀布尔去世。"
 CBIO_AFG_mohammad_hashim_khan_desc:0 "穆罕默德·哈希姆·汗一八八四年生于英属印度德拉敦，是国王穆罕默德·纳迪尔沙阿之弟，沙阿·马哈茂德汗与沙·瓦利汗之兄。纳迪尔沙阿即位后，哈希姆汗出任阿富汗王国首相，一九三三年纳迪尔遇刺、侄子查希尔沙阿继位后仍留任，前后主政十余年。执政期间他致力于整顿军队、发展经济与交通，为免过度依赖苏联与英国，转而寻求纳粹德国的技术与资金援助，一九三五年后德国专家与商人陆续在阿富汗兴办工厂与水电项目，日本与意大利也提供少量援助。第二次世界大战期间，他在英方施压下于一九四一年下令驱逐轴心国侨民，以维持阿富汗中立地位。一九四六年五月他卸任首相，由其弟沙阿·马哈茂德汗接任。一九五三年十月二十六日在喀布尔去世。"
 CBIO_AFG_sardar_shah_wali_khan_desc:0 "沙·瓦利汗一八八八年四月十六日生于英属印度德拉敦，是国王穆罕默德·纳迪尔沙阿与首相沙阿·马哈茂德汗的同胞兄弟，首相哈希姆汗的异母兄弟，查希尔沙阿与达乌德汗之叔。他早年随兄长流亡法国，一九二九年纳迪尔家族返阿平定内乱期间，他出任讨伐卡拉卡尼部队总司令，同年十月十日攻克喀布尔，因功获封加齐及喀布尔征服者称号。此后他历任军政要职，并长期担任驻外大使，是查希尔沙阿在位期间及流亡时期身边重要的皇室元老之一。一九七七年四月在阿富汗去世。"
 CBIO_AFG_amunullah_khan_desc:0 "阿曼努拉·汗一八九二年六月一日生于喀布尔近郊帕格曼，是埃米尔哈比布拉汗第三子。一九一九年二月父亲遇刺后，他迅速控制喀布尔与国库，击败叔父纳斯鲁拉汗的继位企图，于同月二十八日自立为埃米尔。同年他发动第三次英阿战争，迫使英国放弃对阿富汗外交事务的控制权，阿富汗由此获得完全独立，他也因此获封加齐称号。此后他大力推行世俗化改革，包括兴办新式学校、修筑道路、颁布一九二三年宪法，并在王后苏拉娅·塔尔齐支持下推动妇女教育与放松面纱习俗。一九二六年他改称号为国王。急进的改革引发保守部族与宗教人士不满，一九二八年出访欧洲归来后爆发部落叛乱，一九二九年卡拉卡尼攻占喀布尔，他被迫逊位，先流亡英属印度，后辗转意大利、瑞士定居。一九六零年四月二十六日在瑞士苏黎世去世，遗体运回阿富汗，葬于贾拉拉巴德其父陵墓旁。"
 CBIO_AFG_inyatullah_khan_desc:0 "伊纳亚图拉汗一八八八年十月二十日生于喀布尔，是埃米尔哈比布拉汗长子，阿曼努拉汗之兄。一九一九年二月父亲遇刺后，他一度表态拥立叔父纳斯鲁拉汗，未能继位，此后长期赋闲，未曾出任大臣、总督或军职。一九二九年一月十四日，阿曼努拉汗在卡拉卡尼叛军兵临喀布尔之际将王位禅让于他，试图秘密出逃坎大哈。伊纳亚图拉汗接位仅三天，即因卡拉卡尼来信逼降而表示本无意为王，于一月十七日逊位，由英国皇家空军将其接运至白沙瓦避难。此后他长期旅居国外，一九四六年八月十二日在德黑兰去世。"
 CBIO_AFG_soraya_tarzi_desc:0 "苏拉娅·塔尔齐一八九九年十一月二十四日生于奥斯曼帝国治下的大马士革，是流亡知识分子马哈茂德·塔尔齐与阿斯玛·拉斯米亚之女。一九零一年塔尔齐家族获准返回阿富汗，苏拉娅在阿曼努拉汗即位前与其相识，一九一三年成婚。一九一九年阿曼努拉汗即位后，她成为王后，积极参与教育与妇女权益事务，一九二一年在喀布尔创办阿富汗第一所女子学校，一九二四年支持设立妇女医院，并公开摘除面纱，倡导放松相关习俗。一九二七至一九二八年她随阿曼努拉汗出访欧洲各国，曾在牛津大学等场合发表演说，声名远播。一九二九年阿曼努拉汗逊位后，她随夫流亡英属印度，其间诞下幼女，后辗转定居意大利罗马。一九六八年四月二十日在罗马去世，灵柩运回阿富汗，与阿曼努拉汗合葬于贾拉拉巴德。"
 CBIO_AFG_shah_mahmud_khan_desc:0 "沙阿·马哈茂德汗一八九零年生，出身巴拉克宰穆罕默德扎伊部族，是国王穆罕默德·纳迪尔沙阿之弟，哈希姆汗与沙·瓦利汗之兄弟，查希尔沙阿与达乌德汗之叔，娶阿曼努拉汗之妹萨弗拉苏丹为妻。一九四六年五月，他接替兄长哈希姆汗出任阿富汗王国首相。任内他一度放宽政治管制，一九四九年允许相对自由的选举，被称为自由议会时期，新闻管制也有所松动，但至一九五二年选举时政策重新收紧。其首相任期内，巴基斯坦从英属印度独立建国，阿富汗与巴基斯坦的普什图尼斯坦问题开始成为外交焦点。一九五三年九月七日他卸任首相，由侄子达乌德汗接任。一九五九年十二月二十七日去世。"
 CBIO_AFG_mahmud_tarzi_desc:0 "马哈茂德·塔尔齐一八六五年八月生于加兹尼，出身巴拉克宰王室支系穆罕默德扎伊家族，父亲古拉姆·穆罕默德·塔尔齐曾任坎大哈总督，亦是当地知名诗人。一八八一年阿卜杜尔·拉赫曼汗上台后，塔尔齐一家遭放逐，辗转卡拉奇，最终定居奥斯曼帝国境内的大马士革与伊斯坦布尔，塔尔齐由此精通普什图语、达里语、土耳其语、阿拉伯语与法语，并结识泛伊斯兰思想家扎马鲁丁·阿富汗尼。一九零一年，他经哈比布拉汗特赦返回阿富汗，此后致力于翻译西方著作、引介现代思想。一九一一年他创办《消息火炬报》，此后八年间该报成为阿富汗现代主义与民族主义运动的核心阵地，培养出大批青年改革人才。其女苏拉娅嫁予阿曼努拉汗，塔尔齐由此成为国王的岳父与首席顾问。一九一九年阿曼努拉即位后，塔尔齐出任外交大臣，在第三次英阿战争期间主导对英交涉，并率团出席一九二零年穆索里会议及一九二一年喀布尔条约谈判，为阿富汗争得完全外交独立。此后他历任驻法国大使及外交大臣要职。一九二七年底随阿曼努拉汗出访埃及、意大利，次年四月返阿后已不再担任要职，同年阿曼努拉政权崩溃，塔尔齐离开阿富汗，先后侨居德黑兰与伊斯坦布尔。一九三三年十一月二十二日，他因肝癌在伊斯坦布尔去世。"
 CBIO_AFG_ghulam_yahya_khan_tarzi_desc:0 "古拉姆·叶海亚·汗·塔尔齐一八九八年生于大马士革，是塔尔齐家族流亡叙利亚期间所生，母亲为叙利亚人。十岁时随家族返回阿富汗，就读喀布尔哈比比亚中学，后攻读法律与政治学。一九二零年他加入阿富汗外交部，先后任签证护照科副科长，一九二四年出任驻柏林使馆一等秘书。回国后他在外交部波斯及土耳其事务司任职，一九二六至一九二七年升任政治事务总监，并随阿曼努拉汗出访欧洲各国，因功获颁一等国旗勋章。一九二九年至一九三零年阿富汗政局动荡期间，他一度赋闲，纳迪尔沙阿稳定局势后，他于一九三零年出任外交部首任副大臣，一九三四年转任公共卫生司司长，一九三五年升任公共卫生大臣，任内推动多地兴建医院并普及疫苗接种。一九四八年起，他历任驻伊拉克、叙利亚、黎巴嫩、约旦大使，其后回国先后执掌两个部委，随后出任驻苏联、瑞典及芬兰大使，此后又出任驻法国大使、驻土耳其及奥地利大使，一九六三年转任驻捷克斯洛伐克及匈牙利大使。一九六五年四月，他自阿富汗王国政府退休。一九七五年三月六日去世。"
 CBIO_AFG_abdurauf_fitrat_desc:0 "阿卜杜拉乌夫·菲特拉提一八八六年生于布哈拉埃米尔国一个商人家庭，早年就读米尔阿拉伯经学院，通晓阿拉伯语、波斯语与突厥语。一九一零年他获布哈拉扎吉德派资助的青年教育协会保送赴伊斯坦布尔求学，在青年土耳其运动影响下接触伊斯兰改革思想，其间以波斯语创作多部散文与诗集，抨击布哈拉埃米尔政权的落后与愚昧。一九一三年返回布哈拉后，他在多地任教，推动扎吉德新式学校复办，并领导青年布哈拉党左翼。一九一八年他在撒马尔罕创办报纸，一九二零年布哈拉人民苏维埃共和国成立后，他出任教育人民委员，主持乌兹别克语正字法改革与拉丁化运动。一九二三年因苏联当局猜忌其民族主义倾向，他被召至莫斯科接受监管，转任东方学院教员，其间创作历史剧《阿布尔法伊兹汗》等作品。一九二七年返回中亚后，他先后任教于撒马尔罕师范学院与塔什干语言文学研究所直至一九三七年。一九三七年他遭内务人民委员部逮捕，一九三八年十月四日在塔什干被处决，一九五六年获平反。菲特拉提早年游历阿拉伯半岛、奥斯曼帝国、高加索、伊朗、阿富汗及印度等地，但其毕生政治与学术活动均以布哈拉及苏属乌兹别克斯坦为中心，并非阿富汗本国人物。"
 CBIO_AFG_abdul_hai_habibi_desc:0 "哈比比一九一零年生于坎大哈，父系出自当地知名学者家族，曾祖为号称坎大哈智者的哈比布拉大毛拉，其母为哈扎拉族出身。父亲早逝，他自幼在坎大哈清真寺求学，一九二零年入沙利马尔小学，十五岁获文凭后即在坎大哈各小学任教。一九二七年他出任《觉醒阿富汗报》副主编，一九三一年升任主编直至一九四零年。一九四零至一九四一年间他兼任普什图学会会长与出版司副司长。此后他长期从事普什图语言、历史与文学研究，一九四四年整理刊布手抄本《隐藏的宝藏》，声称收录了千年普什图诗作，但学界对其真伪存在争议，部分学者认为该文书系近代伪造。一九五零年代因反对时任首相沙阿·马哈茂德汗，他流亡白沙瓦，期间创办刊物宣传自己的政治主张。一九六一年获准回国，任喀布尔大学文学院教授，一九六六年起出任阿富汗历史学会会长，主持编写多部阿富汗通史与文献指南。一九七八年阿富汗爆发政变后，他健康每况愈下。一九八四年五月九日，他因心脏病在喀布尔去世。"
 CBIO_AFG_ghulam_muhammad_ghobar_desc:0 "古巴尔一八九七年生于喀布尔一个赛义德家族，早年曾在坎大哈、法拉等地生活并从事写作。一九四零年代他参与觉醒青年运动，因与该组织普什图族领导层理念不合，一度与其他非普什图族成员另立门户，后又重新加入。一九五二年他当选议会议员，并参与阿卜杜勒·马吉德·扎布利主持的制宪讨论。此后他参与创立阿富汗社会民主党，长期作为自由派政治活动家、记者与历史学家处于王室监控之下，政治与学术活动屡遭限制。他著有《阿富汗历史进程》与《艾哈迈德沙巴巴史》等重要史学著作，其中《阿富汗历史进程》是阿富汗第一部具有分析性质的现代通史，第一卷曾遭政府禁止在国内出版，最终在海外印行数万册。一九七八年初，他赴西柏林治疗胃病。一九七八年二月五日，他在柏林一家医院去世。"
 CBIO_AFG_qiamuddin_khadim_desc:0 "哈迪姆一九零一年生于喀布尔，是阿富汗知名学者、诗人、作家、记者与演说家，因其学术成就与政治贡献获尊称毛拉纳。他是阿富汗第一个政党觉醒青年的创始成员之一，与古尔帕恰·乌尔法特、阿卜杜勒·劳夫·贝纳瓦等人共同推动阿富汗现代知识分子运动的兴起。查希尔沙阿在位期间，他出任阿富汗参议员，长期在议会中代表知识界发声。他一生著述数百种，涵盖历史、伦理、教育、文学批评等领域，代表作品包括探讨儿童德育与新式生活的多部著作。一九七九年，他去世。"
 CBIO_AFG_abdul_hadi_dawi_desc:0 "达维一八九四年生于喀布尔一个达维家族，一九一二年毕业于哈比比亚中学，此后以笔名帕雷尚发表大量诗作。一九一九年马哈茂德·塔尔齐将《消息火炬报》主编之职交予他，达维随即将报纸更名为《阿富汗和平报》。一九二二年他出任阿富汗首任驻伦敦大使，一九二五至一九二八年任商业大臣，其后于一九二九至一九三一年再度出使伦敦。因支持阿曼努拉汗，他自一九三三年起被监禁长达十余年，直至一九四六年获释。此后他历任查希尔沙阿秘书与王储教师，一九五零年代当选议会议员并出任下院议长，其后又出任驻开罗大使及驻雅加达大使。一九六五年十月十二日，查希尔沙阿任命他为长老院院长。一九八二年，他在喀布尔去世。"
 CBIO_AFG_sher_khan_nashir_desc:0 "纳希尔出身加兹尼哈罗提部族纳希尔家族，为世袭大汗。一八八五至一八八六年吉尔查伊部族起义失败后，巴拉克宰王朝将纳希尔家族逐出加兹尼，家族由此迁居昆都士一带。二十世纪三十年代，纳希尔出任北阿富汗省督，主持创办斯平扎尔棉业公司，并推动屈孜卡拉港建设，该港后更名为谢尔汗港，成为阿富汗连接塔吉克斯坦的重要口岸。在他治理下，昆都士从荒芜之地发展为阿富汗最富庶的省份之一，新建大量住宅、学校与医院。因势力渐盛，据传引起王室猜忌，坊间相传他因此遭毒杀，但具体经过与确切年代缺乏可靠史料佐证。他的侄子古拉姆·萨尔瓦尔·纳希尔后来继承家业，将斯平扎尔公司进一步发展为阿富汗最大的私营企业。"
 CBIO_AFG_mohammed_daoud_khan_desc:0 "达乌德汗一九零九年七月十八日生于喀布尔，出身巴拉克宰王室穆罕默德扎伊家族，是纳迪尔沙阿之侄，查希尔沙阿的堂弟兼姐夫。一九三三年其父阿齐兹汗在柏林出任驻德公使期间遇刺身亡后，他与胞弟纳伊姆汗由叔父哈希姆汗抚养。达乌德早年留学法国，回国后历任东部省督、坎大哈省督，一九三九年升任中央部队司令，此后在镇压萨菲部族一九四四至一九四七年叛乱中崭露头角。他历任国防大臣、内政大臣，一九五一年升任中央军团司令。一九五三年他出任首相，任内推行世俗化与教育改革，允许妇女摘除面纱，转向苏联寻求军事经济援助，并主持赫尔曼德河谷开发工程；因普什图尼斯坦问题与巴基斯坦关系恶化，一九六三年在国王压力下辞职。一九七三年七月，趁查希尔沙阿在意大利就医之机，他发动不流血政变废黜君主制，宣布成立阿富汗共和国并自任总统，建立国家革命党一党体制。一九七八年四月二十八日，阿富汗人民民主党发动政变，他与家人在总统府抵抗中遇害。"
 CBIO_AFG_abdul_majid_zabuli_desc:0 "扎布利一八九六年八月十四日生于加兹尼省纳瓦地区，早年在赫拉特及塔什干求学。一九一七年他接手父亲的进出口贸易生意，与伊朗、俄国往来，一九二二年将公司总部迁至塔什干，后又迁往莫斯科，在苏联新经济政策期间经营一家纺织厂。一九二九年阿曼努拉政权崩溃、纳迪尔沙阿掌权后，因赏识其经济才干，纳迪尔沙阿邀请他回国协助整顿财政。一九三二年他创立阿沙米公司，次年发展为阿富汗民族银行，成为阿富汗首家投资银行，垄断卡拉库尔羊皮、地毯等出口业务，并资助棉纺厂、糖厂等三十余个工业项目。一九三六年起他出任国民经济大臣直至一九五零年代初，一九四八年赴华盛顿争取美国军事经济援助，他也是觉醒青年运动的支持者。一九五一年辞职后经瑞士辗转移居美国纽约，此后长期在海外遥控经营阿富汗民族银行，直至一九七五年该行被达乌德汗政府收归国有。一九九八年十一月二十三日，他在纽约去世，享年一百零二岁。"
 CBIO_AFG_mohammad_gul_khan_momand_desc:0 "莫曼德一八八五年一月十七日生于喀布尔省安达拉拜奥，出身蒙曼德普什图家族，祖上世代在阿富汗军中任职。他就读喀布尔哈比比亚中学，后赴奥斯曼帝国深造，一九零九年入军校，历任皇家卫队军官、军校校长、副总司令及卫队司令。一九一九年阿富汗独立战争期间，他随团出访欧洲宣示阿富汗主权。一九二四至一九二八年，他在阿曼努拉汗治下历任帕克蒂亚、楠格哈尔、巴尔赫等省督。一九二九年卡拉卡尼之乱期间，他与沙·瓦利汗、沙阿·马哈茂德汗分率三路大军会攻喀布尔，助纳迪尔沙阿复位，因功于一九三零至一九三九年出任内政大臣，其间兼领多省事务并推动道路、桥梁、学校等基础设施建设。他长期致力于普什图语文学，一九三二年在坎大哈创立普什图文学会，编有普什图语词典等著作。一九六四年八月十八日，他在喀布尔因心脏病去世，首相达乌德汗与查希尔沙阿国王均出席其葬礼。"
 CBIO_AFG_sheikh_omar_mojadidi_desc:0 "法兹勒·奥马尔·穆贾迪迪尊号努尔·马沙伊赫，意为教长之光，是喀布尔沙尔巴扎尔纳格什班迪·穆贾迪迪苏菲教团世袭教长，人称沙尔巴扎尔教长。该家族尊奉伊斯兰教第二任哈里发欧麦尔为先祖，并溯源至十六世纪印度宗教改革家艾哈迈德·希尔信迪，十九世纪初迁居阿富汗，在喀布尔沙尔巴扎尔及加兹尼等地设立经学院与苏非道堂，历代教长在阿富汗宫廷礼仪与政治中地位举足轻重。一九二九年阿曼努拉汗改革失败后，该家族的宗教与教育影响力在纳迪尔沙阿治下大幅回升。一九二九至一九三二年间，法兹勒·奥马尔出任阿富汗司法大臣，其女婿法兹勒·艾哈迈德随后于一九三二至一九三六年接任同一职位。他是后来阿富汗圣战者领导人、一九九二年临时总统赛义德·塞卜加图拉·穆贾迪迪的祖父。"
 CBIO_AFG_mazrak_zadran_desc:0 "马兹拉克·扎德兰是阿富汗东南部扎德兰部族酋长巴布拉克汗的长子。一九二四年十月，其父在霍斯特叛乱中为阿富汗政府作战身亡，马兹拉克继任部族酋长，纳迪尔王朝建立后获封副统领军衔。一九四四年二月，因不满政府征兵及贸易垄断政策，他在南方省伏击政府军，掀起支持阿曼努拉汗复位的部族起义，此后转战山区多年。一九四四年底他一度率众进入英属印度瓦济里斯坦境内，与俾路支酋长苏丹·艾哈迈德等人会合，后因英军轰炸被迫退回阿富汗。他与胞弟谢尔·穆罕默德汗坚持抵抗至一九四七年一月十一日方才投降，随即被阿富汗政府驱逐出境，此后长期流亡巴基斯坦阿伯塔巴德一带，靠巴基斯坦政府发放的津贴生活。一九七二年，他去世。"
 CBIO_AFG_faqir_of_ipi_desc:0 "法基尔·伊匹本名米尔扎·阿里汗，约一八九七年生于英属印度北瓦济里斯坦托奇河谷申凯基尔塔村，是瓦济尔部族托里凯勒支系麦达凯勒人，父亲谢赫·阿萨兰汗为宗教人士，在他十二岁时去世。他早年接受传统经学教育，一九二三年赴麦加朝觐后定居瓦济里斯坦伊匹村，因笃信宗教获尊称哈吉萨希布。一九三三年他曾赴阿富汗霍斯特一带，参与支持阿曼努拉汗复位的武装活动。一九三六年因伊斯兰比比改宗婚姻案引发的司法不公，他召集部族大会宣布对英属当局发动圣战，此后十余年率瓦济尔各部游击抵抗英印当局，牵制数万英印驻军，据称一度获纳粹德国与意大利暗中支持。一九四四至一九四七年阿富汗部族叛乱期间，他再度联合扎德兰、萨菲等部支持阿曼努拉汗复位。一九四七年巴基斯坦独立后，他拒绝承认新政权，转而支持普什图尼斯坦独立运动，并与阿富汗首相达乌德汗保持联系，终生未向殖民或巴基斯坦当局屈服。一九六零年四月十六日，他因长期哮喘病在瓦济里斯坦古尔韦克去世。"
 CBIO_GER_oskar_von_nidermayer_desc:0 "尼德迈尔一八八五年十一月八日生于德国弗赖辛，一九零五年参军加入巴伐利亚第十野战炮兵团，服役期间在埃尔朗根大学攻读自然科学、地质学及伊朗语言学，一九一二年起获准赴波斯、印度考察，是首批穿越卢特荒漠的欧洲人之一。第一次世界大战爆发后，一九一四年十二月德军参谋部派遣他率小股远征队赴阿富汗，试图联合当地势力煽动阿富汗对抗英属印度，此即尼德迈尔－亨蒂希使团。一九一五年九月使团抵达喀布尔，虽与埃米尔哈比布拉汗多次交涉，仍未能促成阿富汗参战，一九一六年五月使团奉命撤离，经俄国控制区艰险跋涉后转投奥斯曼军事顾问团，在阿拉伯地区从事类似策反工作。战后他获封骑士勋位，两战间秘密在德国国防军对苏联事务处任职，一九三三年转任柏林大学地理学讲师。二战期间他重返军界，出任第一六二突厥斯坦师师长，一九四四年五月因指挥不力被解职，同年八月因发表失败主义言论遭军事法庭审判监禁。一九四五年五月他在返乡途中于卡尔斯巴德被苏军逮捕，押送苏联，军事法庭判处徒刑二十五年，关押于弗拉基米尔监狱，其间感染肺结核。一九四八年九月二十五日，他在狱中医院去世。"
 CBIO_AFG_akram_sattari_desc:0 "虚构架空人物。其教名阿克拉姆源自阿拉伯语词根卡拉姆，意为慷慨、尊贵，是形容词卡里姆的最高级形式，意为最慷慨者、最尊贵者，为伊斯兰世界常见男子教名，与《古兰经》中真主尊名之一同源，通行于整个穆斯林世界。其姓萨塔里则源自阿拉伯语萨塔尔，意为遮蔽过失者，是真主九十九个尊名之一，衍生出阿卜杜勒·萨塔尔等常见教名；萨塔里这一带波斯语后缀的姓氏构词方式，在伊朗、中亚等波斯语文化圈更为常见，与阿富汗本土惯见的部落或地名姓氏结构并不一致。全名将泛伊斯兰世界通行的阿拉伯语教名与偏波斯化的姓氏后缀直接拼合，缺乏具体历史谱系依托，更像是抽取通用波斯伊斯兰命名元素随意组合而成。"
 CBIO_AFG_yaqub_khan_desc:0 "穆罕默德·雅各布汗一八四九年生，是埃米尔谢尔·阿里汗之子。一八六三年他出任赫拉特省总督，一八七零年起兵反抗其父未果，一八七四年被囚禁。一八七八年第二次英阿战争爆发，谢尔·阿里汗出逃阿富汗北部，一八七九年二月病逝，雅各布汗继位为埃米尔。同年五月，他在甘达马克与英方签署条约，将阿富汗外交事务的控制权让予英国，以换取停战。同年九月，喀布尔英国使团驻扎官遭杀害，英军再度进逼，十月阿尤布汗领导的部众起兵反对该条约，雅各布汗随即逊位，由阿尤布汗继任埃米尔。逊位后，他被英方送往英属印度，此后长期侨居当地，脱离阿富汗政局。一九二三年十一月十五日，他在英属印度去世。"
 CBIO_AFG_mihrdil_shahnawaz_desc:0 "虚构架空人物。其教名米赫尔迪尔由波斯语梅赫尔与迪勒复合而成，梅赫尔意为太阳、仁爱，亦是琐罗亚斯德教光明与盟约之神密特拉的波斯语称谓，迪勒意为心，合称直译为仁爱之心。这一名字组合并非全然无据，十九世纪巴拉克宰王朝确有一位同名总督梅尔·迪尔汗，曾任阿富汗北部边境总督，但与沙赫纳瓦兹这一姓氏并无关联记载。沙赫纳瓦兹则由波斯语沙阿与纳瓦兹复合而成，意为蒙王眷顾者，是波斯及莫卧儿宫廷体系中常见的荣衔式教名，历代阿富汗王室朝廷亦常以类似荣衔封赏近臣。将两个本应各自独立、分属不同世纪与语境的波斯宫廷荣衔式名号强行拼合为教名与姓氏，是这一姓名组合的糅合逻辑所在。"
 CBIO_AFG_nisar_muhammad_yousafzai_desc:0 "尼萨尔·穆罕默德·优素福扎伊一八九七年生于英属印度西北边境省斯瓦比县扎伊达村，出身优素福扎伊普什图家族。一九一九年阿富汗国王阿曼努拉汗发动第三次英阿战争，试图收复印度河以西普什图地区，他作为普什图人投身阿富汗军队作战，因战功获阿富汗勇敢勋章。战争结束后斯瓦比仍归英属印度管辖，他因参战遭当局判处死刑，随即逃亡越境至塔什干，化名尼索尔·阿瓦洛维奇·马戈梅多夫，加入苏联共产党。此后他投身中亚革命事务，曾参与苏联在吉兰地区支持波斯社会主义苏维埃共和国的行动。一九二六年，他出任塔吉克苏维埃社会主义共和国首任教育人民委员，兼任莫斯科大学普什图语教员，通晓普什图语、波斯语、俄语、乌兹别克语等多种语言。一九三七年十月八日，他在苏联大清洗中遭内务人民委员部逮捕，审讯期间与看守发生冲突，随即被枪杀。"
 CBIO_AFG_wazir_akbar_khan_desc:0 "穆罕默德·阿克巴汗一八一六年生，通称瓦齐尔·阿克巴汗，是埃米尔多斯特·穆罕默德汗之子。一八三七年占贾姆鲁德之战中，他统率其父麾下军队与锡克帝国交战。一八三九年第一次英阿战争爆发，英军扶植沙阿·舒贾复位，其父多斯特·穆罕默德汗遭废黜流亡。一八四一年喀布尔英军驻扎当局遭当地部众围困，阿克巴汗成为反英武装的核心领袖，同年十一月英国公使麦克诺顿在与其谈判时被杀。一八四二年一月，撤离喀布尔的英军及随行人员在返回贾拉拉巴德途中遭遇伏击，几乎全军覆没，仅一人生还，这是英属印度军事史上最惨重的败绩之一。同年五月，阿克巴汗一度摄政为埃米尔，直至一八四三年其父获释复位后，出任维齐尔兼王储。一八四七年，他因病去世。"
 CBIO_AFG_muhammad_ibrahim_khan_desc:0 "易卜拉欣汗一九一五年生于阿富汗乌鲁兹甘省沙里斯坦，即今戴孔迪省境内，出身当地哈扎拉族乡绅家庭，祖父阿米尔达德因惯于骑牛代步而获绰号高绥瓦尔，易卜拉欣汗因此也被称为易卜拉欣·高绥瓦尔。一九四四年，因首相穆罕默德·哈希姆汗政府下令在哈扎拉地区按牲畜头数征收油脂税，加重了当地民众负担，他联合乡民发动武装请愿运动，抗议行动持续数年，其间曾向旁遮布地方长官申诉，经中央政府长期交涉，一九四六年该项油脂税终获取消。查希尔沙阿其后将哈希姆汗免去首相之职，改由沙阿·马哈茂德汗接任，此事被认为与这场请愿运动的压力不无关联。运动平息后，易卜拉欣汗应政府要求留居喀布尔，以消解哈扎拉地区继续动乱的隐患。一九五零年，他在团结党内与伊斯玛依尔·巴尔希等中央委员一同策划刺杀新任首相沙阿·马哈茂德汗，计划败露后遭逮捕，未经审判即被关押于喀布尔德赫马赞监狱，直至一九六四年获释。出狱后他定居巴格兰省普利胡姆里，此后在政府监视下度过余生。一九八二年，他去世。"
 CBIO_AFG_muhammad_amin_bughra_desc:0 "布格拉一九零一年生于新疆和田，父法里丁哈吉姆是当地知名经学者，早年病故，布格拉自幼由舅父抚养并在经学院受教育，二十二岁即成为通晓经学的学者，获尊称哈孜莱提姆。一九三三年二月，他与萨比特·达莫拉等人在和田发动起义，建立和田酋长国，随后参与成立东突厥斯坦伊斯兰共和国，即第一东突厥斯坦共和国。一九三四年该政权被马仲英部击溃后，他化名阿卜杜拉·叶尔羌辗转逃往瓦罕走廊一带，试图购置军械继续抗争未果，遂退往喀布尔，此后在阿富汗侨居直至一九四二年。侨居期间，他曾于一九三五、一九三六年间会晤日本驻阿富汗公使，提出在日本资助下重建东突厥斯坦的方案；一九四零年他在克什米尔出版《东突厥斯坦史》，同年国民政府代表伊萨·尤素福赴阿富汗与其接洽，邀其赴重庆。一九四二年他因涉嫌为日本及国民政府从事情报活动遭英方拘捕，经国民政府斡旋获释，此后转任国民政府新疆省政府委员及副主席等职。一九四九年新疆易帜前夕，他辗转流亡印度、土耳其。一九六五年，他在土耳其去世。"
 CBIO_AFG_fayzulla_xojayev_desc:0 "霍贾耶夫一八九六年生于布哈拉埃米尔国一个富商家庭，一九零七年被送往莫斯科求学，深感故乡与欧洲社会的巨大落差。一九一二年父亲去世后，他继承家业，一九一六年投身泛突厥主义扎吉德改革运动，出资创立青年布哈拉党。一九一七年俄国革命后，他一度联合塔什干苏维埃企图以武力推翻布哈拉埃米尔，事败后流亡塔什干并被缺席判处死刑。一九二零年九月，苏俄红军攻陷布哈拉、废黜埃米尔，他随即返回并加入俄国共产党，同年出任布哈拉人民苏维埃共和国人民委员会主席，任内一度险遭巴斯马奇武装刺杀。一九二一年一月，他以布哈拉外交人民委员身份，通过阿富汗驻苏使节与阿富汗外交大臣马哈茂德·塔尔齐互致照会，建立布哈拉与阿富汗的邦交，并促成布哈拉向喀布尔派驻使节。一九二四年布哈拉共和国并入乌兹别克苏维埃社会主义共和国后，他转任乌兹别克人民委员会主席，主持土地改革及集体化政策直至一九三七年。一九三七年六月他被撤销全部职务并遭逮捕，一九三八年三月于莫斯科二十一人案公审中被判处死刑，同月十三日遭处决，一九六六年获平反。"
 CBIO_AFG_korsirmat_desc:0 "希尔·穆罕默德-贝克，绰号库尔希尔马特，一八九五年生于费尔干纳加尔巴巴，祖父阿卜杜拉希姆贝克曾任浩罕汗国末代可汗胡达雅尔汗的维齐尔，父亲库沙克拜霍贾任库马雷克乡长，一九一五年朝觐途中病逝于伊斯坦布尔。他早年务农并担任米拉布，负责分配灌溉水源。一九一八年后他投身巴斯马奇运动，成为费尔干纳地区库尔巴什首领之一，一九二零年获阿富汗喀布尔当局暗中支持，转战阿富汗北部一带。一九二一年秋他一度与恩维尔帕夏、朱奈德汗联手夺取布哈拉人民苏维埃共和国大片领土，同年与苏军谈判又拖延不决。一九二二年一月恩维尔帕夏抵达后，他短暂归附统一指挥，但同年九月屡遭重创后经东布哈拉逃往阿富汗，定居昆都士省汗阿巴德。此后他仍不时返回费尔干纳活动，直至一九二三年最终退往阿富汗。一九四一年九月，德国军事情报局阿勃维尔征召他在阿富汗与苏联边境两侧建立乌兹别克、土库曼巴斯马奇残部的谍报与破坏网络，他由此成为战时突厥斯坦同盟首任负责人。一九七零年三月十日，他去世。"
 CBIO_AFG_junaid_khan_desc:0 "朱奈德汗本名穆罕默德·库尔班，约生于一八五七年，出身希瓦汗国境内土库曼约穆特部族，其父霍加拜为部族酋长。他幼时目不识丁，却凭威望先后出任乡村卡孜法官与米拉布，一九一二至一九一六年土库曼人起义期间崭露头角。一九一八年他发动政变推翻希瓦汗伊斯凡迪亚尔并将其处死，扶植其叔赛义德·阿卜杜拉为傀儡可汗，自任塞尔达尔卡里姆尊贵统帅，成为希瓦实际统治者。一九二零年二月红军攻占希瓦，他退入卡拉库姆沙漠组织游击抵抗，此后与新生的花剌子模苏维埃政权及乌兹别克、土库曼苏维埃共和国长期交战，一九二二、一九二四年两度短暂夺回希瓦城又遭击退。一九二七年前后，他辗转经波斯退入阿富汗境内，此后以阿富汗为基地继续策划对苏边境袭扰，一九三三年十月他统率的最后一批武装在卡拉库姆沙漠遭击溃，标志巴斯马奇运动的终结。一九三八年，他在阿富汗去世。"
 CBIO_AFG_nur_muhammad_taraki_desc:0 "塔拉基一九一七年七月生于加兹尼省纳瓦县一个吉尔查伊普什图农民家庭，是家中长子。一九三二年，十五岁的他离家赴英属印度孟买谋生，做工之余就读夜校学习英语。一九四零年代后期他返回阿富汗，供职政府新闻部门，一九五二年获委任驻美使馆随员，因公开批评阿富汗政府专权而被召回国内。此后他先后受雇于美国海外使团及美国驻喀布尔使馆担任译员，一九五八年自设努尔翻译社。一九六五年一月，他在喀布尔自宅召集会议，创立阿富汗人民民主党并当选总书记，同年参选议会选举落败。一九六六年他创办党报《人民报》，旋即遭政府查封。一九六七年该党分裂为塔拉基领导的人民派与卡尔迈勒领导的旗帜派。一九七八年四月，亲信要员米尔·阿克巴尔·希伯尔遇刺身亡，引发四月革命政变，达乌德总统全家遇害，塔拉基就任革命委员会主席兼部长会议主席，集党政大权于一身。任内他强力推行土地改革与扫盲运动，因手段激进引发各地起义。一九七九年九月，他在其亲信哈菲佐拉·阿明的授意下遭软禁并废黜。一九七九年十月九日，他在喀布尔遭闷杀身亡。"
 CBIO_AFG_asadullah_seraj_khan_desc:0 "阿萨杜拉·萨拉杰汗出身阿富汗巴拉克宰王室萨拉杰支系，该支系是一九二九年前统治阿富汗的埃米尔哈比布拉汗一系的后裔，哈比布拉汗尊号萨拉杰·穆莱特·瓦丁，意为教俗之光，其后裔遂以萨拉杰为姓，与查希尔沙阿所属的泰莱支系同属巴拉克宰王室，但为不同分支。阿萨杜拉·萨拉杰汗后官至将军，一九五二年出任阿富汗驻土耳其安卡拉大使。任内他就阿富汗与巴基斯坦关系、普什图尼斯坦问题等外交议题，向美方转达阿富汗政府立场，其观点与阿富汗首相、外交大臣及驻美、驻印大使的表态基本一致。目前公开资料尚未见其更早年代任职记录及具体生卒年份。"
 CBIO_AFG_mohammed_etemadi_khan_desc:0 "埃特马迪一九二一年二月生于坎大哈，早年在喀布尔求学后又负笈海外深造，此后进入阿富汗外交部任职。一九六四至一九六五年，他出任驻巴基斯坦大使，一九六五年转任外交大臣。一九六七年十一月一日，查希尔沙阿任命他为首相，任内维持不结盟外交路线，谋求美苏两方援助，并推行教育、医疗与基础设施建设，但受限于议会缺乏成熟政党体系及经济停滞，一九七一年六月九日他辞去首相与外交大臣职务，转任驻意大利大使。一九七三年达乌德汗政变建立共和国后，他仍留任政府，此后出任驻苏联大使直至一九七六年，其后二度出任驻巴基斯坦大使。一九七八年阿富汗人民民主党政变后，他返回阿富汗，遭新政权逮捕。一九七九年，他与包括前首相穆罕默德·穆萨·沙菲克在内的多名王室及共和国时期官员一同，被人民民主党政权处决。"
 CBIO_AFG_mahmud_khan_desc:0 "沙阿·马哈茂德汗一八九零年生，出身巴拉克宰穆罕默德扎伊部族，是国王穆罕默德·纳迪尔沙阿之弟，哈希姆汗与沙·瓦利汗之兄弟，查希尔沙阿与达乌德汗之叔，娶阿曼努拉汗之妹萨弗拉苏丹为妻。一九四六年五月，他接替兄长哈希姆汗出任阿富汗王国首相。任内他一度放宽政治管制，一九四九年允许相对自由的选举，被称为自由议会时期，新闻管制也有所松动，但至一九五二年选举时政策重新收紧。其首相任期内，巴基斯坦从英属印度独立建国，阿富汗与巴基斯坦的普什图尼斯坦问题开始成为外交焦点。一九五三年九月七日他卸任首相，由侄子达乌德汗接任。一九五九年十二月二十七日去世。"
 CBIO_AFG_haji_faiz_muhammad_zikeria_desc:0 "齐克里亚一八九二年生于喀布尔，出身巴拉克宰王室穆罕默德扎伊家族，就读喀布尔哈比比亚中学。一九二一年他出任外交部参赞，一九二三至一九二四年署理教育大臣，一九二四至一九二七年正式出任教育大臣。一九二九至一九三八年，他出任外交大臣，任内主持阿富汗对外交涉事务。此后他历任驻土耳其大使(一九三八至一九四八年)、驻英国圣詹姆士宫廷大使(一九四九至一九五零年)及驻沙特阿拉伯大使(一九五五至一九六零年)。一九六零年他退休，一九六四年移居美国。他也是知名诗人与作家。一九七九年十一月八日，他在美国去世，遗体运回巴基斯坦白沙瓦安葬。"
 CBIO_AFG_abdur_rahim_khan_desc:0 "阿卜杜勒·拉希姆汗一八八六年生于科希斯坦，十六岁起出任埃米尔哈比布拉汗的卫队长，一九二一年晋升准将。一九二八至一九二九年阿富汗内战期间，他一度加入卡拉卡尼阵营，被派往马扎里沙里夫组织起事。一九三二年九月，纳迪尔沙阿任命他为赫拉特省督，同年他平息了当地一次兵变。一九三四年九月，他出任波斯－阿富汗边界委员会主席。一九三八年他升任第一副首相，一九四零年转任第二副首相，兼任公共工程大臣。一九四六年一月，因涉嫌同情其妹夫哈利卢拉·哈利利参与的一九四四至一九四七年萨菲部族叛乱，他遭逮捕，一九四八年获释。"
 CBIO_AFG_turabaz_khan_desc:0 "图拉巴兹汗一八八五年生于塔加布，出身萨菲部族家庭，就读喀布尔皇家军事学院西拉吉耶。一九零九年起服役阿富汗军队，一九二二年出任阿弗里迪营营长，一九二四至一九三零年任达卡军事长官萨尔哈达尔。一九三一年他出任喀布尔警察司令，一九三七至一九三八年版《喀布尔年鉴》仍记其在任，其间一度晋升准将。一九三九年他转任东部省督，此后晋升少将衔菲尔卡米什尔。一九四二年，他出任内政部保安处处长，直至一九五三年卸任军职。他育有四名子女，其中一子后曾任驻美使馆临时代办，另一子曾任一九七三年共和国首届支尔格大会成员。一九八二年，他在喀布尔去世。"
