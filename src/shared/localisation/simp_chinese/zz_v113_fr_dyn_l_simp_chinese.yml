 CBIO_SOV_grigory_zinovyev_desc:0 "1919至1926年间的共产国际主席。1883年生，老布尔什维克，流亡时期即与列宁关系密切。革命后他长期主持彼得格勒（列宁格勒）的党组织，并于1919年至1926年间担任共产国际主席。列宁逝世后，他先与斯大林、加米涅夫结成”三人集团“打击托洛茨基，随后转而与托洛茨基联合，组成反对斯大林的”联合反对派“。他几经开除与悔过。基洛夫遇刺后他被捕，1936年8月作为第一次莫斯科审判的主要被告，与加米涅夫同案受审，被处决，后于1988年获平反。"
 SOV_grigory_zinovyev_desc:0 "1919至1926年间的共产国际主席。1883年生，老布尔什维克，流亡时期即与列宁关系密切。革命后他长期主持彼得格勒（列宁格勒）的党组织，并于1919年至1926年间担任共产国际主席。列宁逝世后，他先与斯大林、加米涅夫结成”三人集团“打击托洛茨基，随后转而与托洛茨基联合，组成反对斯大林的”联合反对派“。他几经开除与悔过。基洛夫遇刺后他被捕，1936年8月作为第一次莫斯科审判的主要被告，与加米涅夫同案受审，被处决，后于1988年获平反。"
 CBIO_ETH_alemework_beyene_desc:0 "阿莱梅沃勒克·贝耶内是黑狮组织主席，本人为留英兽医。该组织由霍莱塔军校学员与一批留洋知识分子于埃塞俄比亚西部创立，成员包括外交大臣赫鲁伊·沃尔德·赛拉西之子、财政官员伊尔马·德雷萨、医生沃克内·埃希特之子等人，绍阿贵族拉斯阿贝贝·阿拉盖亦与该组织多有往来。组织制定十点纲领，主张政治高于军事、禁止虐待农民与战俘、禁止成员寻求流亡、宁死不降，并于1936年6月策划了对内凯姆特意军机场的袭击。同年12月18日，拉斯伊姆鲁·海尔·塞拉西在戈耶布河畔投降后，黑狮组织基本解体；1937年2月19日意占总督罗多尔福·格拉齐亚尼遇刺未遂后，意军展开大规模报复屠杀，组织多数成员遇难，阿莱梅沃勒克与伊尔马·德雷萨等少数人幸存。"
 ETH_alemework_beyene_desc:0 "$CBIO_ETH_alemework_beyene_desc$"
 alfred_heurtaux_desc:0 "阿尔弗雷德·厄尔托，1893年生于南特，第一次世界大战的法国王牌飞行员。他原属骑兵，1914年底转入航空，1916年加入著名的\"鹳鸟\"中队——那是居伊内梅、丰克等顶尖飞行员所在的精英部队；他于同年11月起担任中队长，一年间即取得21次空战胜利，还击落了德国王牌温特根斯，是法国战斗机飞行员中的佼佼者，两度负伤后退出前线。战后他短暂从政（任塞纳-瓦兹省议员），又转入福特、通用、雷诺等汽车工业。第二次世界大战中，他虽一度被列入维希的\"国民委员会\"，却拒绝与德国合作，转而投身抵抗：他创建了占领区最早的情报网之一\"赫克托\"网（青年沙邦-戴尔马即由他吸收入伙），该网后并入重要抵抗组织\"军民组织\"（OCM）。1941年他被盖世太保逮捕，年底起被囚于德国多座监狱，1945年3月被押入布痕瓦尔德集中营，4月获美军解救。战后他获授\"解放同伴\"称号、晋升空军准将。他于1985年去世。"
 alphonse_georges_desc:0 "阿方斯·乔治，1875年生，法国陆军将领。他在第一次世界大战中历经多场战役、表现出色，战后成为法军高级将领，一度被视为未来总司令的人选。1934年10月，南斯拉夫国王亚历山大一世与法国外长巴尔图在马赛遇刺，乔治随行在场、身负重伤，险些丧命。1930年代后期，他与总司令甘末林在战略与权责上龃龉不断。1940年法国战役中，他出任东北战区司令，统辖法军与英国远征军主力，正面承受德军经阿登地区的突破；法军防线迅速崩溃，他与甘末林同负指挥失败之责。停战后他一度退隐，后赴法属北非靠拢吉罗一系，于1943年与戴高乐同被纳入法兰西民族解放委员会，代表吉罗派势力，但很快在权力斗争中被戴高乐边缘化而退出。于1951年去世。"
 charles_de_gaulle_desc:0 "夏尔·戴高乐，1890年生于里尔，法国军人、政治家，自由法国的缔造者与象征。第一次世界大战中他作战负伤，1916年在凡尔登被德军俘虏，多次越狱未成而被拘押至战争结束。两战之间，他成为机械化战争与装甲集群理论的鼓吹者，著书主张建立职业化的装甲部队，但其主张未被法军高层采纳。1940年法国战役中，他指挥第四装甲师发动过为数不多的反击，被擢升为准将并短暂出任国防部副国务秘书。法国濒临投降之际，他拒绝接受停战，飞赴伦敦，于6月18日通过广播发出\"呼吁\"，号召法国人继续抵抗，宣告法国虽败一役而战争远未结束。此后他领导\"自由法国\"运动，以洛林十字为旗号，逐步集结海外抵抗力量，并在与吉罗的角力中掌握了法兰西民族解放委员会的主导权。1944年他率临时政府返回光复的巴黎。战后他一度执政旋即引退，1958年因阿尔及利亚危机重新出山，创建第五共和国并出任总统，深刻塑造了战后法国的政治格局，1970年去世。"
 charles_huntziger_desc:0 "夏尔·安齐热，1880年生于布列塔尼的莱讷旺，出身因拒绝1871年德国吞并而迁居布列塔尼的阿尔萨斯家庭，法国陆军大将。圣西尔军校毕业后他选择殖民地步兵，一战中在东方战线（马其顿）任盟军参谋要职，参与策划1918年击溃保加利亚的瓦尔达尔攻势。两战之间他历任要职，1924年起一度出任驻天津法租界驻军司令，后又任驻黎凡特法军最高指挥官，并卷入将亚历山大勒塔（哈塔伊）划归土耳其的交涉。1938年他进入最高军事委员会，被视为甘末林的接班热门。1940年5月，他指挥第二集团军，正面遭遇德军在色当的决定性突破，应对失措，事后却把责任推给科拉普将军。战败后，他奉贝当之命主持停战谈判，于6月22日在贡比涅森林代表法国签署对德停战协定，又于6月24日在罗马附近签署对意停战协定。维希政权下他出任陆军总司令兼陆军部长，1940年10月参与签署并执行排犹的《犹太人地位法》，将多名犹太裔将领逐出军队，是国家合作主义初期的核心人物之一。1941年11月，他因飞机失事坠亡于塞文山区。"
 charles_maurras_desc:0 "夏尔·莫拉斯，1868年生于普罗旺斯滨海马蒂格，法国极右思想家、文人与记者，\"法兰西行动\"（Action Française）运动的核心理论家。他鼓吹所谓\"整体民族主义\"，主张恢复君主制、以权威和传统重整法国，激烈反对共和制、议会民主、新教与共济会，并把反犹主义系统地写入学说，将犹太人、新教徒、共济会员与外来移民斥为\"内部的四个敌国\"。他本人并不掌握实权，而是凭《法兰西行动报》的长期笔战和运动组织，塑造两次大战之间法国右翼与保守青年的思潮，影响极为深远；其学说虽以天主教为旗号，却在1926年遭梵蒂冈谴责。1940年法国战败后，他把贝当上台称作\"神圣的意外\"，支持维希政权与对德合作。1945年他因通敌被判处无期徒刑并剥夺公民权，据称在听到判决时高呼\"这是德雷福斯的复仇\"。他于1952年因病获释后不久去世。"
 emile_muselier_desc:0 "埃米尔·缪塞利埃，1882年生，法国海军将领，自由法国海军的创建者。1940年法国战败后，他是最早响应戴高乐、投奔伦敦的法国高级军官之一，受命组建\"自由法国海军\"（FNFL），把流散海外的法国舰船与水兵重新集结到抗战旗帜之下。为使自由法国的军舰、飞机不致与维希、德国的标志相混淆，他提议以\"洛林十字\"作为自由法国的标记——这一符号后来成为整个自由法国运动的象征。1941年底，他率小舰队解放了北美外海的圣皮埃尔和密克隆群岛，使其脱离维希。然而他与戴高乐之间因权力与作风屡生龃龉，最终关系破裂、淡出自由法国的领导核心。他于1965年去世。"
 francois_darlan_desc:0 "弗朗索瓦·达尔朗，1881年生，法国海军上将，海军舰队总司令，维希政权的核心人物之一。1930年代他主持法国海军的扩建，成为海军的实际掌门人。法国战败后，他坚定追随贝当，1941年起出任副总理兼外交、内政、国防等多部部长，并被指定为贝当的接班人，是维希对德合作政策的主要推动者之一，曾与德国谈判《巴黎议定书》。在他主政期间，法国海军基本服从维希、对英国怀有敌意——1940年英国为防止法舰落入德国之手而袭击米尔斯克比尔，更加深了这种对立。1942年11月盟军在北非登陆（火炬行动）时，他恰在阿尔及尔，遂与盟军达成停火协议，命令法属北非的军队转投盟国一方，自己出任当地的高级专员。这一\"达尔朗交易\"令盟国得以迅速控制北非，却因其维希背景而饱受争议。1942年12月24日，他在阿尔及尔被一名法国青年刺杀身亡。"
 georges_bonnet_desc:0 "乔治·博内，1889年生，法国激进社会党政治家，1930年代法国政坛的重要人物，长期出入内阁，历任财政、外交等部部长。他最为人知、也最受争议的，是1938至1939年在达拉第政府中出任外交部长期间，作为对德\"绥靖\"政策的主要推手之一，积极促成1938年的慕尼黑协定，主张以让步换取和平、避免法国卷入战争，对德、对意态度软弱。这一绥靖立场在战后被广泛批评为助长了希特勒的扩张。1939年战争爆发后他被调离外交部。维希时期他立场偏右、一度倾向贝当；战后绥靖与维希的经历使他长期受到非议，但他后来仍重返政坛、当选议员。于1973年去世。"
 henri_giraud_desc:0 "亨利·吉罗，1879年生，法国陆军将领。他毕业于圣西尔，一战中负伤被俘后成功越狱，战后长期在北非殖民地服役，参与镇压摩洛哥里夫起义，以勇武果敢著称。1940年法国战役中，他先指挥第七集团军北上荷兰，5月19日临危受命接掌已经崩溃的第九集团军，却几乎随即被德军俘虏。1942年4月，他凭绳索从德国柯尼希施泰因要塞戏剧性越狱，辗转返回未被占领的法国。同年盟军在北非登陆（火炬行动）前后，他被秘密送往北非；达尔朗遇刺后，他出任法属北非的高级专员与法军总司令，掌握当地殖民地军队与地中海战场的重要力量。1943年起他与戴高乐共同担任法兰西民族解放委员会主席，但在政治手腕上不敌戴高乐，权力被逐步架空，最终退出领导层、解除军职。他是出色的战场指挥官，却不擅政治，沦为盟国在北非扶植法国权威过程中的过渡性人物。于1949年去世。"
 jean_de_laborde_desc:0 "让·德·拉博德，1878年生，法国海军上将，一名坚定的维希派、强硬的反英与反戴高乐者。法国战败后，他出任停泊于土伦的\"公海舰队\"司令，掌握法国海军最精锐的主力舰队。1942年11月，盟军登陆北非、德军随即进占法国南方非占领区，并企图夺取土伦的法国舰队（\"百合花行动\"）。在此关头，德·拉博德下令将舰队自行凿沉，使数十艘主力舰艇沉没于军港，既未落入德国之手，也未投奔盟军或自由法国。这一\"土伦自沉\"成为法国海军在维希与自由法国之间分裂的悲剧性顶点——它捍卫了\"舰队绝不落入德国之手\"的承诺，却也使这支舰队白白损失、未能为对德作战出一分力。战后他作为通敌者受审，一度被判死刑，后获减刑，晚年获释。他于1977年去世。"
 jean_decoux_desc:0 "让·德古，1884年生于波尔多，法国海军上将。1939年他出任远东法国海军总司令，驻节西贡。法国战败后，1940年6月他被维希政权任命为法属印度支那总督，直至1945年。任内他效忠贝当政权，执行维希的各项法令（包括针对戴高乐派、共济会与犹太人的歧视性立法）。面对日本的步步进逼，他在维希指令下被迫让步：1940年9月签约开放海防港、允许日军进驻东京（北圻），1941年又签协议任日军遍驻印度支那——日本借此切断了盟国经印度支那对中国的补给线。作为交换，日方承诺不干涉内政，法国的军队与行政机构得以名义上维持。德古以隐忍周旋，在日军压境下勉力保住了印度支那的法国主权与秩序，并推行抬高越南人地位的\"联邦\"怀柔政策；1941年他还指挥法军在科昌海战中击败暹罗。1945年3月9日，日本发动政变，推翻法国当局、将他逮捕关押。战后他被法国以通敌罪起诉，羁押近三年，1949年获不起诉。于1963年去世。"
 jean_francois_jannekeyn_desc:0 "让-弗朗索瓦·珍妮肯，1892年生于康布雷，法国空军将领、第一次世界大战飞行员。他原属骑兵，一战中转入航空，作为轰炸机飞行员取得5次空战胜利、跻身王牌之列，还曾作为击剑选手参加1924年奥运会。第二次世界大战中，1942年4月他在赖伐尔政府中出任维希的航空国务秘书（空军部长），直至1943年。任内他不得不卷入对德合作的机器，主管法国的航空工业生产——而维希与德国的协议使这些产能大量为德国所用。不过，他对通敌派颇为抵触，曾设法限制通敌思想在空军中蔓延，并拒绝接受德方的军事\"援助\"，称那是\"得不偿失的危险妥协\"。战后他作为维希高官受审、一度被关押于弗雷讷，但因若干抵抗相关事由，于1949年获不起诉。他于1971年去世。"
 jean_marie_abrial_desc:0 "让-玛丽·阿布里亚尔，1879年生，法国海军上将。1940年法国战役中，他作为\"北方海军司令\"坐镇敦刻尔克，负责该地区的海上防御，在英法联军经敦刻尔克从海上大撤退（发电机行动）的过程中组织法方的海上行动，本人坚守到撤退尾声方才登船离去。法国战败后，他倒向维希政权，先后出任阿尔及利亚总督与维希政府海军部长等要职，成为维希海外统治的代表人物之一。战后他作为通敌者受审，被判刑并褫夺公民权，服刑数年后获释。于1962年去世。"
 jean_marie_bergeret_desc:0 "让-玛丽·贝热雷，1895年生于上索恩省格雷，法国空军将领。一战中他在堑壕里从列兵升到中尉，四度负伤、获多次嘉奖，后参加摩洛哥里夫战争并转入航空。法国战败后，1940年9月贝当任命他出任维希的航空国务秘书，直至1942年4月赖伐尔回朝、由珍妮肯接替。任内他与参谋长罗马泰一道，确立了一套以\"对德谈判换生存\"为核心的空军路线，力图在停战条件下保住一支残余空军；但其领导的航空国务秘书处在排犹问题上态度积极，曾主张把1940年的《犹太人地位法》订得更为严苛，难辞其咎。1942年11月盟军登陆北非后，他倒向吉罗一系，出任北非军政高级专员的副手，因此被维希褫夺国籍。战后他被阿尔及尔的法兰西民族解放委员会起诉、一度羁押，1948年获不起诉。于1956年去世。"
 joseph_vuillemin_desc:0 "约瑟夫·维耶曼，1883年生于波尔多，出身寒微，法国空军大将。他在一战中是轰炸／侦察机飞行员，取得7次空战胜利、跻身王牌，并两获荣誉军团勋章；两战之间，他以1933年率机群完成横贯非洲的\"黑色巡航\"壮举而声名大噪，几成传奇。1938年2月，他接替费康出任法国空军总参谋长。然而此时法国空军准备严重不足：缺乏前瞻、工业动员迟缓、飞机生产混乱、使用理论落后。他虽曾上书示警轰炸机力量薄弱，却也对这一困局负有责任；1938年他访德时更被德国空军的实力所震慑。1940年法国战役中，面对德国空军的猛攻，法国空军损失惨重，他屡屡请求英国增派飞机而不得。停战前夕的6月16至17日，他下令大批飞机撤往北非，保存了相当实力。停战后他短暂任空军总监，旋于1940年11月主动退役。与甘末林等人不同，他未被维希送上里永审判台。1942年他名义上加入自由法国，但已年老体衰、无力再战。于1963年去世。"
 leon_blum_desc:0 "莱昂·布鲁姆，1872年生于巴黎一个犹太知识分子家庭，法国社会党领袖、人民阵线政府总理。他早年从事文学批评与法律，后投身工人国际法国支部（SFIO），逐渐成为党内核心人物。1936年人民阵线在大选中获胜，布鲁姆出任总理，推动签订马蒂尼翁协议，确立带薪休假、四十小时工作周、集体合同等社会改革，是第三共和国左翼政治的标志性人物。与此同时，他也面对财政困难、资本外逃、右翼街头运动与欧洲危机的多重压力。西班牙内战爆发后，他在援助西班牙共和国与避免法国卷入战争之间摇摆，最终采取\"不干涉\"政策，长期受到左翼批评。身为犹太人和左翼领袖，他更是右翼与反犹势力攻击的靶子。1940年法国战败后，维希政权把他列为战败替罪羊，在里永审判中反被他以雄辩反击，使审判难以为继；其后他被囚禁并被押往德国集中营系统（布痕瓦尔德等地），险遭不测。战后他获释，曾短暂出任过渡政府总理。他于1950年去世。"
 louis_kahn_desc:0 "路易·卡恩，1895年生于凡尔赛，法国海军工程界的杰出人物，被称为法国首位犹太裔\"海军上将\"（他持有与上将相当的工程将官衔）。他毕业于巴黎综合理工学院，一战中指挥炮兵、两度负伤。此后他成为造船工程专家，曾任西贡兵工厂与印度支那造船主管，主持航空母舰的设计，还发明了以其姓氏命名的地图投影法。1940年法国战败后，依据维希政权1941年的《犹太人地位法》，身为犹太人的他被强制退出一切公职。他不甘屈服，1942年辗转经西班牙逃出法国、投奔自由法国，先后在伦敦与阿尔及尔主管自由法国海军的舰艇建造，是从阿尔及尔重建法国海军的主要工程负责人之一；他研制的反潜与防鱼雷技术更赢得丘吉尔的正式嘉许。战后他历任要职，并成为法国犹太社团的领袖，长期出任法国犹太教中央宗教会议主席。于1967年去世。"
 marcel_bucard_desc:0 "马塞尔·比卡尔，1895年生，法国法西斯活动家。他是一战老兵，作战勇敢、获多枚勋章，战后投身极右政治。1933年，他在意大利法西斯的资助下创建\"法兰西主义\"运动（Le Francisme，又称法兰西党），成员身着蓝衫，公开模仿墨索里尼的意大利法西斯，鼓吹法西斯主义、领袖崇拜与反犹主义，是法国本土较为张扬的极右团体之一，但组织规模始终有限、社会影响不大，且长期依赖外国资金。1930年代法国深陷经济危机与左右对立，这类法西斯团体借机鼓动街头政治、煽动仇恨。法国战败后，比卡尔投靠对德合作，其运动公开倒向纳粹德国，部分成员加入为德国效力的武装组织。战后他作为通敌分子受审，1946年被处决。"
 marcel_gensoul_desc:0 "马塞尔·让苏尔，1880年生，法国海军将领。1940年法国战败之际，他指挥停泊于法属阿尔及利亚米尔斯克比尔军港的法国主力\"突击舰队\"，麾下有\"敦刻尔克\"号、\"斯特拉斯堡\"号等新锐战列舰。停战后，英国担心这支强大舰队落入德、意之手，于1940年7月3日派萨默维尔率舰队前来，向让苏尔发出最后通牒，要求法舰加入英方、或驶往英属、法属西印度港口、或自行凿沉，否则将以武力解决。让苏尔在与英方交涉时未能充分、及时地把对方提出的各项选项上报海军部，谈判破裂；当日傍晚英舰开火炮击米尔斯克比尔，约一千三百名法国水兵阵亡，\"布列塔尼\"号战列舰被击毁。这一事件使法英关系急剧恶化，也加深了维希海军对英国的仇恨。让苏尔此后基本淡出，战后未居要职。他于1973年去世。"
 martial_valin_desc:0 "马夏尔·瓦兰，1898年生于利摩日，法国空军大将，自由法国空军的主要缔造者。他出身骑兵，一战中在堑壕作战、曾遭毒气，后转入航空，并参加过摩洛哥里夫战争。1940年初他被派往巴西里约的法国军事代表团；法国战败后，他于1940年11月致电戴高乐表示效忠，几经辗转于1941年3月抵达英国，并于同年7月接替缪塞利埃、出任自由法国空军（FAFL）司令。他白手起家，把流散各地的法国飞行员重新组织起来，先后创建了\"阿尔萨斯\"\"法兰西岛\"等战斗机大队与\"洛林\"\"布列塔尼\"等轰炸机大队，还推动组建了赴苏作战的\"诺曼底\"战斗机部队。1943年自由法国空军与北非（原维希）空军合并时，他以圆融的作风主动退居副手，化解了两派飞行员之间的隔阂。1944年他随勒克莱尔进入巴黎，11月起出任法国空军总参谋长。他是\"解放同伴\"，战后长期为重建法国空军奔走。他于1980年去世。"
 maurice_gamelin_desc:0 "莫里斯·甘末林，1872年生于巴黎，法国陆军总司令，1940年法国惨败的主要军事责任人之一。他在第一次世界大战中是霞飞的得力参谋，参与策划马恩河战役，战后稳步晋升，1935年起执掌法军最高指挥权。面对纳粹德国的威胁，他主张以静态防御并向比利时前出迎敌的方案应战；1940年5月，德军主力却出人意料地经阿登地区在色当方向突破，法军防线被拦腰斩断。甘末林反应迟缓、调度失措，未能组织有效反击，5月19日即被解职，由魏刚接替。维希政权随后将他逮捕，并在1942年的里永审判中追究其战败责任；与达拉第、布鲁姆当庭反击不同，甘末林在审判中基本保持沉默。其后他被押往德国关押（布痕瓦尔德等地），直至1945年获盟军解放。他于1958年去世。"
 maurice_thorez_desc:0 "莫里斯·多列士，1900年生，矿工出身，法国共产党长期领导人。1930年起他出任法共总书记，忠实追随莫斯科与共产国际路线。1934至1936年间，他推动法共转向\"人民阵线\"策略，联合社会党与激进党共同反对法西斯，使法共在1936年大选中议席大增，成为法国左翼的重要力量，但仍坚持不入阁、只在议会支持人民阵线政府。1939年8月《苏德互不侵犯条约》签订后，法共被法国政府取缔；多列士虽已应征入伍，却于同年响应共产国际指示弃军潜赴苏联，被法国法庭以逃兵罪缺席判处死刑并剥夺国籍，整个战争期间留在莫斯科。1944年底他获戴高乐特赦返国。战后他出任副总理与国务部长，长期主导法国共产主义运动，直至1964年去世。"
 maxime_weygand_desc:0 "马克西姆·魏刚，1867年生于布鲁塞尔，法国陆军将领。第一次世界大战中他长期担任福煦元帅的参谋长，被视为福煦的\"大脑\"，并在1920年波苏战争中赴波兰协助作战。两战之间他出任过法军总参谋长及黎凡特高级专员等要职。1940年5月，年逾古稀的他被召回接替甘末林出任总司令，但此时战局已不可挽回；他判定败局已定，力主对德停战，反对退往北非依托殖民帝国继续抵抗，是促成法国投降的关键人物之一。维希时期他先后任国防部长，及驻法属非洲的政府总代表，在北非整顿防务、抵制德国势力渗透，1941年底在德国施压下被解职。1942年盟军登陆北非后，他被德军逮捕并押往德国关押。战争结束后他在法国被捕受审，案件最终于1948年了结，他获释。于1965年去世。"
 philippe_fequant_desc:0 "菲利普·费康，1883年生于蒙莫朗西，法国航空先驱、飞行将领（与同为航空先驱的阿尔贝·费康是兄弟）。他出身殖民地步兵，曾在东京（北圻）与摩洛哥服役，1911年成为最早的军事飞行员之一。第一次世界大战中，他历任轰炸与战斗机中队、战斗机大队及空中旅指挥，麾下一度包括由美国志愿者组成的\"拉法耶特\"中队，作战有功。两战之间他稳步晋升，1935年任驻阿尔及尔的第五航空区司令。1936年人民阵线时期，他出任刚刚独立成军的法国空军总参谋长，兼任领土防空总监。1937年底，他迟来地意识到国际局势的危急，提出一项空军现代化计划，却遭贝当等人阻挠。其后他健康恶化、卸去参谋长之职，由维耶曼于1938年2月接任。他于1938年12月底病逝，年仅五十五岁，留给继任者的是一支准备远不充分的空军。"
 philippe_leclerc_desc:0 "菲利普·勒克莱尔，本名菲利普·德·奥特克洛克，1902年生，法国陆军将领，自由法国的传奇人物，\"勒克莱尔\"是他投身抵抗时所用的化名。1940年法国战败后，他拒绝投降，毅然投奔伦敦的戴高乐。他受命前往法属赤道非洲，从乍得出发组织作战，1941年率部远征、攻占意大利据守的库夫拉绿洲，并立下著名的\"库夫拉誓言\"——不获全胜、法国国旗不重新升上斯特拉斯堡大教堂，绝不停止战斗。其后他指挥第二装甲师（2e DB）在诺曼底登陆后挥师内陆，于1944年8月解放巴黎，并在年底攻入斯特拉斯堡，兑现了库夫拉的誓言。1945年9月，他作为法国代表出席在东京湾举行的日本投降仪式，在受降文件上签字。他被视为自由法国军事荣誉的化身，惜于1947年因飞机失事在阿尔及利亚殉职，1952年被追授法国元帅。"
 rene_emile_godfroy_desc:0 "勒内-埃米尔·戈德弗鲁瓦，1885年生，法国海军将领。法国战败时，他指挥停泊于埃及亚历山大港的\"X舰队\"——一支由战列舰、巡洋舰等组成的法国分舰队，正处于英国地中海舰队的监视之下。1940年7月英军袭击米尔斯克比尔、法英反目之后，他没有像奥兰那样兵戎相见，而是与英国海军上将坎宁安达成协议：法舰解除武装、停泊不动，既不自沉，也不被英方夺取。此后两年多，戈德弗鲁瓦的舰队在亚历山大港长期被封存、按兵不动，他本人则在维希与自由法国之间长期观望。直到1943年北非战局明朗、维希在海外的权威瓦解之后，他才率舰队转投盟军一方，重新投入对轴心国的作战。于1981年去世。"
 rene_massigli_desc:0 "勒内·马西利，1888年生，法国资深外交官。两战之间他长期供职于外交部，是反对绥靖、主张对纳粹德国强硬的代表人物之一，对1938年的慕尼黑协定持批评态度。1938至1940年间他出任驻土耳其大使。法国战败后，他被维希政权免职、靠边站，遂转向抵抗。1943年他前往阿尔及尔，加入法兰西民族解放委员会，出任外交事务委员（即自由法国的\"外交部长\"），主持自由法国的对外交涉。1944年法国光复后，他出任驻英国大使，在伦敦任职长达十余年，致力于战后法英关系与西欧合作，后又出任外交部秘书长。他是20世纪法国外交界的重要人物，其生涯横跨绥靖年代的危机、自由法国的外交奠基与战后欧洲的重建。于1988年以百岁高龄去世。"
 rene_prioux_desc:0 "勒内·普里乌，1879年生，法国陆军将领，骑兵与机械化部队专家。1940年法国战役中，他指挥由两个轻机械化师（DLM）组成的骑兵军，奉命前出比利时、掩护法军主力向迪尔河一线展开。5月中旬，他的机械化部队在阿努（Hannut）—让布卢一带与德军装甲部队展开了当时规模空前的坦克会战，成功迟滞德军、为友军布防争取了时间，是1940年法军装甲兵少有的硬仗。此后随着北线战局崩坏，他接替布朗夏尔出任第一集团军司令，在里尔一带的口袋中继续指挥残部苦战，最终于五月底被德军俘虏，沦为战俘。他于1953年去世。其指挥的阿努坦克战，至今仍是研究1940年法德装甲较量的重要战例。"
 robert_odic_desc:0 "罗伯特·欧迪克，1887年生于诺曼底的讷沙泰勒昂布雷，出身洛林家庭，法国空军将领（四星空军大将）。他自圣西尔军校毕业后选择殖民地步兵，一战中先指挥塞内加尔步兵营，后转入航空。两战之间他长期在摩洛哥等地服役；1939年战争爆发后受维耶曼之命督察侦察航空，继而出任南方空中作战区司令。法国战败后，他于1940年9月短暂出任维希空军参谋长，旋调任驻北非空军最高指挥，隶属魏刚麾下。他很快看清维希政权的实质，与航空国务秘书贝热雷龃龉不断，遂于1941年8月辞职、远走伦敦投奔自由法国。然而他与戴高乐话不投机，指责戴高乐\"与其说在打德国，不如说在打维希\"，遂转投吉罗一系，赴华盛顿充当吉罗派与罗斯福顾问、海军上将莱希之间的非正式使者，并在美国当局面前竭力贬损戴高乐。解放之际他一度被列入清算名单，迟至1946年11月才返回法国。于1958年在巴黎去世。"
 victor_denain_desc:0 "维克托·德南，1880年生于朗德省的达克斯，法国空军大将、飞行员与政治家。他自圣西尔军校毕业后入骑兵，一战中负伤转入航空，1916至1918年间指挥东方战线（马其顿）盟军的航空部队。战后他在黎凡特服役，成为魏刚的门生，又在魏刚安排下出任驻波兰法国军事代表团团长（1924—1931）。1933年起，他在空军部长皮埃尔·科特之下出任空军总参谋长；1934年2月接任空军部长，直至1936年1月，历经多届政府而任期之长创下纪录。他被视为法国独立空军的主要缔造者之一：推动\"第一号计划\"扩充机群、创办萨隆的空军学校，并以亲驾飞机出访等举动名噪一时。然而他在任内推行的扩军计划，后来被认为远不足以应对德国空军的迅速崛起。此后他历任阿尔及尔第五航空区司令、海外航空总监，转入预备役。1939年战争爆发，他被召回担任国防部特别顾问，并受命组织、训练在法波兰武装力量。法国战败后他退隐，1952年在尼斯去世。"
