 CBIO_ITA_vittorio_emanuele_iii_desc:0 "1869年生于那不勒斯，翁贝托一世与玛格丽特王后的独子，意大利国王，因身高仅约1.53米而被戏称为“小军刀”（Sciaboletta），又因率国历经两次世界大战而得名“士兵国王”。1900年其父翁贝托一世遭无政府主义者刺杀身亡后他即位，在位近四十六年，其统治几乎与意大利法西斯主义的兴起、鼎盛与覆灭完全重合。即位初期国政长期由焦利蒂主导，推行工业化与男性普选等改革，意大利亦在利比亚扩张殖民地。第一次世界大战中意大利由中立转而于1915年加入协约国，他多次亲赴前线视察，“士兵国王”之名由此而来；战胜虽收回特伦托与的里雅斯特，却也埋下“残缺的胜利”之怨。1922年10月墨索里尼发动“进军罗马”，首相法克塔已拟好戒严令、巴多里奥也向他保证军队足以轻易击溃不过万人的黑衫党，他却在犹豫之后拒绝签署戒严令，事后辩称是惧怕内战才按兵不动，转而致电墨索里尼请其来罗马，并于10月30日任命其为首相——亲手把政权交到了法西斯手中。此后二十年间，他基本沦为顺从的象征性君主：接受由侵略战争得来的“埃塞俄比亚皇帝”（1936）与“阿尔巴尼亚国王”（1939）头衔，签署了1938年的种族法，对法西斯政权的所作所为始终不置一词。1943年7月，盟军登陆西西里、法西斯大委员会倒戈之后，他终于解除并逮捕墨索里尼、改由巴多里奥元帅组阁；9月与盟国签订停战协定后，他与政府仓皇弃守罗马、南逃布林迪西，将群龙无首的军队抛在身后，此举至今备受谴责，其后对德宣战。因其与法西斯政权牵连过深、声望尽失，1944年他将大部分王权移交王储翁贝托，罗马光复后立其为“王国总督”。1946年5月9日，他为挽救摇摇欲坠的君主制而正式退位、传位翁贝托二世，但为时已晚；同年6月公投以约五成四的多数废除君主制，萨伏依王室男性成员被永久逐出意大利。他流亡埃及亚历山大，1947年12月病逝于当地，2017年遗骸方迁回意大利。私下里他是史上最痴迷的钱币收藏家之一，藏品约十万枚，并以三十余年之功编纂二十卷《意大利钱币集成》；其女玛法尔达则于1944年死于布痕瓦尔德纳粹集中营。"
