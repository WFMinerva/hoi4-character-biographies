 CBIO_ITA_dino_grandi_desc:0 "1895年6月4日生于博洛尼亚省莫尔达诺，法西斯运动元老，博洛尼亚的\"拉斯\"（ras），其名字因1943年7月那份改变意大利命运的动议而永久载入史册。早年以博洛尼亚法西斯行动队头目身份建立权威，进军罗马后进入核心权力层。与法里纳奇的粗暴街头风格不同，他展现出明显的外交才能与制度化政治取向，墨索里尼此后逐步将他引向外交领域。1929至1932年出任外交部长，随后以驻英大使身份在伦敦驻留长达七年（1932—1939年）。这段经历深刻改变了他的战略视野：他在伦敦形成了对英意协调的持续偏好，对纳粹德国扩张主义日益警惕，与意大利内部的亲德路线形成了潜在张力。1939年起出任法西斯宫及宪兵院议长，兼握司法与立法机构名义要职。1943年7月，随北非失陷、西西里遭盟军登陆，他秘密筹划以法制手段终结墨索里尼的一人独大。7月24日深夜法西斯大委员会召开历史性表决，他提交\"格兰迪动议\"（Ordine del Giorno Grandi），要求将军事最高指挥权归还国王；动议以19票对7票通过，次日墨索里尼在觐见国王时遭逮捕，法西斯政权二十年大厦倾覆于一夜。停战后他迅速出逃，辗转抵达葡萄牙，在维罗纳审判中以缺席方式被判处死刑。此后数十年流亡海外，以写作与外交史研究度日，身后留有大量回忆录与档案文献，是研究法西斯时期意大利外交不可忽视的第一手史料。晚年获准回国。1988年5月21日辞世，享年九十二岁。"
 ITA_dino_grandi_desc:0 "1895年6月4日生于博洛尼亚省莫尔达诺，法西斯运动元老，博洛尼亚的\"拉斯\"（ras），其名字因1943年7月那份改变意大利命运的动议而永久载入史册。早年以博洛尼亚法西斯行动队头目身份建立权威，进军罗马后进入核心权力层。与法里纳奇的粗暴街头风格不同，他展现出明显的外交才能与制度化政治取向，墨索里尼此后逐步将他引向外交领域。1929至1932年出任外交部长，随后以驻英大使身份在伦敦驻留长达七年（1932—1939年）。这段经历深刻改变了他的战略视野：他在伦敦形成了对英意协调的持续偏好，对纳粹德国扩张主义日益警惕，与意大利内部的亲德路线形成了潜在张力。1939年起出任法西斯宫及宪兵院议长，兼握司法与立法机构名义要职。1943年7月，随北非失陷、西西里遭盟军登陆，他秘密筹划以法制手段终结墨索里尼的一人独大。7月24日深夜法西斯大委员会召开历史性表决，他提交\"格兰迪动议\"（Ordine del Giorno Grandi），要求将军事最高指挥权归还国王；动议以19票对7票通过，次日墨索里尼在觐见国王时遭逮捕，法西斯政权二十年大厦倾覆于一夜。停战后他迅速出逃，辗转抵达葡萄牙，在维罗纳审判中以缺席方式被判处死刑。此后数十年流亡海外，以写作与外交史研究度日，身后留有大量回忆录与档案文献，是研究法西斯时期意大利外交不可忽视的第一手史料。晚年获准回国。1988年5月21日辞世，享年九十二岁。"
 CBIO_ITA_antonio_gramsci_desc:0 "1891年1月22日生于撒丁岛阿莱斯，家境贫寒，幼年脊椎畸形使其终身体质孱弱，而思想的力量恰与肉体的局限形成最鲜明的对照。他以奖学金进入都灵大学修读语言学，随即被卷入都灵工业无产阶级的社会现实。1919年与托格利亚蒂等人创办《新秩序》（L'Ordine Nuovo）周刊，以工厂委员会理论支持\"两年红色\"（1919—1920年）的工厂占领运动；运动失败后，他参与了1921年1月里窝那代表大会，与博尔迪加、托格利亚蒂共同缔造意大利共产党。此后赴莫斯科出席共产国际，并在那里与尤利亚·舒赫特相识结婚。1924年当选众议员，以国会豁免权为掩护继续领导意共地下工作。1926年11月，墨索里尼无视其议员豁免权将其逮捕，检察官在随后的审判中留下那句著名的控诉词：\"二十年内，我们必须让这个大脑停止运转。\"他被判处二十年四个月五天监禁，此后在狱中断续写下约三十三本《狱中札记》（Quaderni del Carcere）。在严密的书信检查下，他系统发展出\"文化霸权\"（egemonia）理论：统治阶级不仅借助暴力维持权力，更通过文化、道德与知识的领导权建构被统治者对现有秩序的主动同意，而革命的前提是首先夺取这一文化领导权。他关于有机知识分子、阵地战与运动战的区分、南方问题的论述，构成了二十世纪西方马克思主义最具生产性的理论遗产之一。长期羁押系统性摧毁了他的健康。1937年4月27日，他在一家罗马诊所辞世，享年四十六岁。《狱中札记》由姻亲塔蒂亚娜·舒赫特秘密保存，战后由托格利亚蒂主持出版，成为20世纪最有影响力的政治哲学文献之一。"
