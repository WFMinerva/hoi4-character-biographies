 CBIO_FRA_charles_maurras_desc:0 "夏尔·莫拉斯，1868年生于普罗旺斯滨海马蒂格，法国极右思想家、文人与记者，\"法兰西行动\"（Action Française）运动的核心理论家。他鼓吹所谓\"整体民族主义\"，主张恢复君主制、以权威和传统重整法国，激烈反对共和制、议会民主、新教与共济会，并把反犹主义系统地写入学说，将犹太人、新教徒、共济会员与外来移民斥为\"内部的四个敌国\"。他本人并不掌握实权，而是凭《法兰西行动报》的长期笔战和运动组织，塑造两次大战之间法国右翼与保守青年的思潮，影响极为深远；其学说虽以天主教为旗号，却在1926年遭梵蒂冈谴责。1940年法国战败后，他把贝当上台称作\"神圣的意外\"，支持维希政权与对德合作。1945年他因通敌被判处无期徒刑并剥夺公民权，据称在听到判决时高呼\"这是德雷福斯的复仇\"。他于1952年因病获释后不久去世。"
 FRA_charles_maurras_desc:0 "夏尔·莫拉斯，1868年生于普罗旺斯滨海马蒂格，法国极右思想家、文人与记者，\"法兰西行动\"（Action Française）运动的核心理论家。他鼓吹所谓\"整体民族主义\"，主张恢复君主制、以权威和传统重整法国，激烈反对共和制、议会民主、新教与共济会，并把反犹主义系统地写入学说，将犹太人、新教徒、共济会员与外来移民斥为\"内部的四个敌国\"。他本人并不掌握实权，而是凭《法兰西行动报》的长期笔战和运动组织，塑造两次大战之间法国右翼与保守青年的思潮，影响极为深远；其学说虽以天主教为旗号，却在1926年遭梵蒂冈谴责。1940年法国战败后，他把贝当上台称作\"神圣的意外\"，支持维希政权与对德合作。1945年他因通敌被判处无期徒刑并剥夺公民权，据称在听到判决时高呼\"这是德雷福斯的复仇\"。他于1952年因病获释后不久去世。"
 CBIO_FRA_marcel_bucard_desc:0 "马塞尔·比卡尔，1895年生，法国法西斯活动家。他是一战老兵，作战勇敢、获多枚勋章，战后投身极右政治。1933年，他在意大利法西斯的资助下创建\"法兰西主义\"运动（Le Francisme，又称法兰西党），成员身着蓝衫，公开模仿墨索里尼的意大利法西斯，鼓吹法西斯主义、领袖崇拜与反犹主义，是法国本土较为张扬的极右团体之一，但组织规模始终有限、社会影响不大，且长期依赖外国资金。1930年代法国深陷经济危机与左右对立，这类法西斯团体借机鼓动街头政治、煽动仇恨。法国战败后，比卡尔投靠对德合作，其运动公开倒向纳粹德国，部分成员加入为德国效力的武装组织。战后他作为通敌分子受审，1946年被处决。"
 FRA_marcel_bucard_desc:0 "马塞尔·比卡尔，1895年生，法国法西斯活动家。他是一战老兵，作战勇敢、获多枚勋章，战后投身极右政治。1933年，他在意大利法西斯的资助下创建\"法兰西主义\"运动（Le Francisme，又称法兰西党），成员身着蓝衫，公开模仿墨索里尼的意大利法西斯，鼓吹法西斯主义、领袖崇拜与反犹主义，是法国本土较为张扬的极右团体之一，但组织规模始终有限、社会影响不大，且长期依赖外国资金。1930年代法国深陷经济危机与左右对立，这类法西斯团体借机鼓动街头政治、煽动仇恨。法国战败后，比卡尔投靠对德合作，其运动公开倒向纳粹德国，部分成员加入为德国效力的武装组织。战后他作为通敌分子受审，1946年被处决。"
 CBIO_FRA_maurice_thorez_desc:0 "莫里斯·多列士，1900年生，矿工出身，法国共产党长期领导人。1930年起他出任法共总书记，忠实追随莫斯科与共产国际路线。1934至1936年间，他推动法共转向\"人民阵线\"策略，联合社会党与激进党共同反对法西斯，使法共在1936年大选中议席大增，成为法国左翼的重要力量，但仍坚持不入阁、只在议会支持人民阵线政府。1939年8月《苏德互不侵犯条约》签订后，法共被法国政府取缔；多列士虽已应征入伍，却于同年响应共产国际指示弃军潜赴苏联，被法国法庭以逃兵罪缺席判处死刑并剥夺国籍，整个战争期间留在莫斯科。1944年底他获戴高乐特赦返国。战后他出任副总理与国务部长，长期主导法国共产主义运动，直至1964年去世。"
 FRA_maurice_thorez_desc:0 "莫里斯·多列士，1900年生，矿工出身，法国共产党长期领导人。1930年起他出任法共总书记，忠实追随莫斯科与共产国际路线。1934至1936年间，他推动法共转向\"人民阵线\"策略，联合社会党与激进党共同反对法西斯，使法共在1936年大选中议席大增，成为法国左翼的重要力量，但仍坚持不入阁、只在议会支持人民阵线政府。1939年8月《苏德互不侵犯条约》签订后，法共被法国政府取缔；多列士虽已应征入伍，却于同年响应共产国际指示弃军潜赴苏联，被法国法庭以逃兵罪缺席判处死刑并剥夺国籍，整个战争期间留在莫斯科。1944年底他获戴高乐特赦返国。战后他出任副总理与国务部长，长期主导法国共产主义运动，直至1964年去世。"
 CBIO_FRA_denis_guillaumat_desc:0 "阿道夫·吉约马，1863年生于滨海夏朗德的布尔讷夫，一战时期的法国陆军上将。他出身军官家庭，1884年以全班首席毕业于圣西尔军校，早年辗转殖民地，曾在北圻服役，1900年义和团运动期间随军远征中国、参与向天津的进军并负伤，赴广岛休养。归国后他在圣西尔讲授军事史，历任步兵总监、陆军部长办公室主任。第一次世界大战中，他先后统率第33步兵师、第一军与第二军，在凡尔登一线力阻德军；1917年12月接替萨拉伊出任东方盟军（萨洛尼卡战线）总司令，整顿多国部队、重振士气，为1918年9月迫使保加利亚停战的攻势奠定方略，被誉为这场胜利的真正缔造者。1918年5月贵妇小径失守、德军逼近巴黎之际，他被好友克列孟梭召回出任巴黎军事总督，旋又率第五军鏖战至停战。战后他任驻莱茵兰占领军总司令、最高军事委员会委员，1926年短暂出任陆军部长，此后屡屡警示德国重整军备之危。1940年5月他在南特去世，身后归葬荣军院；其子皮埃尔·吉约马后为戴高乐的军队部长、埃尔夫石油公司创建者。"
 FRA_denis_guillaumat_desc:0 "阿道夫·吉约马，1863年生于滨海夏朗德的布尔讷夫，一战时期的法国陆军上将。他出身军官家庭，1884年以全班首席毕业于圣西尔军校，早年辗转殖民地，曾在北圻服役，1900年义和团运动期间随军远征中国、参与向天津的进军并负伤，赴广岛休养。归国后他在圣西尔讲授军事史，历任步兵总监、陆军部长办公室主任。第一次世界大战中，他先后统率第33步兵师、第一军与第二军，在凡尔登一线力阻德军；1917年12月接替萨拉伊出任东方盟军（萨洛尼卡战线）总司令，整顿多国部队、重振士气，为1918年9月迫使保加利亚停战的攻势奠定方略，被誉为这场胜利的真正缔造者。1918年5月贵妇小径失守、德军逼近巴黎之际，他被好友克列孟梭召回出任巴黎军事总督，旋又率第五军鏖战至停战。战后他任驻莱茵兰占领军总司令、最高军事委员会委员，1926年短暂出任陆军部长，此后屡屡警示德国重整军备之危。1940年5月他在南特去世，身后归葬荣军院；其子皮埃尔·吉约马后为戴高乐的军队部长、埃尔夫石油公司创建者。"
 CBIO_FRA_rene_nicod_desc:0 "勒内·尼科德，1881年生于汝拉省圣克洛德，会计出身，法国左翼政治家，安省奥约纳市的长期市长。他早年投身社会主义与合作社运动，1912年起任工人国际法国支部（SFIO）安省书记，是坚定的反军国主义者；一战中他虽应征入伍，却在凡尔登身负重伤、左手致残，获战争十字勋章与军功章。1919年他当选奥约纳市长并出任众议员，1920年图尔大会上成为法国共产党创始成员之一。1936年他作为人民阵线候选人重返议会。1939年《苏德互不侵犯条约》签订后，他公开张贴海报谴责该条约，愤而退出法共，另组\"法兰西人民联盟\"，但仍反对当局对共产党人的镇压。1940年7月，他是投票反对授予贝当全权的\"八十人\"之一，随后被维希撤去市长职务并长期监禁，辗转多处拘押营。1944年获解放后他参加抵抗运动；战后因法共拒绝接纳，他重回社会党，并连任奥约纳市长直至1950年去世。"
 FRA_rene_nicod_desc:0 "勒内·尼科德，1881年生于汝拉省圣克洛德，会计出身，法国左翼政治家，安省奥约纳市的长期市长。他早年投身社会主义与合作社运动，1912年起任工人国际法国支部（SFIO）安省书记，是坚定的反军国主义者；一战中他虽应征入伍，却在凡尔登身负重伤、左手致残，获战争十字勋章与军功章。1919年他当选奥约纳市长并出任众议员，1920年图尔大会上成为法国共产党创始成员之一。1936年他作为人民阵线候选人重返议会。1939年《苏德互不侵犯条约》签订后，他公开张贴海报谴责该条约，愤而退出法共，另组\"法兰西人民联盟\"，但仍反对当局对共产党人的镇压。1940年7月，他是投票反对授予贝当全权的\"八十人\"之一，随后被维希撤去市长职务并长期监禁，辗转多处拘押营。1944年获解放后他参加抵抗运动；战后因法共拒绝接纳，他重回社会党，并连任奥约纳市长直至1950年去世。"
 CBIO_FRA_edouard_daladier_desc:0 "爱德华·达拉第，1884年6月18日生于沃克吕兹省卡庞特拉，1970年卒于巴黎，法国激进社会党政治家，人称\"沃克吕兹的公牛\"，曾三度出任总理。他出身平民、政治手腕务实，是两战之间激进党的核心人物。1938年9月，他作为法国代表在慕尼黑会议上签署协议，将捷克斯洛伐克的苏台德地区让予希特勒。据传他返回巴黎时本以为会遭民众唾骂，迎接他的却是欢呼的人群，他低声说了一句\"这些蠢货\"。1939年9月，他领导法国对德宣战；翌年3月在\"奇怪战争\"的批评声中辞职。法国战败后，维希政权以\"对战败负有责任\"将他与布鲁姆等人送上里永审判台，他们却在法庭上反守为攻，使审判沦为对维希政权的难堪，当局被迫于1942年中止庭审。此后他被囚禁并押往德国（布痕瓦尔德等地），1945年获盟军解放，战后重返政坛，长期担任议员，是第三、第四共和国激进派的代表人物之一。"
 FRA_edouard_daladier_desc:0 "爱德华·达拉第，1884年6月18日生于沃克吕兹省卡庞特拉，1970年卒于巴黎，法国激进社会党政治家，人称\"沃克吕兹的公牛\"，曾三度出任总理。他出身平民、政治手腕务实，是两战之间激进党的核心人物。1938年9月，他作为法国代表在慕尼黑会议上签署协议，将捷克斯洛伐克的苏台德地区让予希特勒。据传他返回巴黎时本以为会遭民众唾骂，迎接他的却是欢呼的人群，他低声说了一句\"这些蠢货\"。1939年9月，他领导法国对德宣战；翌年3月在\"奇怪战争\"的批评声中辞职。法国战败后，维希政权以\"对战败负有责任\"将他与布鲁姆等人送上里永审判台，他们却在法庭上反守为攻，使审判沦为对维希政权的难堪，当局被迫于1942年中止庭审。此后他被囚禁并押往德国（布痕瓦尔德等地），1945年获盟军解放，战后重返政坛，长期担任议员，是第三、第四共和国激进派的代表人物之一。"
 FRA_pierre_laval_desc:0 "皮埃尔·赖伐尔，1883年生于多姆山省的沙泰勒东，法国政治人物。他早年以社会党律师起家，后逐渐右转成为无党派的独立政客，曾多次出任总理与外交部长，以善于妥协、长于权谋而备受争议。1930年代他主政期间推行现实主义外交，1935年与英国外相合谋的\"霍尔—赖伐尔协定\"试图向意大利出让埃塞俄比亚部分领土，激起公愤而流产。法国战败后，他成为维希政权对德合作路线的主要设计者与推动者，先后任贝当政府的副总理与政府首脑。他主张法国主动倒向纳粹德国：1942年6月，他公开宣称\"我希望德国取得胜利\"，组织\"强制劳动役\"（STO）为德国输送劳工，并在迫害与遣送犹太人等问题上负有重大责任。1944年盟军反攻时他外逃，后被捕受审，自杀未遂，于1945年被枪决。"
 CBIO_FRA_alphonse_georges_desc:0 "阿方斯·乔治，1875年生，法国陆军将领。他在第一次世界大战中历经多场战役、表现出色，战后成为法军高级将领，一度被视为未来总司令的人选。1934年10月，南斯拉夫国王亚历山大一世与法国外长巴尔图在马赛遇刺，乔治随行在场、身负重伤，险些丧命。1930年代后期，他与总司令甘末林在战略与权责上龃龉不断。1940年法国战役中，他出任东北战区司令，统辖法军与英国远征军主力，正面承受德军经阿登地区的突破；法军防线迅速崩溃，他与甘末林同负指挥失败之责。停战后他一度退隐，后赴法属北非靠拢吉罗一系，于1943年与戴高乐同被纳入法兰西民族解放委员会，代表吉罗派势力，但很快在权力斗争中被戴高乐边缘化而退出。于1951年去世。"
 FRA_alphonse_georges_desc:0 "阿方斯·乔治，1875年生，法国陆军将领。他在第一次世界大战中历经多场战役、表现出色，战后成为法军高级将领，一度被视为未来总司令的人选。1934年10月，南斯拉夫国王亚历山大一世与法国外长巴尔图在马赛遇刺，乔治随行在场、身负重伤，险些丧命。1930年代后期，他与总司令甘末林在战略与权责上龃龉不断。1940年法国战役中，他出任东北战区司令，统辖法军与英国远征军主力，正面承受德军经阿登地区的突破；法军防线迅速崩溃，他与甘末林同负指挥失败之责。停战后他一度退隐，后赴法属北非靠拢吉罗一系，于1943年与戴高乐同被纳入法兰西民族解放委员会，代表吉罗派势力，但很快在权力斗争中被戴高乐边缘化而退出。于1951年去世。"
 CBIO_FRA_maurice_gamelin_desc:0 "莫里斯·甘末林，1872年生于巴黎，法国陆军总司令，1940年法国惨败的主要军事责任人之一。他在第一次世界大战中是霞飞的得力参谋，参与策划马恩河战役，战后稳步晋升，1935年起执掌法军最高指挥权。面对纳粹德国的威胁，他主张以静态防御并向比利时前出迎敌的方案应战；1940年5月，德军主力却出人意料地经阿登地区在色当方向突破，法军防线被拦腰斩断。甘末林反应迟缓、调度失措，未能组织有效反击，5月19日即被解职，由魏刚接替。维希政权随后将他逮捕，并在1942年的里永审判中追究其战败责任；与达拉第、布鲁姆当庭反击不同，甘末林在审判中基本保持沉默。其后他被押往德国关押（布痕瓦尔德等地），直至1945年获盟军解放。他于1958年去世。"
 FRA_maurice_gamelin_desc:0 "莫里斯·甘末林，1872年生于巴黎，法国陆军总司令，1940年法国惨败的主要军事责任人之一。他在第一次世界大战中是霞飞的得力参谋，参与策划马恩河战役，战后稳步晋升，1935年起执掌法军最高指挥权。面对纳粹德国的威胁，他主张以静态防御并向比利时前出迎敌的方案应战；1940年5月，德军主力却出人意料地经阿登地区在色当方向突破，法军防线被拦腰斩断。甘末林反应迟缓、调度失措，未能组织有效反击，5月19日即被解职，由魏刚接替。维希政权随后将他逮捕，并在1942年的里永审判中追究其战败责任；与达拉第、布鲁姆当庭反击不同，甘末林在审判中基本保持沉默。其后他被押往德国关押（布痕瓦尔德等地），直至1945年获盟军解放。他于1958年去世。"
 CBIO_FRA_maxime_weygand_desc:0 "马克西姆·魏刚，1867年生于布鲁塞尔，法国陆军将领。第一次世界大战中他长期担任福煦元帅的参谋长，被视为福煦的\"大脑\"，并在1920年波苏战争中赴波兰协助作战。两战之间他出任过法军总参谋长及黎凡特高级专员等要职。1940年5月，年逾古稀的他被召回接替甘末林出任总司令，但此时战局已不可挽回；他判定败局已定，力主对德停战，反对退往北非依托殖民帝国继续抵抗，是促成法国投降的关键人物之一。维希时期他先后任国防部长，及驻法属非洲的政府总代表，在北非整顿防务、抵制德国势力渗透，1941年底在德国施压下被解职。1942年盟军登陆北非后，他被德军逮捕并押往德国关押。战争结束后他在法国被捕受审，案件最终于1948年了结，他获释。于1965年去世。"
 FRA_maxime_weygand_desc:0 "马克西姆·魏刚，1867年生于布鲁塞尔，法国陆军将领。第一次世界大战中他长期担任福煦元帅的参谋长，被视为福煦的\"大脑\"，并在1920年波苏战争中赴波兰协助作战。两战之间他出任过法军总参谋长及黎凡特高级专员等要职。1940年5月，年逾古稀的他被召回接替甘末林出任总司令，但此时战局已不可挽回；他判定败局已定，力主对德停战，反对退往北非依托殖民帝国继续抵抗，是促成法国投降的关键人物之一。维希时期他先后任国防部长，及驻法属非洲的政府总代表，在北非整顿防务、抵制德国势力渗透，1941年底在德国施压下被解职。1942年盟军登陆北非后，他被德军逮捕并押往德国关押。战争结束后他在法国被捕受审，案件最终于1948年了结，他获释。于1965年去世。"
 CBIO_FRA_antoinemariebenoit_besson_desc:0 "安托瓦内-玛丽-贝诺瓦·贝松，1876年生于罗讷省波梅，法国陆军大将（général d'armée）。他在第一次世界大战中指挥第四祖阿夫团，作战屡获嘉奖；两战之间历任旅、师、军长及巴黎军区司令，1937年晋升陆军大将，并进入最高军事委员会。1939年9月战争爆发时他指挥驻阿尔卑斯的第六集团军，同年10月改任第三集团军群司令，负责守卫从科尔马到瑞士边境一线的马其诺防线南段。1940年5月德军在默兹河突破后，他的集团军群被调往索姆河与埃纳河，在所谓\"魏刚防线\"上组织防御，随后边打边退向法国中部。6月17日，停战消息被提前传出后，他向仍在卢瓦尔河与谢尔河一线作战的部队下令：\"既无停战，也无休战，战斗仍在继续。\"但败局已无可挽回，6月25日前后他与司令部投降，此时德军装甲部队已抵达瑞士边境、将马其诺防线拦腰截断。停战后他未投奔自由法国，而是留在本土，先后任军区督察与维希政权的战俘总署署长，1942年由贝当亲授荣誉军团大十字勋章。他于1969年在巴黎去世。"
 FRA_antoinemariebenoit_besson_desc:0 "安托瓦内-玛丽-贝诺瓦·贝松，1876年生于罗讷省波梅，法国陆军大将（général d'armée）。他在第一次世界大战中指挥第四祖阿夫团，作战屡获嘉奖；两战之间历任旅、师、军长及巴黎军区司令，1937年晋升陆军大将，并进入最高军事委员会。1939年9月战争爆发时他指挥驻阿尔卑斯的第六集团军，同年10月改任第三集团军群司令，负责守卫从科尔马到瑞士边境一线的马其诺防线南段。1940年5月德军在默兹河突破后，他的集团军群被调往索姆河与埃纳河，在所谓\"魏刚防线\"上组织防御，随后边打边退向法国中部。6月17日，停战消息被提前传出后，他向仍在卢瓦尔河与谢尔河一线作战的部队下令：\"既无停战，也无休战，战斗仍在继续。\"但败局已无可挽回，6月25日前后他与司令部投降，此时德军装甲部队已抵达瑞士边境、将马其诺防线拦腰截断。停战后他未投奔自由法国，而是留在本土，先后任军区督察与维希政权的战俘总署署长，1942年由贝当亲授荣誉军团大十字勋章。他于1969年在巴黎去世。"
 CBIO_FRA_charles_de_gaulle_desc:0 "夏尔·戴高乐，1890年生于里尔，法国军人、政治家，自由法国的缔造者与象征。第一次世界大战中他作战负伤，1916年在凡尔登被德军俘虏，多次越狱未成而被拘押至战争结束。两战之间，他成为机械化战争与装甲集群理论的鼓吹者，著书主张建立职业化的装甲部队，但其主张未被法军高层采纳。1940年法国战役中，他指挥第四装甲师发动过为数不多的反击，被擢升为准将并短暂出任国防部副国务秘书。法国濒临投降之际，他拒绝接受停战，飞赴伦敦，于6月18日通过广播发出\"呼吁\"，号召法国人继续抵抗，宣告法国虽败一役而战争远未结束。此后他领导\"自由法国\"运动，以洛林十字为旗号，逐步集结海外抵抗力量，并在与吉罗的角力中掌握了法兰西民族解放委员会的主导权。1944年他率临时政府返回光复的巴黎。战后他一度执政旋即引退，1958年因阿尔及利亚危机重新出山，创建第五共和国并出任总统，深刻塑造了战后法国的政治格局，1970年去世。"
 FRA_charles_de_gaulle_desc:0 "夏尔·戴高乐，1890年生于里尔，法国军人、政治家，自由法国的缔造者与象征。第一次世界大战中他作战负伤，1916年在凡尔登被德军俘虏，多次越狱未成而被拘押至战争结束。两战之间，他成为机械化战争与装甲集群理论的鼓吹者，著书主张建立职业化的装甲部队，但其主张未被法军高层采纳。1940年法国战役中，他指挥第四装甲师发动过为数不多的反击，被擢升为准将并短暂出任国防部副国务秘书。法国濒临投降之际，他拒绝接受停战，飞赴伦敦，于6月18日通过广播发出\"呼吁\"，号召法国人继续抵抗，宣告法国虽败一役而战争远未结束。此后他领导\"自由法国\"运动，以洛林十字为旗号，逐步集结海外抵抗力量，并在与吉罗的角力中掌握了法兰西民族解放委员会的主导权。1944年他率临时政府返回光复的巴黎。战后他一度执政旋即引退，1958年因阿尔及利亚危机重新出山，创建第五共和国并出任总统，深刻塑造了战后法国的政治格局，1970年去世。"
 CBIO_FRA_charles_huntziger_desc:0 "夏尔·安齐热，1880年生于布列塔尼的莱讷旺，出身因拒绝1871年德国吞并而迁居布列塔尼的阿尔萨斯家庭，法国陆军大将。圣西尔军校毕业后他选择殖民地步兵，一战中在东方战线（马其顿）任盟军参谋要职，参与策划1918年击溃保加利亚的瓦尔达尔攻势。两战之间他历任要职，1924年起一度出任驻天津法租界驻军司令，后又任驻黎凡特法军最高指挥官，并卷入将亚历山大勒塔（哈塔伊）划归土耳其的交涉。1938年他进入最高军事委员会，被视为甘末林的接班热门。1940年5月，他指挥第二集团军，正面遭遇德军在色当的决定性突破，应对失措，事后却把责任推给科拉普将军。战败后，他奉贝当之命主持停战谈判，于6月22日在贡比涅森林代表法国签署对德停战协定，又于6月24日在罗马附近签署对意停战协定。维希政权下他出任陆军总司令兼陆军部长，1940年10月参与签署并执行排犹的《犹太人地位法》，将多名犹太裔将领逐出军队，是国家合作主义初期的核心人物之一。1941年11月，他因飞机失事坠亡于塞文山区。"
 FRA_charles_huntziger_desc:0 "夏尔·安齐热，1880年生于布列塔尼的莱讷旺，出身因拒绝1871年德国吞并而迁居布列塔尼的阿尔萨斯家庭，法国陆军大将。圣西尔军校毕业后他选择殖民地步兵，一战中在东方战线（马其顿）任盟军参谋要职，参与策划1918年击溃保加利亚的瓦尔达尔攻势。两战之间他历任要职，1924年起一度出任驻天津法租界驻军司令，后又任驻黎凡特法军最高指挥官，并卷入将亚历山大勒塔（哈塔伊）划归土耳其的交涉。1938年他进入最高军事委员会，被视为甘末林的接班热门。1940年5月，他指挥第二集团军，正面遭遇德军在色当的决定性突破，应对失措，事后却把责任推给科拉普将军。战败后，他奉贝当之命主持停战谈判，于6月22日在贡比涅森林代表法国签署对德停战协定，又于6月24日在罗马附近签署对意停战协定。维希政权下他出任陆军总司令兼陆军部长，1940年10月参与签署并执行排犹的《犹太人地位法》，将多名犹太裔将领逐出军队，是国家合作主义初期的核心人物之一。1941年11月，他因飞机失事坠亡于塞文山区。"
 CBIO_FRA_henri_giraud_desc:0 "亨利·吉罗，1879年生，法国陆军将领。他毕业于圣西尔，一战中负伤被俘后成功越狱，战后长期在北非殖民地服役，参与镇压摩洛哥里夫起义，以勇武果敢著称。1940年法国战役中，他先指挥第七集团军北上荷兰，5月19日临危受命接掌已经崩溃的第九集团军，却几乎随即被德军俘虏。1942年4月，他凭绳索从德国柯尼希施泰因要塞戏剧性越狱，辗转返回未被占领的法国。同年盟军在北非登陆（火炬行动）前后，他被秘密送往北非；达尔朗遇刺后，他出任法属北非的高级专员与法军总司令，掌握当地殖民地军队与地中海战场的重要力量。1943年起他与戴高乐共同担任法兰西民族解放委员会主席，但在政治手腕上不敌戴高乐，权力被逐步架空，最终退出领导层、解除军职。他是出色的战场指挥官，却不擅政治，沦为盟国在北非扶植法国权威过程中的过渡性人物。于1949年去世。"
 FRA_henri_giraud_desc:0 "亨利·吉罗，1879年生，法国陆军将领。他毕业于圣西尔，一战中负伤被俘后成功越狱，战后长期在北非殖民地服役，参与镇压摩洛哥里夫起义，以勇武果敢著称。1940年法国战役中，他先指挥第七集团军北上荷兰，5月19日临危受命接掌已经崩溃的第九集团军，却几乎随即被德军俘虏。1942年4月，他凭绳索从德国柯尼希施泰因要塞戏剧性越狱，辗转返回未被占领的法国。同年盟军在北非登陆（火炬行动）前后，他被秘密送往北非；达尔朗遇刺后，他出任法属北非的高级专员与法军总司令，掌握当地殖民地军队与地中海战场的重要力量。1943年起他与戴高乐共同担任法兰西民族解放委员会主席，但在政治手腕上不敌戴高乐，权力被逐步架空，最终退出领导层、解除军职。他是出色的战场指挥官，却不擅政治，沦为盟国在北非扶植法国权威过程中的过渡性人物。于1949年去世。"
 CBIO_FRA_philippe_leclerc_desc:0 "菲利普·勒克莱尔，本名菲利普·德·奥特克洛克，1902年生，法国陆军将领，自由法国的传奇人物，\"勒克莱尔\"是他投身抵抗时所用的化名。1940年法国战败后，他拒绝投降，毅然投奔伦敦的戴高乐。他受命前往法属赤道非洲，从乍得出发组织作战，1941年率部远征、攻占意大利据守的库夫拉绿洲，并立下著名的\"库夫拉誓言\"——不获全胜、法国国旗不重新升上斯特拉斯堡大教堂，绝不停止战斗。其后他指挥第二装甲师（2e DB）在诺曼底登陆后挥师内陆，于1944年8月解放巴黎，并在年底攻入斯特拉斯堡，兑现了库夫拉的誓言。1945年9月，他作为法国代表出席在东京湾举行的日本投降仪式，在受降文件上签字。他被视为自由法国军事荣誉的化身，惜于1947年因飞机失事在阿尔及利亚殉职，1952年被追授法国元帅。"
 FRA_philippe_leclerc_desc:0 "菲利普·勒克莱尔，本名菲利普·德·奥特克洛克，1902年生，法国陆军将领，自由法国的传奇人物，\"勒克莱尔\"是他投身抵抗时所用的化名。1940年法国战败后，他拒绝投降，毅然投奔伦敦的戴高乐。他受命前往法属赤道非洲，从乍得出发组织作战，1941年率部远征、攻占意大利据守的库夫拉绿洲，并立下著名的\"库夫拉誓言\"——不获全胜、法国国旗不重新升上斯特拉斯堡大教堂，绝不停止战斗。其后他指挥第二装甲师（2e DB）在诺曼底登陆后挥师内陆，于1944年8月解放巴黎，并在年底攻入斯特拉斯堡，兑现了库夫拉的誓言。1945年9月，他作为法国代表出席在东京湾举行的日本投降仪式，在受降文件上签字。他被视为自由法国军事荣誉的化身，惜于1947年因飞机失事在阿尔及利亚殉职，1952年被追授法国元帅。"
 CBIO_FRA_henry_freydenberg_desc:0 "亨利·弗雷登伯格，1876年生于巴黎，法国陆军中将（général de corps d'armée），毕生服务于殖民地军队。圣西尔毕业后，他先在马达加斯加追随加利埃尼、利奥泰，又在乍得任职，一战中转战法国本土与马其顿瓦尔达尔战线。两战之间，他长期投身殖民地征战与治理，参与摩洛哥中阿特拉斯与里夫地区的作战，历任梅克内斯指挥官、塞内加尔殖民地师师长、法属西非总司令，1933年还曾作为国联委员会成员赴南美调处大查科冲突。他于1938年退役，1939年战争爆发被召回，指挥在洛林前线作战的殖民军军团；1940年6月5日接替安齐热出任第二集团军司令。然而在六月的溃败中，他因指挥部一退再退、远远抛离前线部队而声名狼藉——停战之日，第二集团军司令部已退至阿尔代什的一座修道院，所部却仍困在洛林、与指挥部失去联系。战后他既未受维希追究，也未在解放后被清算，1975年以近99岁高龄去世。"
 FRA_henry_freydenberg_desc:0 "亨利·弗雷登伯格，1876年生于巴黎，法国陆军中将（général de corps d'armée），毕生服务于殖民地军队。圣西尔毕业后，他先在马达加斯加追随加利埃尼、利奥泰，又在乍得任职，一战中转战法国本土与马其顿瓦尔达尔战线。两战之间，他长期投身殖民地征战与治理，参与摩洛哥中阿特拉斯与里夫地区的作战，历任梅克内斯指挥官、塞内加尔殖民地师师长、法属西非总司令，1933年还曾作为国联委员会成员赴南美调处大查科冲突。他于1938年退役，1939年战争爆发被召回，指挥在洛林前线作战的殖民军军团；1940年6月5日接替安齐热出任第二集团军司令。然而在六月的溃败中，他因指挥部一退再退、远远抛离前线部队而声名狼藉——停战之日，第二集团军司令部已退至阿尔代什的一座修道院，所部却仍困在洛林、与指挥部失去联系。战后他既未受维希追究，也未在解放后被清算，1975年以近99岁高龄去世。"
 CBIO_FRA_gastonhenri_billotte_desc:0 "加斯东-亨利·比约特，1875年生，法国陆军将领。他早年在殖民地与一战战场积累战功，两战之间稳步晋升为高级将领。1940年法国战役中，他出任第一集团军群司令，统辖部署于法比边境直至色当一线的法军主力，并被赋予协调北线盟军（含英国远征军、比利时与荷兰部队）的指挥之责——这是法军最吃重、也最关键的方向。德军经阿登突破后，北线盟军面临被合围的危险；正当协调各方、组织退却的关键时刻，比约特于5月21日遭遇车祸重伤，两日后不治身亡。他的猝然离世使北线盟军在最危急的关头一度群龙无首、出现指挥真空，进一步加剧了协调混乱，被不少史家视为敦刻尔克撤退之前盟军溃败的重要转折之一。其子皮埃尔·比约特后来投奔自由法国，成为戴高乐麾下的装甲军官。"
 FRA_gastonhenri_billotte_desc:0 "加斯东-亨利·比约特，1875年生，法国陆军将领。他早年在殖民地与一战战场积累战功，两战之间稳步晋升为高级将领。1940年法国战役中，他出任第一集团军群司令，统辖部署于法比边境直至色当一线的法军主力，并被赋予协调北线盟军（含英国远征军、比利时与荷兰部队）的指挥之责——这是法军最吃重、也最关键的方向。德军经阿登突破后，北线盟军面临被合围的危险；正当协调各方、组织退却的关键时刻，比约特于5月21日遭遇车祸重伤，两日后不治身亡。他的猝然离世使北线盟军在最危急的关头一度群龙无首、出现指挥真空，进一步加剧了协调混乱，被不少史家视为敦刻尔克撤退之前盟军溃败的重要转折之一。其子皮埃尔·比约特后来投奔自由法国，成为戴高乐麾下的装甲军官。"
 CBIO_FRA_rene_olry_desc:0 "勒内·奥尔里，1880年生，法国陆军将领。他历经第一次世界大战，两战之间稳步晋升。1940年法国战役期间，他出任东南战区（阿尔卑斯方向）司令，统率\"阿尔卑斯集团军\"，负责防守从汝拉到地中海、面向意大利的整条阿尔卑斯山防线。6月10日意大利对法宣战并随即向阿尔卑斯一线发起进攻时，奥尔里手中兵力有限，且后方因德军南下而腹背受敌；但他凭借坚固的山地工事和官兵的顽强，成功顶住了数量占优的意大利军队的进攻，使其几乎毫无进展。这是1940年法国一片溃败中难得的一抹亮色——阿尔卑斯防线直到停战都未被意军攻破。奥尔里因此役而为后世铭记。他于1944年去世。"
 FRA_rene_olry_desc:0 "勒内·奥尔里，1880年生，法国陆军将领。他历经第一次世界大战，两战之间稳步晋升。1940年法国战役期间，他出任东南战区（阿尔卑斯方向）司令，统率\"阿尔卑斯集团军\"，负责防守从汝拉到地中海、面向意大利的整条阿尔卑斯山防线。6月10日意大利对法宣战并随即向阿尔卑斯一线发起进攻时，奥尔里手中兵力有限，且后方因德军南下而腹背受敌；但他凭借坚固的山地工事和官兵的顽强，成功顶住了数量占优的意大利军队的进攻，使其几乎毫无进展。这是1940年法国一片溃败中难得的一抹亮色——阿尔卑斯防线直到停战都未被意军攻破。奥尔里因此役而为后世铭记。他于1944年去世。"
 CBIO_FRA_jean_de_lattre_de_tassigny_desc:0 "让·德·拉特·德·塔西尼，1889年生，法国陆军将领，人称\"约翰王\"（le Roi Jean），以果决与个人魅力著称。一战中他多次负伤、屡获嘉奖。1940年法国战役中，他指挥第十四步兵师，是少数表现出色的法军部队之一。停战后他一度服役于维希的\"停战军\"；1942年11月德军进占法国南方非占领区时，他率部试图抵抗，被维希当局逮捕判刑，1943年从里永监狱越狱，辗转投奔自由法国。1944年8月，他指挥法国第一集团军参加普罗旺斯登陆，沿罗讷河谷北上，转战阿尔萨斯并攻入德国本土。1945年5月，他代表法国在柏林出席德国投降仪式、在受降文件上签字，使法国跻身战胜国之列。战后他出任要职，1950年起赴印度支那指挥法军，稳住了一度危殆的战局，其独子贝尔纳却在当地阵亡。他于1952年因病去世，身后被追授法国元帅。"
 FRA_jean_de_lattre_de_tassigny_desc:0 "让·德·拉特·德·塔西尼，1889年生，法国陆军将领，人称\"约翰王\"（le Roi Jean），以果决与个人魅力著称。一战中他多次负伤、屡获嘉奖。1940年法国战役中，他指挥第十四步兵师，是少数表现出色的法军部队之一。停战后他一度服役于维希的\"停战军\"；1942年11月德军进占法国南方非占领区时，他率部试图抵抗，被维希当局逮捕判刑，1943年从里永监狱越狱，辗转投奔自由法国。1944年8月，他指挥法国第一集团军参加普罗旺斯登陆，沿罗讷河谷北上，转战阿尔萨斯并攻入德国本土。1945年5月，他代表法国在柏林出席德国投降仪式、在受降文件上签字，使法国跻身战胜国之列。战后他出任要职，1950年起赴印度支那指挥法军，稳住了一度危殆的战局，其独子贝尔纳却在当地阵亡。他于1952年因病去世，身后被追授法国元帅。"
 CBIO_FRA_alphonse_juin_desc:0 "阿方斯·朱安，1888年生于法属阿尔及利亚的小城博讷，出身平民，法国陆军将领。他以圣西尔军校1912届第一名毕业（同届有戴高乐），一战中右臂负伤致残。1940年法国战役中，他指挥第十五摩托化步兵师，在里尔一带被德军俘虏；1941年经维希交涉获释，转赴法属北非任职。火炬行动后，他率北非法军转向盟军一方。1943至1944年间，他指挥法兰西远征军参加意大利战役，在加里利亚诺河方向取得突破，并在卡西诺山一线以穿插奥伦奇山地的机动重创德军防线，战功卓著。其后他历任国防参谋长、驻摩洛哥总督，并出任北约中欧盟军总司令，1952年获授法国元帅。晚年他因阿尔及利亚问题与戴高乐交恶。于1967年去世。"
 FRA_alphonse_juin_desc:0 "阿方斯·朱安，1888年生于法属阿尔及利亚的小城博讷，出身平民，法国陆军将领。他以圣西尔军校1912届第一名毕业（同届有戴高乐），一战中右臂负伤致残。1940年法国战役中，他指挥第十五摩托化步兵师，在里尔一带被德军俘虏；1941年经维希交涉获释，转赴法属北非任职。火炬行动后，他率北非法军转向盟军一方。1943至1944年间，他指挥法兰西远征军参加意大利战役，在加里利亚诺河方向取得突破，并在卡西诺山一线以穿插奥伦奇山地的机动重创德军防线，战功卓著。其后他历任国防参谋长、驻摩洛哥总督，并出任北约中欧盟军总司令，1952年获授法国元帅。晚年他因阿尔及利亚问题与戴高乐交恶。于1967年去世。"
 CBIO_FRA_francois_darlan_desc:0 "弗朗索瓦·达尔朗，1881年生，法国海军上将，海军舰队总司令，维希政权的核心人物之一。1930年代他主持法国海军的扩建，成为海军的实际掌门人。法国战败后，他坚定追随贝当，1941年起出任副总理兼外交、内政、国防等多部部长，并被指定为贝当的接班人，是维希对德合作政策的主要推动者之一，曾与德国谈判《巴黎议定书》。在他主政期间，法国海军基本服从维希、对英国怀有敌意——1940年英国为防止法舰落入德国之手而袭击米尔斯克比尔，更加深了这种对立。1942年11月盟军在北非登陆（火炬行动）时，他恰在阿尔及尔，遂与盟军达成停火协议，命令法属北非的军队转投盟国一方，自己出任当地的高级专员。这一\"达尔朗交易\"令盟国得以迅速控制北非，却因其维希背景而饱受争议。1942年12月24日，他在阿尔及尔被一名法国青年刺杀身亡。"
 FRA_francois_darlan_desc:0 "弗朗索瓦·达尔朗，1881年生，法国海军上将，海军舰队总司令，维希政权的核心人物之一。1930年代他主持法国海军的扩建，成为海军的实际掌门人。法国战败后，他坚定追随贝当，1941年起出任副总理兼外交、内政、国防等多部部长，并被指定为贝当的接班人，是维希对德合作政策的主要推动者之一，曾与德国谈判《巴黎议定书》。在他主政期间，法国海军基本服从维希、对英国怀有敌意——1940年英国为防止法舰落入德国之手而袭击米尔斯克比尔，更加深了这种对立。1942年11月盟军在北非登陆（火炬行动）时，他恰在阿尔及尔，遂与盟军达成停火协议，命令法属北非的军队转投盟国一方，自己出任当地的高级专员。这一\"达尔朗交易\"令盟国得以迅速控制北非，却因其维希背景而饱受争议。1942年12月24日，他在阿尔及尔被一名法国青年刺杀身亡。"
 CBIO_FRA_jean_de_laborde_desc:0 "让·德·拉博德，1878年生，法国海军上将，一名坚定的维希派、强硬的反英与反戴高乐者。法国战败后，他出任停泊于土伦的\"公海舰队\"司令，掌握法国海军最精锐的主力舰队。1942年11月，盟军登陆北非、德军随即进占法国南方非占领区，并企图夺取土伦的法国舰队（\"百合花行动\"）。在此关头，德·拉博德下令将舰队自行凿沉，使数十艘主力舰艇沉没于军港，既未落入德国之手，也未投奔盟军或自由法国。这一\"土伦自沉\"成为法国海军在维希与自由法国之间分裂的悲剧性顶点——它捍卫了\"舰队绝不落入德国之手\"的承诺，却也使这支舰队白白损失、未能为对德作战出一分力。战后他作为通敌者受审，一度被判死刑，后获减刑，晚年获释。他于1977年去世。"
 FRA_jean_de_laborde_desc:0 "让·德·拉博德，1878年生，法国海军上将，一名坚定的维希派、强硬的反英与反戴高乐者。法国战败后，他出任停泊于土伦的\"公海舰队\"司令，掌握法国海军最精锐的主力舰队。1942年11月，盟军登陆北非、德军随即进占法国南方非占领区，并企图夺取土伦的法国舰队（\"百合花行动\"）。在此关头，德·拉博德下令将舰队自行凿沉，使数十艘主力舰艇沉没于军港，既未落入德国之手，也未投奔盟军或自由法国。这一\"土伦自沉\"成为法国海军在维希与自由法国之间分裂的悲剧性顶点——它捍卫了\"舰队绝不落入德国之手\"的承诺，却也使这支舰队白白损失、未能为对德作战出一分力。战后他作为通敌者受审，一度被判死刑，后获减刑，晚年获释。他于1977年去世。"
 CBIO_FRA_rene_emile_godfroy_desc:0 "勒内-埃米尔·戈德弗鲁瓦，1885年生，法国海军将领。法国战败时，他指挥停泊于埃及亚历山大港的\"X舰队\"——一支由战列舰、巡洋舰等组成的法国分舰队，正处于英国地中海舰队的监视之下。1940年7月英军袭击米尔斯克比尔、法英反目之后，他没有像奥兰那样兵戎相见，而是与英国海军上将坎宁安达成协议：法舰解除武装、停泊不动，既不自沉，也不被英方夺取。此后两年多，戈德弗鲁瓦的舰队在亚历山大港长期被封存、按兵不动，他本人则在维希与自由法国之间长期观望。直到1943年北非战局明朗、维希在海外的权威瓦解之后，他才率舰队转投盟军一方，重新投入对轴心国的作战。于1981年去世。"
 FRA_rene_emile_godfroy_desc:0 "勒内-埃米尔·戈德弗鲁瓦，1885年生，法国海军将领。法国战败时，他指挥停泊于埃及亚历山大港的\"X舰队\"——一支由战列舰、巡洋舰等组成的法国分舰队，正处于英国地中海舰队的监视之下。1940年7月英军袭击米尔斯克比尔、法英反目之后，他没有像奥兰那样兵戎相见，而是与英国海军上将坎宁安达成协议：法舰解除武装、停泊不动，既不自沉，也不被英方夺取。此后两年多，戈德弗鲁瓦的舰队在亚历山大港长期被封存、按兵不动，他本人则在维希与自由法国之间长期观望。直到1943年北非战局明朗、维希在海外的权威瓦解之后，他才率舰队转投盟军一方，重新投入对轴心国的作战。于1981年去世。"
 CBIO_FRA_jeanmarie_charles_abrial_desc:0 "让-玛丽·夏尔·阿布里亚尔，1879年生，法国海军上将。1940年法国战役中，他作为\"北方海军司令\"坐镇敦刻尔克，负责该地区的海上防御，在英法联军经敦刻尔克从海上大撤退（发电机行动）的过程中组织法方的海上行动，本人坚守到撤退尾声方才登船离去。法国战败后，他倒向维希政权，先后出任阿尔及利亚总督与维希政府海军部长等要职，成为维希海外统治的代表人物之一。在北非脱离维希、转向盟军的过程中，他属于旧秩序一方。战后他作为通敌者受审，被判刑并褫夺公民权，服刑数年后获释。他于1962年去世。"
 FRA_jeanmarie_charles_abrial_desc:0 "让-玛丽·夏尔·阿布里亚尔，1879年生，法国海军上将。1940年法国战役中，他作为\"北方海军司令\"坐镇敦刻尔克，负责该地区的海上防御，在英法联军经敦刻尔克从海上大撤退（发电机行动）的过程中组织法方的海上行动，本人坚守到撤退尾声方才登船离去。法国战败后，他倒向维希政权，先后出任阿尔及利亚总督与维希政府海军部长等要职，成为维希海外统治的代表人物之一。在北非脱离维希、转向盟军的过程中，他属于旧秩序一方。战后他作为通敌者受审，被判刑并褫夺公民权，服刑数年后获释。他于1962年去世。"
 CBIO_FRA_jeanpierre_esteva_desc:0 "让-皮埃尔·埃斯特瓦，1880年生，法国海军上将。两战之间他在海军中稳步晋升。法国战败后，他效忠维希政权，出任驻突尼斯总督（驻突尼斯法军最高代表）。1942年11月盟军登陆北非、轴心国军队随即抢登突尼斯之际，埃斯特瓦在维希与达尔朗反复无常的命令之下举棋不定，未能阻止、客观上甚至方便了德意军队进驻突尼斯，由此引发了持续半年之久的突尼斯战役。他因效忠维希、对轴心国登陆未加抵抗而难辞其咎。战后他被法国以通敌罪送上法庭，判处终身苦役并褫夺公民权，后因病获释，1951年去世。"
 FRA_jeanpierre_esteva_desc:0 "让-皮埃尔·埃斯特瓦，1880年生，法国海军上将。两战之间他在海军中稳步晋升。法国战败后，他效忠维希政权，出任驻突尼斯总督（驻突尼斯法军最高代表）。1942年11月盟军登陆北非、轴心国军队随即抢登突尼斯之际，埃斯特瓦在维希与达尔朗反复无常的命令之下举棋不定，未能阻止、客观上甚至方便了德意军队进驻突尼斯，由此引发了持续半年之久的突尼斯战役。他因效忠维希、对轴心国登陆未加抵抗而难辞其咎。战后他被法国以通敌罪送上法庭，判处终身苦役并褫夺公民权，后因病获释，1951年去世。"
 CBIO_FRA_alfred_heurtaux_desc:0 "阿尔弗雷德·厄尔托，1893年生于南特，第一次世界大战的法国王牌飞行员。他原属骑兵，1914年底转入航空，1916年加入著名的\"鹳鸟\"中队——那是居伊内梅、丰克等顶尖飞行员所在的精英部队；他于同年11月起担任中队长，一年间即取得21次空战胜利，还击落了德国王牌温特根斯，是法国战斗机飞行员中的佼佼者，两度负伤后退出前线。战后他短暂从政（任塞纳-瓦兹省议员），又转入福特、通用、雷诺等汽车工业。第二次世界大战中，他虽一度被列入维希的\"国民委员会\"，却拒绝与德国合作，转而投身抵抗：他创建了占领区最早的情报网之一\"赫克托\"网（青年沙邦-戴尔马即由他吸收入伙），该网后并入重要抵抗组织\"军民组织\"（OCM）。1941年他被盖世太保逮捕，年底起被囚于德国多座监狱，1945年3月被押入布痕瓦尔德集中营，4月获美军解救。战后他获授\"解放同伴\"称号、晋升空军准将。他于1985年去世。"
 FRA_alfred_heurtaux_desc:0 "阿尔弗雷德·厄尔托，1893年生于南特，第一次世界大战的法国王牌飞行员。他原属骑兵，1914年底转入航空，1916年加入著名的\"鹳鸟\"中队——那是居伊内梅、丰克等顶尖飞行员所在的精英部队；他于同年11月起担任中队长，一年间即取得21次空战胜利，还击落了德国王牌温特根斯，是法国战斗机飞行员中的佼佼者，两度负伤后退出前线。战后他短暂从政（任塞纳-瓦兹省议员），又转入福特、通用、雷诺等汽车工业。第二次世界大战中，他虽一度被列入维希的\"国民委员会\"，却拒绝与德国合作，转而投身抵抗：他创建了占领区最早的情报网之一\"赫克托\"网（青年沙邦-戴尔马即由他吸收入伙），该网后并入重要抵抗组织\"军民组织\"（OCM）。1941年他被盖世太保逮捕，年底起被囚于德国多座监狱，1945年3月被押入布痕瓦尔德集中营，4月获美军解救。战后他获授\"解放同伴\"称号、晋升空军准将。他于1985年去世。"
 CBIO_FRA_emile_muselier_desc:0 "埃米尔·缪塞利埃，1882年生，法国海军将领，自由法国海军的创建者。1940年法国战败后，他是最早响应戴高乐、投奔伦敦的法国高级军官之一，受命组建\"自由法国海军\"（FNFL），把流散海外的法国舰船与水兵重新集结到抗战旗帜之下。为使自由法国的军舰、飞机不致与维希、德国的标志相混淆，他提议以\"洛林十字\"作为自由法国的标记——这一符号后来成为整个自由法国运动的象征。1941年底，他率小舰队解放了北美外海的圣皮埃尔和密克隆群岛，使其脱离维希。然而他与戴高乐之间因权力与作风屡生龃龉，最终关系破裂、淡出自由法国的领导核心。他于1965年去世。"
 FRA_emile_muselier_desc:0 "埃米尔·缪塞利埃，1882年生，法国海军将领，自由法国海军的创建者。1940年法国战败后，他是最早响应戴高乐、投奔伦敦的法国高级军官之一，受命组建\"自由法国海军\"（FNFL），把流散海外的法国舰船与水兵重新集结到抗战旗帜之下。为使自由法国的军舰、飞机不致与维希、德国的标志相混淆，他提议以\"洛林十字\"作为自由法国的标记——这一符号后来成为整个自由法国运动的象征。1941年底，他率小舰队解放了北美外海的圣皮埃尔和密克隆群岛，使其脱离维希。然而他与戴高乐之间因权力与作风屡生龃龉，最终关系破裂、淡出自由法国的领导核心。他于1965年去世。"
 CBIO_FRA_georges_bonnet_desc:0 "乔治·博内，1889年生，法国激进社会党政治家，1930年代法国政坛的重要人物，长期出入内阁，历任财政、外交等部部长。他最为人知、也最受争议的，是1938至1939年在达拉第政府中出任外交部长期间，作为对德\"绥靖\"政策的主要推手之一，积极促成1938年的慕尼黑协定，主张以让步换取和平、避免法国卷入战争，对德、对意态度软弱。这一绥靖立场在战后被广泛批评为助长了希特勒的扩张。1939年战争爆发后他被调离外交部。维希时期他立场偏右、一度倾向贝当；战后绥靖与维希的经历使他长期受到非议，但他后来仍重返政坛、当选议员。于1973年去世。"
 FRA_georges_bonnet_desc:0 "乔治·博内，1889年生，法国激进社会党政治家，1930年代法国政坛的重要人物，长期出入内阁，历任财政、外交等部部长。他最为人知、也最受争议的，是1938至1939年在达拉第政府中出任外交部长期间，作为对德\"绥靖\"政策的主要推手之一，积极促成1938年的慕尼黑协定，主张以让步换取和平、避免法国卷入战争，对德、对意态度软弱。这一绥靖立场在战后被广泛批评为助长了希特勒的扩张。1939年战争爆发后他被调离外交部。维希时期他立场偏右、一度倾向贝当；战后绥靖与维希的经历使他长期受到非议，但他后来仍重返政坛、当选议员。于1973年去世。"
 CBIO_FRA_jean_decoux_desc:0 "让·德古，1884年生于波尔多，法国海军上将。1939年他出任远东法国海军总司令，驻节西贡。法国战败后，1940年6月他被维希政权任命为法属印度支那总督，直至1945年。任内他效忠贝当政权，执行维希的各项法令（包括针对戴高乐派、共济会与犹太人的歧视性立法）。面对日本的步步进逼，他在维希指令下被迫让步：1940年9月签约开放海防港、允许日军进驻东京（北圻），1941年又签协议任日军遍驻印度支那——日本借此切断了盟国经印度支那对中国的补给线。作为交换，日方承诺不干涉内政，法国的军队与行政机构得以名义上维持。德古以隐忍周旋，在日军压境下勉力保住了印度支那的法国主权与秩序，并推行抬高越南人地位的\"联邦\"怀柔政策；1941年他还指挥法军在科昌海战中击败暹罗。1945年3月9日，日本发动政变，推翻法国当局、将他逮捕关押。战后他被法国以通敌罪起诉，羁押近三年，1949年获不起诉。于1963年去世。"
 FRA_jean_decoux_desc:0 "让·德古，1884年生于波尔多，法国海军上将。1939年他出任远东法国海军总司令，驻节西贡。法国战败后，1940年6月他被维希政权任命为法属印度支那总督，直至1945年。任内他效忠贝当政权，执行维希的各项法令（包括针对戴高乐派、共济会与犹太人的歧视性立法）。面对日本的步步进逼，他在维希指令下被迫让步：1940年9月签约开放海防港、允许日军进驻东京（北圻），1941年又签协议任日军遍驻印度支那——日本借此切断了盟国经印度支那对中国的补给线。作为交换，日方承诺不干涉内政，法国的军队与行政机构得以名义上维持。德古以隐忍周旋，在日军压境下勉力保住了印度支那的法国主权与秩序，并推行抬高越南人地位的\"联邦\"怀柔政策；1941年他还指挥法军在科昌海战中击败暹罗。1945年3月9日，日本发动政变，推翻法国当局、将他逮捕关押。战后他被法国以通敌罪起诉，羁押近三年，1949年获不起诉。于1963年去世。"
 CBIO_FRA_jean_francois_jannekeyn_desc:0 "让-弗朗索瓦·珍妮肯，1892年生于康布雷，法国空军将领、第一次世界大战飞行员。他原属骑兵，一战中转入航空，作为轰炸机飞行员取得5次空战胜利、跻身王牌之列，还曾作为击剑选手参加1924年奥运会。第二次世界大战中，1942年4月他在赖伐尔政府中出任维希的航空国务秘书（空军部长），直至1943年。任内他不得不卷入对德合作的机器，主管法国的航空工业生产——而维希与德国的协议使这些产能大量为德国所用。不过，他对通敌派颇为抵触，曾设法限制通敌思想在空军中蔓延，并拒绝接受德方的军事\"援助\"，称那是\"得不偿失的危险妥协\"。战后他作为维希高官受审、一度被关押于弗雷讷，但因若干抵抗相关事由，于1949年获不起诉。他于1971年去世。"
 FRA_jean_francois_jannekeyn_desc:0 "让-弗朗索瓦·珍妮肯，1892年生于康布雷，法国空军将领、第一次世界大战飞行员。他原属骑兵，一战中转入航空，作为轰炸机飞行员取得5次空战胜利、跻身王牌之列，还曾作为击剑选手参加1924年奥运会。第二次世界大战中，1942年4月他在赖伐尔政府中出任维希的航空国务秘书（空军部长），直至1943年。任内他不得不卷入对德合作的机器，主管法国的航空工业生产——而维希与德国的协议使这些产能大量为德国所用。不过，他对通敌派颇为抵触，曾设法限制通敌思想在空军中蔓延，并拒绝接受德方的军事\"援助\"，称那是\"得不偿失的危险妥协\"。战后他作为维希高官受审、一度被关押于弗雷讷，但因若干抵抗相关事由，于1949年获不起诉。他于1971年去世。"
 CBIO_FRA_jean_marie_abrial_desc:0 "让-玛丽·阿布里亚尔，1879年生，法国海军上将。1940年法国战役中，他作为\"北方海军司令\"坐镇敦刻尔克，负责该地区的海上防御，在英法联军经敦刻尔克从海上大撤退（发电机行动）的过程中组织法方的海上行动，本人坚守到撤退尾声方才登船离去。法国战败后，他倒向维希政权，先后出任阿尔及利亚总督与维希政府海军部长等要职，成为维希海外统治的代表人物之一。战后他作为通敌者受审，被判刑并褫夺公民权，服刑数年后获释。于1962年去世。"
 FRA_jean_marie_abrial_desc:0 "让-玛丽·阿布里亚尔，1879年生，法国海军上将。1940年法国战役中，他作为\"北方海军司令\"坐镇敦刻尔克，负责该地区的海上防御，在英法联军经敦刻尔克从海上大撤退（发电机行动）的过程中组织法方的海上行动，本人坚守到撤退尾声方才登船离去。法国战败后，他倒向维希政权，先后出任阿尔及利亚总督与维希政府海军部长等要职，成为维希海外统治的代表人物之一。战后他作为通敌者受审，被判刑并褫夺公民权，服刑数年后获释。于1962年去世。"
 CBIO_FRA_jean_marie_bergeret_desc:0 "让-玛丽·贝热雷，1895年生于上索恩省格雷，法国空军将领。一战中他在堑壕里从列兵升到中尉，四度负伤、获多次嘉奖，后参加摩洛哥里夫战争并转入航空。法国战败后，1940年9月贝当任命他出任维希的航空国务秘书，直至1942年4月赖伐尔回朝、由珍妮肯接替。任内他与参谋长罗马泰一道，确立了一套以\"对德谈判换生存\"为核心的空军路线，力图在停战条件下保住一支残余空军；但其领导的航空国务秘书处在排犹问题上态度积极，曾主张把1940年的《犹太人地位法》订得更为严苛，难辞其咎。1942年11月盟军登陆北非后，他倒向吉罗一系，出任北非军政高级专员的副手，因此被维希褫夺国籍。战后他被阿尔及尔的法兰西民族解放委员会起诉、一度羁押，1948年获不起诉。于1956年去世。"
 FRA_jean_marie_bergeret_desc:0 "让-玛丽·贝热雷，1895年生于上索恩省格雷，法国空军将领。一战中他在堑壕里从列兵升到中尉，四度负伤、获多次嘉奖，后参加摩洛哥里夫战争并转入航空。法国战败后，1940年9月贝当任命他出任维希的航空国务秘书，直至1942年4月赖伐尔回朝、由珍妮肯接替。任内他与参谋长罗马泰一道，确立了一套以\"对德谈判换生存\"为核心的空军路线，力图在停战条件下保住一支残余空军；但其领导的航空国务秘书处在排犹问题上态度积极，曾主张把1940年的《犹太人地位法》订得更为严苛，难辞其咎。1942年11月盟军登陆北非后，他倒向吉罗一系，出任北非军政高级专员的副手，因此被维希褫夺国籍。战后他被阿尔及尔的法兰西民族解放委员会起诉、一度羁押，1948年获不起诉。于1956年去世。"
 CBIO_FRA_joseph_vuillemin_desc:0 "约瑟夫·维耶曼，1883年生于波尔多，出身寒微，法国空军大将。他在一战中是轰炸／侦察机飞行员，取得7次空战胜利、跻身王牌，并两获荣誉军团勋章；两战之间，他以1933年率机群完成横贯非洲的\"黑色巡航\"壮举而声名大噪，几成传奇。1938年2月，他接替费康出任法国空军总参谋长。然而此时法国空军准备严重不足：缺乏前瞻、工业动员迟缓、飞机生产混乱、使用理论落后。他虽曾上书示警轰炸机力量薄弱，却也对这一困局负有责任；1938年他访德时更被德国空军的实力所震慑。1940年法国战役中，面对德国空军的猛攻，法国空军损失惨重，他屡屡请求英国增派飞机而不得。停战前夕的6月16至17日，他下令大批飞机撤往北非，保存了相当实力。停战后他短暂任空军总监，旋于1940年11月主动退役。与甘末林等人不同，他未被维希送上里永审判台。1942年他名义上加入自由法国，但已年老体衰、无力再战。于1963年去世。"
 FRA_joseph_vuillemin_desc:0 "约瑟夫·维耶曼，1883年生于波尔多，出身寒微，法国空军大将。他在一战中是轰炸／侦察机飞行员，取得7次空战胜利、跻身王牌，并两获荣誉军团勋章；两战之间，他以1933年率机群完成横贯非洲的\"黑色巡航\"壮举而声名大噪，几成传奇。1938年2月，他接替费康出任法国空军总参谋长。然而此时法国空军准备严重不足：缺乏前瞻、工业动员迟缓、飞机生产混乱、使用理论落后。他虽曾上书示警轰炸机力量薄弱，却也对这一困局负有责任；1938年他访德时更被德国空军的实力所震慑。1940年法国战役中，面对德国空军的猛攻，法国空军损失惨重，他屡屡请求英国增派飞机而不得。停战前夕的6月16至17日，他下令大批飞机撤往北非，保存了相当实力。停战后他短暂任空军总监，旋于1940年11月主动退役。与甘末林等人不同，他未被维希送上里永审判台。1942年他名义上加入自由法国，但已年老体衰、无力再战。于1963年去世。"
 CBIO_FRA_leon_blum_desc:0 "莱昂·布鲁姆，1872年生于巴黎一个犹太知识分子家庭，法国社会党领袖、人民阵线政府总理。他早年从事文学批评与法律，后投身工人国际法国支部（SFIO），逐渐成为党内核心人物。1936年人民阵线在大选中获胜，布鲁姆出任总理，推动签订马蒂尼翁协议，确立带薪休假、四十小时工作周、集体合同等社会改革，是第三共和国左翼政治的标志性人物。与此同时，他也面对财政困难、资本外逃、右翼街头运动与欧洲危机的多重压力。西班牙内战爆发后，他在援助西班牙共和国与避免法国卷入战争之间摇摆，最终采取\"不干涉\"政策，长期受到左翼批评。身为犹太人和左翼领袖，他更是右翼与反犹势力攻击的靶子。1940年法国战败后，维希政权把他列为战败替罪羊，在里永审判中反被他以雄辩反击，使审判难以为继；其后他被囚禁并被押往德国集中营系统（布痕瓦尔德等地），险遭不测。战后他获释，曾短暂出任过渡政府总理。他于1950年去世。"
 FRA_leon_blum_desc:0 "莱昂·布鲁姆，1872年生于巴黎一个犹太知识分子家庭，法国社会党领袖、人民阵线政府总理。他早年从事文学批评与法律，后投身工人国际法国支部（SFIO），逐渐成为党内核心人物。1936年人民阵线在大选中获胜，布鲁姆出任总理，推动签订马蒂尼翁协议，确立带薪休假、四十小时工作周、集体合同等社会改革，是第三共和国左翼政治的标志性人物。与此同时，他也面对财政困难、资本外逃、右翼街头运动与欧洲危机的多重压力。西班牙内战爆发后，他在援助西班牙共和国与避免法国卷入战争之间摇摆，最终采取\"不干涉\"政策，长期受到左翼批评。身为犹太人和左翼领袖，他更是右翼与反犹势力攻击的靶子。1940年法国战败后，维希政权把他列为战败替罪羊，在里永审判中反被他以雄辩反击，使审判难以为继；其后他被囚禁并被押往德国集中营系统（布痕瓦尔德等地），险遭不测。战后他获释，曾短暂出任过渡政府总理。他于1950年去世。"
 CBIO_FRA_louis_kahn_desc:0 "路易·卡恩，1895年生于凡尔赛，法国海军工程界的杰出人物，被称为法国首位犹太裔\"海军上将\"（他持有与上将相当的工程将官衔）。他毕业于巴黎综合理工学院，一战中指挥炮兵、两度负伤。此后他成为造船工程专家，曾任西贡兵工厂与印度支那造船主管，主持航空母舰的设计，还发明了以其姓氏命名的地图投影法。1940年法国战败后，依据维希政权1941年的《犹太人地位法》，身为犹太人的他被强制退出一切公职。他不甘屈服，1942年辗转经西班牙逃出法国、投奔自由法国，先后在伦敦与阿尔及尔主管自由法国海军的舰艇建造，是从阿尔及尔重建法国海军的主要工程负责人之一；他研制的反潜与防鱼雷技术更赢得丘吉尔的正式嘉许。战后他历任要职，并成为法国犹太社团的领袖，长期出任法国犹太教中央宗教会议主席。于1967年去世。"
 FRA_louis_kahn_desc:0 "路易·卡恩，1895年生于凡尔赛，法国海军工程界的杰出人物，被称为法国首位犹太裔\"海军上将\"（他持有与上将相当的工程将官衔）。他毕业于巴黎综合理工学院，一战中指挥炮兵、两度负伤。此后他成为造船工程专家，曾任西贡兵工厂与印度支那造船主管，主持航空母舰的设计，还发明了以其姓氏命名的地图投影法。1940年法国战败后，依据维希政权1941年的《犹太人地位法》，身为犹太人的他被强制退出一切公职。他不甘屈服，1942年辗转经西班牙逃出法国、投奔自由法国，先后在伦敦与阿尔及尔主管自由法国海军的舰艇建造，是从阿尔及尔重建法国海军的主要工程负责人之一；他研制的反潜与防鱼雷技术更赢得丘吉尔的正式嘉许。战后他历任要职，并成为法国犹太社团的领袖，长期出任法国犹太教中央宗教会议主席。于1967年去世。"
 CBIO_FRA_marcel_gensoul_desc:0 "马塞尔·让苏尔，1880年生，法国海军将领。1940年法国战败之际，他指挥停泊于法属阿尔及利亚米尔斯克比尔军港的法国主力\"突击舰队\"，麾下有\"敦刻尔克\"号、\"斯特拉斯堡\"号等新锐战列舰。停战后，英国担心这支强大舰队落入德、意之手，于1940年7月3日派萨默维尔率舰队前来，向让苏尔发出最后通牒，要求法舰加入英方、或驶往英属、法属西印度港口、或自行凿沉，否则将以武力解决。让苏尔在与英方交涉时未能充分、及时地把对方提出的各项选项上报海军部，谈判破裂；当日傍晚英舰开火炮击米尔斯克比尔，约一千三百名法国水兵阵亡，\"布列塔尼\"号战列舰被击毁。这一事件使法英关系急剧恶化，也加深了维希海军对英国的仇恨。让苏尔此后基本淡出，战后未居要职。他于1973年去世。"
 FRA_marcel_gensoul_desc:0 "马塞尔·让苏尔，1880年生，法国海军将领。1940年法国战败之际，他指挥停泊于法属阿尔及利亚米尔斯克比尔军港的法国主力\"突击舰队\"，麾下有\"敦刻尔克\"号、\"斯特拉斯堡\"号等新锐战列舰。停战后，英国担心这支强大舰队落入德、意之手，于1940年7月3日派萨默维尔率舰队前来，向让苏尔发出最后通牒，要求法舰加入英方、或驶往英属、法属西印度港口、或自行凿沉，否则将以武力解决。让苏尔在与英方交涉时未能充分、及时地把对方提出的各项选项上报海军部，谈判破裂；当日傍晚英舰开火炮击米尔斯克比尔，约一千三百名法国水兵阵亡，\"布列塔尼\"号战列舰被击毁。这一事件使法英关系急剧恶化，也加深了维希海军对英国的仇恨。让苏尔此后基本淡出，战后未居要职。他于1973年去世。"
 CBIO_FRA_martial_valin_desc:0 "马夏尔·瓦兰，1898年生于利摩日，法国空军大将，自由法国空军的主要缔造者。他出身骑兵，一战中在堑壕作战、曾遭毒气，后转入航空，并参加过摩洛哥里夫战争。1940年初他被派往巴西里约的法国军事代表团；法国战败后，他于1940年11月致电戴高乐表示效忠，几经辗转于1941年3月抵达英国，并于同年7月接替缪塞利埃、出任自由法国空军（FAFL）司令。他白手起家，把流散各地的法国飞行员重新组织起来，先后创建了\"阿尔萨斯\"\"法兰西岛\"等战斗机大队与\"洛林\"\"布列塔尼\"等轰炸机大队，还推动组建了赴苏作战的\"诺曼底\"战斗机部队。1943年自由法国空军与北非（原维希）空军合并时，他以圆融的作风主动退居副手，化解了两派飞行员之间的隔阂。1944年他随勒克莱尔进入巴黎，11月起出任法国空军总参谋长。他是\"解放同伴\"，战后长期为重建法国空军奔走。他于1980年去世。"
 FRA_martial_valin_desc:0 "马夏尔·瓦兰，1898年生于利摩日，法国空军大将，自由法国空军的主要缔造者。他出身骑兵，一战中在堑壕作战、曾遭毒气，后转入航空，并参加过摩洛哥里夫战争。1940年初他被派往巴西里约的法国军事代表团；法国战败后，他于1940年11月致电戴高乐表示效忠，几经辗转于1941年3月抵达英国，并于同年7月接替缪塞利埃、出任自由法国空军（FAFL）司令。他白手起家，把流散各地的法国飞行员重新组织起来，先后创建了\"阿尔萨斯\"\"法兰西岛\"等战斗机大队与\"洛林\"\"布列塔尼\"等轰炸机大队，还推动组建了赴苏作战的\"诺曼底\"战斗机部队。1943年自由法国空军与北非（原维希）空军合并时，他以圆融的作风主动退居副手，化解了两派飞行员之间的隔阂。1944年他随勒克莱尔进入巴黎，11月起出任法国空军总参谋长。他是\"解放同伴\"，战后长期为重建法国空军奔走。他于1980年去世。"
 CBIO_FRA_philippe_fequant_desc:0 "菲利普·费康，1883年生于蒙莫朗西，法国航空先驱、飞行将领（与同为航空先驱的阿尔贝·费康是兄弟）。他出身殖民地步兵，曾在东京（北圻）与摩洛哥服役，1911年成为最早的军事飞行员之一。第一次世界大战中，他历任轰炸与战斗机中队、战斗机大队及空中旅指挥，麾下一度包括由美国志愿者组成的\"拉法耶特\"中队，作战有功。两战之间他稳步晋升，1935年任驻阿尔及尔的第五航空区司令。1936年人民阵线时期，他出任刚刚独立成军的法国空军总参谋长，兼任领土防空总监。1937年底，他迟来地意识到国际局势的危急，提出一项空军现代化计划，却遭贝当等人阻挠。其后他健康恶化、卸去参谋长之职，由维耶曼于1938年2月接任。他于1938年12月底病逝，年仅五十五岁，留给继任者的是一支准备远不充分的空军。"
 FRA_philippe_fequant_desc:0 "菲利普·费康，1883年生于蒙莫朗西，法国航空先驱、飞行将领（与同为航空先驱的阿尔贝·费康是兄弟）。他出身殖民地步兵，曾在东京（北圻）与摩洛哥服役，1911年成为最早的军事飞行员之一。第一次世界大战中，他历任轰炸与战斗机中队、战斗机大队及空中旅指挥，麾下一度包括由美国志愿者组成的\"拉法耶特\"中队，作战有功。两战之间他稳步晋升，1935年任驻阿尔及尔的第五航空区司令。1936年人民阵线时期，他出任刚刚独立成军的法国空军总参谋长，兼任领土防空总监。1937年底，他迟来地意识到国际局势的危急，提出一项空军现代化计划，却遭贝当等人阻挠。其后他健康恶化、卸去参谋长之职，由维耶曼于1938年2月接任。他于1938年12月底病逝，年仅五十五岁，留给继任者的是一支准备远不充分的空军。"
 CBIO_FRA_rene_massigli_desc:0 "勒内·马西利，1888年生，法国资深外交官。两战之间他长期供职于外交部，是反对绥靖、主张对纳粹德国强硬的代表人物之一，对1938年的慕尼黑协定持批评态度。1938至1940年间他出任驻土耳其大使。法国战败后，他被维希政权免职、靠边站，遂转向抵抗。1943年他前往阿尔及尔，加入法兰西民族解放委员会，出任外交事务委员（即自由法国的\"外交部长\"），主持自由法国的对外交涉。1944年法国光复后，他出任驻英国大使，在伦敦任职长达十余年，致力于战后法英关系与西欧合作，后又出任外交部秘书长。他是20世纪法国外交界的重要人物，其生涯横跨绥靖年代的危机、自由法国的外交奠基与战后欧洲的重建。于1988年以百岁高龄去世。"
 FRA_rene_massigli_desc:0 "勒内·马西利，1888年生，法国资深外交官。两战之间他长期供职于外交部，是反对绥靖、主张对纳粹德国强硬的代表人物之一，对1938年的慕尼黑协定持批评态度。1938至1940年间他出任驻土耳其大使。法国战败后，他被维希政权免职、靠边站，遂转向抵抗。1943年他前往阿尔及尔，加入法兰西民族解放委员会，出任外交事务委员（即自由法国的\"外交部长\"），主持自由法国的对外交涉。1944年法国光复后，他出任驻英国大使，在伦敦任职长达十余年，致力于战后法英关系与西欧合作，后又出任外交部秘书长。他是20世纪法国外交界的重要人物，其生涯横跨绥靖年代的危机、自由法国的外交奠基与战后欧洲的重建。于1988年以百岁高龄去世。"
 CBIO_FRA_rene_prioux_desc:0 "勒内·普里乌，1879年生，法国陆军将领，骑兵与机械化部队专家。1940年法国战役中，他指挥由两个轻机械化师（DLM）组成的骑兵军，奉命前出比利时、掩护法军主力向迪尔河一线展开。5月中旬，他的机械化部队在阿努（Hannut）—让布卢一带与德军装甲部队展开了当时规模空前的坦克会战，成功迟滞德军、为友军布防争取了时间，是1940年法军装甲兵少有的硬仗。此后随着北线战局崩坏，他接替布朗夏尔出任第一集团军司令，在里尔一带的口袋中继续指挥残部苦战，最终于五月底被德军俘虏，沦为战俘。他于1953年去世。其指挥的阿努坦克战，至今仍是研究1940年法德装甲较量的重要战例。"
 FRA_rene_prioux_desc:0 "勒内·普里乌，1879年生，法国陆军将领，骑兵与机械化部队专家。1940年法国战役中，他指挥由两个轻机械化师（DLM）组成的骑兵军，奉命前出比利时、掩护法军主力向迪尔河一线展开。5月中旬，他的机械化部队在阿努（Hannut）—让布卢一带与德军装甲部队展开了当时规模空前的坦克会战，成功迟滞德军、为友军布防争取了时间，是1940年法军装甲兵少有的硬仗。此后随着北线战局崩坏，他接替布朗夏尔出任第一集团军司令，在里尔一带的口袋中继续指挥残部苦战，最终于五月底被德军俘虏，沦为战俘。他于1953年去世。其指挥的阿努坦克战，至今仍是研究1940年法德装甲较量的重要战例。"
 CBIO_FRA_robert_odic_desc:0 "罗伯特·欧迪克，1887年生于诺曼底的讷沙泰勒昂布雷，出身洛林家庭，法国空军将领（四星空军大将）。他自圣西尔军校毕业后选择殖民地步兵，一战中先指挥塞内加尔步兵营，后转入航空。两战之间他长期在摩洛哥等地服役；1939年战争爆发后受维耶曼之命督察侦察航空，继而出任南方空中作战区司令。法国战败后，他于1940年9月短暂出任维希空军参谋长，旋调任驻北非空军最高指挥，隶属魏刚麾下。他很快看清维希政权的实质，与航空国务秘书贝热雷龃龉不断，遂于1941年8月辞职、远走伦敦投奔自由法国。然而他与戴高乐话不投机，指责戴高乐\"与其说在打德国，不如说在打维希\"，遂转投吉罗一系，赴华盛顿充当吉罗派与罗斯福顾问、海军上将莱希之间的非正式使者，并在美国当局面前竭力贬损戴高乐。解放之际他一度被列入清算名单，迟至1946年11月才返回法国。于1958年在巴黎去世。"
 FRA_robert_odic_desc:0 "罗伯特·欧迪克，1887年生于诺曼底的讷沙泰勒昂布雷，出身洛林家庭，法国空军将领（四星空军大将）。他自圣西尔军校毕业后选择殖民地步兵，一战中先指挥塞内加尔步兵营，后转入航空。两战之间他长期在摩洛哥等地服役；1939年战争爆发后受维耶曼之命督察侦察航空，继而出任南方空中作战区司令。法国战败后，他于1940年9月短暂出任维希空军参谋长，旋调任驻北非空军最高指挥，隶属魏刚麾下。他很快看清维希政权的实质，与航空国务秘书贝热雷龃龉不断，遂于1941年8月辞职、远走伦敦投奔自由法国。然而他与戴高乐话不投机，指责戴高乐\"与其说在打德国，不如说在打维希\"，遂转投吉罗一系，赴华盛顿充当吉罗派与罗斯福顾问、海军上将莱希之间的非正式使者，并在美国当局面前竭力贬损戴高乐。解放之际他一度被列入清算名单，迟至1946年11月才返回法国。于1958年在巴黎去世。"
 CBIO_FRA_victor_denain_desc:0 "维克托·德南，1880年生于朗德省的达克斯，法国空军大将、飞行员与政治家。他自圣西尔军校毕业后入骑兵，一战中负伤转入航空，1916至1918年间指挥东方战线（马其顿）盟军的航空部队。战后他在黎凡特服役，成为魏刚的门生，又在魏刚安排下出任驻波兰法国军事代表团团长（1924—1931）。1933年起，他在空军部长皮埃尔·科特之下出任空军总参谋长；1934年2月接任空军部长，直至1936年1月，历经多届政府而任期之长创下纪录。他被视为法国独立空军的主要缔造者之一：推动\"第一号计划\"扩充机群、创办萨隆的空军学校，并以亲驾飞机出访等举动名噪一时。然而他在任内推行的扩军计划，后来被认为远不足以应对德国空军的迅速崛起。此后他历任阿尔及尔第五航空区司令、海外航空总监，转入预备役。1939年战争爆发，他被召回担任国防部特别顾问，并受命组织、训练在法波兰武装力量。法国战败后他退隐，1952年在尼斯去世。"
 FRA_victor_denain_desc:0 "维克托·德南，1880年生于朗德省的达克斯，法国空军大将、飞行员与政治家。他自圣西尔军校毕业后入骑兵，一战中负伤转入航空，1916至1918年间指挥东方战线（马其顿）盟军的航空部队。战后他在黎凡特服役，成为魏刚的门生，又在魏刚安排下出任驻波兰法国军事代表团团长（1924—1931）。1933年起，他在空军部长皮埃尔·科特之下出任空军总参谋长；1934年2月接任空军部长，直至1936年1月，历经多届政府而任期之长创下纪录。他被视为法国独立空军的主要缔造者之一：推动\"第一号计划\"扩充机群、创办萨隆的空军学校，并以亲驾飞机出访等举动名噪一时。然而他在任内推行的扩军计划，后来被认为远不足以应对德国空军的迅速崛起。此后他历任阿尔及尔第五航空区司令、海外航空总监，转入预备役。1939年战争爆发，他被召回担任国防部特别顾问，并受命组织、训练在法波兰武装力量。法国战败后他退隐，1952年在尼斯去世。"
 CBIO_FRA_georges_valois_desc:0 "乔治·瓦卢瓦，本名阿尔弗雷德-乔治·格雷桑，1878年生于巴黎一个工人与农民家庭，法国记者与政治活动家，其政治轨迹横跨左右两极。他早年是无政府工团主义者，结识工团理论家索雷尔；后投入莫拉斯的\"法兰西行动\"，并取\"瓦卢瓦\"为笔名，1911年创办糅合工团主义与整体民族主义、且公开反犹的\"普鲁东小组\"。一战中他在凡尔登作战负伤。1925年，他与莫拉斯彻底决裂，在科蒂、轩尼诗等大资本家的资助下创建\"法西斯束棒\"（Le Faisceau）——这是意大利之外第一个法西斯运动，成员身着蓝衫、公开效法墨索里尼，比卡尔等人亦曾参与。其后他对墨索里尼日益失望，\"束棒\"于1928年解散，他转而鼓吹工团共和、重新向左，愈发边缘。第二次世界大战中他投身抵抗，秘密撰文揭露通敌财阀；1944年5月被盖世太保逮捕，1945年2月病死于贝尔根-贝尔森集中营。其一生由无政府主义经法西斯主义再回归左翼，最终以抵抗者身殁于纳粹之手。"
 FRA_georges_valois_desc:0 "乔治·瓦卢瓦，本名阿尔弗雷德-乔治·格雷桑，1878年生于巴黎一个工人与农民家庭，法国记者与政治活动家，其政治轨迹横跨左右两极。他早年是无政府工团主义者，结识工团理论家索雷尔；后投入莫拉斯的\"法兰西行动\"，并取\"瓦卢瓦\"为笔名，1911年创办糅合工团主义与整体民族主义、且公开反犹的\"普鲁东小组\"。一战中他在凡尔登作战负伤。1925年，他与莫拉斯彻底决裂，在科蒂、轩尼诗等大资本家的资助下创建\"法西斯束棒\"（Le Faisceau）——这是意大利之外第一个法西斯运动，成员身着蓝衫、公开效法墨索里尼，比卡尔等人亦曾参与。其后他对墨索里尼日益失望，\"束棒\"于1928年解散，他转而鼓吹工团共和、重新向左，愈发边缘。第二次世界大战中他投身抵抗，秘密撰文揭露通敌财阀；1944年5月被盖世太保逮捕，1945年2月病死于贝尔根-贝尔森集中营。其一生由无政府主义经法西斯主义再回归左翼，最终以抵抗者身殁于纳粹之手。"
 CBIO_FRA_henri_marie_auguste_bineau_desc:0 "亨利·玛丽·奥古斯特·比诺，1873年生，法国陆军大将，一位以军事教育与参谋工作见长的高级将领。他1924年晋升准将，1928年升少将并出任军区司令，1935年擢升陆军大将，获荣誉军团大十字勋章。其履历多在军校与参谋系统：曾任高等军事学院副院长兼教务长、陆军总参谋部副参谋长、第三十一步兵师师长、勒芒第四军区司令、高等军事研究中心主任等职，1935年起为最高军事委员会委员。1938年他转入预备役，翌年战争爆发又被召回，出任陆军的高级参谋职务，参与1939至1940年法军的指挥与行政体系。法国战败后，他于1940年彻底退役。于1944年去世。"
 FRA_henri_marie_auguste_bineau_desc:0 "亨利·玛丽·奥古斯特·比诺，1873年生，法国陆军大将，一位以军事教育与参谋工作见长的高级将领。他1924年晋升准将，1928年升少将并出任军区司令，1935年擢升陆军大将，获荣誉军团大十字勋章。其履历多在军校与参谋系统：曾任高等军事学院副院长兼教务长、陆军总参谋部副参谋长、第三十一步兵师师长、勒芒第四军区司令、高等军事研究中心主任等职，1935年起为最高军事委员会委员。1938年他转入预备役，翌年战争爆发又被召回，出任陆军的高级参谋职务，参与1939至1940年法军的指挥与行政体系。法国战败后，他于1940年彻底退役。于1944年去世。"
 CBIO_FRA_paul_baudouin_desc:0 "保罗·博杜安，1894年生于巴黎一个富裕家庭，法国银行家、政治家，维希政权首任外交部长。他毕业于巴黎综合理工学院，一战中任炮兵与航空军官，后为财政监察官，1930年起执掌东方汇理银行（印度支那银行），并多次出使意大利、与齐亚诺过从甚密，公开倾慕墨索里尼。他是天主教徒、\"法兰西行动\"旧人。1940年3月，他经保罗·雷诺延揽入阁、任战时内阁秘书，6月转任外交国务秘书。法国战败之际，他与财政部长布蒂里耶等人共同推动停战，并在雷诺身边安插亲信、排挤主战派，是促成停战的重要推手之一。6月17日，他出任贝当政府外交部长，当日即请西班牙转达对德停战之请；他还把传唤戴高乐出庭受审的叛国传票转交对方。1940年10月，他与贝当、赖伐尔等一道签署排犹的《犹太人地位法》，难辞其咎。因与赖伐尔不和，他在蒙图瓦尔会晤后辞去外长，旋短暂任新闻部长，又重回印度支那银行任董事长。解放后他被撤职、潜逃，1946年在偷越西班牙边境时被捕，1947年被判终身褫夺公权、没收财产并处苦役，后改判监禁。他于1964年去世。"
 FRA_paul_baudouin_desc:0 "保罗·博杜安，1894年生于巴黎一个富裕家庭，法国银行家、政治家，维希政权首任外交部长。他毕业于巴黎综合理工学院，一战中任炮兵与航空军官，后为财政监察官，1930年起执掌东方汇理银行（印度支那银行），并多次出使意大利、与齐亚诺过从甚密，公开倾慕墨索里尼。他是天主教徒、\"法兰西行动\"旧人。1940年3月，他经保罗·雷诺延揽入阁、任战时内阁秘书，6月转任外交国务秘书。法国战败之际，他与财政部长布蒂里耶等人共同推动停战，并在雷诺身边安插亲信、排挤主战派，是促成停战的重要推手之一。6月17日，他出任贝当政府外交部长，当日即请西班牙转达对德停战之请；他还把传唤戴高乐出庭受审的叛国传票转交对方。1940年10月，他与贝当、赖伐尔等一道签署排犹的《犹太人地位法》，难辞其咎。因与赖伐尔不和，他在蒙图瓦尔会晤后辞去外长，旋短暂任新闻部长，又重回印度支那银行任董事长。解放后他被撤职、潜逃，1946年在偷越西班牙边境时被捕，1947年被判终身褫夺公权、没收财产并处苦役，后改判监禁。他于1964年去世。"
 CBIO_FRA_paul_reynaud_desc:0 "保罗·雷诺，1878年生于上普罗旺斯阿尔卑斯省的巴塞洛奈特，法国律师、政治家，第三共和国倒数第二任总理。他出身民主共和联盟（温和右翼），是经济自由主义者，1928年起长期任巴黎选区众议员，历任财政、殖民地、司法等部部长，尤以反对1938年慕尼黑协定、并力主发展戴高乐所倡的装甲部队而著称。1940年3月，他出任总理兼外交部长；德军入侵后，他亲掌国防，先后召贝当入阁、以魏刚替换甘末林，又起用戴高乐为国防部副国务秘书。面对溃败，他坚拒停战，主张把舰队与空军撤往北非、依托殖民帝国继续作战，并支持丘吉尔提出的英法联合方案，却在内阁中不敌以贝当、魏刚为首的主张停战投降的一派。6月16日，他被迫辞职，并建议由贝当继任——此举客观上为停战与维希铺平了道路，至今仍受争议。9月初他被贝当下令逮捕，作为战败责任人先后囚于沙泽隆、波塔莱堡；1942年南方区被占后，他被德军掳往德国关押，直至1945年获释。战后他重返政坛，任北方省众议员并出任财政部长等职，又参与欧洲委员会事务。于1966年去世。"
 FRA_paul_reynaud_desc:0 "保罗·雷诺，1878年生于上普罗旺斯阿尔卑斯省的巴塞洛奈特，法国律师、政治家，第三共和国倒数第二任总理。他出身民主共和联盟（温和右翼），是经济自由主义者，1928年起长期任巴黎选区众议员，历任财政、殖民地、司法等部部长，尤以反对1938年慕尼黑协定、并力主发展戴高乐所倡的装甲部队而著称。1940年3月，他出任总理兼外交部长；德军入侵后，他亲掌国防，先后召贝当入阁、以魏刚替换甘末林，又起用戴高乐为国防部副国务秘书。面对溃败，他坚拒停战，主张把舰队与空军撤往北非、依托殖民帝国继续作战，并支持丘吉尔提出的英法联合方案，却在内阁中不敌以贝当、魏刚为首的主张停战投降的一派。6月16日，他被迫辞职，并建议由贝当继任——此举客观上为停战与维希铺平了道路，至今仍受争议。9月初他被贝当下令逮捕，作为战败责任人先后囚于沙泽隆、波塔莱堡；1942年南方区被占后，他被德军掳往德国关押，直至1945年获释。战后他重返政坛，任北方省众议员并出任财政部长等职，又参与欧洲委员会事务。于1966年去世。"
 CBIO_FRA_gaston_henry_haye_desc:0 "加斯顿·亨利·海耶，1890年生于维苏，铁匠之子，幼年丧父，法国商人、政治家、外交官。他少年时游历英、美、德、俄诸国，深谙美国国情；一战中以士兵从军，屡获嘉奖。两战之间他历任塞纳-瓦兹省议员、众议员与参议员，1935年起出任凡尔赛市长，颇有政绩，在退伍军人界声望甚高。1940年7月，他投票授予贝当全权；停战后，他被维希任命为驻美国大使，接替圣康坦。在华盛顿，他被视为纳粹傀儡政权的代表而备受冷遇，美国联邦调查局对其严加监视，使馆更被指容留德方特工活动。1942年盟军登陆北非、美维断交后，他被美方拘禁，1944年初经外交人员交换得返法国。他始终效忠贝当、拒绝倒戈——回国后既遭贝当责备（贝当以为他若当初抗命、改穿美军军装作战，反倒会得到原谅），又被两个抵抗组织缺席判处死刑，被迫转入地下、远遁南非。他虽未被最高法院正式追究，却就此退出政坛。1972年他著书追述这段经历，仍自陈反戴高乐、反共而又反德，并重申拥护贝当。于1983年以93岁高龄去世。"
 FRA_gaston_henry_haye_desc:0 "加斯顿·亨利·海耶，1890年生于维苏，铁匠之子，幼年丧父，法国商人、政治家、外交官。他少年时游历英、美、德、俄诸国，深谙美国国情；一战中以士兵从军，屡获嘉奖。两战之间他历任塞纳-瓦兹省议员、众议员与参议员，1935年起出任凡尔赛市长，颇有政绩，在退伍军人界声望甚高。1940年7月，他投票授予贝当全权；停战后，他被维希任命为驻美国大使，接替圣康坦。在华盛顿，他被视为纳粹傀儡政权的代表而备受冷遇，美国联邦调查局对其严加监视，使馆更被指容留德方特工活动。1942年盟军登陆北非、美维断交后，他被美方拘禁，1944年初经外交人员交换得返法国。他始终效忠贝当、拒绝倒戈——回国后既遭贝当责备（贝当以为他若当初抗命、改穿美军军装作战，反倒会得到原谅），又被两个抵抗组织缺席判处死刑，被迫转入地下、远遁南非。他虽未被最高法院正式追究，却就此退出政坛。1972年他著书追述这段经历，仍自陈反戴高乐、反共而又反德，并重申拥护贝当。于1983年以93岁高龄去世。"
 CBIO_FRA_emile_laure_desc:0 "埃米尔·洛尔，1881年生于沃克吕兹省的阿普特，法国陆军大将，贝当的亲信幕僚。他早年长期在贝当的参谋班子中任职，与贝当关系密切。战前他出任第九军区司令，战争爆发时统第九军，1940年法国战役中指挥第八集团军在洛林前线作战，至6月战败时被俘。经贝当出面交涉，他在蒙图瓦尔会晤后获释，旋即出任\"国家元首办公厅秘书长\"，成为贝当\"侍从班子\"之首，权位仅次于贝当本人，并兼任\"法兰西退伍军人团\"总监。他属于效忠贝当的元帅派，相对疏离赖伐尔式的积极通敌一翼，但毕竟身居维希权力中枢、为该政权效力。1942年4月赖伐尔回朝后，他失去秘书长之职，逐渐淡出。于1957年去世。"
 FRA_emile_laure_desc:0 "埃米尔·洛尔，1881年生于沃克吕兹省的阿普特，法国陆军大将，贝当的亲信幕僚。他早年长期在贝当的参谋班子中任职，与贝当关系密切。战前他出任第九军区司令，战争爆发时统第九军，1940年法国战役中指挥第八集团军在洛林前线作战，至6月战败时被俘。经贝当出面交涉，他在蒙图瓦尔会晤后获释，旋即出任\"国家元首办公厅秘书长\"，成为贝当\"侍从班子\"之首，权位仅次于贝当本人，并兼任\"法兰西退伍军人团\"总监。他属于效忠贝当的元帅派，相对疏离赖伐尔式的积极通敌一翼，但毕竟身居维希权力中枢、为该政权效力。1942年4月赖伐尔回朝后，他失去秘书长之职，逐渐淡出。于1957年去世。"
 CBIO_FRA_charles_tillon_desc:0 "查尔斯·蒂隆，1897年生于雷恩，金属工人出身，法国共产党人、工会领袖、抵抗运动重要人物。一战中他应征入海军，1919年成为黑海干涉中\"吉申\"号兵变的首领之一，被判五年苦役、押往摩洛哥服刑，获减刑后回到工厂。此后他加入法共与统一总工会（CGTU），在工会与党内步步擢升，1932年入党中央委员会，1936年当选奥贝维利埃众议员，并曾赴西班牙内战。1939年法共被取缔后，他转入地下；法国战败后不久，他便发表号召抵抗\"希特勒法西斯\"的宣言——彼时党内尚有人谋求与占领者妥协、以使《人道报》合法复刊，他的姿态因而格外鲜明。他成为法共地下三巨头之一，并自1941年起创建、统领共产党武装\"自由射手与游击队\"（FTP），任全国军事委员会主席，是抵抗运动中举足轻重的军事领导人。解放后他历任空军部长、军备部长、重建部长（1944—1947），并入选制宪议会、长期任奥贝维利埃市长。1952年，他与马蒂同遭斯大林式整肃（\"马蒂-蒂隆事件\"），被指\"宗派活动\"而被剥夺一切职务；1957年一度恢复，1970年终因抨击党对捷克斯洛伐克\"正常化\"的立场而被开除出党。于1993年去世。"
 FRA_charles_tillon_desc:0 "查尔斯·蒂隆，1897年生于雷恩，金属工人出身，法国共产党人、工会领袖、抵抗运动重要人物。一战中他应征入海军，1919年成为黑海干涉中\"吉申\"号兵变的首领之一，被判五年苦役、押往摩洛哥服刑，获减刑后回到工厂。此后他加入法共与统一总工会（CGTU），在工会与党内步步擢升，1932年入党中央委员会，1936年当选奥贝维利埃众议员，并曾赴西班牙内战。1939年法共被取缔后，他转入地下；法国战败后不久，他便发表号召抵抗\"希特勒法西斯\"的宣言——彼时党内尚有人谋求与占领者妥协、以使《人道报》合法复刊，他的姿态因而格外鲜明。他成为法共地下三巨头之一，并自1941年起创建、统领共产党武装\"自由射手与游击队\"（FTP），任全国军事委员会主席，是抵抗运动中举足轻重的军事领导人。解放后他历任空军部长、军备部长、重建部长（1944—1947），并入选制宪议会、长期任奥贝维利埃市长。1952年，他与马蒂同遭斯大林式整肃（\"马蒂-蒂隆事件\"），被指\"宗派活动\"而被剥夺一切职务；1957年一度恢复，1970年终因抨击党对捷克斯洛伐克\"正常化\"的立场而被开除出党。于1993年去世。"
 CBIO_FRA_vincent_auriol_desc:0 "樊尚·奥里奥尔，1884年生于上加龙省的勒韦尔，面包师之子，法国社会党（工人国际法国支部，SFIO）政治家，第四共和国首任总统。他在图卢兹攻读法律，受饶勒斯影响早年即投身社会主义。1914年起长期任米雷众议员，1920年图尔大会后随布鲁姆拒绝加入共产国际、参与重建SFIO，渐成该党财政事务的权威。1936年人民阵线胜选，他出任布鲁姆政府财政部长，主持法郎贬值、推行金融改革，一度引发争议；其后又任司法部长等职。他反对慕尼黑协定。1940年7月10日，他是投票反对授予贝当全权的\"八十人\"之一，并拒绝登上\"马西利亚\"号；随后被维希逮捕、监禁，与雷诺、芒代尔等同囚一处，继而被软禁于米雷。1942年起他转入地下，藏身于阿韦龙与塔恩山区，1943年10月辗转抵达伦敦、加入战斗法国，并出任阿尔及尔临时咨询议会议员。战后他任国务部长、两届制宪议会议长，主张在共产主义与戴高乐主义之间走\"第三种力量\"之路。1947年1月，他当选第四共和国首任总统，成为法国首位社会党籍国家元首，任内经历印度支那战争、马歇尔计划与法国加入北约等大事。他于1966年元旦去世。"
 FRA_vincent_auriol_desc:0 "樊尚·奥里奥尔，1884年生于上加龙省的勒韦尔，面包师之子，法国社会党（工人国际法国支部，SFIO）政治家，第四共和国首任总统。他在图卢兹攻读法律，受饶勒斯影响早年即投身社会主义。1914年起长期任米雷众议员，1920年图尔大会后随布鲁姆拒绝加入共产国际、参与重建SFIO，渐成该党财政事务的权威。1936年人民阵线胜选，他出任布鲁姆政府财政部长，主持法郎贬值、推行金融改革，一度引发争议；其后又任司法部长等职。他反对慕尼黑协定。1940年7月10日，他是投票反对授予贝当全权的\"八十人\"之一，并拒绝登上\"马西利亚\"号；随后被维希逮捕、监禁，与雷诺、芒代尔等同囚一处，继而被软禁于米雷。1942年起他转入地下，藏身于阿韦龙与塔恩山区，1943年10月辗转抵达伦敦、加入战斗法国，并出任阿尔及尔临时咨询议会议员。战后他任国务部长、两届制宪议会议长，主张在共产主义与戴高乐主义之间走\"第三种力量\"之路。1947年1月，他当选第四共和国首任总统，成为法国首位社会党籍国家元首，任内经历印度支那战争、马歇尔计划与法国加入北约等大事。他于1966年元旦去世。"
 CBIO_FRA_zivony_peshkov_desc:0 "济诺维·佩什科夫，本名扎尔曼·斯韦尔德洛夫，1884年生于俄国下诺夫哥罗德一个犹太家庭，后入法国籍，传奇般的外籍军团军官与外交官。他是布尔什维克领袖雅科夫·斯韦尔德洛夫的兄长，兄弟二人却走上截然相反的道路；他又是大作家高尔基的教子与养子，因受洗为东正教、改姓高尔基的本姓\"佩什科夫\"而被生父逐出家门。第一次世界大战爆发，身为外国人的他志愿加入法国外籍军团，1915年在阿拉斯附近的卡朗西激战中右臂被打断、被迫截肢——据说下令将他抬下战场的，正是青年军官戴高乐。此后他独臂作战，被军团官兵称作\"了不起的独臂人\"。1917年他随法国使团赴俄，劝说临时政府继续对德作战。两战之间他入籍法国、重返军团，参加摩洛哥里夫战争、再度负伤，并辗转出任外交使节。第二次世界大战中他投奔自由法国，受戴高乐之命在非洲各地奔走、为自由法国军队筹措军械，被破格擢升为将军，又先后出使重庆的蒋介石政府和战后日本。他于1966年在巴黎去世，墓碑上只刻一行字：\"济诺维·佩什科夫，外籍军团士兵\"。"
 FRA_zivony_peshkov_desc:0 "济诺维·佩什科夫，本名扎尔曼·斯韦尔德洛夫，1884年生于俄国下诺夫哥罗德一个犹太家庭，后入法国籍，传奇般的外籍军团军官与外交官。他是布尔什维克领袖雅科夫·斯韦尔德洛夫的兄长，兄弟二人却走上截然相反的道路；他又是大作家高尔基的教子与养子，因受洗为东正教、改姓高尔基的本姓\"佩什科夫\"而被生父逐出家门。第一次世界大战爆发，身为外国人的他志愿加入法国外籍军团，1915年在阿拉斯附近的卡朗西激战中右臂被打断、被迫截肢——据说下令将他抬下战场的，正是青年军官戴高乐。此后他独臂作战，被军团官兵称作\"了不起的独臂人\"。1917年他随法国使团赴俄，劝说临时政府继续对德作战。两战之间他入籍法国、重返军团，参加摩洛哥里夫战争、再度负伤，并辗转出任外交使节。第二次世界大战中他投奔自由法国，受戴高乐之命在非洲各地奔走、为自由法国军队筹措军械，被破格擢升为将军，又先后出使重庆的蒋介石政府和战后日本。他于1966年在巴黎去世，墓碑上只刻一行字：\"济诺维·佩什科夫，外籍军团士兵\"。"
 CBIO_FRA_pierre_pucheu_desc:0 "皮埃尔·普舒，1899年生于博蒙叙尔瓦兹，裁缝之子，凭奖学金考入巴黎高等师范学校（与布拉西亚克、萨特同代），后弃文从商，成为钢铁业巨头、欧洲钢铁卡特尔的核心人物。1934年起他投身极右，先后亲近\"火十字团\"与多里奥的法兰西人民党。法国战败后，他于1941年2月经达尔朗起用为工业生产部长，同年7月又被贝当任命为内政国务秘书，直至1942年4月赖伐尔回朝。任内他对抵抗运动严加镇压，组建多支反共、反共济会与排犹的特别警察，并卷入向德方交付人质之事——1941年10月，沙托布里扬等地的人质（多为共产党人，著名的少年居伊·莫凯即在其中）遭德军枪决，他被指曾从名单中圈定人选；他始终辩称是为了让\"好法国人\"免遭厄运而有意指向共产党人，无论如何都难辞其咎。盟军登陆北非后，他不再相信德国会胜，企图改换门庭、投奔吉罗，1943年辗转抵达北非却被逮捕。1944年3月，他作为头一个受审的维希部长，被阿尔及尔军事法庭判处死刑；戴高乐拒绝赦免。3月20日他被枪决，临刑时坚持亲自向行刑队下令开枪，高呼\"法兰西万岁\"。"
 FRA_pierre_pucheu_desc:0 "皮埃尔·普舒，1899年生于博蒙叙尔瓦兹，裁缝之子，凭奖学金考入巴黎高等师范学校（与布拉西亚克、萨特同代），后弃文从商，成为钢铁业巨头、欧洲钢铁卡特尔的核心人物。1934年起他投身极右，先后亲近\"火十字团\"与多里奥的法兰西人民党。法国战败后，他于1941年2月经达尔朗起用为工业生产部长，同年7月又被贝当任命为内政国务秘书，直至1942年4月赖伐尔回朝。任内他对抵抗运动严加镇压，组建多支反共、反共济会与排犹的特别警察，并卷入向德方交付人质之事——1941年10月，沙托布里扬等地的人质（多为共产党人，著名的少年居伊·莫凯即在其中）遭德军枪决，他被指曾从名单中圈定人选；他始终辩称是为了让\"好法国人\"免遭厄运而有意指向共产党人，无论如何都难辞其咎。盟军登陆北非后，他不再相信德国会胜，企图改换门庭、投奔吉罗，1943年辗转抵达北非却被逮捕。1944年3月，他作为头一个受审的维希部长，被阿尔及尔军事法庭判处死刑；戴高乐拒绝赦免。3月20日他被枪决，临刑时坚持亲自向行刑队下令开枪，高呼\"法兰西万岁\"。"
 CBIO_FRA_pierre_alombert_goget_desc:0 "皮埃尔·阿隆伯特·哥吉特，1888年生于巴黎，法国陆军将领，出身军人世家，其父保罗亦为高级将领。他毕业于圣西尔军校（1908—1911年的\"毛里塔尼亚\"期）。1940年法国战役中，他出任第一集团军参谋长。第一集团军隶属比约特的第一集团军群，是法军北上比利时迎敌的主力之一：5月中旬，普里乌的机械化军在阿努—让布卢一带与德军装甲部队展开会战，为第一集团军在迪尔河一线展开争取了时间。随着阿登突破后北线战局急转直下，第一集团军边打边退，主力最终被合围于里尔口袋；它在敦刻尔克大撤退前后的顽强支撑，客观上为数十万英法联军渡海赢得了宝贵时间。作为参谋长，阿隆伯特·哥吉特正处于这场恶战的指挥中枢。他于1972年去世。其生平是1940年法军北线众多参谋军官的一个缩影。"
 FRA_pierre_alombert_goget_desc:0 "皮埃尔·阿隆伯特·哥吉特，1888年生于巴黎，法国陆军将领，出身军人世家，其父保罗亦为高级将领。他毕业于圣西尔军校（1908—1911年的\"毛里塔尼亚\"期）。1940年法国战役中，他出任第一集团军参谋长。第一集团军隶属比约特的第一集团军群，是法军北上比利时迎敌的主力之一：5月中旬，普里乌的机械化军在阿努—让布卢一带与德军装甲部队展开会战，为第一集团军在迪尔河一线展开争取了时间。随着阿登突破后北线战局急转直下，第一集团军边打边退，主力最终被合围于里尔口袋；它在敦刻尔克大撤退前后的顽强支撑，客观上为数十万英法联军渡海赢得了宝贵时间。作为参谋长，阿隆伯特·哥吉特正处于这场恶战的指挥中枢。他于1972年去世。其生平是1940年法军北线众多参谋军官的一个缩影。"
 CBIO_FRA_joseph_doumenc_desc:0 "约瑟夫·杜芒，1880年生于格勒诺布尔，法国陆军大将，以后勤组织见长，又被视为陆军机械化合成作战的先驱。他毕业于巴黎综合理工学院，第一次世界大战中主管汽车运输部门，1916年凡尔登战役期间正是他组织起那条以卡车昼夜不息维持补给与换防的\"圣路\"（Voie Sacrée），声名鹊起；两战之间他在1927—1928年间已提出坦克与步兵混编的前瞻构想。1938年他入最高军事委员会。1939年8月，他晋升陆军大将，受命率法国军事代表团赴莫斯科，与英方代表及伏罗希洛夫谈判一项对德军事协定，却因苏德互不侵犯条约的签订而功败垂成——后世多认为，谈判失败的根源不在代表团本身，而在达拉第、张伯伦对苏联同盟的迟疑。战争爆发后他先主管本土防空，1940年1月起在陆军大本营（GQG）出任\"军务总长\"（major général），主持总参谋部的日常运作，曾力图在阿登一线阻挡德军，直至第九集团军被彻底击溃。停战之初他短暂任\"国家重建总署专员\"，1942年初离开军队，转而著书研究法国军事史。1948年7月，他在阿尔卑斯横越白冰川时坠入冰隙身亡。"
 FRA_joseph_doumenc_desc:0 "约瑟夫·杜芒，1880年生于格勒诺布尔，法国陆军大将，以后勤组织见长，又被视为陆军机械化合成作战的先驱。他毕业于巴黎综合理工学院，第一次世界大战中主管汽车运输部门，1916年凡尔登战役期间正是他组织起那条以卡车昼夜不息维持补给与换防的\"圣路\"（Voie Sacrée），声名鹊起；两战之间他在1927—1928年间已提出坦克与步兵混编的前瞻构想。1938年他入最高军事委员会。1939年8月，他晋升陆军大将，受命率法国军事代表团赴莫斯科，与英方代表及伏罗希洛夫谈判一项对德军事协定，却因苏德互不侵犯条约的签订而功败垂成——后世多认为，谈判失败的根源不在代表团本身，而在达拉第、张伯伦对苏联同盟的迟疑。战争爆发后他先主管本土防空，1940年1月起在陆军大本营（GQG）出任\"军务总长\"（major général），主持总参谋部的日常运作，曾力图在阿登一线阻挡德军，直至第九集团军被彻底击溃。停战之初他短暂任\"国家重建总署专员\"，1942年初离开军队，转而著书研究法国军事史。1948年7月，他在阿尔卑斯横越白冰川时坠入冰隙身亡。"
 CBIO_FRA_roger_salengro_desc:0 "罗杰·萨伦格罗，1890年生，法国社会党人，里尔市长、北方省众议员。一战中，1915年他在前去抢运一名阵亡战友遗体时被德军俘虏（事前得到长官许可），其间一度遭诬，但军事法庭很快查明真相、为他洗清。1936年人民阵线胜选后，他出任布鲁姆政府内政部长，积极促成马蒂尼翁协议，并着手解散极右联盟。然而当年夏天起，莫拉斯的《法兰西行动报》与亨利·贝罗主持的右翼周刊《格兰古瓦》掀起一场恶毒的诽谤战，诬称他一战中曾临阵脱逃；尽管军方调查再度予以驳斥，造谣却经久不息，并被极右议员搬上议会讲坛。本已因数月前丧妻而陷入抑郁的萨伦格罗，终于不堪重负，于1936年11月17日在里尔家中自尽，留下\"过劳与诽谤，实在太重，悲伤击垮了我……他们没能让我蒙羞，至少要为我的死负责\"的遗言。布鲁姆在葬礼上沉痛而愤怒地痛斥\"诽谤之毒无药可解\"。"
 FRA_roger_salengro_desc:0 "罗杰·萨伦格罗，1890年生，法国社会党人，里尔市长、北方省众议员。一战中，1915年他在前去抢运一名阵亡战友遗体时被德军俘虏（事前得到长官许可），其间一度遭诬，但军事法庭很快查明真相、为他洗清。1936年人民阵线胜选后，他出任布鲁姆政府内政部长，积极促成马蒂尼翁协议，并着手解散极右联盟。然而当年夏天起，莫拉斯的《法兰西行动报》与亨利·贝罗主持的右翼周刊《格兰古瓦》掀起一场恶毒的诽谤战，诬称他一战中曾临阵脱逃；尽管军方调查再度予以驳斥，造谣却经久不息，并被极右议员搬上议会讲坛。本已因数月前丧妻而陷入抑郁的萨伦格罗，终于不堪重负，于1936年11月17日在里尔家中自尽，留下\"过劳与诽谤，实在太重，悲伤击垮了我……他们没能让我蒙羞，至少要为我的死负责\"的遗言。布鲁姆在葬礼上沉痛而愤怒地痛斥\"诽谤之毒无药可解\"。"
 CBIO_FRA_maurice_gauche_desc:0 "莫里斯-亨利·高谢，约1880年生，诺曼底人，法国陆军军官、情报主官，一战时的步兵军官。1937年起，他出任法军总参谋部第二局（Deuxième Bureau）局长，主管对外军事情报，直至1940年。第二局是一支以密码破译见长、却也因德雷福斯事件的旧污点与对德军力的一贯高估而备受争议的机构。高谢任内，第二局对纳粹德国的扩军备战与意图作了大量侦察，并密切跟踪希特勒德国的政治动向。然而1940年的惨败表明，问题往往不在情报之有无，而在最高指挥部能否善加运用——\"我们在1940年5月究竟有没有情报？\"日后成为史家反复争论的话题，第二局所提供的预警，并未转化为正确的作战决断。战后他著有《工作中的第二局，1935—1940》一书，为这段历史留下了当事人的记述。其生平折射出法国军事情报在1940年崩溃中的位置与局限。"
 FRA_maurice_gauche_desc:0 "莫里斯-亨利·高谢，约1880年生，诺曼底人，法国陆军军官、情报主官，一战时的步兵军官。1937年起，他出任法军总参谋部第二局（Deuxième Bureau）局长，主管对外军事情报，直至1940年。第二局是一支以密码破译见长、却也因德雷福斯事件的旧污点与对德军力的一贯高估而备受争议的机构。高谢任内，第二局对纳粹德国的扩军备战与意图作了大量侦察，并密切跟踪希特勒德国的政治动向。然而1940年的惨败表明，问题往往不在情报之有无，而在最高指挥部能否善加运用——\"我们在1940年5月究竟有没有情报？\"日后成为史家反复争论的话题，第二局所提供的预警，并未转化为正确的作战决断。战后他著有《工作中的第二局，1935—1940》一书，为这段历史留下了当事人的记述。其生平折射出法国军事情报在1940年崩溃中的位置与局限。"
 CBIO_FRA_philippe_henriot_desc:0 "菲利普·亨里奥，1889年生，法国诗人、记者、政治家，虔诚的天主教徒，维希政权的新闻与宣传国务秘书，被称为\"法国的戈培尔\"。他原是文学教师与业余昆虫学家，1924年起主办波尔多的天主教报纸、转入政治，1932至1940年间任吉伦特省众议员，以言辞犀利、好作挑衅著称。他属天主教民族主义右翼，反共、反犹、反共济会、反议会，原本反德，却在希特勒上台后转向亲德、赞成慕尼黑协定。法国战败后他投身对德合作，在维希电台与巴黎电台发表约270次广播，以蛊惑性的口才攻击抵抗运动、伦敦的自由法国与英国广播公司，听众极众。1943年他加入民兵团（Milice）。1944年1月，在德国大使阿贝茨力荐、贝当并不情愿之下，他出任新闻与宣传国务秘书——与达尔南、戴亚同时入阁，标志着维希滑向最激进的合作。其广播流毒之广，使统一抵抗组织决定将他除掉：1944年6月28日，一支抵抗突击队冒充民兵潜入他在巴黎索尔费里诺街的官邸，将他击毙——他是抵抗运动击杀的第一个全国性政要。维希为他举行国葬。"
 FRA_philippe_henriot_desc:0 "菲利普·亨里奥，1889年生，法国诗人、记者、政治家，虔诚的天主教徒，维希政权的新闻与宣传国务秘书，被称为\"法国的戈培尔\"。他原是文学教师与业余昆虫学家，1924年起主办波尔多的天主教报纸、转入政治，1932至1940年间任吉伦特省众议员，以言辞犀利、好作挑衅著称。他属天主教民族主义右翼，反共、反犹、反共济会、反议会，原本反德，却在希特勒上台后转向亲德、赞成慕尼黑协定。法国战败后他投身对德合作，在维希电台与巴黎电台发表约270次广播，以蛊惑性的口才攻击抵抗运动、伦敦的自由法国与英国广播公司，听众极众。1943年他加入民兵团（Milice）。1944年1月，在德国大使阿贝茨力荐、贝当并不情愿之下，他出任新闻与宣传国务秘书——与达尔南、戴亚同时入阁，标志着维希滑向最激进的合作。其广播流毒之广，使统一抵抗组织决定将他除掉：1944年6月28日，一支抵抗突击队冒充民兵潜入他在巴黎索尔费里诺街的官邸，将他击毙——他是抵抗运动击杀的第一个全国性政要。维希为他举行国葬。"
 CBIO_FRA_jean_romatet_desc:0 "让·C. 罗马泰，1893年生于科西嘉岛的博尔戈，法国空军将领，一战的王牌飞行员（取得7次空战胜利）。他原属骑兵，一战中转入航空。两战之间他历任要职，曾出任驻法属赤道非洲的航空指挥官，又任空军参谋部第二副参谋长，1939年3月晋升空军准将；1940年法国战役中，他指挥设于拉昂的第23战斗机集群，正面承受德军空中攻势。法国战败后，1940年9月他出任维希\"停战空军\"的参谋长，先后辅佐航空国务秘书贝热雷与珍妮肯，并因此先后晋升空军中将、空军上将。他与贝热雷一道，确立了一套以\"对德谈判换生存\"为核心的空军路线，力图在苛刻的停战条件下保住一支残余空军。1942年11月德军进占南方区、停战军被解散后，他一度设法保全空军、监督其复员，但当他看清德方只想攫取法国的物资与设施时，终于在1943年3月愤而辞职、请假退役，不再向维希谋求任何职位。他于1975年去世。"
 FRA_jean_romatet_desc:0 "让·C. 罗马泰，1893年生于科西嘉岛的博尔戈，法国空军将领，一战的王牌飞行员（取得7次空战胜利）。他原属骑兵，一战中转入航空。两战之间他历任要职，曾出任驻法属赤道非洲的航空指挥官，又任空军参谋部第二副参谋长，1939年3月晋升空军准将；1940年法国战役中，他指挥设于拉昂的第23战斗机集群，正面承受德军空中攻势。法国战败后，1940年9月他出任维希\"停战空军\"的参谋长，先后辅佐航空国务秘书贝热雷与珍妮肯，并因此先后晋升空军中将、空军上将。他与贝热雷一道，确立了一套以\"对德谈判换生存\"为核心的空军路线，力图在苛刻的停战条件下保住一支残余空军。1942年11月德军进占南方区、停战军被解散后，他一度设法保全空军、监督其复员，但当他看清德方只想攫取法国的物资与设施时，终于在1943年3月愤而辞职、请假退役，不再向维希谋求任何职位。他于1975年去世。"
 CBIO_FRA_felix_gouin_desc:0 "费利克斯·古安，1884年生于罗讷河口省的佩潘，教师之子，法国社会党（SFIO）律师、政治家与抵抗者，第四共和国前夜的临时政府首脑。他是马赛律师，1924年起任艾克斯选区社会党众议员，1938年成为社会党议会党团副主席、布鲁姆的亲密合作者。他赞成慕尼黑协定，却绝不接受失败主义：1940年7月10日，他是投票反对授予贝当全权的\"八十人\"之一。其后他参与重建地下社会党、创建社会主义行动委员会，并在1942年里永审判中担任布鲁姆的辩护律师之一——那场审判本欲把战败之责加于第三共和国领袖，反被布鲁姆、达拉第在庭上反将一军。奉布鲁姆之命，他于1942年取道西班牙（一度被关进米兰达拘留营）辗转抵达伦敦，又赴阿尔及尔，主持临时咨询议会、出任议长。1945年他当选第一届制宪议会议长。1946年1月戴高乐骤然辞职后，他被推举为临时政府首脑（任至同年6月），任内确立了法国最早的强制性退休与工伤保险制度、恢复四十小时工作周，并签订法美经济协定。此后他历任副总理、计划部长等职。1958年他因反对新宪法而与社会党主流决裂，退出政坛。于1977年去世。"
 FRA_felix_gouin_desc:0 "费利克斯·古安，1884年生于罗讷河口省的佩潘，教师之子，法国社会党（SFIO）律师、政治家与抵抗者，第四共和国前夜的临时政府首脑。他是马赛律师，1924年起任艾克斯选区社会党众议员，1938年成为社会党议会党团副主席、布鲁姆的亲密合作者。他赞成慕尼黑协定，却绝不接受失败主义：1940年7月10日，他是投票反对授予贝当全权的\"八十人\"之一。其后他参与重建地下社会党、创建社会主义行动委员会，并在1942年里永审判中担任布鲁姆的辩护律师之一——那场审判本欲把战败之责加于第三共和国领袖，反被布鲁姆、达拉第在庭上反将一军。奉布鲁姆之命，他于1942年取道西班牙（一度被关进米兰达拘留营）辗转抵达伦敦，又赴阿尔及尔，主持临时咨询议会、出任议长。1945年他当选第一届制宪议会议长。1946年1月戴高乐骤然辞职后，他被推举为临时政府首脑（任至同年6月），任内确立了法国最早的强制性退休与工伤保险制度、恢复四十小时工作周，并签订法美经济协定。此后他历任副总理、计划部长等职。1958年他因反对新宪法而与社会党主流决裂，退出政坛。于1977年去世。"
 CBIO_FRA_jacques_duclos_desc:0 "雅克·杜克洛，1896年生于上比利牛斯省的卢埃，糕点学徒出身，法国共产党长期核心领导人之一。一战中他在凡尔登负伤、又在贵妇小径被俘。1920年图尔大会后他加入法共，1926年当选众议员（击败了保罗·雷诺），渐成党内财政与组织事务的要角，并深度介入共产国际与共产党情报局的事务，是忠实追随莫斯科、辅佐多列士的\"大脑\"。1939年苏德互不侵犯条约签订、法共被取缔后，他流亡布鲁塞尔，坚定服从共产国际路线。法国战败后，1940年6至8月间，他与特雷昂奉莫斯科之意，曾与德国占领当局接触、谋求《人道报》合法复刊——此事彻底落空，却长期损害法共声誉；其后他出任地下法共的最高负责人（1940—1944），是党内地下宣传的主笔。直至1941年6月德国入侵苏联，法共才转入全面抗德，他与维永等发起\"民族阵线\"。战后他任议员、参议员，1950—1953年因多列士病重而代理总书记。1952年冷战正酣，他在反对美国将领李奇微访巴黎的示威后被捕，警方在其车中搜出两只鸽子，遂炮制出子虚乌有的\"鸽子阴谋\"——其实那不过是两只准备炖食的死鸽。1969年他参选总统，以逾两成得票名列第三。于1975年去世。"
 FRA_jacques_duclos_desc:0 "雅克·杜克洛，1896年生于上比利牛斯省的卢埃，糕点学徒出身，法国共产党长期核心领导人之一。一战中他在凡尔登负伤、又在贵妇小径被俘。1920年图尔大会后他加入法共，1926年当选众议员（击败了保罗·雷诺），渐成党内财政与组织事务的要角，并深度介入共产国际与共产党情报局的事务，是忠实追随莫斯科、辅佐多列士的\"大脑\"。1939年苏德互不侵犯条约签订、法共被取缔后，他流亡布鲁塞尔，坚定服从共产国际路线。法国战败后，1940年6至8月间，他与特雷昂奉莫斯科之意，曾与德国占领当局接触、谋求《人道报》合法复刊——此事彻底落空，却长期损害法共声誉；其后他出任地下法共的最高负责人（1940—1944），是党内地下宣传的主笔。直至1941年6月德国入侵苏联，法共才转入全面抗德，他与维永等发起\"民族阵线\"。战后他任议员、参议员，1950—1953年因多列士病重而代理总书记。1952年冷战正酣，他在反对美国将领李奇微访巴黎的示威后被捕，警方在其车中搜出两只鸽子，遂炮制出子虚乌有的\"鸽子阴谋\"——其实那不过是两只准备炖食的死鸽。1969年他参选总统，以逾两成得票名列第三。于1975年去世。"
 CBIO_FRA_marcel_deat_desc:0 "马塞尔·戴亚，1894年生于涅夫勒省的盖里尼，巴黎高师出身、哲学教师资格获得者，曾是饶勒斯的崇拜者与社会党（SFIO）的\"希望之星\"，最终却堕为最狂热的通敌者之一。一战中他作战英勇，两战之间在学界与政坛同时崭露头角，1926年起任马恩省众议员。1930年他发表《社会主义的前景》，转向以\"计划经济\"和威权国家为核心的\"新社会主义\"；1933年因与布鲁姆决裂被开除出社会党，另组以\"秩序、权威、民族\"为口号的法兰西社会党。1936年他在萨罗内阁出任空军部长（并非布鲁姆政府）。1939年5月4日，他在《作品报》发表名文《为但泽而死？》，鼓吹绥靖与失败主义。法国战败后他执掌《作品报》、力主全面投靠纳粹德国，1941年1月创建由德国大使阿贝茨出资的\"民族人民集会\"（RNP），自称\"社会主义与欧洲主义\"，实则鼓吹国家社会主义，与多里奥的法兰西人民党争锋，却为贝当所厌恶。1944年3月，在德国人推动下，他出任赖伐尔政府的劳动与民族团结部长（与亨里奥、达尔南同列）。同年8月他随维希残余逃往锡格马林根；战后流亡意大利，化名藏身于都灵附近一所修道院，皈依天主教、撰写回忆录，1945年被缺席判处死刑却始终未落网，1955年病死于异乡。"
 FRA_marcel_deat_desc:0 "马塞尔·戴亚，1894年生于涅夫勒省的盖里尼，巴黎高师出身、哲学教师资格获得者，曾是饶勒斯的崇拜者与社会党（SFIO）的\"希望之星\"，最终却堕为最狂热的通敌者之一。一战中他作战英勇，两战之间在学界与政坛同时崭露头角，1926年起任马恩省众议员。1930年他发表《社会主义的前景》，转向以\"计划经济\"和威权国家为核心的\"新社会主义\"；1933年因与布鲁姆决裂被开除出社会党，另组以\"秩序、权威、民族\"为口号的法兰西社会党。1936年他在萨罗内阁出任空军部长（并非布鲁姆政府）。1939年5月4日，他在《作品报》发表名文《为但泽而死？》，鼓吹绥靖与失败主义。法国战败后他执掌《作品报》、力主全面投靠纳粹德国，1941年1月创建由德国大使阿贝茨出资的\"民族人民集会\"（RNP），自称\"社会主义与欧洲主义\"，实则鼓吹国家社会主义，与多里奥的法兰西人民党争锋，却为贝当所厌恶。1944年3月，在德国人推动下，他出任赖伐尔政府的劳动与民族团结部长（与亨里奥、达尔南同列）。同年8月他随维希残余逃往锡格马林根；战后流亡意大利，化名藏身于都灵附近一所修道院，皈依天主教、撰写回忆录，1945年被缺席判处死刑却始终未落网，1955年病死于异乡。"
 CBIO_FRA_philippe_petain_desc:0 "菲利浦·贝当，1856年生于加来海峡省的科希阿拉图尔，农家子弟，1876年入圣西尔军校。第一次世界大战中，他率法军赢得历时九个月的凡尔登血战，被尊为\"凡尔登的胜利者\"；1917年尼维勒攻势失败、前线哗变之际，他出任总司令、整肃军纪、安抚士卒；1918年获法国元帅杖，成为举国敬仰的\"活的传奇\"。两战之间他位居军界最高层，曾任最高军事委员会副主席、陆军总监，1925年赴摩洛哥平定里夫战争，1934年短暂任陆军部长，1939年出使西班牙。1940年5月德军突破默兹河防线，雷诺召他入阁；6月16日雷诺辞职并举荐他组阁，他随即于次日宣告将求停战，22日签订停战协定。7月10日两院授予他全权，第三共和国就此变为\"法兰西国\"（即维希政权）——年已八十四岁的他出任国家元首，以\"劳动、家庭、祖国\"取代共和国格言，推行\"民族革命\"。然而其政权走上对德合作之路：蒙图瓦尔会晤、维希自行颁布的排犹《犹太人地位法》、以及对犹太人的逮捕与遣送，他都难辞其咎（法国对此的责任，1995年由希拉克总统正式承认）；随着政权日益激进，他渐成一面象征性招牌，却始终未曾真正与之切割。1944年8月他被德军挟往锡格马林根，1945年4月经瑞士自愿回国受审。当年7至8月，最高法院判他犯通敌与叛国罪、处以死刑；戴高乐念其年迈与昔日功勋，改判终身监禁。他先后被囚于波尔塔莱堡与大西洋上的约岛，1951年7月23日卒于岛上，享年九十五岁。"
