 CBIO_ITA_papa_pio_xii_desc:0 "1876年3月2日生于罗马，俗名欧金尼奥·帕切利，出身深度嵌入梵蒂冈体制的法律世家，以严谨冷峻的外交型神职人员气质在教廷阶梯上稳步攀升。其历史争议的伏笔，在教宗任职之前便已埋下。1917至1929年出任教廷驻德国大使，深度了解德国政治与天主教会处境。1933年7月，以国务卿身份代表梵蒂冈与纳粹德国签署《帝国协议》（Reichskonkordat），目标是保护德国天主教会的制度权益。批评者认为这赋予了纳粹政权宝贵的国际合法性，辩护者视之为恶劣条件下保护教会的唯一可行路径，双方争论延续至今。1939年3月就任教宗，六个月后欧战爆发。整个二战期间，他始终未以教宗名义明确谴责纳粹对犹太人的系统性屠杀。1942年圣诞演讲以\"数十万人因民族或出身遭杀害\"含糊指涉，刻意回避点名纳粹。梵蒂冈在被占罗马期间向若干犹太人及政治难民提供了庇护，但这一私下援助是否足以替代公开谴责的缺失，至今仍是核心争点。辩护方主张公开谴责将招致更残酷的纳粹报复；批评方则认为以教廷道德权威，沉默本身即是选边站。战后他以强烈反共立场介入冷战格局，积极支持基督教民主党对抗1948年大选中的左翼联盟，是近代梵蒂冈最主动介入欧洲世俗政治的教宗之一。\"沉默的教宗\"之称由德国剧作家霍赫胡特1963年话剧《代理人》（Der Stellvertreter）定型，其封圣进程因历史争议至今悬而未决。1958年10月9日辞世。"
