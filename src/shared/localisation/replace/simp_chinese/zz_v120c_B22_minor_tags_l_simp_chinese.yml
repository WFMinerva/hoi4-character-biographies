l_simp_chinese:
 CBIO_LBV_robert_von_habsburg_desc:0 "生于1915年2月8日，是奥匈帝国末代皇帝卡尔一世与皇后齐塔的次子。1917年，其父将奥地利-埃斯特大公封号授予他，使他成为哈布斯堡幼支埃斯特遗产的继承人，1918年君主制废除后他仍保留这一称号。此后全家流亡，先后旅居瑞士，西班牙，比利时等地。第二次世界大战期间他身处英国，反对纳粹德国，并通过与英国官方接触为奥地利独立奔走。1953年，他与萨伏依-奥斯塔王女玛格丽塔成婚。1996年2月7日，罗伯特在瑞士巴塞尔去世，时年八十岁，恰在其八十一岁生日前一天，长子洛伦茨继承其大公称号。"
 LBV_robert_von_habsburg_desc:0 "$CBIO_LBV_robert_von_habsburg_desc$"
 CBIO_MEK_christian_louis_desc:0 "克里斯蒂安·路易生于1912年9月29日，出生地为路德维希斯卢斯特，是梅克伦堡-什未林末代在位大公腓特烈·弗朗茨四世与王妃汉诺威的亚历山德拉之次子。1918年其父退位，君主制随之废除。1935年他入骑兵团服役，1939年随部队卷入第二次世界大战，1944年因属前统治家族成员而被解除军职。战争结束时，家乡路德维希斯卢斯特落入苏联占领区，他为照看家族产业返回当地，遭苏联军方逮捕并被押往莫斯科，在卢比扬卡监狱被判处二十五年监禁。1953年，经阿登纳为滞留苏联的德国战俘出面交涉后，他获释返乡。此后他成为梅克伦堡家族首领，1954年与普鲁士的芭芭拉公主成婚。1996年7月18日在黑默尔马克庄园去世。"
 MEK_christian_louis_desc:0 "$CBIO_MEK_christian_louis_desc$"
 CBIO_MEL_zinovy_zhadinov_desc:0 "苏联联共布党务干部，其姓氏更准确的音译为扎德诺夫，全名季诺维·雅科夫列维奇·扎德诺夫，1904年10月生于下诺夫哥罗德省松诺夫卡村，即今下诺夫哥罗德州帕夫洛沃区一带，俄罗斯族。他1924年加入联共布，几乎整个职业生涯都在共青团与党的机构中度过，曾在下诺夫哥罗德即后来的高尔基边疆区历任边疆区国民教育部副部长，边疆区党委文化处处长，干部处副处长，以及工业运输处，苏维埃贸易处处长等职。1937年11月起，他出任马里自治共和国州委第一书记，并兼任约什卡尔奥拉市委第一书记，同期当选苏联首届最高苏维埃代表。他是苏联内务人民委员部特别三人组成员，也是1937至1938年大清洗镇压的积极参与者。然而清洗的浪潮很快也吞噬了他本人，1938年5月，他以从事反革命恐怖活动的罪名被捕并被判处死刑，同年8月28日在莫斯科州科穆纳尔卡刑场被枪决，年仅三十三岁。1956年4月28日，因原案不成立而获得平反。"
 MEL_zinovy_zhadinov_desc:0 "$CBIO_MEL_zinovy_zhadinov_desc$"
 CBIO_NOA_vasily_lemayev_desc:0 "瓦西里·彼得罗维奇·列马耶夫生于1902年，出生地为新斯洛博达村，即今下诺夫哥罗德州阿尔扎马斯区一带。1921年加入布尔什维克党，曾参加俄国内战。此后他长期在基层党务与苏维埃系统任职，历任乡，区两级党委的负责职务，并在高尔基边疆区党委任指导员，又任克孜勒十月区党委第一书记。1937年至1938年，他出任北奥塞梯州党委第一书记。此后他继续在高尔基州从事党务与苏维埃工作。1991年去世。"
 NOA_vasily_lemayev_desc:0 "$CBIO_NOA_vasily_lemayev_desc$"
 CBIO_OKN_hiroshi_sho_desc:0 "尚裕生于1918年9月18日，出生于东京，是尚昌的长子，琉球王家第二尚氏第二十二代当主。其父于1923年去世，他因而袭封侯爵。他毕业于东京帝国大学文学部，曾任海军大尉，并在任内迎来战争结束。战后，他致力于保存免于战火的琉球传承文物，自1975年起自费主持复原识名园，使其翌年重获国家名胜指定，此后又陆续参与玉陵及崇元寺石墙等的修复。1992年，他将玉陵，识名园等捐赠那霸市，其后又向那霸市捐出尚家世传古文书一千三百余件及美术工艺品数十件，这批资料于2006年被指定为国宝，是冲绳战后首例国宝指定。1996年，他获授那霸市名誉市民称号。1997年8月30日，尚裕在那霸市的冲绳红十字医院去世。"
 OKN_hiroshi_sho_desc:0 "$CBIO_OKN_hiroshi_sho_desc$"
 CBIO_PAL_harold_macmichael_desc:0 "英国殖民官员，全名哈罗德·阿尔弗雷德·麦克迈克尔，生于1882年10月15日。他早年考入英国文官系统，长期在英埃苏丹任职，由蓝尼罗河省一路升至苏丹政务秘书，1933年至1937年出任坦噶尼喀总督。1938年，他就任英国委任统治巴勒斯坦的第五任高级专员，任内推行1939年白皮书，大幅限制犹太人向巴勒斯坦的移民与购地。1942年，他拒绝让载有数百名犹太难民的斯特鲁马号入境，该船其后在黑海沉没，他因此受到犹太社群的强烈谴责。在巴勒斯坦期间，他先后多次遭遇暗杀，行刺者主要来自莱希即斯特恩集团，1944年8月8日的一次伏击令他与妻子险些丧命，不久他即卸任。此后他受命与马来统治者签订马来亚联邦相关条约。1969年9月19日去世。"
 PAL_harold_macmichael_desc:0 "$CBIO_PAL_harold_macmichael_desc$"
 CBIO_PAL_ahmed_hilmi_pasha_desc:0 "艾哈迈德·希尔米帕夏，全名艾哈迈德·希尔米·阿卜杜勒巴基，约生于1883年，出生于奥斯曼帝国治下的赛达即今黎巴嫩境内，系阿尔巴尼亚裔，时人称其为阿尔纳乌提即阿尔巴尼亚人。他曾在奥斯曼军队服役，1920年在费萨尔的叙利亚阿拉伯王国政府任财政部门负责人，后又在外约旦掌理财政，并因监理希贾兹铁路获授帕夏称号。1925年起，他在委任统治巴勒斯坦担任伊斯兰瓦克夫宗教产业总监，又投身银行业，参与创办阿拉伯银行，并自立阿拉伯民族银行。他是独立党早期成员，1936年任阿拉伯高等委员会司库，1937年被流放至塞舌尔。1948年，约旦国王阿卜杜拉任命他为耶路撒冷军事总督，同年9月阿拉伯联盟推举他出任全巴勒斯坦政府总理，名义元首为阿明·侯赛尼。1963年，他在黎巴嫩的苏克加尔卜去世，归葬耶路撒冷。"
 PAL_ahmed_hilmi_pasha_desc:0 "$CBIO_PAL_ahmed_hilmi_pasha_desc$"
 CBIO_PAL_amin_al_husseini_desc:0 "阿明·侯赛尼，全名穆罕默德·阿明·侯赛尼，约生于1897年，出生于耶路撒冷的侯赛尼望族。1921年，英国高级专员赫伯特·塞缪尔任命他为耶路撒冷大穆夫提，他由此成为巴勒斯坦阿拉伯人的宗教与政治领袖，坚决反对犹太复国主义及犹太人向巴勒斯坦移民。他是1936年至1939年巴勒斯坦阿拉伯大起义的领导者，1937年为躲避英方通缉出逃，辗转黎巴嫩，伊拉克，后经意大利前往纳粹德国。第二次世界大战期间，他与轴心国合作，1941年11月与希特勒会面，通过广播散布反英，反犹宣传，并协助在波斯尼亚为武装党卫军招募穆斯林兵员，组建汉查尔师。战后一度被法方拘押，1946年逃往埃及，继续从事巴勒斯坦民族主义活动，并曾任全巴勒斯坦政府名义元首。1974年7月4日在贝鲁特去世。"
 PAL_amin_al_husseini_desc:0 "$CBIO_PAL_amin_al_husseini_desc$"
 CBIO_PAL_bulus_farah_desc:0 "生于1910年，巴勒斯坦阿拉伯基督徒工会活动家与马克思主义者。1925年，十五岁的他进入海法铁路工场当学徒，由此走上劳工组织的道路。他是巴勒斯坦共产党最早一批赴莫斯科东方劳动者共产主义大学深造的阿拉伯领袖之一。1942年，他脱离巴勒斯坦共产党，创建阿拉伯工会与劳工团体联合会。1944年，他参与创立民族解放同盟。1945年，他出席在伦敦举行的世界工会大会。1947年，他因反对联合国分治方案而被逐出民族解放同盟，另行组建一个小型异见共产主义团体。此后他留在海法，晚年移居拿撒勒，著有回忆录，记述自奥斯曼末期至以色列建国之间海法铁路工人与阿拉伯工会运动的历史。1991年去世。"
 PAL_bulus_farah_desc:0 "$CBIO_PAL_bulus_farah_desc$"
 CBIO_PRE_eitel_friedrich_desc:0 "艾特尔·腓特烈，全名威廉·艾特尔·腓特烈·克里斯蒂安·卡尔，生于1883年7月7日，出生于波茨坦，是德皇威廉二世与首任皇后石勒苏益格-荷尔斯泰因的奥古斯塔·维多利亚之次子。他是一名职业军官，第一次世界大战期间在前线指挥普鲁士第一步兵近卫团，在巴波姆负伤，1915年获颁功勋勋章。1907年至1926年，他任圣约翰骑士团大团长。1906年，他与奥尔登堡的索菲·夏洛特公爵夫人成婚，两人无子女，1926年离婚。1921年，柏林法院曾判定他犯有欺诈性转移三十万马克的行为。战后他活跃于君主派圈子及钢盔团。1942年12月8日，艾特尔·腓特烈在波茨坦去世，纳粹当局不准其葬礼采用军事礼仪，并禁止出席者身着军装。"
 PRE_eitel_friedrich_desc:0 "$CBIO_PRE_eitel_friedrich_desc$"
 CBIO_RHI_josef_friedrich_matthes_desc:0 "约瑟夫·弗里德里希·马特斯生于1886年2月10日，出生于维尔茨堡。他早年从事新闻业，曾任社会民主党在阿沙芬堡的党报编辑，后被开除出党，1921年因诽谤罪被判刑，遂逃往当时由法国占领的威斯巴登。1923年初，他参与创建莱茵兰独立同盟，鼓吹莱茵兰脱离德国。同年10月，他与支持者在科布伦茨发动政变，宣告成立莱茵共和国并自任领导人，新政权主要依赖法国占领当局及所谓莱茵兰保护部队维系。至11月，占领军与反对分离主义者之间的冲突演成骚乱与流血，民众抵抗强烈，1923年11月28日，马特斯宣布解散分离主义政府。此后他流亡法国，尽管当局颁布大赦，他仍被禁止返回德国。1943年10月9日去世。"
 RHI_josef_friedrich_matthes_desc:0 "$CBIO_RHI_josef_friedrich_matthes_desc$"
 CBIO_RIF_abd_el_krim_desc:0 "阿卜杜·克里姆，全名穆罕默德·本·阿卜杜勒克里姆·哈塔比，1882年1月12日生于摩洛哥里夫地区阿季迪尔，柏柏尔人，父为伊斯兰法官。他曾任梅利利亚首席法官，深知西班牙殖民弊端，1917年因主张西班牙撤出里夫被捕，越狱时摔断腿骨，此后终生跛行。1920年他与弟弟姆哈马德举兵反抗西班牙，次年致信西班牙将领西尔维斯特雷，警告其部若渡过阿梅克兰河即属宣战，对方不以为意强渡，里夫军随即在安瓦尔痛歼西班牙军数千人，西尔维斯特雷阵亡，他由此成为里夫共和国总统与现代游击战先驱，战术后来影响胡志明，毛泽东与切·格瓦拉。建国后他仿现代国家设法庭，货币，道路与学堂，并禁绝部落血仇，一时被视为二十世纪由反殖民战争催生的第一个共和国，美国记者文森特·希恩曾乔装穿越战线深入采访，他也因此登上美国时代周刊封面。1925年他挥师直逼非斯，法西联军二十五万在贝当统率下出动，并对里夫军民施放芥子毒气，历经十月激战方将其击败。1926年他为免更多牺牲而降，被流放留尼汪岛二十一年。1947年迁居法国途中，他在摩洛哥民族主义者接应下于苏伊士运河塞得港脱身，转投开罗，受埃及国王法鲁克庇护，此后主持马格里布解放委员会。摩洛哥独立后，穆罕默德五世邀他归国，他以法军仍驻北非为由拒绝。1963年2月6日，他在开罗去世，恰在阿尔及利亚独立后不久。"
 RIF_abd_el_krim_desc:0 "$CBIO_RIF_abd_el_krim_desc$"
 CBIO_RKA_heinrich_schnee_desc:0 "海因里希·施内，全名阿尔贝特·赫尔曼·海因里希·施内，生于1871年2月4日，出生于诺伊哈尔登斯莱本，是德国法学家，殖民地文官，政治家兼作家。他早年在海德堡，基尔与柏林攻读法律，1897年进入外交部，先后在德属新几内亚与德属萨摩亚任副总督，1911年任帝国殖民部政治行政司司长。1912年至1918年，他出任德属东非末代总督，任内适逢第一次世界大战爆发，虽名义上握有最高军事指挥权，却在防御方略上与保护部队指挥官莱托-福尔贝克将军不合，后者的游击战策略最终占据上风。1919年，他率归国官兵与部队穿过柏林勃兰登堡门。魏玛时期，他以德意志人民党身份出任国会议员，1932年退党，1933年至1945年又以纳粹党身份保留国会席位。他是德国殖民修正主义的代表人物之一，长期著书立说，鼓吹收回失去的殖民地。1949年6月23日去世。"
 RKA_heinrich_schnee_desc:0 "$CBIO_RKA_heinrich_schnee_desc$"
 CBIO_RKB_josef_grohe_desc:0 "约瑟夫·格罗埃生于1902年11月6日，出生于洪斯吕克的格明登，纳粹党官员。他少年时即投身反民主与种族主义团体，1922年加入纳粹党，并参与创建科隆地方党组织，1926年起主办纳粹报纸西德观察家报。1931年，他出任新设的科隆-亚琛大区长官，直至1945年4月一直担任此职。1933年后，他历任普鲁士枢密顾问，国会议员等职。他是激烈的反犹分子，曾公开鼓吹抵制并加害犹太人。1944年7月，他被任命为新设立的比利时暨北法兰西帝国专员，任内加紧镇压抵抗运动，包括处决人质，但盟军自当年9月起解放该地区，他实际已无从施政。战争末期他曾企图自杀，后化名潜逃，1946年被逮捕并判处徒刑，始终不曾悔改己见。1987年12月27日去世。"
 RKB_josef_grohe_desc:0 "$CBIO_RKB_josef_grohe_desc$"
 CBIO_GER_walter_warlimont_desc:0 "瓦尔特·瓦利蒙特生于1894年10月3日，出生于奥斯纳布吕克，是德国陆军参谋军官与将领。1914年一战前夕他任炮兵少尉，战时在法国与意大利前线服役。两次大战之间，他历任参谋职务，曾赴美国研习工业动员，1936年西班牙内战期间作为德国国防军全权代表联络佛朗哥。1937年，他起草瓦利蒙特备忘录，主张将德国武装力量统一于一个统帅之下，希特勒据此组建国防军最高统帅部。1939年9月至1944年9月，他在阿尔弗雷德·约德尔手下任国防军指挥参谋部副参谋长，参与拟定入侵波兰，法国，苏联等作战计划，并经手臭名昭著的政委命令。1944年他晋升炮兵上将，同年7月20日在刺杀希特勒的爆炸中负伤。战后，他在最高统帅部审判中被判定为战犯，1948年获判无期徒刑，后减为十八年，1954年获释。1976年10月9日在克罗伊特去世。"
 GER_walter_warlimont_desc:0 "$CBIO_GER_walter_warlimont_desc$"
 CBIO_RKK_arno_schickedanz_desc:0 "阿尔诺·席克丹茨生于1892年12月27日，出生于里加，是波罗的海德意志人，纳粹党官员与理论宣传者。他自幼与纳粹思想家阿尔弗雷德·罗森堡相识，长期在罗森堡领导的机构中任职，历任纳粹党外交政策处参谋长等要职，并曾主持反犹日报民族观察家报的柏林分部。他是狂热的反犹分子，撰有宣扬犹太人为寄生种族的著作，并因参加啤酒馆政变而跻身纳粹老战士之列。1941年，他被指定为拟设立的高加索帝国专员辖区专员，但该辖区因德军在东线未能取得足够控制而始终停留于纸面。1945年4月，在苏军进攻柏林前夕，席克丹茨杀害妻女后自杀身亡。"
 RKK_arno_schickedanz_desc:0 "$CBIO_RKK_arno_schickedanz_desc$"
 CBIO_RKM_siegfried_kasche_desc:0 "西格弗里德·卡舍生于1903年6月18日，出生于施特劳斯贝格，是纳粹党政治人物与冲锋队上级集团领袖。他1925年加入冲锋队，次年加入纳粹党，1930年当选国会议员，曾主持将占领区原住民迁走，代之以冲锋队移民的农业殖民计划。1941年，他被派往外交界，出任纳粹德国驻克罗地亚独立国大使，全力支持帕韦利奇及乌斯塔沙政权，参与针对塞尔维亚人，犹太人等族群的迫害，希特勒甚至称他比帕韦利奇更像克罗地亚人。同年7月，他被指定为拟设立的莫斯科帝国专员，但因德军在东线受挫，该辖区从未成立。战后，他被引渡回南斯拉夫，由克罗地亚人民共和国最高法院以战犯罪名审判，1947年6月7日被处以绞刑。"
 RKM_siegfried_kasche_desc:0 "$CBIO_RKM_siegfried_kasche_desc$"
 CBIO_RKO_hinrich_lohse_desc:0 "欣里奇·洛瑟生于1896年9月2日，出生于米伦巴贝克，是纳粹党官员与冲锋队上级集团领袖，战后被定为战犯。他1923年加入纳粹党，1925年起任石勒苏益格-荷尔斯泰因大区长官，1933年又兼任该省最高长官，集党政大权于一身。1941年7月，德军占领波罗的海地区后，他被任命为东方总督辖区帝国专员，辖区涵盖立陶宛，拉脱维亚，爱沙尼亚及白俄罗斯部分地区。作为该地民政首脑，他推行德意志化政策，与针对犹太人，罗姆人的大规模屠杀及对当地民众的压迫难脱干系，尽管他曾以有碍战时经济为由对屠杀提出过异议。1944年秋，他在苏军进逼下擅自弃职逃回石勒苏益格-荷尔斯泰因。战后他被英军拘押，1948年被判十年监禁，1951年因病获释。1964年2月25日去世。"
 RKO_hinrich_lohse_desc:0 "$CBIO_RKO_hinrich_lohse_desc$"
 CBIO_RKT_weli_kayum_khan_desc:0 "维里·卡尤姆-汗生于1904年7月15日，出生于塔什干，是乌兹别克即突厥斯坦民族主义者。1920年代，他作为留学生来到柏林，攻读农业与政治学。自1930年代起，他与纳粹德国合作。第二次世界大战期间，他自1942年8月起出任设于柏林的突厥斯坦民族统一委员会主席，该委员会隶属于德国东方占领区事务部，他并参与组织由突厥系战俘编成的突厥斯坦军团，通过广播等方式从事反苏宣传。他也是纳粹拟设立的突厥斯坦帝国专员辖区在突厥斯坦一方的顾问，而该辖区始终未能成立。1993年8月13日卒。"
 RKT_weli_kayum_khan_desc:0 "$CBIO_RKT_weli_kayum_khan_desc$"
 CBIO_RKU_erich_koch_desc:0 "埃里希·科赫生于1896年6月19日，出生于埃尔伯费尔德即今伍珀塔尔一带，是纳粹党官员与战犯。1922年他加入纳粹党，1928年起任东普鲁士大区长官，直至1945年。第二次世界大战期间，他兼任比亚韦斯托克专区民政首长，并自1941年9月起出任乌克兰帝国专员，握有盖世太保与警察大权，1944年9月又接替洛瑟兼任东方总督辖区帝国专员。他以极端残暴著称，到任乌克兰后即关闭当地学校，公然宣称德意志人是主宰民族，视斯拉夫人为可任意驱使的劣等人，任内约有二百五十万乌克兰人被掳往德国充当强制劳工，他也深涉对犹太人的迫害与大规模屠杀。战败后他化名潜逃，1949年被捕并引渡波兰，1959年以战犯罪名被判死刑，后减为无期徒刑。1986年11月12日，他在波兰巴尔切沃监狱中病死，至死不曾悔改。"
 RKU_erich_koch_desc:0 "$CBIO_RKU_erich_koch_desc$"
 CBIO_RNA_theodor_seitz_desc:0 "特奥多尔·塞茨生于1863年9月12日，出生于曼海姆，是德国法学家与殖民地总督。他早年在海德堡攻读法律，后进入外交部与殖民系统任职，1907年5月至1910年出任德属喀麦隆总督，1910年8月转任德属西南非洲即今纳米比亚总督。第一次世界大战爆发后，该殖民地遭英国与南非联军入侵，寡不敌众的德军于1915年7月投降，塞茨随之被拘押，直至1919年才遣返回德。回国后，他于1920年至1930年间担任德国殖民协会主席，是主张收回海外殖民地的殖民修正主义者。1949年3月28日，他在巴登-巴登去世。"
 RNA_theodor_seitz_desc:0 "$CBIO_RNA_theodor_seitz_desc$"
 CBIO_RNG_sun_dianying_desc:0 "孙殿英生于1889年，字魁元，河南永城人，民国时期军阀。他行伍出身，早年辗转投靠直系，镇嵩军，奉军等多股势力。1928年投效国民革命军后，他以军事演习为名，盗掘清东陵中乾隆的裕陵与慈禧的定东陵，大肆搜罗珍宝以充军饷，事发后靠向高层行贿压下此案，由此得名东陵大盗。1933年热河抗战期间，他率部在赤峰一带与日军激战数昼夜，颇得舆论称许。然而1943年在河南对日作战失利后，他转投汪精卫政权，出任对日合作的伪职。抗日战争胜利后，他又归附蒋介石，任国民革命军中将。1947年，他在豫北被解放军俘虏，同年9月30日病死于河北武安的战俘营中。"
 RNG_sun_dianying_desc:0 "$CBIO_RNG_sun_dianying_desc$"
 CBIO_RWA_mutara_rudahigwa_desc:0 "穆塔拉三世·鲁达希瓜生于1911年3月，出生于卢旺达王都尼安扎，是图西族阿巴尼吉尼亚氏族成员，末代卢旺达国王尤希五世穆辛加之子。1931年，比利时殖民当局废黜其父后，他继位为卢旺达国王，在位至1959年。他是首位皈依天主教的卢旺达国王，1943年受洗，教名查尔斯·莱昂·皮埃尔，1946年将全国奉献于基督，使天主教几近成为国教。1954年，他废除了图西领主役使胡图人的乌布哈克制度。1956年，他公开要求脱离比利时独立。1959年7月25日，他在布琼布拉突然去世，死因扑朔迷离，坊间对其是否遭比利时当局暗害多有揣测。其王位由同父异母弟弟基盖利五世继承。"
 RWA_mutara_rudahigwa_desc:0 "$CBIO_RWA_mutara_rudahigwa_desc$"
 CBIO_SAX_george_of_saxony_desc:0 "格奥尔格生于1893年1月15日，出生于德累斯顿，是萨克森末代王储，末代萨克森国王腓特烈·奥古斯特三世之子，在1918年君主制被废时身为王位继承人。第一次世界大战中，他在前线作战并腿部负重伤，1915年获颁一级铁十字勋章。父亲退位后，他决意放弃王位继承权而投身宗教，1923年正式弃位，成为一名天主教司铎与耶稣会士，时人称其为格奥尔格神父。他在柏林工作，身为神职人员与政权批评者而受盖世太保监视，曾帮助犹太人离境，并掩护反对派人士。1943年5月14日，他在柏林格罗斯格利尼克湖游泳时溺水身亡，岸边寻获的日记末页写着一句拉丁文，意为我往父那里去。"
 SAX_george_of_saxony_desc:0 "$CBIO_SAX_george_of_saxony_desc$"
 CBIO_SHL_hermann_ludemann_desc:0 "赫尔曼·吕德曼生于1880年8月5日，出生于吕贝克，是德国工程师，工会领袖与社会民主党政治家。他早年习机械与轮机工程，曾参与创建并领导技术职员与公务员联合会，1912年加入社会民主党。魏玛时期，他历任普鲁士邦议会议员，普鲁士财政部长，以及下西里西亚省最高长官等职。纳粹上台后，他遭到迫害，1933年被捕，一度关押于多座集中营。此后他与莱伯，格德勒等抵抗人士有所往来，1944年七二零事件后再度被捕，一度受审获释，却仍被关押至战争结束方获苏军解救。战后，他重返政坛，1947年至1949年出任石勒苏益格-荷尔斯泰因州首任民选州总理，任内致力于安置难民，重建经济与推行土地改革。1959年5月27日，他在基尔去世。"
 SHL_hermann_ludemann_desc:0 "$CBIO_SHL_hermann_ludemann_desc$"
 CBIO_SOK_siddiq_abubakar_desc:0 "西迪克·阿布巴卡尔三世生于1903年3月15日，出生于丹盖，是尼日利亚穆斯林领袖，伊斯兰教改革家奥斯曼·丹·福迪奥的直系后裔。他早年受伊斯兰教育，曾任地方书吏与索科托土著行政机构参事。1938年6月17日，他继承叔父之位，成为第十七任索科托苏丹即穆斯林统领，在位长达五十余年，是历任索科托苏丹中在位最久者。他在英国间接统治与尼日利亚独立前后均具重要影响力，1944年获英王封为大英帝国爵级司令勋衔，独立后又获颁尼日尔国大司令勋衔。他曾任北方酋长院主席与多所大学校长，提倡女子教育，并在1966年政变与内战等动荡中致力于维系北方地区的秩序与安定。1988年11月1日，他在苏丹任上去世，身后留有五十二名子女。"
 SOK_siddiq_abubakar_desc:0 "$CBIO_SOK_siddiq_abubakar_desc$"
 CBIO_TAT_alexandr_alemasov_desc:0 "亚历山大·米哈伊洛维奇·阿列马索夫生于1902年，出生于兹拉托乌斯特，是苏联党务与国家安全干部。他早年投身契卡与内务机关，1937年7月出任鞑靼自治共和国内务人民委员即内务部长，同年8月起代理鞑靼州委第一书记，1938年正式就任，直至1942年。他持国家安全上尉衔，是鞑靼内务人民委员部特别三人组成员，被视为1937至1938年鞑靼大清洗的主要组织者之一，任内大批干部，作家与基层人员遭到逮捕镇压。此后他历任列宁斯克-库兹涅茨基，托木斯克，克列缅丘格等地市委第一书记，1948年因病退职。1972年12月，他在沃罗涅日去世。"
 TAT_alexandr_alemasov_desc:0 "$CBIO_TAT_alexandr_alemasov_desc$"
 CBIO_THU_erwin_baum_desc:0 "埃尔温·鲍姆生于1868年2月25日，出生于萨克森-阿尔滕堡的劳施维茨，是德国农场主，行业协会活动家与政治家，先后属德意志国家人民党，图林根农民同盟等。他自1919年起活跃于图林根农民同盟，1931年至1932年任该同盟主席，并于1920年至1932年间任图林根邦议会议员。1930年1月至1932年8月，他出任图林根邦政府主席兼财政部长。他领导的鲍姆-弗里克政府是德国历史上首个有纳粹党人入阁的邦政府，弗里克即以纳粹党人身份出任内政兼国民教育部长，但鲍姆本人属保守的农民派；他曾拒绝弗里克提名希特勒为教授的动议，因为这会使当时尚无国籍的希特勒借机入籍。1950年3月22日，他在故乡劳施维茨去世。"
 THU_erwin_baum_desc:0 "$CBIO_THU_erwin_baum_desc$"
 CBIO_TOS_joseph_ferdinand_von_habsburg_desc:0 "约瑟夫·斐迪南·冯·哈布斯堡-洛林生于1872年5月24日，出生于萨尔茨堡，是奥地利大公，末代托斯卡纳大公斐迪南四世之子。1908年，他继承父位，成为托斯卡纳名义大公即哈布斯堡-托斯卡纳家族首领。他毕业于维也纳新城军事学院，早年即热心于气球与航空。第一次世界大战期间，他先后指挥奥匈第十四军与第四集团军，1916年布鲁西洛夫攻势中其部溃败而被解职，此后转任奥匈帝国空军总监。战后他退居维也纳，以平民身份生活。1938年德奥合并后，他因反对纳粹而被捕，一度关押于达豪集中营达三个月，健康严重受损，获释后仍长期受盖世太保监视。1942年8月28日，他在维也纳去世。"
 TOS_joseph_ferdinand_von_habsburg_desc:0 "$CBIO_TOS_joseph_ferdinand_von_habsburg_desc$"
 CBIO_TTS_ferdinand_pius_desc:0 "费迪南德·皮乌斯生于1869年7月25日，出生于罗马，全名费迪南多·皮奥·玛丽亚，是波旁-两西西里王朝成员，卡塞塔伯爵阿方索亲王之长子，两西西里国王斐迪南二世之孙。他早年曾在西班牙与巴伐利亚军队中任职，1897年迎娶巴伐利亚国王路德维希三世之女玛丽亚·路德维卡公主。1918年巴伐利亚君主制被废后，他定居于林道的阿姆湖别墅。1934年父亲去世后，他继任波旁-两西西里王朝首领，取卡拉布里亚公爵之号，并作为已不复存在的两西西里王国的王位觊觎者。由于膝下无存世子嗣，他去世后家族首领之位在其侄阿方索一系与其弟拉涅里一系之间产生长期争议。1960年1月7日，他在林道去世。"
 TTS_ferdinand_pius_desc:0 "$CBIO_TTS_ferdinand_pius_desc$"
 CBIO_UBD_heinrich_schlobitten_desc:0 "海因里希·祖·多纳-施洛比滕生于1882年10月15日，出生于东普鲁士柯尼斯堡附近的瓦尔德堡，出身普鲁士著名贵族世家，是德国将领与反纳粹抵抗人士。他早年从军，第一次世界大战中任总参谋部军官，1919年以少校身份退役后转而研习农业，经营田庄。他反对纳粹，曾参与东普鲁士认信教会的兄弟议会。1939年他被重新征召，历任柯尼斯堡第一防区参谋长，中央集团军群参谋长等职，1943年因无法认同希特勒的战争方式而主动请辞离开国防军。他与格德勒，毛奇的克莱绍集团等抵抗力量有所往来，一旦1944年七二零密谋成功，他被预定出任东普鲁士的新任行政长官。密谋失败次日，他即遭逮捕，1944年9月14日经弗莱斯勒的人民法院判处死刑，当日即在柏林普勒岑湖监狱被处决。"
 UBD_heinrich_schlobitten_desc:0 "$CBIO_UBD_heinrich_schlobitten_desc$"
 CBIO_UDM_boris_desc:0 "鲍里斯·伯曼生于1897年，出生于赤塔，是苏联联共布党务干部，全名鲍里斯·扎哈罗维奇·伯曼。他1917年加入共产党，早年在外贝加尔从事地下工作，并参加过远东的国内战争，后又赴中国从事党务，曾就读于东方劳动者共产主义大学与红色教授学院。1934年底，他出任乌德穆尔特州委即后来的乌德穆尔特自治共和国州委第一书记，任至1937年6月，此后转任斯维尔德洛夫斯克州委书记。1937年8月起，他成为斯维尔德洛夫斯克内务人民委员部特别三人组成员，积极参与斯大林大清洗。1938年3月，他本人也遭逮捕，同年7月28日在莫斯科被枪决，1956年获得平反。"
 UDM_boris_desc:0 "$CBIO_UDM_boris_desc$"
 CBIO_WUR_philipp_albrecht_desc:0 "菲利普·阿尔布雷希特·符腾堡生于1893年11月14日，出生于斯图加特，是德国贵族，符腾堡王室首领，一战名将阿尔布雷希特公爵与奥地利大公夫人玛格丽特·索菲之子。他早年入蒂宾根大学攻读法律，旋即于1912年从军，第一次世界大战中在东西两线作战，战后以少校退役。他先后迎娶奥地利大公夫人即托斯卡纳公主海伦娜与其妹罗莎，子女众多。1934年，他因拒绝在府邸升挂纳粹旗帜而被迫迁出斯图加特的王储宫，移居阿尔茨豪森，以反纳粹立场著称。1939年父亲去世后，他继任符腾堡王室首领，成为已废除君主制的王位觊觎者，并接掌家族产业，在符腾堡一地始终颇受敬重。1975年4月15日，他在拉文斯堡去世，享年八十一岁，由其子卡尔继位。"
 WUR_philipp_albrecht_desc:0 "$CBIO_WUR_philipp_albrecht_desc$"
