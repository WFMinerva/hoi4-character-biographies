l_simp_chinese:
 BUL_aleksandar_tsankov_desc:0 "亚历山大·佐洛夫·灿科夫（1879年6月29日—1959年7月27日），索非亚大学政治经济学教授，1922年组建保守派国民联盟，1923年6月9日军事政变推翻斯坦博利伊斯基政府后即出任总理，任职至1926年1月。任内他残酷镇压保共及左翼农民派力量，1925年在沙皇遇刺未遂及索非亚圣周日教堂爆炸案后宣布戒严、取缔保共，共产国际因此斥其政权为胜利的保加利亚法西斯集团；同期与希腊爆发短暂边境冲突。1926年因未能获得外国贷款支持而下台。此后他逐渐转向法西斯主义并崇拜希特勒，1932年仿照纳粹党模式组建民族社会运动，但该运动始终未获纳粹德国正式青睐（后者更倚重保加利亚国民军团联盟），影响力有限。1943年他是右翼阵营中少数联署佩舍夫反对遣送犹太人请愿书的议员之一。1944年9月祖国阵线政变后，纳粹德国在奥地利扶植灿科夫组建保加利亚流亡傀儡政府，为期数月，战后曾被美军拘押于奥地利，获释后流亡阿根廷，1959年在布宜诺斯艾利斯逝世。"
 BUL_angel_dotsev_desc:0 "安杰尔·格奥尔基耶夫·多采夫，保加利亚陆军少将，1941—1942年间曾作为保加利亚军方考察团军官之一被派往德军东线观摩，与康斯坦丁·卢卡什等人一同亲历德军对苏作战。1980年逝世。"
 BUL_asen_nikolov_desc:0 "阿森·尼科洛夫·尼科洛夫（1891年9月12日，生于扬博尔—1946年），1912年毕业于索非亚军校。1923年起在瓦尔纳海岸要塞服役，1934年出任索非亚炮兵学校校长，1936年任第2军事督察区炮兵处处长兼炮兵督察部防空处处长，1938年出任第2色雷斯步兵师师长。1941年起出任保加利亚第1占领军军长，率部协同德军参与占领塞尔维亚的治安作战。1944年9月保加利亚倒戈对德后，他于同年9月4日被德军俘虏。1944年10月，他拒绝参与组建效忠德国一方作战的保加利亚部队。1946年逝世。"
 BUL_asen_toshev_desc:0 "安德烈·斯拉沃夫·托舍夫，斯塔拉扎戈拉人，植物学教授兼职业外交官，1898年当选保加利亚文学学会（保加利亚科学院前身）通讯院士，1931年升任正式院士，长期从事巴尔干地区植物区系研究，著述颇丰。外交生涯始于1908年，先后出任驻黑山（1905—1906）、希腊（1906—1908）、塞尔维亚（1909—1913）及奥斯曼帝国（1913—1915）公使，任驻塞公使期间为促成巴尔干同盟的形成发挥了重要斡旋作用，一战期间转任驻维也纳公使（1915—1919），期间一度兼任驻伯尔尼临时代表。1919年退出职业外交界后专注于保加利亚少数族裔权益保护及历史民族学写作。1935年4月21日，在环节集团军事统治结束、鲍里斯三世发动反政变夺回大权之际，年已68岁的托舍夫受命组阁，成为国王巩固个人统治的过渡性文官内阁负责人，同年11月即因。此后重归学术著述，1944年在索非亚逝世。"
 BUL_blagoi_ivanov_desc:0 "布拉戈伊·伊万诺夫，保加利亚陆军中将。二战期间他是保加利亚共产党领导的人民解放起义军（游击队）核心成员之一，1944年7月起进入该组织领导核心。1944年祖国阵线上台后，在新组建的人民军中晋升中将，曾出任战后组建的保加利亚解放军部队指挥官。"
 BUL_bogdan_filov_desc:0 "波格丹·菲洛夫，斯塔拉扎戈拉人，考古学家出身，曾赴德国莱比锡、弗赖堡、维尔茨堡留学，获古典学及罗马史博士学位，此后长期在波恩、巴黎、罗马研修考古学、博物馆学及钱币学，是保加利亚古典考古学的奠基性人物，1910—1920年任国家考古博物馆馆长，1920年创立并首任保加利亚考古研究所所长，主持发掘迈泽克色雷斯圆顶墓等重要遗址，1929年当选保加利亚科学院院士，获多国科学机构荣誉头衔。1938年出任乔塞瓦诺夫内阁教育大臣，1940年2月接任总理，任内保加利亚成为第七个加入轴心国阵营的国家，1941年3月签署《三国同盟条约》；同年11月其内阁提出、经议会通过的《保卫民族法》确立了针对犹太人的种族歧视立法。1943年鲍里斯三世猝逝后，菲洛夫以总理身份兼任摄政团首席摄政，与基里尔亲王、米霍夫将军共同辅佐幼主西美昂二世。1944年9月祖国阵线政变后被捕，1945年2月1日经共产党主导的人民法庭以战争罪及通敌罪判处死刑，与其他92名前政要同夜遭枪决，弃于炸弹坑集体掩埋，其死刑判决于1996年被保加利亚最高法院撤销平反。"
 BUL_boris_iii_desc:0 "鲍里斯三世（1894年1月30日—1943年8月28日），斐迪南一世长子，1918年10月其父战败退位后即位为沙皇，在位至1943年猝逝。即位初期保加利亚政局动荡，历经农民同盟斯坦博利伊斯基政府、1923年军事政变及九月起义、灿科夫镇压等乱局。1934年环节集团政变解散政党后，鲍里斯于1935年发动反政变夺回实权，此后以国王政府名义推行事实上的君主个人独裁，不再恢复政党政治。二战爆发后力图中立，1940年借轴心国斡旋从罗马尼亚收回南多布罗加，1941年3月被迫签署《三国同盟条约》倒向轴心，并借德军之势占领南斯拉夫、希腊部分领土；但他拒绝向苏联宣战，仅对英美象征性宣战。1941年批准通过带有种族歧视色彩的《保卫民族法》，但1943年面对纳粹要求遣送本土犹太人时以筑路劳工需要为由一再拖延，在国内舆论及东正教会领袖压力下最终实际拒绝执行遣送令，约4.8万名保加利亚本土犹太人因此幸免于难，但同期他仍批准将约1.1万名马其顿、色雷斯占领区犹太人交予德方。1943年8月希特勒召其至东普鲁士总部当面质问，双方就出兵苏联及犹太人问题激烈交锋，鲍里斯坚持拒绝。返回索非亚仅十余天后，他于8月28日突然病逝，官方诊断为心脏病发，但因死因蹊跷，当时及后世均流传毒杀猜测（疑德方或苏方所为），真相至今未有定论。其六岁幼子西美昂二世继位，由菲洛夫等组成摄政团。"
 BUL_damian_velchev_desc:0 "达米扬·韦尔切夫，加布罗沃人，1925—1935年任军官同盟领袖，1930年加入环节集团。1934年5月19日政变的实际策划核心，但刻意隐身幕后、未在新内阁中任职，以避嫌争权，转而力促基蒙·格奥尔基耶夫出任总理。1935年鲍里斯三世反政变后，他一度流亡海外，此后潜回国内图谋再度政变，事泄被捕，1936年被判死刑，经国王特赦改判无期徒刑，监禁至1941年获释。1943年他加入反轴心的祖国阵线。1944年祖国阵线政变成功后，他以上将军衔出任国防大臣，1946年因军队内部清洗问题辞职。此后转任驻瑞士大使，任职一段时间后辞职并申请政治庇护，此后一直侨居瑞士直至逝世。"
 BUL_dimitr_ayryanov_desc:0 "迪米塔尔·瓦西列夫·阿伊拉诺夫，出身军人世家，其父瓦西尔·阿伊拉诺夫为解放后首批军官之一。1912年毕业于索非亚军校，参加两次巴尔干战争及一战，1917年获三枚勇敢勋章及德皇威廉二世颁授的铁十字勋章。1929年起进入沙皇侍从武官团，历任汽车营营长、第2工兵团团长、总参谋部工程督察处处长等职，1938年任第4步兵师师长并率部参与收复南多布罗加，1940年10月晋少将。1941年8月至1944年9月出任保加利亚空军司令，任内主持制定该军种平战两用编制体系，1943年3月下令兴建格拉夫伊格纳季耶沃机场并组建保加利亚陆军首支伞兵部队。1944年9月13日被解职，1945年3月15日被人民法庭判处无期徒刑，狱中审判记录显示其虽被控对德谄媚，但证人证词多证实他实际上告诫年轻军官提防德方、避免透露信息。1948年前后仍在服刑期间抱有获释希望，但1950年在狱中被秘密杀害，官方长期讳莫如深，1990年代解密档案证实此案系由国家安全部门下令执行。"
 BUL_dimitrana_ivanova_desc:0 "迪米特拉娜·伊万诺娃，商人之女，保加利亚教育改革家、妇女参政权运动领袖。因当时保加利亚女子中学学制不足、无法满足索非亚大学入学要求，她转赴瑞士苏黎世大学攻读教育学与哲学，成为该校首位女性在读生。1900年回国后任教于波波沃、舒门、普列文、大特尔诺沃及鲁塞等地，1905年起为《教师觉醒》《妇女之声》等刊物撰稿，1920—1944年出任《妇女之声》主编。1911年6月作为鲁塞妇女协会代表出席保加利亚妇女联盟大会，此后长期投身妇女选举权及家庭、母婴社会保障议题，1925年参与创立儿童保护协会并任理事至1935年。1921年首次申请入读索非亚大学法学院被拒（官方理由为中学学历不完整），经长期抗争后于1927年毕业，成为保加利亚首批获准执业的女律师之一。1926—1944年任保加利亚妇女联盟主席，任内力争女性执业律师及法官资格、争取妇女选举权，1937年促成已婚、离异或丧偶且年满21岁的妇女获得市政选举投票权（尚不含被选举权）。1944年9月28日祖国阵线政变后，她因与德国方面联系密切而以亲德、亲法西斯嫌疑被捕，四个月后获释但被限令离开索非亚、迁居鲁塞，后获准返回索非亚。1960年在索非亚逝世，享年79岁。"
 BUL_ferdinand_kozovski_desc:0 "费迪南德·托多罗夫·科佐夫斯基（1892年1月27日—1965年9月12日），生于克涅扎，1911年加入保加利亚工人社会民主党（窄派），曾参加两次巴尔干战争及一战。战后于索非亚大学攻读法律，1923年是发动反抗六月政变的六月起义领导人之一，同年又参与更具组织性的保共九月起义，起义失败后被迫流亡苏联，毕业于伏龙芝军事学院，此后在西方少数民族共产主义大学任军事学讲师。1936—1939年参加西班牙内战，加入国际纵队，后升任第12国际旅副司令。二战期间他主持莫斯科对保加利亚广播的保语频道并编辑多份地下出版物。1944年祖国阵线政变后返回保加利亚，在保军驱逐纳粹出南斯拉夫及匈牙利的行动中任副总参谋长。战后任国防部副部长，1948—1949年任驻匈牙利公使，1949—1950年任驻中华人民共和国公使。1950年起出任国民议会主席，连任四届议会主席直至1965年逝世，是国际纵队退伍军人中在本国议会体系内担任职务最高者。"
 BUL_gancho_manchev_desc:0 "甘乔·伊万诺夫·曼切夫，1917年毕业于索非亚军校炮兵专业，参加一战，1918年转入航空兵。两战间历任混合航空联队副官、中队长、机场指挥官等职，1935年因涉入反君主共和派军官案被军队开除并被捕，判处八年徒刑，服刑五年后于1940年获释。1944年9月9日祖国阵线政变前夕，他受命协调特利什空军基地参与政变行动。政变成功后，他于1944年10月23日接替格奥尔基·德列尼科夫出任空军司令并晋升少将，指挥保加利亚空军参与祖国战争（1944—1945年对德作战）。1946年11月被解除军职。1948年一度被捕入狱两月后获释，1951年4月在德良诺沃再度被捕，指控其涉嫌密谋推翻祖国阵线政府、意图使保加利亚重投资本主义阵营，被关押至1954年12月，先后辗转瓦尔纳监狱及别列内劳改营，后经军事法庭宣判无罪获释。1968年在索非亚逝世。"
 BUL_georgi_dimitrov_desc:0 "格奥尔基·米哈伊洛维奇·季米特洛夫（1882年6月18日—1949年7月2日），生于科瓦切夫齐村，印刷工出身，早年投身工会运动，1902年加入保加利亚工人社会民主党，后随布拉戈耶夫转入窄派，1919年该派改组为保加利亚共产党。一战期间任议员，因反对战争信贷及民族主义于1915年遭短期监禁。1923年斯坦博利伊斯基政府被政变推翻后，他与科拉罗夫领导九月起义反抗灿科夫政权，起义失败，二人经南斯拉夫流亡维也纳，季米特洛夫被缺席判处死刑。此后长期担任共产国际中欧局负责人，1933年国会纵火案后遭纳粹指控为纵火同谋，在莱比锡审判中他拒绝律师代理、亲自当庭反击戈林等纳粹指控者，最终因证据不足获判无罪释放，一举成为全球反法西斯运动的标志性人物，被誉为德国唯一的勇敢者。1935年起任共产国际总书记直至1943年该组织解散，此间提出人民阵线策略，主张联合各国社会民主党及反法西斯力量共同抵抗纳粹。二战期间他侨居莫斯科，遥控指导保加利亚国内的抵抗运动及祖国阵线的筹建（1942年）。1945年11月返回保加利亚，1946年经大国民议会选举出任总理，主导建立共产党主导的一党体制，1947年推动通过苏联模式宪法。1949年7月在莫斯科附近逝世，遗体运回索非亚安葬于专为其修建的陵墓。"
 BUL_georgi_drenikov_desc:0 "格奥尔基·斯托伊门诺夫·德列尼科夫，1917年毕业于索非亚军校，一战期间在切尔纳河湾战线作战，因战功获三枚勇敢勋章及德方颁授的铁十字勋章、功勋勋章。战间期投身航空事业，1928年取得第56号飞行员证书，历任侦察中队长、混合航空联队队长等职，1935年赴德国格林瑙学习滑翔飞行并获教员资格，同年在布雷日尼克创办保加利亚首所滑翔飞行学校里拉之鹰，1936年柏林奥运会滑翔项目获铜牌，翌年欧锦赛获银牌，是保加利亚航空运动的奠基人之一。1939年起任卡尔洛沃机场航空教导团团长，1941年3月起任驻保加利亚德国第8航空军联络组组长，因贡献获纳粹德国最高航空荣誉白鹰勋章指挥官级十字勋章。1942年任分驻卡尔洛沃等十处机场的教导部队指挥官。1944年9月9日祖国阵线政变后，他以上校军衔临时出任空军司令，任内致力避免部队陷入混乱、协助释放被新政权逮捕的军官、维持军纪与士气，任职至1944年10月23日由甘乔·曼切夫接替。此后旋即遭逮捕，人民法庭判处其十五年徒刑并没收全部财产、剥夺养老金，服刑期满后仍遭继续关押，辗转瓦尔纳监狱及别列内劳改营。1980年在保加利亚逝世。2002年，国防部曾提议为其平反并追授少将军衔。"
 BUL_georgi_markov_desc:0 "格奥尔基·马尔科夫·马尔科夫（Georgi Markov，1886—1966）是保加利亚陆军中将。1923年晋中校，1928年晋上校，1936年先后晋少将、中将。军旅生涯历任第7团团长、边防区指挥官、第8团团长，1934年任第4师师长，随后出任陆军军需总监（1934—1936）；1936年任第3步兵师师长，1936—1941年任第2军区司令，1941年8月退役。"
 BUL_georgi_popov_desc:0 "格奥尔基·尼古拉夫·波波夫，1907年入索非亚军校，一战期间历任步兵及参谋官职，因法语娴熟一度随卢科夫将军参与停战谈判代表团（1918年9月29日）。战间期长期在总参谋部及军校任职，1919年任《讷伊条约》军事监督委员会保方代表之一，1933年任步兵团长，1934年任军校校长兼军事教育机构负责人，1935年升任总参谋部副参谋长，同年晋少将。1940年9月至1941年8月，在保加利亚借《克拉约瓦条约》收复南多布罗加期间，他出任该地区总督。1941—1945年二战期间任第3集团军司令，晋炮兵上将。1953年10月在索非亚逝世。"
 BUL_ivan_dochev_desc:0 "伊万·迪米特罗夫·多切夫，陆军上校之子，1926—1932年供职公务员系统，后入索非亚大学攻读法律与政治学，其间投身学生运动。1933年他是青年国民军团联盟创始人之一及三人领导团体成员，该组织初期反共及民族主义色彩浓厚，后逐渐吸纳意大利法西斯主义及纳粹主义影响，加入统合主义及反犹立场。1934年他随尼古拉·哲科夫将军赴纳粹德国访问，会晤希特勒及罗森贝格。1937年该运动正式定名保加利亚国民军团联盟，翌年因内部分歧，多切夫率一派出走另立山头，与赫里斯托·卢科夫领导的主流派分道扬镳。二战期间他与卢科夫重归于好，成为这位亲纳粹将军的主要支持者之一，其亲德立场使他在战争末期日益不得人心。1941—1943年间他曾任锡利斯特拉市长。1944年他与亚历山大·灿科夫一同接受纳粹德国安排流亡维也纳，在当地度过余下战事。战后他被三次缺席判处死刑，但因其始终身处流亡未曾归国，判决从未执行。1947年他在慕尼黑创立坚决反共的保加利亚民族阵线，此后长期在北美从事反共侨民活动，1984年将领导权移交后仍任名誉主席，1991年苏东剧变后返回保加利亚，晚年自称支持民主力量联盟，但仍坚称保留军团时期的政治理念不变。2005年在美国逝世。"
 BUL_ivan_markov_desc:0 "伊万·赫里斯托夫·马尔科夫生于1889年11月7日，保加利亚陆军中将。马尔科夫曾任保加利亚驻贝尔格莱德和布拉格武官，熟悉巴尔干与中欧军事外交环境。回国后，他先后担任第2快速师、第2步兵师、第4军区和第2集团军等指挥职务。第二次世界大战初期，保加利亚在德意阵营压力和巴尔干局势变化中调整军队部署，马尔科夫的职务主要位于军区和集团军指挥层面。"
 BUL_ivan_variklechkov_desc:0 "伊万·彼得罗夫·瓦里克列奇科夫（1891年7月7日，生于索非亚—1974年），少校瓦里克列奇科夫之子，索非亚军校炮兵专业毕业，一战期间历任海岸炮兵及潜艇军官，曾随保加利亚首艘潜艇第18号潜水艇出海，此后转赴德国潜艇部队在北海、大西洋服役，研发出一套探测敌方潜艇的方法，并指挥果敢号鱼雷艇。保加利亚退出一战后，他协助运送法军渡过多瑙河，获法国荣誉军团勋章。战间期历任海军参谋长、多瑙河团团长（1931年）、海军旅参谋（1932年）、海军学校校长（1933年）等职，1933—1935年任海军总司令，任内引入水雷布设体系。1935年起入沙皇侍从，1936年出任鲍里斯三世副官（为国王宠信之一），1937年再度出任海军总司令，为海军配备德制吕森式鱼雷艇并制定作战方案，同年5月1日成为保加利亚海军首位实职少将（少将衔准将）。1939年10月10日御前会议上，他当着国王及内阁大臣的面公开反对保加利亚沦为纳粹德国盟友的方案，随即被解职，此后务农为生。精通德、法、英、俄四国语言，擅长小提琴。1974年逝世。"
 BUL_kimon_georgiev_desc:0 "基蒙·格奥尔基耶夫·斯托亚诺夫（1882年8月11日—1969年9月28日），生于塔塔尔-帕扎尔吉克，因母系希腊血统绰号希腊人。1902年投身军旅，参与1923年推翻斯坦博利伊斯基政府的政变，此后与迪莫·卡扎索夫等人共同创立超党派权威主义政治团体环节集团，主张以强人政府整肃议会党争乱象，兼受意大利法西斯统合主义影响。1934年5月19日，他联合达米扬·韦尔切夫领导的军官同盟发动政变推翻穆沙诺夫政府，出任总理并一度兼任外交、司法、军事大臣，取缔一切政党及工会，推行统合主义经济体制，取缔内马其顿革命组织。因其集团内部共和派倾向引发鲍里斯三世警觉，1935年1月国王发动反政变将其罢黜，此后他遭长期软禁监视，一度被流放布尔加斯。二战期间他逐渐向左翼靠拢，1942年祖国阵线成立后加入其全国委员会。1944年9月9日，他领导祖国阵线政变推翻摄政团及菲洛夫内阁，再度出任总理直至1946年，任内保加利亚倒戈对德宣战。因在保加利亚历史上主导策划过1923、1934、1944三次政变，被称为老政变家。1946年后历任副总理兼外交部长等职，1949年环节正式解散后他仍留任内阁要职直至1962年，此后任国民议会主席团成员直至逝世，两度获社会主义劳动英雄称号。1969年在索非亚逝世。"
 BUL_kiril_dimitrov_yanchulev_desc:0 "基里尔·迪米特罗夫·扬丘列夫（1896年2月19日，生于普里莱普（时属奥斯曼帝国，今属北马其顿）—1961年4月），保加利亚民族复兴活动家迪米塔尔·扬丘列夫之子，母亲叶芙根尼娅为教师，就读于萨洛尼卡保加利亚男子中学。1916年3月毕业于索非亚军校，参加一战。战后赴法国圣西尔军校深造，1923年晋上尉，1928—1929年在索非亚军校讲授军事史，1930年晋少校，1931年出版《1877—1878年俄土战争》一书，1934年晋上校，1934—1939年任驻巴黎、伦敦武官，1938年出任军校校长，同年8月任军队总部负责人。1942年3月任副总参谋长，1943年5月晋少将。1944年9月6日出任保加利亚陆军总参谋长，任职仅一周即于9月13日被解职。战后遭共产主义当局迫害，被关押于别列内劳改营。1961年4月逝世。"
 BUL_konstantin_lukash_desc:0 "康斯坦丁·卢德维希·卢卡什，1909年毕业于索非亚军校，历任步兵团军官。1940年1月晋中将，1941年8月11日出任保加利亚陆军总参谋长，任职至1944年5月11日。任内他是1941—1942年保加利亚军方向德军东线派遣多批考察团军官的关键推动者之一，他本人亦亲赴东线前线视察德军对苏作战，其未公开日记后来成为研究保加利亚与纳粹东线战事关联程度的重要史料。1944年5月卸任总参谋长后不久，祖国阵线于9月发动政变。他随后被逮捕，1945年3月15日经人民法庭判处死刑并于索非亚处决。"
 BUL_nikola_mihov_desc:0 "尼古拉·米哈伊洛夫·米霍夫，1911年毕业于索非亚军校，炮兵出身，参加两次巴尔干战争及一战（曾参与攻占图特拉坎要塞）。战间期长期在炮兵督察部门及军校任职，1933—1935年任第7炮兵师师长，1936年起任第3步兵师副师长、师长，1937—1941年任军校校长。1941年4—8月率第5集团军参与占领马其顿，此后短暂指挥第1集团军。1942年晋中将，同年4月起任军事大臣直至1943年9月，任内于1943年多次陪同鲍里斯三世会晤希特勒及凯特尔、约德尔等德军将领。1943年鲍里斯三世猝逝后，他成为为幼主西美昂二世设立的三人摄政团成员之一（另二人为菲洛夫、基里尔亲王）。1944年9月祖国阵线政变后遭逮捕，1945年1月28日被人民法庭判处死刑，翌日与菲洛夫、基里尔亲王等一同处决，是保加利亚历史上称为血腥星期四的大规模政治清算的一部分。1996年获最高法院平反。其战时日记于2004年出版。"
 BUL_nikola_mushanov_desc:0 "尼古拉·斯托伊科夫·穆沙诺夫（1872年4月12日—1951年5月10日），德良诺沃人，法学出身，1902年首次当选国民议会议员，1908—1944年间历任九届政府要职，1920年起任民主党副主席，1938年接任主席直至1947年。1931年10月接替因病辞职的马利诺夫出任总理，1932年促成终止一战战争赔款支付，但内外交困、经济持续低迷，1934年5月被环节集团军事政变推翻。二战期间他是议会合法反对派领袖，公开反对1940年《保卫民族法》等排犹立法，坚持严格中立立场，反对加入轴心国及对英美宣战。因其反纳粹立场获盟国信任，1944年盟国与保加利亚就投降谈判时明确要求穆沙诺夫须在新内阁中担任要职，他遂出任穆拉维耶夫短命政府（1944年9月2日—9日）的不管部部长。祖国阵线政变后，他与穆拉维耶夫内阁其他成员一同被人民法庭审判判刑（未判死刑），1945年获释后试图重建民主党、恢复议会民主未果，1947年被流放特尔诺沃，1949年虽已78岁高龄仍被捕关入劳改营，1951年在索非亚国家安全局看守所内逝世，官方称死于心脏破裂，死因存疑。1996年最高法院撤销其人民法庭原判。"
 BUL_nikola_petkov_desc:0 "尼古拉·迪米特罗夫·佩特科夫（1893年7月8日—1947年9月23日），保加利亚前总理迪米塔尔·佩特科夫之子，其兄佩特科·佩特科夫1924年遭不明刺客暗杀。1910年毕业于索非亚第一男子中学，赴巴黎索邦大学攻读法律与政治学，其间回国参加两次巴尔干战争，一战后返巴黎完成学业（1922年以优异成绩毕业），曾在保加利亚驻巴黎使馆任职。1923年6月政变推翻斯坦博利伊斯基政府后辞职留法从事新闻工作，1929年回国，1931—1933年任农民同盟系报刊主编，出版关于斯坦博利伊斯基的政治评述专著。1934年政变后他与包括保共外围劳工党在内的民主力量合作，1938年当选议员，因反法西斯活动1938年12月当选资格被取消并遭内禁。1941年G·M·迪米特罗夫流亡后，佩特科夫接掌农民同盟斯坦博利伊斯基派领导权，同年被关入贡达沃达集中营，此后参与祖国阵线筹建谈判并代表农民同盟进入该阵线全国委员会。1944年祖国阵线上台后，他出任首届政府不管部部长（1944年9月—1945年8月），1945年1月起转为坚决的反共联合反对派领袖，坚持捍卫议会民主，被视为对共产党一党化进程的最大障碍。1947年6月5日，其议员豁免权被剥夺，他本人在议会大厅内当场被捕，试图阻止的同僚遭殴打。经一场剥夺辩护权、不容举证的政治审判，他于8月16日被判间谍及策动军事政变罪成立、判处死刑，尽管西方国家强烈抗议，仍于9月23日被绞死，葬于不公开墓地，成为战后保加利亚乃至东欧农民党反对派遭清算的标志性人物，1990年获平反昭雪。"
 BUL_nikola_stoychev_desc:0 "尼古拉·斯托伊切夫，保加利亚陆军将领，1937年5月6日晋升少将，1942年1月1日晋升中将。二战末期出任保加利亚第3集团军司令，参与1944—1945年祖国战争（对德作战）。据保加利亚史料记载，他与康斯坦丁·卢卡什、特里丰·特里弗诺夫等多名旧军官一同在1945年的人民法庭大规模政治清算浪潮中被处决。"
 BUL_nikola_zhekov_desc:0 "尼古拉·托多罗夫·哲科夫，商人家庭出身，1883年入索非亚军校，1885年塞保战争中以志愿兵身份参战，1886年因卷入推翻亚历山大·巴滕贝格亲王的政变而被降级处分，后获赦并完成学业。1898年毕业于意大利都灵军事学院，1912年出任索非亚军校校长，第一次巴尔干战争期间任第2集团军参谋长。1915年8月出任军事大臣，同年9月24日在斐迪南一世支持下出任保加利亚陆军总司令，主张加入同盟国一方参战。一战期间他指挥保军协同德奥联军击溃塞尔维亚，攻占南多布罗加，并成功挫败1916、1917年协约国在萨洛尼卡战线的多次攻势。1918年战事恶化期间他因病赴维也纳就医，将指挥权移交副手格奥尔基·托多罗夫，此举在保加利亚军事史学界长期存在争议。战后他流亡德国，1921年归国为其战时决策辩护，被斯坦博利伊斯基政府判处十年徒刑，1923年政变后获特赦，此后在军事学院任教并撰写军事著作及回忆录，1936年晋升步兵上将（保加利亚陆军最高军衔）。两战间他是保加利亚极端民族主义代表人物之一，一度出任保加利亚国民军团联盟名誉领袖。二战期间他与希特勒建立友好关系，1940年法国战败后应邀以贵宾身份访问巴黎。1944年祖国阵线政变后，他因担忧遭政治清算而流亡德国，1945年2月1日被人民法庭缺席判处死刑，因下落不明未能执行。1949年在德国巴伐利亚菲森逝世，1992年遗骸迁回保加利亚安葬于索非亚军事陵园。"
 BUL_sava_ivanov_desc:0 "萨瓦·伊万诺夫（1891年—1958年），保加利亚海军少将（一说少将衔准将），索非亚军校毕业后转赴圣彼得堡海军士官团深造。一战期间以少尉身份于1916年袭击苏利纳的俄国仓库，创建了保加利亚海军航空兵，此后长期关注海军航空、海洋学及鱼雷艇编队指挥。1928—1935年任瓦尔纳海军学校（前身为海军机械学校）校长，1935—1937年出任保加利亚海军总司令，此后由伊万·瓦里克列奇科夫再度接任。1944年他一度被迫离开索非亚，此后返回，1958年逝世。他晚年著述颇丰，涉及海洋学、海军史及海军教程等领域，是保加利亚海军史学的奠基人之一，被誉为该领域公认却鲜为人知的元老级人物。"
 BUL_stoycho_mushanov_desc:0 "斯托伊乔·莫沙诺夫，德良诺沃人，总理尼古拉·穆沙诺夫之侄，与其叔父分属不同政党——莫沙诺夫是民族联盟（后并入民主联盟）领袖，1935年短暂出任托舍夫内阁的财政大臣，此后长期任国民议会议长。二战期间他参与合法反对派活动，公开反对武装抵抗祖国阵线的路线。1944年8月，在轴心国败局已定之际，他受命秘密赴开罗与英美方面举行谈判，试图为保加利亚争取体面退出战争、避免遭苏联占领的条件，是保加利亚战时最重要的秘密外交使命之一，但因国内政局急转、9月政变爆发而未能达成实质成果。战后遭共产主义政权多次政治清算与迫害，1944—1947年间他仍参与民主党相关活动，此后淡出政坛，1975年在索非亚逝世。"
 BUL_theodosi_daskalov_desc:0 "特奥多西·彼得罗夫·达斯卡洛夫，抵抗运动人士巴乔·基罗的外孙，1907年毕业于索非亚军校，炮兵出身，参加两次巴尔干战争及一战，历任连、营指挥官。1920年一度被军队解职，1924年复职，此后历任军事刊物主编、总参谋部处长、第5多瑙河步兵团参谋长、第5集团军副司令等职。1938年1月24日出任乔塞瓦诺夫第二届内阁军事大臣，此后在历届内阁中留任该职直至1942年（包括菲洛夫首届内阁）。他本人反对保加利亚加入《三国同盟条约》，但1941年3月1日条约签署后，仍依职权签发第82号令，准许德国免税向保加利亚输入武器装备。1942年4月11日被免去阁员职务并以步兵上将军衔退役。此后他转向反法西斯立场，据称参与秘密抵抗活动。1944年祖国阵线政变后仍被逮捕，1945年2月1日被人民法庭判处死刑并处决，1996年获平反。"
 BUL_todor_pavlov_desc:0 "托多尔·迪米特罗夫·巴甫洛夫（1890年2月14日—1977年5月8日），生于什蒂普（时属奥斯曼帝国科索沃州），保加利亚马克思主义哲学家、政治家、记者，保加利亚共产党重要理论家。1943年鲍里斯三世猝逝后，1944年9月祖国阵线政变，他出任为幼主西美昂二世设立的三人摄政团中代表共产党一方的摄政，任职至1946年君主制被公投废除。此后转向学术领域，1947—1962年出任保加利亚科学院院长，是保加利亚马克思主义反映论美学与认识论的主要奠基人之一，著述颇丰。1977年在索非亚逝世。"
 BUL_trifon_trifonov_desc:0 "特里丰·约尔达诺夫·特里弗诺夫，保加利亚科学院院士约尔丹·特里弗诺夫之子、教授伊万·特里弗诺夫之弟。1916年以第36期学员身份毕业于索非亚军校炮兵专业，1943年5月6日晋升少将，同年11月22日出任第2占领军军长。1944年5月11日出任保加利亚陆军总参谋长，任职期间恰逢保加利亚战略处境急剧恶化，同年9月6日因与新任军事大臣伊万·马里诺夫将军意见相左而辞职。祖国阵线政变后遭逮捕，1945年3月15日被人民法庭以违反《特尔诺沃宪法》程序的方式判处死刑并处决，是继纳科夫、卢卡什等人之后又一位在战后大清洗中被处决的保加利亚高级将领。"
 BUL_valko_chervenkov_desc:0 "瓦尔科·维利奥夫·契尔文科夫（1900年9月6日—1980年10月21日），生于兹拉蒂察，1919年加入保加利亚共产党，1923年参与保共起义失败后流亡苏联，就读莫斯科马克思-恩格斯学院，后任该院讲师及院长，兼任共产国际驻共产主义大学教官，长期从事保加利亚流亡党人的思想教育工作。1926年迎娶季米特洛夫胞妹叶莲娜为妻，由此成为季米特洛夫的连襟。1941年出任对保加利亚广播的赫里斯托·博特夫电台台长。1944年受季米特洛夫委派返回保加利亚，此后历任文化部长（1947年）、副总理（1949年）等职。1949年季米特洛夫逝世后，他凭借与季米特洛夫的姻亲关系及斯大林的信任接任保共总书记，1950年科拉罗夫逝世后再兼任总理，集党政大权于一身，因效仿斯大林治国方式被称为小斯大林。其统治期间大规模清洗党内异己（1953年前开除约十万名党员）、推行农业集体化及重工业优先的经济政策，1953年镇压普罗夫迪夫烟草工人罢工。1953年斯大林去世后其地位受到冲击，1954年被迫将总书记职位让予日夫科夫，1956年赫鲁晓夫去斯大林化后被迫辞去总理职务，1961年被逐出政治局，1962年因反党活动被开除党籍，1969年经日夫科夫提议恢复党籍。1980年在索非亚逝世，当局刻意压低葬礼规模以防演变为对日夫科夫政权的抗议。"
 BUL_vasil_kolarov_desc:0 "瓦西尔·彼得罗夫·科拉罗夫（1877年7月16日—1950年1月23日），生于舒门，鞋匠之子，日内瓦大学攻读法律，1897年加入保加利亚工人社会民主党，后随布拉戈耶夫转入窄派。1919年保加利亚共产党成立后任中央委员会首任书记，长期是仅次于季米特洛夫的党内元老，两战间大部分时间流亡苏联，是共产国际执行委员会核心成员，1922年起任共产国际总书记。1923年他潜回保加利亚，与季米特洛夫共同促成保共发动九月起义反抗灿科夫政权，失败后再度流亡。1943年共产国际解散后，他继续在莫斯科从事保加利亚流亡共产党人的协调工作。1945年苏军占领期间返回保加利亚，历任国民议会主席（1945—1946）、大国民议会主席（1946—1950）、临时国家元首（1946—1947）、副总理兼外交部长（1947—1949）。1949年季米特洛夫逝世后，他继任总理，是保加利亚农业问题理论方面的重要著述者。1950年1月在索非亚任内逝世，享年72岁，获国葬礼遇，安葬于季米特洛夫陵墓。"
 BUL_vladimir_stoychev_desc:0 "弗拉基米尔·迪米特罗夫·斯托伊切夫，维也纳特蕾西亚军事学院及索非亚军校毕业，骑兵出身，参加两次巴尔干战争及一战。两战间他是保加利亚著名马术运动员，代表保加利亚参加1924年巴黎及1928年阿姆斯特丹夏季奥运会马术项目，1930—1934年任驻法国及英国武官。1934年出任索非亚骑兵学校校长，翌年因其反君主立场及与环节集团的关联被军队开除，此后数次因政治立场被捕入狱。1944年他加入祖国阵线全国委员会办公室，保加利亚倒戈对德后，他出任保加利亚第1集团军司令，率部协同苏军及南斯拉夫游击队将德军逐出南斯拉夫、匈牙利大部地区，1945年3月19日在德拉瓦河战役中击败当地德军，5月8日在奥地利克拉根福与英军第5军司令柯特利就分界线达成协议，标志保军作战行动结束。1945—1947年任保加利亚驻华盛顿及联合国代表，回国后任部长会议最高体育委员会主席，1951或1952年至1982年任保加利亚奥林匹克委员会主席，此后任名誉主席直至逝世，1952—1987年任国际奥委会委员。1954年晋升上将。1990年在索非亚逝世，享年98岁。"
 BUL_zachari_zachariev_desc:0 "扎哈里·西梅奥诺夫·扎哈里耶夫（1904年2月4日—1987年4月29日），生于巴萨尔博沃，乡村教师之子，1928年毕业于博茹里什特飞行学校，任第1侦察航空队飞行员。1931年因组织五一罢工等反法西斯活动被军队开除，遂与三名飞行员好友一同投奔苏联，经季米特洛夫推荐赴坦波夫飞行学校受训，后留校任教官，为躲避保加利亚亲法西斯政府对其家人的迫害而化名沃尔坎·戈拉诺夫。1936年他主动请缨加入即将派往西班牙的苏联志愿航空队，以土耳其化名哈利勒·埃克雷姆驾驶波泰兹-54轰炸机、后改驾SB轰炸机，对佛朗哥军目标执行多次空袭任务，因战功获授苏联英雄称号及列宁勋章，是保加利亚人中获此殊荣者之一。1929—1944年间他在苏联红军服役，二战期间任民用航空培训机构负责人，培训飞行员逾万两千人。1944年祖国阵线执政后，他以本名返回保加利亚，主持重建保加利亚空军，1945年任空军副总司令，1947—1955年任空军总司令兼国防部副部长，晋升少将（1947）、中将（1951），主持推动保加利亚航空部队向喷气式装备转型。1959年起任驻莫斯科武官，1965年后再任国防部副部长，1973年退休。1987年在索非亚逝世。"
 ENG_george_vi_desc:0 "1895年 12月生于诺福克郡桑德灵厄姆，乔治五世与玛丽王后的次子，本名阿尔伯特，家中昵称“伯蒂”，英国国王，1936年 12月即位，在位至 1952年。他早年从皇家海军起步，1916年以炮塔军官身份在战列舰科林伍德号上参加日德兰海战，是少数亲历一线作战的现代英国君主。1920年受封约克公爵，1923年与伊丽莎白·鲍斯-莱昂成婚，育有伊丽莎白与玛格丽特两位公主。他自幼患严重口吃，公开讲话长期是沉重负担，自 1926年起在澳大利亚言语治疗师莱昂内尔·罗格的长期帮助下方逐步改善。他本非王位预定继承人，因兄长爱德华八世执意迎娶辛普森夫人而退位、遂仓促登基；为强调与其父的连续性、安抚退位危机后动荡的人心，他舍本名而取“乔治六世”为王号，1937年 5月加冕。第二次世界大战期间，他与王后坚持留在伦敦，1940年白金汉宫数度遭德军空袭、其身处宫中时亦未能幸免，仍拒绝撤离；他亲赴受炸街区、军营、北非战场与诺曼底前线视察，并于 1940年设立乔治十字勋章和乔治勋章以表彰平民英勇，与首相丘吉尔每周会晤，成为英国坚持抗战的重要精神象征。作为末代印度皇帝，他在位期间正值大英帝国向英联邦转型、并加速去殖民化的关键阶段：1947年印度与巴基斯坦独立，1948年 6月他正式放弃“印度皇帝”称号，1949年伦敦宣言确立现代英联邦后，他成为首位“英联邦元首”。晚年健康每况愈下，1951年因肺部恶疾接受手术，1952年 2月 6日在桑德灵厄姆睡梦中辞世，由身在肯尼亚的女儿伊丽莎白二世继位。"
 HUN_gyula_gombos_de_jakfa_desc:0 "根伯什·久洛（1886年12月26日—1936年10月6日），匈牙利总理与法西斯化推手，生于墨尔加，出身路德宗德裔匈牙利家庭。以奥匈军官起步，一战期间成为激进民族主义和反哈布斯堡主义的代言人。1919年库恩·贝拉苏维埃政权崩溃后，他在塞格德组建反共民兵团体，与霍尔蒂并肩以\"白色恐怖\"清洗共产党余孽，由此成为霍尔蒂体制的重要基石。1929年晋升少将，出任国防部长，同年起组织军方反对卡尔四世复辟尝试。1932年10月1日出任总理，成为匈牙利正式实行法西斯路线的起点：他是第一位到访希特勒的外国政府首脑，积极推动与纳粹德国和意大利的政治军事同盟，试图将匈牙利政治体制改造为独裁模式，却因议会保守派阻力而成效有限。他还力主扩军备战，为后来的领土修正主义行动奠定了物质基础。1936年10月6日死于慕尼黑，病因为肾脏和睾丸癌，终年四十九岁，国葬于基雷佩希墓地，数十万民众送行。"
 IRQ_ghazi_i_desc:0 "加齐·本·费萨尔（1912年3月21日，生于麦加—1939年4月4日，卒于巴格达），伊拉克王国第二任国王（1933—1939年在位），费萨尔一世独子。幼年随祖父、麦加大谢里夫侯赛因·本·阿里长大，1924年哈希姆家族被沙特势力逐出汉志后迁至巴格达，被立为王储。1933年9月费萨尔一世病逝后继位。与其老练的父亲截然不同，加齐性格内向缺乏政治经验，却怀有强烈的泛阿拉伯民族主义热情，公开反对英国对伊拉克事务的干涉。他在祖胡尔王宫私设广播电台，宣传吞并科威特等激进主张，据传同情纳粹德国。1936年他支持巴克尔·西德基将军发动政变（现代阿拉伯世界首次军事政变），以军人政府取代文官内阁。1939年4月4日加齐驾驶跑车在巴格达撞车身亡，终年二十七岁，官方说法为交通事故，但坊间广泛流传他系被努里·赛义德等亲英势力谋害的猜测。其年仅三岁的幼子费萨尔二世继位，叔父阿卜杜勒·伊拉出任摄政。"
 bernard_montgomery_desc:0 "1887年生于伦敦肯宁顿，父亲为圣公会主教，童年随家迁居塔斯马尼亚，后返回英国就读桑赫斯特皇家军事学院，绰号“蒙蒂”，是第二次世界大战中英国最广为人知的将领。第一次世界大战中他在西线身负重伤，此后数十年间钻研步兵战术与训练体系，以对部队战备状态的极度重视和对下属的严苛要求见称，1940年敦刻尔克撤退期间指挥第三步兵师保全建制。1942年8月他临危受命出任第八集团军司令，抵达北非后即整顿士气，明令禁止制定任何撤退预案，宣称“我们将在此地作战，若被击退则在此地战死”；同年10至11月阿拉曼战役中，他以步炮协同攻势击溃隆美尔的德意装甲部队，扭转北非战局，隆美尔此后在回忆录中承认他是整场北非战役中遭遇的最难对付的英国指挥官。此后他指挥第八集团军参与西西里和意大利登陆，1944年诺曼底登陆中出任盟军地面部队总指挥，随后率第二十一集团军群转战西北欧北翼；同年9月他主导“市场花园”行动，意图夺取荷兰多座桥梁强渡莱茵河，地面装甲纵队推进迟滞，空降阿纳姆的英国第一空降师陷入合围，行动宣告失败，是其指挥生涯中争议最大的一役。他作风自信强硬，惯于在媒体前塑造个人形象，与美国将领巴顿、布莱德利摩擦不断，艾森豪威尔曾私下称他是整场战争中最难共事的下属；丘吉尔公开评价其人：“败而不馁，胜而难耐。”史学界对他的评价长期分歧：批评者指其进攻节奏迟缓、“市场花园”决策过于冒进，支持者则强调他极度重视保存士兵生命、战役筹划严密。战后出任帝国总参谋长，1976年去世。"
 clement_attlee_desc:0 "1883年生于伦敦，律师家庭出身，英国工党领袖、战后首相。他早年在伦敦东区从事社会工作，目睹贫困而转向社会主义，第一次世界大战中曾在加里波利等战场服役。此后他循市政与议会道路上升，1935年起出任工党领袖。第二次世界大战期间，他加入丘吉尔的联合政府，长期担任副首相，是战时内阁的核心成员之一。1945年工党在大选中大胜，他出任首相，任内推动了英国历史上影响深远的社会变革：建立国民保健服务体系，扩大社会福利，将煤炭、铁路、钢铁等重要产业收归国有。在帝国问题上，他的政府主持了1947年印度和巴基斯坦的独立，标志着大英帝国去殖民化进程的重大转折，此后缅甸、锡兰也相继独立。1951年工党败选后他下野，1955年退出党魁职位，1967年去世。"
 donitz_desc:0 "1891年生于柏林近郊，德国海军元帅，大西洋潜艇战“狼群战术”的总设计者。一战末期他指挥UB-68号潜艇在地中海袭击英国船队，1918年被俘；被俘期间他构思出以多艇协同夹击的“狼群战术”，并在两战之间秘密主持潜艇部队重建，1935年出任潜艇舰队司令。二战中狼群战术在大西洋大规模展开，1942年顶峰时德国潜艇击沉盟国船只逾1100艘约630万总吨，对英国战略补给构成严重威胁；但随着盟军超远程巡逻机、机载雷达和护航航母全面部署，1943年5月单月损失潜艇41艘，邓尼茨被迫撤出北大西洋，大西洋之战实际上就此失败——战争期间德国共损失潜艇783艘，约2.8万艇员在共4万人的潜艇部队中阵亡。他自承是希特勒的忠诚支持者，1942年颁布禁止援救被击沉船只幸存者的“拉科尼亚命令”，1943年出席波森会议时希姆莱在场公开讲述屠杀计划。1943年1月升任海军总司令。1945年4月希特勒遗嘱指定他为继承人，他在弗伦斯堡组建末代政府、主持5月8日无条件投降，执政仅二十三天。战后在纽伦堡以发动侵略战争罪与违反战争法规罪被判处十年有期徒刑，关押于施潘道监狱，1956年获释，此后撰写回忆录《十年二十天》，1980年在汉堡近郊去世。"
 ernst_udet_desc:0 "1896年生，德国空军上将，一战王牌飞行员，击落敌机数量在德国仅次于里希特霍芬，战后以特技飞行表演为业，享誉欧美。1935年他加入重建的德国空军，出任航空技术局局长，主管飞机研发与装备采购。他是俯冲轰炸概念的热衷推广者，力主对几乎所有新式飞机强制加装俯冲制动装置，此举严重拖累了多个机型的研发进度，其中包括重型轰炸机项目的延误。随着空军在不列颠之战和苏德战场遭遇挫折，他承受的政治压力日益沉重。1941年11月17日，他在柏林寓所开枪自杀，时年四十五岁。纳粹当局对外宣称其死于试飞事故。"
 ferdinand_schorner_desc:0 "1892年生，德国陆军元帅、战争罪犯，是纳粹德国最后一位晋升元帅、也是希特勒最宠信的前线指挥官之一。他一战中因勇猛获功勋勋章，是德军中罕见的由一年制志愿兵起步、最终升至元帅的军人。二战中他先后指挥南乌克兰集团军群、北方集团军群（后改称库尔兰集团军群），1945年1月起出任中央集团军群司令，在东线南段组织防御与撤退。他是狂热的纳粹信徒，治军极端严酷，在战争末期大量以“擅离职守”“畏战”等名义将本部德军士兵就地处决或绞死，在德军将领中以残暴闻名。1945年4月，希特勒在遗嘱中指定他接替古德里安出任陆军总司令。德国投降前夕，他抛下部队，换上平民服装乘轻型飞机逃往奥地利，向美军投降后被移交苏联。苏联军事法庭判处他二十五年监禁，1955年获释返回西德后，他又因当年处决本部士兵被西德法院以过失杀人罪判刑。1973年在慕尼黑去世，是第三帝国最后辞世的元帅。"
 franz_halder_desc:0 "1884年生，德国陆军上将，1938至1942年间出任陆军总参谋长，是二战德国陆军作战计划的主要制定者。他主持参谋工作期间，波兰战役、法国战役和巴巴罗萨行动的具体作战计划均经其手制定或审订。他对希特勒的某些决策持保留意见，早在1938年即与贝克一道接触过密谋圈，但始终未采取实质行动。巴巴罗萨行动中，他与希特勒在战略重心问题上长期存在分歧，争论焦点在于应优先进攻莫斯科还是向南迂回乌克兰。1942年9月，在斯大林格勒方向僵局加深后，他与希特勒爆发激烈冲突，随即被解除职务。1944年七月密谋案后因昔日接触被捕，关押至战争结束。战后他与美国陆军历史机构合作，主持编写德军战史研究，1972年去世。"
 george_v_desc:0 "1865年6月生于伦敦马尔伯勒府，维多利亚女王之孙、爱德华七世次子，英国国王兼印度皇帝，1910年至1936年在位。他本非王位的第一继承人，兄长阿尔伯特·维克托王子1892年去世后才转入继承序列。乔治五世性格谨慎、重秩序，在位期间经历第一次世界大战、爱尔兰问题、工党兴起、妇女参政权扩大、帝国自治领地位上升等重大变局。大战期间，他多次巡视前线和医院，1917年在反德情绪高涨的背景下将王室姓氏由“萨克森-科堡-哥达”改为“温莎”，并放弃德意志头衔，使王室与英国民族国家进一步绑定。1924年，他接受首届工党政府组阁，显示君主制对议会民主与大众政治时代的适应。1931年《威斯敏斯特法令》确认自治领地位，英帝国逐渐转向英联邦框架。1935年银禧庆典中，他仍拥有较高公众声望。1936年1月病逝后，长子爱德华八世继位，并很快引发退位危机。"
 goering_desc:0 "1893年生于罗森海姆，纳粹德国仅次于希特勒的二号人物，德国空军总司令、帝国元帅。一战中他是著名战斗机飞行员，曾出任“红男爵”里希特霍芬战斗机联队的末任联队长，获功勋勋章。战后他早年即追随希特勒，参加1923年慕尼黑啤酒馆暴动并在街头冲突中负伤。纳粹上台后他权势迅速膨胀：出任普鲁士邦总理兼内政部长期间，他创建盖世太保并设立最早的一批集中营，又先后出任国会议长、空军总司令、四年计划全权负责人，几乎掌控了德国的军备与战时经济命脉。1935年起他全力扩建德国空军；1940年希特勒为他专设帝国元帅军衔，使其位居全体德军将领之上，并指定他为接班人。1941年7月，他签署书面授权，令海德里希着手筹划对欧洲犹太人的“最终解决”，是大屠杀决策链上的关键一环。他还主导了对占领区艺术品的大规模劫掠，并长期受吗啡毒瘾困扰。随着空军在不列颠之战受挫、又未能兑现以空运为斯大林格勒被围德军补给的承诺，他的威信日渐衰落。1945年4月，他致电希特勒提出由自己接掌国家领导权，希特勒震怒，下令解除其一切职务并将其逮捕。德国投降后他向美军投降，在纽伦堡国际军事法庭受审，以阴谋罪、破坏和平罪、战争罪和反人类罪四项罪名被判处绞刑。1946年10月，他在行刑前夜服氰化物自杀。"
 ivan_konev_desc:0 "1897年生于沃洛格达地区一个农民家庭，早年以政治委员身份从军，后转为军事指挥员。卫国战争中，他历任西方面军、加里宁方面军、草原方面军司令，在库尔斯克会战中担纲一线，随后指挥乌克兰第二、第一方面军，先后进行科尔孙、利沃夫—桑多梅日、维斯瓦河—奥得河等战役，并参加柏林战役与解放布拉格的作战。1944年2月晋升苏联元帅。在柏林方向的进军中，他与朱可夫一度形成竞争态势，这一安排出自最高统帅部的部署。战后他出任陆军总司令，1955年华沙条约组织成立后任首任武装力量总司令；1956年指挥苏军参与平息匈牙利事件。1973年病逝，是卫国战争后期红军最主要的方面军指挥员之一。"
 ludwig_beck_desc:0 "1880年生，德国陆军上将，军事理论家，反希特勒抵抗运动的核心人物。1935年出任陆军总参谋长，以严谨的参谋作业风格和战略眼光著称。1937至1938年间，他多次以书面备忘录形式反对希特勒的冒险扩张政策，认为入侵捷克斯洛伐克将引发德国无力承担的全面战争。1938年8月，在希特勒不顾反对坚持推进的情况下，他辞去总参谋长职务，是德国高级将领中极少数以此方式公开表达反对的人。此后他成为军队抵抗运动的精神领袖，1944年七月密谋计划中，他被预定在政变成功后出任德国国家元首。7月20日刺杀行动失败当夜，他在柏林本德勒街军事指挥部尝试自杀，因重伤未死，随即被在场军官补枪，当夜身亡。"
 raeder_desc:0 "1876年生，德国海军元帅，二战初期德国海军的最高统帅。一战中他在希佩尔麾下参加日德兰海战。战间期他秘密推动德国海军重建，1935年正式出任海军总司令。二战中他主张发展大型水面舰艇与潜艇并重的海军战略，推动了俾斯麦号等主力舰的建造。1940至1941年间，他力主入侵英国和攻占直布罗陀，但均未被希特勒采纳。1942年12月，巴伦支海海战中德国水面舰队表现不佳，希特勒震怒，他随即辞职，由邓尼茨接任。战后在纽伦堡受审，以战争罪被判处无期徒刑，1955年因健康原因获释，1960年去世。"
 ritter_von_greim_desc:0 "1892年生于拜罗伊特，巴伐利亚一名警官之子，德国空军元帅、一战战斗机王牌，是德国军队历史上最后一位获晋元帅军衔者。一战中他击落二十八架敌机，因功获巴伐利亚军事马克斯·约瑟夫勋章，由此获得“冯”的贵族头衔与骑士称号。1924年，他受聘前往中国，协助广州的国民政府（先后由孙中山、蒋介石领导）筹建空军，在当地创办飞行学校，直至1927年取道西伯利亚铁路返德；在华期间，他与同在广州的苏联首席军事顾问布留赫尔（中国称“加伦将军”）有所交往。回国后他参与重建德国空军，1934年出任德国第一所战斗机飞行学校校长。二战中他先后指挥第五航空军参加不列颠之战、第六航空队在东线（库尔斯克等战役）支援中央集团军群作战。1945年4月，柏林已被苏军合围，他奉希特勒之命，由著名试飞员汉娜·赖奇驾机送入城内，途中座机被高射炮火击中，右脚负伤。在元首地下室，希特勒晋升他为元帅，任命他接替被以叛国罪解职的戈林出任空军总司令——此时他所统领的空军已名存实亡。4月28日他奉命飞离柏林去逮捕“叛徒”希姆莱。德国投降当日（5月8日）他在奥地利被美军俘虏，5月24日在萨尔茨堡的羁押地服毒自杀。"
 speer_desc:0 "1905年生，希特勒的御用建筑师与核心圈成员，纳粹德国军备与战时生产部长。他为希特勒设计了新总理府和纽伦堡党代会会场，1937年起出任柏林总建筑总监，在此职位上其部门将数万名犹太居民逐出柏林住所。1942年2月托特死后，他接任军备与战时生产部长，以“军备奇迹”之名大幅提高武器产量，而支撑这一切的是数百万被强征的强制与奴役劳工，他们在恶劣条件下大量死亡。纽伦堡国际军事法庭以战争罪和反人类罪（主要是使用奴隶劳工）判处他二十年监禁，他在施潘道监狱服满刑期，1966年获释。战后他着力塑造一种“知错的好纳粹”形象，宣称自己只是技术官僚、承担总体责任却对大屠杀并不知情；但后来的史学研究（如基钦、布雷希特肯等人的著作）认为，这一自我辩白是经过精心构造的谎言——他对犹太人迫害与奴工剥削知情且深度参与，若当年罪责被充分查明，本应被判死刑。1981年去世。"
 todt_desc:0 "1891年生于普福尔茨海姆，德国建筑工程师、纳粹党元老。一战中他在航空兵服役，1922年即加入纳粹党。希特勒上台后，他出任德国道路总监，主持修建高速公路网。1938年，他创建以自己名字命名的“托特组织”（OT）——一个集合其行政机构、私营企业与劳役服务的军事工程组织，先后承建对峙马其诺防线的西墙（齐格菲防线）和绵延占领区海岸的大西洋壁垒。这些工程动用了海量强制与奴役劳工：到1944年底，托特组织名下劳工约达一百四十万人，绝大多数是占领国的战俘和被强征者，实际处于奴隶般的境地，许多人未能生还。1940年，他出任纳粹德国首任军备弹药部长，主管整个战时军备经济。后期他逐渐确信对苏战争无法取胜，并就此向希特勒进言。1942年2月8日，他在东普鲁士希特勒大本营附近起飞后不久死于飞机失事（此后有暗杀传言，但从未得到证实），由阿尔伯特·施佩尔接任，他本人未及受到任何审判。"
 vittorio_emanuele_desc:0 "1869年生于那不勒斯，翁贝托一世与玛格丽特王后的独子，意大利国王，因身高仅约1.53米而被戏称为“小军刀”（Sciaboletta），又因率国历经两次世界大战而得名“士兵国王”。1900年其父翁贝托一世遭无政府主义者刺杀身亡后他即位，在位近四十六年，其统治几乎与意大利法西斯主义的兴起、鼎盛与覆灭完全重合。即位初期国政长期由焦利蒂主导，推行工业化与男性普选等改革，意大利亦在利比亚扩张殖民地。第一次世界大战中意大利由中立转而于1915年加入协约国，他多次亲赴前线视察，“士兵国王”之名由此而来；战胜虽收回特伦托与的里雅斯特，却也埋下“残缺的胜利”之怨。1922年10月墨索里尼发动“进军罗马”，首相法克塔已拟好戒严令、巴多里奥也向他保证军队足以轻易击溃不过万人的黑衫党，他却在犹豫之后拒绝签署戒严令，事后辩称是惧怕内战才按兵不动，转而致电墨索里尼请其来罗马，并于10月30日任命其为首相——亲手把政权交到了法西斯手中。此后二十年间，他基本沦为顺从的象征性君主：接受由侵略战争得来的“埃塞俄比亚皇帝”（1936）与“阿尔巴尼亚国王”（1939）头衔，签署了1938年的种族法，对法西斯政权的所作所为始终不置一词。1943年7月，盟军登陆西西里、法西斯大委员会倒戈之后，他终于解除并逮捕墨索里尼、改由巴多里奥元帅组阁；9月与盟国签订停战协定后，他与政府仓皇弃守罗马、南逃布林迪西，将群龙无首的军队抛在身后，此举至今备受谴责，其后对德宣战。因其与法西斯政权牵连过深、声望尽失，1944年他将大部分王权移交王储翁贝托，罗马光复后立其为“王国总督”。1946年5月9日，他为挽救摇摇欲坠的君主制而正式退位、传位翁贝托二世，但为时已晚；同年6月公投以约五成四的多数废除君主制，萨伏依王室男性成员被永久逐出意大利。他流亡埃及亚历山大，1947年12月病逝于当地，2017年遗骸方迁回意大利。私下里他是史上最痴迷的钱币收藏家之一，藏品约十万枚，并以三十余年之功编纂二十卷《意大利钱币集成》；其女玛法尔达则于1944年死于布痕瓦尔德纳粹集中营。"
 walther_wever_desc:0 "1887年生，德国空军将领，是德国空军建军初期战略轰炸理论的主要倡导者。1933年他出任德国空军参谋长，力主发展远程重型轰炸机，推动了后来被称为“乌拉尔轰炸机”的四发重型机研制项目，主张德国空军应具备打击苏联工业腹地的战略纵深能力。1936年6月，他在德累斯顿因飞机失事身亡，年仅四十八岁。他去世后，继任者取消了重型轰炸机项目，德国空军此后转向以战术支援为主的建设方向。"
 wilhelm_keitel_desc:0 "1882年生，德国国防军元帅，整个二战期间出任国防军统帅部长官，是希特勒最主要的军事行政执行者。1938年希特勒解散战争部、直接掌控武装力量时，他出任新设的国防军统帅部长官，此后长期充当希特勒意志的传达者和军事行政的执行机构首脑，在将领群体中以对希特勒的绝对服从著称，被同僚讥为“点头凯特尔”。他签署了多项将战争罪行制度化的命令，包括1941年的“政委命令”（要求就地枪决被俘苏联政治委员）和“夜与雾命令”（针对占领区抵抗运动成员的秘密拘押处决）。1945年5月8日，他代表德国武装力量在柏林签署对苏的无条件投降书。战后在纽伦堡国际军事法庭受审，以战争罪和反人类罪被判处死刑，1946年10月执行绞刑。"

# v123c BUL advisor/navy/army desc recovery hotfix
 BUL_ivan_sapundzhiev_desc:0 "伊万·赫里斯托夫·萨彭吉耶夫，1892年6月20日生于戈尔斯科诺沃塞洛，1960年卒于索非亚，保加利亚陆军少将。1915年毕业于陛下军事学校后进入炮兵部队，先后在榴弹炮、山地炮兵和军属炮兵单位任职。三十年代中期以后，他逐渐进入炮兵指挥与教育系统，1936年任第6师属炮兵团团长，1938年晋升上校，1939年任第1军属炮兵团团长。1940年任第四集团军司令部炮兵科长，1942年短暂出任炮兵监察长，随后担任陛下军事学校校长，1943年晋升少将。1944年后被免职，曾遭人民法院审判，后获无罪。"
 BUL_stefan_nedev_desc:0 "斯特凡·萨沃夫·内德夫，保加利亚军官，军衔为上校，曾任保加利亚军事情报机关负责人。其军旅经历从第一次世界大战末期开始，后来进入参谋、军事教育和驻外武官系统，曾在贝尔格莱德、布加勒斯特等方向任职。1943年至1944年，他出任军队参谋部情报处负责人，正处在保加利亚同德国结盟、又试图寻找退路的最敏感阶段。资料还记载他与苏联军事情报和内务系统存在联系，并曾以苏方线人身份活动，这使他在保加利亚战时情报史中带有强烈争议。1944年保加利亚倒向反德阵营后，他还参与了对德作战。"
 BUL_stefan_stefanov_desc:0 "斯特凡·格奥尔基耶夫·斯特凡诺夫，1876年7月6日生于斯利文，1946年3月25日卒于索非亚，保加利亚民主党政治家、工业家和财政官员。他出身于斯利文纺织工业家庭，父亲创办的“格奥尔基·斯特凡诺夫父子公司”长期是保加利亚重要毛纺企业。斯特凡诺夫在柏林学习法律与国家科学，后来继承并经营家族企业，又取得萨莫科夫“穆萨拉”纺织厂所有权。政治上，他长期属于民主党，曾多次当选议员，并在尼古拉·穆沙诺夫政府中出任财政部长。大萧条冲击保加利亚期间，他提出较系统的财政稳定与改革方案，后被称为“斯特凡诺夫计划”。"
 BUL_stefan_tsanev_desc:0 "斯特凡·托舍夫·察内夫，1898年10月29日生于加布罗沃地区泽莱诺德尔沃村，保加利亚海军一级舰长。1919年毕业于索非亚军事学校，随后转入海军军官课程，1920年获海军少尉军衔。此后长期在保加利亚海军教育和舰艇部门任职，曾任海军学校教官、“斯特罗吉”号鱼雷艇艇长，并赴意大利利沃诺皇家海军学院深造。回国后，他先后指挥“德拉兹基”号鱼雷艇、通信连、多瑙河舰队船只、潜水队、多瑙河固定防御、德代阿加奇港以及黑海舰队，并多次负责海军学校与陛下海军学校。1944年12月，他从格奥尔基·佩佐夫手中接任保加利亚海军司令，任期至1946年8月。"
 BUL_stoyan_trendafilov_desc:0 "斯托扬·康斯坦丁诺夫·特伦达菲罗夫，1899年11月2日生于佩什泰拉，1982年卒于索非亚，保加利亚陆军中将。1918年毕业于帕扎尔吉克中学，后入军事学校学习炮兵，1922年任少尉，1930年毕业于军事学院，进入参谋和炮兵系统。三十年代他同军事联盟关系密切，因反君主倾向于1935年离开军队。1944年九月政变后，保加利亚转入对德作战，特伦达菲罗夫迅速重返军职并晋升将官，担任装甲旅指挥官，后任装甲兵负责人。1945年他已进入中将序列，属于战后保加利亚军队重组中被重新启用的军事联盟系军官。"
