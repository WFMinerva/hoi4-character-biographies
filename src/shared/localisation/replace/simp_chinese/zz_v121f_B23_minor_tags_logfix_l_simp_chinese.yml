l_simp_chinese:
 CBIO_UKR_kost_levytsky_desc:0 "科斯特·列维茨基生于1859年11月18日，出生于加利西亚特斯缅尼齐亚，是乌克兰政治家，律师。他毕业于利沃夫大学与维也纳大学法学专业，1890年在利沃夫开设律师事务所，长期投身乌克兰民族运动，历任奥地利帝国议会及加利西亚议会议员，创立乌克兰全国民主党。一战爆发后，他出任乌克兰最高委员会主席。1918年10月，随着奥匈帝国解体，他领导乌克兰全国拉达，11月1日在利沃夫发动武装起义，建立西乌克兰人民共和国，出任首任政府首脑即国务秘书处主席。1918年底辞职后，他历任选举改革委员会主席及流亡政府驻里加，日内瓦，热那亚等地代表。1941年6月30日，德国入侵苏联期间，他又出任在利沃夫自立的乌克兰政权元老会主席。1941年11月12日，他在利沃夫去世。"
 UKR_kost_levytsky_desc:0 "$CBIO_UKR_kost_levytsky_desc$"
 CBIO_UKR_mykhailo_omelianovych_pavlenko_desc:0 "米哈伊洛·帕夫连科生于1878年12月8日，出生于第比利斯，父亲是俄罗斯帝国陆军军官，母亲出身格鲁吉亚贵族。他毕业于圣彼得堡巴维尔军事学校，参加过日俄战争，一战期间指挥叶卡捷琳诺斯拉夫乌克兰旅等部队。1918年12月至1919年6月，他出任乌克兰加利西亚军总司令，此后统率乌克兰人民共和国军，1919年12月至1920年11月指挥该军进行第一次冬季远征，与布尔什维克军队周旋。此后他侨居布拉格，主持乌克兰退伍军人联盟。德国入侵苏联后，他一度统领亲轴心国的乌克兰民族主义武装乌克兰解放军。战后，他移居法国，1945年至1948年出任乌克兰人民共和国流亡政府国防部长，并当选乌克兰退伍军人联盟主席。1952年5月29日，他在巴黎去世。"
 UKR_mykhailo_omelianovych_pavlenko_desc:0 "$CBIO_UKR_mykhailo_omelianovych_pavlenko_desc$"
 CBIO_UKR_nikita_krushchyov_desc:0 "尼基塔·赫鲁晓夫生于1894年4月15日，出生于俄国库尔斯克省卡利诺夫卡村，早年随父迁居顿巴斯尤佐夫卡当学徒，后加入布尔什维克，参加俄国内战任政治委员。他在拉扎尔·卡冈诺维奇提携下逐级晋升，斯大林时期积极参与大清洗，批准大批逮捕，1938年起出任乌克兰党组织第一书记并兼政治局委员，在乌克兰继续推进清洗。二战期间他再度担任政委，是斯大林与前线将领之间的联络人，并亲历斯大林格勒战役。1953年斯大林去世后，他在权力斗争中胜出，成为苏共中央第一书记，1958年起兼任部长会议主席。1956年苏共二十大上，他发表秘密报告谴责斯大林个人崇拜，开启去斯大林化。他因古巴导弹危机等内外政策受挫，于1964年10月被党内政变逼迫下台。1971年9月11日，他在莫斯科郊外别墅去世。"
 UKR_nikita_krushchyov_desc:0 "$CBIO_UKR_nikita_krushchyov_desc$"
 CBIO_UKR_pavlo_shandruk_desc:0 "帕夫洛·尚德鲁克生于1889年2月28日，出生于沃里尼亚博尔苏基村，一战期间在俄军中指挥营级部队。俄国革命后，他加入乌克兰人民共和国军，历任装甲列车指挥官，团长等职，参与对布尔什维克与波兰的战事。1921年乌克兰独立战争失败后，他流亡波兰，1936年正式加入波兰陆军，1939年以上校军衔率部作战，曾成功掩护波兰第十九旅突围，战后获颁波兰十字勋章。华沙陷落后他被俘，后因伤获释，一度遭盖世太保逮捕又获释。1945年2月，他出任乌克兰民族委员会主席，同时受命组建乌克兰民族军，统合所有在德军一方作战的乌克兰部队，兵力一度近五万人。同年4月，该军在奥地利前线宣誓效忠乌克兰，5月向美英联军投降，他后经波兰将领安德斯斡旋，使部下未被遣返苏联。战后他移居美国，1979年2月15日在新泽西州特伦顿去世。"
 UKR_pavlo_shandruk_desc:0 "$CBIO_UKR_pavlo_shandruk_desc$"
 CBIO_UKR_stepan_bandera_desc:0 "斯捷潘·班德拉生于1909年1月1日，出生于奥匈帝国加利西亚一希腊礼天主教神父家庭，自幼投身乌克兰民族主义运动，1929年加入乌克兰民族主义者组织，1933年出任该组织加利西亚执行部负责人，主持针对波兰与苏联的破坏与暗杀行动。1934年他因策划刺杀波兰内政部长被判处死刑，后减为无期徒刑，1939年波兰战败后获释。1940年该组织分裂，他领导更激进的一派。1941年6月30日，德国入侵苏联当天，他在利沃夫宣布恢复乌克兰国家，因拒绝撤回声明被盖世太保逮捕，关押萨克森豪森集中营直至1944年获释。此后他领导乌克兰最高解放委员会地下活动，战后定居西德慕尼黑，继续领导原组织并与多个反共团体合作。1959年10月15日，他在慕尼黑寓所门厅被克格勃特工用氰化物喷枪暗杀身亡。"
 UKR_stepan_bandera_desc:0 "$CBIO_UKR_stepan_bandera_desc$"
 CBIO_IA_emma_goldman_desc:0 "埃玛·戈德曼生于1869年6月27日，出生于俄罗斯帝国考纳斯一个立陶宛犹太家庭，1885年移民美国，受芝加哥干草市场事件触动而投身无政府主义，成为北美与欧洲颇具影响力的演说家与作家。她与亚历山大·伯克曼相恋并参与其刺杀钢铁大亨亨利·克莱·弗里克未遂案，此后因煽动骚乱，散发节育信息屡遭监禁，1906年创办无政府主义刊物大地母亲。一战期间她因反对征兵入狱两年，1919年获释后在搜捕行动中与伯克曼等人一同被驱逐至苏俄，后因不满布尔什维克镇压异见而离开，著书批评苏俄现实。此后她辗转英国，加拿大，法国，出版自传我的生活，1936年西班牙内战爆发后，年近七旬的她三赴西班牙，为西班牙无政府工团主义者奔走筹款。1940年5月14日，她在多伦多因中风去世。"
 IA_emma_goldman_desc:0 "$CBIO_IA_emma_goldman_desc$"
 CBIO_IA_olga_taratuta_desc:0 "奥尔加·塔拉图塔本名叶尔卡·鲁文斯卡娅，生年史料记载不一，通行说法为1876年1月21日，出生于陶里达省一个乌克兰犹太商贩家庭。她早年当过教师，1897年投身社会民主运动，后在瑞士流亡期间转向无政府共产主义，1904年返回敖德萨，加入黑旗派等无政府主义团体，组织地下印刷所与炸药实验室，策划针对沙俄官员的暗杀与征募行动，因此多次被捕流放。1917年二月革命后获释，她随即投身政治犯救援工作，先后创办政治红十字会与无政府主义黑十字会，为遭布尔什维克关押的政治犯奔走。她本人也因此屡遭苏俄当局逮捕流放，晚年仍以身体力行的救援活动被誉为俄国无政府主义运动的祖母。大清洗期间，她于1937年11月以反苏鼓动罪被捕，1938年2月8日经最高法院判处死刑，当日即被枪决。"
 IA_olga_taratuta_desc:0 "$CBIO_IA_olga_taratuta_desc$"
 CBIO_IA_sakutaro_iwasa_desc:0 "岩佐作太郎生于1879年9月25日，出生于日本千叶县，毕业于东京法学院，1902年赴美并转向社会主义，1906年在旧金山与幸德秋水等人组建社会革命党，1910年大逆事件发生后，他曾致公开信向天皇表达抗议。1918年回国后投身无政府主义运动，1923年大杉荣遇害后，他批评工团主义路线，倡导纯正无政府主义。1925年参与创立黑色青年联盟，1927年赴中国与当地无政府主义者建立联系。1937年，他发表国家论大纲，转向拥护日本天皇制国家立场，被视为明确转向。二战结束后，他于1946年以近藤宪二为代表组建日本无政府主义者联盟，1949年当选全国委员长，联盟其后分裂，他又另组日本无政府主义者俱乐部。1967年2月13日去世。"
 IA_sakutaro_iwasa_desc:0 "$CBIO_IA_sakutaro_iwasa_desc$"
 CBIO_IA_sanshiro_ishikawa_desc:0 "石川三四郎生于1876年5月23日，出生于日本埼玉县，本姓五十岚，毕业于东京法学院。1902年进入万朝报社，次年因不满该报转向主战论而辞职，加入平民社，通过平民新闻鼓吹非战论，其后又与木下尚江等创办新纪元杂志。他两度因言论获罪入狱，狱中钻研西方社会运动史，并通过爱德华·卡彭特的著作转向无政府主义。1910年大逆事件后，他于1913年流亡欧洲，辗转比利时，法国，英国靠做工为生，期间结识爱利舍·邵可侣，卡彭特等人，深化了无政府主义思想。1920年回国后，他将民主一词译为土民生活，主张扎根土地的自治生活，1927年在东京郊外千岁村创办共学社，身体力行半农生活。战时他潜心东洋文化史研究，战后于1946年参与创立日本无政府主义者联盟并任顾问。1956年11月28日去世。"
 IA_sanshiro_ishikawa_desc:0 "$CBIO_IA_sanshiro_ishikawa_desc$"
 CBIO_RUT_augustin_voloshyn_desc:0 "奥古斯丁·沃洛申生于1874年3月17日，出生于喀尔巴阡罗塞尼亚凯莱钦村，是希腊礼天主教神父，教育家，政治家。他毕业于乌日霍罗德神学院与布达佩斯大学，1900年至1917年在乌日霍罗德师范学院任数学教授，长期主编鲁塞尼亚语报刊，1918年出任喀尔巴阡罗塞尼亚人民会议主席，推动该地与捷克斯洛伐克联合。1925年他当选捷克斯洛伐克国会议员，长期领导鲁塞尼亚基督教人民党。1938年10月，捷克斯洛伐克总统任命他为喀尔巴阡罗塞尼亚自治政府总理，同年将该地更名为喀尔巴阡乌克兰。1939年3月15日，捷克斯洛伐克解体之际，他宣布喀尔巴阡乌克兰独立并出任总统，但次日该地即遭匈牙利军队入侵，他被迫流亡罗马尼亚，转赴布拉格任教于乌克兰自由大学。1945年5月，苏军进驻布拉格后，他被内务人民委员部逮捕并押往莫斯科，同年7月19日死于布蒂尔卡监狱。"
 RUT_augustin_voloshyn_desc:0 "$CBIO_RUT_augustin_voloshyn_desc$"
 CBIO_RUT_sergei_fedorovich_efremov_desc:0 "谢尔盖·叶夫列莫夫本姓奥赫里缅科，生于1876年10月18日，出生于基辅省兹韦尼霍罗德卡县，是乌克兰文学史家，评论家，政治活动家。他曾就读基辅大学法律系，后投身文学研究与民族运动，历任乌克兰激进民主党，乌克兰进步人士协会等团体领导人，撰有多部关于舍甫琴科，弗兰科等作家的专著。1917年，他加入中央拉达并出任副主席，兼中央拉达秘书处国际事务总秘书，参与同临时政府的谈判。1919年起他一度转入地下，1922年至1928年任乌克兰科学院副院长。1929年，他被指为“乌克兰解放同盟”这一子虚乌有的组织的首犯，在1930年哈尔科夫公开审判中原判死刑，后减为十年监禁，先后关押雅罗斯拉夫尔与弗拉基米尔监狱。1939年3月31日，他在刑满前数月病逝于弗拉基米尔监狱。"
 RUT_sergei_fedorovich_efremov_desc:0 "$CBIO_RUT_sergei_fedorovich_efremov_desc$"
 CBIO_RUT_vasil_bilak_desc:0 "瓦西尔·比拉克生于1917年8月11日，出生于匈牙利王国沙里什县克拉伊纳·比斯特拉村，家庭属鲁塞尼亚族，早年做过裁缝。他自1936年投身共产主义运动，1955年至1968年及1969年至1971年任捷克斯洛伐克共产党斯洛伐克中央委员会委员，1962年至1968年任该会秘书，1968年一度出任第一书记，此后至1988年长期担任捷共中央主席团委员兼书记，对该党外交与意识形态政策具有重大影响。1968年“布拉格之春”期间，他是党内强硬派代表，支持苏联出兵镇压，是签署邀请华沙条约国军队入境捷克斯洛伐克那封信件的五人之一，此后积极参与“正常化”进程。1989年12月，他被捷共开除党籍，1991年以叛国罪被起诉，2011年因证据不足终止审理。2014年2月6日，他在布拉迪斯拉发去世。"
 RUT_vasil_bilak_desc:0 "$CBIO_RUT_vasil_bilak_desc$"
 CBIO_RUT_vasily_zakharovich_filonovich_desc:0 "瓦西里·扎哈罗维奇·菲洛诺维奇生于1894年1月15日，出生于哈尔科夫省苏梅县罗吉兹涅村，是乌克兰人民共和国军将领。他毕业于丘古耶夫军事学校，一战期间在俄军服役，俄国革命后加入乌克兰人民共和国军，历经对布尔什维克的作战，1920年出任乌克兰驻格鲁吉亚民主共和国波季领事馆副领事，此后晋升旅级将领。1939年，他以参谋身份参加喀尔巴阡乌克兰武装喀尔巴阡西奇抵抗匈牙利入侵的战斗，在优势兵力压境下率部退入罗马尼亚境内，后遭罗马尼亚当局引渡给匈牙利，一度被关入集中营。此后他侨居斯洛伐克，1951年移居美国，历任乌克兰退伍军人联盟主席，乌克兰人民共和国之友协会负责人，并出任乌克兰人民共和国流亡政府军务部长。1987年6月3日，他在美国明尼阿波利斯去世。"
 RUT_vasily_zakharovich_filonovich_desc:0 "$CBIO_RUT_vasily_zakharovich_filonovich_desc$"
 CBIO_BLR_adam_stankievic_desc:0 "亚当·斯坦凯维奇生于1892年1月6日，出生于格罗德诺一带的阿尔良纳蒂村，是白俄罗斯天主教神父，政治家，作家。1914年他毕业于维尔纽斯神学院，是最早在教堂礼拜中使用白俄罗斯语的神父之一，也是白俄罗斯基督教民主联盟及后来的白俄罗斯基督教民主党的创始人之一。1919年他出任流亡的白俄罗斯民主共和国拉达成员，长期活跃于波兰治下西白俄罗斯的民族运动，1922年当选波兰议会议员。与同乡的知名学者扬·斯坦凯维奇不同，他拒绝在德国入侵波兰后与德方合作，二战期间居于维尔纽斯出版白俄罗斯语宗教文献。1944年苏联收复维尔纽斯后不久，他即被苏联当局逮捕，1949年被押往伊尔库茨克州奥泽尔拉格劳改营，同年11月29日在营中去世。"
 BLR_adam_stankievic_desc:0 "$CBIO_BLR_adam_stankievic_desc$"
 CBIO_BLR_panteleimon_ponomarenko_desc:0 "潘捷列伊蒙·康德拉季耶维奇·波诺马连科生于1902年8月9日，出生于俄国库班地区一个农民家庭，是苏联党务与国家干部。1932年至1937年他在红军担任营级指挥员，1938年起出任白俄罗斯共产党第一书记，直至1947年，1944年至1948年间兼任白俄罗斯部长会议主席。他上任首场演说即以“肃清敌人”为题，也曾致电斯大林请求扩大处决与监禁指标。苏德战争爆发后，他出任游击运动中央总部参谋长，统筹白俄罗斯敌后游击战，其部队在与波兰地下军的冲突中曾下令解除对方武装并处决其军官。战后他历任苏共中央书记，1952年至1953年任苏共中央主席团委员，此后又出任哈萨克党第一书记，先后任苏联驻波兰，印度，尼泊尔及荷兰大使，在荷兰任内因阻拦一对苏联科学家夫妇寻求政治庇护而与当地警察发生肢体冲突并被驱逐。1984年1月18日，他在莫斯科去世。"
 BLR_panteleimon_ponomarenko_desc:0 "$CBIO_BLR_panteleimon_ponomarenko_desc$"
 CBIO_BLR_radislau_astrouski_desc:0 "拉达斯瓦夫·卡济米罗维奇·奥斯特洛夫斯基生于1887年10月25日，出生于明斯克省斯卢茨克县扎波利耶村，是白俄罗斯教育家，政治活动家，纳粹德国的合作者。他早年因参加1905年革命被斯卢茨克中学开除，后就读圣彼得堡大学，1911年因参与革命骚乱被捕流放。二月革命后，他一度出任临时政府在斯卢茨克专区的专员，1918年任白俄罗斯人民共和国教育部长，1920年参加反抗红军的斯卢茨克起义。此后侨居波兰治下的维尔纽斯，长期任白俄罗斯中学校长，政治立场几经摇摆，一度与白俄罗斯共产党及西白俄罗斯共产党暗中往来，后又转向亲波兰立场。德国占领白俄罗斯后，他积极与德方合作，先后在布良斯克，斯摩棱斯克，莫吉廖夫等地出任市长，1943年出任德国扶植的白俄罗斯中央拉达主席，该机构支持消灭犹太人但本身直接参与屠杀有限。1944年苏军收复白俄罗斯后，他逃往德国，1948年在西德宣布重建流亡的白俄罗斯中央拉达并自任主席，此后移居美国。1976年10月17日，他在密歇根州本顿港去世。"
 BLR_radislau_astrouski_desc:0 "$CBIO_BLR_radislau_astrouski_desc$"
 CBIO_CAM_norodom_sihanouk_desc:0 "诺罗敦·西哈努克生于1922年10月31日，出生于柬埔寨金边，通称西哈努克亲王，出身诺罗敦与西索瓦两大王族，是诺罗敦·苏拉玛里特与哥沙曼·尼亚里丽之子。1941年，他继承柬埔寨王位。1952年至1953年间，西哈努克以国王身份向法国殖民当局提出独立要求，并于1953年11月9日推动柬埔寨获得完全独立，由此奠定其“柬埔寨国父”的历史地位。1955年，他让位于其父并转入政坛，同年出任首相。1960年父亲去世后，他宣誓就任国家元首，试图在冷战夹缝中坚持中立外交，维护柬埔寨的独立自主。1970年朗诺发动政变后，西哈努克被迫流亡中国，仍以个人声望凝聚柬埔寨民族主义力量。1975年金边易手后，他回国担任民主柬埔寨国家元首，1976年宣布退休。此后他又历任民主柬埔寨联合政府主席、柬埔寨主席、柬埔寨全国最高委员会主席等职，并在柬埔寨和平进程中利用自身影响促成各派和解。1993年，他再次成为柬埔寨国王，2004年宣布退位，由其子西哈莫尼继位。西哈努克一生几经复位、流亡与妥协，其政治道路充满争议，却始终围绕柬埔寨主权、国家统一与王室合法性展开；他长期致力于中柬友好事业，多次访问中国，被中国称为“中国人民的老朋友”。2012年10月15日，西哈努克在北京医院去世，享年九十岁。"
 CAM_norodom_sihanouk_desc:0 "$CBIO_CAM_norodom_sihanouk_desc$"
 CBIO_CAM_son_ngoc_thanh_desc:0 "山玉成生于1908年12月7日，出生于法属交趾支那茶荣省，父为高棉克罗姆人，母有华裔与越南血统。他曾赴西贡，蒙彼利埃与巴黎求学，回国后任柏威夏地方法官，金边检察官，后出任佛教研究院副院长。1936年他与人合办首份高棉文报纸吴哥报，鼓吹民族主义，因思想倾向日本式国家主义而受法方警惕。1942年反法示威后他逃往日本，1945年3月西哈努克宣布独立后归国出任外交部长，同年8月日本投降后自任总理，10月法国恢复统治后被捕流放西贡继而流放法国。1951年获准回国后，他转入丛林领导高棉自由战士运动，反抗法国殖民统治，后又演变为反对西哈努克与共产主义的高棉塞雷组织，长期获美国中央情报局资助。1970年朗诺政变推翻西哈努克后，他出任政府顾问，1972年再度出任高棉共和国总理，遭炸弹袭击后不久即被朗诺免职，转赴南越。1975年越南统一后他被俘，1977年8月8日病死于胡志明市监狱中。"
 CAM_son_ngoc_thanh_desc:0 "$CBIO_CAM_son_ngoc_thanh_desc$"
 CBIO_CAM_tou_samouth_desc:0 "杜斯木化名阿沙尔·索克，生年约为1915年，是出生并成长于交趾支那的高棉克罗姆人，柬埔寨共产主义运动创始人之一。他早年出家为僧，二战时期在金边乌纳隆寺担任巴利文教授，1945年一次美军空袭波及寺院后他逃入乡间，辗转投奔越盟。战后他成为高棉伊沙拉运动即自由高棉运动的领导人之一，其抵抗政府任命他为内政部长。1951年，他与山玉明共同创立柬埔寨人民革命党，此后领导该党较为温和的城市派，主张与西哈努克政权保持策略性合作，波尔布特等新近归国的留法青年即在其麾下的城市委员会中崭露头角，杜斯木被视为波尔布特的引路人。1960年该党秘密代表大会上，他当选总书记，波尔布特位列第三。1962年7月20日，他在西哈努克政府的一轮清剿行动中失踪并遇害，主流说法认定系西哈努克警方所为，但史学家宾·基尔南等人依据后来的党内文件指出，波尔布特一系亦有加害嫌疑，真相至今存疑。"
 CAM_tou_samouth_desc:0 "$CBIO_CAM_tou_samouth_desc$"
 CBIO_KAR_jalmari_takkinen_desc:0 "亚尔马里·塔基宁生于1899年9月8日，出生于芬兰兰塔萨尔米，是芬兰“民族战士”，化名伊尔马里宁。1920年他受聘于雷波拉地方长官博比·西文麾下，投身芬兰同族地区的民族运动。1921年10月，东卡累利阿各游击武装召开会议决定脱离苏俄，塔基宁与另两人组成三人领导集团，出任军事统帅，是二百余名骨干中唯一的芬兰本国公民。他率部一度控制白卡累利阿大部地区，但未能有效约束部众，起义于1922年初在红军优势兵力下失败。此后他任芬兰护国军北海门地区队长，1923年获授预备役少尉衔，撰有两卷本回忆录森林游击队长回忆录。冬季战争期间他以预备役中尉衔指挥一个连队，参加过佩尔科森涅米与维堡湾等战斗。1968年3月11日，他在罗瓦涅米去世。"
 KAR_jalmari_takkinen_desc:0 "$CBIO_KAR_jalmari_takkinen_desc$"
 CBIO_KAR_peteris_irklis_desc:0 "彼得里斯·伊尔克利斯俄文全名彼得·安德烈耶维奇·伊尔克利斯，生于1881年1月15日，出生于拉脱维亚里加一个裁缝家庭，是拉脱维亚族苏联党务干部。他1898年毕业于里加工艺学校，做过杂工与印刷排字工，1905年加入俄国社会民主工党，投身当年革命，1908年应征入伍并参加第一次世界大战。十月革命后他历任雅罗斯拉夫尔省军事委员会部门负责人等职，1932年至1935年任列宁格勒州委第三书记，1934年当选联共布第十七次代表大会代表。1935年8月起，他出任卡累利阿州委第一书记兼卡累利阿中央执行委员会主席团委员，任内被吸纳为内务人民委员部特别三人组成员，积极参与1937年开始的大清洗行动。同年7月21日，他本人亦遭逮捕，同年9月9日在列宁格勒近郊列瓦绍沃刑场被处决，1989年获平反。"
 KAR_peteris_irklis_desc:0 "$CBIO_KAR_peteris_irklis_desc$"
 CBIO_LAO_kou_voravong_desc:0 "考·纳瓦拉生于1914年12月6日，出生于沙湾拿吉，是老挝政治家。二战期间他曾投身抗日活动，战后又转而反对主张彻底独立的自由老挝运动。1941年至1954年间，他历任县长，省长，国民议会议员及王国政府部长等职，1950年代初主持打击湄公河沿岸边境匪患的行动。1951年他当选家乡省份议员并出任国民议会主席，同年底出任国防部长。1954年7月，他作为老挝代表团副团长参加日内瓦会议，并以中立不结盟为由拒绝为老挝加入东南亚条约组织背书。会后他一度促成王室政府与巴特寮的首次高层接触，苏发努冯与其异母兄苏发努玛于9月8日会晤。仅仅十天后的9月18日，他在万象一场晚宴上遇刺身亡，凶手被指与他早年铁腕缉私结下的旧怨或泰国方面有关，其死引发政府危机，间接导致老挝其后陷入更深的政治分裂。"
 LAO_kou_voravong_desc:0 "$CBIO_LAO_kou_voravong_desc$"
 CBIO_LAO_sisavang_vong_desc:0 "西萨旺·冯本名王子考，生于1885年7月14日，出生于琅勃拉邦金宫，是国王扎卡林之子。他曾就读西贡与巴黎的学校，1904年父王去世后继位，1905年正式加冕为琅勃拉邦国王。在法国保护国体制下，他长期与法方保持合作，任内相继统合华潘，华康，川圹，万象等地，1946年又并入占巴塞与沙耶武里，使老挝历史上首次由一位君主统治全境。1945年日军占领印度支那期间，他一度在日方压力下宣布独立，但战后不久即因拒绝配合自由老挝的独立主张而被该运动短暂废黜，1946年法国恢复统治后复位。1949年老挝王国成立，他出任首任国王，1953年见证老挝完全独立。1959年病重后，他任命王储西萨旺·瓦达纳为摄政，同年10月29日去世，在位长达五十五年。"
 LAO_sisavang_vong_desc:0 "$CBIO_LAO_sisavang_vong_desc$"
 CBIO_LAO_souphanouvong_desc:0 "苏发努冯生于1909年7月13日，出生于琅勃拉邦，是老挝末代副王本坤之子，母为平民出身，与老挝首相苏发努玛为异母兄弟。他曾就读河内阿尔贝·萨罗中学，后赴巴黎攻读土木工程，1938年至1945年在越南参与修筑桥梁道路。二战后他加入自由老挝运动出任国防部长，1946年他在他曲战斗中身负重伤，辗转逃往泰国，此后与越盟结盟，1950年在越盟总部召开的大会上当选老挝自由战线主席，即巴特寮的前身，因倾向共产主义而获“红色亲王”之称，但实际决策权掌握在凯山·丰威汉等党内领导人手中。1957年他出任联合政府计划部长，1959年遭逮捕后于次年脱逃重返巴特寮根据地。1962年日内瓦协议签署后他再度入阁任副首相，1963年因中立派外长遇刺而退出政府，此后长期领导巴特寮武装斗争，其长子亦在内战中阵亡。1975年巴特寮夺取全国政权后，他出任老挝人民民主共和国首任主席，1986年因健康原因辞职。1995年1月9日，他因心脏病在老挝去世。"
 LAO_souphanouvong_desc:0 "$CBIO_LAO_souphanouvong_desc$"
 CBIO_MNT_blazo_dukanovic_desc:0 "布拉若·久卡诺维奇生于1883年11月26日，出生于尼克希奇卢科沃村，是黑山塞族政治与军事领导人。他在俄国完成中学与大学教育，1939年起任南斯拉夫高等军事法院法官。1941年南斯拉夫王国解体后，他出任泽塔省省长，同年又被推举为黑山境内全体切特尼克部队司令，当地将领巴约·斯塔尼希奇承认他为黑山切特尼克的官方代言人。1942年7月24日，他与意大利占领当局代表签订协议，出任中央民族主义委员会主席，事实上成为黑山境内的傀儡领袖，同时统辖亲意的绿党武装。1943年10月，他在奥斯特罗格修道院遭南斯拉夫游击队伏击，与约万·托什科维奇一同被俘，1943年10月21日在奥斯特罗格城墙下被处决。"
 MNT_blazo_dukanovic_desc:0 "$CBIO_MNT_blazo_dukanovic_desc$"
 CBIO_MNT_blazo_jovanovic_desc:0 "布拉若·约万诺维奇生于1907年3月28日，出生于波德戈里察，是黑山政治家与南斯拉夫游击队指挥官。他曾在贝尔格莱德与萨格勒布攻读法律，1936年组织贝尔维迪尔反法西斯示威。二战爆发后，他成为黑山，科托尔湾及桑扎克地区南斯拉夫共产党省委的核心领导人之一，1941年7月与米洛万·吉拉斯共同领导黑山起义，随后出任黑山最高临时指挥部政治委员的联络代表，后又兼任第五黑山无产阶级旅副政治委员。战后他出任黑山人民共和国政府首脑，直至1953年，此后又任黑山议会议长直至1963年，是1945年后黑山最具影响力的政治人物，对波德戈里察于1946年确立为首府起到关键作用。1976年2月4日，他在伊加洛去世。"
 MNT_blazo_jovanovic_desc:0 "$CBIO_MNT_blazo_jovanovic_desc$"
 CBIO_MNT_kristo_popovic_desc:0 "克尔斯托·波波维奇生于1881年9月13日，出生于黑山，参加过两次巴尔干战争与第一次世界大战，1916年被奥匈军队俘虏，是莫伊科瓦茨战役的知名将领之一。他不满1918年波德戈里察议会决议将黑山并入塞尔维亚，1919年领导支持已废黜的彼得罗维奇-涅戈什王朝的“绿党”发动圣诞起义，起义失败后流亡意大利，1919年6月返回黑山展开游击战，1921年黑山末代国王尼古拉一世去世后放下武器，后向亚历山大国王宣誓效忠获得赦免，领取抚恤金退隐。第二次世界大战爆发后，他重组绿党武装，组建洛夫琴旅，接受意大利占领军支持，试图借轴心国之力恢复黑山独立，因此与游击队及切特尼克两方均发生冲突，部众后来也分裂投向双方。他本人始终未加入任何一方，1947年3月14日在南斯拉夫国家安全局的伏击中被处决。"
 MNT_kristo_popovic_desc:0 "$CBIO_MNT_kristo_popovic_desc$"
 CBIO_FRA_henri_dentz_desc:0 "亨利·费尔南·登茨生于1881年12月16日，出生于法国卢瓦尔省罗阿讷，1910年毕业于圣西尔军校，一战期间在佩莱将军麾下任职，战后转赴法属叙利亚任职。二战法国战败后，他一度出任巴黎军事长官，随后效忠维希政权，1940年12月被任命为叙利亚黎巴嫩黎凡特地区高级专员兼黎凡特军总司令，统辖约四万五千兵力，防务期间允许德意空军途经叙利亚黎巴嫩为伊拉克方向的作战加油。1941年6月，英联邦与自由法国部队自巴勒斯坦及伊拉克方向发起进攻，登茨部队且战且退，6月21日大马士革失守，7月10日贝鲁特危在旦夕之际他请求停战，7月14日签署圣让达克雷停战协定，随后被解除职务。战后他因在停战后违约转运战俘等行为被追究战争合作罪责，1945年1月被判处死刑，戴高乐将其减为无期徒刑。1945年12月13日，他在弗雷讷监狱中去世。"
 FRA_henri_dentz_desc:0 "$CBIO_FRA_henri_dentz_desc$"
 CBIO_SYR_hashim_al_atassi_desc:0 "哈希姆·阿塔西生于1875年1月11日，出生于霍姆斯一个大地主兼政治世家，早年在伊斯坦布尔攻读公共行政，毕业后进入奥斯曼帝国治下的黎凡特行政系统任职，历任霍姆斯，哈马，巴勒贝克等地长官。1919年他当选叙利亚国民议会主席，翌年该议会宣布建立君主立宪的大叙利亚，后因坚持该主张而于1930年被法国当局解散并流放阿尔瓦德岛数月。1927年他创立叙利亚民族集团并任主席，长期以外交手段而非暴力反抗争取独立，1936年率团赴巴黎谈判法叙条约，归国后当选叙利亚共和国总统，成为现代叙利亚首位民选国家元首。因法国迟迟不批准该条约，他于1939年愤而辞职。此后他又于1949年及1954年两度出任总统，1955年因忌惮与巴格达条约结盟而遭军方掣肘，遂辞职退隐霍姆斯。1960年12月5日，他在霍姆斯去世，葬礼规模为叙利亚历史罕见。"
 SYR_hashim_al_atassi_desc:0 "$CBIO_SYR_hashim_al_atassi_desc$"
 CBIO_SYR_mehemed_ali_abed_desc:0 "穆罕默德·阿里·拜伊·阿比德生于1867年，出生于大马士革一个显赫家族，父亲曾任奥斯曼苏丹阿卜杜勒-哈米德二世的顾问兼情报机构负责人。他早年就读于伊斯坦布尔加拉塔萨雷高中，后赴巴黎攻读法律并研习伊斯兰教法，通晓阿拉伯语，法语，土耳其语，1906年出任奥斯曼帝国驻美国大使。1920年他返回大马士革，1922年出任叙利亚财政部长。1932年，他作为民族集团提名人当选国民议会议员，同年6月11日就任叙利亚共和国首任总统，是首位在有宪法与议会背景下就职的叙利亚元首。1936年新议会选出后，他辞职移居巴黎。1939年10月22日，他在罗马一家酒店因心脏病发去世，灵柩后运回大马士革安葬。"
 SYR_mehemed_ali_abed_desc:0 "$CBIO_SYR_mehemed_ali_abed_desc$"
 CBIO_SYR_antun_saadeh_desc:0 "安东·萨阿德生于1904年3月1日，出生于黎巴嫩山杜尔舒韦尔一个希腊正教医生家庭，早年随父移居美国与巴西，从事新闻工作，1930年返回黎巴嫩，任教于贝鲁特美国大学德语系。1932年11月他秘密创立叙利亚民族主义社会党，主张建立涵盖今叙利亚，黎巴嫩，约旦等地的大叙利亚国家，1935年该党公开后他被法国殖民当局逮捕判刑六年，狱中撰写多部著作，此后又数度被捕。1938年他离黎赴巴西，二战期间侨居阿根廷，其间曾访问意大利与柏林，一度被法方怀疑与轴心国有染但未获实证。1947年黎巴嫩独立后他回国，1949年7月他发动武装起义试图夺权，失败后逃往大马士革寻求叙利亚军事强人胡斯尼·扎伊姆支持，扎伊姆却将其遣返黎巴嫩，经秘密审判后于1949年7月8日被处决。"
 SYR_antun_saadeh_desc:0 "$CBIO_SYR_antun_saadeh_desc$"
 CBIO_SYR_khalid_bakdash_desc:0 "哈立德·巴克达什生于1912年11月15日，出生于大马士革一个库尔德家庭，早年就读大马士革大学法律系，18岁即投身共产主义运动，因非法政治活动被校方开除。1934年他赴莫斯科东方劳动者共产主义大学深造，1936年返回叙利亚出任叙利亚共产党总书记，任内起草的党纲力求使该党成为强调反殖民斗争的广泛民主运动，而非单纯的马克思列宁主义先锋组织。二战期间他领导地下抵抗维希法国统治，1954年当选叙利亚国民议会议员，成为阿拉伯世界首位当选议员的共产党人，人称“阿拉伯共产主义元老”。1958年因反对叙利亚与埃及无条件合并为阿拉伯联合共和国，遭纳赛尔当局镇压，被迫流亡莫斯科直至1966年。此后他历经与复兴党既合作又受限的复杂关系，1986年因反对戈尔巴乔夫改革而与党内另一派分裂。1995年7月15日，他在大马士革去世。"
 SYR_khalid_bakdash_desc:0 "$CBIO_SYR_khalid_bakdash_desc$"
 CBIO_VIN_bao_dai_desc:0 "保大帝本名阮福永瑞，生于1913年10月22日，出生于顺化，是越南阮朝末代皇帝启定帝独子。九岁时被送往巴黎求学，1925年父亲去世后继位，取年号保大，仍留学法国，由摄政会代行朝政。1932年他回国亲政，一度有志推行改革，但实权始终掌握在法国殖民当局手中，此后以奢华享乐著称。1945年3月，日军推翻法属印度支那当局后，他在日方压力下宣布越南独立并短暂称帝，同年8月日本投降，越盟乘势夺权，他随即退位，一度受邀出任胡志明政府最高顾问，后流亡香港。1949年法国扶植他出任越南国国长，试图借其号召力对抗胡志明，但他大部分时间仍居留法国，将政务交由亲法的越南籍官员打理。1954年日内瓦会议后，他促成吴廷琰出任总理，次年吴廷琰通过一场舞弊色彩浓厚的公投将其罢黜，越南国随之改为共和国。此后他长居法国，1997年7月31日在巴黎一家军医院去世。"
 VIN_bao_dai_desc:0 "$CBIO_VIN_bao_dai_desc$"
 CBIO_VIN_ho_chi_minh_desc:0 "胡志明，越南无产阶级革命家、政治家，越南民主共和国主要缔造者和越南劳动党的创建者。1890年5月19日出生于贫寒的农村儒生家庭，原名阮生恭，学名阮必成，在法国、中国时分别化名阮爱国、李瑞、宋文初、胡光等。早年当过教师、海员和杂役。1920年加入法国共产党。1925年在中国广州组织越南青年革命同志会。1930年在香港领导成立越南共产党，后曾定名为印度支那共产党、越南劳动党。第二次世界大战期间，他在中国参与抗日战争，并积极组织越南国内反对法国殖民者的斗争。1941年返回越南，成立越南独立同盟会，简称越盟，领导反对继续统治南越的法国维希政府和反对日本侵略的斗争。1945年8月领导越南八月革命，9月2日在河内宣布成立越南民主共和国，翌年当选为共和国主席兼总理。1951年当选为越南劳动党中央委员会主席。此后，他带领越南人民进行越南抗法战争以及统一越南的越南战争，长期领导越南无产阶级革命，致力于越南解放事业。胡志明也是二战后亚洲反殖民运动的主要推动者之一，20世纪最有影响力的共产主义领导者之一。他主张对华友好，为发展中越两国关系作出了贡献，并创造性地将马列主义应用于越南的具体条件，缔造了“胡志明思想”。著有《胡志明选集》《胡志明全集》。1969年9月，胡志明因病在河内逝世。"
 VIN_ho_chi_minh_desc:0 "$CBIO_VIN_ho_chi_minh_desc$"
 CBIO_VIN_ngo_dinh_diem_desc:0 "吴廷琰生于1901年1月3日，出生于顺化一个显赫的天主教家庭，父亲吴廷可曾任成泰帝宫廷重臣。他早年一度考虑修习神职，后转投行政仕途，在保大帝朝廷中晋升迅速，1929年任平顺省省长，1933年出任内政部长，任职仅三个月即因不满法国当局阻挠改革而辞职并公开谴责保大帝为法国工具，此后隐居顺化十二年。1945年他一度被越盟俘获，胡志明曾邀其加入新政府未果。1954年奠边府战役后，他受保大帝之邀出任越南国总理，同年日内瓦协议将越南分割为南北两部。1955年10月，他借一场舞弊色彩浓厚的公投罢黜保大帝，宣布成立越南共和国并自任首任总统。任内他倚重胞弟吴廷瑈及其领导的芹劳党巩固家族统治，采取高压反共政策，对佛教徒多有打压，1963年顺化佛诞日枪击事件及僧侣自焚事件激起国内外强烈反弹，美国遂转而默许军方发动政变。1963年11月1日，将领们在中央情报局知情下发动政变，他与吴廷瑈出逃后于次日即11月2日被捕遇害。"
 VIN_ngo_dinh_diem_desc:0 "$CBIO_VIN_ngo_dinh_diem_desc$"
 CBIO_ALT_grigory_gurkin_desc:0 "格里戈里·伊万诺维奇·古尔金生于1870年1月24日，出生于阿尔泰乌拉拉村，是阿尔泰族绰罗斯氏族出身的首位职业画家。他早年在阿尔泰传教团学校学习圣像画，1897年入圣彼得堡帝国美术学院师从希什金等人，1903年返回阿尔泰任教并常年深入山区写生，1907年在托木斯克举办个展一举成名，作品多描绘阿尔泰山川与当地民俗，并信奉阿尔泰本土宗教布尔汗教。俄国革命爆发后，他投身民族自治运动，1917年当选阿尔泰山区杜马主席，1918年2月又出任喀喇昆仑阿尔泰区自治政府主席，试图建立涵盖阿尔泰，图瓦，哈卡斯等地的民族自治政权，同年底遭高尔察克当局以分离主义罪名逮捕，1920年至1925年流亡蒙古与图瓦。回国后他重新投入教育与美术创作，为阿尔泰语教材及史诗绘制插图，1926年在莫斯科举办展览获得成功。大清洗期间，他因早年的民族自治活动被追认为“资产阶级民族主义者”，1937年被捕，同年10月11日被处决，1956年获平反。"
 ALT_grigory_gurkin_desc:0 "$CBIO_ALT_grigory_gurkin_desc$"
 CBIO_ALT_samuil_yufit_desc:0 "萨穆伊尔·尤菲特生卒年份经多方检索均未能查得可靠记载，其确切出生地及最终结局亦不详。可查证的是，他于1937年3月28日至1938年2月12日出任喀喇阿尔泰即奥伊罗特自治州州委第一书记，正值苏联大清洗最为酷烈的时期。任内他积极敦促内务人民委员部加大逮捕与处决力度，甚至以“对敌人不作为”为由要求逮捕内务人民委员部工作人员，一度几乎搬入内务人民委员部机关驻地办公，是当地大清洗浪潮的主要推动者之一，并出任内务人民委员部特别三人组成员。1937年12月，他当选苏联首届最高苏维埃民族院代表，但仅两个月后即1938年2月即卸任州委第一书记一职，此后随着清洗参与者陆续遭清算，他本人也从最高苏维埃代表名单中消失，此后行踪与结局均无可靠史料记载。"
 ALT_samuil_yufit_desc:0 "$CBIO_ALT_samuil_yufit_desc$"
 CBIO_ASY_benjamin_arsanis_desc:0 "本雅明·阿尔萨尼斯生于1884年，出生于伊朗乌尔米亚迪加拉村，是亚述族政治家，作家，历史学家。1898年至1910年他就读于当地新办的东正教学校，后赴俄国圣彼得堡拉扎列夫东方语言学院攻读历史，毕业后返回乌尔米亚母校任教。1912年他创立亚述文学文化协会，致力于振兴亚述民族语言与著述。1917年二月革命后，他与弗雷敦·阿图拉亚，巴巴·帕尔哈德共同创立亚述社会党，即首个亚述人政党，他出任该党中央委员会主席，主张在苏俄支持下于亚述故土建立独立国家。此后局势动荡，他辗转伊拉克摩苏尔，一度在英军编练的亚述营中任职，1925年出版简明亚述史，因与俄国的历史渊源屡遭伊拉克当局猜忌迫害。1933年西米莱惨案后，他返回乌尔米亚。1925年至1938年间，他与达维德·伊利安共同主编第比利斯出版的亚述文杂志晨星。1950年代他移居德黑兰，重建亚述青年文学文化协会，笔耕不辍。1957年8月4日，他在德黑兰去世。"
 ASY_benjamin_arsanis_desc:0 "$CBIO_ASY_benjamin_arsanis_desc$"
 CBIO_ASY_shimun_eshai_desc:0 "马尔·埃沙伊·西蒙二十三世生于1908年2月26日，出生于奥斯曼帝国库德尚尼斯，是亚述教会大公宗主教世袭家族成员。亚述人大屠杀期间其伯父遇害，他年仅十一岁即被推举继任宗主教，后赴英国剑桥大学韦斯科特学院攻读神学。1933年伊拉克脱离英国托管独立后，教会处境动荡，宗主教被迫移居塞浦路斯，1940年又迁往美国芝加哥，约1949年入籍美国，1954年定居旧金山地区。他多次就“亚述问题”向英国政府及国际组织上书呼吁，并将多部叙利亚语典籍译为英语，匿名出版的亚述人的悲剧一书后被追认为其著作。1948年他倡导亚述人应效忠所在国的新政策，以缓解教众与穆斯林邻居的紧张关系。1972年他决定辞去宗主教职务，次年结婚，此举因违反教会独身传统而引发争议，教会内部酝酿召开会议决定教区前途。1975年11月6日，他在美国加利福尼亚州圣何塞家门口遭枪击身亡，凶手大卫·马利克·伊斯梅尔虽自称因不满其婚事行凶，但审判记录显示此事可能与教内异见者的图谋有关。"
 ASY_shimun_eshai_desc:0 "$CBIO_ASY_shimun_eshai_desc$"
 CBIO_BUK_mohammed_alim_khan_desc:0 "赛义德·米尔·穆罕默德·阿利姆汗生于1880年1月3日，是布哈拉汗国曼吉特王朝末代埃米尔。十三岁时他被父亲送往圣彼得堡学习三年，研习治国与近代军事技术，1896年经俄国政府正式确认为布哈拉王储后返国，历任纳赛夫地区总督十二年，后转任卡尔米纳省总督。1910年父亲去世后他继承汗位，1911年正式即位，是曼吉特王朝唯一自称哈里发的统治者。1918年3月，青年布哈拉党人策动布尔什维克进攻布哈拉，他下令处决布尔什维克代表团及数百名俄国支持者予以镇压，一度击退红军进攻。1920年9月，苏军在米哈伊尔·伏龙芝指挥下再度攻城，经四日激战布哈拉方城堡被毁，他被迫出逃杜尚别，继而流亡阿富汗喀布尔。此后二十余年他定居喀布尔郊外，1944年4月28日在当地去世，葬于舒哈多伊索列欣公墓。"
 BUK_mohammed_alim_khan_desc:0 "$CBIO_BUK_mohammed_alim_khan_desc$"
 CBIO_BUK_polat_usmon_desc:0 "波拉特·乌斯蒙·霍扎耶夫生于1878年，是布哈拉行商之子，自幼随父辗转布哈拉各地，早年接受经学院教育后转而追求近代新式学问，深受扎吉德改良运动及青年布哈拉党影响。1918年他成为青年布哈拉党领导人之一，该党联合布尔什维克试图推翻埃米尔阿利姆汗未果，1920年终于借苏军之力将其废黜。1921年9月23日，他当选布哈拉人民苏维埃共和国中央执行委员会主席团主席，即该国首任元首，但任期短暂。他随后被派往东布哈拉，转而与反苏的巴斯玛奇运动暗通款曲，事情败露后于1922年4月被解职，随即出逃阿富汗，代表布哈拉政权与阿富汗埃米尔阿曼诺拉汗签订联合抗苏协议，并试图购置武器援助反苏武装。此后他成为布哈拉及中亚流亡群体的领袖人物之一，最终移居土耳其，改名奥斯曼·科贾奥卢，在当地度过余生。1968年，他在土耳其去世。"
 BUK_polat_usmon_desc:0 "$CBIO_BUK_polat_usmon_desc$"
 CBIO_BYA_bidia_dandaron_desc:0 "比迪亚·丹达隆生于1914年12月28日，出生于布里亚特希兹金加附近沙鲁塔乌卢斯，幼年即被喇嘛卢布桑·桑丹·崔登诺夫认定为转世活佛，授予教名“持明”，七岁时又受封为巴拉噶特运动法王继承人。为躲避苏维埃政权对宗教人士的高压，他迁居列宁格勒，考入民用航空学院，同时师从著名藏学家安德烈·沃斯特里科夫研习藏学。1937年6月，他以反革命活动罪被捕，判处十年监禁，狱中染上肺结核并遭受酷刑，1943年因病获释返回布里亚特。1948年他迁居托木斯克州以躲避监视，次年又以间谍罪再度被捕，狱中结识立陶宛哲学家瓦西里·谢泽曼并深受启发。1956年他获平反获释，此后任职于乌兰乌德布里亚特社会科学研究所，整理藏文典籍，翻译藏文历史宗教文献，并以“新佛教”之名向弟子秘密传授融合西方哲学的密宗修行，门下渐聚数十名来自列宁格勒，莫斯科等地的追随者。1972年他第三次被捕，被控组织“教派”并涉嫌“血祭”“仪式性交”等罪名，1973年底受审，大部分指控被撤销，仍被判处五年劳动教养。1974年，他病死于劳改营中。"
 BYA_bidia_dandaron_desc:0 "$CBIO_BYA_bidia_dandaron_desc$"
 CBIO_BYA_seymon_ignatyev_desc:0 "谢苗·杰尼索维奇·伊格纳季耶夫生于1904年9月14日，出生于赫尔松省一个贫苦农民家庭，乌克兰族。少年时随父迁居中亚特尔梅兹，做过轧花厂工人及布哈拉铁路机修学徒，1919年起投身共青团，1920年进入契卡系统，1935年毕业于全苏工业学院飞机制造工程专业。1937年10月，他出任布里亚特-蒙古州委第一书记兼乌兰乌德市委第一书记，前任书记米海·叶尔巴诺夫被捕并于翌年遭处决，伊格纳季耶夫在此背景下走马上任，战争期间一直坐镇后方。1943年他调升巴什基尔州委第一书记，1946年后进入中央机关任职，1951年8月出任苏联国家安全部部长，任内主持了震惊一时的“医生案件”与“明格列尔案件”，据赫鲁晓夫后来披露，斯大林曾亲自向他施压要求从被捕医生口中逼出口供。斯大林去世后，他因“领导国家安全部严重失职”于1953年4月被撤去中央书记职务，后经贝利亚倒台后的甄别获得平反，先后复任巴什基尔及鞑靼州委第一书记，1960年因健康原因退休。他是斯大林时代历任秘密警察首脑中唯一得以善终者。1983年11月27日，他在莫斯科去世，葬于新圣女公墓。"
 BYA_seymon_ignatyev_desc:0 "$CBIO_BYA_seymon_ignatyev_desc$"
 CBIO_CIN_hasan_israilov_desc:0 "哈桑·伊斯拉伊洛夫生于1910年，出生于车臣加兰乔日区，出身特尔洛伊部族，是六兄弟中最小的一个。1929年他在顿河畔罗斯托夫完成中学学业并加入共青团，后就读莫斯科东方劳动者共产主义大学。他早年以剧作与诗歌见长，后成为莫斯科农民报驻车臣通讯员，因撰文抨击苏联在车臣-印古什的政策而两度被捕，1935年又因在学生请愿书上签名批评北高加索政策被判五年西伯利亚强制劳动，1939年提前获释后返乡任律师。1940年1月，受苏芬冬季战争苏军受挫的鼓舞，他与兄长侯赛因在车臣东南山区建立游击基地，发动反苏武装起义，很快控制沙托伊区多个村落，击退内务人民委员部讨伐队并缴获现代武器。1942年他联合另一支起义军首领迈尔别克·谢里波夫，组建高加索兄弟特别党，试图将起义扩展至整个北高加索，并与德方接触寻求支持，但因拒绝交出运动主导权及坚持德方承认车臣独立而未能达成实质同盟。1944年2月车臣人遭整体强制迁徙时，他因身在山中而躲过一劫，全家却或被流放或被处决，此后他继续在山洞间流亡近十个月。1944年12月29日，内务人民委员部特工确认其已遇害，系被部下出卖所致。"
 CIN_hasan_israilov_desc:0 "$CBIO_CIN_hasan_israilov_desc$"
 CBIO_CIN_yusup_tambiev_desc:0 "尤苏普·杜达耶维奇·坦比耶夫生于1906年12月1日，出生于纳兹兰，是印古什族苏维埃党务与政治活动家。九岁时父母双亡，由叔父抚养长大，早年投身共青团工作，毕业于弗拉季高加索苏维埃党校，曾在家乡区委负责宣传鼓动工作。他后来出任车臣-印古什苏维埃社会主义自治共和国首任最高苏维埃主席团主席，是该共和国体制内的印古什族代表人物，其立场与同期爆发的车臣反苏起义截然不同，并非起义参与者。1944年2月23日，车臣与印古什两族遭整体强制迁徙至中亚，坦比耶夫一家亦未能幸免，被流放至吉尔吉斯苏维埃社会主义共和国。同年，他因病情严重不久即去世，葬于伏龙芝即今比什凯克。"
 CIN_yusup_tambiev_desc:0 "$CBIO_CIN_yusup_tambiev_desc$"
 CBIO_DAG_adil_girey_takhtarov_desc:0 "阿迪勒-吉列伊·塔赫塔罗夫生于1886年，出生于达吉斯坦州库姆托尔卡拉村，是苏联达吉斯坦自治共和国党务与政权干部。1937年至1938年，他出任达吉斯坦苏维埃社会主义自治共和国中央执行委员会主席，1938年该机构改制后，他继续出任达吉斯坦最高苏维埃主席团主席直至1950年，是苏联体制下达吉斯坦长期的名义最高领导人，任内正值苏联大清洗及卫国战争等重大历史时期。1962年，他在达吉斯坦去世。"
 DAG_adil_girey_takhtarov_desc:0 "$CBIO_DAG_adil_girey_takhtarov_desc$"
 CBIO_DAG_khair_hajji_uzunsky_desc:0 "海尔·哈吉·乌尊斯基即北高加索酋长国创建者乌祖恩-哈吉·萨尔京斯基，全称乌祖恩·海尔·哈吉汗，生于1848年，出生于达吉斯坦萨勒塔一个阿瓦尔族农民家庭。他自七岁起随多位当地经师学习，师从纳克什班迪苏菲教团谢赫阿卜杜拉赫曼-哈吉，后赴奥斯曼帝国深造并完成朝觐，因此获“哈吉”称号。1877年俄土战争期间他参与北高加索起义，起义失败后被捕并流放萨马拉省七年。1917年二月革命后他获赦返回达吉斯坦，投身高加索山民联盟政治，主张伊斯兰教法治理，是达吉斯坦民族委员会的组织者之一，曾就沙里亚法在达吉斯坦的推行主持公投并获多数村庄支持。1918年他率小股部队占据韦坚诺村，向邓尼金领导的白军宣战。1919年9月，他宣布成立北高加索酋长国，自任埃米尔，名义上接受奥斯曼苏丹穆罕默德六世的保护，同时与布尔什维克结盟对抗白军。1920年初，随着白军败退，布尔什维克转而要求他交出全部世俗权力，当时他已身患斑疹伤寒重病，不久后于韦坚诺去世，部分反共人士指其为苏方毒杀所致，但主流说法认为是病故。1920年3月30日，他去世，葬于韦坚诺附近沙米尔胡托尔，与伊玛目沙米尔家族墓地相邻。"
 DAG_khair_hajji_uzunsky_desc:0 "$CBIO_DAG_khair_hajji_uzunsky_desc$"
 CBIO_KAL_im_badmayev_desc:0 "架空人名。教名伊姆（Im）不像俄语、卡尔梅克语或常见蒙古语人名中的完整教名，更像从拉丁字母缩写或短音节中截取出的占位式名字，缺少可稳定追溯的圣名、族名或蒙古语词根。姓氏巴德马耶夫（Badmayev）则明显带有俄化布里亚特色彩，现实中以彼得·巴德马耶夫家族最为知名；这一姓氏与外贝加尔、藏传佛教、藏医药进入俄帝国上层社会的历史记忆相连。若放在卡尔梅克语境中，它能唤起蒙古语族佛教边疆、俄帝国行政体系与草原医学传统交错的联想。一个近乎空白的短教名，配上一个带有布里亚特藏医声望的俄化姓氏，像是把草原佛教文化与帝国边疆知识分子形象拼接在一起的架空姓名。"
 KAL_im_badmayev_desc:0 "$CBIO_KAL_im_badmayev_desc$"
 CBIO_KAL_nikolai_tundutov_desc:0 "尼古拉·丹赞诺维奇·通杜托夫，出身卡尔梅克通杜托夫王公家族，是该家族末代传人之一。其父丹赞·通杜托夫出身卓罗斯氏族，曾任阿斯特拉罕哥萨克军团长，俄国内战期间试图仿照顿河哥萨克模式组建卡尔梅克哥萨克部队，并率部投向白军一方，后在返回苏俄后被处决。尼古拉年幼时随母亲克谢尼娅流亡德国，此后辗转定居法国巴黎，通晓法语、俄语、德语等多国语言，曾任《国际先驱论坛报》驻巴黎记者。由于其家世背景，他一度被视为西方仍在世的卡尔梅克血统王公，晚年仍居巴黎。"
 KAL_nikolai_tundutov_desc:0 "$CBIO_KAL_nikolai_tundutov_desc$"
 CBIO_KHI_junaid_khan_desc:0 "朱奈德汗全名穆罕默德·古尔班，是土库曼约穆特部落首领，生年史料记载不一，有1857年与1862年两说，出身部落酋长世家，父亡后继承部落领导权。1912年至1916年土库曼人起义期间他崭露头角，希瓦汗伊斯凡迪亚尔为削弱土库曼势力威胁而授予他重权，但双方随后反目，他一度被囚禁，1917年内乱中重获自由并夺取实权，成为希瓦汗国事实上的统治者，伊斯凡迪亚尔沦为傀儡，1918年伊斯凡迪亚尔遇害后由赛义德·阿卜杜拉汗继任名义汗位。苏俄红军介入后，他于1920年被逐出希瓦，此后成为巴斯玛奇运动在花剌子模地区的主要领袖之一，长期在土库曼斯坦与红军周旋，一度攻占希瓦并短暂夺回部分失地。1920年代末他继续领导抵抗，1929年一度渗透阿富汗境内，最终率部退入波斯，后又转赴阿富汗，1938年，他在阿富汗去世。"
 KHI_junaid_khan_desc:0 "$CBIO_KHI_junaid_khan_desc$"
 CBIO_KHI_nedirbay_aytakov_desc:0 "内迪尔拜·艾塔科夫生于1894年，出生于外里海州曼吉什拉克半岛草原地带，是土库曼斯坦革命家及苏联政治家。1921年他当选克拉斯诺沃茨克县苏维埃代表大会代表并任县执行委员会委员，1922年出任克拉斯诺沃茨克市苏维埃执行委员会主席，同年加入俄国共产党（布）。1923年至1924年他任突厥斯坦苏维埃社会主义自治共和国中央执行委员会副主席，1924年1月起正式出任该机构主席直至1927年。1924年11月至1925年2月，他兼任土库曼斯坦临时政府革命委员会主席。随着土库曼斯坦升格为加盟共和国，他自1925年2月20日起出任土库曼苏维埃社会主义共和国中央执行委员会主席直至1937年7月，长期作为该共和国名义上的最高领导人，并自1925年5月起兼任苏联中央执行委员会主席团委员之一，代表土库曼方面。1937年7月21日至22日夜间，他在阿什哈巴德被捕，1938年10月28日苏联最高法院军事法庭以从事间谍活动及策划将土库曼斯坦分裂出苏联的罪名判处死刑，同日执行枪决。1956年12月12日，苏联最高法院军事法庭为其平反。"
 KHI_nedirbay_aytakov_desc:0 "$CBIO_KHI_nedirbay_aytakov_desc$"
 CBIO_LEB_abdallah_beyhum_desc:0 "阿卜杜拉·贝胡姆生于1879年，出生于贝鲁特一个逊尼派名门，是黎巴嫩政治家，曾两度出任黎巴嫩总理。1934年1月29日，法国黎凡特高级专员任命他为看守总理，此为法国托管体制下的过渡安排，任期约两年，至1936年1月30日由阿尤布·塔贝特宣誓继任。1939年9月21日，他正式受命组阁，再度出任总理，内阁在总统埃米尔·埃德任内维持至1941年4月4日。他所属的贝胡姆家族是贝鲁特显赫的逊尼派世家，家族多人涉足政坛与新闻界。1943年，他的挚友贝沙拉·胡里当选黎巴嫩总统并宣告独立，他遂大宴群僚以志庆贺，这被视为黎巴嫩首次由民选总统主持的正式庆典。1962年去世。"
 LEB_abdallah_beyhum_desc:0 "$CBIO_LEB_abdallah_beyhum_desc$"
 CBIO_LEB_alfred_naqqache_desc:0 "阿尔弗雷德·乔治·纳卡什生于1888年5月3日，出生于贝鲁特一个显赫的马龙派家庭，是黎巴嫩政治家，曾先后出任法国托管时期的黎巴嫩总理与总统。他早年赴法国索邦大学攻读法律，归国后成为知名律师与雄辩家，1919年为夏尔·科尔姆创办的腓尼基评论撰稿，是黎巴嫩腓尼基主义思潮的参与者。1941年4月，总统埃米尔·埃德在维希当局施压下辞职，维希法国黎凡特高级专员亨利·登茨遂任命纳卡什，他先短暂任总理，随即于4月9日出任总统。同年6月英联邦与自由法国部队攻入黎凡特，维希政权覆灭，他的总统职务在自由法国治下延续至1943年3月方才卸任，前后正值黎巴嫩迈向独立的动荡期，其接受维希任命的立场后世评价不一。1942年5月他主持了贝鲁特国家博物馆的开馆。1953年至1955年，他又出任黎巴嫩外交部长。1978年9月26日，他在贝鲁特去世。"
 LEB_alfred_naqqache_desc:0 "$CBIO_LEB_alfred_naqqache_desc$"
 CBIO_LEB_melick_yarad_desc:0 "架空人名。教名梅利克（Melick）是闪米特语“王”（马利克/Malik，希伯来语melekh）一词的变体拼写，同一词根见于腓尼基神祇梅尔卡特（Melqart，意为“城市之王”），带有浓厚的地中海东岸古代王权意象。姓氏亚拉德（Yarad）在阿拉伯语中意为“下降”“来临”，与希伯来圣经创世纪中族长雅列（Jared，以诺之父）同源，暗合黎巴嫩山地民众依山傍谷而居、族系“承接而降”的谱系观念。教名的“王”与姓氏的“降临”拼合在一起，恰似把古代近东“君王降世”的传说母题浓缩进了一个人名，是典型的托古取名式虚构组合。"
 LEB_melick_yarad_desc:0 "$CBIO_LEB_melick_yarad_desc$"
 CBIO_LEB_rami_sarraff_desc:0 "架空人名。教名拉米（Rami）源自阿拉伯语动词拉马（ramā，投掷、瞄准），意为“射手”“投掷者”，是阿拉伯世界历史悠久的尚武教名，也令人联想起伊斯兰朝觐仪式中“投石击柱”这一古老环节的词根渊源。姓氏萨拉夫（Sarraff）则是阿拉伯语职业姓氏，源自“苏拉夫”（sarf，货币兑换），意为“钱庄主”“兑币商”，在黎巴嫩这样长期扮演地中海贸易与金融枢纽角色的地区极为常见。一个指向弓马武艺的教名，配上一个指向账房柜台的姓氏，武功与商贾两条截然不同的黎巴嫩历史侧影被强行捏合在同一个名字里，是较为生硬的拼贴式虚构。"
 LEB_rami_sarraff_desc:0 "$CBIO_LEB_rami_sarraff_desc$"
 CBIO_RAP_juan_tepano_desc:0 "胡安·特帕诺生于1867年3月4日，是复活节岛拉帕努伊人领袖，纯血统拉帕努伊出身，由母亲维里亚莫抚养长大，其母生于1830年，尚记得岛民能够诵读朗格朗格文字的年代。他本名特帕诺·拉诺，因在智利期间被称作胡安而以此为名。1898年末或1899年初，他随末代拉帕努伊国王西梅昂·里罗·凯恩加赴瓦尔帕莱索，向智利政府申诉梅尔莱公司侵占岛地之冤，同行他与另两名拉帕努伊士兵原拟加入智利军队迈波团，岂料国王在梅尔莱手下设下的酒局中被灌醉，次日即传出送医并死于酒精中毒的消息，岛上口传则坚称国王系被梅尔莱下令毒杀。他通晓皮钦英语，能夹用西班牙语，英语，塔希提语与拉帕努伊语，1914至1915年间为英国人类学家凯瑟琳·劳特利奇的曼纳考察团充任报信人与翻译，劳特利奇曾试图向他学习朗格朗格，他后来坦言自己其实并不通晓此种文字。1934至1935年间，他又为瑞士人类学家阿尔弗雷德·梅特罗的到访提供协助。他被智利军方追认为参加过太平洋战争的拉帕努伊军官之一，瓦尔帕莱索普拉亚安查的迈波团曾为他立碑纪念。1947年11月8日，他在复活节岛去世，享年八十岁。"
 RAP_juan_tepano_desc:0 "$CBIO_RAP_juan_tepano_desc$"
 CBIO_RKH_erich_friderici_desc:0 "埃里希·弗里德里奇生于1885年12月21日，出生于上西里西亚普莱斯地区的蒂门多夫，是德国将领，而非捷克或西里西亚本地人物。他十二岁进入德累斯顿萨克森军校，十九岁以候补军官身份入伍，一战中任团副官，在西线负伤，战后留任国防军。他历任莱比锡卫戍司令，驻布达佩斯与索非亚武官，第十七师师长等职，1939年4月晋步兵上将，同月起出任德国驻波希米亚-摩拉维亚保护国的国防军全权代表兼保护国军区司令，主管保护国政府军事务，任内曾提交一份主张彻底瓦解捷克民族的备忘录，行文充满国家社会主义色彩，并因职权与党卫队及文官当局屡起摩擦。1941年10月起，他在原司令卡尔·冯·罗克斯病休期间代理南方集团军后方地区司令至次年初，该地区正是大屠杀与针对平民暴行的发生地。此后他一度转入元首预备役，又出任但泽及维也纳军区职务，1944年受命组织东线溃退部队。1945年5月他被俘，1947年获释后定居巴伐利亚。1967年9月19日，他在加尔米施-帕滕基兴去世。"
 RKH_erich_friderici_desc:0 "$CBIO_RKH_erich_friderici_desc$"
 CBIO_RKH_jaroslav_eminger_desc:0 "雅罗斯拉夫·埃明格生于1886年6月4日，是捷克军官，曾统领德占时期波希米亚-摩拉维亚保护国的政府军。他受教于特雷西亚军事学院，一战中在奥匈军队东线与意大利战线服役，战后先在布达佩斯主持捷克斯洛伐克军事使团的情报工作，回国后作为骑兵军官逐级晋升，官至第三快速师师长。1939年德国占领捷克后他一度离国，经阿洛伊斯·埃利亚什劝说返回，协助组建仅约七千人的保护国政府军，并于同年8月成为首任司令，1939年11月授二级将官，1942年8月晋一级将官。任内他表面与德方合作，暗中却设法令这支军队作战低效，并对士兵的抵抗活动睁一眼闭一眼，当部下问及若真截获盟军伞兵该如何处置时，他答道人少则放过，人多则加入他们。1944年春，面对将政府军调往意大利协助德军的要求，他曾徒劳抗议。1945年5月5日，他下令麾下第一营在捷克广播电台之战中掉转枪口对抗德军，并增派兵力协助夺取布拉格城堡。战后他被捕并于1947年4月以通敌罪受审，多名证人为他辩护，特别国家法庭最终认定指控毫无根据，称他是忠诚的捷克人与勇敢之士，为十五名获判无罪者之一，1949年恢复军衔。此后他在耶瓦尼隐居，1964年7月14日去世。"
 RKH_jaroslav_eminger_desc:0 "$CBIO_RKH_jaroslav_eminger_desc$"
 CBIO_SIL_alexander_hochberg_desc:0 "亚历山大·霍赫贝格生于1905年2月1日，出生于伦敦，全名为亚历山大·弗里德里希·冯·霍赫贝格伯爵，是普莱斯亲王家族的后裔，父亲是第三代普莱斯亲王汉斯·海因里希十五世，母亲为英国名媛戴西。需要说明的是，游戏所标西里西亚自治运动的推手其实是其父汉斯·海因里希十五世，后者一战后倡议上西里西亚独立，资助分离派并谋求将普莱斯与富尔斯滕施泰因纳入所谓西里西亚国，亚历山大本人的经历则与此不同。1921年上西里西亚公投后普莱斯划归波兰，他遂成为波兰公民。因家族债务缠身，其名下产业大半被波兰国家接管，父亲1938年去世后他移居巴黎。二战后期他加入西方的波兰军队，在安德斯将军麾下作战，曾担任波兰流亡政府首相西科尔斯基将军的贴身警卫，在北非与意大利战场表现出色，获颁卡西诺山纪念十字勋章等荣誉。战后他定居西班牙马略卡岛的波连萨。1984年，他一度成为霍赫贝格-普莱斯家族的族长，同年2月22日在马略卡去世。"
 SIL_alexander_hochberg_desc:0 "$CBIO_SIL_alexander_hochberg_desc$"
 CBIO_SIL_jozsef_kozdon_desc:0 "约瑟夫·科兹东生于1873年9月8日，出生于切申西里西亚的莱什纳古尔纳，是西里西亚自治派政治家。他自1893年起在斯特鲁米恩与斯科丘夫等地任小学教师及校长，活跃于奥地利西里西亚的乡村教师联合会。1908年夏他创建西里西亚人民党，次年出任党首直至1938年，主张西里西亚人自成一个民族，既非波兰人亦非德意志人，他有一句自白广为流传，称我不是德国人，但也不是且不愿做波兰人，我是讲波兰语的西里西亚人。他自1909年当选奥帕瓦西里西亚议会议员，一战后先寄望于奥地利西里西亚在奥地利联邦中获得自由邦地位，继而转向切申西里西亚独立，并与上西里西亚人联盟合作起草独立请愿。切申西里西亚划分时他倾向捷克斯洛伐克，获对方许诺自治，后长期担任捷克切申市长，1925年创办西里西亚人民银行并于1940至1944年间任行长。他对德意志文化在切申西里西亚地位的立场至今存在争议，有史家指其支持德意志化政策。1949年12月7日，他在奥帕瓦去世，享年七十六岁。"
 SIL_jozsef_kozdon_desc:0 "$CBIO_SIL_jozsef_kozdon_desc$"
 CBIO_VGE_aleksander_heck_desc:0 "亚历山大·赫克曼生于1908年8月17日，出生于萨拉托夫省一个泥瓦匠家庭的巴尔泽尔即戈雷卡拉梅什村，是苏联伏尔加德意志人政治家。他十岁起做绕线工，1922年加入共青团，1930年入党，1934年毕业于萨拉托夫农业机械化学院，求学期间积极参与当地的集体化与消灭富农运动。此后他在轻工业与农业系统任电气工程师，1937年9月出任伏尔加德意志人苏维埃社会主义自治共和国轻工业人民委员，1938年2月当选该共和国党委第二书记，同年6月20日起出任人民委员会主席直至1941年9月，是该共和国末任政府首脑。1941年6月苏德战争爆发后，他与末任国家元首康拉德·霍夫曼于7月13日至14日联名呼吁德意志民族不要向苏联人民流血，而应掉转枪口反对希特勒。1941年9月，依照迁徙伏尔加德意志人的法令，他与家人被流放至克拉斯诺亚尔斯克边疆区米努辛斯克，同月被缺席免职。此后他在劳动大军中做工，1944年5月因所谓伏尔加德意志人前领导层案被捕，1946年8月以带有民族主义色彩的反苏宣传罪判处四年徒刑。1948年获释后他在比斯克火柴厂任动力工程师，1957年起在巴统一家设计院工作。1994年，他在巴统去世。"
 VGE_aleksander_heck_desc:0 "$CBIO_VGE_aleksander_heck_desc$"
 CBIO_VGE_heinrich_luft_desc:0 "海因里希·吕夫特生于1899年3月15日，出生于萨拉托夫省卡梅申县的索斯诺夫卡即希林村一个鞋匠家庭，是苏联伏尔加德意志人党务与政权干部。他1911年在萨拉托夫纺织厂附属的初等学校毕业，后投身革命，1918年11月加入布尔什维克党，曾在红军中任军事委员多年，1927年任波克罗夫斯克即今恩格斯市军事委员。1932至1933年他任巴尔泽尔县委书记，继而主持伏尔加德意志消费合作社。1936年2月，他在伏尔加德意志共和国党委全会上被任命为该共和国中央执行委员会兼人民委员会主席，成为名义上的最高领导人之一，并跻身内务人民委员部特别三人组，参与大清洗决策。1937年3月他卸去中执委主席一职，仍保留人委会主席职务，同年8月因所谓地下民族主义法西斯组织案被捕，被指托洛茨基主义，12月22日被列入斯大林处决名单判处死刑。1938年1月16日，他在莫斯科被枪决。"
 VGE_heinrich_luft_desc:0 "$CBIO_VGE_heinrich_luft_desc$"
 CBIO_YAK_anatoly_pepelyayev_desc:0 "阿纳托利·尼古拉耶维奇·佩佩利亚耶夫生于1891年7月15日，出生于托木斯克一个军人家庭，是俄国内战时期的白军中将，其兄维克托曾任科尔恰克政府总理。他毕业于巴维尔军事学校，一战中以骁勇著称，俄国革命后在家乡托木斯克举起白旗，组建中西伯利亚军团并与捷克军团联手，1918年沿西伯利亚大铁路东进使白军一度控制西伯利亚，同年12月攻克彼尔姆，俘获大批红军，赢得西伯利亚的苏沃洛夫之名，二十七岁即晋少将。他与科尔恰克素有龃龉，一度以逮捕相威胁。科尔恰克政权崩溃后他辗转哈尔滨，以木匠，出租车司机等杂役谋生，仍图光复西伯利亚。1922年8月他率约五百余名志愿者组成的义勇队渡鄂霍次克海登陆，发动内战最后一役即雅库特远征，一度深入内陆逼近雅库茨克，但在红军优势兵力与严酷极地条件下受挫，1923年6月于阿扬投降。他被弗拉迪沃斯托克军事法庭判处枪决，后经请求减为十年监禁，先后关押雅罗斯拉夫尔与布蒂尔卡监狱，1936年6月获释，在沃罗涅日做木匠。1937年8月大清洗中他再度被捕，押往新西伯利亚，被控组建反革命组织，同年12月7日判处死刑。1938年1月14日，他被处决，1989年获平反。"
 YAK_anatoly_pepelyayev_desc:0 "$CBIO_YAK_anatoly_pepelyayev_desc$"
 CBIO_YAK_pavel_pevznyak_desc:0 "帕维尔·马特维耶维奇·佩夫兹尼亚克生于1898年，本名法伊维尔·莫尔杜霍维奇，出生于莫吉廖夫省姆斯季斯拉夫尔县杜季诺村一个商人家庭，犹太人，是苏联党务与政权干部。他1917年加入俄共布，早年在维亚济马任报纸编辑及县委书记，后历任斯摩棱斯克省委组织指导部负责人，并在哈尔科夫省与哈尔科夫专区从事党务。1930年起他出任雅库特州委第一书记直至1939年，当选苏联首届最高苏维埃代表，任内正值大清洗，他本人也曾参与对同僚的政治镇压。1939年2月5日他被捕，1940年5月28日经雅库特最高法院以反革命组织罪等条款判处死刑，1941年5月经苏联内务人民委员部特别会议将极刑改为八年劳改。1942年，他在达尔斯特罗伊的劳改营中服刑期间去世，1955年12月12日获平反。"
 YAK_pavel_pevznyak_desc:0 "$CBIO_YAK_pavel_pevznyak_desc$"
 CBIO_ABK_kirilli_bechvaya_desc:0 "基里尔·格奥尔基耶维奇·贝奇瓦亚生于1903年，是苏联时期阿布哈兹的党务干部。他自1937年起代理阿布哈兹州委第一书记，1938年6月正式就任该职直至1940年，这一职务是当时格鲁吉亚苏维埃社会主义共和国治下阿布哈兹自治共和国的最高权力岗位。其任期正值苏联大清洗延烧至外高加索，阿布哈兹党政机关亦历经人事更迭与镇压。此后他转任其他地区职务，1944年至1951年间又出任邻近的阿扎尔州委第一书记。关于他的早年经历与家庭背景，现有公开的俄文资料记载简略。1974年去世。"
 ABK_kirilli_bechvaya_desc:0 "$CBIO_ABK_kirilli_bechvaya_desc$"
 CBIO_AFA_sultan_mohamed_yayyo_of_aussa_desc:0 "穆罕默德·亚约约生于1885年，是奥萨苏丹国的末代苏丹，该国是阿法尔人在今埃塞俄比亚，厄立特里亚与吉布提交界的阿法尔三角地带建立的君主国，长期被视为阿法尔诸君之首。他在1910年代平息多年内乱后掌握苏丹国实权。第二次意大利埃塞俄比亚战争期间，他起初被意军的一支雇佣军逐走，随后转而与意大利入侵者合作，1936年4月意军完全占领苏丹国，他曾赴罗马在威尼斯宫觐见墨索里尼并发表效忠意大利帝国的演说，苏丹国遂被并入意属东非。二战中英军攻入后，他一度与英国军政当局共事，但与其重臣菲塔瓦拉里·亚约日渐失和。1942年海尔·塞拉西一世自流亡返国复位，因不满亚约在意大利入侵时的背离，1944年4月派出约两百人的远征队将其废黜，由其亲属阿里米拉赫·汉法雷继任苏丹。1944年，他被送往亚的斯亚贝巴后去世。"
 AFA_sultan_mohamed_yayyo_of_aussa_desc:0 "$CBIO_AFA_sultan_mohamed_yayyo_of_aussa_desc$"
 CBIO_BAN_a_k_fazlul_huq_desc:0 "阿布尔·卡塞姆·法兹勒·胡克生于1873年10月26日，出生于孟加拉巴克尔甘杰县萨图里亚外祖家，是英属印度时期著名的孟加拉穆斯林政治家，律师，人称孟加拉之虎。他早年在加尔各答求学，取得化学，数学，物理三科荣誉学位，又攻得数学硕士与法律学位，是南亚最早的穆斯林律师之一。1913年他当选孟加拉立法会议员，此后长期活跃于政坛，曾同时出任全印穆斯林联盟主席与印度国民大会党总书记这一罕见兼职，1935年成为加尔各答首位穆斯林市长。1937年孟加拉首次大选后，他率领代表佃农利益的农工党组阁，出任孟加拉首任总理直至1943年，任内推动减轻农民债务的多项立法。1940年3月，他在拉合尔提出著名的拉合尔决议，主张在英属印度穆斯林占多数的东部与西北部建立独立国家，该决议被视为巴基斯坦建国运动的奠基文件。印巴分治后，他历任东孟加拉总检察长，首席部长，巴基斯坦内政部长及东巴基斯坦总督。晚年他因主张维护东孟加拉权益而与西巴基斯坦当局龃龉，1958年被阿尤布·汗政权免职。1962年4月27日，他去世，享年八十八岁。"
 BAN_a_k_fazlul_huq_desc:0 "$CBIO_BAN_a_k_fazlul_huq_desc$"
 CBIO_BAR_yeta_iii_desc:0 "耶塔三世本名利蒂亚，约生于1871年，是今赞比亚西部洛齐人即巴罗策人的国王，当地尊称为利通加，1916年至1945年在位。他是国王莱瓦尼卡之子，1916年3月13日在莱阿卢伊登基。任内他推行改革，1925年废除了作为奴役制最后残余的强制劳役传统。1937年他远赴伦敦西敏寺出席英王乔治六世的加冕典礼，归途或返国后对这一盛况印象极深，其秘书曾记下此行是他们一生所见最盛大的场面。1939年初他突患严重中风，导致半身瘫痪并丧失语言能力。此后他因健康每况愈下，终于1945年退位，由其弟继位。他育有多名子女。退位后不久，他去世，葬于穆伦博。"
 BAR_yeta_iii_desc:0 "$CBIO_BAR_yeta_iii_desc$"
 CBIO_BAY_rupprecht_of_bavaria_desc:0 "鲁普雷希特·冯·维特尔斯巴赫生于1869年5月18日，出生于慕尼黑，是巴伐利亚末代王储，巴伐利亚末代国王路德维希三世的长子。他是首位就读公立学校的巴伐利亚王室成员，早年在慕尼黑与柏林的大学进修，并投身巴伐利亚军队。第一次世界大战期间，他先统率西线的德国第六集团军，1916年8月起指挥以其命名的鲁普雷希特集团军群，与英国远征军对峙，是德军最负盛名的高级将领之一。1918年11月其父发表安尼夫宣言，巴伐利亚沦为共和国，维特尔斯巴赫家族七百余年的统治告终，他丧失了继承王位的机会。1921年父亲去世后，他成为维特尔斯巴赫家族族长兼巴伐利亚王位觊觎者，主张恢复君主立宪。他始终拒绝纳粹的拉拢，私下称希特勒为疯子，并曾助力阻止希特勒的啤酒馆政变。1939年12月，他被迫流亡意大利，寄居于意大利国王维托里奥·埃马努埃莱三世处。1944年刺杀希特勒事件后，滞留意大利的他躲过逮捕，妻儿却被关入集中营直至1945年获美军解救。战后他返回巴伐利亚，仍倡导复辟君主制而未获美国占领当局支持。1955年8月2日，他在洛伊特施泰滕去世，约五万人前往吊唁。"
 BAY_rupprecht_of_bavaria_desc:0 "$CBIO_BAY_rupprecht_of_bavaria_desc$"
 CBIO_BIA_akenzua_ii_desc:0 "阿肯祖阿二世生于1899年1月7日，是尼日利亚贝宁王国埃多人的第三十七任奥巴即国王，1933年至1978年在位，并非贝宁共和国的君主。他父亲是奥巴埃维卡二世，1933年2月去世后，他于同年4月登基。他既深谙贝宁传统礼制，又受过西式教育，曾就读拉各斯国王学院并考取当时可达的最高级别，登基前还担任过贝宁土著行政机关的运输文书及其父的机要秘书。在英国间接统治下，他致力于为埃多子民兴办西式教育，并着力恢复英国在1897年惩罚性远征后禁绝的多项社会，政治与传统习俗。1936年，他发起了追讨在那场远征中被劫掠的贝宁铜器的运动，呼吁将这批珍贵文物归还尼日利亚，尽管其在位期间三千件宫廷铜器中仅有极少数得以归还。尼日利亚独立后，贝宁君主转为礼仪与文化职能，他获授联邦司令勋衔等荣誉。1978年6月11日，他去世，由其子继位为奥巴埃雷迪奥瓦。"
 BIA_akenzua_ii_desc:0 "$CBIO_BIA_akenzua_ii_desc$"
 CBIO_BRD_mwambutsa_iv_desc:0 "姆瓦姆布扎四世·班吉里森杰生于1912年5月6日，是布隆迪倒数第二位国王即姆瓦米，1915年至1966年在位，属加尔瓦贵族。1915年其父穆塔加四世在一场家族纷争中去世，尚在襁褓的他继位为王，取王号姆瓦姆布扎，因年幼而由包括太后里里库穆蒂马在内的多位家族成员摄政。他即位时布隆迪属德属东非，1916年一战东非战事中被比利时占领，此后长期处于比属殖民统治下的间接统治体制。1929年8月他被宣告成年，亲掌王权。1962年7月1日布隆迪独立为王国，他成为握有实权的国家元首，力图在胡图与图西两族之间保持平衡，交替从两族中遴选首相。1965年10月胡图军官发动政变，虽未得手，他仍流亡刚果共和国，继而移居瑞士。1966年3月他指定独子恩迪泽耶代行王权，同年7月8日在流亡中被正式废黜，其子短暂即位为恩塔雷五世，同年11月君主制在第三次政变中被彻底废除。1977年3月26日，他在瑞士去世。"
 BRD_mwambutsa_iv_desc:0 "$CBIO_BRD_mwambutsa_iv_desc$"
 CBIO_BSK_yakov_bykin_desc:0 "雅科夫·鲍里索维奇·贝金本姓贝尔科维奇，生于1888年12月25日，出生于维捷布斯克省克雷茨堡即今拉脱维亚境内一个店员家庭，犹太人，是苏联党务与国家干部。他早年仅读过两年犹太官办学校，1904至1912年为崩得成员，曾在里加崩得委员会担任领导工作并多次被捕，1912年转入布尔什维克党，一战期间流亡瑞士。他历任沃罗涅日省委，雅罗斯拉夫尔省委责任书记等职，1930年2月起出任巴什基尔州委第一书记直至1937年10月，任内巴什基尔苏维埃自治共和国建成多座大型工业企业并开辟新油区，1935年他因农业与工业成绩获颁列宁勋章。1937年10月三日至六日巴什基尔州委召开紧急全会，日丹诺夫到会指控他与共和国领导层从事破坏活动，称党组织内存在以他为首的托洛茨基布哈林反革命集团，全会以逮捕二百七十余人告终。他于同年10月16日被捕，1938年2月10日被枪决，1956年获平反。"
 BSK_yakov_bykin_desc:0 "$CBIO_BSK_yakov_bykin_desc$"
 CBIO_CAT_lluis_companys_desc:0 "路易·孔帕尼斯·霍韦尔生于1882年6月21日，出生于加泰罗尼亚莱里达附近的埃尔塔罗斯，是加泰罗尼亚政治家，律师。他出身有贵族渊源的农民家庭，在巴塞罗那大学攻读法律，早年即投身工人运动与加泰民族主义，是加泰罗尼亚共和左翼党的创始领袖之一。1931年他一度出任巴塞罗那市长并宣告第二共和国，前总统弗朗塞斯克·马西亚逝世后，他于1933年当选加泰罗尼亚自治政府主席。1934年10月，他因反对右翼势力入阁而宣布在西班牙联邦共和国内成立加泰罗尼亚国，行动失败后被判处三十年监禁，1936年人民阵线获胜后获释复职。西班牙内战期间，他始终效忠共和一方，主持协调各方反法西斯武装。1939年共和国败局已定后，他流亡法国，后因幼子在巴黎重病而多次错失离境时机。1940年8月，他在南特附近被盖世太保逮捕，移交佛朗哥政权，遭刑讯后于同年10月15日在巴塞罗那蒙锥克城堡被枪决，他拒绝蒙眼，就义前高呼为了加泰罗尼亚，是欧洲历史上唯一一位在任期间被处决的民选国家元首。"
 CAT_lluis_companys_desc:0 "$CBIO_CAT_lluis_companys_desc$"
 CBIO_CAT_andreu_nin_i_perez_desc:0 "安德烈乌·宁·佩雷斯生于1892年2月4日，出生于塔拉戈纳省埃尔文德雷利，鞋匠之子，是西班牙政治家，工会活动家，翻译家。他早年任教师，1919年加入无政府工团主义的全国劳工联盟并出任总书记，后赴莫斯科代表该组织参加赤色工会国际成立大会，因遭指控涉嫌暗杀西班牙首相而滞留苏俄。旅苏期间他亲历十月革命，转向马克思主义，1926年加入托洛茨基领导的左翼反对派，因此于1930年遭开除并被逐出苏联。回国后他致力组建西班牙托派组织，1935年与工农集团合并成立马克思主义统一工人党即马统工党，任中央委员及机关刊物主编，次年当选总书记。西班牙内战爆发后，他成为加泰罗尼亚政府司法委员，后因苏联驻加泰领事威胁断绝援助而被解职。1937年五月事件后马统工党遭取缔，他于6月16日在巴塞罗那被苏联内务人民委员部特工秘密逮捕，押往阿尔卡拉德埃纳雷斯监狱严刑拷打，始终未招认强加于他的莫须有罪名。1937年6月20日，他遇害身亡，乔治·奥威尔在纪实作品向加泰罗尼亚致敬中记述了这一事件。"
 CAT_andreu_nin_i_perez_desc:0 "$CBIO_CAT_andreu_nin_i_perez_desc$"
 CBIO_CAT_daniel_cardona_i_civit_desc:0 "丹尼尔·卡多纳·伊西维特生于1890年8月20日，出生于巴塞罗那，笔名维布兰特，绰号爱尔兰人，是二十世纪加泰罗尼亚激进分离主义最重要的代表人物之一。他青年时代深受爱尔兰新芬党唯我独立理念感召，主张唯有武装起义方能使加泰罗尼亚摆脱压迫。他曾与人策划刺杀西班牙国王阿方索十三世未遂的加拉夫阴谋，1930年创立仿效新芬党模式的唯我们党并亲自统领其军事机构，长期从事地下密谋活动。1931年他当选圣胡斯特德斯韦恩市长，同年因参与十月六日事件被捕，越狱后流亡法国。西班牙内战期间他一度返乡保护当地平民，五月事件后再度流亡法国南部，在当地积极参与法国抵抗运动，并致力于推动加泰独立派各团体联合，与胡安·科尔努德利亚共同创建加泰罗尼亚民族阵线。1942年，他秘密潜回圣胡斯特德斯韦恩。1943年3月7日，他在当地去世，葬礼在警方严密戒备下于清晨草草举行，以防成为民族主义宣传场合。"
 CAT_daniel_cardona_i_civit_desc:0 "$CBIO_CAT_daniel_cardona_i_civit_desc$"
 CBIO_CAT_francesc_cambo_i_batlle_desc:0 "弗朗塞斯克·坎博·伊巴特列生于1876年9月2日，出生于加泰罗尼亚下安普尔丹韦尔赫斯，是西班牙保守派政治家，加泰罗尼亚联盟党创始人兼领袖。他在巴塞罗那攻读哲学文学与法律学位，早年投身加泰民族主义学生运动，1901年当选巴塞罗那市议员，同年参与创立联盟党，此后长期主导该党直至1936年解散。1906年他发起加泰罗尼亚团结运动以抗议限制言论自由的司法法，次年遭政敌枪击受伤。他主张加泰罗尼亚应在西班牙体制内争取自治与影响力，而非彻底独立，因此在马德里被视为隐性分离主义者，在巴塞罗那又被激进派斥为叛徒，曾被议员当面讥讽不可能既做加泰罗尼亚的玻利瓦尔又做西班牙的俾斯麦。他两度出任西班牙内阁部长，1918年任发展部长，1921年任财政部长，并因参与国际电力业务积累巨额财富，此后成为重要的艺术收藏家与文化赞助人，资助伯纳特梅特格丛书等加泰罗尼亚文化工程。西班牙内战爆发时他身在国外，虽未直接参与叛乱，但出于对共产主义控制西班牙的忧虑而资助佛朗哥一方，战后终生未再返居西班牙，先后流亡巴黎与瑞士。1947年4月30日，他在阿根廷布宜诺斯艾利斯去世。"
 CAT_francesc_cambo_i_batlle_desc:0 "$CBIO_CAT_francesc_cambo_i_batlle_desc$"
 CBIO_CHU_gerasim_ivanov_desc:0 "格拉西姆·伊万诺维奇·伊万诺夫生于1905年2月27日，出生于喀山省齐维尔斯克县秋梅列沃村一个农民家庭，楚瓦什族，是苏联党务干部。他1925年加入联共布，自1922年起从事经济，社会与政治工作。1937年9月起任楚瓦什苏维埃自治共和国州委第二书记，同年11月晋升第一书记。1938年9月，他被免去职务并被开除党籍，当选苏联首届最高苏维埃代表的身份亦未能保全他，同年10月27日被捕，罪名是参与反革命民族主义组织。1939年2月22日，苏联最高法院军事法庭判处他死刑，次日即2月23日在莫斯科被枪决，葬于新顿河公墓。1955年4月9日，他获得平反。"
 CHU_gerasim_ivanov_desc:0 "$CBIO_CHU_gerasim_ivanov_desc$"
 CBIO_CPS_ratsadanay_desc:0 "拉察达奈约生于1874年，是老挝南部占巴塞王国的末代国王，占巴塞末代亲王本奥姆之父。其父去世后，他于1900年7月28日获暹罗国王任命为占巴塞土邦亲王总督，并获赐尊贵封号。1904年暹罗依法暹条约将主权移交法国后，他被迫接受法国保护，占巴塞王国于同年11月22日被法国当局废除，但他终身保留原有称号与荣誉。此后他改任法属占巴塞省长，首府设于巴色，直至1934年12月满六十岁而被迫退休。1941年3月，泰国借日本调停一度吞并占巴塞旧地，他被追认为占巴塞世袭亲王，统辖旧王国全境，同年5月法方被迫将该省交还泰国。1945年9月，其子本奥姆亲王邀请法国重新占领巴色。他育有十一子十七女。1945年去世。"
 CPS_ratsadanay_desc:0 "$CBIO_CPS_ratsadanay_desc$"
 CBIO_CRI_ilyas_tarkhan_desc:0 "伊利亚斯·乌梅罗维奇·塔尔汗生于1900年，是苏联克里米亚鞑靼族记者，剧作家，政治家。他历任雅什库韦特报编辑，1931年2月20日出任克里米亚苏维埃自治共和国中央执行委员会主席，是该自治共和国的名义最高领导人。任内他兼事戏剧创作，进攻与莫斯科在说话两部剧作先后于1932年与1934年在苏联多地首演，并倡议兴建克里米亚国立鞑靼戏剧院。1934年他加入苏联作家协会并出任克里米亚作家协会主席，还一度主编州委机关刊物布尔什维克之路。1937年9月8日，他与阿卜杜拉伊姆·萨梅迪诺夫，比拉尔·恰加尔一同被捕，被控领导反苏泛突厥主义组织，这一案件成为大清洗期间针对克里米亚鞑靼人整体清洗浪潮的开端。1938年4月17日，他被处决，1956年获平反。"
 CRI_ilyas_tarkhan_desc:0 "$CBIO_CRI_ilyas_tarkhan_desc$"
 CBIO_DON_vladimir_sidorin_desc:0 "弗拉基米尔·伊里奇·西多林生于1882年2月3日，出生于顿河哥萨克州第二顿河区叶萨乌洛夫斯卡亚镇，父亲是顿河军官，叔父列昂季·西多林将军1918年2月被布尔什维克枪决，是俄国内战时期的顿河军总司令。他参加过日俄战争，一战期间历任多个师及集团军参谋职务。俄国革命后他返回顿河投身白军运动，1919年2月接替斯维亚托斯拉夫·杰尼索夫出任顿河军司令，率部与顿河哥萨克起义军会师，一度将部队扩充至四万人，并按邓尼金进军莫斯科的指令沿顿河北上直逼沃罗涅日，后在布琼尼骑兵反击下败退。1920年新罗西斯克大撤退后，他与顿河军参谋长凯尔切夫斯基一同因主张顿河脱离俄国的分离言论及部队自行撤退行为受审，被判四年苦役，后经弗兰格尔将军减为革除军职。此后他辗转保加利亚，塞尔维亚，1924年定居捷克斯洛伐克，在布拉格捷军总参谋部制图局任职，并与斯塔里科夫将军合著多篇关于顿河军战史的文章，后结集出版为哥萨克的悲剧。1939年他移居德国，1943年5月20日在柏林去世，葬于柏林泰格尔俄国东正教公墓。"
 DON_vladimir_sidorin_desc:0 "$CBIO_DON_vladimir_sidorin_desc$"
 CBIO_EGY_ahmed_husayn_desc:0 "艾哈迈德·侯赛因生于1911年3月8日，出生于埃及一个财政部公务员家庭，祖籍下埃及杜姆亚特附近，是埃及民族主义政党青年埃及党创始人。他接受宗教教育并取得法学学位，早年创办呐喊杂志鼓吹民族主义，1931年发起皮阿斯特计划筹款以扶植本国工业，曾用这笔资金建起一家非斯帽工厂。1933年10月，他将原先的自由青年协会改组为正式政党青年埃及党，以埃及优先为纲领，反对英国控制，组建绿衫军准军事团体，与华夫脱党的蓝衫军多次街头冲突。他游历欧洲期间曾致信阿道夫·希特勒表达敬慕之情。1941年他因激进民族主义活动被捕，越狱后于1942年11月自首，1944年获释。1946年他因党报呐喊革命的头版标语再度被捕，旋即保释。此后他将政党更名为埃及社会民主党，后又改为民族伊斯兰党，晚年据称重新拥抱伊斯兰信仰。1969年他因中风退出公共生活。1982年9月27日，他因心脏病去世。"
 EGY_ahmed_husayn_desc:0 "$CBIO_EGY_ahmed_husayn_desc$"
 CBIO_EGY_farouk_muhammad_ali_desc:0 "名单原名系游戏对国王法鲁克世系的误植，其父实为福阿德一世，穆罕默德·阿里帕夏则是其高祖辈的王朝创始人，并非其生父，现据其真实生平撰述。法鲁克生于1920年2月11日，出生于开罗阿卜丁宫，是埃及穆罕默德·阿里王朝第十任统治者，福阿德一世与王后娜兹莉之长子。1936年4月父王病逝，年仅十六岁的他自英国伍利奇皇家军事学院中断学业归国继位，即位之初深受民众爱戴。他通晓阿拉伯语，土耳其语，法语，后又习得英语与意大利语，自视为埃及人而非阿拉伯人。他继承包括五座宫殿，两艘游艇及尼罗河谷大片土地在内的巨额家产，但缺乏治国准备，渐以奢靡享乐与嗜好收藏闻名，人称开罗神偷。二战期间他被指对轴心国抱有同情，迟至1945年方在英方压力下对轴心国宣战。1948年阿以战争中埃军战败，加之王室腐败与治理无能，民怨日炽。1952年7月23日，以纳吉布，纳赛尔为首的自由军官发动政变，他被迫退位并流亡意大利，由其六个月大的幼子继位为福阿德二世，次年埃及正式宣告成立共和国，王朝统治终结。晚年他寓居罗马，以美食与夜生活消磨时光。1965年3月18日，他在罗马一次丰盛晚宴后猝然离世，遗体运回埃及安葬于拉法伊清真寺。"
 EGY_farouk_muhammad_ali_desc:0 "$CBIO_EGY_farouk_muhammad_ali_desc$"
 CBIO_EGY_hosni_al_arabi_desc:0 "马哈茂德·胡斯尼·阿拉比，埃及早期共产主义运动领导人。1921年，他代表刚成立的埃及社会党赴莫斯科，与共产国际接洽该党加入事宜，同年末返回埃及，带回须遵守共产国际二十一条件的指示。他与党内财务负责人罗森塔尔长期存在矛盾，自莫斯科归国后声称共产国际要求开除罗森塔尔，几经争执后，罗森塔尔于1922年12月辞职。1923年1月25日，该党正式更名为埃及共产党并获准加入共产国际，阿拉比是这一转变的主要推动者之一。此后他继续在党内担任领导职务，直至埃及殖民当局对共产党展开镇压，大批党员被捕，党部遭查封。"
 EGY_hosni_al_arabi_desc:0 "$CBIO_EGY_hosni_al_arabi_desc$"
 CBIO_EGY_muhammad_naguib_desc:0 "穆罕默德·纳吉布生于1901年2月19日或20日，出生于苏丹喀土穆，母系家族世代从军，外祖父在保卫喀土穆抵御马赫迪军队时殉职，是埃及军官，政治家，首任总统。他就读喀土穆戈登纪念学院，1918年毕业于埃及军事学院，后取得法学学位及政治经济学，私法硕士学位，是首位取得法律学位的埃及军官。他在1948年阿以战争中三次负伤，因战功获福阿德国王一级军事星章及贝伊称号，此后出任军官学校校长。1949年他秘密加入迦马尔·阿卜杜·纳赛尔领导的自由军官运动，1952年1月在军官俱乐部主席选举中击败国王属意的人选而声名大噪。1952年7月23日自由军官发动政变推翻法鲁克，他出任革命指挥委员会主席，9月组阁任总理兼国防海军大臣。1953年6月18日埃及宣告成立共和国，他就任首任总统，成功推动苏丹独立并促使英军全部撤离埃及。1953年末，他因土地改革等问题与纳赛尔渐生嫌隙，遭指控支持已被取缔的穆斯林兄弟会，权力斗争中落败，1954年11月被迫辞去总统职务，此后被软禁于开罗郊外一处别墅近三十年，直至1971年萨达特将其释放。1984年8月28日，他因肝硬化在开罗去世，享年八十三岁，以军礼安葬。"
 EGY_muhammad_naguib_desc:0 "$CBIO_EGY_muhammad_naguib_desc$"
 CBIO_GEN_hans_frank_desc:0 "汉斯·迈克尔·弗兰克生于1900年5月23日，出生于卡尔斯鲁厄，是德国纳粹政治家，律师，战犯。他是纳粹党前身德国工人党早期成员，参加过啤酒馆政变，此后成为希特勒的私人法律顾问及纳粹党法律顾问，1933年纳粹上台后历任巴伐利亚司法部长，帝国司法部长，德国法律科学院院长等职。1939年德国入侵波兰后，他先任伦德施泰特麾下行政长官，同年10月26日起出任波兰总督府总督，统辖德国未直接吞并的波兰领土，常驻克拉科夫瓦维尔城堡，坐拥奢华排场。他监督将犹太人驱入隔都，强征波兰平民为劳工，曾扬言若每处决七名波兰人便竖一根木桩，波兰的森林也不够用来制作木桩。1941年12月他向属下官员发表讲话，明确传达希特勒消灭犹太人的旨意，此后在其治下建立了贝乌热茨，特雷布林卡，马伊达内克，索比堡四座灭绝营。1942年他因公开演说触怒希特勒并与党卫队发生权斗而失去总督以外的其他职务，但仍留任总督直至战争结束。1945年5月他试图逃离苏军而被美军俘获，在纽伦堡国际军事法庭受审时公开认罪忏悔，称德国的罪责千年不灭。1946年10月1日，他被判处绞刑，10月16日在纽伦堡监狱伏法。"
 GEN_hans_frank_desc:0 "$CBIO_GEN_hans_frank_desc$"
 CBIO_GHA_kwame_nkrumah_desc:0 "夸梅·恩克鲁玛原名弗朗西斯·恩维亚·科菲，生于1909年9月21日，出生于黄金海岸恩克罗富尔，父亲是一名金匠，是加纳民族主义政治家，泛非主义理论家。他先后就读阿奇莫塔学院，后赴美国林肯大学与宾夕法尼亚大学攻读社会学，神学，哲学与教育学多个学位，又赴伦敦经济学院攻读哲学博士，期间投身泛非主义运动并于1945年组织第五届泛非大会，并将本名改为夸梅。1947年他回国出任黄金海岸统一大会党总书记，后另立人民大会党，主张即刻实现自治独立，1948年因骚乱被捕入狱，却于1951年狱中当选议员并随即获释组阁。1952年他出任黄金海岸总理，1957年3月6日领导该国以加纳之名独立，成为撒哈拉以南非洲首个摆脱殖民统治的国家，他续任总理。1960年加纳改行共和制，他当选首任总统，推行社会主义与工业化政策，积极倡导泛非主义并促成1963年非洲统一组织成立，1962年获苏联列宁和平奖。其统治日趋独裁，1964年修宪确立一党制并自任终身总统，多次遭遇暗杀未遂。1966年2月，他出访越南期间国内爆发政变遭废黜，此后流亡几内亚，受塞古·杜尔礼遇为几内亚名誉共同总统。1972年4月27日，他因癌症在罗马尼亚布加勒斯特医院去世，归葬故乡恩克罗富尔。"
 GHA_kwame_nkrumah_desc:0 "$CBIO_GHA_kwame_nkrumah_desc$"
 CBIO_HAN_ernest_august_desc:0 "恩斯特·奥古斯特·克里斯蒂安·格奥尔格生于1887年11月17日，出生于维也纳近郊彭青，是末代不伦瑞克公爵，汉诺威王室末代族长。他是汉诺威王室已故王储恩斯特·奥古斯特之幼子，母亲是丹麦公主蒂拉，因两位兄长早逝而成为家族继承人。1913年5月他迎娶德皇威廉二世独女维多利亚·路易丝公主，同年11月1日就任不伦瑞克公爵，这段联姻结束了普鲁士与汉诺威家族数十年的宿怨。一战中他官至少将，1918年11月德国革命爆发，他与其他德意志诸邦君主一同被迫逊位，此后终生以汉诺威家族族长身份定居各处庄园，鲜少涉足公开政治。他虽从未正式加入纳粹党，却向纳粹捐输款项并与多名高层过从甚密，1930年代希特勒曾试图借他与夫人促成其女弗雷德里卡与英国威尔士亲王联姻以谋求英德修好，但被夫妇二人以年龄悬殊为由婉拒。1953年1月30日，他去世，由其子继任汉诺威家族族长。"
 HAN_ernest_august_desc:0 "$CBIO_HAN_ernest_august_desc$"
 CBIO_HES_philipp_of_hesse_desc:0 "菲利普亲王生于1896年11月6日，出生于奥芬巴赫附近的伦彭海姆宫，是黑森选侯家族首领，1940年至1980年在任。他自幼受英式家庭教师教养，一战中在黑森龙骑兵团服役并负伤，战后转赴意大利研习建筑，1925年迎娶意大利国王维托里奥·埃马努埃莱三世之女玛法尔达公主，婚后长居罗马近郊。旅居意大利期间他深受法西斯主义感染，1930年归国后加入纳粹党，1932年加入冲锋队，与戈林结为密友。1933年希特勒上台后他出任普鲁士黑森-拿骚省长，并凭借意大利王室女婿身份长期充当希特勒与墨索里尼之间的非正式联络人，兼为希特勒在意大利搜罗艺术品。1941年他签署将哈达马尔疗养院移交帝国内政部的合同，该院其后杀害逾万名精神病患者，是纳粹T4安乐死计划的参与者。1943年墨索里尼被废黜后，希特勒疑心菲利普一家与此有关，同年9月将其逮捕并褫夺党籍与军衔，先后关押弗洛森比格，达豪集中营，其妻玛法尔达则于布痕瓦尔德集中营遭空袭重伤身亡。1945年他辗转获释后旋即被美军拘押，历经多地关押及非纳粹化审查，1947年获释。1968年他因远亲绝嗣而兼领黑森-达姆施塔特家系族长之位，统一了自1567年分裂以来的黑森全部宗支。1980年10月25日，他在罗马去世。"
 HES_philipp_of_hesse_desc:0 "$CBIO_HES_philipp_of_hesse_desc$"
 CBIO_IMO_muhammad_khalili_desc:0 "穆罕默德·本·阿卜杜拉·哈利利生年不详，是阿曼内陆伊巴迪派伊玛目国末代伊玛目，自1920年起在位直至1954年去世。1920年英国出面斡旋促成锡卜协议，由马斯喀特苏丹承认阿曼内陆自治而不承认其主权独立，他即在此背景下就任伊玛目，治权及于伊巴迪部族腹地，受加菲里与希纳维两大部族联盟及游牧部落共同承认为统治者，派驻各地代表征税断案，内陆地区因而享有事实上的自治达三十余年。他的统治被视为二十世纪中叶阿曼内陆政教合一政权最后一段完整而稳固的历史篇章。1954年他去世后，继任者加利卜在其兄塔利卜及部落领袖苏莱曼·本·希米亚尔怂恿下谋求彻底独立并寻求沙特支持，与马斯喀特苏丹赛义德·本·塔伊穆尔爆发冲突，伊玛目国最终在英军协助下于1959年被平定，阿曼由此重归苏丹一统治理。"
 IMO_muhammad_khalili_desc:0 "$CBIO_IMO_muhammad_khalili_desc$"
 CBIO_ISR_david_ben_gurion_desc:0 "大卫·本-古里安原名大卫·格林，生于1886年10月16日，出生于波兰普翁茨克一个犹太家庭，是以色列国父，首任总理。他1906年移民巴勒斯坦，在犹太农场务农，早年投身工人锡安主义运动，1909年改用本-古里安为名。一战期间他因锡安主义活动被奥斯曼当局驱逐，辗转赴纽约，后加入英军犹太军团重返中东。他自1935年起出任犹太事务局主席，成为巴勒斯坦犹太社群的实际领袖，长期领导争取建国的运动。1948年5月14日，他在特拉维夫宣读独立宣言，正式宣告以色列国成立，随即出任首任总理兼国防部长，主持将各路犹太武装整编为国防军，领导第一次中东战争击退阿拉伯联军。此后他推行国家主义方针，主持吸纳大规模移民，兴建国家输水工程，并致力开发内盖夫沙漠。他于1963年辞去总理职务，1955年至1963年间再度出任总理并领导以色列参与1956年苏伊士运河危机，1970年退出政坛后定居内盖夫沙漠基布兹斯代博凯尔。1973年12月1日，他在特拉维夫去世。"
 ISR_david_ben_gurion_desc:0 "$CBIO_ISR_david_ben_gurion_desc$"
 CBIO_ISR_itzhak_gaster_desc:0 "架空人名。教名伊扎克（Itzhak）即希伯来圣经中的族长以撒（Yitzhak），字面意为“他将笑”，源自动词察哈克（tzachak，笑），典出创世纪中亚伯拉罕与撒拉因高龄得子而发笑的记载，是犹太教三大族长之一，地位极为核心。姓氏加斯特（Gaster）则说法不一：德语系辞书多将其系于古日耳曼语“客人”（Gast）一词，而以此姓闻名的英国塞法迪犹太学者摩西·加斯特则认为家族姓氏实为“德卡斯特罗”（DeCastro）的讹变，源出西班牙科尔多瓦附近一处名为卡斯特罗的小镇。一个取自最核心族长之名的教名，搭配一个德系或塞法迪两说并存的姓氏，恰似以色列建国前后移民来源驳杂交织的一个缩影。"
 ISR_itzhak_gaster_desc:0 "$CBIO_ISR_itzhak_gaster_desc$"
 CBIO_ISR_rudolf_szabo_desc:0 "架空人名。教名鲁道夫（Rudolf）源自古高地德语赫罗杜尔夫（Hrodulf），由“荣耀”（hruod）与“狼”（wulf）两个词根组成，意为“荣耀之狼”，历史上曾是神圣罗马帝国皇帝鲁道夫二世等中欧多位君主的教名，带有鲜明的中欧贵族气息。姓氏萨博（Szabo）则是匈牙利最常见的姓氏之一，位列全国第四大姓，字面意思是“裁缝”，源自动词萨布尼（szabni，裁剪），是典型的平民职业姓氏。一个华贵的“帝王教名”与一个朴素的“匠人姓氏”拼在一起，一贵一庶，恰好映照出大量匈牙利犹太移民携带中欧姓名传统迁入以色列建国初期社会的历史侧影。"
 ISR_rudolf_szabo_desc:0 "$CBIO_ISR_rudolf_szabo_desc$"
 CBIO_ISR_shmuel_mikunis_desc:0 "什穆埃尔·米库尼斯生于1903年8月10日，出生于俄罗斯帝国治下的波隆内即今乌克兰境内一个哈西德犹太家庭，是以色列共产主义政治家。他1921年移民巴勒斯坦，是奥赫尔工人剧院创始成员之一并曾登台演出多年，1930年至1933年赴巴黎攻读土木工程，归国后在特拉维夫从事本行。1936年他加入非法状态下的巴勒斯坦共产党并出任总书记，1944年当选犹太社群代表大会成员。第一次中东战争期间，他作为使者奔走于共产主义阵营国家为新生的以色列争取军火援助。以色列建国后该党更名以色列共产党，他连续代表该党出任第一届至第八届国会议员。1960年代他与摩西·斯内联手，试图使党内立场与苏联的反以政策保持距离，主张承认以色列生存权利，与梅厄·维尔纳一派长期对立，1965年该党最终分裂，以他为首的一支仅余一席。1974年他脱离后继政党莫凯德，加入以斯特尔·维伦斯卡领导的以色列共产反对派。1982年5月20日，他去世，享年七十九岁，特拉维夫有一条街道以他命名。"
 ISR_shmuel_mikunis_desc:0 "$CBIO_ISR_shmuel_mikunis_desc$"
 CBIO_JOR_abdullah_bin_al_hussein_desc:0 "阿卜杜拉一世生于1882年2月2日，出生于奥斯曼帝国希贾兹麦加，是麦加谢里夫侯赛因·本·阿里次子，哈希姆家族约旦王朝创建者。他曾在伊斯坦布尔求学并于1909年至1914年出任麦加议员，一战期间与英方秘密协商促成阿拉伯大起义反抗奥斯曼统治。1920年他率军北上支援叙利亚局势，次年3月抵达安曼，同年4月经与英方协商建立外约旦埃米尔国并出任埃米尔。1946年5月25日外约旦脱离英国托管获得完全独立，他晋位为约旦哈希姆王国国王。他是唯一接受联合国分治巴勒斯坦方案的阿拉伯统治者，1948年第一次中东战争中约旦军队占领约旦河西岸，1950年他将该地正式并入约旦版图并改国名为约旦，此举激怒叙利亚，沙特阿拉伯与埃及等昔日盟友。因其亲西方温和路线招致国内不满，1951年7月20日他在耶路撒冷阿克萨清真寺门前参加主麻聚礼时遇刺身亡。"
 JOR_abdullah_bin_al_hussein_desc:0 "$CBIO_JOR_abdullah_bin_al_hussein_desc$"
 CBIO_JOR_fu_ad_nassar_desc:0 "福阿德·纳萨尔生于1914年11月28日，出生于叙利亚布卢丹一个迁居当地的巴勒斯坦家庭，是巴勒斯坦及约旦共产主义领导人。他1929年投身反殖民斗争，加入巴勒斯坦共产党，在1936至1939年阿拉伯大起义期间负责该党军事活动，曾因政治活动屡遭英国托管当局监禁与流放，一度流亡伊拉克入狱。1943年他返回巴勒斯坦，与埃米尔·图马等年轻阿拉伯共产党人另立巴勒斯坦民族解放同盟并出任总书记，1944年协助创办阿拉伯文机关报团结报。1948年以色列建国后巴勒斯坦解体，他定居后来划归约旦的约旦河西岸，继续为建立独立巴勒斯坦国及难民回归而奔走。1951年该同盟西岸残部并入新成立的约旦共产党，他出任首任总书记，同年12月29日被捕判处十年监禁。此后他长期流亡东柏林，主张巴勒斯坦共产党人应积极投身武装斗争，1970年与叙利亚，伊拉克两国共产党联合组建援助巴勒斯坦游击队的安萨尔部队，1972年重返安曼领导该党。1973年他成为首位加入巴勒斯坦全国委员会的共产党人，1974年获苏联最高苏维埃主席团授予人民友谊勋章及保加利亚季米特洛夫勋章。1976年9月30日，他因肝癌去世。"
 JOR_fu_ad_nassar_desc:0 "$CBIO_JOR_fu_ad_nassar_desc$"
 CBIO_JOR_hashim_kheir_desc:0 "哈希姆·海尔即哈希姆帕夏·海尔，出身约旦政治世家海尔家族。其父赛义德帕夏·海尔曾任安曼市长，并在阿卜杜拉埃米尔北上组建外约旦埃米尔国之际迎奉其入驻安曼，是哈希姆王朝在安曼建立根基的重要地方人物之一。哈希姆继承家族在当地政坛的地位，曾进入外约旦早期政府体系，并在约旦建国后的第一届众议院中出任议长。海尔家族此后持续活跃于约旦政坛，后代中包括情报部门首脑及首相等要员。"
 JOR_hashim_kheir_desc:0 "$CBIO_JOR_hashim_kheir_desc$"
 CBIO_JOR_saeed_ahmadi_desc:0 "架空人名。教名赛义德（Saeed）源自阿拉伯语动词萨阿达（sa'ada，变得幸福），意为“幸福的”“幸运的”，是阿拉伯世界最常见的祝愿式教名之一，先知穆罕默德的同伴中即有以此为名者。姓氏艾哈迈迪（Ahmadi）由教名艾哈迈德（Ahmad，意为“最受赞美者”，源自动词哈米德，是古兰经中对先知穆罕默德的别称之一）加上表示“…家族”“…之裔”的阿拉伯语后缀“-i”构成。两个词根一个指向“幸福”，一个指向“赞美”，均取自伊斯兰祝祷用语中最常见的吉庆字眼，是典型的讨口彩式教名与源自先知尊称的姓氏相嫁接的组合，读来喜庆有余而个性不足，正合虚构占位人名的特征。"
 JOR_saeed_ahmadi_desc:0 "$CBIO_JOR_saeed_ahmadi_desc$"
 CBIO_KAT_moise_tshombe_desc:0 "莫伊兹·卡奔达·冲伯生于1919年11月10日，出生于比属刚果穆孙巴，出身伦达族显贵世家，是刚果商人，政治家。他受教于美国传教士学校，后接受会计培训，曾多次经商失败，须仰赖家族接济。1957年他成为伦达部落协会主席，次年与戈德弗鲁瓦·穆农戈共同创立主张联邦制刚果的加丹加部落联盟党，该党获比利时联合矿业公司支持。1960年6月刚果独立后他出任加丹加省省长，同年7月11日以中央政府亲共倾向为由宣布加丹加脱离刚果独立，是刚果危机的核心人物之一。他倚重比利时军事顾问及白人雇佣军对抗联合国部队与卢蒙巴，后者被押解至加丹加后遭处决，他虽未直接下令，但难辞其咎。1963年在联合国军事行动打击下加丹加分离宣告失败，他流亡欧洲。1964年他应总统卡萨武布之邀回国出任总理组建全国和解政府平定辛巴叛乱，次年10月被解职，此后再遭指控叛国被判处死刑，流亡西班牙。1967年他乘坐的飞机遭劫持押往阿尔及利亚。1969年6月29日，他在阿尔及尔软禁中因心脏病去世。"
 KAT_moise_tshombe_desc:0 "$CBIO_KAT_moise_tshombe_desc$"
 CBIO_KBK_betal_kalmyk_desc:0 "贝塔尔·埃德科维奇·卡尔梅科夫生于1893年11月5日，出生于捷列克州阿塔茹基诺三村一个卡巴尔达族农民家庭，是苏联卡巴尔达-巴尔卡尔党务与国家干部。他早年做雇工，1913年参与领导山民反抗当地贵族的起义，1915至1916年间创建并领导秘密农民组织卡拉哈尔克，1918年3月加入布尔什维克党。同年8月起他出任卡巴尔达-巴尔卡尔特命全权代表，内战期间统领游击队，部队与团，1919年其父与弟弟被白军处决于纳尔奇克。1920年起他历任革命委员会，州执行委员会主席，1921至1924年主导高加索地区以剿匪为名的镇压行动。1930年起他出任卡巴尔达-巴尔卡尔州委第一书记，任内积极参与大清洗，曾以对敌人不作为为由要求逮捕内务人民委员部工作人员，亲自将政敌押赴处决场，同时也因其治下经济建设成就获颁列宁勋章与红旗勋章，1937年当选苏联最高苏维埃代表。1938年11月12日，他本人被捕，罪名是1927年即在卡巴尔达-巴尔卡尔组建反革命组织及策划恐怖活动。1940年2月26日，苏联最高法院军事法庭判处他死刑，次日即被枪决，1954年12月18日获平反。"
 KBK_betal_kalmyk_desc:0 "$CBIO_KBK_betal_kalmyk_desc$"
 CBIO_KKP_islam_sadyk_desc:0 "伊斯兰·萨迪赫奥格雷·阿利耶夫，1897年出生于叶利萨韦特波尔省杰布拉伊尔县，是苏联阿塞拜疆与卡拉卡尔帕克党务干部。他早年就读叶利萨韦特波尔突厥宗教神学院，1921年至1925年在巴库工人系接受高等教育，1932年结业于联共布中央马列主义课程。此后他长期在阿塞拜疆各地从事党务工作，历任沙姆霍尔县委责任书记、巴库多个区委书记等职。1930年调入乌兹别克苏维埃社会主义共和国工作，先后在中亚局任职。1933年4月起，他出任卡拉卡尔帕克苏维埃自治共和国州委第一书记，任至1937年4月。其任内正值苏联大清洗席卷中亚，不少同僚遭到镇压。1937年，他调往莫斯科任副职，同年12月起代理苏联农业人民委员部新麻类作物管理局局长，后在大清洗中遭镇压。"
 KKP_islam_sadyk_desc:0 "$CBIO_KKP_islam_sadyk_desc$"
 CBIO_KOM_pavel_murashev_desc:0 "架空人名。教名帕维尔（Pavel）源自拉丁语保卢斯（Paulus），意为“渺小”“谦卑”，是使徒保罗的教名，经东正教传统传入俄语世界，历史上亦为俄国沙皇保罗一世所用，是斯拉夫地区最常见的教名之一。姓氏穆拉舍夫（Мурашев）则源自俄语方言词“穆拉什”（мураш，蚂蚁），是基督教传入俄罗斯之前流行的动物绰号命名传统的遗存，该姓氏最早见于十七世纪初诺夫哥罗德地区的文献记载。一个源自使徒的属灵教名，配上田间地头最不起眼的昆虫绰号姓氏，圣徒之名与乡野绰号的强烈反差，正是俄国东正教村社命名传统中“教名归教会、姓氏归乡土”这一惯常组合方式的缩影。"
 KOM_pavel_murashev_desc:0 "$CBIO_KOM_pavel_murashev_desc$"
 CBIO_KUB_ivanis_vasily_nikolaevich_desc:0 "瓦西里·伊万尼斯即瓦西尔·伊万尼斯，是库班人民共和国末任总理，1919年至1920年在任。俄国内战期间库班哥萨克拉达曾谋求建立独立于俄罗斯的库班国，他主张库班应与乌克兰人民共和国结盟联合抗苏，并认为倘若乌克兰盖特曼帕夫洛·斯科罗帕茨基当年行动更为果决，及时派兵驰援库班，乌克兰本可成为反布尔什维克运动的核心枢纽，与东线的高尔察克相呼应而扭转全局。1920年初红军攻占库班全境，拉达与白军一同被逐出该地，他与其政府成员及部分哥萨克部众追随弗兰格尔部队，自克里米亚撤往土耳其，库班独立尝试就此终结。"
 KUB_ivanis_vasily_nikolaevich_desc:0 "$CBIO_KUB_ivanis_vasily_nikolaevich_desc$"
 CBIO_KUW_ahmad_al_sabah_desc:0 "艾哈迈德·贾比尔·萨巴赫生于1885年，是科威特谢赫国第十任统治者，1921年3月29日至1950年1月29日在位。他是第八任统治者贾比尔二世之子，1921年2月接替叔父萨利姆继位。他是科威特防务骑兵部队的缔造者与首任指挥官，创建了科威特公共安全总局，1920年代初将防务骑步兵指挥权移交部下，1928年雷盖伊之战后正式转由他人统领。1936年巴勒斯坦当局请求他提供财政援助支援巴勒斯坦大起义，他因受制于对英条约关系而未予批准，但科威特商界名门自发募集捐款声援，他虽未能阻止此事，却选择借外出狩猎回避风波。任内后期他自1940年起兼任财政大臣直至1950年。他子嗣众多，包括后来的第三任埃米尔贾比尔·艾哈迈德。1950年1月29日，他在科威特达斯曼宫去世。"
 KUW_ahmad_al_sabah_desc:0 "$CBIO_KUW_ahmad_al_sabah_desc$"
