 BUL_atanas_pavlov_zhilkov_bftb_desc:0 "阿塔纳斯·帕夫洛夫·日尔科夫生于1888年10月14日，保加利亚陆军中将。日尔科夫长期在骑兵和军队指挥系统任职，1936年至1941年担任骑兵监察官。第二次世界大战前后，他进入最高统帅部系统，1941年至1944年任最高统帅部通信主任，负责战时通信和指挥保障事务。1940年南多布罗加回归保加利亚的过程中，他也参与过相关军事委员会工作。日尔科夫的履历主要集中在骑兵监察、通信和参谋保障岗位，1955年去世。"
