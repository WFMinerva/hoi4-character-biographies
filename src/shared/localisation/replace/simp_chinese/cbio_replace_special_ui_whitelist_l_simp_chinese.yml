 JAP_emperor_hirohito_override_instant: "逃脱审判的战犯，日本第124代天皇。幼号迪宫，1901年4月29日生于东京赤坂青山御所，1989年1月7日因十二指肠癌卒，在位六十三年，为日本史上在位时间最长的天皇。出生后仅七十天即被寄养于海军中将川村纯义家中，入学习院后先后受“肉弹将军”乃木希典与东乡平八郎督导，自小接受军国主义与帝王教育；乃木自裁殉明治一事给少年裕仁留下深重心理冲击，由此转而笃好生物学，终生从事海洋生物研究，著有《水母的书》等论著。1921年以皇太子身份赴欧考察，途经新加坡时以皇室特权勘测英军防御工事，在巴黎接见永田铁山、冈村宁次等青年武官并获其效忠宣誓；归国后因父皇病重出任摄政；1924年与良子女王成婚；1926年即位，定年号“昭和”。按史学界现有记录，裕仁绝非被动的立宪虚君：1928年亲自迫使田中义一内阁辞职；1931年默许九一八事变，翌年为征服东三省将领亲自授勋；1936年奉敕令在满洲建立七三一细菌化学战部队；同年二·二六叛乱爆发后拍案命令“尽快镇压，尽快”、直接主导平叛；全面侵华后多次亲自干预军事部署，南京陷落当日下诏褒扬将士，放纵朝香宫鸠彦王主导南京大屠杀，并批准大规模化学战；1940年推动三国同盟、批准南进国策；1941年自始深度参与偷袭珍珠港计划并亲批对美开战——东条英机后在东京审判中证称“整个日本军队没有人敢违抗天皇的意志”。战后因美国冷战战略需要免于战犯追诉，1946年元旦发布《人间宣言》放弃神格，1978年靖国神社合祀甲级战犯后拒绝参拜，此后以立宪象征身份延续昭和年号。"
