l_simp_chinese:
 ARG_agustin_pedro_justo_desc:0 "1876年2月26日生于恩特雷里奥斯省乌拉圭河畔康塞普西翁，1943年1月卒于布宜诺斯艾利斯。全名阿古斯丁·佩德罗·胡斯托·罗隆，军人、工程师、外交官与政治家，官至将军，曾任国立军事学院教授与院长。1922年至1928年在阿尔韦亚尔总统任内任陆军部长，1930年参与何塞·费利克斯·乌里武鲁推翻伊里戈延的政变。1931年在被广泛指控舞弊的选举中当选总统，1932年就任，任期至1938年，是\"无耻十年\"的核心人物之一。任内创立阿根廷中央银行、开征所得税，并与英国签订备受争议的《罗卡–朗西曼条约》（由副总统小胡里奥·罗卡签署）；外长萨维德拉·拉马斯因斡旋查科战争获诺贝尔和平奖。卸任后仍具政治影响力，支持继任者奥尔蒂斯；第二次世界大战期间主张阿根廷对轴心国宣战，与坚持中立的卡斯蒂略政府对立。1943年初病逝，享年66岁。"
 ARG_alberto_gilbert_desc:0 "阿尔韦托·吉尔伯特，1887年2月6日生，1973年卒，阿根廷军人。1909年毕业于国立军事学院，历任骑兵部队军官，后就读高等战争学院。1923年至1930年任驻智利武官，1932年任驻西班牙武官，1935年晋上校，1943年晋准将。在拉米雷斯的事实政府中，他先任内政部长；1943年9月斯托尔尼因风波辞职后，他接任外交部长（1943年9月至1944年2月）。他是坚定的中立主义者，中止了前任已着手的对轴心国断交准备。任内他与海军部长贝尼托·苏埃罗组织了一桩失败的秘密购械行动，经手人、海军后备军官奥斯马尔·赫尔穆特实为德国间谍；赫尔穆特在欧洲被盟军拘捕所引发的丑闻，成为美国施压拉米雷斯、迫使阿根廷于1944年1月26日与轴心国断交的重要因素。断交在军中引发危机，他于1944年2月16日辞职，同年退役。"
 ARG_antonio_parodi_desc:0 "安东尼奥·帕罗迪，1890年5月25日生于布宜诺斯艾利斯省圣马丁，1978年3月12日卒于布宜诺斯艾利斯。阿根廷军人、航空准将、航空先驱。1910年以步兵军官身份毕业于国立军事学院，1914年完成陆军航空课程，获阿根廷航空俱乐部第68号飞行证，并创下夜间导航（1916）与载客飞行（1917）等纪录。1920年3月，他与佩德罗·萨尼同时起飞尝试飞越安第斯山脉最高峰段；萨尼因机械故障折返，帕罗迪则独自完成往返：飞越圣地亚哥上空撒下传单，在顺风助力下历时约十个半小时返回出发机场，成为首位往返飞越安第斯高峰区的飞行员。因听力受损，部下称他\"聋子帕罗迪\"。1940年他组建陆军民用航空运输部门，创设 LASO、LANE 等国营航空公司。1944年空军成立时获准将衔，1946年退役。1955年他拒绝支持推翻庇隆的政变，事后被剥夺军衔与军人荣誉。"
 ARG_antonio_soto_desc:0 "1897年10月8日生于西班牙费罗尔，1963年5月11日卒于智利蓬塔阿雷纳斯。全名安东尼奥·贡萨洛·索托·卡纳莱霍，西班牙裔阿根廷无政府工团主义工人运动领袖，人称“加列戈·索托”。少年时移居阿根廷，做过杂工、码头工，早年接受无政府主义思想。1920年当选里奥加列戈斯工人协会总书记，领导旅馆、港口和农牧工人罢工，成为巴塔哥尼亚大罢工主要领导人之一。1921年军队镇压时，大批罢工者被枪决，索托率少数人越境逃入智利。此后长期在蓬塔阿雷纳斯经营小旅馆，终生坚持其政治信念。"
 ARG_augustin_pedro_justo_desc:0 "1876年2月26日生于恩特雷里奥斯省乌拉圭河畔康塞普西翁，1943年1月卒于布宜诺斯艾利斯。全名阿古斯丁·佩德罗·胡斯托·罗隆，军人、工程师、外交官与政治家，官至将军，曾任国立军事学院教授与院长。1922年至1928年在阿尔韦亚尔总统任内任陆军部长，1930年参与何塞·费利克斯·乌里武鲁推翻伊里戈延的政变。1931年在被广泛指控舞弊的选举中当选总统，1932年就任，任期至1938年，是\"无耻十年\"的核心人物之一。任内创立阿根廷中央银行、开征所得税，并与英国签订备受争议的《罗卡–朗西曼条约》（由副总统小胡里奥·罗卡签署）；外长萨维德拉·拉马斯因斡旋查科战争获诺贝尔和平奖。卸任后仍具政治影响力，支持继任者奥尔蒂斯；第二次世界大战期间主张阿根廷对轴心国宣战，与坚持中立的卡斯蒂略政府对立。1943年初病逝，享年66岁。"
 ARG_bartolome_de_la_colina_desc:0 "巴托洛梅·德拉科利纳，1894年10月20日生于拉里奥哈，1967年6月27日卒于布宜诺斯艾利斯。军事工程师，被视为阿根廷空军的奠基人之一。1921年毕业于高等技术学校，获军事工程师学位，后入国家航空军事学校；曾赴法国临时加入其空军并取得航空工程师资格。回国后历任航空技术与试验部门主管。1944年至1945年任航空兵总司令。1945年1月4日航空国务秘书处设立，他出任首任航空国务秘书（职级相当于国务部长），统管全国军民航空事务。同年10月，因不满庇隆被逐出副总统之位，他一度辞职，次月又应邀复任，并在庇隆第一任总统初期继续任职，1949年3月以准将衔退役。他后被立法尊为\"阿根廷航空先驱\"，马德普拉塔机场曾以其名命名。"
 ARG_basilio_pertine_desc:0 "1879年4月3日生于布宜诺斯艾利斯，1963年12月13日卒。全名巴西利奥·贝尔纳韦·佩尔蒂内，意大利移民之子，1894年入国立军事学院，步兵出身，军旅生涯逾四十年，官至陆军中将。1905年一次寡不敌众的战斗中他一度被当作阵亡，敌方指挥官出于对其英勇的敬意，下令将\"遗体\"裹以阿根廷国旗送回布宜诺斯艾利斯——实则他身负重伤仍活着，总统金塔纳随即因功晋升他。1906年起赴德，第一次世界大战期间任驻德武官、亲历德军作战并获铁十字勋章等德国勋赏，著有关于大战的军事著作。他是德国军事乃至法西斯的仰慕者，1936年至1938年任胡斯托政府陆军部长；1941年在军人俱乐部安排民族主义者 霍尔丹·布鲁诺·根塔 演讲，遭调查纳粹活动的委员会举报。1943年至1944年任布宜诺斯艾利斯市长。其孙女伊内斯·佩尔蒂内后为阿根廷第一夫人（德拉鲁阿总统之妻）。"
 ARG_benito_sueyro_desc:0 "贝尼托·苏埃罗，1887年3月3日生，1969年卒。阿根廷海军军官，官至海军少将。1940年至1943年任海军舰队总司令；其间1941年10月3日鱼雷艇\"科连特斯号\"因碰撞沉没、14名水兵遇难，军事侦查法官认定他负有责任，但他最终未受处分，1942年社会党众议员索拉里曾就此要求质询海军部长。在\"1943年革命\"后拉米雷斯政府中，他任海军部长，其兄萨巴·苏埃罗则为同期副总统。任内他与外交部长吉尔伯特组织了经海军后备军官奥斯马尔·赫尔穆特（实为德国间谍）进行的失败购械行动，此案成为美国迫使阿根廷1944年1月与轴心国断交的主因之一。断交引发军中危机、GOU 逼拉米雷斯下台之际，他曾建议逮捕法雷尔与庇隆，但因拉米雷斯已失去军方支持而未果，遂于1944年2月26日辞职，由特伊萨伊雷接任。"
 ARG_carlos_lamas_desc:0 "奥斯马尔·阿尔韦托·赫尔穆特，约1908年生、约1976年卒（生卒仅约略），德裔阿根廷人，保险推销员兼海军后备军官，二战期间为德国保安处\"玻利瓦尔行动\"间谍网效力。1943年他经汉斯·哈尼施等牵线，被拉米雷斯政府任命为驻巴塞罗那领事，以此为掩护执行秘密使命：赴德向纳粹保证阿根廷无意与轴心国断交、洽购德国军火，并为一艘滞留瑞典哥德堡的阿根廷油轮争取放行。1943年10月他持外交护照乘\"合恩角号\"启程，途经特立尼达时被早已破译其电讯的英国情报机构逮捕，并在审讯中供出使命、拉米雷斯的许诺及整个间谍网。此案成为美国迫使阿根廷于1944年1月与轴心国断交的关键之一。他后被遣回阿根廷、以\"叛国\"罪受审，监禁一年后获赦；晚年重操保险推销旧业，默默终老。"
 ARG_carlos_marquez_desc:0 "1885年10月8日生于布宜诺斯艾利斯，1950年卒于同地。全名卡洛斯·德梅特里奥·马尔克斯，阿根廷军人，官至师级将领。1902年毕业于国立军事学院，1913年毕业于高等战争学院，曾任军事航空学校教官、军事地理研究所地形科主任，1922年至1929年任陆军总参谋部军官，其间与胡斯托将军建立关系。此后历任炮兵总监（1932–1935）、驻外军购委员会主席（1935–1937）。1938年至1940年任奥尔蒂斯政府陆军部长。任内他将最活跃的民族主义军人胡安·包蒂斯塔·莫利纳等强制退役、削弱其影响，但民族主义在中层军官中的势力并未减退。他也是\"帕洛马尔土地案\"丑闻的责任人之一：无视每公顷约两千比索的官方估价，下令以远高的价格购地，丑闻波及奥尔蒂斯政府；1940年9月被免予起诉后，他随即辞职。"
 ARG_diego_mason_desc:0 "1887年4月14日生于布宜诺斯艾利斯，1972年1月11日卒。全名迭戈·伊西德罗·马松，阿根廷军人，官至陆军中将。1906年毕业于国立军事学院，1921年毕业于高等战争学院，历任军校教官、步兵团长、埃斯特万·德卢卡兵工厂主任（1934–1936），以及多个师与军区的指挥官。\"1943年革命\"后，他在拉米雷斯与法雷尔政府中任农业部长，并于1944年2月至5月代理外交部长。任农业部长期间，他冻结农村租金并规定三年自动续租，使中小农户显著获益。庇隆第一任总统期间，他于1946年至1948年任陆军总司令，1948年退役。"
 ARG_diogenes_taboada_desc:0 "迪奥赫内斯·塔沃阿达，1887年生于圣路易斯省，1978年4月11日卒于布宜诺斯艾利斯。律师、政治家，早年即加入激进公民联盟，属反个人主义派。曾任圣路易斯省财政部长（1917）、国会众议员、国家国内税总管（1925）、国家邮政储蓄银行行长（1926）。1938年至1940年任奥尔蒂斯政府内政部长，主要致力于终结选举舞弊，曾下令联邦干预卡塔马卡与布宜诺斯艾利斯省的选举。1945年他参加了反庇隆的\"宪法与自由大游行\"。此后于弗朗迪西政府任外交部长（1958–1961），并先后出使乌拉圭与秘鲁。"
 ARG_edelmiro_julian_farrell_desc:0 "1887年2月12日生于布宜诺斯艾利斯省阿韦亚内达（今属拉努斯），1980年10月31日卒于布宜诺斯艾利斯。全名埃德尔米罗·胡利安·法雷尔·普劳尔，军人，有爱尔兰与德国血统，祖父来自爱尔兰朗福德郡。1907年毕业于国立军事学院，1924年至1926年在意大利一支山地部队服役。1943年参与推翻卡斯蒂略的\"1943年革命\"，在拉米雷斯政府中先后任陆军部长与副总统。1944年2月拉米雷斯被迫交权后，他出任事实总统，任期至1946年，是\"1943年革命\"军事政权中的第二任。任内颁布《雇工法规》、设立年终奖与劳工司法等社会立法，并于1945年3月27日在二战末期对德国与日本宣战、签署《查普尔特佩克协定》。他是庇隆的上级与提携者，正是在其治下庇隆先后出任劳动部长与副总统；1945年7月他宣布举行大选，庇隆于1946年当选并接替其职位。"
 ARG_edmundo_sustaita_desc:0 "1898年8月20日生于查科省雷西斯滕西亚，1955年3月18日卒于布宜诺斯艾利斯。全名埃德蒙多·萨穆埃尔·苏斯塔伊塔，阿根廷军人，先属陆军、后属空军，官至空军少将。1916年入国立军事学院（骑兵），1926年在军事航空学校取得军事飞行员资格。1930年参与乌里武鲁推翻伊里戈延的政变，任 埃尔帕洛马尔 空军基地与乌里武鲁之间的联络人（一次执行联络飞行时驾机失事，但本人安然无恙）。1931年任驻法武官，1941年任科尔多瓦军事航空学校校长；同年9月因参与反卡斯蒂略政府的密谋被捕、囚于坎波德马约，12月获释，其后参与1943年推翻卡斯蒂略。1945年空军成立后获准将衔，同年2月至11月任航空兵司令。他是现代政治人物埃丽萨·卡里奥的舅公。"
 ARG_eduardo_avalos_desc:0 "埃莱亚萨尔·维德拉，1881年生于圣胡安，1960年8月20日卒于布宜诺斯艾利斯。阿根廷海军军官，官至海军少将。1898年入海军，1904年获海军少尉衔，早年在多艘巡洋舰、战列舰上服役、表现出色。1933年底获胡斯托总统任命为海军部长，任内为海军争取更多经费并用于长远建设：在英国订造巡洋舰\"阿根廷号\"与七艘\"布宜诺斯艾利斯\"级驱逐舰，同时大力扶持本国造船厂，并于1934年创建海军战争学院。他还曾短期代理陆军部长与公共工程部长。奥尔蒂斯总统时期任驻巴拉圭大使，1941年2月出任布宜诺斯艾利斯省联邦干预专员。晚年（1957年）主持纪念海军名将吉列尔莫·布朗逝世百年的委员会，推动海军史研究。（注：他与1976年独裁者豪尔赫·拉斐尔·维德拉并非同一人。）"
 ARG_eleazar_videla_desc:0 "埃莱亚萨尔·维德拉，1881年生于圣胡安，1960年8月20日卒于布宜诺斯艾利斯。阿根廷海军军官，官至海军少将。1898年入海军，1904年获海军少尉衔，早年在多艘巡洋舰、战列舰上服役、表现出色。1933年底获胡斯托总统任命为海军部长，任内为海军争取更多经费并用于长远建设：在英国订造巡洋舰\"阿根廷号\"与七艘\"布宜诺斯艾利斯\"级驱逐舰，同时大力扶持本国造船厂，并于1934年创建海军战争学院。他还曾短期代理陆军部长与公共工程部长。奥尔蒂斯总统时期任驻巴拉圭大使，1941年2月出任布宜诺斯艾利斯省联邦干预专员。晚年（1957年）主持纪念海军名将吉列尔莫·布朗逝世百年的委员会，推动海军史研究。（注：他与1976年独裁者豪尔赫·拉斐尔·维德拉并非同一人。）"
 ARG_enrique_mosca_desc:0 "1880年7月15日生于圣菲，1950年7月22日卒。全名恩里克·德拉斯梅塞德斯·莫斯卡，阿根廷律师、政治家，激进公民联盟要人。1906年获圣菲省立大学（今利托拉尔国立大学）法学学位，曾主办《阿根廷报》。历任省议员、省部长与国会众议员。1920年至1924年任圣菲省长，任内促成省立大学资产移交、协助创建利托拉尔国立大学；其间北部森林种植园爆发大罢工，其政府以允许并资助由企业控制的私人警察加以应对，伴随严厉镇压。1926年至1928年任国家教育委员会主席。1930年政变后，他于1931年至1934年被囚于马丁加西亚岛与乌斯怀亚。1937/38年他作为阿尔韦亚尔的副总统竞选搭档参选、败于奥尔蒂斯。1946年他再度出任民主联盟副总统候选人，与坦博里尼搭档，竞选中猛烈抨击庇隆主义为\"法西斯\"，最终败于庇隆。"
 ARG_enrique_ruiz_guinazu_desc:0 "恩里克·鲁伊斯·吉尼亚苏，1882年（一说1884年）10月14日生于布宜诺斯艾利斯，1967年11月13日卒于同地。法学家、教授、作家、银行家与外交官。曾任布宜诺斯艾利斯大学与拉普拉塔大学教授，1930年转入外交界，历任驻瑞士全权代表、国际联盟常驻代表、驻西班牙及驻梵蒂冈大使。1941年应召出任外交部长，任至1943年\"1943年革命\"。他是坚定的中立主义者，也是公开的法西斯同情者，屡屡称颂墨索里尼与佛朗哥；在1942年里约热内卢泛美会议上，他推动将对轴心国\"断交\"的措辞降格为\"建议\"，使阿根廷得以继续维持对德、日、意关系。美国外交官萨姆纳·韦尔斯曾对他作出极为苛刻的评价。他亦是知名史学家，其1916年著作《印度法官制度》影响深远；其女为记者玛格达莱娜·鲁伊斯·吉尼亚苏。"
 ARG_eva_peron_desc:0 "本名玛丽亚·埃娃·杜阿尔特，世人昵称\"埃维塔\"，1919年5月7日生于布宜诺斯艾利斯省洛斯托尔多斯，1952年7月26日卒于布宜诺斯艾利斯，享年33，死于宫颈癌。1946年至1952年任阿根廷第一夫人。她出身贫寒，1934年赴首都发展，成为舞台、广播与电影演员。1944年在为圣胡安地震灾民举办的义演中结识胡安·庇隆上校，次年10月成婚。庇隆1946年就任总统后，她成为庇隆主义的核心人物：主持埃娃·庇隆基金会，兴建大量医院、学校与养老院；推动1947年女性选举权法（人称\"埃维塔法\"），1949年创立女性庇隆党，被称为\"贫民的旗手\"，也是庇隆与工会之间的纽带。1951年工会拥戴她竞选副总统，但她于8月31日（\"放弃日\"）在反对压力与病情下宣布退出。她也因个人崇拜与\"灌输\"式宣传受到批评。逝世后其遗体经防腐处理，1955年政变后被劫走、辗转藏匿于意大利十六年，1971年归还庇隆，最终安葬于雷科莱塔。"
 ARG_fanny_edelman_desc:0 "本姓雅布科夫斯基，后随夫姓改称范妮·埃德尔曼，1911年2月27日生于科尔多瓦省圣弗朗西斯科，2011年11月1日卒于布宜诺斯艾利斯，享年100岁。阿根廷共产党政治家与妇女运动领袖，出身逃避沙俄排犹迫害的俄裔犹太移民家庭，早年当过纺织女工与音乐教师。1934年加入阿根廷共产党，投身国际红色救济会工作。1936年与记者贝尔纳多·埃德尔曼结婚，次年受党派遣赴西班牙内战中支援共和国一方；她曾称保卫西班牙共和国的运动是\"人类团结最崇高的表现之一\"。1947年参与创建阿根廷妇女联盟，1972年任国际民主妇女联合会总书记。自1970年代起长期担任阿根廷共产党主席，1978年曾向联合国日内瓦人权委员会递交大量阿根廷军政府受害者的证词。2011年获古巴颁授何塞·马蒂勋章，同年逝世。"
 ARG_frederick_pinedo_desc:0 "费德里科·皮内多，1895年4月22日生于布宜诺斯艾利斯，1971年9月10日卒于同地。律师、经济学家、政治家与史学家，出身望族，为科内利奥·萨维德拉的后裔。早年加入社会党，后与安东尼奥·德托马索共创独立社会党，该党加入\"和谐联盟\"。他三度出任财政部长：胡斯托政府（1933–1935）、卡斯蒂略政府（1940）与吉多政府（1962）。首任财长期间推行重要经济改革，创建阿根廷中央银行。任内因\"肉类辩论\"与参议员利桑德罗·德拉托雷激烈交锋，德拉托雷以“大脖子”相讥，皮内多误听为“戴绿帽”，两人遂决斗，结果皮内多开枪未中、德拉托雷朝天鸣枪。1940年再任财长时提出主张工业化与国家介入的\"皮内多计划\"，但在众议院被搁置；作为公开的亲同盟国者、反对中立立场，他随即辞职。1962年第三度任财长仅约两三周，因政府关闭国会而辞职，称不愿做\"没有国会的政府\"的部长。"
 ARG_guillermo_rothe_desc:0 "吉列尔莫·罗特，1879年12月10日生于科尔多瓦省托托拉尔镇，1959年1月22日卒于布宜诺斯艾利斯。保守派律师、大学教师与政治家，属国家民主党，是科尔多瓦民主党内自由派（反教权）\"罗特派\"的领袖。他历任科尔多瓦市议员、民事法官、科尔多瓦省国家检察官、两届国会众议员、科尔多瓦国立大学副校长、科尔多瓦高等法院法官与院长。1922年胡里奥·阿根蒂诺·罗卡（子）任科尔多瓦省长时，他出任省政府、司法与公共教育部长。1930年12月获乌里武鲁任命为圣菲省联邦干预专员；1931年出任国家司法与公共教育部长，年底当选科尔多瓦籍国会参议员（任期1932–1941）。此外他还曾出任外交部长。"
 ARG_honorio_pueyrredon_desc:0 "奥诺里奥·普埃雷东，1876年（部分来源作1872年）生于布宜诺斯艾利斯省圣佩德罗，1945年9月23日卒于布宜诺斯艾利斯。律师、法学教授、外交官与政治家，激进公民联盟伊里戈延派要角，为最高执政官胡安·马丁·德普埃雷东的侄孙。1916年任伊里戈延政府农业部长，1917年至1922年任外交部长。他率阿根廷代表团出席1920年日内瓦国联首届大会并任大会副主席；因坚持\"平等对待交战国与中立国\"的普遍性原则未获接纳，阿根廷代表团遂退出国联。1922年起任驻美国大使，后又出使古巴，并于1928年率团出席哈瓦那泛美会议、因反对干涉主义原则而中途退场并辞去驻美大使一职。1931年他作为 UCR 候选人赢得布宜诺斯艾利斯省长选举，却被乌里武鲁取消，其后遭流放，并被囚于马丁加西亚岛、圣胡利安与乌斯怀亚监狱。其曾孙女包括歌手法维亚娜·坎蒂洛与政治家帕特里夏·布尔里奇。"
 ARG_hortensio_quijano_desc:0 "1884年6月10日生于科连特斯省，1952年4月3日卒于布宜诺斯艾利斯。全名胡安·奥滕西奥·基哈诺，律师、政治家。1908年毕业于布宜诺斯艾利斯大学，1919年获法学博士，长期为科连特斯的激进党领袖，先随伊里戈延、后转入反个人主义派。1945年10月他创立\"激进公民联盟革新会\"以支持庇隆，并于同年任法雷尔政府内政部长。1946年2月当选副总统，与庇隆搭档击败民主联盟的坦博里尼-莫斯卡组合；任内推动深化对巴西关系、促成\"ABC 公约\"复兴。1951年因埃维塔退出而再度与庇隆搭档竞选并当选，但因癌症于1952年4月病逝、未及就任第二任期，其位在就职礼上由埃维塔代替。他自称“一个没有传记的人”；出生证上其名拼写有误，他自认系记录错误而改用奥滕西奥；据尼尔森·卡斯特罗记述，埃维塔曾因他肩上落满头皮屑而戏称他为“里海”。"
 ARG_hugo_wast_desc:0 "乌戈·瓦斯特是笔名，本名古斯塔沃·阿道夫·马丁内斯·苏维里亚，1883年10月23日生于科尔多瓦，1962年3月28日卒于布宜诺斯艾利斯。阿根廷小说家与政治家，1907年在圣菲取得法学学位。其笔名由本名字母重排而成。他是当时最畅销的小说家之一，作品被译成十五种以上语言，《石头荒漠》曾获国家文学奖。1916年当选保守派国会众议员；1931年经乌里武鲁任命出任国家图书馆馆长，任职至1955年，其间大力扩充馆藏。他是虔诚的天主教民族主义者，其小说《卡哈尔》与《黄金》（1935）宣扬反犹的\"犹太-共济会-共产主义阴谋论\"，带有明确的反犹主义色彩。\"1943年革命\"期间他出任司法与公共教育部长，任内在全国学校推行强制天主教宗教教育。1935年获教宗庇护十一世授予圣大额我略骑士勋位。"
 ARG_jose_cantilo_desc:0 "1877年8月23日生于布宜诺斯艾利斯，1953年卒。全名何塞·马里亚·坎蒂洛，阿根廷外交官，1938年至1940年任奥尔蒂斯政府外交部长。他是19世纪记者兼诗人何塞·马里亚·坎蒂洛之孙，毕业于布宜诺斯艾利斯大学（法学与文学）。其外交生涯漫长：曾任驻乌拉圭、巴拉圭、玻利维亚、瑞士与意大利大使，并参与萨尔地区归还德国的斡旋。任外长期间，他在1938年利马泛美会议上力主维护阿根廷与欧洲的联系、与美国国务卿科德尔·赫尔针锋相对；1939年与巴拉圭签订皮尔科马约河界约。1939年拉普拉塔河口海战后，他曾向英国大使表示阿根廷可能放弃中立，并提议以\"非交战\"地位取代中立，但遭美国拒绝。奥尔蒂斯因病将权力交予卡斯蒂略后，他离任，其职先后由胡里奥·罗卡（子）与鲁伊斯·吉尼亚苏接替。"
 ARG_jose_tamborni_desc:0 "1886年2月22日生于布宜诺斯艾利斯，1955年9月25日卒于同地。全名何塞·帕斯夸尔·坦博里尼，医生、政治家，激进公民联盟成员（反个人主义派），以清廉朴素著称。意大利移民之子，早年即投身激进党。他曾三度任国会众议员，1940年至1943年任布宜诺斯艾利斯首都区参议员，1925年至1928年任阿尔韦亚尔政府内政部长。乌里武鲁与胡斯托时期，他曾被囚于圣胡利安、马丁加西亚岛与乌斯怀亚。1942年阿尔韦亚尔去世后，他成为激进党\"联盟派\"的当然领袖。1945年12月，他被推为民主联盟总统候选人，与恩里克·莫斯卡搭档，却在1946年2月大选中败于胡安·庇隆。此后他退出政坛，1955年逝世；因恰逢\"解放革命\"之初，其葬礼成为一场政治性的悼念。"
 ARG_juan_peron_desc:0 "1895年10月8日生于布宜诺斯艾利斯省洛沃斯，1974年7月1日卒于奥利沃斯。全名胡安·多明戈·庇隆，军人、政治家，1911年入国立军事学院，1930年参与乌里武鲁推翻伊里戈延的政变，1939年至1941年任驻意大利、驻德国武官，考察法西斯与纳粹政权的军事组织。1943年参与推翻卡斯蒂略的\"1943年革命\"，出任劳动与保障部长，大幅扩展劳工权益，赢得工会广泛拥戴。1945年10月他一度被军方逼迫下台并遭拘押，10月17日大规模工人集会迫使其获释，此日后被奉为庇隆主义诞生的标志。1946年当选总统，此后三度执政（1946–1952、1952–1955、1973–1974），推行\"正义主义\"，对外倡导\"第三立场\"。他常引用\"唯一的真理就是现实\"一语宣扬其政治哲学理念，此语后广为阿根廷政坛引用。1955年遭军事政变推翻，长期流亡；1973年回国再度当选，翌年病逝于任上。"
 ARG_julio_roca_desc:0 "全名胡里奥·阿根蒂诺·帕斯夸尔·罗卡·富内斯，俗称\"小罗卡\"，1873年5月17日生于科尔多瓦，1942年10月8日卒于布宜诺斯艾利斯。他是总统胡里奥·阿根蒂诺·罗卡之子（须与其父、19世纪的总统区分）。律师、政治家，科尔多瓦民主党人。曾四任科尔多瓦籍众议员、参议员（1916–1922）、科尔多瓦省长（1922–1925），并于1932年至1938年任胡斯托政府副总统。1933年他作为特使赴英回访威尔士亲王，并与沃尔特·朗西曼共同起草、签署《罗卡-朗西曼条约》；他当时的著名表态称阿根廷在经济上是\"英帝国不可分割的一部分\"，招致激烈批评。此后他历任驻巴西大使（1938–1939）与外交部长（1940–1941），因不满卡斯蒂略延续\"爱国舞弊\"而于1941年1月辞职，退隐其庄园\"La Larga\"。"
 ARG_leon_scasso_desc:0 "1882年生，1954年6月卒。全名莱昂·洛伦索·斯卡索，阿根廷海军上将。1938年2月至1942年6月任奥尔蒂斯（及卡斯蒂略代理时期）政府海军部长，任内正值第二次世界大战。据历史学家卡洛斯·埃斯库德记述，1942年前后他曾筹划一支海军舰队秘密远征、意图收复马尔维纳斯群岛，并在卡斯蒂略召集的内阁会议上证实此事、一力承担责任，但其他部长认为一旦实施舰队将迅速被英国海军击沉，计划遂未付诸行动。他曾率\"莫雷诺号\"与\"里瓦达维亚号\"两艘战列舰做官方访问。晚年他信奉民族主义，为民族主义解放同盟培养干部，并于1946年作为该组织候选人竞选布宜诺斯艾利斯参议员。"
 ARG_luis_podesta_costa_desc:0 "1885年10月18日生于布宜诺斯艾利斯，1962年卒。全名路易斯·阿古斯丁·波德斯塔·科斯塔，阿根廷律师、外交家与著名国际法学家。他毕业于布宜诺斯艾利斯大学并在该校任教，曾任经济科学学院副院长与院长。1930年代供职于外交部，历任使馆顾问、政治指令处处长与部总司长。他是国际公法领域的权威，所著《国际公法》教科书（后与何塞·马里亚·鲁达合修再版）长期被奉为经典。此后在阿兰布鲁的军政府时期出任外交部长。"
 ARG_manuel_a_rodriguez_desc:0 "曼努埃尔·A·罗德里格斯，1880年2月15日生于布宜诺斯艾利斯，1936年2月23日卒于马德普拉塔。阿根廷陆军将领，以品行端正、笃信宗教著称。军人世家出身，1896年入军校、1899年以步兵军官毕业，后转入新设的工兵。1919年升中校调入陆军总参谋部，曾任陆军部长胡斯托的秘书副官；1925年至1928年任驻德国与瑞士武官，参与驻外军购委员会，并作为军事专家出席日内瓦国联裁军会议。1932年胡斯托就任总统后任命他为陆军部长，任内锐意推动陆军各方面的革新，并就欧洲军购、航空状况等应询于国会。1936年2月，他抱病代表陆军观摩海军演习后，于马德普拉塔病逝，殉职于任上。"
 ARG_manuel_maria_de_iriondo_desc:0 "曼努埃尔·马里亚·德伊里翁多，绰号“曼努乔”，1873年12月26日生于圣菲，1958年12月4日卒于布宜诺斯艾利斯。律师、政治家，激进公民联盟人（1924年起属反个人主义派），圣菲省长西蒙·德伊里翁多之子。1895年获布宜诺斯艾利斯大学法学博士，1898年起从政，历任国会众议员、国家财政部长（1907–1910，费格罗亚·阿尔科塔政府）与阿根廷国家银行行长（1910–1918）。1919年他是右翼准军事团体\"阿根廷爱国联盟\"的共同创始人之一。1932年至1936年任胡斯托政府司法与公共教育部长；1937年至1941年任圣菲省长，其省政源自一次联邦干预（他此前任司法部长时即为干预进步民主党人莫利纳斯的省政府铺路）。他是大地主，当地有两处地名以其为名。"
 ARG_marcelo_t_de_alvear_desc:0 "1868年10月4日生于布宜诺斯艾利斯，1942年3月23日卒于同省栋托尔夸托。全名马克西莫·马塞洛·托尔夸托·德·阿尔韦亚尔·帕切科，律师、外交官、政治家，出身布宜诺斯艾利斯望族，为独立英雄卡洛斯·玛丽亚·德·阿尔韦亚尔之孙。1891年获法学学位，是激进公民联盟创始成员之一，参加过1890、1893年的激进派起义。伊里戈延首任总统期间出任驻法大使，1922年当选总统接替伊里戈延，任期至1928年。其政府恰逢战后世界危机结束，经济繁荣、工业与石油获得发展，人均国内生产总值一度居世界前列；交接就职时，他的声音首次经电台向全国播出。他是 UCR 反个人主义派的主要代表，与伊里戈延渐行渐远；妻子为歌剧演唱家雷希娜·帕奇尼。卸任后长期领导激进派反对派，反对乌里武鲁政变与\"无耻十年\"的选举舞弊，其间曾遭迫害入狱；1937年再度参选总统，在被指舞弊的选举中败于奥尔蒂斯，1942年病逝。"
 ARG_nimio_de_anquin_desc:0 "1896年8月12日生于科尔多瓦，1979年5月16日卒于同地。全名尼米奥·胡安·曼努埃尔·德安金，阿根廷托马斯主义哲学家、政治理论家兼法西斯运动领袖。他曾赴德国师从恩斯特·卡西尔，是国际知名的亚里士多德与托马斯研究者。作为天主教民族主义者，他猛烈抨击共产主义与自由主义。1929年创办圣托马斯·阿奎那研究所。1930年代他领导法西斯运动：先加入阿根廷法西斯党科尔多瓦支部，1934年起任领袖，将组织改组为\"法西斯力量阵线\"（1935）、再改为\"民族法西斯联盟\"（1936），提出融合托马斯主义与黑格尔主义的\"神本法西斯主义\"。1934年因其运动的暴力，他被停止蒙塞拉特学院的教职。他曾于1941年撰文颂扬希特勒、宣称自由主义与\"丑陋的民主\"已然死亡；其运动至1939年趋于消亡后，他转而支持庇隆主义。学术上，他是国家科学院院士（1940），1947年起在科尔多瓦国立大学执掌数个哲学讲席，并获美因茨大学荣誉博士（1950）。"
 ARG_oscar_muratorio_desc:0 "1900年2月28日生于布宜诺斯艾利斯，1977年2月5日卒于同地。全名奥斯卡·爱德华多·胡斯托·穆拉托里奥，阿根廷军人，先属陆军、后属空军，官至空军准将，两度出任航空兵总司令：第一次仅为1945年11月3日至10日（七天），第二次为1946年7月至1951年10月。1919年入国立军事学院（骑兵），1926年取得军事飞行员资格并转入陆军航空。曾任军事航空学校校长（1938–1940）、运输大队队长及民用航空总局局长（1944–1945）。第二任总司令期间，阿根廷空军大量列装作战与教练机，并吸纳了库尔特·坦克等二战后来投的德国航空专家，推动本国航空工业发展。1951年贝尼哈明·门德斯将军政变失败后的清洗中，他退役。"
 ARG_pedro_pablo_ramirez_desc:0 "1884年1月30日生于恩特雷里奥斯省拉巴斯，1962年6月11日卒于布宜诺斯艾利斯。全名佩德罗·巴勃罗·拉米雷斯·门查卡，军人，1904年毕业于国立军事学院，为骑兵专家，1911年至1913年曾在德意志帝国军队受训并带回一位德国妻子。1930年参与乌里武鲁推翻伊里戈延的政变，后赴墨索里尼治下的意大利考察，并参与组织民族主义民兵。1942年获卡斯蒂略任命为陆军部长。1943年6月4日与罗森共同发动推翻卡斯蒂略的政变，三日后于6月7日接任事实总统。他属民族主义、\"中立主义\"的秘密军官团体\"联合军官团\"。任内解散国会与政党、管制新闻、创建阿根廷联邦警察、在学校恢复强制宗教教育，并曾宣称政府的任务是\"复兴民族精神与爱国意识\"。1944年1月迫于美国压力与德、日断交，因而失去民族主义派支持，遭 GOU 逼退；2月以\"疲惫\"为由将职权交予副总统法雷尔，随后退出军界与公共生活。他是首位获颁圣马丁解放者勋章的阿根廷总统。"
 ARG_pedro_s_casal_desc:0 "1879年5月13日生于内科切亚，1957年5月2日卒于布宜诺斯艾利斯。全名佩德罗·塞贡多·卡萨尔，阿根廷海军军官。1896年入海军军校，1899年随\"萨米恩托总统号\"帆船作首航。曾在高等战争学院、海军学校与海军机械学校任教，并任后二者校长。1916年他是拉普拉塔鸟类学会（今\"阿根廷鸟类协会\"）的共同创始人之一。他先在戴罗任海军部长期间任海军次长，随后在胡斯托总统任期之初接任海军部长（1932–1933）。查科战争期间，他参与阿根廷对巴拉圭的援助——鉴于外长萨维德拉·拉马斯坚持中立，他曾对巴拉圭大使表示此事须绕开外交部、私下处理。1937年退役后，他仍钻研海洋学与天文学，是国家地理学会与圣马丁国家研究所的创办人之一。"
 ARG_ramon_castillo_desc:0 "1873年11月20日生于卡塔马卡省安卡斯蒂，1944年10月12日卒于布宜诺斯艾利斯。全名拉蒙·安东尼奥·卡斯蒂略·巴里奥努埃沃，律师、法官、大学教授，保守的全国民主党人。人们惯称其“拉蒙·S·卡斯蒂略”，但“S”并不代表实际中名；他原本中名为安东尼奥，年轻时为避免签名被误读成女性名，改用 S。1938年作为奥尔蒂斯的竞选搭档当选副总统；1940年因奥尔蒂斯病重而代行总统职权，1942年奥尔蒂斯辞职后正式就任总统，任期至1943年，是\"无耻十年\"的最后一任总统。任内延续选举舞弊、亲近保守势力，二战中坚持中立、维持对德关系，招致美英不满。1943年他试图扶植保守派罗武斯蒂亚诺·帕特龙·科斯塔斯为继任者，引发\"1943年革命\"军事政变，被推翻并一度遭拘押，1944年去世。"
 ARG_raul_prebisch_desc:0 "劳尔·普雷维什，1901年4月17日生于图库曼，1986年4月卒于智利圣地亚哥。20世纪最具影响力的拉美经济学家之一。他毕业于布宜诺斯艾利斯大学，并长期在该校任政治经济学教授（1923–1948）。1930年至1943年供职于公共部门，曾任财政副部长，并为杜奥与费德里科·皮内多等部长出谋划策；1935年他是阿根廷中央银行的创建者之一并出任首任总经理，直至1943年被庇隆免职。1948年后他投身联合国拉丁美洲经济委员会，1950年至1963年任执行秘书，提出著名的\"中心—外围\"理论与结构主义发展经济学，指出国际分工使拉美沦为向工业中心供应初级产品的\"外围\"、贸易条件持续恶化。他还是联合国贸易和发展会议的首任秘书长。其思想影响拉美经济政策逾半个世纪；他既曾为1955年军政府开具经济诊断，也在1984年回国辅佐阿方辛政府。"
 ARG_roberto_maria_ortiz_idea_desc:0 "1886年9月24日生于布宜诺斯艾利斯，1942年7月15日卒于同地。全名海梅·赫拉尔多·罗伯托·马塞利诺·马利亚·奥尔蒂斯，律师，巴斯克移民后裔，属激进公民联盟反个人主义派。曾任国会议员、阿尔韦亚尔政府的公共工程部长（1925–1928）与财政部长（1935–1937）。1937年在被视为阿根廷史上最舞弊的选举之一中当选总统，1938年就任。虽经舞弊上台，他却力图肃清选举欺诈、恢复干净选举，为此不惜与保守派盟友冲突，曾干预布宜诺斯艾利斯省、赶走有\"土制墨索里尼\"之称的省长曼努埃尔·弗雷斯科。因罹患严重糖尿病几近失明，1940年7月将职权交予副总统卡斯蒂略；美国总统罗斯福曾派著名眼科医生卡斯特罗维霍前来为其诊治。1942年正式辞职，同年病逝。二战中他在贸易上倾向英国。"
 ARG_rodolfo_ghioldi_desc:0 "1897年1月21日生于布宜诺斯艾利斯，1985年7月3日卒于同地。全名罗多尔福·何塞·吉奥尔迪，教师、记者与政治家，出身一个意大利加里波第派社会主义移民家庭，是社会主义领袖阿梅里科·吉奥尔迪之弟。1918年参与创建阿根廷共产党（初名国际社会党），为其创始成员与早期总书记之一，长期与维克托里奥·科多维利亚共同主导阿根廷共产主义运动。曾任共产国际南美书记处代表；据其党内追述，他在共产国际第三次代表大会期间于莫斯科与列宁有过短暂交谈。1935年受共产国际派遣参加巴西反对瓦加斯政府的武装起义，失败后于1936年在里约被捕，遭酷刑并被囚禁于费尔南多-迪诺罗尼亚岛四年余，1940年获释返阿。政治上严格追随苏联路线，公开谴责托洛茨基。1951年遭遇刺受伤，1957年当选制宪会议代表。晚年多从事新闻与史学工作，获苏联多项勋章。"
 ARG_segundo_storni_desc:0 "1876年7月16日生于图库曼，1954年12月4日卒。全名塞贡多·罗萨·斯托尔尼，阿根廷海军中将、地缘政治思想家。1894年毕业于海军军校。1916年他发表两场影响深远的演讲，后结集为《海洋中的阿根廷利益》一书，创立了主张阿根廷对其大陆架及全部资源享有权利的学说——其生日7月16日今被定为\"阿根廷海洋利益日\"。他是马德普拉塔阿根廷海洋学研究所与布宜诺斯艾利斯国家科学院（1935）的共同创始人，并曾任海军总参谋长。1943年\"1943年革命\"后，他出任拉米雷斯政府外交部长。作为民族主义者却亲同盟国，他主张阿根廷参战：1943年8月5日致函美国国务卿科德尔·赫尔，表明阿根廷有意与轴心国断交、但请对方耐心并在军援上有所表示。赫尔为施压而公开此信、并严词质疑阿根廷的\"中立主义\"，反激起军中反美情绪，导致斯托尔尼于9月辞职，由中立派的吉尔伯特接任。"
 ARG_victorio_codovilla_desc:0 "维克托里奥·科多维拉，1894年2月8日生于意大利奥托比亚诺，1970年4月15日卒于莫斯科。意大利裔阿根廷共产主义领袖，党内外常以绰号“胖子”称之。1912年移民阿根廷，参与创建阿根廷国际社会党，后成为阿根廷共产党中央委员会和政治局成员。1920年代任共产国际南美局书记，1932年以化名“路易斯·梅迪纳”赴西班牙指导共产党活动，内战期间继续留驻马德里。1941年返阿后任阿共总书记、主席，坚决反对庇隆主义，1943年曾遭监禁。1969年获苏联十月革命勋章，逝世后葬于莫斯科新圣女公墓。"
 ARG_vincente_gallo_desc:0 "1873年10月3日生于图库曼，1942年6月3日卒。全名维森特·卡梅洛·加略，阿根廷律师、学者与政治家，激进公民联盟元老、后转反个人主义派。他自建党之初即加入 UCR，1890年代与伊里戈延一道推动男性普选。萨恩斯·培尼亚法通过后，他于1912年当选众议员，1919年至1923年任布宜诺斯艾利斯首都区参议员。1920年他是极右准军事团体\"阿根廷爱国联盟\"的创始成员之一。1923年阿尔韦亚尔总统任命他为内政部长；1924年他与一批激进党人同伊里戈延决裂、组建反个人主义 UCR。1925年因阿尔韦亚尔不支持其对布宜诺斯艾利斯省实施联邦干预的主张，他辞职。1928年他作为反个人主义派副总统候选人参选，败于伊里戈延。"
 CBIO_ARG_agustin_pedro_justo_desc:0 "1876年2月26日生于恩特雷里奥斯省乌拉圭河畔康塞普西翁，1943年1月卒于布宜诺斯艾利斯。全名阿古斯丁·佩德罗·胡斯托·罗隆，军人、工程师、外交官与政治家，官至将军，曾任国立军事学院教授与院长。1922年至1928年在阿尔韦亚尔总统任内任陆军部长，1930年参与何塞·费利克斯·乌里武鲁推翻伊里戈延的政变。1931年在被广泛指控舞弊的选举中当选总统，1932年就任，任期至1938年，是\"无耻十年\"的核心人物之一。任内创立阿根廷中央银行、开征所得税，并与英国签订备受争议的《罗卡–朗西曼条约》（由副总统小胡里奥·罗卡签署）；外长萨维德拉·拉马斯因斡旋查科战争获诺贝尔和平奖。卸任后仍具政治影响力，支持继任者奥尔蒂斯；第二次世界大战期间主张阿根廷对轴心国宣战，与坚持中立的卡斯蒂略政府对立。1943年初病逝，享年66岁。"
 CBIO_ARG_alberto_gilbert_desc:0 "阿尔韦托·吉尔伯特，1887年2月6日生，1973年卒，阿根廷军人。1909年毕业于国立军事学院，历任骑兵部队军官，后就读高等战争学院。1923年至1930年任驻智利武官，1932年任驻西班牙武官，1935年晋上校，1943年晋准将。在拉米雷斯的事实政府中，他先任内政部长；1943年9月斯托尔尼因风波辞职后，他接任外交部长（1943年9月至1944年2月）。他是坚定的中立主义者，中止了前任已着手的对轴心国断交准备。任内他与海军部长贝尼托·苏埃罗组织了一桩失败的秘密购械行动，经手人、海军后备军官奥斯马尔·赫尔穆特实为德国间谍；赫尔穆特在欧洲被盟军拘捕所引发的丑闻，成为美国施压拉米雷斯、迫使阿根廷于1944年1月26日与轴心国断交的重要因素。断交在军中引发危机，他于1944年2月16日辞职，同年退役。"
 CBIO_ARG_alberto_teisaire_desc:0 "阿尔韦托·特伊萨伊雷，1891年5月20日生于门多萨，1963年9月11日卒于布宜诺斯艾利斯。海军军官出身，官至海军少将，早年入海军学院，第一次世界大战期间曾在美国受训，1931年任训练舰\"萨米恩托号\"舰长。他属\"1943年革命\"中的联合军官团，1944年2月起任海军部长，后又任内政部长，是庇隆的亲信盟友。1946年他创建\"独立党\"支持庇隆参选，此后三度当选布宜诺斯艾利斯市联邦参议员，并任参议院临时议长、庇隆党最高委员会主席，权势显赫；因信奉共济会，天主教背景的海军将领曾讥其为\"那个共济会员\"。1954年在因基哈诺去世而单独举行的副总统补选中获胜，成为阿根廷史上唯一由单独选举产生的副总统。1955年庇隆政府被\"解放革命\"推翻后，庇隆流亡，他却被扣押并被迫照读一份指控庇隆罪行的声明，全程录像后在全国影院放映，因而被庇隆派视为叛徒。此后被囚于马丁加西亚岛至1958年，1963年病逝。"
 CBIO_ARG_antonio_parodi_desc:0 "安东尼奥·帕罗迪，1890年5月25日生于布宜诺斯艾利斯省圣马丁，1978年3月12日卒于布宜诺斯艾利斯。阿根廷军人、航空准将、航空先驱。1910年以步兵军官身份毕业于国立军事学院，1914年完成陆军航空课程，获阿根廷航空俱乐部第68号飞行证，并创下夜间导航（1916）与载客飞行（1917）等纪录。1920年3月，他与佩德罗·萨尼同时起飞尝试飞越安第斯山脉最高峰段；萨尼因机械故障折返，帕罗迪则独自完成往返：飞越圣地亚哥上空撒下传单，在顺风助力下历时约十个半小时返回出发机场，成为首位往返飞越安第斯高峰区的飞行员。因听力受损，部下称他\"聋子帕罗迪\"。1940年他组建陆军民用航空运输部门，创设 LASO、LANE 等国营航空公司。1944年空军成立时获准将衔，1946年退役。1955年他拒绝支持推翻庇隆的政变，事后被剥夺军衔与军人荣誉。"
 CBIO_ARG_antonio_soto_desc:0 "1897年10月8日生于西班牙费罗尔，1963年5月11日卒于智利蓬塔阿雷纳斯。全名安东尼奥·贡萨洛·索托·卡纳莱霍，西班牙裔阿根廷无政府工团主义工人运动领袖，人称“加列戈·索托”。少年时移居阿根廷，做过杂工、码头工，早年接受无政府主义思想。1920年当选里奥加列戈斯工人协会总书记，领导旅馆、港口和农牧工人罢工，成为巴塔哥尼亚大罢工主要领导人之一。1921年军队镇压时，大批罢工者被枪决，索托率少数人越境逃入智利。此后长期在蓬塔阿雷纳斯经营小旅馆，终生坚持其政治信念。"
 CBIO_ARG_arturo_rawson_desc:0 "1885年6月4日生于圣地亚哥-德尔埃斯特罗，1952年10月8日卒于布宜诺斯艾利斯。全名阿图罗·罗森，军人，出身一个美国裔家庭。1905年毕业于国立军事学院，后任教官，1920年代作为骑兵军官参加过对查科原住民的军事行动，1943年任坎波德马约骑兵部队指挥官。当年6月4日，他率约万名士兵进入布宜诺斯艾利斯，推翻拉蒙·卡斯蒂略政府、终结\"无耻十年\"，史称\"1943年革命\"，并当即自任总统。但其内阁人选多为旧政权与保守派人物，触怒了发动政变的军人集团。仅三日后的6月7日，安纳亚上校到其办公室，告知他执政乃出于误会、真正的总统是佩德罗·巴勃罗·拉米雷斯；罗森遂辞职，谢绝军方护送，乘吉普车离开玫瑰宫。因从未宣誓就职，他通常不被列入官方总统名录，实际任期约三天，是阿根廷执政时间最短者之一。此后曾任驻巴西大使，二战期间倾向同盟国；1951年因支持反庇隆的未遂政变一度被囚。"
 CBIO_ARG_bartolome_de_la_colina_desc:0 "巴托洛梅·德拉科利纳，1894年10月20日生于拉里奥哈，1967年6月27日卒于布宜诺斯艾利斯。军事工程师，被视为阿根廷空军的奠基人之一。1921年毕业于高等技术学校，获军事工程师学位，后入国家航空军事学校；曾赴法国临时加入其空军并取得航空工程师资格。回国后历任航空技术与试验部门主管。1944年至1945年任航空兵总司令。1945年1月4日航空国务秘书处设立，他出任首任航空国务秘书（职级相当于国务部长），统管全国军民航空事务。同年10月，因不满庇隆被逐出副总统之位，他一度辞职，次月又应邀复任，并在庇隆第一任总统初期继续任职，1949年3月以准将衔退役。他后被立法尊为\"阿根廷航空先驱\"，马德普拉塔机场曾以其名命名。"
 CBIO_ARG_basilio_pertine_desc:0 "1879年4月3日生于布宜诺斯艾利斯，1963年12月13日卒。全名巴西利奥·贝尔纳韦·佩尔蒂内，意大利移民之子，1894年入国立军事学院，步兵出身，军旅生涯逾四十年，官至陆军中将。1905年一次寡不敌众的战斗中他一度被当作阵亡，敌方指挥官出于对其英勇的敬意，下令将\"遗体\"裹以阿根廷国旗送回布宜诺斯艾利斯——实则他身负重伤仍活着，总统金塔纳随即因功晋升他。1906年起赴德，第一次世界大战期间任驻德武官、亲历德军作战并获铁十字勋章等德国勋赏，著有关于大战的军事著作。他是德国军事乃至法西斯的仰慕者，1936年至1938年任胡斯托政府陆军部长；1941年在军人俱乐部安排民族主义者 霍尔丹·布鲁诺·根塔 演讲，遭调查纳粹活动的委员会举报。1943年至1944年任布宜诺斯艾利斯市长。其孙女伊内斯·佩尔蒂内后为阿根廷第一夫人（德拉鲁阿总统之妻）。"
 CBIO_ARG_benito_sueyro_desc:0 "贝尼托·苏埃罗，1887年3月3日生，1969年卒。阿根廷海军军官，官至海军少将。1940年至1943年任海军舰队总司令；其间1941年10月3日鱼雷艇\"科连特斯号\"因碰撞沉没、14名水兵遇难，军事侦查法官认定他负有责任，但他最终未受处分，1942年社会党众议员索拉里曾就此要求质询海军部长。在\"1943年革命\"后拉米雷斯政府中，他任海军部长，其兄萨巴·苏埃罗则为同期副总统。任内他与外交部长吉尔伯特组织了经海军后备军官奥斯马尔·赫尔穆特（实为德国间谍）进行的失败购械行动，此案成为美国迫使阿根廷1944年1月与轴心国断交的主因之一。断交引发军中危机、GOU 逼拉米雷斯下台之际，他曾建议逮捕法雷尔与庇隆，但因拉米雷斯已失去军方支持而未果，遂于1944年2月26日辞职，由特伊萨伊雷接任。"
 CBIO_ARG_carlos_lamas_desc:0 "1878年11月1日生于布宜诺斯艾利斯，1959年5月5日卒于同地。全名卡洛斯·萨维德拉·拉马斯，律师、外交家与法学教授，出身望族，为五月革命首届政府主席科内利奥·萨维德拉的曾孙，妻子是罗克·萨恩斯·佩尼亚总统之女。1932年至1938年任胡斯托政府外交部长，主持了阿根廷史上最活跃的外交时期之一。他斡旋玻利维亚与巴拉圭之间的查科战争，促成1935年《布宜诺斯艾利斯议定书》停火，并倡议由21国签署的《萨维德拉·拉马斯反战公约》；1936年当选国际联盟大会主席，并因上述贡献获得诺贝尔和平奖，成为首位获此奖的拉丁美洲人。因总统胡斯托自认也应分享此荣而与之生隙，颁奖仪式低调地在其寓所举行。他以衣着考究著称，据说戴着全布宜诺斯艾利斯最高的硬领。卸任后回归学界，1941年至1943年任布宜诺斯艾利斯大学校长。"
 CBIO_ARG_carlos_marquez_desc:0 "1885年10月8日生于布宜诺斯艾利斯，1950年卒于同地。全名卡洛斯·德梅特里奥·马尔克斯，阿根廷军人，官至师级将领。1902年毕业于国立军事学院，1913年毕业于高等战争学院，曾任军事航空学校教官、军事地理研究所地形科主任，1922年至1929年任陆军总参谋部军官，其间与胡斯托将军建立关系。此后历任炮兵总监（1932–1935）、驻外军购委员会主席（1935–1937）。1938年至1940年任奥尔蒂斯政府陆军部长。任内他将最活跃的民族主义军人胡安·包蒂斯塔·莫利纳等强制退役、削弱其影响，但民族主义在中层军官中的势力并未减退。他也是\"帕洛马尔土地案\"丑闻的责任人之一：无视每公顷约两千比索的官方估价，下令以远高的价格购地，丑闻波及奥尔蒂斯政府；1940年9月被免予起诉后，他随即辞职。"
 CBIO_ARG_diego_mason_desc:0 "1887年4月14日生于布宜诺斯艾利斯，1972年1月11日卒。全名迭戈·伊西德罗·马松，阿根廷军人，官至陆军中将。1906年毕业于国立军事学院，1921年毕业于高等战争学院，历任军校教官、步兵团长、埃斯特万·德卢卡兵工厂主任（1934–1936），以及多个师与军区的指挥官。\"1943年革命\"后，他在拉米雷斯与法雷尔政府中任农业部长，并于1944年2月至5月代理外交部长。任农业部长期间，他冻结农村租金并规定三年自动续租，使中小农户显著获益。庇隆第一任总统期间，他于1946年至1948年任陆军总司令，1948年退役。"
 CBIO_ARG_diogenes_taboada_desc:0 "迪奥赫内斯·塔沃阿达，1887年生于圣路易斯省，1978年4月11日卒于布宜诺斯艾利斯。律师、政治家，早年即加入激进公民联盟，属反个人主义派。曾任圣路易斯省财政部长（1917）、国会众议员、国家国内税总管（1925）、国家邮政储蓄银行行长（1926）。1938年至1940年任奥尔蒂斯政府内政部长，主要致力于终结选举舞弊，曾下令联邦干预卡塔马卡与布宜诺斯艾利斯省的选举。1945年他参加了反庇隆的\"宪法与自由大游行\"。此后于弗朗迪西政府任外交部长（1958–1961），并先后出使乌拉圭与秘鲁。"
 CBIO_ARG_edelmiro_julian_farrell_desc:0 "1887年2月12日生于布宜诺斯艾利斯省阿韦亚内达（今属拉努斯），1980年10月31日卒于布宜诺斯艾利斯。全名埃德尔米罗·胡利安·法雷尔·普劳尔，军人，有爱尔兰与德国血统，祖父来自爱尔兰朗福德郡。1907年毕业于国立军事学院，1924年至1926年在意大利一支山地部队服役。1943年参与推翻卡斯蒂略的\"1943年革命\"，在拉米雷斯政府中先后任陆军部长与副总统。1944年2月拉米雷斯被迫交权后，他出任事实总统，任期至1946年，是\"1943年革命\"军事政权中的第二任。任内颁布《雇工法规》、设立年终奖与劳工司法等社会立法，并于1945年3月27日在二战末期对德国与日本宣战、签署《查普尔特佩克协定》。他是庇隆的上级与提携者，正是在其治下庇隆先后出任劳动部长与副总统；1945年7月他宣布举行大选，庇隆于1946年当选并接替其职位。"
 CBIO_ARG_edmundo_sustaita_desc:0 "1898年8月20日生于查科省雷西斯滕西亚，1955年3月18日卒于布宜诺斯艾利斯。全名埃德蒙多·萨穆埃尔·苏斯塔伊塔，阿根廷军人，先属陆军、后属空军，官至空军少将。1916年入国立军事学院（骑兵），1926年在军事航空学校取得军事飞行员资格。1930年参与乌里武鲁推翻伊里戈延的政变，任 埃尔帕洛马尔 空军基地与乌里武鲁之间的联络人（一次执行联络飞行时驾机失事，但本人安然无恙）。1931年任驻法武官，1941年任科尔多瓦军事航空学校校长；同年9月因参与反卡斯蒂略政府的密谋被捕、囚于坎波德马约，12月获释，其后参与1943年推翻卡斯蒂略。1945年空军成立后获准将衔，同年2月至11月任航空兵司令。他是现代政治人物埃丽萨·卡里奥的舅公。"
 CBIO_ARG_eduardo_avalos_desc:0 "1892年4月22日生于布宜诺斯艾利斯，1971年5月17日卒于同地。全名爱德华多·豪尔赫·阿瓦洛斯，阿根廷军人。1943年6月参与推翻卡斯蒂略的\"1943年革命\"，率进军首都的三路纵队之一，途中与保持中立的海军部队在海军机械学校一带发生冲突、造成伤亡，此事日后一直萦绕其心。他是\"联合军官团\"的核心\"四上校\"之一（与庇隆、埃米利奥·拉米雷斯、恩里克·冈萨雷斯并列），与激进党人萨巴蒂尼关系密切，在拉米雷斯政府时期任坎波德马约驻军司令。1945年10月8日，身为坎波德马约司令、当时最具影响力的军人，他发动军事行动迫使庇隆去职并被捕，10日至18日间出任陆军部长。但10月17日（后来的\"忠诚日\"），面对要求释放庇隆的大规模工人集会，他为避免流血而拒绝镇压、转而谈判，结果反促成庇隆获释、自己去职。事后他被解除军职，象征性地被任命为阿根廷足球协会监管，1946年1月退役。"
 CBIO_ARG_eleazar_videla_desc:0 "埃莱亚萨尔·维德拉，1881年生于圣胡安，1960年8月20日卒于布宜诺斯艾利斯。阿根廷海军军官，官至海军少将。1898年入海军，1904年获海军少尉衔，早年在多艘巡洋舰、战列舰上服役、表现出色。1933年底获胡斯托总统任命为海军部长，任内为海军争取更多经费并用于长远建设：在英国订造巡洋舰\"阿根廷号\"与七艘\"布宜诺斯艾利斯\"级驱逐舰，同时大力扶持本国造船厂，并于1934年创建海军战争学院。他还曾短期代理陆军部长与公共工程部长。奥尔蒂斯总统时期任驻巴拉圭大使，1941年2月出任布宜诺斯艾利斯省联邦干预专员。晚年（1957年）主持纪念海军名将吉列尔莫·布朗逝世百年的委员会，推动海军史研究。（注：他与1976年独裁者豪尔赫·拉斐尔·维德拉并非同一人。）"
 CBIO_ARG_enrique_mosca_desc:0 "1880年7月15日生于圣菲，1950年7月22日卒。全名恩里克·德拉斯梅塞德斯·莫斯卡，阿根廷律师、政治家，激进公民联盟要人。1906年获圣菲省立大学（今利托拉尔国立大学）法学学位，曾主办《阿根廷报》。历任省议员、省部长与国会众议员。1920年至1924年任圣菲省长，任内促成省立大学资产移交、协助创建利托拉尔国立大学；其间北部森林种植园爆发大罢工，其政府以允许并资助由企业控制的私人警察加以应对，伴随严厉镇压。1926年至1928年任国家教育委员会主席。1930年政变后，他于1931年至1934年被囚于马丁加西亚岛与乌斯怀亚。1937/38年他作为阿尔韦亚尔的副总统竞选搭档参选、败于奥尔蒂斯。1946年他再度出任民主联盟副总统候选人，与坦博里尼搭档，竞选中猛烈抨击庇隆主义为\"法西斯\"，最终败于庇隆。"
 CBIO_ARG_enrique_ruiz_guinazu_desc:0 "恩里克·鲁伊斯·吉尼亚苏，1882年（一说1884年）10月14日生于布宜诺斯艾利斯，1967年11月13日卒于同地。法学家、教授、作家、银行家与外交官。曾任布宜诺斯艾利斯大学与拉普拉塔大学教授，1930年转入外交界，历任驻瑞士全权代表、国际联盟常驻代表、驻西班牙及驻梵蒂冈大使。1941年应召出任外交部长，任至1943年\"1943年革命\"。他是坚定的中立主义者，也是公开的法西斯同情者，屡屡称颂墨索里尼与佛朗哥；在1942年里约热内卢泛美会议上，他推动将对轴心国\"断交\"的措辞降格为\"建议\"，使阿根廷得以继续维持对德、日、意关系。美国外交官萨姆纳·韦尔斯曾对他作出极为苛刻的评价。他亦是知名史学家，其1916年著作《印度法官制度》影响深远；其女为记者玛格达莱娜·鲁伊斯·吉尼亚苏。"
 CBIO_ARG_eva_peron_desc:0 "本名玛丽亚·埃娃·杜阿尔特，世人昵称\"埃维塔\"，1919年5月7日生于布宜诺斯艾利斯省洛斯托尔多斯，1952年7月26日卒于布宜诺斯艾利斯，享年33，死于宫颈癌。1946年至1952年任阿根廷第一夫人。她出身贫寒，1934年赴首都发展，成为舞台、广播与电影演员。1944年在为圣胡安地震灾民举办的义演中结识胡安·庇隆上校，次年10月成婚。庇隆1946年就任总统后，她成为庇隆主义的核心人物：主持埃娃·庇隆基金会，兴建大量医院、学校与养老院；推动1947年女性选举权法（人称\"埃维塔法\"），1949年创立女性庇隆党，被称为\"贫民的旗手\"，也是庇隆与工会之间的纽带。1951年工会拥戴她竞选副总统，但她于8月31日（\"放弃日\"）在反对压力与病情下宣布退出。她也因个人崇拜与\"灌输\"式宣传受到批评。逝世后其遗体经防腐处理，1955年政变后被劫走、辗转藏匿于意大利十六年，1971年归还庇隆，最终安葬于雷科莱塔。"
 CBIO_ARG_fanny_edelman_desc:0 "本姓雅布科夫斯基，后随夫姓改称范妮·埃德尔曼，1911年2月27日生于科尔多瓦省圣弗朗西斯科，2011年11月1日卒于布宜诺斯艾利斯，享年100岁。阿根廷共产党政治家与妇女运动领袖，出身逃避沙俄排犹迫害的俄裔犹太移民家庭，早年当过纺织女工与音乐教师。1934年加入阿根廷共产党，投身国际红色救济会工作。1936年与记者贝尔纳多·埃德尔曼结婚，次年受党派遣赴西班牙内战中支援共和国一方；她曾称保卫西班牙共和国的运动是\"人类团结最崇高的表现之一\"。1947年参与创建阿根廷妇女联盟，1972年任国际民主妇女联合会总书记。自1970年代起长期担任阿根廷共产党主席，1978年曾向联合国日内瓦人权委员会递交大量阿根廷军政府受害者的证词。2011年获古巴颁授何塞·马蒂勋章，同年逝世。"
 CBIO_ARG_frederick_pinedo_desc:0 "费德里科·皮内多，1895年4月22日生于布宜诺斯艾利斯，1971年9月10日卒于同地。律师、经济学家、政治家与史学家，出身望族，为科内利奥·萨维德拉的后裔。早年加入社会党，后与安东尼奥·德托马索共创独立社会党，该党加入\"和谐联盟\"。他三度出任财政部长：胡斯托政府（1933–1935）、卡斯蒂略政府（1940）与吉多政府（1962）。首任财长期间推行重要经济改革，创建阿根廷中央银行。任内因\"肉类辩论\"与参议员利桑德罗·德拉托雷激烈交锋，德拉托雷以“大脖子”相讥，皮内多误听为“戴绿帽”，两人遂决斗，结果皮内多开枪未中、德拉托雷朝天鸣枪。1940年再任财长时提出主张工业化与国家介入的\"皮内多计划\"，但在众议院被搁置；作为公开的亲同盟国者、反对中立立场，他随即辞职。1962年第三度任财长仅约两三周，因政府关闭国会而辞职，称不愿做\"没有国会的政府\"的部长。"
 CBIO_ARG_guillermo_rothe_desc:0 "吉列尔莫·罗特，1879年12月10日生于科尔多瓦省托托拉尔镇，1959年1月22日卒于布宜诺斯艾利斯。保守派律师、大学教师与政治家，属国家民主党，是科尔多瓦民主党内自由派（反教权）\"罗特派\"的领袖。他历任科尔多瓦市议员、民事法官、科尔多瓦省国家检察官、两届国会众议员、科尔多瓦国立大学副校长、科尔多瓦高等法院法官与院长。1922年胡里奥·阿根蒂诺·罗卡（子）任科尔多瓦省长时，他出任省政府、司法与公共教育部长。1930年12月获乌里武鲁任命为圣菲省联邦干预专员；1931年出任国家司法与公共教育部长，年底当选科尔多瓦籍国会参议员（任期1932–1941）。此外他还曾出任外交部长。"
 CBIO_ARG_honorio_pueyrredon_desc:0 "奥诺里奥·普埃雷东，1876年（部分来源作1872年）生于布宜诺斯艾利斯省圣佩德罗，1945年9月23日卒于布宜诺斯艾利斯。律师、法学教授、外交官与政治家，激进公民联盟伊里戈延派要角，为最高执政官胡安·马丁·德普埃雷东的侄孙。1916年任伊里戈延政府农业部长，1917年至1922年任外交部长。他率阿根廷代表团出席1920年日内瓦国联首届大会并任大会副主席；因坚持\"平等对待交战国与中立国\"的普遍性原则未获接纳，阿根廷代表团遂退出国联。1922年起任驻美国大使，后又出使古巴，并于1928年率团出席哈瓦那泛美会议、因反对干涉主义原则而中途退场并辞去驻美大使一职。1931年他作为 UCR 候选人赢得布宜诺斯艾利斯省长选举，却被乌里武鲁取消，其后遭流放，并被囚于马丁加西亚岛、圣胡利安与乌斯怀亚监狱。其曾孙女包括歌手法维亚娜·坎蒂洛与政治家帕特里夏·布尔里奇。"
 CBIO_ARG_hortensio_quijano_desc:0 "1884年6月10日生于科连特斯省，1952年4月3日卒于布宜诺斯艾利斯。全名胡安·奥滕西奥·基哈诺，律师、政治家。1908年毕业于布宜诺斯艾利斯大学，1919年获法学博士，长期为科连特斯的激进党领袖，先随伊里戈延、后转入反个人主义派。1945年10月他创立\"激进公民联盟革新会\"以支持庇隆，并于同年任法雷尔政府内政部长。1946年2月当选副总统，与庇隆搭档击败民主联盟的坦博里尼-莫斯卡组合；任内推动深化对巴西关系、促成\"ABC 公约\"复兴。1951年因埃维塔退出而再度与庇隆搭档竞选并当选，但因癌症于1952年4月病逝、未及就任第二任期，其位在就职礼上由埃维塔代替。他自称“一个没有传记的人”；出生证上其名拼写有误，他自认系记录错误而改用奥滕西奥；据尼尔森·卡斯特罗记述，埃维塔曾因他肩上落满头皮屑而戏称他为“里海”。"
 CBIO_ARG_hugo_wast_desc:0 "乌戈·瓦斯特是笔名，本名古斯塔沃·阿道夫·马丁内斯·苏维里亚，1883年10月23日生于科尔多瓦，1962年3月28日卒于布宜诺斯艾利斯。阿根廷小说家与政治家，1907年在圣菲取得法学学位。其笔名由本名字母重排而成。他是当时最畅销的小说家之一，作品被译成十五种以上语言，《石头荒漠》曾获国家文学奖。1916年当选保守派国会众议员；1931年经乌里武鲁任命出任国家图书馆馆长，任职至1955年，其间大力扩充馆藏。他是虔诚的天主教民族主义者，其小说《卡哈尔》与《黄金》（1935）宣扬反犹的\"犹太-共济会-共产主义阴谋论\"，带有明确的反犹主义色彩。\"1943年革命\"期间他出任司法与公共教育部长，任内在全国学校推行强制天主教宗教教育。1935年获教宗庇护十一世授予圣大额我略骑士勋位。"
 CBIO_ARG_jose_cantilo_desc:0 "1877年8月23日生于布宜诺斯艾利斯，1953年卒。全名何塞·马里亚·坎蒂洛，阿根廷外交官，1938年至1940年任奥尔蒂斯政府外交部长。他是19世纪记者兼诗人何塞·马里亚·坎蒂洛之孙，毕业于布宜诺斯艾利斯大学（法学与文学）。其外交生涯漫长：曾任驻乌拉圭、巴拉圭、玻利维亚、瑞士与意大利大使，并参与萨尔地区归还德国的斡旋。任外长期间，他在1938年利马泛美会议上力主维护阿根廷与欧洲的联系、与美国国务卿科德尔·赫尔针锋相对；1939年与巴拉圭签订皮尔科马约河界约。1939年拉普拉塔河口海战后，他曾向英国大使表示阿根廷可能放弃中立，并提议以\"非交战\"地位取代中立，但遭美国拒绝。奥尔蒂斯因病将权力交予卡斯蒂略后，他离任，其职先后由胡里奥·罗卡（子）与鲁伊斯·吉尼亚苏接替。"
 CBIO_ARG_jose_tamborni_desc:0 "1886年2月22日生于布宜诺斯艾利斯，1955年9月25日卒于同地。全名何塞·帕斯夸尔·坦博里尼，医生、政治家，激进公民联盟成员（反个人主义派），以清廉朴素著称。意大利移民之子，早年即投身激进党。他曾三度任国会众议员，1940年至1943年任布宜诺斯艾利斯首都区参议员，1925年至1928年任阿尔韦亚尔政府内政部长。乌里武鲁与胡斯托时期，他曾被囚于圣胡利安、马丁加西亚岛与乌斯怀亚。1942年阿尔韦亚尔去世后，他成为激进党\"联盟派\"的当然领袖。1945年12月，他被推为民主联盟总统候选人，与恩里克·莫斯卡搭档，却在1946年2月大选中败于胡安·庇隆。此后他退出政坛，1955年逝世；因恰逢\"解放革命\"之初，其葬礼成为一场政治性的悼念。"
 CBIO_ARG_juan_peron_desc:0 "1895年10月8日生于布宜诺斯艾利斯省洛沃斯，1974年7月1日卒于奥利沃斯。全名胡安·多明戈·庇隆，军人、政治家，1911年入国立军事学院，1930年参与乌里武鲁推翻伊里戈延的政变，1939年至1941年任驻意大利、驻德国武官，考察法西斯与纳粹政权的军事组织。1943年参与推翻卡斯蒂略的\"1943年革命\"，出任劳动与保障部长，大幅扩展劳工权益，赢得工会广泛拥戴。1945年10月他一度被军方逼迫下台并遭拘押，10月17日大规模工人集会迫使其获释，此日后被奉为庇隆主义诞生的标志。1946年当选总统，此后三度执政（1946–1952、1952–1955、1973–1974），推行\"正义主义\"，对外倡导\"第三立场\"。他常引用\"唯一的真理就是现实\"一语宣扬其政治哲学理念，此语后广为阿根廷政坛引用。1955年遭军事政变推翻，长期流亡；1973年回国再度当选，翌年病逝于任上。"
 CBIO_ARG_juan_pistarini_desc:0 "胡安·皮斯塔里尼，1882年12月23日生于拉潘帕省维多利卡，1956年5月29日卒于乌斯怀亚狱中。工兵将领与政治家，出身意大利移民家庭。1895年入国立军事学院，赴欧洲修得土木工程师，后成为军事工程师并进入陆军总参谋部。1935年起任胡斯托政府公共工程部长（最早提出建设埃塞萨机场）；1937年至1940年赴德、意采购军备，公开表露对纳粹与法西斯的同情，并推荐德国承包商。参与1943年政变后，1944年再任公共工程部长，并在庇隆1945年10月去职后短暂兼任副总统。他是庇隆1946年就任后唯一留任的部长，主持第一个五年计划的庞大基建：数千所学校、公路、旅游度假区（查帕德马拉尔、恩巴尔塞）、六十五万套住房，以及1949年落成、以其名\"皮斯塔里尼部长\"命名的埃塞萨国际机场。据载他常以参与建造的工人之名为落成的住宅区命名。1955年政变后，他被囚于乌斯怀亚、境遇凄惨，1956年病逝。"
 CBIO_ARG_juan_tonazzi_desc:0 "1888年5月8日生于布宜诺斯艾利斯，1967年9月28日卒于同地。全名胡安·内龙·托纳西，阿根廷军人与政治家，官至准将。1904年入国立军事学院，炮兵出身。曾任驻意大利（1925–1926）与驻乌拉圭武官、军事学院副院长，1936年任军事学院院长，1939年任第三师师长并晋准将。他是胡斯托总统的副官与同僚。1940年至1942年任奥尔蒂斯与卡斯蒂略政府陆军部长；因他是胡斯托的追随者、而卡斯蒂略忌惮其政变倾向，1942年11月被佩德罗·巴勃罗·拉米雷斯接替。"
 CBIO_ARG_julio_roca_desc:0 "全名胡里奥·阿根蒂诺·帕斯夸尔·罗卡·富内斯，俗称\"小罗卡\"，1873年5月17日生于科尔多瓦，1942年10月8日卒于布宜诺斯艾利斯。他是总统胡里奥·阿根蒂诺·罗卡之子（须与其父、19世纪的总统区分）。律师、政治家，科尔多瓦民主党人。曾四任科尔多瓦籍众议员、参议员（1916–1922）、科尔多瓦省长（1922–1925），并于1932年至1938年任胡斯托政府副总统。1933年他作为特使赴英回访威尔士亲王，并与沃尔特·朗西曼共同起草、签署《罗卡-朗西曼条约》；他当时的著名表态称阿根廷在经济上是\"英帝国不可分割的一部分\"，招致激烈批评。此后他历任驻巴西大使（1938–1939）与外交部长（1940–1941），因不满卡斯蒂略延续\"爱国舞弊\"而于1941年1月辞职，退隐其庄园\"La Larga\"。"
 CBIO_ARG_leon_scasso_desc:0 "1882年生，1954年6月卒。全名莱昂·洛伦索·斯卡索，阿根廷海军上将。1938年2月至1942年6月任奥尔蒂斯（及卡斯蒂略代理时期）政府海军部长，任内正值第二次世界大战。据历史学家卡洛斯·埃斯库德记述，1942年前后他曾筹划一支海军舰队秘密远征、意图收复马尔维纳斯群岛，并在卡斯蒂略召集的内阁会议上证实此事、一力承担责任，但其他部长认为一旦实施舰队将迅速被英国海军击沉，计划遂未付诸行动。他曾率\"莫雷诺号\"与\"里瓦达维亚号\"两艘战列舰做官方访问。晚年他信奉民族主义，为民族主义解放同盟培养干部，并于1946年作为该组织候选人竞选布宜诺斯艾利斯参议员。"
 CBIO_ARG_luis_podesta_costa_desc:0 "1885年10月18日生于布宜诺斯艾利斯，1962年卒。全名路易斯·阿古斯丁·波德斯塔·科斯塔，阿根廷律师、外交家与著名国际法学家。他毕业于布宜诺斯艾利斯大学并在该校任教，曾任经济科学学院副院长与院长。1930年代供职于外交部，历任使馆顾问、政治指令处处长与部总司长。他是国际公法领域的权威，所著《国际公法》教科书（后与何塞·马里亚·鲁达合修再版）长期被奉为经典。此后在阿兰布鲁的军政府时期出任外交部长。"
 CBIO_ARG_manuel_a_rodriguez_desc:0 "曼努埃尔·A·罗德里格斯，1880年2月15日生于布宜诺斯艾利斯，1936年2月23日卒于马德普拉塔。阿根廷陆军将领，以品行端正、笃信宗教著称。军人世家出身，1896年入军校、1899年以步兵军官毕业，后转入新设的工兵。1919年升中校调入陆军总参谋部，曾任陆军部长胡斯托的秘书副官；1925年至1928年任驻德国与瑞士武官，参与驻外军购委员会，并作为军事专家出席日内瓦国联裁军会议。1932年胡斯托就任总统后任命他为陆军部长，任内锐意推动陆军各方面的革新，并就欧洲军购、航空状况等应询于国会。1936年2月，他抱病代表陆军观摩海军演习后，于马德普拉塔病逝，殉职于任上。"
 CBIO_ARG_manuel_maria_de_iriondo_desc:0 "曼努埃尔·马里亚·德伊里翁多，绰号“曼努乔”，1873年12月26日生于圣菲，1958年12月4日卒于布宜诺斯艾利斯。律师、政治家，激进公民联盟人（1924年起属反个人主义派），圣菲省长西蒙·德伊里翁多之子。1895年获布宜诺斯艾利斯大学法学博士，1898年起从政，历任国会众议员、国家财政部长（1907–1910，费格罗亚·阿尔科塔政府）与阿根廷国家银行行长（1910–1918）。1919年他是右翼准军事团体\"阿根廷爱国联盟\"的共同创始人之一。1932年至1936年任胡斯托政府司法与公共教育部长；1937年至1941年任圣菲省长，其省政源自一次联邦干预（他此前任司法部长时即为干预进步民主党人莫利纳斯的省政府铺路）。他是大地主，当地有两处地名以其为名。"
 CBIO_ARG_marcelo_t_de_alvear_desc:0 "1868年10月4日生于布宜诺斯艾利斯，1942年3月23日卒于同省栋托尔夸托。全名马克西莫·马塞洛·托尔夸托·德·阿尔韦亚尔·帕切科，律师、外交官、政治家，出身布宜诺斯艾利斯望族，为独立英雄卡洛斯·玛丽亚·德·阿尔韦亚尔之孙。1891年获法学学位，是激进公民联盟创始成员之一，参加过1890、1893年的激进派起义。伊里戈延首任总统期间出任驻法大使，1922年当选总统接替伊里戈延，任期至1928年。其政府恰逢战后世界危机结束，经济繁荣、工业与石油获得发展，人均国内生产总值一度居世界前列；交接就职时，他的声音首次经电台向全国播出。他是 UCR 反个人主义派的主要代表，与伊里戈延渐行渐远；妻子为歌剧演唱家雷希娜·帕奇尼。卸任后长期领导激进派反对派，反对乌里武鲁政变与\"无耻十年\"的选举舞弊，其间曾遭迫害入狱；1937年再度参选总统，在被指舞弊的选举中败于奥尔蒂斯，1942年病逝。"
 CBIO_ARG_nimio_de_anquin_desc:0 "1896年8月12日生于科尔多瓦，1979年5月16日卒于同地。全名尼米奥·胡安·曼努埃尔·德安金，阿根廷托马斯主义哲学家、政治理论家兼法西斯运动领袖。他曾赴德国师从恩斯特·卡西尔，是国际知名的亚里士多德与托马斯研究者。作为天主教民族主义者，他猛烈抨击共产主义与自由主义。1929年创办圣托马斯·阿奎那研究所。1930年代他领导法西斯运动：先加入阿根廷法西斯党科尔多瓦支部，1934年起任领袖，将组织改组为\"法西斯力量阵线\"（1935）、再改为\"民族法西斯联盟\"（1936），提出融合托马斯主义与黑格尔主义的\"神本法西斯主义\"。1934年因其运动的暴力，他被停止蒙塞拉特学院的教职。他曾于1941年撰文颂扬希特勒、宣称自由主义与\"丑陋的民主\"已然死亡；其运动至1939年趋于消亡后，他转而支持庇隆主义。学术上，他是国家科学院院士（1940），1947年起在科尔多瓦国立大学执掌数个哲学讲席，并获美因茨大学荣誉博士（1950）。"
 CBIO_ARG_oscar_muratorio_desc:0 "1900年2月28日生于布宜诺斯艾利斯，1977年2月5日卒于同地。全名奥斯卡·爱德华多·胡斯托·穆拉托里奥，阿根廷军人，先属陆军、后属空军，官至空军准将，两度出任航空兵总司令：第一次仅为1945年11月3日至10日（七天），第二次为1946年7月至1951年10月。1919年入国立军事学院（骑兵），1926年取得军事飞行员资格并转入陆军航空。曾任军事航空学校校长（1938–1940）、运输大队队长及民用航空总局局长（1944–1945）。第二任总司令期间，阿根廷空军大量列装作战与教练机，并吸纳了库尔特·坦克等二战后来投的德国航空专家，推动本国航空工业发展。1951年贝尼哈明·门德斯将军政变失败后的清洗中，他退役。"
 CBIO_ARG_osmar_hellmuth_desc:0 "奥斯马尔·阿尔韦托·赫尔穆特，约1908年生、约1976年卒（生卒仅约略），德裔阿根廷人，保险推销员兼海军后备军官，二战期间为德国保安处\"玻利瓦尔行动\"间谍网效力。1943年他经汉斯·哈尼施等牵线，被拉米雷斯政府任命为驻巴塞罗那领事，以此为掩护执行秘密使命：赴德向纳粹保证阿根廷无意与轴心国断交、洽购德国军火，并为一艘滞留瑞典哥德堡的阿根廷油轮争取放行。1943年10月他持外交护照乘\"合恩角号\"启程，途经特立尼达时被早已破译其电讯的英国情报机构逮捕，并在审讯中供出使命、拉米雷斯的许诺及整个间谍网。此案成为美国迫使阿根廷于1944年1月与轴心国断交的关键之一。他后被遣回阿根廷、以\"叛国\"罪受审，监禁一年后获赦；晚年重操保险推销旧业，默默终老。"
 CBIO_ARG_pedro_pablo_ramirez_desc:0 "1884年1月30日生于恩特雷里奥斯省拉巴斯，1962年6月11日卒于布宜诺斯艾利斯。全名佩德罗·巴勃罗·拉米雷斯·门查卡，军人，1904年毕业于国立军事学院，为骑兵专家，1911年至1913年曾在德意志帝国军队受训并带回一位德国妻子。1930年参与乌里武鲁推翻伊里戈延的政变，后赴墨索里尼治下的意大利考察，并参与组织民族主义民兵。1942年获卡斯蒂略任命为陆军部长。1943年6月4日与罗森共同发动推翻卡斯蒂略的政变，三日后于6月7日接任事实总统。他属民族主义、\"中立主义\"的秘密军官团体\"联合军官团\"。任内解散国会与政党、管制新闻、创建阿根廷联邦警察、在学校恢复强制宗教教育，并曾宣称政府的任务是\"复兴民族精神与爱国意识\"。1944年1月迫于美国压力与德、日断交，因而失去民族主义派支持，遭 GOU 逼退；2月以\"疲惫\"为由将职权交予副总统法雷尔，随后退出军界与公共生活。他是首位获颁圣马丁解放者勋章的阿根廷总统。"
 CBIO_ARG_pedro_s_casal_desc:0 "1879年5月13日生于内科切亚，1957年5月2日卒于布宜诺斯艾利斯。全名佩德罗·塞贡多·卡萨尔，阿根廷海军军官。1896年入海军军校，1899年随\"萨米恩托总统号\"帆船作首航。曾在高等战争学院、海军学校与海军机械学校任教，并任后二者校长。1916年他是拉普拉塔鸟类学会（今\"阿根廷鸟类协会\"）的共同创始人之一。他先在戴罗任海军部长期间任海军次长，随后在胡斯托总统任期之初接任海军部长（1932–1933）。查科战争期间，他参与阿根廷对巴拉圭的援助——鉴于外长萨维德拉·拉马斯坚持中立，他曾对巴拉圭大使表示此事须绕开外交部、私下处理。1937年退役后，他仍钻研海洋学与天文学，是国家地理学会与圣马丁国家研究所的创办人之一。"
 CBIO_ARG_ramon_castillo_desc:0 "1873年11月20日生于卡塔马卡省安卡斯蒂，1944年10月12日卒于布宜诺斯艾利斯。全名拉蒙·安东尼奥·卡斯蒂略·巴里奥努埃沃，律师、法官、大学教授，保守的全国民主党人。人们惯称其“拉蒙·S·卡斯蒂略”，但“S”并不代表实际中名；他原本中名为安东尼奥，年轻时为避免签名被误读成女性名，改用 S。1938年作为奥尔蒂斯的竞选搭档当选副总统；1940年因奥尔蒂斯病重而代行总统职权，1942年奥尔蒂斯辞职后正式就任总统，任期至1943年，是\"无耻十年\"的最后一任总统。任内延续选举舞弊、亲近保守势力，二战中坚持中立、维持对德关系，招致美英不满。1943年他试图扶植保守派罗武斯蒂亚诺·帕特龙·科斯塔斯为继任者，引发\"1943年革命\"军事政变，被推翻并一度遭拘押，1944年去世。"
 CBIO_ARG_raul_prebisch_desc:0 "劳尔·普雷维什，1901年4月17日生于图库曼，1986年4月卒于智利圣地亚哥。20世纪最具影响力的拉美经济学家之一。他毕业于布宜诺斯艾利斯大学，并长期在该校任政治经济学教授（1923–1948）。1930年至1943年供职于公共部门，曾任财政副部长，并为杜奥与费德里科·皮内多等部长出谋划策；1935年他是阿根廷中央银行的创建者之一并出任首任总经理，直至1943年被庇隆免职。1948年后他投身联合国拉丁美洲经济委员会，1950年至1963年任执行秘书，提出著名的\"中心—外围\"理论与结构主义发展经济学，指出国际分工使拉美沦为向工业中心供应初级产品的\"外围\"、贸易条件持续恶化。他还是联合国贸易和发展会议的首任秘书长。其思想影响拉美经济政策逾半个世纪；他既曾为1955年军政府开具经济诊断，也在1984年回国辅佐阿方辛政府。"
 CBIO_ARG_roberto_maria_ortiz_desc:0 "1886年9月24日生于布宜诺斯艾利斯，1942年7月15日卒于同地。全名海梅·赫拉尔多·罗伯托·马塞利诺·马利亚·奥尔蒂斯，律师，巴斯克移民后裔，属激进公民联盟反个人主义派。曾任国会议员、阿尔韦亚尔政府的公共工程部长（1925–1928）与财政部长（1935–1937）。1937年在被视为阿根廷史上最舞弊的选举之一中当选总统，1938年就任。虽经舞弊上台，他却力图肃清选举欺诈、恢复干净选举，为此不惜与保守派盟友冲突，曾干预布宜诺斯艾利斯省、赶走有\"土制墨索里尼\"之称的省长曼努埃尔·弗雷斯科。因罹患严重糖尿病几近失明，1940年7月将职权交予副总统卡斯蒂略；美国总统罗斯福曾派著名眼科医生卡斯特罗维霍前来为其诊治。1942年正式辞职，同年病逝。二战中他在贸易上倾向英国。"
 CBIO_ARG_rodolfo_ghioldi_desc:0 "1897年1月21日生于布宜诺斯艾利斯，1985年7月3日卒于同地。全名罗多尔福·何塞·吉奥尔迪，教师、记者与政治家，出身一个意大利加里波第派社会主义移民家庭，是社会主义领袖阿梅里科·吉奥尔迪之弟。1918年参与创建阿根廷共产党（初名国际社会党），为其创始成员与早期总书记之一，长期与维克托里奥·科多维利亚共同主导阿根廷共产主义运动。曾任共产国际南美书记处代表；据其党内追述，他在共产国际第三次代表大会期间于莫斯科与列宁有过短暂交谈。1935年受共产国际派遣参加巴西反对瓦加斯政府的武装起义，失败后于1936年在里约被捕，遭酷刑并被囚禁于费尔南多-迪诺罗尼亚岛四年余，1940年获释返阿。政治上严格追随苏联路线，公开谴责托洛茨基。1951年遭遇刺受伤，1957年当选制宪会议代表。晚年多从事新闻与史学工作，获苏联多项勋章。"
 CBIO_ARG_segundo_storni_desc:0 "1876年7月16日生于图库曼，1954年12月4日卒。全名塞贡多·罗萨·斯托尔尼，阿根廷海军中将、地缘政治思想家。1894年毕业于海军军校。1916年他发表两场影响深远的演讲，后结集为《海洋中的阿根廷利益》一书，创立了主张阿根廷对其大陆架及全部资源享有权利的学说——其生日7月16日今被定为\"阿根廷海洋利益日\"。他是马德普拉塔阿根廷海洋学研究所与布宜诺斯艾利斯国家科学院（1935）的共同创始人，并曾任海军总参谋长。1943年\"1943年革命\"后，他出任拉米雷斯政府外交部长。作为民族主义者却亲同盟国，他主张阿根廷参战：1943年8月5日致函美国国务卿科德尔·赫尔，表明阿根廷有意与轴心国断交、但请对方耐心并在军援上有所表示。赫尔为施压而公开此信、并严词质疑阿根廷的\"中立主义\"，反激起军中反美情绪，导致斯托尔尼于9月辞职，由中立派的吉尔伯特接任。"
 CBIO_ARG_senor_hitler_desc:0 "彩蛋人物“希尔特先生”出自巨蟒剧团1970年《飞行马戏团》第12集短剧《希尔特先生与北明尼黑德补选》。短剧设定希特勒化名“希尔特先生”，与化名“宾姆勒”的希姆莱、化名“维本特罗普”的里宾特洛甫隐居英国明尼黑德一家旅馆，伪装拙劣却仍无人识破，并以“国家社会党”候选人身份参加地方补选。该人物并非真实阿根廷历史人物，而是游戏特殊路径中的喜剧彩蛋。"
 CBIO_ARG_victorio_codovilla_desc:0 "维克托里奥·科多维拉，1894年2月8日生于意大利奥托比亚诺，1970年4月15日卒于莫斯科。意大利裔阿根廷共产主义领袖，党内外常以绰号“胖子”称之。1912年移民阿根廷，参与创建阿根廷国际社会党，后成为阿根廷共产党中央委员会和政治局成员。1920年代任共产国际南美局书记，1932年以化名“路易斯·梅迪纳”赴西班牙指导共产党活动，内战期间继续留驻马德里。1941年返阿后任阿共总书记、主席，坚决反对庇隆主义，1943年曾遭监禁。1969年获苏联十月革命勋章，逝世后葬于莫斯科新圣女公墓。"
 CBIO_ARG_vincente_gallo_desc:0 "1873年10月3日生于图库曼，1942年6月3日卒。全名维森特·卡梅洛·加略，阿根廷律师、学者与政治家，激进公民联盟元老、后转反个人主义派。他自建党之初即加入 UCR，1890年代与伊里戈延一道推动男性普选。萨恩斯·培尼亚法通过后，他于1912年当选众议员，1919年至1923年任布宜诺斯艾利斯首都区参议员。1920年他是极右准军事团体\"阿根廷爱国联盟\"的创始成员之一。1923年阿尔韦亚尔总统任命他为内政部长；1924年他与一批激进党人同伊里戈延决裂、组建反个人主义 UCR。1925年因阿尔韦亚尔不支持其对布宜诺斯艾利斯省实施联邦干预的主张，他辞职。1928年他作为反个人主义派副总统候选人参选，败于伊里戈延。"
