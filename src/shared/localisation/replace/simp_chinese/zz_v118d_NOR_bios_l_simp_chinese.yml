 CBIO_NOR_kirsten_hansteen_desc:0 "原姓穆，1903年1月5日生于特罗姆斯的林恩；女权主义者、共产主义者、反法西斯与和平活动家。幼年丧父，母亲携五名子女迁往奥斯陆。她是编辑与图书馆员、挪威共产党成员。1930年她嫁给律师维戈·汉斯廷——占领初期最早被德军处决的抵抗运动人士之一。占领期间，她主编地下妇女抵抗刊物《妇女阵线》。1945年7月25日至11月5日，她在格哈德森首届内阁任社会事务咨议大臣，成为挪威首位女性内阁成员；1945年任共产党议员。战后她与亨丽埃特·比·洛伦岑创办并合编妇女刊物《妇女与时代》。1974年11月17日去世。"
 NOR_kirsten_hansteen_desc:0 "原姓穆，1903年1月5日生于特罗姆斯的林恩；女权主义者、共产主义者、反法西斯与和平活动家。幼年丧父，母亲携五名子女迁往奥斯陆。她是编辑与图书馆员、挪威共产党成员。1930年她嫁给律师维戈·汉斯廷——占领初期最早被德军处决的抵抗运动人士之一。占领期间，她主编地下妇女抵抗刊物《妇女阵线》。1945年7月25日至11月5日，她在格哈德森首届内阁任社会事务咨议大臣，成为挪威首位女性内阁成员；1945年任共产党议员。战后她与亨丽埃特·比·洛伦岑创办并合编妇女刊物《妇女与时代》。1974年11月17日去世。"
 CBIO_NOR_peder_anker_wedel_jarlsberg_desc:0 "1875年8月18日生于西福尔的塞姆，是贵族、陆军军官（少校）、庄园主与宫廷侍臣，出身持有耶尔斯贝格庄园的韦德尔-亚尔斯贝格伯爵家族。他1897年毕业为军官，1913年任国王副官，1925年任侍从，1927年任次席宫廷礼仪官，1931年起出任哈康七世的宫廷大臣直至1945年，逾三十年为国王最亲信者之一。二战德军入侵时，他协助玛尔塔王储妃携三名子女出逃，经瑞典、芬兰佩琴加转赴美国（1940年8月抵纽约），在美担任王储妃的参谋长，支持其争取盟国援助的活动。1945年他获颁圣奥拉夫大十字勋章，1946年继其兄成为家族族长与世袭伯爵（世袭伯爵，丹挪贵族最高等级），1954年10月13日去世。"
 NOR_peder_anker_wedel_jarlsberg_desc:0 "1875年8月18日生于西福尔的塞姆，是贵族、陆军军官（少校）、庄园主与宫廷侍臣，出身持有耶尔斯贝格庄园的韦德尔-亚尔斯贝格伯爵家族。他1897年毕业为军官，1913年任国王副官，1925年任侍从，1927年任次席宫廷礼仪官，1931年起出任哈康七世的宫廷大臣直至1945年，逾三十年为国王最亲信者之一。二战德军入侵时，他协助玛尔塔王储妃携三名子女出逃，经瑞典、芬兰佩琴加转赴美国（1940年8月抵纽约），在美担任王储妃的参谋长，支持其争取盟国援助的活动。1945年他获颁圣奥拉夫大十字勋章，1946年继其兄成为家族族长与世袭伯爵（世袭伯爵，丹挪贵族最高等级），1954年10月13日去世。"
 CBIO_NOR_king_haakon_vii_desc:0 "1872年8月3日生于哥本哈根附近的夏洛滕伦宫，原名丹麦卡尔王子，是丹麦王储弗雷德里克（后为弗雷德里克八世）的次子，母系出自瑞典王室。他受海军教育、曾服役于丹麦皇家海军。1905年挪威-瑞典联盟解体后，他获邀出任挪威王位，坚持先经全民公投（1905年11月约26万票对约7万票赞成君主制），再由议会正式选举，方才即位，取古挪威名“哈康”，成为1387年以来首位独立的挪威君主；王后为莫德（英王爱德华七世之女）。在位期间他恪守立宪君主的礼仪性角色、极少介入党争。1940年4月9日德军入侵，他断然拒绝承认吉斯林政权、宣称宁可退位也不任命吉斯林组阁，随后流亡英国并拒绝退位，成为团结全国抵抗五年占领的精神象征，1945年6月归国。他的个人格言是“一切为了挪威”。1957年9月21日在奥斯陆王宫去世，享年85岁，在位近52年，由独子奥拉夫五世继位。"
 NOR_king_haakon_vii_desc:0 "1872年8月3日生于哥本哈根附近的夏洛滕伦宫，原名丹麦卡尔王子，是丹麦王储弗雷德里克（后为弗雷德里克八世）的次子，母系出自瑞典王室。他受海军教育、曾服役于丹麦皇家海军。1905年挪威-瑞典联盟解体后，他获邀出任挪威王位，坚持先经全民公投（1905年11月约26万票对约7万票赞成君主制），再由议会正式选举，方才即位，取古挪威名“哈康”，成为1387年以来首位独立的挪威君主；王后为莫德（英王爱德华七世之女）。在位期间他恪守立宪君主的礼仪性角色、极少介入党争。1940年4月9日德军入侵，他断然拒绝承认吉斯林政权、宣称宁可退位也不任命吉斯林组阁，随后流亡英国并拒绝退位，成为团结全国抵抗五年占领的精神象征，1945年6月归国。他的个人格言是“一切为了挪威”。1957年9月21日在奥斯陆王宫去世，享年85岁，在位近52年，由独子奥拉夫五世继位。"
 CBIO_NOR_prince_olav_desc:0 "原名亚历山大王子（丹麦亚历山大王子），1903年7月2日生于英国桑德灵厄姆的阿普尔顿庄园，是哈康七世与莫德王后的独子。1905年父亲当选挪威国王后，两岁的他获挪威名“奥拉夫”并成为王储，是中世纪以来首位在挪威长大的王位继承人。1924年毕业于挪威军事学院，后入牛津大学巴利奥尔学院攻读法律与经济；他是出色的运动员，曾在1928年阿姆斯特丹奥运会帆船项目夺得金牌。1929年他迎娶瑞典公主玛尔塔（其表姐妹）。二战期间他坚定支持父亲抵抗德国占领，战役中是军政要员的重要顾问；政府决定流亡时他曾请缨留守却未获准，遂随父赴英，成为流亡政府与国王的关键副手，并多次巡访驻英、加、美的挪威及盟军部队；1944年出任挪威国防总司令，战后主持对德军的解除武装。1957年他继位为奥拉夫五世，因平易近人被誉为“人民国王”，1991年1月17日去世。"
 NOR_prince_olav_desc:0 "原名亚历山大王子（丹麦亚历山大王子），1903年7月2日生于英国桑德灵厄姆的阿普尔顿庄园，是哈康七世与莫德王后的独子。1905年父亲当选挪威国王后，两岁的他获挪威名“奥拉夫”并成为王储，是中世纪以来首位在挪威长大的王位继承人。1924年毕业于挪威军事学院，后入牛津大学巴利奥尔学院攻读法律与经济；他是出色的运动员，曾在1928年阿姆斯特丹奥运会帆船项目夺得金牌。1929年他迎娶瑞典公主玛尔塔（其表姐妹）。二战期间他坚定支持父亲抵抗德国占领，战役中是军政要员的重要顾问；政府决定流亡时他曾请缨留守却未获准，遂随父赴英，成为流亡政府与国王的关键副手，并多次巡访驻英、加、美的挪威及盟军部队；1944年出任挪威国防总司令，战后主持对德军的解除武装。1957年他继位为奥拉夫五世，因平易近人被誉为“人民国王”，1991年1月17日去世。"
 CBIO_NOR_vidkun_quisling_desc:0 "1887年7月18日生于泰勒马克的菲雷斯达尔，父亲是牧师兼族谱学家，他军校成绩优异、军官出身。他早年随探险家南森在1921年苏俄大饥荒中从事救济工作而声名鹊起，曾派驻苏联、并一度代管英国在苏的外交事务（因此获颁英帝国司令勋章）。1931—1933年他在农民党政府任国防大臣，1933年5月17日（挪威宪法日）与约翰·约尔特创建法西斯政党“国民联合党”（国民联合党），自任党魁。国民联合党的选举成绩始终惨淡，从未在议会赢得席位。1940年4月9日德军入侵当日，他经广播宣布政变、自封首相，这是史上首次通过广播发动的政变，但因缺乏民望、且德方另有安排而迅速被搁置，继由特博文出任国家专员。1942年2月1日，他组建经德方批准的傀儡政府、任“部长首相”，与特博文共治，其政权参与了将挪威犹太人遣送死亡营。战后他以叛国罪受审，1945年10月24日被枪决；其姓氏自此成为“叛国者、通敌者”的代名词。"
 NOR_vidkun_quisling_desc:0 "1887年7月18日生于泰勒马克的菲雷斯达尔，父亲是牧师兼族谱学家，他军校成绩优异、军官出身。他早年随探险家南森在1921年苏俄大饥荒中从事救济工作而声名鹊起，曾派驻苏联、并一度代管英国在苏的外交事务（因此获颁英帝国司令勋章）。1931—1933年他在农民党政府任国防大臣，1933年5月17日（挪威宪法日）与约翰·约尔特创建法西斯政党“国民联合党”（国民联合党），自任党魁。国民联合党的选举成绩始终惨淡，从未在议会赢得席位。1940年4月9日德军入侵当日，他经广播宣布政变、自封首相，这是史上首次通过广播发动的政变，但因缺乏民望、且德方另有安排而迅速被搁置，继由特博文出任国家专员。1942年2月1日，他组建经德方批准的傀儡政府、任“部长首相”，与特博文共治，其政权参与了将挪威犹太人遣送死亡营。战后他以叛国罪受审，1945年10月24日被枪决；其姓氏自此成为“叛国者、通敌者”的代名词。"
 CBIO_NOR_josef_terboven_desc:0 "德国纳粹党人，1898年5月23日生于德国埃森，是矿业小地主之子。他一战志愿从军（获铁十字勋章），战后在慕尼黑与弗莱堡修习法律与政治学，1923年加入纳粹党并参与啤酒馆政变；1928年任埃森大区长官，1935年任莱茵省总督。1940年4月24日（挪威战事尚未结束）他即被希特勒任命为挪威国家专员，入住王储的斯考古姆官邸、以挪威议会大厦为总部，作为占领挪威的最高民政统治者只对希特勒负责。他以专横残酷著称，曾在特隆赫姆实施戒严、下令摧毁泰拉沃格村、设立集中营，并借助党卫队与秘密警察镇压抵抗；连戈培尔也在日记中抱怨其“霸凌”手段激化了挪威民心。尽管1942年后由吉斯林出任傀儡“部长首相”，实权始终握于他手。战局逆转后，他在挪威北部推行焦土政策、强制疏散约五万居民。希特勒自杀后，邓尼茨于1945年5月7日将其免职；5月8日德国投降之际，他在斯考古姆的地堡内引爆约50公斤炸药自杀身亡。"
 NOR_josef_terboven_desc:0 "德国纳粹党人，1898年5月23日生于德国埃森，是矿业小地主之子。他一战志愿从军（获铁十字勋章），战后在慕尼黑与弗莱堡修习法律与政治学，1923年加入纳粹党并参与啤酒馆政变；1928年任埃森大区长官，1935年任莱茵省总督。1940年4月24日（挪威战事尚未结束）他即被希特勒任命为挪威国家专员，入住王储的斯考古姆官邸、以挪威议会大厦为总部，作为占领挪威的最高民政统治者只对希特勒负责。他以专横残酷著称，曾在特隆赫姆实施戒严、下令摧毁泰拉沃格村、设立集中营，并借助党卫队与秘密警察镇压抵抗；连戈培尔也在日记中抱怨其“霸凌”手段激化了挪威民心。尽管1942年后由吉斯林出任傀儡“部长首相”，实权始终握于他手。战局逆转后，他在挪威北部推行焦土政策、强制疏散约五万居民。希特勒自杀后，邓尼茨于1945年5月7日将其免职；5月8日德国投降之际，他在斯考古姆的地堡内引爆约50公斤炸药自杀身亡。"
 CBIO_NOR_jonas_lie_desc:0 "1899年12月31日生于克里斯蒂安尼亚，是著名小说家约纳斯·利之孙、作家埃里克·利之子，故有“小约纳斯·利”之称。他一战期间任西线与东线战地记者，1930年代是颇有名气的犯罪小说家兼警界法律官员，曾指挥针对罢工工人的行动。1936年托洛茨基被逐出挪威时，正是由他这名警官押送其乘货轮前往墨西哥。与希姆莱私交甚笃。德军入侵后他曾在福尔达尔参加抵抗、脚部负伤一度被俘；此后他倒向纳粹。1940年他经特博文任命为警察部门的委任国务委员，1941年到1945年任吉斯林政府警察部长，并出任挪威党卫队（挪威党卫队、挪威日耳曼党卫队）首领，一度随武装党卫队上过巴尔干与列宁格勒前线。任内他推动警察纳粹化、组建“国家警察”（国家警察，相当于挪威版盖世太保），对犹太人围捕与遣送（1942年经货轮“多瑙”号送往奥斯威辛）负有责任，力主对警官埃利夫森的死刑判决，并与利佩斯塔一同主持1944年芬马克的强制疏散。1945年5月11日德国战败之际，他在贝鲁姆的斯卡卢姆于被捕前死去，死因不明（尸检未发现自杀证据，一般认为与压力、酗酒与睡眠不足有关）。"
 NOR_jonas_lie_desc:0 "1899年12月31日生于克里斯蒂安尼亚，是著名小说家约纳斯·利之孙、作家埃里克·利之子，故有“小约纳斯·利”之称。他一战期间任西线与东线战地记者，1930年代是颇有名气的犯罪小说家兼警界法律官员，曾指挥针对罢工工人的行动。1936年托洛茨基被逐出挪威时，正是由他这名警官押送其乘货轮前往墨西哥。与希姆莱私交甚笃。德军入侵后他曾在福尔达尔参加抵抗、脚部负伤一度被俘；此后他倒向纳粹。1940年他经特博文任命为警察部门的委任国务委员，1941年到1945年任吉斯林政府警察部长，并出任挪威党卫队（挪威党卫队、挪威日耳曼党卫队）首领，一度随武装党卫队上过巴尔干与列宁格勒前线。任内他推动警察纳粹化、组建“国家警察”（国家警察，相当于挪威版盖世太保），对犹太人围捕与遣送（1942年经货轮“多瑙”号送往奥斯威辛）负有责任，力主对警官埃利夫森的死刑判决，并与利佩斯塔一同主持1944年芬马克的强制疏散。1945年5月11日德国战败之际，他在贝鲁姆的斯卡卢姆于被捕前死去，死因不明（尸检未发现自杀证据，一般认为与压力、酗酒与睡眠不足有关）。"
 CBIO_NOR_axel_aubert_desc:0 "1873年12月11日生于克里斯蒂安尼亚，是化学工程师。他在奥斯陆技术学校起步，后赴柏林攻读工程、1895年在巴塞尔取得化学博士学位，曾任恩格内炸药厂与挪威炸药工业公司经理。1926年他出任挪威海德鲁总裁，任内深化与德国法本公司的产业合作（后者购入海德鲁约四分之一股份）、引进氨合成法使产能大增，并推动在赫勒亚建厂。1940年挪威尚处中立时，法国军方情报就海德鲁在韦莫克电站生产的重水——德国核武计划的关键原料、当时仅韦莫克大量生产——与他接洽，他同意将海德鲁全部现存重水“借”予法国以度战时，并说若德国获胜自己“很可能被枪毙”；一百八十五公斤重水遂被秘密辗转运往法国。他于1941年底卸任总裁、转任董事长直至去世，1928年曾获圣奥拉夫勋章一等骑士。1943年11月，他在视察遭盟军轰炸的尤坎与韦莫克工业及重水设施后不久，于12月16日在奥斯陆去世。"
 NOR_axel_aubert_desc:0 "1873年12月11日生于克里斯蒂安尼亚，是化学工程师。他在奥斯陆技术学校起步，后赴柏林攻读工程、1895年在巴塞尔取得化学博士学位，曾任恩格内炸药厂与挪威炸药工业公司经理。1926年他出任挪威海德鲁总裁，任内深化与德国法本公司的产业合作（后者购入海德鲁约四分之一股份）、引进氨合成法使产能大增，并推动在赫勒亚建厂。1940年挪威尚处中立时，法国军方情报就海德鲁在韦莫克电站生产的重水——德国核武计划的关键原料、当时仅韦莫克大量生产——与他接洽，他同意将海德鲁全部现存重水“借”予法国以度战时，并说若德国获胜自己“很可能被枪毙”；一百八十五公斤重水遂被秘密辗转运往法国。他于1941年底卸任总裁、转任董事长直至去世，1928年曾获圣奥拉夫勋章一等骑士。1943年11月，他在视察遭盟军轰炸的尤坎与韦莫克工业及重水设施后不久，于12月16日在奥斯陆去世。"
 CBIO_NOR_johan_ludwig_mowinckel_desc:0 "1870年10月22日生于卑尔根一个老牌商人家族，是自由党政治家、船业巨头兼慈善家。他早年赴不来梅、伦敦研习航运业务，1898年购入首艘船、逐步建起颇具规模的航运公司，1909年参与创办挪威船东协会。政坛上他自卑尔根自由党起步，曾任卑尔根市长，1906年当选议员，并数度出任议会议长。他1921—22年任贸易大臣、1922年到1923年任外交大臣，并三度出任首相，任内兼掌外交，这几段任期多逢经济与财政危机。1930年他倡议缔结旨在降低关税壁垒的《奥斯陆公约》（挪威、丹麦与比荷卢等国）；1925年起任诺贝尔和平奖委员会委员；1933年任国联理事会主席期间，他力主将苏联乌克兰大饥荒列入议程。他谴责纳粹威胁，1940年德国占领后随流亡政府赴伦敦，1942年赴美主持挪威航运（挪威战时航运管理机构）相关事务，1943年9月30日病逝于纽约。"
 NOR_johan_ludwig_mowinckel_desc:0 "1870年10月22日生于卑尔根一个老牌商人家族，是自由党政治家、船业巨头兼慈善家。他早年赴不来梅、伦敦研习航运业务，1898年购入首艘船、逐步建起颇具规模的航运公司，1909年参与创办挪威船东协会。政坛上他自卑尔根自由党起步，曾任卑尔根市长，1906年当选议员，并数度出任议会议长。他1921—22年任贸易大臣、1922年到1923年任外交大臣，并三度出任首相，任内兼掌外交，这几段任期多逢经济与财政危机。1930年他倡议缔结旨在降低关税壁垒的《奥斯陆公约》（挪威、丹麦与比荷卢等国）；1925年起任诺贝尔和平奖委员会委员；1933年任国联理事会主席期间，他力主将苏联乌克兰大饥荒列入议程。他谴责纳粹威胁，1940年德国占领后随流亡政府赴伦敦，1942年赴美主持挪威航运（挪威战时航运管理机构）相关事务，1943年9月30日病逝于纽约。"
 CBIO_NOR_peder_furubotn_desc:0 "1890年8月29日生于松恩的布雷克附近，是细木工出身的共产党政治家与二战抵抗领袖。他14岁起在卑尔根做细木工、早年即投身工会。1925—1930年他任挪威共产党主席；1930年被共产国际召往莫斯科，在苏联居留至1938年（其间是忠诚的斯大林派），回国后主管挪威共产党西部（卑尔根）的组织。1940年8月，挪威共产党成为首个被德国当局取缔的挪威政党、被迫转入地下；他一度被捕，审讯后获释即转入地下。1941年6月德国进攻苏联、党的实际领导人克里斯蒂安森被捕后，他被推为挪威共产党总书记，并在1941年12月31日的秘密全国会议上确立其“积极斗争路线”。占领期间，他从设于海姆瑟达尔一带的中央营地统筹一个地下抵抗组织，发动各地破坏、情报、交通与地下报刊等活动，使挪威共产党在抵抗运动中扮演重要角色（其武装路线较挪威军事抵抗组织与“祖国阵线”最初的消极姿态更为激进）。战后他任总书记至1947年；1949年在“菲吕博滕清洗”中，他因被指“铁托主义”与民族主义、在莫斯科施压下被开除出党——挪威共产党由此成为1940年代唯一公开分裂的欧洲共产党。此后他被隔绝于党务、笔耕不辍，1975年11月28日卒于奥斯陆。"
