 CBIO_NOR_birger_eriksen_desc:0 "1875年11月17日生于罗弗敦群岛的弗拉克斯塔（今属莫斯克内斯）一个船长之家，是海岸炮兵上校。他12岁即赴克里斯蒂安尼亚求学，1896年毕业于军事学院，历任托恩斯贝格、阿格德内斯、卑尔根诸要塞司令，1931年晋上校，1933年起任奥斯陆峡湾要冲的奥斯卡堡要塞司令。1940年4月9日凌晨，面对率德军第5群溯峡湾北上、却不表明身份也不停船受检的重巡洋舰“布吕歇尔”号，已64岁、距退休仅半年的他下令以两门老式28厘米克虏伯炮（“摩西”“亚伦”）及鱼雷齐射，将这艘搭载了占领挪威政治机构所需人员的旗舰击沉，约千名德军丧生。他留下名言：“要么我获勋章，要么我上军事法庭。开火！”此举使德军海路攻取奥斯陆延迟约12小时，为国王、政府、议会及黄金储备的撤离赢得了宝贵时间。他获颁带剑战争十字勋章等勋赏；战后一度有对其行动的非议，1995年哈拉尔五世为他在奥斯卡堡揭幕塑像。1958年7月16日，他去世。"
