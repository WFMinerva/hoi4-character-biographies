 CBIO_NOR_joakim_lehmkuhl_desc:0 "1895年9月22日生于卑尔根，挪威工程师、实业家与政治家，父亲是前劳工大臣克里斯托弗莱姆库尔，母亲是挪威首位独立首相克里斯蒂安米克尔森的姐妹。1925年，他发起创建右翼反共民族主义组织祖国联盟并任主席至1939年，该运动在1930年前后巅峰时约有十万成员，是战间期挪威规模最大的右翼群众运动，他公开拒斥法西斯为不合挪威传统，坚持立宪君主与议会民主。他自1926年经营工程公司，生产船用无线电，代理通用汽车的制冷技术，1936年起兼任时代征象报董事长。1940年德军入侵后，他携家人乘货轮博玛号逃往美国，同船还载有挪威从奥斯陆抢运出的部分央行黄金储备。在美，他与船东托马斯奥尔森于1941年收购濒临破产的沃特伯里钟表厂，战时生产炸弹与炮弹引信，战后改组为美国时代公司，推出坚固廉价的天美时手表，以标准化大规模生产直击瑞士制表业，他因此被称为钟表业的亨利福特，任总裁兼董事长至1974年。1984年10月15日在巴哈马拿骚去世。"
 NOR_joakim_lehmkuhl_desc:0 "1895年9月22日生于卑尔根，挪威工程师、实业家与政治家，父亲是前劳工大臣克里斯托弗莱姆库尔，母亲是挪威首位独立首相克里斯蒂安米克尔森的姐妹。1925年，他发起创建右翼反共民族主义组织祖国联盟并任主席至1939年，该运动在1930年前后巅峰时约有十万成员，是战间期挪威规模最大的右翼群众运动，他公开拒斥法西斯为不合挪威传统，坚持立宪君主与议会民主。他自1926年经营工程公司，生产船用无线电，代理通用汽车的制冷技术，1936年起兼任时代征象报董事长。1940年德军入侵后，他携家人乘货轮博玛号逃往美国，同船还载有挪威从奥斯陆抢运出的部分央行黄金储备。在美，他与船东托马斯奥尔森于1941年收购濒临破产的沃特伯里钟表厂，战时生产炸弹与炮弹引信，战后改组为美国时代公司，推出坚固廉价的天美时手表，以标准化大规模生产直击瑞士制表业，他因此被称为钟表业的亨利福特，任总裁兼董事长至1974年。1984年10月15日在巴哈马拿骚去世。"
 CBIO_NOR_hans_ystgaard_desc:0 "1882年2月19日生，是工党政治家，1935至1945年任挪威农业大臣，是迄今该职任期最长者。他并非小农，而是工党内少见的大农场主，且入党时间较晚（此前多年是活跃的自由党人）；1935年3月，他从家乡斯帕布新任工党乡长的位置上被擢为农业大臣，这在尼高斯沃尔组阁时是一大意外。他在任十年，包括1940—1945年随流亡政府在伦敦的岁月；新政府上台之初旨在缓解农业危机的“危机协议”（主要由尼高斯沃尔与洪塞德在组阁危机前谈成），即由他这位新农业大臣出面呈交。战前的农业危机在很大程度上是债务危机，而他本人在1920年前的乐观年代曾大举投资、并为他人作保，价格暴跌后深受其累，故对此感同身受。他还两度出任斯帕布乡长，1953年11月25日去世。"
 NOR_hans_ystgaard_desc:0 "1882年2月19日生，是工党政治家，1935至1945年任挪威农业大臣，是迄今该职任期最长者。他并非小农，而是工党内少见的大农场主，且入党时间较晚（此前多年是活跃的自由党人）；1935年3月，他从家乡斯帕布新任工党乡长的位置上被擢为农业大臣，这在尼高斯沃尔组阁时是一大意外。他在任十年，包括1940—1945年随流亡政府在伦敦的岁月；新政府上台之初旨在缓解农业危机的“危机协议”（主要由尼高斯沃尔与洪塞德在组阁危机前谈成），即由他这位新农业大臣出面呈交。战前的农业危机在很大程度上是债务危机，而他本人在1920年前的乐观年代曾大举投资、并为他人作保，价格暴跌后深受其累，故对此感同身受。他还两度出任斯帕布乡长，1953年11月25日去世。"
 CBIO_NOR_carl_gustav_fleischer_desc:0 "1883年12月28日生于今属特伦德拉格奥菲尤尔一带的比约讷尔一个牧师家庭，父亲早逝后他随母在特隆赫姆长大，家风虔诚而俭朴。他1905年以军校次名毕业，1917年任上尉，曾任第六师参谋，驻北挪威期间勤于撰写军事手册，1939年1月16日晋少将，任第六师师长，1940年1月经御令定为战时北挪威总司令。1940年4月9日德军入侵时他正在芬马克的瓦德瑟巡视，冒暴风雪飞抵特罗姆瑟后下令北挪威总动员。他指挥第六师协调挪法波英军，于5月28日夺回纳尔维克，这是二战盟军首场陆战大捷，也是希特勒的首次战场受挫，但盟军因法国战局于6月初撤离，挪威本土随之投降，德军6月9日再占纳尔维克。他奉命随哈康七世与政府流亡英国，出任流亡陆军总司令，在苏格兰组建挪威步兵旅，却因刚直不阿而与流亡政府龃龉。1942年政府重设武装力量总司令一职时越过了他，破格擢升坦根汉斯廷，他愤而请辞，旋被外放为驻加拿大挪军司令，又转任驻华盛顿武官，视之为羞辱，1942年12月19日在渥太华开枪自尽。"
 NOR_carl_gustav_fleischer_desc:0 "1883年12月28日生于今属特伦德拉格奥菲尤尔一带的比约讷尔一个牧师家庭，父亲早逝后他随母在特隆赫姆长大，家风虔诚而俭朴。他1905年以军校次名毕业，1917年任上尉，曾任第六师参谋，驻北挪威期间勤于撰写军事手册，1939年1月16日晋少将，任第六师师长，1940年1月经御令定为战时北挪威总司令。1940年4月9日德军入侵时他正在芬马克的瓦德瑟巡视，冒暴风雪飞抵特罗姆瑟后下令北挪威总动员。他指挥第六师协调挪法波英军，于5月28日夺回纳尔维克，这是二战盟军首场陆战大捷，也是希特勒的首次战场受挫，但盟军因法国战局于6月初撤离，挪威本土随之投降，德军6月9日再占纳尔维克。他奉命随哈康七世与政府流亡英国，出任流亡陆军总司令，在苏格兰组建挪威步兵旅，却因刚直不阿而与流亡政府龃龉。1942年政府重设武装力量总司令一职时越过了他，破格擢升坦根汉斯廷，他愤而请辞，旋被外放为驻加拿大挪军司令，又转任驻华盛顿武官，视之为羞辱，1942年12月19日在渥太华开枪自尽。"
 CBIO_NOR_jacob_ager_laurantzon_desc:0 "1878年1月7日生于东部的埃兹贝格，是陆军军官，官至少将。他1898年任军官、就学于挪威军事学院，1903年起任野战炮兵上尉，1926年任总参谋部少校，1929年晋上校、任特隆赫姆团团长。1940年挪威战役中，他任驻特隆赫姆的第5师师长；特隆赫姆很快落入德军之手。1965年9月17日，他在鲁默达尔去世。"
 NOR_jacob_ager_laurantzon_desc:0 "1878年1月7日生于东部的埃兹贝格，是陆军军官，官至少将。他1898年任军官、就学于挪威军事学院，1903年起任野战炮兵上尉，1926年任总参谋部少校，1929年晋上校、任特隆赫姆团团长。1940年挪威战役中，他任驻特隆赫姆的第5师师长；特隆赫姆很快落入德军之手。1965年9月17日，他在鲁默达尔去世。"
 CBIO_NOR_elias_corneliussen_desc:0 "埃利亚斯·科内利乌森，1881年8月3日—1951年4月5日，生于克里斯蒂安尼亚，是皇家海军上将。他1902年从军、1905年起任鱼雷艇艇长，后长期任参谋与教职（国防部海军委员会1909—13、皇家海军学院1913—22等），并曾任哈康七世的副官（1928—31）。1934—37年他任海军参谋部长，1937—1940年任海军参谋长。1940年6月他随国王与政府流亡英国；1941年秋，在迪森因与政府分歧去职后，他晋海军少将、出任挪威海军最高指挥官司令海军上将直至1946年——是二战后期及战后初期挪威海军的最高统帅。任内，他一面扩充海军以投入盟军作战（1941年12月7日主持接收潜艇无畏号），一面主持拟定了战后重组挪威海军的新舰队计划。1945年5月13日，他与王储奥拉夫等一同返回挪威。战后他续任海军司令至1946年退役，并于1946年1月至5月兼任代理国防总司令。他获颁带星圣奥拉夫勋章、英国巴斯勋章司令与法国荣誉军团勋章，1951年4月5日去世。"
 NOR_elias_corneliussen_desc:0 "埃利亚斯·科内利乌森，1881年8月3日—1951年4月5日，生于克里斯蒂安尼亚，是皇家海军上将。他1902年从军、1905年起任鱼雷艇艇长，后长期任参谋与教职（国防部海军委员会1909—13、皇家海军学院1913—22等），并曾任哈康七世的副官（1928—31）。1934—37年他任海军参谋部长，1937—1940年任海军参谋长。1940年6月他随国王与政府流亡英国；1941年秋，在迪森因与政府分歧去职后，他晋海军少将、出任挪威海军最高指挥官司令海军上将直至1946年——是二战后期及战后初期挪威海军的最高统帅。任内，他一面扩充海军以投入盟军作战（1941年12月7日主持接收潜艇无畏号），一面主持拟定了战后重组挪威海军的新舰队计划。1945年5月13日，他与王储奥拉夫等一同返回挪威。战后他续任海军司令至1946年退役，并于1946年1月至5月兼任代理国防总司令。他获颁带星圣奥拉夫勋章、英国巴斯勋章司令与法国荣誉军团勋章，1951年4月5日去世。"
 CBIO_NOR_jacob_von_der_lippe_desc:0 "1872年7月28日生于卑尔根附近的菲尔，是海军将领（少将），出身挪威冯德利珀名门家族——他是主教雅各布·冯德利珀之孙、教长约翰·诺达尔·布伦·冯德利珀之子。1913年他获颁国王金质功绩奖章（时为海军中校）。1916年10月13日，海军航空兵正式建制并划归海军后，他出任其首任正式主任，是挪威海军航空的先驱。1953年5月13日去世。"
 NOR_jacob_von_der_lippe_desc:0 "1872年7月28日生于卑尔根附近的菲尔，是海军将领（少将），出身挪威冯德利珀名门家族——他是主教雅各布·冯德利珀之孙、教长约翰·诺达尔·布伦·冯德利珀之子。1913年他获颁国王金质功绩奖章（时为海军中校）。1916年10月13日，海军航空兵正式建制并划归海军后，他出任其首任正式主任，是挪威海军航空的先驱。1953年5月13日去世。"
 CBIO_NOR_edgar_otto_desc:0 "埃德加·奥托，挪威海军上将，1873年生于海军重镇霍尔滕。1894年从军，逐级晋升，1934年晋海军少将。大半军旅生涯在海军参谋部度过：1911年加入参谋部，1919年及1930年两度出任参谋长，1933年任参谋部主任。1934年升任挪威海军最高指挥官“司令海军上将”——这是1814年至1940年间统辖挪威海军的最高统帅职位。任内，他主持拟定了一套着眼于多年、按部就班稳步扩充的海军建设规划。1938年他卸任、由亨利·迪森接任；其时战云密布，迪森奉命转而尽快强化海军战备，奥托那套渐进式方案遂让位于更为紧迫的应急建设。1952年去世。"
 NOR_edgar_otto_desc:0 "埃德加·奥托，挪威海军上将，1873年生于海军重镇霍尔滕。1894年从军，逐级晋升，1934年晋海军少将。大半军旅生涯在海军参谋部度过：1911年加入参谋部，1919年及1930年两度出任参谋长，1933年任参谋部主任。1934年升任挪威海军最高指挥官“司令海军上将”——这是1814年至1940年间统辖挪威海军的最高统帅职位。任内，他主持拟定了一套着眼于多年、按部就班稳步扩充的海军建设规划。1938年他卸任、由亨利·迪森接任；其时战云密布，迪森奉命转而尽快强化海军战备，奥托那套渐进式方案遂让位于更为紧迫的应急建设。1952年去世。"
 CBIO_NOR_carsten_tank_nielsen_desc:0 "1877年9月16日生于霍尔滕，挪威第一代独立海军潜艇专家的开创者之一。1898年任海军少尉，两年后晋中尉，专攻鱼雷与电气技术，后赴奥匈帝国普拉学习鱼雷战术，1903年任鱼雷艇布林克号艇长，1909至1913年出任挪威海军首艘潜艇科本号艇长，为该国潜艇兵种的奠基人物之一，并曾推动建设挪威海军航空兵。1934年秋晋海军上校，出任辖区自耶伦礁至勒尔维克的第二海防区司令，驻卑尔根，1938年晋少将。1939年秋二战爆发后，他负责西部海岸中立巡逻，并统筹经卑尔根与英国间的护航航运往来，其间处理过多起德国船只借道挪威中立水域的事件，其中最著名的是1940年二月油轮阿尔特马克号事件，他下令多次登船检查方允其出港。1940年四月八日傍晚，根据种种迹象他下令辖区提高戒备，次日凌晨一时德军舰队现身科尔斯峡湾南口，他当即下令布雷，莱勒于要塞随即开火，重创一艘德军武装拖网船，但卑尔根防线终告崩溃，他与陆军第四师师长斯特芬斯当日凌晨即撤往沃斯，随后他将残余海防力量重组为三个防区，凭十七八艘军舰与五六架海军飞机据守西部各大峡湾，一定程度上阻遏了德军深入。1957年8月2日去世。"
