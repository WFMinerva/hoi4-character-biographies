 CBIO_NOR_jeanette_olsen_desc:0 "1873年10月22日生于克里斯蒂安尼亚，是工党、后共产党的编辑与政治家。她早年任斯基恩工党地方妇女支部领袖，1913年起先后担任《豪格松人民报》《北极光报》《前进报》等报的经理或主编，并任特罗姆瑟、纳尔维克市议员；在挪威北部时还参与过自苏俄的走私活动。工党1923年分裂时她加入挪威共产党，1923—28年领导党的妇女书记处、主编妇女刊物《火花》，并任共产国际大会代表。1928年，她因不满该党敌视首届工党（霍恩斯鲁德）政府，与埃米尔·斯坦（小）、舍夫卢等一同退党。1936年她重返共产党，却因公开为流亡挪威的托洛茨基辩护，于三个月后（9月）被开除，遂成为托洛茨基派，主编刊物《十月》（1937年4月—1939年9月）。她还以裁缝为业，1959年9月23日在奥斯陆去世。"
 NOR_jeanette_olsen_desc:0 "1873年10月22日生于克里斯蒂安尼亚，是工党、后共产党的编辑与政治家。她早年任斯基恩工党地方妇女支部领袖，1913年起先后担任《豪格松人民报》《北极光报》《前进报》等报的经理或主编，并任特罗姆瑟、纳尔维克市议员；在挪威北部时还参与过自苏俄的走私活动。工党1923年分裂时她加入挪威共产党，1923—28年领导党的妇女书记处、主编妇女刊物《火花》，并任共产国际大会代表。1928年，她因不满该党敌视首届工党（霍恩斯鲁德）政府，与埃米尔·斯坦（小）、舍夫卢等一同退党。1936年她重返共产党，却因公开为流亡挪威的托洛茨基辩护，于三个月后（9月）被开除，遂成为托洛茨基派，主编刊物《十月》（1937年4月—1939年9月）。她还以裁缝为业，1959年9月23日在奥斯陆去世。"
 CBIO_NOR_lev_trotsky_desc:0 "列夫·达维多维奇·托洛茨基（原姓布龙施泰因），1879年11月7日生于俄国赫尔松省，是俄国革命家、苏联政治家与理论家。他是1905年革命、1917年十月革命与俄国内战的关键人物、红军的组织者；列宁去世后，他在与斯大林的权力斗争中失势，1927年被开除出党，1929年被逐出苏联，先后流亡土耳其、法国。1935年6月至1936年12月，他获挪威工党政府庇护、居于挪威，并在此写成《被背叛的革命》，主张苏联已蜕变为“官僚化的工人国家”。1936年，吉斯林的国民联合党与苏联的压力使其庇护成为选举议题，当年8月挪威纳粹分子闯入其住所，政府旋即将其软禁，并在选举后将其经海路遣往墨西哥。1938年他创建第四国际；1940年8月20日，他在墨西哥城遭斯大林特工以冰镐袭击，次日身亡。"
 NOR_lev_trotsky_desc:0 "列夫·达维多维奇·托洛茨基（原姓布龙施泰因），1879年11月7日生于俄国赫尔松省，是俄国革命家、苏联政治家与理论家。他是1905年革命、1917年十月革命与俄国内战的关键人物、红军的组织者；列宁去世后，他在与斯大林的权力斗争中失势，1927年被开除出党，1929年被逐出苏联，先后流亡土耳其、法国。1935年6月至1936年12月，他获挪威工党政府庇护、居于挪威，并在此写成《被背叛的革命》，主张苏联已蜕变为“官僚化的工人国家”。1936年，吉斯林的国民联合党与苏联的压力使其庇护成为选举议题，当年8月挪威纳粹分子闯入其住所，政府旋即将其软禁，并在选举后将其经海路遣往墨西哥。1938年他创建第四国际；1940年8月20日，他在墨西哥城遭斯大林特工以冰镐袭击，次日身亡。"
 CBIO_NOR_sverre_riisnaes_desc:0 "1897年11月6日生于松恩的维克，是法学家与检察官，后为国民联合党政要、党卫队旗队长（上校）。他在两战之间是重要的公诉人，曾把警犬等新侦查手段引入挪威；1936年闯入托洛茨基住所的挪威纳粹分子（佩尔·伊默斯伦等）一案，正由他任公诉人。他倾慕希特勒，但1940年1月受议会委派调查德国在挪间谍活动时，曾与德国友人断绝往来。占领之初他一度想出逃（因担心本国纳粹因托洛茨基案报复），旋即加入国民联合党。他是1940年9月由特博文任命的十一名委任国务委员之一、主管司法部，1941年获大臣头衔，并为1942年1月31日解散议会、授权吉斯林接管政权的九名签署者之一。任司法大臣期间，他改造法律体系以为纳粹行为背书、批准迫害不合作者；作为日耳曼党卫队的积极鼓吹者，他支持挪威人上东线，1944年初曾提议动员七万五千人。1945年2月国家警察首脑马丁森遇刺后，他力主严厉报复，并被指亲自（据称呈醉态）参与随后的处决。战败之际，他与约纳斯·利、罗格斯塔退守贝鲁姆的斯卡卢姆农场，后不作抵抗投降。战后他因叛国受审，却以精神失常为由中止审判（是否装病至今存疑），1948—1960年住进特隆赫姆的赖特耶尔德特精神病院；1974年移居意大利西西里、后转维也纳，1985年返回奥斯陆，1988年6月21日去世，临终前的一次挪威广播公司采访中他仍表达对吉斯林的钦佩。"
