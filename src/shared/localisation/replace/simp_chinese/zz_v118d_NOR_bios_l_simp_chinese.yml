 CBIO_NOR_trygve_halvdan_lie_desc:0 "1896年7月16日生于克里斯蒂安尼亚一个工人家庭，律师、工党政治家，后成为首任联合国秘书长。父亲是木匠，在他年幼时移居美国便杳无音讯，他随母亲在工人区长大；1919年获奥斯陆大学法学学位，长期任工会法律顾问。1935年就任司法大臣——1936年正是他用两道临时法令先软禁、再将流亡的托洛茨基秘密送往墨西哥；战前他改任供应与航运大臣。1940年德军入侵后，他制定的应急措施把挪威庞大的商船队保全给盟军；政府决定继续在海外抗战后赴英，1940年12月起代理、1941年2月正式出任外交大臣，战时一度还短暂代理首相。1945年他率挪威代表团出席旧金山会议，并主持起草联合国宪章中安理会条款的委员会。1946年2月1日，他作为各方都能接受的折衷人选当选首任联合国秘书长，在纽约白手起家把联合国建立起来（从华尔道夫饭店起步、终获洛克菲勒捐赠的曼哈顿地块），并拓展了秘书长向安理会主动进言的职权；任内他促成苏军撤离伊朗、斡旋克什米尔停火、支持以色列建国。因支持联合国介入朝鲜战争，他招致苏联敌视，1952年辞职。此后他重返挪威政坛，历任奥斯陆和阿克斯胡斯郡长、工业大臣与商业大臣等职，著有《为了和平》。1968年12月30日因心脏病在盖罗去世。"
