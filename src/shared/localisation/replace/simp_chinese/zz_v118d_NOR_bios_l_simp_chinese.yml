 CBIO_NOR_olav_scheflo_desc:0 "1883年9月9日生于斯泰恩谢尔，是共产党政治家兼记者。他1905年起为工党成员，十月革命后力主工党加入共产国际，1920年任共产国际二大挪威代表，1921—1927年任共产国际执委。1923年党分裂时，他随挪威共产党，并任党报《挪威共产报》主编；1924年因反对铁业大罢工中的破坏罢工行为、又因鼓动军事罢工，两度获罪入狱。他在党内属右翼、批评斯大林主义，1928年因反对该党敌视霍恩斯鲁德政府而退党，次年重返工党。托洛茨基1935—36年流亡挪威时，他挺身为其辩护、抵御斯大林派与本国资产阶级的攻讦，但因立场更接近苏联右翼反对派，始终未成真正的托派。他著有自传《挪威历史中的红线》，1943年6月25日卒于奥斯陆的乌勒沃尔。"
 NOR_olav_scheflo_desc:0 "1883年9月9日生于斯泰恩谢尔，是共产党政治家兼记者。他1905年起为工党成员，十月革命后力主工党加入共产国际，1920年任共产国际二大挪威代表，1921—1927年任共产国际执委。1923年党分裂时，他随挪威共产党，并任党报《挪威共产报》主编；1924年因反对铁业大罢工中的破坏罢工行为、又因鼓动军事罢工，两度获罪入狱。他在党内属右翼、批评斯大林主义，1928年因反对该党敌视霍恩斯鲁德政府而退党，次年重返工党。托洛茨基1935—36年流亡挪威时，他挺身为其辩护、抵御斯大林派与本国资产阶级的攻讦，但因立场更接近苏联右翼反对派，始终未成真正的托派。他著有自传《挪威历史中的红线》，1943年6月25日卒于奥斯陆的乌勒沃尔。"
 CBIO_NOR_eivind_heiberg_desc:0 "1870年11月29日生于克里斯蒂安尼亚一个军官家庭，父亲是上校，他在十一个兄弟姐妹中排行第六。1890年他毕业于特隆赫姆技术学校机械专业，同年即入国家铁路机务部门任绘图员，1893年获奖学金赴德国考察铁路车间五周，专攻机车车辆制造，1895年升任部门工程师。1899年出任斯卡博铁路车厢厂厂长，执掌该厂二十五年间使其成长为挪威领先的客车与有轨电车制造商，1911年该厂交付了挪威首辆国产无轨电车。1906年任挪威机械工厂联合会主席，并是该会创始人之一，1907年该会与铁金属工人工会签订了挪威首份集体劳资协议，1907年起任挪威雇主联合会中央执委，1912至1917年出任该会主席，其间还任1914年国家失业委员会委员，并曾任阿克尔乡议员与卫生委员会委员。1924年转任挪威国家铁路总裁直至1938年请辞，同期兼任挪威标准化协会主席至1934年。这段总裁任期十分艰难，二三十年代经济停滞，公共汽车与卡车渐成铁路劲敌，公司连年收入下滑，1924至1933年间收入由一亿零三百万克朗跌至六千四百万克朗，铁路史上首次被迫关停部分线路，新建线路的客流也远不及预期，他因此在这段任内并未留下好名声。1895年11月他迎娶古德伦默勒，育有三子，皆继承父业成为工程师，其侄孙爱德华海贝格后来也在1967至1978年出任国家铁路总裁。他的孙女卡琳嫁给托瓦尔德斯托尔滕贝格，是后来首相延斯斯托尔滕贝格的生母，他因此是这位首相的曾外祖父。1934年他获颁圣奥拉夫勋章司令级，并获瑞典北极星勋章丹麦丹纳勃罗格勋章与芬兰白玫瑰勋章。晚年他饱受哮喘折磨，退休次年即去世，享年六十九岁。"
