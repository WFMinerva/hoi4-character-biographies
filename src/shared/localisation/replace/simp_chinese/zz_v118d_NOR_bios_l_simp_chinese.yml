 CBIO_NOR_adam_egede_nissen_desc:0 "1868年6月29日生于弗罗尔今莱万格一带一个军医家庭，父亲保罗埃格德尼森早年曾投身加里波第领导的意大利解放战争充任随军医生，后驻守莱万格团任军医少校。他生下来就带着一层胎膜，民间视为吉兆，他终生随身携带，深信自己的演说才能系于此物，后由儿子捐赠给挪威民俗博物馆。他1886年毕业于特隆赫姆座堂学校，两年后取得硕士学位，先在诺尔兰任邮局助理，又调至卑尔根任邮务员，本欲攻读法律，却阴差阳错留在卑尔根当了异母兄长邮政局长的秘书，兄长病休后他二十二岁便代理卑尔根邮政局长。1897年他调任瓦尔德邮政局长，瓦尔德地处芬马克东端，是挪威乃至西欧最东的市镇，也是对俄波摩尔贸易的繁荣口岸。1899年他创办报纸芬马肯并长期任主编，1903至1911年任瓦尔德市议员。1900年他首次当选议员，代表自由党，1905年脱离自由党加入工党议会党团，1906年与1909年连续以工党身份连任，1903至1912年任军事委员会委员，1906至1912年当选议院上院议员。早在1901年哥本哈根的一次北欧工人大会上，他便结识了俄国社会民主党人，随即联合基尔克内斯的激进医生太太魏塞尔，在瓦尔德秘密印制俄文社会主义小册子，藏入鲱鱼桶经阿尔汉格尔斯克偷运入俄，他家中也一度是俄国流亡者的避难所，直到一次鲱鱼桶在甲板散落，鱼与小册子一并暴露在众目睽睽之下，连挪威郡长也看见了，查封印刷所并没收印件，此事激起全国各地抗议决议，官司打了一年半才以撤销没收告终。1911年他改任斯塔万格邮政局长，1913年当选市议员，1915至1919年任市长，任内因组织1919年6月声援俄国革命的总罢工而被罚款。俄国十月革命后他转向亲布尔什维克立场，1918年当选工党领导层后即赴苏俄，会见列宁，参与了促成共产国际成立的一次会议，尽管未出席1919年3月的正式成立大会。1923年工党分裂，他随创党一派加入挪威共产党，三十年代是反战运动与苏联之友协会的骨干，1934年起任挪威共产党主席至1946年。1953年4月4日去世。"
