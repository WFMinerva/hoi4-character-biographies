 CBIO_NOR_johan_h_andresen_desc:0 "1888年11月29日生于克里斯蒂安尼亚，是保守党政治家兼实业家，祖父是创立蒂德曼斯烟草王朝的第一代约翰亨利克安德烈森，父亲尼古拉伊安德烈森经营家族企业，他本人是这个烟草世家的第三代。年轻时他曾赴德国莱比锡高等商业学校求学，又在瑞典和挪威的蒂德曼斯工厂及德国烟草业积累实务经验，1911年起任经理，1915年成为合伙人，1923年父亲去世后成为独资业主。1929年他迎娶船东安东弗雷德里克克拉文内斯之女埃娃克拉文内斯，其子日后继承家业。他以进取而富有策略的经营手法，把蒂德曼斯集团打造成两战之间挪威最主要的烟草生产商，并在挪威本土烟草厂联合抵制国际烟草巨头进军本国市场的斗争中扮演主角，当挪威竞争主管机关于1928年裁定这场抵制合法后，英美烟草公司被迫让步，他随即抓住时机于1930年与该公司展开合作，合办挪威英国烟草厂以巩固集团的强势地位。他是两战之间挪威工业界颇具革新精神的企业家之一，率先在集团内引入新技术与现代分销广告手段，使企业保持盈利并奠定其工业领袖地位。他还身兼多家大企业董事，包括弗雷亚巧克力厂与吉尔达纳挪威出版社，并曾任挪威工业联合会副会长和奥斯陆手工业与工业协会会长。1928年他当选保守党议员，1934年出任保守党中央党部主席。他是坚定的国防支持者，毕生致力于加强挪威防务，民族立场鲜明，占领期间因此于1942年被逮捕，在格里尼集中营关押四个月。他交游广阔，深受各阶层各行业各党派挪威名流的敬重，六十大寿时各界为他出版了纪念文集。为人慷慨却生性腼腆，视个人财富为一种责任，资助过众多挪威艺术家与学者，并支持多项文化与慈善事业。曾获颁丹麦丹纳勃罗格骑士勋章司令级与瑞典瓦萨勋章骑士级，1953年10月21日在瑞典去世。"
