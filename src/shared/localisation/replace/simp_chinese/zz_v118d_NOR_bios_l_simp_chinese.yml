 CBIO_NOR_christopher_hornsrud_desc:0 "1859年11月15日生于东部厄夫勒埃克尔一个农家。早年经商，投身自由党地方社团，1880年参与创立布斯克吕自由党协会，1888年创立布斯克吕工人协会，九十年代转向社会主义。1901年他当选工党土地问题委员会委员，主持起草1902年工党首份土地纲领，在公有理论与农民对土地私有的诉求间取得妥协，使工党得以在乡村扎根，此后被称为工党农业纲领之父。1903年他当选工党主席，1906年因党内激进派不满其温和路线而去职，1909年出任莫杜姆乡长。1912年他当选议员，代表布斯克吕的林厄里克选区，连任至1936年，1921至22年任议会党团领袖，1928至34年任议会副议长，长期主持货币债务及斯瓦尔巴群岛等多个议会委员会，1926年起任抵押银行董事，1936年起任董事长。1927年大选工党成为议会第一大党，首选人尼高斯沃尔坚辞组阁，国王遂召见议长汉布罗与副议长霍恩斯鲁德会商，他力陈应由第一大党组阁，并建议国王联络党团领袖马兹森，党内商议时他又力主接受，遂于1928年1月28日受命组建挪威首届工党政府，兼任财政大臣。其施政宣言以工党的终极目标是在挪威建立社会主义制度开篇，招致各党强烈批评，因莫温克尔提出的不信任案获通过，该政府仅历18天即倒台，是挪威史上最短命的政府。1960年12月12日在奥斯陆去世，享年101岁，是挪威最长寿的首相，安葬于莫杜姆海根墓园。时任首相格哈德森在悼词中说，工党之所以比其他社会主义政党更深深扎根于乡村，很大程度要归功于霍恩斯鲁德的立场与努力。"
