 CBIO_NOR_birger_meidell_desc:0 "1882年2月4日生于卑尔根，是精算学教授、挪威科学院院士，后在吉斯林的国民联合党政府中先后任教会与教育大臣、社会事务大臣（1940年9月至1941年9月）。他早年在人寿保险公司与国家养老基金任精算师，1917—24年任奥斯陆市养老基金主管，1923年起任奥斯陆大学精算学教授，同年入选挪威科学院；1928年博洛尼亚、1936年奥斯陆的国际数学家大会均任特邀报告人。1930年代，他曾为国民联合党掌控挪威社会拟定策略，主张以积极的社会政策、加薪与改善劳动条件争取工人归附国家社会主义，同时使工会服从政府；其固执难处的性格妨碍了这些目标。1936年他曾作为国民联合党的次要候选人在阿克斯胡斯参选，未得席位。战后他被判终身苦役，旋即因健康不佳获释，1958年1月29日在奥斯陆去世。"
 NOR_birger_meidell_desc:0 "1882年2月4日生于卑尔根，是精算学教授、挪威科学院院士，后在吉斯林的国民联合党政府中先后任教会与教育大臣、社会事务大臣（1940年9月至1941年9月）。他早年在人寿保险公司与国家养老基金任精算师，1917—24年任奥斯陆市养老基金主管，1923年起任奥斯陆大学精算学教授，同年入选挪威科学院；1928年博洛尼亚、1936年奥斯陆的国际数学家大会均任特邀报告人。1930年代，他曾为国民联合党掌控挪威社会拟定策略，主张以积极的社会政策、加薪与改善劳动条件争取工人归附国家社会主义，同时使工会服从政府；其固执难处的性格妨碍了这些目标。1936年他曾作为国民联合党的次要候选人在阿克斯胡斯参选，未得席位。战后他被判终身苦役，旋即因健康不佳获释，1958年1月29日在奥斯陆去世。"
 CBIO_NOR_ragnar_skancke_desc:0 "1890年11月9日生于阿克斯胡斯的奥斯，是特隆赫姆挪威理工学院的弱电技术教授，挪威皇家科学与文学学会成员，后为国民联合党政要。他1933年加入国民联合党，任南特伦德拉格郡领袖，曾公开表达反民主与反犹言论。1940年4月吉斯林政变中他被任命为劳工大臣，但人在特隆赫姆，拒绝就任，1940年9月25日起，他任教会与教育部委任国务委员，一年后获大臣头衔。任内，他对撤换反对纳粹的主教牧师与教师负全责，1941年2月下令师生参观奥斯陆的希特勒青年团展览，引发占领期首次校园罢课，并查禁反吉斯林作家的书籍，不过他反对将拒不推行新课程的教师流放芬马克，也拖延执行特博文1941年7月将挪威教堂钟运往德国熔铸的命令。他还著有一部关于吉斯林的书。战后，他于1946年被判死刑，最高法院1947年维持原判，尽管包括668名牧师上书在内的多方求情，他仍于1948年8月28日在阿克斯胡斯要塞被枪决，成为挪威史上最后一名被处决者，也是仅有的三名因政治罪叛国被处决的挪威纳粹首要人物之一，另两人为吉斯林与哈格林。"
 NOR_ragnar_skancke_desc:0 "1890年11月9日生于阿克斯胡斯的奥斯，是特隆赫姆挪威理工学院的弱电技术教授，挪威皇家科学与文学学会成员，后为国民联合党政要。他1933年加入国民联合党，任南特伦德拉格郡领袖，曾公开表达反民主与反犹言论。1940年4月吉斯林政变中他被任命为劳工大臣，但人在特隆赫姆，拒绝就任，1940年9月25日起，他任教会与教育部委任国务委员，一年后获大臣头衔。任内，他对撤换反对纳粹的主教牧师与教师负全责，1941年2月下令师生参观奥斯陆的希特勒青年团展览，引发占领期首次校园罢课，并查禁反吉斯林作家的书籍，不过他反对将拒不推行新课程的教师流放芬马克，也拖延执行特博文1941年7月将挪威教堂钟运往德国熔铸的命令。他还著有一部关于吉斯林的书。战后，他于1946年被判死刑，最高法院1947年维持原判，尽管包括668名牧师上书在内的多方求情，他仍于1948年8月28日在阿克斯胡斯要塞被枪决，成为挪威史上最后一名被处决者，也是仅有的三名因政治罪叛国被处决的挪威纳粹首要人物之一，另两人为吉斯林与哈格林。"
 CBIO_NOR_rolf_fuglesang_desc:0 "1909年1月31日生于弗雷德里克斯塔，法学家与国民联合党政治家。他1933年取得法律学位，同年加入国民联合党，自1933年起任党总书记，是吉斯林最忠实最亲近的追随者之一，掌管党务与占领期间迅速膨胀的党组织。1942年2月他入吉斯林政府任国务秘书，同年10月文化大臣林德身亡后，他接任文化与国民启蒙大臣并保留党务职，1943年任文化议会主席。他初被视为温和派，后成泛日耳曼与种族观念的鼓吹者，得希姆莱好感，但作为阁员，他力图维护政府对德方的相对自主，常与特博文冲突，战争末期反被德国人视为国民联合党领导层中的主要对手。1944年1月，他随吉斯林拜见希特勒，并在拉斯滕堡与希姆莱作过一次以调和为主的长谈。战后他于1946年2月受审，以叛国罪被判终身苦役，仅以七名法官中四人主张终身监禁之差免于死刑，1956年获释，此后在奥斯陆做过泥瓦匠与商人，1988年11月25日在奥斯陆去世。"
 NOR_rolf_fuglesang_desc:0 "1909年1月31日生于弗雷德里克斯塔，法学家与国民联合党政治家。他1933年取得法律学位，同年加入国民联合党，自1933年起任党总书记，是吉斯林最忠实最亲近的追随者之一，掌管党务与占领期间迅速膨胀的党组织。1942年2月他入吉斯林政府任国务秘书，同年10月文化大臣林德身亡后，他接任文化与国民启蒙大臣并保留党务职，1943年任文化议会主席。他初被视为温和派，后成泛日耳曼与种族观念的鼓吹者，得希姆莱好感，但作为阁员，他力图维护政府对德方的相对自主，常与特博文冲突，战争末期反被德国人视为国民联合党领导层中的主要对手。1944年1月，他随吉斯林拜见希特勒，并在拉斯滕堡与希姆莱作过一次以调和为主的长谈。战后他于1946年2月受审，以叛国罪被判终身苦役，仅以七名法官中四人主张终身监禁之差免于死刑，1956年获释，此后在奥斯陆做过泥瓦匠与商人，1988年11月25日在奥斯陆去世。"
 CBIO_NOR_eivind_blehr_desc:0 "1881年1月20日生于莱达尔，成长于一个具有民族主义色彩的自由党家庭，父亲奥托布莱尔是前首相，母亲兰迪布莱尔是知名女权运动家，二人皆为挪威女权协会创始成员。1899年通过高中毕业考试，随后攻读法律，1903年取得法学学位。1905年秋起他任职新设立的外交部，主要处理国际法事务，1907年任挪威代表团秘书出席海牙和平会议，1909年任挪威代表团秘书参与哥本哈根仲裁案处理挪威与瑞典的驯鹿放牧争端，1910年克里斯蒂安尼亚斯瓦尔巴会议上他任国际法专家顾问。1933年加入国民联合党，次年即退党，直到1941年才重新入党，同年9月至1942年2月任奥斯陆和阿克斯胡斯郡长。1942年2月吉斯林组阁，他出任贸易与供应大臣，1943年5月改称实业大臣，1944年夏被排挤出内阁，退回郡长旧职直至光复。作为国民联合党的大臣，他被认为是最无所畏惧最我行我素的一位，尤其在面对德国占领当局时，连战后审判他的判决书也承认他对德方立场强硬，为挪威利益出力且不无成效。尽管身居要职，他始终未进入国民联合党的核心圈子，与吉斯林本人关系也颇为疏淡，种族理论对他影响甚微，并非反犹分子，对元首原则也无特别热忱，只是把民族社会主义当作既定框架加以接受，成为该党在挪威建立法西斯领袖国家尝试中的重要参与者。战后清算审判中，他于1946年被判二十年苦役，服刑期满后，他是极少数仍公开活动的前国民联合党要人之一，投身社会平反联盟，为前党员争取权益。1957年7月27日去世。"
