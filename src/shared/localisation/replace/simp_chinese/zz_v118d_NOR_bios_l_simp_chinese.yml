 CBIO_NOR_rasmus_hatledal_desc:0 "1885年2月1日生于西部的斯特林，地形学家与军官。1938年他任上校兼总参谋长。1940年德军入侵前夕，他一再要求“全面、立即动员”，却被国防大臣利居恩贝格压下、拖延。在4月8日至9日夜，面对政府那道被理解为“局部、秘密”的动员令，他违命将首个动员日由4月12日提前至11日，把动员规模由24000人扩至38000人，并将特伦德拉格纳入动员区，但仍未擅自实行全面或公开动员。战后，1945年调查委员会（一九四五年调查委员会）对他的动员努力予以肯定；他1949年获圣奥拉夫勋章司令级，并获瑞典宝剑勋章司令级。1963年7月14日去世。"
 NOR_rasmus_hatledal_desc:0 "1885年2月1日生于西部的斯特林，地形学家与军官。1938年他任上校兼总参谋长。1940年德军入侵前夕，他一再要求“全面、立即动员”，却被国防大臣利居恩贝格压下、拖延。在4月8日至9日夜，面对政府那道被理解为“局部、秘密”的动员令，他违命将首个动员日由4月12日提前至11日，把动员规模由24000人扩至38000人，并将特伦德拉格纳入动员区，但仍未擅自实行全面或公开动员。战后，1945年调查委员会（一九四五年调查委员会）对他的动员努力予以肯定；他1949年获圣奥拉夫勋章司令级，并获瑞典宝剑勋章司令级。1963年7月14日去世。"
 CBIO_NOR_bjorn_christophersen_desc:0 "1900年12月31日生于阿克斯胡斯的谢兹莫，是陆军军官（中将）兼历史学家，父亲曾任谢兹莫乡长与利勒斯特伦的高级检察官。1921年先后就读军事学校与军事学院，1937年起任总参谋部处长。1940年德军入侵时他被俘、同年获释，1941年秋抵达英国。1942年2月晋上校、出任流亡伦敦的挪威武装力量参谋长，隶属国防总司令坦根-汉斯廷。挪威光复后，他任1946年国防委员会秘书长；后以军事史著述知名。1985年6月27日去世。"
 NOR_bjorn_christophersen_desc:0 "1900年12月31日生于阿克斯胡斯的谢兹莫，是陆军军官（中将）兼历史学家，父亲曾任谢兹莫乡长与利勒斯特伦的高级检察官。1921年先后就读军事学校与军事学院，1937年起任总参谋部处长。1940年德军入侵时他被俘、同年获释，1941年秋抵达英国。1942年2月晋上校、出任流亡伦敦的挪威武装力量参谋长，隶属国防总司令坦根-汉斯廷。挪威光复后，他任1946年国防委员会秘书长；后以军事史著述知名。1985年6月27日去世。"
 CBIO_NOR_kristian_laake_desc:0 "1875年4月9日生于阿克斯胡斯的乌伦萨克一个农民家庭，挪威陆军军官，曾任武装力量总司令。他以在1940年4月9日德军入侵后的头两天短暂统率挪威陆军、随即因被政界视为“消极领导”而遭撤换而知名。入侵前夕，他倾向于被动等待政治指令，并主张仅作局部而缓慢的邮寄动员，为此与主张全面公开动员的总参谋长哈特勒达尔发生争执；4月11日他被解职，由奥托·路格接任，他在雷纳与继任者短会后即离开。战后，他曾在吉斯林的审判中出庭作证，讲述吉斯林在入侵后扰乱挪威动员的图谋。1950年8月3日去世。"
 NOR_kristian_laake_desc:0 "1875年4月9日生于阿克斯胡斯的乌伦萨克一个农民家庭，挪威陆军军官，曾任武装力量总司令。他以在1940年4月9日德军入侵后的头两天短暂统率挪威陆军、随即因被政界视为“消极领导”而遭撤换而知名。入侵前夕，他倾向于被动等待政治指令，并主张仅作局部而缓慢的邮寄动员，为此与主张全面公开动员的总参谋长哈特勒达尔发生争执；4月11日他被解职，由奥托·路格接任，他在雷纳与继任者短会后即离开。战后，他曾在吉斯林的审判中出庭作证，讲述吉斯林在入侵后扰乱挪威动员的图谋。1950年8月3日去世。"
 CBIO_NOR_hjalmar_riiser_larsen_desc:0 "1890年6月7日生于克里斯蒂安尼亚一个船长家庭，是航空先驱、极地探险家、军官兼企业家，一般被视为皇家挪威空军的奠基者。他1909年入海军学院，1915年成为新组建的海军航空兵首批飞行员之一，后任海军飞行艇工厂主管。他的极地生涯尤为显赫：1925年任阿蒙森北极飞行的飞行员，1926年任飞艇“挪威”号的导航员（首次飞越极地冰盖由欧抵美）；1928年参与搜寻失踪的诺比莱；1929年起领导拉尔斯·克里斯滕森资助的“挪威”号南极系列考察，测绘大片南极，并于1931年为挪威探获并声索毛德皇后地。1939年裁军中他一度去职、转入民航（经营挪威航空公司）。二战期间他重回海军航空、后随内阁流亡，先赴加拿大任首任“小挪威”训练营司令，1941年赴伦敦，历任海军航空兵总司令、联合空军总司令，1944年任统一后的皇家挪威空军总司令；因战末部下不满等缘由，他于1946年愤然辞去军职。此后他重掌挪威航空公司、并任北欧航空要职；1951年任世界联邦运动主席。1965年6月3日，他在哥本哈根去世。"
 NOR_hjalmar_riiser_larsen_desc:0 "1890年6月7日生于克里斯蒂安尼亚一个船长家庭，是航空先驱、极地探险家、军官兼企业家，一般被视为皇家挪威空军的奠基者。他1909年入海军学院，1915年成为新组建的海军航空兵首批飞行员之一，后任海军飞行艇工厂主管。他的极地生涯尤为显赫：1925年任阿蒙森北极飞行的飞行员，1926年任飞艇“挪威”号的导航员（首次飞越极地冰盖由欧抵美）；1928年参与搜寻失踪的诺比莱；1929年起领导拉尔斯·克里斯滕森资助的“挪威”号南极系列考察，测绘大片南极，并于1931年为挪威探获并声索毛德皇后地。1939年裁军中他一度去职、转入民航（经营挪威航空公司）。二战期间他重回海军航空、后随内阁流亡，先赴加拿大任首任“小挪威”训练营司令，1941年赴伦敦，历任海军航空兵总司令、联合空军总司令，1944年任统一后的皇家挪威空军总司令；因战末部下不满等缘由，他于1946年愤然辞去军职。此后他重掌挪威航空公司、并任北欧航空要职；1951年任世界联邦运动主席。1965年6月3日，他在哥本哈根去世。"
 CBIO_NOR_bjarne_oen_desc:0 "1898年11月6日生于克里斯蒂安尼亚，飞行员、皇家挪威空军中将。他1920年毕业于军事学院、1923年毕业于军事高等学校，并在陆军飞行学校受训、任教。二战爆发时，他任奥斯陆新建的福尔内布机场经理；1940年占领后，他被任命为陆军航空兵临时总监。1940年11月安大略的“小挪威”训练营开办后，他负责监管训练；1941年奥勒·雷斯塔到营后，他转赴伦敦、出任总司令里瑟-拉森的参谋长，1942年晋中校。皇家挪威空军于1944年独立成军；1945年1月他曾赴挪威作解放前的侦察巡视。战后，他任空军司令五年、又主持空军学院三年，1957至1963年任挪威国防参谋长（国防总司令）。1994年9月20日去世。"
 NOR_bjarne_oen_desc:0 "1898年11月6日生于克里斯蒂安尼亚，飞行员、皇家挪威空军中将。他1920年毕业于军事学院、1923年毕业于军事高等学校，并在陆军飞行学校受训、任教。二战爆发时，他任奥斯陆新建的福尔内布机场经理；1940年占领后，他被任命为陆军航空兵临时总监。1940年11月安大略的“小挪威”训练营开办后，他负责监管训练；1941年奥勒·雷斯塔到营后，他转赴伦敦、出任总司令里瑟-拉森的参谋长，1942年晋中校。皇家挪威空军于1944年独立成军；1945年1月他曾赴挪威作解放前的侦察巡视。战后，他任空军司令五年、又主持空军学院三年，1957至1963年任挪威国防参谋长（国防总司令）。1994年9月20日去世。"
 CBIO_NOR_adolf_indrebo_desc:0 "1884年2月7日生于弗尔德，工党政治家，后赴奥斯陆求学定居。1917年任奥斯陆市议员，1929年任奥斯陆市长。1935年工党与农民党达成危机协议，尼高斯沃尔借此受命组阁，他是尼高斯沃尔亲自拟定的首届内阁九名成员之一，自1935年3月20日起出任财政大臣，同年11月15日至12月20日又兼代国防大臣约五周。1936年10月请辞，同年11月由贝格斯维克接任财政部，他本人自此淡出内阁。1942年12月5日去世。"
 NOR_adolf_indrebo_desc:0 "1884年2月7日生于弗尔德，工党政治家，后赴奥斯陆求学定居。1917年任奥斯陆市议员，1929年任奥斯陆市长。1935年工党与农民党达成危机协议，尼高斯沃尔借此受命组阁，他是尼高斯沃尔亲自拟定的首届内阁九名成员之一，自1935年3月20日起出任财政大臣，同年11月15日至12月20日又兼代国防大臣约五周。1936年10月请辞，同年11月由贝格斯维克接任财政部，他本人自此淡出内阁。1942年12月5日去世。"
 CBIO_NOR_halvdan_koht_desc:0 "1873年7月7日生于特罗姆瑟一个较有声望的家庭，历史学家与工党政治家。早年为自由党人，世纪之交转向工党（于1911年正式入党）。他1910至1935年任奥斯陆大学历史教授，著述宏富（尤长于中世纪史），曾任挪威历史学会主席、挪威科学院院长及国际历史学委员会主席，并长期投身和平运动、任诺贝尔委员会顾问与委员。他从未当选议员，却自1935年3月起任尼高斯沃尔政府的外交大臣，前任为莫温克尔；任内他曾劝说工党勿退出国联，外交决策多与首相径自作出。他奉行严格中立直至1940年危机，后因战前及战时的中立政策而广受指责。1940年11月他获准休假、1941年2月正式去职，由特里格弗·李接任。他随后赴加拿大、美国，与在华盛顿的女儿一家同住，战后返挪、重拾学术，写出多部重要著作。1965年12月12日在贝鲁姆去世。"
