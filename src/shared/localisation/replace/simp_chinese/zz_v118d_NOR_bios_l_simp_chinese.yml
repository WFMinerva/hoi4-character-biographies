 CBIO_NOR_henry_diesen_desc:0 "1883年4月3日生于特隆赫姆，是海军军官（少将）。他1903年从军、1905年毕业于海军学院，一战期间在中立的挪威海军服役、1917年晋上尉，1930年任海军水雷学校副职。1937年他任第三海防区（北挪威）司令，1938年继埃德加·奥托出任挪威海军最高指挥官“司令海军上将”，并晋少将。1940年德军入侵后，他于6月10日率挪威军舰“弗里乔夫·南森”号出海，经法罗群岛赴英，挪威海军自此并入盟军作战。1941年8月，他因与政府分歧去职、转赴美国任职至1944年，1945年任西部海军司令部司令。1953年1月，他在博勒去世。"
 NOR_henry_diesen_desc:0 "1883年4月3日生于特隆赫姆，是海军军官（少将）。他1903年从军、1905年毕业于海军学院，一战期间在中立的挪威海军服役、1917年晋上尉，1930年任海军水雷学校副职。1937年他任第三海防区（北挪威）司令，1938年继埃德加·奥托出任挪威海军最高指挥官“司令海军上将”，并晋少将。1940年德军入侵后，他于6月10日率挪威军舰“弗里乔夫·南森”号出海，经法罗群岛赴英，挪威海军自此并入盟军作战。1941年8月，他因与政府分歧去职、转赴美国任职至1944年，1945年任西部海军司令部司令。1953年1月，他在博勒去世。"
 CBIO_NOR_edvard_christian_danielsen_desc:0 "1888年4月14日生于西阿格德尔的曼达尔，成长于航海世家，1906年考入海军学院，1909年毕业，随即选择潜艇方向，1913至1914年赴挪威理工学院深造，自1917年起长期在潜艇部队服役。二战爆发时他任鱼雷艇舰长，德军入侵后经由海路辗转抵达英国，随即投身重建流亡海军，先后出任海军统帅部作战处长，参谋长及副司令，是四十年代推动挪威海军扩充建设的核心人物，1944年参与制定了战后重整海军的舰队规划，主张放弃战前以众多小型舰艇近海防御的思路，转向拥有较大舰只的远洋海军，1942年他还曾牵头组织反对尼高斯沃尔政府的政治异议。1944年他出任北挪威海军司令部司令，成为自由挪威境内首位海军最高长官，1945年一月他亲自率队驰援芬马克瑟罗亚岛遭德军焦土政策围困的居民，二月又主持将其撤离，战后与同行军官合著专书记述此事。战后他历任西部海军司令部司令，代理国防参谋长副手，1949年晋海军中将，出任海军司令，但仅任至1951年夏即与参谋长一同，因海军在北约共同防御框架下仅获边缘任务，尤其未能如愿添置大型水面舰只而愤然辞职，他本人强调此举并非针对北约，而是对国防大臣豪格过度以政治手段掌控军务的不满。晚年他在海斯塔工厂任销售主管，后归隐曼达尔安度晚年，1964年1月30日在故乡去世。"
