 CBIO_NOR_alfred_roscher_lund_desc:0 "1899年2月24日生于克里斯蒂安尼亚，陆军上校情报专家，尤长于密码与信号情报。1935年，他创办了挪威首个密码训练课程，并组建该国第一个信号情报与破译机构，其密码俱乐部多从数学家及一家名为福辛的桥牌俱乐部成员中招募。二战期间他任驻斯德哥尔摩武官，是挪威的首席情报官，与瑞典及盟国情报界往来密切，其价值之高，使丘吉尔于1941年9月亲函首相尼高斯沃尔，请勿将其调离斯德哥尔摩，同年10月他仍奉调赴伦敦，主掌流亡最高统帅部的军事情报处，并为盟军的破译工作含德国鲟鱼密码作出贡献，获英帝国官佐勋章。战后，他任首任联合国秘书长特里格弗李的顾问。他是作家维拉亨里克森之父，1975年10月23日去世。"
 NOR_alfred_roscher_lund_desc:0 "1899年2月24日生于克里斯蒂安尼亚，陆军上校情报专家，尤长于密码与信号情报。1935年，他创办了挪威首个密码训练课程，并组建该国第一个信号情报与破译机构，其密码俱乐部多从数学家及一家名为福辛的桥牌俱乐部成员中招募。二战期间他任驻斯德哥尔摩武官，是挪威的首席情报官，与瑞典及盟国情报界往来密切，其价值之高，使丘吉尔于1941年9月亲函首相尼高斯沃尔，请勿将其调离斯德哥尔摩，同年10月他仍奉调赴伦敦，主掌流亡最高统帅部的军事情报处，并为盟军的破译工作含德国鲟鱼密码作出贡献，获英帝国官佐勋章。战后，他任首任联合国秘书长特里格弗李的顾问。他是作家维拉亨里克森之父，1975年10月23日去世。"
 CBIO_NOR_konrad_sundlo_desc:0 "1881年1月1日生于克里斯蒂安桑，是陆军上校与国民联合党政治家。他1902年毕业于军事学院，1933年加入国民联合党、同年出任驻纳尔维克的第15步兵团团长。1940年4月9日，在德舰击沉挪威海防舰“艾兹沃尔”号与“诺格”号后，他不作抵抗即交出纳尔维克的陆上部队；此前吉斯林曾向希特勒出示其亲德信函，使德方相信纳尔维克不会设防。他因此被师长弗莱舍尔指控叛国。占领期间，1940年任国民国民卫队总指挥，又先后任奥斯陆、阿克斯胡斯及松恩-菲尤拉讷的国民联合党郡长。战后受审时，纳尔维克投降一项被减为“过失”，最高法院基本予以开脱（他自陈以投降使纳尔维克免遭毁灭），但他因占领期间的其他行为被剥夺军衔、判处终身苦役（八名法官中三人主张死刑），1952年获赦。1965年5月25日，他在阿斯克的内瑟亚去世。"
 NOR_konrad_sundlo_desc:0 "1881年1月1日生于克里斯蒂安桑，是陆军上校与国民联合党政治家。他1902年毕业于军事学院，1933年加入国民联合党、同年出任驻纳尔维克的第15步兵团团长。1940年4月9日，在德舰击沉挪威海防舰“艾兹沃尔”号与“诺格”号后，他不作抵抗即交出纳尔维克的陆上部队；此前吉斯林曾向希特勒出示其亲德信函，使德方相信纳尔维克不会设防。他因此被师长弗莱舍尔指控叛国。占领期间，1940年任国民国民卫队总指挥，又先后任奥斯陆、阿克斯胡斯及松恩-菲尤拉讷的国民联合党郡长。战后受审时，纳尔维克投降一项被减为“过失”，最高法院基本予以开脱（他自陈以投降使纳尔维克免遭毁灭），但他因占领期间的其他行为被剥夺军衔、判处终身苦役（八名法官中三人主张死刑），1952年获赦。1965年5月25日，他在阿斯克的内瑟亚去世。"
 CBIO_NOR_oscar_torp_desc:0 "1893年6月8日生于萨尔普斯堡附近的哈夫斯伦，是工党政治家、锯木工人之子。1923年他29岁即当选工党主席，任至1945年，推动了党组织的壮大；他早年是反军国主义者、1924年曾因号召“军事罢工”入狱五个月，1930年代中期起转变立场。他1934年任奥斯陆市长，1935—36年在尼高斯沃尔政府代理国防大臣，1936—39年任社会事务大臣，1939年起任财政大臣。1940年4月德军入侵时，他负责启动了将挪威国家金库成功抢运出境的行动，随后随内阁流亡，途中在翁达尔斯内斯遭空袭伤及脚部，经特罗姆瑟赴英。在伦敦，这位昔日的共和派与国王哈康及王储奥拉夫建立了密切关系，自1941年11月起再度出任国防大臣至1945年，主导了此后成为战后范式的国防现代化。长期流亡使他疏离党务，主席一职战后由代理主席格哈德森正式接任。战后他任供应与重建大臣，1951年出任首相（接替格哈德森、后又交还），1955年起任议会议长直至去世。1958年5月1日去世。"
 NOR_oscar_torp_desc:0 "1893年6月8日生于萨尔普斯堡附近的哈夫斯伦，是工党政治家、锯木工人之子。1923年他29岁即当选工党主席，任至1945年，推动了党组织的壮大；他早年是反军国主义者、1924年曾因号召“军事罢工”入狱五个月，1930年代中期起转变立场。他1934年任奥斯陆市长，1935—36年在尼高斯沃尔政府代理国防大臣，1936—39年任社会事务大臣，1939年起任财政大臣。1940年4月德军入侵时，他负责启动了将挪威国家金库成功抢运出境的行动，随后随内阁流亡，途中在翁达尔斯内斯遭空袭伤及脚部，经特罗姆瑟赴英。在伦敦，这位昔日的共和派与国王哈康及王储奥拉夫建立了密切关系，自1941年11月起再度出任国防大臣至1945年，主导了此后成为战后范式的国防现代化。长期流亡使他疏离党务，主席一职战后由代理主席格哈德森正式接任。战后他任供应与重建大臣，1951年出任首相（接替格哈德森、后又交还），1955年起任议会议长直至去世。1958年5月1日去世。"
 CBIO_NOR_otto_ruge_desc:0 "1882年1月9日生于克里斯蒂安尼亚一个有军事传统的家庭。1905年毕业于军事学院，1915年通过总参谋部考试；1933年任上校兼总参谋长，1938年卸任、改任步兵总监。1940年4月德军入侵后，他晋少将，于4月11日接替态度消极、行将退休的克里斯蒂安·拉克，出任武装力量总司令。他接手的是一支仅部分动员、且各大城市已失、制空权尽丧的军队；其策略是向北迟滞退却、在特隆赫姆以南构筑防线以待盟军反攻，然而盟军的钳形攻势过迟、且离目标过远而未能奏效，其决策后世亦有争议。南挪威沦陷后，他撤往北方、参加纳尔维克之战；盟军因法国战局于6月初撤离后，他留在挪威与德方谈判残余挪军的投降，随即被俘、押往德国关押至战争结束。战后他晋中将、短暂复任总司令，旋与政界不合；他著有1940年战局回忆录《一九四零年战役》，获圣奥拉夫大十字勋章及项链饰。1961年8月15日，在东福尔的霍伊托普要塞去世。"
