 CBIO_NOR_johan_nygaardsvold_desc:0 "挪威近代史上任期最长的首相之一。1879年9月6日生于特隆赫姆附近霍梅尔维克一个佃农家庭，父亲是当地首个工会的创始成员之一，他12岁便进锯木厂做工。1902年移民加拿大、后转美国当劳工（化名约翰·韦斯特比），受“世界产业工人联合会”影响加入工人运动，1907年回国。1916年首次当选议员，连任至1949年；1928年在霍恩斯鲁德内阁任农业大臣，1934—35年任议会议长。1935年3月20日受命组建工党政府任首相，任内推动养老金保险、强制失业保险、工时与劳动保护立法等社会改革。1940年4月9日德军入侵时他在任，拒绝按德方最后通牒让位于吉斯林，率政府于6月7日流亡伦敦，领导流亡政府直至1945年5月31日归国，6月25日辞职、由格哈德森接掌联合政府。战后调查委员会认为他对备战不足难辞其咎，但肯定其领导流亡团结政府之功。他民望极高，时人昵称“老头子”，1952年3月13日因癌症病逝于特隆赫姆。"
 NOR_johan_nygaardsvold_desc:0 "挪威近代史上任期最长的首相之一。1879年9月6日生于特隆赫姆附近霍梅尔维克一个佃农家庭，父亲是当地首个工会的创始成员之一，他12岁便进锯木厂做工。1902年移民加拿大、后转美国当劳工（化名约翰·韦斯特比），受“世界产业工人联合会”影响加入工人运动，1907年回国。1916年首次当选议员，连任至1949年；1928年在霍恩斯鲁德内阁任农业大臣，1934—35年任议会议长。1935年3月20日受命组建工党政府任首相，任内推动养老金保险、强制失业保险、工时与劳动保护立法等社会改革。1940年4月9日德军入侵时他在任，拒绝按德方最后通牒让位于吉斯林，率政府于6月7日流亡伦敦，领导流亡政府直至1945年5月31日归国，6月25日辞职、由格哈德森接掌联合政府。战后调查委员会认为他对备战不足难辞其咎，但肯定其领导流亡团结政府之功。他民望极高，时人昵称“老头子”，1952年3月13日因癌症病逝于特隆赫姆。"
 CBIO_NOR_martin_tranmael_desc:0 "1879年6月27日生于梅尔胡斯一个农家，父亲因酗酒失去农场，令他终生滴酒不沾。他油漆工出身，两度赴美做工（1901年适逢旧金山码头大罢工），深受美国劳工运动与世界产业工人联合会影响。回国后成为工党左翼核心，担任“1911年工会反对派”领袖，主张“一个大工会”；1918年带领革命派夺取党的领导权，一度加入共产国际；1923年因与季诺维也夫冲突而带领工党退出共产国际，导致挪威共产党分裂另立。1921年任党报《工人报》主编，自1906至1963年长踞党中央执委达五十七年。他从未出任首相或入阁，却被公认为1918年至二战间挪威最重要的劳工领袖，人称“特拉梅尔主义”主导劳工运动十余年；曾因鼓动军事罢工入狱数月。二战期间流亡斯德哥尔摩，战后立场转趋温和，支持挪威1949年加入北约。1967年7月1日去世。"
