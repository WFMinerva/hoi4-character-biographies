 CBIO_NOR_wilhelm_von_tangen_hansteen_desc:0 "1896年5月11日生于克里斯蒂安尼亚，挪威陆军军官。1919年毕业于陆军军官学校，1937年任驻赫尔辛基武官，任内力促挪威在冬季战争中援助芬兰。1942年，他由少校破格直升少将，出任流亡中的挪威武装力量总司令——这一任命越过了纳尔维克功臣弗莱舍尔，致后者愤而请辞。他任此职至1944年，王储奥拉夫接任总司令后，他改任副司令直至战争结束。战后，他历任驻德挪军司令、陆军司令与驻挪北约部队司令，1966年退役，1980年9月6日在故乡奥斯陆去世。"
 NOR_wilhelm_von_tangen_hansteen_desc:0 "1896年5月11日生于克里斯蒂安尼亚，挪威陆军军官。1919年毕业于陆军军官学校，1937年任驻赫尔辛基武官，任内力促挪威在冬季战争中援助芬兰。1942年，他由少校破格直升少将，出任流亡中的挪威武装力量总司令——这一任命越过了纳尔维克功臣弗莱舍尔，致后者愤而请辞。他任此职至1944年，王储奥拉夫接任总司令后，他改任副司令直至战争结束。战后，他历任驻德挪军司令、陆军司令与驻挪北约部队司令，1966年退役，1980年9月6日在故乡奥斯陆去世。"
 CBIO_NOR_jacob_hivden_haug_desc:0 "1880年1月14日生于克里斯蒂安尼亚，挪威陆军少将，挪威共济会总导师。1900年任军官，历任野战炮兵军官、总参谋部少校与上校团长，1923年任哈康七世的副官；1936年起任驻奥斯陆的第2师师长，兼阿克斯胡斯要塞司令。1940年战役中，他率第2师在默萨湖两岸作战，并与英军协同在古德布兰河谷且战且退、经罗姆斯达尔撤离，这是他军旅生涯的最后一役；其子雅各布（生于1909年）于1940年4月16日在伦讷的米拉作为士兵阵亡。他因战时功绩获颁带橡枝的圣奥拉夫奖章，1961年6月2日去世。"
 NOR_jacob_hivden_haug_desc:0 "1880年1月14日生于克里斯蒂安尼亚，挪威陆军少将，挪威共济会总导师。1900年任军官，历任野战炮兵军官、总参谋部少校与上校团长，1923年任哈康七世的副官；1936年起任驻奥斯陆的第2师师长，兼阿克斯胡斯要塞司令。1940年战役中，他率第2师在默萨湖两岸作战，并与英军协同在古德布兰河谷且战且退、经罗姆斯达尔撤离，这是他军旅生涯的最后一役；其子雅各布（生于1909年）于1940年4月16日在伦讷的米拉作为士兵阵亡。他因战时功绩获颁带橡枝的圣奥拉夫奖章，1961年6月2日去世。"
 CBIO_NOR_skule_storheil_desc:0 "1907年8月17日生于布伦讷伊松，是海军军官，以二战期间在英国皇家海军框架下指挥挪威军舰而知名，并获挪威最高军功勋章“带剑战争十字勋章”。他早年在商船队服务，后入霍尔滕的海军学院，1928年任军官。1940年6月，他作为挪方联络官登上重巡洋舰“德文郡”号，护送哈康七世与政府阁员自特罗姆瑟赴英以续抗争。此后他先后指挥租借驱逐舰“圣奥尔本斯”号，并自1943年8月起主动降衔指挥驱逐舰“斯托德”号：该舰为开往苏联的北极航运护航，并参加了1943年12月26日击沉德国战列舰沙恩霍斯特的北角海战——他曾把军舰驶至距沙恩霍斯特约400码处才发射鱼雷；1944年6月，他又随“斯托德”号参加诺曼底登陆。战后，他历任海军参谋长、海军司令，1951年晋中将，1992年11月25日去世。"
 NOR_skule_storheil_desc:0 "1907年8月17日生于布伦讷伊松，是海军军官，以二战期间在英国皇家海军框架下指挥挪威军舰而知名，并获挪威最高军功勋章“带剑战争十字勋章”。他早年在商船队服务，后入霍尔滕的海军学院，1928年任军官。1940年6月，他作为挪方联络官登上重巡洋舰“德文郡”号，护送哈康七世与政府阁员自特罗姆瑟赴英以续抗争。此后他先后指挥租借驱逐舰“圣奥尔本斯”号，并自1943年8月起主动降衔指挥驱逐舰“斯托德”号：该舰为开往苏联的北极航运护航，并参加了1943年12月26日击沉德国战列舰沙恩霍斯特的北角海战——他曾把军舰驶至距沙恩霍斯特约400码处才发射鱼雷；1944年6月，他又随“斯托德”号参加诺曼底登陆。战后，他历任海军参谋长、海军司令，1951年晋中将，1992年11月25日去世。"
 CBIO_NOR_ole_reistad_desc:0 "1898年6月26日生于阿克，是空军军官、飞行员兼全能运动员。1921年毕业于军事学院，入陆军飞行学校，后任教官与试飞员。曾参加1920年安特卫普奥运会，在现代五项项目中获得第14名、1922年获该项目挪威冠军，并在1928年圣莫里茨冬奥会的军事滑雪巡逻（表演项目）中夺冠、担任挪威代表团开幕式旗手；1935年任挪威航空俱乐部主席。1940年德军入侵时，他任空军临时指挥官，于巴尔杜福斯组织对德空防，后被迫复员。他先赴芬兰、再转加拿大，志愿加入流亡空军，出任训练营“小挪威”司令、晋至中校，并曾拟定收复被占挪威的计划。战后他任北方空军司令，虽历经艰难的脑瘤手术而留下残障；临终前哈康国王授予他带星圣奥拉夫勋章司令级。1949年12月22日，他在奥斯陆去世，年仅51岁。"
 NOR_ole_reistad_desc:0 "1898年6月26日生于阿克，是空军军官、飞行员兼全能运动员。1921年毕业于军事学院，入陆军飞行学校，后任教官与试飞员。曾参加1920年安特卫普奥运会，在现代五项项目中获得第14名、1922年获该项目挪威冠军，并在1928年圣莫里茨冬奥会的军事滑雪巡逻（表演项目）中夺冠、担任挪威代表团开幕式旗手；1935年任挪威航空俱乐部主席。1940年德军入侵时，他任空军临时指挥官，于巴尔杜福斯组织对德空防，后被迫复员。他先赴芬兰、再转加拿大，志愿加入流亡空军，出任训练营“小挪威”司令、晋至中校，并曾拟定收复被占挪威的计划。战后他任北方空军司令，虽历经艰难的脑瘤手术而留下残障；临终前哈康国王授予他带星圣奥拉夫勋章司令级。1949年12月22日，他在奥斯陆去世，年仅51岁。"
 CBIO_NOR_tryggve_gran_desc:0 "1888年1月20日生于卑尔根一个造船业富商家庭，是飞行家、极地探险家兼作家。1910年毕业于皇家海军学院，经南森推荐加入斯科特1910年南极“新地”探险队任滑雪教练，并是发现斯科特遗体帐篷的搜索队成员之一，获国王乔治五世颁极地奖章。1914年7月30日，他驾布莱里奥单翼机自苏格兰克鲁登湾飞抵挪威，成为首个飞越北海之人，数日后一战爆发。他随即志愿加入英国皇家飞行队（因挪威中立被拒后，化名“加拿大人特迪·格兰特”入伍），在西线执行夜间轰炸，获军功十字勋章，并自称曾在空战中击落戈林。二战期间他加入吉斯林的国民联合党，其英雄声望被纳粹用于宣传（1944年发行了纪念其北海飞行30周年的邮票），他还组织了后来并入国民联合党的“国民卫队飞行队”。1948年，他因叛国受审、被判18个月监禁，声誉受损；此后余生多讲述斯科特探险。1980年1月8日，他在格里姆斯塔去世，享年91岁。"
