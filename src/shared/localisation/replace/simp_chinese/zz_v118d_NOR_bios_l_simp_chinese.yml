 CBIO_NOR_birger_ljungberg_desc:0 "1884年6月7日出生，1906年从军。早年曾请假远赴阿根廷参与探险，为当地印第安人组织领地，此后长期在军官学校任教，并两度出任校长，后又担任东福尔步兵团兼弗雷德里克斯塔卫戍司令，1937年晋上校，1924至1927年曾任哈康国王副官。1939年底，国防大臣蒙森因病去职，时任首相尼高斯沃尔选定这位保守党出身的职业军人，以安抚资产阶级政党与军官团对工党国防政策的疑虑。他为人和蔼周到，为政却较为被动，加之首相叮嘱他只需专注军务，毋须过问政局，因此在入侵前夕关键的动员决策上未能力争到底，致使本应全面公开的动员令，实际以秘密，且经邮寄下达的方式发出，严重延误了动员进度。政府流亡伦敦后，他因表现软弱备受国内外压力，1941年11月被派往美国，实为去职前奏，1942年3月正式解除职务，此后在美国与加拿大任武官，直至战争结束。他1946年退出现役，1949年荣退，曾获丹麦丹纳勃罗格骑士勋章与芬兰白玫瑰勋章，并任奥斯陆军事协会主席。1967年4月20日，在弗雷德里克斯塔去世。"
