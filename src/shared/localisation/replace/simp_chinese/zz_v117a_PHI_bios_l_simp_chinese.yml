l_simp_chinese:
 CBIO_PHI_manuel_luis_quezon_desc:0 "曼努埃尔·路易斯·奎松·莫利纳，1878年8月19日—1944年8月1日，生于奥罗拉省巴莱尔，菲律宾自治领首任总统。1916年任参议院议长，长期主持独立立法谈判。1935年当选自治领首任总统，聘麦克阿瑟筹建国防军。1941年12月太平洋战争爆发后随美菲联军撤入巴丹、科雷希多，1942年辗转澳大利亚、美国建立流亡政府。1944年8月1日因肺结核病逝于纽约萨拉纳克莱克，未能见到菲律宾光复。奎松城即以其名命名。"
 CBIO_PHI_jose_laurel_desc:0 "何塞·帕西亚诺·劳雷尔·加西亚，1891年3月9日—1959年11月6日，生于八打雁省塔瑙安，菲律宾律师、政治家。1915年获菲律宾大学法学学位，1920年获耶鲁大学法学博士。1925年当选参议员，1936年任最高法院陪席大法官。太平洋战争爆发后他留守马尼拉，在日军占领当局下历任司法专员、内务部长等职；1943年10月14日就任日本扶植的“第二共和国”总统。任内他曾两度遭游击队枪击未死，1944年9月宣布菲律宾与美英处于战争状态。1945年撤往日本，8月17日宣布解散第二共和国。战后被起诉132项通敌罪，1948年获罗哈斯大赦，后当选参议员，1949年竞选总统败于季里诺，1955年主持达成《劳雷尔-兰利协定》。1959年在马尼拉逝世，1960年代起被追认列入历任总统名录。"
 CBIO_PHI_manuel_roxas_desc:0 "曼努埃尔·罗哈斯，1892年1月1日—1948年4月15日，生于西内格罗斯省卡皮兹，菲律宾自治领末任及独立后首任总统。1922年当选国会议长，是纳西奥纳利斯塔党内重要领袖。日军占领期间他在劳雷尔政府任经济计划委员会主席，负责为日军征集粮食物资，同时与麦克阿瑟方面暗中保持联系。战后未被追究通敌指控，1946年当选首任独立总统，并颁布大赦令赦免劳雷尔等官员。任内推动《贝尔贸易法》及美菲军事基地协定。1948年4月15日在克拉克空军基地演讲时猝逝。"
 CBIO_PHI_pedro_abad_santos_desc:0 "佩德罗·阿瓦德·桑托斯·巴斯科，1876年1月31日—1945年1月15日，生于邦板牙省圣费尔南多富裕家庭，菲律宾马克思主义政治家，是首席大法官何塞·阿瓦德·桑托斯之兄。1906年通过律师考试后长期为佃农、工人提供免费法律服务。1916至1922年任众议员，1926年退出体制内政治后赴莫斯科列宁学院学习。1932年他创建菲律宾社会党，1938年该党与埃万赫利斯塔的菲共合并，他出任副主席。1941年他曾参选总统后退选。1942年1月他被日军逮捕，后获释返回邦板牙潜入胡克军根据地，继续担任精神导师。1945年1月15日因胃溃疡并发症病逝于胡克军营地。"
 CBIO_PHI_emilio_aguinaldo_desc:0 "埃米利奥·阿基纳多·法米，1869年3月22日—1964年2月6日，生于甲米地省卡威特，绰号“米翁”。早年任卡威特维霍镇长及当地卡蒂普南领袖。菲律宾革命中他崛起为革命军统帅，1897年德黑罗斯会议取得领导权，期间下令逮捕并处死安德烈斯·博尼法西奥，后又涉及安东尼奥·卢纳之死。1898年6月12日他在卡威特宣布菲律宾独立；1899年就任第一共和国首任总统。他先后领导对西班牙、对美战争，1901年被俘后宣誓效忠美国。1935年参选自治领总统大败于奎松。二战日占期间与日方合作、曾广播劝美军投降；战后一度被捕旋即获释。1964年因心脏病病逝于奎松城，享年94岁。"
 CBIO_PHI_cristanto_evangelista_desc:0 "克里桑托·阿巴尼奥·埃万赫利斯塔，1888年11月1日—1942年6月2日，生于布拉干省梅考阿延，菲律宾共产党主要创建者、首任总书记与劳工领袖。家境贫寒的他早年在纳西奥纳利斯塔党内活动，后转向工人运动，长期领导印刷业工会与“菲律宾工人大会”。1930年11月7日他将其团体改组为菲律宾共产党，任首任总书记；翌年因煽动罪被判刑，1932年该党被最高法院取缔。1930年代末获特赦后曾与奎松总统就“社会和平”接触。1942年1月日军攻占马尼拉后，他与佩德罗·阿巴德·桑托斯等一同被捕；日方企图借他向胡克军谈判未果，遂于1942年6月2日将其处决。"
 CBIO_PHI_artemio_ricarte_desc:0 "阿特米奥·里卡尔特·加西亚，1866年10月20日—1945年7月31日，生于北伊罗戈省巴塔克，教师出身。菲律宾革命期间加入卡蒂普南，取绰号“蝮蛇”；在德黑罗斯会议上当选大尉将军，任阿基纳多革命军旅长。菲律宾武装部队尊他为“菲律宾陆军之父”，亦是首任参谋长。菲美战争中任马尼拉一带作战指挥，1900年被美军俘获，与马比尼一同流放关岛。他始终拒绝向美国宣誓效忠，后长期流亡日本，在神奈川、东京教授西班牙语。1941年日军侵菲后，他随日军返菲，以换取东条英机“一年内恢复秩序即给予独立”的承诺，参与绥靖。二战末期他拒绝逃往日本，留下话：“在同胞身处苦难的危急关头，我不能躲到日本去，我要留在祖国到最后。”1945年7月因痢疾病逝于山省卡林加一带，终年78岁。"
 CBIO_PHI_infante_juan_iii_desc:0 "唐胡安·德波旁，1913年6月20日生于西班牙塞戈维亚省拉格兰哈王宫，1993年4月1日卒于潘普洛纳，阿方索十三世第三子、巴塞罗那伯爵，1941至1977年间的西班牙王位觊觎者。1931年第二共和国成立后王室流亡，他转入英国皇家海军深造，曾随舰驻印度孟买，后拒绝放弃西班牙国籍而退出英海军。因两位兄长先后放弃继承权，他成为波旁王朝继承人。西班牙内战初期，他曾化名试图加入国民军，旋即被遣返。1945年他在洛桑发表宣言，抨击佛朗哥政权并要求恢复君主制。1977年，他正式向已即位的儿子胡安·卡洛斯一世放弃王位权利。晚年获西班牙海军荣誉上将、大元帅衔，死后以未即位之尊号“胡安三世”葬入埃斯科里亚尔王室陵。"
 CBIO_PHI_sergio_osmena_desc:0 "塞尔希奥·奥斯梅尼亚，1878年9月9日—1961年10月19日，生于宿务，菲律宾自治领首任副总统、第四任总统。1907年首届议会当选众议院议长，长期是纳西奥纳利斯塔党创始领导人之一。1935年当选首任副总统。1941年随奎松政府撤入巴丹、科雷希多，1942年辗转澳大利亚、美国建立流亡政府。1944年8月1日奎松病逝后依宪继任总统，成为首位维萨扬地区总统，人称“宿务老人”，同年10月随麦克阿瑟登陆莱特。1946年独立后首次总统选举中败于罗哈斯，晚年退出政坛，1961年逝世。"
 CBIO_PHI_carlos_p_romulo_desc:0 "卡洛斯·佩尼亚·罗慕洛，1899年1月14日—1985年12月15日，菲律宾外交家、军人、记者与作家。他16岁当记者、20岁任报纸主编，1930年代主持《论坛报》《先锋报》《塔里巴报》三报联合报系，也是菲律宾童军共同创办人。1941年他成为首位获普利策通讯奖的非美国人。日军侵菲后，他任麦克阿瑟副官，在科雷希多主持广播“自由之声”；巴丹陷落前撤离，辗转澳大利亚、美国，加入奎松流亡政府任新闻部长，并任驻美常驻专员。战后他是菲律宾在《联合国宪章》上的签字人，1949至1950年出任联合国大会主席，为首位担此职的亚洲人。1948年联大遭苏联代表讥讽为“小国里的小人”，他回敬：“这世上的小大卫们，有责任把真理的石子掷向咆哮的歌利亚。”他历任外交部长多年，1982年获封国家文学艺术家。"
 CBIO_PHI_benigno_ramos_desc:0 "贝尼尼奥·拉莫斯·潘塔莱翁，1892年2月10日生，一说1893年；1945年失踪，笔名“本·鲁本”，诗人、记者出身。曾任参议院译员，是奎松的亲信，1930年因参加教师罢工与奎松决裂。他创办他加禄语报纸《萨克达尔》，将追随者组织成萨克达尔运动，主张即刻独立、土地重分，一度拥众约两万。1935年运动发动起义被镇压，他流亡日本。1938年回国领导“甘纳普”党；日占时期该党并入新菲律宾服务协会，拉莫斯另组“马卡皮里”，为日军招募兵员并牵制劳雷尔权力。1944年12月他与里卡尔特的追随者被日军武装，此时美军已登陆。菲律宾陷落后其下落众说不一，一说随撤退日军在碧瑶死于空难。"
 CBIO_PHI_jose_abad_santos_desc:0 "何塞·阿瓦德·桑托斯·巴斯科，1886年2月19日—1942年5月，生于邦板牙省圣费尔南多，菲律宾第五任最高法院首席大法官，二战期间代理自治领总统。他获政府公费资助赴美，先后就读圣克拉拉学院、西北大学法学院，并获乔治·华盛顿大学法学硕士。回菲后历任司法部总检察长、副部长，两度出任司法部长，1932年升任陪席大法官。1941年12月奎松任命他为首席大法官，兼理战时撤销的多部职权。奎松流亡前授权他代行总统职权，实际成为代理总统。1942年4月11日他与其子在宿务被日军俘获，拒绝宣誓效忠日本、拒绝配合劝降罗哈斯等要求，称“我不能那样做，那将违背我对美国的效忠誓言”。日方将其押往棉兰老岛马拉邦处以枪决。菲律宾一千比索纸币以其头像纪念。"
 CBIO_PHI_josefa_llanes_escoda_desc:0 "何塞法·马丹巴·利亚内斯·埃斯科达，1898年9月20日—1945年1月约6日，生于伊罗戈北省丁拉斯，菲律宾教育家、社会工作者、妇女参政运动领袖，被誉为“菲律宾的南丁格尔”。她赴美国哥伦比亚大学攻读社会学，回菲后长期倡导妇女参政权。1940年5月26日，她出任菲律宾女童军首任全国总干事；1941至1944年兼任全国妇女俱乐部联合会主席。日军占领期间，她与丈夫安东尼奥一同秘密从事地下救援工作，向战俘、平民转送物资并协助游击组织传递情报。1944年8月27日夫妇二人被日本宪兵队逮捕，其夫同年遇害。她本人于1945年1月6日最后一次被人看见，推断随后遭处决。菲律宾一千比索纸币曾以其头像纪念。"
 CBIO_PHI_juan_samulong_desc:0 "胡安·马尔克斯·苏穆隆，1874年12月27日—1942年1月9日，生于黎刹省安蒂波洛，菲律宾律师、记者、政治家，人称“反对派的头脑”。1909至1913年任菲律宾委员会委员，1925年当选参议员。1917年参与合并成立民主党并出任党主席，长期作为反对派领袖，反对美国在菲永久保留军事基地。1934年再度当选参议员。1941年不顾病重之躯挑战奎松竞选总统，选举前病重卧床，于1942年1月9日病逝。临终前他向友人表示，其党绝不会加入日本扶植的傀儡政府。其外曾孙女科拉松·阿基诺、外玄孙贝尼尼奥·阿基诺三世后均曾任菲律宾总统。"
 CBIO_PHI_wendell_fertig_desc:0 "温德尔·费尔蒂希，1900年12月16日—1975年3月24日，美国土木工程师、棉兰老岛游击战领袖。1936年携家人移居菲律宾从事工程工作，持美国陆军预备役军官身份。1941年被征召入伍，太平洋战争爆发后赴棉兰老；驻棉兰老美军投降后他拒绝放下武器，自行组织民众建立“驻菲律宾美军部队”。1943年2月麦克阿瑟正式任命他为第10军区指挥官，此后部队通过潜艇获盟军支援，发展至约3万至3.8万人规模，为1945年美军棉兰老登陆战提供关键协助。战后因未获授将官军衔备受争议，后重操工程旧业，1975年逝世。他与拉塞尔·沃克曼、亚伦·班克并称美国陆军特种部队奠基人。"
 CBIO_PHI_vicente_lava_desc:0 "维森特·格雷戈里奥·巴尔塔萨·拉瓦，1894年12月24日—1947年9月16日，生于布拉干，菲律宾化学家、共产主义运动领袖。早年留学美国从事研究并接触共产主义思想。1925年起任菲律宾大学教授，专注椰子油脂提炼工艺，1937年获专利，日方曾出价百万比索购买遭其拒绝。1930年代末加入菲共。1942年2月党内领导人被捕后他接任总书记，主持组建胡克军。因“退守防御”策略被判定失误，后被解除总书记职务。战后当选国会议员但被罗哈斯政府拒绝就职。1947年逝世，其弟何塞、赫苏斯·拉瓦其后相继出任菲共总书记。"
 CBIO_PHI_nieves_fernandez_desc:0 "涅韦斯·费尔南德斯，约1906年—1997年，生于莱特岛塔克洛班，菲律宾唯一有据可查的女性游击队指挥官，战前为学校教师。1942年日军占领塔克洛班后，她组织起约110人的游击队，人称“费尔南德斯上尉”“无声杀手”，训练部下使用自制猎枪、土制手榴弹及砍刀作战。据统计其部队两年半内击毙逾200名日军，日方悬赏一万比索缉拿她未果。1944年10月美军登陆莱特后其部队与美军会合。1945年5月31日她以中士军衔光荣退役，战后低调生活，1997年去世。"
 CBIO_PHI_tan_malaka_desc:0 "陈马六甲，本名易卜拉欣，约1897年6月2日—1949年2月21日，印度尼西亚革命家，印尼共产党主席，共产国际驻东南亚代理人之一。早年赴荷兰求学，1921年出任印尼共产党主席，后遭驱逐辗转菲律宾、中国、泰国从事地下革命活动。1925至1927年间他曾以化名多次往返马尼拉，与当地劳工运动建立联系；1927年在马尼拉一度被捕。此后长期从事秘密活动，1942年返回爪哇。印尼独立战争期间他因主张更激进路线与苏加诺、哈达等主流派系产生分歧，1949年2月21日在东爪哇被印尼军方处决。1963年被追认为“民族英雄”。"
 CBIO_PHI_courtney_whitney_desc:0 "考特尼·惠特尼，1897年5月20日—1969年3月21日，生于美国华盛顿特区，律师出身的美国陆军少将。1917年入伍任一战追击机飞行员；1927年获乔治·华盛顿大学法学学位后退役，赴马尼拉执业。1940年重返现役，1943年应麦克阿瑟之请调往西南太平洋战区，协助组织菲律宾抗日游击活动，一度负责菲律宾民政事务，1944年随麦克阿瑟登陆莱特。传记作者威廉·曼彻斯特记述他对菲律宾人态度傲慢，并促使麦克阿瑟将战略情报局挡在西南太平洋之外。战后他任盟军最高司令部政府局局长，参与起草1947年日本宪法；朝鲜战争随麦克阿瑟，1951年麦氏解职后退役。1956年出版麦克阿瑟传记。"
 CBIO_PHI_richard_marshall_desc:0 "理查德·雅克林·马歇尔，1895年6月16日—1973年8月3日，生于美国弗吉尼亚州，美国陆军少将，与乔治·马歇尔为远亲。1915年毕业于弗吉尼亚军事学院。1929年被派驻菲律宾，曾在科雷希多主持马林塔隧道西端工程，该隧道后成为麦克阿瑟二战指挥所。1939年再赴菲律宾协助筹建国防军，1941年任美国远东陆军副参谋长，晋准将。1942年撤至澳大利亚后续任麦克阿瑟副参谋长，晋少将。1944年11月起任参谋长，1945年9月2日随麦克阿瑟登上“密苏里”号见证日本投降签字。1946年退役后任弗吉尼亚军事学院第七任院长至1952年，后参与对菲经济情况的“贝尔调查团”。"
 CBIO_PHI_lewis_c_beebe_desc:0 "路易斯·查尔斯·比比，1891年12月7日生于美国艾奥瓦州阿什顿，1951年2月17日卒于明尼苏达州法里博，美国陆军准将。他1913年以士兵入伍，1916年自俄勒冈大学毕业获海岸炮兵少尉衔，一战期间随第三师第30步兵团赴法作战，获优异服役十字勋章与紫心勋章；战间期1932年毕业于指挥参谋学校，1939年毕业于陆军战争学院。太平洋战争爆发时他任麦克阿瑟麾下远东陆军供给参谋G4，1942年3月晋准将、留守科雷希多任麦克阿瑟副参谋长；麦克阿瑟撤往澳大利亚后，温赖特接掌美菲部队，比比转任其参谋长。1942年5月6日科雷希多陷落之际，正是由比比通过广播宣读投降令，其声音成为这场投降的“公开之声”。此后他被日军辗转关押于菲律宾、台湾、“满洲”等地战俘营三年余，其间秘密坚持写日记，战后整理出版为《旭日之囚》，获救时因痢疾、脚气病与营养不良而骨瘦如柴、仅余约98磅；他自陈身陷囹圄仍当以乐观与自尊处之。战后继续服役，1950年退役，翌年因脑溢血病逝，葬于阿灵顿国家公墓。"
 CBIO_PHI_godofredo_juliano_desc:0 "戈多弗雷多·胡利亚诺，菲律宾陆军航空队飞行学校1939A班出身，第6追击机中队飞行员。1941年12月10日，他与比利亚莫尔上尉及阿克兰、阿兰萨索、戈萨尔等人驾P-26战机在扎布兰机场、帕西格上空迎击日军轰炸机与零式战斗机编队，该中队当日击落4架敌机；12日又参加巴塘牙斯空战。因作战英勇，12月15日获麦克阿瑟颁授金十字勋章。被俘获释后，他加入盟军情报机构，协助策动一次摧毁内格罗斯上空日机的空袭。战后他成为菲律宾空军建设的重要人物：1946年5月1日以上尉衔出任第1歼击机中队首任中队长，其后驾驶P-51“野马”，1955年参与将菲律宾空军带入喷气时代，是首批飞洛克希德T-33的菲律宾飞行员之一，并成为首位以上校身份从美国空军喷气战斗机学校毕业者；历任第5歼击机联队、第1航空师指挥官。身后安葬于菲律宾英雄墓。"
 CBIO_PHI_napoleon_de_leon_desc:0 "拿破仑·德莱昂，菲律宾陆军航空队军官、飞行员。1941年6月出任努埃瓦埃西哈省蒂尼奥营第8航空基地中队指挥官；巴丹战役期间因1942年1月至2月阿格拉洛马一线作战英勇，晋升上尉。菲律宾陷落后，他加入盟军情报机构，在内格罗斯岛担任空中情报预警官；1944年11月，他提供的情报促成美军轰炸机摧毁一整个日军零式战斗机中队。战后他赴美接受P-38“闪电”等机型训练，归国后驾驶P-51“野马”服役，并成为菲律宾空军首批飞洛克希德T-33喷气教练机的飞行员之一。"
 CBIO_PHI_clayton_jerome_desc:0 "克莱顿·查尔斯·杰罗姆，1901年9月22日—1978年2月13日，生于美国堪萨斯州哈钦森，美国海军陆战队飞行员将领。1922年毕业于美国海军学院，后在彭萨科拉受飞行训练，并获加州理工学院航空工程硕士。二战期间他历经北所罗门、特雷热里-布干维尔诸役，以及菲律宾吕宋、棉兰老作战，在菲律宾指挥第24、32海军陆战队航空大队，为陆军地面部队提供近距空中支援，获美国陆军荣誉军团勋章。朝鲜战争期间他指挥第1海军陆战队航空联队。他一生四获荣誉军团勋章，退役时晋升中将，1978年因癌症病逝于弗吉尼亚州阿灵顿。"
 CBIO_PHI_jesus_villamor_desc:0 "赫苏斯·安东尼奥·弗洛雷斯·维拉莫尔，1914年11月7日—1971年10月28日，生于阿布拉省邦格德，菲律宾-美国混血飞行员、情报军官，其父曾任菲律宾最高法院陪席大法官。他就读马尼拉德拉萨大学商科，后赴美国兰道夫机场受训，1937年获菲律宾陆军航空队军官任命。1941年12月10日和12日，他率第6追击机中队在扎布兰机场及巴塘牙斯两度迎击日军编队，击落两架敌机，两次获颁杰出服役十字勋章及橡叶簇，是唯一两获该勋章的菲律宾人。部队被击溃后他撤往澳大利亚，1942年12月27日自愿乘潜艇潜回菲律宾，加入盟军情报局，在吕宋、维萨扬、棉兰老建立游击情报网络。战后他曾赴越南任军事顾问，1954年获马格赛赛颁授“英勇勋章”。尼科尔斯空军基地后更名为“赫苏斯·维拉莫尔空军基地”，现为菲律宾空军总部。"
 CBIO_PHI_paulino_santos_desc:0 "保利诺·托雷斯·桑托斯，1890年6月22日—1945年8月29日，生于打拉省卡米灵，菲律宾军人、殖民地行政官员。1908年加入宪兵队，1914年宪兵军官学校毕业第一名。1930年起兼任监狱局局长，建立达沃劳教垦殖场。1936年出任菲律宾陆军首任正式参谋长；1939年出任全国土地安置局局长，率首批移民开拓科罗纳达尔谷地，即今将军市之开端。日军占领棉兰老后他与日方达成协议继续管理垦殖项目，1944年8月奉召回马尼拉任宪兵队总司令。日本战败前夕随军北撤，1945年8月29日病逝，距日本投降仅两周。将军市即以其名命名。"
 CBIO_PHI_richard_sutherland_desc:0 "理查德·凯伦斯·萨瑟兰，1893年11月27日—1966年6月25日，生于美国马里兰州，美国陆军中将，耶鲁大学毕业。一战时随美国远征军第2师参战。1938年调任驻菲军事顾问处，逐步取代艾森豪威尔成为麦克阿瑟参谋长。1941年美国远东陆军成立后续任参谋长，主持防军动员；巴丹、科雷希多战事期间常赴前线。1942年3月随麦克阿瑟撤离科雷希多赴澳大利亚，此后终战期间一直任麦克阿瑟参谋长，曾代其拍板越过棉兰老直取莱特岛的关键决定，颇受争议。1945年随麦克阿瑟见证密苏里舰受降仪式。战后因绯闻于1946年退役，1966年在沃尔特·里德医院逝世，葬于阿灵顿国家公墓。"
 CBIO_PHI_george_grunert_desc:0 "乔治·格鲁纳特，1881年7月21日—1971年1月12日，生于美国宾夕法尼亚州白港，美国陆军骑兵军官，自列兵晋升至中将，军旅生涯47年。1898年以列兵入伍，1901年获骑兵少尉；一战期间赴法任观察员，获陆军杰出服役勋章。1938年接替乔治·马歇尔任第5旅旅长，1939年晋少将。1940年5月至1941年11月他出任菲律宾防区司令，直至麦克阿瑟奉召复出；1941年10月23日被解职调回美国。此后代理指挥美国第1集团军，统率东部防区司令部至1945年7月退役。1944年6月受任主持调查珍珠港事件前陆军应对失当的秘密委员会。1971年1月12日在圣安东尼奥病逝，葬于阿灵顿国家公墓。"
 CBIO_PHI_basilio_j_valdez_desc:0 "巴西利奥·何塞·塞贡多·皮卡·瓦尔德斯，1892年7月10日—1970年1月26日，生于马尼拉圣米格尔，医生出身的将领与部长。他毕业于圣托马斯大学医科，一战期间志愿赴法任外科医生。1922年重整菲律宾宪兵医疗系统，1934年升准将、任宪兵司令；1936年任陆军副参谋长，1939年接替保利诺·桑托斯出任参谋长。1941年被奎松任命为国防部长，同时是奎松的私人医生。日军侵菲后，他受麦克阿瑟之托负责奎松一家安全，随流亡政府辗转科雷希多、澳大利亚、美国，陪同奎松至其病逝。奥斯梅尼亚接任后他续任原职，1944年随麦克阿瑟登陆莱特。战后任卫生部长，后回圣托马斯大学任外科教授，1970年逝世。"
 CBIO_PHI_russell_volckmann_desc:0 "拉塞尔·威廉·沃克曼，1911年10月23日—1982年6月30日，生于美国艾奥瓦州，美国陆军军官、菲律宾北吕宋游击战领袖。1934年毕业于西点军校，1940年调赴菲律宾。1942年巴丹陷落时他拒绝投降，逃入吕宋北部山区。1943年6月接掌北吕宋游击部队，整编为驻菲律宾美军北吕宋部队，下辖五个步兵团，兵力发展至光复时近2万人，并与麦克阿瑟总部建立无线电联络。1945年9月3日吕宋日军受降仪式上他是与会盟军代表中军衔最低者。战后他协助起草美军非常规战理论手册，与亚伦·班克、温德尔·费尔蒂希并称美国陆军特种部队奠基人，晋准将后退役。"
 CBIO_PHI_ramon_magsaysay_desc:0 "拉蒙·马格赛赛，1907年8月31日—1957年3月17日，生于三描礼士省伊巴，菲律宾第七任总统。太平洋战争爆发后他加入抗日游击队，在西吕宋组织并领导三描礼士省游击队。1946年当选国会议员，1950年出任国防部长，受托全权镇压胡克军叛乱，以“心理战”与怀柔政策辅以军事清剿，促成路易斯·塔鲁克于1954年投降。1953年当选总统，任内推行土地改革、廉政建设，深得民心。1957年3月17日乘坐的C-47运输机在宿务芒昂加尔山失事坠毁，不幸遇难，享年49岁。"
 CBIO_PHI_vicente_p_lim_desc:0 "比森特·波迪科·林，1888年2月24日—1944年12月31日，生于内湖省卡兰巴，菲律宾陆军准将，首位毕业于美国西点军校的菲律宾人，1914届。毕业后历任菲律宾侦察兵部队军官，并赴美深造多所军事院校。1935年转任菲律宾陆军准将，1939年任副参谋长。太平洋战争爆发后任第41步兵师师长，在巴丹阿布凯防线给日军造成重大杀伤。1942年4月巴丹陷落后他被俘，经历死亡行军后获释；随后佯装重病住院，暗中组织资助地下抵抗力量，向盟军提供情报。1944年他在准备潜艇撤离时被日军抓获，以抵抗领袖罪名于比利比德监狱内处决，遗体下落不明。菲律宾一千比索纸币曾以其头像纪念。"
 CBIO_PHI_edward_king_desc:0 "爱德华·波斯特尔·金，1884年7月4日—1958年8月31日，生于美国佐治亚州亚特兰大，美国陆军少将，炮兵出身。1908年入伍，一战时任炮兵主管首席助理并获陆军杰出服役勋章。1940年被派往菲律宾，成为麦克阿瑟麾下高级地面将领。1942年3月麦克阿瑟撤往澳大利亚后，金接掌巴丹半岛吕宋部队。经数月苦战、粮药耗尽，他独自承担违抗“不得投降”命令的责任，于1942年4月9日率约7.5万美菲联军投降——这是美国军史上规模最大的一次投降，随后即为“巴丹死亡行军”之始。他与部下当了三年半战俘；战后重获自由时被视为英雄。这一天在菲律宾被定为“英勇日”。"
 CBIO_PHI_yuitsu_tsuchihashi_desc:0 "土桥勇逸，1891年1月1日生于日本佐贺县，1972年5月31日卒，日本陆军中将。陆军士官学校第24期、陆军大学校第32期毕业，早年在东京外国语学校专修法语，1924至1927年出任驻法武官，通晓法语与欧洲事务。耐人寻味的是，他任陆军参谋本部情报部第二部首脑期间曾反对进军法属印度支那，其部门因而被排除在该行动决策之外。抗战期间他任第21军参谋长、参与进攻广东，一度兼任汪精卫政权军事联络武官。太平洋战争爆发时任第48师团长，该师团率先登陆菲律宾、攻占马尼拉，但未参加巴丹战役，转赴爪哇攻取泗水，其后任帝汶守备司令，与澳、荷突击队交战。1944年11月转任第38军司令官，进驻法属印度支那。1945年3月，因法方庇护被击落的美军飞行员、拒不交出，他认定已无法信任殖民当局，遂向总督德古发出最后通牒、发动“明号作战”，一举解除法军武装、接管政务并自任日占印度支那总督，作战中多处法军守备队被击溃乃至遭屠杀。战败后他被中国国民政府在河内俘押、转交法方，1949年获释，1950年返日。"
 CBIO_PHI_iwaichi_fujiwara_desc:0 "藤原岩市，1908年3月1日—1986年2月24日，生于日本兵库县多可郡，日本陆军军官，战后曾任陆上自卫队中将。1931年毕业于陆军士官学校第43期，1938年陆军大学校第50期毕业后调入陆军第21军。1939年转入参谋本部情报部门，负责筹划对东南亚工作。1941年9月大本营在其麾下组建“藤原机关”，赴曼谷隶属第15军，联络印度独立运动人士、海外华侨与马来苏丹，争取对日合作。太平洋战争爆发后他随军参与马来亚作战，协助营救吉打苏丹一家；其最大成就是策动约四万名被俘印军投诚，促成“印度国民军”雏形组建。1942年新加坡陷落后F机关任务移交岩畔机关，他转赴苏门答腊联络亚齐独立势力。战后他撰写回忆录《F机关》，自称“东南亚的阿拉伯的劳伦斯”。"
 CBIO_PHI_luis_taruc_desc:0 "路易斯·芒加卢斯·塔鲁克，1913年6月21日—2005年5月4日，生于邦板牙省圣米格尔，佃农出身的农民运动与游击战领袖。1938年加入农民联盟。1942年日军侵菲后，他与共产党人一同组建“抗日人民军”，自任总司令，率部在中吕宋开展游击战。战后胡克军与政府关系恶化，他转入地下继续武装反抗，直至升级为“胡克叛乱”。1954年5月他向政府投降，后经长期监禁，1968年获特赦。晚年致力于农民权益倡导，2005年逝世，2017年获追认为民族英雄。"
 CBIO_PHI_jose_v_andrada_desc:0 "何塞·V·安德拉达，美国海军学院1931届毕业生，菲律宾近海巡逻队，绰号“蚊子舰队”的创建骨干与首长，被视为菲律宾现代海军的奠基者。1938年他受命筹建这支麦克阿瑟构想中的自治领海军，亲自到菲律宾军事学院面试遴选首批军官，以英制鱼雷艇“Q艇”为核心，总部设于马尼拉港区工程师岛旁的科多码头。1939年2月9日首期学员结业，他将这一天定为近海巡逻队的诞生日。战争期间该队在巴丹、科雷希多沿海冒日军封锁运送补给，他晋少校。1945年菲律宾光复后，他主持以幸存老兵为骨干重建该队；1951年近海巡逻队先后改称菲律宾海上巡逻队、菲律宾海军，他出任首任司令，成为菲律宾海军首位主官。马尼拉的何塞·安德拉达海军基地及“何塞·安德拉达级”巡逻艇均以其名命名。"
 CBIO_PHI_enrique_jurado_desc:0 "恩里克·L·胡拉多，1911年7月15日—1944年10月，生于奎松省卢塞纳，菲律宾陆军近海巡逻队，“蚊子舰队”军官。他是美国海军学院1934届毕业生，曾参加1936年柏林奥运会摔跤比赛。1941年12月4日、珍珠港事件前夕接任该队指挥官。日军侵菲后，他率鱼雷艇与炮艇中队在巴丹保卫战中作战，为孤守部队运送补给；旗舰Q-111“吕宋”号被击伤搁浅后，他下令弃船。脱险后转入班乃岛游击队，后被派往民都洛整合游击力量，卷入两派权斗，1944年10月被对立派系杀害。1942年1月他曾获麦克阿瑟颁授银星勋章。"
 CBIO_PHI_thomas_hart_desc:0 "托马斯·查尔斯·哈特，1877年6月12日—1971年7月4日，生于美国密歇根州，美国海军上将。1897年毕业于美国海军学院，美西战争期间参与圣地亚哥围城战。一战期间任大西洋舰队潜艇部队参谋长，获海军杰出服役勋章。1931至1934年任海军学院院长。1939年7月晋升上将并出任美国亚洲舰队总司令，舰队主力驻菲律宾。太平洋战争爆发时他麾下拥有太平洋战区大部分现役潜艇，但因鱼雷故障等原因未能有效阻遏日军推进。1942年1月他将司令部撤往爪哇，兼任美英荷澳联合舰队司令；因与盟军将领关系紧张于2月中旬被撤换，7月退役。1945年退役出任康涅狄格州联邦参议员。1971年逝世，葬于阿灵顿国家公墓。"
 CBIO_PHI_john_wilkes_desc:0 "约翰·E·威尔克斯，1895年5月26日—1957年7月20日，生于美国北卡罗来纳州夏洛特，美国海军中将，潜艇部队军官。1912年入读美国海军学院，一战期间在装甲巡洋舰服役。1919年起接受潜艇训练，1939年起任亚洲舰队参谋部资深潜艇军官，后升任潜艇部队司令。1941年12月太平洋战争爆发时，亚洲舰队潜艇部队由他统率；因鱼雷故障、部署失当等原因未能有效阻遏日军登陆。1941年12月29日他随司令部撤往荷属东印度泗水。1942年返美后历任轻巡洋舰“伯明翰”号舰长，参与1943年西西里登陆；后统领两栖部队参与诺曼底、法国南部登陆筹备。战后曾任大西洋舰队潜艇部队司令、驻德海军部队司令，1951年以中将退役，1957年逝世。"
 CBIO_PHI_okawachi_denshichi_desc:0 "大川内传七，1886年9月2日—1958年2月13日，生于日本佐贺县盐田町，日本海军中将。毕业于海军兵学校第37期。1936年出任上海日本海军特别陆战队司令官，翌年淞沪事变中率部坚守日租界约三个月。此后历任第一舰队炮术参谋、支那方面舰队参谋长等职。太平洋战争中他先后短暂出任舞鹤镇守府司令长官等职；1943年11月出任海上护卫总司令部实务长官，1944年8月转回预备役。1944年11月他被亲补为南西方面舰队司令长官，名义上统辖菲律宾方面海军，但麾下已无主力舰艇，实际以陆战方式在吕宋岛作战直至日本投降。战后一度被列为乙级战犯，后因证据不足获判无罪，1947年复员。"
 CBIO_PHI_emma_rotor_desc:0 "艾玛·温松·罗托尔，1913年5月18日—1998年9月6日，生于马尼拉，菲律宾裔美国物理学家、数学家。她在圣托马斯大学获数学学士，1937年获物理学硕士。1941年10月赴美，因战争爆发无法领取奖学金而计划受阻。1944年1月她以战时聘用物理学家身份加入美国国家标准局军械发展处，参与近炸引信研发——这项被美国陆军部称为“仅次于原子弹”的技术。她是项目中少数女性之一，上司评价她“无论职级，都是本项目中最有价值的人之一”。战后她返回菲律宾教数学，曾任圣母升天学院学术院长。"
 CBIO_PHI_pedro_p_baguisa_desc:0 "佩德罗·P·巴吉萨，生年不详，2009年5月30日卒，菲律宾共产党一九三〇派总书记。该党由克里桑托·埃万赫利斯塔等人于1930年11月7日创建，二战期间领导抗日人民军“虎克军”，战后在工人与农民运动中一度势盛，后经镇压与路线转折逐渐式微。巴吉萨于1993年11月7日该党第十次代表大会上当选总书记，其后在1998年、2003年、2008年历次代表大会上连任，长期主持党务，党机关刊为《共产党人报》。他任内强调反帝国际团结与传统工农运动路线。2009年5月30日因病逝世，同年党中央政治局推举安东尼奥·E·帕里斯继任总书记。"
 CBIO_PHI_deodato_jacinto_desc:0 "虚构架空人物。其姓“哈辛托”源自希腊语“许阿金托斯”，即风信子，也指阿波罗神话中的少年，经拉丁语“希阿辛图斯” 进入西班牙语，天主教传统中亦有圣哈辛托；在菲律宾史中，这一姓氏直指卡蒂普南“卡蒂普南之脑”埃米利奥·哈辛托。其名“德奥达托”出自拉丁语“德奥达图斯”，意为“神所赐、献于神”，同源于西班牙语“迪奥斯达多”、法语“迪厄多内”；在菲律宾史中则对应卡蒂普南首任会长德奥达托·阿雷利亚诺。此名把两位卡蒂普南创始人姓名糅合为一。"
 CBIO_PHI_hermano_jacinto_desc:0 "虚构架空人物。其姓“哈辛托”源自希腊语“许阿金托斯”，经拉丁语进入西班牙语，在菲律宾史中令人联想到卡蒂普南的埃米利奥·哈辛托，他是19世纪末菲律宾革命时期的重要人物，被誉为“卡蒂普南的大脑”。“埃尔马诺”这个名字在西班牙语中意为“兄弟”，也是天主教互助会中对教友或会首的称谓；菲律宾史上最著名者为“埃尔马诺·普莱”，即阿波利纳里奥·德拉克鲁斯，圣何塞互助会创立者、1841年塔亚巴斯宗教起义领袖。"
 CBIO_PHI_pelagio_cruz_desc:0 "佩拉希奥·阿尔马萨尔·克鲁斯，1912年6月16日—1986年10月21日，生于布拉干省巴利瓦格，被誉为“菲律宾空军之父”。1935年毕业于菲律宾军事学院，1936年获飞行员资格。太平洋战争爆发后任菲律宾陆军航空队临时团执行官，参加巴丹保卫战，获颁银星勋章；投降后加入布拉干游击队。战后赴美复训，1947至1951年及1953至1956年两度出任菲律宾空军司令。1959年晋升少将、任武装部队副参谋长，1961至1962年出任武装部队总参谋长，晋中将后于1962年退役。1986年在奎松城逝世。"
 CBIO_PHI_leoncio_s_tan_desc:0 "莱昂西奥·S·陈，1910年—1986年，生于马尼拉，菲律宾陆军准将，后为陆军第11任总司令。1928年毕业于菲律宾宪兵学院，1936年转入陆军。1941年任第21步兵师营长，参加巴丹战役，1942年随军投降，经历死亡行军并沦为战俘，获释后加入吕宋游击队。战后重返陆军，1957年晋升准将并出任陆军总司令，推动陆军总部独立建制，1958年退役。1954年曾获马格赛赛任命为菲律宾国家调查局第五任局长。菲律宾陆军博物馆以其名字命名。"
 CBIO_PHI_benito_n_ebuen_desc:0 "贝尼托·尼卡诺尔·埃布恩，1912年1月11日生于三描礼士省伊巴——与拉蒙·马格赛赛同乡，1957年3月17日卒，菲律宾空军早期军官、飞行员。他毕业于马尼拉阿雷利亚诺中学，1930年入菲律宾大学攻读土木工程，三年级时投考军旅。1941年8月菲律宾陆军航空队并入远东空军，他以中尉身份随部受编参战。战后成为菲律宾空军战斗机飞行员，朝鲜战争期间随菲律宾赴朝远征军任空中侦察飞行员，并在联合国军菲律宾联络组任职；历任要职，官至准将并出任菲律宾空军司令。1957年3月17日，他与总统马格赛赛同乘一架C-47运输机在宿务马农加尔山坠机，与总统及机上其余人员一同罹难。1996年，宿务麦克坦的空军基地更名为“准将贝尼托·N·埃布恩空军基地”以志纪念。"
 CBIO_PHI_basilio_fernando_desc:0 "巴西利奥·费尔南多，1895年6月14日—1946年1月21日，生于黎刹省圣马特奥，菲律宾军事航空先驱之一。他原在宪兵服役，后入选帕拉纳克的柯蒂斯飞行学校，成为首批三十余名菲律宾飞行员之一。1920年代菲律宾航空勤务创办后，他参与马尼拉至伊洛伊洛、宿务、三宝颜的邮运与客运飞行。1934年菲律宾宪兵航空队成立，他任战术连首任指挥官。1941年任菲律宾陆军航空队指挥官，同年8月由麦克阿瑟主持并入远东空军。巴丹、科雷希多陷落后，他加入抗日地下组织，以买卖木柴为掩护向盟军传递情报。战后作为首批赴美进修的菲律宾飞行员，1946年1月在俄克拉荷马伊尼德机场驾驶B-25训练飞行时坠机身亡。八打雁省利帕的费尔南多空军基地以其命名。"
 CBIO_PHI_santiago_nuval_desc:0 "圣地亚哥·努瓦尔，菲律宾军事学院1938届毕业生，菲律宾近海巡逻队首批九名创队军官之一。他在安德拉达上尉麾下受训于海事、航海与炮术，任鱼雷艇Q-113“阿古桑”号艇长，参与巴丹保卫战。战后续任海军职务，朝鲜战争期间出任驻东京“菲律宾-联合国司令部联络团”团长，负责统筹菲律宾远征军赴朝作战的后勤联络；此后晋准将衔，后出任菲律宾海军总指挥官。"
 CBIO_PHI_heraclio_alano_desc:0 "埃拉克利奥·希普斯·阿拉诺，1915年10月23日生于薄荷省拉瓦伊，菲律宾军事学院1940届毕业生。他加入近海巡逻队骨干，战争爆发时任鱼雷艇Q-111“吕宋”号执行官。1942年1月17日在科雷希多附近对抗日军俯冲轰炸机作战中获颁银星勋章。巴丹陷落后，其座艇被击沉，他游泳上岸辗转逃至薄荷岛，加入“英希涅罗”游击队，同僚中包括后来的总统卡洛斯·加西亚。战后重返近海巡逻队，1966年6月16日出任菲律宾海军总指挥官，准将衔，1983年逝世。"
 CBIO_PHI_ramon_a_alcaraz_desc:0 "拉蒙·阿瓦坎·阿尔卡拉斯，1915年8月31日—2009年6月25日，生于布拉干省普拉里德尔，菲律宾海军军官、二战英雄。1940年毕业于菲律宾军事学院首届，加入近海巡逻队。1942年1月17日他指挥鱼雷艇Q-112“阿布拉”号击落三架日军俯冲轰炸机，获麦克阿瑟当场颁授银星勋章。被俘获释后受训成为宪兵警官，暗中建立情报网向流亡的美国远东陆军司令部提供情报直至光复。战后1950年赴美研究美国海军陆战队编制，协助组建菲律宾海军陆战队；1964年受命组建海上行动部队打击走私。2009年他促成美国国会通过《菲律宾老兵权益法案》后不久病逝，享年93岁。"
 CBIO_PHI_victor_h_dizon_desc:0 "维克托·H·迪松，菲律宾陆军航空队军官。太平洋战争爆发时隶属驻努埃瓦埃西哈省卡巴那端马尼基斯机场的第10轰炸机中队，任B-10轰炸机飞行员，并在克拉克机场任温赖特麾下的飞行员兼观察员；后转投维拉莫尔上尉的第6追击机中队，参加巴丹战役。菲律宾陷落后被俘，关押于棉兰老、打拉集中营至1943年获释。1945年2月6日与美军解放部队会合，后赴美接受飞行复训。战后历任第1联络机中队执行官、代理指挥官，后调入菲律宾陆军航空局；官至少将，并出任菲律宾空军司令。"
 CBIO_PHI_edwin_andrews_desc:0 "埃德温·D·安德鲁斯，菲律宾陆军航空队军官、美菲混血飞行员。太平洋战争爆发、巴丹陷落后他拒绝投降，转入棉兰老加入当地穆斯林摩洛游击队坚持抗日。战后赴美进修返菲，于1945年底出任菲律宾陆军航空队首位菲律宾籍指挥官，主持这支航空兵的战后重建；面对飞机短缺、飞行员过剩的窘境，他一度安排航空队飞行员到民航兼飞以保持技术。1947年5月18日，他所乘C-47运输机“莉莉·玛琳”号在棉兰老拉瑙省的马卡图林山坠毁，机上包括他在内十余人罹难，距他期盼的独立空军成立仅数月。三宝颜的埃德温·安德鲁斯空军基地即以他命名。"
 CBIO_PHI_eustacio_orobia_desc:0 "欧斯塔西奥·D·奥罗维亚，1912年3月29日生，布拉干省普利兰人，菲律宾军官。毕业于马尼拉北方中学后入菲律宾大学工程学院，1933年选为宪兵学院学员。战前在美国路易斯安那州第20追击机大队服役，1939年返菲。1941年12月战争爆发后，他在巴丹战役中率部防守阿格拉洛马角，战斗中被机枪击伤，因英勇获颁银星勋章；巴丹陷落后被俘，获释后加入班乃岛佩拉尔塔游击队，1944年被美军潜艇接应赴澳大利亚。战后他1951年出任菲律宾空军司令，1953至1956年任驻曼谷武官，1962年任菲律宾军事学院院长，1963年退役。"
 PHI_artemio_ricarte_desc:0 "阿特米奥·里卡尔特·加西亚，1866年10月20日—1945年7月31日，生于北伊罗戈省巴塔克，教师出身。菲律宾革命期间加入卡蒂普南，取绰号“蝮蛇”；在德黑罗斯会议上当选大尉将军，任阿基纳多革命军旅长。菲律宾武装部队尊他为“菲律宾陆军之父”，亦是首任参谋长。菲美战争中任马尼拉一带作战指挥，1900年被美军俘获，与马比尼一同流放关岛。他始终拒绝向美国宣誓效忠，后长期流亡日本，在神奈川、东京教授西班牙语。1941年日军侵菲后，他随日军返菲，以换取东条英机“一年内恢复秩序即给予独立”的承诺，参与绥靖。二战末期他拒绝逃往日本，留下话：“在同胞身处苦难的危急关头，我不能躲到日本去，我要留在祖国到最后。”1945年7月因痢疾病逝于山省卡林加一带，终年78岁。"
 PHI_basilio_fernando_desc:0 "巴西利奥·费尔南多，1895年6月14日—1946年1月21日，生于黎刹省圣马特奥，菲律宾军事航空先驱之一。他原在宪兵服役，后入选帕拉纳克的柯蒂斯飞行学校，成为首批三十余名菲律宾飞行员之一。1920年代菲律宾航空勤务创办后，他参与马尼拉至伊洛伊洛、宿务、三宝颜的邮运与客运飞行。1934年菲律宾宪兵航空队成立，他任战术连首任指挥官。1941年任菲律宾陆军航空队指挥官，同年8月由麦克阿瑟主持并入远东空军。巴丹、科雷希多陷落后，他加入抗日地下组织，以买卖木柴为掩护向盟军传递情报。战后作为首批赴美进修的菲律宾飞行员，1946年1月在俄克拉荷马伊尼德机场驾驶B-25训练飞行时坠机身亡。八打雁省利帕的费尔南多空军基地以其命名。"
 PHI_basilio_j_valdez_desc:0 "巴西利奥·何塞·塞贡多·皮卡·瓦尔德斯，1892年7月10日—1970年1月26日，生于马尼拉圣米格尔，医生出身的将领与部长。他毕业于圣托马斯大学医科，一战期间志愿赴法任外科医生。1922年重整菲律宾宪兵医疗系统，1934年升准将、任宪兵司令；1936年任陆军副参谋长，1939年接替保利诺·桑托斯出任参谋长。1941年被奎松任命为国防部长，同时是奎松的私人医生。日军侵菲后，他受麦克阿瑟之托负责奎松一家安全，随流亡政府辗转科雷希多、澳大利亚、美国，陪同奎松至其病逝。奥斯梅尼亚接任后他续任原职，1944年随麦克阿瑟登陆莱特。战后任卫生部长，后回圣托马斯大学任外科教授，1970年逝世。"
 PHI_benigno_ramos_desc:0 "贝尼尼奥·拉莫斯·潘塔莱翁，1892年2月10日生，一说1893年；1945年失踪，笔名“本·鲁本”，诗人、记者出身。曾任参议院译员，是奎松的亲信，1930年因参加教师罢工与奎松决裂。他创办他加禄语报纸《萨克达尔》，将追随者组织成萨克达尔运动，主张即刻独立、土地重分，一度拥众约两万。1935年运动发动起义被镇压，他流亡日本。1938年回国领导“甘纳普”党；日占时期该党并入新菲律宾服务协会，拉莫斯另组“马卡皮里”，为日军招募兵员并牵制劳雷尔权力。1944年12月他与里卡尔特的追随者被日军武装，此时美军已登陆。菲律宾陷落后其下落众说不一，一说随撤退日军在碧瑶死于空难。"
 PHI_benito_n_ebuen_desc:0 "贝尼托·尼卡诺尔·埃布恩，1912年1月11日生于三描礼士省伊巴——与拉蒙·马格赛赛同乡，1957年3月17日卒，菲律宾空军早期军官、飞行员。他毕业于马尼拉阿雷利亚诺中学，1930年入菲律宾大学攻读土木工程，三年级时投考军旅。1941年8月菲律宾陆军航空队并入远东空军，他以中尉身份随部受编参战。战后成为菲律宾空军战斗机飞行员，朝鲜战争期间随菲律宾赴朝远征军任空中侦察飞行员，并在联合国军菲律宾联络组任职；历任要职，官至准将并出任菲律宾空军司令。1957年3月17日，他与总统马格赛赛同乘一架C-47运输机在宿务马农加尔山坠机，与总统及机上其余人员一同罹难。1996年，宿务麦克坦的空军基地更名为“准将贝尼托·N·埃布恩空军基地”以志纪念。"
 PHI_carlos_p_romulo_desc:0 "卡洛斯·佩尼亚·罗慕洛，1899年1月14日—1985年12月15日，菲律宾外交家、军人、记者与作家。他16岁当记者、20岁任报纸主编，1930年代主持《论坛报》《先锋报》《塔里巴报》三报联合报系，也是菲律宾童军共同创办人。1941年他成为首位获普利策通讯奖的非美国人。日军侵菲后，他任麦克阿瑟副官，在科雷希多主持广播“自由之声”；巴丹陷落前撤离，辗转澳大利亚、美国，加入奎松流亡政府任新闻部长，并任驻美常驻专员。战后他是菲律宾在《联合国宪章》上的签字人，1949至1950年出任联合国大会主席，为首位担此职的亚洲人。1948年联大遭苏联代表讥讽为“小国里的小人”，他回敬：“这世上的小大卫们，有责任把真理的石子掷向咆哮的歌利亚。”他历任外交部长多年，1982年获封国家文学艺术家。"
 PHI_clayton_jerome_desc:0 "克莱顿·查尔斯·杰罗姆，1901年9月22日—1978年2月13日，生于美国堪萨斯州哈钦森，美国海军陆战队飞行员将领。1922年毕业于美国海军学院，后在彭萨科拉受飞行训练，并获加州理工学院航空工程硕士。二战期间他历经北所罗门、特雷热里-布干维尔诸役，以及菲律宾吕宋、棉兰老作战，在菲律宾指挥第24、32海军陆战队航空大队，为陆军地面部队提供近距空中支援，获美国陆军荣誉军团勋章。朝鲜战争期间他指挥第1海军陆战队航空联队。他一生四获荣誉军团勋章，退役时晋升中将，1978年因癌症病逝于弗吉尼亚州阿灵顿。"
 PHI_courtney_whitney_desc:0 "考特尼·惠特尼，1897年5月20日—1969年3月21日，生于美国华盛顿特区，律师出身的美国陆军少将。1917年入伍任一战追击机飞行员；1927年获乔治·华盛顿大学法学学位后退役，赴马尼拉执业。1940年重返现役，1943年应麦克阿瑟之请调往西南太平洋战区，协助组织菲律宾抗日游击活动，一度负责菲律宾民政事务，1944年随麦克阿瑟登陆莱特。传记作者威廉·曼彻斯特记述他对菲律宾人态度傲慢，并促使麦克阿瑟将战略情报局挡在西南太平洋之外。战后他任盟军最高司令部政府局局长，参与起草1947年日本宪法；朝鲜战争随麦克阿瑟，1951年麦氏解职后退役。1956年出版麦克阿瑟传记。"
 PHI_cristanto_evangelista_desc:0 "克里桑托·阿巴尼奥·埃万赫利斯塔，1888年11月1日—1942年6月2日，生于布拉干省梅考阿延，菲律宾共产党主要创建者、首任总书记与劳工领袖。家境贫寒的他早年在纳西奥纳利斯塔党内活动，后转向工人运动，长期领导印刷业工会与“菲律宾工人大会”。1930年11月7日他将其团体改组为菲律宾共产党，任首任总书记；翌年因煽动罪被判刑，1932年该党被最高法院取缔。1930年代末获特赦后曾与奎松总统就“社会和平”接触。1942年1月日军攻占马尼拉后，他与佩德罗·阿巴德·桑托斯等一同被捕；日方企图借他向胡克军谈判未果，遂于1942年6月2日将其处决。"
 PHI_deodato_jacinto_desc:0 "虚构架空人物。其姓“哈辛托”源自希腊语“许阿金托斯”，即风信子，也指阿波罗神话中的少年，经拉丁语“希阿辛图斯” 进入西班牙语，天主教传统中亦有圣哈辛托；在菲律宾史中，这一姓氏直指卡蒂普南“卡蒂普南之脑”埃米利奥·哈辛托。其名“德奥达托”出自拉丁语“德奥达图斯”，意为“神所赐、献于神”，同源于西班牙语“迪奥斯达多”、法语“迪厄多内”；在菲律宾史中则对应卡蒂普南首任会长德奥达托·阿雷利亚诺。此名把两位卡蒂普南创始人姓名糅合为一。"
 PHI_edward_king_desc:0 "爱德华·波斯特尔·金，1884年7月4日—1958年8月31日，生于美国佐治亚州亚特兰大，美国陆军少将，炮兵出身。1908年入伍，一战时任炮兵主管首席助理并获陆军杰出服役勋章。1940年被派往菲律宾，成为麦克阿瑟麾下高级地面将领。1942年3月麦克阿瑟撤往澳大利亚后，金接掌巴丹半岛吕宋部队。经数月苦战、粮药耗尽，他独自承担违抗“不得投降”命令的责任，于1942年4月9日率约7.5万美菲联军投降——这是美国军史上规模最大的一次投降，随后即为“巴丹死亡行军”之始。他与部下当了三年半战俘；战后重获自由时被视为英雄。这一天在菲律宾被定为“英勇日”。"
 PHI_edwin_andrews_desc:0 "埃德温·D·安德鲁斯，菲律宾陆军航空队军官、美菲混血飞行员。太平洋战争爆发、巴丹陷落后他拒绝投降，转入棉兰老加入当地穆斯林摩洛游击队坚持抗日。战后赴美进修返菲，于1945年底出任菲律宾陆军航空队首位菲律宾籍指挥官，主持这支航空兵的战后重建；面对飞机短缺、飞行员过剩的窘境，他一度安排航空队飞行员到民航兼飞以保持技术。1947年5月18日，他所乘C-47运输机“莉莉·玛琳”号在棉兰老拉瑙省的马卡图林山坠毁，机上包括他在内十余人罹难，距他期盼的独立空军成立仅数月。三宝颜的埃德温·安德鲁斯空军基地即以他命名。"
 PHI_emilio_aguinaldo_desc:0 "埃米利奥·阿基纳多·法米，1869年3月22日—1964年2月6日，生于甲米地省卡威特，绰号“米翁”。早年任卡威特维霍镇长及当地卡蒂普南领袖。菲律宾革命中他崛起为革命军统帅，1897年德黑罗斯会议取得领导权，期间下令逮捕并处死安德烈斯·博尼法西奥，后又涉及安东尼奥·卢纳之死。1898年6月12日他在卡威特宣布菲律宾独立；1899年就任第一共和国首任总统。他先后领导对西班牙、对美战争，1901年被俘后宣誓效忠美国。1935年参选自治领总统大败于奎松。二战日占期间与日方合作、曾广播劝美军投降；战后一度被捕旋即获释。1964年因心脏病病逝于奎松城，享年94岁。"
 PHI_emma_rotor_desc:0 "艾玛·温松·罗托尔，1913年5月18日—1998年9月6日，生于马尼拉，菲律宾裔美国物理学家、数学家。她在圣托马斯大学获数学学士，1937年获物理学硕士。1941年10月赴美，因战争爆发无法领取奖学金而计划受阻。1944年1月她以战时聘用物理学家身份加入美国国家标准局军械发展处，参与近炸引信研发——这项被美国陆军部称为“仅次于原子弹”的技术。她是项目中少数女性之一，上司评价她“无论职级，都是本项目中最有价值的人之一”。战后她返回菲律宾教数学，曾任圣母升天学院学术院长。"
 PHI_enrique_jurado_desc:0 "恩里克·L·胡拉多，1911年7月15日—1944年10月，生于奎松省卢塞纳，菲律宾陆军近海巡逻队，“蚊子舰队”军官。他是美国海军学院1934届毕业生，曾参加1936年柏林奥运会摔跤比赛。1941年12月4日、珍珠港事件前夕接任该队指挥官。日军侵菲后，他率鱼雷艇与炮艇中队在巴丹保卫战中作战，为孤守部队运送补给；旗舰Q-111“吕宋”号被击伤搁浅后，他下令弃船。脱险后转入班乃岛游击队，后被派往民都洛整合游击力量，卷入两派权斗，1944年10月被对立派系杀害。1942年1月他曾获麦克阿瑟颁授银星勋章。"
 PHI_eustacio_orobia_desc:0 "欧斯塔西奥·D·奥罗维亚，1912年3月29日生，布拉干省普利兰人，菲律宾军官。毕业于马尼拉北方中学后入菲律宾大学工程学院，1933年选为宪兵学院学员。战前在美国路易斯安那州第20追击机大队服役，1939年返菲。1941年12月战争爆发后，他在巴丹战役中率部防守阿格拉洛马角，战斗中被机枪击伤，因英勇获颁银星勋章；巴丹陷落后被俘，获释后加入班乃岛佩拉尔塔游击队，1944年被美军潜艇接应赴澳大利亚。战后他1951年出任菲律宾空军司令，1953至1956年任驻曼谷武官，1962年任菲律宾军事学院院长，1963年退役。"
 PHI_george_grunert_desc:0 "乔治·格鲁纳特，1881年7月21日—1971年1月12日，生于美国宾夕法尼亚州白港，美国陆军骑兵军官，自列兵晋升至中将，军旅生涯47年。1898年以列兵入伍，1901年获骑兵少尉；一战期间赴法任观察员，获陆军杰出服役勋章。1938年接替乔治·马歇尔任第5旅旅长，1939年晋少将。1940年5月至1941年11月他出任菲律宾防区司令，直至麦克阿瑟奉召复出；1941年10月23日被解职调回美国。此后代理指挥美国第1集团军，统率东部防区司令部至1945年7月退役。1944年6月受任主持调查珍珠港事件前陆军应对失当的秘密委员会。1971年1月12日在圣安东尼奥病逝，葬于阿灵顿国家公墓。"
 PHI_godofredo_juliano_desc:0 "戈多弗雷多·胡利亚诺，菲律宾陆军航空队飞行学校1939A班出身，第6追击机中队飞行员。1941年12月10日，他与比利亚莫尔上尉及阿克兰、阿兰萨索、戈萨尔等人驾P-26战机在扎布兰机场、帕西格上空迎击日军轰炸机与零式战斗机编队，该中队当日击落4架敌机；12日又参加巴塘牙斯空战。因作战英勇，12月15日获麦克阿瑟颁授金十字勋章。被俘获释后，他加入盟军情报机构，协助策动一次摧毁内格罗斯上空日机的空袭。战后他成为菲律宾空军建设的重要人物：1946年5月1日以上尉衔出任第1歼击机中队首任中队长，其后驾驶P-51“野马”，1955年参与将菲律宾空军带入喷气时代，是首批飞洛克希德T-33的菲律宾飞行员之一，并成为首位以上校身份从美国空军喷气战斗机学校毕业者；历任第5歼击机联队、第1航空师指挥官。身后安葬于菲律宾英雄墓。"
 PHI_heraclio_alano_desc:0 "埃拉克利奥·希普斯·阿拉诺，1915年10月23日生于薄荷省拉瓦伊，菲律宾军事学院1940届毕业生。他加入近海巡逻队骨干，战争爆发时任鱼雷艇Q-111“吕宋”号执行官。1942年1月17日在科雷希多附近对抗日军俯冲轰炸机作战中获颁银星勋章。巴丹陷落后，其座艇被击沉，他游泳上岸辗转逃至薄荷岛，加入“英希涅罗”游击队，同僚中包括后来的总统卡洛斯·加西亚。战后重返近海巡逻队，1966年6月16日出任菲律宾海军总指挥官，准将衔，1983年逝世。"
 PHI_hermano_jacinto_desc:0 "虚构架空人物。其姓“哈辛托”源自希腊语“许阿金托斯”，经拉丁语进入西班牙语，在菲律宾史中令人联想到卡蒂普南的埃米利奥·哈辛托，他是19世纪末菲律宾革命时期的重要人物，被誉为“卡蒂普南的大脑”。“埃尔马诺”这个名字在西班牙语中意为“兄弟”，也是天主教互助会中对教友或会首的称谓；菲律宾史上最著名者为“埃尔马诺·普莱”，即阿波利纳里奥·德拉克鲁斯，圣何塞互助会创立者、1841年塔亚巴斯宗教起义领袖。"
 PHI_infante_juan_iii_desc:0 "唐胡安·德波旁，1913年6月20日生于西班牙塞戈维亚省拉格兰哈王宫，1993年4月1日卒于潘普洛纳，阿方索十三世第三子、巴塞罗那伯爵，1941至1977年间的西班牙王位觊觎者。1931年第二共和国成立后王室流亡，他转入英国皇家海军深造，曾随舰驻印度孟买，后拒绝放弃西班牙国籍而退出英海军。因两位兄长先后放弃继承权，他成为波旁王朝继承人。西班牙内战初期，他曾化名试图加入国民军，旋即被遣返。1945年他在洛桑发表宣言，抨击佛朗哥政权并要求恢复君主制。1977年，他正式向已即位的儿子胡安·卡洛斯一世放弃王位权利。晚年获西班牙海军荣誉上将、大元帅衔，死后以未即位之尊号“胡安三世”葬入埃斯科里亚尔王室陵。"
 PHI_iwaichi_fujiwara_desc:0 "藤原岩市，1908年3月1日—1986年2月24日，生于日本兵库县多可郡，日本陆军军官，战后曾任陆上自卫队中将。1931年毕业于陆军士官学校第43期，1938年陆军大学校第50期毕业后调入陆军第21军。1939年转入参谋本部情报部门，负责筹划对东南亚工作。1941年9月大本营在其麾下组建“藤原机关”，赴曼谷隶属第15军，联络印度独立运动人士、海外华侨与马来苏丹，争取对日合作。太平洋战争爆发后他随军参与马来亚作战，协助营救吉打苏丹一家；其最大成就是策动约四万名被俘印军投诚，促成“印度国民军”雏形组建。1942年新加坡陷落后F机关任务移交岩畔机关，他转赴苏门答腊联络亚齐独立势力。战后他撰写回忆录《F机关》，自称“东南亚的阿拉伯的劳伦斯”。"
 PHI_jesus_villamor_desc:0 "赫苏斯·安东尼奥·弗洛雷斯·维拉莫尔，1914年11月7日—1971年10月28日，生于阿布拉省邦格德，菲律宾-美国混血飞行员、情报军官，其父曾任菲律宾最高法院陪席大法官。他就读马尼拉德拉萨大学商科，后赴美国兰道夫机场受训，1937年获菲律宾陆军航空队军官任命。1941年12月10日和12日，他率第6追击机中队在扎布兰机场及巴塘牙斯两度迎击日军编队，击落两架敌机，两次获颁杰出服役十字勋章及橡叶簇，是唯一两获该勋章的菲律宾人。部队被击溃后他撤往澳大利亚，1942年12月27日自愿乘潜艇潜回菲律宾，加入盟军情报局，在吕宋、维萨扬、棉兰老建立游击情报网络。战后他曾赴越南任军事顾问，1954年获马格赛赛颁授“英勇勋章”。尼科尔斯空军基地后更名为“赫苏斯·维拉莫尔空军基地”，现为菲律宾空军总部。"
 PHI_john_wilkes_desc:0 "约翰·E·威尔克斯，1895年5月26日—1957年7月20日，生于美国北卡罗来纳州夏洛特，美国海军中将，潜艇部队军官。1912年入读美国海军学院，一战期间在装甲巡洋舰服役。1919年起接受潜艇训练，1939年起任亚洲舰队参谋部资深潜艇军官，后升任潜艇部队司令。1941年12月太平洋战争爆发时，亚洲舰队潜艇部队由他统率；因鱼雷故障、部署失当等原因未能有效阻遏日军登陆。1941年12月29日他随司令部撤往荷属东印度泗水。1942年返美后历任轻巡洋舰“伯明翰”号舰长，参与1943年西西里登陆；后统领两栖部队参与诺曼底、法国南部登陆筹备。战后曾任大西洋舰队潜艇部队司令、驻德海军部队司令，1951年以中将退役，1957年逝世。"
 PHI_jose_abad_santos_desc:0 "何塞·阿瓦德·桑托斯·巴斯科，1886年2月19日—1942年5月，生于邦板牙省圣费尔南多，菲律宾第五任最高法院首席大法官，二战期间代理自治领总统。他获政府公费资助赴美，先后就读圣克拉拉学院、西北大学法学院，并获乔治·华盛顿大学法学硕士。回菲后历任司法部总检察长、副部长，两度出任司法部长，1932年升任陪席大法官。1941年12月奎松任命他为首席大法官，兼理战时撤销的多部职权。奎松流亡前授权他代行总统职权，实际成为代理总统。1942年4月11日他与其子在宿务被日军俘获，拒绝宣誓效忠日本、拒绝配合劝降罗哈斯等要求，称“我不能那样做，那将违背我对美国的效忠誓言”。日方将其押往棉兰老岛马拉邦处以枪决。菲律宾一千比索纸币以其头像纪念。"
 PHI_jose_laurel_desc:0 "何塞·帕西亚诺·劳雷尔·加西亚，1891年3月9日—1959年11月6日，生于八打雁省塔瑙安，菲律宾律师、政治家。1915年获菲律宾大学法学学位，1920年获耶鲁大学法学博士。1925年当选参议员，1936年任最高法院陪席大法官。太平洋战争爆发后他留守马尼拉，在日军占领当局下历任司法专员、内务部长等职；1943年10月14日就任日本扶植的“第二共和国”总统。任内他曾两度遭游击队枪击未死，1944年9月宣布菲律宾与美英处于战争状态。1945年撤往日本，8月17日宣布解散第二共和国。战后被起诉132项通敌罪，1948年获罗哈斯大赦，后当选参议员，1949年竞选总统败于季里诺，1955年主持达成《劳雷尔-兰利协定》。1959年在马尼拉逝世，1960年代起被追认列入历任总统名录。"
 PHI_jose_v_andrada_desc:0 "何塞·V·安德拉达，美国海军学院1931届毕业生，菲律宾近海巡逻队，绰号“蚊子舰队”的创建骨干与首长，被视为菲律宾现代海军的奠基者。1938年他受命筹建这支麦克阿瑟构想中的自治领海军，亲自到菲律宾军事学院面试遴选首批军官，以英制鱼雷艇“Q艇”为核心，总部设于马尼拉港区工程师岛旁的科多码头。1939年2月9日首期学员结业，他将这一天定为近海巡逻队的诞生日。战争期间该队在巴丹、科雷希多沿海冒日军封锁运送补给，他晋少校。1945年菲律宾光复后，他主持以幸存老兵为骨干重建该队；1951年近海巡逻队先后改称菲律宾海上巡逻队、菲律宾海军，他出任首任司令，成为菲律宾海军首位主官。马尼拉的何塞·安德拉达海军基地及“何塞·安德拉达级”巡逻艇均以其名命名。"
 PHI_josefa_llanes_escoda_desc:0 "何塞法·马丹巴·利亚内斯·埃斯科达，1898年9月20日—1945年1月约6日，生于伊罗戈北省丁拉斯，菲律宾教育家、社会工作者、妇女参政运动领袖，被誉为“菲律宾的南丁格尔”。她赴美国哥伦比亚大学攻读社会学，回菲后长期倡导妇女参政权。1940年5月26日，她出任菲律宾女童军首任全国总干事；1941至1944年兼任全国妇女俱乐部联合会主席。日军占领期间，她与丈夫安东尼奥一同秘密从事地下救援工作，向战俘、平民转送物资并协助游击组织传递情报。1944年8月27日夫妇二人被日本宪兵队逮捕，其夫同年遇害。她本人于1945年1月6日最后一次被人看见，推断随后遭处决。菲律宾一千比索纸币曾以其头像纪念。"
 PHI_juan_samulong_desc:0 "胡安·马尔克斯·苏穆隆，1874年12月27日—1942年1月9日，生于黎刹省安蒂波洛，菲律宾律师、记者、政治家，人称“反对派的头脑”。1909至1913年任菲律宾委员会委员，1925年当选参议员。1917年参与合并成立民主党并出任党主席，长期作为反对派领袖，反对美国在菲永久保留军事基地。1934年再度当选参议员。1941年不顾病重之躯挑战奎松竞选总统，选举前病重卧床，于1942年1月9日病逝。临终前他向友人表示，其党绝不会加入日本扶植的傀儡政府。其外曾孙女科拉松·阿基诺、外玄孙贝尼尼奥·阿基诺三世后均曾任菲律宾总统。"
 PHI_leoncio_s_tan_desc:0 "莱昂西奥·S·陈，1910年—1986年，生于马尼拉，菲律宾陆军准将，后为陆军第11任总司令。1928年毕业于菲律宾宪兵学院，1936年转入陆军。1941年任第21步兵师营长，参加巴丹战役，1942年随军投降，经历死亡行军并沦为战俘，获释后加入吕宋游击队。战后重返陆军，1957年晋升准将并出任陆军总司令，推动陆军总部独立建制，1958年退役。1954年曾获马格赛赛任命为菲律宾国家调查局第五任局长。菲律宾陆军博物馆以其名字命名。"
 PHI_lewis_c_beebe_desc:0 "路易斯·查尔斯·比比，1891年12月7日生于美国艾奥瓦州阿什顿，1951年2月17日卒于明尼苏达州法里博，美国陆军准将。他1913年以士兵入伍，1916年自俄勒冈大学毕业获海岸炮兵少尉衔，一战期间随第三师第30步兵团赴法作战，获优异服役十字勋章与紫心勋章；战间期1932年毕业于指挥参谋学校，1939年毕业于陆军战争学院。太平洋战争爆发时他任麦克阿瑟麾下远东陆军供给参谋G4，1942年3月晋准将、留守科雷希多任麦克阿瑟副参谋长；麦克阿瑟撤往澳大利亚后，温赖特接掌美菲部队，比比转任其参谋长。1942年5月6日科雷希多陷落之际，正是由比比通过广播宣读投降令，其声音成为这场投降的“公开之声”。此后他被日军辗转关押于菲律宾、台湾、“满洲”等地战俘营三年余，其间秘密坚持写日记，战后整理出版为《旭日之囚》，获救时因痢疾、脚气病与营养不良而骨瘦如柴、仅余约98磅；他自陈身陷囹圄仍当以乐观与自尊处之。战后继续服役，1950年退役，翌年因脑溢血病逝，葬于阿灵顿国家公墓。"
 PHI_luis_taruc_desc:0 "路易斯·芒加卢斯·塔鲁克，1913年6月21日—2005年5月4日，生于邦板牙省圣米格尔，佃农出身的农民运动与游击战领袖。1938年加入农民联盟。1942年日军侵菲后，他与共产党人一同组建“抗日人民军”，自任总司令，率部在中吕宋开展游击战。战后胡克军与政府关系恶化，他转入地下继续武装反抗，直至升级为“胡克叛乱”。1954年5月他向政府投降，后经长期监禁，1968年获特赦。晚年致力于农民权益倡导，2005年逝世，2017年获追认为民族英雄。"
 PHI_manuel_luis_quezon_desc:0 "曼努埃尔·路易斯·奎松·莫利纳，1878年8月19日—1944年8月1日，生于奥罗拉省巴莱尔，菲律宾自治领首任总统。1916年任参议院议长，长期主持独立立法谈判。1935年当选自治领首任总统，聘麦克阿瑟筹建国防军。1941年12月太平洋战争爆发后随美菲联军撤入巴丹、科雷希多，1942年辗转澳大利亚、美国建立流亡政府。1944年8月1日因肺结核病逝于纽约萨拉纳克莱克，未能见到菲律宾光复。奎松城即以其名命名。"
 PHI_manuel_roxas_desc:0 "曼努埃尔·罗哈斯，1892年1月1日—1948年4月15日，生于西内格罗斯省卡皮兹，菲律宾自治领末任及独立后首任总统。1922年当选国会议长，是纳西奥纳利斯塔党内重要领袖。日军占领期间他在劳雷尔政府任经济计划委员会主席，负责为日军征集粮食物资，同时与麦克阿瑟方面暗中保持联系。战后未被追究通敌指控，1946年当选首任独立总统，并颁布大赦令赦免劳雷尔等官员。任内推动《贝尔贸易法》及美菲军事基地协定。1948年4月15日在克拉克空军基地演讲时猝逝。"
 PHI_napoleon_de_leon_desc:0 "拿破仑·德莱昂，菲律宾陆军航空队军官、飞行员。1941年6月出任努埃瓦埃西哈省蒂尼奥营第8航空基地中队指挥官；巴丹战役期间因1942年1月至2月阿格拉洛马一线作战英勇，晋升上尉。菲律宾陷落后，他加入盟军情报机构，在内格罗斯岛担任空中情报预警官；1944年11月，他提供的情报促成美军轰炸机摧毁一整个日军零式战斗机中队。战后他赴美接受P-38“闪电”等机型训练，归国后驾驶P-51“野马”服役，并成为菲律宾空军首批飞洛克希德T-33喷气教练机的飞行员之一。"
 PHI_nieves_fernandez_desc:0 "涅韦斯·费尔南德斯，约1906年—1997年，生于莱特岛塔克洛班，菲律宾唯一有据可查的女性游击队指挥官，战前为学校教师。1942年日军占领塔克洛班后，她组织起约110人的游击队，人称“费尔南德斯上尉”“无声杀手”，训练部下使用自制猎枪、土制手榴弹及砍刀作战。据统计其部队两年半内击毙逾200名日军，日方悬赏一万比索缉拿她未果。1944年10月美军登陆莱特后其部队与美军会合。1945年5月31日她以中士军衔光荣退役，战后低调生活，1997年去世。"
 PHI_okawachi_denshichi_desc:0 "大川内传七，1886年9月2日—1958年2月13日，生于日本佐贺县盐田町，日本海军中将。毕业于海军兵学校第37期。1936年出任上海日本海军特别陆战队司令官，翌年淞沪事变中率部坚守日租界约三个月。此后历任第一舰队炮术参谋、支那方面舰队参谋长等职。太平洋战争中他先后短暂出任舞鹤镇守府司令长官等职；1943年11月出任海上护卫总司令部实务长官，1944年8月转回预备役。1944年11月他被亲补为南西方面舰队司令长官，名义上统辖菲律宾方面海军，但麾下已无主力舰艇，实际以陆战方式在吕宋岛作战直至日本投降。战后一度被列为乙级战犯，后因证据不足获判无罪，1947年复员。"
 PHI_paulino_santos_desc:0 "保利诺·托雷斯·桑托斯，1890年6月22日—1945年8月29日，生于打拉省卡米灵，菲律宾军人、殖民地行政官员。1908年加入宪兵队，1914年宪兵军官学校毕业第一名。1930年起兼任监狱局局长，建立达沃劳教垦殖场。1936年出任菲律宾陆军首任正式参谋长；1939年出任全国土地安置局局长，率首批移民开拓科罗纳达尔谷地，即今将军市之开端。日军占领棉兰老后他与日方达成协议继续管理垦殖项目，1944年8月奉召回马尼拉任宪兵队总司令。日本战败前夕随军北撤，1945年8月29日病逝，距日本投降仅两周。将军市即以其名命名。"
 PHI_pedro_abad_santos_desc:0 "佩德罗·阿瓦德·桑托斯·巴斯科，1876年1月31日—1945年1月15日，生于邦板牙省圣费尔南多富裕家庭，菲律宾马克思主义政治家，是首席大法官何塞·阿瓦德·桑托斯之兄。1906年通过律师考试后长期为佃农、工人提供免费法律服务。1916至1922年任众议员，1926年退出体制内政治后赴莫斯科列宁学院学习。1932年他创建菲律宾社会党，1938年该党与埃万赫利斯塔的菲共合并，他出任副主席。1941年他曾参选总统后退选。1942年1月他被日军逮捕，后获释返回邦板牙潜入胡克军根据地，继续担任精神导师。1945年1月15日因胃溃疡并发症病逝于胡克军营地。"
 PHI_pedro_p_baguisa_desc:0 "佩德罗·P·巴吉萨，生年不详，2009年5月30日卒，菲律宾共产党一九三〇派总书记。该党由克里桑托·埃万赫利斯塔等人于1930年11月7日创建，二战期间领导抗日人民军“虎克军”，战后在工人与农民运动中一度势盛，后经镇压与路线转折逐渐式微。巴吉萨于1993年11月7日该党第十次代表大会上当选总书记，其后在1998年、2003年、2008年历次代表大会上连任，长期主持党务，党机关刊为《共产党人报》。他任内强调反帝国际团结与传统工农运动路线。2009年5月30日因病逝世，同年党中央政治局推举安东尼奥·E·帕里斯继任总书记。"
 PHI_pelagio_cruz_desc:0 "佩拉希奥·阿尔马萨尔·克鲁斯，1912年6月16日—1986年10月21日，生于布拉干省巴利瓦格，被誉为“菲律宾空军之父”。1935年毕业于菲律宾军事学院，1936年获飞行员资格。太平洋战争爆发后任菲律宾陆军航空队临时团执行官，参加巴丹保卫战，获颁银星勋章；投降后加入布拉干游击队。战后赴美复训，1947至1951年及1953至1956年两度出任菲律宾空军司令。1959年晋升少将、任武装部队副参谋长，1961至1962年出任武装部队总参谋长，晋中将后于1962年退役。1986年在奎松城逝世。"
 PHI_ramon_a_alcaraz_desc:0 "拉蒙·阿瓦坎·阿尔卡拉斯，1915年8月31日—2009年6月25日，生于布拉干省普拉里德尔，菲律宾海军军官、二战英雄。1940年毕业于菲律宾军事学院首届，加入近海巡逻队。1942年1月17日他指挥鱼雷艇Q-112“阿布拉”号击落三架日军俯冲轰炸机，获麦克阿瑟当场颁授银星勋章。被俘获释后受训成为宪兵警官，暗中建立情报网向流亡的美国远东陆军司令部提供情报直至光复。战后1950年赴美研究美国海军陆战队编制，协助组建菲律宾海军陆战队；1964年受命组建海上行动部队打击走私。2009年他促成美国国会通过《菲律宾老兵权益法案》后不久病逝，享年93岁。"
 PHI_ramon_magsaysay_desc:0 "拉蒙·马格赛赛，1907年8月31日—1957年3月17日，生于三描礼士省伊巴，菲律宾第七任总统。太平洋战争爆发后他加入抗日游击队，在西吕宋组织并领导三描礼士省游击队。1946年当选国会议员，1950年出任国防部长，受托全权镇压胡克军叛乱，以“心理战”与怀柔政策辅以军事清剿，促成路易斯·塔鲁克于1954年投降。1953年当选总统，任内推行土地改革、廉政建设，深得民心。1957年3月17日乘坐的C-47运输机在宿务芒昂加尔山失事坠毁，不幸遇难，享年49岁。"
 PHI_richard_marshall_desc:0 "理查德·雅克林·马歇尔，1895年6月16日—1973年8月3日，生于美国弗吉尼亚州，美国陆军少将，与乔治·马歇尔为远亲。1915年毕业于弗吉尼亚军事学院。1929年被派驻菲律宾，曾在科雷希多主持马林塔隧道西端工程，该隧道后成为麦克阿瑟二战指挥所。1939年再赴菲律宾协助筹建国防军，1941年任美国远东陆军副参谋长，晋准将。1942年撤至澳大利亚后续任麦克阿瑟副参谋长，晋少将。1944年11月起任参谋长，1945年9月2日随麦克阿瑟登上“密苏里”号见证日本投降签字。1946年退役后任弗吉尼亚军事学院第七任院长至1952年，后参与对菲经济情况的“贝尔调查团”。"
 PHI_richard_sutherland_desc:0 "理查德·凯伦斯·萨瑟兰，1893年11月27日—1966年6月25日，生于美国马里兰州，美国陆军中将，耶鲁大学毕业。一战时随美国远征军第2师参战。1938年调任驻菲军事顾问处，逐步取代艾森豪威尔成为麦克阿瑟参谋长。1941年美国远东陆军成立后续任参谋长，主持防军动员；巴丹、科雷希多战事期间常赴前线。1942年3月随麦克阿瑟撤离科雷希多赴澳大利亚，此后终战期间一直任麦克阿瑟参谋长，曾代其拍板越过棉兰老直取莱特岛的关键决定，颇受争议。1945年随麦克阿瑟见证密苏里舰受降仪式。战后因绯闻于1946年退役，1966年在沃尔特·里德医院逝世，葬于阿灵顿国家公墓。"
 PHI_russell_volckmann_desc:0 "拉塞尔·威廉·沃克曼，1911年10月23日—1982年6月30日，生于美国艾奥瓦州，美国陆军军官、菲律宾北吕宋游击战领袖。1934年毕业于西点军校，1940年调赴菲律宾。1942年巴丹陷落时他拒绝投降，逃入吕宋北部山区。1943年6月接掌北吕宋游击部队，整编为驻菲律宾美军北吕宋部队，下辖五个步兵团，兵力发展至光复时近2万人，并与麦克阿瑟总部建立无线电联络。1945年9月3日吕宋日军受降仪式上他是与会盟军代表中军衔最低者。战后他协助起草美军非常规战理论手册，与亚伦·班克、温德尔·费尔蒂希并称美国陆军特种部队奠基人，晋准将后退役。"
 PHI_santiago_nuval_desc:0 "圣地亚哥·努瓦尔，菲律宾军事学院1938届毕业生，菲律宾近海巡逻队首批九名创队军官之一。他在安德拉达上尉麾下受训于海事、航海与炮术，任鱼雷艇Q-113“阿古桑”号艇长，参与巴丹保卫战。战后续任海军职务，朝鲜战争期间出任驻东京“菲律宾-联合国司令部联络团”团长，负责统筹菲律宾远征军赴朝作战的后勤联络；此后晋准将衔，后出任菲律宾海军总指挥官。"
 PHI_sergio_osmena_desc:0 "塞尔希奥·奥斯梅尼亚，1878年9月9日—1961年10月19日，生于宿务，菲律宾自治领首任副总统、第四任总统。1907年首届议会当选众议院议长，长期是纳西奥纳利斯塔党创始领导人之一。1935年当选首任副总统。1941年随奎松政府撤入巴丹、科雷希多，1942年辗转澳大利亚、美国建立流亡政府。1944年8月1日奎松病逝后依宪继任总统，成为首位维萨扬地区总统，人称“宿务老人”，同年10月随麦克阿瑟登陆莱特。1946年独立后首次总统选举中败于罗哈斯，晚年退出政坛，1961年逝世。"
 PHI_tan_malaka_desc:0 "陈马六甲，本名易卜拉欣，约1897年6月2日—1949年2月21日，印度尼西亚革命家，印尼共产党主席，共产国际驻东南亚代理人之一。早年赴荷兰求学，1921年出任印尼共产党主席，后遭驱逐辗转菲律宾、中国、泰国从事地下革命活动。1925至1927年间他曾以化名多次往返马尼拉，与当地劳工运动建立联系；1927年在马尼拉一度被捕。此后长期从事秘密活动，1942年返回爪哇。印尼独立战争期间他因主张更激进路线与苏加诺、哈达等主流派系产生分歧，1949年2月21日在东爪哇被印尼军方处决。1963年被追认为“民族英雄”。"
 PHI_thomas_hart_desc:0 "托马斯·查尔斯·哈特，1877年6月12日—1971年7月4日，生于美国密歇根州，美国海军上将。1897年毕业于美国海军学院，美西战争期间参与圣地亚哥围城战。一战期间任大西洋舰队潜艇部队参谋长，获海军杰出服役勋章。1931至1934年任海军学院院长。1939年7月晋升上将并出任美国亚洲舰队总司令，舰队主力驻菲律宾。太平洋战争爆发时他麾下拥有太平洋战区大部分现役潜艇，但因鱼雷故障等原因未能有效阻遏日军推进。1942年1月他将司令部撤往爪哇，兼任美英荷澳联合舰队司令；因与盟军将领关系紧张于2月中旬被撤换，7月退役。1945年退役出任康涅狄格州联邦参议员。1971年逝世，葬于阿灵顿国家公墓。"
 PHI_vicente_lava_desc:0 "维森特·格雷戈里奥·巴尔塔萨·拉瓦，1894年12月24日—1947年9月16日，生于布拉干，菲律宾化学家、共产主义运动领袖。早年留学美国从事研究并接触共产主义思想。1925年起任菲律宾大学教授，专注椰子油脂提炼工艺，1937年获专利，日方曾出价百万比索购买遭其拒绝。1930年代末加入菲共。1942年2月党内领导人被捕后他接任总书记，主持组建胡克军。因“退守防御”策略被判定失误，后被解除总书记职务。战后当选国会议员但被罗哈斯政府拒绝就职。1947年逝世，其弟何塞、赫苏斯·拉瓦其后相继出任菲共总书记。"
 PHI_vicente_p_lim_desc:0 "比森特·波迪科·林，1888年2月24日—1944年12月31日，生于内湖省卡兰巴，菲律宾陆军准将，首位毕业于美国西点军校的菲律宾人，1914届。毕业后历任菲律宾侦察兵部队军官，并赴美深造多所军事院校。1935年转任菲律宾陆军准将，1939年任副参谋长。太平洋战争爆发后任第41步兵师师长，在巴丹阿布凯防线给日军造成重大杀伤。1942年4月巴丹陷落后他被俘，经历死亡行军后获释；随后佯装重病住院，暗中组织资助地下抵抗力量，向盟军提供情报。1944年他在准备潜艇撤离时被日军抓获，以抵抗领袖罪名于比利比德监狱内处决，遗体下落不明。菲律宾一千比索纸币曾以其头像纪念。"
 PHI_victor_h_dizon_desc:0 "维克托·H·迪松，菲律宾陆军航空队军官。太平洋战争爆发时隶属驻努埃瓦埃西哈省卡巴那端马尼基斯机场的第10轰炸机中队，任B-10轰炸机飞行员，并在克拉克机场任温赖特麾下的飞行员兼观察员；后转投维拉莫尔上尉的第6追击机中队，参加巴丹战役。菲律宾陷落后被俘，关押于棉兰老、打拉集中营至1943年获释。1945年2月6日与美军解放部队会合，后赴美接受飞行复训。战后历任第1联络机中队执行官、代理指挥官，后调入菲律宾陆军航空局；官至少将，并出任菲律宾空军司令。"
 PHI_wendell_fertig_desc:0 "温德尔·费尔蒂希，1900年12月16日—1975年3月24日，美国土木工程师、棉兰老岛游击战领袖。1936年携家人移居菲律宾从事工程工作，持美国陆军预备役军官身份。1941年被征召入伍，太平洋战争爆发后赴棉兰老；驻棉兰老美军投降后他拒绝放下武器，自行组织民众建立“驻菲律宾美军部队”。1943年2月麦克阿瑟正式任命他为第10军区指挥官，此后部队通过潜艇获盟军支援，发展至约3万至3.8万人规模，为1945年美军棉兰老登陆战提供关键协助。战后因未获授将官军衔备受争议，后重操工程旧业，1975年逝世。他与拉塞尔·沃克曼、亚伦·班克并称美国陆军特种部队奠基人。"
 PHI_yuitsu_tsuchihashi_desc:0 "土桥勇逸，1891年1月1日生于日本佐贺县，1972年5月31日卒，日本陆军中将。陆军士官学校第24期、陆军大学校第32期毕业，早年在东京外国语学校专修法语，1924至1927年出任驻法武官，通晓法语与欧洲事务。耐人寻味的是，他任陆军参谋本部情报部第二部首脑期间曾反对进军法属印度支那，其部门因而被排除在该行动决策之外。抗战期间他任第21军参谋长、参与进攻广东，一度兼任汪精卫政权军事联络武官。太平洋战争爆发时任第48师团长，该师团率先登陆菲律宾、攻占马尼拉，但未参加巴丹战役，转赴爪哇攻取泗水，其后任帝汶守备司令，与澳、荷突击队交战。1944年11月转任第38军司令官，进驻法属印度支那。1945年3月，因法方庇护被击落的美军飞行员、拒不交出，他认定已无法信任殖民当局，遂向总督德古发出最后通牒、发动“明号作战”，一举解除法军武装、接管政务并自任日占印度支那总督，作战中多处法军守备队被击溃乃至遭屠杀。战败后他被中国国民政府在河内俘押、转交法方，1949年获释，1950年返日。"
 PHI_russell_volckmann_theorist_desc:0 "拉塞尔·威廉·沃克曼，1911年10月23日—1982年6月30日，生于美国艾奥瓦州，美国陆军军官、菲律宾北吕宋游击战领袖。1934年毕业于西点军校，1940年调赴菲律宾。1942年巴丹陷落时他拒绝投降，逃入吕宋北部山区。1943年6月接掌北吕宋游击部队，整编为驻菲律宾美军北吕宋部队，下辖五个步兵团，兵力发展至光复时近2万人，并与麦克阿瑟总部建立无线电联络。1945年9月3日吕宋日军受降仪式上他是与会盟军代表中军衔最低者。战后他协助起草美军非常规战理论手册，与亚伦·班克、温德尔·费尔蒂希并称美国陆军特种部队奠基人，晋准将后退役。"
 PHI_jose_v_andrada_theorist_desc:0 "何塞·V·安德拉达，美国海军学院1931届毕业生，菲律宾近海巡逻队，绰号“蚊子舰队”的创建骨干与首长，被视为菲律宾现代海军的奠基者。1938年他受命筹建这支麦克阿瑟构想中的自治领海军，亲自到菲律宾军事学院面试遴选首批军官，以英制鱼雷艇“Q艇”为核心，总部设于马尼拉港区工程师岛旁的科多码头。1939年2月9日首期学员结业，他将这一天定为近海巡逻队的诞生日。战争期间该队在巴丹、科雷希多沿海冒日军封锁运送补给，他晋少校。1945年菲律宾光复后，他主持以幸存老兵为骨干重建该队；1951年近海巡逻队先后改称菲律宾海上巡逻队、菲律宾海军，他出任首任司令，成为菲律宾海军首位主官。马尼拉的何塞·安德拉达海军基地及“何塞·安德拉达级”巡逻艇均以其名命名。"
