l_simp_chinese:
 CBIO_BEL_hubert_pierlot_desc:0 "于贝尔皮埃洛，1883年12月23日生于比利时卢森堡省屈尼翁，1963年12月13日逝世于于克勒。天主教党政治家，曾任内政大臣农业大臣与外交大臣，1939年出任比利时首相。1940年德国入侵期间，他与坚持向德军投降并留在国内的利奥波德三世发生激烈冲突，认为国王此举违反宪法，遂率内阁前往伦敦组建流亡政府，直至1944年比利时解放。流亡期间他兼任国防大臣，与斯巴克居特德弗莱斯豪威尔组成流亡政府核心的四人小组。1944年回国后领导民族团结政府，因左翼批评及战后重建困局于1945年二月倒台，由社会党人范阿克接任。此后淡出政坛，1946年因王室问题彻底退出。"
 BEL_hubert_pierlot_desc:0 "$CBIO_BEL_hubert_pierlot_desc$"
 CBIO_BEL_paul_van_zeeland_desc:0 "保罗范泽兰，1893年11月11日生于比利时苏瓦尼，1973年9月22日逝世于布鲁塞尔。经济学家出身，曾任鲁汶天主教大学教授及比利时国家银行副行长，1935年出任首相，组建天主教自由党社会党三党联合政府应对经济危机，推行比利时法郎贬值与扩张性财政政策。1936年雷克斯主义运动兴起冲击政局，他继续执政并推动劳工改革，促成每周四十小时工时与带薪假期立法。1937年遭雷克斯党领袖德格雷勒指控收受国家银行款项，调查证实属实后辞去首相职务。此后历任难民事务委员会主席战后比利时人遣返事务高级专员，1949年至1954年多次出任外交大臣，并任北约经济顾问，晚年致力于欧洲经济合作事业。"
 BEL_paul_van_zeeland_desc:0 "$CBIO_BEL_paul_van_zeeland_desc$"
 CBIO_BEL_paul_emile_janson_desc:0 "保罗埃米尔让松，1872年5月30日生于布鲁塞尔，1944年3月3日死于德国布痕瓦尔德集中营。自由党政治家保罗让松之子，社会党人保罗亨利斯巴克之舅父。曾任国防大臣与司法大臣，1937年至1938年出任首相。二战爆发后担任外交大臣及不管部大臣，德国入侵后随内阁撤往法国南部，后拒绝随皮埃洛政府转赴伦敦，滞留法国。1943年德军占领法国南部自由区后他在尼斯被捕，被押送至布痕瓦尔德集中营，次年病逝于狱中。布鲁塞尔伊克塞勒区有街道以他命名。"
 CBIO_BEL_paul_henri_spaak_desc:0 "保罗亨利斯巴克，1899年1月25日生于比利时斯哈尔贝克，1972年7月31日逝世于布鲁塞尔近郊布赖阿累。社会党政治家外交家，三度出任比利时首相并三度担任外交大臣。一战期间曾被德军俘虏，战后从事律师工作，1929年因为一名被控谋刺意大利王储的意大利学生辩护而声名鹊起。1932年投身政坛，1938年成为比利时首位社会党籍首相。二战中随皮埃洛流亡政府任外交大臣，推动比荷卢关税同盟。战后主导欧洲一体化进程，先后担任欧洲委员会顾问大会首任主席与欧洲煤钢共同体大会首任主席，对罗马条约签署起关键作用，1957年至1961年出任北约第二任秘书长，因其欧洲整合贡献被称为欧洲先生。1966年退出政坛。"
 BEL_paul_henri_spaak_desc:0 "$CBIO_BEL_paul_henri_spaak_desc$"
 CBIO_BEL_emile_vanderveld_desc:0 "埃米尔王德威尔得，1866年1月25日生于布鲁塞尔近郊伊克塞勒，1938年12月27日逝世于布鲁塞尔。比利时工人党长期领袖，人称老板。1894年当选众议员，曾任司法大臣外交大臣及公共卫生大臣，1925年至1927年任外交大臣期间参与洛迦诺公约谈判。1900年至1918年任第二国际主席，长期倡导普选权与社会改革，反对利奥波德二世在刚果的殖民统治并撰文批评。1933年成为比利时工人党首任主席。西班牙内战期间他主张积极援助西班牙共和政府，与亨利德曼保罗亨利斯巴克等党内新生代在外交立场上产生分歧。1938年在推动党内通过援助西班牙共和政府决议后不久病逝，是二十世纪上半叶欧洲社会主义运动的重要人物。"
 BEL_emile_vanderveld_desc:0 "$CBIO_BEL_emile_vanderveld_desc$"
 CBIO_BEL_leon_degrelle_desc:0 "莱昂德格雷勒，1906年6月15日生于比利时布永，1994年3月31日病逝于西班牙马拉加。天主教出版界出身，20世纪30年代初创立雷克斯运动，1936年大选中该党赢得约百分之十一选票，进入议会。1937年指控时任首相范泽兰收受国家银行款项引发政坛风波，但雷克斯党势力此后逐渐衰落。德国占领比利时期间他积极投靠纳粹，1941年组建瓦隆军团随德军入侵苏联，1943年该部编入武装党卫队，称瓦隆志愿突击旅。他本人以列兵身份从军，历经切尔卡瑟包围战等战斗，晋升迅速，1944年获骑士铁十字勋章加橡叶饰，同年该部扩编为武装党卫队第28师瓦隆师，由他代理指挥。1945年5月希姆莱授予其武装党卫队旅队长兼少将军衔，但该任命因希姆莱已被解除职务而未获正式承认。战争末期他从德国经丹麦挪威出逃，飞机在西班牙圣塞巴斯蒂安坠毁，此后获佛朗哥政府庇护终生未被引渡。比利时法庭缺席判处其死刑。晚年因否认大屠杀言论屡涉官司，曾言对战败别无遗憾。"
 BEL_leon_degrelle_desc:0 "$CBIO_BEL_leon_degrelle_desc$"
 CBIO_BEL_henri_de_man_desc:0 "亨利德曼，1885年11月17日生于安特卫普，1953年6月20日在瑞士与妻子一同死于车祸，车辆与火车相撞，其子及部分学者认为可能是自杀。比利时工人党重要理论家，一战期间志愿参军支持盟国，战后曾在美国华盛顿大学教授社会学，后赴德国法兰克福大学任教。1933年返回比利时提出计划主义劳工计划，同年出任财政大臣。1938年埃米尔王德威尔得去世后接任比利时工人党主席。德国占领比利时后，他主张对德合作，认为占领是解放旧世界的契机，发表宣言解散工人党并号召社会党人与新秩序合作，一度实际充当德国占领当局默许下的比利时代理首脑，并参与组建亲纳粹的手脑劳动者联盟。1941年逐渐失去德方信任，流亡法国后转赴瑞士，战后被比利时缺席判处二十年监禁及褫夺公权，终身未能回国。"
 BEL_henri_de_man_desc:0 "$CBIO_BEL_henri_de_man_desc$"
 CBIO_BEL_king_leopold_iii_desc:0 "利奥波德三世，1901年11月3日生于布鲁塞尔，1983年9月25日在布鲁塞尔近郊逝世。比利时国王阿尔贝一世之子，1934年其父山难身亡后即位。1935年首任妻子瑞典公主阿斯特丽德在瑞士驾车事故中丧生。二战爆发后他试图维持中立，1940年德国入侵后亲自统率比利时军队，5月28日在未与政府协商情况下向德军投降，此举遭首相皮埃洛为首的流亡政府谴责为违宪并引发终生争议。投降后他被软禁于比利时，1941年秘密迎娶弗兰芒平民莉莲贝尔斯，1944年被德军押往德国后转至奥地利，战后由盟军解救但多年未获准回国，其弟夏尔佛兰德伯爵代为摄政。1950年就其去留举行全民公投，他获约百分之五十八选票支持回国，但引发瓦隆地区激烈骚乱与总罢工，1951年7月16日退位，传位于长子博杜安。晚年投身业余人类学与昆虫学研究并周游世界。"
 BEL_king_leopold_iii_desc:0 "$CBIO_BEL_king_leopold_iii_desc$"
 CBIO_BEL_charles_count_of_flanders_person_desc:0 "夏尔佛兰德伯爵，全名夏尔泰奥多尔亨利安托万梅纳德，1903年10月10日生于布鲁塞尔，1983年6月1日在奥斯坦德逝世。比利时国王阿尔贝一世次子，利奥波德三世之弟。早年在英国接受海军教育，曾就读达特茅斯皇家海军学院，1926年返比后转入比利时皇家军事学院。二战期间以化名杜博克将军隐藏身份以策安全，曾与英国哈拉文顿空军基地有所往来。1944年比利时解放后，鉴于兄长利奥波德三世因战时投降及婚姻问题引发的王室问题尚待调查，他被两院联合任命为摄政，同年9月20日宣誓就职，任内比荷卢经济联盟成立，比利时加入联合国北约与欧洲委员会。1950年随全民公投后利奥波德三世回国复位，摄政结束。此后他退出公共生活，定居奥斯坦德近郊拉弗尔赛德庄园，以佛兰德的夏尔为艺名从事绘画创作并多次举办画展。"
 BEL_charles_count_of_flanders_person_desc:0 "$CBIO_BEL_charles_count_of_flanders_person_desc$"
 CBIO_BEL_raoul_van_overstraeten_desc:0 "拉乌尔范奥弗斯特拉滕，1885年1月29日生于阿特，1977年1月30日逝世于布鲁塞尔。父亲为弗拉芒裔陆军将领，母亲为瓦隆人，他本人精通荷兰语法语英语德语。一战期间参加哈伦战役安特卫普围城战及奔向大海之战，1916年志愿前往比属刚果，随夏尔通贝尔将军参加东非塔波拉战役。1938年至1940年出任国王利奥波德三世的军事顾问，虽非正式总参谋长，却在1940年战事中对国王决策影响甚大，曾以少将侍从武官身份实际左右前线部署，英军将领布鲁克曾抱怨与其交涉如同浪费时间。1940年11月利奥波德三世在贝希特斯加登会见希特勒一事即由他居中安排。德占期间他留居布鲁塞尔未被拘押。1944年比利时解放后因盟军不信任其战时立场，未能在重建的比利时军队中获得要职，两年后退役，此后撰写多部回忆录与著作，记述阿尔贝一世与利奥波德三世二十年间的比利时军事政策。"
 BEL_raoul_van_overstraeten_desc:0 "$CBIO_BEL_raoul_van_overstraeten_desc$"
 CBIO_BEL_oscar_michiels_desc:0 "奥斯卡米希尔斯，全名弗朗索瓦菲德尔奥斯卡米希尔斯，1881年7月24日生于布鲁塞尔，1946年6月14日逝世。11岁入军校，后就读那慕尔军校，1914年一战爆发后随第三师参谋部服役，曾在伊瑟河战役后晋升上尉，后在前线负伤。战后长期在参谋学院任教，曾私人教授时为王储的利奥波德三世战争学课程。1937年晋升少将，1939年出任第七步兵师师长负责动员，1940年2月被利奥波德三世任命为国王参谋长，在整场十八日战役中担任此职。1940年5月27日莱斯河战役最后阶段，他建议国王派代表向德军求和，国王随即采纳并于次日凌晨宣布投降。英国海军上将罗杰凯斯曾称赞他在战役中展现的高昂士气。投降后他向全体高级军官致辞感谢并留任协助处理善后事务。"
 BEL_oscar_michiels_desc:0 "$CBIO_BEL_oscar_michiels_desc$"
 CBIO_BEL_victor_van_strydonck_de_burkel_desc:0 "维克托让克莱芒范斯特里登克，1876年7月16日生于安特卫普，1961年8月4日逝世于埃特尔贝克。骑兵军官出身，1918年任第一近卫骑兵团军官期间指挥西欧最后一次成功的骑兵冲锋，战后因功获封男爵并获得德伯克尔封号。两战间历任骑兵学校校长第一骑兵师师长比利时宪兵总监及骑兵军军长。1940年德国入侵期间指挥第一军事区，比利时投降后他自行在威尔士滕比创建整训营地收容逃至英国的比利时军人，起初士气低落纪律涣散，他多方争取改善条件并促成部队与当地国民自卫队协作，士气随之好转。随比利时流亡政府正式组建自由比利时部队后，他出任总司令，主持第一比利时步兵旅即皮龙旅的组建工作，1941年转任驻英比利时地面部队总监。1944年盟军重返西北欧后担任比利时驻盟军最高统帅部军事代表团团长。"
 BEL_victor_van_strydonck_de_burkel_desc:0 "$CBIO_BEL_victor_van_strydonck_de_burkel_desc$"
 CBIO_BEL_jules_pire_desc:0 "朱尔斯约瑟夫皮尔，1878年3月29日生于列日省阿努特，1953年1月29日逝世。1897年入伍，先后担任士官及军官，曾入读战争学院，一战期间在第三旅参谋部任职，后转入步兵，战时及战后晋升迅速。1936年至1939年出任新组建的阿登猎兵军军长，1939年4月以中将军衔退役，同年9月战争爆发后被召回服役。十八日战役期间他指挥阿登猎兵第十师。比利时沦陷后投身抵抗运动，1941年参与创建具右翼色彩的比利时军团并出任瓦隆地区指挥官，该组织后与其他团体合并成为秘密军。1944年一月因前任领导人被捕及继任者出逃英国，他接任秘密军总指挥，主持诺曼底登陆后该组织的动员及比利时解放期间的行动，此后监督复员工作并退休。"
 BEL_jules_pire_desc:0 "$CBIO_BEL_jules_pire_desc$"
 CBIO_BEL_raoul_daufresne_de_la_chevalerie_desc:0 "拉夫尔多弗雷纳德拉舍瓦莱里，1881年3月17日生于布吕赫，1967年11月25日逝世于于克勒。青年时代是多栖运动员，1903年至1907年效力布吕赫塞尔克勒俱乐部足球队并曾任该队主席，后转投同城对手布吕赫俱乐部，一生共出场甲级联赛九十八场攻入十三球，同时也是曲棍球网球选手及骑术爱好者。1920年安特卫普奥运会上他执教比利时国家足球队，并作为曲棍球选手代表比利时夺得铜牌，同时参加网球项目。一战期间以步兵军官身份服役至上尉军衔。二战爆发后曾被德军俘虏，后成功逃脱抵达英国，晋升中将，1941年至1942年出任自由比利时部队总司令。战后短暂担任驻布拉格武官，此后自军界退役。"
 BEL_raoul_daufresne_de_la_chevalerie_desc:0 "$CBIO_BEL_raoul_daufresne_de_la_chevalerie_desc$"
 CBIO_BEL_maurice_keyaerts_desc:0 "莫里斯科隆布路易凯尔茨，1883年6月5日生，1957年3月3日逝世。比利时陆军中将，两战间长期在骑兵部队服役。1939年9月比利时战争动员期间受命组建K集群，统辖第一骑兵师与第一阿登猎兵师，负责扼守比利时东南部卢森堡省与阿登地区防线。1940年5月10日德军入侵当夜，他下令按既定计划炸毁边境地区桥梁并设置路障阻滞敌军，阿登猎兵各部随即在博当热沙布雷兹等地与德军先头装甲部队展开阻击战，迟滞了德军第一装甲师推进速度。随着战线南翼被突破，他于当日晚下令所部逐步撤往北面奥尔特河后方阵地。1940年战役后期出任军队复员事务负责人。"
 BEL_maurice_keyaerts_desc:0 "$CBIO_BEL_maurice_keyaerts_desc$"
 CBIO_BEL_yvan_gerard_desc:0 "伊万热拉尔，1889年3月16日生于列日，1967年逝世。一战后在军中长期服役，1939年9月晋升中校，任第十二战列团团长，率部参加十八日战役。比利时投降后被俘，1942年夏获释返回国内。此后加入抵抗组织比利时军团，1942年起统领该组织的机动预备队，是该组织内最稳固持久的核心力量之一。1943年4月组织领导人朱尔斯皮尔的前任被捕后，他临危受命接掌整个组织，在与伦敦流亡政府恢复联系及重建被打散的地下网络方面发挥关键作用。1944年三月他将领导权移交给朱尔斯皮尔，该组织此后于当年六月正式改称秘密军。战后他出任军事联络处负责人，负责维护比利时在德经济利益，1946年4月提前退役。1962年出版回忆录记述其指挥经历。"
 BEL_yvan_gerard_desc:0 "$CBIO_BEL_yvan_gerard_desc$"
 CBIO_BEL_lucien_lippert_desc:0 "吕西安利珀特，1913年8月25日生于比利时阿尔隆，1944年2月13日在乌克兰中部诺沃布达村附近阵亡。比利时职业军官出身，毕业于布鲁塞尔军校成绩优异，同时持保王派立场。德国占领比利时后，他是最早加入亲德瓦隆军团的比利时人之一，1942年4月出任该军团指挥官。他治军严谨注重秩序，与负责宣传及政治事务的莱昂德格雷勒分工搭档，德格雷勒本人当时尚未取得正式军事指挥权。1943年瓦隆军团编入武装党卫队改称瓦隆志愿突击旅，他晋升党卫队旅队长级别军衔出任旅长，成为首位执掌党卫队瓦隆部队的比利时军官。1943年底该旅调往乌克兰第聂伯河一线，随党卫队维京师投入切尔卡瑟包围战。1944年2月13日他被苏军狙击手击毙，由莱昂德格雷勒接任指挥。他身后被追授中校军衔及德意志金十字勋章。"
 BEL_lucien_lippert_desc:0 "$CBIO_BEL_lucien_lippert_desc$"
 CBIO_BEL_jean_baptise_piron_desc:0 "让巴蒂斯特皮龙，1896年4月10日生于那慕尔省库万，1974年9月4日在于克勒因心脏病发逝世，恰是他率部解放布鲁塞尔三十周年纪念日当天参加完纪念活动之后。1913年入读布鲁塞尔皇家军事学院，一战爆发后以见习军官身份编入第二战列团，曾在伊瑟前线作战，后因阑尾炎住院转入航空兵担任空中观察员，战争结束时代理上尉。两战间历任第二军军部及第一掷弹兵团职务，后晋升少校。1940年比利时投降后他拒绝接受，经维希法国及西班牙辗转逃至直布罗陀，1942年初抵达苏格兰。1942年底受命重组驻英比利时地面部队，次年一月出任新组建的第一比利时步兵旅旅长，该旅因他而通称皮龙旅，他本人则获得帕夏或狮子的绰号。1944年该旅参加诺曼底战役，随后于9月4日随部队解放布鲁塞尔，后转战荷兰。战后历任比利时驻德占领军司令摄政王及国王的侍从武官等职，1947年晋升中将，1957年退役。"
 BEL_jean_baptise_piron_desc:0 "$CBIO_BEL_jean_baptise_piron_desc$"
 CBIO_BEL_victor_descamps_desc:0 "维克托菲利普约瑟夫德康，1882年生，1953年10月1日以七十一岁高龄逝世。比利时职业军人，长期在阿登猎兵部队服役，两战间该兵种升格为师级建制后，他出任第一阿登猎兵师师长。1939年战争动员后该师隶属凯尔茨将军统辖的K集群，负责扼守比利时东南部边境。1940年5月10日德军入侵当日，所部在博当热沙布雷兹等地依托预设据点顽强抗击德军第一装甲师先头部队，迟滞其推进速度。战线南翼被突破后，他指挥所部逐步撤往北面预设阵地，最终随全军一同投降。战后他出任阿登猎兵战友会全国主席，自1945年该会成立起连任至1953年去世为止，长期致力于维系该部队老兵群体的联系与历史记忆。"
 BEL_victor_descamps_desc:0 "$CBIO_BEL_victor_descamps_desc$"
 CBIO_BEL_lambert_chardome_desc:0 "朗贝尔奥古斯特雷蒙沙尔多姆，1884年生，1960年逝世。比利时陆军少将，1940年比利时投降后被俘，关押于德国普伦茨劳战俘营。1944年5月26日他随另一名军官弗朗茨海勒博一同离营，前往德占区加入莱昂德格雷勒阵营，原定出任其麾下部队指挥官。同年6月25日德方在柏林体育场举行盛大集会，将他与另两名上校朱尔斯弗兰基尼乌尔路易隆一同作为投诚典范公开介绍给公众，并安排他与党卫队要员戈特洛布贝格尔会面。然而返回比利时探亲数日后，他改变主意拒绝就任，重返战俘营。战争结束后，尽管他实际并未真正投入对德合作，仍因此前公开投诚一事被判处十五年监禁。"
 BEL_lambert_chardome_desc:0 "$CBIO_BEL_lambert_chardome_desc$"
 CBIO_BEL_eddy_blondeel_desc:0 "埃迪布隆代尔，1906年1月25日生于根特，2000年5月23日在布鲁塞尔逝世，享年九十四岁。青年时代热衷篮球击剑划船，并长期担任佛兰德地区童子军总监。曾在布鲁塞尔大学修读牙科并赴美国芝加哥西北大学深造，1939年战争爆发时正身处美国，遂主动联系比利时使馆请求返欧参战。1940年前往加拿大魁北克召集当地比利时侨民组建小股部队训练，1942年奉命指挥启程赴英的比利时部队，抵英后全员自愿改编为比利时独立伞兵连，先后在英格兰及苏格兰接受伞降与突击训练。1944年该连编入盟军特别空勤团即第五特别空勤团，由他出任指挥官。1944年8月28日他亲自空降进入阿登森林，率部对撤退中的德军展开多次伏击袭扰。此后所部又执行多项深入法国比利时及荷兰境内的敌后行动，并参与逮捕包括里宾特洛甫在内的多名纳粹要犯。战后他出任比利时第一伞兵团首任团长，1947年退役转任工程师，晚年继续投身童子军事务及多个社会团体工作。"
 BEL_eddy_blondeel_desc:0 "$CBIO_BEL_eddy_blondeel_desc$"
 CBIO_BEL_fernand_verstraete_desc:0 "费尔南韦斯特拉特，1875年7月7日生于安特卫普，1943年5月6日逝世于布鲁塞尔。其父同为比利时军官。1899年入读皇家军事学院，毕业后编入炮兵服役，一战期间两次获军队通令嘉奖，1917年因战场表现获利奥波德勋章骑士级加棕榈饰。战后出任比利时第八炮兵团团长，1931年晋升少将，1934年晋升中将并出任炮兵总监。1939年9月比利时因德国入侵波兰而宣布总动员后，他以丰富资历被重新起用，在利奥波德三世麾下出任第六军军长。1940年5月28日比利时投降后被解除职务，三年后病逝于布鲁塞尔。"
 BEL_fernand_verstraete_desc:0 "$CBIO_BEL_fernand_verstraete_desc$"
 CBIO_BEL_georges_timmermans_desc:0 "乔治蒂默曼，1899年4月26日生于奥斯坦德，1969年3月31日逝世于同地。出身航海世家，十五岁即与胞兄安德烈一同登上商船队训练船前往号服役，贯穿整个一战。1919年以三副身份下船，后转赴安特卫普籍货轮罗马尼亚号任职，1921年起投身国家航运公司展开长期海员生涯，1929年考取远洋船长执照，此后至二战爆发前一直指挥奥斯坦德至多佛航线的多艘邮轮。1940年5月18日他驾驶阿斯特丽德公主号邮轮撤离奥斯坦德，参与敦刻尔克及瑟堡的英国远征军撤退行动，并最后一个离开根西岛。此后他不顾年龄限制加入英国皇家海军志愿预备队，在格林尼治海军学院受训后调任护航驱潜舰艇及康沃花号护卫舰副长，在加勒比海护航反潜任务中表现出色，历时十个月。1943年4月返英后主动申请加入蒙巴顿勋爵麾下联合作战部队。比利时解放后出任驻布鲁塞尔盟军最高统帅部比利时皇家海军联络代表。战后他主导创建比利时海军部队并出任首任准将，兼任奥斯坦德海军军团司令及西佛兰德省军事长官长达九年，1955年七月退役。晚年创办奥斯坦德北海游艇俱乐部并任当地红十字会副会长。"
 BEL_georges_timmermans_desc:0 "$CBIO_BEL_georges_timmermans_desc$"
 CBIO_BEL_willy_coppens_desc:0 "维利奥梅弗朗索瓦让科庞，1892年7月6日生于比利时瓦特马尔布瓦福特，1986年12月21日逝世，享年九十四岁。父亲为印象派画家。1912年应征入伍编入第一掷弹兵团，一战爆发后转入摩托机枪部队，1915年自费赴英国学习飞行并取得飞行员证书，后于法国埃唐普进一步受训，1917年编入第六飞行中队。1918年3月起他专攻攻击德军观测气球的高危任务，凭借近距离射击战术屡建战功，当年四月至十月间共击落三十四个气球及三架敌机，战绩几乎超过其余全部比利时王牌飞行员战果总和，成为一战头号气球杀手，累计确认战果三十七个。他因功受封科庞德豪图尔斯特爵士称号，并获比利时法国英国葡萄牙意大利波兰塞尔维亚多国勋章。两战间历任比利时驻多国空军武官，1928年九月他冒着伤残带伤跳伞至六千米高度创下纪录，保持四年之久。1940年他隐居瑞士从事抵抗相关工作并在当地完婚，1960年代末返回比利时，晚年与另一位比利时王牌飞行员扬奥列斯拉格斯之独生女共同生活直至去世。"
 BEL_willy_coppens_desc:0 "$CBIO_BEL_willy_coppens_desc$"
 CBIO_BEL_remy_van_lierde_desc:0 "雷米范利尔德，1915年8月14日生于比利时上布拉尔村，1990年6月8日逝世于莱西讷。1935年加入比利时陆军航空兵任观察员，1937年转训飞行员，1938年结业后编入第一航空团第三中队。1940年德国入侵期间驾驶老旧的费尔雷福克斯三式双翼机执行侦察任务，同年5月16日被高射炮击落负伤被俘，后经西班牙辗转逃亡，历经监禁及越狱，1941年7月抵达英国并加入皇家空军志愿预备队。他先后在第六零九及第一六四中队服役，驾驶台风与暴风战斗机作战，1943年1月击落首架敌机，同年多次击落德军飞机，当年五月更是首位从台风战斗机上投弹的飞行员。1944年8月出任第一六四中队中队长专职拦截德国V一飞弹，单独击落四十四枚另有九枚与他人共同击落，是战争中击落飞弹数量第二多的飞行员。战后他重返比利时空军，1954年出任国防大臣副总参谋长，1958年以试飞霍克猎人式战斗机成为首批突破音障的比利时飞行员之一，并长期担任前国王利奥波德三世的侍从武官，1968年退役。他本人曾自述1959年在刚果驾驶直升机飞越丛林时目击一条巨蛇。"
 BEL_remy_van_lierde_desc:0 "$CBIO_BEL_remy_van_lierde_desc$"
 CBIO_BEL_jean_offenburg_desc:0 "让亨利玛丽奥芬贝格，1916年7月3日生于布鲁塞尔拉肯，1942年1月22日在英格兰林肯郡训练时因两机相撞坠毁身亡。二战前为比利时陆军航空兵战斗机飞行员，1940年德国入侵期间击落一架德军轰炸机，比利时沦陷后随部队飞机撤往法国夏尔特尔机场协助防空。同年6月20日他与另一名飞行员驾驶两架法国教练机经科西嘉阿尔及利亚辗转至摩洛哥，后经卡萨布兰卡直布罗陀于7月16日抵达英国，随即加入皇家空军。他被昵称为派克，先后在第一四五及第六零九中队服役，1941年获颁优异飞行十字勋章，是首位获此殊荣的在英服役比利时飞行员。1941年至1942年间他持续参与英吉利海峡沿岸空战，累计确认战果至少五架。1942年1月22日一次训练飞行中，他的喷火式战斗机与另一架飞机空中相撞尾翼被削断坠毁身亡，年仅二十五岁。生前所记日记后于1956年以孤独的战士为题出版。布鲁塞尔有广场以他命名以纪念参加不列颠之战的比利时飞行员。"
 BEL_jean_offenburg_desc:0 "$CBIO_BEL_jean_offenburg_desc$"
 CBIO_BEL_raymond_lallemant_desc:0 "雷蒙拉勒芒，1919年8月23日生于比利时布利基，2008年1月30日逝世。绰号骏马。1939年9月加入比利时航空兵，1940年5月10日德军入侵时正在韦弗尔赫姆接受飞行训练，随即与同学经法国摩洛哥辗转，后伪装成波兰人搭船经直布罗陀于1940年7月抵达英国，加入皇家空军。1941年9月编入第六零九中队，驾驶台风战斗机执行对地攻击任务，击落多架福克沃尔夫190战斗机，1943年3月获优异飞行十字勋章。此后曾任发动机测试飞行员，1944年出任第六零九中队中队长，在阿纳姆战役期间对地攻击时座机遭高射炮击中，座舱盖卡死无法跳伞被迫带伤迫降起火战机侥幸生还，因面部及双手烧伤住院数月，获颁第二枚优异飞行十字勋章。此后转任比利时籍第三四九中队中队长直至战争结束。战后留任比利时空军，历任作战主任弗勒吕斯联队司令等职，1972年以上校军衔退役，晚年撰写回忆录记述其飞行生涯。"
 BEL_raymond_lallemant_desc:0 "$CBIO_BEL_raymond_lallemant_desc$"
 CBIO_BEL_mike_donnet_desc:0 "米歇尔吉尔贝利贝马里多内特，人称迈克，1917年4月1日生于伦敦，其比利时籍父母在当地成婚，2013年7月31日逝世于比利时滑铁卢。1938年加入比利时陆军航空兵，1940年德国入侵期间驾驶老式雷纳尔R31型飞机执行侦察任务支援撤退中的比利时军队，同年6月1日比利时投降后被俘，辗转关押于德国及法国战俘营。获释返回布鲁塞尔后，他与战友莱昂迪沃伊策划驾机逃亡，两人历时四个月夜间骑车往返侦查一架藏于德军占领庄园机库内的斯坦普SV四B型双翼教练机，秘密修复并筹备燃料，1941年7月4日深夜驾机起飞飞越英吉利海峡，凭北极星导航于次日降落在英格兰埃塞克斯郊外，成功逃往英国。同年获皇家空军志愿预备队接受，后编入第六十四中队驾驶喷火式战斗机作战，任务超过三百七十五次，确认击落敌机四架，获颁优异飞行十字勋章。1944年出任比利时籍第三五零中队中队长，后升至联队长。战后回国主导比利时空军重建及换装，历任北约中欧盟军防空副协调官第二盟军战术空军参谋长等要职，1975年以中将军衔退役，晚年撰写多部回忆录记述其战时经历。"
 BEL_mike_donnet_desc:0 "$CBIO_BEL_mike_donnet_desc$"
 CBIO_BEL_dieudonne_salve_desc:0 "迪厄多内约瑟夫赛夫，1888年5月23日生于列日附近旺德尔，1970年10月12日逝世，享年八十二岁。中学毕业后即入职比利时国民兵工厂，长期担任传奇枪械设计师约翰勃朗宁的助手。一战期间工厂遭德军占领破坏，他撤往英国在维克斯公司担任机械师，战后重返国民兵工厂。1921年法国要求设计一款十五发弹匣的九毫米半自动手枪，勃朗宁本人对大容量弹匣设计兴趣不高，由赛夫主持研发出双排交错式弹匣，勃朗宁去世后由其完成设计，最终成为著名的大威力手枪。1930年他接替勃朗宁出任国民兵工厂总设计师，此后不断改良勃朗宁自动步枪及勃朗宁M2机枪射速。1940年德国占领比利时后他携图纸辗转逃往英国，在恩菲尔德设计部门继续完善大威力手枪生产图纸并研发新式气动步枪原型，后又赴加拿大协助英格利斯公司生产大威力手枪供应中国抗战所需。战后他主持研发的轻型自动步枪于1951年定型，即日后北约广泛采用的法尔式自动步枪，被誉为自由世界的右臂。1954年退休。"
 BEL_dieudonne_salve_desc:0 "$CBIO_BEL_dieudonne_salve_desc$"
 CBIO_BEL_prudent_nuyten_desc:0 "普吕登特阿尔芒内滕，1874年2月23日生于伊普尔，1954年12月22日逝世于克诺克。工兵军官出身，十岁前父母双亡，十六岁自愿从军，1895年以步骑兵专业第一名成绩毕业于皇家军事学院。1914年一战爆发后，他察觉比利时军队在安特卫普国家堡垒陷落及退守佛兰德斯后已难以持续抵抗德军攻势，遂主动联络当地人士策划淹没韦斯特霍克平原以阻滞德军，该方案经国王阿尔贝一世侍从武官加莱及国王本人批准后于1914年十月底实施，成为一战伊瑟河战线比利时军队得以坚守的关键因素之一。战后他在战争学院任教，1926年出任国防大臣德布罗克维尔内阁办公室主任，1927年兼任第一卡宾枪团团长，与上级加莱将军一同主张比利时应采取以安特卫普根特为核心的本土防御战略而非依附法国。1929年因与新任国防大臣德韦兹在国防开支及战略路线上产生分歧被解除办公室主任职务，此后仍留任军职，历任国王阿尔贝一世及利奥波德三世的侍从武官，1940年五月负责比利时与担保国法国英国间的联络事务。"
 BEL_prudent_nuyten_desc:0 "$CBIO_BEL_prudent_nuyten_desc$"
 CBIO_BEL_albert_deveze_desc:0 "阿尔贝约瑟夫夏尔德韦兹，1881年6月6日生，1959年11月28日逝世。法学博士律师出身，自由党政治家，曾任斯哈尔贝克及伊克塞勒市议员，长期担任布鲁塞尔选区众议员，1927年至1932年出任自由党主席。1920年至1923年首度出任国防大臣，1932年至1936年再度执掌国防部，任内推行领土整体防御方针，鉴于卢森堡省及阿登地区南翼防御空虚，力主组建阿登猎兵这一精锐轻步兵部队，1933年将原驻阿尔隆的第十战列团改编为阿登猎兵团，并沿边境修筑三百余座被称为德韦兹防线的碉堡工事。1936年比利时转向严格中立政策后离任。1939年至1940年任内政大臣。二战后1946年出任经济大臣，1949年至1950年三度出任国防大臣兼副首相。1930年获封国务大臣。"
 BEL_albert_deveze_desc:0 "$CBIO_BEL_albert_deveze_desc$"
 CBIO_BEL_edouard_van_den_burgen_desc:0 "爱德华玛丽范登贝尔亨，1879年生，1963年逝世。比利时职业军人，两战间一度出任比利时陆军总参谋长，任内正值比利时国防政策从依托法国联防转向严格中立及本土防御路线的重大转型期。因与利奥波德三世的军事顾问范奥弗斯特拉滕在军事路线上发生龃龉，他被解除总参谋长职务，改由奥斯卡米希尔斯接任。1940年五月德军入侵时他出任第五军军长，负责安特卫普筑垒阵地一线的防务。"
 BEL_edouard_van_den_burgen_desc:0 "$CBIO_BEL_edouard_van_den_burgen_desc$"
 CBIO_BEL_camille_gutt_desc:0 "卡米耶居特，原姓古滕斯坦，1884年11月14日生于布鲁塞尔，1971年6月7日逝世。父亲原为奥匈帝国籍移民，1886年入籍比利时。居特先后取得法学博士及政治社会科学硕士学位，一战期间为时任大臣特尼斯服务，1920年至1924年任其内阁办公室主任。两战间辗转于比利时总公司及安庇集团等实业界任职。1934年至1935年及1939年至1940年两度出任财政大臣，德国入侵前夕他秘密将比利时国家银行黄金储备转移出境以免落入德军之手。1940年随流亡政府赴伦敦，先后兼任国防经济及财政大臣直至1944年，是皮埃洛斯巴克流亡政府核心四人之一。1944年主持战后货币整顿方案即著名的居特行动，通过收兑旧币冻结存款遏制通胀，稳定了比利时法郎并使经济迅速复苏。1946年出任国际货币基金组织首任总裁直至1951年，并在推动比荷卢关税同盟成立中发挥重要作用。"
 BEL_camille_gutt_desc:0 "$CBIO_BEL_camille_gutt_desc$"
 CBIO_BEL_camille_huysmans_desc:0 "卡米耶胡斯曼，原名卡米尔汉森，1871年5月26日生于比尔曾，1968年2月25日逝世于安特卫普。日耳曼语文学博士出身，早年任教师，后长期从事社会党报刊工作及工会活动，1910年当选众议员，1905年至1922年兼任第二国际书记处书记。1933年当选安特卫普市长，任内以善待流亡当地的犹太移民著称，曾拒绝执行司法部驱逐波兰籍犹太家庭的命令。1946年至1947年出任比利时首相，并两度出任美术教育大臣。晚年高龄仍获选众议院议长，八十岁寿辰时十万民众到场庆贺，足见其声望。"
 BEL_camille_huysmans_desc:0 "$CBIO_BEL_camille_huysmans_desc$"
 CBIO_BEL_julien_lahaut_desc:0 "朱利安维克托拉奥，1884年9月6日生于瑟兰，1950年8月18日遇刺身亡于自家门前。工人家庭出身，十四岁辍学入科克里尔钢铁厂做工，一战期间随比利时远征军赴俄作战。战后加入比利时共产党，1932年起代表列日当选众议员，1945年至1950年出任共产党主席。德占期间他领导地下抵抗，1941年五月发动十万人大罢工，是比利时工人抵抗运动的重要事件，1944年遭德军逮捕并被判处死刑，后又被截获监禁未及押往毛特豪森集中营。战后他持续鼓吹废除君主制，在1950年围绕利奥波德三世回国问题的王室问题危机高潮期间，他被指认为在博杜安亲王宣誓就任摄政仪式上高呼共和国万岁的议员。一周后他在瑟兰自家门前遭两名不明枪手枪杀，凶案始终未正式侦破，2015年一项官方委托的历史研究将凶案指向反共保王翼情报网络，但真凶从未受到审判。"
 BEL_julien_lahaut_desc:0 "$CBIO_BEL_julien_lahaut_desc$"
 CBIO_BEL_emile_de_cartier_de_marchienne_desc:0 "埃米尔埃内斯特德卡蒂埃德马尔谢纳男爵，1871年11月30日生于比利时斯哈尔贝克，1946年5月10日逝世于伦敦。出身贵族世家，1893年投身外交界，历任驻里约热内卢东京北京等地代办及公使，1901年至1902年在北京任职期间曾就义和团事变后的庚子赔款协议进行谈判并签署，后主持新使馆建设。此后历任驻美国驻华驻古巴海地多米尼加等国公使，1927年出任驻英国大使直至二战结束。二战期间他作为比利时驻伦敦大使，是流亡政府与英国政府间的重要联络渠道之一。他两次婚姻均无子嗣，1946年临终前收养远亲路易德卡蒂埃以延续家族马尔谢纳姓氏。曾获普林斯顿哥伦比亚布朗罗切斯特维拉诺瓦及牛津爱丁堡贝尔法斯特等多所大学荣誉博士学位。"
 BEL_emile_de_cartier_de_marchienne_desc:0 "$CBIO_BEL_emile_de_cartier_de_marchienne_desc$"
 CBIO_BEL_edgar_sengier_desc:0 "埃德加爱德华贝尔纳森吉耶，1879年10月9日生于科特赖克，1963年7月26日逝世于法国戛纳。1903年毕业于鲁汶大学矿业工程专业，随后加入比属刚果高级矿业联盟即上加丹加矿业联盟，长期负责该公司位于加丹加省的矿山运营，后升任总经理并兼任比利时总公司董事。公司旗下希恩科洛布韦矿藏铀矿石品位高达百分之六十五，远超同期加拿大矿石。1939年他获英国科学家蒂泽德警示铀矿石一旦落入敌手可能酿成灾难，遂于1940年秘密将约一千二百吨铀矿石转运至美国纽约斯塔滕岛仓库存放。1942年九月美国曼哈顿计划军官尼科尔斯上校前来接洽求购铀矿，森吉耶当即表示矿石已在纽约现货可供，双方随即达成供货协议，为美国原子弹研发提供了关键原料保障。战后他因此贡献于1946年获颁美国功绩勋章，成为首位获此殊荣的非美国平民，另获英国荣誉爵士法国荣誉军团勋章等多国褒奖。1949年卸任公司要职，晚年定居法国。"
 BEL_edgar_sengier_desc:0 "$CBIO_BEL_edgar_sengier_desc$"
 CBIO_BEL_walthere_dewe_desc:0 "瓦尔泰尔约瑟夫夏尔德韦，1880年生于列日，1944年1月14日在布鲁塞尔伊克塞勒街头被德军军官开枪击毙。工程师出身，长期任职于比利时电话电报管理局。一战期间其表兄迪厄多内朗布雷克特创建的情报网络负责人于1916年遭德军处决后，他挺身接手，与好友埃尔曼肖万一同将该网络扩建为著名的白衣夫人情报网，巅峰时期拥有逾千名成员，专注侦察德军铁路运输动向，为英国情报部门提供了大量重要情报，被视为一战欧洲大陆最杰出的情报网络之一。二战爆发后他受英国秘密情报局之邀于1939年重新出山组建比利时观察团，德国占领比利时后转入地下，创建代号克拉伦斯的新情报网络并沿用化名克利夫兰。1943年一月他的妻子病逝，1944年一月他获悉网络成员身份即将暴露，亲自前往通风报信途中于伊克塞勒街头遭遇正在搜捕的德军人员，拒绝停步被当场开枪击毙，德方始终未查明其真实身份。"
 BEL_walthere_dewe_desc:0 "$CBIO_BEL_walthere_dewe_desc$"
 CBIO_BEL_august_borms_desc:0 "奥古斯特博姆斯，1878年4月14日生于圣尼克拉斯，1946年4月12日在布鲁塞尔埃特尔贝克被枪决。日耳曼语文学学位出身，早年曾赴秘鲁任教，后任安特卫普公立中学教师，投身佛兰芒语言权益运动。一战期间比利时被德国占领后他转向对德合作路线，1917年随佛兰芒代表团赴柏林寻求德方支持，主导成立佛兰德委员会，1918年该机构宣布佛兰德独立并推举他为负责人。战后他因通敌被判处死刑，后经罗马教廷斡旋改判无期徒刑，狱中他持续为佛兰芒民族运动代言，1928年在缺席状态下当选安特卫普补选众议员，次年获释后成为两战间佛兰芒民族主义运动的重要象征人物。二战期间德国再度占领比利时后，他出任德占当局设立的一战通敌者赔偿委员会主席，1943年携妻子巡访德国及中欧地区，曾参观位于柏林的强制劳工营及奥斯维辛集中营。战争末期他随撤退德军逃往德国，1945年在柏林被捕押解回比利时受审，此次法庭不予宽贷，判处死刑并执行枪决。"
 BEL_august_borms_desc:0 "$CBIO_BEL_august_borms_desc$"
 CBIO_BEL_achille_van_acker_desc:0 "阿希尔奥诺雷范阿克，1898年4月8日生于布吕赫，1975年7月10日逝世，享年七十七岁。出身工人家庭，排行十二个子女中最小，父亲为编筐匠，十岁辍学随父学艺。一战期间因散光免于兵役，德占期间在封锁区从事黑市营生，并借与比利时士兵接触逐渐投身社会党政治。1926年当选布吕赫市议员，次年二十九岁当选众议员，长年钻研社会保障立法。二战爆发后其党内领导层选择对德合作，他一度隐退，1941年秘密改名安德烈先生重新加入地下社会党及工会运动，辗转全国联络各地分支。1944年比利时解放后他出任新组建的比利时社会党领袖，同年十二月出任劳工大臣期间建立起比利时社会保障制度雏形。1945年至1958年间三度出任首相，主导推行煤炭大会战刺激战后经济复苏，任内建立强制伤残及医疗保险，1955年推行四十五小时工作制，1956年将带薪假期增至十二天，被誉为比利时社会保障之父。1961年至1974年任众议院议长，1958年获封国务大臣。"
 BEL_achille_van_acker_desc:0 "$CBIO_BEL_achille_van_acker_desc$"
 CBIO_BEL_joseph_jacquemotte_desc:0 "约瑟夫雅克莫特，1883年4月22日生于布鲁塞尔，1936年10月11日逝世。士官家庭出身，1899年军校毕业后短暂服役，受兄长影响加入比利时工人党，1910年至1914年领导多次罢工并主导改良派工会内部的革命反对派。1919年出任工人党总委员会办公室成员，是党内左翼组织被剥削者之友的核心人物。1921年二月因主张加入共产国际被比利时工人党开除，同年九月与瓦范奥弗斯特拉滕等人共同创建比利时共产党并当选中央委员，长期主编该党机关报红旗报。1924年起兼任共产国际执行委员会委员及国际赤色济难会国际书记处成员。1925年当选布鲁塞尔市议员及众议员。1931年进入党中央政治局，1932年大罢工期间发挥重要作用推动共产党在当年选举中取得突破。1934年正式出任比利时共产党首任总书记。1936年春该党迎来两战间人气最高峰，他积极推动共产党社会党及各进步力量联合行动，甚至提议共产党整体并入工人党以组建统一工人阵线，同年十月病逝。"
 BEL_joseph_jacquemotte_desc:0 "$CBIO_BEL_joseph_jacquemotte_desc$"
 CBIO_BEL_gilles_wyvekens_desc:0 "虚构架空人物。其名“吉勒”Gilles为法语常见教名，源自拉丁语Aegidius，再上溯希腊语aigídion小山羊或aigís宙斯与雅典娜的山羊皮神盾埃癸斯。中世纪十四救难圣人之一的隐修圣徒圣吉勒令此名传遍西欧，布鲁塞尔的圣吉尔市即以其得名。而在比利时本土，“吉勒”最鲜明的形象是班什狂欢节中的主角“吉勒”，即头戴鸵鸟羽冠、身着填充服饰、向人群抛掷血橙的游行者。其姓“魏文科斯”属佛兰德语父称型姓氏，词尾“-s”表某人之子，“-ken”为小称后缀，词根或与古荷兰语wijf（女子，同英语wife）有关，多见于比利时北部荷语区。此名以法语教名搭配荷语姓氏，正是比利时法荷双语社会中常见的人名组合。"
 BEL_gilles_wyvekens_desc:0 "$CBIO_BEL_gilles_wyvekens_desc$"
 CBIO_BEL_fritz_conrad_desc:0 "全名海因里希弗里德里希，德国海军少将，1883年4月18日生于德国施韦特。中学教师之子，1901年中学毕业后入读德意志帝国海军军校成为海军军官生。此后三十年间辗转于本土及海外多艘舰艇服役，长期专注海洋测量业务，1913至1914年冬于汉堡德国海文台接受天文定位海洋学气象学及罗盘学专业培训。一战期间1917年六月至1918年十月他调任驻比利时的德国海军佛兰德军团工兵营，兼任该军团工兵部队指挥官，负责经营德军在比利时沿海泽布吕赫奥斯坦德等地的海军基地设施。战后历任测量船鬣狗号特里同号及豹号舰长，主持德国本土海域测量工作，1924年至1926年出任柏林海军部航海司海图测量事务顾问，任内支持了气象号科考船执行的德国南大西洋考察活动。此后历任宁芙号巡洋舰舰长及斯维内明德要塞司令，1931年九月以少将军衔退役。服役期间他还于1918年至1924年在基尔大学及柏林夏洛滕堡工业大学旁听天文学大地测量学数学及物理学课程，并获哲学博士学位。1933年起以文职身份重返海军部航海司任顾问，1939年起被重新征召听候海军调遣，1941年正式恢复少将预备役军衔，晚年出任海军最高统帅部航海科学处处长兼海军气象局局长，直至1944年病逝。"
 BEL_fritz_conrad_desc:0 "$CBIO_BEL_fritz_conrad_desc$"
 CBIO_BEL_georges_deffontaine_desc:0 "乔治弗朗索瓦奥古斯特德方丹，1882年5月21日生于布吕赫，1940年9月24日死于德国索劳战俘营医院。一战期间在伊瑟河战役及迪克斯梅德一带作战表现突出，获法国荣誉军团骑士勋位。战后在国际联盟担任军事专家。1938年12月晋升中将，历任阿登猎兵师师长及卢森堡与那慕尔防区暨第四军区司令。1940年五月德军入侵期间，他统率第七军，辖第八步兵师第二阿登猎兵师及那慕尔筑垒阵地，协调指挥直至5月15日，是那慕尔防线的最后指挥官，此后组织向佛兰德斯撤退并参与莱斯河战役。5月28日在温嫩达勒与国王利奥波德三世一同被俘，押往德国的蒂博尔战俘营并出任营内比方最高负责人。他在一战期间罹患的旧疾在狱中急剧恶化，同年九月病逝于索劳医院，临终前留下遗愿希望先安葬于战俘营附近以陪伴难友。战后其家属历经近七十年交涉，遗骸最终于2009年迁葬回国。"
 BEL_georges_deffontaine_desc:0 "$CBIO_BEL_georges_deffontaine_desc$"
 CBIO_BEL_charles_bastin_desc:0 "全名儒勒·奥古斯特·巴斯坦。1889年3月23日生于沙勒罗瓦附近的鲁镇。职业军人出身，一战中在阿农战役负伤被俘，狱中十次尝试越狱，终于1917年秋成功脱逃归队并转赴伊瑟前线参加1918年九十月间的解放攻势。两战间历任骑兵军参谋等职，1928年出任驻斯帕第一枪骑兵团一个骑兵中队长，1934年晋升中校，1936年出任战争学院战术教官，1939年晋升上校并兼任骑兵军参谋长，在此职务上参加十八日战役。1930年代他出版回忆录记述其十次越狱经历，颇为畅销，书中提及狱友包括法国飞行员罗兰加罗斯，戴高乐战时回忆录中也曾提及与他同营为战俘时对其颇为敬重。比利时投降后他拒绝接受现实，经敦刻尔克撤往英国后又转赴法国图谋重整旗鼓，因法国溃败未果遂返回比利时投身地下抵抗，先后协助创建及领导比利时军团。1942年五月组织领导人莱茨被捕后由他接掌指挥，同年十一月伦敦流亡政府正式委托他统一整合全国武装抵抗力量并更名比利时军。1943年四月他在列日近郊罗贝尔蒙山遭德军伏击身负重伤被俘，凭伪造文件同年七月获释但仍受监视，继续秘密联络伦敦并恢复实际指挥。同年十一月第三次被捕，囚于圣吉尔监狱屡次越狱未遂，1944年二月以夜与雾令名义被押送德国，同年十二月一日死于格罗斯罗森集中营。1946年被追授少将军衔并追封男爵。"
 BEL_charles_bastin_desc:0 "$CBIO_BEL_charles_bastin_desc$"
 CBIO_BEL_rene_lagrou_desc:0 "勒内拉格鲁，1904年4月15日生于比利时布兰肯贝赫，1969年4月1日病逝于西班牙巴塞罗那。安特卫普执业律师出身，早年即为佛兰芒民族联盟成员，曾创办自办刊物罗兰，该刊随希特勒上台日趋反犹。德国占领比利时后，他与瓦德赫尔曼斯于1940年共同创建佛兰芒党卫队即通用党卫队佛兰德分支，出任首任领导人直至1941年五月卸任。此后投身武装党卫队东线作战，战争末期一度被误传阵亡，实则在法国被盟军俘获后成功逃往西班牙。1946年五月比利时政府将其列入向西班牙提交的三人通缉黑名单之一，与莱昂德格雷勒皮埃尔达耶并列。他因叛国罪被缺席判处死刑，此后化名雷纳尔多范格罗德辗转移居阿根廷，晚年因癌症病逝于巴塞罗那。"
 BEL_rene_lagrou_desc:0 "$CBIO_BEL_rene_lagrou_desc$"
 CBIO_BEL_fritz_lob_desc:0 "弗里茨即弗里德里希勒布，德国空军少将，1895年9月14日生于柏林，1940年6月22日在布鲁塞尔近郊埃弗雷机场附近因容克斯运输机空中相撞事故遇难。一战期间以工兵军官身份服役，两战间转入德国空军，历任国防航空部技术局采购处处长第一五五轰炸机联队大队长及安斯巴赫空军基地司令等职，后调回航空部先后主管四年计划原材料及外汇物资局与德国原料物资局，1938年晋升少将。1940年5月20日即德军入侵比利时后十日，他被任命为比利时暨法国北部空军防区司令，负责统辖该地区德国空军地面及占领事务。到任月余后因飞机在布鲁塞尔埃弗雷机场降落时与另一架飞机相撞而身亡，与妻子合葬于柏林达勒姆森林公墓。"
 BEL_fritz_lob_desc:0 "$CBIO_BEL_fritz_lob_desc$"
 CBIO_BEL_jules_iserentant_desc:0 "全名埃内斯特·费利克斯·伊塞朗唐，1888年6月14日生于安特卫普。他1913年考取军用飞行员执照，编号第67号，属于1914年大战爆发前便已持照的比利时航空先驱一代。此后长期在军事航空服役，逐步晋升为航空少将，两次大战之间出任比利时军事航空司令，其任内正值比利时自1936年重回武装中立、着力扩充与更新空中力量的年代。1937年，他在比利时航空俱乐部支持下，与飞行家扬·奥利斯拉赫斯、德·拉米讷骑士等一批一战前后持照的先驱共同发起成立比利时老飞行员协会，出任首任主席并主持首届理事会，奥利斯拉赫斯与德·拉米讷任副主席；1939年，成立仅两年的该会便获国王利奥波德三世授予最高庇护，相当于以王室名义为其背书。1978年9月在布鲁塞尔安德莱赫特去世，享年90岁。"
 BEL_jules_iserentant_desc:0 "$CBIO_BEL_jules_iserentant_desc$"
 CBIO_BEL_gaston_eyskens_desc:0 "加斯顿弗朗索瓦马里子爵伊斯更斯，1905年4月1日生于利尔，1988年1月3日逝世于鲁汶。经济学家出身，1931年起任鲁汶天主教大学教授，1939年当选众议员。1945年及1947年至1949年出任财政大臣，1949年首度出任首相，任内经历利奥波德三世回国引发的王室问题危机，1950年六月因此倒台。1958年二度组阁，同年推动通过学校协议解决公立与天主教学校资助争端，任内还主导比属刚果独立进程，1960年刚果宣布独立后引发经济动荡及大罢工，其推行的紧缩法案于1961年导致政府垮台。1965年至1966年再任财政大臣，1968年三度出任首相直至1973年，任内推动鲁汶大学分拆为荷语法语两校并启动比利时国家结构联邦化改革的宪政修订。卸任后出任布鲁塞尔信贷银行董事长，1963年获封国务大臣。"
 BEL_gaston_eyskens_desc:0 "$CBIO_BEL_gaston_eyskens_desc$"
 CBIO_BEL_victor_strydonck_burkel_desc:0 "维克托让克莱芒范斯特里登克，1876年7月16日生于安特卫普，1961年8月4日逝世于埃特尔贝克。骑兵军官出身，1918年任第一近卫骑兵团军官期间指挥西欧最后一次成功的骑兵冲锋，战后因功获封男爵并获得德伯克尔封号。两战间历任骑兵学校校长第一骑兵师师长比利时宪兵总监及骑兵军军长。1940年德国入侵期间指挥第一军事区，比利时投降后他自行在威尔士滕比创建整训营地收容逃至英国的比利时军人，起初士气低落纪律涣散，他多方争取改善条件并促成部队与当地国民自卫队协作，士气随之好转。随比利时流亡政府正式组建自由比利时部队后，他出任总司令，主持第一比利时步兵旅即皮龙旅的组建工作，1941年转任驻英比利时地面部队总监。1944年盟军重返西北欧后担任比利时驻盟军最高统帅部军事代表团团长。"
 BEL_victor_strydonck_burkel_desc:0 "$CBIO_BEL_victor_strydonck_burkel_desc$"
 CBIO_BEL_georges_vereecken_desc:0 "乔治费雷肯，1896年生于根特，1978年逝世于布鲁塞尔。职业为出租车司机。1921年比利时共产党建党时即为成员，1925年起进入党中央委员会。1928年因加入托洛茨基派国际左翼反对派而遭开除，此后长期活跃于比利时托派运动内部各派系，1930年比利时反对派发生分裂时他站在沙勒罗瓦一派一方。1934年他强烈反对托派提出的所谓法国转向即打入策略，1935年拒绝跟随比利时支部多数派并入比利时工人党的决定。1935年至1937年领导斯巴达克斯派，后又重新加入革命社会党并于1937年至1938年出任该党书记，1938年再度与官方托派决裂，此后主编反潮流杂志直至1945年。晚年参与革命马克思主义倾向组织活动直至1978年去世，是两战间比利时托洛茨基运动史上多次分裂事件的亲历者与关键人物。"
 BEL_georges_vereecken_desc:0 "$CBIO_BEL_georges_vereecken_desc$"
 CBIO_BEL_mcl_keyaerts_desc:0 "莫里斯科隆布路易凯尔茨，1883年6月5日生，1957年3月3日逝世。比利时陆军中将，两战间长期在骑兵部队服役。1939年9月比利时战争动员期间受命组建K集群，统辖第一骑兵师与第一阿登猎兵师，负责扼守比利时东南部卢森堡省与阿登地区防线。1940年5月10日德军入侵当夜，他下令按既定计划炸毁边境地区桥梁并设置路障阻滞敌军，阿登猎兵各部随即在博当热沙布雷兹等地与德军先头装甲部队展开阻击战，迟滞了德军第一装甲师推进速度。随着战线南翼被突破，他于当日晚下令所部逐步撤往北面奥尔特河后方阵地。1940年战役后期出任军队复员事务负责人。"
 BEL_mcl_keyaerts_desc:0 "$CBIO_BEL_mcl_keyaerts_desc$"
 CBIO_BEL_nicolas_florine_desc:0 "尼古拉弗洛林，原名尼古拉阿纳托利耶维奇弗洛林，1891年7月19日生于俄罗斯帝国巴统，1972年1月21日逝世于布鲁塞尔。青年时代在圣彼得堡求学，1914年毕业于圣彼得堡交通工程师学院航空机械专业，曾任著名力学家铁摩辛柯的助手，并结识后来赴美成名的伊戈尔西科斯基。一战期间服役，1917年十月革命后避居德国，1920年代定居比利时，1934年获比利时议会特别授予的大规模入籍资格。他长期任职于比利时航空技术部门，1926年主持建立位于圣热讷西罗德的空气动力学研究中心即今冯卡门流体动力学研究所前身，并参与比利时首座风洞的建设。他于1926年获得纵列双旋翼直升机专利，1927年获比利时航空公司及国家科学研究基金资助研发直升机原型机，1929年首架样机试飞。1933年弗洛林二号在罗伯特科兰驾驶下创下九分五十八秒的非官方留空时长纪录。他还曾计划四旋翼方案弗洛林四号但因二战及经费问题未能实现。1956年退休，在国际直升机史上被公认为纵列双旋翼构型的先驱。"
 BEL_nicolas_florine_desc:0 "$CBIO_BEL_nicolas_florine_desc$"
 CBIO_BEL_karel_bossart_desc:0 "卡雷尔扬博萨尔特，1904年2月9日生于安特卫普，1975年8月3日逝世于美国圣迭戈。1924年毕业于布鲁塞尔自由大学矿业工程专业，后获比利时美国教育基金会奖学金赴麻省理工学院攻读航空工程，自此长期留美工作，历任多家飞机制造公司职务。1945年出任康维尔公司结构部主任，次年主持MX774项目研究德国V二火箭技术，提出射程达八千公里导弹方案，采用气球式承压油箱蒙皮结构等创新设计。1947年因空军兴趣转淡该项目一度中止，1951年冷战升级后他重启研究并将新导弹命名为阿特拉斯，1955年出任该项目总工程师。1957年12月阿特拉斯首次试射成功，1958年获美国空军杰出文职人员奖。阿特拉斯后成为美国首款洲际弹道导弹并长期作为发射载具沿用，搭载了美国首颗通信卫星首次载人绕地飞行等多个历史性任务。他晚年因大部分工作涉密而鲜为人知，1965年入选国际航空航天名人堂，1990年入选国际太空名人堂。"
 BEL_karel_bossart_desc:0 "$CBIO_BEL_karel_bossart_desc$"
 CBIO_BEL_georges_lemaitre_desc:0 "乔治亨利约瑟夫爱德华勒梅特，1894年7月17日生于沙勒罗瓦，1966年6月20日逝世于鲁汶。天主教神父物理学家，一战期间以炮兵军官身份服役并获战争十字勋章，战后在鲁汶天主教大学攻读工程数学物理及哲学，1923年晋铎成为梅赫伦总教区神父。此后赴英国剑桥大学及美国麻省理工学院深造，结识爱丁顿哈勃等天文学家。1925年返回鲁汶任教，1927年发表论文提出宇宙自原始原子膨胀而来的假说，即后世所称大爆炸理论雏形，并独立于弗里德曼推导出宇宙膨胀速度与距离成正比的关系，该关系后被称为哈勃勒梅特定律。他预言了宇宙微波背景辐射的存在，1965年彭齐亚斯及威尔逊发现该辐射印证其理论，此时他已重病住院，由助手告知这一消息。1936年当选宗座科学院创始院士，1960年出任该院院长直至去世。他始终主张科学与信仰各自独立互不干涉，并曾婉拒教皇庇护十二世将大爆炸理论与创世论直接挂钩的说法。"
 BEL_georges_lemaitre_desc:0 "$CBIO_BEL_georges_lemaitre_desc$"
 CBIO_BEL_alfred_renard_desc:0 "阿尔弗雷德雷纳德，1895年4月21日生于安德莱赫特，1988年6月20日逝世。童年受其父制作风筝启发对航空产生兴趣，1912年为夺得法国标致公司悬赏的人力飞行奖金，与胞兄乔治合作制造一架靠脚踏及翼面滑翔的装置，虽试验失败但显示其早年志趣。一战期间兄弟二人在家中以脚踏车床为布鲁塞尔某工坊加工零件并自制发动机。战后服兵役期间任地图测绘员并设计军用机场，结识后来出任比利时军用航空技术处处长的埃米尔阿拉尔，二人合作在圣热讷西罗德建造风洞并设计全金属单翼机即阿卡佐T二型，还促成让斯坦普自建教练机厂之梦想。1925年他自立门户创办雷纳德飞机发动机公司，主营百至二百四十马力航空发动机，部分产品供应比利时军方并出口波兰美国等地，其二百四十马力发动机还曾为尼古拉弗洛林的第二代直升机提供动力。1928年胞兄乔治加入后公司更名雷纳德航空建造公司并转向整机设计，推出R三十一及R三十六等机型。1940年预见德军即将入侵，他计划将公司资产转移至法国但未能及时完成，战争期间他淡出公众视野，1945年重新露面出任比利时国铁技术顾问，研究轻合金轨道车厢。"
 BEL_alfred_renard_desc:0 "$CBIO_BEL_alfred_renard_desc$"
 CBIO_BEL_auguste_piccard_desc:0 "奥古斯特安托万皮卡尔，1884年1月28日生于瑞士巴塞尔，1962年3月24日因心脏病逝世于瑞士洛桑，享年七十八岁。与孪生兄弟让费利克斯皮卡尔一同在苏黎世联邦理工学院求学，主修物理，毕业后留校任教。1922年受聘出任比利时布鲁塞尔自由大学物理学教授，长期在比利时工作生活。为验证爱因斯坦相对论并研究宇宙射线，他设计出密封增压铝制吊舱，1931年5月27日与基普费尔搭乘氢气球从德国奥格斯堡升空，创下一万五千七百八十一米高度纪录，成为首批进入平流层的人类，1932年他又刷新纪录达一万七千余米。此后他将气球吊舱原理逆用于深海探测，设计出被称为深海潜水器的耐压装置，二战中断了相关研发，战后于1948年完成首台样机并展开多次无人深潜试验。1953年他与儿子雅克搭乘第二代深海潜水器下潜至三千一百五十米深度。他还是丁丁历险记中卡尔库鲁斯教授的原型，该形象由比利时漫画家埃尔热据其外貌塑造。晚年他仍笔耕不辍，直至去世前仍在筹划新型潜水器方案。"
 BEL_auguste_piccard_desc:0 "$CBIO_BEL_auguste_piccard_desc$"
 CBIO_BEL_jozef_raskin_desc:0 "约瑟夫玛丽亚拉斯金，1892年6月21日生于比利时斯特沃特，1943年10月18日在德国多特蒙德监狱被处决。青年时代为画家及绘图员，一战期间服役，战后加入圣母圣心会即司各特会，1920年二月晋铎后被派往中国内蒙古传教直至1934年，在西湾子代牧区教授自然科学课程，通晓中文听说读写。1934年二月返回比利时后任修会文字工作者。二战爆发后他被征召入伍担任随军神父，曾为国王利奥波德三世主持弥撒并出任其私人顾问。比利时战败后他以代号利奥波德复仇二百投身抵抗组织，凭借无线电知识窃听德军各部通讯，并绘制德军在比利时海岸的部署图，通过英国秘密情报部门信鸽情报组投送情报，所写报告细致详尽，单份情报有时长达五千字并附敌军阵地草图。1942年五月一日他被一名乔装乞丐的告密者出卖，遭盖世太保逮捕。狱中他被难友描述为博学高尚雄辩，每晚讲述在中国的经历并为狱友聆听忏悔。1943年八月三十一日受审定罪，他在庭上唯一的辩词是凭良心及在上帝面前我已尽我职责。次日被判处死刑，同年十月十八日在多特蒙德监狱被处以断头台极刑，遗体归葬斯特沃特，阿尔斯霍特建有纪念雕像。"
 BEL_jozef_raskin_desc:0 "$CBIO_BEL_jozef_raskin_desc$"
